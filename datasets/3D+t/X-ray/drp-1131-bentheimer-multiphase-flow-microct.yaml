notes: 'Source: Digital Rocks Portal (now served from digitalporousmedia.org; the portal page returned
  403 and the project URL redirects to a tombstone page), so landing_url is the public TACC archive directory
  and the record metadata JSON, both fetched. No license or terms appear in the metadata JSON or archive
  listing, hence license unknown. No publication is listed in the record. Labels are produced by a U-ResNet
  deep-learning workflow (automatic), with quality checks against slow scans (confusion matrices, mIoU)
  per the description. The 126 GB zip holds 16 tar.gz files (8 raw + 8 segmented) plus preview TIFFs;
  tar contents were not listed (peek_archive supports zip only), so tiff format is taken from the metadata
  field imageFormat. Voxel size is isotropic 3.6 um from the metadata (voxelX/Y/Z). size_bytes is the
  zip size. enricher: size_bytes exact from zip listing (was rounded); n_items 8 scan series; license
  field absent from metadata JSON (other DRP projects carry one), still unknown.'
