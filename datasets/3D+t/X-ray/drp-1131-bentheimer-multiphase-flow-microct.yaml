  notes: 'Volumes sit as TIFFs inside .tar.gz members of the zip, which listing/probe tools can''t open;
    a short script streamed the first 40 MB (raw) and 12 MB (segmented) of the Water-wet Drainage1 archives
    and read the tar entries and TIFF headers. Value ranges are from that partial read: raw slice 0 of
    scan 0 (0-255, 178 values), labels slices 0-39 of scan 0 (values 0, 2, 3). Headers carry no calibration
    (XResolution 1/1, no unit); voxel size 3.6 um is from the metadata JSON (voxelX/Y/Z). No small sample
    unit: the smallest raw+label pair needs a whole raw.tar.gz (10.3 GB) plus segmented.tar.gz; only the
    2D preview TIFF pair is small. TensorSwitch reads zip members but not tar.gz, so conversion needs
    the tars unpacked first. Download host web.corral.tacc.utexas.edu is not on TensorSwitch''s allowlist.
    Number of time steps per series ~50 (metadata); the raw tar lists 2D/0..49 directories.'
