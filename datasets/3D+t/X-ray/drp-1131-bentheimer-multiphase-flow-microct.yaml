title: Time-Resolved 3D Synchrotron Micro-CT Fast-Scan Dataset of Bentheimer Sandstone During Dynamic Multiphase Flow
short_name: Bentheimer sandstone multiphase flow (4D micro-CT)
description: 'Time-resolved synchrotron micro-CT volumes (3.6 um voxels, typically 1536x1536x146) of water-wet and mixed-wet Bentheimer sandstone during repeated drainage and imbibition cycles at the Australian Synchrotron (ANSTO) micro-CT beamline, with registered grayscale volumes and deep-learning-assisted 4-class segmentations (external, decane, grain, brine). 8 scan series of about 50 time steps each.'
