notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Archive (1.6 GB zip, 11 members,
  listed with peek_archive): s5_37_dry_reg_4.4um_16bu_893x897x570.raw (913 MB), s5_37_dry_seg_4.4um_16bu_893x897x566.raw
  (907 MB; note 566 vs 570 slices, so the label grid is not identical to the dry scan) and s5_37_pib_00-39.zip
  (658 MB; the 40 imbibition scans per the metadata; this nested zip could not be listed remotely, so
  its inner file formats and the exact label values are unconfirmed). Dry-scan segmentation: non-local-means
  filtering followed by watershed segmentation (metadata), hence annotation source automatic. Papers are
  not open access (only Crossref read). Headerless .raw is not in the format enum (other). The portal
  page redirects to a tombstone; the TACC archive directory and metadata JSON were used.'
