short_name: AlGe10 solidification dendrites (X-ray tomography)
description: Time-resolved synchrotron X-ray tomograms (TOMCAT, SLS; one tomogram per second) of dendrite
  and pore evolution during AlGe10 alloy solidification at five cooling rates (60 tomograms each), with
  300 segmented tomograms (background, interdendritic space, pores, dendrites) produced by an nnU-Net
  whose weights are included.
