notes: 'Zenodo API record and zip listings read (time_series_1Kps.zip: 60 raw 156 MB TIFFs + JSON; segmented_time_series.zip:
  300 label TIFFs + 303 JSONs; model zip: nnU-Net 3d_fullres checkpoint). Segmentations are model predictions
  (description: segmented using the provided nnU-Net weights), not manual labels, hence source automatic;
  no paper linked. Alloy solidification, not biological. enricher: voxel size 2750 nm (was null): the
  per-tomogram JSON spacing is [2.75, 2.75, 2.75] without unit; the same authors'' TOMCAT tomoscopy paper
  (doi 10.1002/adma.202104659) states ''effective pixel size was 2.75 um'' for this setup, with AlGe10
  tomograms of 528 x 280 px and 11,801 tomograms, matching these files. All five rate zips listed: 60
  tomograms each.'
