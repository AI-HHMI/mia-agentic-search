id: zenodo-5564782-microct-4d-corrosion-annotations
title: Manual 4D annotations of a micro X-ray CT time series of salt-water corrosion of a magnesium-containing aluminium pin
short_name: Corrosion micro-CT time series labels (X-ray)
description: >-
  Manual semantic annotations of 6 slices (heights 740-742 and 747-749) through each of the 21 tomograms of a
  time-resolved synchrotron micro X-ray CT series (Diamond Light Source I13-2) showing a droplet of salt water
  corroding a 500 um aluminium pin with magnesium deposits. Four classes: air, base material (aluminium), magnesium
  deposits and gas pockets. The raw undersampled reconstructions are a separate Zenodo record (4293394).
