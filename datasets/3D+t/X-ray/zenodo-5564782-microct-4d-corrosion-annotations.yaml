notes: >-
  Materials-science X-ray CT, not biological. The record holds only the labels; the images they refer to are the
  CGLS reconstructions in Zenodo 4293394 (CC-BY-4.0, 21 tomograms of 91 projections each, one 192.7 GB 7z archive;
  paper: cropped 1710x1310x1310 voxels). Annotations are sparse: 6 slices per time step (6 x 21 = 126 slice images),
  made with SuRVoS and HMM-T refinement, and the paper uses them only as test ground truth. Voxel size not stated
  on either Zenodo record, in the paper, in the CNN paper (Mach. Vis. Appl. 2021) or the code README.
  enricher: HDF5 opened (dataset data, 1710x1310x1310x21 float32); n_items 21 = one label volume per time step
  (was null); annotations_verified true (class IDs seen in slices 740-742, 747-749).
