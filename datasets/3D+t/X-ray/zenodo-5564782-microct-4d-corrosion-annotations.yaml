notes: >-
  Materials-science X-ray CT, not biological. The record holds only the labels; the images they refer to are the
  CGLS reconstructions in Zenodo 4293394 (CC-BY-4.0, 21 tomograms of 91 projections each, one 192.7 GB 7z archive;
  paper: cropped 1710x1310x1310 voxels). Annotations are sparse: 6 slices per time step (6 x 21 = 126 slice images),
  made with SuRVoS and HMM-T refinement, and the paper uses them only as test ground truth. The HDF5 contents were
  not opened, so shape and dtype are unverified. Voxel size not stated on either Zenodo record or in the paper
  text read (Methods give voxel dimensions only). The 3D training data of the CNN used in the paper is listed as
  available online in the paper but was not followed here. n_items left null.
