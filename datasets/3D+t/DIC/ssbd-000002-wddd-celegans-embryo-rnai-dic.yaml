notes: 'SSBD project 2-Kyoda-WormEmbryoRNAi (ssbd-repos-000002); repository page states CC BY-SA 4.0 (the 2013 paper is CC
  BY-NC, an article licence). Counts from the SSBD page and dataset.json: 187 image datasets (1.5 TB), 186 quantitative datasets
  (136 GB); the 2013 paper reports 50 wild-type and 136 RNAi sets, the project was updated in 2020. size_bytes = raw_image
  (33,660 files, 1,599,634,244,340 B) + raw_bdml (372 files, 146,188,757,989 B), excluding the source/ and bdml/ zip bundles
  that repeat the data (listing total 3.42 TB). Voxel size 0.105 um XY, 0.5 um Z and 40 s step from the SSBD page; paper:
  66 focal planes, 600x600 px. Raw images are .ipm (not a schema format, so other); annotations are BDML/bd5 numeric tracking
  data, not label images. Nuclei detected and tracked automatically, errors corrected manually (paper Methods): proofread.
  Image files were not opened. Different from the diSPIM C. elegans set zenodo-6460375.'
