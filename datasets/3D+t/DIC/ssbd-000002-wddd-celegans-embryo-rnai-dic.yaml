notes: 'SSBD project 2-Kyoda-WormEmbryoRNAi (ssbd-repos-000002); repository page states CC BY-SA 4.0 (paper CC BY-NC is the
  article licence). Counts from the SSBD page and dataset.json: 187 image datasets (1.5 TB), 186 quantitative datasets (136
  GB); the 2013 paper reports 50 wild-type and 136 RNAi sets. size_bytes = raw_image (33,660 files, 1,599,634,244,340 B) +
  raw_bdml (372 files, 146,188,757,989 B), excluding the source/ and bdml/ zip bundles that repeat the data (listing total
  3.42 TB). Voxel size 0.105 um XY, 0.5 um Z and 40 s step from the SSBD page; paper: 66 focal planes, 600x600 px. Raw images
  are .ipm (custom binary, no schema format); annotations are BDML/bd5 numeric tracking data, not label images. Nuclei detected
  and tracked automatically, errors corrected manually (paper Methods): proofread. Different from the diSPIM C. elegans set
  zenodo-6460375. enricher: formats [hdf5] (bd5 tracking files; was other), raw .ipm stay custom.'
