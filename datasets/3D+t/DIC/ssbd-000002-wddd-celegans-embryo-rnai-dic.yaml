short_name: C. elegans embryo nuclear tracking (4D DIC)
description: '187 4D differential-interference-contrast time-lapse image sets (66 focal planes at 0.5 um, 40 s intervals,
  600x600 px) of early Caenorhabditis elegans embryos, wild type and with single essential embryonic genes silenced by RNAi,
  each with quantitative nuclear tracking: 3D outlines of nuclear regions and their division/movement dynamics over time (186
  quantitative data sets: 50 wild type, 136 RNAi), as BDML XML and bd5 HDF5 files.'
