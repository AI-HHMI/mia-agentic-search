notes: 'Dryad API lists embGAN_data.7z (49.7 GB) and README.md (1 KB); the 7z could not be listed and the README
  download returned 401/403, so contents, file counts and exact formats are taken from the paper (Methods: images
  cropped and converted to individual tiff volumes in Fiji; 112,302 training and 41,823 validation image pairs).
  Nuclear labels used for training came from the pre-trained StarDist 2D_versatile_fluo model applied to the mCherry
  channel (automatic, imperfect) and the paper does not say they are shipped as files, so the training signal is
  the paired DIC/fluorescence images; annotations_verified is false. Pixel size not stated on the Dryad record or
  paper Methods (only z spacing 750 nm). Dryad direct download needs a browser session, so no direct download_url.
  z spacing 750 nm (paper Methods) is not recorded in voxel_size_nm because x/y are unknown. ML task: label-free
  (DIC) nuclei detection trained against fluorescence-derived masks.'
