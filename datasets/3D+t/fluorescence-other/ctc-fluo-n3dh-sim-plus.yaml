notes: 'Training zip listed with tools/listing.py (exact size 3,397,344,596 B, 922 members): 01/ 150 tif
  (1.6 GB); 01_GT/SEG 150; 01_GT/TRA 150 + man_track.txt; 01_ERR_SEG 150; 02/ 80 tif (1.6 GB); 02_GT/SEG
  80; 02_GT/TRA 80 + txt; 02_ERR_SEG 80. Voxel size, microscope, time step and description from the CTC
  3D dataset table (computer-generated, perfect masks). Simulated data, so organism is only nominal. Terms
  are custom (CTC page): CTC-related use needs no consent, other scientific use needs organizer permission,
  commercial use needs organizer permission, the Nature Methods paper must be cited. Test set annotations
  are secret. Well-known benchmark; confidence kept moderate given permission-based terms. Differs from
  the existing 2D record zenodo-15608207-ctc-fluo-n2dh-sim-plus and the real-cell CTC 3D records: a separate
  simulated 3D CTC dataset with its own zip.'
