short_name: Simulated HL60 nuclei segmentation/tracking (3D+t)
description: Two computer-simulated 3D+t fluorescence sequences (150 and 80 time points) mimicking Hoechst-stained
  HL60 cell nuclei (Zeiss Axiovert 100S as simulated, 0.125 x 0.125 x 0.2 um voxels, 29 min time step),
  from the Cell Tracking Challenge training set, with perfect per-frame segmentation masks and tracking
  markers.
