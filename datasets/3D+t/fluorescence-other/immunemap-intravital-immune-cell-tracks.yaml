schema_version: '1.2'
id: immunemap-intravital-immune-cell-tracks
title: Immunemap atlas of immune cell motility (intravital microscopy videos with manual cell tracks)
short_name: Immunemap intravital immune cell tracks
description: Open database of over 400 intravital microscopy videos of immune cells contributed by a consortium
  of 30 laboratories, covering trachea, lung, spleen, skin, spinal cord, lymph node and liver under steady-state,
  infection, vaccination, inflammation, tumor and autoimmune conditions. 233 videos carry 58,943 manually annotated
  2D single-cell tracks (1,049,340 centroid annotations) made with TrackMate for B, T, NK, dendritic cells, neutrophils,
  eosinophils, innate lymphoid cells and others.
