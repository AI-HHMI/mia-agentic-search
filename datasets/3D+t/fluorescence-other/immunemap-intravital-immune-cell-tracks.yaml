    alignment: not-applicable
    alignment_notes: 'Imaris 5.5 layout: one dataset per time point and channel, chunks [8,256,256]. The first axis
      is z: 16 = the 13 slices in the API metadata padded to the chunk size (the last 3 planes are zero, zero_fraction
      0.1875). y/x order is not stated (square frame), so axes stay null. Lower resolution levels are also stored.'
  - role: label
    path_pattern: video/*/tracks.json
    format: json
    axes: null
    shape:
    - 683
    - 5
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: tracks-table
    alignment: same-grid
    alignment_notes: tracks.json of the same video uid. In the sample, column 0 takes 88 values (track id), columns
      1-2 run 0.33-254.67 (x, y in pixels of the 256x256 frame, as observed), column 3 is always 1, column 4 runs
      0-8 (frame index of the 9 frames). Tracks are 2D (no z). Column meanings are inferred, not documented.
  notes: 'Size: summed from original_file.size of all 360 public videos in acquisition/<id> (the /ims Content-Range
    matched it for 2 videos) plus the tracks.json bytes; not a tools/listing.py listing. Crawled acquisition/public
    and all 367 acquisition/<id> records plus 360 tracks.json at 1 req/s; 7 acquisitions have no video. Probed v8_Capture
    25.ims (HDF5 header, 15.6 MB of ranges). Sampled TimePoint 0/Channel 1 (4,060,628 B): uint16, [0, 26786], mean
    1168 (one sample); normalization unknown. Videos vary: 51-1041 x 77-1040 px, 1-108 slices, 9-293 frames, 1-5
    channels. Download: /ims, /tracks.json and /frames.zip are direct (206, range requests), but api.immunemap.org
    is not on the TensorSwitch allowlist. Voxel size not set: it varies per video (136 spacing triples in the API,
    no unit given); checked: API metadata, HDF5 header, paper full text (typical pixel size 0.7 um). License not
    found; checked: www.immunemap.org, API root, the web app bundle, paper Data availability. Dimensionality 3D+t
    is not covered by the miao layout yet.'
