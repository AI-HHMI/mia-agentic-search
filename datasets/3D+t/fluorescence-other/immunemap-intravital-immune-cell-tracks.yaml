notes: 'enricher: access open (was registration): the public API serves each public video as its original Imaris
  .ims (HDF5) and its tracks.json without login. enricher: 360 public videos with files (n_items, was 400), 234
  with tracks (959,179 points); size = sum of the API original_file sizes plus tracks.json (was null). enricher:
  modality fluorescence-other (was other): fluorescent reporters; the paper names multiphoton and spinning-disk,
  per-video technique not public. Voxel size varies per video (136 spacing triples, e.g. 0.667x0.667x2, 0.8x0.8x3;
  API gives no unit, paper says ~0.7 um pixels), so null. No data license found (the paper is CC BY 4.0). Cell Death
  Dataset is catalogued separately (zenodo-14551288).'
