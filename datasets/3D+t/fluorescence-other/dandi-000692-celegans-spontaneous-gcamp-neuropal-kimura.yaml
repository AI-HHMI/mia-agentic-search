notes: 'Read the DANDI API record (9 NWB files of about 8.6-9.4 GB, 80.5 GB total, CC-BY-4.0, description with the processing
  steps and a warning about transient tracking failures) and the asset listing, and read the structure of one file (sub-231013-01)
  by range request: CalciumImageSeries (1645, 288, 576, 25, 2) uint16, NeuroPALImageRaw (238, 461, 28, 4) uint16, grid_spacing
  0.32, 0.32, 1.5 um for both volumes (read from that one file only). No paper is cited on the DANDI record or on wormid.org,
  so none was read; microscope and the labelling procedure are described only by the record (3DeeCellTracker, NeuroPAL Auto-ID
  plus manual corrections), so modality is fluorescence-other. Same layout as other WormID dandisets but different data. enricher:
  CalciumSeriesSegmentation is a per-frame neuron label volume (147 IDs in frame 0, names in NeuronIDs), so + instance-segmentation.'
