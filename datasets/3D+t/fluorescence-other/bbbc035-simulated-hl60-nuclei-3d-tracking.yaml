notes: 'Page states this is an exact copy of Cell Tracking Challenge Fluo-N3DH-SIM+ and asks that the Nature Methods CTC paper is cited; the catalog has no Fluo-N3DH-SIM+ record (dedup: new), but a 2D Fluo-N2DH-SIM+ record exists, which is a different dataset. Page gives volume width 79-81 um x height 43-79 um x depth 59 um (pixel dims 639-652 x 349-642 x 59) but no per-voxel size, so voxel_size_nm is null. Image zip holds 230 TIFFs in sequences 01 (150) and 02 (80). Sum of both zips = 3.33 GB. Nature Methods paper is not open access in Europe PMC; only its abstract was read.'
