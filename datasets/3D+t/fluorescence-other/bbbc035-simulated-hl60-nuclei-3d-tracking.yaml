      \  BBBC035_v1_DatasetGroundTruth.zip\n    01_GT/SEG/  150 .tif (108.6 MB)  man_seg000.tif ...\n\
      \    01_GT/TRA/  150 .tif + man_track.txt (108.6 MB)  man_track000.tif ...\n    02_GT/SEG/   80\
