    - 4
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: tracks-table
    classes: null
    alignment: same-grid
    alignment_notes: Space-separated text, 4 integer columns per row, presumably the Cell Tracking Challenge
      track format (no column header; the docs read here do not define the columns). 02 has 117 rows (first
      column up to 173, third column up to 79 = last frame); 01 has 81 rows.
  notes: 'listing.py --expand-zips: 2 zips, 3,331,477,077 B exact, 692 members. probe.py on 02_GT/SEG/man_seg000.tif
    and 02_GT/TRA/man_track000.tif: 59 pages of 642x652 uint16, LZW (the page axis is not stated in the
    file; the page says depth is 59 slices). probe.py could not parse the deflated raw member 02/t000.tif,
    so raw compression is unknown. sample.py: raw 02/t000 [59, 642, 652] uint16 [70, 261], mean 93, 190
    unique values; SEG man_seg000 [0, 30], 31 unique values, 95.7% background, same shape. man_track.txt
    read in full for both sequences with peek_archive --cat. Values are from one time point. Images are
    simulated (MitoGen), so no detector range applies. The page gives no per-voxel size (only depth 59
    um over 59 slices and approximate lateral extents), so voxel_size_nm stays null. Repeated connection
    resets from data.broadinstitute.org needed retries.'
