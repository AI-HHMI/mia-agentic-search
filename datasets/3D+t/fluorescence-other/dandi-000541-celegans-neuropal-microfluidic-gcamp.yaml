title: NeuroPAL microfluidic chip images and GCaMP activity of C. elegans, with segmented and identified neurons
short_name: C. elegans NeuroPAL + GCaMP whole-brain imaging
description: Twenty-one NWB files of whole-brain GCaMP calcium-imaging volume time series and NeuroPAL multicolor structural volumes
  from C. elegans heads in a microfluidic chip, with per-time-point neuron segmentation (voxel masks) and neuron identities. Data from
  the NeuroPAL paper and the deformable NMF paper (Nejatbakhsh et al. 2020).
