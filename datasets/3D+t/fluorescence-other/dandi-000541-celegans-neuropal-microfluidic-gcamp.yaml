notes: 'DANDI API record: 21 NWB files (about 1.45 GB each, 30.5 GB), CC-BY-4.0, open. First file (sub-20190924-01) read by
  range request: CalciumImageSeries (962, 256, 128, 21) uint16, NeuroPALImageRaw (512, 256, 21, 5), grid_spacing 0.26667 x
  0.26667 x 1.5 um, per-time-point Seg_tpoint_N groups (181 voxel-mask ROIs with ids). The 164-184 identified / 166-188
  segmented neuron counts come from the wormid.org table, not from the identity arrays. Cell 2021 paper full text is not open
  access and the bioRxiv preprint was rate-limited, so Methods were not read; microscope and annotation procedure
  unconfirmed. Zenodo NeuroPAL release and dandiset 000715 hold different data (reference worms). Voxel size from one file.'
