notes: 'Zip listing (peek_archive): Gastruloid_241025/ has trainingset movie1 (14 per-timepoint im/label TIFF pairs), movie2,
  movie3 and movie4, plus test_input, weights and example outputs; Neural_tube_160226/ has trainingset movie1 and movie2.
  Four .ckpt checkpoints are included; n_items counts the six training movies. The record metadata says CC-BY-4.0 but its
  description states an MIT licence, so check this. The preprint (full text read) says each division is annotated as two
  disks or spheres in napari with expert cross-checking, so labels mark division events (sparse), not segmentations. The
  avian species, microscope, original voxel size and frame interval are not stated on the record or in the text read, so
  voxel size is null and organism lists only the mouse gastruloids.'
