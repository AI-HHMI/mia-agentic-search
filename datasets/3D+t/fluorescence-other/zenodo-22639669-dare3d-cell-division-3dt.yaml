short_name: DARE3d cell divisions (3D+t light microscopy)
description: 3D+time fluorescence image sequences of mouse gastruloids (H2B-GFP nuclei) and avian neural
  tube explants (SiR-actin membranes) with labelled cell-division events (daughter-cell centers drawn
  as 3D spheres) for training, validation and testing, together with model checkpoints and example predictions
  of the DARE division detection and orientation method.
