notes: 'Simulated data, not microscope images: Gaussian blobs with Gaussian noise generated in MATLAB; no organism or voxel size is stated on the Zenodo page or in the paper Methods (the paper describes only 98 frames of 11 slices of 275 x 275 pixels). Record lists ThreeDTracks.mat plus zips syntheticData0-6_mat_Re (one .mat per time frame, T00001..T00098 in syntheticData1, listed with peek_archive) and GIF previews. Data are MATLAB .mat, not a listed format, so formats is other. Gold standard is the designed noise-free trajectories (generated, not manually annotated). Companion record 1221164 (single large neutrophil, Poisson noise) is a different set and is not included here; sets with irregular shapes and Poisson noise are described on the same page. Dimension conventions inside the .mat files were not inspected.'
