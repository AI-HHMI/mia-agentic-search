  notes: 'Inspected with a small MAT v5 reader (numpy + zlib): downloaded syntheticData0_mat_Re.zip (240,709 B), syntheticData1_mat_Re.zip (17,449,305 B), ThreeDTracks.mat (6,196 B), and read syntheticData6 frame 1 via range requests (~6.3 MB). Value ranges are from one frame each (noise 1: 0-20; noise 6: 0-40.4). groundTruth frames are zlib-compressed MAT elements; syntheticData1 compressed, syntheticData6 stored uncompressed. Each cell covers ~500 voxels on z slices 1-9. Formats are MATLAB .mat, which TensorSwitch does not read. voxel size not found (synthetic data, no physical scale); checked: MAT headers, Zenodo API record, paper full text (Europe PMC), phagosight GitHub README. No single archive: data.download_url stays null; direct files are the 15 Zenodo objects under https://zenodo.org/records/1221032/files/.'
