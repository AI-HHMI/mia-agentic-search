notes: 'Simulated data, not microscope images: Gaussian blobs with Gaussian noise generated in MATLAB; no organism or voxel size is stated on the Zenodo page, the paper or the GitHub README (synthetic, no physical scale). Data are MATLAB v5 .mat (and GIF previews), not a listed format, so formats is other. Gold standard is generated from designed trajectories, not manual. Companion record 1221164 (single large neutrophil, Poisson noise) is a different set. enricher: syntheticData0 is per-frame instance-label volumes, not noise-free intensity stacks; added instance-segmentation to annotations.types and segmentation to ml.tasks (from the sampled files).'
