id: zenodo-1221032-phagosight-synthetic-neutrophils
title: 'PhagoSight synthetic neutrophil migration data: 3D time-lapse fluorescence stacks with known tracks at increasing noise levels, regular shapes with Gaussian noise (Zenodo)'
short_name: Synthetic neutrophil tracking stacks (3D+t)
description: 'Synthetic 3D time-lapse data sets that reproduce migrating zebrafish neutrophils for validating segmentation and tracking: six artificial neutrophils (anisotropic Gaussian shapes, round when static and elongated when moving) follow designed trajectories over 98 time frames, each frame an 11-slice stack of 275 x 275 pixels. The gold-standard tracks are provided with the noise-free ground-truth stacks (syntheticData0) and six further stacks (syntheticData1-6) with increasing white Gaussian noise, plus GIF previews. Part of the PhagoSight MATLAB package.'
