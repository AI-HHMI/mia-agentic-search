notes: 'Fully synthetic (generated in MATLAB; cell behaviour modelled on zebrafish neutrophils), so no
  real microscope; modality fluorescence-other is the closest enum. n_items is the five noise sets P1-P5
  (each a zip of 98 per-frame .mat files; syntheticData_P_mat_La.zip holds the 98 label files shared by
  all sets). Formats are MATLAB .mat, which has no enum value, hence other. Pixel/voxel size and organism
  are not stated on the record or in the paper Methods for the synthetic data. Labels are computed from
  the generating model (source: automatic). enricher: opened sample .mat files (MAT v5); labels are instance
  IDs 0-6 per frame; ThreeDTracks.mat has x, y, t only (no z), so the tracks are 2D centroids per frame;
  size_bytes from full file listing; download_url set to the record page (no single archive).'
