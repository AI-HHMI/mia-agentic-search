  notes: 'Full Zenodo listing via listing.py (13 files, 2,481,349,870 bytes; 594 zip members). probe.py
    does not read MAT v5, so the label zip (156 KB), the P1 raw zip (37.7 MB) and ThreeDTracks.mat were
    downloaded and parsed with a small MAT v5 reader (numpy + zlib, no code from the data). Raw P1 T00001/T00098:
    double 275x275x11, range [0, 25.01] / [0, 25.74] (one noise set; P2-P5 not opened, their zips are
    ~16x larger as noise grows). Labels T00001/T00050: values 0-6. Voxel size not applicable/not found:
    fully synthetic data in pixel units; checked MAT headers (no calibration), Zenodo API description,
    paper full text (PMC3758287), phagosight GitHub README. Download: zip members and ThreeDTracks.mat
    are direct (range requests OK); no single archive (files-archive 403), so data.download_url is the
    record page. MAT v5 is not a schema format and TensorSwitch has no MAT reader, so automatic conversion
