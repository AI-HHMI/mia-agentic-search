notes: 'Fully synthetic (generated in MATLAB; cell behaviour modelled on zebrafish neutrophils), so no real
  microscope; modality fluorescence-other is the closest enum. n_items is the five noise sets P1-P5 (each a zip
  of 98 per-frame .mat files; syntheticData_P_mat_La.zip holds the 98 label files shared by all sets). Formats are
  MATLAB .mat, which has no enum value, hence other. Pixel/voxel size and organism are not stated on the record
  or in the paper Methods for the synthetic data. Labels are computed from the generating model (source: automatic).
  The label zip contents were listed but the .mat contents were not opened.'
