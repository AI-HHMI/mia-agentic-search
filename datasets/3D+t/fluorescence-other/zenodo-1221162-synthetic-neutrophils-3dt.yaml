title: 'Synthetic Data for Neutrophil Analysis: Sets with irregular shapes and Poisson noise'
short_name: Synthetic migrating neutrophils 3D+t (PhagoSight)
description: Synthetic 3D+t fluorescence-like image sets of six artificial neutrophils migrating over
  98 time frames (11 z-slices of 275x275 pixels per frame), with irregular shapes built from sums of Gaussians
  and five levels of Poisson noise (P1-P5). Ground-truth label images and 3D centroid tracks are provided.
  Part of the PhagoSight MATLAB package.
