title: DARE3d 3D+time cell division annotations in avian neural tube explants and mouse gastruloids
short_name: 3D+t cell division detection (light microscopy)
description: 3D+time fluorescence image sequences of avian neural tube explants (SiR-actin membrane label) and mouse
  gastruloids (H2B-GFP nuclear label), acquired every 3-4 minutes with 1 um optical plane spacing, with cell-division
  annotations (the two daughter-cell centres as 3D spheres) used to train, validate and test the DARE two-stage
  division detection and geometry regression method.
