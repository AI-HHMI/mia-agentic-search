notes: 'Zenodo API metadata gives license cc-by-4.0 (description text still has a template placeholder and the page
  also mentions MIT for code). Zip index read with peek_archive: 230 TIFFs (13.3 GB), trainingset/movieN/{im,label}
  folders for Gastruloid and Neural_tube, plus model checkpoints, run logs and predictions (the zip also contains
  ~5.7 GB of .ckpt weights). Annotations are daughter-cell-centre spheres per the description; label TIFF encoding
  and train/val/test assignment per movie not confirmed. Voxel size in xy, microscope, number of annotated divisions
  not stated on the dataset page or file listing; the paper full text could not be read (bioRxiv and Europe PMC
  full text returned 429 / not available in this run), so only the Zenodo description was used for sampling interval
  and 1 um z spacing. Avian species is not stated in the Zenodo text, so only Mus musculus (gastruloids) is listed
  as organism.

  enricher: size confirmed by zip listing; labels seen in sample (annotations_verified).'
