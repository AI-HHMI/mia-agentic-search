title: DARE3d
short_name: Cell division detection in 3D time-lapse
description: 3D+time fluorescence movies of mouse gastruloid nuclei (H2B-GFP) and avian neural-tube explants (SiR-actin membrane),
  with division annotations given as two 3D spheres centred on the daughter cells, plus trained DARE3d model weights. Used to train
  a 3D U-Net division detector and a regression model for division orientation.
