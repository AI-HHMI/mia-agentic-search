notes: 'The 7.6 GB zip mixes data with model checkpoints (8 .ckpt, 5.7 GB), Hydra run folders and prediction outputs, so the raw data is a small part: Gastruloid_241025/trainingset (movie1-4 with im/ and label/, plus test_input/movie.tif) and Neural_tube_160226 (only the test movie movie_I2 with groundtruth/ and predictions; no neural-tube training movies were seen in the listing). Licence is CC BY 4.0 in the Zenodo metadata, but the README still says "Please insert here the license". Microscope type is not stated in the Zenodo record or the preprint text read, so the modality is fluorescence-other. Voxel size left null (the schema needs x, y and z): only the 1 um optical-plane spacing is stated; x/y pixel size is not given (the 2D dataset implies 1.2 um/pixel, but that is a different dataset), and the paper resamples to 1 um isotropic. The preprint is not open access in Europe PMC (bioRxiv source XML was read). Annotations are division events as sphere pairs, not segmentation or tracks.'
