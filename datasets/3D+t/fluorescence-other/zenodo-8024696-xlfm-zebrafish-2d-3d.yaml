notes: 'Targets are not manual: the 3D volumes are 100-iteration Richardson-Lucy deconvolutions of the
  SLNet-processed light-field images (paper), and the neuron coordinates come from suite2p. Per the record,
  volumes are included only for 10 interleaved frames in 0-499 (training) and frames 500-520 (testing);
  raw data has no volumes. Datasets.zip is 32.8 GB (99 files, 96 .tif); the record also has the 2.7 GB
  PSF tif (734 x 734 x 550 um extent) and lenslet centres. Voxel size is not stated on the record or in
  the paper text read. Zebrafish age 4-6 dpf for four fish per the paper; the two NLS GCaMP6s fish have
  unknown age. The record lists three fish. enricher: size 35,465,922,032 B from the Zenodo file listing
  (was approximate).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./                                                   4 files   35.5 GB  .txt 2, .zip 1, .tif\
      \ 1\n  readme.txt, lenslet_centers_python.txt, PSF_241depths_16bit.tif (2.7 GB)\nzip contents:\n\
      Datasets.zip/Datasets/\n  <fish>/SLNet_preprocessed/                    1 file   ~2 MB   .csv  (Neural_activity_coordinates.csv)\n\
      \  <fish>/SLNet_preprocessed/XLFM_image/         1 file   5.6 GB  .tif  (XLFM_image_stack.tif)\n\
      \  <fish>/SLNet_preprocessed/XLFM_stack/        30 files  4.3 GB  .tif  (XLFM_stack_nnn.tif)\n \
      \ <fish>/raw/XLFM_image/                        1 file   5.6-6.6 GB  .tif  (XLFM_image_stack.tif)\n\
      \  <fish> = GCaMP6s_NLS_1, GCaMP6s_Tg_1, GCaMP7f_Tg_1"
    n_files: 4
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/api/records/8024696/files/Datasets.zip/content::Datasets/GCaMP6s_Tg_1/SLNet_preprocessed/XLFM_image/XLFM_image_stack.tif
    - https://zenodo.org/api/records/8024696/files/Datasets.zip/content::Datasets/GCaMP6s_Tg_1/SLNet_preprocessed/XLFM_stack/XLFM_stack_000.tif
    size_bytes: 5742751195
    description: 'One fish (GCaMP6s_Tg_1): its SLNet-preprocessed 600-frame light-field stack (the smallest
      input file, 5.6 GB) and the 3D volume of frame 000'
  arrays:
  - role: raw
    path_pattern: '*Datasets/*/SLNet_preprocessed/XLFM_image/*.tif'
    format: tiff
    axes: tyx
    shape:
    - 600
    - 2160
    - 2160
    shape_varies: false
    dtype: uint16
    compression: none
    value_range:
    - 0
    - 65535
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'ImageJ TIFF, big-endian, 600 pages of 2160 x 2160 (header images=600 slices=600;
      the readme calls them 600 preprocessed XLFM images, i.e. time frames, so t). Network input. First
      frame: 0-65535, 31% zeros (header min/max 0/65535).'
  - role: raw
    path_pattern: '*Datasets/*/raw/XLFM_image/*.tif'
    format: tiff
    axes: tyx
    shape:
    - 600
    - 2160
    - 2560
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 35
    - 6945
    normalization: none
    alignment: not-applicable
    alignment_notes: Raw light-field frames, ImageJ TIFF, 600 pages (t per the readme). 2160 x 2560 in
      GCaMP6s_Tg_1; the GCaMP7f_Tg_1 file is 5,598,733,301 B like the 2160 x 2160 stacks. No volumes are
      provided for raw data (readme).
  - role: target
    path_pattern: '*Datasets/*/SLNet_preprocessed/XLFM_stack/*.tif'
    format: tiff
    axes: zyx
    shape:
    - 100
    - 600
    - 600
    shape_varies: false
    dtype: float32
    compression: none
    value_range:
    - 0.0
    - 0.2767
    normalization: unknown
    alignment: unknown
    alignment_notes: 'Pairing rule: XLFM_stack_nnn.tif is the 3D Richardson-Lucy deconvolution of frame
      nnn of the same fish''s SLNet XLFM_image_stack.tif (readme, paper): a 2D light-field image to a
      3D volume, so no shared grid. tifffile TIFF, description shape [1, 100, 600, 600], 100 pages (depths).
      30 per fish: 10 interleaved frames in 0-499 (training) and 20 consecutive frames (testing).'
  - role: label
    path_pattern: '*Datasets/*/SLNet_preprocessed/*.csv'
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: points-table
    classes: null
    alignment: unknown
    alignment_notes: 'Neuron coordinates from suite2p (readme): columns index, patch_n, coord_x, coord_y,
      coord_z, corr_coeff, is_gt, is_match, t0-t99 (108 columns); about 1,000 rows in GCaMP6s_Tg_1. Coordinate
      units and frame of reference are not stated.'
  notes: 'Listing: tools/listing.py on the Zenodo API record with --expand-zips: 4 files, 35,465,922,032
    B (file-listing, complete, exact sizes), 99 zip members. All zip members are deflated, so probe.py
    could not read them by range; a scratch script inflated member heads instead (first IFD of each TIFF;
    first frame of both GCaMP6s_Tg_1 image stacks, 16 MB each) and one whole volume (XLFM_stack_000.tif,
    121 MB compressed). Values are from those files only. normalization none for the raw frames is inferred
    (16-bit camera counts 35-6945). PSF_241depths_16bit.tif: 241 pages of 2160 x 2560 uint16 (ImageJ header
    says frames=241, the readme says 241 depths; 1 um/px default calibration). Voxel size not found; checked:
    TIFF headers (no calibration / 1 um default), Zenodo record and readme (PSF extent 734 x 734 x 550
    um only), paper full text (network volumes 734 x 734 x 225 um3 = 512 x 512 x 96 voxels, not the deposited
    600 x 600 x 100 stacks), SLNet_XLFMNet README (120 depths default).'
