notes: 'Targets are not manual: the 3D volumes are 100-iteration Richardson-Lucy deconvolutions of the SLNet-processed light-field images
  (paper), and the neuron coordinates come from suite2p. Per the record, volumes are included only for 10 interleaved frames in 0-499
  (training) and frames 500-520 (testing); raw data has no volumes. Datasets.zip is 32.8 GB (99 files, 96 .tif); the record also has the
  2.7 GB PSF tif (734 x 734 x 550 um extent) and lenslet centres. Voxel size is not stated on the record or in the paper text read. Zebrafish
  age 4-6 dpf for four fish per the paper; the two NLS GCaMP6s fish have unknown age. The record lists three fish. Checked record, zip listing and paper Methods.'
