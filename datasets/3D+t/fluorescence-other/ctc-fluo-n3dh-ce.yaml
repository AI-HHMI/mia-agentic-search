notes: 'Training zip listed with tools/listing.py (exact zip size): 01/ 250 tif; 01_GT/SEG 5 tif; 01_GT/TRA
  195 tif + man_track.txt; 01_ST/SEG 195 tif; same for 02/ (5 GT SEG). Pixel/voxel size, microscope, time
  step and cell type come from the CTC dataset table; organism and sample from that table and the Nature
  Methods paper. Terms are custom: CTC-related use needs no consent, non-CTC scientific use requires organizer
  permission, commercial use needs organizer and data-provider permission, cloning is prohibited, and
  the Nature Methods paper must be cited. Test set annotations are secret. Gold-truth segmentation covers
  only a subset of frames (annotations.coverage partial). Well-known benchmark; confidence kept moderate
  given the permission-based terms. enricher: size_bytes from the exact zip size (was rounded); GT SEG
  are 2D slices of the 3D volumes.'
