notes: 'Five files (11.1 GB): multispindle raw movies (.cpgz, 8.1 GB, not opened), kinetochore raw movies (2.3 GB zip), and
  three results zips that were listed with peek_archive (multispindle tracking: 1220 TIFF + 10 CSV; kinetochore tracking:
  382 TIFF + 12 CSV incl. GFP_masks; spindle segmentation: 344 TIFF + 344 binary PNG). size_bytes is the sum of the five
  file sizes. Labels are outputs of the Multi-SpinX/SpinX pipeline refined with a human-in-the-loop approach, hence automatic,
  and only cover the tracked subset. Modality (likely deconvolved widefield fluorescence, file names end R3D_D3D), voxel
  size, organism and image counts are not stated on the Zenodo page; the paper is not open access, only the abstract
  was read. Dataset is on the low-confidence side because labels are algorithm outputs.'
