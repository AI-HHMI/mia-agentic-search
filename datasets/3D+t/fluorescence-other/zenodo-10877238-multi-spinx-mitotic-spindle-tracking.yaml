notes: 'Five files (11.1 GB): multispindle raw movies (.cpgz, 8.1 GB, not opened), kinetochore raw movies
  (6 DeltaVision .dv in a 2.3 GB zip), tracking results zips (TIFF stacks, GFP masks, summary CSVs) and
  SpinX segmentation crops (172 spindle/DNA TIFF crops with binary PNG masks). Labels are Multi-SpinX/SpinX
  pipeline outputs (watershed) checked by eye, hence automatic; they cover the tracked/cropped spindles
  only. enricher: organism Homo sapiens from the cell lines H1299 and RPE-1 named in the preprint (was
  empty). enricher: voxel size left null, subsets differ: RPE-1 kinetochore .dv 107 x 107 nm (DV header
  dx/dy 0.107 um) with 1 um z (header dz 1.0; preprint Methods: eleven sections in 1 um increments); H1299
  multispindle movies 5 z-slices at 2 um (preprint Methods), lateral pixel size not stated. enricher:
  formats [tiff, png]; raw .dv/.cpgz described in technical.'
