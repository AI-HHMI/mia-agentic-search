id: cbia-mda231-3d-full-annotations
title: Full segmentation annotations of 3D time-lapse microscopy images of MDA231 cells (ISBI 2025)
short_name: MDA231 3D+t cell segmentation (fluorescence)
description: Fully volumetric manual segmentation annotations for two 12-frame 3D time-lapse sequences
  (S01, S02) of MDA231 human breast carcinoma cells in collagen from the Cell Tracking Challenge dataset
  Fluo-C3DL-MDA231. S01 has three independent annotations plus a majority-vote consensus; S02 has one
  annotation. The annotations capture thin protrusions missing from the original reference annotations.
  The raw images are obtained from the Cell Tracking Challenge.
