title: 'Cell Tracking Challenge Fluo-C3DH-A549: GFP-actin A549 lung cancer cells in Matrigel, 3D time-lapse
  with segmentation and tracking annotations'
short_name: A549 cell segmentation and tracking (3D+t)
description: Two 3D+t fluorescence sequences (30 time points each) of GFP-actin A549 lung cancer cells
  in Matrigel with prominent, dynamic filopodial protrusions (PerkinElmer UltraVIEW ERS, 0.126 x 0.126
  x 1.0 um voxels), from the Cell Tracking Challenge training set. Each sequence has manual gold-truth
  segmentation for 15 frames, gold-truth tracking markers for all frames and computer-generated silver-truth
  segmentation for all 30 frames.
