notes: 'Fully synthetic (generated in MATLAB), so no real microscope; fluorescence-other is the closest
  modality enum. Sibling of the PhagoSight sets zenodo-1221162 and zenodo-1221032 (different shapes/noise):
  this one has a single large irregular neutrophil with Poisson noise (L1-L5). Five zips of 98 per-frame
  .mat raw volumes (syntheticData_L#_mat_Re) plus a 98-file label zip; listed with peek_archive. Formats
  are MATLAB .mat, no enum value, hence other. Description gives 11 slices of 275x275 px per frame; pixel/voxel
  size and organism not stated on the record, paper Methods or file listing (paper full text read via
  Europe PMC). Record contains no track table, only label volumes; the paper text describes the six-neutrophil
  sets, so the single-cell set parameters come from the Zenodo description only. enricher: technical block
  from sampled MAT files; labels binary {0,1}.'
