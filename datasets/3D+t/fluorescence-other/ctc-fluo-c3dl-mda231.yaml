title: 'Cell Tracking Challenge Fluo-C3DL-MDA231: GFP MDA231 breast carcinoma cells in collagen, 3D time-lapse with segmentation and tracking annotations'
short_name: MDA231 cell segmentation and tracking (3D+t)
description: Two 3D+t fluorescence sequences (12 time points each, 80 min interval) of GFP-expressing MDA231 human breast carcinoma cells embedded in a collagen matrix, imaged on an Olympus FluoView F1000 with a Plan 20x/0.7 objective (1.242 x 1.242 x 6.0 um voxels). This is the Cell Tracking Challenge training set with raw volumes, manual gold-truth segmentation on selected slices, tracking markers for all time points and computer-generated silver-truth segmentation.
