notes: 'Zip index read with peek_archive (192,582,984 bytes): sequences 01 and 02, each with 12 raw volumes, 12 silver-truth ST/SEG masks, GT/SEG files named man_seg_TTT_ZZZ.tif (17 and 13, so manual masks only on selected slices) and TRA markers plus man_track.txt. Voxel size, microscope, sample and source (R. Kamm, MIT) are from the CTC 3D dataset table; modality is not stated there, so fluorescence-other. Terms are custom: CTC use needs no consent, non-CTC scientific use needs organizer permission, commercial use needs organizer and provider permission, cloning is forbidden, the Nature Methods paper must be cited. Test annotations are secret. Differs from catalog record cbia-mda231-3d-full-annotations, an annotation-only release without raw images; this one is the raw plus reference-annotation CTC set. The paper text does not describe MDA231 specifically. Well-known benchmark, confidence kept moderate.'
