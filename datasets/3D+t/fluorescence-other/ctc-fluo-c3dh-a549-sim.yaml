short_name: Simulated A549 cells segmentation/tracking (3D+t)
description: Two computer-simulated 3D+t fluorescence sequences (30 time points each) mimicking GFP-actin-stained
  A549 lung cancer cells in a Matrigel matrix (PerkinElmer UltraVIEW ERS as simulated, 0.126 x 0.126 x
  1.0 um voxels, 20 s time step), from the Cell Tracking Challenge training set, with perfect per-frame
  segmentation masks and tracking markers.
