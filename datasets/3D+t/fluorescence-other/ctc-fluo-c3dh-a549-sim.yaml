notes: 'Training zip listed with tools/listing.py (exact size 329,974,837 B, 242 members): 01/ 30 tif
  (137.7 MB); 01_GT/SEG 30 tif; 01_GT/TRA 30 tif + man_track.txt; 01_ERR_SEG 30; 02/ 30 tif (201.1 MB);
  02_GT/SEG 30; 02_GT/TRA 30 + txt; 02_ERR_SEG 30. Voxel size, microscope, time step and description from
  the CTC 3D dataset table (marked as computer-generated with perfect masks); paper cited for the benchmark.
  Frame counts come from the listing. Simulated data, so organism is only nominal. Terms are custom (CTC
  page): CTC-related use needs no consent, other scientific use needs organizer permission, commercial
  use needs organizer permission, the Nature Methods paper must be cited. Test set annotations are secret.
  Well-known benchmark; confidence kept moderate given permission-based terms. Differs from the existing
  2D record zenodo-15608207-ctc-fluo-n2dh-sim-plus and the real-cell CTC 3D records: a separate simulated
  3D CTC dataset with its own zip.'
