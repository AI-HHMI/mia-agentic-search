  notes: 'Listing: figshare API (listing.py: 9 files, 20,128,902,005 bytes, complete, exact) plus zip
    indexes of all 6 zips read with peek_archive.zip_entries (listing.py did not expand them: ndownloader
    URLs have no .zip suffix). Probed 11 NIfTI headers (eval, train, RNAi, 2D time-lapse zips): train/eval
    volumes [z,y,x] = [160|168,356,256] int16 gzip; RNAi rawMemb 214x356x256 uint8; 2D time-lapse segCell
    214x356x256 uint16. Sampled one eval time point (5 members, 9.4 MB): pixdim all 1.0, xyzt units unknown,
    sform 2, so no calibration. value_range from that one sample. Voxel size not found as a stated value:
    checked NIfTI headers, figshare API description, the paper (none found by title in Europe PMC), CTransformer
    and CImageProcessor repos. The CTransformer code resamples raw stacks (xy_resolution = 0.09, z_resolution
    = 0.43, no unit) to about 0.18 isotropic (para_config comment "0.09 * int(94*0.43/0.09) / 224 = 0.1804");
    the factor depends on the slice count of each embryo, so it is not a stated voxel size and was not
    used. Single files only, no one archive for the whole dataset: download_url stays the landing page;
    direct files are the ndownloader URLs in the listing.'
