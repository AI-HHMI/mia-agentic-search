notes: 'Nine files (~20.1 GB): 3D Shape Training zip (71 time points of RawMemb, RawNuc, SegCell, SegMemb, SegNuc, 6 CD lineage CSVs), 3D Shape Evaluation zip (16 time points), 2D Time-lapse Evaluation (460 segCell files), Nuclei Generative Evaluation, Shape-adhesion E-cadherin, RNAi annotation GT, CellFate.xls, name_dictionary.csv and a 14.9 GB .lif; zips listed with peek_archive. The record names no microscope, voxel size, protocol or paper (title, TUNETr and m2nGAN searches found none), so modality is inferred from the channels. How the labels were made is not stated; a linked Google Drive folder was not checked. The same group published a related C. elegans atlas (CShaper, 2020); not confirmed to be the same data.'
