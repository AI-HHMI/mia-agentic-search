notes: 'Different subset of the Allen nuc-morph-dataset package than allen-nucmorph-20x-100x-hipsc-nuclei-3d. 76 movies (data table):
  61 pretraining, 14 with seg.ome.zarr, 1 PCNA lattice light-sheet movie. enricher: voxel_size_nm set to null (was 271x271x763): subsets
  differ. Table: 75 20x movies 0.763 (z) x 0.271 x 0.271 um; PCNA movie 0.145 um isotropic; segmentations 0.290 x 0.108 x 0.108 um.
  Segmentations are model-predicted (ViT decoder). Channel order differs between movies (channel 1 is mEGFP in 2020/2022 movies, transmitted
  light in 2023 ones; see the table). Size sums the table raw-size column (GB), without segmentations. License: Allen Institute Terms
  of Use (non-commercial research, attribution).'
