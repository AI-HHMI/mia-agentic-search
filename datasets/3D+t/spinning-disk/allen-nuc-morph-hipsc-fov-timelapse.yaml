title: WTC-11 hiPSC FOV-nuclei timelapse dataset V1 (nuc-morph-dataset)
short_name: hiPSC colony nuclei timelapses (spinning-disk)
description: 'Allen Institute for Cell Science 3D timelapses (5 min interval, up to 570 timepoints) of lamin B1-mEGFP WTC-11
  hiPSC colonies imaged with a 20x/0.8 NA spinning-disk confocal in fluorescence and brightfield, released as OME-Zarr. 14 analysis
  movies (baseline colonies, DNA replication inhibitor, nuclear import inhibitor, feeding and fixed controls) come with a separate
  3D nuclear segmentation volume; 61 further movies are provided for self-supervised Vision Transformer pretraining, and one
  PCNA + DNA dye lattice light-sheet movie has no segmentations.'
