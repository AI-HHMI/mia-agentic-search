notes: 'Different subset of the same Allen nuc-morph-dataset package than the catalogued 20x/100x pairs record (allen-nucmorph-20x-100x-hipsc-nuclei-3d). Read: package README, S3 listing, metadata table (76 movies: 61 pretraining, 14 with segmentation, 1 PCNA lattice light-sheet movie without), bioRxiv full text. Voxel size is the raw 20x grid (z 0.763, y/x 0.271 um; the lattice movie is 0.145 um isotropic); segmentations use a finer 0.290 x 0.108 x 0.108 um grid and are model-predicted (Vision Transformer decoder), not hand-drawn. Size sums the table raw-size column (taken as GB), without segmentations. The Quilt viewer (https://open.quiltdata.com/b/allencell/tree/aics/nuc-morph-dataset/) is JavaScript only, so S3 was listed instead. License: Allen Institute Terms of Use (non-commercial research, attribution; commercial needs written permission; page says outdated); the bioRxiv article is CC BY 4.0. Cell lines via Coriell MTAs.'
