    with h5py over fsspec range requests (metadata, NeuroPAL image_mask in full, small slabs of both images; ~80 MB upper
    bound). Values from small slabs only. One file inspected; shapes vary per file (frame counts). Voxel size from ImagingPlane
    grid_spacing [0.54, 0.54, 0.54] um; the paper (PMC) states only z spacing 0.54 um, 3x3 binning, 322 x 210 ROI. No file
    under ~26 GB, so the sample is a whole NWB. Direct S3 blob URLs work; api.dandiarchive.org download redirects are not
    on the TensorSwitch allowlist.
