notes: Read the DANDI API record (38 NWB files of about 27 GB each, 1.01 TB, CC-BY-4.0) and its asset listing, and the Cell
  paper via PMC (Methods read in its first 100k characters). Lateral pixel size is not stated in the paper text read, the
  DANDI record or the Zenodo record; the NWB files were not opened. Only the z spacing (0.54 um) is stated, in the paper,
  so voxel_size_nm stays null. The paper does not clearly say how neuron identities were assigned beyond NeuroPAL colour and
  position (segmentation used a 3D U-Net, ANTSUN pipeline), so annotation source is unknown and annotations_verified is false.
  Related Zenodo 10.5281/zenodo.8150515 holds only model weights and analysis outputs, not images. Different from DANDI 000714,
  000472 and the Zenodo NeuroPAL atlas (other NeuroPAL sets).
