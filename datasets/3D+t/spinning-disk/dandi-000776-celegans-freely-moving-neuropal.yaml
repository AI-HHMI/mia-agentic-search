notes: 'Read the DANDI API record (38 NWB files of about 27 GB each, 1.01 TB, CC-BY-4.0) and its asset listing, and the Cell
  paper via PMC. The paper states only the z spacing (0.54 um). It does not clearly say how neuron identities were assigned
  beyond NeuroPAL colour and position (segmentation used a 3D U-Net, ANTSUN pipeline), so annotation source is unknown. Related
  Zenodo 10.5281/zenodo.8150515 holds only model weights and analysis outputs. Different from DANDI 000714, 000472 and the
  Zenodo NeuroPAL atlas. enricher: voxel size 0.54 um isotropic from NWB ImagingPlane grid_spacing (was null; z matches the
  paper). enricher: NeuroPAL instance mask (image_mask) seen, types + instance-segmentation, annotations_verified true.'
