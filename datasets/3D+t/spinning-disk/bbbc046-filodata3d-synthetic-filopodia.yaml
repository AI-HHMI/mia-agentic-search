  notes: 'Listing: tools/listing.py --expand-zips on FiloData3D.zip (6,660 members, complete, exact sizes). Probed (headers): WT-ID550-AR-1 img_t000 at factors 0.25/1.00/4.00 and mask_t000: plain multi-page TIFF, 133 pages of 146x143, uint16, LZW, no calibration. Sampled (tools/sample.py): WT-ID550-AR-1 factor-1.00 img_t000 + mask_t000 (same shape; mask values {0,50,100}); WT-ID550-AR-8 factor-1.00 img_t029 (17x146x143, range 416-1883, one sample; 12-bit-like range); PD-ID450-AR-1 mask_t029 (323x216x255, 19 values 0-503). value_range of raw is from the AR-8 sample. Voxel size not found; checked: TIFF headers, BBBC046 page, CBIA datasets page, txt files in the zip (no README), FiloGen paper (not open access, abstract only), ICIP 2019 paper (not found in Europe PMC/arXiv). The trajectory files give both um and voxel-offset coordinates; no spacing is stated. AR-n subsets have different z sampling, so one voxel size would not fit all.'
