notes: 'Simulated data. Only WT-ID551.zip was listed (740 members: 4 AR folders x 30 .tif in the AR folder
  (11.1 MB total, presumably label masks; file names not visible in the listing), plus centre_trajectories_umCoords.txt
  and tip_lengths_um.txt per AR folder, and 20 factor-F folders x 30 img_tNNN.tif (1.4 GB)). The other
  8 zips were not listed. size_bytes is the sum of the nine zip sizes quoted on the page (36.2 GB), approximate.
  Voxel size not stated on the page; the FiloGen paper is not open access so only its abstract was read;
  the ICIP paper was not read. NC license restricts commercial use. enricher: size_bytes exact from listing
  of all 9 zips (was 36.21 GB page sum); mask_tNNN.tif label stacks seen and sampled in WT-ID551 and in
  the central directories of the PD zips, so annotations_verified true.'
