schema_version: '1.2'
id: bbbc046-filodata3d-synthetic-filopodia
title: FiloData3D - synthetic 3D time-lapse sequences of A549 cells with filopodia and reference masks and tip tracks
short_name: FiloData3D synthetic filopodia (spinning-disk)
description: 180 synthetic 3D time-lapse sequences (30 frames each) of single A549 lung cancer cells with growing and branching filopodia, in three phenotypes (wild-type, CRMP-2-overexpressing, CRMP-2 phospho-defective), simulated to resemble spinning-disk confocal GFP-actin imaging. Sequences vary in signal-to-noise and anisotropy and are stored at several scale factors; they carry inherently generated reference annotations - label masks per frame and text files of filopodial tip positions and branch lengths.
