  notes: 'listing.py --expand-zips on all 9 zips: 36,207,847,235 B exact, complete for the top-level files
    (listing.py "complete": true); member detail below. PD-ID45x.zip (7.4-9.8 GB) are >4 GB zips without
    zip64 records, which listing.py reads as empty; their central directories were read by a requests
    range script (154 KB each, logged as header): 740 files each, same layout as the others. OE-ID350.zip
    holds 4 nested AR zips, not expanded. probe.py: img_t001 at AR-1 is 129x146x167 uint16 LZW, at AR-8
    16x146x167, so z depth depends on the anisotropy ratio. Pages are z (one file per frame; page says
    3D time-lapse, 30 frames). sample.py at WT-ID551 AR-8 factor-1.00 t001: image [416, 1797] uint16 (12-bit-like
