notes: 'Synthetic data from the FiloGen simulator, not real microscopy; annotations are generated with the images. BBBC046 also offers nine per-cell zips (data.broadinstitute.org/bbbc/BBBC046/<PHENO>-ID<n>.zip) with the same folders. Licence holder is Martin Maska per the BBBC page. enricher: layout is 36 cell folders <PHENO>-ID<n>-AR-<1|2|4|8>, each with factor-0.25..4.00 image subfolders (36 x 5 = 180 sequences x 30 frames). Mask values: 0, 50 and groups 100-103, 200-203, ... (sample), consistent with cell body + individual filopodial branches as the BBBC page says; the numbering scheme itself is not documented. enricher: tracking added to types (tip trajectory files). Voxel size not set: no source states it, and z differs between anisotropy ratios (133 slices at AR-1, 17 at AR-8 in the sample).'
