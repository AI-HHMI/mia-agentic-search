notes: 'Synthetic data from the FiloGen simulator, not real microscopy; annotations are generated with the images. FiloData3D.zip (180 sequence folders, 6660 files, listed with peek_archive) holds img_tNNN.tif series at factor-0.25 to 4.00 scales, mask_tNNN.tif masks and centre-trajectory text files; BBBC046 also offers nine per-phenotype zips. The BBBC page says masks cover cell bodies and filopodial branches; mask label encoding was not checked. Voxel size and release date are not stated on the BBBC or CBIA pages; the FiloGen paper is not open access (abstract only). Licence holder is Martin Maska per the BBBC page.'
