title: FiloData3D - A549 cells with filopodia
short_name: Synthetic 3D filopodia time-lapse (confocal)
description: 180 synthetic 3D time-lapse sequences (30 frames each) of single A549 lung cancer cells with
  filopodia (wild-type, CRMP-2 overexpressing, CRMP-2 phospho-defective), generated with FiloGen to mimic
  spinning disk confocal imaging at varying signal-to-noise and anisotropy, with generated reference annotations
  for filopodium segmentation and tracking.
