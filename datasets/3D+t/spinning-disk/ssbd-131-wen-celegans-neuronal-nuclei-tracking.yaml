notes: 'Only worm 1a has tracking annotations (BD5 file, 12.9 MB); worms 1b and 2 are images only. Tracking came
  from 3DeeCellTracker (3D U-Net + watershed, first volume corrected manually, then FFN tracking, visually inspected),
  so annotations are algorithmic with human correction (source mixed). Coverage: 164 tracked nuclei in each of the
  171 worm-1a volumes. enricher: voxel z 1500 nm (was null): SSBD page ''Z scale 1.5 micrometer/slice'' for the
  images (its 0.16 micrometer/slice is the BD5 coordinate scale) and paper Methods (OSB3D piezo 1.5 um per step,
  worms #1 and #2; Table: worm #1a x-y 0.16, z 1.5). Size = raw_image + raw_bdml in SSBD dataset.json; the zip/,
  source/ and repos/ folders mirror the same images (27.9 GB total). Paper data availability also points to worm
  3/4 and spheroid data elsewhere; not part of this record.'
