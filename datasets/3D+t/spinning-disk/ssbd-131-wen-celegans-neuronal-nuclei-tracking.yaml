title: Time-lapse 3D spinning-disk images of C. elegans neuronal nuclei with BDML tracking (SSBD 131, 3DeeCellTracker)
short_name: C. elegans neuron nuclei tracking (spinning disk)
description: >-
  Time-lapse 3D (z-stack per time point) spinning-disk confocal images of whole-brain neuronal nuclei (nuclear marker)
  and GCaMP calcium signals in C. elegans, released with the 3DeeCellTracker paper. Six image datasets (worm 1a, 1b, 2;
  nuclei and GCaMP channels, about 9.8 GB of raw images as TIFF slices) plus a BD5/BDML file of tracked nuclei
  trajectories for dataset worm 1a (Fig3_Dataset1a_nuclei).
