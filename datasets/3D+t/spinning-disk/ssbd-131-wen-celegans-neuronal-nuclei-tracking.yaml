notes: >-
  Only worm 1a has tracking annotations (BD5 file, 12.9 MB); worms 1b and 2 are images only on SSBD. Tracking came from
  the 3DeeCellTracker pipeline (3D U-Net + watershed segmentation corrected manually in the first volume, then
  FFN tracking, results visually inspected), so annotations are algorithmic with human correction, not fully manual.
  Z spacing differs between datasets (SSBD page lists 1.5 and 0.16 um/slice) and was not tied to a dataset, so z is null.
  Size is the sum of raw_image (9845932824) and raw_bdml (13556956) bytes in the SSBD dataset.json; the server also
  mirrors zips and repos folders (27.9 GB total). SSBD page notes a newer version of this project exists. CC BY license
  is stated on the SSBD page; microscope details are given in the paper Methods (CSU-X1 spinning disk). Paper data
  availability also points to the tumor spheroid and worm 3 and 4 datasets elsewhere; those are not part of this record.
