short_name: hiPSC EMT 3D timelapses + masks (spinning-disk)
description: 'OME-Zarr 3D live and fixed spinning-disk confocal images of hiPS cell colonies and lumenoids undergoing epithelial to
  mesenchymal transition (3,538 images listed in the manifest: 890 live timelapses, mostly every 30 min for 60 h, and 2,648 fixed immunofluorescence
  images). Most images have a model-predicted all-cells mask; a smaller set has H2B nuclear instance segmentations (193), cytoplasmic-GFP
  ground-truth masks (38) or collagen IV ground-truth masks (6).'
