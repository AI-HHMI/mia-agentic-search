notes: 'Read: package README, the 3,538-row manifest (imaging_and_segmentation_data.csv) with column descriptions, and the bioRxiv full text. Manifest counts: 3,420 images have an all-cells mask, 193 an H2B nuclear segmentation, 38 a cytoGFP ground-truth mask, 6 a collagen IV ground-truth mask. All-cells and nuclear masks are CNN/Cellpose predictions; ground truth comes from Otsu thresholding of cytoplasmic mEGFP, so source is mixed and coverage partial. Voxel size is the dominant setting (20x/0.80 NA, 0.271 um xy, 2.88 um actual z in 3,441 images); a few images use other objectives (0.325, 0.542, 0.33 um pixels). Total size not stated; s3 URIs are in the manifest. License: Allen Institute Terms of Use (non-commercial research, attribution; commercial use needs written permission; page says outdated); the bioRxiv article is CC BY 4.0. Authors are the first and senior ones from the bioRxiv record, not the full list.'
