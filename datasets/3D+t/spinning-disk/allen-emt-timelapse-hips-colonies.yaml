notes: 'Manifest (3,538 rows): 3,420 all-cells masks, 193 H2B nuclear segmentations, 38 cytoGFP and 6 collagen IV ground-truth masks.
  All-cells and nuclear masks are CNN/Cellpose predictions; ground truth is Otsu thresholding of cytoplasmic mEGFP, so source mixed,
  coverage partial. enricher: voxel_size_nm null (was 271x271x2880): manifest pixel sizes differ (0.271 um xy, z 2.88 um actual in 3,441
  images; 0.325, 0.542, 0.33 um in 64; z 0.72 um in 2). channels null (was 4): C is 1-4 per image. Dimensionality: 890 live timelapses
  (TCZYX/TCYX), 2,648 fixed CZYX images. License: Allen Institute Terms of Use (non-commercial research, attribution).'
