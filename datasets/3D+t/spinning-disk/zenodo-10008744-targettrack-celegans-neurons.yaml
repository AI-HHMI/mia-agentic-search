notes: 'Files: six keypoint-tracking-data-*.h5 (1.6-5.0 GB each), key-point-tracking-videos.zip (1.2 GB) and
  volumetric-tracking-data-and-videos.zip (164 MB: two AVI videos and epfl10_CZANet_Final.h5, listed with peek_archive).
  Contents of the keypoint h5 files were not inspected (names only from the file listing), so image/annotation
  layout is unverified. Voxel size and image dimensions are not stated on the Zenodo page or in the paper
  (PMC full text: spinning-disc confocal, Nikon Ti2 + CSUX1FW, 40x/1.3 oil, ~3 volumes/s; xy resolution higher than z).
  Manual GT 5-25 annotated volumes per recording, tracked with non-rigid point-set registration and proofread;
  recordings 1,500-3,000 volumes. Size is the sum of listed files. Channel count (2: green/red cameras) from paper.'
