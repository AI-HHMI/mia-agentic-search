notes: 'Files: six keypoint-tracking-data-*.h5 (1.6-5.0 GB each), key-point-tracking-videos.zip (1.2 GB, mp4) and volumetric-tracking-data-and-videos.zip
  (164 MB: two AVI videos and epfl10_CZANet_Final.h5). Paper (PMC full text, read by the harvester): spinning-disc confocal,
