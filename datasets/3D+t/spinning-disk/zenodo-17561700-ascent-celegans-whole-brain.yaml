notes: 'Read the Zenodo API record (description and file list: one 6.2 GB HDF5 plus four CSVs, 6,253,241,706 bytes in total)
  and the ASCENT preprint full text via bioRxiv. Voxel size (0.243 um xy, 1.5 um z), channels, frame count and microscope
  (Bruker Opterra II swept-field confocal, listed as spinning-disk since the schema has no swept-field value) come from the
  Zenodo description. The Zenodo API returns the bioRxiv DOI in its doi field, so the dataset has no separate DOI recorded
  here. Ground truth is manual proofreading of ZephIR tracks; the number of annotated neurons was not stated on the pages
  read and the CSVs were not opened. The preprint says its datasets will be available on peer-reviewed publication, while
  the Zenodo record is already open. This is a single recording, so no train/test split is given.'
