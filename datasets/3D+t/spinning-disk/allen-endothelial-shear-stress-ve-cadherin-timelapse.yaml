id: allen-endothelial-shear-stress-ve-cadherin-timelapse
title: hiPSC-derived endothelial cells under shear stress, VE-cadherin time-lapse with segmentations (Allen endo_cell_state_dynamics)
short_name: hiPSC endothelial VE-cadherin shear (confocal)
description: 359 3D spinning-disk confocal OME-Zarr acquisitions (20x) of hiPSC-derived endothelial cells with
  endogenously mEGFP-tagged VE-cadherin plus bright-field, live time-lapses under defined shear stress and fixed
  images, including a label-free nuclear model training set (bright-field with nuclear stain) and a VE-cadherin
  Exon 3 deletion perturbation set. Provides VE-cadherin (cell boundary) and nuclear segmentation OME-Zarr
  volumes for 162 acquisitions, segmentation validation overlays, annotation tables, and derived feature tables
  and model checkpoints.
