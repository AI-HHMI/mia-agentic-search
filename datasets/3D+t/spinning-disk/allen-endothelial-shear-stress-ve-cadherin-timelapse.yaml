notes: 'Public S3 prefix s3://allencell/aics/endo_cell_state_dynamics/; all_datasets_manifest.csv has 1,732 rows (359 image_zarr, 162 each of cdh5_classic_seg_zarr, nuclear_labelfree_seg_zarr and cdh5_seg_validations_zarr, 192 grid_seg_zarr, parquet tables, 10 checkpoints). The manifest names the publication (Dynamics of ML-based Morphological Features Indicate a Shear Stress-Dependent Bifurcation of hiPSC-Derived Endothelial Cell States) with DOI placeholder; no paper or preprint was found, so authors and methods are unknown. Image zarr TCZYX: live 577 x 2 x 25 x 1712 x 1744 at 5 min, training set 1 x 3 x 25 x 1712 x 1744, uint16, 20x, pixel 0.382 x 0.382 x 0.7579 um (manifest). Segmentations are classical or model predictions, not manual. Total size not measured. Terms: Allen Institute terms of use; no SPDX licence.'
