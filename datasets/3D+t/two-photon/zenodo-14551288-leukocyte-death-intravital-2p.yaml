schema_version: '1.1'
id: zenodo-14551288-leukocyte-death-intravital-2p
title: An in vivo microscopy dataset capturing leukocyte cell death
short_name: Leukocyte death in vivo (two-photon time-lapse)
description: 34 raw 4D two-photon intravital time-lapses (HDF5/Imaris) of neutrophils, eosinophils and dendritic
  cells in mouse lymph nodes and spleen, annotated with the 3D+time trajectories of apoptotic-like cell
  death events (centroids tracked by three operators), 3D mesh reconstructions of the dying cells and
  per-frame semantic labels (membrane blebbing / cell disruption). Cropped movies centred on individual
  deaths are included.
