notes: 'Zenodo file API: 38 files, 71,696,054,807 bytes exact; 34 .h5 movies (den1-4, EOS1-5, Neu1-25),
  three *_crops.zip and Annotations_CSV.zip. Only death events are annotated, not every cell, so coverage
  is partial; annotations are centroid tracks plus meshes, not dense masks. Voxel size, sampling interval
  (15-60 s), duration and volume differ per movie (paper Supplementary Table 3, not read), so voxel size
  is null. Zenodo shows only the year 2025, so date_published is null. Files are downloaded individually
  from the record; download_url points at the record. Same data also at immunemap.org. enricher: listing
  confirms size; annotation CSVs read; .h5 header probe failed (TLS errors). maintainer 2026-10-06: voxel
  size differs per movie: x = y 240-2140 nm, z 2000-4000 nm (most 800x800x3000), from each Imaris header
  (extent / voxel count, um) and the paper''s Supp. Table 3, so voxel_size_nm stays null; read the movie''s
  header.'
