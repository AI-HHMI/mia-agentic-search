short_name: Leukocyte tracks, intravital 2-photon videos
description: 'Leukocyte Tracking Database (LTDB): 4D multiphoton intravital microscopy videos of immune
  cells (B, T, NK, dendritic cells, neutrophils) in mouse spleen and popliteal lymph node, 20 videos (LTDB001-020)
  plus 18 case-study videos (CS001-018), with manually tracked cell centroids merged from three operators
  into 728 consensus ground-truth tracks (44,722 annotations). Videos are uint16 TIFF series; tracks are
  CSV files.'
