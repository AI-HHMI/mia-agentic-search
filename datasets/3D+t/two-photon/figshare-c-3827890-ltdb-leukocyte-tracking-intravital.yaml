notes: 'Figshare collection with 45 items: TIFFS_LTDB001_LTDB020.zip (14.86 GB) and TIFFS_CS001_CS018.zip
  (1.04 GB), GT_TRACKS.zip (0.3 MB, 44 CSV files listed with peek_archive), operator_individual_tracks.zip,
  an SQL dump, preview MP4/PNG files; each figshare article lists CC0. n_items is 20 + 18 videos; size_bytes
  sums the two TIFF zips and the track zips. Tracks are centroid positions, not segmentation masks (paper
  says the dataset is centroid-based). Voxel size and frame interval differ per video (paper table: e.g.
  1.15 um xy, 4 um z, 15 s for CS001-003; 0.50 um xy, 2 um z, 60 s for CS004), so voxel_size_nm is null.
  The collection page lists no authors; see the paper. Image files are 4D uint16 TIFFs named <VideoID>_Txxx_Cxxx_Zxxx.tiff.'
