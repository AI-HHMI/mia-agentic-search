    shape_varies: true
    dtype: unknown
    compression: none
    encoding: tracks-table
    classes: null
    alignment: scaled
    alignment_notes: 'Semicolon-separated (paper Table 8): row 1 = video id;dx;dy;dz;dt (voxel size in
      um, interval in s, e.g. CS018_a;0.56;0.56;3;30), row 2 = channel in which cells appear, then track_id;x;y;z;t
      with x,y,z in um from the top-left corner of the stack and t an integer frame. Divide by dx/dy/dz
      to get voxel coordinates. Pairs with <VideoID>/ by the file-name prefix; suffix a/b = cell population.'
