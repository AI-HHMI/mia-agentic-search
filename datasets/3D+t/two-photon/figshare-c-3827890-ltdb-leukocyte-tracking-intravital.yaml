  notes: 'Zip central directories read with peek_archive (all four zips; tools/listing.py does not expand
    figshare ndownloader links, so the listing is not marked complete and the SQL dump, previews and snapshots
    were not listed). size_bytes is the sum of the four zips from the figshare API (compressed; TIFFs
    unpack to 38.5 GB). Probe: CS018_Z000_C000_T000.tif is a single-page 135x143 uint16 PackBits TIFF.
    Sample: that plane is 559-8504 (one sample only). CS018_a_GT.csv has 636 lines, 5 columns. Voxel size
    differs per video (paper Table 2 and the first row of each GT CSV, e.g. 0.5x0.5x3 um for CS016, 0.56x0.56x3
    um for CS018), so imaging.voxel_size_nm stays null; per-video values are in each CSV header. Planes
    must be stacked by the Z/C/T indices in the file names into one volume per time point. Download links
    checked with probe.py --download-check: both image zips and GT_TRACKS.zip members are usable (figshare
    redirects to S3 with range support).'
