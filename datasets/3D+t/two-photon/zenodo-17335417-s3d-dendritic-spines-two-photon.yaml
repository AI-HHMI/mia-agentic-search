    alignment: same-grid
    alignment_notes: 'One CSV per split; one row per 2D box in pixel coordinates of the PNG named in "filename"
      (xmin, ymin, xmax, ymax) plus "id", a spine identity shared by the boxes of the same spine across
      layers of a volume (depth tracking). Column order differs: train/valid start with id, test ends
      with it. Shape given for valid.csv (1136 boxes, 285 images, 17 volumes, 198 spine ids); test.csv
      883 boxes, 179 images, 14 volumes, 195 ids.'
  notes: 'listing.py (Zenodo record, zip expanded): 1 file, 980,592,717 B exact, 3,561 members (3,558
    PNG, 3 CSV). Probes: train/s3d_fov018_tp1_layer041.png 512x512 uint8 grey, s3d_fov082_tp1_layer010.png
    512x512x3 RGB. Samples: fov018 layer041 values 0-255, mean 14.8, p50 6, p99 189; fov082 layer010 0-159,
    mean 11.8, samples identical (grey as RGB). One sample each. valid.csv and test.csv read in full;
    train.csv only its first 200 KB (peek limit). Not every PNG has boxes (valid: 285 of 551 images).
    Voxel size 107.5x107.5x500 nm from the paper Datasets section. 3D+t record (two timepoints per fov):
    not convertible by the miao layout yet.'
