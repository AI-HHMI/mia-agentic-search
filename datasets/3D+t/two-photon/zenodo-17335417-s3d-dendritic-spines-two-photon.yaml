description: Two-photon in vivo image stacks of dendrites from mouse auditory cortex, saved as PNG layers, with 2D bounding
  boxes around dendritic spines and a spine ID that tracks each spine across layers within a volume. Provided as train,
  valid and test folders with one CSV of annotations per split.
