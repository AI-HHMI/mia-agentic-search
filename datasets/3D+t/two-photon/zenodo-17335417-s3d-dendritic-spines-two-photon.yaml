notes: 'Zip listing (peek_archive): 3,558 PNG layer images (train 2,676, valid 551, test 331) and 3 annotation CSVs; file names
  encode field of view, timepoint (tp1/tp2) and layer. Voxel size 0.1075 x 0.1075 x 0.5 um comes from the arXiv HTML of the
  paper (text read via a page summary; z-step is inferred as the depth dimension, not stated explicitly). The paper says
  S3D was re-annotated from the labels of Vogel et al. with tighter boxes, spines directly on top of or below the dendrite
  were excluded, and annotators are not named. The paper does not state a dataset license; CC-BY-4.0 is from the Zenodo
  record. Counts of volumes, mice and timepoints per split are not stated in the paper main text (supplement not read).'
