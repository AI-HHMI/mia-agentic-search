title: Dendritic Spine Datasets - time-lapse spine imaging and labelled dendritic feature patches (SpineS)
short_name: Dendritic spine time series and labelled patches
description: Datasets of the SpineS dendritic spine analysis software. Five time-series image sets of
  dendritic segments (two-photon and confocal; OME-TIFF, LSM and TIFF) plus a labelled dataset of dendritic
  feature image patches (MAT file) used to train and test a 9-class CNN that classifies dendritic features
  such as spines and dendrite edges, and the trained network.
