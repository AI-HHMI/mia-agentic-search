notes: 'Zenodo files: 1.zip (Prairie OME-TIFF planes, 1.5 GB), 2.zip (3 .lsm.tiff), 3.zip (12 TIFF stacks,
  Neuron2/time point N.tif), 4.zip (40 .lsm), 5.zip (README only: "SpineSv2-Dataset5", data at Zenodo
  6275571), SpineDetectionLabeledData.zip (one MATLAB .mat of labelled patches), net_9Class_22062022.mat
  (trained network). Paper Table 1 voxel sizes (um): dataset 1 0.0194x0.0194x0.5, 2 0.0196x0.0196x0.5,
  3 0.066x0.066x0.23, 4 0.0306x0.0306x0.41; zips 1-4 match datasets 1-4 by number and microscope (Prairie,
  LSM 710), not stated outright, and the sizes differ, so voxel_size_nm is null. Labels: 26,705 manually
  labelled 97x97 ROIs (3.4x3.4 um) from 97 dendrite images in 9 classes (paper Methods); the .mat was
  not opened (MATLAB v5/7 format, no allowed reader). The time series are not annotated. organisms: Mus
  musculus = datasets 1-2, Rattus norvegicus = datasets 3-4 (paper).'
