notes: 'Zenodo files: 1.zip (2,018 files: OME-TIFF and TIFF stacks, 1.5 GB), 2.zip (3 LSM TIFFs), 3.zip (12 TIFF stacks),
  4.zip (40 LSM files), 5.zip (768 bytes, not listed), SpineDetectionLabeledData.zip (one .mat file) and net_9Class_22062022.mat
  (trained network); n_items counts files in zips 1-4 only and total size is not summed. The paper (Methods, Datasets table)
  gives per-dataset voxel sizes from 0.0194 to 0.066 um laterally (0.23-0.5 um in z) but the mapping of zips 1-4 to paper
  datasets was not stated, so voxel size is null. The labelled patch file was not opened, so number of patches and exact
  class names are unverified; the paper mentions more than 25K manual annotations and 9 output classes (for example
  dendritic spines and dendrite edges) on 3.395 x 3.395 um ROIs. The paper says code and raw data with annotations are on
  GitHub (argunsah/SpineSv2); that repository was not read. Extra formats in the zips: LSM, OME-TIFF.'
