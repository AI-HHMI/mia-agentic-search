notes: 'The data are simulated (NAOMi-based), not recorded on a microscope. This record covers the noise-free half;
  the noisy half is Zenodo 21960236 (10.5281/zenodo.21960236), same depths and sizes, so the two form restoration
  pairs. File sizes (720,507,008 bytes int16 490x490) imply about 1500 pages per file, one file per imaging depth;
  the TIFFs are plain multi-page with no axis metadata (probe: page axis could be z or t), so dimensionality 3D+t
  follows the description (four-dimensional data) and is not verified from the headers. Pixel and voxel size, organism
  and sample are not stated on either Zenodo record; the preprint full text is not open access (Europe PMC, abstract
  only). Checked: both Zenodo records, file listing, preprint abstract. enricher: size_bytes = both Zenodo records
  (clean 21912409 + noisy 21960236, 82 TIFFs, file listing; was clean half only); files are tyx (1500 frames per
  depth).'
