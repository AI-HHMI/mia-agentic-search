description: Simulated volumetric two-photon calcium imaging generated with a modified NAOMi framework. One Zenodo record holds the noise-free ground truth (41 TIFFs, depths 100-300 um in 5 um steps, 1500 frames each) and a separate record holds the matching noisy observations (mixed Poisson-Gaussian noise at several SNR levels). Released for developing and evaluating the SDT-4D self-supervised denoiser.
