description: Simulated volumetric two-photon calcium imaging recordings (NAOMi-based simulator) in two matched Zenodo records,
  41 TIFF files each (depths 100-300 um in 5 um steps, 1,500 frames per file, about 720 MB per file). One record holds the
  noisy versions (mixed Poisson-Gaussian noise at several SNR levels), the other the noise-free ground truth with the same
  underlying neurons and calcium dynamics, released for denoising evaluation and training of the SDT-4D self-supervised 4D
  denoiser.
