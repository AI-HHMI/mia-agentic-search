notes: 'Synthetic data (simulated, not recorded from a specimen). Pairs with the separate noise-free record
  https://zenodo.org/records/21912409 (DOI 10.5281/zenodo.21912409, 41 files, 29.5 GB, CC-BY-4.0), which
  is the ground truth for the same neurons; the pairing is stated on both Zenodo pages and was not checked
  at file level. Noisy file names carry undefined parameters (2Q, sigma040, a500.00, b1600; dB values about
  -1.5 to -3.6). Voxel/pixel size, image dimensions and dtype are not stated on either Zenodo page; the
  accompanying Research Square preprint is not open access, so its Methods could not be read (abstract
  only). size_bytes is 41 files x about 720.5 MB on the Zenodo page. The noise-free side was listed as
  reference for quantitative evaluation; the page says the noisy data were used for denoising evaluation,
  baselines, training ablations and uncertainty quantification.'
