notes: 'Single 8.76 GB S2D+T.zip: 14,566 PNG layers (named fovNNN_tpK_layerLLL.png,
  15.3 GB uncompressed) and 360 CSV files, including morph_csvs/. Per the SynapFlow
  paper (arXiv HTML), voxel size is about 0.1075 x 0.1075 x 0.5 um, slices 512x512,
  four time points; the paper reports 1,450 ground-truth tracks for S2D+T and labels
  only the most representative 2D instance per 3D spine, drawn as a polygon over head
  and neck, with size and length estimated manually. Annotators, tool, microscope
  and objective are not named; the paper says data are released on GitHub (Zenodo
  not mentioned) and states no data licence (CC-BY-4.0 comes from the Zenodo record;
  the paper itself is CC BY-NC-ND). The paper''s full PDF could not be read as text;
  the HTML version was used. Individual annotation CSV names/columns were not listed.
  Split not described.'
