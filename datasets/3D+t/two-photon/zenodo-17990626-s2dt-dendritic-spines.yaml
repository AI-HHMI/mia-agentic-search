  notes: 'Exact Zenodo listing with the zip index expanded (1 file, 8,759,066,592 B = size_bytes). Counted 14,566 PNG layers
    in 180 stacks (45 FOVs x 4 time points), 31-197 layers each. Sampled fov020_tp1_layer008.png: 1024x1024 uint8, values
    0-152 (one sample). Read fov020_tp1 tables in both CSV folders (31 and 32 rows). Voxel size 107.5x107.5x500 nm from arXiv
    2509.18926 Section 2.2 ("approximately 0.1075 x 0.1075 x 0.5 um ... each image slice has a size of 512 x 512 pixels");
    the released slices are 1024x1024, so x/y may be half that if the slices were upsampled; not settled (checked: PNG header,
    Zenodo API record, paper HTML). Zip and members are direct Zenodo links (usable, range requests); zenodo.org returned
    intermittent HTTP 504s on range requests to this file during the run; the %2B-encoded URL is used for the sample.'
