notes: 'Figshare files: RawMembraneImage.zip (155 MB, 95 membt###.mat stacks in 170704plc1p2/), FinalResults3DMMS.zip
  (18 MB, 95 T###_membSeg.mat), CD170704plc1p2.csv (5.5 MB) and ReadMe.txt. The segmentations are the
  output of the authors'' own algorithm (3DMMS), not hand labels; the manual annotations used for evaluation
  are in the code repository (github.com/cao13jf/3DMMS_public, per ReadMe) and were not checked here.
  Paper Methods: Leica SP8, acquired 512x712x70 with voxel 0.09x0.09x0.43 um, deconvolved and resized
  to 205x285x70 before analysis, so the voxel size of the released .mat stacks is not certain and is left
  null. enricher: .mat arrays opened (MAT v5): raw 256x356x70 uint8, segmentation 205x285x134 instance
  ids, so labels are on a resampled grid. License MIT is the figshare licence field; no license text URL
  given. 95 time points here vs 240 acquired. Sources checked: figshare record and API, ReadMe, zip listings,
  paper full text (Europe PMC).'
