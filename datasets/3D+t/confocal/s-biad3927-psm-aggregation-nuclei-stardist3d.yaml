notes: 'Masks are StarDist3D predictions (one model for the whole study), not hand labels. AN01 lists 18,273
  mask TIFFs across 10 components. Sampled fixed stack: 25x4x1024x1024 uint16 at 593 nm xy; the mask is
  25x1024x1024 float32 (values up to 2243). Live acquisitions per the study text: 0.9225 um xy, 1-2 um z
  (2 um used here, 3 um for large wells), so voxel size varies by component. No paper is listed in the
  record (preprint not found), so no paper was read. Total size not computed.'
