notes: 'Masks are StarDist3D predictions (one custom-trained model, paper), not hand labels; one mask per
  time point for every H2B-mCherry image (AN01, 18,273 masks over 10 components). Raw data are Zeiss LSM
  (TIFF-based), plus stitched TIFFs and 25 CZI in components 10-12. enricher: voxel size set to null (was
  922.5x922.5x2000): it varies by component (study Image acquisition): live single-field 922.5x922.5 nm,
  z 1000 or 2000; large wells 922.5x922.5x3000; micropatterns 922.5x922.5x2000; fixed IF ~692 nm xy, z
  2000; endpoint fixed and reporter validation 593x593x1000. Each LSM stores its own (sampled file:
  922.5x922.5x2000). enricher: paper found (PNAS 2026, PMC13752360); cell tracks are in S-BSST3378, not
  here. Mixed 3D+t (live) and 3D (fixed) data. enricher: formats + czi, size from the file lists.'
