notes: Single 17.2 GB zip (72.1 GB uncompressed) listed with peek_archive - 72 .tif stacks (25.8 GB, microscopy/),
  1,885 .vtp meshes, pickles/CSV analysis tables and simulation outputs; the pickles are analysis outputs,
  not training data. The paper full text is not available through Europe PMC (preprint, not open access
  there) and bioRxiv returned 429 or blocked, so voxel size, microscope, markers, number of embryos and
  how segmentations were produced (manual or automatic) are not verified; the README does not state them.
  3D+t confirmed (TZYX hyperstacks). Annotations are surface meshes, not label volumes, so use for segmentation
  needs conversion.
