description: Raw confocal image stacks of early C. elegans embryos (gastrulation, endodermal precursor
  ingression) with per-timepoint 3D segmented cell meshes (VTP files, 1,885 listed), plus derived geometric
  and cortical protein analyses, biomechanical simulation outputs and analysis notebooks. Data accompany
  a 2026 bioRxiv preprint.
