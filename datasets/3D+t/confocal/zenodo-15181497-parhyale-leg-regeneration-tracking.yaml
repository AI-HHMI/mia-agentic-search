notes: 'The 22 time-lapses (Suppl_data_3) were acquired on a Zeiss LSM 800 with 0.31-0.62 um pixels, 1.24-2.48 um z steps
  and 10-20 min intervals, so it differs per recording (Suppl_data_1.csv lists the settings). Ground-truth tracks exist only
  for the benchmark recording (Suppl_data_4); the other recordings in Suppl_data_3 are image-only, and Suppl_data_5/9 hold
  division and progenitor tracks made with Elephant and manual proofreading. size_bytes is the sum of the 32 files in the
  Zenodo record (122 GB). Annotation .mastodon / .xml files are listed in annotations.format. The zip contents were listed
  with peek_archive for Suppl_data_4, 5 and 9. Checked: Zenodo page and API record, paper full text (Methods, Data availability).
  enricher: voxel_size_nm set to null (was 310 x 310 x 1240): recordings differ (0.31-0.62 um pixels, 1.24-2.48 um z); the
  ground-truth recording 4E is 311.96 x 311.96 x 1240 nm (BDV 4E.xml in Suppl_data_4).'
