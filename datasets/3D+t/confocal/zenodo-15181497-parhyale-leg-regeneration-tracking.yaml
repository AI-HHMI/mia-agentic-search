notes: 'Voxel size is that of the ground-truth tracking recording (0.31 x 0.31 um pixels, 1.24 um z step, 10 min
  interval); the 22 time-lapses (Suppl_data_3) were acquired on a Zeiss LSM 800 with 0.31-0.62 um pixels, 1.24-2.48 um
  z steps and 10-20 min intervals, so it differs per recording (Suppl_data_1.csv lists the settings). Ground-truth
  tracks exist only for the benchmark recording (Suppl_data_4); the other recordings in Suppl_data_3 are image-only,
  and Suppl_data_5/9 hold division and progenitor tracks made with Elephant and manual proofreading. size_bytes is
  the sum of the 32 files in the Zenodo record (122 GB). Annotation .mastodon / .xml files are listed in annotations.format.
  The zip contents were listed with peek_archive for Suppl_data_4, 5 and 9. Checked: Zenodo page and API record, paper full text (Methods, Data availability).'
