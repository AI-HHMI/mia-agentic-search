id: zenodo-15181497-parhyale-leg-regeneration-tracking
title: Long-term live imaging, cell identification and cell tracking in regenerating crustacean legs
short_name: Parhyale leg regeneration cell tracking (confocal)
description: 22 long confocal time-lapse recordings (3D+t, up to 330-1030 time points) of regenerating Parhyale
  hawaiensis T4/T5 legs with H2B-mRFPruby-labelled nuclei, with Mastodon cell-tracking annotations. A tracking
  benchmark set carries ground-truth tracks (278 tracks, 13,888 spots, 13,610 links over 55 time points) at six
  subsampled resolutions plus Elephant predictions; other sets carry detected cell divisions and tracks of
  spineless-expressing progenitors. Also 9 DAPI stacks with apoptotic nuclei marked and HCR stacks.
