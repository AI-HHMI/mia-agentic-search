title: Content-Aware Frame Interpolation Microscopy Datasets
short_name: CAFI time-lapse and z-stack microscopy series
description: Eight raw microscopy image collections (plus source-data archives for the paper figures) used to train and benchmark
  content-aware frame interpolation (CAFI) networks that increase temporal or axial sampling of microscopy data. Covers
  brightfield and fluorescence confocal time-lapses and z-stacks of SH-SY5Y cells, spinning-disk Dictyostelium, lattice light-sheet
  C. elegans embryos, CAR-T and MDCK cells, and simulated particle sequences.
