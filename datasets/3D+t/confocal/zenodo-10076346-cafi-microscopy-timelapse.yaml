notes: 'No manual labels. Usable without labels as training/benchmark image series for temporal and axial frame interpolation: the paper
  removes every second frame and keeps it as ground truth, a restoration-style task (ml.tasks is other: no interpolation value in the schema).
  CAFI_DATA_2.0.zip (13.7 GB) holds 8 dataset zips; the record also has 22 per-figure source-data zips, and size_bytes is the approximate Zenodo total.
  8-bit tif, 512 x 512 per frame; lattice light-sheet z-spacing 100 nm; xy pixel size not stated on the record or in the paper text read, so
  voxel_size_nm is null. Human and dog follow the SH-SY5Y, CAR-T and MDCK names, not a stated species. Dimensionality 3D+t covers the mix of 2D+t,
  z-stack and 3D+t series. Checked record, file list and paper Methods.'
