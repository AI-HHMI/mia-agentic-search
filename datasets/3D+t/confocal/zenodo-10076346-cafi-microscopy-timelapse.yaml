  notes: 'Listing: tools/listing.py on the Zenodo API record with --expand-zips: 24 zips, 43,765,428,863
    B (file-listing, complete, exact sizes); only 20 of 24 zips expanded, and the 8 dataset zips inside
    CAFI_DATA_2.0.zip are deflated (method 8), so their member lists cannot be read by range. Headers:
    I range-read the first 1 MB of each nested zip (8 MB in total), inflated it and parsed the first TIFF
    IFD: all 512 x 512, 8 bit, 1 sample/pixel, uncompressed, ImageJ 1.53 (except 4_Synth). No value ranges
    sampled (that needs a whole nested zip, 284 MB+). Conversion would need whole nested zips: no sample
    unit is fetchable on its own. Voxel size per subset: 5_-8_ lattice light-sheet: paper Methods "sCMOS
    ... with a 103 nm per pixel magnification", "slices ... taken with an interval of 100 nm" (record:
    z-spacing 100 nm); headers store the 1 um default. 1_ BF: header 0.1539 um/px; 2_ lyso: 0.1431 um/px;
    3_ DD: 0.1746 um/px, spacing 0.3999 um (from the original 1200 px data, then downsized). 4_ Synth:
    header 1 um/px (simulated). These header values are not stated in the docs, so none is set.'
