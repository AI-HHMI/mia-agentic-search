notes: 'No manual labels. Usable without labels for temporal/axial frame interpolation: the paper removes
  every second frame and keeps it as ground truth (ml.tasks other: no interpolation value). CAFI_DATA_2.0.zip
  (13.7 GB) holds the 8 dataset zips; 23 more zips are per-figure source data. 8-bit 512 x 512 TIFF frames.
  Dimensionality 3D+t covers the mix of 2D+t, z-stack and 3D+t series. organisms: Homo sapiens = 1_BF_SHSY5Y,
  2_Flu_lyso, 6_Car-T; Dictyostelium discoideum = 3_D.Discoideum; Caenorhabditis elegans = 5_, 8_CelegansEmbryo;
  Canis lupus familiaris = 7_MDCK; 4_Synth is simulated (human/dog follow the SH-SY5Y, CAR-T and MDCK
  names). voxel_size_nm null: subsets differ (per subset in technical.notes). enricher: size 43,765,428,863
  B from the Zenodo file listing (was approximate).'
