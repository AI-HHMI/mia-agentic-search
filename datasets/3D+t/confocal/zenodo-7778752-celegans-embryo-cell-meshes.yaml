description: Raw 3D confocal stacks (622 TIFF files) of live C. elegans early embryos with a membrane-tagged
  fluorescent protein, together with 19,239 Wavefront .obj triangle meshes of individual named cells (7
  wild-type seven-cell-stage embryos, 19 longer wild-type timelapses and 5 dsh-2/mig-5 RNAi embryos), at
  one frame per 90 s. Distributed in one zip with the FlowShape code.
