notes: 'Meshes come from the SDT-PICS algorithm (Thiels et al. 2021) applied to the confocal stacks, not
  hand-drawn, so source is automatic (paper Methods 2.1). Cell names are lineage names. Embryos in data/cell_filters.csv
  and wt06 were left out of the analysis. Zeiss LSM 880. DOI 10.5281/zenodo.7778752 is a version of concept
  10.5281/zenodo.7391184. enricher: voxel_size_nm set to null (was x=y=129.4751): images/resolution.csv
  gives ZYX um/px per image, and it varies per embryo (xy 0.0852-0.2044 um, z 0.33-1.1 um), e.g. 7cell01
  1.1/0.1295, wt13 0.75/0.0852, wt18 0.75/0.2044. enricher: channels 1 (ImageJ TIFF, 1 sample/pixel).
  Only 622 frames have a TIFF; many wt mesh timesteps have none (wt03 none at all).'
