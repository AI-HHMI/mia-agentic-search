notes: 'Zip listed with peek_archive (19,882 members: 19,239 .obj meshes, 622 .tif images, code, CSVs); readme.md
  and images/resolution.csv read. Meshes were produced by the SDT-PICS algorithm (Thiels et al. 2021) from
  the confocal stacks, not by hand, hence source automatic; the paper (Methods 2.1) describes it. Cell names
  are lineage names. 622 images are timepoints, fewer than the number of mesh-annotated frames, so not every
  mesh necessarily has a matching TIFF in the zip (not checked). resolution.csv gives scaling_ZYX per image:
  xy 0.1294751 um in the rows read, z 1.0 to 1.1 um in the first rows (varies per embryo; rest not
  read), so z is null. Dataset also excludes embryos listed in data/cell_filters.csv (automatically detected
  errors) and wt06 (labeling problems). Microscope is a Zeiss LSM 880 (laser scanning confocal). The DOI
  10.5281/zenodo.7778752 is a version DOI of concept 10.5281/zenodo.7391184. Annotations are shape meshes
  rather than label volumes.'
