notes: 'Zip listed with peek_archive: 8385 .nii.gz (RawMemb, RawNuc, SegCell per sample/time point), 35 csv, 18
  txt, 1 .mat. SegCell labels are automatic CShaper outputs (the paper validates them against manual annotation
  of separate Samples 02-04, which are not in this zip), so they are pseudo-labels, not manual ground truth. Voxel
  size 0.25 um isotropic is stated in the paper Methods for images resized for atlas generation (0.22 um for training/evaluation);
  enricher: RawMemb/RawNuc NIfTI headers state 0.25 um isotropic, matching the record (SegCell headers carry the
  1.0 default). Related but different record: figshare-27085657 (CTransformer data with manual-based labels); this
  record is the original CShaper release (Samples 04-20).'
