id: zenodo-12051853-cshaper-celegans-embryo-membrane
title: CShaper dataset - time-lapse membrane and nucleus images of 17 C. elegans embryos with CShaper cell segmentations
short_name: C. elegans embryo membrane cell masks (3D+t)
description: Time-lapse 3D confocal volumes of 17 wild-type C. elegans embryos (Samples 04-20, 4- to 350-cell stages,
  ~1.5 min interval) with mCherry membrane (RawMemb) and GFP nucleus (RawNuc) channels as NIfTI, plus per-cell instance
  segmentations (SegCell) produced by the CShaper pipeline, cell lineage / nucleus location files (CDSample*) and
  per-cell surface and volume tables. Hosted as the reused "CShaper Dataset.zip" in a Zenodo record that also holds
  shape-descriptor code and a MATLAB GUI.
