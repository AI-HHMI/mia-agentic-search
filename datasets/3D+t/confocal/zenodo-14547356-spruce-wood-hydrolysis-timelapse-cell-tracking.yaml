notes: 'One 17.0 GB zip (300 TIFF, 47.2 GB unzipped): hydrolysis and control datasets in triplicate, each
  with 25 hourly intensity stacks and 25 label stacks. Voxel size (0.6215, 0.6215, 0.3 um) is from the
  zip''s readme.txt. Labels are algorithmic (HydroTrack), not manually proofread. Enzyme loading is not
  stated in the Zenodo record. Same group and imaging protocol as the separate record zenodo-17234278
  (spruce hydrolysis with 15 and 30 FPU, AIMTrack segmentation), which is a different set of time-lapses.
  Checked: Zenodo record, zip listing and readme, full Data in Brief paper. The Zenodo record gives only
  the year 2025 as its date. enricher: size = the 17.0 GB zip (file listing); the extra file in Hydrolysis_dataset_1/Segmentations
  is a 4 KB macOS ._segmentation_12.tif resource fork, not a label.'
