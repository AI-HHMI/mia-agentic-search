title: 3D confocal time-lapses of spruce wood hydrolysis with tracked cell segmentations
short_name: Spruce wood hydrolysis cell tracking (confocal)
description: 'Six 24-hour 3D confocal autofluorescence time-lapse series (25 hourly stacks each, 512 x
  512 pixels) of 40 um cross sections of pretreated spruce (Picea abies) wood: three imaged during enzymatic
  hydrolysis and three controls without enzyme. Each time point has a cell-resolution label image in which
  every cell has a unique label that stays consistent over time, so cells can be identified and tracked.
  Labels were produced with the HydroTrack pipeline (watershed on the first stack, propagated through
  the series by image registration).'
