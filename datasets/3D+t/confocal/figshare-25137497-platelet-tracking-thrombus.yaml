title: 'Data for McGovern et al, 2024: Finding and Following: A deep learning-based pipeline for tracking platelets during thrombus formation in vivo and ex vivo'
short_name: Platelet tracking in thrombi (confocal)
description: Example data for the PlateSeg / platelet-tracking pipeline. Confocal z-stack time-lapses of mouse
  in vivo (mesenteric venule) and ex vivo (microfluidic, mouse and human blood) thrombus formation with a fraction
  of platelets fluorescently labelled, with ground-truth 3D platelet instance segmentations (training frames and
  multi-annotator validation volumes) and tracking image datasets, in OME-NGFF format.
