  notes: 'Zip indexes read by range requests (tools/peek_archive functions with a GET-based size check: the Figshare
    signed S3 URLs reject HEAD with 403 and expire after ~10 s, so tools/listing.py and probe.py --download-check on
    members failed). Shapes, dtypes, compression and scales from .zarray/.zattrs members. value_range from one sample
    each (raw chunk of train_TR67_Inj7_fr50_image_PL: uint16 0-60593, p1 99, p99 560; label chunk: 1760 IDs, 98% zero;
    HxV_21335_600is_f2_seg: int32, 40 IDs). OME-Zarr scales are negative in y and x (-0.504248), i.e. a flip in the
    transform; voxel size recorded as the absolute value. Labels: whole 33x512x512 frames, but only 17 frames in total.
    Size from the Figshare API file sizes (compressed zips). Direct download: both zips are usable direct files; the
    whole-dataset archive is finding-and-following-ome.zip, annotrack.zip is separate (https://ndownloader.figshare.com/files/45129829).'
