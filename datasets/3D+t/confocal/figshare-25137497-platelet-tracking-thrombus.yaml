  (segmentation/training_data, {exvivo,invivo}_example, tracking/) is taken from the record description only.
  Ground truth: proofread by four people for training (10 frames used) and by three experts for 3 validation
  thrombi (paper Methods). Voxel size is derived, not stated: 250 um field of view / 512 px = 488.28 nm in xy,
