notes: 'Landing page (bridges.monash.edu) unreachable (HTTP 503 at harvest, TLS failure at enrichment); details from the Figshare API,
  the zip index and the bioRxiv full text. Two files: finding-and-following-ome.zip (35,237,968,109 B) and annotrack.zip
  (183,579,667 B). Ground truth proofread by four people (training) and three experts (3 in vivo validation thrombi,
  GT_NS/PL/LS), paper Methods. enricher: voxel size 504.248x504.248x2000 nm from the OME-Zarr scale (0.504248 um xy,
  2 um z; was 488.28 derived from the 250 um field of view). enricher: channels null (1 in segmentation volumes, 4 in
  tracking time-lapses). enricher: n_items 23 = 17 labelled volumes + 6 unlabelled tracking time-lapses (zip index).
  organisms: Homo sapiens = tracking/human_exvivo/; Mus musculus = tracking/mouse_invivo/, mouse_exvivo/ and in vivo
  data; species of segmentation/exvivo_example and HxV_* training frames not stated. Labels cover single frames only.'
