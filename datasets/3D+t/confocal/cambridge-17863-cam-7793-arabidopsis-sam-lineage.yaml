notes: 'Contents per the README in PNAS.zip: plantX/processed_tiffs (acylYFP, clv3), segmentation_tiffs
  (one integer per cell, background 1), nuclear_segmentation_tiffs (BOAvoxel_tNN.tif, labels shared with
  cells; none for plants 1 and 18), tracking_data (mother : daughters, T to T+4 h), plantX_tiff_resolutions.txt.
  Paper relabels plants 1,2,4,13,15,18 as 1-6. enricher: voxel size stays null: it varies per time point
  (x=y 0.2196471 or 0.2396150 um, z 0.26 um, plus a per-time-point z-stretching factor) per plantX_tiff_resolutions.txt.
  Annotation source unknown: README says only "segmented processed tiffs using membrane data"; paper not
  open access. size_bytes now the exact zip size from the API (was 4.89e9 from the page). download_url
  now the direct API bitstream.'
