    URL (it ends in /content, taken for HDF5), so a scratch script read two members with tools.peek_archive.read_member
    + tifffile (8,298,651 B downloaded, deflated). acylYFP 20 h plant4: ImageJ TIFF ZYX 107x367x326 uint8,
