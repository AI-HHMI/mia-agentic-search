schema_version: '1.2'
id: zenodo-17234278-spruce-wood-enzymatic-hydrolysis-4d
title: 4D confocal time-lapses of spruce wood enzymatic hydrolysis with cell wall segmentations
short_name: Spruce wood hydrolysis 4D (confocal)
description: 'Nine 24-hour 3D confocal autofluorescence time-lapse series (hourly stacks, 512 x 512 pixels, 400 slices, 0.3
  um z-step) of 40 um microtome cross sections of pretreated spruce (Picea abies) wood: three control series without enzyme
  and three each incubated with a cellulolytic cocktail at 15 and 30 FPU/g biomass. Each time point has a cell wall segmentation
  (voxels of the same cell wall share a unique label) produced with the AIMTrack pipeline (watershed and thresholding, manually
  corrected on the first time point, then propagated through the time-lapse).'
