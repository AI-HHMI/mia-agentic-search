notes: 'One 24.4 GB zip (450 TIFF, 70.8 GB unzipped): 150 control files (3 series x 25 time points x intensity+segmentation)
  and 300 hydrolysis files (6 series x 25 x 2) under Control_dataset and Hydrolysis_dataset (15 and 30
  FPU). Labels are algorithmic (AIMTrack) with manual correction of the initial segmentation, then propagated,
  so errors may remain. The data paper gives only 512 x 512 pixels and a 0.3 um z-step. Different from
  the catalog''s inrae-m8fodi spruce 3D labels record (static stacks); this one is time-lapse during enzymatic
  degradation. Checked: Zenodo record and zip listing, full Data in Brief paper; the related Bioresource
  Technology article is not open access. enricher: voxel size 621.5 x 621.5 x 300 nm from the TIFF headers
  (XResolution 1.609 px/um, description unit=micrometer spacing=0.3; was null); size = the 24.4 GB zip
  (file listing).'
