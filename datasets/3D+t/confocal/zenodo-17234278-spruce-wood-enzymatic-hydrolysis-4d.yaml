notes: 'One 24.4 GB zip (450 TIFF, 70.8 GB unzipped): 150 control files (3 series x 25 time points x intensity+segmentation)
  and 300 hydrolysis files (6 series x 25 x 2) under Control_dataset and Hydrolysis_dataset (15 and 30 FPU). Labels are algorithmic
  (AIMTrack) with manual correction of the initial segmentation, then propagated, so errors may remain. In-plane pixel size
  is not stated in the data paper (only 512 x 512 pixels and a 0.3 um z-step), so the voxel size is left null (the z-step
  is 0.3 um). Different from the catalog''s inrae-m8fodi spruce 3D labels record (static stacks); this one is time-lapse during
  enzymatic degradation. Checked: Zenodo record and zip listing, full Data in Brief paper; the related Bioresource Technology
  article is not open access.'
