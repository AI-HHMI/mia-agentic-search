notes: 'Zenodo record: 14 files (15.9 GB): Fluo-N3DH-CE_01/02 (.h5, .xml, .mastodon), PH-li13-T4 (.h5,
  .tif, .xml, .mastodon), four .pth models. License text in the description is CC BY-NC-ND 4.0 (Zenodo
  metadata field: other-closed). PH: 504 timepoints, 20 min interval. Annotations: nuclei detected and
  linked with ELEPHANT (manual seeds + proofread predictions); PH 109 complete lineage trees; CE1/CE2
  annotated from timepoint 0 to 194/189. Overlaps in subject, not files, with Parhyale record zenodo-8252039.
  organisms: Parhyale hawaiensis = PH-li13-T4.*, Caenorhabditis elegans = Fluo-N3DH-CE_0*. enricher: voxel_size_nm
