notes: 'Zenodo API record lists 14 files (about 20 GB): Fluo-N3DH-CE_01/02 (.h5, .xml, .mastodon), PH-li13-T4 (.h5, .tif, .xml, .mastodon) and four .pth model files. License text in the description is CC BY-NC-ND 4.0 (the Zenodo metadata field says other-closed). voxel_size_nm is the Parhyale (PH) value from the paper Methods (0.31 x 0.31 x 2.48 um; 11 z sections, 20 min interval, 504 time points); CE1/CE2 voxel sizes were not stated in the sources read and differ (CTC Fluo-N3DH-CE, see the catalog entry for it). Annotations: PH nuclei detected and linked with the ELEPHANT semi-automated workflow and proofread (109 complete lineage trees); CE1/CE2 annotated from timepoint 0 to 194/189. Image files are HDF5 (BigDataViewer) plus one TIFF. Overlaps in subject, not in files, with the separate Parhyale segmentation record zenodo-8252039.'
