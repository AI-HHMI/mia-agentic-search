title: 'ELEPHANT supplementary data: Parhyale hawaiensis leg regeneration confocal time-lapse (PH) and C. elegans embryo (CE1, CE2) with nuclear tracking annotations'
short_name: Parhyale + C. elegans nuclei tracking (3D+t)
description: Image volumes and Mastodon nuclear tracking annotations from the ELEPHANT cell-tracking paper - a 1-week confocal time-lapse (504 time points, 20 min interval) of a regenerating Parhyale hawaiensis leg with H2B-mRFPRuby nuclei (109 validated lineage trees), and two C. elegans embryo nuclei sequences (CE1, CE2; Cell Tracking Challenge Fluo-N3DH-CE data) with detection and linking annotations. Also pretrained detection and flow models.
