title: Experimental and computational framework for a dynamic protein atlas of human cell division
short_name: Mitotic cell atlas landmark masks (confocal)
description: 4D confocal time-lapse images of dividing HeLa Kyoto cells expressing GFP-tagged mitotic
  proteins (28 proteins, ~499 cells retained), with FCS-calibrated intensities, automatically computed
  segmentation masks of the cell and chromosome landmarks, and protein concentration maps. Used to build
  a canonical 4D model of a human mitotic cell.
