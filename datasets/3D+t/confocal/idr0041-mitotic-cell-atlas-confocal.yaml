notes: 'Study file states 276 datasets, 75470 5D images (one file per time point, 31 z-slices; raw 256x256x31x3,
  masks 256x256x31x2), ~0.6 TB. n_items is that image count. Voxel size is from the paper Methods for the
  mitotic imaging (0.25 um xy, 0.75 um z, 90 s interval). Masks were produced by an automated MATLAB pipeline
  (chromosome thresholding, watershed cell boundary), not manual annotation. Format: IDR import source file
  is TIFF (TR1_W0001_P0002_T0028.tif for the example image, uint16), but the download route (Aspera/FTP/Globus)
  and the exact files served were not checked, so download_url is null and size_bytes is not set. Mask
  files were not seen in a file listing (annotations_verified false); mask existence is from the study
  description and paper. Paper full text via PMC summary only (Europe PMC reports not open access).'
