notes: 'Three zips (1-20, 21-40, 41-52), 88,756,971,171 B total per the Zenodo API; all three listed (60
  + 60 + 36 .mrc, 3 per Cell_NNN). Part of BioTISR (parent 10.5281/zenodo.13924483). Differs from the
  catalogued zenodo-13932988 record, which is a separate deposit of the same-named microtubule set (30.6
  GB, 53 cells; its notes state raw SIM inputs are in this record). No train/test split stated. n_items
  counts ROIs (52 per the zip names). Paper is CC BY-NC-ND; the Zenodo data record states CC-BY-4.0. enricher:
  x/y 61.2 nm (raw SIM pixel), COS-7 and 3xmEmerald-Ensconsin from the BioTISR supplement imaging_conditions.xlsx
  (3D MTs row); organism via Cellosaurus CVCL_0224 (was unset); z step not stated. Raw holds 15 SIM frames
  per plane, unlike the WF inputs of zenodo-13932988.'
