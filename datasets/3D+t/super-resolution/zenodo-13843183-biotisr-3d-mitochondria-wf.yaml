notes: 'Single zip, 38964.8 MB compressed, 180 .mrc files (peek_archive; 60 Cell_NNN folders in BioTISR_TOMM20_3D/ with RawSIMData_level_01.mrc, RawSIMData_level_02.mrc and SIM_gt.mrc). Part of the BioTISR dataset (parent 10.5281/zenodo.13924483); sibling 3D records cover F-actin and microtubules; this is the mitochondria wide-field set (a separate Zenodo record, 14000502, has the same layout with much larger RawSIMData files, 1.0-1.5 GB each). Zenodo record gives 3D-SIM (N,M,T)=(3,5,10) per ROI but no pixel/voxel size, cell line or mitochondrial marker for this record; the paper Methods list COS-7/HeLa/SUM159 cells and 2xmEmerald-Tomm20 (outer mitochondrial membrane) generally, not per dataset, so voxel_size_nm and organism are left unset (a parent-record supplement imaging_conditions.xlsx, not read in this run, may state them). Paper is CC BY-NC-ND; the Zenodo data record states CC-BY-4.0.'
