notes: 'Single zip (38.96 GB), 180 .mrc files: 60 Cell_NNN folders in BioTISR_TOMM20_3D/ with RawSIMData_level_01.mrc, RawSIMData_level_02.mrc (wide-field inputs, two excitation levels) and SIM_gt.mrc (3D-SIM target). Part of the BioTISR dataset (parent 10.5281/zenodo.13924483); sibling records cover 3D F-actin and microtubules. Paper is CC BY-NC-ND; the Zenodo data record states CC-BY-4.0. enricher: voxel size x/y 61.2 nm from imaging_conditions.xlsx in the parent record supplementary zip (Pixel size (raw SIM image) 61.2 nm, upscaling factor 2, so SIM_gt is 30.6 nm); z step not stated (was null). enricher: organism Chlorocebus aethiops from the same table (sample COS-7, label 2xmEmerald-Tomm20) (was empty).'
