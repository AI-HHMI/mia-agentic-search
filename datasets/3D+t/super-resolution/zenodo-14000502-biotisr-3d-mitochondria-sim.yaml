description: Paired raw 3D-SIM input stacks (two excitation levels) and reconstructed 3D-SIM ground-truth volumes of mitochondria
  (outer mitochondrial membrane) for training and evaluating 3D time-lapse super-resolution and SIM-reconstruction networks.
  Cell_NNN folders each hold RawSIMData_level_01.mrc, RawSIMData_level_02.mrc and SIM_gt.mrc. The 3D mitochondria part of
  the BioTISR dataset, acquired on a home-built Multi-SIM system.
