notes: 'Three zips (36.9 + 34.8 + 39.0 GB; peek_archive on all three): 180 .mrc files as Cell_NNN/{RawSIMData_level_01,RawSIMData_level_02,SIM_gt}.mrc
  for 60 cells (Cell_001-020, 021-040, 041-060). Sibling of catalogued BioTISR records (3D F-actin SIM zenodo-13994464, 3D
  microtubules, 3D WF mitochondria zenodo-13843183); this is the 3D-SIM mitochondria part (outer mitochondrial membrane per
  record description) and is a different record from the 3D WF mitochondria one. Parent: 10.5281/zenodo.13924483. Voxel size,
  cell line and organism for the mitochondria data are not stated on the Zenodo record or in the paper Methods (checked both);
  paper states COS-7 only for the F-actin dataset. Inputs/targets pairing inferred from the file names in the zip listing;
  MRC headers read by the enricher (technical.notes). enricher: download_url -> record page (3 zips).'
