notes: 'Single zip, 22210.3 MB compressed, 150 .mrc files (peek_archive): 50 Cell_NNN folders in BioTISR_Lifeact_3D/
  with RawSIMData_level_01.mrc, RawSIMData_level_02.mrc (about 42-63 MB each) and SIM_gt.mrc (about 335-503
  MB). Part of the BioTISR dataset (parent 10.5281/zenodo.13924483); the 2D sets are the existing record
  zenodo-14760518. A separate record (zenodo.org/records/13994464, MIT license) holds the full 3D F-actin
  raw data in three zips; this record holds the wide-field (averaged) inputs. The paper''s data availability
  points to Zenodo 10.5281/zenodo.13924483. enricher: voxel size x/y 61.2 nm (z unstated) and COS-7 (Chlorocebus
  aethiops) from parent record imaging_conditions.xlsx (were null); MRC sections are z x 10 timepoints,
  so dimensionality 3D+t (was 3D; parent: "3D time-lapse image pairs").'
