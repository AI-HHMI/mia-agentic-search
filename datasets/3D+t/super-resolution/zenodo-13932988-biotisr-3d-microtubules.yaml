notes: 'Single zip, 30570.1 MB compressed, 159 .mrc files (peek_archive; 53 Cell_NNN folders in BioTISR_MT_3D/ with RawSIMData_level_01.mrc,
  RawSIMData_level_02.mrc and SIM_gt.mrc). Part of the BioTISR dataset (parent 10.5281/zenodo.13924483); sibling 3D records
  cover F-actin (wide-field) and mitochondria; this one is the microtubule set. Zenodo record gives 3D-SIM (N,M,T)=(3,5,10)
  per ROI but no pixel/voxel size, cell line or microtubule marker for this record; the paper Methods list COS-7/HeLa/SUM159
  cells and 3xmEmerald-Ensconsin generally, not per dataset, so voxel_size_nm and organism are left unset (a parent-record
  supplement imaging_conditions.xlsx, not read in this run, may state them). Paper is CC BY-NC-ND; the Zenodo data record
  states CC-BY-4.0. enricher: x/y 61.2 nm (raw) and COS-7 / 3xmEmerald-Ensconsin from the parent record imaging_conditions.xlsx
  (GT upscaling 2x); organism Chlorocebus aethiops via Cellosaurus CVCL_0224 (was unset); z step not stated.'
