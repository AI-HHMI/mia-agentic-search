  notes: 'Listing: DataverseNO native API (dataset latestVersion files), 107 files, 177,821,826,241 B
    exact; tools/listing.py does not read Dataverse (returned the DOI as one file), hence size_source
    page-stated. Read 3 OMX acquisition logs (186596, 186579, 186577): pixel size (um) 0.08 0.08 0.25
    / 0.08 0.08 0.5 / 0.08 0.08 0.25; 60X objective; 1024 x 1024 px. probe.py and peek_archive.py fail
    on the api/access/datafile URLs (303 to a presigned S3 URL on uit-dataverseno-prod01.s3-oslo.educloud.no),
    though probe --download-check gets 206 with ranges. Download: files are direct (api/access/datafile/<id>),
    but dataverse.no is not on the TensorSwitch allowlist and the raw data are DeltaVision .dv / zips
    of them, which TensorSwitch does not read. Voxel size: x = y = 80 nm in every log read; z 250 or 500
    nm by folder, so z null. Second pass (requests script, range reads through the redirect, 14 MB in
    all): DV header + 4 planes of PRJ .dv 186569 (1024x1024, 160 sections = 4 waves x 40 t, dx 0.08 um,
    values 41-1358; plane 3 = brightfield 293-1346), zip central directory + member start of full3D 186595,
    TIFF header + page 0 of 186588. Conflict: the gluc 005 header gives 5 planes at dz 0.5 um, paper Table
    4 gives 8 planes at 0.25 um for that series; another reason z stays null.'
