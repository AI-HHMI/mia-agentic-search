short_name: H9c2 mitochondria 3D+t, stable line + brightfield
description: 3D fluorescence time-lapses of rat H9c2 cardiomyoblasts stably expressing the mCherry-eGFP
  double tag on the outer mitochondrial membrane, partly with LysoTracker Deep Red, and in several folders
  with a channel-aligned label-free brightfield/transmission channel provided for machine learning (virtual
  labelling of mitochondria and lysosomes). Sibling of the transient-transfection dataset HQDBYF from
  the same study.
