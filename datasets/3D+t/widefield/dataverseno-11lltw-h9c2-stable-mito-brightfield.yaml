notes: 'From the DataverseNO API record (107 files, 177.8 GB, CC0), the ReadMe and the Scientific Data paper (Europe PMC full
  text; Table 4 lists 30 series). Differs from HQDBYF (open PR; transient transfection, endosome labels): 11LLTW is the stable
  double-tag line the paper recommends for training virtual labelling. Brightfield (channel 4, DIC illumination without prism)
  exists only in the *_trans folders; the CCCP and LTDR folders are fluorescence only. Pixel 80 nm xy; z is 250 nm in the _trans
  folders and 500 nm elsewhere (Table 4), so z=250 is the finest value. Files: DeltaVision .dv (some zipped), TIFF projections,
  AVI; zips not opened. No masks: the training signal is the fluorescence/brightfield pairing (restoration-pairs).'
