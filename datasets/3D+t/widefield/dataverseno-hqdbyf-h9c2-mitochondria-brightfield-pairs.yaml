notes: 'Facts come from the DataverseNO API record (65 files, 725.8 GB) and the Scientific Data paper (Europe PMC full text).
  The listing has 36 DeltaVision .dv files, 12 AVI movies, 12 logs and readme files, in folders endo_mCh-mito, endo_lyso_eGFP-mito
  (fluorescence only) and the same names with _trans (fluorescence plus transmission), each with WF, decon3D, decon_PRJ and
  decon_PRJ_AVI subfolders. The paper gives 80 nm xy pixels and 250 or 500 nm z spacing. Transmission images were provided
  for virtual labelling; there are no masks. A companion dataset (11LLTW, stable double-tagged cells) exists and was not recorded
  here. The paper mentions TIFF or DV files, but the listing shows DV and AVI only. enricher: voxel z 250 nm (was null): all
  12 series'' .log files and 9 .dv headers state 0.08 0.08 0.25 um; no file found at 500 nm. Transmission channel only in
  the *_trans folders (8 of 12 series).'
