description: 3D fluorescence time-lapses of rat H9c2 cardiomyoblasts with labelled outer mitochondrial membrane (mCherry or
  eGFP), endosomes (mCLING-ATTO647n) and in part acidic vesicles (LysoTracker), with a subset also imaged in label-free
  transmission mode for virtual-labelling. Channel-aligned widefield and deconvolved volumes, projections and AVI movies.
