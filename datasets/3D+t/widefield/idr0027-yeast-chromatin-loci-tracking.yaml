notes: 'Files are DeltaVision .dv (not in the format enum, so other) plus .log files; ~30.3 GB estimated from the FTP HTTP
  index (rounded sizes), 343 files in RawVideos, ProcessedVideos, New100kbVideos and Colocalising folders. Z step 250 nm (21
  planes, 5 um stack) per the paper Methods, so voxel_size_nm is left null; xy pixel size is not stated on the IDR page, in
  the paper Methods or in the file listing (not read from .dv headers). Tracking was done in Imaris with manual offset calculation
  in Excel per the paper, so annotation source is left unknown. Tracked points are scientific measurements of two loci rather
  than a general tracking benchmark: modest training signal. enricher: voxel size 80x80x250 nm from IDR image metadata (was
  null).'
