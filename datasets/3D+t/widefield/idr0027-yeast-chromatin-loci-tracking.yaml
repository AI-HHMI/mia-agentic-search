  division
short_name: Yeast chromatin loci tracking (3D+t widefield)
description: Two-colour live-cell 3D time-lapse movies (OMX Blaze, deconvolved) of two fluorescently tagged syntenic gene
  loci in Saccharomyces cerevisiae strains with different genomic separations (colocalising control and roughly 7 separation
  classes), with the tracked x/y/z coordinates of the red and green foci per time point (AllData.csv).
