id: figshare-24968724-linajea-zebrafish-embryo-tracks
title: Zebrafish data for whole-embryo lineage reconstruction with linajea
short_name: Zebrafish embryo cell tracking (light-sheet)
description: 'Ground-truth cell tracks, trained linajea networks and predicted tracks for a whole-embryo
  3D+t light-sheet recording of a zebrafish embryo light-sheet recording (dataset 160328), two registered
  camera views kept as two channels, resampled to isotropic voxels. Manual annotations are sparse (columns
  time, z, y, x, cell_id, parent_id, track_id) but each annotated cell was traced through its whole lineage;
  files: tracks_side_1.txt and tracks_side_2.txt (sparse, whole-lineage tracks split by side of the embryo
  midline), discarded.txt, full_frame_divisions.txt (division points at time points 50-350, evaluation
  only). Used to train a U-Net cell-indicator / movement network for lineage reconstruction.'
