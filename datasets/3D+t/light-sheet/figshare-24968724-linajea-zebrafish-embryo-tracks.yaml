notes: 'Image data is not on figshare: it is 160328_zebrafish_resampled.zarr.zip (Zarr v3, 2 channels,
  resampled isotropic with a non-zero offset stored in OME metadata) on Dropbox linked from the figshare
  description; the original Wan et al. 2019 n5 file was replaced by this reproduction because of data
  corruption. The Dropbox link was not opened in this run, so image format, size and voxel size were not
  checked; the figshare page and paper text do not state voxel size for this recording (details are in
  the paper Supplementary Note 1, not read). Original images: Wan et al. 2019 (doi 10.1016/j.cell.2019.08.039).
  Figshare files: gt_tracks.zip, predicted_tracks.zip (TGMM baseline and linajea results), trained_networks.zip;
  contents taken from the figshare description, archives not listed. License BSD 3-Clause is the figshare
  license field. This is one of three sibling figshare records (Drosophila 24937092, zebrafish 24968724,
  mouse 24768798) from the same paper.'
