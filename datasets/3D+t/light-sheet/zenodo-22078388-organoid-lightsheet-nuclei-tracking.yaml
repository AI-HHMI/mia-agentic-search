notes: 'Voxel size from record description (z 2.0 um, y/x 0.26 um at full resolution). Single movie (n_items 1);
  label images are sparse in later timepoints (only tracked objects). Per the source paper Methods, nuclei labels
  were network-predicted from partial and full manual annotations with tracking seeded in Mastodon, hence source
  mixed; the Zenodo record does not state the annotation procedure. Zip sizes: full 39.8 GB, small ~2.4 GB, mini
  0.24 GB; download_url is the mini variant. Label arrays were not individually listed (peek shows OME-Zarr chunk
  files), so annotations_verified is false. enricher: size_bytes = complete Zenodo listing of all 8 files (7 zip
  variants, 48.3 GB; was the full zip only). Label arrays (labels/nucleus, cell, lumen) and tracks/nucleus.geff
  seen in the mini zip.'
