description: 'Light-sheet time-lapse (667 frames, 2 channels: H2B nuclei and mem9 membrane) of a mouse intestinal
  organoid in OME-Zarr v0.5, with raw and deconvolved volumes, 4D instance label images for nuclei and cells, lumen/epithelium
  semantic labels and a nuclear lineage tree (GEFF). Also released as subsampled mini/small variants.'
