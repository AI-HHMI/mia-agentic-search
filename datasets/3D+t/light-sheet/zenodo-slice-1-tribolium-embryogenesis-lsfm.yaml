schema_version: '1.2'
id: zenodo-slice-1-tribolium-embryogenesis-lsfm
title: Fifty high-content light sheet fluorescence microscopy datasets of Tribolium castaneum embryogenesis
  (SLICE-1)
short_name: Tribolium embryogenesis live imaging (light-sheet)
description: SLICE-1, the Systematic Live Imaging Collection of Embryogenesis, holds fifty light sheet
  (DSLM) time-lapse datasets of Tribolium castaneum embryos from five transgenic lines expressing mEmerald-labelled
  nanobodies (cytokeratin-8, histone H2A/H2B, PCNA, lamin A/C, actin) plus control lines; embryos were
  imaged along four directions at up to 301 time points (30 min interval), 200 days of recording and 5.7
  million images in total. Each dataset ships as ZIP-compressed TIFF t-stacks with a metadata spreadsheet
  and overview movies. The paper annotates the onset time points of two to five embryogenetic events per
  dataset and states the collection serves as a training resource for image processing, machine learning
  and neural networks; no segmentation or tracking labels are provided.
