notes: 'The datasets are spread over 86 Zenodo records in the community zenodo.org/communities/slice-1, one to four ZIP
  parts per dataset (e.g. record 17539235, DS0049 part 2: 30.4 GB; concept DOI 10.5281/zenodo.14725315 for that record
  only). The paper states 2.7 TB in total; a summed exact size was not computed, so size_bytes is null. Voxel pitch
  0.645 x 0.645 x 2.58 um from the paper Methods. Usable as unlabeled time-lapse data (the paper names it a training
  resource for machine learning); the only labels are per-dataset event onset time points (Table 3), so confidence is
  moderate. Whether the metadata xlsx contains those annotations was not opened. Checked: paper full text (Europe PMC),
  Nature article page, Zenodo community and one record API.'
