short_name: Mouse organoid nuclei and membrane meshes (dOPM)
description: Two-channel (SiR-DNA nuclei, tdTomato membrane) 3D time-lapse movies of six mouse mammary organoids imaged
  for 24 h with dual-view oblique plane (light-sheet) microscopy, with manually created and corrected nucleus and cell
  membrane segmentation meshes, labelled mosaic images for seen and unseen validation frames, trained models, and a
  spinning-disk mouse ES cell example.
