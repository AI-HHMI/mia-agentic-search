notes: 'Files per readme.md and API (6.68 GB): binned-images (6 movies, half resolution, 8-bit), meshes
  (nucleus and membrane, six movies), seen-data (Tile_2 frames 3-5, 21-25, 133), unseen-data (frame t45
  of Tiles 1-6), 4 models, spinning-disk example, tutorial. n_items = 15 manually segmented 3D frames
  (9 seen + 6 unseen) per the preprint; the whole movies carry network-assisted segmentations that were
  hand-corrected (source mixed). dOPM voxel size not found in readme or preprint text; the mESC spinning-disk
  example is 244 nm xy / 2 um z. Preprint read, not the journal version. Seen = training, unseen = validation,
  no split file. enricher: seen/unseen TIFFs are ImageJ-calibrated 0.17381 um in x, y and z (isotropic
  173.8 nm); binned movies are half resolution, so voxel_size_nm stays null (subsets differ).'
