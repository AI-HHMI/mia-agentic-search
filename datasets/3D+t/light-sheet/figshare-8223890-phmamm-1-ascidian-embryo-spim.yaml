  notes: 'Figshare listing: 9 tar.gz, 79,451,705,070 B, complete. tar.gz has no index, so only the start
    of each v2 fuse/post archive was read (300,000 B per archive, stream-decompressed with a scratch script):
    first members Phmamm-1-v2_intrareg_fuse_1/..._fuse_t001.nii.gz (140,079,572 B) and Phmamm-1-v2_intrareg_fuse_2/..._fuse_t099.nii.gz
    (157,655,278 B) and Phmamm-1-v2_intrareg_post_t163.nii.gz (4,065,687 B). All NIfTI-1 headers: dim
    x,y,z = 612,578,707 (axes listed slowest first), datatype 512 (uint16), pixdim 0.3,0.3,0.3 with xyzt_units
    2 (mm). Voxel size not set: 0.3 mm is implausible for a ~150 um embryo, so the header unit is wrong
    and no source states the fused voxel size; checked the NIfTI headers, the Figshare description, the
    Guignard 2018 bioRxiv full text (fusion gives isotropic resolution, value only in the supplement)
    and the Biasuz 2025 bioRxiv (0.195 x 0.195 x 1 um raw acquisition of newer embryos). No sample: tar.gz
    members cannot be fetched one by one; the archives are direct (usable, range requests) but whole.
    No single archive holds the dataset, so data.download_url stays the landing page. v2 fused images
    are split over two archives (fuse_1 from t001, fuse_2 from t099); v1 also has a raw.tar.gz (18.3 GB,
    not opened).'
