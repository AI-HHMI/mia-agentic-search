title: 'Phmamm-1: Phallusia mammillata embryo live SPIM imaging with whole-cell segmentation'
short_name: Ascidian embryo Phmamm-1 cell segmentation (SPIM)
description: Live multiview light-sheet (MuVi-SPIM) imaging of one wild-type Phallusia mammillata embryo
  with PH-GFP-labelled cell membranes, 64-cell stage (St. 8) to initial tailbud (St. 17), time points
  1 to 180. Fused four-angle images, whole-cell segmentations from the ASTEC pipeline at every time point,
  surface meshes where provided, and per-cell geometric and naming properties. Version 1 is from the original
  ascidian atlas deposit; version 2 is temporally registered with cell names refined using the ASCIDIAN
  package.
