schema_version: '1.2'
id: figshare-24768798-linajea-mouse-embryo-tracks
title: Mouse data for whole-embryo lineage reconstruction with linajea
short_name: Mouse embryo cell tracking (light-sheet)
description: 'Ground-truth cell tracks, trained linajea networks and predicted tracks for a whole-embryo
  3D+t light-sheet recording of a mouse embryo light-sheet recording (dataset 140521), post-implantation
  development, about 4.7 TB at full size per the paper. Manual annotations are sparse (columns time, z,
  y, x, cell_id, parent_id, track_id) but each annotated cell was traced through its whole lineage; files:
  tracks.txt (sparse, whole-lineage tracks), division_tracks.txt (~5-frame tracks around divisions), daughter_cells.txt,
  full_frame_divisions.txt (division points at time points 120, 240 and 360, evaluation only). Used to
  train a U-Net cell-indicator / movement network for lineage reconstruction.'
