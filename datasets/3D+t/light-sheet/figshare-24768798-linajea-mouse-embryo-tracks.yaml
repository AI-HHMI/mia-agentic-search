notes: 'Image data is not on figshare: it is 140521_mouse.tar.gz (n5/zarr) on Dropbox linked from the
  figshare description; the same images were originally published by McDole et al. 2018 and can be downloaded
  as .klb from IDR project-502. Check for overlap with any existing McDole/IDR record. The Dropbox link
  was not opened in this run, so image format, size and voxel size were not checked; the figshare page
  and paper text do not state voxel size for this recording (details are in the paper Supplementary Note
  1, not read). Original images: McDole et al. 2018 (doi 10.1016/j.cell.2018.09.031; also in IDR project-502
  as .klb). Figshare files: gt_tracks.zip, predicted_tracks.zip (TGMM baseline and linajea results), trained_networks.zip;
  contents taken from the figshare description, archives not listed. License BSD 3-Clause is the figshare
  license field. This is one of three sibling figshare records (Drosophila 24937092, zebrafish 24968724,
  mouse 24768798) from the same paper.'
