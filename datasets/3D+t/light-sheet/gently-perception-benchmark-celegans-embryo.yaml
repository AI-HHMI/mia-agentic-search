notes: 'Annotations are embryo-level stage-transition timepoints (classification), only for embryos 1-8;
  embryos 9-105 are unlabelled and their predicted_stages/predictions.jsonl are model output, not labels.
  No associated paper found. n_items counts timepoints (1,474 annotated + 11,447 unannotated). enricher:
  annotations.source mixed: early-pretzel transitions human-annotated (Dec 2024); embryo_1 annotations.json
  says hatched transitions were added March 2026 from VLM classification breakpoints. enricher: channels
  1 (single histone marker, one view per file); size from full HF file listing; annotations verified (annotations.json
  read). enricher: voxel size still not found (card, API, JSON sidecars, web search).'
