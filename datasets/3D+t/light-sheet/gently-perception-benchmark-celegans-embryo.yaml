title: 'Gently Perception Agent Benchmark: C. elegans embryo light-sheet timelapses with stage labels'
short_name: C. elegans embryo stage benchmark (light-sheet)
description: Dual-view selective plane illumination (diSPIM, view A) timelapses of histone-labelled C.
  elegans embryos. Embryos 1-8 (1,474 3D timepoints) carry human-annotated developmental stage transitions
  (early, bean, comma, 1.5-fold, 2-fold, pretzel, hatched) for evaluating perception agents; embryos 9-105
  (11,447 timepoints) are an unannotated corpus.
