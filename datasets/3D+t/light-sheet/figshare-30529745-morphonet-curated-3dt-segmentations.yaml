notes: 'Source: figshare API record (landing page gives 403), README files, peek_archive of the five dataset zips, and the
  eLife paper. Each folder holds published/RAW and published/SEG plus curated/SEG (Arabidopsis 41 tiff; C. elegans 368
  tif; Tribolium 3 tif plus a curated tiff; Patiria 2 tif plus curated; Phallusia 189 nii). The paper calls them
  previously published datasets (the benchmark README cites the Cell Tracking Challenge for its C. elegans and
  Tribolium sets; Phallusia files are named Astec-pm9), re-released with curated segmentations, so raw images may overlap other records. The curated
  segmentations are the new part. The remaining files are benchmark datasets, Cellpose models, videos and standalone
  software; size_bytes sums dataset zips and benchmarks. Voxel sizes are per dataset and were not read; null.'
