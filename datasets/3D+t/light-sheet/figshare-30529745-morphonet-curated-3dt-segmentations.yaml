title: MorphoNet 2.0 curated 3D and 3D+t embryo and plant segmentations
short_name: Curated 3D+t cell segmentations (embryos, plant)
description: Data of the MorphoNet 2.0 paper for segmentation curation. Five published fluorescence datasets (Tribolium
  nuclei, Patiria miniata, Arabidopsis shoot meristem, C. elegans nuclei, Phallusia mammillata), each with the raw intensity
  images, the published ground truth or segmentations and an expert-curated segmentation, plus four benchmark datasets,
  Cellpose models, demo videos and the MorphoNet standalone application.
