notes: 'Source: figshare API record (landing page 403), READMEs, zip listings and the eLife paper. Each dataset zip holds
  published/RAW, published/SEG and curated/SEG. C. elegans and Tribolium come from the Cell Tracking Challenge, Phallusia
  from ASTEC (Guignard 2020), Arabidopsis from Willis 2016, Patiria from Barone 2024, so raw images may overlap other records;
  the curated segmentations are new. organisms: one per dataset folder (folder name = species). enricher: voxel sizes differ
  per subset, so voxel_size_nm stays null: C. elegans 90x90x1000 nm (OME-XML of RAW and published SEG); Arabidopsis curated
  210 nm isotropic and Patiria curated 1000 nm isotropic (OME-XML; Patiria README: resized to homogeneous XYZ scale); Phallusia
  NIfTI header says 0.3 mm isotropic (implausible unit, not used). enricher: size = all files except the 11.7 GB standalone
  app zips (file listing).'
