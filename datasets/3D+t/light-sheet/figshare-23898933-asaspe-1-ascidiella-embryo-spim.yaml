description: Live Luxendo MuVi-SPIM light-sheet imaging of one Ascidiella aspersa (ascidian) embryo with
  PH-tdTomato labelled cell membranes, 32-cell stage to mid neurula (125 time points, one every 2 min).
  Fused and temporally registered images, ASTEC whole-cell segmentations with manual correction, and per-cell
  geometry, lineage and names.
