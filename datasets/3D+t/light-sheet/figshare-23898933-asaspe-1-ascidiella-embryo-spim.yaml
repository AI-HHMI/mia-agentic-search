notes: 'Three tar.gz archives on Figshare (6.28 GB: fused images, segmented images, properties). Per the
  bioRxiv paper (Biasuz 2025, Methods), ASTEC whole-cell segmentation of this embryo had its over-/under-segmentation
  errors manually corrected in MorphoNet, hence proofread. The paper gives 0.195 x 0.195 x 1 um for raw
  acquisition; the fused isotropic voxel size in these archives is not stated, so null. One embryo of
  a series (Phmamm-1 to 16, Asaspe-1, U0126-treated) with separate Figshare records; Phmamm-9 is a separate
  record. enricher: annotations_verified true and channels 1 from the first NIfTI headers of the post/fuse
  archives; download_url = landing page (several archives).'
