  notes: 'Figshare listing: 3 tar.gz, 6,277,209,813 B, complete. tar.gz has no index, so only the first
    300,000 B of the post and fuse archives were read (stream-decompressed with a scratch script): first
    members Asaspe-1-v3_intrareg_post/Asaspe-1-v3_intrareg_post_t095.nii.gz (2,304,045 B) and Asaspe-1-v3_intrareg_fuse/Asaspe-1-v3_intrareg_fuse_t063.nii.gz
    (50,180,291 B). Both NIfTI-1 headers: dim x,y,z = 609,530,508 (axes listed slowest first), datatype
    512 (uint16), pixdim 0.4 isotropic; xyzt_units 2 (mm) on the fuse file, 0 (unknown) on the post file.
    Voxel size not set: no source states the fused voxel size and the header unit is missing or mm (0.4
    mm is implausible for a ~150 um embryo; 0.4 um would fit); checked the NIfTI headers, the Figshare
    description, the Biasuz 2025 bioRxiv full text (raw 0.195 x 0.195 x 1 um, fused isotropic, size not
    given), the ASTEC fusion docs (target_resolution examples without unit). No sample: tar.gz members
    cannot be fetched one by one; the archives are direct (usable, range requests) but whole.'
