title: 3D+time nuclei tracking dataset of diSPIM lightsheet fluorescence microscopy time series of C. elegans embryos
short_name: C. elegans embryo nuclei tracking (diSPIM)
description: Three fused and deconvolved diSPIM light-sheet time series of C. elegans embryos (350-400 frames,
  1 min interval, 0.1625 um isotropic voxels), each with curated nuclei tracks and lineage trees (StarryNite,
  MaMuT XML and CSV) tracked for at least 330 frames, plus a rough 2D foreground mask per sample. Used to
  develop a weakly-supervised tracking method for whole-embryo C. elegans lineages.
