notes: 'nih_ls.zip (27.0 GB, 2237 members) listed with peek_archive: 1150 .tif (one 3D uint8 file per
  frame, per the README), 1072 extension-less StarryNite nuclei files, 6 MaMuT .xml, 6 .txt, 3 .hdf. n_items
  counts the TIFF frames. Voxel size, frame rate, sample sizes, tracking procedure (StarryNite + AceTree,
  manual curation with quality controls) and formats come from the Zenodo README. Tracks are only reliable
  for the first ~270 frames (embryo twitching later); the README says later frames should be used with
  caution. The MICCAI 2022 paper (Hirsch et al.) was not found in Europe PMC and was not read; the Nature
  2021 paper (read via Europe PMC) does not describe the fluorescent label of these three embryos (strain/marker
  not confirmed, so labels_stains is empty). Number of annotated nuclei not stated. enricher: size_bytes
  = Zenodo listing (zip + README; was the zip alone).'
