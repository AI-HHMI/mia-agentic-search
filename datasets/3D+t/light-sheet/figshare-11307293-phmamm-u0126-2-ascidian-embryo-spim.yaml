short_name: U0126-treated ascidian embryo 2 (SPIM)
description: Live multiview light-sheet (MuVi-SPIM) imaging of one Phallusia mammillata embryo treated
  with the MEK inhibitor U0126 (6 uM from the 16-cell stage), membranes labelled with PH-tdTomato and
  ERK-KTR-mClover biosensor, 44-cell stage (St. 7) to early gastrula (St. 11), time points 30 to 79. Fused
  images, whole-cell segmentations from the ASTEC pipeline at every time point, and per-cell geometric
  and naming properties.
