  notes: 'Figshare listing: 6 tar.gz, 7,858,979,901 B, complete. tar.gz has no index, so only the start
    of each v3 fuse/post archive was read (300,000 B per archive, stream-decompressed with a scratch script):
    first members Phmamm-U0126-2-v3_intrareg_fuse_t045.nii.gz (13,872,313 B) and Phmamm-U0126-2-v3_intrareg_post_t076.nii.gz
    (657,728 B). All NIfTI-1 headers: dim x,y,z = 381,282,380 (axes listed slowest first), datatype 512
    (uint16), pixdim 0.6,0.6,0.6 with xyzt_units 2 (mm). Voxel size not set: 0.6 mm is implausible for
    a ~150 um embryo, so the header unit is wrong and no source states the fused voxel size; checked the
    NIfTI headers, the Figshare description, the Guignard 2018 bioRxiv full text (fusion gives isotropic
    resolution, value only in the supplement) and the Biasuz 2025 bioRxiv (0.195 x 0.195 x 1 um raw acquisition
    of newer embryos). No sample: tar.gz members cannot be fetched one by one; the archives are direct
    (usable, range requests) but whole. No single archive holds the dataset, so data.download_url stays
    the landing page. This deposit''s newest files are v3 (not v2); their pixdim (0.6) is twice that of
    the other embryos'' v2 files.'
