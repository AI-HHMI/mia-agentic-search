notes: 'Pharmacologically perturbed (U0126) embryo, so it differs from the wild-type Phmamm-1/3/4/5/7/8/9/16
  deposits; a separate Figshare record with its own images and segmentations. Figshare lists 6 tar.gz
  archives (7.9 GB: v1 fuse/post/properties, v3 intrareg fuse/post/properties). n_items = time points
  from the stated range (Tp30-Tp79), not a file count. Segmentation comes from the ASTEC pipeline; the
  bioRxiv paper does not state how this embryo''s segmentation was curated, so annotations.source is unknown.
  Voxel size null: the paper''s 0.195 x 0.195 x 1 um is for the newer Phmamm-16 embryo only; the fused
  voxel size here is not stated. v1 uses .inr (not a listed format), v3 .nii. enricher: annotations_verified
  true (v3 post archive''s first member is a uint16 NIfTI label volume).'
