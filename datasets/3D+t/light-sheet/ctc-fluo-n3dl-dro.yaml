notes: 'Training zip listed with tools/listing.py (exact zip size): 01/ 50 tif; 01_GT/SEG 20 tif; 01_GT/TRA
  50 tif + man_track.txt; 02/ 50 tif; 02_GT/SEG 20 tif; 02_GT/TRA (no silver truth in the training zip).
  Pixel/voxel size, microscope, time step and cell type come from the CTC dataset table; organism and
  sample from that table and the Nature Methods paper. Terms are custom: CTC-related use needs no consent,
  non-CTC scientific use requires organizer permission, commercial use needs organizer and data-provider
  permission, cloning is prohibited, and the Nature Methods paper must be cited. Test set annotations
  are secret. Gold-truth segmentation covers only a subset of frames (annotations.coverage partial). Well-known
  benchmark; confidence kept moderate given the permission-based terms. Differs from other CTC records
  (e.g. ctc-fluo-c3dh-a549, ctc-fluo-n3dh-ce): a separate CTC dataset with its own cells/organism, microscope
  and zip.'
