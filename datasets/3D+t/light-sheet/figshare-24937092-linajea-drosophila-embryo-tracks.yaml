notes: 'Image data is not on figshare: it is a 120828_drosophila_sequence.tar.gz (n5/zarr) on Dropbox
  linked from the figshare description, and was originally published in Amat et al. 2014. The Dropbox
  link was not opened in this run, so image format, size and voxel size were not checked; the figshare
  page and paper text do not state voxel size for this recording (details are in the paper Supplementary
  Note 1, not read). Original images: Amat et al. 2014 (doi 10.1038/nmeth.3036). Figshare files: gt_tracks.zip,
  predicted_tracks.zip (TGMM baseline and linajea results), trained_networks.zip; contents taken from
  the figshare description, archives not listed. License BSD 3-Clause is the figshare license field. This
  is one of three sibling figshare records (Drosophila 24937092, zebrafish 24968724, mouse 24768798) from
  the same paper.'
