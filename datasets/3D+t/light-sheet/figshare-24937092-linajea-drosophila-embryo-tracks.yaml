schema_version: '1.2'
id: figshare-24937092-linajea-drosophila-embryo-tracks
title: Drosophila data for whole-embryo lineage reconstruction with linajea
short_name: Drosophila embryo cell tracking (light-sheet)
description: 'Ground-truth cell tracks, trained linajea networks and predicted tracks for a whole-embryo
  3D+t light-sheet recording of a drosophila embryo light-sheet recording (dataset 120828), fused, single
  fluorescent nuclear channel. Manual annotations are sparse (columns time, z, y, x, cell_id, parent_id,
  track_id) but each annotated cell was traced through its whole lineage; files: tracks.txt (sparse, whole-lineage
  tracks), tracks_side_1.txt, tracks_side_2.txt, full_frame_divisions.txt (division tracks around time
  points 150 and 300, evaluation only). Used to train a U-Net cell-indicator / movement network for lineage
  reconstruction.'
