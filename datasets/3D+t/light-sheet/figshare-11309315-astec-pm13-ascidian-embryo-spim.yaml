title: 'Astec-Pm13: wild-type Phallusia mammillata embryo live SPIM imaging with whole-cell segmentation
  (stages 6-12)'
short_name: Ascidian embryo Pm13 cell segmentation (SPIM)
description: Live multiview light-sheet (MuVi-SPIM) imaging of one wild-type Phallusia mammillata embryo
  with PH-tdTomato-labelled cell membranes (KTR-Clover also injected), about 3 hours from the 25-cell
  stage (Tp 0, about St. 6) to the 231-cell mid gastrula (Tp 89, St. 12) at 18 C. Fused four-angle images,
  whole-cell segmentations from the ASTEC pipeline and per-cell geometric properties.
