  notes: 'Figshare listing: 3 tar.gz, 26,649,613,733 B, complete. tar.gz has no index, so only the start
    of the fuse and post archives was read (300,000 B each, stream-decompressed with a scratch script):
    first members Astec-Pm13/FUSE/FUSE_MEMB/Astec-Pm13_fuse_t006.inr.gz (119,031,396 B) and Astec-Pm13/POST/POST_RELEASE/Astec-Pm13_post_t085.inr.gz
    (3,422,357 B). Both INRIMAGE-4 headers: TYPE=unsigned fixed, PIXSIZE=16 bits (uint16), VDIM=1, VX=VY=VZ=0.300000
    with no unit. INR is not a listed format (format other); axes zyx from XDIM/YDIM/ZDIM order (x fastest).
    Voxel size not set: the header gives 0.3 without a unit and no source states the fused voxel size;
    checked the INR headers, the Figshare description, the Guignard 2018 bioRxiv full text (fusion gives
    isotropic resolution, value in the supplement, not in the text) and the Biasuz 2025 bioRxiv. No sample:
    tar.gz members cannot be fetched one by one; the archives are direct (usable, range requests) but
