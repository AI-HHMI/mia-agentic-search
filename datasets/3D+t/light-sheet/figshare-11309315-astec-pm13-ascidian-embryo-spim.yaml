notes: 'Another embryo from the same Phmamm/Astec series as the Phmamm-1..9/16 deposits, but a different
  embryo (Pm13: PH-tdTomato, 25-cell to mid gastrula; in the Figshare listing as an .inr-only deposit
  with no v2 files). The Figshare record lists 3 tar.gz archives (26.6 GB): fuse (26.4 GB), post (0.22
  GB), properties. n_items = 90 time points from the stated range Tp0-Tp89. Formats are .inr (not a listed
  format), so formats is other. Segmentation by ASTEC (per the description); curation not stated, so annotations.source
  is unknown. Voxel size and channel count are unknown: the Figshare page does not give them, and the
  cited Guignard bioRxiv Methods could not be read (the bioRxiv text I read stops before Methods; the
  PDF returned HTTP 429). enricher: annotations_verified true, channels 1 (INR headers: uint16, VDIM=1).'
