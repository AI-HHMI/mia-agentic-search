notes: '63 files, 8.09 GB: 60 TIFF volumes (30 frames x 2 channels, ~135 MB each), detections.csv, tracks.csv, movieData.mat.
  Shape 118x664x860 (z,y,x), uint16, channels DNA and Mitochondria, and the table sizes (28,105 detections, 25,076 track observations,
  2,058 track IDs) come from the README of the downsampled derivative (zenodo 22696913), which copies the tables unchanged;
  that derivative is not proposed separately. Detections/tracks are algorithmic; the record names neither cell type nor tracker
  (the miOPM paper tracks mtDNA in HeLa cells with uTrack-3D), so organism, voxel size and frame interval are left empty/null.
  Single time series, labels not manually verified. Preprint is CC BY-NC-ND; this deposit is CC BY 4.0.'
