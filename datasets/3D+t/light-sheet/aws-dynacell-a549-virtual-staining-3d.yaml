  notes: 'Headers read from two stores via zip range requests (test/CAAX_mock.ozx, train/SEC61B_DENV.ozx): array 0/0/fov0000/0 is float32
    (T,C,Z,Y,X), sharded (inner chunks 1x1x16x640x960), bytes+blosc zstd bitshuffle; OME scale [1,1,0.174,0.1494,0.1494] um, same in
    both stores. T varies per position (5, 7 or 10, README); C=3 everywhere. No sample downloaded: the smallest store is 3.75 GB, above
    the 500 MB sample budget, and the data are sharded inside a zip, so value_range and normalization are unknown (README: SEC61B/TOMM20
    Structure channel is raw GFP intensity in v1.1). data.download_url is the folder: the dataset is 24 separate .ozx files (direct
