notes: 'Covers only the A549 (biohub-a549) subset, CC BY 4.0. The release also holds an iPSC (aics-hipsc) subset reprocessed from the
  Allen Institute hiPSC dataset under the Allen terms of use, which limit use to noncommercial research; it is excluded here and should
  be its own record. Size: 24 stores sum to 619.8 GB (croissant, S3 listing); the AWS registry page says about 407 GB. Virtual staining
  task: targets are paired fluorescence volumes, no masks. Frame interval per plate: 10, 30 or 120 min natively, subsampled to a 2 h
  grid. The NeurIPS 2026 paper is cited in the croissant file but no DOI or open full text was found, so publications is empty. enricher:
  voxel size 149.4x149.4x174 nm from OME-Zarr multiscales scale (was null); channels 3 from README; annotations.source automatic (measured
  fluorescence).'
