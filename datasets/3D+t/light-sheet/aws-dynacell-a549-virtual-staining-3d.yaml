notes: 'Covers only the A549 (biohub-a549) subset, CC BY 4.0. The release also holds an iPSC (aics-hipsc) subset reprocessed from the
  Allen Institute hiPSC dataset under the Allen terms of use, which limit use to noncommercial research; it is excluded here and
  should be its own record. Sizes: the croissant file lists 24 A549 stores (train and test, 3.8-32.1 GB each) summing to 619.8 GB, while
  the AWS registry page says about 407 GB; the listed sum is used. The task is virtual staining (label-free to fluorescence
  translation), so annotations are paired fluorescence volumes and no masks or labels. Voxel size, frame interval per plate
  (10, 30 or 120 min natively, subsampled to a 2 h grid) and z-step are not stated in the metadata read. The NeurIPS 2026 paper
  is cited in the croissant file but no DOI or open full text was found, so publications is empty. Files were not opened.'
