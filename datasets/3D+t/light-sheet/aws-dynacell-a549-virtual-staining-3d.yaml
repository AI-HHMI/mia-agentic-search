schema_version: '1.2'
id: aws-dynacell-a549-virtual-staining-3d
title: 'DynaCell A549: paired label-free and fluorescence 3D time-lapse volumes for virtual staining'
short_name: DynaCell A549 virtual staining pairs (live cell)
description: Paired 3D time-lapse volumes of live A549 cells acquired on the Mantis correlative label-free and light-sheet
  microscope, each with transmitted-light (phase) channels and one fluorescence marker per store (H2B nucleus, CAAX membrane,
  SEC61B endoplasmic reticulum, TOMM20 mitochondria), under mock, Zika-infected and Dengue-infected conditions. 24 OME-Zarr
  stores (12 train, 12 test) holding 262 fields of view, about 10 frames each on a shared 2-hour grid.
