notes: 'n_items=27 labelled stacks (paper: ground truth for 27 images from three movies of 52, 90 and
  92 time points); raw movies are 2048x~1050-1400x400-566 voxels. Ground truth via PlantSeg + manual Paintera
  proofreading (paper Appendix 1). No license is stated on the OSF project, its component or its wiki
  (node_license is null); the eLife paper is CC-BY-4.0 but that covers the article. The OSF file listing
  returned empty through both the API and the waterbutler endpoint, so file names, sizes and counts could
  not be listed; format, arrays and splits come from the project wiki, counts and voxel size from the
  paper Methods. Checked: OSF project and component pages/API, wiki, paper full text (Europe PMC).'
