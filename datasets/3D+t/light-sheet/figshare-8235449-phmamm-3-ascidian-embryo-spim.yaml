notes: 'Wild-type embryo; one of several embryo deposits from the same study (the catalogue already holds
  Phmamm-9 and Phmamm-16; Phmamm-1/3/4/5/7/8 have their own Figshare records). Different embryo, different
  images and segmentations from those records. Figshare lists 7 tar.gz archives (20.4 GB: v1 fuse/post/properties,
  v2 intrareg fuse/post/properties). n_items = time points from the stated range (Tp0-Tp89), not a file
  count. Segmentation comes from the ASTEC pipeline; the bioRxiv paper does not state how this embryo''s
  segmentation was curated, so annotations.source is unknown. Voxel size null: the paper''s 0.195 x 0.195
  x 1 um is for the newer Phmamm-16 embryo only; the fused voxel size here is not stated. v1 uses .inr
  (not a listed format), v2 .nii. enricher: annotations_verified true (v2 post archive''s first member
  is a uint16 NIfTI label volume).'
