  notes: 'Figshare listing: 7 tar.gz, 20,417,652,624 B, complete. tar.gz has no index, so only the start
    of each v2 fuse/post archive was read (300,000 B per archive, stream-decompressed with a scratch script):
    first members Phmamm-3-v2_intrareg_fuse_t009.nii.gz (87,690,531 B) and Phmamm-3-v2_intrareg_post_t084.nii.gz
    (3,667,173 B). All NIfTI-1 headers: dim x,y,z = 644,590,668 (axes listed slowest first), datatype
    512 (uint16), pixdim 0.3,0.3,0.3 with xyzt_units 2 (mm). Voxel size not set: 0.3 mm is implausible
    for a ~150 um embryo, so the header unit is wrong and no source states the fused voxel size; checked
    the NIfTI headers, the Figshare description, the Guignard 2018 bioRxiv full text (fusion gives isotropic
    resolution, value only in the supplement) and the Biasuz 2025 bioRxiv (0.195 x 0.195 x 1 um raw acquisition
    of newer embryos). No sample: tar.gz members cannot be fetched one by one; the archives are direct
    (usable, range requests) but whole. No single archive holds the dataset, so data.download_url stays
    the landing page.'
