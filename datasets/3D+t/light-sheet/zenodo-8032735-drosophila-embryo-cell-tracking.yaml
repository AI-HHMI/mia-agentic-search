notes: 'Zenodo record (Zenodo API lists the license as other-nc) and its LICENSE.txt: "This data must
  be used for research purposes only", citation required, hence spdx custom. Zip listing (peek_archive,
  510 files, 1.6 GB): raw_data/drosophila_raw_000-099.h5 (670 MB), segmentation h5 plus about 100 per-time-step
  TIFFs, object_identities h5, manual_annotations/manual_annotations.h5 and an ilastik .ilp project. Segmentation
  was made with ilastik plus seeded watershed and then tracked manually in ilastik (Zenodo description),
  so source is mixed. The paper (Bioinformatics 2015) is not open access, so only its abstract was read
  via Europe PMC; voxel size, time interval and image dimensions are not stated on the dataset page and
  were not read from the HDF5 headers, so voxel_size_nm is null. Older record (2014), moved from the Heidelberg
  benchmarks page.'
