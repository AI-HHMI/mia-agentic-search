notes: 'Hosted on Science Data Bank; DataCite lists 506,935 files, 21.5 TB, CC BY 4.0. Layout per the paper Data
  Records and the ScienceDB file-tree API: per set, MIP_ROI_0-39 with MIPxy/MIPxz projections and ROIauto (4D .h5
  per time point plus *_predictions.h5 3D U-Net masks), raw Hamamatsu .dcimg and 4 GB Micro-Manager .ome.tif stacks
  (K_1/). Masks are model-predicted with no stated manual correction, hence automatic. Isotropic resolution 320
  nm (paper), axial scan step 0.6 um; reconstructed voxel size not stated, so voxel_size_nm is null. n_items = 13
  raw sets (10 healthy, 3 dasatinib, folders *_ds), about 40 ROIs each. The paper is CC BY-NC-ND; the data licence
  is CC BY 4.0. enricher: annotations verified in the file tree and an .h5 header (was false).'
