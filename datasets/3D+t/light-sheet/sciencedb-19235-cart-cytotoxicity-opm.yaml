id: sciencedb-19235-cart-cytotoxicity-opm
title: Light sheet microscopy imaging dataset of CAR-T-cell-mediated cytotoxicity
short_name: CAR-T killing 4D live imaging (OPM light-sheet)
description: High-throughput 4D live-cell imaging of anti-CD19 CAR-T cells attacking Nalm6 target cells in a microchamber
  array, recorded on a Bessel oblique plane (single-objective light-sheet) microscope in three channels (SYTOX Blue
  dead-cell marker, Lifeact-EGFP actin, mApple/SiR-tubulin). Ten healthy-donor and three dasatinib-treated raw sets
  (about 40 chambers each, 120 volumes per chamber) with reconstructed projections, 4D HDF5 volumes and 3D U-Net
  segmentation masks of CAR-T and target cell nuclei and cytoplasm/membrane.
