notes: 'Folder layout in technical.layout. Pixel/voxel size, microscope, time step and cell type come
  from the CTC dataset table; organism and sample from that table and the Nature Methods paper. Terms
  are custom: CTC-related use needs no consent, non-CTC scientific use requires organizer permission,
  commercial use needs organizer and data-provider permission, cloning is prohibited, and the Nature Methods
  paper must be cited. Test set annotations are secret. Well-known benchmark; confidence kept moderate
  given the permission-based terms. Differs from other CTC records (e.g. ctc-fluo-c3dh-a549, ctc-fluo-n3dh-ce):
  a separate CTC dataset with its own cells/organism, microscope and zip. enricher: annotations.format
  fixed (no NN_ST). enricher: coverage = 01_GT/SEG 100 2D slices from 51/60 time points; 02_GT/SEG 100
  2D slices from 57/80 time points (gold SEG on selected frames only, CTC conventions).'
