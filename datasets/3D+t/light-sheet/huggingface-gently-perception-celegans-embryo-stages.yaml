notes: 'Hugging Face dataset repo (22,079 files, 311.6 GB, complete listing). n_items = 105 embryos (8
  annotated, 97 unannotated); 1,474 + 11,447 timepoints. Only embryo_1-8 carry human stage labels; embryo_9-105
  predicted_stages / predictions.jsonl are model output, not labels. README loading example uses repo
  id pskeshu/gently-perception-benchmark (same dataset, not verified). No paper found. HF API created
  date used as date_published. enricher: annotations.source unknown->mixed: embryo_1-4 annotations.json
  say stages through pretzel are Ryan''s Dec 2024 annotations and hatched transitions were added in March
  2026 from VLM classification breakpoints; embryo_5-8 are single-annotator (Kesavan) rolling-release
  annotations. Coverage: per-timepoint stage transitions for 8 embryos only. download_url is the repo
  (one TIFF per timepoint, no archive).'
