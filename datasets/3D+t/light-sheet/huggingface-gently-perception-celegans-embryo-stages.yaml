notes: 'Hugging Face dataset repo (22,079 files, 311.6 GB from the API listing with blobs: 12,921 .tif,
  9,041 .json, 103 .jsonl). n_items = 105 embryos (8 annotated, 97 unannotated); 1,474 + 11,447 timepoints.
  Only embryo_1 to embryo_8 carry human stage labels (about 35 GB); the other 97 embryos are unlabelled
  and their predicted_stages / predictions.jsonl are model output and must not be used as labels. The
  data loading example in the README points at repo id pskeshu/gently-perception-benchmark, while the
  page fetched is under gently-project (same dataset, renamed or mirrored; not verified). No paper found
  or cited on the page, so none is listed; the README gives a 2026 citation. Voxel size and microscope
  optics are not stated in the README or metadata.json files read. The label is a per-timepoint developmental
  stage, not a segmentation. HF API created date 2026-02-20 used as date_published.'
