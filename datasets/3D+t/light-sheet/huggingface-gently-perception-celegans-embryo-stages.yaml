schema_version: '1.2'
id: huggingface-gently-perception-celegans-embryo-stages
title: 'Gently Perception Agent Benchmark: C. elegans embryo stage classification from light-sheet microscopy'
short_name: C. elegans embryo stage classification (diSPIM)
description: diSPIM light-sheet time-lapses of C. elegans embryos with a histone fluorophore marker. An
  annotated benchmark of 8 embryos (1,474 3D timepoints, volumes of 50 x 512 x 1024 voxels, int32 TIFF)
  has human ground-truth stage transitions (early, bean, comma, 1.5-fold, 2-fold, pretzel, hatched) in
  annotations.json; a further 97 embryos (11,447 timepoints) are released without labels, with model-generated
  predictions that are explicitly not ground truth.
