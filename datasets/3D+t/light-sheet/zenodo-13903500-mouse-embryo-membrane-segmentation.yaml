title: Membrane staining and segmentation of a developing mouse embryo from 4 to 26 cells
short_name: Mouse embryo membrane segmentation (light-sheet)
description: Light-sheet (Luxendo inverted SPIM) time-lapse of one mTmG mouse embryo developing from the 4-cell stage to 26 cells (117 timepoints,
  15 min apart, tdTomato membrane signal), preprocessed and binned to 0.832 um isotropic voxels, with a Cellpose instance segmentation of the cells as a
  TIFF, provided as an example of segmentable and trackable membrane data.
