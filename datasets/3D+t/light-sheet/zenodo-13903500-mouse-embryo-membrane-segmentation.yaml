notes: 'One embryo (C1 of the Science paper), 117 timepoints; imaging.tif 466.7 MB uncompressed and segmentation.tif 466.9 MB (zip files 258.3 and 3.3 MB). Processing from
  the record: acquired at 0.208 um lateral / 1.338 um axial, then binned and rescaled to 0.832 um isotropic, which is the voxel size given here. Segmentation is the output of
  Cellpose, not manually corrected (record states it is an example of segmentable and trackable data); no tracks are provided. Paper full text is not open access
  in Europe PMC (abstract only). enricher: ImageJ headers of both TIFFs state spacing 0.832 micron and XResolution
  1.201923 px/um, confirming 832 nm. Segmentation IDs are not tracked: 1127 distinct IDs over 117 frames.'
