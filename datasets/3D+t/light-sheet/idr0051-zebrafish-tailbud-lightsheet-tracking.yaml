  notes: 'Listing: EBI FTP refused connection; HTTP index read instead (1,350 files, sizes rounded), so size_bytes 24,932,927,568 is the rounded index total (estimated), not an exact listing; it double-counts sample 1 (20181025 and 20181109 copies). Shapes from IDR API (datasets 3355-3357) and probe headers. value_range [0, 1706] from one sample stack (Dataset_2 t0000); normalization none inferred (uint16 well below 12-bit max, raw counts). Voxel size 1x1x1 um from the Development paper Methods (online downsampling); KLB headers in IDR also give 1 um; TIFF headers of Dataset_1/2 carry a 72 dpi default (352.8 um), ignored. Tracking XML is not a listed format (array format other); KLB not readable by TensorSwitch. No single archive: files are per timepoint under the https FTP folder.'
