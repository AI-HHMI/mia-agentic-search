notes: 'Three samples (18, 21 and 22 somite stage; 146, 31 and 205 timepoints per the annotation CSV); n_items counts time-lapse series. 1 um isotropic voxels are the online-downsampled size stated in the Development paper Methods; original acquisition voxel size is not stated there or in the study file. Tracks are automatic (TGMM) with manual MaMuT validation only for a selected tailbud region, so coverage is partial and not a formal ground truth. Size 24.9 GB sums the FTP HTTP index (rounded, estimated). FTP holds registered KLB stacks (no listed format, so not in data.formats), TIFF/OME-TIFF and tracking XML. Data DOI 10.17867/10000117 resolves to IDR project-552.'
