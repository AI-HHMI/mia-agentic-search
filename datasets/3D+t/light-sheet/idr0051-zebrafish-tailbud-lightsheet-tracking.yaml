description: Three H2B-GFP zebrafish tailbud light-sheet time-lapses (one stack per 2 min, registered and downsampled to 1 um voxels) with TGMM nuclei tracks, manually validated in MaMuT, stored as one XML per timepoint. Raw TIFF and registered KLB stacks are provided.
