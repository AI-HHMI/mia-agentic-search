description: Live Luxendo MuVi-SPIM light-sheet imaging of one Phallusia mammillata embryo injected with
  PH-GFP (membrane), H2B-mCherry (nuclei) and ERK-KTR-mClover mRNAs, 32-cell stage to late neurula (150
  time points, one every 2 min). Fused and temporally registered images, ASTEC whole-cell segmentations
  with manual correction, and per-cell geometry, lineage and names.
