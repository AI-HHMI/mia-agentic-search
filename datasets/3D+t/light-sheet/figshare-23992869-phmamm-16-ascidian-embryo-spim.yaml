notes: 'Three tar.gz archives on Figshare (16.7 GB: fused images, segmented images, properties); tar.gz cannot be listed remotely, so contents come from the Figshare description. Per the bioRxiv paper (Biasuz 2025, Methods), ASTEC whole-cell segmentation of this embryo had its over-/under-segmentation errors manually corrected in MorphoNet, hence proofread. The paper gives 0.195 x 0.195 x 1 um for raw acquisition; the fused isotropic voxel size in these archives is not stated, so null. One embryo of a series (Phmamm-1 to 16, Asaspe-1, U0126-treated) with separate Figshare records; Phmamm-9 is a separate record. The fusion image for time step 83 is a duplicate of step 82 (the original is kept with an _original suffix), per the Figshare page.'
