    (83,256,725 B). Both NIfTI-1 headers: dim x,y,z = 585,678,702 (axes listed slowest first), datatype
    512 (uint16), pixdim 0.3 isotropic; xyzt_units 2 (mm) on the fuse file, 2 (mm) on the post file. Voxel
