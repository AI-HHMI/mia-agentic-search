  notes: 'Figshare listing: 7 tar.gz, 16,630,650,965 B, complete. tar.gz has no index, so only the start
    of each v2 archive was read (300,000 B per archive, stream-decompressed with a scratch script): first
    members Phmamm-9-v2_intrareg_post/Phmamm-9-v2_intrareg_post_t003.nii.gz (2,711,603 B) and Phmamm-9-v2_intrareg_fuse/Phmamm-9-v2_intrareg_fuse_t032.nii.gz
    (99,551,651 B). Both NIfTI-1 headers: dim x,y,z = 592,623,603 (axes listed slowest first), datatype
    512 (uint16), pixdim 0.3,0.3,0.3 with xyzt_units 2 (mm). Voxel size not set: 0.3 mm is implausible
    for a ~150 um embryo (0.3 um would fit 592 px), so the header unit is wrong and no source states the
    fused voxel size; checked the NIfTI headers, the Figshare description, the Biasuz 2025 bioRxiv full
    text (raw acquisition 0.195 x 0.195 x 1 um, fused to an isotropic image, size not given) and the ASTEC
    fusion docs (target_resolution examples .6 / .3, no unit, not tied to this embryo); Guignard 2018
    bioRxiv rate-limited (429). No sample: tar.gz members cannot be fetched one by one; the archives are
    direct (usable, range requests) but whole.'
