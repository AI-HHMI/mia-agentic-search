title: 'Phmamm-9: Phallusia mammillata embryo live SPIM imaging with whole-cell segmentation (stages 9-12)'
short_name: Ascidian embryo cell segmentation (light-sheet)
description: Live multiview light-sheet (MuVi-SPIM) imaging of one Phallusia mammillata embryo with PH-citrine
  labelled cell membranes, 76-cell stage to mid gastrula (63 time points, one every 2 min). Fused four-angle
  images, whole-cell segmentations from the ASTEC pipeline (all cells at every time point), surface meshes,
  and per-cell geometric and naming properties. Version 1 is from Guignard et al. 2020; version 2 is temporally
  registered with names refined using the ASCIDIAN package (Biasuz et al. 2025).
