notes: 'Seven tar.gz archives on Figshare (16.6 GB): v1 fuse 9.46 GB, post 164 MB, mesh 550 MB, properties
  5 MB; v2 intrareg_fuse 6.30 GB, intrareg_post 156 MB, properties 2 MB. Segmentation is produced by the
  ASTEC pipeline; the bioRxiv paper (Biasuz 2025) says ASTEC segmentations of its newer embryos were manually
  corrected in MorphoNet, but does not state how the Phmamm-9 segmentation was curated, so annotations.source
  is unknown. Voxel size: the paper gives 0.195 x 0.195 x 1 um for raw acquisition, but the voxel size
  of the fused isotropic images in these archives is not stated on the page or in the paper read, so null.
  One of several embryo deposits from the same study (Phmamm-1/3/4/5/7/8, others have their own Figshare
  records); v1 uses .inr, which is not a listed format (v2 uses .nii). Guignard et al. 2020 (Science)
  was not read (paywalled). enricher: annotations_verified true (first v2 post member read: a uint16 NIfTI
  label volume).'
