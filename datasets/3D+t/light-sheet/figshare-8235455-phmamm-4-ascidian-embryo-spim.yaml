title: 'Phmamm-4: Phallusia mammillata embryo live SPIM imaging with whole-cell segmentation'
short_name: Ascidian embryo Phmamm-4 cell segmentation (SPIM)
description: Live multiview light-sheet (MuVi-SPIM) imaging of one wild-type Phallusia mammillata embryo with PH-citrine-labelled
  cell membranes, 44-cell stage (St. 7) to mid gastrula (St. 12), time points 0 to 89. Fused four-angle images,
  whole-cell segmentations from the ASTEC pipeline at every time point, surface meshes where provided, and per-cell
  geometric and naming properties. Version 1 is from the original ascidian atlas deposit; version 2 is temporally
  registered with cell names refined using the ASCIDIAN package.
