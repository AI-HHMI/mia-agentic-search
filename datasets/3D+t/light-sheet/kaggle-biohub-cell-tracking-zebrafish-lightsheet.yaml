notes: Hosted on Kaggle as a competition (Kaggle login and acceptance of the competition rules needed,
  so access is registration). The Kaggle page is JavaScript-rendered and the fetch returned only its title,
  so file counts, sizes, number of embryos and tracks are not known; facts come from the organisers baseline
  repository README (Zarr + GEFF layout, voxel spacing Z/Y/X 1.625/0.40625/0.40625 um, sparse ground truth)
  and the FEBS announcement (zebrafish, Royer Group light-sheet, launched 2026-06-29). A web search snippet
  said the organisers release the annotations under CC0, but that text could not be fetched, so the license
  is left unknown; the repository BSD-3-Clause license covers code only. Authors and paper not found (no
  publication cited). Likely related to the Zebrahub light-sheet data, not confirmed.
