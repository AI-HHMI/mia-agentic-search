short_name: Zebrafish embryo 3D+t cell tracking (light-sheet)
description: 'Training and test data of the Biohub Kaggle competition on cell tracking in 3D+time light-sheet
  microscopy of zebrafish embryos from the Royer Group. Each dataset is an OME-Zarr image (T, Z, Y, X)
  paired with a GEFF track graph: nodes are approximate cell centres (t, z, y, x), edges link cells across
  time and divisions are one node with two outgoing edges. Ground truth is sparse (only a subset of cells
  annotated per video) and given for the training split only; the test split has images only.'
