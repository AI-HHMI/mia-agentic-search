title: Zebrahub single-objective light-sheet (DaXi) time-lapses of zebrafish embryos with nuclear cell tracks
short_name: Zebrafish embryo nuclei tracking (light-sheet)
description: Five DaXi single-objective light-sheet time-lapses of developing zebrafish embryos (tg(h2afva:h2afva-mcherry)
  nuclear reporter), published as OME-Zarr volumes (515-1100 timepoints, 258-448 z-planes, 0.439 x 0.439 x 1.24 um voxels)
  together with a cropped tail sub-volume. Per-dataset cell-track tables (track_id, t, z, y, x, parent links) were generated
  with Ultrack, and the folder also holds a tracks benchmark directory.
