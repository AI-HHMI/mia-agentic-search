notes: 'Folder listing: ZSNS001-005 and ZSNS001_tail (a crop of ZSNS001) as OME-Zarr; CSV tracks for all but ZSNS002 (199-849
  MiB each); tracks_benchmark/. Zarr headers: uint16, blosc, 0.439 x 0.439 x 1.24 um in all six. The imaging page also lists
  two OpenSiMView sets not found in this folder. Tracks are automatic (Ultrack), no curation statement found. bioRxiv text
  read only in part: nuclear line and DaXi found; time interval and tracking Methods not. No license on imaging, data or papers
  pages (only a citation request), so unknown. Other authors and file date not checked. enricher: track units corrected (ZSNS001/tail
  in um, others voxels); size estimated 18.6 TB (was null); tracks automatic per paper Methods (DaXi tail time-lapses, U-Net
  + watershed hypotheses + tracking).'
