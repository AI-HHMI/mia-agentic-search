  notes: 'Top-level HTTP index read in full; chunk files inside the zarr stores not listed (millions of chunks), so no confirmed
    size. Size estimated: 6 stores x level-0 voxels (shapes from .zattrs/.zarray) x 2 B (uint16) = 18,601,460,870,032 B (~18.6
    TB), uncompressed level 0 only (pyramid levels add ~1/7 more; blosc compression makes the download smaller); the five
    CSVs add 2,305,399,974 B exact. Samples: one central chunk of ZSNS001 level 0 (1x1x112x543x302, max 60, 98% zeros: background-subtracted
    embryo edge), one of ZSNS001 level 2 (max 344) and two timepoints of ZSNS003 level 2 (2x1x32x483x510, range 0-2207, 88%
    zeros); value_range is from that one ZSNS003 sample. Paper: DEXP removed background and stabilised the time-lapses, so
    intensities are processed, not raw camera counts (normalization unknown). Track coordinate units differ by file (see alignment_notes);
    time interval between frames not stated. tracks_benchmark/ holds Ultrack zarr track graphs and an int8 791 x 4815999 array
    whose meaning is not documented; not described as arrays here. Voxel size 439 x 439 x 1240 nm in all six .zattrs, matching
    the record. Download: all files are direct on public.czbiohub.org (range requests work) but that host is not on the TensorSwitch
    allowlist; the zarr stores are folders read remotely.'
