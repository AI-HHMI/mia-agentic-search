notes: Released as benchmark/demo images for the self-supervised Aydin denoiser (software
  DOI 10.5281/zenodo.5654826); no training labels. Only newyork.png / newyork_noisy.tif
  form a clean/noisy pair (synthetic noise, natural image). The record is CC BY 4.0
  as a whole but the description says individual files keep their own licenses, from
  CC0 to CC BY-NC-SA 4.0 (e.g. the mouse blastocyst time-lapse is CC BY-NC-SA 4.0,
  camera.png CC BY-NC) and some are copyright unknown; check per file before use.
  Pixel/voxel size is not stated for any file on the record page (file headers not
  inspected). The record has no associated paper; the cited source papers are for
  individual files. Includes about 8 non-microscopy test images. Total size not summed.
