short_name: Aydin denoising benchmark images (light-sheet)
description: 'Collection of 32 example images for the self-supervised Aydin denoising
  toolkit: 3D/4D fluorescence volumes and time-lapses (light-sheet, confocal, near-infrared
  nanotube imaging; Drosophila, zebrafish, Tribolium, mouse blastocyst, HeLa/OpenCell)
  plus a few natural and synthetic-noise test images. No clean ground truth except
  one synthetic noisy/clean pair.'
