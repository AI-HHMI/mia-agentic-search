notes: 'Benchmark/demo images for the self-supervised Aydin denoiser (software DOI 10.5281/zenodo.5654826);
  no labels. Only newyork.png/newyork_noisy.tif form a clean/noisy pair (synthetic noise, natural image).
  Record is CC BY 4.0 but files keep their own licenses (CC0 to CC BY-NC-SA 4.0, some copyright unknown,
  e.g. Maitre blastocyst CC BY-NC-SA, OpenCell CC BY-SA); check per file. 13 of 32 files are natural/synthetic
  test images, not microscopy. No paper for the record. organisms: Tribolium castaneum = Myers_*; Drosophila
  melanogaster = SPC0_*, Flybrain_*, C2-DrosophilaEggChamber-*; Danio rerio = Royer_*; Mus musculus =
  Maitre_*; Homo sapiens = Hyman_HeLa, Leonetti_*; Cognet_* (nanotubes) and fixed_pattern_noise not stated.
  enricher: size from Zenodo listing; voxel size left null (files from ~10 sources, no calibration in
  headers).'
