    + 1 JPEG + mandrill.tif natural/synthetic test images, and newyork_noisy.tif (float32 1024x1024, deflate;
    synthetic noise on newyork.png). Voxel size not found; checked: all TIFF headers (no calibration),
    Zenodo API record and description (pixel sizes not stated). Source papers of each file (Weigert 2018,
    Tomer 2012, Cho 2022, Dumortier 2019, Machado 2019, Gao 2015, Danial 2019) not read; sub-datasets
    would differ anyway. No single archive: files are direct links (https://zenodo.org/records/18686988/files/<name>).'
