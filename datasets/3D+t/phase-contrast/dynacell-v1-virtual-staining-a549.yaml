notes: 'License is mixed: Biohub A549 data CC-BY-4.0; Allen Institute hiPSC data under the Allen Institute Terms
  of Use (noncommercial research); code BSD-3-Clause (v1 README). Voxel size (0.116 x 0.116 x 0.174 um) comes
  from the demo bundle README (A549 only). Size 929 GB (865 GiB) is from the v1 README and covers 24 A549 plus
  6 hiPSC archives; the registry page says about 407 GB for the A549 part. Paper "DynaCell: an Evaluation Framework
  for Dynamic 3D Virtual Staining of Live Cells" (Kalinin, Zheng, Theodoro et al.) is named on the registry page
  but no DOI, preprint or full text could be found (Europe PMC / web search), so publications is empty. Targets
  are fluorescence images paired to phase input, not annotation masks; segmentation derived from them exists only
  in the demo bundle. Contents not listed per archive.'
