title: 'DynaCell v1: paired label-free and fluorescence 3D live-cell volumes for virtual staining'
short_name: DynaCell 3D virtual staining (phase/fluor.)
description: Label-free quantitative-phase volumes of live cells paired with fluorescence ground truth for
  nucleus (H2B), membrane (CAAX), ER (SEC61B) and mitochondria (TOMM20), as train/test OME-Zarr archives.
  The Biohub part is A549 cells, mock, Zika- or Dengue-infected; an Allen Institute WTC-11 hiPSC part
  (cell, SEC61B, TOMM20) is included under separate terms. Built to evaluate dynamic 3D virtual staining.
