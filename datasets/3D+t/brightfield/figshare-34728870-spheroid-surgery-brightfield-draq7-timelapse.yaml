notes: 'One dataset in four figshare items (parts 1-4 of 2026_Maiurov_Spheroids; DOIs 10.6084/m9.figshare.34728870,
  .34732695, .34733508, .34734165; CC BY 4.0; 33 files, 168.8 GB). Items 1-2 are HeLa Kyoto, 3-4 T-47D. The
  metadata zips of all measurements were listed and each holds its napari mask(s); the item 1 assembled
  zip holds an 11.7 GB TCZYX OME-TIFF plus a brightfield-only TZYX TIFF. Annotation is sparse (about a
  dozen clusters, doublets or cells) and underlies Table 1 of an article titled "Spheroid surgery: a first-generation
  micromanipulation platform ..." (Pal, Maiurov et al.) that was not found on Europe PMC, so no publication
  is listed. Day2 follow-ups have no masks. Voxel size is from the README. download_url is empty: the
  data are many zips across four items.'
