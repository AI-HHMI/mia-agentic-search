title: Post-extraction 3D time-lapse (brightfield + DRAQ7) of cell clusters picked from tumor spheroids,
  with napari label masks
short_name: Extracted spheroid cells time-lapse (brightfield)
description: Operetta CLS widefield z-stack time-lapses (brightfield and DRAQ7 channels, hourly for 24 h)
  of HeLa Kyoto and T-47D cells, doublets and clusters extracted with a micropipette from the outer layers
  of hydrogel-embedded tumor spheroids ('Spheroid surgery'). Nine measurements in four figshare items
  (the 2026_Maiurov_Spheroids collection) come with napari label masks drawn on the brightfield channel,
  one label per tracked object, for the first-24-h series; two Day2 follow-up measurements are unannotated.
