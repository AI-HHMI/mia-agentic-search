notes: 'The Zenodo record 15299846 (117 MB zip, 1080 CSV files listed with peek_archive) contains only the centerline annotations; the images are the separate 3D-SpermVid hyperstacks (TIF, 121 recordings, 272 GB total in 12 Zenodo records, e.g. 10.5281/zenodo.11222052, CC-BY-4.0; 3D-SpermVid paper is CC BY-NC-ND 4.0). The record counts 135 annotated cells and the 3D-SpermVid paper counts 121 recordings; the difference was not explained in the texts read. enricher: modality brightfield (was other): the centerline paper calls the images 3D brightfield images. x/y pixel size 118/640 um = 0.184375 um; the z spacing between focal planes is non-uniform (0.45-0.69 um), so z is null. Annotation is semi-automatic (minimal-cost path tracing between a head point and a manually set tip, then manual curation). n_items counts annotated cells. enricher: size_bytes from the listing of all 13 Zenodo records (was 272 GB page-stated).'
