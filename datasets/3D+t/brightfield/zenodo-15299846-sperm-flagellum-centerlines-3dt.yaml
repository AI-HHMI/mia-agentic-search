  notes: 'Listing: Zenodo API for record 15299846 plus the 12 3D-SpermVid image records named in the 3D-SpermVid paper Table 1, and the centerline zip directory: 376 files, 272,411,666,045 B, complete. Probe (624 KB read): Sperm-1-NoCap_210730_Exp4.tif ImageJ TIFF, uint8, uncompressed, 2030 pages, tzyx 70x29x448x640, no spatial calibration in the header. Camera info txt: 8-bit BW, 5000 fps, 640x480 sensor. Not sampled: tools/sample.py refuses files > max-file-mb on the /content URL and its page-wise read failed on the .tif URL form; the smallest hyperstack (582 MB) exceeds the 500 MB budget. CSVs read with peek_archive --cat. Voxel size: x/y 0.1844 um (118/640, centerline paper Methods); z is non-uniform (per-slice heights in z-axis-values-*.csv, 20 um over 29-45 planes), so z stays null. The 640x448 NCC stacks were cropped (info labels removed), not rescaled (centerline paper). Download: TIFFs and the zip pass download_check; no single archive holds the dataset.'
