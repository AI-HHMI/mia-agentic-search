title: '3D-SpermFlagella: 3D+t human sperm flagellum centerline dataset'
short_name: Human sperm flagellum 3D+t centerlines
description: Semi-automatic 3D+t flagellum centerline traces (neck to tip) for 135 freely swimming human sperm cells (49 non-capacitating, 86 capacitating), about 24,000 annotated stacks at 90 Hz, derived from the 3D-SpermVid multifocal piezo-driven hyperstacks (640x480 px, 29-45 focal planes over about 20 um). The raw TIF hyperstacks (272 GB) are in 12 separate Zenodo records; the Zenodo record 15299846 holds the centerline CSVs (X, Y, Z in micrometres and voxels).
