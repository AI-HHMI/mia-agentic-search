notes: 'The Immunemap web app and API render client-side, so file listings, license and sizes could not be read. Facts come from
  the landing page, the API root (registration/login offered) and the EMBO J paper (Methods and Data availability read via
  Europe PMC): data are served by API as HDF5 (videos), JSON (metadata) and CSV/JSON (tracks); whether downloads need login
  is not confirmed. No data license found (the paper is CC BY 4.0). Modality and pixel size vary per video, so modality is
  other and voxel size null. Over 400 videos; 233 have manual tracks. Cell Death Dataset is catalogued separately (zenodo-14551288).'
