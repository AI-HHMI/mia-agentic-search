title: 'OrgLine: curated benchmark for organoid detection and instance segmentation'
short_name: OrgLine organoid detection and segmentation
description: Benchmark aggregating public organoid image datasets (intestine, lung, brain, pancreatic PDAC, colon) with
  unified COCO/YOLO-style annotations. OrgDet.zip holds images with bounding-box labels for detection; InstanceSeg.zip holds
  images, masks and label files for instance segmentation. Authors refined or extended annotations from source datasets
  (tightened boxes for Tellu, extra labelled organoids for DeepLUMEN, instance masks converted from semantic masks for OrganoID).
