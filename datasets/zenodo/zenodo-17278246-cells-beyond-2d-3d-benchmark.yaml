notes: 'Zip (peeked) has 830 TIFFs, 33.3 GB uncompressed, under images/ and masks/ per subset; README states 11 subsets, 415 image/mask pairs. Subsets (README): 12 Spheroids, ATAS, BBBC034v1, WORM, N3DH-SIM+ (simulated), Mouse-Organoid, Mouse-Skull, Neurosphere, Platynereis-ISH, Scaffold-A549, Vibrio Cholerae. Per-subset modality, voxel size, organism and licence were not fully stated in the README; modality and organism lists are inferred from the README subset names and may be incomplete (human cell subsets such as A549/HL60/BBBC034 not listed). The Zenodo CC-BY-4.0 licence covers the compilation; original subsets may carry their own terms (see README links). No train/test split provided. Paper full text is not open access (only abstract/metadata read), so confidence is capped.'
