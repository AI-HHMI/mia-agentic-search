notes: 'Voxel size (isotropic 0.44 um) and image size (~400x700x700 px, 3 channels) are from the arXiv paper. Splits per the paper: completely
  labeled 18/5/7 train/val/test, partly labeled 43/12/16. Annotation: two expert annotators segmented and proof-read each other in VVD
  Viewer, third annotator inspected; dim/overlapping neurons often left unlabeled, hence partial coverage. Zenodo page, API record,
  datasheet and paper were read; peek_archive of fisbe_v1.0_completely.zip showed only zarr chunk files (not individually the gt_instances
  array), so annotations_verified is false. Objective not stated. Microscopes: Zeiss LSM 710/780 confocals per datasheet. Sample count 101 is 30+71.'
