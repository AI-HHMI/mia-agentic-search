notes: 'Researched: Zenodo page and API record, training_data.zip listing (peek_archive: 1026 .tif + 514 .json
  incl. dataset_split.json; the .tif files presumably pair image and mask, exact pairing naming not inspected),
  and paper Methods (Nikon Crest V3 X-Light spinning disk; HT1080 widefield 20x; several objectives, training data
  scaled to about 335 nm pixel size; 12-bit acquisition). Pixel size is the paper-stated rescaled value. Channel
  count 3 is the maximum of the paper''s 1-3 channel networks. Annotation source: human-in-the-loop (AI-assisted
  manual curation). Record also contains HT1080 test sets (data_set_HT1080.zip, 52 tif) and model files.'
