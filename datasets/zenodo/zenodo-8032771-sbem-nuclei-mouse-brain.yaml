description: One SBEM volume (1024 x 768 x 7552 voxels, 8-bit HDF5) of adult mouse brain covering cerebral cortex, white matter and striatum, with all 3309 cell nuclei manually annotated as x, y, z centres plus estimated radius (CSV). Two ground-truth versions are provided (all nuclei, and excluding border-touching ones). Supplement to the ISBI 2014 paper.
