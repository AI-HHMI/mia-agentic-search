title: Labeled confocal laser scanning microscopy images of concrete surfaces (air voids, aggregates, cement paste)
short_name: Concrete air voids and aggregates (confocal)
description: RGB images and surface height maps of concrete surfaces acquired by confocal laser scanning microscopy,
  with pixel-wise masks labelling air voids, aggregates and cement paste, split into training (681 image/mask pairs)
  and test sets. Built for training neural networks that characterise the air-void microstructure relevant to freeze-thaw resistance.
