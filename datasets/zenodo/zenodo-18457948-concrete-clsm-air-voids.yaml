notes: 'Zip indexes read via peek_archive without downloading: training_masks.zip has 681 PNG masks, training_files_RGB.zip 681 RGB PNGs,
  test_files.zip 153 PNG images plus 153 CSV height maps (test masks in test_masks.zip, not indexed). Six archives, ~8.8 GB total (per record page).
  Height maps are CSV (data.formats lists other for them). Pixel size differs between versions (v1/v3 240x: 0.69 um/pixel; v2 adds 120x and 480x),
  so voxel_size_nm is null. The Methodology paper (Advanced Engineering Informatics) is not open access and its abstract was empty in Crossref/Europe PMC,
  so annotation procedure/source is unknown and the microscope model was not checked. Sample is concrete surfaces, a materials-science use of microscopy.'
