short_name: HeLa cell 5-class segmentation GT (SBF-SEM)
description: Pixel-level ground-truth labels for 300 slices of a HeLa cell pellet imaged by SBF-SEM (10 x 10 nm pixels, 50 nm slices). Five classes - nuclear envelope, nucleus, other cells, background and cell. Labels are released as TIFF and MATLAB files on Zenodo; the matching raw SBF-SEM images are hosted separately on EMPIAR-10094.
