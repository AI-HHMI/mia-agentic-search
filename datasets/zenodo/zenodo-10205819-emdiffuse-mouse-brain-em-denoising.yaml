title: EMDiffuse Dataset
short_name: Mouse tissue EM denoising and super-resolution
description: Paired noisy and long-exposure ground-truth scanning electron microscopy images of mouse brain cortex for training
  denoising (40,000x, 2-14 s exposures vs ~130 s ground truth) and super-resolution (20,000x raw vs 40,000x ground truth), plus
  small mouse heart, liver, bone marrow and HeLa sets for transfer learning. Organised into brain_train, brain_test and per-tissue folders.
