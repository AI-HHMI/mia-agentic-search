notes: 'Zip listing (peek_archive): 12 TIFFs, 6 image volumes (c1-c5image.tif, visual.tif) and 6 label volumes; 221 MB
  uncompressed. Paper reports 2632 hand-annotated neurons, annotation checked by an external expert; the source whole-brain
  volume is from Voigt et al. 2019 (IDR), mesoSPIM zoom 0.63x, 561 nm. Voxel size of this dataset is not stated on the
  Zenodo page or in the paper Methods (the 5.26 x 5.26 x 5 um figure in the paper is for a separate c-FOS sample), so
  voxel_size_nm is null. Train/test split is not provided in the files; the paper holds out the visual cortex volume
  for evaluation. Only 6 small volumes (221 MB), at the lower end of the size criterion.'
