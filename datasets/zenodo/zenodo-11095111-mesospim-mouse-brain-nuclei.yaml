title: 3D ground truth annotations of cleared whole mouse brain nuclei imaged with a mesoSPIM system
short_name: Mouse brain neuronal nuclei 3D (mesoSPIM)
description: Six cropped 3D volumes (five somatosensory cortex, one visual cortex with imaging artifacts) from a CLARITY-cleared
  TPH2-tdTomato mouse brain imaged with a mesoSPIM light-sheet microscope, with expert hand-annotated 3D instance labels for 2632
  neuronal nuclei. Released with the CellSeg3D paper as a benchmark for 3D cell segmentation in cleared tissue.
