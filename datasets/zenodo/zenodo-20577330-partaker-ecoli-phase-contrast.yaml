notes: 'Zip indexes read without downloading: co-culture-1 has 45 frames and 45 masks_gt (P0 12, P4/P5/P6 11 each)
  plus benchmark_all.csv and README.txt; co-culture-2 has 80 each of frames, masks_binary, masks_instance and
  weight_maps, plus a model folder (.pt). Paper Methods: ground-truth masks initialised with omnipose_bact_phase
  then manually corrected (hence source mixed); frames from a 100 h experiment at 5-minute intervals, sampled
  across growth phases. Pixel size 0.0645 um and optics from the Zenodo record. Size is the sum of the two zip
  sizes. The Keras .h5 weights are listed on the record but were not seen in the co-culture-2 zip index (only .pt).
  Frames are sampled time points, so dimensionality is recorded as 2D. Channel count of the frames not stated.'
