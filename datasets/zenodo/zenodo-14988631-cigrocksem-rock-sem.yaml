notes: 'Geological (rock) SEM rather than biological microscopy. Zip index read without downloading: 29,913 files,
  mostly PNG (consistent with ~14,954 image/mask pairs). Counts (2,477 / 1,152 / 11,325) from paper Table 2.
  Pixel size varies widely by lithology (0.0008-0.98 um/px; sandstone 0.17 um/px), so voxel_size_nm is null.
  Masks are binary (pore vs background); mudstone labels come from Digital Rocks Portal, sandstone masks were
  manually annotated with LabelMe by the authors. No train/test split shipped (paper used random 8:2).
  Zenodo record states CC-BY-4.0; the paper article itself is CC-BY-NC-ND. Author Jie You taken from the
  Europe PMC author string (Zhang Y, Wu X, You J); Zenodo lists only two creators.'
