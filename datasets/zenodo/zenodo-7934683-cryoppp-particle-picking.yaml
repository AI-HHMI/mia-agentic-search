title: "CryoPPP: expert-curated cryo-EM micrographs with labelled protein particles for particle picking"
short_name: "CryoPPP protein particle picking (cryo-EM)"
description: >-
  Cryo-EM micrographs of 34 representative protein datasets selected from EMPIAR (9,893 micrographs,
  about 1.7 million manually labelled particles) with particle coordinates (STAR/CSV) and particle stacks,
  validated by 2D classification and 3D reconstruction. Includes a small CryoPPP_Lite version with 8-bit JPG micrographs.
