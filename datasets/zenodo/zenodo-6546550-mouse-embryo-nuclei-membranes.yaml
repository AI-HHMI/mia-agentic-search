notes: 'Voxel size given as 0.207x0.207x1 um for some nuclei stacks and 0.23x0.23x1 um for others (record uses the first); membrane light-sheet
  voxel size is not stated. No publication is linked on the dataset page or API record and a Europe PMC title search found no match,
  so publications is empty. Annotation procedure not described. Archive listing (peek_archive): 41 .h5 files, 4 png, 1 md;
  Nuclei/{train,test} (35 files) and Membrane/{train,val} (6 files). Membrane label files include model predictions
  (gasp) that were corrected, suggesting semi-automatic labels.'
