id: zenodo-19644053-wf-sr-paired-sim-bpae
title: "High-fidelity super-resolution microscopy datasets spanning multispectral to hyperspectral domains via diffractive optics"
short_name: "Paired widefield-SIM super-resolution (fluor.)"
description: >-
  Experimentally acquired, pixel-registered pairs of diffraction-limited widefield (WF) and reconstructed
  super-resolution (SR) fluorescence images from two diffractive-optics structured-illumination systems
  (MCoSM and a compact lattice SIM). Five records: fluorescent microspheres, phalloidin-labelled actin in A549
  and HeLa cells, three-colour BPAE cells (nuclei, mitochondria, actin) and a hyperspectral BPAE data cube
  (503-689 nm, 6 nm step), intended for training image-restoration / super-resolution models.
