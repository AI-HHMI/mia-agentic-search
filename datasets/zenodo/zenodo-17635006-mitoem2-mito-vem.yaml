notes: 'Zenodo record has 8 zips (Dataset001-008). Voxel size varies per volume, so the single voxel_size_nm
  field is null; dataset.json spacing (nm, x/y/z) is 16/16/16 for Beta, Jurkat, Macrophage, Podocyte,
  Sperm; 8/8/30 for Mossy (ssSEM) and Stem (SBF-SEM); Pyramidal (10 GB) not inspected. Sampled zip dataset.json
  files list numTraining/numTest of 1-4 volumes each (26 volumes across 7 inspected zips). Organism/tissue
  not stated on Zenodo page or dataset.json and paper full text was unreachable (bioRxiv HTTP 429; only
  abstract read via Europe PMC), so organism is left empty. Label source (manual vs proofread) not confirmed;
  dataset.json lists licence Unknown but Zenodo record states CC-BY-4.0. Authors not read. enricher: formats
  nifti (was other) and n_items 45 volumes (imagesTr + imagesTs across the 8 zips; was null), both from
  the complete zip listing and a sample.'
