title: 'BioTISR: a time-lapse biological image dataset for super-resolution microscopy'
short_name: BioTISR time-lapse SIM super-resolution pairs
description: Time-lapse pairs of low-resolution (raw SIM / wide-field) and high-resolution SIM reconstructions (SIM_gt) of live COS-7 and SUM-159 cells, with raw data at 2-3 excitation-intensity levels. 2D set covers clathrin-coated pits, lysosomes, outer mitochondrial membrane, microtubules and F-actin (linear and nonlinear SIM); 3D set covers mitochondria, microtubules and F-actin (3D-SIM). At least 50 ROIs per specimen and mode.
