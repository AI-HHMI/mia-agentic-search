title: microbeSEG dataset
short_name: B. subtilis and E. coli cell segmentation (phase)
description: Phase-contrast microscopy crops (320x320 px) of growing B. subtilis and E. coli microcolonies with instance segmentation masks. Contains expert-annotated test data (three experts), a training set annotated manually in 30 minutes, and a set combining 30 minutes manual annotation with 15 minutes of pre-label correction.
