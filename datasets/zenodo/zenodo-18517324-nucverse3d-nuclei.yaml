  0.15 x 0.15 x 0.3 um. Counts: 9 liver + 12 HCC + 5 Drosophila stacks = 26 (readme); raw.zip lists 52 tif files
  (image + mask). Only raw.zip holds newly released raw data; processed.rar/models.zip/results.zip are derived, and
  external benchmark datasets are only included as processed patches. Sources checked: Zenodo record, file listing,
  readme, peek of raw.zip, and paper full text (Europe PMC). Channel count not stated.
