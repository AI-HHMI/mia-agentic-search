title: 'NucVerse3D: 3D Nuclei Segmentation in Multi-Modal Microscopy Using a Residual Attention U-Net'
short_name: Mouse liver and Drosophila 3D nuclei (multiphoton)
description: >-
  Manually annotated 3D nuclear instance segmentation volumes: 9 adult mouse liver stacks (DAPI, two-photon),
  12 mouse liver HCC/control stacks (evaluation only) and 5 Drosophila larval brain glia stacks (Repo-stained,
  confocal), released with the NucVerse3D paper (26 image/mask pairs in raw.zip, ~6,200 nuclei). The record
  also holds patches, model weights and segmentation outputs.
