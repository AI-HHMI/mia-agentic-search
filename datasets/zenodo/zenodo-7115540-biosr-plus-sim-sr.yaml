notes: 'Five zips (CCPs, ER, Microtubules, F-actin, Myosin-IIA); zips listed with peek_archive show Cell_XXX/Level_01-08/RawSIMData.mrc
  + RawSIMData_gt.mrc pairs. Zenodo record says free for non-commercial use with citation of both papers, while
  metadata license is CC-BY-4.0. Voxel size, organism/cell line, dimensionality of stacks and item count not stated
  on the record; both papers are not open access in Europe PMC (only abstracts read), so these are left null/empty.
  Dimensionality 2D is inferred from small per-file sizes (2.4-4.7 MB) and should be confirmed. n_items not counted
  across all zips. enricher: exact size from Zenodo listing; n_items = 1880 Level folders (each one RawSIMData.mrc
  + RawSIMData_gt.mrc pair) across the 5 zips. Each file is a 9x256x512 uint16 stack of raw SIM frames (sampled),
  so the GT is high-SNR raw SIM data, not a reconstructed image.'
