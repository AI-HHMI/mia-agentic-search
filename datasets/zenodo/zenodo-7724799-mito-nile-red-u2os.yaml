title: "MITO training datasets for live cell anatomy segmentation"
short_name: "U2-OS mitochondria segmentation (spinning-disk)"
description: >-
  Training data for mitochondria segmentation from live U2-OS cells stained with Nile Red and imaged by
  super-resolution spinning-disk microscopy. The archive holds 123 TIFF files organised as per-cell folders
  each with fluo.tif (intensity), ratio.tif (spectral emission ratio) and label.tif (mask), described on
  Zenodo as acquired from two microscopes. Released with a deep-learning study segmenting 15 subcellular structures.
