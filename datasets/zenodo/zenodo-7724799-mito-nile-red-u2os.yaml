notes: >-
  Single MITO.zip (2.7 GB, 123 .tif files, listed with peek_archive; only the first 40 paths were shown, all in
  MITO/M1_U2OS, so n_items=41 is inferred as 123/3 and the second microscope's folder was not seen). Voxel size
  not stated on the Zenodo page, its API record or the preprint Methods (FoV 1200x1200xNz px, Nz 12-30, resized to
  802x802x24). Zenodo has no linked publication; the linked preprint was identified by title match (Zhanghao K, Li M et al.),
  which is unconfirmed. Per the preprint, masks for non-manually-annotated structures such as mitochondria come from
  GFP colocalization images segmented by a pre-trained FG-net (trained on 40 manual annotations), hence
  annotation source 'mixed'. Preprint license CC-BY-NC-ND vs. Zenodo CC-BY-4.0. No train/test split seen.
