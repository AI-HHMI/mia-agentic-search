notes: 'Zenodo v1.2 page states CC BY-NC 4.0; the arXiv paper (and its text) states CC BY-NC-ND 4.0 and cites the concept/earlier record zenodo.org/records/15083188, so the license terms should be confirmed. Pixel size is not given on the Zenodo page, the paper text or the archive listing (75 .tif + 4 COCO json files: gen/anno_gen.json and spec train/val/test json). Annotation is manual with model-assisted soma annotation refined by biologists; labels are cell type A, cell type B and soma. Split: spec has 30 train / 4 val / 11 test images; gen (30 images) is for generalization testing. Sources checked: Zenodo page and API record, archive listing, arXiv abstract and HTML.'
