notes: 'Zenodo page, API record and zip file listing (peek_archive) checked: 14,014 files in from_manual_mixed_200x800/img and 14,013
  in from_manual_mixed_200x800/seg (the page names the folders roi_mixed_200x800/img and /seg). Pixel size, image dimensions (name suggests
  200x800), mask class semantics and train/val/test split are not stated on the page or in the file listing. No associated paper
  found via Europe PMC/Crossref title search and the record has no related identifiers, so no paper Methods could be read. Objective
  (Nikon 40x/0.95), camera (Teledyne Kinetix sCMOS) and GFP excitation are from the page; widefield vs other fluorescence is not stated,
  so modality is fluorescence-other. Only the annotation folder name and page text indicate manual annotation. Confidence reduced
  for missing documentation. A sibling record, 17569655, holds segmentation training data for the same DeLTA setup in a nested zip
  that could not be listed.'
