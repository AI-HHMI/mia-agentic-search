notes: Released for self-supervised / foundation-model pretraining, no segmentation labels. Six tar.gz archives (one
  per source plus text prompts); patches are NIfTI (.nii.gz, 96^3) in per-image, per-channel folders, text prompts are
  JSON (seen by streaming the archive headers). Voxel size, per-source organism and microscope are not stated on the
  Zenodo record or in the arXiv paper text checked (Methods, data sections), and the patches are cropped from public
  datasets (SELMA3D, Allen Institute), each under its own terms. Organisms from the paper (mouse Wu Lab and SELMA3D,
  human SELMA3D and Allen human brain) and record names; not broken down per patch. Paper text is arXiv-only; no Europe
  PMC full text.
