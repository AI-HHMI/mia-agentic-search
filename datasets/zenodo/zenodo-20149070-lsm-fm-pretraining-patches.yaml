title: Light Sheet Microscopy Foundation Model Pretraining Dataset
short_name: Light-sheet 3D patches with text prompts
description: 1,023 volumetric 96x96x96-voxel patches of light-sheet fluorescence microscopy brain images (an
  internal Wu Lab mouse whole-brain set plus SELMA3D and three Allen Institute public datasets), each source
  paired with expert-written text descriptions. Released as the pretraining data for a multimodal 3D
  foundation model for light-sheet microscopy (masked reconstruction plus image-text alignment).
