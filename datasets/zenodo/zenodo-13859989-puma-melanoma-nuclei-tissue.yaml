notes: Training set only (206 of 310 ROIs); the remaining ROIs are the hidden challenge test set. Files are 206 .tif ROIs (plus
  206 context-ROI tifs, 14.2 GB) and 206 nuclei GeoJSON files in zips; a separate zip holds tissue GeoJSON. License on the Zenodo page is
  CC-BY-4.0, while the paper's data section states CC0 1.0 for the dataset; the Zenodo record was used. Format 'other' is GeoJSON.
  Pixel size 0.23 um from the Zenodo page and paper Methods. Voxel size, organism (human patient specimens) checked on page and paper.
