id: zenodo-13859989-puma-melanoma-nuclei-tissue
title: PUMA melanoma H&E dataset with nuclei and tissue annotations (training set)
short_name: Melanoma H&E nuclei and tissue segmentation
description: 206 H&E-stained melanoma regions of interest (103 primary, 103 metastatic; 1024 x 1024 px at 40x, 0.23 um/px,
  Hamamatsu scanner) with 5120 x 5120 px context ROIs. Manually annotated nuclei instances (10 classes such as tumor, lymphocyte,
  plasma cell, stroma) and tissue regions (tumor, stroma, epidermis, necrosis, blood vessel, background) as GeoJSON. Released as the
  public training set of the PUMA challenge.
