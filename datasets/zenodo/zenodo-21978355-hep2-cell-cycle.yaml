title: The human epithelial cell cycle dataset for deep learning and biomedical research (HEp-2 dataset)
short_name: HEp-2 cell cycle phase classification (DAPI)
description: DAPI-stained HEp-2 (HeLa-contaminated) fluorescence microscopy images. 10,000 expert-labelled
  single-cell 256x256 crops (ExpD) and 100,000 CNN-pre-classified, expert-reviewed crops (CNN-D), each assigned
  to one of seven groups (interphase, prophase, metaphase, anaphase, telophase, artefact, triple), plus 1,000
  unlabelled full field-of-view images (1936x1216).
