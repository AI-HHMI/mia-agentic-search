notes: 'Zip listing (peek_archive) shows 421 image/mask pairs plus manifest.csv and README (842 tif files). Pixel size
  not stated on the Zenodo record or in the Scanlon 2022 Methods (Olympus VivaView, 20x/0.75 objective with 0.5x lens,
  Hamamatsu ORCA-Flash4.0 camera), so voxel_size_nm is null. The deposit calls the images brightfield; the source paper
  describes DIC time-lapse acquisition. No train/val/test split is provided in the deposit. Annotation described as manually
  curated; procedure details not in the paper (it covers tracking, not this mask set). The UCell paper was not located.
  enricher: in-zip README confirms 1024x1344 uint8 images / uint16 instance masks, no pixel size; in-zip LICENSE is CC
  BY 4.0.'
