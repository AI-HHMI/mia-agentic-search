id: zenodo-22163254-hspc2-brightfield-cells
title: 'HSPC2: brightfield images of human hematopoietic stem and progenitor cells with single-cell instance masks'
short_name: Human HSPC instance segmentation (brightfield)
description: 421 brightfield images (1024 x 1344, uint8) of primary human hematopoietic stem and progenitor cells, each
  paired with a manually curated instance mask, 2,446 annotated cells in total. Frames come from the long-term time-lapse
  study of Scanlon et al. 2022 and are packaged as a segmentation benchmark (the out-of-domain HSPC evaluation set of
  the UCell study). Cells are not tracked between frames.
