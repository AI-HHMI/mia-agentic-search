notes: >-
  Checked Zenodo record page and API record (200 TIFFs 001-200, 86-156 MB each, plus MIDOG.json 382 KB) and
  the arXiv preprint of the challenge paper (Methods 2.2-2.3); the journal version is not open access.
  Images 001-050 Hamamatsu XR, 051-100 Hamamatsu S360, 101-150 Aperio CS2, 151-200 Leica GT450.
  Per the paper, Leica GT450 images have no labels (provided for unsupervised domain adaptation), so
  about 150 of 200 images are annotated. Paper optical resolutions are 0.23 (Hamamatsu), 0.25 (Aperio CS2) and
  0.26 (Leica) um/px at 40x; voxel_size_nm uses 230 nm for the Hamamatsu scanners only and varies per scanner.
  Labels: one expert screened, RetinaNet found missed candidates, second expert blind-labeled, third expert
  resolved disagreements. Total annotation counts and the format of the WSI-derived TIFFs (pyramidal or not)
  were not confirmed. Zenodo author list was not extracted. This is a histology whole slide image dataset.
