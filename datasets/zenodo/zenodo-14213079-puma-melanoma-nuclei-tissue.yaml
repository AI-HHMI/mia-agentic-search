title: Melanoma Histopathology Dataset with Tissue and Nuclei Annotations (PUMA training set)
short_name: PUMA melanoma nuclei and tissue (H&E)
description: H&E-stained primary and metastatic melanoma regions of interest (1024x1024 px at 40x, 0.23 um/px) with manual nuclei instance annotations in 10 classes and tissue segmentation annotations in 6 classes, plus 5120x5120 px context images. This is the public training part of the PUMA challenge dataset.
