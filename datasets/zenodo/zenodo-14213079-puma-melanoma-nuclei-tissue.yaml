notes: 'Zenodo lists four archives: nuclei GeoJSON (205 files), tissue GeoJSON, ROI TIFFs (205 files, peeked) and context TIFFs (14.1 GB). Zenodo page and archive listing show 205 ROIs (103 primary + 102 metastatic); the paper says 103+103 in the public training set. Only the training set is public; the test set is hidden for the PUMA challenge until 2029. No train/val split is provided. Nuclei annotations: 10 classes; tissue: 6 classes. Tissue GeoJSON and context TIFF archives were not peeked.'
