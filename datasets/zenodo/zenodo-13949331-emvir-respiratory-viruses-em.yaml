notes: >-
  Counts from peek_archive of EMViR_dataset.zip: 2,168 .tif files = 1,084 image/mask pairs (762 train, 157 val,
  165 test); by filename prefix 518 adeno, 640 corona, 612 orthomyxo, 398 paramyxo files (images+masks).
  Pixel size, microscope, annotation procedure and annotator are not stated on the Zenodo page; the ISBI 2025 paper
  is not open access (Europe PMC/Crossref return only the abstract) and no preprint was found, so they are left
  null/unknown. The .zip holds the images and masks; formats 'other' covers the COCO JSON in the separate zip.
