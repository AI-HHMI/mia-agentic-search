title: Dataset of "Volumetric denoising enables efficient acquisition of volume electron microscopy"
short_name: Mouse brain denoising pairs (SBF/PFIB-SEM)
description: Raw volume EM of mouse brain acquired by SBF-SEM and plasma-FIB-SEM at several dwell times and section thicknesses. Includes fast/slow-scan (snapshot vs reference) stack pairs for supervised denoising, thin-section SBF-SEM stacks for self-supervised denoising, and a PFIB-SEM volume pair with expert mitochondria and synapse annotations.
