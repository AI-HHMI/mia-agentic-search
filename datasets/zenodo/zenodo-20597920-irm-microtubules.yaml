notes: >-
  Modality is interference microscopy (IRM), not an enum value, so 'other'. Acquired on four Nikon
  Eclipse Ti-E/Ti-2 microscopes, 60x or 100x oil NA 1.49; masks drawn manually in ImageJ with the
  handline tool (3 px at 60x, 5 px at 100x). Zip listings: Test_dataset has Prediction_source and
  Prediction_target (31 pairs), Training_dataset has 412 TIFFs (206 pairs). Pixel size not stated on the
  Zenodo page or in the paper abstract. Full paper text could not be retrieved (Europe PMC 503, arXiv
  PDF too large), so tubulin source and pixel size are unverified. Size is the sum of the two zips.
