notes: 'OSF component k2d7q of the project osf.io/dnp65 (DiffusionModelsForImageSynthesis), one of seven
  synthetic datasets from the paper. Files listed through the OSF API (images/ and masks/ folders of TIFF
  files; counts and sizes summed from the listing). The images are not real microscopy: they are generated
  by a denoising diffusion model from sketches of cellular structures, to train segmentation models. The
  paper treats each 2D+t stack as a 3D image (96, 96, 90). Annotated source cells were tracked and manually
  annotated for 90 frames each; sketches are made from those annotations. Voxel/pixel size not stated
  on OSF or in the paper. The OSF project license is Apache License 2.0 (OSF license field); the paper
  gives no separate data license. Sibling components: jzkhs, k2d7q, jg4de, yb29n, 5btwy, zrmnv, 73ach.
  enricher: masks float32 binary 0/1 per frame, images uint8 tyx (sampled).'
