notes: 'Synthetic (simulated) images with generated labels, not real microscopy. The CBIA page asks users to cite Svoboda D. et al., ICIP 2016, but no paper could be found with tools/paper.py (not in Europe PMC or Crossref), so no publication is listed. Zip listings via peek_archive: vasculogenesis-images.zip (997 PNG, 171 MB) and vasculogenesis-labels.zip (997 PNG, 11 MB). The page states no license or terms beyond the citation request. Whether labels are instance ids or binary was not checked. Pixel size, frame interval and cell line are not stated. Sources checked: CBIA datasets page, both zip listings.'
