notes: 'Synthetic (simulated) images with generated labels, not real microscopy. The CBIA page asks users
  to cite Svoboda D. et al., ICIP 2016, but no paper could be found with tools/paper.py (not in Europe
  PMC or Crossref), so no publication is listed. Zip listings via peek_archive: vasculogenesis-images.zip
  (997 PNG, 171 MB) and vasculogenesis-labels.zip (997 PNG, 11 MB). The page states no license or terms
  beyond the citation request. Pixel size, frame interval and cell line are not stated. Sources checked:
  CBIA datasets page, both zip listings. enricher: sampled masks are binary 0/255 foreground, not instance
  ids, so annotation type changed instance-segmentation -> semantic-segmentation; n_items 997 -> 1994
  (997 images + 997 masks).'
