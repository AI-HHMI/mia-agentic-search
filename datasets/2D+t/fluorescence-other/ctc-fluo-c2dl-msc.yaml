notes: 'Training zip: sequences 01, 02 (about 49 frames each), GT/TRA 49 masks each, gold GT/SEG 18 (01) and 33 (02) frames, silver ST/SEG 48 per sequence. CTC page lists a 10x/0.3 objective, 0.3 um pixels, 20 min steps and, in parentheses, 20x/0.75, 0.3977 um, 30 min (likely the other sequence; mapping unverified, so voxel size is null). Custom terms: cite the Nature Methods papers; non-CTC scientific or commercial use needs organizer permission; cloning datasets or annotations is prohibited. Size is the compressed training zip. The Nature Methods paper is not open access (abstract record only), so annotation procedure is unknown. Checked: CTC 2D page, terms page, zip listing.'
