notes: 'Record file list and data_explanations.txt read; paQuasAr6a.zip (26 files: 10 frames.tif/dat.tif
  stacks plus .mat) and Penicillium.zip (two 2.1 GB TIFFs) were listed with peek_archive; other zips were
  not listed. Record is explicitly a self-supervised denoising release (paper Methods/Data availability
  read). Only the Penicillium pair is a true noisy/clean pair; voltage datasets are single noisy recordings,
  some with simultaneous electrophysiology. Mixed datasets: voxel size is null at record level; the paper
  gives 0.34 um pixels and 0.1 um z-step for Penicillium only. Organism for Penicillium is genus-level.
  Record description also mentions C. elegans, but no C. elegans file is listed. enricher: size_bytes
  49,197,176,790 from the file listing (was null). organisms: Mus musculus = paQuasAr6a, Voltron2, SomArchon,
  Expansion_microscopy; Danio rerio = zebrafish_spinal_cord_*, Zebrafish; Penicillium = Penicillium.zip.'
