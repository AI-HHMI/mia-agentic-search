title: 'SUPPORT: voltage, calcium and volumetric fluorescence imaging data for self-supervised denoising (Zenodo)'
short_name: SUPPORT voltage/calcium imaging denoising
description: 'Data accompanying the SUPPORT self-supervised denoising paper (Nature Methods 2023): one-photon
  voltage imaging of paQuasAr6a- and Voltron2-expressing mouse cortex neurons (with patch-clamp), zArchon
  voltage imaging in zebrafish spinal cord, SomArchon in mouse hippocampal neurons, zebrafish
  calcium imaging series from seven brain regions, expansion-microscopy volumes of mouse embryo
  bone, intestine and tail, and a confocal Penicillium volume imaged at low and high SNR (1,000 z-slices
  each), usable as a noisy/clean pair. About 49 GB in 15 files.'
