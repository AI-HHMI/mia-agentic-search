id: s-biad1683-podosome-hole-segmentation
title: 'Tracking Coordinated Cellular Dynamics in Time-Lapse Microscopy with ARCOS.px'
short_name: REF52 podosome / MCF10A hole masks (widefield)
description: Fluorescence time-lapse movies of REF52 fibroblasts (Lifeact podosome-like structures after PDGF,
  with blebbistatin, latrunculin B, Y-27632 or DMSO; 111 raw crops, each with a matching segmentation movie)
  and of MCF10A epithelial monolayers treated with doxorubicin (8 raw movies, each with a segmented-holes movie).
  The study also holds unlabelled raw movies of an optogenetic RhoA wave, a single-FOV podosome movie and an
  actin polymerization wave (TIRF).
