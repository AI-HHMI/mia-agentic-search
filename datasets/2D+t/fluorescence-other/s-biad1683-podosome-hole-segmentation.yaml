notes: 'Labelled parts: podosome-like structures (3_podosome_tracks/4treat: raw/ and seg/ folders, 111 crops) and
  hole formation (5_hole_tracking: 8 raw and 8 segmented_holes movies); the other components are raw only.
  Masks are semantic, made with convpaint / Ilastik pixel classifiers, not manually curated (preprint Methods).
  Pixel size and mask encoding are not stated on the BioStudies page, file lists or preprint text (JCS version
  not open access). size_bytes and n_items sum all 243 listed files, including unlabelled components.'
