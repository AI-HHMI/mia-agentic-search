notes: 'Labelled parts: podosome-like structures (3_podosome_tracks/4treat: raw/ and seg/, 111 crops, convpaint masks) and
  hole formation (5_hole_tracking: 8 raw and 8 segmented_holes movies, Ilastik probability maps); other components are raw
  only. Masks are automatic (pixel classifiers), not manually curated. organisms: Rattus norvegicus = 2_synthetic_rhoa_wave/,
  3_podosome_tracks/, 4_polymerization_wave/; Homo sapiens = 5_hole_tracking/. Voxel size differs per subset (see technical.notes),
  so imaging.voxel_size_nm stays null. size_bytes and n_items sum all 243 data files listed by BioStudies, incl. unlabelled
  components. enricher: data.formats + ome-tiff (segmented_holes are OME-TIFF).'
