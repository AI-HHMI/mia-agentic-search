  (oblique-illumination TIRF) for detecting and segmenting miniature synaptic calcium transients (mSCTs):
  raw OME-TIFF videos (raw-input/) and gold-standard expert annotations (manual-expert/), point centroids
  per event as CSV and manual TIFF annotation volumes. The training set is hosted separately in the authors''
  GitHub repository.'
