notes: 'Zip listing (peek_archive): 5812.1 MB compressed, 44 files: 34 .tif (raw-input videos of about
  315 MB each and manual-expert manual_*.tif of about 157 MB each) and 10 .csv, matching the paper''s
  test set of 10 videos annotated by an expert (point annotations of event centroids at the peak frame).
  This record is the testing set only; the training set (14 videos with intensity-threshold annotations)
  is hosted at github.com/FLClab/Calcium-Analysis, not in this deposit. A companion record zenodo.org/records/18601510
  adds revised detections with event types. Pixel size and frame rate are not stated on the Zenodo page
  or in the preprint text read (Europe PMC / bioRxiv), so voxel size is null. The preprint is the cited
  paper; the Zenodo page names the published version only by title. enricher: n_items 24 raw videos (10
  with expert labels), from the zip listing (was null).'
