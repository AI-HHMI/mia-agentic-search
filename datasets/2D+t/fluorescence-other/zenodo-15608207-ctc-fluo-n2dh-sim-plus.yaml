notes: 'Zenodo record has no description; license CC-BY-4.0 is the one shown in the Zenodo API record.
  Zip index read with peek_archive (862 files): sequence 01 has 65 raw frames and 65 GT/SEG + 65 GT/TRA
  files, sequence 02 has 150 of each, plus ERR_SEG mask folders and man_track.txt. Cell type, microscope
  being simulated (Zeiss Axiovert 100S, 40x/1.3), pixel size (0.125 um) and 29 min interval are from the CTC
  2D dataset table, not the Zenodo page. Images are computer-generated; the paper states synthetic
  datasets have exact simulated phantoms as reference annotations, so ground truth is dense and
  automatic (simulation) rather than manual. Test-set annotations are secret. The CTC-hosted copy of
  this dataset is not in the catalog.'
