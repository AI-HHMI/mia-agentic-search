notes: 'Custom terms: attribution required (cite the CTC Nature Methods papers); non-CTC scientific use requires
  organizer permission, commercial use needs permission, cloning of the datasets prohibited. Training zip contains
  sequences 01 and 02 (about 92 frames each, 2D tif) with 30 and 20 SEG masks (silver reference, sparse over time)
  and 93 TRA masks each. Pixel size 0.24 um from the CTC 2D dataset table. The paper full text was not open via
  Europe PMC, so microscope, staining details and annotation procedure were not verified; annotation source left
  unknown. Other CTC 2D datasets are not yet in the catalog. enricher: size_bytes 59,331,035 exact (was 62,189,568).
  The zip also holds 01_ST/02_ST silver-truth SEG masks for every frame (92 each), next to the sparse gold GT SEG
  (30 / 20 frames).'
