notes: 'Single time-lapse stack, so size is at the lower bound of the usable criteria. Facts from the Zenodo page and the imagej.net
  TrackMate-Cellpose tutorial: red channel nuclei, green cytoplasm with variable staining, blue empty; segmentation with the pretrained
  cyto3 model (cell diameter about 40 um, channel 2 target, channel 1 optional); Overlap tracker (scale 1.2, min IoU 0.3, precise
  mode) because LAP gave too many false divisions; the tutorial notes some divisions are still missed. TIFF header read by range
  request: ImageJ TIFF, 92 frames x 3 channels x 1024 x 1024, uint8, uncompressed, 633.7449 nm pixels. The cell line (species), stains,
  microscope and frame interval are not stated, so organism is empty. The XML was not opened (spot and track counts unknown); the
  publication date is not shown on the Zenodo page content read, so it is null. Zenodo listing: TIF 289,457,066 B, XML 103,040,812 B,
  PNG 506,889 B (size_bytes is their sum).'
