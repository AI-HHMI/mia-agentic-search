notes: 'Single time-lapse stack, so size is at the lower bound of the usable criteria. Facts from the
  Zenodo page and the imagej.net TrackMate-Cellpose tutorial: red channel nuclei, green cytoplasm with
  variable staining, blue empty; segmentation with the pretrained cyto3 model (cell diameter about 40
  um, channel 2 target, channel 1 optional); Overlap tracker (scale 1.2, min IoU 0.3, precise mode) because
  LAP gave too many false divisions; the tutorial notes some divisions are still missed. The cell line
  (species), stains, microscope and frame interval are not stated, so organism is empty. The publication
  date is not shown on the Zenodo page content read, so it is null. enricher: the shipped XML says CELLPOSE_DETECTOR
  model CYTO (diameter 30, target ch 2) and SIMPLE_SPARSE_LAP_TRACKER, not cyto3/Overlap as on the tutorial
  page; 20,857 spots with ROI polygons in 460 tracks; interval 10 min.'
