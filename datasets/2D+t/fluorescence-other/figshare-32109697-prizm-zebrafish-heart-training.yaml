notes: Listed training_dataset.zip (10,736 files = 5,368 jpg + 5,368 'Simple Segmentation' png; the name
  is ilastik's output name, so masks may come from an ilastik pixel classifier rather than purely manual
  tracing; annotation procedure is not described on the figshare page) and 'Representative image dataset.zip'
  (8,246 jpg time-lapse frames plus xml/xsl metadata, 0.6 GB). Other files are drug-group zips, per-fish
  metric xlsx files and the PRIZM-DeepLab ONNX model (176 MB). The accompanying paper could not be found
  (Europe PMC title search and web search), so pixel size, microscope, magnification, frame rate and the
  class definitions of the masks are not stated in the sources read. size_bytes is the sum of all 30 files
  on the record.
