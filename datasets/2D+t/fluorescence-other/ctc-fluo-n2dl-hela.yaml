notes: 'Custom CTC terms: cite the Nature Methods paper and acknowledge the Cell Tracking Challenge; CTC-related
  use needs no consent, other public scientific use and commercial use require explicit permission, cloning of datasets
  or reference annotations is forbidden. Training zip (199.3 MB, 774 members) holds sequences 01 and 02 (92 tif
  frames each) with GT/SEG on 28 and 8 frames (gold, sparse), GT/TRA on all 92 frames plus man_track.txt, ST silver
  SEG on all frames and ERR_SEG. Microscope Olympus IX81, Plan 10x/0.4, pixel 0.645 um and 30 min time step from
  the CTC 2D dataset page. The paper full text is not open access via Europe PMC, so annotation procedure was not
  verified and source is left unknown.'
