notes: 'BioStudies file list (6 files): calcium_waves.tif (478 MB, [t,y,x] = [300,1024,1024]), annotations.npz, segmentation.npz,
  edges.npz, properties.csv, arcos_output.csv. The Convpaint paper (Workflow 2) says nuclei were segmented by training Convpaint
  with scribbles across several frames, then post-processing with napari-assistant; so annotations.npz is most likely those
  sparse scribbles and segmentation.npz the classifier output (semi-automatic, not expert ground truth). The .npz contents were
  not opened. Training signal is therefore weak: one time-lapse with sparse, user-drawn scribbles. Size is the sum of the six
  listed files (672,661,949 B), not given as a total on the page. Pixel size 0.86 um comes from the dataset description; the
  deposit also notes the original images are from the Fujita lab (Current Biology 2020, 10.1016/j.cub.2019.11.089). Single
  channel (GCaMP6S).'
