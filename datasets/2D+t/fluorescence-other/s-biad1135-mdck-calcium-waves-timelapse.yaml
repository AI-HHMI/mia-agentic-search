notes: 'BioStudies file list: calcium_waves.tif ([t,y,x] = [300,1024,1024]), annotations.npz, segmentation.npz,
  edges.npz, properties.csv, arcos_output.csv. Convpaint paper (Workflow 2): nuclei segmented by training
  Convpaint with scribbles, then napari-assistant post-processing. Training signal is weak: one time-lapse,
  sparse scribbles plus automatic labels. Pixel size 0.86 um from the dataset description; original images
  from the Fujita lab (10.1016/j.cub.2019.11.089). annotations.source mixed: annotations.npz = manual
  scribbles, segmentation.npz = automatic. enricher: opened both npz (scribbles only in index 53 of 80
  frames; 4059 instance ids over 300 frames); download_url stays null (no single archive).'
