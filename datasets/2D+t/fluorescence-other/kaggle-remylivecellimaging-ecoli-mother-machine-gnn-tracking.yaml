description: Fluorescence time-lapse stacks of E. coli MG1655 cells in mother-machine microchannels (0.11 um per pixel) as
  NumPy arrays, with per-cell lookup tables (bounding boxes, centroids, cell size and angle) and a ground-truth adjacency
  matrix linking cells across frames, used to train a graph neural network tracker.
