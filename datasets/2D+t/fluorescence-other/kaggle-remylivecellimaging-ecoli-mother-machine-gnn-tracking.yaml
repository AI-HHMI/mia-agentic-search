notes: 'Kaggle API record read (license shown as Unknown, 1.0 GB, .npy files, 0.11 um per pixel, array
  layout described) plus the open-access JPCB paper full text (mother machine, Nikon Ti2, 100x 1.49 NA,
  EM-CCD, mKate2 marker, GNN tracking after detection and segmentation). No license or terms stated anywhere
  found, so spdx unknown. The number of files/frames, how the ground-truth adjacency matrix was produced
  (manual vs corrected automatic) and the file listing were not seen (Kaggle page is JavaScript-rendered;
  paper has no data availability link to this set). The 0.11 um pixel size comes from the Kaggle description.
  Uploader name is the Kaggle account name; real authors per the paper are Ripandelli, Mueller, Robinson
  and van Oijen. enricher: 152 .npy files in train/ (142) and val/ (10), so splits_provided true; arrays
  seen in one file.'
