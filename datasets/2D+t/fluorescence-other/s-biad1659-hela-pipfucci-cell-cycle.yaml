notes: BioStudies record read in full (biosample, acquisition, annotation sections); Files/ holds raw_data/
  and segmentation_masks/ plus file lists (982,332 mask files by the API section counts). Of 982,332 nucleus
  images, 636,304 carry a manual phase label (217,465 G1, 257,984 S, 160,855 G2/M; 346,028 unlabeled)
  derived from PIP-FUCCI intensity over time; 15,026 tracks from TrackMate. Masks come from Cellpose 2.0
  fine-tuned on 20 frames (automatic, human-in-the-loop), hence source mixed. Pixel size 0.102 um from
  the BioStudies text. Total size not stated and the data folders were not fully listed, so size_bytes
  is null. A 770 MB subset (nuclei_subset.7z) is also on Zenodo 14614787 (CC-BY-4.0). The raw_data tiff
  naming/dimensions of the per-nucleus crops were not opened.
