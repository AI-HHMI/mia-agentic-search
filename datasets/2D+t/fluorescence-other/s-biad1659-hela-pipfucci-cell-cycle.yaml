description: 982,332 single-nucleus images from 40 h live-cell time-lapses of HeLa Kyoto cells (PIP-FUCCI
  two channels plus SiR-DNA), with nucleus segmentation masks and G1 / S / G2-M cell cycle phase labels
  for 636,304 nuclei, released for cell cycle phase prediction from the DNA channel.
