notes: 'Training data are simulated (SIMULATED-train.zip, 7.7 GB, 36000 TIFF frames and 18 XML files; test and real
  splits are in separate zips). The REAL.zip (207 TIFF, 6 XML) re-packages frames from published videos (CCR5 eLife
  Video4, EB1 Movie2, lysosome Zenodo 10.5281/zenodo.10076346). Main use is training temporal frame interpolation
  (listed as task other); XML files are particle tracks, and whether they are simulator ground truth or TrackMate
  output was not stated. Pixel size, frame counts, and the simulation parameters are not stated on the Zenodo page,
  GitHub README, or the paper abstract; the paper full text is not open access (Research Square preprint). enricher:
  annotations.source mixed: simulator ground truth (TrackContestISBI2012 XML) for SIMULATED sets, TrackMate v7.12.2
  output (_Tracks.xml) for REAL; n_items = 36,807 TIFF frames from zip listing (was null).'
