title: Preprocessed simulated and real subcellular live-cell time-lapse data for SuB-VFI video frame interpolation
short_name: Subcellular live-cell time-lapse (fluorescence)
description: Preprocessed dataset for SuB-VFI, a temporal frame-interpolation method for live-cell subcellular imaging.
  Contains a large simulated training set (ISBI Particle Tracking Challenge style MICROTUBULE, RECEPTOR and VESICLE
  time series at SNR 7 and different densities, TIFF frames plus XML track files), a simulated test set, and a small
  set of real fluorescence time-lapse frames (CCR5, EB1, lysosome) taken from earlier publications.
