short_name: Mouse stem cell tracking (fluorescence)
description: Two 2D fluorescence time-lapse sequences (01 and 02, 92 frames each) of GFP-GOWT1 mouse stem cells
  from the Cell Tracking Challenge training set. Each sequence has manual gold-truth segmentation masks for a subset
  of frames, tracking markers with a man_track.txt lineage table for every frame, and silver-truth segmentation
  masks for every frame. Deposited on Zenodo by the Cell Tracking Challenge.
