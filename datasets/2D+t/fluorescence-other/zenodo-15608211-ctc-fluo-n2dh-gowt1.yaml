notes: 'Zenodo record has no description; license CC-BY-4.0 is the one shown in the Zenodo API record. Zip index
  read with peek_archive (788 files): 92 raw frames per sequence; GT/SEG manual masks for 30 frames (seq 01) and
  20 frames (seq 02); GT/TRA 92 marker images plus man_track.txt per sequence; ST/SEG silver masks for 92 frames
  per sequence; ERR_SEG mask folders. Cell type, microscope, objective, pixel size (0.240 um) and 5 min interval
  are from the CTC 2D datasets page, not the Zenodo page. The page and paper describe the training-set annotations
  as silver reference (gold for a subset); test-set annotations are secret. Image size, dtype and bit depth not
  probed. Paper Methods and data section read via Europe PMC (general CTC description; no per-dataset license beyond
  the CC-BY 4.0 Zenodo record).'
