notes: 'Each dataset is a zip at s3.amazonaws.com/neuro.datasets/challenges/neurofinder/neurofinder.NN.NN.zip (0.73-1.81 GB; the 19
  training zips total 19,892,683,030 B). Listing of 00.00 and 01.00: README.md, regions/regions.json, 3,024 / 2,250 TIFF frames
  (about 0.5 MB each), loader scripts. The 9 test zips have no ground truth. Per the CaImAn paper the Neurofinder annotations were
  made either manually or by segmenting a static structural-indicator image (source mixed); data came from the Hausser, Losonczy,
  Svoboda and Harvey labs. No license on the GitHub page or the zip README, so license unknown. Organism, pixel size and frame rate
  not found (neurofinder.codeneuro.org returned 503; info.json inside the zips could not be read remotely). Counts and sizes are
  of the 19 training zips only.'
