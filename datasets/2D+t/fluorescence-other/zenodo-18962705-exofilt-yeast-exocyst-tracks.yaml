notes: 'Found via the 2026 Bioinformatics paper (Europe PMC full text read: Methods and Data availability).
  n_items is 61 movies (RD1 4, RD2 4, Sec1 53; zip listings). Labels cover filtered tracks only: FD1 =
  RD1 movies FILE_ID 0-3 (1,594 tracks, 5 annotators), FD2 = RD2 movies 4-7 (1,600 tracks, 1 annotator);
  the 53 Sec1 movies have no labels. Tasks are exocytic-event classification of tracked puncta. enricher:
  voxel size differs by subset/unknown, so null: RD1/RD2 Micro-Manager metadata PixelSizeUm 0.13 (130
  nm, binning 2); Sec1 ImageJ TIFFs carry no calibration. size_bytes exact from the Zenodo listing; download_url
  set to the record page (5 separate files; RD1.zip was only one part). Micro-Manager channel group is
  named TIRF; illumination mode not stated in the paper, modality kept.'
technical:
  method: header
  size_source: file-listing
  layout:
    tree: "./                                        5 files, 35.6 GB\n  RD1.zip                1.7 GB\
      \   RD1/OGY1200_{0..3}_MMStack_Pos0.ome.tif   (4 x 886 MB)\n  RD2.zip                1.7 GB   RD2/OGY1200_{4..7}_MMStack_Pos0.ome.tif\
      \   (4 x 886 MB)\n  Sec1_case_study.zip    32.2 GB  1_Raw/OGY1192_{1,2,3}_MMStack_Pos{1..53}.ome.tif\
      \   (53 x 1.29 GB)\n  Annotations_FD1.csv    520 KB   1594 tracks x 26 cols (Ann1-Ann5, FILE_ID\
      \ 0-3, TrackMate features)\n  Annotations_FD2.csv    458 KB   1600 tracks x 22 cols (MANUAL_ID,\
      \ FILE_ID 4-7, TrackMate features)"
    n_files: 5
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/18962705/files/RD1.zip?download=1::RD1/OGY1200_0_MMStack_Pos0.ome.tif
    - https://zenodo.org/records/18962705/files/Annotations_FD1.csv?download=1
    size_bytes: 886611494
    description: One RD1 movie (FILE_ID 0, 886 MB uncompressed, 417 MB deflated in the zip) and the FD1
      track annotation table (237 of its rows are tracks of this movie).
  arrays:
  - role: raw
    path_pattern: RD?.zip/RD?/*.ome.tif
    format: ome-tiff
    axes: tyx
    shape:
    - 615
    - 700
    - 1023
    shape_varies: false
    dtype: uint16
    compression: none
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Micro-Manager MMStack OME-TIFF: pages 1023x700 uint16 uncompressed, ChannelIndex
      0, Binning 2, PixelSizeUm 0.13, Exposure 80 ms. 615 frames per the paper (page stride 1,440,289
      B fits the 886 MB member). Frames hold two channel halves side by side; ExoFILT splits them (tracks
      lie at x <= 501 px).'
  - role: raw
    path_pattern: Sec1_case_study.zip/1_Raw/*.ome.tif
    format: tiff
    axes: tyx
    shape:
    - 615
    - 1024
    - 1024
    shape_varies: false
    dtype: uint16
    compression: none
    normalization: unknown
    alignment: not-applicable
    alignment_notes: ImageJ hyperstack (description images=615 frames=615), despite the .ome.tif name;
      no spatial calibration in the header. Case-study movies without track labels.
  - role: label
    path_pattern: Annotations_FD1.csv
    format: csv
    axes: null
    shape:
    - 1594
    - 26
    shape_varies: false
    dtype: unknown
    compression: none
    encoding: tracks-table
    classes:
    - id: bona fide
      name: bona fide exocytic event
    - id: ambiguous
      name: ambiguous
    alignment: same-grid
    alignment_notes: 'One row per TrackMate track; FILE_ID n = RD1/OGY1200_n movie; TRACK_X/Y_LOCATION
      in pixels (ExoFILT sets calibration to 1 px) on the split C1 half; TRACK_START/STOP in frames. Ann1-Ann5:
      bona fide 91/84/40/34/71 of 1594.'
  - role: label
    path_pattern: Annotations_FD2.csv
    format: csv
    axes: null
    shape:
    - 1600
    - 22
    shape_varies: false
    dtype: unknown
    compression: none
    encoding: tracks-table
    classes:
    - id: bona fide
      name: bona fide exocytic event
    - id: ambiguous
      name: ambiguous
    alignment: same-grid
    alignment_notes: Same columns with a single MANUAL_ID label (bona fide 119, ambiguous 1481); FILE_ID
      4-7 = RD2/OGY1200_4..7.
  notes: 'Listing: tools/listing.py over the 5 Zenodo files (61 zip members, exact sizes). Headers of
    deflated zip members read with a range-reading script: RD1 movie first IFD plus Micro-Manager per-frame
    JSON (~2 MB inflated), Sec1 first IFD. Both CSVs read in full. No pixel sample: each movie is 886
    MB-1.29 GB uncompressed and deflated in its zip, so value_range is not measured. Voxel size: RD1/RD2
    PixelSizeUm 0.13 from Micro-Manager metadata; Sec1 uncalibrated; paper full text and ExoFILT GitHub
    scripts (calibration set to 1 px) give none. Download: all 5 Zenodo files are direct (range requests);
    no single archive for the whole dataset.'
