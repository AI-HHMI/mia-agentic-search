notes: 'Found via the 2026 Bioinformatics paper (Europe PMC full text read: Methods and Data availability). Annotations_FD1.csv header was
  read (columns Ann1-Ann5, track ids and features); the three movie zips (RD1 1.7 GB, RD2 1.7 GB, Sec1_case_study 32 GB) could not be
  listed remotely, so movie counts come from the record text and paper (4 + 4 movies, 53 case-study movies). n_items is 61 movies. Labels
  cover filtered tracks only (FD1 1,594 tracks annotated by 5 people; FD2 by 1). Pixel size and exact microscope/contrast mode are not
  stated in the paper main text (Supplementary Note 1). Size is the sum of all files. Tasks are exocytic-event classification of tracked
  puncta rather than segmentation.'
