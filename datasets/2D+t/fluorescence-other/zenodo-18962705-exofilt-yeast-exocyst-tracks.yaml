description: Live-cell movies of Saccharomyces cerevisiae cells expressing the exocyst subunit Exo84 tagged
  with 3xmCherry (two sets of four TIFF movies, about 350 and 370 cells, plus a 53-movie case-study set
  with mNeonGreen-Sec1), with CSV tables of TrackMate single-particle tracks labelled as bona fide exocytic
  event or ambiguous by one annotator (FD2) and by five annotators (FD1).
