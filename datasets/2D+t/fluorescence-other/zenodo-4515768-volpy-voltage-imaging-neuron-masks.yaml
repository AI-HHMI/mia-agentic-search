title: VolPy corpus of 24 voltage imaging movies with manual neuron segmentation masks
short_name: Voltage imaging movies with neuron masks
description: Corpus of 24 motion-corrected voltage imaging movies (TIFF) from mouse cortex layer 1 (9), zebrafish
  tegmentum (3) and mouse hippocampus (12), each with manual neuron ROIs (ImageJ Cell Magic Wand, _ROI.zip) combined
  from three annotators, plus summary images and masks in the format used to train Mask R-CNN and three sessions
  with simultaneous electrophysiology. Accompanies the VolPy analysis pipeline. About 60.9 GB in 7 files.
