notes: 'Readme.txt read in full and summary_images_and_masks.zip listed with peek_archive (24 summary-image / mask .npz pairs); the large voltage_*.zip archives were not listed. The preprint-era paper (PLOS Comput Biol 2021, open access) describes ground truth from three independent labelers on mean and correlation images. Pixel size, frame rate and exact modality are not stated on the Zenodo page, Readme or the paper passages read, so voxel_size_nm is null and modality is the generic fluorescence-other. The movies come from Abdelfattah et al. 2019 (L1, TEG) and Adam et al. 2019 (HPC).'
