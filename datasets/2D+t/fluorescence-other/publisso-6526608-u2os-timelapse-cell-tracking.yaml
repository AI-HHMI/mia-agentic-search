notes: 'Pixel size, objective, microscope and physical pixel size are not stated on the PUBLISSO page
  or in the arXiv paper. Tracks, mitosis and apoptosis were annotated manually on 274 of 309 videos (186
  frames each); CTC-format masks are computer-generated silver truth. Source gives duration as 93 h and
  117 h (234 frames x 30 min = 117 h). Modality unspecified, hence fluorescence-other. Only the publication
  year (2025) is given. enricher: size 317,397,376,503 B exact from the file server (was 294 GB rounded);
  splits_provided true (train/val/test video lists in annotations.json info).'
technical:
  method: sample
