      \ videos, images, annotations with cell_id, centroid, bbox)\n  explanations.json           4,209\
      \ B  (annotated schema of annotations.json)\n  video_1-20.tar.gz ... video_281-300.tar.gz   15 x\
      \ ~20.4-20.6 GB\n  video_301-309.tar.gz      9,246,658,210 B\n    <NNN>/images/<frame>.tif   (one\
