short_name: U2OS cell tracking time-lapse (fluorescence)
description: '309 fluorescence time-lapse videos (1024x1024 px, 3 reporter channels: hGeminin-CFP, NR1D1::VNP,
  p53-mKate) of human U-2 OS cancer cells with and without cisplatin treatment; 274 videos carry cell
  tracks, mitosis and apoptosis annotations in COCO format, plus Cell Tracking Challenge-format silver-truth
  masks.'
