notes: 'Custom CTC terms (datasets page): cite the Nature Methods paper and acknowledge the Cell Tracking
  Challenge; other uses need permission, cloning of datasets or reference annotations is forbidden. Images
  are computer-simulated (not real microscopy), so this is a synthetic training set; organism Homo sapiens
  refers to the simulated HL60 cell line. Training zip (99.0 MB, 862 members, listing checked): sequences
  01 and 02 with perfect GT/SEG and GT/TRA on every frame, plus ERR_SEG (perfect masks to link for this
  computer-generated set, per the CTC page). Zeiss Axiovert 100S, Plan-Apochromat 40x/1.3 oil, pixel 0.125
  um and 29 min interval describe the real microscope the simulation mimics (CTC 2D page). Paper full
  text not open access, so annotation procedure was not verified. enricher: coverage dense (SEG mask on
  every frame) and source automatic (simulator ground truth) (were partial / unknown).'
