notes: Two RAR archives on Zenodo (Training Dataset 20.0 GB, Robustness dataset 19.7 GB); the files are
  .rar so the contents could not be listed remotely, hence annotations_verified false. The Zenodo description
  states per-movie folders of .TIF frames, a .nd file, a cell mask .tif and an ImageJ .txt with X, Y and
  Slice of manual exocytosis events, and an .xlsx with SBR and a training/inference group. The training
  set has 120 movies (60 training, 60 inference) of 1001 16-bit frames at 0.160 um pixel size; the robustness
  set has 90 movies in 4 sub-datasets (e.g. Bafilomycin 32 movies). Annotation by a single expert (paper).
  Paper also mentions an automatic ATLAS annotation for vesicle foci used in training, not included here
  as far as the Zenodo text says. Event counts not read. A 65 nm pixel size is mentioned in the paper
  for other acquisitions; 160 nm is the stated size for this dataset.
