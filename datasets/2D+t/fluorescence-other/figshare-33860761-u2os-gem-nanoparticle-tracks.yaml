notes: 'Figshare record (258 files: 130 movies, 127 trajectory CSVs, README; 13.9 GB; CC BY 4.0) was read
  from the API. One movie header (400 frames 512 x 512 uint8, palette, ImageJ calibration 146.5 nm) and
  the first rows of one CSV were read by range request. The record does not say how the trajectories were
  produced (the README only names them filtered particle trajectories used for the SPT analysis), so the
  annotation source is unknown; it also gives no microscope, frame interval beyond the CSV time column,
  or GEM construct details, and the preprint full text is not open access (abstract read). Sibling of
  figshare-33858445 (stress granule masks), same authors and paper, different files.'
