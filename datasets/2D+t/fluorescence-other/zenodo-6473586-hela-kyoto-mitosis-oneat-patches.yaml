title: Training dataset for HeLa "Kyoto" cells under the scope
short_name: HeLa Kyoto cell division patches (6 channels)
description: 868 training patches per channel (64x64 pixels, 2 frames before to 2 frames after the event) cut from time-lapse
  images of HeLa Kyoto cells in six channels (alpha-tubulin, fluorescence, mCherry, two phase-contrast variants and brightfield),
  each with a CSV label giving a Normal or Division event and its XYTHW location, for training Oneat action-classification
  networks.
