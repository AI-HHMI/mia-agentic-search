notes: 'Zip listing (10,426 members): six Patch_ch_hela_<channel> folders (atub, brightfield, flou, hdpc, ldpc, mcherry) each
  with 868 .tif patches and 868 .csv labels, and five Oneat_ch_hela_* folders with JSON category map ({Normal 0, Division
  1}) and coordinate map ({x,y,t,h,w,c}). n_items = 6 x 868 patches. Patches are derived from the original data by Romain
  Guiet (zenodo 6139958, not opened here); acquisition details, pixel size, annotation procedure and the Oneat paper are not
  stated on the record and Europe PMC search did not find a paper, so voxel size is null and no publication is listed.  Derived
  64x64 patches rather than full images. enricher: one TIFF and its CSV opened: float32 5x64x64 patches (t = event -2..+2),
  percentile-normalized per the record; CSV = one-hot class + normalized XYTHWC.'
