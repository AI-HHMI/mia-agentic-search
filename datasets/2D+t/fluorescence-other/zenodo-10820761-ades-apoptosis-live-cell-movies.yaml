notes: 'Zenodo record lists 10 files (14.3 GB), two of them 0 bytes (Exp24_Site01, Site04). peek_archive: in vivo
  trainingset.zip holds 20,513 avi clips (14,903 in Label 0, 5,610 in Label 1); in vitro trainingset.zip holds 486,300
  files (tiff crops in ultimate/Label 0 and Label 1, with ss_0/ss_3/ss_4 and random-numbered variants). The Exp24, timecourse,
  noisy and in vivo movies are avi. Per the paper, in vitro apoptosis events (x, y, t) were annotated manually from
  the movies and in vivo ones by three operators with majority voting; Label 0 samples were partly collected as false
  positives from a preliminary network, hence source mixed. The manual (x, y, t) coordinate files for the benchmark movies
  were not seen in the file list. Pixel size is not stated in the paper text read. Several data-collection details
  of in vivo imaging were not read.'
