notes: 'Zenodo record lists 10 files (14.3 GB), two of them 0 bytes (Exp24_Site01, Site04). in vivo trainingset.zip: 20,513
  avi clips (14,903 Label 0, 5,610 Label 1); in vitro trainingset.zip: 486,300 tiff crops in ultimate/Label 0 and ultimate/Label1
  (with _SS_0/_SS_3/_SS_4 and random-numbered variants). Per the paper, in vitro apoptosis events (x, y, t) were annotated
  manually and in vivo ones by three operators with majority voting; Label 0 samples were partly collected as false positives
  from a preliminary network, hence source mixed. organisms: Homo sapiens = in vitro files (MCF10A: in vitro trainingset,
  Exp24, timecourse, noisy videos), Mus musculus = in vivo trainingset, movies in vivo. enricher: Exp24 movies are avi, timecourse/noisy
  videos are tiff, movies in vivo are MATLAB .mat (was: all avi); formats avi/mat are not in the schema enum. enricher: pixel
  size not stated in paper or record (voxel size stays null).'
