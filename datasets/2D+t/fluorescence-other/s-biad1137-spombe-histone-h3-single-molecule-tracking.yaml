id: s-biad1137-spombe-histone-h3-single-molecule-tracking
title: Single-molecule imaging and tracking of histone H3 (Hht1, live and fixed cells) and free GFP in the nucleus
  of S. pombe
short_name: S. pombe single-molecule tracking (HILO)
description: HILO/TIRF single-molecule time-lapse movies (110 nm pixel, 256 x 256, single plane) of HaloTag-JF646
  histone H3 (Hht1) in live and formaldehyde-fixed fission yeast and of free NLS-HaloTag-GFP, in a fast (15 ms interval,
  1000 frames) and a slow (200 ms interval, 200 frames) imaging regime, with the resulting single-molecule trajectories
  (TrackIt and MatlabTrack .mat files and x/y track .csv files) and a JF646-HTL labelling-density series.
