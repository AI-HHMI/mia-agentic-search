notes: 'BioStudies reports 489 files (info API). The study record describes nine groups: fast and slow movies for live Hht1,
  fixed Hht1 and free GFP (slow regime counts of 27 live Hht1, 33 fixed Hht1 and 43 GFP movies), a labelling-density series and
  a filtered-vs-raw comparison. Raw movies are .tif, tracks are .mat and .csv (TrackIt, MatlabTrack). Trajectories are algorithm
  output (Gaussian fitting plus linking) used for diffusion and residence-time analysis, so source is automatic and annotations_verified
  is false (file listing not read; the FTP listing timed out). Pixel size 110 nm and the acquisition parameters are from the
  BioStudies acquisition section (Leica DMi8, 100x/1.47 NA, Prime 95B). Fast-regime movie counts and total size are not stated.
  Single-molecule tracking is a niche use of the catalog; labelled as fluorescence-other.'
