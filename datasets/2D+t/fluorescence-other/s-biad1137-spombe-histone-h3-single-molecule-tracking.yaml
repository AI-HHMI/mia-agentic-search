notes: 'BioStudies reports 489 files (info API). The study record describes nine groups: fast and slow movies for
  live Hht1, fixed Hht1 and free GFP (slow regime counts of 27 live Hht1, 33 fixed Hht1 and 43 GFP movies), a labelling-density
  series and a filtered-vs-raw comparison. Raw movies are .tif, tracks are .mat and .csv (TrackIt, MatlabTrack).
  Trajectories are algorithm output (Gaussian fitting plus linking) used for diffusion and residence-time analysis,
  so source is automatic. Pixel size 110 nm and the acquisition parameters are from the BioStudies acquisition section
  (Leica DMi8, 100x/1.47 NA, Prime 95B). Single-molecule tracking is a niche use of the catalog; labelled as fluorescence-other.
  enricher: annotations_verified from the BioStudies file list (126 TrackIt .mat, 106 MatlabTrack .mat, 3 .csv);
  size 19.1 GB from the same list. formats + hdf5 (MatlabTrack .mat v7.3).'
