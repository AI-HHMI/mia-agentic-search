title: ReSCU-Nets Drosophila embryo time-lapse videos with cardioblast nuclei, wound margin and epithelial cell masks
short_name: Drosophila embryo timelapse masks (confocal)
description: >-
  Spinning-disk confocal time-lapse videos (z maximum projections) of Drosophila stage 14 embryos with expert
  segmentation masks for every frame: cardioblast nuclei (MidE19:GFP), epithelial wound margins and epithelial cell
  outlines around a laser wound (E-cadherin tagged). Provided with train/test folders and used to train ReSCU-Nets.
