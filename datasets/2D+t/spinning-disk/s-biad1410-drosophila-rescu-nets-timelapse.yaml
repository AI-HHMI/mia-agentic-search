notes: >-
  69 image/mask pairs (138 TIFF files, 7.3 GB) in three subsets with train/ and test/ folders: cardioblast_nuclei (10 train,
  5 test videos), wound_margin (31 train, 8 test) and epidermal_cells (10 train, 5 test); one folder per embryo.
  A probed example (wound_margin_20211108_e1) is a 55 x 512 x 512 uint16 stack for both image and mask. Cardioblast videos:
  0.75 um z-steps, one stack per 15 s; epithelial videos: 0.50 um z-steps every 30 s, 60x oil objective; maximum
  intensity projections over z were used. Masks made in PyJAMAS (SVM and watershed, or watershed, then manual
  correction). Pixel size is not stated in the BioStudies record or file headers, so voxel_size_nm is null. The journal
  paper is not open access and the bioRxiv preprint (10.1101/2024.11.28.625889) could not be fetched (HTTP 429),
  so only the abstract and the BioStudies record were read; image sizes for the other subsets are unverified.
