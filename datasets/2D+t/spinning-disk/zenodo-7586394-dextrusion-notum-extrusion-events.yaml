notes: 'Zenodo record lists 172 files (11.1 GB): 44 .tif movies (001-036 plus 8 _aug temporally downsampled
  copies of 001 and 008-014) and per-movie ROI zips; peek_archive on 027_cell_death.zip shows 878 .roi
  files. The paper (Development 2023) states movies were rescaled to a reference scale of 0.275 um/pixel
  and 5 min/frame; whether the deposited movies are already at that scale was not stated, so the voxel
  size is the reference scale. Imaging: spinning-disc confocal (40x/100x) or Airyscan LSM880, z-projected.
  Paper reports 6700 extrusion events in the training set and 2320 in the test set, but the record gives
  no train/test file assignment, so splits_provided is false. No README in the file list. enricher: TIFF
  headers carry no usable calibration (1 µm default or none); the paper: "we rescaled all our dataset
  to the same temporal and spatial resolution of 5 min/frame and 0.275 µm/pixel", so 275 nm is kept.'
