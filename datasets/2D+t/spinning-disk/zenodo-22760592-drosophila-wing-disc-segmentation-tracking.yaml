notes: >-
  Five zips, one per tissue (five biological replicates), 808 timepoints in all (160 x3, 148, 180). Pixel size
  differs: 0.208 um for movies 1-4, 0.196 um for movie 5 (Zenodo page). Z-stacks at 0.5 um steps were projected to
  2D with a height map. Movie Ecd_20150310_P2 is slightly aberrant and may be excluded (Zenodo page).
  enricher: voxel_size_nm set to null (was 208 x 208): movie 5 has 196 nm, so no single value fits all movies.
  enricher: annotations.source proofread (was mixed): paper Methods says automated TissueAnalyzer segmentation and
  tracking were manually corrected. enricher: channels 1 (single E-cadherin-GFP channel; raw stored as grey or grey-as-RGB).
  enricher: download_url is the landing page; the data are five separate zips.
