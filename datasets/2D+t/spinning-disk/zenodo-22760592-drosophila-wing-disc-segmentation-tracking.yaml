  notes: >-
    Listing: tools/listing.py on the Zenodo record with --expand-zips, 6 files, 9440 zip members, 2,905,691,421 bytes
    (file-listing, complete). Sample (one timepoint of movie 1, value ranges from that one sample only): raw PNG
    590x773x3 uint8, 0-255, identical RGB samples, saturated at 255 (p99 = 255); handCorrection.tif values {0, 255}
    (8% boundary); tracked_cells_resized.tif RGB with 256 values. Movies 4-5 ship raw frames as TIFF (probed headers:
    765x877 and 776x893 uint8, uncompressed). Paper: raw z-stacks were bandpass-filtered and background-subtracted
    before projection, so raw frames are preprocessed (normalization unknown). Voxel size: no calibration in the probed
    TIFF headers; Zenodo page states 0.208 um (movies 1-4) and 0.196 um (movie 5), so imaging.voxel_size_nm is null; a
    per-movie value is needed. Each movie also has a TissueMiner SQLite database and height-corrected CSV tables (not
    listed as arrays), plus cumultimesec.txt (frame times) and transformation.txt (orientation). No single archive:
    the five zips are direct links (https://zenodo.org/records/22760592/files/<movie>.zip).
