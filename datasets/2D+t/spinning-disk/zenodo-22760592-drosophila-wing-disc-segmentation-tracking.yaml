notes: >-
  Five zips, one per tissue (five biological replicates). The first zip lists 2,246 files (640 TIFF, 1,600 PNG, a 343 MB
  TissueMiner SQLite and two CSV tables, per-timepoint segmentation folders). Pixel size is 0.208 um for movies 1-4
  and 0.196 um for movie 5 (Zenodo page); 208 nm is entered. Z-stacks at 0.5 um steps were projected to 2D with a
  height map (Zenodo page). The record says movie Ecd_20150310_P2 is slightly aberrant and may be excluded.
  Segmentation used TissueAnalyzer with manual correction, so annotation source is mixed.
