  .ilp 110,873,142 B, .xml 33,143,155 B, .tif 53,637,823 B, screenshot PNG 1,376,804 B (size_bytes is
  their sum). No associated paper is named on the Zenodo page (it points to the imagej.net TrackMate-ilastik
  page, not fetched), so publications is empty and the microscope and acquisition settings are not stated.
  enricher: size_bytes 199,030,924 from the Zenodo file listing (was 199,031,122); TrackMate XML holds
  19,495 spots with ROI polygons in 31 tracks over 68 frames (300 s interval).'
