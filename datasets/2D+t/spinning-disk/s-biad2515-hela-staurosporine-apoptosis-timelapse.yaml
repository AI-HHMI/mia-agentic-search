notes: 'The study text mentions cell segmentation masks, tracking outputs and CellProfiler/scDINO features, but the
  file listing (6,480 .tif, 30 wells x 4 FOV x 13 live timepoints x 4 channels + terminal Hoechst/AnnexinV, z-projections)
  contains only raw images; no mask or track files were seen, and the preprint Data availability lists only code on
  Zenodo. The training signal is the terminal AnnexinV image (the paper models integrated cytoplasmic AnnexinV
  intensity per cell). Pixel size not stated in the study or preprint text; objective is 20x 0.75 NA. Author list
  not read from the page.'
