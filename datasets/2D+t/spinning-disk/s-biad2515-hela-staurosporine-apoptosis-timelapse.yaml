schema_version: '1.2'
id: s-biad2515-hela-staurosporine-apoptosis-timelapse
title: High-content live-cell time-lapse imaging of HeLa cells undergoing staurosporine-induced apoptosis
  (ChromaLIVE, with terminal AnnexinV readout)
short_name: HeLa apoptosis time-lapse (spinning-disk)
description: Spinning-disk confocal time-lapse (every 30 min for 6 h, 13 timepoints) of HeLa cells across a 10-point
  staurosporine dose series (0-156.25 nM, 30 wells, 4 fields of view each), imaged with Hoechst and three ChromaLIVE
  Live Cell Painting channels, followed by a terminal fixed Hoechst + AnnexinV acquisition used as a single-cell
  apoptosis ground-truth readout. 6,480 TIFF images on the BioImage Archive.
