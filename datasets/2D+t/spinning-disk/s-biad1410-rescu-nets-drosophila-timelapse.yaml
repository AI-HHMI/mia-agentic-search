notes: '69 movies per the file lists (cardioblast nuclei 15, epidermal cells 15, wound margin 39), each with an annotation
  file; folders are split into train and test (min. 5 test movies per set; paper Methods). Paper reports 71,904 nuclei masks,
  4,319 wound margin masks and 32,120 cell masks. Ground truth made with PyJAMAS/SIESTA (SVM+watershed or LiveWire) with manual
  correction. One probed cardioblast TIFF: uint16, 512x512 pages, 161 pages. Pixel size not stated on the BioStudies page
  or in the preprint Methods read. Total size not computed.'
