id: zenodo-7660424-drosophila-embryo-wound-healing
title: Videos of Embryonic Wound Healing in Drosophila and Wound Segmentation
short_name: Drosophila embryo wound segmentation (confocal)
description: Time-lapse confocal sequences of Drosophila embryos expressing GFP-tagged myosin II (sqhGFP) healing after a
  laser-induced wound, imaged on an Olympus IXplore SpinSR10 with a 60x 1.42 NA objective, one frame per minute and about
  120 frames per sequence. Frames are max-projected, registered, cropped around the wound and downsampled to 128x128. Each
  sequence has a wound segmentation (skeletonized) in a matching TIFF.
