notes: 'Zip lists 124 TIFF files: 62 in Videos/ and 62 in Segmentations/, while the description says 61 sequences (44 train,
  12 validation, 5 test); no split file ships, so splits_provided is false. Wounds were segmented with a custom U-Net-like
  network and manually refined in napari, hence source mixed. The page states 4.6 um/pixel for the 1152x1152 frames, which
  is implausible for a 60x objective (it would make the frame about 5 mm wide), and frames are later cropped to 256x256 and
  downsampled to 128x128, so voxel_size_nm is null. No related publication is listed on the Zenodo record, and web searches
  under the author names found no paper describing the dataset; enricher: segmentations are binary 0/255 TIFFs with ~1% foreground
  (thin wound outlines), sampled.'
