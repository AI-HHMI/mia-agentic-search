notes: 'BioStudies reports 6969 files in folders BacterialSurfaceColonization, MacrophagePhagocytosis, BacteriaMacrophageContacts,
  MacrophageDeath and HHA_FITC_Psl_staining; per-folder tsv file lists give raw images, masks and (contacts only) tracks. Masks
  are automatic (Omnipose for bacteria, Cellpose for macrophages) and tracks come from TrackMate, not manual labels. The
  study page names no paper (the "corresponding manuscript" title is the study title) and no authors; a Europe PMC title search
  found nothing. Voxel size left null because imaging objectives differ per sub-dataset (40x air, 60x water, 20x, 100x); one
  contacts-subset TIFF header (popBfliC_10min.tif, 61 x 2304 x 2304 uint16, tyx) states 100 nm x/y. Total size and item count
  not summed. Channels=2 (bacteria and macrophage, stored as separate files in places).'
