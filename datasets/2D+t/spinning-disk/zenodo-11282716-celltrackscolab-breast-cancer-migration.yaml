notes: 'Read the Zenodo API record (15 files, 33.6 GB; raw movie zips per condition and replicate, Tracks.zip, Monolayer_edges.zip,
  CellTracksColab results) and listed Raw_CTRL_R1.zip (18 TIFFs of about 180 MB) and Tracks.zip (117 XML and 351 CSV files)
  with peek_archive. Methods read in the PLOS Biology full text (via Europe PMC). Tracks are automatic, filtered to tracks
  with more than 6 spots and over 89 um travelled. Pixel size and the number of movies are not stated on the record or paper;
  TIFF headers were not read, so n_items and voxel size are null. A related, different dataset of the same paper is Zenodo
  10539720 (T cells). enricher: pixel size 0.6337 um from the ImageJ TIFF header (XResolution 1.577923 px/um, unit um; was
  null); 233 raw movies counted in the listing (n_items was null); size from the Zenodo listing.'
