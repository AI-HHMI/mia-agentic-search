schema_version: '1.2'
id: s-biad4158-mfn2-mito-kymographs
title: Using image classifiers to predict CMT2A disease-relevant mitochondrial motility phenotypes in iPSC motor neurons
short_name: MFN2 mutant iPSC neuron mitochondria (time-lapse)
description: Two biological replicates (BR1, BR2) of two-channel time-lapse fluorescence movies of iPSC-derived motor neurons
  (EGFP-tubulin for axons, mito-dsRed2 for mitochondria) carrying five MFN2 genotypes (WT, R94W, T105A, R364W, W740S),
  100 wells with 91 frames each (18,200 raw 1024x1024 TIFF frames), plus 18,564 per-axon-segment mitochondrial kymograph
  PNGs derived from them. Genotype is given per well and was used as the label to train kymograph classifiers.
