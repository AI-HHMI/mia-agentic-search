notes: 'Raw movies and kymographs are separate zips per replicate (250310_D10 = BR1, 250307_D11 = BR2).
  Labels are each well''s genotype (experimental metadata, not manual annotation), so source is unknown;
  the row-to-genotype map differs between replicates. The preprint trains on R364W vs WT only (1,562 kymographs
  after a 62 um filter) while the deposit holds five genotypes. Replicates are kept separate for train/held-out
  use; no split file seen. Paper read from the bioRxiv preprint (authors are taken from it). Modality
  confocal follows the instrument name (ImageXpress Micro Confocal); the study metadata says only time-lapse
  microscopy. enricher: size from full listing (8 files, zips expanded: 18,200 TIFFs + 18,564 kymograph
  PNGs); download_url is the Files/ folder (4 zips, no single archive).'
