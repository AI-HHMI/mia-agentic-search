notes: 'Read the Zenodo API record (11 files, 4.42 GB: raw movie zips per construct and replicate, Tracks.zip, CellTracksColab
  results) and listed Raw_MYO10WT_R2.zip (7 drift-corrected TIFFs of about 94 MB) and Tracks.zip (336 files: XML plus spots
  and tracks CSVs) with peek_archive. Methods read in the PLOS Biology full text (via Europe PMC); the paper says the dataset
  was described earlier. Tracks are automatic. Airyscan microscope model, pixel size and the number of movies are not stated
  on the record or paper, so voxel size and n_items are null and modality is recorded as confocal (Airyscan). Different from
  the other CellTracksColab sets (T cells 10539720, breast cancer 11282716). enricher: pixel size 0.1597 um from the ImageJ
  TIFF header (XResolution 6.263054 px/um, unit micron; was null); 112 raw movies counted in the listing (n_items was null).'
