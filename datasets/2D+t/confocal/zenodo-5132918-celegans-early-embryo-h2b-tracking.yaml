notes: 'Very small: one 17-frame movie, so near the lower bound of the usable criteria. Made as a TrackMate mask-detector tutorial
  dataset. Facts: Zenodo page (MIP of a longer movie from Tinevez et al., Methods Enzymol 2012, cut after the second division) and
  the imagej.net mask detector page (eGFP-H2B, laser-scanning confocal, channel 2 is the mask, 78 spots, LAP tracker with splits,
  one merged mask separated manually at the 9th time point). TIFF header read by range request: ImageJ TIFF, 17 frames x 2 channels
  x 295 x 240, uint16 (0-4095), uncompressed, 198.4666 nm pixels. The tracks are tutorial output from an automatic detector and
  tracker with one manual fix, and the page notes false divisions caused by a motile polar body. The original phototoxicity paper
  was not read, so microscope and acquisition details are not stated. Zenodo listing: TIF 4,821,701 B, XML 160,849 B, screenshot
  PNG 626,870 B (size_bytes is their sum).'
