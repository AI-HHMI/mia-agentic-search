notes: 'Very small: one 17-frame movie, so near the lower bound of the usable criteria. Made as a TrackMate
  mask-detector tutorial dataset. Facts: Zenodo page (MIP of a longer movie from Tinevez et al., Methods
  Enzymol 2012, cut after the second division) and the imagej.net mask detector page (eGFP-H2B, laser-scanning
  confocal, channel 2 is the mask, 78 spots, LAP tracker with splits, one merged mask separated manually
  at the 9th time point). The tracks are tutorial output from an automatic detector and tracker with one
  manual fix, and the page notes false divisions caused by a motile polar body. The original phototoxicity
  paper was not read, so microscope and acquisition details are not stated. size_bytes = Zenodo listing
  total. enricher: the shipped XML holds 52 spots in 2 tracks (1 split each), not the 78 spots named on
  the imagej.net page; channel 2 is {0,255}.'
