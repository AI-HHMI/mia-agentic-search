notes: 'Zips: MovieEpitheliumFigure5.zip has four movies (raw.tif, initial and corrected labels); notumMovie.zip has Ecad.tif
  (about 1.5 GB) with labels and skeleton. Pixel size, frame counts and dimensionality (2D+t, file names suggest max projections)
  were not verified, and modality "confocal" is only confirmed for the notum. Quail species is not stated, so it is not listed
  in organism. Labels were curated by experts with EpiCure (preprint), hence proofread. Preprint full text is not open access in
  Europe PMC and has no data availability statement. The .pkl files were not opened. Raw movies come from earlier publications.'
