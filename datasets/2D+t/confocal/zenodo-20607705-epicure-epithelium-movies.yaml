short_name: Epithelium movies with curated cell tracks
description: Time-lapse movies of developing epithelia (Drosophila pupal notum and abdomen histoblasts, quail gastrula, zebrafish
  telencephalon) with expert-curated cell segmentation and tracking, stored as label TIFF movies where each cell keeps one
  label over time, in EpiCure format. One large notum movie plus a zip of four smaller movies with initial and corrected labels.
