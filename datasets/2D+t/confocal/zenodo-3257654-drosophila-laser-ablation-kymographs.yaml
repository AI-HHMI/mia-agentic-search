  notes: 'Listing: Zenodo API, one zip (61,558,522 B), 201 members via tools/listing.py --expand-zips. Sampled e1_PSB8
    movie (sample.py, ~2.9 MB read) and its Reslice kymograph; header tags read by an ad hoc range-read script (requests
    + tifffile) for e1_PSB8 and 190216E6PSB1. value_range from one sample; normalization none inferred (uint16 well
    inside the 12-bit range, ImageJ min/max display tags only). Track files: label dtype float32 is nominal (decimal
    text values). Kymograph compression not read from tags. Download: zip and zip members are direct Zenodo links
    (range requests OK). Voxel size: 168.627 nm x/y from header OME-XML; z not applicable (2D+t). Readiness reasons
    left: 2D+t not in the miao layout; kymographs are role other; tracks live in kymograph coordinates (reslice.roi),
    not on the raw grid.'
