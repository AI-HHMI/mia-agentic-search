notes: 'enricher: voxel size 168.627 nm from the embedded Imspector OME-XML in the TIFF headers (PhysicalSizeX/Y="0.168627"
  um, checked in 2 movies from both folders); was 168.8 derived from the 42.2 um / 250 px text. enricher: formats
  now [tiff]: the *.ome.tif movies are ImageJ TIFFs (no OME header; original OME-XML kept in the ImageJ Info tag),
  255x255 px not 250. Training signal is limited: manual feature/cut-end tracks and kymographs used to evaluate
  motion estimation (recoil velocity), not dense labels. Marker caveat: the Zenodo text says E-cadherin:GFP, but
  folder names (SqhGFP40, SqAX3_SqhGFP42_GAP43_TM6B) suggest Sqh-GFP lines; kept as stated. The companion paper
  (Lang et al. 2019) is not cited; imaging methods are in Scarpa et al., Dev Cell 2018 (10.1016/j.devcel.2018.10.029),
  not read in full. Non-commercial license.'
