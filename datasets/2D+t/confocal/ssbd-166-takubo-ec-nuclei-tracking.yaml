description: Time-lapse confocal fluorescence (SYTO-16 labelled nuclei) and phase-contrast images of mouse aortic
  sheet assay branches, 3 or 5 minute intervals over 36 h, with per-nucleus tracking trajectories in BDML files.
  5 image datasets (5.2 GB) and 4 quantitative tracking datasets (5.4 MB).
