notes: 'Project page: CC BY. Pixel size differs per dataset (dataset pages): 0.83 um/px for Fig1b, Fig2c, Fig3b,
  Fig4c; 1.25 um/px for Fig3a, so voxel_size_nm stays null; z not applicable. T: 3 min (Fig1b, Fig3a, Fig3b), 5
  min (Fig2c, Fig4c). Paper (Sci Rep 2019) Methods: FV-10i confocal, 10x 0.4 NA; tracking by an automated system
  (paper), so source automatic. enricher: tracks read from BD5: only Fig1b has 2D nucleus positions (x, y in um,
  282 frames); Fig3a/3b store a 1D tip cell position and Fig4c 1D positions of 8 nuclei along the branch (1D+T);
  Fig2c has no tracks; so coverage partial (was unknown). n_items 5 = image time series (was null); size 8,105,478,645
  B from the download server dataset.json, incl. 2.5 GB zip bundles duplicating raw_image (was 5.2 GB). Confidence
  lowered: 1D track coordinates limit training use.'
