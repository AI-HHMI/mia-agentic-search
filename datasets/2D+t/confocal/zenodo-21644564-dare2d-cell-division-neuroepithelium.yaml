title: DARE2d
short_name: Neuroepithelium cell division points (confocal)
description: Confocal time-lapse movies of the developing chicken neural tube (neuroepithelium, membrane marker SiR-actin
  and other sets) with manually annotated cell-division positions stored as per-frame .npy point files, used to train and
  test the DARE2d two-stage division detector (U-Net detection plus regression of division axis). Eight movies (sets 1-8)
  plus test movies; pretrained TensorFlow and PyTorch models are in a separate archive.
