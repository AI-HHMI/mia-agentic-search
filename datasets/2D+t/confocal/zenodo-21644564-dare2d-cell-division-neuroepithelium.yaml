notes: 'License is ambiguous: Zenodo metadata says MIT, the record text says CC BY 4.0, so spdx is custom. This is the 2D+t
  part of DARE; the 3D+t part (DARE3d) is a different dataset already in the catalog (e.g. zenodo-22639669). Paper preprint:
  eight independent 2D neuroepithelium movies, 8-fold experiment-wise cross-validation, divisions annotated manually in napari
  with expert cross-checking. Pixel size is not stated directly: the paper gives 10 pixels = 12 µm, so 1.2 µm/px is a derived
  value; frame interval and microscope model not found. Zip: 822 files = 10 movie TIFFs (sets 1-8, a test movie, set_test),
  811 .npy point files, 1 .m script; models.zip (2.2 GB) not counted in size.'
