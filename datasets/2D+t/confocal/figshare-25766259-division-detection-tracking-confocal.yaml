notes: 'The zip holds 1292 tiffs, 10 division CSVs and 3 TrackMate XML files (read from the zip''s two
  README files). Division Detection has videos 0-9, Tracking has videos 0-2 (the same videos as division
  videos 0-2). Pixel size 0.3 um, 512x512 px and 4 h interval are from the Figshare description; z is
  null for 2D+t. No paper, organism or cell type was found: the description names none and a web search
  for the author and title found no related publication. The segmentation was not checked for who made
  it (manual or automatic), so annotation source is unknown. enricher: the seg_t=N.tif files are nearly
  empty in every frame sampled (0 or 19 pixels set to 1 of 262,144; uint8), so the usable labels are the
  division CSVs, TrackMate XML and the tracking-map dots.'
