short_name: Drosophila pupal wing cell divisions (confocal)
description: Time-lapse confocal movies of the Drosophila pupal wing epithelium (E-cadherin-GFP and Histone2Av-mRFP), unwounded
  and wounded, with manually labelled cell divisions (4206 divisions in 20 movies of 93 frames), released as image/mask clips
  for training division-detection U-Nets with train/validation/test splits. Also contains cell-boundary training images and
  masks, trained models and analysis databases.
