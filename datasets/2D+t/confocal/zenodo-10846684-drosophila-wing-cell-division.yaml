notes: 'Record is a "database" for the eLife paper; the ML-ready data are inside trainModels.zip (17.4 GB, 56,727 members
  including a bundled Python environment that should be ignored; listed with peek_archive: 890 train / 445 val image+mask
  tiles per division set, test clips, dat_tissue boundary data). analysisPaper.zip (pickled databases, not read) and models.zip
  (trained weights) are derived material. Voxel size derived from paper Methods: 123.26 um field of view over 512 px = 0.2407
  um/px (images converted to 2D by stack focus, so no z). Paper: 11 train, 4 validation and 5 test full videos; 979/356/445
  clips; the zip contains several divisionData variants (3-frame and 10-frame inputs) that overlap. Cell-boundary masks were
  produced with Tissue Analyzer watershed and hand-corrected on 59 images (partly automatic). Licence stated on the Zenodo
  page. Authors listed from the Zenodo record. enricher: clip size 512x512 checked in the zip.'
