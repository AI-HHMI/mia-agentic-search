notes: 'Zip index read with peek_archive: two sequences (01, 02) x 84 frames, plus GT/SEG (9 frames each),
  GT/TRA, ST/SEG and ERR_SEG folders. Terms are custom: CTC-related use needs no consent, non-CTC scientific
  use requires organizer permission, commercial use needs organizer and data-provider permission, cloning
  of the dataset is prohibited, and the Nature Methods paper must be cited. Test set annotations are secret.
  Pixel size and interval from the CTC dataset table (Zeiss LSM 510 Meta, 0.19 um, 10 min). Gold segmentation
  coverage is sparse per the paper (0.3-9% of cells for several datasets incl. this one); frame-level
  counts not restated in paper text I read. Well-known benchmark, so confidence kept moderate given the
  permission-based terms.

  enricher: channels 1 (single-page 2D TIFF).'
