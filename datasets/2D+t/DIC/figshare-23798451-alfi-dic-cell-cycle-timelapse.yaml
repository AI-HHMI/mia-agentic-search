notes: 'Checked the figshare API records (data record and the updated readme record, both CC0), the ALFIdatasetFinal.zip
  index (3,347 files: 3,212 .png, 37 .csv, 29 original .nd2 videos totalling 8.0 GB, plus scripts) and
  the paper (Europe PMC full text). Pixel size is 0.26 um/px for the 40x sequences (CD, TP, MI06-MI08)
  and 0.18 um/px for the 60x MI01-MI05 U2OS fluo sequences; 0.26 um is recorded as the dominant value.
  Segmentation masks cover only MI01-MI08; CD and TP sequences have boxes and tracking only. n_items counts
  PNG files (images plus masks). Original videos are ND2 and also in the zip. The figshare collection
  (c.6436958) also holds an updated readme (24081327) that should replace the one in the zip. No train/test
  split is defined by the authors in the pages read. enricher: README inside the zip says "Licenses/restrictions
  placed on the data: CC-BY" while the figshare record says CC0; spdx kept as figshare CC0-1.0.'
