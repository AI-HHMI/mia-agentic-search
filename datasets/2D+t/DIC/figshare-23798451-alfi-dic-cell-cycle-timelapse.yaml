title: ALFI dataset (final)
short_name: ALFI label-free cell cycle time-lapse (DIC)
description: 29 label-free DIC time-lapse sequences (2,366 images, 1280x1024) of human RPE-1, HeLa and
  U2OS cells, untreated or treated with anti-mitotic drugs, with pixel-wise masks of interphase nuclei
  and mitoses, bounding boxes, tracking and lineage IDs, and four-class phenotype labels (early/late mitosis,
  cell death, multipolar division).
