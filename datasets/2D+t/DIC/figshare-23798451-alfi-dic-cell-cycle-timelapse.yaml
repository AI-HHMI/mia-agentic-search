  notes: 'Listing via the figshare API (one zip, exact size) with zip members expanded. Probes of zip
    members - images 16-bit gray PNG 1280x1024, masks 8-bit gray PNG. Sample (one frame, MI01_0004) -
    raw 0..60320 (p1-p99 15728..25456); the paper says the ND2 videos are 12-bit, so the PNGs appear rescaled
    to 16 bit, but this is not documented, normalization left unknown. Mask values {0,128,255} (87.5%
    background); the paper says masks label interphase nuclei and mitoses (whole cells), but which value
    is which class is not documented, so classes null. Masks exist only for MI01-MI08; CD/TP sequences
    have PhenoTruth CSVs only. Value ranges are from one sample. Note: a first listing attempt on the
    bare ndownloader URL fell into a full GET in listing.py and was killed; that read is not counted in
    bytes_downloaded.'
