      \    39 sequences\n      img1/*.jpg             72,109 JPEG frames\n      seqinfo.ini\nCTMCV1Labels.zip (3,856,176\
      \ B)\n  CTMCV1Labels/train/*/{gt/gt.txt,TRA/man_track.txt,seqinfo.ini}, test/*/seqinfo.ini   same files as\
