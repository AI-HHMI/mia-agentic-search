notes: >-
  No licence or terms of use on the MOTChallenge page or in the paper; the paper says the videos were collected from Nikon's microscopy website because they are freely available,
  so redistribution rights are unclear (spdx unknown). Evaluation server is closed; ground truth is released for the 47 training sequences only (test sequences have raw frames only).
  Zip listing (peek_archive): 152,498 jpg frames plus 94 txt and 86 ini files; labels zip: gt/gt.txt, TRA/man_track.txt and seqinfo.ini per sequence. Pixel size and magnification are not stated.
  Organism list is inferred from the cell-line descriptions on the page (e.g. Rhesus Monkey Kidney, African Water Mongoose Skin), not stated as taxa. Size is the sum of the two zips (about 804 MB + 3.9 MB). Publication date approximate (CVPRW 2020).
