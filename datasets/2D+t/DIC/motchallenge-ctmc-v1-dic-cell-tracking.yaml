      pairs with img1/ of the same sequence folder. Paper: empty frames carry a fake 4x4 background box labelled
      0.'
  - role: label
    path_pattern: CTMCV1/train/*/TRA/man_track.txt
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: tracks-table
    classes: null
    alignment: unknown
