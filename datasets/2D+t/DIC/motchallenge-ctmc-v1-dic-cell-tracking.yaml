  notes: 'Listing: both zips read by range, 152,858 members, 808,270,542 B in total; CTMCV1.zip already contains
    every label file of CTMCV1Labels.zip. Probe and sample: frame MDBK-run01/img1/000152.jpg is 320x400x3 uint8
    JPEG, values 0..255 in this one sample, samples identical (grey). seqinfo.ini: frameRate=30, seqLength=368,
    400x320. gt.txt and man_track.txt heads read with peek_archive (row counts not taken). Test sequences have no
