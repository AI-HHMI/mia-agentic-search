notes: 'No licence or terms of use on the MOTChallenge page or in the paper; the paper says the videos were collected
  from Nikon''s microscopy website because they are freely available, so redistribution rights are unclear (spdx
  unknown). Evaluation server is closed; ground truth is released for the 47 training sequences only (test sequences
  have raw frames only). Pixel size and magnification are not stated. Organisms inferred from the page''s cell-line
  descriptions, by folder prefix: Mus musculus = 3T3, CRE-BAG2; Rattus norvegicus = A-10; Homo sapiens = A-549,
  U2O-S; Atilax paludinosus = APM; Bos taurus = BPAE, MDBK; Chlorocebus aethiops = CV-1; Macaca mulatta = LLC-MK2;
  Ovis aries = MDOK; Didelphis virginiana = OK; Procyon lotor = PL1Ut; Oryctolagus cuniculus = RK-13. Publication
  date approximate (CVPRW 2020). enricher: channels 1 (grey frames stored as RGB JPEG; was null); size from zip
  listing.'
technical:
