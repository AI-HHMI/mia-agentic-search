description: Two 2D differential interference contrast time-lapse sequences (01 and 02, 84 frames each) of HeLa cells on flat glass from the Cell Tracking Challenge training set. Each sequence has manual gold-truth segmentation masks for 9 frames, tracking markers with a man_track.txt lineage table for every frame, and silver-truth segmentation masks for every frame. Deposited on Zenodo by the Cell Tracking Challenge.
