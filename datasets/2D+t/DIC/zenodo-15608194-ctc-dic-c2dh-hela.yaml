notes: 'Zenodo record has no description; license CC-BY-4.0 is the one shown in the Zenodo API record. Zip index read with peek_archive (692 files): 84 raw frames per sequence; GT/SEG manual masks for 9 frames per sequence; GT/TRA 84 marker images plus man_track.txt per sequence; ST/SEG silver masks for 84 frames per sequence; ERR_SEG mask folders. Cell type, microscope, objective, pixel size (0.19 um) and 10 min interval are from the CTC 2D datasets page, not the Zenodo page. Organism is Homo sapiens because HeLa is a human cell line; the CTC page does not state the organism. The page and paper describe the training-set annotations as silver reference (gold for a subset); test-set annotations are secret. Image size, dtype and bit depth not probed. Paper read via Europe PMC (general CTC description).'
