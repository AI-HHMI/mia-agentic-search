title: Snowflake yeast (MuLTEE) soft-agar brightfield time lapses with Cellpose masks and TrackMate cell tracks
short_name: Snowflake yeast time-lapse tracking (brightfield)
description: Brightfield time-lapse movies of growing multicellular snowflake yeast clusters (petite and grande ancestors and
  evolved MuLTEE isolates at 200-1000 days), with TrackMate track/segmentation XML files for each of 129 movies, plus
  calcofluor-stained cell images with Cellpose masks (npy and ImageJ outline text files) for cell-property and cells-per-cluster
  measurements, and 4x brightfield cluster-size images.
