notes: 'File lists (BioStudies): time_lapses has 129 TIFF movies (76.4 GB) with 129 TrackMate XML annotation files (0.96 GB);
  cellular_properties has 53 TIFFs (3.4 GB) with 53 Cellpose npy + 53 outline txt files (26.8 GB); cluster_measurements has 20 TIFFs
  (19.6 GB, 4x brightfield, no annotation list); cells_per_cluster_distribution has 233 npy + 233 txt annotation files (130.8
  GB) and its image file list could not be read, so total size_bytes is left null (annotated parts alone exceed 250 GB).
  Pixel size, frame interval and exact acquisition settings are not on the study record (''See Methods of the publication'')
  and the paper Methods give objectives only (4x, 20x, 40x), so voxel size is null. Annotation source mixed: Cellpose 2.0
  masks plus TrackMate tracking with manual correction of bud-emergence frames (paper Methods). Paper is a bioRxiv preprint
  (CC BY-NC-ND); the dataset license on BioImage Archive is CC BY 4.0. n_items counts the time-lapse movies only.'
