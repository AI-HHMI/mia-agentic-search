notes: 'Four subsets (BioStudies file lists): time_lapses 129 brightfield TIFF movies + 129 TrackMate XML (Cellpose 2.0 segmentation,
  TrackMate tracking, bud-emergence frames manually corrected); cellular_properties 53 calcofluor TIFFs + Cellpose npy/outline txt;
  cluster_measurements 20 4x brightfield TIFFs (no annotations); cells_per_cluster_distribution 233 npy + 233 outline txt, its source
  TIFFs are not in the study. Annotation source mixed (paper Methods). n_items counts time-lapse movies. Paper is a bioRxiv preprint
  (CC BY-NC-ND); dataset license CC BY 4.0. enricher: size 258.06 GB from the BioStudies file lists (was null). enricher: voxel size
  left null, subsets differ (ImageJ headers: time lapses 146.7 nm, cellular_properties 73.35 nm, cluster_measurements 733.5 nm; see
  technical.notes).'
