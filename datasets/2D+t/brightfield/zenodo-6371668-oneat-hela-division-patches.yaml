notes: 'Zip: Patch_ch_hela_brightfield (870 patches, file tag ch_2) and Patch_ch_hela_flou (4,350 patches, tags ch_0, 1, 3, 4, 5),
  each with 2 .npz (train and *val). A TIFF is float32 5x64x64. No paper on either record nor found by title search; voxel size left null
  (source record 6139958 says "0.299 nm" at 4x downscaling, likely a unit typo). enricher: authors from Zenodo; label row layout from the
  Oneat code (caped-ai-oneat MovieCreator.py: one-hot classes, then x, y, t, height, width, confidence; Normal 2,400 / Division 2,820 by
  file name), so types add bounding-box and coverage sparse (was unknown); fluorescence-other added for the flou folder (folder name; the
  ch_N to source-channel mapping is not documented); annotation source stays unknown (not stated).'
