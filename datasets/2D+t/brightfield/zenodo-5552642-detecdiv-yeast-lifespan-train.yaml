notes: 'Zip listing (peek_archive): 177,963 TIFF frames and 200 .mat files, 2.7 GB compressed; the Zenodo text says about 200,000 images from 200 lifespans (700 to 1,000 images each). Pixel size 325 nm, 20x 0.45 NA objective and BY4742 strain are from the Zenodo description; the paper full text (Methods) confirms the x20 0.45 NA Nikon objective, ORCA flash 4.0 sCMOS and 5 min frame interval, and describes the groundtruth as manually annotated traps split into training and test sets. The companion test set is a separate Zenodo record (10.5281/zenodo.5866747, 50 lifespans) published the same day by the same authors; it is a different set of lifespans, not a re-deposit. The paper mentions 250 traps in total (200 train, 50 test). Zenodo says a newer version of this record exists; v1 files are listed.'
