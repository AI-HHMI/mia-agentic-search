short_name: RPE1 cell cycle from brightfield (time-lapse)
description: 'Time-lapse widefield images (5 min interval, Operetta 20x/0.8) of dividing Fucci RPE1 cells as 64x64 nucleus-centred
  crops with brightfield and H2B channels, in 5,188 complete mitosis-to-mitosis training tracks plus two test sets (358 control
  and 73 palbociclib-treated tracks), labelled with continuous cell-cycle state from normalised Fucci intensities.'
