notes: 'Pixel size not stated on the Zenodo page or paper Methods (ACQUIFER widefield, 10x NA 0.3; images
  cropped to a 360x360 px bounding box and downsampled to 224x224 px, scaled to [0, 1]); left null. enricher:
  the .cds files are Python pickles of orgAInoid''s OrganoidDataset (pickle.dump in classification/_dataset.py;
  pickle protocol 4 magic). Not unpickled (untrusted data rule), so arrays and labels are unread; the
  readouts RPE_Final, Lens_Final, RPE_classes, Lens_classes, Total_RPE_amount, Lens_area, morph_classes
  appear in the opcode stream. n_items is the 988 organoids in the paper (117,249 images). Sum projections:
  zenodo 17205312; max projections: 17205321. Raw images (~8 TB) only on request.'
