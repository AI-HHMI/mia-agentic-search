title: Time-lapse brightfield images of medaka retinal organoids with expert RPE and lens outcome labels (single slice)
short_name: Medaka retinal organoids time-lapse (brightfield)
description: Segmented, cropped (224x224 px) brightfield time-lapse images of medaka (Oryzias latipes) retinal organoids from
  11 experiments, stored with expert annotations of whether retinal pigmented epithelium and lens tissue emerged (and their
  area classes) for predicting developmental outcome from early images. This record holds the middle-slice version; sum- and
  max-projection versions are separate Zenodo records.
