notes: 'Zip listing (peek_archive): 222,168 tif frames and 250 .mat files in testdataset/ (images/<class>
  folders and timeseries/*.mat) and the training folder; test class counts seen in the listing: large
  18,128, dead 12,502, small 6,466, clog 3,972, unbud 2,855, empty 282. The Zenodo text says about 250,000
  images; the zip holds 222,168 tif files. The deposit text says 6 classes are given by subfolder. Pixel
  size 325 nm from the Zenodo page; frame interval not read. Companion DetecDiv Zenodo records exist (testset-only
  5866747 with 50 lifespans, id02 6077125 already in catalog, id03 6075691 timeseries labels); the paper
  (eLife 2022, PMC9444243) lists 6078462 as the training and test data for the classifier. Data type text
  on Zenodo says 16-bit RGB tif, one colour per z-stack, so channels 3 is a reading of that description.
  enricher: probed frames are 8-bit RGB 60x59 (not 16-bit as the deposit text says); channels 3 confirmed.'
