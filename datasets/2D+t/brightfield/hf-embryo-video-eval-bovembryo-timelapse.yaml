short_name: Bovine embryo outcome time-lapse (brightfield)
description: 344 brightfield time-lapse videos (1280x720, about 183-200 h of development each, imaged
  every 5-10 min in a MIRI incubator) of single bovine IVF and SCNT embryos, with expert video-level labels
  for embryo type and final outcome (degenerate, arrested, success), organised for six-class, three-class
  and IVF-to-SCNT transfer classification tasks.
