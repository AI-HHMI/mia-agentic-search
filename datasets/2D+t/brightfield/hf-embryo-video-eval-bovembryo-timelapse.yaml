notes: 'Videos are .avi files (344 listed in the Hugging Face file tree and videos_metadata.csv, 8.07 GB total per dataset_summary.json,
  15 fps, 1280x720, 600 frames sampled per video by the benchmark code). Labels are video-level only: no frame-level annotations,
  event timestamps or masks. Label agreement was checked on 44 videos (Fleiss kappa 0.45 for three outcome classes, 0.77 for success
  vs non-success). Pixel size is not stated. The card refers to an accompanying paper that is not named, so no publication is listed
  and authors are unknown (the Hugging Face organisation is embryo-video-eval). The docs/sample/ videos are not part of the 344.
