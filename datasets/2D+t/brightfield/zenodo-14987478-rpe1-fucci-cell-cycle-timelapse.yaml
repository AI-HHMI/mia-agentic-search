schema_version: '1.2'
id: zenodo-14987478-rpe1-fucci-cell-cycle-timelapse
title: Time-Lapse Microscopy of Cycling RPE1 Cells with Brightfield and H2B Imaging, Annotated with Cell
  Cycle States from integrated FUCCI Intensities
short_name: RPE1 cell-cycle state tracks (brightfield/H2B)
description: Single-cell time-lapse tracks of human FUCCI RPE1 cells imaged every 5 min (72 h, PerkinElmer
  Operetta, 20x/0.8 NA widefield). Nuclei were segmented with a StarDist model on the H2B channel and
  tracked with TrackMate; each full cell-cycle (M to M) track is stored as 64x64 crops centred on the
  nucleus in brightfield and H2B, with per-track label arrays derived from normalised, log-transformed
  FUCCI (Cdt1/Geminin) intensities. 5,188 training tracks, 358 control test tracks and 73 drug-treated
  test tracks, plus trained model weights.
