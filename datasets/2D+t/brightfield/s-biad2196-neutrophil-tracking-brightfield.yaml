notes: '6 recordings (wells 01_A1, 01_A2, 01_A3, 02_F8, 03_F2, 08_H4) as OME-Zarr zips (~286 MB for the first). Pixel
  size 0.641 µm and 8 s interval from the file list TSV. Masks are described on the BioStudies page as manually curated
  instance masks with consistent IDs; the peek of the zarr zip listing was truncated so mask arrays were not directly
  confirmed. The ComplexEye paper (Nat Commun 2023) describes the microscope and automated Cellpose segmentation, but
  does not describe this benchmark release; no separate paper Data availability statement for it was found. Number of
  frames per recording not checked. enricher: label arrays confirmed (labels/Tracked Cells, int32 track IDs); size_bytes
  estimated from the EBI HTTP index (was null).'
