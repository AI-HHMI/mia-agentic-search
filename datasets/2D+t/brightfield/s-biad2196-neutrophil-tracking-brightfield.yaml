  notes: 'Each well is a zipped OME-Zarr v0.4 (zarr v2, blosc-lz4, ''/'' separator). Headers (.zattrs/.zarray) read with
    peek_archive --cat for 02_F8 only; other wells have a different frame count (879-891 zip members each, 2657 for the
    three 01_A* wells), so t varies. Scale in the OME metadata is 1,1,1 (uncalibrated; unit ''unit''), so the record''s
    641 nm pixel size stays from the file-list TSV. Sample: one frame chunk each, decoded with numcodecs: raw float64
    holding integer-like values 23-241 (mean 98.6); label 120 unique IDs up to 540 in one frame, consistent with track
    IDs kept across frames. Sizes from the rounded HTTP index, so estimated.'
