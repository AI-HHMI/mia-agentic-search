short_name: E. coli microcolony masks and tracks (time-lapse)
description: Time-lapse brightfield microscopy of dense E. coli microcolonies in LB and M9 media with manually annotated segmentation
  masks (576-frame mixed training set, held-out test frames, 180 annotated elongated-morphology frames), Omnipose masks and
  CSV/Parquet lineage tracks, for benchmarking bacterial segmentation and tracking.
