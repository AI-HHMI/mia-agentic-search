notes: Single 4.6 GB data.zip (6,834 files, 17 GB uncompressed; README inside lists
  the layout). Training set of 576 frames and blind test subset of 118 frames; ground
  truth is manual (ground_truth.tif, annotated_masks/ 146 files, elongated_morphology/annotated/frames
  166 files), while the time-lapse masks and tracks come from Omnipose/TrackMate-style
  processing and are not manually verified. Coverage is therefore partial. Zenodo
  keywords say phase-contrast but the README calls the raw images brightfield. Strain,
  microscope and a thesis citation are not given; no paper found on the record (code
  at github.com/LucasGeno/ECT, not fetched). Frame interval 0.5 min; pixel size 0.065
  µm.
