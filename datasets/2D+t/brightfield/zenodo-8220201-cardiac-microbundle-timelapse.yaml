title: Engineered cardiac microbundle time-lapse microscopy image dataset
short_name: Beating cardiac microbundle videos (brightfield)
description: 24 time-lapse movies (23 brightfield, 1 phase contrast) of spontaneously beating hiPSC-derived
  cardiac microbundles on three types of engineered testbeds (PDMS pillar strain gauges, FibroTUG fibre
  matrices, direct-laser-written heart-on-chip), each with a tissue mask used to run the MicroBundleCompute
  tracking and strain analysis software.
