notes: 'Type1.zip (11 examples, strain-gauge), Type2.zip (7, FibroTUG), Type3.zip (6, DLW chip, listed with peek_archive: Example_NN/Example_NN.tif
  plus masks/tissue_mask.tif and text masks). Pixel size is not a single value: Microbundle_metadata.csv gives 4, 0.908, 2.67 or 1.6 um/pixel by example
  (Nikon Eclipse Ti / Zeiss LSM800), so voxel_size_nm is null; frame rates 30-67 Hz. Masks were made automatically by the pipeline
  or by manual tracing in ImageJ (README), hence source mixed. The labels are tissue masks only; no manual point tracks are shipped, tracking output is
  produced by the software. Dataset is mechanobiology-oriented movies of one tissue type, 24 videos in total; no train/test split.
  The paper (Kobeissi et al., PLOS ONE 2024) was read in its Data and Methods sections.'
