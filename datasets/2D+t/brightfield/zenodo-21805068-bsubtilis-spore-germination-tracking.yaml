notes: 'Single dataset.zip (1.27 GB; peek_archive: 17,844 TIFF, 45 txt, splits.yaml). Paper full text
  is not open access; only the abstract (Europe PMC/PubMed) was read, so details come from the Zenodo
  description. Annotations were created semi-automatically (automated segmentation and tracking, then
  manual correction) per Zenodo; source set to manual because all trajectories were manually curated.
  The zip also holds Omnipose automatic segmentations (NN_OP). splits.yaml defines five CV folds. enricher:
  zip listed, frame + mask probed and sampled, states.txt / man_track.txt / splits.yaml headers read;
  channels 1 (was null).'
