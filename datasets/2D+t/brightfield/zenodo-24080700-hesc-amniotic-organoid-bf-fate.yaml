notes: 'Files: amniotic_sequences_full.tar (780.6 MB; 266 sequences = 31 cavity formation / 114 cavity collapse
  / 121 non-cavity, 193 frames each), amniotic_stage1_frames256.zip (1.21 GB; 6,125 PNG frames 256x256 plus dataset.json,
  listed with peek_archive), splits.csv (train 230 / test 36) and MD5SUMS.txt. Labels are sequence-level developmental
  fate classes, not pixel annotations; the record does not say how the fate was assigned (annotation source left
  unknown), and condition (EHDPP vs DMSO) is not recorded per sequence. n_items counts sequences. Paper is a bioRxiv
  preprint that Europe PMC lists without open full text, so only the abstract was read (pixel size not stated on
  the record or abstract; microscope: DeltaVision Elite, 10x objective per the Zenodo description). Published 2026-11-09
  (v1), so it may still change. enricher: channels 1 (grey PNGs; the 256x256 frames are grey stored as RGB); size_bytes
  from complete Zenodo file listing (was page-stated 1988094000).'
