short_name: hESC amniotic-sac organoid fate (brightfield)
description: Brightfield time-lapse sequences of human embryonic stem cell-derived amniotic-sac
  organoids (8-bit grayscale PNG crops of single organoids, one frame every 15 min over 48 h,
  193 frames per sequence), each labelled with one developmental fate (cavity formation, cavity
  collapse or non-cavity). 266 sequences with a train/test split file, plus 6,125 256x256
  frames with integer class labels used to train a static model.
