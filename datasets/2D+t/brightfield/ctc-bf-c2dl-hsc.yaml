title: 'Cell Tracking Challenge BF-C2DL-HSC: Mouse hematopoietic stem cells in hydrogel microwells, 2D+t
  with segmentation and tracking annotations'
short_name: Mouse HSC tracking in hydrogel (brightfield, 2D+t)
description: Two long 2D+t brightfield sequences (1764 frames each, 5 min interval) of mouse hematopoietic
  stem cells proliferating in hydrogel microwells (Zeiss PALM/AxioObserver Z1, 0.645 um pixels), from
  the Cell Tracking Challenge training set. Gold-truth tracking markers for all frames, sparse gold-truth
  segmentation (49 and 8 frames) and computer-generated silver-truth segmentation for all frames.
