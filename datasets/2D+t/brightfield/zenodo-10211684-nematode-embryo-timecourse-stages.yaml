notes: 'Labels are manual key-frame stage CSVs in the GitHub repo (stages proliferation, bean, comma, fold, hatch, death,
  unfertilized), not in the Zenodo zip. Microscope Nikon Ti2-E, Plan Apo 20x. Paper mentions 291 wild-type embryos. enricher:
  modality brightfield (was widefield): the code opens the stores with channel name BF20x and the README example file is "ChannelBF
  20x". enricher: formats zarr (was ome-zarr): crops are plain Zarr v2 arrays, no .zattrs. n_items 1760 embryo movies, channels
  1. organisms: Caenorhabditis elegans = 230719/, 230817/, 231031/; Oscheius tipulae = 231012/; Caenorhabditis portoensis
  = 231013/. coverage: 124 training + 85 test embryos of 1760 are annotated; 13 training rows are dataset 231011, which is
  not in the zip. voxel size differs per subset (embryo_metadata.csv xy_sampling_um): 230719 430 nm, 230817 220 nm, 231031/231012/231013
  330 nm; t 300 s.'
