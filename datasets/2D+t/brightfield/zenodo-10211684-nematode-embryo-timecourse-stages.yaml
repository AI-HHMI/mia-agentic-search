title: Time-course imaging data of nematode embryos (cropped embryos with developmental stage annotations)
short_name: Nematode embryo stage time-lapse (widefield)
description: Cropped, segmented time-lapse movies of individual nematode embryos (C. elegans, C. portoensis, O. tipulae) in
  OME-Zarr, imaged every 5 min for 14-16 h, used to train and test a ResNet-18 developmental stage classifier. Manual stage
  key-frame labels (7 classes) are distributed in the code repository, not in the Zenodo archive.
