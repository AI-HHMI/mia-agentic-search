      rows to stores by dataset_id/fov<fov_id>/embryo-<new_embryo_id>.zarr. training 124 rows, test 85 rows x 20 columns;
      hosted on GitHub (MIT), not in the Zenodo zip.
  notes: 'Inspection: Zenodo file API plus the zip central directory (listing.py --expand-zips, 4589 members); .zarray headers
    read for one store per subset; one chunk (6.3 MB, 230719 embryo-0399-0630) decoded with a short script (blosc/lz4). value_range
    is from that one sample. normalization none: raw uint16 crops of the ND2 data (code copies time_series values unchanged),
    inferred. Stores have no .zattrs, so no scale in the files; pixel sizes come from the repo embryo_metadata.csv (xy_sampling_um)
    and differ per subset, so imaging.voxel_size_nm stays null. Labels are frame-interval classifications, not masks: TensorSwitch
    / the miao layout have no label array to convert.'
