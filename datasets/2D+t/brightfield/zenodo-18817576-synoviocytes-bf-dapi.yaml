notes: 'Single SourceImages.zip (2.87 GB, 1,602 members: 1,600 TIFF, README_fibroblasts.md, .DS_Store)
  listed with peek_archive; the first listed folder is B1_04_2_1_DAPI with frames numbered up to about
  197 (200 kinetic reads per series); the bright-field folder names were not seen in the truncated listing,
  so the split between bright-field and DAPI frames (assumed about 800 each) is unconfirmed. No segmentation
  masks: DAPI images are the only reference (paper uses detected nuclei centroids as validation ground
  truth), so the training signal is paired bright-field to fluorescence for label-free nuclei prediction/detection.
  Pixel size not stated beyond 1224x904 px over about 2017x1489 um (about 1.65 um/px, derived, left null).
  Sample is one patient (paper).'
