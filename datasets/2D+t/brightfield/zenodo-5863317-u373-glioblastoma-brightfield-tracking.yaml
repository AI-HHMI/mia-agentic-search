notes: 'Single time-lapse stack, so size is at the lower bound of the usable criteria. Zenodo page and
  the imagej.net TrackMate-Cellpose tutorial: U373 cells on polyacrylamide gel, bright-field, custom Cellpose
  model (cell size about 60 um) and Simple LAP tracker; the tutorial says the model was trained with the
  ZeroCostDL4Mic Cellpose notebook for 500 epochs on 214 paired 520 x 696 patches starting from cyto2,
  but not how the training masks were made, so annotation source is automatic here (model output) and
  the training pairs are not part of this record. Microscope and objective are not stated. size_bytes
  = Zenodo listing total. enricher: XML read: 520 spots with ROI polygons in 6 tracks, CELLPOSE_DETECTOR
  (custom model, diameter 50) with KALMAN_TRACKER (not Simple LAP as the tutorial says); frame interval
  15 min (header + XML).'
