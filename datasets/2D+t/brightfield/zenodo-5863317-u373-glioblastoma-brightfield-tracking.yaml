notes: 'Single time-lapse stack, so size is at the lower bound of the usable criteria. Zenodo page and the imagej.net TrackMate-Cellpose
  tutorial: U373 cells on polyacrylamide gel, bright-field, custom Cellpose model (cell size about 60 um) and Simple LAP tracker;
  the tutorial says the model was trained with the ZeroCostDL4Mic Cellpose notebook for 500 epochs on 214 paired 520 x 696 patches
  starting from cyto2, but not how the training masks were made, so annotation source is automatic here (model output) and the
  training pairs are not part of this record. TIFF header read by range request: ImageJ TIFF, 115 x 520 x 696 (t,y,x), uint8,
  uncompressed, 650.0007 nm pixels (z spacing equals xy in the header, but this is a 2D time series). The XML was not opened (spot
  and track counts unknown). Microscope, objective and frame interval are not stated. Zenodo listing: TIF 41,642,176 B, model ZIP
  25,003,020 B, XML 2,898,446 B, PNG 382,855 B (size_bytes is their sum).'
