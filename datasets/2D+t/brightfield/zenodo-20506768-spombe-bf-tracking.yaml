notes: 'Zenodo page license is the rights statement "In Copyright - Non-Commercial Use Permitted" (InC-NC
  1.0), recorded as custom. Zip index read with peek_archive (3353 files, 2.6 GB uncompressed): 100 raw
  brightfield frames (BFdivide_position010200_timeNNNN.tif, 8.4 MB each), 100 masks in several folders
  (segmentation, segmentation4, training2), CellX results with track_mask .mat files, 100 training crops,
  and one manualtrackedits CSV. Pixel size, frame interval, how masks were produced (manual vs CellX
  automatic) and which folder is ground truth are not stated on the Zenodo page; the paper is not open
  access (Europe PMC abstract only), so Methods were not read. Annotation source therefore unknown and
  confidence reduced. A sibling Zenodo record 20509715 holds raw images only and is not catalogued.'
