notes: 'Files per DSpace bitstream list (18 files, 733 MB): cnn_training_data.zip (77 MB, 4,112 PNG +
  train_val_pairs.json), tracker_training_data.zip (64 MB, 5,496 files: training 1,590 images / 1,590
  outlines, validation 557 images / 61 outlines, testing 600 / 600), Fig1 and Fig3 benchmark zips, and
  8 HDF5 extracted-data files. Zip listings via peek_archive. License CC BY 4.0 from the dc.rights metadata.
  README read in full. The published paper is only a bioRxiv preprint (not open on Europe PMC, and the
  bioRxiv full text returned HTTP 429), so pixel size, objective, camera and number of annotated cells
  are not stated in the sources read. Modality brightfield: input images for segmentation are bright-field
  Z-sections; the HDF5 files hold fluorescence-derived time series. Annotated outlines were manually curated
  starting from BABY output (hence proofread). n_items left null: the unit (tile vs image) is ambiguous.'
