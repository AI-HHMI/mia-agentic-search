schema_version: '1.2'
id: edinburgh-datashare-4386-baby-yeast-segmentation-tracking
title: A label-free method to track individuals and lineages of budding cells (BABY training and benchmark
  data)
short_name: Budding yeast ALCATRAS segmentation and tracking
description: Bright-field and fluorescence time-lapse images of budding yeast (Saccharomyces cerevisiae)
  grown in ALCATRAS microfluidic traps, with manually curated cell outlines and lineage/tracking annotations
  used to train and benchmark the BABY segmentation and tracking algorithm. Includes the CNN training/validation/test
  set (images, manual outline labels, CNN and BABY outputs), the tracker training set (images and outlines,
  with metadata CSV), a lineage-tracking benchmark time course with curated outlines, and extracted single-cell
  HDF5 time series from experiments with Sfp1, Nhp6a, Myo1, Whi5 and Htb2 fluorescent tags.
