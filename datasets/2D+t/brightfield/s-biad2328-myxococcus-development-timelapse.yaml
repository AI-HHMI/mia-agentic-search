notes: 'File list (50 files, 212.8 GB; 203.3 GB in dataset/): Roy_training/images.zip (197.6 GB), WT/images.zip, Larry/LS3934.zip
  and Larry/pre-training.zip, plus encoded features, human-evaluation images and model weights. Acquisition per the study
  record: Wild Heerbrugg M7 S dissecting microscope, 2592 x 1944 px at 1 um/pixel, later resized to 1296 x 972 (2 um/pixel)
  and JPEG-compressed, 1 frame/min for 24 h (1440 frames per movie); which resolution the zips hold was not checked, so voxel_size_nm
  is null. Labels are two CSV tables (phenotype category with train/validation split for selected frames; aggregate formation
  at 24 h for WT movies); most frames are unlabelled and the model framework is unsupervised. The PNAS paper is not open access
  (Europe PMC abstract and NSF page only); its Methods were not read, and zip contents were not listed. n_items is null.'
