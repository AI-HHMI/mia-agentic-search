notes: 'Files: dataset/Roy_training/images.zip (197.6 GB, 1,348,815 JPEG frames, Welch Lab training movies), dataset/WT/images.zip (732
  JPEGs: frames 0001 and 1441 of 366 WT movies), dataset/Larry/pre-training.zip (16,040 JPEGs) and dataset/Larry/LS3934.zip (26 AVI
  movies), plus encoded features, human-evaluation images and model weights (.pkl). Labels: two CSV tables (13 phenotype classes with
  Training/Validation split for 2,929 selected frames; aggregates formed at 24 h, T/F, for 366 WT movies); most frames are unlabelled.
  PNAS paper is not open access. enricher: voxel size 2000x2000 nm from the study record (resized 1296x972 px at 2 um/pixel), matching
  the probed JPEG shape (was null). enricher: license URL from the study record.'
