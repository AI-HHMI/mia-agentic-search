id: s-biad2328-myxococcus-development-timelapse
title: Time-lapse microscopy datasets of Myxococcus xanthus development under starvation
short_name: Myxococcus development time-lapse (brightfield)
description: Brightfield time-lapse movies (1 frame per minute for 24 h) of Myxococcus xanthus development under starvation, from the
  Welch Lab training set of many strains, a Shimkets Lab pre-training set and nitrate experiments, plus wild-type replicates; human
  labels of developmental phenotype for selected frames and of whether aggregates formed at 24 h, and the trained models and encoded
  features.
