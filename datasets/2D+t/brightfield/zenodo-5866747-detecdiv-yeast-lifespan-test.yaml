description: Brightfield timelapse images of single budding-yeast mother cells in a microfluidic trap, cropped
  to 60x60 px per frame and manually annotated frame by frame into six cell-state classes (unbudded, small,
  large, dead, empty, clog). This is the held-out test set (50 lifespans) of the DetecDiv study; the matching training set is Zenodo 5552642.
