notes: 'Zip listing (peek_archive): 44,205 TIFF frames and 50 .mat files, 647.7 MB compressed; the Zenodo text says about 35,000 images from 50 lifespans (700 to 1,000 images each) and the stats panel lists 47.9 GB total, so counts in the page are inconsistent; the listing is used. Inside the zip the folder is still named trainingdataset/images/<class>/. Pixel size 325 nm, 20x 0.45 NA objective and BY4742 strain are from the Zenodo description; the paper Methods confirm objective, camera and 5 min interval. The companion training set is Zenodo 10.5281/zenodo.5552642 (200 lifespans), a different set of lifespans published the same day by the same authors, not a re-deposit.'
