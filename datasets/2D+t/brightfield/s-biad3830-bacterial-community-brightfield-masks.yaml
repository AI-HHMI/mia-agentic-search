notes: '24,853 files (~4.04 TB): 8,476 float32 OME-TIFF time-lapse stacks, 8,476 binary masks (0/255)
  and 7,901 V. cholerae microcolony instance-label stacks. Masks and labels are automatic (µPULLI pipeline:
  thresholding, seeded connected-component tracking), not manually verified. MIT licence named in the
  study, no URL. organisms: Vibrio cholerae = processed-images/Vcholerae/ (7,901); Klebsiella pneumoniae
  = processed-images/Kpneumoniae/ (365); Multispecies/<species>/ = one species per folder (A_baumannii,
  A_baylyi, E_coli, E_faecalis, K_pneumoniae, P_aeruginosa, S_aureus, V_cholerae; 210). enricher: voxel
  size set to null (was 697x697): subsets differ: Vcholerae/ and Multispecies/ 0.697 µm (10x), Kpneumoniae/
  1.744 µm (4x), per the study image-acquisition sections and the OME headers (697.29 / 1743.98 nm). enricher:
  size from the five repository file lists; download_url = Files/ folder (per-file downloads).'
