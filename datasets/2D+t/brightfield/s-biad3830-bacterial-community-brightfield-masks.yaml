title: Label free imaging reveals that cellular physiology is encoded in bacterial
  community architecture
short_name: Bacterial community timelapse masks (brightfield)
description: 'Low-magnification label-free brightfield time-lapse images (background-corrected
  32-bit OME-TIFF stacks, one per well) of bacterial communities in 96-well plates:
  4,962 Vibrio cholerae wells (7,901 stacks), 365 Klebsiella pneumoniae wells and
  210 wells of an eight-species panel, with automatically generated binary biofilm
  segmentation masks for all stacks and time-tracked microcolony instance labels for
  the V. cholerae stacks.'
