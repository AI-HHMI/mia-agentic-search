  notes: 'Zenodo listing with zip members: 1 file, 4,338,516,806 B exact, 61 members. Probe: the TIFFs
    are deflated zip members, so headers were unreadable by range. HDF5 headers (first 40 datasets listed):
    budding seg 650x650 per T, gzip; fission _trk.h5 1024x1024 int16 per T, gzip. Sampled SJR1 colony001:
    the microscopy TIFF via sample.py (uint16 181x650x650, TYX per tifffile, range 186-6868; normalization
    none is inferred from raw 16-bit camera values well inside the dtype range); the segmentation.h5 and
    lineage CSV via a scratch script (repo read_member + h5py): 181 frames, uint16 for T0-T1 and float64
    afterwards, integer IDs 0-82 at T180; the lineage CSV maps parent_id to bud_id per time_index. The
    fission yeast stacks and the nested training zips were not opened. Values come from one colony.'
