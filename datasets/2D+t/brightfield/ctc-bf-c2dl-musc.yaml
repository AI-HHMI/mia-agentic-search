notes: 'Training zip listed with tools/listing.py (exact zip size): 01/ 1376 tif; 01_GT/SEG 50 tif; 01_GT/TRA
  1376 tif + man_track.txt; 01_ST/SEG 1376 tif; same for 02/. Pixel/voxel size, microscope, time step
