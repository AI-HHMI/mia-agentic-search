notes: 'The Zenodo page has no description; everything here comes from the input.zip listing (peek_archive: one 866 MB AVI video plus labels/ with 112 YOLO .txt files and classes.txt containing the single class "mitosis"; one label file opened: one box) and the preprint abstract (bioRxiv 10.64898/2026.08.10.743847, abstract via Europe PMC; full text not open access via Europe PMC and the bioRxiv page returned 429). Frame interval 7.5 min is from the video file name only. Pixel size, objective, frame count, number of mitosis boxes and annotation procedure (the abstract says semi-automated deep-learning mitosis detection) were not found, so annotation source is unknown and voxel size is null. The video is AVI, which is not in the schema format list, hence formats other. Labels are numbered like frame files (e.g. -20000.txt) so label frame numbering may not start at 0. No split files.'
