title: Morphologically Constrained and Data Informed Cell Segmentation of Budding Yeast
short_name: Budding yeast traps segmentation GT (DISCO)
description: Test time-lapse data and curated ground truth from the DISCO budding-yeast segmentation paper
  (Swain lab). Four bright-field data sets (BF1-BF4, imaged 2 um out of focus above and below the focal
  plane) and one phase-contrast set of Saccharomyces cerevisiae in ALCATRAS microfluidic traps, as raw
  PNG frames, with manually curated cell outlines (curated_area) and curated tracks (curated_tracking)
  stored as MATLAB structures, plus segmentations from DISCO, CellX, CellStar and CellSerpent.
