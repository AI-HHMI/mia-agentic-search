notes: 'Single 10.68 GB zip; its central directory was read by range requests (29,023 entries): about
  28.6k raw PNG frames (BF1-BF4, PhaseContrast) and 230 .mat files (curated_area for BF1, BF2, PhaseContrast;
  curated_tracking for BF2-BF4; plus DISCO, CellX, CellStar, CellSerpent outputs). The PNG count may include
  several frames per time point. Per the paper, ground truth is over 1,000 curated outlines and 1,200
  curated trajectories; per-set counts are not given, hence partial coverage. Pixel size, objective and
  interval are not on the page or in the paper body (deferred to the supplement, not read; paper text
  past 100,000 characters unread). The later BABY dataset (10283/4386) is a separate record.'
