  notes: 'Listing: DataShare REST API (1 bitstream, 10,683,621,652 bytes, complete) and the zip central
    directory read at the corrected offset: the >4 GB zip has no zip64 records and its 32-bit offsets
    wrap (EOCD says 2,088,404,725, real 10,678,339,317), so peek_archive.py / listing.py --expand-zips
    see 0 members and listing.py on this URL starts a full GET (stopped). 28,807 files outside __MACOSX:
    28,613 PNG, ~230 .mat, 5 .avi. Sampled by range requests (1.76 MB): BF1 Brightfield PNG 512x512 uint16
    [641,9163]; PhaseContrast PNG 256x512 uint16 [0,65535]; curated_area cTimelapse.mat header. No sample
    unit set: standard zip readers (TensorSwitch zip::member included) cannot index this zip, and the
    labels are MATLAB objects. Voxel size not found; checked: PNG headers (no pHYs), DataShare metadata,
    zip contents (no README; cCellMorph_default_swain60x.mat name only); paper per harvester (supplement
    not read). Host datashare.ed.ac.uk is not on the TensorSwitch allowlist.'
