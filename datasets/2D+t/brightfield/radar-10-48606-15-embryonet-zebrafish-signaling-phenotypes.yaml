notes: 'Overview record for 19 described RADAR packages (training per pathway 10.48606/16-26, severities
  27/28, test data 29/30, models 31, medaka and stickleback 32-35); package archives could not be listed
  (no zip index read), so annotations_verified is false and formats follow the paper (Acquifer TIFF converted
  to JPEG/PNG; Keyence JPEG). Pixel size 0.31 pixel/um is stated for the Acquifer 2x objective, converted
  here to 3226 nm; Keyence pixel size is not stated. Paper reports over 2 million training images; the
  WT package alone is 160.8 GB, other sizes not read, so size_bytes and n_items are null. Packages
  are single archives downloaded through RADAR (some KonDATA data may need registration; none flagged
  on the pages read). Medaka and stickleback packages hold other organisms.'
