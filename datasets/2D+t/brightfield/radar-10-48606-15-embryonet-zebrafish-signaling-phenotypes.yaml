title: 'EmbryoNet datasets: brightfield time-lapse of zebrafish embryos with signaling-pathway phenotype
  annotations'
short_name: EmbryoNet zebrafish phenotypes (brightfield)
description: Training and test packages for EmbryoNet, a CNN that classifies phenotypes of zebrafish embryos
  with loss of one of seven signaling pathways (BMP, RA, Wnt, FGF, Nodal, Shh, PCP) or untreated. Brightfield
  time-lapse movies of embryos in multiwell plates (Acquifer Imaging Machine or Keyence BZ-X810), with
  per-embryo JSON files holding the bounding box and the class assigned by human annotators; test packages
  also hold EmbryoNet's own predictions. Further packages cover medaka and stickleback.
