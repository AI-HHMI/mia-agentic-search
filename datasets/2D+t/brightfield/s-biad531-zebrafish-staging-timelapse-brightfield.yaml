notes: 'Companion of S-BIAD840 (already in the catalog: out-of-site datasets C and D of the same paper); this study
  holds the training data and datasets A and B, with different images. Source: BioStudies API record and the study
  file_list.json (1,350 files: training_data 13 raw .ome.tif, test_data 275 raw .tif, outputs 1,062 files of ilastik
  outputs; sizes sum to 3.06 TB). The paper (Methods, Data availability) states that no manual annotation was used:
  each image is labelled with its hpf from imaging time, so the ilastik outputs are automatic. Imaging: Nikon Ti-E,
  Hamamatsu BT-Fusion sCMOS, 4X/0.13 objective, 15 min interval; pixel size not stated in the BioStudies record
  or paper. n_items counts raw stacks (288). Splits: training_data vs test_data folders. enricher: license custom
  = EMBL-EBI Terms of Use (BioImage Archive FAQ: applies where no license is stated; was unknown).'
