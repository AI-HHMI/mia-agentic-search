id: s-biad531-zebrafish-staging-timelapse-brightfield
title: Automated staging of zebrafish embryos using machine-learning (training and test time-lapses)
short_name: Zebrafish embryo staging time-lapses (brightfield)
description: Brightfield time-lapse stacks of zebrafish embryos in 96-well plates, imaged every 15 min at 28.5 C
  and 25.0 C on one site (Crick). Holds the KimmelNet training data (13 stacks), the test stacks (datasets
  A and B of the paper, 275 stacks) and the ilastik pixel/object classifier and segmentation outputs
  used to stage embryos. The age label (hours post fertilisation) comes from imaging time.
