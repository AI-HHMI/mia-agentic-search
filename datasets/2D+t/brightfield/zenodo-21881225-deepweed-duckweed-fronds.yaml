notes: 'Weak fit: RGB images from a USB digital microscope (USB2-MICRO-250X), brightfield-like. Zenodo v2 (concept DOI 10.5281/zenodo.18843917):
  petri_dish.zip (1664 JPEG frames 1600x1200 at 5-min intervals, log.txt, mp4; unlabelled), microfluidics.zip (115 PNG frames,
  an AVI, tracking CSVs/pkl and plot PNGs in output/; no masks), independent_test_set.zip (10 JPEG frames copied from petri_dish.zip
  + 10 PNG instance masks, 324 fronds, drawn blind in napari). The 80 petri / 60 microfluidic training annotations in the
  paper are not in this record. enricher: full listing read; n_items = 1664 petri + 115 microfluidic unique frames (was 1674);
  size 3,301,722,123 B from the listing (was 3.3e9 stated). Pixel size not stated (Zenodo, README, paper, GitHub README; Table
  S1 not read).'
