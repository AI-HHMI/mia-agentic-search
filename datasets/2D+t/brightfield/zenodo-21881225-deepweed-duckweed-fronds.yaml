notes: 'Weak fit, kept at low confidence: images come from a USB digital microscope (RGB, brightfield-like, not a
  research microscope) and only a small part is annotated. Zenodo version v2 (concept DOI 10.5281/zenodo.18843917)
  has three zips (3.3 GB total): petri_dish.zip (1664 JPEG frames, 1600x1200, plus one mp4, unlabelled), microfluidics.zip
  (132 PNG frames, 9 CSV, 1 pkl, 1 AVI of 307 MB), independent_test_set.zip (10 JPEG frames + 10 PNG instance masks, 324
  fronds, with annotate.py and README). The only masks in the record are the 10 test masks; the 80 Petri-dish and 60
  microfluidic training annotations described in the paper were not seen in any file listing (microfluidics.zip listing
  was only partly read). The unlabelled time-lapse frames may serve for tracking or self-supervised use. Pixel size
  not stated on the Zenodo page or in the paper Methods (Table S1 hardware specs not read). n_items = 1664 + 10 frames
  (microfluidic frames not counted).'
