title: Engineered cardiac microbundle time-lapse microscopy image dataset
short_name: Cardiac microbundle tissue masks (brightfield)
description: 24 experimental time-lapse videos (.tif) of beating hiPSC-derived cardiac microbundles on three engineered testbeds (11
  strain-gauge, 7 FibroTUG, 6 nanofabricated), 23 brightfield and one phase contrast, each with a binary tissue mask (1 = tissue, 0
  = background) generated automatically or traced manually in ImageJ.
