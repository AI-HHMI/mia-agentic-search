notes: 'Read the Dryad page and API record (license CC0-1.0, 6 files: Type1/2/3.zip, README.md, metadata csv/pdf) and the full PLoS
  ONE paper (Methods, Data availability). Zip contents could not be listed (Dryad file downloads need a token), so the masks come from
