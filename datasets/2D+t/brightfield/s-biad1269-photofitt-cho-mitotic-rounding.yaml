notes: 'Segmentation annotations: 105 masks (85 training, 20 test, about 299 MB) of rounded cells at a random time point per video, one unique label per cell (paper Methods: 105 videos chosen for ground truth). Tracking annotations: 37 TIFF track files (about 12.9 GB) in 6 acquisition-date folders for unsynchronised CHO cells, each pointing to a source CZI in SOURCE-FILES-UNSYNCHRO/. Brightfield frames every 4 min for 8 h at 0.55 um pixel size per the paper (images are resampled for Pix2Pix and segmentation training, so training pixel sizes differ). The study also contains fluorescence (MitoTracker) and virtual-staining/example-video components whose file lists were not read; total size and image count were therefore left null. The paper states example images are also on Zenodo (record 12733476), not read here. The record page does not name individual authors; the author list is from the Europe PMC paper entry.'
