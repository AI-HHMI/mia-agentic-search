description: A single 180,000-frame, 490 x 490 px stack of raw low-SNR STORM single-molecule-emission frames of immunolabelled
  microtubules in BSC-1 cells, recorded with low excitation power and short exposure. Released as the demo/training data of
  SRDTrans, a self-supervised spatial-redundancy denoiser; no clean ground truth is provided.
