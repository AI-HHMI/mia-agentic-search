notes: 'One 23.6 GB TIFF; frame count, 490 x 490 size and 43 nm pixel size are read from the file name and the SRDTrans README
  table (SMLM, 43 nm, 200 Hz, 23.6 GB), not from file headers. The Zenodo record has no description; the README lists it as
  demo data for training SRDTrans (self-supervised denoising), and the paper Methods describe the experiment (BSC-1 cells,
  Nikon N-STORM, low excitation to mimic live imaging) but its Data availability section only cites code. Organism from the
  paper''s cell-line statement; the labelled structure (microtubules) is from the paper Results. No ground truth or annotations:
  qualifies only as self-supervised training data. Sibling Zenodo records (simulated SMLM, simulated calcium imaging) are
  simulated and were not catalogued.'
