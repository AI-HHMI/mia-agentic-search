    failed with SSL EOF errors from zenodo.org). Raw data are mostly DeltaVision .dv (raw SIM, all phases/orientations/frames
    in one file) plus .mrc and .nd2; -recon files are SIM reconstructions; -mask.tif are binary in-focus cell-region masks;
