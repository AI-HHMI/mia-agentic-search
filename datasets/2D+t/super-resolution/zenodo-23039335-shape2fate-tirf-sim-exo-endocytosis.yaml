notes: 'Facts from the Zenodo record, its readme.md and archive listings of the two CME tracking zips (raw .mrc/.nd2 plus
  -recon files plus annotation CSVs). The other five zips (most data, mostly .dv files) were not listed. The related paper
  ("Morphology-aware super-resolution tracking reveals opposing architectures of exo-endocytic coupling", Shape2Fate) was not
  found in Europe PMC and the project site returned 503, so pixel size, channel counts and image counts are not stated in
  any source read; the readme says acquisition parameters are in the raw file metadata. Most files are DeltaVision .dv, which
  is not a listed format; mrc and nd2 are the listed formats seen. Annotations differ by group: tracking CSVs only in
  the CME tracking and Exocytosis tracking validation sets, productivity annotations in the Adipocytes and RUSH-CME local sets
  (cell-level train/validation split described in the readme), masks in the others. No single download URL exists (7 zips, 0.8 GB
  to 38 GB).'
