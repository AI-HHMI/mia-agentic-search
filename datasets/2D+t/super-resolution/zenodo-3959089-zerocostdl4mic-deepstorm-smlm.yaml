notes: 'DeepSTORM dataset_v1.zip (3.4 GB compressed, 5.5 GB uncompressed) lists 4 TIFFs and 4 CSVs: BIN10
  and BIN4 training folders (SimulatedDataset.tif of 0.2-0.3 MB, SimulatedDataset.csv of 0.5-0.8 MB, and
  a parameters CSV with FOV 10,240 nm, pixel 160 nm, ADC/photon, read-out noise, emitter density 2.8-4
  per um^2, 20 frames) and the experimental BIN4/BIN10_glia_actin_2D.tif (3.9 and 1.6 GB, 256x256 px,
  14,975 frames per the page). Training data are simulated, not acquired; the example is real dSTORM with
  no ground truth. Pixel size 160 nm is from the page and the parameters CSV. The ZeroCostDL4Mic preprint
  was partly available and was not found to describe this dataset; the page points to the project wiki
  for details. n_items counts the four TIFF stacks. No splits. enricher: SimulatedDataset.csv read: emitter
  positions in nm per frame (annotations verified).'
