description: Two simulated single-molecule localization microscopy time series (64x64 px, 20 frames, 160
  nm pixels, randomly placed emitters; BIN4 and BIN10 densities) with CSV files alongside, plus an experimental
  dSTORM example (phalloidin-Alexa 647 actin in rat hippocampal glia, 256x256 px, 14,975 frames, binned
  by 4 or 10).
