notes: 'Simulated (not real) data from the well-known 2013 SMLM challenge; one of several training datasets
  on the same site (Tubulins_II, Bundled Tubes HD and LS) that differ in noise, density and length. Four
  zips: sequence 191 MB (2401 tif), oracle 38 MB, fluorophores 5.5 MB, psf 1 MB; download_url is left
  null because the data is split over four zips. No license or terms stated on the pages checked (landing
  page, challenge index, file listings); the paper (Nature Methods 2015) is not open access, so only its
  abstract was read. Pixel and camera parameters come from the landing page. Organism: none (simulated
  data). enricher: size_bytes from the full zip listing (was ~236 MB stated).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  4 zips, 235,386,288 bytes (4,814 members)\n  sequence.zip      190.6 MB   00001.tif ...\
      \ 02401.tif   (one 256 x 256 uint16 frame each)\n  fluorophores.zip    5.5 MB   activation.csv,\
      \ position.csv, frames/00001.csv ... frames/02401.csv\n  oracle.zip         ~38 MB    projection-{avg,max}-{camera,high}-resolution.{tif,jpg}\
      \  (camera 256 x 256, high 7680 x 7680)\n  psf.zip             ~1 MB    psf-10.0nm.tif, illustration.png"
    n_files: 4
    listing_complete: true
  sample:
    urls:
    - https://srm.epfl.ch/srm/Data/challenge-2D-simulation/Tubulins_I/Data/sequence.zip::00001.tif
    - https://srm.epfl.ch/srm/Data/challenge-2D-simulation/Tubulins_I/Data/fluorophores.zip::frames/00001.csv
    size_bytes: null
    description: frame 1 of the movie and its ground-truth emitter list
  arrays:
