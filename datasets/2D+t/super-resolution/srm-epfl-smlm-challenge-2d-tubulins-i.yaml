short_name: Simulated SMLM tubulin frames with emitters (SMLM)
description: Simulated 2D single-molecule localization microscopy movie from the 2013 SMLM software challenge.
  2401 16-bit TIFF frames (256x256 px, 150 nm camera pixel) of simulated tubulin filaments with 100,000
  activated fluorophores, with per-frame ground-truth fluorophore positions (CSV) and oracle super-resolution
  reference images.
