notes: 'Simulated (not real) data from the well-known 2013 SMLM challenge; one of several training datasets on the same site
  (Tubulins_II, Bundled Tubes HD and LS) that differ in noise, density and length. Sequence is 191 MB zip (2401 tif), oracle
  38 MB, fluorophores 5.5 MB, psf 1 MB; size_bytes is the sum of the three listed zips plus psf (~236 MB); download_url is
  left null because the data is split over four zips. No license or terms stated on the pages checked (landing page, challenge index, file listings); the paper
  (Nature Methods 2015) is not open access, so only its abstract was read. Pixel and camera parameters come from the landing page.'
