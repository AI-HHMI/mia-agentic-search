    normalization: none
    alignment: not-applicable
    alignment_notes: 'sequence.zip: one TIFF per frame (frame number = file stem), so the movie axis t
      is the file index. Simulated camera counts (not normalised; inferred from the landing page acquisition
      parameters).'
  - role: label
    path_pattern: frames/[0-9][0-9][0-9][0-9][0-9].csv
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: float32
    compression: none
    normalization: none
    encoding: points-table
    alignment: scaled
    alignment_notes: fluorophores.zip/frames/<NNNNN>.csv lists the emitters active in sequence.zip/<NNNNN>.tif.
      Header Ground-truth,frame,xnano,ynano,znano,intensity; positions are in nm (divide by the 150 nm
      pixel size for pixel coordinates). activation.csv and position.csv hold all 100,000 fluorophores.
      dtype is the text value type, not stored.
  - role: other
    path_pattern: projection-*-resolution.tif
    format: tiff
    axes: yx
    shape:
    - 7680
    - 7680
    shape_varies: true
    dtype: uint16
    compression: none
    normalization: unknown
    alignment: scaled
    alignment_notes: 'oracle.zip reference renderings: camera-resolution 256 x 256 and high-resolution
      7680 x 7680 (30x, i.e. 5 nm pixels if the field is the same), avg and max projections.'
  notes: 'Listing: the 4 zips linked from the landing page (complete, exact sizes). Probed sequence.zip::00001.tif
    (ImageJ, 256x256 uint16, uncompressed) and the 4 oracle TIFFs. Sampled sequence.zip::00001.tif (77,885
    B fetched): 51-910, mean 173; value_range is from this one frame. Read frames/00001.csv and activation.csv
    with peek_archive.py. Download links: usable except that srm.epfl.ch is not on TensorSwitch''s fetch
    allowlist. License not found; checked: landing page, challenge-2D index, srm.epfl.ch index, the bigwww.epfl.ch/smlm
    mirror pages, Europe PMC (paper not open access). Voxel size: x = y = 150 nm from the landing page
    (Pixelsize 150.00); 2D+t, so z stays null.'
