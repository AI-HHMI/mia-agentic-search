notes: 'Covers the four training sets with public ground truth (MT0.N1/N2, LD/HD); contest sets (MT1-4,
  ER1-2) have secret ground truth and are excluded. Only the MT0.N1.LD subpage was read in full: 19,996
  frames, 64x64 px, 100 nm pixel, 16-bit TIFF zips (115-235 MB per modality), ground-truth CSVs listed;
  the other three sets come from the overview table only. Simulated data. No license or terms found on
  the dataset pages or in the paper''s availability statement. enricher: all four subpages listed (48
  zips + 20 CSVs, 3.39 GB); n_items counts the 4 training sets; CSV columns read.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "srm.epfl.ch/srm/  68 files, 3,389,790,250 bytes\n  Data/challenge-3D-simulation/MT0.{N1,N2}.{LD,HD}/Data/\n\
      \    sequence-<set>-<modality>-as-stack.zip   1 multipage tif each\n    sequence-<set>-<modality>-as-list.zip\
      \    one tif per frame (LD 19,996 / HD 2,500)\n    modalities: 2D-Exp, AS-Exp, BP+250, BP-250, BP-Exp,\
      \ DH-Exp  (12 zips per set)\n  dataset/challenge-3D-simulation/MT0.{N1,N2}.{LD,HD}/sample/\n   \
      \ activations.csv, positions.csv, stats_activation_{fluos,frames,sumary}.csv"
    n_files: 68
    listing_complete: true
  sample:
    urls:
    - https://srm.epfl.ch/srm/Data/challenge-3D-simulation/MT0.N1.HD/Data/sequence-MT0.N1.HD-2D-Exp-as-stack.zip::sequence-as-stack-MT0.N1.HD-2D-Exp.tif
    - https://srm.epfl.ch/srm/dataset/challenge-3D-simulation/MT0.N1.HD/sample/activations.csv
    size_bytes: 16592155
    description: 'MT0.N1.HD 2D modality: 2,500-frame stack and its ground-truth activations table'
  arrays:
  - role: raw
    path_pattern: MT0.*/Data/sequence-*-as-stack.zip
    format: tiff
    axes: tyx
    shape:
    - 2500
    - 64
    - 64
    shape_varies: true
    dtype: uint16
    compression: unknown
    value_range:
    - 337
    - 13312
    normalization: none
    alignment: not-applicable
    alignment_notes: 'One multipage TIFF of camera frames per zip (tifffile reads ZYX; the pages are time
      frames: 2,500 for HD, 19,996 for LD). The -as-list zips hold the same frames as single TIFFs. BP-Exp
      zips are about twice the size of the others (contents not checked).'
  - role: label
    path_pattern: MT0.*/sample/activations.csv
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: points-table
    classes: null
    alignment: transform-provided
    alignment_notes: 'Columns: Ground-truth (emitter id), frame, xnano, ynano, znano, intensity; positions
      in nm in the simulated 6.4 x 6.4 um field (100 nm camera pixels), so pixel = nm / 100. positions.csv
      lists the x, y, z of each fluorophore. One sample/ folder per training set page.'
  notes: 'Listing: tools/listing.py on all 68 file URLs of the four MT0 subpages (48 zips + 20 CSVs),
    complete with exact sizes (3,389,790,250 bytes; 269,976 zip members). Sampled sequence-as-stack-MT0.N1.HD-2D-Exp.tif
    from its zip (14,921,437 bytes): 2500x64x64 uint16, 337-13312, mean 815 (one sample); normalization
    none inferred (simulated camera counts, no clipping). Read the first lines of MT0.N1.HD activations.csv
    and positions.csv. voxel size 100 nm camera pixel stays from the dataset page; not in the TIFF header.
    license not found; checked: dataset overview and four subpages, zip member names, paper availability
    statement (harvest). Downloads: zips, members and CSVs are range-readable, but srm.epfl.ch is not
    on the TensorSwitch allowlist; no single archive.'
