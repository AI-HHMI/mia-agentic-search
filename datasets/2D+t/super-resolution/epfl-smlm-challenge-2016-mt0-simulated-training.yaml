title: SMLM Challenge 2016 simulated microtubule training datasets (MT0, public ground truth)
short_name: Simulated SMLM microtubules, 2D/3D (STORM)
description: Simulated Alexa647-like STORM image sequences of microtubules (MT0.N1/N2, low and high density)
  in 2D, astigmatic, biplane and double-helix 3D modalities, released as training data for the 2016 EPFL
  SMLM software challenge with public ground-truth molecule positions.
