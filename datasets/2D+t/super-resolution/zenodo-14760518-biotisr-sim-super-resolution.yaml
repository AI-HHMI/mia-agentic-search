notes: 'Parent record 14760518 holds supplementary files and links; the 2D data is in zenodo 13843670 (six zips, 13-20
  GB each, total ~89.5 GB; peeked BioTISR_Microtubules.zip: 220 .mrc files, per-cell RawSIMData_level_XX.mrc inputs and
  SIM_gt.mrc targets). The 3D data is split across further Zenodo records (10.5281/zenodo.13843673, 13994464, 13932988,
  13989327, 13843183, 14000502); the 3D wide-field inputs are averaged images, raw SIM to follow. Pixel/voxel size is
  not stated on the Zenodo pages, the supplementary imaging_conditions.xlsx or the preprint methods as seen, so voxel_size_nm
  is null. The paper is a bioRxiv preprint whose text says data will be released after acceptance; the Zenodo record
  is nonetheless public. The paper text says ~35 groups train/val and ~15 test per specimen, but the dataset provides
  no split files. Organism inferred from cell lines (COS-7 = Chlorocebus sabaeus, SUM-159 = Homo sapiens). Ground truth
  is SIM reconstruction, not manual annotation.'
