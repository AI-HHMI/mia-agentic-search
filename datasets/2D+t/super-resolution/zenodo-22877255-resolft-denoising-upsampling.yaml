notes: 'Per-dataset READMEs inside the zips (read by the enricher) give cell lines U2OS (vimentin, actin, mitochondria)
  and HeLa (Gag-IM) and pixel sizes. enricher: voxel size stays null because subsets differ: 30 nm = vim_fixed_multi_snr,
  actin_fixed_multi_snr, mito_live_tl_lowON, gag_live_tl_highON, gag_live_tl_lowON, gag_live_denoise_eval, gag_live_upsamp_eval;
  35 nm = vim_live_tl_highON; 34 nm = mito_live_tl_highON (z n/a, 2D). enricher: organism Homo sapiens from READMEs
  (was empty); channels 1 from probes. Mixed 2D (fixed and eval single frames) and 2D+t (live time-lapses). Zips
  also hold checkpoints, run logs and predictions; application.zip holds figure data. Live eval pairs move between
  scans (README: not for pixel-wise comparison).'
