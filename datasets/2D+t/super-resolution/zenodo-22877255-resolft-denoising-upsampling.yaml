notes: 'Zenodo record, README and dataset_catalog.json read; the vim_fixed_multi_snr.zip listing (peek_archive)
  shows TIFF stacks under preprocess/recon/gt_avg/{train,test} plus run folders with checkpoints, so each zip
  mixes data with models and logs. Other zips were not listed (one listing attempt failed with an SSL error).
  The full text of the paper (Research Square preprint, not open access in Europe PMC) was not available: the
  abstract only, so pixel size, cell lines/organisms, probes and exposure settings are not stated and are left
  null/empty; reference images are averages or high-ON acquisitions rather than manual labels, so source is
  automatic. Splits come from dataset_catalog.json (verified only for actin). Dimensionality is 2D+t for the
  live time-lapses; the fixed sets are single 2D frames; application.zip includes volumetric mitochondria data.
  The dataset is large (about 83 GB); individual archives can be fetched separately (4.5 to 16 GB each).'
