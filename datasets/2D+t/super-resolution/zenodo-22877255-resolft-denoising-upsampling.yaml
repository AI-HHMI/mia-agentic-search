short_name: RESOLFT nanoscopy denoising/upsampling pairs
description: 'RESOLFT (MoNaLISA) nanoscopy time-lapses for training and evaluating denoising and temporal upsampling.
  Eight dataset archives: fixed vimentin and fixed actin (multiple SNR levels with high-ON ground-truth averages),
  live vimentin, live mitochondria and live Gag-IM (high-ON and low-ON switching acquisitions), plus independent
  Gag-IM denoising and upsampling evaluation sets. Each archive also holds trained models and run logs; an application.zip
  holds figure examples.'
