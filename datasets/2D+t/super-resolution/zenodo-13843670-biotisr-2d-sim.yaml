short_name: BioTISR 2D time-lapse SIM super-resolution
description: 2D part of BioTISR, time-lapse low/high-resolution image pairs for super-resolution microscopy. Five
  specimens (clathrin-coated pits, lysosomes, outer mitochondrial membrane, microtubules, F-actin, plus nonlinear-SIM
  F-actin) imaged on a Multi-SIM system in TIRF-SIM, GI-SIM and nonlinear SIM modes. Each cell has raw SIM data
  at three excitation levels (inputs of differing SNR) and a reconstructed SIM ground-truth stack.
