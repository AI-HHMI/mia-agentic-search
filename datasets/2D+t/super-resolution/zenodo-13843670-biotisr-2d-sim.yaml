notes: 'Six zips (CCPs, Microtubules, F-actin, F-actin_nonlinear, Lysosomes, Mitochondria), ~13-20 GB each; only
  the CCPs zip was listed (240 .mrc files: per-cell RawSIMData_level_01-03 + SIM_gt). Pixel size not stated on the
  dataset page, paper Methods or file listing (MRC headers not read). Paper describes at least 50 ROIs per specimen;
  split guidance (about 40 groups train/val, about 10 test) is in the paper Methods but no split files are provided.
  Ground truth is SIM reconstruction of highest-excitation raw data (algorithmic, not manual). Split into several
  Zenodo records with a parent concept DOI 10.5281/zenodo.13924483; 3D parts are separate records not covered here.
  enricher: CCPs zip inspected. Raw 180x512x512 uint16 per level = 20 time points x 9 SIM raw frames; SIM_gt is
  20x1024x1024 float32 (2x upsampled).'
