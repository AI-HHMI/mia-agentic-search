notes: 'From the Foundry/MDF entry (DOI 10.18126/71ek-dyij, one file Defecttrack.h5, folder total_size
  5,044,531,458 B in the MDF record) and the Scientific Reports paper (PMC9489724: VIA annotation of a
  1,200-frame TEM video at 2048x2048, 0.38 nm per pixel, 103 FPS; split into eight sequences of 1200 frames
  at 1024x512 for training). The paper points to a figshare private link for the data (not reachable,
  HTTP 202 bot check); the MDF copy is what was reachable. MDF lists no license (rightsList empty); the
  CC BY 4.0 link in the paper is the article licence. MDF gives the year 2023 only, so no date is set.
  enricher: HDF5 layout read from the file (1,200 images + 1,200 box tables); annotations verified.'
