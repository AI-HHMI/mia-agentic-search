description: Annotated in-situ irradiation TEM video of annealed nickel (1,200 frames, 2048x2048 pixels
  in the paper, split into video sequences for training) with bounding boxes and unique track IDs for
  every cascade-induced defect cluster, in MOTChallenge style; training data of the DefectTrack real-time
  multi-object tracker.
