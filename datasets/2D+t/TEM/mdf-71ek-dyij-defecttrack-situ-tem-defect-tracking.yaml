notes: 'From the Foundry/MDF entry (DOI 10.18126/71ek-dyij, hdf5, 1,200 items, one file Defecttrack.h5, 5.04 GB by HTTP Content-Length) and the Scientific Reports paper
  (PMC9489724: VIA annotation of a 1,200-frame TEM video at 2048x2048, 0.38 nm per pixel, 9.7 ms per frame; split into eight sequences of 1200 frames at 1024x512 for training).
  The paper points to a figshare private-link repository for the data; the MDF copy is what was reachable. MDF lists no license and the dataset page was not
  readable, so license is unknown (the paper is open access). The HDF5 internals were not inspected (no h5py), so the annotation layout is taken from the Foundry key description.
  MDF gives the year 2023 only, so no date is set.'
