title: 'SHINE self-supervised EM denoising datasets: liquid-cell TEM, STEM and cryo-ET'
short_name: 'SHINE denoising: liquid-cell TEM and cryo-ET'
description: 'Raw noisy electron-microscopy datasets released with the SHINE blind-spot self-supervised denoiser: liquid-cell
  and in situ TEM time series (Au, Pd, Pt nanoparticles, MoS2 hydrogen evolution), simulated TEM time series (LPTEMsimulator,
  clTEM), time-series STEM, and cryo-ET tilt-series movies of cultured rat neurons (mitochondria). The method trains on the
  noisy data itself without clean targets, so the data serve self-supervised denoising; no labels or clean references are
  provided for the real data.'
