notes: 'Six zips on Zenodo (about 38.9 GB): Liquid cell datasets and in-situ datasets (TIFF frames, 199 and 131 files), Simulated
  datasets (1,400 TIFF frames), Cryo-ET dataset (41 tilt-series movies, .mrc, about 10.4 GB), Supplementary datasets (200
  TIFF + MRC movies, 27 GB) and the SHINE code. Real data are unlabelled noisy time series; pixel size is only stated for
  some data (cryo-ET 3.6 A, a clTEM simulation 0.217 A), so voxel size is left null. The Zenodo record is tagged MIT. Checked:
  Zenodo record and file contents (peek_archive), full paper Methods and Data availability.'
