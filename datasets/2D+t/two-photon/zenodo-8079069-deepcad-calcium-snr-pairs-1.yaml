notes: 'Zenodo record (CC-BY-4.0) has no description beyond the title; its metadata cites the DeepCAD
  paper (Nat Methods 2021), whose Data availability section describes "synchronized low-SNR and high-SNR
  two-photon calcium imaging (covering various imaging depths, excitation power, and cell structures)";
  the paper is not open access, so Methods were not read and the full text was unavailable via Europe PMC.
  Archive contents listed with peek_archive on the first zip (one lowSNR and one highSNR TIFF, 3.1 GB each);
  the other 9 zips are assumed to follow the same pattern from their names. Organism is Mus musculus and
  indicator GCaMP6 based only on the paper''s supplementary-video captions (mouse, GCaMP6f); which
  specimens each zip holds is not stated. Pixel size, frame counts and per-zip sample details not found
  on the Zenodo page, file names (ZOOM1.3, 550Vx575H FOV, 30Hz) or the paper page. Sibling Zenodo deposits
  DeepCAD dataset #2 (8080615) and #3 (8079117) are separate records.'
