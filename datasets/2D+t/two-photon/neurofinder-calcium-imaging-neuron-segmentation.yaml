notes: 'No license stated on the GitHub README or the dataset README; no paper for
  the benchmark itself. Organism, pixel size and frame rate not stated on the pages
  read (README, zip listing of 00.00); the CaImAn eLife paper (doi 10.7554/eLife.38173)
  re-uses NF.00.00-04.00 as mouse in vivo data (frame rate 7-30 Hz, GCaMP6) but not
  as this dataset page. Labels come from a nuclear marker and/or hand annotation depending
  on the dataset (README). Zip 00.00 verified: 3024 TIFF frames + regions/regions.json
  (~1 GB zipped). Test sets (.test) have no ground truth, so n_items counts 19 train
  + 9 test. Links for 04.00.test/04.01.test on the README point to the 03.00.test
  zip. Related: zenodo-1659149 CaImAn records re-use some NF movies.'
