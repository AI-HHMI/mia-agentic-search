description: 'Benchmark challenge for finding neurons in two-photon calcium imaging
  data: 19 training movies (datasets 00.00-04.01) with ground-truth neuron ROI coordinates,
  plus 9 test movies without ground truth, provided by Janelia, UCL, Columbia and
  Harvard labs. Each download is a zip of per-frame TIFF images, metadata JSON and
  regions JSON.'
