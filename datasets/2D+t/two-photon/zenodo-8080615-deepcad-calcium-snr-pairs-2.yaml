notes: 'Zenodo record (CC-BY-4.0) has no description; its metadata cites the DeepCAD paper (Nat Methods 2021), whose Data availability section describes synchronized low-SNR and high-SNR two-photon calcium imaging (various depths, excitation powers, cell structures). The paper is not open access (Europe PMC has no full text), so Methods were not read. Archive contents not listed for this deposit; the same naming pattern as deposit #1, whose first zip holds one lowSNR and one highSNR TIFF, is assumed. Organism (Mus musculus) and indicator (GCaMP6) come only from the paper''s supplementary-video captions; what each zip holds is not stated. Pixel size and frame counts not found on the Zenodo page, file names or paper page. Sibling deposits #1 (8079069) and #3 (8079117) are separate records of the same release (file names show different depths, powers and settings).'
