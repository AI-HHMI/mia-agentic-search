title: 'SRDTrans dataset: simulated calcium imaging data at different imaging speeds'
short_name: Simulated 2P calcium denoising pairs (SRDTrans)
description: Six pairs of simulated two-photon calcium imaging recordings (NAOMi simulator) at imaging
  speeds of 0.1, 0.3, 1, 3, 10 and 30 Hz, each 1,000 frames of 490 x 490 pixels (pixel size 1.02 um).
  Each noisy stack (mixed Poisson-Gaussian noise, SNR about -0.3 to -0.9 dB) has a noise-free ground-truth
  stack, released with the SRDTrans self-supervised denoising method.
