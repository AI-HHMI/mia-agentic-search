notes: 'Synthetic data, not recorded from a specimen: the paper Methods state the noise-free calcium imaging data were generated
  with the NAOMi simulator and mixed Poisson-Gaussian noise was added at several levels; the paper gives 490 x 490 pixels and
  1.02 um pixel size for all simulated calcium imaging data. The Zenodo description is only the title; the clean/noisy pairing
  is read from the 12 file names in the Zenodo listing (6 clean, 6 noisy, 486,216,016 B each), the pairing was not checked at
  file level. Frame rate is encoded in file names (0.1-30 Hz); z is null (2D+t). Paper Data availability points to the
  GitHub repository for datasets; the Zenodo record was what was fetched.'
