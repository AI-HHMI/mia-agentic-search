notes: 'Each dataset is a zip at s3.amazonaws.com/neuro.datasets/challenges/neurofinder/neurofinder.NN.NN[.test].zip.
  19 training zips with images (19,892,683,030 B; 01.02-01.04 are 0.4 MB zips with regions only), 9 test zips without
  ground truth, plus neurofinder.all.test.zip. Per the CaImAn paper annotations were made manually or from a static
  structural-indicator image (source mixed). No license on the GitHub repos or in the zip README. enricher: modality
  two-photon and organism Mus musculus from info.json ("method": "Two-photon raster", "animal": "Mouse"; 00.00,
  01.00, 02.00, 03.00, 04.00); size is all 32 zips on S3 (was training zips only). Pixel size differs per lab (info.json
  pixels-per-micron): Svoboda 00.xx/02.xx 1.15 (870 nm), Hausser 01.00 0.8 (1250 nm), Losonczy 03.00 1.7007 (588
  nm), Harvey 04.00 0.8 (1250 nm); so voxel_size_nm stays null.'
