notes: 'Zenodo record has no description beyond the title and lists four files: 1_spine_GCaMP6f_50mWpower_978x492x6500
  and 2_spine_GCaMP6f_115mWpower_944x432x6500, each as _lowSNR and _highSNR TIFF (23.3 GB total). Pairing
  and acquisition come from the paper (synchronized low-SNR and high-SNR paths, high-SNR with tenfold
  fluorescence photons; 920 nm excitation, 25x/1.05 NA water objective; spines imaged at 30 Hz, L1 20-60
  um deep). Part of the DeepCAD-RT source data (11 groups, each a Zenodo record). Different from catalogued
  s-biad237-deepcad-calcium-denoising (a single noisy movie from the earlier DeepCAD paper). enricher:
  voxel size 155x155 nm (0.155 um/pxl) from the DeepCAD-RT datasets page (was null); dtype uint16 and
  axes tyx from TIFF headers and file names.'
