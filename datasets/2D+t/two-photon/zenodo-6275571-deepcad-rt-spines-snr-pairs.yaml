notes: 'Zenodo record has no description beyond the title and lists four files: 1_spine_GCaMP6f_50mWpower_978x492x6500
  and 2_spine_GCaMP6f_115mWpower_944x432x6500, each as _lowSNR and _highSNR TIFF (5.3-6.3
  GB each, 23.3 GB total; shapes taken from file names). Pairing and acquisition come
  from the paper (custom two-photon microscope capturing synchronized low-SNR and
  high-SNR images, high-SNR with tenfold fluorescence photons; 920 nm excitation,
  25x/1.05 NA water objective; dendritic spine imaging at 30 Hz, L1 20-60 um deep).
  Pixel size not stated in the paper text checked or on the Zenodo record; TIFF headers
  not inspected. The paper states all ~250 GB source data (synthetic, neutrophil,
  ATP and other recordings) are at https://cabooster.github.io/DeepCAD-RT/Datasets/
  (not fetched); this record covers only the Zenodo spine files. Different from catalogued
  s-biad237-deepcad-calcium-denoising (a single noisy movie from the earlier DeepCAD
  paper).'
