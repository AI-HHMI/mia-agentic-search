title: 'DeepCAD-RT dataset: mouse brain neutrophils'
short_name: Mouse brain neutrophil low/high-SNR pairs (2P)
description: 'Two-photon recordings of neutrophil migration in the mouse brain after
  acute craniotomy injury (WGA-Alexa Fluor 555 and anti-Ly-6G/Ly-6C labelling), each
  acquired as synchronized low-SNR and high-SNR (tenfold fluorescence photons) movies,
  released with the DeepCAD-RT denoising paper. Pixel size 0.349 um/px and frame rate
  10 Hz from the DeepCAD-RT datasets page; 4 TIFF files (2 low/high-SNR pairs), shapes
  in file names: 512x512x6440 (0.349 um/px) and 512x512x5706 (0.465 um/px).'
