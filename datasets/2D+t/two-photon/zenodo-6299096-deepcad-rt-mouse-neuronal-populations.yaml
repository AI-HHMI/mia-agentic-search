description: 'Two-photon recordings of mouse cortical neuronal populations at 90-180
  um depth (GCaMP6f), recorded at several laser powers and depths, each acquired as
  synchronized low-SNR and high-SNR (tenfold fluorescence photons) movies, released
  with the DeepCAD-RT denoising paper. Pixel size 0.977 um/px and frame rate 30 Hz
  from the DeepCAD-RT datasets page; 16 TIFF files (8 low/high-SNR pairs), 490 x 490
  px frames.'
