title: Raw datasets for FAST real-time self-supervised denoising of high-speed fluorescence neural imaging
short_name: Neural calcium/voltage imaging for denoising
description: Five raw fluorescence time-lapse collections used to develop and test FAST, a self-supervised
  denoiser for high-speed neural imaging - two-photon calcium imaging of mouse neurons (Neurofinder), an
  in vivo volumetric two-photon astrocyte stack, epifluorescence voltage imaging of single mouse cortical
  neurons with patch-clamp traces, light-sheet voltage imaging in zebrafish spinal cord, and simulated
  two-photon voltage movies (2-8 ms spikes) that include noisy and clean versions.
