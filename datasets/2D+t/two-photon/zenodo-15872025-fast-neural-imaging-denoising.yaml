notes: 'Six files: 1-Calcium_Neuronal_Population.tif (Neurofinder), 2-Voltage_Simulated_Fast_Dynamics.zip
  (noisy and clean tif plus .mat per spike width), 3-Voltage_Single_Cell.zip (dat.tif + amp_data.mat, from
  Eom 2023), 4-Voltage_Zebrafish.tif (Xie 2021), 5-Calcium_Astrocyte_Volume.tif (new). README: CC-BY 4.0 covers
