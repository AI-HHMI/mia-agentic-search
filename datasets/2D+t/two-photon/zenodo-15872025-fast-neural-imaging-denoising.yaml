    2ms_spike_movClean_00001.tif and dat.tif (~6.2 MB fetched) and read page 0. value_range is from page
    0 of those members only. The page counts of the zip-member TIFFs weren''t read (shape null). Voxel
    size not found per collection: checked TIFF headers (only the ImageJ default 1 micron on the zebrafish
