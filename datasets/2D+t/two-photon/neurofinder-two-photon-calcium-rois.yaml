notes: 'Landing page neurofinder.codeneuro.org returned 503, so the GitHub repo README was used. No license stated in the repo,
  the zip README or info.json. No paper released the data; none cited. Zip 00.00 listed with peek_archive: 3024 uint16 512x512
  TIFF frames (one file per frame), info.json, regions/regions.json, README and loaders. Per-movie info.json (movies 00.00, 01.00, 02.00,
  03.00, 04.00 read) gives pixels-per-micron 0.8-1.7 (e.g. 1.15 for 00.00), rate 6.75-8 Hz, dimensions (frames 2250-8000)
  so voxel_size_nm is left null because it differs per movie. size_bytes is the sum of the 19 training zips (Content-Length);
  the 9 test zips have no ground truth and are not counted. Only movies 00.00, 01.00, 02.00, 03.00 and 04.00 had info.json read;
  the other training movies are assumed similar mouse GCaMP data. Download links for 04.00.test and 04.01.test were reported
  as pointing to the 03.00.test zip (repo README, not verified).'
