notes: 'Read project page and arXiv HTML; training.zip listed with peek_archive (210 .avi in training/<acquisition>/<0|1>/).
  Patches are RGB .avi (other: avi not in format list). Page says CC-BY, no version (CC-BY-4.0 assumed);
  paper states no data license. Mouse strain and Treg reporter not stated in the text read. Points = released
  manual tracks. enricher: size 4.8 MB from the full zip listing; download_url null (four zips plus a
  csv).'
