schema_version: '1.2'
id: cbvcc-treg-behavior-video-classification
title: Cell Behavior Video Classification Challenge (CBVCC) dataset
short_name: T-cell direction-change videos (intravital 2P)
description: 300 two-photon intravital microscopy video patches (50 x 50 px, 20 frames, 0.8 um pixel size, 40 x 40 um)
  cut from 48 acquisitions of T lymphocyte migration in mouse flank skin during a contact-sensitivity response.
  Each patch is labelled 1 (cell suddenly changes direction) or 0 (linear movement, stationary or background).
  Split into 210 training, 30 phase-1 test and 60 phase-2 test patches; manual TrackMate tracks are released too.
