description: Paired high-SNR and low-SNR two-photon imaging stacks (neuropil and dendritic spines with GCaMP6f, neutrophils, zebrafish), recorded at several laser powers, depths and frame rates (10-30 Hz). Each sample is provided as a highSNR and a lowSNR TIFF, so the pairs can be used to train and test denoising models. The Zenodo record gives no description beyond its title.
