notes: 'Zenodo record has only a title as description and lists no related publication; paper.py searches (Europe PMC / Crossref by title and authors) found none. Checked: record page, API record (file list), peek_archive of Neutrophil-highSNR.zip (one 914 MB tif). Voxel size, organism, frame size and time-lapse axes are not stated, so 2D+t is inferred from the 10-30 Hz file names and may be wrong. Pairing of highSNR/lowSNR files is inferred from file names. Total 112.7 GB across ~37 files (TIFF stacks plus zips of the same data).'
