notes: 'Zenodo record has only a title as description and no related publication; no paper found (Europe
  PMC/Crossref, web search). Pairs: 15 lowSNR/highSNR TIFF pairs, matched by file name; the 6 zips each
  hold one TIFF of the same data. enricher: organisms: Danio rerio = Zebrafish-* files; Mus musculus =
  Spine-4 and Neutrophil-01 files, byte-identical to DeepCAD-RT Zenodo 6275571 (mouse dendritic spines)
  and 6296569 (mouse brain neutrophils); Neuropil-* and Neutrophil-04 species not stated. enricher: voxel
  size differs per subset (Spine-4 = DeepCAD-RT 2_spine, 0.155 um/px per that dataset; Neutrophil-01 =
  02_neutrophil, 0.465 um/px in its upstream file name); Neuropil/Zebrafish not stated, so voxel_size_nm
  stays null. Annotations are restoration pairs only (no masks).'
