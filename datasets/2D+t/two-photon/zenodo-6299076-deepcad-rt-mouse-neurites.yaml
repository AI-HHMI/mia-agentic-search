description: 'Two-photon recordings of mouse cortical neurites at 40-80 um depth (GCaMP6f),
  recorded at several laser powers and depths, each acquired as synchronized low-SNR
  and high-SNR (tenfold fluorescence photons) movies, released with the DeepCAD-RT
  denoising paper. Pixel size 0.977 um/px and frame rate 30 Hz from the DeepCAD-RT
  datasets page; 8 TIFF files (4 low/high-SNR pairs), shapes in file names: four recordings,
  each a low/high-SNR pair, 30 Hz.'
