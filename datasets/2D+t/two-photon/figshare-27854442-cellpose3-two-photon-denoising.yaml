title: Dataset from Cellpose3, two-photon calcium imaging from ribo-gcamp8s-expressing neurons
short_name: Two-photon jGCaMP8s denoising (Cellpose3)
description: 'Noisy in vivo two-photon calcium imaging movies of somatic jGCaMP8s (riboL1-jGCaMP8s mouse
  line), collected for testing denoising: 20 neural fields of view (12 dense, 8 sparse expression), 300+
  frames each at 30 Hz. The time average of the 300 frames serves as the clean ground truth for denoising
  and for neuron segmentation (diameter 17 px) in the Cellpose3 restoration benchmark. Pages are 1024
  x 1024 int16 in multi-page BigTIFFs.'
