notes: 'Zenodo record (CC-BY-4.0) has no description; its metadata cites the DeepCAD paper (Nat Methods 2021), whose
  Data availability section describes synchronized low-SNR and high-SNR two-photon calcium imaging (various depths,
  excitation powers, cell structures). The paper is not open access (Europe PMC has no full text), so Methods were
  not read. peek_archive on one zip (13_..._soma_0.4power_10AMP.zip) shows one lowSNR and one highSNR TIFF (3.1
  GB each); the other 7 zips are assumed to match. Organism (Mus musculus) and indicator (GCaMP6) come only from
  the paper''s supplementary-video captions; what each zip holds is not stated. Pixel size and frame counts not
  found on the Zenodo page, file names or paper page. Sibling deposits #1 (8079069) and #2 (8080615) are separate
  records of the same release (file names show different depths, powers and settings). enricher: channels 1 from
  TIFF header (was null).'
