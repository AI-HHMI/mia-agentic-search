notes: 'The Zenodo record has 11 zip files (280.7 GB in total): nine images_<id>.zip movies (per-frame
  image#####.tif; K53 alone is 121.7 GB, J115 78.7 GB), WEBSITE.zip (25.2 GB) and WEBSITE_basic.zip (84
  MB; per-dataset info.json, regions JSON, projections and scripts). Movies: N.00.00, N.01.01, N.02.00,
  N.03.00.t, N.04.00.t, YST, J115, J123, K53 (frame counts 1,825 to 116,043; 7-30 Hz; 200x256 to 512x512
  px, from the info.json files). Pixel size is not stated in the files read; the paper text read says
  nothing on pixel size either. The tiff frames in the largest movies were inferred from the listings
  of images_N.01.01, images_K53 and images_YST. Each movie was labeled by 3 or 4 labelers using the ImageJ
  Cell Magic Wand on active neurons, then combined into a consensus (paper). n_items counts the nine movies.
  Checked: Zenodo record, zip listings, info.json files, paper full text (Europe PMC).'
