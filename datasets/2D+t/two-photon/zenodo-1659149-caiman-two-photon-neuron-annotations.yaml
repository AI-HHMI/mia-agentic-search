description: Nine in vivo mouse two-photon calcium imaging movies (from five labs; GCaMP3/5/6s/6f; V1,
  vS1, hippocampus, PPC) as per-frame TIFFs, with manual annotations of active neurons by 3-4 independent
  labelers per movie (L1-L4) and a consensus annotation, stored as JSON pixel-coordinate region lists,
  used as ground truth to benchmark CaImAn.
