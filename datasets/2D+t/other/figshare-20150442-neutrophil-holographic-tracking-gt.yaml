notes: 'Supplement S1 Dataset of the paper, one ZIP (10.2 MB, 50 BMP files, 49 MB uncompressed, about 1 MB each) listed with
  peek_archive. The record says a subset of 50 frames, 581x562 px (650x630 um), was manually annotated in the phase-shift
  minimum projections; the BMPs were not opened, so it is not verified whether the annotation is drawn into the images or
  how positions and track identities are stored. Pixel size 1.12 um is computed from 650 um / 581 px, not stated as such.
  Images come from a lensless holographic setup (525 nm LED, 10 um pinhole) reconstructed to minimum projections, hence
  modality other. The full time-lapses of the paper are not part of this record. Checked: Figshare record, zip listing,
  paper full text (Methods and S1 Dataset caption).'
