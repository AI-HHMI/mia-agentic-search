notes: 'Supplement S1 Dataset of the paper: one ZIP (10.2 MB, 50 BMP frames 000101-000150.bmp, 49 MB uncompressed).
  Record/paper: 50 frames, 581x562 px (650x630 um), manually annotated in the phase-shift minimum projections.
  enricher: frames decoded: 562x581 RGB uint8, grey image with pure red (255,0,0) markers drawn in, so
  the annotation is burned into the image and positions must be extracted from the red pixels; all markers
  share one colour, so track identities are not stored. Pixel size 1.12 um: paper states the sensor pixel
  size 1.12 x 1.12 um (lensless holography), consistent with 650 um / 581 px. Lensless holographic setup
  (525 nm LED, 10 um pinhole), hence modality other. Full time-lapses not included. Checked: Figshare
  record, zip listing, frames, paper full text. enricher: annotation types now points only (was tracking
  + points): no identities in the files.'
