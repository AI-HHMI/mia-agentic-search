  notes: 'Listing: Zenodo API (12 files, exact sizes, 63,125,896,143 B) plus zip central directories of control.zip (14 AVI,
    2,240.2 MB uncompressed) and ATP_treatment.zip (47 AVI, 7,520.5 MB). AVI header of control.zip::m1_22_4.avi (first 64
    KB of the deflated member, read by range and inflated): RIFF AVI, 1 video stream, 800x800, 250 frames, FourCC Y800 (uncompressed
    8-bit grey), bitcount 8; the header frame period is 33,333 us (30 fps playback) while the description says recorded at
    250 fps for 1 s. AVI is not a schema format, so raw format is other; frame values not sampled. masks.zip (6,775,920 B)
    downloaded once and read with PIL: 872 masks, mode L, 800x800 uint8, 0-255 with JPEG edge artifacts, ciliary area 3-7%
    of pixels in 3 masks checked; Video_info.csv 872 rows (ca 233, temperature 132, AmphotericinB 124, ACE2 84, AZL 69, Terbutaline
    60, NAC 60, TFP 49, ATP 47, control 14). Direct links: every zip is range-readable on zenodo.org (download-check usable);
    12 files and no single archive, so download_url is the record page. Voxel size: 79.87 nm lateral from the Zenodo description
    ("Each pixel is 0.07987 um"); 2D+t, no z.'
