notes: 'File listing (Zenodo API): 11 treatment/control zips of AVI videos (about 63.1 GB in all; control.zip lists 160 MB
  AVI files), masks.zip (6.8 MB, JPG masks named like the videos) and Video_info.csv (columns vid, CBF, SEM, Group). The Zenodo
  description says 872 videos with ground-truth masks. Pixel size 0.07987 um, 800x800 px, 250 fps for 1 s, per the description.
  Imaging modality beyond "high-speed video microscope" and the mouse strain are not stated on the page or the NSF record,
  so modality is other. Who made the masks and how is not described; the first author''s 2023 UGA dissertation (not readable,
  HTTP 403) apparently covers the dataset, and no paper is listed on the page, so publications is empty. No train/test split.
  The page DOI is the version DOI; the concept DOI is 10.5281/zenodo.8104788. enricher: masks.zip read in full: 872 JPG masks,
  one per video name in Video_info.csv (872 rows).'
