notes: 'Zenodo page and API record read in full (CC BY 4.0 from the API record). Zip indexes read with
  peek_archive: videos.zip has 11 AVI files (8.0 GB); labeled_data.zip has 178 section folders of 11 PNG
  frames (frames/<name>/00..10.png), labels.json and plot_data.py; syntehthic_dataset.zip (spelled so
  on Zenodo) has 900 clip folders with PNG frames and labels.npy. plot_data.py shows labels.json holds
  splines (x, y lists) for the middle frame. Only the arXiv abstract was readable (Europe PMC does not
  index the paper), which says training is on synthetic data; so microscope, magnification, pixel size,
  illumination mode and who drew the labels are not stated on the Zenodo page or the abstract (modality
  other, annotation source unknown, voxel size null). Files other than PNG are AVI videos and NPY labels,
  formats lists png only because the schema has no AVI/NPY entry. Labelled real data are an evaluation
  set of 178 sections (coverage sparse); the 900 synthetic clips are the training set.'
