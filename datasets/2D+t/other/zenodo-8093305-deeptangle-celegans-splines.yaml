notes: 'Zenodo page and API read (CC BY 4.0). videos.zip: 11 raw AVIs (8.0 GB). labeled_data.zip: 178
  sections of 11 PNG frames (256x256 uint8) with labels.json splines for the middle frame 05.png. syntehthic_dataset.zip
  (spelled so): 900 synthetic clips of 11 PNG frames with labels.npy for all frames. formats lists png
  only (AVI/NPY not in the enum). Paper (Communications Biology 2023, s42003-023-05098-1, read on nature.com):
  wide-field videos of swimming C. elegans under approximately uniform illumination; ~200 random regions
  hand-labeled giving ~1,500 centerlines, used for evaluation only; training uses the synthetic clips.
  enricher: annotations.source mixed = real sections manual (paper), synthetic labels generated (was unknown).
  Pixel size not stated (the paper only gives worm width as about 2 px, about 50 um).'
