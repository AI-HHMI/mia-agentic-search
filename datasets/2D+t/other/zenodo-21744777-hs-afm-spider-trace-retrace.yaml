notes: 'Scanning probe microscopy, so modality is other. raw_data.zip (653 MB, 2.98 GB unpacked; peek_archive)
  has 192 TIFFs and 5 CSVs in folders named after paper figures (Fig1 to Fig5); file names show paired
  trace and retrace channels. No labels are shipped: the method is self-supervised (trace as input, retrace
  as target); the averaged reference used for evaluation is not listed. Pixel size is not given: A5 scans
  are 50 x 50 nm but stored pixel counts were not read (Fig 5 uses 100, 200 or 300 pixels in the fast
  axis); 2D+t is inferred from the stack sizes and the paper. The Zenodo record has no description; concept
  DOI 21744776 redirects to version 21744777. Zenodo names only Sichen Pan; the paper lists Pan S and
  Scheuring S.'
