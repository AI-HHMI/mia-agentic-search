title: 'WormSwin: C. elegans Video Datasets'
short_name: C. elegans worm instance masks (video)
description: 'Grayscale video frames of C. elegans with per-worm binary masks and COCO annotations. The CSB-1 set has 56 videos (about 1.5 min at 5 Hz, more than 60,500 worm masks) of wild type, csb-1 mutant and rescue worms, with train/test COCO files. The Mating Dataset has 450 image patches with about 3,900 labelled worm postures, and a synthetic set of generated composites accompanies them.'
