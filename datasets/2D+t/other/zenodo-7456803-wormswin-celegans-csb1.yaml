notes: 'Three zips: csb-1_dataset.zip (65,202 PNG frames in 56 video folders plus coco_annotations/train,
  test and all JSON), md_dataset.zip (5,073 PNGs plus 2 JSON; the paper says 450 patches of the mating
  video) and synthetic_images_dataset.zip (about 7.5 GB, not listed). Total size is the sum of the three
  zips. n_items counts only CSB-1 frames. These are whole-plate videos of worms, not cell-level microscopy;
  the Zenodo page, the paper and the file listing do not name the imaging instrument, so modality is other
  and pixel size is null. Only the csb-1 and md zips were listed with peek_archive, the synthetic zip
  was not. Confidence is kept lower because it is borderline microscopy. enricher: n_items 65202 -> 4631:
  the full listing shows 4,631 frame PNGs in csb-1_dataset/images and 60,571 per-worm mask PNGs in masks
  (65,202 was images + masks).'
