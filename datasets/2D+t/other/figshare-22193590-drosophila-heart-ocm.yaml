notes: 'Modality is optical coherence microscopy (OCM, OCT with confocal detection), which has no schema value, so modality is other. The zip lists 213 sample folders, each with full and resized image/mask TIFFs (1065 files, 113.7 GB uncompressed, 41.4 GB zipped). Masks were produced by correcting predictions of a neural network (mixed). The paper describes 112 samples used for training/validation/testing (80/10/10) and 101 additional validation samples, but the zip carries no split files. Pixel size is not stated in the paper text read (calibration is system specific) or the figshare record. The figshare HTML landing page returned 403 or a bot challenge, so the figshare API record (which gives that landing URL) and the file were used. The article text states CC BY 4.0 for the paper; the figshare record states CC0 for the dataset.'
