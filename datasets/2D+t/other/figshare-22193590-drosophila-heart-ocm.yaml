  notes: 'Zip central directory read in place (1065 members, sizes exact): size_bytes is the one zip. Sampled 000_AD
    resize img + mask (30.4 MB of deflated data) and 000_AD full mask (0.6 MB); full_img not sampled (only its member
    size, which matches 2000x600x128 uint8). Plain multi-page TIFFs (tifffile: QYX); page axis is time per the paper
    (videos, one frame per page: 4000-frame TIFFs, 2000 for adults), hence tyx; 91 of 213 full videos are 4000 frames
    (307.9 MB). value_range from the one sampled video: 0-255, 256 values, p50 64, saturated at both ends; the paper
    says saved pixel values were cast to 0-255 for viewing, so contrast-stretched. Mask values {0, 255} as the paper
    states. The full_img pattern also has value_range null (not sampled). Voxel size not found; checked: TIFF tags
    (no calibration), figshare API, paper full text (only resolution ~2.3 um lateral / ~3.3 um axial and ~0.3 mm
    transverse scan range, which would need computing; paper says calibration is system specific), resize_parameter.txt.
    Frame rate not stated per file.'
