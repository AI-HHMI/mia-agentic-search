notes: 'Videos are AVI (no AVI option in the schema, hence formats other); each has a JSON sidecar. Optical microscope: 200x and 400x, 1320x1080 crop at 59.94 fps; CASA: 1280x1024 at 30 fps. Pixel size, contrast mode (brightfield/phase) and total size are not stated in the preprint or on the Hugging Face API record (file listing truncated; visible AVIs about 1.18 GB each). Full text is not open access on Europe PMC; details come from the bioRxiv page. Ground-truth .txt files seen in the Hugging Face listing; the paper does not describe object IDs. Tracking labels are therefore not claimed. License CC-BY-4.0 from the Hugging Face card, not stated in the paper.'
