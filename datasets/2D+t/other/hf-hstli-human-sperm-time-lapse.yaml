notes: 'Videos are AVI (no AVI option in the schema, hence formats other); each has a JSON sidecar. Optical microscope:
  200x and 400x at 59.94 fps; CASA: 1280x1024 at 30 fps. Pixel size and contrast mode (brightfield/phase) are not
  stated in the preprint, the dataset card or the JSON sidecars. Full text is not open access on Europe PMC. License
  CC-BY-4.0 from the Hugging Face card. enricher: size 547.6 GB from the complete Hugging Face file listing (was
  null). enricher: annotation type tracking added; the dataset card documents a 6th track_id column (trajectories
  for 20 opt and 11 of 14 CASA runs; 3 CASA runs "in progress"). enricher: the listing holds 3161 AVIs (3021 opt,
  140 CASA), not the 3266 the card states; n_items kept at the stated 3266.'
