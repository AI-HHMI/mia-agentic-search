id: hf-hstli-human-sperm-time-lapse
title: 'HSTLI: A Dataset of Human Semen Time-Lapse Images'
short_name: HSTLI human sperm time-lapse videos
description: 3,266 time-lapse videos (about 27 h) of human sperm from 51 healthy male participants, recorded with a CASA system (Sperm Class Analyzer) and an optical microscope (Swift M10DB-MP with Fujifilm X-T30). A subset (14 CASA and 20 optical clips of 900 frames each; 29,950 frames, about 1.4 million sperm) has manual bounding boxes around every visible sperm head. Intended for detection, tracking and motility analysis.
