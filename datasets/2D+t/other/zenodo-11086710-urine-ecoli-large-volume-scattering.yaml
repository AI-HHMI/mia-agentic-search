notes: 'Zenodo API record lists 55 zips (about 21.7 GB). peek_archive of urine_3.zip shows 1,199 x ~1 MB .tif frames
  (800 x 600 px at 16 bit fits 30 s at 40 fps). Modality is large-volume light-scattering (dark-field-like side-scatter)
  microscopy, so it is recorded as other. Labels are only implied by file names, and the paper (Biosensors 2024, PMC10887190)
  derives per-particle labels from the sample of origin; the paper states its image data are available on request,
  so how the Zenodo files map to the paper''s Datasets 0-3 is not documented; the Zenodo title cites 2018 while the
  matching paper is 2024. No pixel size stated on the Zenodo page or in the paper (only the 1.85 x 1.4 x 0.7 mm field
  volume). No train/test split is given in the deposit. Frames are post-processed (static background removed).'
