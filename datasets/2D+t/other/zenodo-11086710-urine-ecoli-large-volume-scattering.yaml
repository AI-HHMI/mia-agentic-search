short_name: E. coli vs urine particles (scattering video)
description: 55 background-subtracted 30 s large-volume light-scattering microscopy videos (1,199 TIFF frames each)
  of four sample types - 1 um polystyrene beads, E. coli, filtered human urine, and urine mixed with E. coli. Each
  video is a separate zip named after its sample type, so the sample type serves as the class label for the particles
  in it. Used to train deep-learning classifiers that tell E. coli from beads and from urine particles.
