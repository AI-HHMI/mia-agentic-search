notes: 'Zip listed with peek_archive: 44 Movie.tif files (about 83 GB uncompressed) each next to trajectory.xyz and curvature.npy, plus 32 .mat files; n_items counts the movies. Pixel size is not stated on the Zenodo page, README or paper Methods (20x objective with 1.6x lenses, 500 fps, Olympus IX71 dark-field, Dimax HD camera), so voxel size is null. The paper reports 35 cells in the analysis but the zip holds more movies. Labels come from custom MATLAB tracking (threshold, binarization, skeleton) and were not manually curated, hence source automatic; this is a physics dataset whose training value is for flagellum tracking, so confidence is moderate. Modality is dark-field, which the schema lacks, hence other.'
