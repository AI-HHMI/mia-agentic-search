notes: 'Checked the Zenodo record and API, the zip index (88,310 files: 29,370 JPG frames, 58,412 TXT label files, 522 MP4 videos,
  6 CSV) and the Scientific Data paper (Methods, Data Records). Of the 522 MP4s, 20 are the annotated clips; the paper describes
  166 further clips from those 20 videos and 336 clips from unlabeled VISEM videos for self-supervised use. Boxes
  were drawn in Labelbox by data scientists and verified by three biologists. The paper trains YOLOv5 on 16 videos and
  validates on 4 (IDs given on GitHub), but the zip itself has no split file, so splits_provided is false. Contrast
  mode is not stated in the paper (it notes WHO recommends phase-contrast optics), so modality is other. Pixel size
  not given (video frames are 640 x 480 per the paper table for the original VISEM videos). n_items counts annotated
  videos.'
