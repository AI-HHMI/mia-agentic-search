description: 20 annotated 30-second videos of fresh human semen (about 29,000 frames, 640 x 480, 45-50 FPS) with YOLO-format
  bounding boxes per spermatozoon, tracking IDs and three classes (normal sperm, cluster, small or pinhead), plus about 500
  further unlabeled 30-second clips and participant clinical CSVs.
