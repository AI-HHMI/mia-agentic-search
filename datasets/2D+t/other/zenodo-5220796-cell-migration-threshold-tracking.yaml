notes: 'Small tutorial dataset: one 86-frame stack, near the lower bound of the usable criteria, and the
  modality is not stated anywhere read, hence other. Zenodo page: migrating cells tracked with the TrackMate
  threshold detector. The imagej.net thresholding detector tutorial gives only the settings (automatic
  threshold 92, area filter below 20, LAP tracker with 20 um linking and gap closing, max gap 4 frames,
  splitting allowed) and does not describe the sample. TIFF header read by range request: ImageJ TIFF,
  86 x 363 x 363 (t,y,x), uint8, uncompressed, 633.7445 nm pixels. Cell type, species, microscope and
  frame interval are not stated. Zenodo listing: XML 7,547,078 B, TIF 11,346,316 B, screenshot PNG 647,002
  B (size_bytes is their sum). enricher: XML read: 3,814 spots with ROI polygons in 28 tracks (58 splits),
  THRESHOLD_DETECTOR (threshold 90 in the file vs 92 on the tutorial page).'
