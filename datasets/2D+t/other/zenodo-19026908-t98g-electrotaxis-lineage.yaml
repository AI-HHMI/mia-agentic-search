notes: 'Zenodo record has 6 zips (758 MB total). Only the T98G_electrotaxis.zip was listed with peek_archive
  (298 members: 222 TIFF, 74 PNG, 2 txt; GT/SEG man_seg000-036 and GT/TRA with man_track.txt). Record
  text calls the T98G masks and lineage human-curated; the DIC-C2DH_HeLa masks are Detectron2 output.
  The DIC HeLa and Fluo-N2DH-SIM+ sets overlap Cell Tracking Challenge data already in the catalog. Not
