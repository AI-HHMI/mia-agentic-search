short_name: T98G electrotaxis cell tracking (time-lapse)
description: Example data for the Tui cell tracker. Includes a T98G glioblastoma electrotaxis time-lapse
  sequence (37 frames of ~2.1 MB TIFFs) with human-curated segmentation masks (SEG), tracking-marker
  images and a Cell Tracking Challenge style man_track.txt lineage table, plus two synthetic benchmarks
  with lineage ground truth, a DIC-C2DH HeLa set (masks generated with Detectron2) and a Fluo-N2DH-SIM+
  set, and example tracker outputs.
