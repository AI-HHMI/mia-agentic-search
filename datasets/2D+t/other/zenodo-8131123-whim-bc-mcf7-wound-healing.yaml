notes: 'Zip listing (peek_archive, 532 entries) and readme.txt: Monolayer and Sphere, 12 wells each (Monolayer_1..12,
  Sphere_1..12), each with original/, gray/ (segmentation) and rgb/ (segmentation overlay) PNGs, 84 per
  type and folder (the description gives 12x7 monolayer and 12x6 sphere images, i.e. 156 in total, but
  84 files per folder were counted for both types, 168 in all; the readme lists N=72 for spheres). Paper
  (Computers in Biology and Medicine) is not open access; only the abstract was read, which does not state
  the microscope, objective, pixel size or how the segmentations were made (source unknown, possibly automatic).
  Modality is therefore other. enricher: gray masks are 231x310 (originals 1532x2048), so the labels are
  on a ~6.6x smaller grid, not the raw grid; channels 3 (RGB originals).'
