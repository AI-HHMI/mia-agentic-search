id: zenodo-2601562-prostate-qpi-cell-death
title: Quantitative phase microscopy timelapse dataset of PNT1A, DU-145 and LNCaP cells with annotated
  caspase 3,7-dependent and independent cell death
short_name: Prostate cell death time-lapse (QPI)
description: Quantitative-phase-imaging time-lapses (3 min/frame, 24 or 48 h) of three prostate cell lines
  (PNT1A, DU-145, LNCaP) treated with staurosporine, doxorubicin or black phosphorus, 7 fields of view
  per line and treatment. Each stack has a cell tracking mask TIFF and an xlsx with the manually annotated
  time point and morphotype (apoptotic or lytic) of death per cell.
