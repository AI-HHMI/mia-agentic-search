notes: 'Quantitative phase imaging (Q-PHASE holographic microscope, 10x/0.30) has no schema modality value,
  so modality is other. Only the LNCaP archive was listed (21 QPI stacks, 21 masks, 21 label xlsx); n_items
  63 extrapolates to three lines (7 fields x 3 treatments each, per the paper). Size is the sum of the
  three archives. Pixel size not stated on the page or paper text read; headers not read. Masks come from
  automatic tracking (Gaussian mixture plus watershed, complete tracklets only); death time and type (apoptotic/lytic)
  were manually annotated, hence source mixed. Unlabelled correlative fluorescence images are in zenodo
  4531900. Authors abbreviated to the first three. enricher: all three archives listed (63 stacks, 63
  masks, 63 label tables), so n_items 63 is now confirmed.'
