title: Human embryo time-lapse video dataset
short_name: Human embryo development phases (time-lapse)
description: 704 EmbryoScope time-lapse videos of developing human embryos, each recorded at 7 focal planes
  (about 2.4 million images), with an embryologist's timing annotations of 16 cellular events from polar
  body appearance to blastocyst hatching, plus CSV files giving the start and end frame of each of the
  development phases. 500 x 500 px grayscale JPEG frames; the central focal plane (F0) is the main archive.
