notes: 'Zenodo API record (8 tar.gz files, total 62.8 GB, includes embryo_dataset.tar.gz = central plane F0,
  embryo_dataset_annotations.tar.gz = 704 CSVs, and six tar.gz for other focal planes F-45 ... F45 inferred from
  file names) and the Data in Brief paper full text read. n_items counts videos; the paper gives about 2.4 million
  frames. Annotation: one embryologist per video with internal quality control; frame labels are derived from event
  timings. tar.gz archives cannot be listed remotely, so folder layout is from the paper. Pixel size and
  magnification are not stated, so voxel_size_nm is null. Hoffman modulation contrast is not in the modality list,
  so modality is other. No train/test split is provided. Zenodo licence is CC-BY-NC-SA-4.0 (non-commercial); download_url
  left null because the data is eight separate archives.'
