notes: 'File list (file_list_S_BIAD616.tsv): 3,386 .mat PhaseImageStack files (1,750 BT-474, 1,736 MCF-7 rows incl. xcf) across
  two experiments (2021-07-24 MCF-7, 2021-08-02 BT-474) and 100 .xcf files in Training_XCFs. The study text says the .xcf
  files were used to manually create the segmentation masks that trained the segmentation network; the layer layout inside
  the xcf files and whether the matching phase images are among the .mat files were not inspected. Authors and a linked paper
  are not listed on the entry (a likely related protocol paper, Nat Protoc 2026, could not be confirmed as the associated
  one), so publications is empty. Modality is quantitative phase imaging, not a listed value, so other. Pixel size not stated.'
