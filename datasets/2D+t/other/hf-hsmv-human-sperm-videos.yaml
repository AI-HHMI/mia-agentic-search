title: 'HSMV: A Dataset of Human Sperm Microscopy Videos (formerly HSTLI)'
short_name: Human sperm videos, head boxes (CASA/optical)
description: 3,266 microscopy videos of human sperm (about 27 h) from a CASA system and an optical microscope at 200x and
  400x, from 51 healthy donors. 34 videos (900 frames each) carry manual bounding boxes around every sperm head (about 1.49
  million boxes) for detection, tracking and motility analysis; the other videos are unannotated and can serve semi-/self-supervised
  learning.
