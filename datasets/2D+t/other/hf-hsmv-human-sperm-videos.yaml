notes: 'Videos are AVI (not in the schema format list, hence other) with a JSON sidecar each (listing: 3,021 optical + 140
  CASA = 3,161 AVIs; README says 3,266). 34 annotated clips (14 CASA + 20 optical per README/abstract; listing has 14 CASA
  + 20 optical _gt folders). Optical: Swift M10DB-MP + Fujifilm camera, contrast mode not stated (modality other). Pixel size
  not reported. Main card license cc-by-4.0; the sys-casa/sys-opt and per-subject README.md files carry "license: mit" front
  matter. Bioarxiv preprint under the old name HSTLI; Scientific Data paper under review. enricher: size 547.6 GB from complete
  HF listing incl. 920 MB YOLO weights (was null); n_items 3,161 AVIs from listing (was 3,266 stated); GT lines carry a 6th
  column, a track ID that persists across frames, so tracking labels confirmed; channels left null (optical RGB, CASA grey).'
