notes: 'Videos are AVI (not in the schema format list, hence other) with a JSON metadata file each (3,021 optical + 140
  CASA videos in the file listing); ground truth is per-frame .txt files. Only 34 videos are annotated; the
  README and paper say 14 CASA + 20 optical, while the file listing shows 140 CASA videos and 3,021 optical
  (3,161, versus 3,266 stated), so counts are unreconciled. Tracking suitability: the paper describes
  the labels as ground truth for tracking, but no object IDs are mentioned. Pixel size not reported in the
  README or the paper; optical contrast mode not stated (modality other). Repo was renamed from HSTLI to
  HSMV in 2026; the paper is the bioRxiv preprint under the old name, the Scientific Data paper is under review.
  Total size not stated (Hugging Face reports ~546 GB used storage for the repo including weights). Paper PDF full
  text was read via the bioRxiv page summary only; licence taken from the Hugging Face card (cc-by-4.0).'
