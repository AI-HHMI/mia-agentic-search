  notes: 'Listing: Hugging Face API, 36,295 files, 547,574,344,377 B, complete (includes 920 MB YOLO weights). AVI
    is not a format the tools read, so a short script parsed RIFF headers from 64 KB ranges of three videos (CASA
    HC004 run-005; optical HC001 run-016 and HC013 run-045) and decoded the first CASA frame from a 1.5 MB range:
    uint8 [17, 201], mean 42.6, p1/p50/p99 26/42/62, from one frame. Optical frames (MJPEG) were not decoded, so
    their value range is unknown and whether the 3 samples are true colour is not checked. Label txt: frame-0 of
    CASA HC004 run-005 (space-separated, 6 columns) and HC013 run-045 (21 rows); dtype float32 means decimal text.
    Voxel size not found; checked: card README, video JSON sidecar (magnification 200, 30 fps, no pixel size), AVI
    headers, the preprint (harvester: not reported). Download: every video and txt is a direct resolve/main URL
    (download_check usable, ranges yes); there is no archive, so data.download_url stays the repo page. TensorSwitch
    has no AVI reader.'
