notes: 'Dataset card, HF file listing (36,295 files, 547.6 GB: .avi videos with JSON sidecars, *_gt folders
  of per-frame txt files, YOLO weights) and the bioRxiv preprint (formerly HSTLI) read; the Scientific
  Data paper is under review. Videos are AVI (no schema value, so other). Imaging contrast method, objective
  and pixel size are not reported by the card or preprint; modality other. Only 34 of 3,266 videos are
  annotated (20 optical, 14 CASA, 900 frames each except one with 200); 3,232 are unannotated and usable
  for self-supervised learning. Track ids exist for all 20 optical and 11 of 14 CASA runs. Date published
  not stated on the card. Preprint full text via Europe PMC not available; bioRxiv page read. No train/val/test
  split provided.'
