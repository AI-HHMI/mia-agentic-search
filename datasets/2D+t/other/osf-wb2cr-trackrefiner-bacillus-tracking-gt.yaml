description: Time-lapse and snapshot image series of non-motile rod-shaped bacteria (E. coli and P. putida; agar pads and
  microfluidic devices) contributed by four research groups, with manually curated cell-tracking ground truth (159,349 labelled
  track and division links over 442 frames; eight time-lapses plus three snapshot pairs). OSF project of the TrackRefiner
  tool.
