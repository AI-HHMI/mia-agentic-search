notes: 'The OSF storage (API listing) holds one file, 01.Raw_data.zip (1,139,030,407 B; 482 TIFF, 1405 MB uncompressed,
  folders raw_images_Sander, _tiny_Aaron, _Clara_6A/6B/6C, _K12, _Simon_p21/p23, i.e. the eight time-lapses plus snapshots
  of Table 1). The ground truth files themselves were not seen: the paper (Data availability) says the curated benchmark
  is posted on GitHub and OSF, but neither the OSF listing nor the GitHub front page lists it, so annotation format
  and location are unverified (hence annotations_verified false). License: OSF project license BSD 3-Clause from the
  OSF API; the paper is CC BY-NC-ND. Imaging modality (phase contrast vs other), pixel size and objective are not stated
  in the paper or file listing, so modality is other. Paper Data availability gives the OSF link with a view-only key;
  the project is flagged public in the OSF API. Image zip names such as Z00..Z35 index the time series files per the
  folder frame counts and were not opened.'
