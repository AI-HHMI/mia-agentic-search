notes: 'OSF storage holds one file, 01.Raw_data.zip (1,139,030,407 B; 482 TIFF in 8 folders: raw_images_Sander, _tiny_Aaron,
  _Clara_6A/6B/6C, _K12, _Simon_p21/p23). enricher: ground truth found on the GitHub repo analysis branch, 09.GroundTruth/ground_truth_<constrained|unconstrained>_<1-4>/<name>.GT.csv
  (CellProfiler object tables with parent links), next to the same raw frames renamed as 01.Raw_data/raw_images_<constrained|unconstrained>_<n>/
  (was: GT not seen). License: OSF project license BSD 3-Clause (OSF API); the paper is CC BY-NC-ND. Modality and pixel size
  are not stated in the paper or listing, so modality is other. size_bytes counts the OSF zip only. organisms (paper Table
  1): Pseudomonas putida = Unconstrained1-3; Escherichia coli = Unconstrained4, Constrained1-4 and ConstrainedSnapshot1-3
  (GitHub folder names; OSF folder names are not mapped).'
