    truth and the same raw series; I read its git tree, one raw frame header (Constrained_4_T00.tif: 1026x696 uint16, ImageJ,
    values 0-65535) and the Constrained_1.GT.csv header. Caution: reading the git tree with sizes made git fetch ~1.39 GB
    of blobs (over the sample budget); deleted right after. Voxel size not set: Constrained_4_T00.tif has XResolution 153846.153
    px/cm (= 65 nm/px), but no doc states it and other series likely differ; checked: headers, OSF API, paper full text, GitHub
