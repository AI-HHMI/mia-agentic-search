notes: 'One 1.4 GB Data Set.rar on Figshare (API: CC BY 4.0; GitHub README says non-commercial research
  use welcome). enricher: RAR5 headers walked by range requests: 159,192 files, 1.72 GB unpacked: 101
  mp4 videos, 3,622 RGB frames (698x528 PNG), 3,622 Pascal VOC XML box files (Subset-A), 25,966 PNGs for
  10 videos (Subset-B), 125,880 crop PNGs (Subset-C) and readme.txt. formats other -> png (was other);
  annotations_verified true (XML boxes read from the GitHub example copy). Paper (Chen et al., doi 10.1016/j.bbe.2021.12.010)
  is paywalled; pixel size, microscope and protocol are unconfirmed, so modality stays other. Subset-B
  PNG content (masks vs crops) is not confirmed: the members are RAR-compressed and could not be decoded.'
