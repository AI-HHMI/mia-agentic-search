description: Sperm Videos and Images Analysis (SVIA) dataset in three subsets - A) 101 videos with over
  125,000 bounding-box annotated sperm and impurity objects for detection, B) 10 videos with over 26,000
  segmented sperm as ground truth for tracking, C) over 125,000 cropped sperm/impurity images for classification.
