  notes: 'Dataset is one RAR5 archive; tools/listing.py cannot read RAR, so the listing came from walking
    RAR5 headers with range requests (quick-open record at the archive end, plus 111.7 MB of ranges for
    headers it does not cache). Raw frames, Subset-A XML and Subset-B PNGs are RAR-compressed (method
    3) and cannot be read without unrar; 111,050 Subset-C crops are stored and were read directly. Frame
    and XML samples come from the GitHub example copy (frames/videos byte-identical in size to the RAR
    members). value_range values are from one sample file each. size_bytes is the RAR size from the Figshare
    API (unpacked 1,724,981,480 B). voxel size not found; checked: PNG header (no calibration), Figshare
    API, GitHub README and example XML, Crossref/Europe PMC (paper not open access), arXiv (no preprint).
    No direct per-file links exist on Figshare (one RAR); TensorSwitch cannot open RAR members. Readme.txt
    inside the RAR could not be read (compressed). The 101 mp4 source videos are listed in the tree but
    not described as an array.'
