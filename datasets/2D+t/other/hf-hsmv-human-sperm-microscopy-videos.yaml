notes: 'Formats: videos are .avi (not in the schema list, hence other); annotations are text files. Modality: imaging described as CASA
  system and optical microscope at 200x/400x; contrast mode not stated on the card or preprint abstract, so modality is other.
  Pixel size and resolution not stated on the card or the abstract (preprint full text not open access; not checked). Counts differ:
  card says 3,266 videos (34 annotated, ~1.61M boxes), preprint abstract says 3,161 clips (~1.49M annotations). Card DOI is inconsistent
  (10.57967/hf/11093 header, 11092 in BibTeX), so doi is null. Total size about 548 GB per the card; not set. Sources checked: dataset card,
  HF API record, preprint abstract via Europe PMC. Annotation files not seen in a file listing.'
