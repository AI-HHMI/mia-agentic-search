schema_version: '1.2'
id: hf-hsmv-human-sperm-microscopy-videos
title: 'HSMV: Human Sperm Microscopy Videos with sperm-head bounding boxes and trajectory IDs for detection and tracking'
short_name: Human sperm detection and tracking videos
description: Microscopy videos of human sperm recorded with a CASA system (Sperm Class Analyzer) and an optical microscope
  (Swift M10DB-MP with Fujifilm X-T10) at 200x and 400x, 30-60 fps. The Hugging Face card lists 3,266 videos, 34 of them
  manually annotated with sperm-head bounding boxes linked across frames into trajectories (900 frames each; about 1.5 million
  boxes). The remaining videos are unannotated and can be used for semi- or self-supervised learning. Annotations are per-frame
  YOLO-style text files with a track ID.
