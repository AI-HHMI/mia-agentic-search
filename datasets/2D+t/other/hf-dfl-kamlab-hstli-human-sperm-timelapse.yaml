notes: 'Read the Hugging Face API file listing (36,295 files: 3,161 AVIs 546.6 GB, 29,900 ground-truth frame .txt files for 34 runs, JSON per video, two motility CSVs, YOLO weights), the dataset card and one video JSON. Preprint full text was not reachable (not on Europe PMC, bioRxiv returned 429), so paper details come from the abstract and card. Per the card 34 runs are annotated (14 CASA, 20 optical), with track IDs for all optical and 8 of 14 CASA runs so far; this may change (last modified 2026-09-09). Contrast mode, pixel size and frame size are not stated, so modality is other. AVI is not in the format list, hence other. The listing has 3,161 AVIs but the card says 3,266 videos; n_items follows the card. Date is repository creation. Consent under IRB protocols per the card.'
