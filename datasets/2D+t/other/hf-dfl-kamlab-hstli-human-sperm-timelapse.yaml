schema_version: '1.2'
id: hf-dfl-kamlab-hstli-human-sperm-timelapse
title: 'HSTLI: human semen time-lapse videos from a CASA system and an optical microscope with sperm bounding boxes and tracks'
short_name: Human sperm time-lapse videos with tracks (light)
description: 3,266 30-second time-lapse videos (about 27 hours, 30-60 fps) of human semen from 51 healthy donors, recorded
  on a CASA system and a Swift M10DB-MP optical microscope with a Fujifilm X-T30. 34 runs (14 CASA, 20 optical, 900 frames
  each) carry per-frame YOLO-format bounding boxes of every sperm head, about 1.49 million in total, with track IDs for most
  of them; the other 3,232 videos are unlabeled.
