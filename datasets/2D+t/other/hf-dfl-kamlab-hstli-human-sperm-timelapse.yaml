  notes: 'Complete HF listing (36,295 files, 547,573,746,161 B). AVIs are not readable by the inspection tools, so a 16 KB
    RIFF header range read (requests script) was done on one video per system: CASA run-001 of HC001 = 1280x1024, 901 frames,
    33,333 us/frame, 8 bit/pixel, uncompressed DIB; optical run-001 of HC001 = 1321x1080, 1,799 frames, 16,683 us/frame, 24
    bit, MJPG. Shapes are from these two headers ([frames, height, width(, RGB)]); other runs may differ. Video JSONs give
    fps (30 / 59.94), device (Microptic SCA / Swift M10DB-MP), magnification 100 (opt). Read one gt frame file (rows like
    ''0 0.979199 0.944312 0.017352 0.020205 0''). No pixel values sampled.'
