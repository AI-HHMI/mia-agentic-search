notes: 'Dataset card plus Hugging Face file tree: training/{images,labels}, val/{images,labels}, test/{images,labels}; the file list shows
  about 9,997 / 6,866 / 4,358 images and 9,998 / 7,179 / 13 label files for training / val / test, so the test split appears to be
  mostly unlabelled (the list may be incomplete, 38,415 entries against 45,158 frames in the card). One frame checked is 2048x2048
  JPEG; pixel size is not stated (only the 0.0241 mm2 field of view). The class ids are not documented: box sizes in the sampled
  label files suggest class 0 is the larger rotifer and class 1 the small algal cells, but this is unconfirmed. No paper or author names
  were found; the Hugging Face user is bcdemattei. Dark-field imaging has no matching modality value, hence other. Download is
  git-lfs through the Hugging Face repository (no single archive).'
