notes: 'Dataset card plus Hugging Face file tree: training/{images,labels}, val/{images,labels}, test/{images,labels}.
  The card says 25 videos with 45,158 frames; the repository holds 21,221 frame JPEGs (9,997 / 6,866 /
  4,358 for training / val / test) and 17,190 label files (9,998 / 7,179 / 13), so the test split is almost
  unlabelled. Frames are 2048x2048 JPEG; pixel size is not stated (only the 0.0241 mm2 field of view).
  Class ids are not documented: in the sampled label files one large box (class 0) and many small ones
  (class 1) suggest class 0 = rotifer, 1 = algal cells (unconfirmed). No paper or author names found (HF
  user bcdemattei). enricher: n_items 45158 -> 21221 (frames actually in the repo, complete HF listing);
  coverage unknown -> partial (test split has 13 label files for 4,358 frames). modality: dark-field light
  microscopy (no schema value, so other). organisms: both species appear together in every frame, not
  in separate folders.'
