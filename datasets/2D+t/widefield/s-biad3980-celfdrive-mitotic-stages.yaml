title: 'CelFDrive: SiR-DNA fluorescence time-lapse of human RPE-1 cells with expert bounding-box annotations of six mitotic
  stages (BioImage Archive S-BIAD3980)'
short_name: RPE-1 mitotic stage boxes (fluorescence)
description: Live-cell SiR-DNA fluorescence time-lapses and montages of human RPE-1 cells from four imaging configurations
  (10x and 20x widefield Finder objectives, 40x spinning disk confocal, 40x widefield). Three experts annotated individual
  mitotic cells with YOLO bounding boxes in six mitotic stages. Original TIFFs, 8-bit PNG frames, YOLO label files and train/validation/test
  assignments by acquisition or position are included.
