notes: 'Study record and the five BioStudies file lists were read in full: 225 TIFF files (81 10x, 77 20x,
  60 40x spinning disk, 7 40x widefield), 33,543 PNG frames and 16,469 YOLO label files, 143 GB. Pixel
  size differs by configuration (20x Finder 225 nm, 40x spinning disk 229 nm, 40x widefield 161.25 nm; the
  10x pixel size was not extracted), so voxel_size_nm is null. Train/validation/test splits are assigned by
  complete acquisition or position. The companion paper (CelFDrive, Brooks et al.) was not found in Europe
  PMC or Crossref, so it is not listed; methods are from the BioStudies record. Files are served under
  https://www.ebi.ac.uk/biostudies/files/S-BIAD3980/<path>; no single archive, so download_url is null. Only
  the DNA channel is annotated. The 40x widefield TIFFs are 7-plane z-stacks and 40x spinning disk TIFFs
  are max projections.'
