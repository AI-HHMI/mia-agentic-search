notes: 'The Zenodo record has no description; facts come from the zip listing (peek_archive: 13 HPC2/*.tif videos 1.0-2.7
  GB each, HPC2_GT/*.tif plus AnnotatorA/B/C ROI files) and the arXiv paper (full PDF read), which introduces HPC2 as 13 mouse-hippocampus
  videos with SomArchon, conventional one-photon wide-field microscopy, 645-826 fps, 10,000-20,000 frames per video. Pixel
  size and the annotation procedure are not stated on the record or in the paper text I read; the paper does not describe
  who annotated HPC2 beyond the ROI files. Annotation coverage is unknown: the record does not say whether all neurons are
  covered and ROI counts per video were not checked. The zip also contains a trained U-Net model in a separate file (voltage_u-net_model.h5,
  15.7 MB). Some GT ROI files are .roi (single ROI) rather than .zip. enricher: three annotator folders (A, B, C) in the zip
  listing and code repo (was two); size now includes the U-Net .h5.'
