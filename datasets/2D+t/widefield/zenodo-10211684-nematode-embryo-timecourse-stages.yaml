notes: 'Zip listing (peek_archive): 4589 files, 22.4 GB uncompressed; 1760 zarr arrays (dirs per acquisition date YYMMDD / fov), 951 detected_embryos.png QC images. Stage labels are NOT in the Zenodo archive;
  they are manual key-frame CSVs in the GitHub repo (stages: unfertilized, proliferation, bean, comma, fold, hatch, death, per the paper; training CSV ~124 embryos, test CSV ~85 rows, counted from line
  numbers). Pixel size not stated on Zenodo, GitHub or paper; microscope Nikon Ti2-E, Plan Apo 20x 0.75 NA, widefield (channel appears to be brightfield from an example filename only, so modality kept as
  widefield). Number of embryos not stated directly (paper mentions 291 wild-type embryos). Dataset DOI license CC-BY-4.0 on Zenodo; the paper states the images are on Zenodo and the publication is CC BY
  4.0.'
