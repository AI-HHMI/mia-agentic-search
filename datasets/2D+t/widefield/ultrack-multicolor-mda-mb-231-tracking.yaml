notes: 'No license or terms are stated on the data page, its README or in the paper''s Data availability section
  (the paper itself is CC-BY 4.0, which is not a data license). Pixel size is not stated on the data page, in the TIFF
  header (ImageJ TIFF without resolution) or in the paper Methods (10x objective only). The tracks CSV has 413 tracks
  matching the "413 manually curated cell tracks" in the paper; it is a sparse gold standard, not every cell is tracked.
  The same server also hosts zebrafish neuromast and embryo OME-Zarr volumes and an A549 virtual-staining set; the
  listed zebrafish_neuromast_tracks.csv returned HTTP 404 on this run, so those were not recorded. The TIFF is stored as RGB
  (uint8, 300 x 1440 x 1920 x 3).'
