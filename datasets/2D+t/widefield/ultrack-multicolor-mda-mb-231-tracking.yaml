title: Ultrack multicolor MDA-MB-231 breast cancer cell time-lapse with curated tracks
short_name: Multicolor breast cancer cell tracking (widefield)
description: 'Two-day, 10-minute-interval widefield time-lapse (300 frames of 1440x1920 RGB) of MDA-MB-231 metastatic
  breast adenocarcinoma cells stably marked with red, green and blue fluorophores (LeGO lentiviral vectors),
  released with the Ultrack cell tracking paper. A CSV of 413 manually curated cell tracks (with parent track
  ids for lineages) serves as a gold-standard tracking benchmark.'
