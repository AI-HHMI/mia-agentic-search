notes: 'Figshare (UCL RDR) record 16595978 lists 5 files: two 2.29 GB aligned TIFFs (BF_GV0800_Pos12,
  GFP_GV0800_Pos12, one position, two channels), GT_LBEP.zip (25 lineage tables) and GT_detections.zip
  (25 object-coordinate files), and README.md. Pixel size is not stated on the dataset page, README or
  in the paper text read (paper gives 20x 0.5 NA objective, 1600x1200 px frames, 4 min interval, roughly
  1,200 frames per movie for the full study of 44 movies); voxel size left null rather than inferred.
  Only the example position is released here, not the full 44-movie study. Annotation is partial: 24 randomly
  chosen founder-cell lineage trees (1,032 cells in the paper), not every cell. Data availability statement
  says only "online repositories". Imaging described as epifluorescence on a custom automated microscope
  in a CO2 incubator; modality widefield assumed from that description. enricher: TIFFs are 1194-frame
  ImageJ stacks, no calibration.'
