notes: 'Figshare listing (API): correctedcells.tif 94.9 MB and correctedcells.xml 21.9 MB; the figshare page itself returned
  403 to WebFetch so the API was used. TIFF header (probe.py): uint16, shape 96 x 3 x 377 x 437, uncompressed ImageJ hyperstack
  stored with axes labelled zcyx (the 96 are the time points per the paper). The XML is a TrackMate 7.13.2 file with per-spot
  polygon ROIs from Cellpose; the paper says tracks come from TrackMate LAP and only a subset of 10 cells was manually curated,
  so the annotation is automatic with partial manual correction and its accuracy is not guaranteed. Which channel is brightfield
  vs FUCCI fluorescence is not stated in the record. Pixel size and objective not stated on figshare, in the paper text read,
  or in the XML header. Only one recording is released, so this is a small dataset.'
