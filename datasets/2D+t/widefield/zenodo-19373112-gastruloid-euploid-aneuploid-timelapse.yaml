notes: 'Zenodo description and the gastruloids.zip listing (peek_archive: 9,252 PNG files) agree. Labels
  are the experimental condition in the file names (array1 = euploid, array2 = aneuploid), not per-image
  expert annotation. Imaging: inverted MVX10 MacroView wide-field fluorescence microscope, 2x objective,
  images acquired at 4x magnification with 1.7 um/pixel (original acquisition; the released 128x128 images
  were background-corrected and normalized and the effective pixel size after cropping or resizing is
  not stated), so voxel size is left null. Species of the gastruloids, the paper (only a software DOI
  10.5281/zenodo.17073719 is linked) and the exact fluorescent stains are not stated; "green" in the file
  names suggests a green fluorescence channel but the stain is not confirmed. The modality is recorded
  as widefield because the description names a wide-field fluorescence microscope for both transmitted-light
  and fluorescence images.'
