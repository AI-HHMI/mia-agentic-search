notes: 'Access is through deepcell.datasets with a DeepCell API key (registration), version 1.0; no public file listing or
  download URL was found, so file formats, total size and file counts are not verified (formats other: the DeepCell loader
  returns arrays). License: the docs say a modified Apache license for non-commercial academic use only, linked to the LICENSE
  file in deepcell-tf, whose fetched text is the standard Apache 2.0 header; the dataset terms are recorded as custom. Paper
  Data Availability says the dataset is available through deepcell.datasets for non-commercial use. Pixel size 0.65 um from the
  paper Methods: all data were rescaled to 0.65 um per pixel before training. Annotations were corrected by human annotators
  with a human-in-the-loop model, each movie reviewed by an expert (source proofread). The segmentation subset is 2D frames; the
  tracking subset is 2D+t movies. Species: the paper names HeLa-S3, HEK293, PC-3 (human) and NIH-3T3, RAW 264.7 (mouse).'
