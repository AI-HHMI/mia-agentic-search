schema_version: '1.2'
id: deepcell-dynamicnuclearnet-nuclear-tracking
title: DynamicNuclearNet
short_name: DynamicNuclearNet nuclei tracking (widefield)
description: DynamicNuclearNet is a training dataset of fluorescent live-cell nuclei movies with per-frame nuclear
  segmentation masks and lineage tracks including divisions. The paper reports 647,322 nuclear segmentations in
  16,501 trajectories with 2,621 division events across five mammalian cell lines (NIH-3T3, HeLa-S3, HEK293, RAW
  264.7, PC-3) plus the Cell Tracking Challenge Fluo-N2DL-HeLa movies. It has a tracking subset (X, y, lineages)
  and a segmentation subset (X, y, source metadata), loaded through the DeepCell API.
