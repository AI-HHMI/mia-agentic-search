schema_version: '1.2'
id: zenodo-24190760-filament-synth-motility-assay
title: 'filament-synth 0.1: synthetic in vitro motility assay sequences with ground-truth filament annotation'
short_name: Synthetic actin motility tracking (widefield)
description: 72 synthetic epifluorescence sequences (30 frames of 512x512, 16-bit) of actin filaments
  gliding over a myosin-coated surface, with persistent-ID filament centrelines, keypoints, binary masks
  and centreline masks. Grid of 3 filament densities x 3 SNR levels, generated with PSF blur, photobleaching
  and EMCCD noise, for training and evaluating filament segmentation and tracking.
