notes: Fully synthetic data (generator filament-synth 0.1.0, parameters calibrated on real recordings,
  mostly from one day in 2017), so it is a training/benchmark set for filament segmentation and tracking
  rather than real microscope data. Verified from the Zenodo record, its README (Russian with English
  section) and a listing of S0001.zip (stack.tif, mask.tif, centerline.tif, tracks.csv, keypoints.csv,
  annotation.json). Pixel size of the synthetic images is not stated; the README says 62 nm/pixel is confirmed
  only for the ordinary source recordings and that dataset quantities are in pixels and frames, so voxel_size_nm
  is null. Frame interval (about 0.3 s) is unconfirmed. No related paper or code is listed on the record.
  72 zip archives of about 9 MB each plus index/metadata files; size_bytes is the total of all record
  files. Splits are not provided.
