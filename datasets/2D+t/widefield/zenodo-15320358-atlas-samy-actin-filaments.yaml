notes: 'Five .rar files (ATLAS.rar 118 MB code/weights, SAMY.rar 27.9 GB, three training sets 78 MB);
  size_bytes is their total. Counts from the paper Methods: 378 experimental frames with 5,512 boxes,
  1,919 U-Net outlines, SAMY 2,520 movies (640x480, 0.1 um/pixel, 10 fps). Pixel size is stated for the
  simulated movies only (meant to mimic experimental ones). Actin source organism not stated, so left
  empty. Zenodo license GPL-3.0-or-later covers the whole record. SAMY movies are AVI (not a schema format);
  ground truth for them is the simulation parameters in the file names. enricher: splits_provided true
  (YOLOv5 sets have train/ and val/ folders; was false); annotations verified from RAR listings (labels/*.txt,
  unet-annotations.json); download_url set to the landing page (5 separate archives, no single file).'
