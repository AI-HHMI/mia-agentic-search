id: zenodo-15320358-atlas-samy-actin-filaments
title: 'ATLAS: actin filament boxes and outlines in in vitro motility assay frames, plus 2,520 simulated SAMY movies'
short_name: Actin filaments in motility assay (fluorescence)
description: Training and benchmark data for the ATLAS actin filament tracker. Two YOLOv5 training sets hold
  experimental in vitro motility assay (IVMA) frames (8-bit grayscale, 640x480) with bounding-box annotations of
  fluorescently labelled actin filaments (5,563 initial, 7,874 expanded annotations, the latter including frames from
  simulated movies), a U-Net training set holds 1,919 manually outlined filaments, and SAMY is a set of 2,520 simulated
  IVMA movies (100 frames each) with known filament length and velocity.
