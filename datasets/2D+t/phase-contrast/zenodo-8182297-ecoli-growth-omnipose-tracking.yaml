notes: 'Single time-lapse stack, so size is at the lower bound of the usable criteria; the Zenodo page is brief and points to the
  TrackMate-Omnipose page on imagej.net, which returned 404 when fetched, so how the XML was produced is taken from the title
  and description only (Omnipose detector in TrackMate). TIFF header read by range request: ImageJ TIFF, 61 frames x 1896 x 1824
  (t,y,x), uint16, uncompressed, value range 0-4117; the header stores no x/y calibration (only a 0.07 micron spacing), so pixel
  size is null. The XML was not opened, so spot and track counts are unknown and the annotations are assumed to be the automatic
  Omnipose output without manual curation. Zenodo listing: TIF 421,932,542 B, XML 27,813,173 B, PNG 812,019 B (size_bytes is their
  sum). No paper is named.'
