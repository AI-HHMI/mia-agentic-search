    zips hit Zenodo TLS errors). Probed and sampled Pveronii dataset1 t=19: raw uint16 512x512, uncompressed, values [723,
    2739] (12-bit camera range, no clipping: normalization ''none'' is inferred); mask uint8 with 19 values 0-18, consistent
