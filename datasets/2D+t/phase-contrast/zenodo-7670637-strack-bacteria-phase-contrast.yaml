notes: 'Zip listings: Pveronii 95, Rahnella 67, Pputida 75 and Lysobacter 83 raw frames, each with a matching manual mask
  (5 time-lapse folders per species, 320 frames in total). The paper says experts also tracked the segmented cells manually
  with MaMut to build reference tracks, but the Zenodo zips list only raw images and masks, so tracking annotations are not
  included here. Paper Methods: Nikon Ti with Hamamatsu C11440 camera and 100x Plan Apo objective, one frame every 10 to 20
  min for 12 to 20 h; pixel size is not stated in the Methods or on the Zenodo record, TIFF headers were not read. The paper
  also analysed 2 literature datasets that are not part of this deposit. Species of Rahnella and Lysobacter are given only
  to genus level.'
