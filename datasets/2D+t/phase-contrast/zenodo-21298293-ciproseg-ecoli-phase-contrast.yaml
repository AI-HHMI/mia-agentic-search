  notes: 'Listing from the zip central directory (peek_archive): 590 members, 384.3 MB uncompressed, 133,064,429 B zip (Zenodo API size, page-stated; the 1.36 GB models zip is not counted). value_range from one sample pair (controlsilica/00). The ImageJ-written frames (controlnonsilica, treatednonsilica) carry a stale ImageJ header (images=50 / 54, slices) but contain one page each (member size = 1 RGB frame), so axes are yxs, not zyxs. Each file is one time point; frame sizes differ within controlsilica (00-39 vs 40-84), so frames of a series are not stackable without resampling. Voxel size differs per subset (see notes); not set. ImageJ header calibration matches README (0.1079, 0.1064 um); LZW-written frames carry no calibration.'
