notes: 'Zenodo date is ''2026/2027'' (date_published null). Masks are binary foreground; touching cells not separated. No publication on the Zenodo record or GitHub repo; microscope, strain and annotation tool not stated. Models zip (1.36 GB, U-Net checkpoints, Apache-2.0) is separate; size_bytes is the data zip. No split files (authors use leave-one-condition-out). enricher: voxel size set to null (was 107.9 nm, first series only): pixel size differs per subset, README + dataset/calibration_metadata.csv: controlnonsilica 0.1079 um; treatednonsilica 0.1064; controlsilica 00-39 0.2046, 40-84 0.1070; treatedsilica 00-49 0.2041, 50-99 0.2040. enricher: channels 1 (grey stored as RGB, samples identical). Frame size varies per series.'
