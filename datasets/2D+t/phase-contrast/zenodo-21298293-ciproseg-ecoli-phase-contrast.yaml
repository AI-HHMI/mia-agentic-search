short_name: E. coli antibiotic segmentation (phase-contrast)
description: 289 phase-contrast time-lapse microscopy frames of Escherichia coli with 289 corresponding manually prepared binary foreground masks, from four conditions (control and ciprofloxacin-treated, each with and without silica particles). Also includes per-sequence pixel calibration, component-level measurement tables and pretrained U-Net checkpoints (leave-one-series-out).
