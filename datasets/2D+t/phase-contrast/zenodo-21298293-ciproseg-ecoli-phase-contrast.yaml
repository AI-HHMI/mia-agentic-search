notes: 'Zenodo date is ''2026/2027'' (date_published null). Peeked CiproSeg_v1.0.0.zip: dataset/images|masks/<condition>/NN.tif for 4 conditions (289 pairs per README), calibration_metadata.csv, component_tables/*.csv. Masks are binary foreground; touching cells not separated. Pixel size varies by sequence/frame (0.1079, 0.1064, 0.2046 then 0.1070, 0.2041 then 0.2040 um); voxel_size_nm is the first condition, see calibration_metadata.csv. No publication on the Zenodo record or GitHub repo, so no paper was read; microscope, strain, image size and annotation tool not stated. Models zip (1.36 GB, U-Net checkpoints) is separate; size_bytes is the data zip. No split files (authors use leave-one-condition-out). Code/checkpoints Apache-2.0.'
