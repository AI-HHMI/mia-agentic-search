notes: Only the small Pos13_1_B.zip (81 MB) is described as containing masks; the large archives (~31.9 GB) are raw
  time series. Masks are for phase contrast and cover specific life-cycle stages, so annotation coverage is partial.
  Annotation source is mixed, since the preprint says models were trained on human-labeled sets, while the toy masks are named after model outputs in the README. Pixel size not stated on the Dryad page, README or
  preprint text checked. Zip contents could not be listed (Dryad download endpoint reports no size); annotation files are
  taken from the README. License CC0-1.0 from the Dryad API record (the landing page only says "licensed for reuse").
  Preprint text is CC BY-NC-ND; the dataset itself is CC0 per Dryad.
