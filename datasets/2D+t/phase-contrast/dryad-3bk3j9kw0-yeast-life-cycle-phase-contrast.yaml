id: dryad-3bk3j9kw0-yeast-life-cycle-phase-contrast
title: Time lapse microscopy images of Saccharomyces cerevisiae's full life cycle
short_name: Yeast full life cycle time-lapse (phase contrast)
description: Time-lapse TIF images of the complete sexual life cycle of S. cerevisiae (up to three cycles) recorded in a
  microfluidic assay, as phase contrast plus fluorescent reporter channels (Whi5 fusions, LiCHI High-Cdk1 sensor). Intended
  as a benchmark for single-cell processing and tracking algorithms. A small toy dataset (Pos13_1_B.zip) includes
  stage-specific segmentation masks (ProSeg, MatSeg, SpoSeg models).
