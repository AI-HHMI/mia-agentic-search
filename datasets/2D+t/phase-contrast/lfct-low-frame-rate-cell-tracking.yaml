notes: 'Sequence counts from the paper (MCF10A 18, HEK293T 14, MDA-MB-231 13, U87 8 = 53). The project
  site hosts per-sequence downloads (images pc and rfp, annotation xml, gap videos) as individual Clemson
  Box links, so no single download_url is given. The paper states a Zenodo DOI 10.5281/zenodo.20186357
  with one ZIP per cell line, but that DOI was not registered when checked (Zenodo API 404), so it is
  not cited as the DOI. License: the paper and its Zenodo statement say CC-BY 4.0; the site footer says
  CC BY 3.0 (looks like a template line), so CC-BY-4.0 follows the paper. Pixel size, image dimensions,
  frame counts and total size are not stated on the site or in the paper text read (PMC full text; the
  preprint is not open access in Europe PMC); voxel_size_nm is null. Annotation file contents were not
  inspected (Box files not opened), hence annotations_verified false. Preprint, not yet peer reviewed.'
