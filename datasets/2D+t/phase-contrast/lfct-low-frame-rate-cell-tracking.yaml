schema_version: '1.2'
id: lfct-low-frame-rate-cell-tracking
title: 'LFCT: Low Frame-rate Cell Tracking dataset'
short_name: Low-frame-rate cell tracking (phase-contrast)
description: 53 multi-day live-cell time-lapse sequences of four human cell lines (MCF10A, MDA-MB-231,
  HEK293T, U87) imaged at 10x and 20x in phase contrast plus an RFP nuclear channel (H2B-mRuby), at 10-15
  minute intervals over three to four days. Ground truth gives cell identities, temporal links, lineages
  and mitosis events as TrackMate XML, curated by hand after Cellpose segmentation and TrackMate linking.
  Frame-rate-reduced videos (gap factors 1, 2, 4, 8) are also provided.
