  notes: 'Not inspected: every file is a Clemson Box shared link (270 on the MCF10A page, 120 on the U87
    page; the HEK293T and MDA-MB-231 pages list none in their static HTML). A Box share URL returns a
    JavaScript viewer page, not the file (e.g. clemson.box.com/s/sqjhv7mhy8pamliyqigc587hkeqzlcal is FLD_3.zip,
    258,254,646 B, per the page data), so tools/listing.py, probe.py and sample.py cannot read it, and
    no download URL was constructed from it. The Zenodo record named in the paper''s Data Availability
    section (10.5281/zenodo.20186357, one ZIP per cell line, CC-BY 4.0) still returns 404 from the Zenodo
    API on 2026-10-12; once it is published it gives direct links. No direct download: Box only. Voxel
    size not found; checked: project site, PMC13251996 full text (Europe PMC XML: displacements in um
    only, no pixel size), Zenodo (404). Size unknown (not stated).'
