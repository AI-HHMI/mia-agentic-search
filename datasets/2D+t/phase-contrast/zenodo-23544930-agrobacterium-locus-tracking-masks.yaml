notes: 'Dataset.zip (4.8 GB, 727 files) listed with peek_archive and its README.md read: 228 PNG masks (file names end in _cp_masks, which suggests Cellpose output, not stated), 227 TIFF (phaseRef first frames plus one 1.27 GB example movie), 264 MATLAB files (Tracks_all.mat etc.) and one 1.27 GB YFP .nd2 for the example movie. Masks and tracks are algorithmic (phase-contrast segmentation, SMALL-LABS tracking), not manual, so this is silver-standard labelling. Full raw movies are not included (available on request). No paper is linked on the record, so none was read; species, pixel size, objective and frame interval are not stated.'
