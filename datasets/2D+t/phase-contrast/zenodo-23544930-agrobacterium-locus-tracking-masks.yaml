  notes: 'Listing: Zenodo API (1 file, 4,822,332,561 bytes, complete) plus the zip central directory (727
    members; 225 phaseRef TIFF / 225 masks / 225 Tracks_all.mat matched by the globs, over 16 strains).
    Sampled one pair (5.9 MB + 65 KB downloaded): raw uint16 2048x2044, range [1184, 8849] in that one
    frame; mask uint16 PNG, 415 unique values incl. 0 (instance IDs). Mask file names end in _cp_masks
    (Cellpose naming, not stated). probe.py could not parse the deflated TIFF members (tool error); the
    1.27 GB example Phase.tif and YFP.nd2 were not opened (frame counts unknown). Each raw is one frame,
    so as a 2D+t dataset only the example movie has time series. Voxel size not found; checked: TIFF header
    (sample read via tifffile, no calibration reported), Zenodo API description (no paper, no related
    identifiers), README.md in the zip; Europe PMC search for a paper returned HTTP 503. Download: Dataset.zip
    is a direct Zenodo link (usable, range requests) and its members are fetchable as zip::member.'
