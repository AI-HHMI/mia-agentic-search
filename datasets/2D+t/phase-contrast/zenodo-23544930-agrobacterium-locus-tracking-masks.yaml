short_name: Agrobacterium phase images with cell masks
description: Processed microscopy data for chromosome locus tracking in 16 Agrobacterium strains (two
  replicates per strain, typically six movies each). Each movie folder has the first phase-contrast frame,
  a segmentation mask derived from it, and SMALL-LABS single-molecule tracking results; one example movie
  ships with its raw phase and YFP data.
