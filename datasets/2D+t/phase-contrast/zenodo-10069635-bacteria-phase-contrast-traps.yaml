notes: 'Zip listed with peek_archive (128,518 files: 126,739 PNG, 39 TIFF, 1,665 CSV, 8 pretrained .pth) and its
  Readme read; selection label files are described in the Readme but their contents were not opened. Pixel size
  is not stated on the Zenodo page, Readme or paper Methods (100x oil objective). n_items is the 3,396 trap videos
  used in the paper. The train/test split (85/15 by trap) is defined in code, not as files. Species labels come
  from fluorescence images of species-specific probes after the time-lapse; traps containing one species were selected
  semi-automatically/manually. A later 7-species follow-up (PLoS ONE 2025) exists and is not part of this record.
  enricher: voxel size 30.303 nm (33 px/um, paper Methods; was null). organisms: one per trap, listed in selections/single_species_loc_<ch>:
  488 = E. faecalis, CY3 = E. coli, cy5 = K. pneumoniae, txr = P. aeruginosa.'
