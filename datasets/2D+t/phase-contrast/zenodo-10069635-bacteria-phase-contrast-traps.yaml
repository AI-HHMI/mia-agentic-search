id: zenodo-10069635-bacteria-phase-contrast-traps
title: Phase-contrast time-lapses of four bacterial species in microfluidic traps with FISH-derived species labels
short_name: Bacteria in microfluidic traps (phase-contrast)
description: 'Replication package (17.8 GB zip) for label-free species classification of Enterococcus faecalis, Escherichia coli, Klebsiella pneumoniae and Pseudomonas aeruginosa. It holds stabilised, cropped phase-contrast time-lapses of individual microfluidic growth traps (about 32 frames, one every 2 minutes, 100x oil objective; 126,739 PNG files) with text files in data/img/selections that label each trap with the species indicated by the species-specific fluorescence probe, plus a few full TIFF microscopy outputs, pretrained networks, statistics and code. The paper trains on 3,396 trap videos with an 85/15 train/test split by trap.'
