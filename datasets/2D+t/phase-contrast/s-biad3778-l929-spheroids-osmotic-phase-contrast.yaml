title: Time-course of L929 cell spheroids responses to osmotically active solutions
short_name: L929 spheroid instance masks (phase contrast)
description: Phase-contrast time-lapse images (2572 x 1956, 15 s intervals, about 10 min per well) of mouse L929 fibroblast
  spheroids exposed to DMSO, glycerol, 1,2-propanediol or PEG-1500 at 5, 7.5 and 10 percent, with COCO instance segmentation
  masks of spheroids and single cells for part of the images (annotation ongoing).
