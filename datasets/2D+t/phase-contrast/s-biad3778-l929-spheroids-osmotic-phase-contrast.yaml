notes: 'Facts from the BioStudies record and its file lists (images: 2255 OME-TIFF files of about 15 MB each, in folders for
  days 6, 7 and 20, total 34.0 GB; annotations: one COCO JSON). No publication is listed on the record, so there is no paper
  to read. Pixel size 0.17 um/px is stated by the depositors as calculated from sensor pitch, objective and an assumed coupler
  factor. Masks were produced with SAM 2 from manual point prompts and reviewed by one expert; the record says annotation
  is partial and ongoing. Study component calls the images brightfield time-lapse while the acquisition section says phase
  contrast; phase contrast is used here. enricher: COCO file read: 2,255 images, 8,128 polygons, class ''cell'', every image
  has at least one; images are RGB (samples differ), channels 3.'
