notes: 'Hosted on OSF as images.rar (1.31 GB) and labels.rar (1.6 MB); size_bytes is their sum from the
  OSF API file listing. RAR contents could not be listed (peek_archive handles zip only), so file counts
  come from the dataset card/README. Paper (Array 2026) is not open access and was not readable (ScienceDirect
  403, not in Europe PMC); pixel size, microscope details and channels are not stated in the README/dataset
  card. No fixed split in the release; the paper used frames 1-1434 train / 1435-1800 validation. Bounding-box
  labels from manual + pseudo-label + tracker propagation (source: mixed). enricher: size_bytes is the
  complete OSF file listing (8 files incl. docs; was images+labels only).'
