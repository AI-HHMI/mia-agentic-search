short_name: B16BL6 cell/division detection (phase-contrast)
description: '1,800 phase-contrast time-lapse frames (1600x1200, .tif) of adherent
  B16BL6 mouse melanoma cells with 93,637 YOLO bounding-box annotations in two classes:
  Cell and Division (mitosis). Annotated via manual labelling of a subset, YOLO pseudo-labels
  with expert refinement, and detector-tracker label propagation.'
