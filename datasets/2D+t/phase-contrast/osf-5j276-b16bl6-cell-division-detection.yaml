  2026) is not open access and was not readable (ScienceDirect 403, not in Europe
  PMC); pixel size, microscope details and channels are not stated in the README/dataset
  card. No fixed split in the release; the paper used frames 1-1434 train / 1435-1800
  validation. Bounding-box labels from manual + pseudo-label + tracker propagation
  (source: mixed).'
