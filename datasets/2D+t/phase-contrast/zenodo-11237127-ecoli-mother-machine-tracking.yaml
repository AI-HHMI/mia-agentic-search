title: Cell Tracking Dataset (E. coli growing in the Mother Machine)
short_name: E. coli mother machine tracking (phase contrast)
description: 102 time-lapse movies (58 train, 15 val, 29 test), each of a single mother-machine chamber
  with E. coli imaged every 5 minutes, in Cell Tracking Challenge format with segmentation (SEG) and tracking
  (TRA) ground truth masks and man_track.txt lineage files. Collected by the Dunlop lab (Boston University);
  used to train and benchmark Cell-TRACTR.
