  notes: 'Complete Zenodo listing (CTC.zip, 315,362,069 B = size_bytes), members expanded (54,042). Read
    the zip directory, README.txt and test/07_GT/TRA/man_track.txt by range (5,428,105 B): 218 tracks,
    4 columns. Probed test/07/t064.tif: 317x39x3 uint8 RGB, LZW. Sampled the t098 frame + man_seg098:
    raw [0, 255]; mask uint16 with 0 and 7 IDs (113-120, one ID absent), so the SEG labels carry track
    IDs. The frames are RGB TIFFs even though the record says phase contrast; whether the 3 channels are
    equal was not checked. Values are from one frame.'
