notes: 'Zenodo record and CTC.zip listing (peek_archive) show train/val/test folders with N, N_GT/SEG
  and N_GT/TRA per movie (SEG slightly fewer than frames). n_items = 58+15+29 movies; the test set has
  _GT but also N_RES folders. Phase-contrast is inferred from the Cell-TRACTR paper (supplement figure
  overlays on phase contrast images); pixel size, microscope and annotation procedure are not stated on
  the Zenodo page, README or in the paper text available (Methods describe only training). Annotation
  source therefore unknown. Dataset is described in the Zenodo paper links of Cell-TRACTR (O''Connor &
  Dunlop 2025). enricher: frames are 317x39 RGB uint8 TIFFs (one chamber); SEG/TRA masks are uint16 instance
  IDs; README.txt read.'
