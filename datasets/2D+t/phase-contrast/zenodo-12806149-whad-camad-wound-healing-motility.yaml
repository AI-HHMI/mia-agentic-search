notes: 'Zip listing (6,940 files): 5,586 TIFF files (WHAD images 5,510 files under whad/images/MCF7 and MCF10A, CAMAD 96 images), 1,301 PNG masks (WHAD 1,206 for MCF7 and MCF10A,
  CAMAD 96), 16 ROI zips and 16 AVI videos (CAMAD); n_items counts TIFF files including a few macOS ._ stubs. Masks cover only part
  of the WHAD frames. Annotation procedure is not stated: the GitHub README only says ImageJ ROI files can be converted to masks, so source is unknown. The README states CAMAD uses MCF7 cells but video file names mention 231, so organism is limited to Homo sapiens. Pixel size and microscope are not stated on the Zenodo page, README or the Crossref record; the IEEE Data Descriptions paper has no open full text.'
