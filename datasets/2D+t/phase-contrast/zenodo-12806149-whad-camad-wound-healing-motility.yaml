title: Wound Healing Assay Dataset (WHAD) and Cell Adhesion and Motility Assay Dataset (CAMAD)
short_name: Wound healing and cell motility (phase contrast)
description: Two phase-contrast datasets in one deposit. WHAD has time-lapse frames of MCF7 and MCF10A cells in 2D wound healing
  assays, with PNG masks for part of the frames. CAMAD has images, ImageJ ROI archives and videos of cells in 3D cell adhesion
  and motility assays (16 experiments), with a mask for each of 96 images.
