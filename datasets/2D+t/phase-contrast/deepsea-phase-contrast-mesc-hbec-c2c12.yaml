  7 sets/2010, C2C12 7 sets/540). The C2C12 images come from an external source (the Ker et al. 2018 phase-contrast tracking
  set), so they overlap with an existing catalog record. The repository is MIT licensed (code); no separate data license
  was found. Pixel size is not stated. Masks were drawn manually with the authors MATLAB annotation tool.'
