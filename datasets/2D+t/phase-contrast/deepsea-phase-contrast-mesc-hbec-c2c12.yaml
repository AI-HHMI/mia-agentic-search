  notes: 'Listing: Google Drive embedded folder views, crawled at 1 request/s; file names and counts only,
    no sizes, so size_bytes stays null and no estimate is possible (no shape for C2C12, shapes vary).
    Sample values from one bronchial and one MESC frame. labeled_images are RGB visualisations; cell_features
    are per-cell shape tables. Download: Drive files are direct via drive.google.com/uc?export=download&id=<id>
    (range requests work), but drive.google.com is not on the TensorSwitch allowlist; there is no single
    archive, so data.download_url is the Drive folder. Voxel size: see notes; checked stem_cell_dataset/set_1/info.txt
    (other sets have one too, not read), paper full text, GitHub README; Ker et al. 2018 (C2C12 upstream)
    not read. Frame index: MESC names <well>_z<NNN>, which are time points per info.txt (frame rate 20
    min).'
