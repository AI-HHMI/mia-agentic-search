short_name: DeepSea phase-contrast cells (3 cell types)
description: Manually annotated phase-contrast live-cell image sequences of three cell types (mouse embryonic
  stem cells, immortalized human bronchial epithelial cells and mouse C2C12 myoblasts, about 3,600 images
  in total) with ground-truth cell masks for segmentation and a tracking dataset, released with the DeepSea
  segmentation and tracking model.
