notes: 'Data are Google Drive folders linked from the GitHub README. Listing: stem_cell_dataset 33 sets
  / 1174 images, bronchial_epithelial_cell_dataset 6 sets / 2010, muscle_cell_dataset 8 sets / 480; n_items
  3664 from the listing. The C2C12 images come from Ker et al. 2018 and overlap with that catalog record.
  The repository LICENSE is MIT (code); no data license found. Masks drawn manually with the authors MATLAB
  tool. enricher: voxel size left null, subsets differ: MESC 645 nm (stem set_1 info.txt "Pixel size:
  0.6450x0.6450 micron^2", 1344x1024); bronchial (1224x904) and C2C12 not stated. enricher: formats [png]
  (was other). organisms: Mus musculus = stem_cell_dataset/, muscle_cell_dataset/; Homo sapiens = bronchial_epithelial_cell_dataset/.'
