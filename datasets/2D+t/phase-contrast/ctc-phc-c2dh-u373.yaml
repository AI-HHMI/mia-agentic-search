notes: 'Custom CTC terms (datasets page): cite the Nature Methods paper and acknowledge the Cell Tracking
  Challenge; other uses need permission, cloning of datasets or reference annotations is forbidden. Training
  zip (43.5 MB, 956 members, listing checked): sequences 01 and 02, 115 tif frames each; GT/SEG is gold
  and sparse (15 and 19 frames), GT/TRA covers all frames, ST silver SEG and ERR_SEG on all frames. Nikon
  microscope, Plan Fluor DLL 20x/0.5, pixel 0.65 um and 15 min frame interval from the CTC 2D dataset
  page. The Nature Methods paper full text is not open access via Europe PMC, so annotation procedure
  was not verified and source is left unknown. Coverage: gold SEG on 15 (01) and 19 (02) of 115 frames;
  TRA, ST and ERR_SEG on every frame.'
