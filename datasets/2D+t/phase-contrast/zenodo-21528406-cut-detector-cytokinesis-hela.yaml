title: Cut-Detector training and test data, HeLa cell divisions and microtubule cuts in time-lapse microscopy
short_name: HeLa cytokinesis time-lapse classification
description: Training and test data for Cut-Detector, a tool that times late cytokinetic events in time-lapse movies of HeLa
  cells (phase contrast, SiR-tubulin and GFP-MKLP1 channels, one frame every 10 minutes). Two training archives hold the images
  and train/validation/test split files for the cell division detection model (cell crops labelled interphase, metaphase or
  dead) and for the microtubule cut detection model (midbody-centered crops of the intercellular bridge labelled by cut state).
  A separate test movie file is also provided.
