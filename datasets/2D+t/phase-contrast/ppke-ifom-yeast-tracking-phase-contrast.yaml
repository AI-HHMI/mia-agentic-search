notes: 'full_yeast_dataset.zip (8.36 GB) holds 374 TIFF movies and 789 TXT annotation files (contours,
  mothers); a 447 MB test_samples.zip and an unzipped sample folder are also offered. n_items 354 = 314
  training + 35 validation + 5 test movies from the paper; Others/ is unannotated. Ground truth was made
  with Phylocell and manually corrected by experts. No data license on the page, README or paper (the
  article is CC BY 4.0; the GitHub code repo is MIT, software only). Movies hold phase-contrast and fluorescence
  channels; only phase contrast was used and annotated. enricher: voxel size 215.8 nm from the ImageJ
  TIFF calibration (0.2158 micron), consistent with the paper (111.1 um field of view, 512 px); was 217
  computed from the field of view.'
