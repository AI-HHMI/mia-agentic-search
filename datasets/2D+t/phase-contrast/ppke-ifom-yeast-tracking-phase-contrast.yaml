notes: 'full_yeast_dataset.zip (8.36 GB) lists 374 TIFF movies and 791 TXT annotation files (contours, mothers); a 447 MB test_samples.zip
  is also offered. n_items 354 = 314 training + 35 validation + 5 test movies from the paper; the zip also holds an unannotated
  Others folder. Pixel size 217 nm is derived from the paper (111.1 um field of view, 512 px), not stated directly. Ground
  truth was made with Phylocell and manually corrected by experts. No data license on the page or in the paper Methods (the
  article is CC BY 4.0). Movies hold phase-contrast and fluorescence channels; only phase contrast was used and annotated.'
