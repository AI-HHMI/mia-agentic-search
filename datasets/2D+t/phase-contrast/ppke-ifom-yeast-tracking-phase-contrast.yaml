  (PPKE/IFOM)
short_name: Budding yeast cell tracking (phase-contrast)
description: Phase-contrast (plus fluorescence channel) time-lapse movies of budding yeast dividing in
  a microfluidic device, with manually curated polygon contours and cell tracks (and mother-daughter inheritance
  for the training set), released with a time-symmetric deep-learning tracker. Train and test folders;
  the test set carries tracking annotations only.
