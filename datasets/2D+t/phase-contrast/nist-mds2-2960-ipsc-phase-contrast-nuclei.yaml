notes: 'Metadata from the NIST repository API record (version 1.1.0, license: NIST open license, https://www.nist.gov/open/license)
  and the full text of the PLoS ONE paper (Europe PMC). Total size 745.8 GB is the sum of the 34 zip files plus
  Dataset_Information.xlsx in the record; the training sets are small (low 151 MB, medium 160 MB, high 189 MB, 3D
  U-Net 34.6 GB) and are the labelled part. Masks are automatic: nuclei are segmented from the GFP image with a
  band-pass filter, threshold and watershed, with only a small amount of manual checking (paper), so they are silver
  rather than hand-drawn labels. Pixel size 637 nm is derived from the paper statement that one pixel covers 0.406
  um^2 (sqrt). Dimensionality is 2D+t for the raw experiments; the 2D U-Net training files are single images. Count
  of images not given (Dataset_Information.xlsx not read). Different from nist-mds2-2753 (lipid nanoparticles).'
