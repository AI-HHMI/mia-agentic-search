schema_version: '1.2'
id: nist-mds2-2960-ipsc-phase-contrast-nuclei
title: High-volume, label-free imaging for quantifying single-cell dynamics in iPSC colonies
short_name: iPSC colony nuclei and mitosis (phase contrast)
description: Phase-contrast time-lapse of human iPSC colonies (7 z-planes plus a GFP fluorescence image per field, every 2
  min for 20+ h) from the NIST WSDOM lab, with training sets for 2D U-Net nuclei segmentation (phase image, GFP image, nuclei
  mask) and a 3D U-Net mitosis detector (phase and fluorescence stacks with four-class masks). Accompanies Asmar et al., PLoS
  ONE 2024.
