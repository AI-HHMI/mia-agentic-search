notes: 'Metadata from the NIST repository API record (v1.1.0, NIST open license) and the PLoS ONE paper full text (Europe
  PMC). Masks are automatic: nuclei segmented from the GFP image (band-pass, threshold, watershed), checked with a small amount
  of manual annotation (paper); phase_inferenced and mitosis_inferenced are model predictions. Pixel size 637 nm is the square
  root of the paper statement that one pixel covers 0.406 um^2 (square pixels assumed). enricher: files are stitched best-focus
  2D images per time point (not z-stacks); image sizes vary per experiment (3798-3829 px, exp6 5653 px; Dataset_Information.xlsx).
  enricher: size from the full file listing (745.8 GB); annotation types corrected from samples (instance IDs, img_fg is a
  binary mask, not GFP). enricher: coverage: fluorescence and its masks exist only for GFP-exposed wells (16 of 29 exp zips).
  Different from nist-mds2-2753.'
