notes: 'This Mendeley record is a preview/subset (''LiveCellTrack-Subset-for-Reviewers.zip'',
  174 MB): 1,500 TIFF frames in 20 sequences (10 HeLa, 10 scratch-wound), with the
  COCO train.json annotations. The README describes the full dataset as 191 HeLa sequences
  x 50 frames (149 train/42 test) and 64 scratch-wound sequences x 100 frames (32/32);
  test sets are not in the preview. Scratch-wound annotations were originally cell
  centre points converted to boxes with radius 25. Frame interval 5 min. Phase-contrast
  modality is taken from the record''s category tag only; pixel size, microscope and
  image dimensions are not stated, and no related paper is listed (title search in
  Europe PMC/Crossref found none).'
