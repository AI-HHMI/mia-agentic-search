id: zenodo-17368955-seven-bacterial-species-phase-contrast
title: Phase-contrast time-lapses of seven bacterial species in microfluidic mother machine traps
short_name: Seven bacterial species mother-machine time-lapses
description: Replication package for a deep-learning study that identifies bacterial species from one-hour
  single-cell phase-contrast time-lapses (frame every 2 minutes, about 30 frames) of cells growing in
  microfluidic mother machine traps. It holds the cropped trap time-lapses and final fluorescence images
  from 17 experiments of Pseudomonas aeruginosa, Escherichia coli, Klebsiella pneumoniae, Acinetobacter
  baumannii, Enterococcus faecalis, Proteus mirabilis and Staphylococcus aureus (about 620,000 images
  from 19,500 traps), the species labels derived from species-specific fluorescent probes, segmentation
  masks, raw capture examples, trained models and the code to rerun the experiments.
