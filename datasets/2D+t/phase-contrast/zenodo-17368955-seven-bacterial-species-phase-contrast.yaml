notes: 'Sources: Zenodo record, zip listing and README (peek_archive), paper full text. The download is one 131 GB zip that
  also holds trained models and a container image. Species labels come from a labeling tool using fluorescent probes; the
  paper says some traps were relabeled or discarded by hand. Segmentation masks were generated by a U-Net and Segformer ensemble,
  so they are model-made, not manual. Train/test split: one held-out experiment (Experiment 17) is the test set. enricher:
  n_items = 19,609 trap folders under data/img (17 experiments). Voxel size not found (raw Micro-Manager-style TIFFs uncalibrated;
  paper gives sizes in pixels only). organisms: mixed within experiments; species per trap = species column of scripts/labels.csv,
  not per folder.'
