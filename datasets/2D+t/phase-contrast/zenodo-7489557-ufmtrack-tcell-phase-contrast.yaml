title: UFMTrack T-cell segmentation models and training data.
short_name: T cell masks under flow (phase-contrast)
description: Phase-contrast time-lapse movies (10x, 0.629 um/pixel) of mouse T cells migrating on a monolayer of brain
  microvascular endothelial cells under flow, with manual annotations of T-cell masks, the transmigrated (diapedesis)
  part of cells, and cell centroids. Four annotated movies of 180 frames each, a validation portion, a reference dataset
  for histogram normalisation and trained TensorFlow models. Released with the UFMTrack framework.
