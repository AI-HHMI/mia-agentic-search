notes: 'Zip index read (13,396 files): raw_data/{1,2,3,5}/ hold 180-frame movies with raw TIFFs, aligned raw, lbl (T-cell
  masks), diap (transmigrated part), cntr (centroids) PNGs and a labels folder. info.txt: ids 1,2,3,5 labelled by four
  annotators, with a non-overlapping validation portion. Also train/valid pickles (3.3 GB, not opened), a histogram
  reference set and trained models. n_items is 4 movies x 180 frames, inferred from folder counts; the c1-c3 channel
  layout was not checked. size_bytes is the zip size, including ~0.2 GB of models. Pixel size 0.629 um is from the paper
