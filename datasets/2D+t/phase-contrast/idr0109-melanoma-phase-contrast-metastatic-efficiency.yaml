notes: 'IDR API: project 1801 has 21 datasets (by cell line, clonal line, melanocyte line and PDX). The annotation CSV
  lists 874 image series from 57 raw .nd2 files (all type "raw"), with labels Cell Origin (PDX 490, Cell Line 179,
  Clonal 138, Melanocyte 67) and PDX metastatic efficiency (high 206, low 202, blank 466). Labels are sample-level
  classes, not pixel masks. The raw files are Nikon .nd2 (per the CSV file paths; the
  IDR copies were not opened). Pixel size, frame interval and total size are not
  stated in the IDR record or CSV, and the paper is not open access (Europe PMC returned only the abstract), so
  voxel size, size and the train/test protocol are unchecked. The exact IDR image id used in evidence is one example
  series.'
