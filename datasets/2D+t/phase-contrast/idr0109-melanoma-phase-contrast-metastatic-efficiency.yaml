  notes: 'Listed the EBI FTP tree over HTTP (index sizes rounded; the FTP listing timed out, so the listing is not complete).
    Read IDR API metadata for all 874 series (21 datasets): 2560x2160x1x1, uint16, T 241-1441; PhysicalSizeX 0.325 um (589),
    0.0325 um (270; implausible, likely a metadata error) and 0.331 um (15). The IDR imgData endpoint fails ("Error instantiating
    pixel buffer") so no pixels were sampled; probe.py cannot read ND2 headers. Size: sum over the 874 series of SizeX*SizeY*SizeT*2
    B = 5,870,599,372,800 B, uncompressed pixels only (the FTP index shows ~5.9 TB of .nd2). Voxel size not settled; checked:
