notes: 'Zenodo total 7.2 GB (3 zips: acdc_paper_all_data.zip 5.6 GB, test_data_stem_cells.zip 993 MB, test_data_budding_yeast.zip
  557 MB). peek_archive of the two test zips: budding yeast has 28 tif (phase_contr and mCitrine), 28 npz files (including
  *_segm.npz masks and *_aligned.npz arrays) and acdc_output csv tables per position; stem cells has 60 tif (dapi/fitc/phase_contr)
  with *_segm.npz. Contents of acdc_paper_all_data.zip were not listed. Yeast metadata.csv gives PhysicalSizeX/Y 0.227 um
  (227 nm); not stored in voxel_size_nm because it is not stated for the stem-cell data. Imaging: Zeiss LSM 800, 40x/1.3 NA,
  Axiocam 506 camera (paper Methods). Masks were produced with neural networks and then corrected in the Cell-ACDC GUI (paper),
  so source=proofread; the extent of correction per file is not stated. Primarily test data for the software, so number of
  annotated frames/cells is not stated; the Zenodo record has no related-publication field (paper found by search).'
