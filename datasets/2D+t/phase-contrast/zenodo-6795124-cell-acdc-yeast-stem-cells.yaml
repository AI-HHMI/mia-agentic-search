title: 'Cell-ACDC test datasets: budding yeast time-lapse and hematopoietic stem cell images with segmentation and tracking'
short_name: Cell-ACDC yeast and stem-cell movies (phase/fluor)
description: 'Data released with the Cell-ACDC paper: time-lapse phase-contrast and fluorescence (Htb1-mCitrine) movies of
  budding yeast and 3D z-stacks of mouse hematopoietic stem cells (DAPI, FITC, phase contrast), stored with Cell-ACDC segmentation
  masks (*_segm.npz), tracking/cell-cycle annotation tables (*_acdc_output.csv) and metadata. The record has three archives:
  two test-data zips and one with all data from the paper.'
