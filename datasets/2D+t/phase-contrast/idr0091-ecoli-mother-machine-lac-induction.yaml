notes: 'Image count is from the IDR API (1,816 images in 22 datasets, 1,474 raw stacks and 342 preprocessed growth-channel
  "pattern" images). Pixel size 0.065 um is the IDR metadata value of a sampled raw stack. Annotation evidence is indirect:
  the paper Methods say 30 growth channels per experiment were picked and curated manually in MoMA, and a sampled preprocessed
  image carried 4,341 Line ROIs in the IDR; what each line encodes (cell length, division, tracking) was not checked, so the
  annotation type tracking is an inference from the paper, and only the curated channels are annotated (partial). MoMA data
  outputs are also on Zenodo (10.5281/zenodo.3894719: preprocessed growth-lane tar.gz, file list and assay xlsx), not opened
  in full. Total size not stated precisely (study file says "Total Tb 10", unclear unit), so size left null. Author listed
  is the study-file submitter (Thomas Julou); the paper has more authors.'
