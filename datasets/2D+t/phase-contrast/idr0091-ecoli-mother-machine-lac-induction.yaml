description: Phase-contrast and GFP time-lapse stacks (1024x2048 px, 2 channels, hundreds of frames) of E. coli MG1655 lacZ-GFPmut2
  in mother machine microfluidic channels under alternating glucose/lactose media, 22 IDR datasets (1,474 raw stacks plus
  preprocessed growth-channel images). Cells in 30 growth channels per experiment were curated manually in MoMA; line ROIs
  from that analysis appear on the preprocessed channel images in the IDR.
