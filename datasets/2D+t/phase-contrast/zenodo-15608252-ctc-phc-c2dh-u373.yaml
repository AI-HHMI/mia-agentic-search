notes: 'Zenodo record has no description; license CC-BY-4.0 is the one shown in the Zenodo API record.
  Zip index read with peek_archive (956 files): sequences 01 and 02 with 115 raw frames each, 01_GT/SEG
  15 and 02_GT/SEG 19 gold masks, 115 silver ST/SEG masks and 116 GT/TRA files per sequence, ERR_SEG folders
  and man_track.txt. Microscope, objective, pixel size (0.65 um) and 15 min interval are from the CTC
  2D dataset table, not the Zenodo page; the paper text did not state them. Gold segmentation is sparse
  (paper: manual annotation covers only a fraction of cells); silver truth is computer-generated. Same
  data as the CTC-hosted copy of PhC-C2DH-U373, which is not in this catalog (other CTC datasets are,
  hosted on the CTC site). Test set annotations are secret.'
