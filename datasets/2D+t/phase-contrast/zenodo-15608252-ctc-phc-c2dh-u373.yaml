short_name: U373 cell segmentation and tracking (phase)
description: Two phase-contrast time-lapse sequences (01 and 02, 115 frames each) of glioblastoma-astrocytoma
  U373 cells on a polyacrylamide substrate, from the Cell Tracking Challenge training set (Nikon, Plan Fluor
  20x/0.5, 0.65 um pixels, 15 min interval). Contains sparse manual gold-truth segmentation (15 and 19 frames),
  gold-truth tracking markers for every frame and computer-generated silver-truth segmentation for every
  frame. Deposited on Zenodo by the Cell Tracking Challenge.
