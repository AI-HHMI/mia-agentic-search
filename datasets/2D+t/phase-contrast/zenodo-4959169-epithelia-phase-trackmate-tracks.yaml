notes: 'Seven zips (37.3 GB): three timelapse TIFF archives (HUVEC, MDA-MB-231, MDCK bulk) and four TrackMate XML archives;
  no single direct archive, so download_url is null. Paper Methods: 13 HUVEC, 15 MDCK and 17 MDA-MB-231 tissue movies (10
  min/frame for HUVEC and MDCK, 5 min/frame for MDA-MB-231; Nikon Ti2, 4X/0.15 or 10X/0.3 phase objectives); the zips may
  hold a subset, so n_items is null. Pixel size is not stated on the Zenodo page or in the paper Methods. Tracks come from
  the TrackMate plugin after background subtraction, filtered for boundary effects, so source is automatic and unverified
  by hand; channel layout inside the TIFFs was not inspected.'
