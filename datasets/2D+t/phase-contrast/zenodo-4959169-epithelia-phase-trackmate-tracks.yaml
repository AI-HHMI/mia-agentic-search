  notes: 'Listing: Zenodo API, 7 zips, exact sizes; zip members via peek_archive. Headers: the deflated TIFF members are too big for probe.py, so the first 0.3-1 MB of 4 members was inflated with a scratch script (tools.probe.read_member) and the IFD0 parsed: big-endian ImageJ 1.53c TIFF, uint16, uncompressed, no XResolution/YResolution tags (uncalibrated). Not sampled: the smallest movie is 776 MB. Voxel size not found; checked: TIFF headers (no resolution tags), TrackMate XML (spaceUnits=pixel), Zenodo API/description, paper full text (Europe PMC PMC9106212; objectives 4X/0.15 and 10X/0.3 only, no pixel size), GitHub CohenLabPrinceton/Attention_Networks README. Whether the movies include the phase-contrast channel: the files read so far carry only c2 labels. Contents of tracks per file (rows) not counted.'
