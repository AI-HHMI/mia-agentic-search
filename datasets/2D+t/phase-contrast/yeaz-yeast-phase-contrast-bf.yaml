schema_version: '1.1'
id: yeaz-yeast-phase-contrast-bf
title: YeaZ training set - budding yeast cell masks in phase contrast and bright-field images
short_name: Yeast cell segmentation (phase contrast)
description: Manually and semi-manually segmented images of budding yeast (S. cerevisiae W303) recorded in microfluidic chips with a 60x objective. The phase contrast set has 384 images (multi-layer tif) with >8,500 cell masks, covering normal, arrested, filamentous and DNA-damaged cells. A bright-field set has >1,700 cells whose masks were transferred from segmented phase contrast images of the same scenes. Masks are label images where pixels hold cell IDs and background is 0.
