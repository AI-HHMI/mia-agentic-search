notes: 'Files are hosted on Google Drive (links on the lab page: phase contrast https://drive.google.com/file/d/14MUIN26ou0L12UC9UV_AC2S3isj1qBMY,
  bright-field https://drive.google.com/file/d/1Sot3bau0F0dsBjRxoQzdGOeUy_wMezal). The dataset page and
  paper Data availability give no license for the data (the paper article itself is CC-BY-4.0); spdx set
  to unknown. enricher: PhC tar.gz partly streamed; *_im.tif/*_mask.tif pairs seen (annotations_verified
  true). Voxel/pixel size is not stated in the paper Methods (60x objective, Hamamatsu Orca-Flash4.0,
  16-bit images) or on the page. Paper text: phase contrast set = 384 images, >8500 cells; bright-field
  masks were transferred from CNN-segmented phase contrast images, not manually drawn (the lab page lists
  10,422 and 23,046 cells, the latter as 3,841 cells x 6 exposure levels). The bright-field set is marked
  on the page as needing updates. Time-lapse recordings are included; the paper tracks cells in a 75-frame
  recording.'
