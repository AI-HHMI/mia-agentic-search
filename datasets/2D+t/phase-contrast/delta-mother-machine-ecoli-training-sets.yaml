notes: 'Hosted in a Google Drive folder named in the paper and used by delta/assets.py; the listing could not be read, so exact contents, file formats (png inferred from the docs'' demo movies only) and total size are unverified. Docs sample counts: mother machine segmentation 3,294 (train) / 9,024 (train_multisets), tracking 4,055 / 7,706, ROI 886; 2D segmentation 297, tracking 23,655. Masks first made with Ilastik, then manually curated. Pixel size not in paper Methods (100X oil) or docs. No data license found (paper CC BY 4.0, code MIT; neither stated to cover data); multisets include third-party movies (Molyso, MoMA, BACMMAN) with possibly different terms. Related: zenodo-17569655 is a later, different DeLTA set.'
