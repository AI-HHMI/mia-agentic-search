notes: 'Read the Zenodo API record and listed Tracks.zip with peek_archive (30 files: 10 TIFF movies of about 58 MB, and 20
  TrackMate CSVs, split into ICAM and VCAM folders). Tracks come from automatic StarDist + TrackMate tracking, not manual
  curation. The paper (PLOS Biology, full text read) describes the same T cell data as Zenodo 11286110, which has the same
  title and an identical Tracks.zip size (a re-deposit) and calls it brightfield in one place and phase contrast in its Methods,
  so phase-contrast follows the Methods. Pixel size and frame count are not stated on the record or paper; TIFF headers were
  not read. Small dataset (10 movies). enricher: pixel size 0.645 um from the ImageJ TIFF header (XResolution 1.550387 px/um,
  unit um; was null); size from the Zenodo file listing.'
