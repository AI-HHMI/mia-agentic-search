notes: 'Zip: 10 .tiff movies (57.8 MB each) and 30 TrackMate CSVs under Tracks/ICAM|VCAM/R1-R3. Tracks are automatic (StarDist
  detector + Simple LAP tracker, per the paper Methods), not manual. Differs from catalog record zenodo-4034929 (209 manual
  image/mask pairs): this one has ten full movies with automatic tracks. enricher: voxel size 645 nm from the TIFF header
  (XResolution 1.550387 px/um, ImageJ unit um), which agrees with the "Pixel size: 645 nm" that record 4034929 (linked from
  this page for dataset details) states for the same setup (was null).'
