notes: 'Zip listing (peek_archive): 10 .tiff movies (57.8 MB each) and 30 TrackMate CSVs under Tracks/ICAM|VCAM/R1-R3.
  Tracks are automatic (StarDist detector + Simple LAP tracker, per the paper Methods), not manual. Pixel size
  not stated for these files; related record 4034929 gives 645 nm for the same setup but it was not verified here,
  so null. Differs from catalog record zenodo-4034929 (209 manual image/mask pairs): this one has ten full movies
  with automatic tracks. Checked: Zenodo page and API, zip listing, paper full text.'
