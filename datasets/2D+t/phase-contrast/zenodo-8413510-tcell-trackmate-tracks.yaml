title: T cell dataset for CellTracksColab
short_name: T cell migration movies with TrackMate tracks
description: Ten phase-contrast/brightfield time-lapse movies (TIFF) of primary mouse CD4+ T cells migrating on ICAM-1 or
  VCAM-1 coated surfaces (two conditions, three biological repeats), each with TrackMate output tables (spots, edges, tracks
  CSV) produced automatically with a StarDist detector and the Simple LAP tracker. Released as a test dataset for the CellTracksColab
  platform; 2,297 tracks and 38,852 tracked objects according to the paper.
