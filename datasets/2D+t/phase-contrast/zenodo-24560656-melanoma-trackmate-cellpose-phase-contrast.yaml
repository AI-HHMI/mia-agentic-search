notes: 'Single zip (1.8 GB, 121 files) listed with peek_archive: 16 TIFFs (movies and masks), 4 TrackMate XML sessions, CSV tables, 5 Cellpose .npy files, a 1.2 GB Cellpose model and PDF plots. README says
  each condition has a single repeat and the data demonstrates a protocol workflow (not for biological inference); Cellpose training set is 4 images with masks. Pixel size 1.38 um/px from README. Protocol
  paper (Cold Spring Harb Protoc 2026) has no DOI on the record, so no paper was read. enricher: movie/mask axes tyx and dtypes from samples.'
