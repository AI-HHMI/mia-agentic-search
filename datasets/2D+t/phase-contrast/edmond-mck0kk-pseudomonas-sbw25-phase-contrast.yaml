notes: 'data.zip (11.2 GB) holds assets/sets/all_training_val_whole_series (308 img/seg/wei training, 88 validation),
  small_training_val_whole_series (177 / 49), sets/test (16 images + masks), 39 trained .hdf5 models, scripts and
  notebooks (README.md). Paper (SciTePress): 34 time series, 412 images of 2048x2048 px at 100x on a Zeiss Axio
  Imager Z2, manual masking in Photoshop/Affinity Photo; splits 26 series (308) train, 7 (88) validation, 1 (16)
  test. Pixel size not stated in the paper or README. Dataset license CC0 on Edmond. enricher: channels 1 -> null
  (train/val TIFFs hold 2 channels, test TIFFs 1); size_bytes adds the second Edmond file (143 KB weight map); member
  counts corrected from the zip listing.'
