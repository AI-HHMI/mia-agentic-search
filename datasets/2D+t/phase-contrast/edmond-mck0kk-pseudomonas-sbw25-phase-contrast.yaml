  notes: 'Listing: data.zip central directory read by range requests with a short requests script (tools/listing.py
    and peek_archive.py do not follow the Edmond 303 redirect to presigned S3); sizes from the Dataverse API (both
    files). Sampled (zip members, <=52 MB): README.md, config/*.json, train img/seg/wei 2162_s01_T01 and test 2159_s01_T07
    + mask; value ranges are from these files. normalization none is inferred (uint16 camera counts, no clipping).
    small_training_val_whole_series appears to be a subset of the complete set (not verified file by file). Voxel
    size not found: TIFF headers disagree (train img XResolution 246153.846 px/cm = 40.6 nm, train mask 625230.8
    px/cm, test img 72 px/micron default), so none is trusted; paper (SciTePress PDF) gives 100x on Zeiss Axio Imager
    Z2 only; README and configs state none. Weight maps (wei/, wei_val/: float32 2048x2048, 0-1, DeLTA loss weights)
    are not listed as an array (miao has raw/ and labels/ only). Download: data.zip is one direct file (range requests
    work) but edmond.mpg.de is not on the TensorSwitch allowlist.'
