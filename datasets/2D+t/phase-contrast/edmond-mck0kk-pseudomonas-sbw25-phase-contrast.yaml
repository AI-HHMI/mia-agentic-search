notes: 'data.zip (11.2 GB, member list read from the zip central directory via range requests) holds assets/sets/all_training_val_whole_series (309 img/seg/wei training, 89 validation), small_training_val_whole_series (178 training, 50 validation), sets/test (images plus masks), 39 trained .hdf5 models, training scripts and notebooks (README.md describes them). The paper (SciTePress, CC BY-NC-ND) states 34 time series, 412 images of 2048x2048 px at 100x on a Zeiss Axio Imager Z2, manual masking in Photoshop/Affinity Photo; its splits are 26 series (308 images) train, 7 series (88 images) validation, 1 series (16 images) test. Pixel size not stated in the paper or README, so voxel_size_nm is left null. The dataset page lists no separate license for the paper; dataset license is CC0 on Edmond. No mask-count check against the 412 figure (zip lists 398 training/validation images plus test).'
