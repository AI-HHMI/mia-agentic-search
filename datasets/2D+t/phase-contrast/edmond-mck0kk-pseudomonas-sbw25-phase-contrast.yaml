short_name: Pseudomonas cell segmentation (phase contrast)
description: Phase contrast time series of growing Pseudomonas fluorescens SBW25 cultures (34 series, 412 images
  of 2048x2048 pixels, Zeiss Axio Imager Z2, 100x) with manually drawn binary cell masks and weight maps, split
  into training, validation and test sets; used to retrain DeLTA2 for bacterial segmentation. The archive also holds
  trained models and training code.
