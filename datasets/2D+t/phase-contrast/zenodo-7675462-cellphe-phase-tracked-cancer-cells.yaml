notes: 'Segmentation/tracking ROIs come from Phasefocus Cell Analysis Toolbox (automatic); segmentation-error ground truth
  curated for classifier training (paper Methods). Files: 231_Doxorubicin.zip, 231_Docetaxel.zip, MCF7_Docetaxel_.zip (nested
  per-well zips, full time-lapses), example_data.zip (4 wells x 481 tif frames, .roi files, CSV tables) and README.md. Splits:
  training/test CSV sets in example_data. enricher: voxel size 812.2824 nm from the ImageJ TIFF calibration of 25112020_D3_1
  frames (was null); other wells are uncalibrated, but 615 px x 812 nm matches the stated 500 um field of view. enricher:
  size from Zenodo file listing (confirmed).'
