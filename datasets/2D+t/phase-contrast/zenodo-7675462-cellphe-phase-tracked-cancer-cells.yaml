notes: 'Segmentation/tracking ROIs come from Phasefocus Cell Analysis Toolbox software
  (automatic), not manual annotation; ground truth for segmentation errors was curated
  for classifier training (paper Methods). Pixel size not stated on Zenodo page, example_data.zip
  listing or paper Methods (only 500x500 um field of view, x20), so voxel size is
  null. Files: 231_Doxorubicin.zip, 231_Docetaxel.zip, MCF7_Docetaxel_.zip (full time-lapses)
  and example_data.zip (1924 tif frames, 71452 .roi files, 12 CSV; listed with peek_archive).
  Contents of the three large zips were not listed. Splits: training/test CSV sets
  (TreatedTraining, UntreatedTest, ...) in example_data.'
