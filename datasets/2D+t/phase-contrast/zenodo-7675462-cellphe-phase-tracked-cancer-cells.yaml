short_name: CellPhe tracked cancer cells (quantitative phase)
description: Phasefocus Livecyte quantitative-phase time-lapse images of MDA-MB-231
  and MCF-7 breast cancer cells (untreated and treated with docetaxel or doxorubicin),
  imaged for 48 h at 6-minute intervals (481 frames per well), with per-cell boundary
  ROIs, tracking feature tables and curated lists of correctly segmented cells vs
  segmentation errors. An example_data.zip contains a subset of phase frames, ImageJ
  .roi files and CSV feature tables.
