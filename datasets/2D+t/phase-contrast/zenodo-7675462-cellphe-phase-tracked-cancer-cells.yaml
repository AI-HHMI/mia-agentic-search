  notes: 'Listed with tools/listing.py (Zenodo API, 5 files, 19,321,280,180 B; example_data.zip expanded, 73,446 members;
    the three large zips hold nested per-well zips whose contents were not listed). Probed 4 frames: 615x615 (or 614x614)
    yx, uncompressed; uint16 in 3 wells, uint8 in 05062019_B3_3. value_range from one uint16 sample (D3_1 frame 33): [0, 65535],
    the uint8 frame spans [0, 255]; both saturated, no docs on scaling, so normalization unknown. Voxel size: ImageJ calibration
    812.2824 nm in D3_1 frames; other wells say inch/none; the feature table''s Position (um) / Pixel Position ratio (~0.82
    um) agrees. Paper states only a 500 x 500 um field of view. Labels are automatic Phasefocus segmentation/tracking (ImageJ
    ROIs, not masks), and the curated CorrectSegs/SegErrors tables label tracked cells as correct or erroneous. 2D+t is not
    covered by the miao layout yet.'
