  notes: 'Zenodo listing (1 zip, 130,881,898,249 B exact) plus the zip central directory (851,987 members).
    Over 50 GB, so no auto-download. A scratch script (repo peek_archive/sample helpers + PIL) read the
    central directory once and pulled 3 PNG members, the Readme and the first 3 kB of the labels CSV (423
    kB logged; the ~100 MB central-directory reads are not counted). Observed values come from one sample
    each. Phase crop: 16-bit grey PNG 1500x52, range 9838-65504. Phase mask: 8-bit {0,255}, so binary.
    Fluor mask: RGBA 1500x52x4 with 116 distinct values, so encoding unknown. The labels CSV gives the
    per-trap species label (a class-per-trap table, hence encoding other). The Readme lists scripts/labels.csv,
    but that file is not in the archive. segment_data.h5 (55 GB) was not probed. The archive also ships
    code, notebooks, pickles and an Apptainer image; none were run or unpickled.'
