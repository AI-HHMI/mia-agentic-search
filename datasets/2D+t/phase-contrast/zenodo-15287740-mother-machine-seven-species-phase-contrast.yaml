notes: 'Single 131 GB (130.9 GB) zip, a replication package (peek_archive: 851,987 files, 841,974 PNG
  about 101 GB, plus models, HDF5 caches, pickles, code and an Apptainer image that were not opened).
  n_items is the paper''s count of traps (18,101 training traps from 16 experiments plus 1,399 test traps);
  frames total about 620,000 per the Zenodo description. Species labels come from a labelling tool combining
  fluorescence channels, with 355 training traps adjusted or discarded and test-set labels manually corrected
  (paper). Segmentation masks: 55,000 phase masks were generated by a U-Net model and 1,000 fluorescence
  masks were hand-drawn (paper Methods), so most masks are not manual. The paper trains on 16 experiments
  and tests on one mixed-species experiment, but no split file was identified, so splits_provided is false.
  Pixel size not stated in the paper or Zenodo page, so voxel_size_nm is null; trap crops are around 52
  px wide. The record is large: do not auto-download.'
