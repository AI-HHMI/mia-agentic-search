notes: 'The Zenodo record has no description; the CC-BY-4.0 license is the one in the Zenodo API record.
  Zip index read with peek_archive (2406 files, 165 MB uncompressed): sequences 01 and 02 with 300 raw
  frames each, 2 gold SEG masks per sequence, 300 silver ST/SEG masks, 300 GT/TRA marker images plus
  man_track.txt, and ERR_SEG folders. Microscope, objective, pixel size (1.6 um) and 10 min interval
  are from the CTC 2D dataset table, not the Zenodo page; the paper text does not state them. Organism
  not stated on the Zenodo page, CTC table or paper text (only "PSC, pancreatic stem cells"), so left
  empty. Gold segmentation is very sparse (2 frames per sequence); silver truth is computer-generated.
  Test set annotations are secret. Sibling CTC datasets (U373, HeLa, GOWT1, SIM+) are already catalogued
  as separate Zenodo records.'
