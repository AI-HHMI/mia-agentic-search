short_name: Pancreatic stem cell tracking (phase contrast)
description: Two phase-contrast time-lapse sequences (01 and 02, 300 frames each) of pancreatic stem cells
  from the Cell Tracking Challenge training set (Olympus IX-81, UPLFLN 4XPH objective, 1.6 um pixels,
  10 min interval). The archive holds raw frames, a very sparse manual gold-truth segmentation (2 frames
  per sequence), gold-truth tracking markers with man_track.txt lineage tables for every frame, and
  computer-generated silver-truth segmentation for every frame. Deposited on Zenodo by the Cell Tracking
  Challenge.
