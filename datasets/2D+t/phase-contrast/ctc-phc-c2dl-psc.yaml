notes: 'Training zip: 01 and 02 with about 300 frames each (0.1 MB tif per frame), GT/TRA 301 masks per sequence, only 2 gold SEG frames per sequence, plus ST/SEG silver masks for 300 frames each. Olympus IX-81 with UPLFLN 4XPH objective, 1.6 um pixels and 10 min time step per the CTC page. Species of the pancreatic stem cells was not stated on the pages read, so organism is left empty. Custom terms from the CTC datasets page: attribution required (cite the Nature Methods papers); non-CTC scientific use needs organizer permission, commercial use needs permission, cloning of the datasets and their annotations is prohibited. Size is the compressed training zip from the listing; n_items counts the two training sequences (01, 02). The Nature Methods paper (10.1038/nmeth.4473) is not open access (only its Europe PMC abstract record was read), so annotation procedure is left unknown. Checked: CTC 2D dataset page, CTC terms page, training zip listing.'
