notes: 'Training zip: 01 and 02 with 300 frames each, GT/TRA 300 masks + man_track.txt per sequence, only
  2 gold SEG frames per sequence, plus ST/SEG silver masks for 300 frames each. Olympus IX-81 with UPLFLN
  4XPH objective, 1.6 um pixels and 10 min time step per the CTC page. Species of the pancreatic stem
  cells was not stated on the pages read, so organism is left empty. Custom terms from the CTC datasets
  page: attribution required (cite the Nature Methods papers); non-CTC scientific or commercial use needs
  organizer permission; cloning of the datasets and annotations is prohibited. n_items counts the two
  training sequences. The Nature Methods paper is not open access, so annotation procedure is left unknown.
  enricher: size_bytes = 145,227,316 B from the complete zip listing (was 145.2e6); frames are 576x720
  uint8.'
