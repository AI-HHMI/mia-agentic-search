notes: 'Zenodo + archive README: videos every 2 min for 16.7 h, 1002 x 1004 px at 0.802 um/pixel, drift-corrected
  to 983 x 985 px. Zip: train 40 input/label videos, val 28, test 16 (n_items 94), each also split frame by frame
  in stack2im/, plus CTC-format SEG masks for the 16 test videos. enricher: dimensionality 2D -> 2D+t: README says
  inputs are videos and labels hold "cell segmentation and tracking annotations"; the files are multi-page TIFFs,
  one page per frame. enricher: labels are instance IDs kept across frames (sample: IDs 1-3 in all 3 frames).'
