notes: 'OSF project ysaq2: 3 experiment components, each with 16 per-field-of-view "Data" components (48 sequences) plus Image_Verification,
  Annotation_Human and Annotation_Computer (OSF API). Sample component exp1_F0001: 1,013 TIFFs of 2,896,236 B each (about
  2.9 GB per sequence, roughly 140 GB total; size_bytes left null). Pixel size 1.3 um from the paper (5x 0.15 NA, Zeiss Axiovert
  T135V). License CC-BY 4.0 per OSF API. Manual ground truth is partial (>=3 parent cells per sequence; one sequence fully
  annotated); annotations are centroids with states, not masks. Files span about 55 OSF components. Not checked: bit depth
  in headers, frame interval.'
