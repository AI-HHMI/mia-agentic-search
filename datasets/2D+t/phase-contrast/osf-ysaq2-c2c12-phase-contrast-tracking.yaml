schema_version: '1.2'
id: osf-ysaq2-c2c12-phase-contrast-tracking
title: C2C12 myoblast phase-contrast time-lapse sequences with manual and computer-aided cell tracking annotations
short_name: C2C12 myoblast tracking (phase contrast)
description: '48 phase-contrast time-lapse sequences (about 3.5 days each, roughly 1,000 frames of 1392 x 1040 px) of mouse
  C2C12 myoblasts under four media conditions (control, FGF2, BMP2, FGF2+BMP2) across three experiments. Each sequence has
  XML cell-tracking annotations: manual ground truth for at least 3 parent cells and their descendants (one sequence fully
  annotated) and computer-generated tracks for all cells, with mitosis, apoptosis and field-of-view entry/exit states.'
