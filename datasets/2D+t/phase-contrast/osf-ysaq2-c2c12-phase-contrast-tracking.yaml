  notes: 'Listing: OSF API - project ysaq2 has 3 experiment components (acfj9, rd6h3, br6cw); acfj9 has 16 Data components
    plus Annotation_Human (17 XML), Annotation_Computer and Image_Verification. Only exp1_F0001 was listed in full (1,013
    TIFFs x 2,896,236 B = 2.93 GB); the other 47 sequences were not, so no confirmed size (about 140 GB if all are similar;
    not estimated because frame counts per sequence are not listed). Probe: exp1_F0001-00175.tif plain single-page uint16
    1040x1392, uncompressed. Image_Verification/exp1_F0001 Data.csv (the dataset''s own per-frame stats) gives Min 305-380
    and Max 4095 in the first frames, i.e. 12-bit data saturating at 4095. XML head read with a range request. Files are served
    via osf.io/download/<id>/ redirecting to storage.googleapis.com (download-check usable, range requests). Voxel size unchanged
    (1.3 um, paper). 2D+t: outside the miao layout (3D, 3D+t).'
