notes: >-
  File list: 1,467 files, 98.1 GB (489 TIFF movies, 489 track CSV, 489 track JSON) in condition folders named by
  chemoattractant range (for example Cmin-0-Cmax-250nM); one row per detected cell position. Study page states 10x
  objective, 0.45 um pixel, one frame every 30 s (CSV t column steps 0.5 min). Tracks come from an in-house FIJI
  plugin (segmentation and tracking), so they are automatic, not hand-curated. The preprint full text is not open
  access in Europe PMC; only the abstract was read. No separate segmentation masks are in the file list.
