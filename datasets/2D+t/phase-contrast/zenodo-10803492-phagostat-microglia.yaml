title: PhagoStat microglia phagocytosis time-lapse dataset with manually annotated cell masks
short_name: Microglia phagocytosis cell masks (phase-contrast)
description: Phase-contrast plus fluorescence time-lapse recordings (20 scenes x 7 h, 1 frame per 2 min) of primary
  mouse microglia (wild-type and FTD-mutant) engulfing fluorescent TDP-43 aggregates. Includes 226 manually annotated
  images with 6,430 individual cell masks (61 labelme-annotated train/validation images and 165 Point2Cell-annotated
  test images), plus algorithm-generated instance masks and tabular features for the full video set.
