notes: 'Manually annotated subset (manually_annotated_data.zip, 1306 tif, ~0.5 GB) holds img and binary_mask pairs
  in train/test sequence folders (1024 px versions); paper states raw frames are 2048x2048 at 0.103 um/px (Zeiss
  Axio Observer 7, 63X) and were downsized to 1024. Masks are binary per-cell masks labelled as instance masks in
  the paper (6,430 cell masks). The full 94 GB video zip contains algorithm-generated masks (not manual). Publication
  date not checked on the page; left null. Objective/modality (phase-contrast cells + fluorescent aggregate channel)
  from paper Methods. enricher: exact size from Zenodo listing (2 zips, 236,593 members); video zip also holds PNG,
  GIF and CSV files, so png/other added to formats. Manual masks are 1-bit TIFFs.'
