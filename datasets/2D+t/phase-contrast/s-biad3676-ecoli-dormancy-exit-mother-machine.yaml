notes: 'Study record (BioStudies API) and the FTP/HTTP file listing read: ome_tiff/images and ome_tiff/hypothesis_16_labels have 2,795 OME-TIFF files each (22.7 GB and 1.5 GB), plus annotations/ (2 zips, 5.2 GB), image_data/ (1 zip, 20.4 GB) and raw_images/ (one 316.8 GB .nd2 file); total about 366.6 GB (HTTP index sizes are rounded). Masks are software-generated (Omnipose checkpoints trained on SyMBac synthetic mother-machine images), not manual; tracks come from a Trackastra workflow with local repair and curation, hence source mixed. The study text mentions a manuscript but no paper citation or DOI is listed in the record, so none was read; pixel size and acquisition settings come from the study record. The raw .nd2 file is one 316.8 GB acquisition file. Time-lapse is 30 s phase contrast with mCherry every 5 min; the 721 time points and 2,795 trenches come from the annotation description.'
