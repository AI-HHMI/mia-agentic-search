id: s-biad3676-ecoli-dormancy-exit-mother-machine
title: Annotated timelapse imaging of Escherichia coli dormancy exit in a mother machine microfluidic device
short_name: E. coli mother machine masks and tracks (phase)
description: Phase-contrast time-lapse imaging (30 s interval, 40x, 0.108 um pixels, plus an ancillary mCherry channel every 5 min) of E. coli exiting stationary phase in a mother machine, extracted into 2,795 trench time series of 721 time points. Includes integer-labelled instance segmentation masks (primary Omnipose hypothesis as OME-TIFF labels, plus multiple checkpoint-derived alternative hypotheses) and curated mother-lineage tracks.
