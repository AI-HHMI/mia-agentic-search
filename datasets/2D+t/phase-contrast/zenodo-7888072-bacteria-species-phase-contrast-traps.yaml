notes: 'Checked the Zenodo record, replication_package.zip index (127,909 files: 126,733 .png, 1,086 .csv, 39 .tiff, 3
  network .pth files, notebooks and code; 17.4 GB uncompressed) and the paper (Europe PMC full text). The paper
  states 3,396 selected single-species traps with 32 frames each; the true labels come from FISH fluorescence images
  of the final frame, not manual annotation, so annotation source is automatic. The exact label file (which CSV holds
  species class) was not opened, hence annotations_verified false. Pixel size from the paper (33 pixels/um, about
  30 nm), for the original 1824x3888 frames; cropped trap images may be rescaled, not checked. The paper split is
  85/15 by trap, defined in code, not as folders, so splits_provided is false. n_items counts all .png files (phase and
  fluorescence frames), not videos. The zip also carries trained networks and a Python replication package.'
