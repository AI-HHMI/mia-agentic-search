description: Phase-contrast time-lapses (32 frames, 2 min interval) of 3,396 single microfluidic traps
  with E. faecalis, E. coli, K. pneumoniae or P. aeruginosa, cropped per trap, with species labels taken
  from species-specific FISH fluorescence images captured after the time-lapse; replication package with
  code and trained networks.
