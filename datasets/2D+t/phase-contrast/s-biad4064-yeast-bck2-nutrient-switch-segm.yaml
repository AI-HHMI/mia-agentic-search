title: Live Cell Microscopy of S. Cerevisiae for the Paper "Single-cell imaging reveals a key role of
  Bck2 in yeast cell size adaptation to nutrient challenges"
short_name: S. cerevisiae time-lapse segmentation, tracking
description: Phase-contrast (with some mCitrine and mScarlet-I fluorescence) time-lapse movies of haploid
  W303 budding yeast strains in a microfluidic device, at 3-minute intervals, in steady state in SCD or
  SCGE and through a nutrient switch. The analysed data holds about 600 positions with Cell-ACDC cell
  segmentation masks (YeaZ, manually corrected), tracking data and cell-cycle and mother-bud annotations,
  plus smFISH, qPCR and raw files.
