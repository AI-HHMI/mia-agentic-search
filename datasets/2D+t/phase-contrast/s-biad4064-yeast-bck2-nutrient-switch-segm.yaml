notes: 'Counts come from the study file_table.tsv (599 phase-contrast images, 621 segmentation files, 222 nucleus segmentation files, 680 tracking files,
  148 fluorescence images, 402 cell-cycle property tables); 39 segmentation entries and 606 table rows are marked unresolved,
  so not every position is annotated. Paper Methods say cells were segmented with YeaZ in Cell-ACDC, then masks were manually
  corrected and bud-mother pedigrees assigned; it is not stated that every position was corrected, so source is proofread with
  that caveat. Pixel size 0.0866 um is from one position metadata.csv (assumed the same everywhere). Size and download_url left
  unset: files are spread over many folders (smFISH, qPCR, raw_microscopy_files, analysis tables) and no byte totals were seen.
  Image stacks are about 320 frames each; the paper analysis code (github SchmollerLab/Nutrient-switch-analysis) is not a baseline
  model. Authors are given as in Europe PMC.'
