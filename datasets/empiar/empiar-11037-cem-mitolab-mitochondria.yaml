schema_version: '1.1'
id: empiar-11037-cem-mitolab-mitochondria
title: 'CEM-MitoLab: ~22K cellular EM 2D images with mitochondrial instance label maps'
short_name: Mitochondria instance segmentation (cellular EM)
description: CEM-MitoLab contains 21,860 annotated grayscale 2D electron microscopy image patches (mostly
  224x224 px) with paired mitochondrial instance label maps (135,285 instances in total), drawn from a
  heterogeneous set of TEM, STEM and FIB-SEM/volume EM sources (a subset of the CEM1.5M collection). It
  was assembled to train the MitoNet generalist mitochondria segmentation model.
