id: empiar-10989-rpe1-actin-microtubules
title: Cryo-electron tomograms of RPE1 cells with comprehensive annotation of actin filaments and microtubules
short_name: RPE1 actin and microtubule annotations (cryo-ET)
description: Three cryo-FIB lamella cryo-electron tomograms of human RPE1 cells (4x binned, 1.348 nm voxels)
  with dense ground-truth segmentation volumes of actin filaments (all 3 tomograms) and microtubules (1
  tomogram), plus Amira actin coordinates. Raw multi-frame tilt micrographs, tilt-series stacks and DeePiCt
  predictions are also included.
