notes: 'Voxel size: EMPIAR API lists pixel sizes as nm (1.663, 2.638, 9.98, 15.83) but the paper Methods give Angstrom (1.6626 A and 2.638 A raw pixels; 9.98 A reconstructed voxels for the CHX set), so 0.998 nm is given for the CHX-treated reconstructed tomograms; vehicle-treated tomograms are binned differently (API 15.83, i.e. ~1.583 nm). Total size 764.2 GB per EMPIAR, size_bytes not confirmed by a complete file listing (FTP listing timed out). Segmentations: membranes traced with Membrain-Seg, OMM/IMM labels separated and manually curated (Magic Wand + brush) per paper Methods; n_items counts reconstructed tomograms (38 + 49). Not checked: per-tomogram voxel size of vehicle set beyond API value.'
