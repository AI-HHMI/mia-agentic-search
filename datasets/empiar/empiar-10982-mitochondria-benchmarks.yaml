title: Seven benchmark datasets of instance segmentation of mitochondria (6 volume EM + 1 TEM set of 100 images)
short_name: Mitochondria instance segmentation (vEM + TEM)
description: Benchmark image/label-map pairs for mitochondria instance segmentation. Six volume EM benchmarks (C. elegans, fly brain, HeLa cell, glycolytic muscle, rat salivary gland, Lucchi++ neuronal) each provide a grayscale
  TIFF volume and a label-map TIFF, plus a set of 100 2D TEM images with instance label maps and a metadata CSV. Released alongside the MitoNet / CEM-MitoLab paper.
