notes: 'Segmentations are the h5 mitochondria masks of the three raw volumes (brainstem 3983 images at 15 nm/40
  nm; intestine 1000 images at 8 nm/50 nm; testis 2605 images at 15 nm/50 nm per paper). Masks come from a pre-trained
  3D U-Net (model-predicted, then assigned/proofread via webKnossos), not fully manual labels; the paper''s human
  ground-truth training sub-volumes were not seen in the EMPIAR listing. Voxel size given is the brainstem/testis
  lateral value; intestine is 8 nm lateral, 50 nm z. Size is the total entry size (996.4 GB) from the search API.
  Download method (Aspera/FTP/HTTP) not checked in detail. Checked dataset page, API record and paper Methods. enricher:
  FTP listing has 3893 brainstem slices (paper: 3983) and a stray raw_image/ folder of .partial/.aspx upload leftovers;
  masks are per-slice uint32 instance IDs in h5 (sampled).'
