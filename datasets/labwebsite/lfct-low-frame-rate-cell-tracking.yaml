notes: 'The paper (Data availability) gives the Zenodo DOI 10.5281/zenodo.20186357, but that DOI and record did not resolve on 2026-09-30 (doi.org "DOI Not Found", Zenodo API 404), so the lab website, which links per-cell-line downloads on Clemson Box, is used as the host. CC-BY 4.0 is stated in the paper only, not on the lab site. Pixel size is not stated on the lab site or in the paper text retrieved. Paper reports 53 annotated sequences; the paper states 3-4 days per sequence while the site says 1-2 days. The annotation files were not seen in a file listing (Box folders were not opened). No train/test split is stated. Only TrackMate XML is documented as released.'
