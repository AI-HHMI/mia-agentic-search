schema_version: '1.1'
id: lfct-low-frame-rate-cell-tracking
title: 'LFCT: Low Frame-rate Cell Tracking benchmark dataset for long-term live-cell microscopy'
short_name: Low-frame-rate cell tracking (phase/fluorescence)
description: Multi-day live-cell time-lapse sequences of four human cell lines (MCF10A, MDA-MB-231, HEK293T, U87) imaged on a BioTek Cytation 5 at 10x and 20x with phase contrast and nuclear H2B-mRuby fluorescence at 10-15 minute intervals. Ground truth covers cell identities, temporal links, lineages and mitosis events, made with Cellpose segmentation plus TrackMate LAP tracking and manual curation in TrackScheme. Sequences are also provided sparsified at gap factors 1, 2, 4 and 8.
