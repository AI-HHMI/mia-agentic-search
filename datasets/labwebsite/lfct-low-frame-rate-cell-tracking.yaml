title: 'LFCT: A Benchmark Dataset for Low-Frame-Rate Cell Tracking in Long-Term Live-Cell Microscopy'
description: Multi-day (1-2 day) live-cell time-lapse sequences of four human cell lines (MCF10A, MDA-MB-231, HEK293T, U87) at 10x and 20x, with sparse temporal sampling and ground-truth annotations for cell identification, temporal linking, lineage and mitosis events.
