notes: "Annotation-only release: the zip (60 TIFFs, 204.6 MB, listed with peek_archive) holds label images and consensus, not raw images; raw images come from the Cell Tracking Challenge Fluo-C3DL-MDA231 (Kamm lab, MIT; Olympus FluoView F1000, 20x/0.7), not fetched here. Voxel size 1.242x1.242x6.0 um, 30x512x512 voxels, 12 time points per sequence, and CC BY 4.0 come from the arXiv paper; the CBIA page does not state a license. n_items = 2 sequences. Only 24 annotated volumes in total, so a small dataset. Paper full text not in Europe PMC; read via arXiv HTML."
