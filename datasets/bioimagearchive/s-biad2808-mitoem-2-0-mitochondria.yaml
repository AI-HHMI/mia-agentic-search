title: "MitoEM 2.0 - A Benchmark for Challenging 3D Mitochondria Instance Segmentation from EM Images"
short_name: "MitoEM 2.0 mitochondria instance seg (vEM)"
description: >-
  Benchmark of eight volume EM subsets (FIB-SEM, SBF-SEM and serial-section SEM) from mouse, human and
  Drosophila samples with expert-verified 3D mitochondria instance labels, emphasising dense packing,
  hyperfused networks and thin filamentous connections. Provided as NIfTI volumes in an nnU-Net layout
  with official train/validation/test splits and checksums.
