notes: >-
  Voxel size varies per subset and is not recorded as a single value. Per the paper (read via fetched summary,
  not the tool-extracted full text, which was rate limited): ME2-Beta/Jurkat/Macro/Podo/Sperm 16x16x16 nm FIB-SEM;
  ME2-Mossy/Pyra 8x8x30 nm ssSEM; ME2-Stem 8x8x30 nm SBF-SEM. License differs between sources: BioStudies
  states CC0, the Zenodo copy states CC-BY-4.0; the BioStudies (CC0) value is recorded, reviewer should confirm.
  Sample archives (Podo, Stem) were listed with peek_archive: imagesTr/imagesTs/labelsTr/labelsTs .nii.gz plus
  split.json and dataset.json. Total size is the sum of the eight Zenodo zips; volume count not stated on the page.
