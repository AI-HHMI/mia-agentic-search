schema_version: '1.2'
id: s-biad634-nuclei-fluorescence
title: An annotated fluorescence image dataset for training nuclear segmentation methods
short_name: Nuclear segmentation in tissue and cells (IF)
description: 79 expert-annotated DAPI/immunofluorescence images (7813 nuclei) of tumor tissue sections,
  touch imprints, bone marrow cytospins and cell lines (neuroblastoma, ganglioneuroblastoma, Wilms tumor,
  HaCaT), with labeled instance masks (TIFF) and polygon SVGs, plus a suggested train/test split and single-nuclei
  expert annotations.
