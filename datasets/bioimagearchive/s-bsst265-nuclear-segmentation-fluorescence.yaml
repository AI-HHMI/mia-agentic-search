id: s-bsst265-nuclear-segmentation-fluorescence
title: "An annotated fluorescence image dataset for training nuclear segmentation methods"
short_name: "Human DAPI nuclei segmentation (fluorescence)"
description: >-
  79 expert-annotated DAPI-stained fluorescence images of human cells and tissue (neuroblastoma
  tumor touch imprints and cytospins, ganglioneuroblastoma, Wilms tumor, neuroblastoma cell lines,
  HaCaT keratinocytes) with 7,813 annotated nuclei, imaged on widefield and confocal microscopes at
  10x-63x. Annotations are labeled masks and SVG polygon contours curated by a pathologist.
