notes: "Item count 44 = 16 vessel + 16 nerve + 12 axon raw patches (from the study's contiguous_raw_*.tsv file lists), each with a matching gt mask. Format is .mha (MetaImage), not in the schema enum. Voxel size differs per structure (vessel 1.625 um xy / 3 um z; nerve 5.9 um xy / 8 um z; axon 0.4 x 0.36 x 0.26 um) so left null. No paper is linked on the BioStudies record (Publication entry empty); the SELMA3D data page describes the 2024 data and was not used. Dataset size not stated. Companion sets: isolated structures S-BIAD2110, unannotated S-BIAD2119/S-BIAD3277."
