description: 35 unannotated 3D light-sheet volumes of cleared mouse and human brain (9 blood-vessel, 4 cell-nucleus,
  18 c-Fos-positive cell and 4 amyloid-plaque images), released as the self-supervised pretraining set of the SELMA3D
  challenge at MICCAI 2024. Companion annotated patches are in S-BIAD1196.
