title: "3D light-sheet microscopy data for SELMA3D 2026 challenge - contiguous structures - training subset with no annotations - large 3D LSM images"
short_name: "SELMA3D unannotated vessel/nerve volumes (LSM)"
description: >-
  Large unannotated 3D light-sheet microscopy images of contiguous structures (blood vessels, arteries, lymphatic
  vessels, sympathetic/peripheral/cranial nerves, cortical neurons, axons) from mouse, human embryo and axon
  samples, released as the label-free training set for the SELMA3D 2026 challenge on self-supervised learning for
  3D light-sheet microscopy segmentation.
