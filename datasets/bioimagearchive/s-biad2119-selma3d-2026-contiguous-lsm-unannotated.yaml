notes: "Explicitly released as the unannotated self-supervised training set of SELMA3D 2026, so usable without labels. n_items 26 = 9 whole-brain vessel + 3 artery + 3 sympathetic nerve + 3 peripheral nerve + 3 lymphatic + 1 p75 + 1 CTIP2 + 1 NF-H + 1 Beta3-tubulin + 1 axon image (from study components). Stored as per-plane 2D TIFF slices. Voxel size varies by structure (1.625 um xy for most, 1.8/1.866/2.71 um for others, z-steps 2-4 um; axon 0.4x0.36x0.26 um) so left null. Organism list omits the axon sample, whose BioStudies biosample entries are labelled inconsistently (Mus musculus/Macaca mulatta/human). No linked paper on the BioStudies record (Publication empty); challenge site https://yingchen7.github.io/SELMA3D-2026.github.io/Home.html not fetched. Total size not stated. Companion sets: S-BIAD3277 (unannotated patches), S-BIAD2106/2110 (annotated)."
