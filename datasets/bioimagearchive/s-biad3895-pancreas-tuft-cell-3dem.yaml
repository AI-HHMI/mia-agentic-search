title: "Three-dimensional electron microscopy of an injured pancreas lobe"
short_name: "Mouse pancreas tuft cell 3D EM segmentation"
description: >-
  A SWIFT-aligned serial-section 3D electron microscopy volume of mouse pancreas (specimen A7827)
  containing tuft cells and regions of acinar-to-ductal metaplasia, with six arivis Vision4D
  segmentation layers: full segmentation, second tuft cell, ADM cell nuclei, ADM nuclei plus second
  tuft cell, and tuft-cell actin rootlets (as a single label and individually labelled).
