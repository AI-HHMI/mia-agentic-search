notes: 'Also mirrored in IDR as idr0167 (projects 3351-3353). Two datasets: epifluorescence voxel 188x188x500 nm
  (90 z-stacks, 19,170 images) and confocal 182x182x200 nm (625 z-stacks, 93,750 images); voxel_size_nm lists the
  epifluorescence value. n_items = 715 z-stacks. Image formats: standard and OME-Zarr per the BioStudies summary;
  file listing not directly enumerable via API, so only ome-zarr is recorded. Labels are binary G1 vs S/G2 for ~4,076
  cells (paper) with Cellpose masks; ground-truth train/val/test 70/20/10 split done in code, not provided as files.
  Annotation files not individually verified.

  enricher: formats += tiff; n_items 715 -> 684 (90 40x + 594 60x stacks on FTP); channels confirmed 3 (zcyx); labels
  seen (annotations_verified).'
