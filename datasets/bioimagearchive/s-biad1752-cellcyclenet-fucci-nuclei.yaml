title: Predicting cell cycle stage from 3D single-cell nuclear stained images (CellCycleNet datasets)
short_name: Fucci2a 3T3 nuclei cell-cycle labels (3D)
description: Fixed interphase mouse 3T3 fibroblasts carrying the Fucci2a cell-cycle reporter, imaged in 3D with
  DAPI, mCherry and mVenus channels on two instruments (40x epifluorescence and 60x spinning-disk confocal). Includes
  3D nuclear segmentation masks (Cellpose) and per-cell G1 vs S/G2 ground-truth labels derived from Fucci2a intensities,
  for training cell-cycle classifiers from DAPI alone.
