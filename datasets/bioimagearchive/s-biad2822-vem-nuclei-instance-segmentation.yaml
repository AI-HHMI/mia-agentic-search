id: s-biad2822-vem-nuclei-instance-segmentation
title: "2D and 3D instance segmentation of nuclei from volume electron microscopy data"
description: >-
  2D and 3D instance segmentation of nuclei from array tomography (AT) and FIB-SEM datasets:
  10 AT and 2 FIB-SEM datasets with paired annotation masks, generated with the NucleoNet model
  and expert manual proofreading in empanada-napari. Samples include human breast cancer cell lines
  and mouse lung tumor / 4T1 cells.
