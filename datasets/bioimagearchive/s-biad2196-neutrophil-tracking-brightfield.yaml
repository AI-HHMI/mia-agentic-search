description: 2D bright-field time-lapse recordings of primary human neutrophil granulocytes
  acquired with the ComplexEye multi-lens array microscope (one frame every 8 s, up
  to 2 h), with manually curated instance segmentation masks carrying consistent track
  IDs over time, provided as OME-Zarr.
