title: "3D Volume Electron Microscopy Dataset of Gold Nanoparticle-Loaded FaDu Tumor Spheroids with Segmentation Annotations"
short_name: "FaDu tumor spheroid cells and nuclei (SBF-SEM)"
description: >-
  One SBF-SEM volume of a FaDu head-and-neck carcinoma tumor spheroid loaded with 50 nm gold
  nanoparticles (10x10x50 nm voxels, about 102x102x35 um), denoised with Noise2Void and registered.
  Provided as an OME-NGFF zarr with model-generated instance masks for cells, nuclei and
  nanoparticles, plus manually annotated ground-truth masks for cells and nuclei on 20 slices
  at two isotropic resolutions (TIFF).
