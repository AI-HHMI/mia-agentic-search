title: Chikungunya Virus-infected Cells TEM Database for Mitochondria Deep Learning-Based Automatic Segmentation
short_name: CHIKV-infected HEK-293T mitochondria (TEM)
description: Thin-section TEM micrographs of mock-infected and Chikungunya virus (attenuated strain 181/25)
  infected HEK-293T cells, with manual segmentation masks of individual mitochondria classified into four
  stages of damage. Released to validate a Res-UNet model for automatic mitochondrial segmentation.
