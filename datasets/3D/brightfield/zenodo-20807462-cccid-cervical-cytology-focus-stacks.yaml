notes: 'Six files on Zenodo: five zips (NILM 105 MB, LSIL 46 MB, HSIL 38 MB, SCC_Others 59 MB, AI subset 232 MB) plus README and structure PDFs; all five zips were listed with peek_archive (about 1,749 / 1,771 / 2,981 / 6,248 JPEG planes for the four classes, i.e. 159 / 161 / 271 / 568 stacks of 11 planes, matching the README; the AI subset holds 12,650 planes = 1,150 stacks and overlaps the main set). size_bytes is the approximate sum of the five zips and n_items counts cell stacks in the main set; download_url is null because there is no single archive. Folder names carry fine cell classes (e.g. Superficial-type dysplastic cells). The README states the CC BY-NC 4.0 license, 1 um focus interval and the Bethesda classes but not the pixel size or scanner model, so voxel size is null (the z step is 1 um). Annotator/pathologist details and splits are not stated; no linked paper. The dataset structure PDF was not read.'
