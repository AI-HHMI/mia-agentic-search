short_name: Cervical cytology 11-plane focus stacks (CCCID)
description: 1,159 nucleus-centred cervical cytology cell images, each an 11-layer multi-focus stack at 1 um focus
  steps, from Papanicolaou-stained specimens digitised on a whole-slide scanner (20x objective equivalent) and classified
  by the Bethesda System into NILM, LSIL, HSIL and SCC/others, plus a curated 1,150-stack subset for AI training.
