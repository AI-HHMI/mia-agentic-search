id: zenodo-23135747-fungal-filaments-brightfield
title: 'Bright-field microscopy of Rhizophagus irregularis fungal filament networks: annotated Z-stacks
  with oriented bounding boxes and a 48-timepoint ND2 time-lapse (Zenodo)'
short_name: Fungal filament oriented boxes (brightfield)
description: Bright-field microscopy of the arbuscular mycorrhizal fungus Rhizophagus irregularis. One
  archive holds 21 Z-stacks (x20 and x4 objectives) as 1,205 annotated PNG slices with per-slice text
  label files used to train an oriented-bounding-box filament detector and a focus model. A second part
  holds a x10 time-lapse of 48 raw Nikon ND2 Z-stacks (about 25 h, about 30 min apart, 5 um Z-step) and
  a manual segmentation TIFF of the final time point.
