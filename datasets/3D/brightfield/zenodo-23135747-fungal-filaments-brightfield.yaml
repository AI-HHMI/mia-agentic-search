notes: 'Read the Zenodo record, API record and README.txt (CC BY 4.0 stated). Zip index of fungal_brightfield_dataset_v1.0.zip
  read with peek_archive: 1,205 PNG images in images/stackNNN/ and 1,205 label txt files in labels/stackNNN/
  (each PNG about 10 MB). A label file was printed: oriented boxes as four corner points. Record total
  about 106.5 GB; the annotated part is the 12.2 GB zip, the 12 time-lapse zips (about 7.6 GB each, raw
  ND2) have no annotations except one manual segmentation TIFF for the last time point (1.6 GB). The associated
  paper is not yet published ("will be linked once available"), so no paper was read; no pixel/voxel size,
  microscope model or annotation procedure is stated on the record (only x20/x4/x10 objectives, 5 um Z-step
  for the time-lapse). Annotation source therefore unknown; dimensionality 3D reflects Z-stacks stored
  as slice PNGs. Full ND2 time-lapse is unlabeled and excluded from the training signal.'
