title: 3D histology data of mouse prostates with manually annotated tumor hotspots
short_name: Mouse prostate sparse 3D histology, tumor masks
description: Six sparse 3D histology stacks of registered H&E-stained mouse prostate sections (171 sections in total, one
  every 50 um, up to 10x magnification, Pten+/- mice aged 11 months) with manually annotated tumor hotspot masks and sample
  masks, as full-resolution PNG sections plus 2x and 4x subsampled copies, CycleGAN-generated IHC and PAS stains and
  nucleus-count feature maps.
