notes: 'Metax file listing: 1,539 files (24.2 GB) in six stack folders (PTENX036-011, -14, -15, -20, -32, -33), each with
  nine subfolders of 25 to 32 PNGs (171 sections in all): Images_FullRes, Images_sub4, and Images_ihc_sub2, Images_pas_sub2,
  Images_orto_sub2 (CycleGAN-generated, not real stains), Masks_sub4, TumorMasks_sub4, nucNumber_100 and nucNumber_400. Description
  is from the Fairdata record. The related Scientific Reports paper (Valkonen et al. 2017) uses the same imaging setup (Zeiss
  Axioskop40, 20x objective for whole slide imaging in its Methods) but is not a paper about these stacks; the pixel size
  of the stacks is not stated in the record or in that paper, and how the tumor hotspots were annotated is not described.
  Data was processed for the SparStVR application. enricher: download_method other (was api): Fairdata IDA download service
  only, no direct file URLs.'
