notes: 'Counts from filelist_pollen.tsv: 93 stacks = 41 brightfield + 41 DIC + 11 Airyscan confocal. Only two taxa so far (family Acanthaceae); the entry will grow
  toward the ~17,000-taxon collection, so this is not yet a classification benchmark. Paper not open access; Methods unread. Who assigned the taxon labels is not
  stated (annotations.source unknown). No train/test split. organisms: Acanthus arboreus = SG-SPLS-PLE-E2641-N/, SPLS-PLE-E2641-cf/; Ruellia haenkeana = SG-SPLS-PLE-E2887/,
  SPLS-PLE-E2887-cf/. modality: BF and DIC = SG-SPLS-*/ (*_BF_*, *_DIC_*); confocal (Airyscan) = SPLS-*-cf/. enricher: voxel size set to null (was 48.9x48.9x300,
  true for only 42 of 93 stacks); subsets differ per tsv and OME-Zarr scale: E2641 BF/DIC 48.9x48.9x300 nm, E2887 BF/DIC 109.5x109.5x280 nm, confocal 35.3x35.3x150
  nm. enricher: size from the study file list (exact bytes, was HTTP-index rounded).'
