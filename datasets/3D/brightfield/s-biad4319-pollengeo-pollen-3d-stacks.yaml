  notes: 'Listing: HTTP index of Files/ (FTP refused) gives 188 files in 4 folders; exact sizes from filelist_pollen.json (186 files, 21,157,852,361 B) plus the two
    file lists (Content-Length). tools/probe.py cannot read zipped OME-Zarr, so headers were read from zarr.json members (peek_archive.py): sharded zarr v3, inner
    codec blosc lz4 + shuffle. Samples (one file each, whole zip read locally with zarr ZipStore): BF 21-1 range [31,205], RGB channels differ; confocal CF_01_SG_01
    range [0,5156], 53% zeros. Value ranges are from one sample per array. Shapes vary per stack (z 82-170, xy 600-1400 px; tsv columns image_Width_px/Height_px/z_layers).
    Voxel size differs per subset (OME-Zarr scale agrees with tsv pixel_size_um / z_layer_spacing_um), so imaging.voxel_size_nm is null; each file carries its own
    scale. No single archive: download_url is the Files/ folder; every .ome.zarr.zip is a direct, range-capable file on ftp.ebi.ac.uk.'
