notes: 'Counts from filelist_pollen.tsv (93 image rows = 41 brightfield + 41 DIC + 11 Airyscan confocal) and the FTP/HTTP index (21.2 GB, sizes rounded). Only two taxa so
  far (Acanthus arboreus, Ruellia haenkeana, family Acanthaceae); the entry says images and taxa will be added until the full ~17,000-taxon collection is public, so
  a classification benchmark is not yet usable. Voxel size: BF/DIC 48.9 nm xy (one subset 109.5 nm) with 280-300 nm z spacing; confocal 35.3 nm xy, 150 nm z (values taken from the
  tsv; the record lists the BF/DIC values). The paper (Plants, People, Planet) is not open access in Europe PMC and its abstract was empty, so Methods could not be read.
  Who assigned the taxon labels (herbarium identification vs. study team) is not stated, so annotations.source is unknown. No train/test split is provided.'
