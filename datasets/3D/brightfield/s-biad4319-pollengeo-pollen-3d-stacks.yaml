title: PollenGEO - The Smithsonian palynology collection (3D pollen image stacks with taxonomic labels)
short_name: PollenGEO pollen taxa (brightfield/DIC/confocal)
description: Digitised pollen from the Smithsonian Tropical Research Institute palynology collection, imaged as 3D z-stacks by transmitted-light brightfield,
  DIC and Airyscan confocal microscopy, each stack stored as a zipped OME-Zarr with per-image taxonomy (species, genus, family, order) in a file-list table.
  The entry is explicitly released to support deep-learning training and is still growing; at this release it holds 93 stacks of two Acanthaceae species.
