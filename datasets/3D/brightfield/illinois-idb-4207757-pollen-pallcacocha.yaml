title: Slide scans, annotated pollen counts, and trained pollen detection models for fossil pollen samples from
  Laguna Pallcacocha, El Cajas National Park, Ecuador
short_name: Fossil pollen slide stacks, Ecuador (brightfield)
description: 'Focal-plane image stacks from fossil-pollen slides of two sediment cores (PAL 1999: 900 annotated
  stacks; PAL IV: 2,986 annotated stacks) with per-grain taxon labels (129 taxonomic types, ~3,985 grains) as bounding
  boxes or circles and ground-truth distance-transform masks for each stack; also a trained detection model.'
