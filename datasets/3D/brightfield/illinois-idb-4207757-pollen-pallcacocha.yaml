notes: 'The Illinois Data Bank landing page, file API and doi.org resolution return 403 from this environment (network
  blocked), so metadata comes from the DataCite record (CC0-1.0, 2025-07-21, descriptions, related DOI) and the
  paper full text (bioRxiv; Methods, Data availability). File listing, file formats, sizes and download URL could
  not be checked: formats set to other (image stack format unknown, not verified), size and download_url null. n_items
  = 900 + 2,986 annotated stacks per DataCite. Voxel size differs by core: PAL IV 146 nm/px xy, 3 or 4 um z steps;
  PAL 1999 225 nm/px xy, 3 um z (paper Methods), so left null. Annotation = center+radius/box and taxon (129 types;
  3,191 PAL IV + 794 PAL 1999 grains); paper uses a detection network, masks are distance transforms of circles.
  Includes a trained model zip (bestValModel_encoder.paramOnly.zip). Preprint of the paper also published in Paleobiology
  2025. Different from other fossil pollen records in catalog (distinct deposit).'
