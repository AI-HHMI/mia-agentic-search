notes: 'Record covers the training set (Zenodo 7444100, 12 HDF5 files); validation (8418961) and test (8419002) are separate
  Zenodo records of the same challenge. No paper found: neither the challenge pages nor the Zenodo records cite one. HDF5
  keys, shapes and the landmark files were not inspected (not documented; no HDF5 reader here). The training set has no annotation
  described; the organisers provide a synthetic-deformation generator. A registration benchmark: signal is paired volumes,
  not labels. License is the Zenodo CC-BY-4.0; the challenge page states none. Voxel spacing is from the challenge data page.
  organisms: Caenorhabditis elegans = c_elegan_pair*.h5, Danio rerio = zebrafish_pair*.h5, Mus musculus = mouse_pair*.h5.
  enricher: channels 1 (single-channel fixed/move datasets).'
