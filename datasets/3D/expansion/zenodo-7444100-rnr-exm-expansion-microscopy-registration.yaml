title: 'RnR-ExM (ISBI 2023): paired 3D expansion microscopy volumes of C. elegans, zebrafish and mouse for non-rigid
  registration (Zenodo)'
short_name: RnR-ExM paired 3D expansion microscopy volumes
description: 'Robust Non-rigid Registration Challenge for Expansion Microscopy (ISBI 2023). 24 pairs of 3D
  volumes (a fixed volume and a volume to align) from three species, with a voxel spacing of 0.1625 x
  0.1625 x 0.4 um. Training set: 4 pairs per species (Zenodo 7444100, 12 HDF5 files, 20.1 GB); validation:
  1 pair per species (Zenodo 8418961); test: 3 pairs per species (Zenodo 8419002). Validation and test
  pairs carry annotated cell structures (nuclei, blood vessels) used as registration landmarks; the
  segmentation maps of the test set are hidden by the organisers. The challenge also ships code to generate
  synthetic rigid and non-rigid training data.'
