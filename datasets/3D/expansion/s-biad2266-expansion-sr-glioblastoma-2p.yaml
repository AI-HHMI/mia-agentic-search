title: Enhancing the effective resolution of intravital microscopy with digital expansion microscopy
short_name: Glioblastoma expansion super-res pairs (2-photon)
description: Two-photon z-stacks of a patient-derived glioblastoma xenograft expressing membrane-targeted GFP (mGFP) in mouse.
  Provides paired synthetic low-resolution (synth_crop) and real expansion-microscopy-based high-resolution (original_crop)
  3D crops for training and validation (208 train and 24 val pairs of TIFF stacks), plus one real, roughly aligned low-/high-resolution
  example for testing. Released through AI4Life Open Calls.
