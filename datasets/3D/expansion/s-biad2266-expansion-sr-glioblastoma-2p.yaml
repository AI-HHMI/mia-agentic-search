notes: 'Training pairs: synthetic low-resolution crops (synth_crop) vs real expansion-microscopy high-resolution crops (original_crop),
  listed via the FTP/HTTP index (train 208 pairs, val 24 pairs; real_data holds one roughly aligned real low/high example,
  419 MB). Voxel size x/y 0.5919 um comes from the ImageJ calibration in an original_crop file header (unit micron); z spacing
  is not stored, and it was not checked whether this is pre- or post-expansion scale. No publication is listed in the BioStudies
  record, so no paper could be read; sample preparation and acquisition fields on the study page are empty. The dataset page
  lists a data-analysis GitHub link without a URL in the API record.'
