  notes: 'S3 listing of models/training_data/ (listing.py): 28,149 files, 36,191,048,777 bytes, exact.
    The images/ prefix (TB-scale zarr chunks) was not listed, so the total size is unknown. Probed zarr
    headers of training crop raw/labels, full raw/s0 and local_segmentation/s0. Read one z plane of crop_0
    labels (0-693, 10 unique IDs) and one plane of raw (6-237, mean 24.7) with zarr; one sample only.
    Size estimate not made: the full raw alone is 18x1382x10856x21316 uint8 = ~5.76 TB uncompressed, but
