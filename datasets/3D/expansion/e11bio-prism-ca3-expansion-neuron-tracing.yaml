schema_version: '1.2'
id: e11bio-prism-ca3-expansion-neuron-tracing
title: 'E11bio PRISM: expansion microscopy of mouse hippocampal CA3 with protein barcodes, segmentations
  and proofread skeletons'
short_name: Neuron tracing in expanded CA3 (PRISM, ExM)
description: Multi-round expansion-microscopy volume of mouse hippocampal CA3 (about 5x expansion, effective
  voxel ~35 x 35 x 80 nm, ~10 million cubic micrometres, 18-40 fluorescence channels including combinatorial
  protein-barcode and synaptic marker channels) stored as OME-style Zarr on a public S3 bucket. Includes
  dense and skeleton-seeded neuron segmentations, proofread segments, ~1,550 manually annotated skeletons
  (some traced to spine heads), pre/postsynaptic masks, and training crops (instance, semantic and synapse
  zarr crops) used to train the reconstruction models.
