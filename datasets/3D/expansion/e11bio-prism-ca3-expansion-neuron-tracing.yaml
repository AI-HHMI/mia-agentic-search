notes: 'Hosted on the public S3 bucket s3://e11bio-prism/ls/. Total bucket size not stated, so size_bytes
  is null. n_items=1 volume. Voxel size ~35 x 35 x 80 nm (x,y,z) from the GitHub README and the preprint
  Methods. License: the GitHub README states CC BY-SA 4.0, while the AWS Open Data page points to https://e11.bio/terms-of-use
  (not read in full: page did not render text), so check for a conflict. Annotation coverage is partial:
  dense segmentation is automatic, with a subset of manually traced skeletons (~1,551) and proofread cells.
  Channel count shown is the 18-channel normalized raw group; other groups have 40 and 7 channels. Paper
  is a bioRxiv preprint. enricher: training_data/ = 14 instance, 17 semantic and 2 excitatory-synapse
  zarr crops (36.2 GB, listed); skeletons/ has 3 .nml files. Zarr attrs say 400x168x168 nm (z,y,x, expanded
  space); the record keeps the effective size.'
technical:
