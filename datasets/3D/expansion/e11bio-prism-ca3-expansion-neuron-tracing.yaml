      \ listing)\n    instance/crop_#.zarr/     (x14)  raw [18,300,650,650] uint8 + labels [200,500,500]\
      \ uint64   32.5 GB\n    semantic/crop_#.zarr/     (x17)  raw + labels, same shapes in crop_0   \
      \                      3.7 GB\n    synapses/excitatory/crop_{0,1}.zarr/volumes/{ls_2channels_globalnorm,bassoon_*,psd95_*}\
