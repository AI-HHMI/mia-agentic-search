notes: 'Hosted on the public S3 bucket s3://e11bio-prism/ls/ (aws s3 ls --no-sign-request). Raw array
  images/full_dataset.zarr/raw/s0 has shape 18 x 1382 x 10856 x 21316 uint8 (zstd, 128-chunks), i.e. several
  TB; total bucket size not stated, so size_bytes is null. n_items=1 volume. Voxel size ~35 x 35 x 80
  nm (x,y,z) from the GitHub README and the preprint Methods. License: the GitHub README states CC BY-SA
  4.0, while the AWS Open Data page points to https://e11.bio/terms-of-use (not read in full: page did
  not render text), so check for a conflict. Annotation coverage is partial: dense segmentation is automatic,
  with a subset of manually traced skeletons (~1,551) and proofread cells. Channel count shown is the
  18-channel normalized raw group; other groups have 40 and 7 channels. Paper is a bioRxiv preprint. Skeleton/training-crop
  counts not exhaustively listed.'
