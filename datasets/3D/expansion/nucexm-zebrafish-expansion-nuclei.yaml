notes: 'IEEE DataPort page lists NucExM.zip (1.62 GB) as subscription/login-locked; the project page links a Google Form for access, so access is recorded as registration. No license on either page or on the arXiv abstract page (CC BY 4.0 there covers the paper only). Voxel size 0.325x0.325x2.5 um (x,y,z) is as stated on the DataPort page for the imaged (expanded) volume; stated effective size after dividing by the ~7.0 expansion is 0.046x0.046x0.357 um. Each volume 2048x2048x255. Formats from DataPort page (HDF5); the archive was not listed (files locked) and the paper full text was only read via its arXiv abstract page, not tools/paper.py (not found).'
