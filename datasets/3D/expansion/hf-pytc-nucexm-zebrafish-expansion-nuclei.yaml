notes: 'The Hugging Face copy (pytc/NucExM, created 2023-05-02, MIT in its card front matter) holds NucExM.zip with four HDF5
  files (vol1_image 857 MB, vol1_label 39 MB, vol2_image 840 MB, vol2_label 35 MB), listed with peek_archive. The IEEE DataPort
  page for the same dataset (DOI 10.21227/48b7-s821, created 2022-08-06, authors, volume size, nucleus counts, 0.325 x
  0.325 x 2.5 um before expansion with an expansion factor of about 7) requires an IEEE subscription and states no license;
  the HF card says MIT. voxel_size_nm is the stated effective size of 0.046 x 0.046 x 0.357 um after 7x expansion, taken from
  the IEEE page, not from the file headers. No paper is listed on either page, so none is cited. The NucExM_Readme.md
  mentioned on IEEE is not in the HF zip.'
