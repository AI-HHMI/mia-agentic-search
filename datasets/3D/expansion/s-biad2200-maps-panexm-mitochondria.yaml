notes: 'Ground truth: 25 manual ITK-SNAP crops (256x256 px, 33-38 slices, one central mitochondrion each; 15 train
  / 5 val / 5 test in the paper, not marked in the files); other folders are MAPS predictions and unlabelled raw
  volumes. annotations.source mixed: manual = Training_Human annotations_Figure1/, automatic = *Prediction* folders.
  organisms: Homo sapiens = Training_*, HeLa_*, Drug treatment_*, COXIV/TOM20 folders; Mus musculus = Kidney_* folders.
  The preprint text carries a CC-BY-NC-ND notice; the study page states CC BY 4.0, which is recorded. enricher:
  voxel size 100.49 x 100.49 x 248.56 nm from ImageJ TIFF calibration, same in 6 probed files (was null); it is
  the pixel size in the expanded sample, not corrected for the 13-24x expansion; the paper does not state it. enricher:
  channels 3 (was 2) from TIFF headers.'
