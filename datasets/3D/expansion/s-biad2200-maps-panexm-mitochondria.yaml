schema_version: '1.2'
id: s-biad2200-maps-panexm-mitochondria
title: Scalable automated segmentation of pan-Expansion Microscopy data quantifies mitochondrial proteins and morphology at the nanoscale
short_name: pan-ExM mitochondria subcompartments (MAPS)
description: 'pan-Expansion Microscopy spinning-disk confocal volumes of HeLa cells and mouse kidney sections
  (control and cisplatin acute kidney injury) used to train and apply MAPS, a 3D U-Net that segments
  mitochondrial subcompartments (intermembrane space, matrix, cristae). Includes the raw training volumes
  and 25 manual annotation crops (ITK-SNAP; 15 train / 5 validation / 5 test in the paper), plus raw
  data and model predictions for HeLa, oligomycin-treated cells, TOM20/MIC60/COX4 labelling and kidney
  samples (561 TIFF files).'
