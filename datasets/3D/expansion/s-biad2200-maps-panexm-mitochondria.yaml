notes: 'Voxel size (and whether it is expansion-corrected) is not stated on the study page or in the preprint
  text (only objectives and 2048x2048 px views), so it is left null; TIFF headers are for the enricher.
  Ground truth is 25 small manual crops (256x256 px, 20-35 slices, one central mitochondrion each); most
  other files are MAPS model predictions and unlabelled raw volumes. The preprint pre-trained on 12 volumes
  (2048x2048, 71-380 slices) with MitoTracker-derived masks. Size is the sum of the 561-file BioStudies
  file list. The preprint text carries a CC-BY-NC-ND notice; the study page states CC BY 4.0, which is
  recorded.'
