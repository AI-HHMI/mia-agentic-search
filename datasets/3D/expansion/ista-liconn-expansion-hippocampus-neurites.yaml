title: LICONN - expansion light microscopy of mouse hippocampal CA1 with proofread neuron instance segmentation
short_name: LICONN mouse hippocampus neurites (expansion)
description: Light-microscopy connectomics volumes of mouse hippocampal CA1 neuropil, imaged by spinning-disc
  confocal after ~16x iterative hydrogel expansion with a pan-protein stain. The public bucket holds the
  raw image volumes plus instance segmentations of axons, dendrites and spines (a proofread and an agglomerated
  version for one dense volume, a sparse neuron set and an automatic over-segmentation for a second, larger
  volume).
