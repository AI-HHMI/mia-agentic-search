notes: 'Neuroglancer precomputed volumes in the public bucket gs://liconn-public. ExPID82_1 (Fig. 2, dense
  CA1 box): raw image_230130b, proofread segmentation 231030_agg_240123 and agglomerated 231030_agg_230921_cmpl.
  ExPID124 (Fig. 1a): raw image, sparse segmentation seg_230907_agglo231128_combined2 (~80 neurons per
  torch-em docs; unlabelled voxels are 0, not background) and unproofread automatic seg_230907. License
  from the ISTA record (CC BY-NC-SA 4.0); none found on the bucket itself. Labels: FFN predictions plus
  manual proofreading (paper). Coverage: ExPID82_1 dense, ExPID124 sparse. enricher: voxel size set to
  null (was 9x9x12): the two volumes differ, ExPID82_1 9x9x12 nm, ExPID124 10x10x25 nm (precomputed info,
  finest scale; paper: effective 9.7x9.7x13.0 and 9.7x9.7x25.9 nm). Labels are stored at 2x the raw voxel
  size. enricher: size from a full GCS listing of both prefixes.'
