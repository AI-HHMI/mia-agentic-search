notes: 'Labelled volumes are Neuroglancer precomputed volumes in the public bucket gs://liconn-public (only the info files were
  fetched). ExPID82_1: raw image_230130b, proofread segmentation 231030_agg_240123 and agglomerated 231030_agg_230921_cmpl.
  ExPID124: raw image, sparse segmentation (about 80 neurons per torch-em docs; unlabelled voxels are 0, not background) and
  an unproofread automatic segmentation. The ISTA record (CC BY-NC-SA 4.0) lists figure data and test TIFFs; its
  pub.ista.ac.at listing has large ims/n5/zarr/npz files with no readme, not opened. No license text was found for the
  bucket itself; the ISTA record license is assumed to cover it. Voxel size is from the bucket info (9.0x9.0x12.0 nm); the
  paper gives an effective 9.7x9.7x13.0 nm for the CA1 volume. Paper: 18,268 axons, 1,643 dendrites and 71,269 spines in the
  proofread 83,825 um3 box; labels are FFN predictions plus manual proofreading. Total size not stated in any source read.'
