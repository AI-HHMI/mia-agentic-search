  notes: 'Datasets.rar is a RAR5 archive; RAR is not readable by tools/listing.py or tools/peek_archive.py, so the file list
    was read from the archive''s own headers by range requests: the main header''s locator points to the quick-open block
    at the end (783,719 B read), which lists 10,080 files (5,040 LR, 5,040 HR, unpacked total 10,930,691,520 B); the first
    7 local headers (3.6 KB) agree. Members are compressed (RAR method 3), and no allowed tool decodes RAR, so TIFF headers
    (shape, dtype, axes) could not be read and nothing was sampled. The constant sizes (LR 239,394 B, HR 1,929,394 B) are
    consistent with the paper''s 25x25x169 / 75x75x169 patch sizes as uint16 pages, but that is not stated for these files,
    so shape/dtype stay null. Voxel size not found; checked: Zenodo API record, GitHub README, paper full text (Methods give
    pixel counts and microlens parameters, no pixel size in nm for the training patches). No usable sample: TensorSwitch takes
    members only from zips, not RAR; data.download_url (the .rar) is a direct file (usable, range requests).'
