notes: 'Zenodo record is a single Datasets.rar (4.7 GB, CC-BY-4.0); RAR cannot be listed with tools/peek_archive.py (zip only), so contents are taken from the GitHub README ("about 5000 cropped LR-HR LF-image pairs of mitochondrial samples") and the paper (training set of approximately 5,000 pairs; LR spatial-angular views 153 x 153 x 13 x 13 from the middle light-field image, HR from 3 x 3 sLFM scans). The paper presents a broader Bio-LFSR dataset; whether this demo set is a subset of it, the species/cell line, pixel size, file format inside the RAR and the voxel size are not stated on the Zenodo page, README or paper text read; organism left empty, dimensionality 3D is inferred from the volumetric light-field setting, n_items 5000 is the README count of pairs. The GitHub code is GPL-2.0, the data record is CC-BY-4.0. Dataset page, README and paper full text checked.'
