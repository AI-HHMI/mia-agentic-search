notes: 'Zip listing: Training - Low/High SNR images 22 pairs, Test - Low/High SNR images 2 pairs (14, 15). Zenodo text: SIM,
  60x 1.42 NA, 32-bit TIFF, 1024x1024x33, pixel size 40 nm x,y and 125 nm z. Zenodo says publication unpublished; the ZeroCostDL4Mic
  paper (Methods, SIM section) describes this dataset, so it is listed. enricher: organism Homo sapiens (was empty) from Cellosaurus
  CVCL_5552 (DCIS.COM = MCF10DCIS.com). enricher: per paper Methods, low-SNR inputs are the Lifeact-RFP channel (100 ms, 1%
  laser) and high-SNR targets the phalloidin-488 channel (50 ms, 10% laser) of the same fixed cells (DeltaVision OMX v4),
  so pairs are two stains of actin, not the same channel. annotations.source automatic = acquired targets, no manual labels.
  Companion to the 2D record zenodo-3713330.'
