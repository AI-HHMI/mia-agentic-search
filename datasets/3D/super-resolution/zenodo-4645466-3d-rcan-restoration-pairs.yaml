id: zenodo-4645466-3d-rcan-restoration-pairs
title: Training and testing data for 3D residual channel attention networks (RCAN) denoising and resolution enhancement
short_name: 3D RCAN denoising/super-resolution pairs
description: Paired 3D fluorescence image volumes released with the 3D RCAN paper for training restoration
  networks. Four sets are provided - denoising (actin, ER, Golgi, lysosome, microtubule, Tomm20 and matrix
  mitochondria), synthetic blurred phantom spheres, confocal-to-STED pairs (microtubule, nuclear pore
  complex, DNA) and expansion microscopy (microtubule and Tomm20 mitochondria; synthetic raw iSIM inputs
  paired with deconvolved ground truth), each with training and testing folders of raw and GT volumes.
