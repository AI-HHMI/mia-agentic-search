notes: 'Zenodo record lists CC BY 4.0, while the bundled Readme.txt says BSD 3-Clause (that line may refer
  to the code); CC-BY-4.0 taken from the record metadata. Expansion_Microscopy.zip was listed with peek_archive
  (111 TIFFs, 35.6 GB uncompressed; Microtubule and Mitochondria training/test raw and GT folders). The other
  zips (Denoising 33.8 GB, Confocal_2_STED 2.7 GB, Phantom_spheres 7.2 GB, live_cell_test_data 13.7 GB) were
  described only by the Readme and file sizes, not listed. Voxel size, organism and cell line are not stated
  on the record or Readme; the Nature Methods paper is not open access (only the abstract was read), so they
  stay null. size_bytes is the record total of 82.9 GB (521 GB unzipped). Ground truth is derived by
  deconvolution, STED imaging or synthesis, not manual annotation (source: automatic). A newer version of
  the record exists; this is v2.'
