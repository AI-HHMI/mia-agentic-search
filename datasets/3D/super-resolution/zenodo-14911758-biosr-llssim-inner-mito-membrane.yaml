notes: 'Zenodo: part of BioSR for LLS-SIM (parent 10.5281/zenodo.14322457), home-built lattice light-sheet SIM;
  5 light levels per ROI, the highest reconstructed by conventional LLS-SIM as GT (algorithmic, not manual). Zip:
  282 MRC files = 47 ROI folders x (5 raw + 1 GT). Paper not open access; bioRxiv preprint full text rate-limited (HTTP 429) this run.
  enricher: organism Chlorocebus aethiops (Cos-7) and stain PKMR from the parent record''s training dataset.xlsx
