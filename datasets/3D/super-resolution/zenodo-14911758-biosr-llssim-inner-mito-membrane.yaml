notes: 'Zenodo description: part of BioSR for LLS-SIM (parent record 10.5281/zenodo.14322457), acquired on a home-built lattice
  light-sheet SIM; raw images at five light levels per ROI, with the highest-level raw images reconstructed by the conventional
  LLS-SIM algorithm as ground truth. Zip listing: 282 MRC files, 29.2 GB uncompressed = 47 ROI folders x (5 raw + 1 GT). The
  paper is not open access (abstract only; the preprint version was not read), so voxel size, cell type/species and acquisition
  details are not confirmed and left empty; the record page also gives no per-file shape. The GT is an algorithmic
  reconstruction, not a manual annotation. Other sample subsets of BioSR for LLS-SIM (granular component, chromosomes, MTs,
  etc.) sit in separate Zenodo records and were not reviewed.'
