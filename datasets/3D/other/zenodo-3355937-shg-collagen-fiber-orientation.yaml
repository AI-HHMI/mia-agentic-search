notes: 'Zenodo holds 5 zips (15.4 GB): shg-ce-de.zip (9.1 GB, 4736 contrast-enhanced and denoised PNG slices sorted by mouse, bone location and scan), shg-masks.zip (19 MB, 4736 mask PNGs),
  shg-features.zip, shg-cross-splits.zip (10 random splits) and logs-predictions.zip (model logs and predictions, not data). Per the arXiv preprint: 35 scans of 6 mice (3 with osteogenesis imperfecta),
  1000x1000 or 1024x1024 px slices covering 250 x 250 um, 78 to 214 slices per scan spaced 0.5 um; xy pixel size therefore ~244 to 250 nm and z 500 nm, but voxel size is left null because xy differs per scan. Labels are
  rough regions (about 2% similar, 3% dissimilar, 95% not of interest), not pixel-exact. SHG is a nonlinear modality and the preprint does not name the microscope. The Springer version is not open access, the arXiv preprint was read. Checked: Zenodo record and API, both zip listings, preprint.'
