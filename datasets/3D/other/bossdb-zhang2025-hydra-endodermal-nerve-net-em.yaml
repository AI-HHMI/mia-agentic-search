notes: 'One experiment (hydra) with channels image and neurons; voxel size 4 x 4 x 30 nm (180224 x 139264 x 1830 voxels) from its BossDB coordinate frame. Licence CC-BY-4.0 from the DataCite record of the BossDB DOI. The Current Biology paper is not open access, so only its abstract was read (partial reconstruction of the endodermal nerve net, 5 neuron subtypes). The vesicle segmentation mentioned in the dataset title is not a BossDB channel (only image and neurons are listed). Whether neurons were traced manually or segmented automatically is not stated in the sources read; the EM modality (SEM vs TEM) is also not stated, hence modality other and annotations.source unknown. The DataCite entry also points to the VesiclePy repository (github.com/PytorchConnectomics/VesiclePy). The DataCite author list differs from the paper author list, which is used here as initials. Publication date not read.'
