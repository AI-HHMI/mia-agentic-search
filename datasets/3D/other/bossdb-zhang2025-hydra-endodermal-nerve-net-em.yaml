notes: 'One experiment (hydra); voxel size 4 x 4 x 30 nm (180224 x 139264 x 1830 voxels) from the BossDB
  coordinate frame and the precomputed image info. Licence CC-BY-4.0 from the DataCite record. The Current
  Biology paper is not open access (abstract only). enricher: the S3 store (bossdb-open-data/zhang2025/)
  holds layers image, em (same volume, 4096x4096x1 chunks), neurons, neurons_unchunked and vesicle layers
  CV_seg, DCV_seg, DCVH_seg, SCV_seg, SDCV_seg, all labels at 8 x 8 x 30 nm; the abstract mentions clear
  and dense-core vesicles, but the layer abbreviations are not defined in any source read. Manual vs automatic
  tracing not stated (VesiclePy README describes automated vesicle segmentation with proofreading tools,
  not this dataset specifically); EM modality not stated, hence modality other and source unknown.'
