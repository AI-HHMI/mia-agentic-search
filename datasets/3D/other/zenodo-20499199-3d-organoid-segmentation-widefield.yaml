notes: 'Zip listing: 12 Images/*.nii.gz and 12 matching Masks/*.nii.gz (<line>_no_apotome_<n>_processed_iso). Page gives
  no microscope, staining, species or voxel size, so modality is other and Homo sapiens is inferred from the MCF7/MCF10A
  names. Voxel size 1 um isotropic is from one NIfTI header (67x177x210, uint16); files look resampled, original grid not
  stated. Source manual follows the page wording expert-annotated. Possibly related: Sohaib et al., 3D-Organoid-SwinNet
  (PMC11970996, Zeiss apotome, MCF10A/MCF7/MDA-MB lines), not linked from the record and without data link, so not listed.'
