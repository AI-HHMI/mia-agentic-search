description: Training split of the stimulated Raman scattering (SRS) 3D super-resolution task of the MicroDiffuse3D
  restoration model, as one 45 GB HDF5 file. The paper describes this task as paired low-quality / high-quality
  SRS volumes of mouse brain sections (10x acquisitions as input, 30x acquisitions as targets, aligned
  with SIFT + RANSAC, targets denoised with BM3D), cut into 20x256x256 cubes.
