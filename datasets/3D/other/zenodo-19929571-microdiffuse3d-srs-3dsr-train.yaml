notes: 'The Zenodo page only says "Training dataset for the SRS 3D super-resolution task in MicroDiffuse3D"
  and lists no paper; the link to the arXiv preprint (HTML version, which has no data-availability statement)
  rests on the matching name and task, and the paper states ~4,490 training cubes of 20x256x256 for this
  task (n_items left null since the HDF5 content was not opened). Sibling Zenodo records hold the validation
  sets (19941581), test sets (19946789) and pretrained checkpoints (20060865). Pixel/voxel size is not
  stated on the Zenodo page or in the paper (axial steps 2 um at 10x and 1 um at 30x only), so voxel_size_nm
  is null. Modality is SRS, which is not in the schema enum, hence other. Probing the 45 GB HDF5 header
  by range request timed out; internal dataset names and shapes are unverified.'
