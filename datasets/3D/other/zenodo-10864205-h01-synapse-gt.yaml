description: Synapse ground truth used to train the synapse-identification network in the H01 study of
  a cubic millimetre of human temporal cortex, plus excitatory/inhibitory labels for proofread synapses.
  Six EM subvolumes, each with pre- and post-synaptic annotation files (.vsseg), and two CSVs of E/I ground
  truth.
