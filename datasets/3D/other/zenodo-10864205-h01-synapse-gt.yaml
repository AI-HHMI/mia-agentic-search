notes: 'Modality is multibeam SEM (61-beam Zeiss mSEM, ATUM sections), which has no schema enum, so other.
  Voxel size from the paper: 4 nm pixels (5.55 x 4 nm after correcting cutting-direction compression),
  sections ~33.9 nm; the exact voxel size of the released .vsv volumes is not stated on the Zenodo page
  or in the archive listing. Formats are VAST .vsv (EM) and .vsseg (pre/post-synaptic annotations); size_bytes
  is the sum of the 6 zips plus 2 CSVs; only Region 1 archive was listed (3 files). Annotation procedure
  and per-subvolume sizes are not described on the Zenodo page; the PMC page consulted gives only ML synapse
  detection and proofreading validation, not the manual ground-truth procedure. Full text of the Science
  paper is not open access; the PMC author manuscript was read. E/I labels come from 2945 synapses of
  104 proofread neurons and 2367 verified connections (file names).'
