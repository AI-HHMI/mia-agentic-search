notes: 'Sources checked: Zenodo record page and API, lab dataset index. Only six cell volumes, so size is small; MATLAB .mat files
  (no matching format enum, hence other). The mask is described as a binary cell mask but how it was produced is not stated, and
  dx (sample size) is a variable inside the .mat files that was not read, so voxel_size_nm is null. The record cites one method
  paper (Krauze, Biomed. Opt. Express 11, 1919, 2020) without DOI; the dataset itself has no paper, and Europe PMC was unavailable,
  so no paper was read. Modality is optical diffraction tomography (3D refractive index), which has no enum value: other.'
