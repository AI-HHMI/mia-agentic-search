notes: 'Per the challenge page: images are PNG-slice zips in HuggingFace pytc/EM30 (human 23.9 GB, mouse
  15.2 GB); training data in pytc/AxonEM. MIT is from the HF dataset cards; the challenge page states
  no license. Test ground truth is withheld. organisms: Homo sapiens = EM30-H-* (temporal cortex L2, from
  H01), Mus musculus = EM30-M-* (V1 L2/3, from Dorkenwald et al.). enricher: voxel size set to null (was
  8x8 nm): paper 2.1 states 7x7x40 nm (mouse) and 8x8x30 nm (human), no shared value. coverage: 9 densely
  annotated 512x512x50 training subvolumes per species (padded to 90x1536x1536); test region GT withheld.
  modality: paper says serial section EM only, so other.'
