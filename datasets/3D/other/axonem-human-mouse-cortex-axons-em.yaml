  notes: 'Listing: tools/listing.py of the 4 HF zips (exact sizes, central directories). Sampled with
    a zip-member HDF5 reader: mouse im/seg/valid_mask 0-0-0 and human seg_0-0-0, mouse seg_0-3584-0 (~187
    MB). value_range from one sample each. Instance IDs are uint8, so IDs are local to each subvolume.
    Mouse seg_0-0-0_pad.h5 equals valid_mask.h5: likely a packaging error; use the other 8 mouse pairs.
    Voxel size differs by species (paper Sec. 2.1: mouse 7x7x40 nm, human 8x8x30 nm), so imaging.voxel_size_nm
    is null; split per species to convert. download_url: no single archive (4 zips in two HF repos); direct
    zip URLs are in the tree. EM30-R-im.zip (pytc/EM30) is a third volume not described by AxonEM. Mouse
    valid_mask.h5 (90x1536x1536 uint8 binary, 1 = central 50x512x512 annotated block) is a loss mask,
    not listed as an array.'
