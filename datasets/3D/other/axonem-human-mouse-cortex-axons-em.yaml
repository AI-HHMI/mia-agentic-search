short_name: Human and mouse cortex axon instance seg. (EM)
description: Two 30x30x30 um EM image volumes from human (1000 slices) and mouse (750 slices) cortex, 4096x4096 voxels per slice at 8 nm in x and y, with over 18,000 proofread axon instances. Nine densely annotated training subvolumes per species are provided as HDF5 (image + instance segmentation); the rest of each volume is the challenge test region (AxonEM challenge on grand-challenge.org).
