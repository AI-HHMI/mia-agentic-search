notes: 'Per the challenge page: images are PNG-slice zips in HuggingFace pytc/EM30 (human 23.9 GB, mouse 15.2 GB); training data in pytc/AxonEM (about 1.8 and 1.9 GB; 9 im_*_pad.h5 + 9 seg_*_pad.h5 + valid_mask.h5 each, listed with peek_archive). MIT is from the HF dataset cards; the challenge page states no license. Voxel z is 30 nm (human) and 40 nm (mouse), so z is null. Test ground truth is withheld. EM type per species not confirmed (paper full text not open access), hence other.'
