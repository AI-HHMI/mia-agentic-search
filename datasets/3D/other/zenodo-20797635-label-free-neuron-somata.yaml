notes: 'Modality is oblique illumination / Dodt gradient contrast (transmitted-light, label-free), which has no schema value, so `other`. Voxel size, microscope and objective are not stated on the Zenodo record, readme or code repo; the accompanying manuscript is "in preparation" per the GitHub README and no preprint/DOI was found (paper.py title search failed), so they are null. Sizes are the sum of the six archive sizes (compressed). Zip listings (mice_neurons_oblique, human_neurons_dodt) show 80 TIFFs each, consistent with the readme statement of 40 image volumes + 40 masks; the masks/ paths were not among the 40 paths printed, so annotations_verified is false. split.json provides a train/val/test split per the readme. Authors not listed on the record.'
