title: Large-scale multi-species label-free 3D neuron soma segmentation dataset (oblique illumination and Dodt gradient contrast)
short_name: Label-free 3D neuron somata (oblique/Dodt)
description: 240 volumetric label-free image stacks of rat, mouse and human brain tissue acquired with oblique illumination and Dodt gradient contrast (DGC) microscopy (40 stacks per species-modality combination, six archives), with consensus 3D instance masks of 6,479 manually annotated neuronal somata (plus 73,081 2D cross-sectional annotations). Built for benchmarking 3D neuron instance segmentation, cross-modality and cross-species transfer.
