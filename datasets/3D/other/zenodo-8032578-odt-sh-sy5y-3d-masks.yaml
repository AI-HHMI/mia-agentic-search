  notes: 'Listing: Zenodo API, 3 files, exact sizes. Files are MATLAB 7.3 MAT (HDF5 with 512-byte header:
    "MATLAB 7.3 MAT-file, Platform: PCWIN64"); probe.py does not recognise .mat, so REC_SH-SY5Y_3.mat
    was read with h5py over HTTP range requests (scratch script). Listing the HDF5 tree cost 365 MB of
    range reads (1 MB blocks); one middle plane (index 327 of the last axis) of RECON and of maskCellpose
    cost 8.9 MB more. RECON float32 654^3 gzip, plane range 1.3371-1.4069 (refractive index; n_imm = 1.338
    in the file), normalization none because the values are physical RI. maskCellpose uint8 (MATLAB logical)
    values {0,1}. maskManual/maskODTSAS are MATLAB table objects; the referenced 654^3 logical arrays
    were seen in the header but not sampled, and which name maps to which array was not decoded. Axis
    order is not stored (MATLAB column-major, so the HDF5 order is reversed), hence axes null. Only file
    3 was inspected; files 1 and 2 are assumed to have the same variables per the record description.
    maintainer 2026-10-06: isotropic per file (dx in the .mat files, um; z = dx per the authors'' code):
    REC_1 144.936, REC_2 184.751, REC_3 148.224 nm. voxel_size_nm stays null.'
