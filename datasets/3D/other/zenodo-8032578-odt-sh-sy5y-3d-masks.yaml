notes: 'Files listed via the Zenodo API: REC_SH-SY5Y_1/2/3.mat (1.20 GB, 0.83 GB, 0.60 GB). File contents
  taken from the record description (variables RECON, n_imm, dx, rayXY, maskManual, maskCellpose, maskODTSAS);
  Organelle masks (nucleoli, lipid structures) are manual slice-by-slice (MATLAB Volume Segmenter); cell
  masks come from Cellpose and the semi-automatic ODT-SAS method, so source is mixed. Paper Methods: 632
  nm, NA 1.3, 90 projections, Gerchberg-Papoulis reconstruction. Voxel size is stored in the dx variable
  but not stated on the page or in the paper text read, so null. Modality is label-free ODT (no schema
  value), hence other. Small number of volumes (3) but large; meets the 1-volume minimum. enricher: formats
  hdf5 (files are MATLAB 7.3 MAT = HDF5; was other). enricher: annotations_verified true (mask arrays
  read). enricher: dx = 0.14822 in file 3 (unit not stated, voxel_size_nm left null).'
