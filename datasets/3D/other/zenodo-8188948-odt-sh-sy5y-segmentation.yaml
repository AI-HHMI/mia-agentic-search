notes: 'Read the Zenodo page and API record (CC BY 4.0; four .mat files, 3.3 GB) and the paper abstract (not open access,
  no full text). Variable names and mask classes are from the record description; .mat contents were not opened. Pixel size
  is stored in the files as dx (XY) but its value was not read. Only 3 volumes carry manual organelle masks; cell masks are
  from Cellpose/ODT-SAS (semi-automatic), hence source mixed. ODT gives quantitative refractive-index volumes, not fluorescence
  or EM. No direct download URL set because the record page lists four files; modality other = ODT. enricher: formats hdf5
  (MATLAB v7.3 .mat = HDF5, was other); dx per file 144.9/184.8/148.2/200.0 nm XY (files 1-4, from dx in the files), z not
  stated, so voxel_size stays null.'
