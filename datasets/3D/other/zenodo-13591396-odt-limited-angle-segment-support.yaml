notes: 'Sources checked: Zenodo record page and API (description, file list, license), the lab dataset index (biophase.mchtr.pw.edu.pl).
  No related publication is listed on the record and a web search for the "Segment and Support" paper found none, so the paper was
  not read; voxel size, n_items and train/test split are not stated on the record (cited experimental sources are SPIE/Opt. Express
  papers). The data are a single 7z archive split into six parts (about 21.5 GB in total), so contents could not be listed with peek_archive;
  the TIFF format, 128^3 float32 shape and mask description come from the record text only. Most volumes are synthetic; the experimental
  masks are thresholding output (not manual labels), hence source: automatic. Modality is optical diffraction tomography
  (3D refractive index), which has no exact enum value: other.'
