notes: 'Two zips (11.4 + 7.2 GB) of uint16 TIFFs; RI slices 741x741, fluorescence projections 1464x1464. No mask files:
  the README says segmentation targets come from the fluorescence by gamma adjustment and Otsu thresholding, so the
  training signal is the treatment label plus fluorescence-derived targets. Treatment labels are experimental
  conditions (annotations.source left unknown). Modality: ODT (Tomocube HT-X1) is not an enum value, hence other.
  channels 4 = RI + nucleus, lysosome, mitochondria fluorescence. enricher: voxel size x/y 222 nm from the preprint
  ("88 optical sections (741 x 741 pixels each) with voxel dimensions of 1 x 0.222 x 0.222 um3"; was null); z left
  null because the deposit holds 21 of those slices per tomogram and their spacing is not stated. enricher: preprint
  added to publications; size from the complete Zenodo listing; annotations_verified true (tomograms.csv read).'
