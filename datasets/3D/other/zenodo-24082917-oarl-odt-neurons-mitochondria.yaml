description: 1,622 optical diffraction tomography (refractive-index) tomograms of live iPSC-derived human cortical
  neurons, each with 21 RI slices, an RI maximum projection and nucleus, lysosome and mitochondria fluorescence
  projections. 1,018 tomograms carry treatment labels (control vs antimycin, oligomycin, rotenone); 604 more
  are for organelle segmentation. Split assignments are given in a manifest.
