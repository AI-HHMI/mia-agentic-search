notes: 'Two zips (11.4 GB + 7.2 GB compressed; 37.7 + 22.4 GB uncompressed) of uint16 TIFFs listed with peek_archive;
  RI images 741x741, fluorescence projections 1464x1464 (README). The paper (accepted in Smart Medicine) has
  no DOI yet and was not found in Europe PMC, so publications is empty and pixel/voxel size is not stated
  in the Zenodo record, README or paper. Separate mask files are not included: the README says segmentation
  targets are generated from fluorescence by per-organelle gamma adjustment and Otsu thresholding, so the
  usable training signal is the treatment label (classification) plus fluorescence-derived targets. The
  two zips are separate downloads, so download_url is null. Treatment labels are from the manifest
  (tomograms.csv), not opened. Modality: ODT is not an enum value, hence other.'
