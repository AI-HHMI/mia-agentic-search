notes: 'Zenodo description: training data for semantic and instance segmentation of cells, cilia and microvilli in the EM volume
  of a sea sponge, from the volume of the Science 2021 paper (doi 10.1126/science.abj2949). Zip listing shows 3 HDF5 files
