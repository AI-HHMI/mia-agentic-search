short_name: Mouse and primate V1 synapse development (EM)
description: Ten serial-section EM volumes of mouse and macaque primary visual cortex (layers 2/3 and
  4, postnatal day 6 to 3000) on BossDB. The mouse V1 layer 4 volumes at p14 and p105 additionally carry
  automatic saturated neuron segmentation, PSD and vesicle segmentation channels (partly proofread); manual
  Knossos synapse and dendrite annotations underlie the paper.
