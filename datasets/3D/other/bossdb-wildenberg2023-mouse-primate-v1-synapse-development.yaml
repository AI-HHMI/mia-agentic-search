notes: 'BossDB API lists 10 experiments; the S3 store holds 14 volume folders (also mouse_v1_l23_p14,
  mouse_v1_l23_p6, primate_v1_l4_p7, primate_v1_l4_p75), all EM at 6 x 6 x 40 nm. Only mouse_v1_l4_p14
  and mouse_v1_l4_p105 have label layers. organisms: Mus musculus = mouse_v1_*/, Macaca mulatta = primate_v1_*/.
  Voxel size 6 x 6 x 40 nm from the coordinate frames and info files. Licence CC-BY-4.0 from DataCite.
  Paper (open access): automatic segmentation of neurons, synapses and mitochondria for the two L4 volumes;
  manual Knossos annotations by 3 annotators. EM modality (SEM vs TEM) not stated in the text read, so
  modality other. enricher: label layers are at 12 x 12 x 40 nm with voxel offsets (p14: 700,300,0; p105:
  150,150,0) on the em_aligned volumes.'
