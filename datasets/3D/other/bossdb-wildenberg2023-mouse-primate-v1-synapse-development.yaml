notes: 'Of the 10 BossDB experiments only mouse_v1_l4_p105 (channels em, em_aligned, psd_autoseg, saturated_autoseg, vesicle_autoseg) and mouse_v1_l4_p14 (em_aligned plus the same three autoseg channels) carry segmentation channels; the other eight are EM only. Voxel size 6 x 6 x 40 nm is the BossDB coordinate frame of every experiment. Licence CC-BY-4.0 from the DataCite record of the BossDB DOI. Paper (open access, CC BY 4.0): original EM data free on BossDB; automatic segmentation of neurons, synapses and mitochondria of mouse V1 L4 p14 and p105 is also offered in WebKnossos format; manual annotations (Knossos) were done by 3 annotators. EM imaging modality (SEM vs TEM) is not stated in the text read, so modality is other. Size in bytes and publication date were not read.'
