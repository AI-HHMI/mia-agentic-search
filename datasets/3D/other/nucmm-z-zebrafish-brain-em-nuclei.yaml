notes: 'Modality is serial-section EM (the paper abbreviates it SEM; TEM vs SEM not stated, hence other). Voxel size is the downsampled release resolution (0.48 x 0.51 x 0.51 um, z,y,x; original 30 x 4 x 4
  nm) from the paper Table 1 and Methods. No license stated on the challenge page, project page or paper;
  a third-party Hugging Face mirror (MedOtter/NucMM-Z, 64^3 patches as HDF5) labels itself MIT, but that is
  not the authors'' statement. Files sit in a Google Drive folder that was not opened, so the file format
  of the original release and data size are unverified (formats set to other for that reason). Complete
  annotations require the organizers'' request form. Checked: challenge page, project page, arXiv full
  text; no data availability section with a license.'
