id: nucmm-z-zebrafish-brain-em-nuclei
title: 'NucMM-Z: zebrafish brain serial-section EM, 3D neuronal nuclei instance segmentation'
short_name: Zebrafish brain nuclei instance seg. (EM)
description: Serial-section EM volume covering nearly an entire larval zebrafish brain (397x1450x2000 voxels,
  ~170,000 nuclei) with nuclei instance annotations produced semi-automatically (filtering, thresholding
  and watershed) and proofread in VAST. The public release provides the raw images and training/validation
  annotations (27 chunks of 64x64x64 voxels for training); the complete annotation is available through
  a request form. Released with the MICCAI 2021 NucMM challenge.
