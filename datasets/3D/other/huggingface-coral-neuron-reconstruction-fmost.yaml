notes: 'Sources: HF dataset card and file listing (16,856 files; 1,937 cube TIFFs with SWC and mask TIFFs,
  10,973 slice TIFFs, 32 neuron SWCs), GitHub README, arXiv HTML. LICENSE CONFLICT: card says cc-by-4.0,
  paper footer says CC BY-NC-SA 4.0; card recorded. Counts differ: card lists 1,937 blocks (767 train,
  140 val, 1,022 test, 8 unused), paper says 1,904 blocks. Modality is fMOST (no enum value, so other).
  Voxel size is from the paper. Authors not named on the card or in the text read; strain/labelling not
  stated. Annotation: three independent annotators in sequence (paper). enricher: size_bytes corrected
  to 4.42 TB from the complete HF listing (was 21.3 GB): the whole-brain slices/ folder alone is 4.3 TB,
  the cubes + masks + SWCs about 157 GB; cubes are uint16 300^3, masks uint8 binary.'
