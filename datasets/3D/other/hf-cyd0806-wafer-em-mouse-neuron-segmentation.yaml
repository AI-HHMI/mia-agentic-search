notes: 'The dataset card is empty (README 244 bytes); the files are gated on Hugging Face (accept the terms and log in; access
  is automatic), so contents were not opened. Facts come from the file listing (6 volumes x inputs/labels, 390,627,048 bytes
  each, which matches 1250 x 1250 x 125 voxels at 2 bytes) and the TokenUnify paper (arXiv 2405.16847, MEC dataset section:
  six volumes, 1250 x 1250 x 125 voxels, dense manual annotation by two experts, train/val/test split by wafer). Voxel size,
  imaging modality and microscope are not stated on the dataset page or in the paper text read; modality is therefore
  other. The paper names the data a 2 TB MEC collection; the Hugging Face card does not name the paper, the link is by
  matching wafer names. The card says license cc-by-nc-4.0.'
