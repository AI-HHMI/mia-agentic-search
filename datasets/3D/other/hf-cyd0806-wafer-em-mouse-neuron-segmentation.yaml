id: hf-cyd0806-wafer-em-mouse-neuron-segmentation
title: Wafer-EM (MEC) - densely annotated mouse brain EM volumes for neuron segmentation
short_name: Mouse brain neuron segmentation (EM)
description: Six 1250 x 1250 x 125 voxel electron microscopy volumes (wafer4, wafer25, wafer26, wafer26-2, wafer36, wafer36-2)
  from mouse somatosensory cortex, medial entorhinal cortex and cerebral cortex, each paired with a dense manual neuron
  segmentation (over 1.2 billion annotated voxels in total, annotated by two experts), released on Hugging Face as paired
  *_inputs.h5 / *_labels.h5 files. The TokenUnify paper splits them into training (wafer25/26/26-2/36), validation (wafer4)
  and test (wafer36-2) volumes.
