notes: 'No license or terms for the data appear on the BioStudies record or in the eLife paper (CC-BY applies to the article
  only); the Data availability section only gives accession S-BIAD25. Voxel size 103 x 103 x 250 nm is stated for the
  mouse kidney z-stacks; the brain sections were imaged with a 10x/0.3 NA objective (pixel size not stated) with 5 z-slices
  per location. Total size not stated (90,995 files). The task is image-to-image translation (label-free to fluorescence),
  so there are no manual annotations; per-folder pairing was seen in the directory listings only (mouse_kidney_registered,
  human_brain_4_train_datasets, human_brain_test_GW20, human_brain_test_GW24), channel count per sample not verified.'
