id: s-biad25-qlipp-label-free-to-fluorescence
title: QLIPP label-free (phase and polarization) images registered to fluorescence in mouse kidney and prenatal
  human brain
short_name: Label-free QLIPP to fluorescence pairs
description: Registered multi-channel image pairs for predicting fluorescence from quantitative label-free imaging
  with phase and polarization (QLIPP). Mouse kidney tissue (160 z-stacks of 2048x2048x45; polarization channels
  plus DAPI nuclei and phalloidin F-actin fluorescence) and prenatal human brain sections (polarization/brightfield
  plus FluoroMyelin), split into kidney, 4-section brain training, and GW20 and GW24 test sets.
