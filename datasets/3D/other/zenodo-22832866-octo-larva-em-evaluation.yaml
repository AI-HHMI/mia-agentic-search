notes: 'Read through the Zenodo API (description gives the folder layout) and a peek_archive listing of Evaluation data.zip
  (8.0 GB, 15.0 GB uncompressed, 719 files - 714 .tif, 2 .tiff and 3 .hdf; the two CLAHE raw sub-volumes are 403 MB each and
  the three synapse cubes total 7.9 GB). n_items 360 = about 356 neuron raw/label block pairs (inferred from the tif count)
  + 1 mitochondria/glia sub-region + 3 synapse cubes. The EM technique (FIB-SEM, ssTEM, etc.) of the Octo volume is not named on
  the record, hence modality other; no publication is listed yet (the record says citation in progress), so none is cited and
  no paper was read. The record says the labels were first generated automatically and then automatically or manually
  proofread, so source is proofread and some labels are only partly manual. The subsets are small cutouts meant for
  evaluation, not a full annotated volume.'
