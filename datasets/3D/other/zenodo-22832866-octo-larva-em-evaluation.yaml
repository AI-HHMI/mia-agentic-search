title: Octo evaluation dataset - ground truth for neurons, mitochondria, glia and synapses in a Drosophila L1 larva EM volume
short_name: Octo Drosophila larva EM ground truth
description: Ground-truth evaluation sub-volumes from Octo, an isotropic (8 nm) whole-CNS electron microscopy volume of a second
  L1 Drosophila larva. Four subsets - neuron instance segmentation (27 cutout locations in 256-voxel blocks), mitochondria
  instance segmentation and glia semantic segmentation over one sub-region (AL, z 300-502, CLAHE-enhanced), and synaptic
  cleft plus pre/post-synaptic partner annotations in three cubes in CREMI HDF5 format.
