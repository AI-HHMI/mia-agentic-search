notes: 'Zenodo page and API record read (one file, GeoFocus3D.zip, 4.0 GB). peek_archive lists Depth (14 npy), Depth_png (14), RGB (14) and Focalstacks (904 PNG images, 14 samples). The paper (SPIE proceedings, 10.1117/12.3111774) is not open access and Europe PMC/Crossref give no abstract, so the optics, magnification, pixel size and how the ground-truth depth was produced are not known; none are stated on the Zenodo page either. The task is depth estimation from focal stacks (annotation type and task are therefore other). Modality is other because the instrument is a depth-from-focus optical microscope on rock samples, not a listed modality. n_items counts the 14 samples. Borderline for "microscopy training data": the labels are depth maps, not segmentation.'
