notes: 'Found while following the Nature Methods micro-SAM paper (Europe PMC full text read: user study
  2, nucleus segmentation in an internal volume EM dataset of the fruit fly larva brain). The zip was
  listed with peek_archive (4 TIFF and 1 HDF5, 16 MB). This is a very small dataset (two crops); the annotations
  are user-study results from interactive tools, so label source is mixed. Voxel size, EM technique and
  crop shapes are not stated in the README or paper main text. Companion of the 2d user study record.
  enricher: modality stays other: paper says volume EM, technique not stated. Label sources: annotations/*.tif
  are interactive user-study results (ilastik carving, micro-SAM), train_data.h5 labels/nuclei are the
  ground truth used for fine-tuning.'
