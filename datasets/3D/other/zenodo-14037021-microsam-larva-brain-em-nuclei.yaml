  notes: 'Listing: Zenodo API + zip central directory, 2 files, 16,295,324 B (exact); zip has 5 members.
    The zip (16.3 MB) was downloaded whole and read: annotation_volume.tif plain 32-page TIFF (series
    axes QYX), uint8, deflate, values 0-255, no calibration (resolution 1/1); annotations/*.tif uint32,
    deflate, 0-45 (default SAM, 46 values), 0-100 (finetuned SAM, 61 values), 0-36 (ilastik, 37 values);
    train_data.h5: raw uint8 32x512x512 gzip chunks 4x64x128, labels/nuclei uint32 32x512x512 gzip, 49
    distinct values up to 214; no HDF5 attributes. TIFF pages taken as z from the README (EM volume crop);
