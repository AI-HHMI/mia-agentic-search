title: sOCT of the Human Somatosensory Cortex and Vessel Segmentation
short_name: Human cortex vessel masks (serial-section OCT)
description: A 3.4 x 2.9 x 1.1 cm block of human somatosensory cortex imaged by serial-section optical
  coherence tomography at 20 um isotropic resolution, as two OME-Zarr volumes (full block and a 6 x 6
  x 6 mm region of interest). Vessels in the ROI were manually labelled to validate a U-Net segmentation
  method; a manual tissue mask for the full block, automatic vessel masks and probability maps for both,
  and the trained model checkpoint are included.
