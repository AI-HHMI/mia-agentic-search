notes: 'Facts come from the Figshare API record and its long description; the single 37.7 GB tubenet data.zip was listed with peek_archive: 19 entries, i.e. 10 TIFF volumes under Image data/ and 8 label TIFFs under Labels/ (two volumes have no label file; the full MF-HREM tumour and brain volumes are labelled only in sub-volumes). The description names training volumes (HREM mouse liver, microCT mouse tumour, RSOM mouse tumour, OCTA human retina) and test volumes (MRI porcine liver, MF-HREM mouse tumour and brain, two-photon mouse olfactory bulb); 25% of two training volumes was held out for testing. It mixes non-microscopy modalities (microCT, RSOM, OCT-A, MRI) with microscopy ones, so only part of the data is microscopy. Resolutions are per volume in the file names (e.g. 2.26x2.26x1.75 um for HREM, 0.2x0.46x5.2 um for two-photon); voxel_size_nm is left null because it varies. bioRxiv full text could not be read (HTTP 429), only the abstract via Europe PMC.'
