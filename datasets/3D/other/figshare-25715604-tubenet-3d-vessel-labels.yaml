notes: 'Figshare API record and its description; one 37.7 GB zip (19 TIFFs: 11 images, 8 label files).
  Training volumes HREM mouse liver, microCT mouse tumour, RSOM mouse tumour, OCTA human retina; test
  volumes MRI porcine liver, MF-HREM mouse tumour and brain, two-photon mouse olfactory bulb. Non-microscopy
  modalities (microCT, RSOM, OCT-A, MRI) are mixed in. Modality: X-ray = CT_*, two-photon = 2Photon_*,
  other = HREM/MF-HREM (episcopic), RSOM, OCTA, MRI. Organisms: Mus musculus = murine* files, Sus scrofa
  = MRI_porcineLiver*, Homo sapiens = OCTA_humanRetina*. Voxel sizes are per volume in the file names
  (e.g. 2.26x2.26x1.75 um HREM, 0.2x0.46x5.2 um two-photon), so voxel_size_nm is null. Some test volumes
  are labelled only in sub-volumes; two images have no own label file. bioRxiv full text not read (HTTP
  429). enricher: inspected headers + one label sample.'
