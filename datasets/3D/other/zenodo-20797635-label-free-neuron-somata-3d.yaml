notes: 'Six zips (species x modality, 1.0-1.9 GB each) with images/, masks/, split.json (train/val/test, seed 42, test
  ratio 0.1) and preproc_meta.json. TIFF headers read by range request: images are 8-bit single-channel (e.g.
  1292 x 964 x 64 planes for human Dodt, 1280 x 960 x 30 for mouse oblique), masks 32-bit with the same shape. The
  mouse oblique stacks carry ImageJ metadata with z spacing 1.0 um; no xy pixel size was found in the headers, record
  description, README or GitHub, and the accompanying manuscript has no preprint or DOI yet (Europe PMC title search
  found nothing), so voxel_size_nm is null. Modality is label-free oblique illumination / Dodt gradient contrast, which
  has no listed enum value, so other. n_items = 6 x 40 volumes from the record text; zip listings showed 40-41 image
  members per archive (one extra member). Weights on Hugging Face (Podtyazhki1337/3d-neurons-segmentation).'
