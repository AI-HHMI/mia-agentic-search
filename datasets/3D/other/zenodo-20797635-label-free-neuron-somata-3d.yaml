title: Multi-species label-free 3D neuron soma segmentation dataset (oblique illumination and Dodt gradient
  contrast)
short_name: Label-free 3D neuron somata (oblique/Dodt)
description: 240 volumetric label-free image stacks of brain tissue from rat, mouse and human acquired
  with oblique illumination and Dodt gradient contrast microscopy (40 stacks per species-modality combination),
  with consensus 3D instance masks for neuronal somata (6,479 manually annotated 3D soma instances; 73,081
  2D cross-sectional annotations). Each archive includes a train/validation/test split definition. Annotations
  cover visible somata, not full neuron morphology.
