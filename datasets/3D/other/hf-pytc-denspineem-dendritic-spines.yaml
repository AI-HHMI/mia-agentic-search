notes: 'HF repo (11.4 GB): folders human_/mouse_/seg_den_1000000_10000 (point clouds, NPZ) and per subset
  *_raw.h5, *_seg.h5, *_spine.h5 (9 HDF5 files; seg_den = M50, mouse = M10, human = H10 per the dataset card), plus
  dataloader.py. Splits: M50 in five folds, M10 and H10 held-out tests. Voxel size and EM modality are not
  stated on the dataset card, GitHub README or the paper text (arXiv v2 HTML); not read from file headers
  here, so voxel_size_nm is null and modality is other (source volumes: Kasthuri et al. 2015, AxonEM).
  Paper counts are inconsistent (4,476 vs 4,520 spines; 69 vs 70 dendrites). License MIT is the HF card and
  GitHub repo tag; the paper states no dataset-specific licence and source volumes may carry their own terms.
  Europe PMC full text not open access; arXiv version read.'
