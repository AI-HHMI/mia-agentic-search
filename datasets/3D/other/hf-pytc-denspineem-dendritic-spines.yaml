id: hf-pytc-denspineem-dendritic-spines
title: DenSpineEM - dendritic spine instance segmentation benchmark in volume EM of mouse and human cortex
short_name: DenSpineEM dendritic spine segmentation (EM)
description: Benchmark for dendritic spine segmentation in three public volume EM datasets, with manually
  annotated, expert-proofread spine instances on whole dendrites. Subsets M50 (50 dendrites, mouse
  somatosensory cortex), M10 (10 dendrites, mouse visual cortex) and H10 (10 dendrites, human frontal lobe).
  Per subset, HDF5 raw image, whole-dendrite instance labels, spine instance labels and a binary
  trunk/spine volume, plus preprocessed point clouds.
