notes: 'FF-OCT is microscope-like but the schema has no OCT value, so modality is "other". Study file: 3400 tomograms
  (648 x 488 x variable Z), ~2 TB (estimate, so size_bytes is null). IDR API: 8 datasets (4 classes, each plus "processed");
  Dysplasia lists 1376 OME-TIFF images, 0.45 um xy, z spacing not read. Labels are per-tomogram classes from the study file
  (abdominal skin normal; inflamed back skin dysplasia; warts papilloma; warts >5 mm SCC). Paper not found in Europe PMC
  or Crossref (no DOI in the study file), so none is cited. experimentB (6 H&E slide images) is the same study. Download route
  not checked.'
