id: idr0098-oct-mos-skin-scc-ff-oct
title: OCT-MoS, a dataset of mouse skin squamous cell carcinoma stages by full-field optical coherence tomography
short_name: Mouse skin SCC stages (full-field OCT)
description: 3400 full-field optical coherence tomography (FF-OCT) volumes of mouse skin, each labelled with one of four
  stages of squamous cell carcinoma development (normal, dysplasia, papilloma, SCC), plus processed versions.
  A second experiment holds 6 whole-slide H&E images from 9 samples covering the same four classes.
