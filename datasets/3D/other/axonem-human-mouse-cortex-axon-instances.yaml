notes: 'Third-party Hugging Face copy (MedOtter) of the AxonEM training subvolumes; the original release is linked
  from the paper at connectomics-bazaar.github.io/proj/AxonEM (not fetched) and axonem.grand-challenge.org
  (403 to our fetcher). The CC-BY-4.0 license is stated in the HF card; the arXiv page states CC BY 4.0 only for
  the paper. Voxel size conflict: the HF card says human 30x8x8 nm (z,y,x) and mouse 40x8x8 nm; the paper says
  8x8x30 nm (human) and 7x7x40 nm (mouse) after 2x in-plane downsampling. Values here are the human volume''s;
  mouse differs (x,y 7 or 8 nm, z 40 nm). Modality: the paper says only "serial section EM" (no TEM/SEM stated)
  so modality is other. Evaluation (full-volume) proofread axon segmentations are not in this repository. Not
  checked: HDF5 file headers. Paper has no stated train/val/test split for the nine subvolumes.'
