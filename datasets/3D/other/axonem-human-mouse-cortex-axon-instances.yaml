schema_version: '1.2'
id: axonem-human-mouse-cortex-axon-instances
title: 'AxonEM: 3D axon instance segmentation training subvolumes from human and mouse cortex EM'
short_name: AxonEM human & mouse cortex axons (EM)
description: Eighteen densely annotated 3D electron microscopy subvolumes (nine from adult human temporal-lobe
  layer 2, nine from adult mouse primary visual cortex layer 2/3) with proofread axon instance labels, from the
  MICCAI 2021 AxonEM dataset. This is the Hugging Face copy of the training subvolumes; each is stored as
  HDF5 image + segmentation pair (uint8 EM, uint8 instance IDs, 0 = background), padded by 20 slices in
  Z and 512 pixels in Y/X around a 50x512x512 annotated core. The mouse set also ships a valid-annotation mask.
