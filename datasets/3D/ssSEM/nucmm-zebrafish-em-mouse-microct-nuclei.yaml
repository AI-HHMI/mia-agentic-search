notes: 'Voxel sizes (paper Table 1): zebrafish EM 0.48 x 0.51 x 0.51 um (z,y,x; downsampled from 30x4x4
  nm), mouse micro-CT 720 nm isotropic. Challenge page says raw images and train/val annotations are downloadable
  (Google Drive link) while complete annotations need a data request form. No license for the data is
  stated on the challenge page, project page or paper (the CC BY on arXiv covers the paper). Enricher
  listed the Drive folder: HDF5 crops + TIFF/HDF5 volumes. 5%/5%/90% train/val/test split is from the
  paper. Modality: ssSEM for the zebrafish serial-section EM, X-ray for the micro-CT. enricher: voxel_size_nm
  set to null (subsets differ); organisms: Danio rerio + EM = Zebrafish (NucMM-Z)/, Mus musculus + micro-CT
  = Mouse (NucMM-M)/.'
