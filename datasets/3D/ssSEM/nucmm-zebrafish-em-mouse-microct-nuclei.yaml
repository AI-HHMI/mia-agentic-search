short_name: NucMM 3D neuronal nuclei (EM and micro-CT)
description: Two densely annotated 3D volumes for neuronal nuclei instance segmentation - a zebrafish whole-brain serial-section EM volume (397x1450x2000 voxels, ~170,000 nuclei) and a mouse visual-cortex micro-CT volume (700x996x968 voxels, ~7,000 nuclei). Each volume is split 5%/5%/90% into train/validation/test.
