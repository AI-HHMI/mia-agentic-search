notes: 'voxel_size_nm gives the zebrafish EM volume (paper Table 1: 0.48 x 0.51 x 0.51 um, downsampled from 30 x 4 x 4 nm); the mouse micro-CT volume is 720 nm isotropic. Challenge page says raw images and train/val annotations are downloadable (Google Drive link) while complete annotations need a data request form. No license for the data is stated on the challenge page, project page or paper (the CC BY on arXiv covers the paper). File format and file listing could not be verified (Drive link not accessible, GitHub config 404), so formats is other and annotations_verified is false. 5%/5%/90% train/val/test split is from the paper. Modality: ssSEM for the zebrafish serial-section EM, X-ray for the micro-CT.'
