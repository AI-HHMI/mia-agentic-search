description: Mouse cortex serial-section SEM volume imaged with the SmartEM adaptive dwell-time pipeline
  at 4 x 4 x 30 nm (composite dwell-time EM, 94 sections), with a 3D segmentation channel from the paper's
  automated neuron reconstruction, plus a fast-dwell-time EM channel, a fused 10x10 volume, single-section
  fused, homogenised and segmentation data, and trained models, all on BossDB.
