notes: 'BossDB project page is rendered by script, so fields come from the BossDB API, the DataCite record (CC BY 4.0) and the bioRxiv full text. The segmentation is the paper''s lightweight automated 3D neuron reconstruction of the mouse cortex volume (99 ns/pixel effective dwell time), checked by expert annotators on dendritic spines, not a manual dense label; the paper also reports synapse segmentation validated against expert annotation, but no synapse channel was seen in the experiment listing. Volume dimensions come from the BossDB coordinate frame; the paper describes volumes of 68x60x3 and 118x102x3 um at 4 nm pixels, and which one is released was not stated. Sizes of the S3 prefixes were not available. Other prefixes under meirovitch2025/ (models, single_section, workflow_example_data) were not inspected. Annotations were not confirmed in a file listing, hence annotations_verified false.'
