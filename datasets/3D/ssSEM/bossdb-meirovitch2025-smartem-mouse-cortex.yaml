notes: 'BossDB project page is rendered by script, so fields come from the BossDB API, the DataCite record
  (CC BY 4.0) and the bioRxiv full text. The segmentation is the paper''s lightweight automated 3D neuron
  reconstruction of the mouse cortex volume (99 ns/pixel effective dwell time), checked by expert annotators
  on dendritic spines, not a manual dense label; no synapse channel was seen in the listing. Volume dimensions
  come from the BossDB coordinate frame and the info files. enricher: size from complete S3 listing of
  the whole project (was null); annotations confirmed (segmentation stored as RGB colours, uint8 x3).'
