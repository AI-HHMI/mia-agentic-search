notes: 'Directory listing: raw_data (tiles by section range), alignment_TrakEM2, catmaid (export JSON 51 MB, image tiles,
  mesh volumes). Only some cells are reconstructed ("Some cells were manually reconstructed in catmaid"), so coverage is sparse;
  the number of reconstructed cells is not stated. Acquisition per INFO yaml: Zeiss Gemini 500, in-lens detector, 1.5 kV,
  3 nm pixel, 30 nm sections; tile dimensions and layouts vary by section range, bit depth 8 or 16 (EMPIAR page). Some raw
  images in the middle of the stack are corrupted (corrupt_file_list_.txt); the aligned CATMAID tiles (jpg) are unaffected.
  No paper is linked (EMPIAR citation is the entry itself). 37.1 TB total per the EMPIAR page. License CC0 from the EMPIAR
  policies page. enricher: tiles probed/sampled; voxel size confirmed from INFO yaml.'
