notes: 'Landing page is a JS shell; facts come from the BossDB API, S3 listing and the paper. S3 layers: P3 em,
  cf-segs-1-mip3, cf-syns-mip3-1, p3-soma-segs; P7 em, p7-cf-segs-1-mip3, p7-cf-segs-mip3, p7-pc-soma-segs-1-mip3,
  p7-pc1-segs-1-mip3. Both em info files list 49152 x 57344 x 2528 at 4 x 4 x 30 nm (coord frames differ). Labels
  cover only reconstructed objects (one Purkinje cell with its inputs, plus Purkinje somata): partial; P7 started
  from a Rhoana subvolume edited in Mojo, extended in VAST. BossDB states no licence; CC-BY-4.0 is from the Mendeley
  record (paper itself is CC BY-NC-ND). enricher: technical block added; size estimated from the info files.'
