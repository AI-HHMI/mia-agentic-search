    level only, over the info bounding box (the imaged tissue may fill less of it; chunks are gzip-compressed on
    S3). Inspected: all 10 store info files (S3 listing of wilson2019/P3/ and /P7/); sampled one P3 label chunk
    (cf-segs-1-mip3 32_32_30/2143-3167_2014-3038_800-801, 1024x1024x1 uint32: 6 values 0-299, 99.9% background)
    and one P3 EM chunk at 32x32x30 nm (32x256x256 uint8, range 0-244, mean 161); value ranges are from these chunks
    only. Labels exist only at 32x32x30 nm (mip 3) with voxel offsets into the EM''s 32 nm level; the P7 tiles p7-cf-segs-mip3/cfs-mip3-1
    (x offset 6516) and the cfs-mip3-2/-3 tiles (chunk names from x 15572, no info file) lie outside the 6144 px
    x extent of the P7 EM info, so they were left out. BossDB coord frames: p3 49152x65537x1658, p7 360448x490496x2528
    voxels at 4x4x30 nm (api.bossdb.io), unlike the S3 info extents. Encodings other than P3 cf-segs (instance IDs,
    hundreds of IDs) were not sampled.'
