title: P7 mouse cerebellum ssSEM molecular layer
short_name: Cerebellum parallel fiber masks (ssSEM)
description: Training data for the CellWalker 2D-UNet segmentation notebook, cut from a serial-section SEM volume of
  the mouse cerebellar molecular layer. The zip holds 85 EM slices with matching manual segmentation masks (seg, seg_eroded
  and seg_membrane variants), a 7-slice test set (em_test, seg_test with eroded and membrane variants) and a folder
  of 2010 images of the test-set predictions (ml_segmentation_test_1), plus the VAST volume and segmentation
  files (.vsv / .vsseg) the slices were exported from.
