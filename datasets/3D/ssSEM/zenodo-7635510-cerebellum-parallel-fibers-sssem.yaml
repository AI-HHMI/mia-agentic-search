notes: 'Voxel/pixel size is not stated on the Zenodo record, in the zip (coordinates.txt only says "Exported at mip3") or
  in the CellWalker paper; the Zenodo record 7594891 for the source volume gives no resolution either. Image dimensions
  and mask value encoding (binary vs instance ids) were not inspected, so the annotation type is the semantic-segmentation
  reading of the folder names. The CellWalker paper (Methods: manual ground truth annotation by the authors, 2D UNet
  trained on it) describes the training workflow, but the Zenodo record does not cite it, so the link is by the
  record''s own description. Checked: Zenodo page and API record, zip listing (peek_archive), CellWalker full text, CellWalker-notebooks GitHub page.
  The 2010 prediction images in ml_segmentation_test_1 are model outputs, not ground truth; n_items counts the 85 + 7 EM slices.'
