  notes: 'Probed all 9 info files (raw encoding, 5 levels; chunks served gzip). Masks are sparse, so the
    coarsest level was listed to find occupied chunks; sampled the largest coarsest-level chunk of each
    mask and the raw chunks at the same place (~18 MB downloaded): mitochondria mask 64 nm chunk {0: 227751,
    255: 34393}; nerve ring mask 32 nm chunk {0, 255}; boutons rescan mask 64 nm chunk {0, 255}; rescans
    uint8 0-255 mostly zero outside rescanned tiles; overviews uint16 (28-65043, 0-65519, 1-65533). Value
    ranges from one coarse chunk each. Voxel sizes differ per experiment (4x4x30 nm human, 2x2x30 nm worm,
    from the info files); the record keeps 4x4x30. A complete chunk listing was not attempted (the mitochondria
    section alone has >1 M chunk positions at 4 nm). License: none on the BossDB API, no DataCite DOI,
    the paper states none; the GitHub LICENSE covers code only. size estimated (uncompressed, finest level
    of all 9 layers; masks and rescans are mostly zero, so the stored data is far smaller): 3,013,859,082,240
    B (3.0 TB).'
