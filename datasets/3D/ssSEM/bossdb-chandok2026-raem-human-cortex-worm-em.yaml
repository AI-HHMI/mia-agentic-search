notes: 'Fields come from the BossDB API and the RAEM bioRxiv full text. No license is stated on the paper
  or in a DataCite record, so license is unknown. Per the paper, mitochondria masks are automated (MitoNet;
  precision 0.99, recall 0.83 on five tiles), bouton masks are manual (20 boutons in VAST) and rescan
  masks are binary scan bitmaps; how the nerve ring mask was made is not described, hence mixed source
  and partial coverage. Voxel size is that of the human cortex rescans (4 x 4 x 30 nm); the nematode (P.
  pacificus) nerve ring is 2 x 2 x 30 nm and overviews are 8 or 16 nm. BossDB volume sizes: boutons 57344
  x 57336 x 60, mitochondria section 860160 x 552955 x 1, worm 81920 x 32768 x 17 voxels. Preprint from
  2026. organisms: Homo sapiens = human_boutons/, human_mitochondria/; Pristionchus pacificus = worm/.
  enricher: masks sampled, all binary 0/255; worm volume has 30 sections (info file), not 17.'
