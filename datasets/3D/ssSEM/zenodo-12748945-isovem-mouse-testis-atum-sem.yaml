notes: 'Unlabeled training data: the volume is the self-supervised training input of IsoVEM
  (lateral sections supply the high-resolution target), not an annotated set. Organism, sample,
  section thickness (40 nm) and pixel size (5 nm) come from the EMPIAR-12157 deposit of the same data
  (AutoCuts-SEM); the Zenodo page, GitHub README and the preprint text do not state them. The Zenodo
  file header (ImageJ TIFF, 157 slices of 4912x6040, uint8) gives no usable voxel size (slice spacing
  1 um, probably a placeholder); EMPIAR lists 158 images and 4.4 GB. License is CC BY 4.0 on Zenodo;
  EMPIAR-12157 holds the same data but its API record states no license. The preprint does not
  describe this sperm volume or give a data-availability statement beyond the code link.'
