title: The sperm dataset for IsoVEM method
short_name: Mouse testis anisotropic volume EM (ATUM-SEM)
description: A single anisotropic volume-EM stack of curved spermatotubules in mouse testis,
  collected by AutoCuts-SEM (ATUM-SEM) with 40 nm section thickness and 5 nm pixel size.
  It was released with the IsoVEM paper to promote research on isotropic reconstruction of
  volume EM. IsoVEM learns axial resolution from the lateral high-resolution information of
  such volumes in a self-supervised manner, so no manual labels are provided or needed.
