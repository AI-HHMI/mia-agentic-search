notes: 'Read via BossDB API/intern (bossdb://witvliet2020/<experiment>/<channel>); no single archive. The project page is JavaScript-rendered (empty to WebFetch), so collection details come from api.bossdb.io. No license stated in the paper Data availability or the BossDB record. Per-dataset voxel sizes differ (nm, x=y/z): D1 1/30, D2 0.64/50, D3 1/30, D4 1/30, D5 2/30, D6 0.768/50, D7 1.325/50, D8 2/30, so voxel_size_nm is null. Dataset_N holds EM, Dataset_N_Segmentation the segmentation/synapses (4 nm xy for D1); Dataset_7 has no segmentation. Paper: 94,374 images, ~5 teravoxels; bytes and publication date not read this run.'
