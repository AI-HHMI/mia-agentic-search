notes: 'Read via S3 (bossdb-open-data/witvliet2020/) or the BossDB API; no single archive. Licence CC-BY-4.0
  from the DataCite record of the BossDB DOI 10.60533/boss-2020-fqi7 (found by the enricher; was unknown).
  Per-dataset voxel sizes differ (nm, x=y/z, from the info files and coord frames): D1 1/30, D2 0.64/50,
  D3 1/30, D4 1/30, D5 2/30, D6 0.768/50, D7 1.325/50, D8 2/30, so voxel_size_nm is null. Dataset_N holds
  em plus full-resolution segmentation layers; Dataset_N_Segmentation holds segmentation, synapses and
  a template image on a 4-8x coarser grid; Dataset_7 has a uint16 segmentation only in Dataset_7/. Paper:
  94,374 images, ~5 teravoxels.'
