  notes: 'listing.py over data/ stopped after 92 directories / 50,578 files (487.7 GB, HTTP index sizes,
    not exact), so size stays page-stated (EMPIAR API dataset_size 496.4 GB). Probed raw Tile_r1-c1_S_001
    of cs7 (19048x12539 uint8, uncompressed, single page, plain TIFF, no calibration read) and catmaid_tiles/0/0_0_0.jpg
    (1024x1024 uint8 JPEG). tools/sample.py on the 239 MB raw tile timed out after 15 min, so no value
    range. Read the first 1.5 KB of the CATMAID export (range request); skeleton count not computed. Voxel
    size 2.8x2.8x50 nm confirmed by INFO_Mnemiopsis.yaml (processed_image_metadata.voxel_size) and EMPIAR
    pixel_width 2.8. No single archive: data.download_url stays the data/ folder; all files are direct
    https on ftp.ebi.ac.uk with range requests. Labels are skeletons in CATMAID project space, not voxel
    masks; turning them into a label volume needs the CATMAID stack geometry and is not settled here.
    CATMAID JPEG tiles (aligned stack the skeletons refer to) are not listed as an array because the miao
    layout has only raw/labels.'
