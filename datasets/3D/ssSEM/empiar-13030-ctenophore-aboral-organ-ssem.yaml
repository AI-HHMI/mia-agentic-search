notes: 'Directory listing (HTTP index): raw_data (16 folders, 1,003 TIFF tiles of ~228 MB, several tiles
  per section), alignment_TrakEM2 (108 MB XML), catmaid_reconstructions (62 MB JSON export, ~49,570 JPEG
  tiles ~5.9 GB, 2 STL meshes). Aligned volume 17761 x 30563 x 620 px at 2.8 x 2.8 x 50 nm per the INFO
  yaml (sections: "620?" in the yaml, 620 in the EMPIAR record). Paper: all cells in the dataset were
  skeletonized and annotated in CATMAID (cell types, cilia, basal bodies) and 396 synapses were marked.
  Skeletons are not voxel label volumes, so label volumes would have to be derived. EMPIAR record states
  496.4 GB. License CC0 from the EMPIAR policies page (paper itself is CC BY 4.0). The same group deposited
  a similar Platynereis volume (EMPIAR-13714), which is a different organism and dataset.'
