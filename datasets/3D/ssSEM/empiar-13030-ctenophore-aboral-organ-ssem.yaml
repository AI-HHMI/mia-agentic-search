description: Serial-section SEM (array tomography) volume of the aboral organ of a 5-day-old Mnemiopsis leidyi
  cydippid larva (620 sections of 50 nm, 2.8 nm pixels, aligned volume 17761 x 30563 x 620), with TrakEM2
  alignment, CATMAID image tiles and the CATMAID reconstruction of all cells in the volume as skeletons
  with cell-type annotations, cilia and basal bodies, 396 annotated synapses, and outline meshes.
