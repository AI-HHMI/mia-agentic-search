schema_version: "1.1"
id: nucmm-zebrafish-em-mouse-uct-nuclei
title: "NucMM: 3D neuronal nuclei instance segmentation in zebrafish EM and mouse micro-CT volumes"
short_name: "NucMM neuronal nuclei (EM + micro-CT)"
description: >-
  Two fully annotated 3D volumes for neuronal nuclei instance segmentation: NucMM-Z, a serial-section
  EM volume of nearly the entire larval zebrafish brain (~170,000 nuclei), and NucMM-M, a micro-CT
  (X-ray) volume of mouse visual cortex (~7,000 nuclei). Instance masks were generated semi-automatically
  and proofread by neuroscientists in VAST. Training/validation chunks and the full raw volumes are
  released.
