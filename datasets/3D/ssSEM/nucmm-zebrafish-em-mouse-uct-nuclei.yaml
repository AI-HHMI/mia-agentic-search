notes: >-
  Voxel size given is for the zebrafish EM volume after the paper's downsampling (original 30 x 4 x 4 nm
  z,y,x; downsampled to 480 x 512 x 512 nm); the mouse micro-CT volume is isotropic 720 nm. Splits in the
  paper are 5%/5%/90% train/val/test; the released archives contain train/val chunks (27 + 27 chunks of
  64^3 voxels for zebrafish; 4 + 4 chunks of 192^3 for mouse). License 'mit' comes from the Hugging Face
  dataset metadata of pytc/NucMM (no LICENSE file in the repo; README contains only the front matter); the
  arXiv paper itself is CC BY 4.0. The pytc/NucMM repo's file list (NucMM-Z.zip, NucMM-M.zip) was checked
  with peek_archive. The full paper text on Springer is not open access; dimensions/resolution were read
  from the arXiv HTML version. A third-party mirror (MedOtter/NucMM-Z) exists and was not used as the source.
