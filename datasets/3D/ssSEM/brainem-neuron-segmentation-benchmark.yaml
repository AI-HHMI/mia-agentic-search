notes: 'Hugging Face collection is declared CC BY-NC 4.0 but does not relicense underlying data: MC93 and several subsets (FIB25, H01-AxonEM,
  Harris, ...) are CC BY 4.0, FlyWire is CC BY-NC 4.0, and AC3-AC4, FAFB, MiRA, CREMI, Wafer4 are "research use only". Download size 15.2 GB; 600 rows
  (480 train / 20 val / 100 test). Only MC93 has stated imaging parameters (SEMNova-1000, 4 nm XY, 50 nm section spacing, shape 20x3960x3990); the page
  gives no physical resolution for other sources, so voxel_size_nm and organism are left blank and modality lists ssSEM (MC93) plus other. FlyWire labels are
  the public consensus segmentation, not manual ground truth. Paper not found in Europe PMC/Crossref (paper.py), arXiv or OpenReview link not listed; only the NeurIPS 2026 poster
  page was read, so no paper Methods were available. No file listing beyond the HF page summary was inspected, hence annotations_verified false.'
