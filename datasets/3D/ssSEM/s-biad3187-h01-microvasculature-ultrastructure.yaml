notes: 'Study lists 2,950 label TIFF files (920 + 1,000 + 1,030) in three folders; individual files about 330 KB.
  Total size not computed. The matching raw EM slices are not in the archive: per the paper they come from the public
  H01 release (Google Cloud Storage) via a Python script in the GitHub repository, so the record is label-only;
  image bounding-box coordinates are in the file names. Labels were produced with custom Matlab functions (2D active
  contours) and a manually corrected 3D U-Net (paper, BioStudies), hence source mixed. BioStudies shows no licence
  and the paper text is CC BY 4.0 (article only), so the data licence is unknown. The study page says the manuscript
  was in review at release; the paper is now published. H01 itself has other catalog records (synapse ground truth).
  enricher: label values 15 and 16 occur in the files but are not in the class list above; BioStudies API shows
  no licence.'
