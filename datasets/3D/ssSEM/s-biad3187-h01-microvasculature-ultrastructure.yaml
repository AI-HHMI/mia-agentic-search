description: Dense multi-class label volumes for three capillary segments of the public H01 human cortex
  serial-section EM release (4 x 4 x 33 nm). Classes cover basement membrane, endothelial and pericyte
  cytosol, lumen, nuclei, ER, mitochondria, cell junctions and peg-and-socket contacts. Raw EM images
  are not in this deposit and are fetched from the H01 release.
