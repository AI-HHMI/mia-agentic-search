  notes: 'Size pass: FTP listing with exact sizes, 2,956 files, 766,941,270 B (confirmed; earlier HTTP index was rounded); 3 folders of slice TIFFs plus
    a .json and .tsv file list per vessel. probe.py on a Vessel1 slice: 4400x4400 uint8, PackBits, single page.
    sample.py: Vessel1 z600 max 20, 13 distinct values; Vessel3 z501 3300x2800, values {0: 7,768,380, 1: 279,335,
    2: 304,423, 3: 222,127, 4: 535,482, 7: 38,609, 8: 23,429, 11: 31,833, 12: 18,256, 15: 7,111, 16: 1,508, 17:
    5,809, 20: 3,698}. Slice size differs per vessel. Values 15 and 16 are absent from the class list in annotations.format.
    Semantic class IDs are per the deposit description. The BioStudies JSON API (attributes: Template, Title, ReleaseDate,
    AttachTo) has no licence attribute. No raw EM is included. Second pass: classes copied from the deposit description
    (15, 16 unnamed). Voxel size 4x4x33 nm confirmed in paper Methods ("ground truth images ... segmented at full
    resolution (4 nm x 4 nm x 33 nm)"). No archive: download_url stays the Files/ folder; per-slice TIFF URLs are
    usable.'
