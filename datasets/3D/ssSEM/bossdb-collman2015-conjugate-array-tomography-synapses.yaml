  notes: 'Sampled one 512x512x16 chunk each of collman14v2/EM10K (uint8, observed range 0-184, p1-p99
    19-141), collman14v2/annotation (uint64, 15 unique values, max 538) and collman15v2/annotation (8
    unique, max 229), decoded with a short requests+numpy script (compressed_segmentation decoder); value
    ranges are from one chunk each. Label encoding: instance ids inferred from the sample (many distinct
    ids in a sparse mask), not documented. Voxel size: the two experiments differ (3.72 vs 2.24 nm lateral,
    both 70 nm z); stated in the precomputed info files and the BossDB coord frames, so voxel_size_nm
    stays null per the one-size rule. Annotation coverage is still unknown: the paper full text was not
    reachable this run (PMC bot check, not open access on Europe PMC). The 23 immunofluorescence layers
