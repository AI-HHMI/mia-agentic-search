title: Mapping synapses by conjugate light-electron array tomography (BossDB collman)
short_name: Mouse cortex conjugate array tomography synapses
description: Two voxel-conjugate array tomography volumes of mouse S1 neocortex (collman14v2, 39 sections;
  collman15v2, 27 sections; 70 nm sections) imaged by scanning EM and multiplexed immunofluorescence (synapsin,
  PSD95, gephyrin, VGluT1, GABA, GAD and others), hosted on BossDB with an annotation channel per volume.
  The paper describes manual annotation of synapses in the SEM data.
