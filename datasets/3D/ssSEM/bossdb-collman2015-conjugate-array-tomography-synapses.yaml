notes: 'BossDB collection collman has two public experiments. collman14v2: 9888x7936x39 voxels at 3.72x3.72x70 nm,
  13 channels (EM10K, annotation, 11 immunofluorescence); collman15v2: 6306x4518x27 voxels at 2.24x2.24x70 nm,
  15 channels (EM25K, EM2k, annotation, 12 IF). The paper (open PMC text) describes a 39-section and a 27-section
  dataset and states that synapses in the SEM images were identified by manually inspecting the entire volume
  and marked in TrakEM2 (988 synapses in the larger dataset). That these are what the BossDB annotation channels
  contain was inferred from matching dimensions and section counts and was not checked in the channel data; the
  label encoding is undocumented. No license or data-availability statement was found on the paper, the BossDB
  API records or the S3 listing, so license is unknown. voxel_size_nm shows collman14v2 (EM); collman15v2 differs.
  Stored as neuroglancer precomputed on the public S3 bucket bossdb-open-data (info file read for collman15v2/annotation).'
