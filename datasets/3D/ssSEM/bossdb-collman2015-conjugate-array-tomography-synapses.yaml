notes: 'Two BossDB experiments, each with EM, an annotation channel and immunofluorescence channels, all
  on one grid: collman14v2 9888x7936x39 voxels at 3.72x3.72x70 nm (EM10K, 11 IF); collman15v2 6306x4518x27
  at 2.24x2.24x70 nm (EM25K, EM2k, 12 IF). The two share no voxel size, so voxel_size_nm is null (sizes
  from the precomputed info files and the BossDB coord frames). Paper (as read at harvest): synapses marked
  manually in TrakEM2 over the SEM volume, 988 in the larger dataset; that the annotation channels hold
  these is inferred from matching sizes. enricher: license CC-BY-4.0 from the BossDB DataCite record 10.60533/boss-2015-ejsn
  (was unknown); doi set from it; size from the complete S3 listing; annotation channels sampled (integer
  synapse ids).'
