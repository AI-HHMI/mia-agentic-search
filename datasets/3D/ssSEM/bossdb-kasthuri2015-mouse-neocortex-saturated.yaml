description: Serial-section EM volume of mouse somatosensory neocortex (layers 4 and 5) with a saturated reconstruction
  of sub-volumes in which axons, dendrites and glia and subcellular components (synapses, vesicles, spines, mitochondria)
  are segmented. Hosted on BossDB / NeuroData (kasthuri2015 collection with 3-cylinder neuron, synapse and mitochondria annotation
  channels) and as VAST files from the Lichtman lab.
