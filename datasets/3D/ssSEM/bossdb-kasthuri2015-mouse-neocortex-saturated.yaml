notes: 'Voxel size 6 x 6 x 30 nm from the BossDB coordinate frame kasthuri2015_6nm_offset0 (NeuroData
  lists the separate kasthuri11 image at 3 x 3 x 30 nm, ~660 GB). Annotations are of sub-volumes (two
  fully manual cylinders plus a semi-automatic cube; AC3/AC4 stacks) not the whole volume. The paper is
  not open access (Europe PMC: no full text), so only the abstract was read; the publication date and
  the exact annotated volume sizes are not stated on the pages read. VAST full 6 nm volume file is 138
  GB. Terms: NeuroData page says ODC-By v1.0; the VAST page gives no data-specific license. The paper
  url in publications is the Europe PMC record because the publisher page returned 403. enricher: label
  layers (11776 x 14336 x 1872) extend past the cc image (10752 x 13312 x 1856) from the same origin.'
