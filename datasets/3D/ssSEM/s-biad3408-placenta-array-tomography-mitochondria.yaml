description: Two aligned array-tomography SEM volumes (MRC) of healthy human placental villous tissue,
  with IMOD model files holding manual segmentations of cytotrophoblast (CTB) membranes, nuclei and syncytiotrophoblast
  (STB) boundaries. Serial 80 nm sections imaged on a Teneo VolumeScope. Deposited with a Nature Communications
  study of placental mitochondria.
