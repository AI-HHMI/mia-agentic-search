  notes: 'Header-level only: the IDR JSON API gives sizes, pixel types and physical sizes per image (x/y 0.230-0.360
    um, z 0.500 um; Fused_E875.ics has z 1.0; E875 zones have no z size). webclient/imgData failed for B1_C1 ("Error
    instantiating pixel buffer"), and IDR offers no range-readable file URL, so no pixel values were read. ROI count
    checked for B1_C1 only (61 ROIs). To train on it, the masks must be exported from OMERO (e.g. omero-py or the
    IDR Aspera/FTP bundle); they are not TIFF label files. Second pass 2026-10-06: direct files on the EBI IDR FTP
    mirror, including *_Manual.tif label stacks (readme: "labelled mask TIFF file"). Probed and sampled B1_C1: raw
