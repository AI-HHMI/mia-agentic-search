notes: 'File lists read in full: 21 raw TIFFs (32.9 MB) and 21 label TIFFs (2.07 MB), 129x111x117 voxels
  each (example), pixel size 0.6152 x 0.6152 x 0.7 um per the BioStudies attributes. No license or terms
  are stated on the BioStudies record or in the paper text, so license is unknown. Paper Methods: cell
  instances segmented with LimeSeg from manually placed seeds, then curated with a MATLAB proofreading GUI
  (manual deletion, merge, insertion), hence source is proofread. Cysts imaged on a Nikon Eclipse Ti-E laser
