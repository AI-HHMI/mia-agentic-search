id: zenodo-17544799-corneal-stromal-nerve-confocal
title: Ex vivo multispecies dataset for three-dimensional reconstruction of the corneal stromal nerve
  plexus using hexapod-based confocal microscopy and deep-learning segmentation
short_name: Corneal stromal nerve plexus 3D (confocal)
description: Large-area 3D confocal volumes of the corneal stroma from ex vivo porcine, murine, ovine
  and human corneas (fused en face mosaics per depth level), with deep-learning nerve segmentations for
  every volume and manually annotated nerve ground truth for one cropped porcine cornea used to train
  a 2.5D U-Net.
