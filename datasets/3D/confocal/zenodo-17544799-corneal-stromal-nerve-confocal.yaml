notes: 'Twenty-one zips: ConfocalVolumeFused (one per cornea: Human 00, Murine 00, Ovine 00, Porcine 00
  cropped/full and 01-05), NerveSegmentation (automated U-Net output, one per volume) and PorcineCornea_00-Cropped_NerveGroundTruth.zip
  (338 manually annotated TIFF slices, listed with peek_archive; the cropped porcine volume has 401 slices).
  Only the porcine ground truth is manual; all other masks are model predictions (annotations.source mixed).
  Voxel size, bit depth and microscope are not stated on the Zenodo page and no associated paper was found
  by tools/paper.py (title search in Europe PMC / Crossref), so they are null; Zenodo record lists no
  related publication. organisms: Sus scrofa = PorcineCornea_*, Mus musculus = MurineCornea_00_*, Ovis
  aries = OvineCornea_00_*, Homo sapiens = HumanCornea_00_*.'
