notes: 'Images.zip (134 MB) holds 165 TIFF volumes (train 121, test 44; names like Emb1_t051.tif, i.e. sampled time points of the time series); GroundTruth.zip holds NSN/NDN/QCANet labels for train and QCANet labels for test. Voxel size 0.8x0.8x1.75 um (train) and 0.8x0.8x2.0 um (test, different imaging conditions) per the dataset page; the test z-step differs. Paper reports a CSU-W1 SoRa spinning-disk system for the immunostained embryos; microscope for the training time series is only described as 3D confocal, so modality is listed as confocal. Total size not recorded (two zips, compressed 134.1 + 2.1 MB). Checked: dataset page, both zip listings, paper Methods and Data availability. Licence per dataset page: CC BY 3.0.'
