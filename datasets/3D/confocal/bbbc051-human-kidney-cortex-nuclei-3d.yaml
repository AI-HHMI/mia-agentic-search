title: BBBC051 - Human kidney cortex cells (NephNuc 3D DAPI nuclei by cell type)
short_name: Human kidney 3D DAPI nuclei cell types (confocal)
description: Confocal DAPI nuclear volumes cropped from 50 um sections of three human kidney cortex specimens, for training cell-type classifiers. About 230,000 nuclei image volumes (32 x 32 x 7 voxels each) were labelled by unsupervised tissue cytometry with marker-intensity clustering and expert validation. Images are distributed per specimen (F33, F44, F59) as zip archives of volumes and projections organised by cell class (proximal tubule S1S2/S2S3, thick ascending limb, distal convoluted tubule, collecting duct/connecting tubule, leukocytes CD45, glomerular and interstitial endothelium, podocytes), with a groundtruthlabels.txt file describing the classes.
