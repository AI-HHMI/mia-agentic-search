notes: 'Images.zip (peek_archive: 37 files, about 3.1 GB) holds one folder per specimen (F33, F44, F59) with nested per-class zips (S1S2, S2S3, TAL, DCT, CD/CNT, CD45.0-2, CD31glom, CD31int, Nestin); the nested zips were not opened, so file formats inside and exact nucleus counts per class are unverified (format listed as other). Voxel size 0.5 x 0.5 x 1.0 um and the roughly 230,000 volumes of 32x32x7 voxels come from the paper Methods (PMC8382162). Labels come from unsupervised clustering of marker intensities with expert validation, not manual annotation. The paper reports 11 classes and per-class counts only in a supplementary table.'
