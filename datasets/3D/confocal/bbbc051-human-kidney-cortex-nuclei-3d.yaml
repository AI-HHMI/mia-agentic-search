  notes: 'Each folder also holds one images_*.csv (one row per object, e.g. 193 rows for 193 objects in F59/CD45.1; an index,
    a number, then flattened pixel values; columns undocumented), not listed as an array. Class labels are given only by the
    per-class zip name (no label arrays); groundtruthlabels.txt lists the classes. Images.zip contains nested zips: TensorSwitch
    can fetch an inner zip as <Images.zip>::F59/CD45.1.zip (download-check usable, ranges OK) but not a TIFF inside it. value_range
    [0, 239] from 4 All_3D files of F59/CD45.1 only; one Mask_3D file had background 0 and 193 other values (smallest nonzero 13). Object counts
    per class: F59/CD45.1 193, F44/CD45.2 1222 (All_3D) / 1176 (Mask), F33/CD31_glom 2787 / 2750; other classes not counted
    (whole zips not opened). Inner zips were read in memory, 56.3 MB downloaded in total. Voxel size 500x500x1000 nm confirmed
    in paper section 2.3 (''1.0-um z-spacing and 0.5 x 0.5 um pixels''); TIFF headers carry no calibration.'
