notes: 'Images.zip holds F33/F44/F59 folders with nested per-class zips (S1S2, S2S3, TAL, DCT, CD/CNT, CD45.0-2, CD31glom/int,
  Nestin); each inner zip has All_3D (nucleus with context), Mask_3D (segmented nucleus on black background) and Mask_2D_Maximum
  (max projection of Mask_3D) TIFFs plus one CSV per folder. Voxel size 0.5 x 0.5 x 1.0 um and ~230,000 nuclei volumes of
  32x32x7 from the paper (PMC8382162). Labels come from unsupervised clustering of marker intensities with expert validation.
  enricher: formats other -> tiff (inner zips opened); size_bytes from file listing.'
