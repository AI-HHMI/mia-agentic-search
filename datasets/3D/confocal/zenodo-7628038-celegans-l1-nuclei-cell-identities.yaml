  identities in C. elegans
short_name: C. elegans L1 nuclei cell identities (confocal)
description: 1,055 confocal 3D image stacks of DAPI-stained newly hatched C. elegans L1 larvae (each worm
  computationally straightened), with a nuclear segmentation mask and a per-nucleus cell identity annotation
  file (558 nuclei per worm) for each stack. Released with the RAPCAT cell-annotation tool and a transcription
  factor expression atlas; 301 stacks were manually annotated, the rest straightened and segmented automatically
  with the CellExplorer pipeline.
