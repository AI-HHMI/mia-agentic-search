notes: 'Zenodo record lists 1,056 files (1,055 stack zips plus vano_win32_1.741.zip, a Windows viewer). Each stack zip (checked one: aha-1_XIL029_20131021_0001, 164 MB unpacked) holds *_crop_straight.raw (the straightened image, Peng Hanchuan RAW), *_S1.ano.mask.raw (segmentation mask), *_S1.autorecog.txt (cell annotation) and *_S1.autorecog.ano. Paper Methods: Zeiss confocal, 63x oil objective NA 1.4, 0.116 um XY and 0.122 um Z sampling; 301 of 1,055 stacks manually annotated, 754 straightened and segmented by CellExplorer, masks manually curated in VANO; the extent of manual review of identities on the other 754 was not verified here, hence source mixed. Image dimensions, dtype and channel count are not stated on the record and were not read from the RAW headers. Raw files have no standard header, so formats is other (not a listed format). The 100 + 100 training/test stacks used for RAPCAT are described in the paper (Supplementary Data 1), not as a split in the Zenodo record.'
