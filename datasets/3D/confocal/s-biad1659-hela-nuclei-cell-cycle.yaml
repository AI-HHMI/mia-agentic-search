notes: 'Phase labels (G1/S/G2-M) were assigned from PIP-FUCCI intensity over tracks that were manually
  reviewed (15,026 tracks); 346,028 nuclei are unlabeled. Nucleus masks are Cellpose 2.0 output fine-tuned
  on 20 frames, so partly automatic. Images are cropped nuclei in OME-TIFF (one probed raw file: 3 channels
  x 5 z x 195x206, uint16; mask 2D uint16). Pixel size 0.102 um from the BioStudies acquisition text,
  z spacing 1 um; whether every crop has 5 planes was not checked. Paper describes 10-fold cross-validation
  by field of view (159 fields) but no split files were found in the listing. Total size not computed
  (directory too large to list). Sources: BioStudies record, file/annotation lists (first rows), paper
  full text (Europe PMC).'
