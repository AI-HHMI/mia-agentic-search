notes: 'Four image volumes (WD1_15-02 and WD2.1_21-02 confocal; WD1.1_17-03 and WD3.2_21-03 multi-photon) with matching
  *_segmented.ome.zarr.zip volumes, about 58 MB in total (sizes from the FTP index, rounded). Files are zipped OME-Zarr in
  Files/ at https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/843/S-BIAD843/Files/. Voxel size given is the confocal one
  (0.0430x0.0430x0.5002 um); the multi-photon volumes are 0.0430x0.0430x0.2985 um. No licence or terms are stated in the
  BioStudies record; no associated publication is listed (the DOI 10.1038/s41567-019-0618-1 only cites the culture method),
  so none was read. Annotation is Cellpose prediction corrected manually in napari, hence source mixed.'
