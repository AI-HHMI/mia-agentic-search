notes: 'IDR idr0100 = IDR project 1451, data DOI 10.17867/10000152. 5 samples x 4 files (Axon, Ground_Truth, Nucleus, Oligodendrocyte)
  under Files/20201022-ftp/experimentA/Sample_Myelin_ImagesN/. Annotation: two experts in CEMotate, a third expert made the
  gold standard. enricher: xy 830.27 nm is the calibration of all 5 images in IDR; z 1.2 um is stated only for Sample 1 (header
  + IDR); the paper says ''1-um-thick optical z-sections'' (thickness, not a step), so z for samples 2-5 is unconfirmed. Licence:
  BioStudies, IDR and the paper say CC BY 4.0; the IDR submission template inside the files says ''CC BY-NC 4.0'' (draft metadata).
  Ground truth sparse in z: in Sample5 only 1 of 6 read slices has myelin pixels. Size from exact file sizes (was null).'
