notes: 'Also IDR idr0100 (the paper text says idr0100 but its reference list says project 1451). 5 samples x 4 files
  (Axon, Ground_Truth, Nucleus, Oligodendrocyte) under Files/20201022-ftp/experimentA/Sample_Myelin_ImagesN/. Header probe of Sample1:
  uint8, 47 x 2253 x 8346 (zyx), ImageJ TIFF; the voxel size is the Sample1_Axon.tif calibration (0.8303 um xy, 1.2 um z). The paper
  states 1 um z-sections and does not give the xy pixel size, so the calibration is from the header of one file only and the
  Ground_Truth header is uncalibrated; the other samples were not probed. Ground-truth label values were not documented in the paper
  (binary assumed, not verified). Total size not stated; not summed. Annotation: two experts in CEMotate, a third expert made the
  gold standard. The paper full text is not on Europe PMC; the F1000Research article page was read instead.'
