id: scaffold-a549-3d-nuclei
title: 'Scaffold-A549: 3D confocal fluorescence volumes of Hoechst-stained A549 nuclei for unsupervised nuclei segmentation'
short_name: A549 3D nuclei in scaffolds (confocal)
description: 21 confocal volumes (512 x 512 x 64 after preprocessing) of A549 lung cancer cells cultured in fibrous
  scaffolds with Hoechst 33342-stained nuclei. 20 volumes are unlabelled training images and one test volume
  carries a manually annotated instance label volume of more than 800 nuclei. Released as a benchmark for
  unsupervised nuclei segmentation.
