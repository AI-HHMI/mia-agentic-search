notes: 'Zip index read without downloading (161.8 MB compressed, 423.4 MB uncompressed): 21 .npy volumes
  (20 in train/, 1 in test/ plus sf_a549_21_Label.npy) and 21 preview PNGs. Only one volume is annotated;
  the 20 training volumes are unlabelled and intended for unsupervised training. README: Zeiss LSM-880, 20x/0.5
  air objective, ~60 um scan depth, images resized to 512 x 512 x 64; the released voxel size is not stated
  (the AD-GAN preprint quotes 0.4151 um per voxel for the original 1024 x 1024 x 128 stacks), so voxel_size_nm
  is null. The paper full text is not open access, so only its abstract and metadata were read. Data are
  NumPy .npy, which is not in the schema format list, hence formats: [other]. License: the repository shows
  MIT; the README gives no separate data terms, so whether MIT covers the data is an inference.'
