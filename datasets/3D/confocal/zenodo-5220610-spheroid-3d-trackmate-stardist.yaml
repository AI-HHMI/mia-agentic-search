id: zenodo-5220610-spheroid-3d-trackmate-stardist
title: Segmenting cells in a spheroid in 3D using 2D StarDist within TrackMate
short_name: DCIS spheroid 3D nuclei labels (confocal)
description: One 3D confocal Z stack (64 x 512 x 512, uint16) of MCF10DCIS.com spheroids with DAPI-stained nuclei, plus its
  3D instance label image (uint16 instance ids). The labels were generated for a TrackMate tutorial by running the 2D StarDist
  detector on each slice and linking the 2D labels in Z with the LAP tracker. The record also holds a second, RGB label image
  (64 x 512 x 512 x 3, uint8) whose matching raw image is not included.
