notes: 'Tutorial data, not a curated benchmark: a single raw volume with an automatically generated label image
  (StarDist 2D per slice, linked in Z with TrackMate; the tutorial describes no manual correction). The x/y pixel
  size (247.6 nm) is the calibration stored in the ImageJ TIFF header (probe); z spacing is not stored. Organism is not
  stated on the Zenodo page or the tutorial (cell line MCF10DCIS.com only). No paper is linked from the record. The
  second label image (LblImg_day 6 shctrl ...) is RGB with no matching raw image in the record, so it is not usable
  for training on its own. Checked: Zenodo page and API record, TIFF headers, ImageJ TrackMate-StarDist tutorial.'
