  notes: 'Listing: Zenodo API + zip central directory (830 members), complete, exact sizes. Sampled three
    subsets with sample.py (zip member reads, 34.8 MB): Neurosphere/OriginalStack (raw uint16 116x150x150,
    0-65535, 90.5% zeros; mask uint8, 52 values 0-255), Fluo-N3DH-SIM+/01_t000 (raw uint16 59x349x639,
    68-280; mask uint16 values {0,3,4,5,7,9,10}) and 12spheroids/1 (raw float64 49x256x256, 0-255; mask
    int16, 77 values 0-76). dtype and range differ per subset, so the arrays are listed per sampled subset;
    the other 8 subsets were not sampled. Masks are instance IDs per the record (instance-segmentation)
    and the many distinct IDs; the SIM+ mask with 7 IDs has few instances in this simulated time point.
    axes zyx: tifffile reports an unlabelled page stack (I/Q), taken as z. TIFF compression not read (probe
    not run on members), hence unknown. Voxel sizes are not stored per subset in what was read.'
