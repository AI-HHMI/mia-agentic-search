  notes: 'Listing: Zenodo API + zip central directories, 4 files, 48,208,513,773 B exact (399 zip members: 150 data
    + 150 mask in nuclei zip, 99 tif in foci zip). Probe: data_000.tif (both zips) plain TIFF, page 1010x1362x3
    float32, LZW, no calibration tags. Sample: nuclei data_000.tif (209,131,869 B) full shape [50,1010,1362,3] float32,
    range 87-848 (one sample, mean 112), mask_000.png uint8 {0,255}, 9.5% foreground. Masks are 2D although the
    raw is 3D. Foci annotations are not in this record (the paper releases them in later Zenodo records). Voxel
    size: record value kept (paper Methods: images 90.0 x 67.2 x 15 um = 1392 x 1040 x 50 px, z step 0.3 um; files
    are 1362 x 1010 px, i.e. cropped by 30 px, same pixel size). TIFF headers carry no calibration. Download: two
    direct archives (nuclei zip, foci zip) on zenodo.org/api, so download_url stays the record page. Readiness:
    the planner treats PNG labels as slices of one stack; here each mask is one 2D image per stack (planner limitation).'
