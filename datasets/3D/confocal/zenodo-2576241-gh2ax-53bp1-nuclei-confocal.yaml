title: Confocal microscopy of gH2AX and 53BP1 DNA repair foci of cells exposed to gamma-irradiation, pt. 3/3 (training data with nuclei masks)
short_name: gH2AX/53BP1 irradiated cell nuclei (confocal)
description: Training part of a three-part dataset of 3D confocal stacks (3 channels, ~50 z-slices) of head and neck tumor
  and non-tumor primocultures, U-87 glioblastoma cells and normal human dermal fibroblasts exposed to 60Co gamma
  irradiation and immunostained for gH2AX and 53BP1 with DAPI counterstain. The nuclei archive holds 150 field-of-view
  TIFF stacks with matching PNG binary nuclei masks; a second archive holds 99 further field-of-view TIFF stacks
  for foci training.
