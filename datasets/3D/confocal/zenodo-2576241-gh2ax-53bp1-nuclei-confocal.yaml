notes: 'Voxel size computed from the paper Methods (90.0 x 67.2 x 15 um field of view = 1392 x 1040 x 50 px, z step
  0.3 um); not stated per file. The 150 nuclei stacks come with PNG masks (seen in the zip listing); the 99 foci
  stacks have no mask files in their archive listing, so foci annotations were not verified; the description xlsx
  files were not opened. The paper cites later records (10.5281/zenodo.4067741, 5549971) as its annotated releases;
  this record is the 2019 training part. Archives are very large (29.2 GB + 19.1 GB). Paper checked: Methods and
  Data availability. enricher: size from file listing (was zips only); download_url set to record page (two archives).'
