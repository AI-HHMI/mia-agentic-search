notes: 'Voxel size 0.1826 x 0.1826 x 0.334 um is from the Metadata.txt inside one zip (image 280, 40x) and may differ
  for other stacks, e.g. the Airyscan ones. The Metadata.txt there records watershed segmentation (sigma, min volume
  40 um3, level 4) followed by correct_segmentation, so labels are automatic plus manual correction. The zenodo
  text says cells were manually corrected; segmentation files were seen only in that one zip listing (_seg.tif,
  _walls.tif, _layers.tif, cell_data.csv); the other 65 zips were assumed equivalent from the record description.
  Modality is Airyscan/confocal per file names. The manuscript (Yates et al. 2026) was not found in Europe PMC
  and the record lists no paper DOI, so no paper was read. Total size is the sum of the 66 zip sizes.'
