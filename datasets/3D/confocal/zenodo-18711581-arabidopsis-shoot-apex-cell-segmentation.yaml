  notes: 'Exact Zenodo listing: 66 zips, 44,672,603,996 B. Listed zips 280 (40x) and 366 (Airyscan); same
    member set. Headers of deflated members are not readable remotely, so 366''s _R.tif and _seg.tif were
    sampled (204 MB): R 353x880x880 uint8, 0-255, mean 31 (plain multi-page TIFF; pages recorded as z
    because the Zenodo text calls these 3D confocal stacks and Metadata.txt gives a z voxel size); seg
    uint16, 8,164 IDs, max 65305. Metadata.txt says R was converted from 16 to 8 bit with max 20000, hence
    contrast-stretched. Voxel sizes differ per image (Metadata.txt): 280 0.1826x0.1826x0.334 um, 366 0.1833x0.1833x0.25
    um, so imaging.voxel_size_nm is null; each zip''s Metadata.txt states its own.'
