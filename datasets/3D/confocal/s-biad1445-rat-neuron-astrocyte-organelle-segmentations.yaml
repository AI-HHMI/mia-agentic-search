notes: 'BioStudies: CC0 (the paper itself is CC BY 4.0). Images: Zeiss LSM 880 spectral confocal, 63x/1.4, voxel 0.08 x 0.08 x 0.41 um, Z-stacks 1688 x 1688 per slice, time-lapse single plane 1124 x 1124 every 5 s for 60 frames; unmixed to 6 channels and Huygens-deconvolved. Segmentation: infer-subc workflows with qualitative checks; the paper says 20.55% of neuron segmentations were manually edited, so the masks are automatic with manual correction (mixed). File list counts for segmentation folders: C2-108 273, C2-121 222, VD-0609 208, C2-107 207, VD-0505 168, VD-0428 152, VD-0512 144 files (each organelle is a separate file per image). 8,960 files in total (BIA info). Dimensionality is recorded as 3D for the Z-stacks; the 99 time-lapse series are 2D+t. Masks for time-lapse images were not separately checked. Same group as the iPSC neuron record s-biad2983 but different cells, species and images. Publication date of the entry was not read from the record.'
