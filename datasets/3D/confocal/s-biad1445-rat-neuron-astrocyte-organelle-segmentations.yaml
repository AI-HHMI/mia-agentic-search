description: 173 six-channel confocal Z-stacks and 99 single-plane time-lapse series of live primary rat
  cortical neurons and astrocytes (control, sodium arsenite, thapsigargin) with simultaneously labelled
  ER, lysosomes, mitochondria, peroxisomes, Golgi and lipid droplets, linearly unmixed and deconvolved,
  each with infer-subc organelle instance segmentation masks (about 1,400 mask files).
