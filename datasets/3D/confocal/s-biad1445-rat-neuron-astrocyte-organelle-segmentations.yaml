notes: 'BioStudies: CC0 (the paper itself is CC BY 4.0). Images: Zeiss LSM 880 spectral confocal, 63x/1.4,
  voxel 0.08 x 0.08 x 0.41 um, Z-stacks 1688 x 1688 per slice, time-lapse single plane 1124 x 1124 every
  5 s for 60 frames; unmixed to 6 channels and Huygens-deconvolved. Segmentation: infer-subc workflows
  with qualitative checks; the paper says 20.55% of neuron segmentations were manually edited (mixed).
  Segmentation folders hold 8 masks per Z-stack image (cell, nuc, ER, golgi, lyso, mito, perox, LD); the
  99 time-lapse series (2D+t) have none. Same group as the iPSC neuron record s-biad2983 but different
  cells, species and images. enricher: OME header 79.947 x 79.947 x 396.091 nm vs paper 80 x 80 x 410
  nm; paper value kept.'
