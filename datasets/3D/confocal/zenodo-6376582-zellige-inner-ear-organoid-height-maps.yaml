title: 'Zellige example dataset: inner ear organoid epithelium'
short_name: Inner ear organoid epithelium surfaces (confocal)
description: A single day-14 mouse embryonic stem cell-derived inner ear organoid, phalloidin and DAPI
  stained, imaged as one confocal z-stack (520 x 465 x 35 px). The stack contains two dome-shaped epithelial
  surfaces (apical junctional network and basal epithelium). Expert-drawn ground-truth height maps for
  both surfaces are provided together with the height maps reconstructed by the Zellige software.
