notes: 'Very small: one confocal volume with ground-truth height maps for two surfaces (surface extraction, not voxel masks), so the training signal is a single example; it is an example/benchmark case of the Zellige tool. In-plane pixel size 0.690 µm is from the Zenodo description; the z step is only stated as "above 1 µm", so z is null. Zenodo lists five files (~9.2 MB): the raw stack IEorganoid_C2-EXP6.6_Cntl_F10_Phalloidin_DAPI_25x.tif and Surface1/Surface2 ground-truth and Zellige height maps. Sources checked: Zenodo record/API, preprint full text (Methods, Example 4, data availability). Size is the sum of the listed file sizes.'
