notes: '24 image stacks (45.1 GB) and 24 mask stacks (57.4 GB); paper Hue et al. 2025 (Adipocyte). Masks: Cellpose 2 model
  retrained on 8 manually corrected images (1694 masks), border/sphericity < 0.35/< 5000 voxel objects removed in Fiji, each
  stack manually checked in 2D/3D (study + paper Methods). enricher: annotations.source automatic (inference + filter, manually
  validated; was mixed). enricher: voxel size left null, two groups: 20 stacks (M13-M19) 1154x1154x1159 nm in the ImageJ headers,
  matching the paper''s ''voxel size was 1.15x1.15x1.15 um''; the 4 M12 stacks (2022-03-17 to 04-01) 576.8x576.8x999.4 nm
  (masks 580 nm xy, no z). Images are RGB-stored (green 5-DTAF, red Nile Red). No train/test split.'
