notes: "24 image stacks (45.1 GB) and 24 mask stacks (57.4 GB) listed in trout_adipose_tissue.json. Masks come from a Cellpose 2 model trained human-in-the-loop for this staining; objects touching the stack border, with sphericity < 0.35 or < 5000 voxels were removed in Fiji and each stack was manually checked in 2D and 3D (source: study description). Images are RGB-stored TIFF stacks (green = 5-DTAF, red = Nile Red); voxel size is not stated in the BioStudies record and the TIFF header carries no calibration. No paper is listed in the study record. No train/test split."
