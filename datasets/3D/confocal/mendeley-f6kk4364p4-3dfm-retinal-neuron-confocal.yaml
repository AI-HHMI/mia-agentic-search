notes: 'Mendeley API lists 48 TIFF files (9.2 GB) in folders 3DFM_AC/{Stacks,GT} (22 + 22) and 3DFM_BCPop/{Stacks,GT} (2 + 2). Ground
  truth, per the description, is the highest-quality available image passed through a Frangi filter and binarized, so labels are algorithmic,
  not hand-drawn. Zeiss LSM 510, 40x/1.3 oil Plan-Neofluar, 488 nm. Each SAC was acquired 8 times at 5 laser powers (0.81-15.70 uW),
  so the data also suits low-SNR restoration. No related paper is listed on the record or found by Europe PMC / Crossref title search
  and a web search. enricher: voxel size set to null (was 621x621x100): the two subsets differ, 3DFM_AC xy 621 nm, z 100 nm; 3DFM_BCPop
  xy 155 nm, z 100 nm (Mendeley description); GT/Stacks pairing from the folders API.'
