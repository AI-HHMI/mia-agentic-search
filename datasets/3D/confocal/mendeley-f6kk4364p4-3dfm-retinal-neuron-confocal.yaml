notes: 'Mendeley API lists 48 TIFF files (9.2 GB): SAC_1..SAC_22.tif each occurring twice (a large raw stack of 150-360 MB and
  a small 4-9 MB file, presumably the ground truth - the API does not label which is which, and the Mendeley page shows no file
  list) plus Stack1_Laser8.tif / Stack2_Laser8.tif (1.5 GB) with Stack1_gt.tif / Stack2_gt.tif (190 MB) for 3DFM_BCPop. Ground
  truth, per the description, is the highest-quality available image passed through a Frangi filter and binarized, so labels are
  algorithmic, not hand-drawn. Zeiss LSM 510, 40x/1.3 oil Plan-Neofluar, 488 nm; 3DFM_AC xy 0.621 um and z 0.100 um (voxel size
  above), 3DFM_BCPop xy 0.155 um, z 0.100 um. Each SAC was acquired 8 times at 5 laser powers (0.81-15.70 uW), so the data also
  suits low-SNR restoration, but no paired-file mapping is documented. No related paper is listed on the record or found by
  Europe PMC / Crossref title search and a web search; the checked sources are the Mendeley page and API record.'
