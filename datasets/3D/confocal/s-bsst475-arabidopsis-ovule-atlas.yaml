notes: 'Three zips on BioStudies: High-quality_dataset.zip (about 167 GB), Additional_dataset.zip (about
  12 GB; listed with peek_archive: per-ovule folders with raw cell_boundary TIFF, PlantSeg prediction
  TIFF, segmented_cells TIFF, .mgxm mesh and attribute CSV) and a topological-analysis zip (about 4 GB).
  Total is roughly 184 GB, so size_bytes is left null because the file listing was not read in full. Voxel
  size 0.063 x 0.063 x 0.24 um is the finest setting from the paper Methods; some stacks were captured
  at 0.125 x 0.125 x 0.24 um. Segmentations come from PlantSeg followed by manual curation of meshes,
  hence source mixed. No license statement found in the BioStudies API record or the paper Data availability
  section. Annotations verified only in the Additional dataset listing; the High-quality zip was not listed.
  enricher: size_bytes from the HTTP index of Wild_type/ (4 zips, rounded sizes, estimated; was null).
  annotations_verified true after sampling segmented_cells label stacks.'
