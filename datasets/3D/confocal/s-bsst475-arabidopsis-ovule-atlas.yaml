notes: 'Three zips on BioStudies: High-quality_dataset.zip (about 167 GB), Additional_dataset.zip (about
  12 GB; listed with peek_archive: per-ovule folders with raw cell_boundary TIFF, PlantSeg prediction
  TIFF, segmented_cells TIFF, .mgxm mesh and attribute CSV) and a topological-analysis zip (about 4 GB).
  enricher: voxel size per stack is 63x63x240 nm or 125x125x240 nm (paper Methods: some stacks "captured
  with 2x downsampled voxel size"), not stated per file, so voxel_size_nm is null (was 63x63x240). enricher:
  source proofread (was mixed): PlantSeg segmentations, errors "partly manually corrected", only ovules
  without apparent errors kept (paper). No license statement found in the BioStudies API record or the
  paper Data availability section. enricher: size_bytes from the HTTP index of Wild_type/ (4 zips, rounded
  sizes, estimated; was null). annotations_verified true after sampling segmented_cells label stacks.'
