schema_version: '1.2'
id: s-bsst475-arabidopsis-ovule-atlas
title: 'WT Arabidopsis ovule atlas: A 3D digital cell atlas of wild-type Arabidopsis ovule development
  with cellular and tissue resolution'
short_name: Arabidopsis ovule 3D cell segmentation (confocal)
description: Confocal z-stacks of wild-type Arabidopsis thaliana ovules (cell walls stained with SR2200,
  nuclei with TO-PRO-3) with PlantSeg cell-boundary predictions, 3D cell segmentations, annotated 3D cell
  meshes (MorphoGraphX) and per-cell attribute CSVs. A high-quality set of 158 ovules (stages 1-I to 3-VI)
  and an additional set of 85 early-stage ovules with more segmentation errors.
