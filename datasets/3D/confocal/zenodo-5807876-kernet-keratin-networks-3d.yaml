notes: 'Three RAR5 archives (RPE.rar 202 MB, HACAT.rar 484 MB, MDCK.rar 167 MB); headers listed by the
  enricher: 30 cells (ex_001-ex_045 across MDCK/, HACAT/, RPE/), each with ex_N_raw.tif plus network files,
  and a ''data file documentation.pdf'' per archive. The record cites no paper; the eLife article is linked
  by matching description. Voxel size varies per stack (paper Methods: xy 0.044-0.065 um, z 0.17-0.2 um),
  so voxel_size_nm is null (enricher; was the lower bounds 44x44x170). Network models come from automated
  TSOAX segmentation checked by visual inspection, not manual labels. organisms: Canis lupus familiaris
  = MDCK/; Homo sapiens = HACAT/, RPE/. enricher: formats tiff (raw stacks), annotations_verified true
  (network files listed). Checked: Zenodo record, paper full text (Europe PMC).'
