notes: 'gold166.zip (13.29 GB, 889 files, 23.2 GB uncompressed) lists 19 lab folders (e.g. e_checked7_utokyo_fly, p_checked7_janelia_flylight_part1,
  p_checked6_mouse_RGC_uw) with image stacks in Vaa3D formats (.v3dpbd, .v3draw, .tif.v3dpbd) and SWC traces; the zip lists
  about 150 .swc files, so the exact count of image/trace pairs (166 per the GitHub release) was not verified. The Nature
  Methods paper full text is not open access (abstract read via Europe PMC); the 166 count and annotator workshop come from
  the GitHub release page. enricher: voxel size differs per lab (pixelsize.txt files: korea mouse 104x104x500 nm, silkmoth
  310x310x700, chick 156x156x300, flylight 380 iso), so null. Zenodo licence is CC-BY-NC-4.0 (non-commercial); the GitHub
  release states only that citation is required. Modality is inferred from folder names (confocal, 2-photon); other contributors
  may use other light microscopes.'
