notes: 'Zip: 23 CZI volumes (flp-3 13, flp-27 4, nlp-51 6) + 3 .xlsx, README, LICENSE. Annotations are image-level
  lists of expressing neurons (enricher: opened the 3 sheets), not positions or masks. Archive LICENSE.md and README
  say MIT; Zenodo record states CC-BY-4.0, kept. Voxel size differs per volume (CZI Scaling, metres per CELL_ID
  imreadCZI.m): nlp-51 male_head_a3 207.5x207.5x1217.4 nm; flp-3 34_AMp 217.0x217.0x1021.5 nm, so voxel_size_nm
  stays null; each CZI carries its own scaling. Paper: Zeiss LSM880, 40x. Companion of Zenodo 5348578 (male NeuroPAL
  volumes with *_ID.mat atlas annotations), a different file set. Zip is 2.38 GB compressed, 4.2 GB uncompressed.'
