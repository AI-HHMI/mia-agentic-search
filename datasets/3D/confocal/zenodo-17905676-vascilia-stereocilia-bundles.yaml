  notes: 'listing.py (Zenodo + outer zip): 1 file, 43,307,707,254 B exact, 58 members (stored). The two
    nested zips were listed with a range-read zip-in-zip script: 3D zip 1,448 members (45 P5 + 10 P21
    stack folders, each a slice TIFF folder plus new_assignment_obj/ PNG masks); 2D zip 1,802 members
    (901 TIFF + 901 PNG, flat). Sample (one slice pair, 3.5 MB transferred incl. a re-read of the mask): TIFF 2076x2076x3 uint8 RGB,
    uncompressed, no calibration (resolution 1/1), mean 13.1, p50 3, p99 140; channel maxima R 35, G 255,
    B 3, so the signal is in green. PNG L uint8 with 40 values: 0 plus IDs 1-39, i.e. instance IDs per
    slice; whether IDs are consistent across slices was not checked. CZI headers not read (no CZI reader
    in probe.py). The 2D-zip images were not sampled. Values are from one slice.'
