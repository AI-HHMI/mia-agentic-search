    - https://zenodo.org/records/17905676/files/VASCilia_Data.zip::VASCilia_3D_DataSet.zip::VASCilia_3D_DataSet/P5/Litter8Mouse3BASE-delCAP-AiryscanProcessing-08/new_assignment_obj/Litter8Mouse3BASE-delCAP-AiryscanProcessing-08_0024.png
