notes: 'VASCilia_Data.zip (43.3 GB, 58 files) holds VASCilia_3D_DataSet.zip (1.7 GB), VASCilia_2D_DataSet.zip (2.0 GB),
  Readme.pdf and RawData_ManorLab/ with 54 Airyscan .czi stacks (39.6 GB). The two nested zips were not
  opened, so annotation files and formats are taken from the Zenodo description and paper; hence
  annotations_verified false. Paper: 45 annotated 3D stacks of P5 mouse cochlea split 30 train / 5 val
  / 10 test at stack level (6 typical, 4 complex), polygons drawn in CVAT; 1,870 bundles (P5) and 335 (P21)
  are reported, so n_items 45 is the P5 stack count and P21 stacks add to it. Imaging: Zeiss 880 Airyscan,
  63x/1.4 NA, 43 nm xy pixel; the paper gives the z step as 0.110 nm, which is likely a typo, so z is null.
  The deposit also includes data from the Liberman lab.'
