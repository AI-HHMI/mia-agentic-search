notes: 'Synthetic (simulated) images from the group virtual microscope (modelled Zeiss S100, 63x/1.40
  oil objective, Atto CARV confocal unit, Micromax CCD), not real microscopy; labels are generated with
  the images. The CBIA page states no license or terms beyond a citation request,. The page cites Svoboda,
  Homola, Stejskal, ICIAR 2011 (not found by tools/paper.py). enricher: voxel size 123.806x123.806x123.8
  nm from the ICS headers (parameter scale, micrometers) of the same data (was null); the page says ICS,
  HDF5 and 3D-TIFF copies hold the same data. the high-SNR label sample holds only {0,1} and the page
  calls the ground truth foreground/background images, so labels are binary masks, not instance ids. Size
  and n_items are for the 2 3D-TIFF zips (file listing). organism Homo sapiens: the page says human colon
  tissue (simulated).'
