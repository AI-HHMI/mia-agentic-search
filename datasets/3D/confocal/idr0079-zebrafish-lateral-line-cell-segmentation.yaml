notes: 'Annotation CSVs list raw and derived (_seg.tif) image pairs: experimentA 350 rows (e.g. membranes 24 raw + 24 seg),
  experimentB 62 rows (31 raw + 31 seg); size and 165/31 image counts from the study file (0.113 TB + 0.0166 TB). Segmentations
  come from an automated pipeline; quality was checked manually only for samples with >20% failed cells (paper: stacks with
  >~10% missed/split/fused cells were excluded). Voxel size is live imaging 0.099 x 0.099 x 0.225 um; fixed experimentB stacks
  are 0.085 um pixel, 0.187 um z (paper Methods). Dimension counts are averages (1625x810x141 live, 1572x780x117 fixed). The
  second channel is a label for an internal structure and varies. The IDR project page is JavaScript-rendered; details come
  from the IDR study metadata on GitHub and the BioImage Archive record S-BIAD599. Download method not verified (IDR offers
  FTP/Aspera/Globus).'
