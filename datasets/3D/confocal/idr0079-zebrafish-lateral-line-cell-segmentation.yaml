notes: 'Annotation CSVs list raw and derived (_seg.tif) image pairs: experimentA 350 rows (e.g. membranes
  24 raw + 24 seg), experimentB 62 rows (31 raw + 31 seg); size and 165/31 image counts from the study
  file (0.113 TB + 0.0166 TB). Segmentations come from an automated pipeline; quality was checked manually
  only for samples with >20% failed cells (paper: stacks with >~10% missed/split/fused cells were excluded).
  Dimension counts are averages (1625x810x141 live, 1572x780x117 fixed). The second channel is a label
  for an internal structure and varies. Details from the IDR study metadata on GitHub and BIA S-BIAD599.
  enricher: voxel size set null, subsets differ (TIFF headers + paper Methods: live experimentA-J 99.2x99.2x224.5
  nm, fixed experimentK 85.2x85.2x186.7 nm). Files over https on ftp.ebi.ac.uk; size from BIA file lists
  (was 129.6 GB stated).'
