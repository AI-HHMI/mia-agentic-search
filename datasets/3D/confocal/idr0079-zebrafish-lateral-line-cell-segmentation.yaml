  (165 live, 31 fixed with pea3 smFISH), all with the cldnB:lyn-EGFP membrane label, each paired with
  an automated 3D single-cell segmentation (_seg.tif). Some live samples carry a second label (nuclei,
  actin, endosomes, Golgi, lysosomes).
