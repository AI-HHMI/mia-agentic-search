notes: 'One 6.56 GB Data.zip, listed with peek_archive. Real data: 4 HT-29 spheroid stacks (nuclei and membrane TIFFs) and
  3 manually corrected 3D nuclei GT patches from one stack (info.txt). Most labelled volumes are synthetic image/mask pairs
  (SimOptiGAN, Mem2NucGAN), so source is mixed. xy pixel size not stated on the page, paper Methods (z step 1 um) or listing,
  so voxel size is null. Also bundles models and results; n_items null (mixed contents). enricher: voxel size stays null,
  subsets differ: real GT patches and real training patches carry ImageJ calibration 568.18 x 568.18 nm, z 1999.9 nm (file
  names say 2um), while the paper gives a z-step of 1 um for its stacks and an isotropic 0.5682 um voxel for the simulation;
  the synthetic TIFFs state none in their headers.'
