short_name: DeBCR restoration benchmarks (LM and cryo-ET)
description: >-
  Six previously published restoration datasets re-assembled as train/val/test NumPy archives for the DeBCR model:
  low/high-exposure confocal denoising of planaria (2D) and Tribolium (3D), widefield-to-SIM deconvolution of S. aureus,
  confocal-to-STED of F-actin, and cryo-ET denoising of Chlamydomonas cilia (Tomo110) and RyR1 vesicles (EMPIAR-10452).
