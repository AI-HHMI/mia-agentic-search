  notes: 'Zenodo listing: 18 npz, 20,928,537,676 B (= size_bytes, confirmed). npz members are stored uncompressed,
    so npy headers were read by range with a short script (requests + ast.literal_eval of the npy header; no pickle):
    every array is float64 <f8, C order, shape (N,128,128): CF_STED_FActin_val 47, LM_2D_CARE_val 246, LM_3D_CARE_val
    1632, WF_SIM_S.aureus_val 602, EM_low_Tomo110_test 162, EM_high_RyR1_val 2304. The first patch of LM_2D_CARE_val
    and EM_low_Tomo110_test (both arrays) spans exactly 0-1, so patches look min-max rescaled (2 files only). The
