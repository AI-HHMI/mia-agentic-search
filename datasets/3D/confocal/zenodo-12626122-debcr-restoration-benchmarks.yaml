notes: >-
  Reprocessed bundle of six published datasets (CARE planaria and Tribolium, S. aureus WF/SIM Zenodo 5550932, F-actin
  confocal/STED Zenodo 7908914, cryo-CARE Tomo110, EMPIAR-10452) as 18 train/val/test npz files (about 20.9 GB). Each npz
  holds two npy arrays (low/gt for light microscopy, X/Y for cryo-ET; peek_archive). The cryo-ET sets have no clean ground
  truth and use Noise2Noise even/odd pairs; SIM images are pseudo ground truth for S. aureus (paper). Pixel or voxel size is
  not stated on the Zenodo page, MDC page or the bioRxiv text, so voxel_size_nm is null. formats is other because the
  data are NumPy npz archives. RyR1 organism inferred from the paper ("rabbit skeletal muscle"); F-actin organism taken
  from catalogued record zenodo-7908914. Overlaps partly with catalogued zenodo-7908914 and zenodo-15615592 / 15615943;
  this is the DeBCR re-processed bundle, not the originals. No single download archive, so download_url is null.
