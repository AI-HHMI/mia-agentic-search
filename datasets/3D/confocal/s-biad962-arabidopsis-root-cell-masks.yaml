notes: 'Annotation-only BioImage Archive study; the raw images live in S-BIAD425 (same paper), whose page
  shows no separate license, so CC0 applies to the masks (stated on S-BIAD962) and the image license is
  unconfirmed. The annotation list has 37 masks (25 Venus_rep1, 12 Venus_rep2) with source-image links
  to .czi files. Total size of raw + masks not computed (masks alone 3,330,861,538 B per annotation_file_list.json).
  enricher: voxel size from the CZI Scaling metadata of Ler_FLCVenus_root1.czi (0.346 um xy, 0.5 um z;
  was null; z agrees with the paper''s 0.5 um step). enricher: mask encoding (instance IDs) seen in a
  sample; the sampled mask has 55 z-slices but its listed source CZI has 38, so mask-to-raw alignment
  is unresolved.'
