notes: 'Annotation-only BioImage Archive study; the raw images live in S-BIAD425 (same paper), whose page shows no
  separate license, so CC0 applies to the masks (stated on S-BIAD962) and the image license is unconfirmed. The
  annotation list has 37 masks (25 Venus_rep1, 12 Venus_rep2) with source-image links to .czi files; Venus_rep2/raw
  lists 12 CZI files of 51-75 MB (read in the listing). Voxel size is not stated on either page; the paper gives a
  0.5 um z-step and 45-75 slices per stack but no xy pixel size. Total size not computed. Mask encoding and exact
  mask-to-raw alignment were not inspected (no file headers read).'
