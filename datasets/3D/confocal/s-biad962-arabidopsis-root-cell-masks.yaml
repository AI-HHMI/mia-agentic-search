title: Segmentation masks for Arabidopsis root cells from the study S-BIAD425
short_name: Arabidopsis root cell instance masks (confocal)
description: Instance segmentation masks of individual cells in Arabidopsis thaliana root confocal z-stacks
  (FLC-Venus lines imaged with propidium iodide cell-wall stain, Zeiss LSM780, 20x). Masks were generated
  by 3D morphological watershed and manually curated with segcorrect. The 37 mask TIFFs each point to
  a raw CZI stack in the source study S-BIAD425.
