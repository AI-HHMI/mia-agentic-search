notes: 'enricher: voxel size 49.568 x 49.568 x 222.408 nm from the CZI Scaling metadata of all three neuromasts
  (was null); the study holds 3 neuromasts (M2, O2, OP1 of fish 20220813_1, wt), n_items 3; masks are
  probability maps. Files per neuromast (e.g. 20220813_1-M2_wt): the raw .czi (about 1.5 GB), a drift-corrected
  .tiff (about 363 MB) and two *_struct_segmentation.tiff masks (nuclei "n", membranes "m", about 499
  MB each). The masks are outputs of the Segmenter models trained in the paper (iterative deep-learning
  workflow), not the manually corrected instance labels described in the paper, so annotations.source
  is automatic. The paper gives the instrument (LSM 880 Airyscan, 40x/1.2 W) but no voxel size. The study
  page lists ~45 fish; only these 3 neuromasts are deposited.'
