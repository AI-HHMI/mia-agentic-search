notes: 'Files per neuromast (e.g. 20220813_1-M2_wt): the raw .czi (about 1.5 GB), a drift-corrected .tiff (about 363 MB) and two
  *_struct_segmentation.tiff masks (nuclei "n", membranes "m", about 499 MB each). The masks are outputs of the Segmenter models
  trained in the paper (iterative deep-learning workflow), not the manually corrected instance labels described in the paper,
  so annotations.source is automatic. Number of neuromast images, total size and voxel size are not stated on the study page,
  the one file folder listed or the paper Methods (full text read); the BioStudies file lists were not retrievable. The paper
  gives the instrument (LSM 880 Airyscan, 40x/1.2 W) but no voxel size. Study lists ~45 fish specimens with several neuromasts
  imaged per fish. Only a single genotype folder was listed in full.'
