notes: 'Two zip archives: eng_wt_data.zip (26 .ims files, 3.47 GB, listed with peek_archive) and wt_angiogram_data.zip
  (0.66 GB; contents not listed, described as 2 wild-type 72 hpf images). Total n_items = 26 + 2. Voxel size not stated on
  the Zenodo page or paper Methods (LSM 780, 20x objective); it is probably in the .ims headers. Annotation is a set of
  3D polylines embedded in Imaris files, not label masks, so it is useful for contour/vessel-geometry tasks, not directly
  for mask segmentation. Zenodo notes the contour coordinates inside the .ims files are slightly less precise than the
  exact ones in a separate repository (zenodo 10549101). Imaris .ims is HDF5-based but this was not verified, hence
  formats: other. Channels: 2 inferred from the Pecam1-EGFP and Dextran Texas Red labels.'
