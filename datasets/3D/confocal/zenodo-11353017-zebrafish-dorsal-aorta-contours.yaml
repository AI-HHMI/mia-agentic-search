id: zenodo-11353017-zebrafish-dorsal-aorta-contours
title: Annotated and processed 3D confocal microscopy images of dorsal aorta in wild-type and Endoglin-deficient zebrafish
  embryos at 48 hpf and 72 hpf
short_name: Zebrafish aorta endothelial contours (confocal)
description: 3D confocal stacks of the dorsal aorta of Pecam1-EGFP zebrafish embryos (7 wild-type and 6 Endoglin-deficient
  embryos imaged at 48 and 72 hpf, 26 Imaris files) with manually annotated 3D endothelial cell contours placed on the Pecam1-EGFP
  cell junctions. A second archive holds two wild-type embryos at 72 hpf with repeated contour annotation and manually outlined
  Dextran Texas Red angiogram cross-sections of the vessel lumen.
