  notes: 'Sample: embryo21_72hpf .ims (83.9 MB) inflated and opened with h5py (own script, tools/sample.py does not read .ims).
    Image attrs: X 2048, Y 400, Z 32, Unit um, ExtMax 212.548/41.5133/32, PixelType Gray16, 2 channels (Pecam1-EGFP, T PMT);
    value_range from the middle z slice of channel 0 only. Scene8 XML: 36 cells, 14,385 points. Voxel size from Imaris extents
    / sizes, read from the start of every member: 25 of 26 eng_wt files 103.78 x 103.78 x 1000 nm; embryo01_48hpf 103.78 x
    103.78 x 1081.83 nm; both wt_angiogram files 129.73 x 129.73 x 762.4 nm. Not one shared value, so imaging.voxel_size_nm
    stays null (paper and Zenodo state none). Only channel 0 described as raw; other channels vary per file. Direct files:
    the two zips (Zenodo API), usable for TensorSwitch with range requests. TensorSwitch has no Imaris scene reader, so the
    contours need custom extraction.'
