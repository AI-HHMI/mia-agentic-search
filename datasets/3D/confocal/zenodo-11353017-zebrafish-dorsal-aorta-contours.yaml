notes: 'Two zips: eng_wt_data.zip (26 .ims, analysis data: 7 wt + 6 Endoglin-deficient embryos at 48/72 hpf) and wt_angiogram_data.zip
  (2 .ims, validation data, wt 72 hpf). Annotation = 3D contour points per cell inside the Imaris files, not masks; Zenodo
  says these coordinates are slightly less precise than those in zenodo 10549101. Paper Methods: LSM 780, 20x objective (the
  .ims header says LensPower 40). enricher: formats hdf5 (.ims opened with h5py; was other); channels null (2 in embryo21_72hpf:
  Pecam1-EGFP + T PMT; header channel counts differ between files; was 2); voxel size stays null: .ims headers differ between
  files (see technical.notes); size from Zenodo file listing.'
