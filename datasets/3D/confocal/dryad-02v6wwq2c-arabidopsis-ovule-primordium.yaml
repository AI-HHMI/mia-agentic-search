notes: 'Dryad API lists 166 files (165 Imaris .ims, one README CSV), 9.40 GB total. Imaris .ims is an HDF5-based
  proprietary format; none of the listed schema formats names it, so formats is other. Voxel size is not
  stated on the Dryad page, API record or paper text checked (Methods, Data availability); it is stored
  in the .ims headers. The 92 segmented images in the paper (Figure 1 and Figure 4 source data) may be
  fewer than the 165 .ims files; the files were not opened, so annotations_verified is false and the label
  content per file is taken from the Dryad methods and paper. Paper reports 92 images with 7763 annotated
  cells. Dryad abstract says stages 0-I to 2-I, title says 0-I to 2-II. License CC0 from the Dryad API
  record.'
