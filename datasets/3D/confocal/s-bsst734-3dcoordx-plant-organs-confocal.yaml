notes: 'Archive listing (peek_archive, 44 members, ~16 GB uncompressed): 17 TIFF volumes incl. raw cell-boundary stacks,
  PlantSeg boundary predictions and cell segmentation label stacks per organ, plus 13 .mgxm meshes, CSV/XLSX attributes
  and 4 .py files (not run). Per paper Methods, ovule stacks come from a Leica TCS SP8 confocal (63x glycerol objective)
  and segmentation used PlantSeg, with manual labelling steps in MorphoGraphX, hence source mixed. No license for the
  deposit on the BioStudies page (the paper is CC BY-NC-ND 4.0 but that covers the article). Voxel size is not stated
  on the study page, archive listing or paper text read.'
