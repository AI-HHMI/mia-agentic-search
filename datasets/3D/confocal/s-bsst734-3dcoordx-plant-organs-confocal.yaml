notes: 'Archive listing (peek_archive, 44 members, ~16 GB uncompressed): 17 TIFF volumes incl. raw cell-boundary
  stacks, PlantSeg boundary predictions and cell segmentation label stacks per organ, plus 13 .mgxm meshes, CSV/XLSX
  attributes and 4 .py files (not run). Per paper Methods, ovule stacks come from a Leica TCS SP8 confocal (63x
  glycerol objective) and segmentation used PlantSeg, with manual labelling steps in MorphoGraphX, hence source
  mixed. No license for the deposit on the BioStudies page (the paper is CC BY-NC-ND 4.0 but that covers the article).
  enricher: voxel size differs per subset, so null: ovules 125x125x240 nm (paper Methods; 401 segmentation header
  63x63x235 nm), Marchantia late 126x126x330, early 127x127x330 (paper). organisms: Arabidopsis thaliana = User_manual_example_dataset/,
  Figure1_F-H/, Figure_4_*, Figure_S1_SAM/; Marchantia polymorpha = Figure_8_Marchantia/; Utricularia gibba = Figure_9_Utricularia/.'
