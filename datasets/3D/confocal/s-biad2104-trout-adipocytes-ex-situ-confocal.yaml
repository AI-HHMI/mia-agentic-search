notes: '20 image stacks (6.4 GB) and 20 mask stacks (23.3 GB), 8-bit single-channel images. Companion of S-BIAD2102 (in situ
  tissue, same lab); paper Hue et al. 2025 (Adipocyte). Masks: Cellpose 2 cyto2 (no retraining, green channel, diameter 40),
  border/sphericity < 0.35/< 5000 voxel objects removed in Fiji, each stack manually checked (study + paper Methods). enricher:
  voxel size 1154x1154x2998.2 nm from the ImageJ calibration of all 20 image headers (xy 1153.8-1155.4 nm, z 2998.2 nm; masks
  1154 x 2990 nm); the paper''s ''voxel size was 1.15x1.15x1.15 um'' matches the in situ tissue headers, not these z steps
  (was null). enricher: channels 1 (each TIFF has one sample, palette LUT; was null). enricher: annotations.source automatic
  (was mixed). No train/test split.'
