schema_version: '1.2'
id: zenodo-5045374-pig-nmj-confocal
title: Confocal micrographs and complete dataset of neuromuscular junction morphology of pelvic limb muscles of
  the pig (Sus scrofa)
short_name: Pig neuromuscular junction masks (confocal)
description: Confocal z-stacks of en face neuromuscular junctions (NMJs) from three pigs and three pelvic limb muscles
  (EDL, peroneus longus, soleus), labelled for the nerve terminal (SV2 and 2H3 antibodies) and the post-synaptic
  acetylcholine receptors (TRITC alpha-bungarotoxin). Raw .nd2 stacks are paired with thresholded and cleaned images
  of the axon terminal and muscle endplate produced with NMJ-morph / aNMJ-morph, plus per-NMJ morphometric spreadsheets
  and muscle fibre diameters. The depositors list machine-learning training for NMJ analysis among the intended
  reuses.
