  notes: 'Zip central directories read with tools/peek_archive.py (tools/listing.py --expand-zips timed out on these
    zips); Zenodo API listing 6 files, 2,609,458,402 B exact. Sampled Pig 1 PL 001: nd2 Z30 C2 Y512 X512 uint16
    0..3815 (nd2 package; 12.6 MB compressed member); C1 mask uint8 {0,255}, 11% foreground. Probed MAX_ tif: ImageJ
    cyx 2x512x512 uint16, min/max 0/3815 in the header. Voxel size: nd2 and ImageJ headers of the sampled files
    say x=y 0.0987 um, z 0.2362 um; masks in Pig 1 EDL, Pig 1 S and Pig 2 S also say 0.0987 um. The README says
    1-4x zoom and 0.5-1 um z-steps, so calibration varies per image and conflicts with the sampled z: voxel_size_nm
    kept null; read it per file from the nd2 headers. Value ranges are from one sample.'
