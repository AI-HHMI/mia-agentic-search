notes: 'Zip listings (peek_archive): 154+145+129 = 428 raw .nd2 stacks and 386+391+363 cleaned .tif masks across
  Pig 1-3, plus 6 CSV tables per pig. README: cleaned images are thresholded axon-terminal and endplate masks from
  the semi-automatic NMJ-morph / aNMJ-morph workflows (not hand-drawn ground truth); machine-learning training is
  a listed reuse. Nikon A1R 60x/1.4 NA, 512x512 px, 1-4x zoom, 0.5-1 um z-steps, so pixel size varies per image
  and is not stated on the page, README or paper: voxel size null (.nd2 headers not read). n_items counts raw stacks.
  enricher: formats nd2 + tiff (was other). Masks are 2D (C1/C2 = channel masks of the max projection), not 3D;
  voxel size still null (per-image calibration, see technical.notes).'
