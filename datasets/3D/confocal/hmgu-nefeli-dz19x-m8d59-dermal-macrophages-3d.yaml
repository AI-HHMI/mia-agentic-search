title: Expert-annotated 3D image dataset of dermal tissue macrophages
short_name: Mouse dermal macrophages 3D instances (confocal)
description: '31 five-channel confocal z-stacks (Collagen IV, F4/80, CD206, DAPI, brightfield) of whole-mount mouse ear skin,
  20 from steady-state adult mice and 11 from mice five days after intradermal Staphylococcus aureus infection, with
  3D instance segmentation masks of 947 individual dermal macrophages. Masks were generated with YOLO, Cellpose and SAM2
  and reviewed and corrected by two experts in a Napari plugin.'
