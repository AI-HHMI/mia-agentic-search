notes: 'All facts come from the open-access data descriptor (Europe PMC full text). The dataset record at the Helmholtz
  Munich Nefeli repository (landing_url) returned HTTP 503 on three attempts and the DOI 10.82296/hmgu-nefeli.dz19x-m8d5925
  returned 404 from doi.org and DataCite, so the license and file listing of the record itself were not seen; the paper
  is CC BY 4.0 but the dataset license is unconfirmed. A web search snippet describes the record as version 1.0 published
  2026-05-26, about 3.7 GB. Voxel size is stated as approximate (~0.21 um in plane, ~1.51 um between slices). The paper
  gives the 947 macrophages as 710 cells in 20 adult stacks and 237 cells in 11 infected stacks. Folder layout: images/
  and masks/, each with AdultMice (20 folders) and AdultMice-Infected (11 folders). Verify access, license and download
  links on the record.'
