notes: 'Zip index read without downloading: 374 raw/label pairs (748 TIFFs) in train_M1 (19), train_M2 (293), test (60)
  and validation (2) folders, each with x/ and y/. Per the paper (PMC10626192), train_M1 holds high-resolution cyst volumes
  down-sampled to the low-resolution grid with labels from semi-automatic LimeSeg segmentation plus manual proofreading;
  train_M2 labels were generated by the M1 workflow (automatic, not all fully curated); the test set is 60 perfectly
  annotated cysts. The mapping of folders to these sets is inferred from the paper counts (21 high-res, 314 low-res,
  60 test), not stated in the Zenodo record, so counts differ slightly. Voxel size is the paper''s low-resolution
  acquisition (0.62 um xy, 0.7 um z, 20x); the zip headers were not read, so the stored grid is unconfirmed. The
  Zenodo page also points to Mendeley Data (10.17632/7gbkxgngpm), the paper''s deposit, which was not fetched.
  Licence CC-BY-4.0 is from the Zenodo record. Channel count not stated.'
