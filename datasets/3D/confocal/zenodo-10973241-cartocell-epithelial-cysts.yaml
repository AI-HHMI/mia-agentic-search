notes: '374 raw/label pairs (748 TIFFs) in train_M1 (19), train_M2 (293), test (60), validation (2), each with x/ and y/.
  Per the paper (PMC10626192), train_M1 = high-res cysts down-sampled to the low-res grid, labels semi-automatic (LimeSeg)
  plus manual proofreading; train_M2 labels generated by model M1 (automatic, not all curated); test = 60 fully curated cysts.
  Folder-to-set mapping inferred from paper counts. Voxel size from paper Methods (0.62 um xy, 0.7 um z); ImageJ headers store
  0.609-0.615 um xy, 0.696-0.702 um z per file. Paper deposit also on Mendeley Data (10.17632/7gbkxgngpm), not fetched. Licence
  from the Zenodo record. enricher: channels 1 from TIFF headers (was null).'
