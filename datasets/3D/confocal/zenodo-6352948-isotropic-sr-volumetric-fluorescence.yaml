notes: 'Voxel size is not given on the Zenodo page; the paper states CFM lateral resolution ~1.24 um with
  3-4 um z steps and OT-LSM resolution ~0.5 um lateral / ~4.6 um axial (re-sampled to 0.5 um voxels
  for the brain image), but not a CFM pixel size, so voxel_size_nm is left null. Six TIFF volumes plus
  one notebook; file names are from the Zenodo listing. The blurred/ground-truth OT-LSM pair is a restoration
  pair (blur simulated by an axial Gaussian, std 10); the CFM reference is a real second acquisition
  of the rotated sample. Size is the sum of the Zenodo files.'
