notes: 'Voxel sizes differ by volume, so voxel_size_nm stays null. Paper (Results): CFM volume re-sampled isotropically
  to 1 um voxels (physical ~1270x930x800 um, matching the 804x930x1269 files); OT-LSM bead volume re-sampled to
  0.5 um (360x360x160 um, matching 320x720x720); OT-LSM brain re-sampled to 0.5 um; the artificial-blurring pair
  is not stated. Raw acquisition: CFM 1.24 um lateral resolution, 3-4 um z steps; OT-LSM ~0.5 um lateral / ~4.6
  um axial, 1 um z steps. enricher: corrected the earlier note that the paper gives no CFM voxel size. Six TIFF
  volumes plus one notebook (simulation generator; not run). The blurred/ground-truth OT-LSM pair is a restoration
  pair (axial Gaussian blur, std 10); the CFM reference is a real second acquisition of the 90-degree-rotated sample,
  registered to the input. Training data for OT-LSM artifact correction is only on request (paper). Size is the
  sum of the Zenodo files.'
