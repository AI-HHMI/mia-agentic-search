title: Dataset for Reference-free Isotropic Super-resolution For Volumetric Fluorescence Microscopy
short_name: Isotropic super-resolution mouse brain (confocal)
description: 'Volumes from the paper on reference-free isotropic super-resolution: a confocal (CFM) stack of a Thy1-eYFP
  mouse cortex with a 90-degree-rotated, registered reference stack; open-top light-sheet (OT-LSM) volumes of a
  Thy1-eYFP mouse brain for artifact correction and for PSF deconvolution (fluorescent beads); a near-isotropic
  OT-LSM ground-truth volume with its Gaussian z-blurred counterpart (artificial blurring pair); and a Jupyter notebook
  that generates the synthetic tube volume used for simulation.'
