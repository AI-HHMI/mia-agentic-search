notes: 'No license is stated in the BioStudies record (checked API record and file listing). Voxel size 75 x 75 x 235 nm is
  from the paper Methods (0.075 x 0.075 x 0.235 um) for the ovule dataset; the deposited file names carry a "_ds2x" suffix, so
  the files may be downsampled 2x in-plane and the voxel size of the files themselves was not verified. The paper says the
  ovule set has 48 stacks with hand-curated ground truth; the deposit holds 31 raw/label pairs (22 train, 2 val, 7 test). Total
  size not computed. Annotation source from paper: manual and semi-automated ground truth creation (full dataset also at
  osf.io/uzq3w per Data availability).'
