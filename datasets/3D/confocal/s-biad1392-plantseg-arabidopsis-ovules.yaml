description: 3D confocal stacks of fixed, cleared Arabidopsis thaliana ovules at all developmental stages with
  hand-curated 3D cell-boundary/instance segmentation masks, organised as train / val / test folders of raw and
  label TIFF volumes (22 / 2 / 7 pairs). Used to train the PlantSeg cell-segmentation networks.
