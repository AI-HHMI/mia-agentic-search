notes: 'Figshare record lists Dataset S1 (NeuroID, 62.9 GB .7z: positions/expression patterns of identified cells plus the
  static 3D images of 311 animals), Dataset S2 (JN3039 test images, 0.74 GB .7z), S3 tutorial, S4 plasmid sequences, S5 code;
  size_bytes is the sum of all 14 listed files. on average 203.7 nuclei detected and 44.2 identified per animal (paper), so
  annotations are partial per animal. Voxel size 0.240 x 0.240 x 0.252 um is for the Leica SP5 confocal images (strains JN3000-JN3036,
  JN3041, JN3039; 512x256 voxels in xy); the JN3038 microfluidic spinning-disk images use 0.28 x 0.28 x ~0.77 um. Licence
  MIT is the Figshare record licence (also covers the code). Number of channels varies by strain. Sources checked: Figshare
  API record and readme, paper full text (Europe PMC) incl. Methods and Data availability. enricher: formats tiff (ImageJ
  TIFF hyperstacks in the 7z archives, was other); annotations verified (.mat nucleus tables); voxel size confirmed by TIFF
  header.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "DatasetS1_NeuronID.7z (62.9 GB; 7z, LZMA2, 35 solid blocks; 628 entries, 138.6 GB unpacked)\n  S1_image/\n    readme.txt\n\
      \    <date>_<promoter>_<animal>..._MODK_edited*.mat   316  (45-85 KB each; 5 flp12p *_rotmod.mat duplicates)\n    <date>_<promoter>_<animal>..._aligned.tif\
      \        311  (211-614 MB each)\nDatasetS2_image_JN3039.7z (0.74 GB; 29 files, 2.39 GB unpacked)\n  <date>_4023_*_MODK*_edited*.mat\
      \   14\n  <date>_4023_*.tif                 15\nDatasetS3_tutorial.7z (63 MB; tutorial .docx, 1 tif + detected/corrected/identified\
      \ .mat/.dat)\nDatasetS4_plasmids.7z (71 KB)\nDatasetS5_code.7z (619 MB; RoiEdit3D GUI and analysis code)\nFigSAll_191230.pdf,\
      \ SupplementaryNote1_190527.docx, TableS1-S6.xlsx, readme.txt"
    n_files: 14
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/20690427
    size_bytes: 739920260
    description: 'Dataset S2 (JN3039 whole-brain strain test images): the smallest archive with raw + label pairs, 15 ImageJ
      TIFF stacks and 14 nucleus tables (.mat). 7z archive; TensorSwitch cannot read 7z members, so it must be unpacked first.'
  arrays:
  - role: raw
    path_pattern: S1_image/*_aligned.tif
    format: tiff
    axes: zcyx
    shape:
    - 139
    - 4
    - 277
    - 526
    shape_varies: true
    dtype: float32
    compression: none
    value_range:
    - 0.0
    - 25345.537
    normalization: unknown
    alignment: not-applicable
    alignment_notes: ImageJ 1.47v hyperstack (channels=4, slices=139, unit micron, 4.1667 px/um = 0.240 um, spacing 0.252
      um), big-endian float32; images are aligned/rotated (worm posture corrected), so xy differs from the raw 512x256 acquisition.
      Channel and z counts vary by strain.
  - role: label
    path_pattern: S1_image/*.mat
    format: other
    axes: null
    shape:
    - 193
    - 43
    shape_varies: true
    dtype: unknown
    compression: deflate
    encoding: points-table
    alignment: unknown
    alignment_notes: MATLAB v5 (zlib-compressed) RoiEdit3D files; pair with the TIFF that shares the leading <date>_<promoter>_<animal>
      stem (e.g. 140214_flp12p_005_*.mat <-> 140214_flp12p_005_aligned.tif). Per S1 readme the (non-rotmod) .mat files accord
      with the corresponding images; units of the stored positions not verified. The files also carry rotation/alignment flags
      (flagRotateX/Y/Z, flagInterpZ, rotation, scaling). Per S1 readme, the 5 flp12p *_rotmod.mat files were rescaled in z
      and may not match their images; use the non-rotmod ones.
  notes: 'All archives are 7z (LZMA2); headers decoded via range requests and the start of S1 stream-decompressed (19.9 MB
    read) to read S1_image/readme.txt, two .mat files and the first 6.5 MB of 140214_flp12p_005_aligned.tif. value_range is
    from the first 3 pages (one z slice, 3 of 4 channels) of that one file; the ImageJ display ranges per channel are 472-65027,
    0.30-31.4, 8943-35721, 1221-65535. .mat label tables: variables columnNames (1x43) and data_edited (193x43 cell) per animal;
    column contents not parsed (cell arrays). size_bytes is the exact Figshare file listing (compressed); S1 unpacks to 138.6
    GB. Not convertible by TensorSwitch as is: images and labels are only inside 7z archives, labels are .mat point tables.'
