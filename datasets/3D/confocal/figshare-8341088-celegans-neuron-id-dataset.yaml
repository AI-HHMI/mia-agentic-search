notes: 'Figshare record lists Dataset S1 (NeuroID, 62.9 GB .7z: positions/expression patterns of identified cells plus the
  static 3D images of 311 animals), Dataset S2 (JN3039 test images, 0.74 GB .7z), S3 tutorial, S4 plasmid sequences, S5 code;
  size_bytes is the sum of all 14 listed files. The .7z archives could not be listed remotely, so the image file format and
  exact annotation file layout are unverified (formats other); on average 203.7 nuclei detected and 44.2 identified per animal
  (paper), so annotations are partial per animal. Voxel size 0.240 x 0.240 x 0.252 um is for the Leica SP5 confocal images
  (strains JN3000-JN3036, JN3041, JN3039; 512x256 voxels in xy); the JN3038 microfluidic spinning-disk images use 0.28 x 0.28
  x ~0.77 um. Licence MIT is the Figshare record licence (also covers the code). Number of channels varies by strain. Sources
  checked: Figshare API record and readme, paper full text (Europe PMC) incl. Methods and Data availability.'
