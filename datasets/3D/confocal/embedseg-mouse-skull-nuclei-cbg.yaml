notes: 'CC-BY 4.0 is stated in the v0.1.0 GitHub release notes for the release data. Voxel size, modality,
  sample and DAPI labelling come from the arXiv preprint (2101.10033); the paper reports 22 volumes, but
  the release zip lists only 6 TIFFs (3 image/mask pairs: 1 train pair X1/Y1, 1 train pair X2_left/Y2_left,
  1 test pair X2_right/Y2_right), listed with peek_archive and not extracted; the paper-stated count may
  refer to crops. Annotators named in the repo README (Jacqueline Tabler, Diana Afonso) - annotation method
  not described in the sources read, so source is a best-fit. Publisher full text not read (not open access).
  Publication date not checked. Individual zip asset page not separately opened; asset list page failed
  to load, zip URL probed directly. enricher: size_bytes 108415722 from the complete file listing (was
  113665434). enricher: channels 1 (single-channel uint16 volumes in the sample).'
