notes: 'Single 2.5 GB zip (peek_archive: 371 files; 350 TIFF; Data/Simulated/{images,labels} 4 pairs,
  Data/Optimized 4 transformed images, Data/Real 4 DAPI stacks plus Data/Real/Segmentation, a .pth model,
  settings). Labels exist for the synthetic images by construction; real-image masks are automatic network
  predictions, not manual. Voxel size taken from the paper Methods: simulated output downsampled to 1.5
  x 0.489 x 0.489 um (z, y, x); the paper also states 0.45 x 0.061 x 0.061 um for the real/high-magnification
  images, which is not consistent with the 20x objective and 1 um step, so real-image voxel size is unclear.
  n_items counts 4 simulated + 4 optimized + 4 real volumes. enricher: sampled 003 pair (uint8 raw, uint16
  instance IDs, same 77x1024x1024 grid); size confirmed by Zenodo file listing; synthetic labels are by
  construction, center points manual (paper).'
