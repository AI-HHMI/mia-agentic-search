title: Synthesis of large scale 3D microscopic images of 3D cell cultures for training and benchmarking
short_name: Synthetic 3D spheroid nuclei (confocal)
description: Synthetic 3D confocal images of DAPI-stained MDA-MB-231 spheroids with voxel-wise nucleus instance
  label volumes (4 simulated images and 4 GAN-optimized versions), four real DAPI spheroid stacks with
  segmentation masks predicted by a network trained on the synthetic data, simulation settings, the trained
  optimization model and the TWANG pipeline. Released with a PLOS ONE paper for training and benchmarking
  3D nucleus segmentation.
