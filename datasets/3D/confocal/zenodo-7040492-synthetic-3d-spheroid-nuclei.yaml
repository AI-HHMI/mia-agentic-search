notes: 'Single 2.5 GB zip (peek_archive: 371 files; 350 TIFF; Data/Simulated/{images,labels} 4 pairs,
  Data/Optimized 4 transformed images, Data/Real 4 DAPI stacks plus Data/Real/Segmentation, a .pth model,
  settings). Labels exist for the synthetic images by construction; real-image masks are automatic network
  predictions, not manual. Voxel size taken from the paper Methods: simulated output downsampled to 1.5 x
  0.489 x 0.489 um (z, y, x); the paper also states 0.45 x 0.061 x 0.061 um for the real/high-magnification
  images, which is not consistent with the 20x objective and 1 um step, so real-image voxel size is unclear.
  The Zenodo page itself gives no description beyond the
  paper title; details come from the open-access paper (Methods, Data Availability). n_items counts 4
  simulated + 4 optimized + 4 real volumes.'
