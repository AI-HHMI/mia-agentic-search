  notes: 'Listing: Zenodo record API (1 file, Data.zip, 2,483,173,607 B exact) plus the zip index via
    peek_archive (371 members, 6.54 GB unzipped). Sampled 003 pair (48.6 MB + 1.3 MB compressed downloaded):
    raw uint8 ZYX 77x1024x1024 (tifffile axes ZYX), values 0-251 in this one sample (p50 15, p99 59);
    label uint16 ZYX 77x1024x1024, 0-2700, 2460 distinct IDs, 95.2% background: instance IDs (labels known
    by construction, per the paper). Compression none: member uncompressed sizes equal z*y*x*bytes (80,740,352
    + 8 KB header; 161.5 MB for uint16); the zip deflates them. Other volumes differ in z (member sizes
    80.8-127.9 MB), so shape_varies. Not described as arrays: Data/Optimized (4 GAN-transformed versions
    of the simulated images; ~4x the bytes, likely float32, pair with the same labels by NNN, not probed),
    Data/Real 4 DAPI stacks with network-predicted masks (automatic, not ground truth) and one manual
    center-point volume. Voxel size 489x489x1500 nm applies to the simulated volumes (paper Methods);
    the real images'' voxel size is not stated consistently in the paper.'
