  notes: 'Listing from the Zenodo API with zip central directories is complete (8 files, 431 zip members, exact
    sizes). NRRD headers (NRRD0004, gzip encoding, little endian) read for 4 raw/label pairs (human 160129_2: 1024x1024x252;
    infarction 170811_1_s2: 1024x624x100; species mouse_delta_1_b: 1024x1024x123; slice culture 211123_1: 1496x1496x50;
    NRRD sizes are fastest-first, so axes zyx). Raw is uint16 in all four; labels uint32 except the species sample
    (uint16). Space directions are (1,0,0) (0,1,0) (0,0,1) with origin 0, i.e. no physical calibration. Sampled
    label infarction/test/170811_1_s2 in full (3.57 MB): uint32, 0..7369, 77 distinct values (non-contiguous IDs),
    47% background; paper describes instance segmentation of cardiomyocytes. The raw sample (119 MB) was stopped
    after ~15 min (slow transfer from zenodo.org), so no raw value range. normalization unknown: folder name imgs_norm
    and the paper describe a per-plane normalisation (background ~5%, foreground ~30% of the dtype range), but the
    paper does not say these files are its output. Voxel size not set: differs per subset (see notes; paper Table
    1), headers uncalibrated. NRRD has no format value in the schema (other). No single archive: data.download_url
    is the record page; direct zips are human.zip, myocardial_infarction.zip, slice_culture.zip, species.zip under
    https://zenodo.org/records/14390419/files/.'
