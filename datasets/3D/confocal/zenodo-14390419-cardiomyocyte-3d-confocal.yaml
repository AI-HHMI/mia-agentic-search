notes: 'Zenodo lists human.zip (1.1 GB, 2 image and 2 label NRRD in test/), species.zip (22.1 GB, 48 NRRD in train and test with image and label folders; animal names in file names: rat, mouse, horse, pig, rabbit), slice_culture.zip (11.1 GB, 54 NRRD), myocardial_infarction.zip (9.0 GB, not listed because the listing request failed), interactive_web_vis_1-3.zip and readme.pdf (title page only, no text); total 49.5 GB. Image volumes are named imgs_norm. The description, voxel size, label semantics (cell instances vs foreground), annotation method and the accompanying paper were not found: the record has no description, the readme has no extractable text, and Europe PMC searches timed out. n_items is left null because the number of volume pairs per zip was only partly seen. Organism list comes from file names and folder names; the slice culture and infarction sets were not checked for species. Another version of the record exists.'
