notes: 'Paper: Greiner et al. 2026, J Physiol (10.1113/jp288557), which cites this Zenodo concept DOI. 73 annotated
  WGA volumes: 14 test (4 infarction, 4 slice culture, 6 multispecies) plus 2 human test volumes. Voxel size differs
  by subset (paper Table 1): myocardial_infarction 200x200x200 nm, slice_culture 100x100x200 nm, species (166-227)^2
  x 180 nm, human 200x200x200 nm; NRRD headers carry unit spacing only, so voxel_size_nm is null. organisms: Oryctolagus
  cuniculus = myocardial_infarction.zip, slice_culture.zip, species/*rabbit*; Homo sapiens = human.zip; Mus musculus
  = species/*mouse*; Rattus norvegicus = species/*rat*; Sus scrofa = species/*pig*; Equus caballus = species/*horse*;
  Elephas maximus = species/*elephant*. enricher: annotations proofread (SegmentPuzzler, semi-automatic), instance
  masks; organisms from paper Methods (rabbit added, elephant added); n_items 73; a newer Zenodo version (16362349)
  re-packages the same sets.'
