title: A Deep Learning-Enabled Toolkit for the 3D Segmentation of Ventricular Cardiomyocytes
short_name: Cardiomyocyte 3D segmentation (confocal)
description: 3D confocal microscopy volumes of WGA-labelled ventricular myocardium with cardiomyocyte label volumes,
  in NRRD train/test folders for human tissue, a multi-species set (rat, mouse, horse, pig, rabbit and others), cultured
  heart slices and myocardial infarction samples, plus interactive web visualisations of annotations, denoising and
  automated segmentations. Released with a deep-learning toolkit for 3D cardiomyocyte segmentation.
