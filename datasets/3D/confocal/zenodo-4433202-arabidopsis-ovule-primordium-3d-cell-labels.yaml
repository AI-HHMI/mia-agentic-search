notes: 'The record has 165 .ims files plus a README CSV that lists 152 image IDs with ovule stage (0-I to 2-II) and genotype
  (91 Col-0, 39 bot1-7, 22 Ws-4); the extra files were not reconciled. The paper reports 92 annotated 3D images,
  segmented and labelled by one author and verified and curated by two others, using ImarisCell. Header of EM_C_731.ims
  (probe.py, HDF5): three uint8 image channels at 256x256x256 voxels, two uint32 label datasets of the same size, and
  ImarisCell cell and mask objects. Other files may differ in size. Voxel size is not stated on the record or in the paper text
  checked (acquisition: Leica SP8, 63x glycerol objective) and was not exposed by the HDF5 dataset listing, so it is null.
  Imaging by confocal on a Leica SP8 is from the paper Methods. The same data (Imaris files) is also deposited at Dryad
  (doi 10.5061/dryad.02v6wwq2c) per the paper data availability statement. Download link is the record page; files are individual .ims.'
