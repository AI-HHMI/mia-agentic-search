  notes: 'Listing: Zenodo API, 166 files, 9,397,919,268 bytes (exact). Probed EM_C_731 and EM_C_596 (HDF5
    dataset lists), read DataSetInfo attributes of EM_C_731, 596, 795 and 248. Sampled the full level-0
