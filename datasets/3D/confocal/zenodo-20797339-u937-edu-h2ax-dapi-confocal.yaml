notes: 'Four TIFF files in one Zenodo record (1.15 GB): U937-PR9_3ch_Intensity_File.tif (probe: ImageJ hyperstack, 25x3x2048x2048
  uint16, axes labelled tcyx, uncompressed), U937-PR9_Nuclei_Count_Mask.tif and U937-PR9_gH2A.x_foci_Count_Mask.tif
  (25x2048x2048 uint16, values 0-255), U937-PR9_EdU_binary_thr200.tif (25x2048x2048 uint8). The record text says the
  masks were "obtained in FiJi"; the EdU mask name mentions a threshold of 200, so the masks are probably thresholding
  or classical-pipeline output rather than hand annotation, but the page does not say; annotation source is therefore
  unknown. Only one stack, so it is a small training set. xy pixel size comes from the TIFF header (45.07 nm); z spacing
  is not stored in the header, on the record page, and no paper, microscope or objective is named (a web search for the
  paper found none), so z is null. Dedup found no match, but DeepFoci (zenodo-4067741) and zenodo-19222986 are other
  foci datasets in the catalog, with different cells and images.'
