schema_version: '1.2'
id: s-bsst498-arabidopsis-ovule-wus-atlas
title: 3D gene expression atlas of WUSCHEL in Arabidopsis ovules with cellular, nuclear and tissue resolution
short_name: Arabidopsis ovule WUS reporter 3D cells (confocal)
description: Confocal z-stacks of fixed, cleared Arabidopsis thaliana ovules carrying the pWUS::2xVENUS:NLS reporter (cell
  walls stained with SR2200, nuclei with TO-PRO-3), with PlantSeg cell-boundary predictions, 3D cell segmentations, annotated
  3D cell meshes (MorphoGraphX), per-cell attribute tables and WUSCHEL signal blob meshes. 69 digital ovules (some stacks
  hold several ovules) covering stages 1-I to 2-III.
