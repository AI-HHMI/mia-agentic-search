notes: 'No license in the BioStudies record, so spdx is unknown. Distinct from wild-type atlas S-BSST475 and ino-5 set S-BSST497
  (same eLife paper). pWUS_2xVenus.zip: 165 files in 19 stack folders (cell boundary, nuclei and pWUS stacks, PlantSeg prediction,
  segmented cells, .mgxm meshes, attribute CSVs). enricher: voxel_size_nm set to null (was 125x125x240): the paper Methods
  give 63x63x240 nm for high-quality stacks and 125x125x240 nm for some 2x-downsampled ones, without saying which stack is
  which; stack TIFF headers differ (e.g. 80x80x262 nm, 63x63x261 nm; technical.notes). Cell labels were proofread manually
  in MorphoGraphX; some errors remain (paper). Labels: 17 *_Segmented_Cells, 788_Segmentation.tiff, 1044_predictions_gasp_average.tiff.'
