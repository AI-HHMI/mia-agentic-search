  notes: 'Listing: tools/listing.py --expand-zips on the BioStudies Files/ index: 1 zip, 165 members (index size rounded);
    exact zip size 11,763,165,934 B from the BioStudies files API (page-stated). Members are deflated: probe.py read only
    792_Segmented_Cells.tiff (LZW, imagej, 80.08x80.08x261.78 nm). sample.py on stack 790 (53 MB + 2.5 MB read): raw ZYX 129x728x728
    uint16, 0-4095, mean 161; label same shape, 352 IDs (one sample). normalization none: 12-bit capture per paper, sample
    in 0-4095. Voxel size varies per stack. Inflated first 64 KB of 5 Cell_Boundary headers (ImageJ, micron): 790 80.2x80.2x261.8
    nm (129x728x728); 773 80.7x80.7x267.0 (271x1398x2752); 1048 80.2x80.2x284.2 (165x2088x2088); 799 63.2x63.2x261.3 (235x1984x1984);
    788 80.2x80.2x261.8 (232x992x992). The paper gives 63x63x240 or 125x125x240 nm, which conflicts with the 80 nm headers,
    so voxel_size_nm is null; per-stack sizes are in each TIFF header. Also in each folder: <id>_Prediction.tiff (PlantSeg
    boundary prediction, not an array here since miao takes raw/labels only), .mgxm meshes and attribute CSVs.'
