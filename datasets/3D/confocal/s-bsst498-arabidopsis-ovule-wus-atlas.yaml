notes: 'No license is stated in the BioStudies record, so spdx is unknown. Distinct from the wild-type atlas S-BSST475 (pending
  PR) and the ino-5 mutant set S-BSST497: this study holds the WUSCHEL-reporter ovules (paper lists S-BSST475, S-BSST498,
  S-BSST497 and aggregate S-BSST513 as separate datasets of the same eLife paper). pWUS_2xVenus.zip (165 files, 19 stack
  folders: raw cell boundary, nuclei and pWUS stacks, PlantSeg prediction, segmented cells, mesh .mgxm, attribute CSVs, blob
  meshes). Voxel size from the paper Methods: 0.24 µm slices, 0.063 x 0.063 µm in the finest stacks, some stacks captured
  at 2x downsampled 0.125 x 0.125 x 0.24 µm; the coarser values are recorded and may not apply to every stack. Cell labels
  were proofread manually in MorphoGraphX; some segmentation errors remain (paper). Channel count 3 is taken from the file names.'
