notes: 'OSF project uzq3w has components Ovules, LateralRootPrimordia (labelled), InflorescenceMeristem and CLSMLeaf (raw only; not covered by this record). Voxel size given is Ovules (0.235 x 0.075 x 0.075 um ZYX); LateralRootPrimordia is 0.25 x 0.1625 x 0.1625 um (ZYX) per the OSF wiki. Paper: Ovules 39 train / 2 val / 7 test stacks; LRP 27 train / 2 val / 4 test time points. No license is stated on the OSF project or components (node_license null); the paper is CC-BY but that covers the article. The OSF API returned empty file listings for the components, so file names, sizes and counts could not be verified. Sources checked: OSF wiki and node metadata, paper full text via Europe PMC.'
