id: osf-uzq3w-plantseg-ovules-lateral-root
title: PlantSeg core datasets - Arabidopsis ovules (confocal) and lateral root primordia (light-sheet) with 3D cell instance segmentation
short_name: PlantSeg Arabidopsis cell segmentation (confocal)
description: Two training/validation datasets released with the PlantSeg pipeline. Ovules - confocal stacks of fixed Arabidopsis thaliana ovules (48 stacks with hand-curated cell instance ground truth). LateralRootPrimordia - light-sheet 3D+t movies of developing lateral roots (27 time points with ground truth in the paper's training set, plus validation and test time points). Each dataset consists of HDF5 files in train/validate/test sub-folders, holding a uint8 'raw' image and a uint16 'label' ground truth volume.
