notes: 'One 188 MB zip with 8 TIFFs (peek_archive: LegLabels/Leg1-4Labels.tif and LegStacks/Leg1-4Seq.tif,
  0.5-0.8 GB each uncompressed). Voxel size is not stated on the record or in the paper Methods (checked
  both, and the Dryad record). enricher: ImageJ headers say 0.0425 um x/y/z for legs 1, 2, 4 and 0.0489
  um for leg 3 (uncorroborated, differs per stack), so voxel_size_nm stays null. Paper says segmentation
  of individual muscles was manual in Amira 5.4.0 and that the raw stacks plus label fields are also on
  Dryad (10.5061/dryad.kv1cr18). Which of the two microscopes made which stack is not stated. Whether
  the stack channel is F-actin only is inferred from the paper (reconstructions are based on F-actin labelling);
  myosin II / DNA labelling is in the paper but not stated for these files. Only 4 volumes.'
