notes: 'Annotated data is a subfolder of the software release Cellos-1.0.0.zip (114 MB compressed): peek_archive
  shows docs/cellos_annotated_images/images/ and mask/ with 36 TIFFs each (72 TIFFs, about 806 MB uncompressed).
  The paper Methods (StarDist-3D training) state 36 organoids labelled by hand in Labkit, 3,862 nuclei,
  10/12/14 organoids with Hoechst/EGFP/mCherry nuclei, 20x water objective on a PerkinElmer Opera Phenix,
  5 um z step. The in-plane pixel size and thus voxel_size_nm are not stated on the Zenodo page, the paper
  Methods or the README, so null. The Zenodo licence (MIT) is that of the code repository and is applied
  to the whole zip, including the image data. Figshare 21992234 (raw example well, no annotations) is
  not covered. Organism is inferred from the cell source (human TNBC PDX cells); image channels in this
  subset are per-fluorophore single-channel stacks. enricher: size_bytes = whole zip per Zenodo API (was
  null).'
