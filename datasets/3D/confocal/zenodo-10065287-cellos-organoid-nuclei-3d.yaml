title: 'Cellos: manually annotated 3D nuclei in TNBC organoids (StarDist-3D training set, bundled in the Cellos code release)'
short_name: TNBC organoid 3D nuclei instances (confocal)
description: 36 confocal 3D stacks of single triple-negative breast cancer (PDX-derived) organoids imaged on an Opera Phenix
  with a 20x water objective, each paired with a manually annotated 3D nucleus instance mask (3,862 nuclei in total, Labkit in
  Fiji). Nuclei are labelled with Hoechst, EGFP or mCherry. Used to train the StarDist-3D model of the Cellos pipeline. The
  images and masks sit in docs/cellos_annotated_images/ inside the Cellos-1.0.0.zip software release.
