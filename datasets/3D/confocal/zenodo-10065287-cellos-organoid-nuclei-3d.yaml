notes: 'Annotated data is a subfolder of the software release Cellos-1.0.0.zip (114 MB compressed): peek_archive shows
  docs/cellos_annotated_images/images/ and mask/ with 36 TIFFs each (72 TIFFs, about 806 MB uncompressed) plus a script that
  reads the masks. The paper Methods (StarDist-3D training) state 36 organoids labelled by hand in Labkit, 3,862 nuclei, 10/12/14
  organoids with Hoechst/EGFP/mCherry nuclei, 20x water objective on a PerkinElmer Opera Phenix, 5 um z step. The in-plane pixel
  size and thus voxel_size_nm are not stated on the Zenodo page, the paper Methods or the README, so null. The Zenodo licence
  (MIT) is that of the code repository and is applied to the whole zip, including the image data. The separate figshare record
  21992234 (Cellos_example_dataset, 11 GB, one raw well) has no annotations and is not covered here. Organism is inferred from
  the cell source (human TNBC PDX cells); image channels in this subset are per-fluorophore single-channel stacks.'
