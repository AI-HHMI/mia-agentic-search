notes: 'Zenodo API record and its file list read (52 files: 26 *_img.tif and 26 *_seg.tif, total 11.45 GB; the record
  page text says 40 sample-location pairs and a larger volume, but only 26 pairs are listed). Header probe of CT13-endosteum:
  image uint16 140 x 1024 x 1024, mask uint8 same shape, no compression. Voxel size 0.18 x 0.18 x 0.3 um, Leica
  SP8 white-light-laser confocal, 63x objective, from the record description. Labels come from a U-Net semantic
  segmentation followed by post-processing correction (not stated whether manual), so source is automatic. No paper
  is linked on the record, and the stain, rat strain and the meaning of the CT/DB group codes are not stated on
  the record; a search found only a conference abstract on diabetic rats, which was not treated as evidence. download_url
  is null because the data is 52 separate files. enricher: label files seen and sampled (annotations verified);
  license url added from the Zenodo API license id cc-by-4.0.'
