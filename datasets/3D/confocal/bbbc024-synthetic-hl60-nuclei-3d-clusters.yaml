notes: 'Eight subsets (c00/c25/c50/c75 x lowSNR/highSNR); n_items = 8 x 30 images as stated on the page. Only c25_highSNR was listed: its TIFF zip holds 60 .tif files (about 61 MB each, 1.94 GB) while the page says 30 images per subset, and its foreground zip holds 30 .ics label files, so the exact image count per subset is unconfirmed. Images are also offered as ICS zips. The labels are .ics (not a listed format) and are described in annotations.format. Voxel size not on the page; the Cytometry A paper is not open access, so only its abstract was read. Total size not computed (8 image zips of roughly 2 GB each plus foreground zips of 13 MB).'
