notes: 'Very small: one confocal volume with a ground-truth height map for one surface (surface extraction,
  not voxel masks), a single training example; an example case of the Zellige tool, sibling of zenodo-6376566
  and zenodo-6376582 in the catalog. Zenodo lists 3 files (18,519,678 B): Culture_MucilairB_zo1_J4_Sars-3.tif,
  Surface1_Ground_truth_Height_map.tif and Surface1_Zellige_Height_map.tif (tool output, not ground truth).
  Pixel size 0.110 um and z step 0.4 um are from the Zenodo text. Paper (Methods, Example 3): 1024 x 1024
  x 15 voxels, ground truth traced manually by an expert. Zenodo says Zeiss LSM700, the paper LSM 710,
  63x/1.4 oil. Files were not opened.'
