short_name: SARS-CoV-2 bronchial epithelium surface (confocal)
description: One confocal z-stack (1024 x 1024 x 15 voxels per the paper) of a human bronchial epithelium culture
  (MucilAir) stained for the tight-junction protein ZO-1 four days after SARS-CoV-2 infection, whose epithelial
  surface is very irregular. An expert-drawn ground-truth height map of the surface is provided together with
  the height map reconstructed by the Zellige software.
