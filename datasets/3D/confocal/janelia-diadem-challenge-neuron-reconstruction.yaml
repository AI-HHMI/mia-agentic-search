notes: 'One record for the six DIADEM collections, downloaded as RAR archives from diadem.janelia.org/data_set_downloads.html
  (HEAD Content-Length: 55.7 GB in total; the largest are CA3 interneuron 16.6 GB, neuromuscular fibers 16.3 GB, layer 6 neuron
  20.3 GB), so download_url is null. READMEs: images are TIFF stacks, gold standards SWC. Rat cerebellar climbing fibers and CA3
  interneuron, cat layer 6 neuron: brightfield; mouse layer 1 axons: in vivo two-photon; mouse neuromuscular fibers (308 stacks)
  and Drosophila olfactory fibers: confocal. Voxel size is only given as z spacing in pixels, so null. No license or terms are
  stated (only a request to cite Brown et al. 2011); paper not open access (abstract read). RAR contents were not listed.
  Train/qualifier/final splits are defined per README.'
