notes: 'Small dataset: 4 annotated volumes (annotations_BIOP.zip has images/ and masks/ with 4 tiffs each), cropped into 16 images of 64x64x62 (crops_BIOP_v1.zip, not listed: peek failed with an SSL error). The source acquisition (zenodo 6646128) has pixel size 0.152 x 0.152 x 1 um at 1024x1024x62, but the annotated crops were downsampled by an unstated factor, so voxel size is left null. Authors not read from the API record. No linked paper found on the Zenodo record. Also contains 3 trained StarDist3D models and a 2.3 GB whole-tile TIFF.'
