notes: 'Files: ds_train.zip (12 TIFFs, 3.4 GB uncompressed; animal tokens and group in file names), ds_test_labeled.zip
  (9 TIFF sub-volumes with expert masks, annotator folders David/Robin/Chris) and ds_test_unlabeled.zip
  (4.8 GB, 62 TIFFs, 3 channels). Per the Zenodo description the 12 annotated volumes carry masks as a
  4th channel; volumes are 2048x2048 with 12-16 z-slices. All 12 annotated volumes are in ds_train. Voxel
  size is not stated on the Zenodo page; enricher: TIFF headers give 37.9-56.8 nm xy (varies per volume)
  and 300 nm z, see technical.notes. No associated paper is linked on the record or turned up in a web
  search (publications left empty).'
