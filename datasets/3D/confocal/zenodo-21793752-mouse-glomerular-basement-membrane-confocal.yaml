  notes: 'Listing: tools/listing.py, 3 zips, 5,977,511,661 B, complete (83 members). Headers: ImageJ hyperstacks
    (zcyx), uint8, uncompressed; ds_train and ds_test_unlabeled members are deflated, so first-IFD tags
    were read by partial range+inflate (~200 KB each). Sample: ds_train/NCWM.CKM105.Series004 (82 MB downloaded)
    shape [12, 4, 2048, 2048] uint8, values 0-255 over all channels incl. the mask (one sample). Mask
    channel values were not measured separately. Voxel size differs per volume: ImageJ XResolution 21.130322
    px/um (47.3 nm; most files), 22.539011 (44.4 nm), 26.412903 (37.9 nm), 19.369465 (51.6 nm), 17.608602
    (56.8 nm), two ds_train files have no XResolution; z spacing 0.29993 um in all; so imaging.voxel_size_nm
    stays null (sub-volumes differ). The tissue is expanded ("swelled"); whether these are pre- or post-expansion
    units is not stated. No single archive holds the whole dataset; download_url is the record page.'
