title: 3D confocal microscopy of the mouse glomerular basement membrane with expert GBM masks
short_name: Mouse glomerular basement membrane 3D (confocal)
description: 74 three-channel (Nephrin, Collagen IV, WGA) 3D confocal volumes of optically cleared mouse
  kidney glomeruli from control, Alport (Col4 mutation) and NPHS2 (podocin mutation) animals. Twelve volumes
  carry manual binary glomerular basement membrane (GBM) masks as a fourth channel; 62 whole-glomerulus
  volumes are unannotated. One sub-volume per group was annotated independently by three experts.
