notes: 'organisms (per the description PDF table): P. spadonia = Ps*/ folders, P. rhea = Pr*/, P. tepicana = Pt*/, P.
  obtusospinosa = Po*/; templates under Template_*/. BrainDataset.rar (1.07 GB) lists 106 files (headers read by range):
  19 brain folders with <brain>.nrrd, <brain>.tif and <brain>_DGG_labels.nrrd, test brains with extra annotator and automatic
  label sets, and 7 template folders. Voxel size is the ~0.7 x 0.7 x 5 um/voxel the Zenodo text and the PDF state (Olympus
  Fluoview, 20x); the NRRD header of Po2f-13 gives 0.6917 x 0.6917 x 4.988 um. Labels were traced manually in Amira in
  one hemisphere (except CX, SEZ and ROCB) by one expert (DGG) for the main sets; the test brains have label sets from
  three annotators. The paper (Arganda et al.) was not found in Europe PMC, so publications is empty.'
