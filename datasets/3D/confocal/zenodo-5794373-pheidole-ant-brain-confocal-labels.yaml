notes: 'All values come from the Zenodo record text. The single download is a .rar archive (1.07 GB), which cannot be
  listed remotely, so file contents, formats and counts were not verified (annotations_verified false); n_items 27 is
  10 + 12 + 5 images named in the description. Voxel size is the "~0.7 x 0.7 x 5 um/voxel" stated there, with an
  Olympus Fluoview BX50 and a 20x objective. The paper is named in the description (Arganda et al.) but could not be
  found in Europe PMC or via title search, so publications is empty and its Methods were not read. Labels were traced
  manually in Amira in one hemisphere (except CX, SEZ and ROCB) by one expert for the main sets; the test brains have
  label sets from three annotators. A separate description PDF (DatasetDescription_R3.pdf) is also on the record
  and was not read.'
