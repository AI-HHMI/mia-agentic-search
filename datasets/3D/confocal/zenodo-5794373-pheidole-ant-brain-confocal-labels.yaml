title: Dataset of "Statistical atlases and automatic labelling strategies to accelerate the analysis of social insect
  brain evolution"
short_name: Pheidole ant brain neuropil labels (confocal)
description: Confocal stacks of synapsin-stained brains from minor workers of four Pheidole ant species (10 P. spadonia
  brains, 12 brains across four species, and 5 test brains), each with manual labels of eight neuropil compartments (optic
  lobes, antennal lobes, mushroom body calyces and peduncle, central complex, subesophageal zone, rest of central brain).
  The test brains carry label sets from three annotators; group-wise templates, consensus labels and automatic labels
  are also included.
