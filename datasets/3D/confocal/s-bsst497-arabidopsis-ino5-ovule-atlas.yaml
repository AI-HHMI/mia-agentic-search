notes: 'No license is stated in the BioStudies record, so spdx is unknown. Distinct from the wild-type atlas S-BSST475 (pending PR) and the WUSCHEL-reporter set S-BSST498 (pending PR): the paper lists S-BSST475, S-BSST498, S-BSST497 and aggregate S-BSST513 as separate datasets of the same eLife paper, and this one holds the ino-5 mutant ovules (118 digital ovules per the record text). ino-5 (crispr_cas9).zip is 51.4 GB with 557 files in 62 stack folders (raw cell boundary and nuclei stacks, PlantSeg prediction, segmented cells, .mgxm mesh, attribute CSVs, a MorphoGraphX.py script); some stacks hold several ovules (A-B, C ...). Voxel size from the paper Methods: 0.24 µm slices, 0.063 x 0.063 µm in the finest stacks, some stacks at 2x downsampled 0.125 x 0.125 x 0.24 µm; the coarser values are recorded and may not apply to every stack. Cell labels were proofread manually in MorphoGraphX; some segmentation errors remain (paper).'
