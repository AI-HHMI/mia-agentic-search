title: 'ino Arabidopsis ovule atlas: A 3D digital cell atlas of ino ovules in Arabidopsis with cellular and tissue resolution'
short_name: Arabidopsis ino-5 mutant ovule 3D cells (confocal)
description: Confocal z-stacks of fixed, cleared ovules from homozygous ino-5 (CRISPR/Cas9, Col-0) Arabidopsis thaliana mutants
  (cell walls stained with SR2200, nuclei with TO-PRO-3), with PlantSeg cell-boundary predictions, 3D cell segmentations,
  annotated 3D cell meshes (MorphoGraphX) and per-cell attribute tables. 118 digital ovules covering stages 1-II to 3-IV.
