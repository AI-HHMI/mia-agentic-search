notes: 'Zip listed with peek_archive: 811 PNG files (the Zenodo description says 810; the
  extra file was not identified), 3.05 GB. Modality, objective, exposures, 10 planes at 2 um and recommended split (CHO and U2OS train, first three
  RPE1 fields validation, last six test) are from the Zenodo description and the Noise2Stack paper (read via ar5iv
  HTML). The split is a recommendation in prose, not provided as files, so splits_provided is false. Lateral pixel
  size is not stated on the Zenodo page or in the paper text I read. Organism not stated beyond cell line names
  (CHO is hamster, U2OS and RPE1 human), so left empty. The dataset was released with the paper; the paper has no
  DOI in Europe PMC/Crossref, so only the arXiv URL is given.'
