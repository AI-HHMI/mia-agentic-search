title: Multiplane microscopy dataset for benchmarking denoising methods
short_name: Multiplane cell denoising pairs (confocal)
description: 810 PNG images (2160 x 2160) of fixed CHO, U2OS and RPE1 cells stained with Hoechst 33342,
  imaged on a PerkinElmer Phenix confocal microscope at 20x in 10 focal planes (2 um apart) across 9 fields
  of view per well. Fluorescence is imaged at low (20 ms, noisy) and high (100 ms, clean) exposure, giving
  restoration pairs; brightfield is imaged once. A train/validation/test split by cell line and field
  of view is recommended.
