  notes: 'Listing: Dryad files API (3 RARs, exact sizes, sum = size_bytes) and every RAR member listed
    by walking the RAR5 block headers with range requests (scratch script, requests only; 2.38 MB read):
    542 files, 2,900,667,243 B unpacked. Sample: first 12.6 MB of MDCK.rar extracted with bsdtar -> MDCK/ex_001.
    ex_001_raw.tif: ImageJ hyperstack, 30 slices of 333x373 uint16, uncompressed, values 0-5693 (one sample;
    ImageJ display max 2088); Airyscan SR 3D processed (Zeiss Info). Calibration 65.89 nm xy (XResolution
    15.18 px/um), 182.13 nm z (spacing) for ex_001 only; the paper says it varies per stack (xy 44-65
    nm, z 170-200 nm), so voxel_size_nm stays null; per-file ImageJ calibration is available. Stacks are
    single cells excised from larger acquisitions (Info: 1000x1000x68 source CZI). Labels are automatic
    TSOAX snake / KerNet network coordinates, not voxel masks. No direct download TensorSwitch can use:
    datadryad.org file downloads return 401 (API) / 403 (file_stream); kernet.rwth-aachen.de serves the
    same RARs with range support but is not allowlisted, and RAR members are not addressable as zip::member.'
