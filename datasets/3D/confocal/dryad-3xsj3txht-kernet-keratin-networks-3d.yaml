notes: 'CC0 per Dryad API. Three RARs (MDCK, HACAT, RPE), mirrored with identical sizes at kernet.rwth-aachen.de/DATA/.
  organisms: Canis lupus familiaris = MDCK.rar, Homo sapiens = HACAT.rar, Mus musculus = RPE.rar. Each
  cell folder ex_NNN has a raw ImageJ TIFF z-stack plus automatic TSOAX/KerNet network tables (cell exterior
  masked by manually drawn borders). Voxel size varies per stack (paper: xy 0.044-0.065 um, z 0.17-0.2
  um; each TIFF stores its own calibration), so voxel_size_nm stays null. enricher: formats tiff (was
  other); annotations_verified true (network CSVs seen in an extracted sample); annotations.format from
  the archive listing.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "MDCK.rar   166,834,356 B  (181 files, 561,380,489 B unpacked)\n  data file documentation.pdf\n\
      \  MDCK/ex_001 .. ex_010/   18 files per cell:\n    ex_NNN_raw.tif                       raw z-stack\
      \ (ImageJ TIFF)\n    ex_NNN_new_NODES_XYZ.csv             nodes x,y,z (um), brightness\n    ex_NNN_new_all_segments_nodes.csv\
      \    segment vertices x,y,z (um)\n    ex_NNN_new_segments_list.csv, ex_NNN_new_ADJL_Nodes.csv\n\
      \    ex_NNN_snakes.txt (TSOAX), ex_NNN_graph.gml, ex_NNN_all_segments.obj\n    ex_NNN.fbx, ex_NNN.max,\
      \ *.dat, *.mat, *.ms  (3D/VR exports)\nHACAT.rar  483,755,876 B  (181 files, 1,681,145,975 B unpacked)\n\
      \  data file documentation.pdf, HACAT/ex_026 .. ex_035/  (same 18 files)\nRPE.rar    202,493,771\
      \ B  (180 files, 658,140,779 B unpacked)\n  data file documentation.pdf, RPE/ex_041 .. ex_050/ \
      \   (one cell folder has 17 files)\n"
    n_files: 3
