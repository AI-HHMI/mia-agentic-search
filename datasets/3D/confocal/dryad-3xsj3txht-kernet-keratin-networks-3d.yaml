title: KerNet, 3D fluorescence and segmentation datasets of keratin networks from MDCK, HaCaT, and RPE
  cells
short_name: Keratin filament networks 3D (airyscan confocal)
description: 30 single-cell 3D Airyscan confocal image stacks of fluorescently tagged keratin intermediate
  filaments (10 each of MDCK, HaCaT and mouse RPE cells) together with numerical 3D network data of each
  cell (vertices, segments and nodes from TSOAX/KerNet segmentation) and exchange-format 3D data. Delivered
  as three RAR archives, one per cell type.
