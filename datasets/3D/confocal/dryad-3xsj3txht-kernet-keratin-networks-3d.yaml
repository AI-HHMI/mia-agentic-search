notes: 'Dryad API record (CC0, three RAR files HACAT.rar 484 MB, MDCK.rar 167 MB, RPE.rar 202 MB) and the eLife paper full text
  (Europe PMC) read. The record lists per archive: 3D image data of 10 cells, numerical network data of 10 cells, a PDF
  description and corresponding 3D data. RAR contents could not be listed (datadryad.org downloads return 403 here and
  RAR cannot be listed remotely), so data.formats is other (unknown) and annotations_verified is false. Network data are
  computed with TSOAX and KerNet (automatic), validated by overlaying vertices on the image; the cell exterior was masked
  by manually defined cell borders. Imaging: Zeiss LSM710 Airyscan, 63x/1.4 oil, voxel size xy 0.044-0.065 um and z 0.17-0.2 um
  (varies per stack), so voxel size is left null. Interactive renderings at kernet.rwth-aachen.de (not fetched). Labels are
  algorithm outputs rather than hand annotation, so this suits training on skeletons with caution.'
