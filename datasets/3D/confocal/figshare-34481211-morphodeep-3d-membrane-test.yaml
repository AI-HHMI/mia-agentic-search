notes: 'Held-out test data only; training and validation volumes are not included. 21 files: 17 .tar.zst archives
  (16.5 GB; uncompressed TIFFs total 113 GB) plus selection.csv (pair mapping), archive_plan.csv, SHA256SUMS and
  README.md. Pairs per group: Arabidopsis thaliana 30, C. elegans 10, lateral root primordia 4, ovules 7, sea star 75,
  Phallusia mammillata 100 (confocal for the first five groups, SPIM for Phallusia, per file names). Arabidopsis,
  lateral root and ovule file names (e.g. plant13/76hrs_plant13_trim-acylYFP) resemble the public PlantSeg data, so
  part of this may overlap existing records; the record does not say where the volumes originate. Sea star species,
  voxel sizes, how the reference masks were made and any paper are not stated in the Figshare record, README or the
  Codeberg page (no publication is linked). Archives were not opened (zstd). Checked: Figshare record and file list,
  README, selection.csv, archive_plan.csv, Codeberg README.'
