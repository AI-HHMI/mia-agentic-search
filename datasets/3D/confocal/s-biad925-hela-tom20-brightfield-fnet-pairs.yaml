description: 'Paired 3D confocal stacks (TOM20 immunofluorescence and the transmitted-light channel acquired in parallel) of fixed HeLa cells, provided as the ZeroCostDL4Mic label-free prediction (fnet) training and test example: 184 training and 16 test stacks per channel (tif). The BioStudies entry is titled as a Noise2Void 3D example and its biosample text names A2780 cells, but its file list and the ZeroCostDL4Mic paper describe this fnet dataset.'
