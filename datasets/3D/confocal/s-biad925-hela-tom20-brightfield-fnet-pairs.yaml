title: ZeroCostDL4Mic - Noise2Void (3D) example training and test dataset
short_name: HeLa TOM20 vs transmitted-light pairs (confocal)
description: 'Paired 3D confocal stacks (TOM20 immunofluorescence and the transmitted-light channel acquired in parallel)
  of fixed HeLa cells, provided as the ZeroCostDL4Mic label-free prediction (fnet) training and test example: 92 training
  and 8 test stacks per channel (512x512x32, uint8 tif), i.e. 100 transmitted-light/TOM20 pairs cut from 25 1024x1024x32 acquisitions.
  The BioStudies entry is titled as a Noise2Void 3D example and its biosample text names A2780 cells, but its file list and
  the ZeroCostDL4Mic paper describe this fnet dataset.'
