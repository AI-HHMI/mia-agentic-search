notes: 'No license or terms in the BioStudies record, file API or paper text; license unknown. BioStudies title/biosample
  text (Noise2Void 3D, A2780, Lifeact-RFP) do not match the files: only Label-free prediction (fnet) v2 folders (TOM20 vs
  transmitted light), matching the fnet dataset in the ZeroCostDL4Mic paper Methods (fixed HeLa). Target is a second channel,
  not manual annotation. enricher: 200 distinct tifs (BioStudies lists each file in two file lists, hence 400); 92+8 per channel
  = the paper''s 100 stacks (was 184/16, n_items 400). enricher: voxel size 90.19x90.19x148.4 nm from ImageJ headers, agrees
  with paper (90 nm XY, 150 nm Z; was 90x90x150). enricher: size_bytes from the BioStudies file API (was 2x).'
