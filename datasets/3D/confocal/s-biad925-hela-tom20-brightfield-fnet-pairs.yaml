notes: 'No license or terms in the BioStudies record or file API; license unknown. BioStudies title/biosample text (Noise2Void 3D, A2780, Lifeact-RFP) do not match the files: the file list holds only Label-free prediction (fnet) v2 folders (TOM20 fluorescence vs transmitted light), which matches the fnet dataset in the ZeroCostDL4Mic paper Methods (fixed HeLa, 90 nm XY / 150 nm Z). Paper: 100 stacks (92 train, 8 test); listing has 2x files per channel, so the crop scheme is unclear. Target is a second channel, not manual annotation. Dimensionality and voxel size from the paper, not file headers.'
