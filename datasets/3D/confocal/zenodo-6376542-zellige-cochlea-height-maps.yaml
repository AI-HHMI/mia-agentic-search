short_name: Mouse cochlea epithelium surface (confocal)
description: One swept-field confocal z-stack (1024 x 1024 x 45 voxels) of a phalloidin-stained mouse
  embryonic cochlea in which a thin sensory epithelium lies on top of a thick mesenchymal mesh. An expert-drawn
  ground-truth height map of the epithelial surface is provided together with the height map reconstructed
  by the Zellige software.
