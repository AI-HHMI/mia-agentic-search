notes: 'Very small: one confocal volume with a ground-truth height map for one surface (surface extraction,
  not voxel masks), a single training example; an example case of the Zellige tool, sibling of zenodo-6376566
  and zenodo-6376582 in the catalog. Zenodo lists 3 files (96,776,828 B): Cochlea_E16.tif, Surface1_Ground_truth_Height_map.tif
  and Surface1_Zellige_Height_map.tif (tool output, not ground truth). Pixel size 0.133 um is from the
  Zenodo text, which gives only ''z step < 1 um'', so z is null. Paper (Methods, Example 2): C57BL/6 mouse,
  phalloidin-Atto 565, Bruker Opterra II, 60x/1.4 oil, 1024 x 1024 x 45 voxels, ground truth traced manually
  by an expert. Zenodo says E16.5, the paper E14.5, so the stage is not stated in sample. Files were not
  opened.'
