notes: 'Labels-only deposit: the embryo image is not on figshare; it is Dataset A (3D embryo, 56 cells,
  confocal) at https://www.3d-cell-annotator.org/download.html (figshare file 5886078). The figshare HTML
  page returns 403 to the fetch tool, so facts come from its API record and the six zip listings (peek_archive:
  Expert1-3 each hold 4 Labels.tiff). Sibling articles for the other data (24982062, 24982227, 24982275)
  are separate records. Licence GPL-3.0+ per figshare, with a description limiting use to academic research.
  Size is the sum of the six file sizes; download_url is null because the data spans six zips. enricher:
  voxel size 292.97x292.97x1000 nm and 5 channels from the CZ_LSMINFO header of the embryo image (figshare
  file 5886078; was null); download_url = landing page.'
