title: 3D nucleus annotations of a mouse embryo by three experts and five tools (Hollandi et al. embryo
  masks)
short_name: Mouse embryo 3D nucleus masks (confocal)
description: Label volumes (Labels.tiff) for a 3D confocal image of a mouse embryo, annotated independently
  by three experts. Each expert annotated the embryo four ways (manual twice, with the Minimal-contour
  tool, and with Minimal-contour plus interpolation) in napari-biomag-annotator, giving 12 Labels.tiff
  volumes, plus one annotation each in webKnossos, Paintera and ITK-SNAP. Annotation-time CSVs and screen-recording
  videos are included. The embryo image itself is not in this deposit and is downloaded from 3d-cell-annotator.org.
