notes: >-
  File list: 3,958 files, 22.8 GB (727 TIFF, one per channel; 731 npz masks; 1,465 CSV; 747 h5 SpotMAX outputs) in
  Cell-ACDC Position folders for C. elegans COSA-1 (Halo, mNeonGreen), yeast mtDNA and yeast smFISH (MDN1, SUT509).
  C. elegans sets have spot annotations from three annotators. Methods: yeast smFISH 20 planes at 240 nm, yeast mtDNA
  0.35 um steps, C. elegans 70-75 planes at 200 nm. Lateral pixel size not stated in the paper, study page or file list,
  so voxel_size_nm is null. The paper's hematopoietic stem cell DNA-FISH data is not in this ground-truth file list.
