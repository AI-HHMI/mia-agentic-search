title: 'SpotMAX: a generalist framework for multi-dimensional automatic spot detection and quantification'
short_name: SpotMAX 3D spot ground truth (yeast, C. elegans)
description: >-
  3D fluorescence z-stacks with expert-annotated spot centres (smFISH in budding yeast, mitochondrial DNA nucleoids in
  yeast, COSA-1 crossover foci in C. elegans germ cells) and single-cell segmentation masks, used to train and benchmark
  the SpotMAX spot detector.
