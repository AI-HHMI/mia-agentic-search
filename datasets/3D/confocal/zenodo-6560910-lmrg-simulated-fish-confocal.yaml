notes: 'Files: 4 simulated (Cytopacq) confocal volumes celegans_dyn-{10,90}_ceff-{0,90}_final.ics.ome.tiff, matching *_label.ics.ome.tiff,
  and PSF_confocal_1.4NA_1.5ri_80nm_250nm.ics. Per the study repo, ceff = clustering effect (0 = low) and dyn = dynamic range
  usage (90 = high SNR); each phantom has 1500 spots (ini). Labels come from the simulation (automatic). Sibling record 6560759
  (simulated widefield nuclei) is a separate dataset. enricher: voxel size 161.616x161.616x200 nm from OME-TIFF header, matching
  the study repo correct_scales.py (fish xy 0.1616 um, z 0.200 um) and ini z step 0.2 um (was null). enricher: paper found
  via Europe PMC (Pengo, Kubow et al. 2025, J Biomol Tech), not open access, full text not read. enricher: organism C. elegans
  is the simulated phantom, no real specimen.'
