notes: 'Files per Zenodo record: celegans_dyn-{10,90}_ceff-{0,90}_final.ics.ome.tiff (about 39.6-40.5 MB each) with matching *_label.ics.ome.tiff (about 49.0-49.9 MB each) and PSF_confocal_1.4NA_1.5ri_80nm_250nm.ics (33.6 MB); size_bytes is the sum of the 9 listed files. Meaning of dyn/ceff parameters, image dimensions, voxel size, spot counts and label encoding are not stated on the record or in the study GitHub README (which has no dataset description or license), and no paper was found, so they stay unknown. File header probing returned HTTP 504 from Zenodo, so voxel size could not be read from the files. Labels are inferred to come from the simulation (source: automatic). Sibling record 6560759 (simulated widefield nuclei) is a separate dataset already in the catalog; this one is a different simulated sample type (confocal punctate FISH).'
