schema_version: '1.2'
id: zenodo-5010430-synthetic-liver-tissue-benchmark
title: 'Synthetic 3D confocal liver tissue benchmark: simulated four-channel images at three noise levels
  with voxelated ground-truth tissue models (Zenodo)'
short_name: Synthetic liver tissue 3D benchmark (confocal)
description: Benchmark for reconstructing dense 3D tissue from confocal images. Three voxelated ground-truth
  models of idealised mouse liver tissue (nuclei, cell borders, sinusoids, bile canaliculi) and nine artificial
  confocal stacks simulated from them at signal-to-noise ratios 10:1, 4:1 and 2:1 (PSF convolution, uneven
  staining and Poisson noise), at 0.3 um isotropic voxels. Supplementary data of the eLife pipeline paper.
