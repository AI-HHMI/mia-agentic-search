notes: 'Synthetic data: the paper (Results, Methods) says the images are simulated by convolving uneven-stained
  models with a 3D confocal PSF and adding z-dependent Poisson noise; they are not microscope acquisitions.
  Zenodo lists models.zip (3 TIFF models), model_image.zip (9 TIFFs, model_image_N_SNR_M.tif for N=1-3
  and SNR 10, 4, 2) and scripts_img_generation.zip (generation scripts, not images). Paper states four
  channels (nuclei, cell borders, sinusoids, bile canaliculi) and 0.3 um voxels. Confocal is listed as
  modality because the images emulate confocal stacks. enricher: sampled image 1 SNR 10 and Model1, same
  zcyx shape and grid; model channels are binary masks (0/1000); annotations.format updated.'
