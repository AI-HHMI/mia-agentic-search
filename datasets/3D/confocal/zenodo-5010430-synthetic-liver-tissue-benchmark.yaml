notes: 'Synthetic data: the paper (Results, Methods) says the images are simulated by convolving uneven-stained
  models with a 3D confocal PSF and adding z-dependent Poisson noise; they are not microscope acquisitions.
  Zenodo lists models.zip (3 TIFF models), model_image.zip (9 TIFFs, model_image_N_SNR_M.tif for N=1-3
  and SNR 10, 4, 2) and scripts_img_generation.zip (138 MB of generation scripts, not images); zip contents
  from peek_archive. size_bytes is the whole record. Paper states four channels per synthetic image (nuclei,
  cell borders, sinusoidal and bile canaliculi networks) and 0.3 um voxels. Label encoding of the model
  TIFFs and whether the images map one-to-one to the models were not inspected (the enricher can check).
  Confocal is listed as modality because the images emulate confocal stacks.'
