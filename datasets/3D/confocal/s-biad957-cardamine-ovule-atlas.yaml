  notes: 'listing.py read the https index (FTP timed out): 842 files, 419.3 GB, rounded sizes; the BioStudies file list JSON
    gives exact sizes for all 843 files (419,045,230,610 B), so size_source is page-stated. Probed ovule 1690: cellboundary,
    nstain and predictions are ImageJ TIFFs (uint16, uint16, uint8; zyx 108x688x688; uncompressed); segmentation uint16 LZW,
    Orientation 4. Sampled cellboundary (102,445,279 B) and segmentation (5,799,850 B), and read them again for an alignment
    check against flips (108,245,129 B). Raw: 0..65535, 4% zeros, saturated at 65535 (p99.9), 939 distinct values: contrast-stretched
    inferred from the sample, not stated. Segmentation: 1439 ids, 27% zeros (one sample). Header voxel size 125.59 x 125.59
    x 332.83 nm matches the paper''s 0.126 x 0.126 x 0.33 um. Segmentation automatic (PlantSeg), cell-type labels manual (paper
    Methods): annotations.source mixed. <id>_cellboundary_predictions.tiff (PlantSeg boundary probabilities, uint8 zyx, same
    shape and calibration as the raw; probed) is not listed as an array: the miao layout has only raw and labels.'
