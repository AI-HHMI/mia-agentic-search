notes: 'File list read in full (843 files, 419 GB): 353 TIF (cell boundary, nuclei stain and segmentation
  stacks), 119 boundary-prediction TIFFs, 120 MorphoGraphX .mgxm meshes, 240 CSVs, 6 scripts, 2 zips,
  organised by stage folder (1-I-2-II to 3-VI) and ovule id. Voxel size 0.126 x 0.126 x 0.33 um and stains
  from the paper Methods. Segmentation was done with PlantSeg (automatic); the paper says segmentation errors
  occur (megaspore mother cell neighbours at stages 2-II to 2-V, embryo sac at 3-V/3-VI) and does not describe
  full manual correction; cell-type labels were assigned manually in MorphoGraphX. Sample count of 119 is from
  the number of boundary-prediction files. Related to, but a different dataset from, the Arabidopsis ovule
  atlas (S-BSST475, separate open PR). No single archive; download_url is null.'
