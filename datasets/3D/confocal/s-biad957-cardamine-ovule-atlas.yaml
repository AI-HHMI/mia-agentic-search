  and cell-type labels (BioImage Archive S-BIAD957)
short_name: Cardamine ovule 3D cell atlas (confocal)
description: Confocal z-stacks of about 119 cleared, SR2200 cell-wall and TO-PRO-3 nuclei-stained Cardamine
  hirsuta ovules covering stages 1-I to 3-VI, each with PlantSeg boundary predictions, a 3D cell instance
  segmentation, MorphoGraphX cell meshes, manual cell-type labels and per-cell attribute tables. A sibling to
  the Arabidopsis thaliana ovule atlas.
