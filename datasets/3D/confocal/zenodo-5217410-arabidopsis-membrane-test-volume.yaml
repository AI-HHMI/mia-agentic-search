    are from this one sample. Voxel size not found; checked: TIFF/ImageJ headers, Zenodo API of 5217410 and siblings 5217341/5217394/5217367
    (one-line descriptions), VollSeg GitHub README, SciPy 2021 VollSeg paper (no Arabidopsis data details), Europe PMC title
