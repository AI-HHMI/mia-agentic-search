notes: 'The Zenodo description is one line and gives no modality, organism, voxel size or annotation method. Organism, confocal
  modality and membrane labelling are taken from sibling record zenodo 5217341 (same author, same date; "3D dataset of confocal
  imaged arabidopsis for testing membrane segmentation models"), not from this page, so confidence is low. File headers (tools/probe.py):
  test.tif uint8 [52,724,724] zyx, testGT.tif uint16 [52,724,724] with values 1..3351; ImageJ spacing 0.195312 with unit "pixel"
  is not a usable physical size, so voxel_size_nm is null. Whether label 0 is background and whether the labels are manual
  or model output is not stated. Only one volume pair, so it is a test set rather than a training set. Sibling 5217341 holds
  four label volumes without raw images and is not proposed here. No paper is cited on the page. enricher: technical block
  from sample; voxel size still not found (see technical.notes).'
