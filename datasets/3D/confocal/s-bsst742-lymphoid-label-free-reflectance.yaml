title: 'Label-free cell segmentation of diverse lymphoid tissues in 2-D and 3-D: confocal reflectance
  training data'
short_name: Mouse lymphoid tissue reflectance (confocal)
description: 'Confocal reflectance images of mouse lymphoid tissue (spleen, Peyer''s patch, mesenteric
  lymph node) released with a label-free cell segmentation method. The Python package contains 2-D and
  3-D U-Net training data: reflectance images with nucleus / cytoskeleton / background class labels derived
  from fluorescence staining of parallel sections, plus held-out test images.'
