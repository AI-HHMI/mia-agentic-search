notes: 'Paper: ground truth bootstrapped with ilastik then hand-curated. Voxel size 0.235 x 0.075 x 0.075
  um (ZYX) from the project wiki and paper (Wolny et al. 2020). No license is stated on the OSF project,
  its components, the wiki or the paper. enricher: files are in child components train (x9yns, 22 files),
  val (xp5uf, 2) and test (8jz7e, 7): 31 HDF5 files, 3,434,527,614 bytes from the OSF files API (the paper''s
  39/2/7 split differs; n_items now 31). File names end in _ds2x / _final_crop_ds2, yet the wiki gives
  the voxel size above for these files; the HDF5 resolution attrs are 1,1,1. Coverage: train files also
  hold label_with_ignore (-1 = unlabelled cells), so training labels are partial.'
