title: Multi-resolution confocal fluorescence microscopy of human dentin porosity
short_name: Human dentin porosity paired-resolution (confocal)
description: Experimentally paired high- and low-resolution confocal fluorescence stacks of human dentin
  porosity (tubules and branches) from one rhodamine B-stained third-molar slice, six regions near the
  dentin-enamel junction, acquired at 100, 200, 400 and 800 nm pixel size with the same objective. Provided
  as raw stacks, low-resolution stacks registered to high resolution, and paired 128x128 patches classified
  as tubules, branches or both, for super-resolution training and image quality assessment.
