  null. No train/val/test split is provided. Zenodo version DOI is 10.5281/zenodo.17185791 (concept DOI
  10.5281/zenodo.17185790). Sources checked: dataset page, API record, file listing, paper full text (Data
  in Brief).

  enricher: TIFF headers confirm 8-bit greyscale, HR ImageJ calibration 99.98 nm/px (x8: 802.6 nm/px),
  consistent with the record.'
