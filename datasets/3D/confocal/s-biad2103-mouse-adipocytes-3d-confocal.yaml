notes: "4 image stacks (1.1 GB) and 4 mask stacks (1.6 GB). Companion of S-BIAD2102 (trout), same lab and protocol; paper: Hue et al. 2025 (Adipocyte). Masks: Cellpose 2 model retrained human-in-the-loop, objects touching the border, sphericity < 0.35 or < 5000 voxels removed in Fiji, each stack manually checked in 2D/3D (study + paper Methods). enricher: annotations.source automatic (Cellpose inference + filter, manually validated; was mixed). enricher: voxel size left null, files differ (header calibration): Series001/003 images 1155.5x1155.5x5000.8 nm, their masks z 2500 nm (z rescaled x2); mosaic files 456 nm (image) / 450 nm (mask) xy, z not in header. Paper Methods states 1.15x1.15x1.15 um in general, which these headers contradict. No train/test split."
