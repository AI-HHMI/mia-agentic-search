notes: "4 image stacks (1.1 GB) and 4 mask stacks (1.6 GB) listed in mouse_adipose_tissue.json; small, but each is a full 3D volume. Companion of S-BIAD2102 (trout), same lab and protocol. Masks come from a Cellpose 2 model trained human-in-the-loop for this staining; objects touching the stack border, with sphericity < 0.35 or < 5000 voxels were removed in Fiji and each stack was manually checked in 2D and 3D (source: study description). Images are RGB-stored TIFF stacks (green = 5-DTAF, red = Nile Red); voxel size is not stated in the BioStudies record and the TIFF header carries no calibration. No paper is listed in the study record. No train/test split."
