    alignment_notes: 'Pairing: mask name = image stem (with small spelling differences) + _cp_masks_[Ff]iltre / -filtre; match by date + Series00N or mosaic name. Series001: image 56 z, mask 112 z (z spacing 5.0008 vs 2.5 um in headers, xy equal) = z scaled x2. Series003: image 82x512x512, mask 164x510x492: z x2 and xy cropped (offset not stated). Mosaic pairs: same shape (246x518x974, 420x520x969), header xy 456 vs 450 nm (rounding). Float32 storing integer IDs.'
  notes: 'Exact sizes from the BioStudies file list (mouse_adipose_tissue.json, 8 data files, 2,743,468,799 bytes); listing.py read the HTTP index (FTP timed out), so size_source page-stated. All 8 files probed (headers); sample: Series001 pair downloaded (162.7 MB), value ranges from that one sample, label float32 with integer values 0-71. Raw/label grids differ for the Series files (z x2, Series003 also cropped) - a converter must resample or treat them separately. Voxel size not set: per-file header calibrations differ (see notes); checked: TIFF headers, BioStudies study record (no pixel size in REMBI sections), file list, paper Methods (1.15 um isotropic stated generally, conflicts with headers), no code repository linked. Direct files on ftp.ebi.ac.uk (https, range requests); no single archive offered, so download_url is the Files/ folder.'
