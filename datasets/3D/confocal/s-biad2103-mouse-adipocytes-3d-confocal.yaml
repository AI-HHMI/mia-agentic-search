    alignment_notes: ImageJ stacks, RGB (photometric 2; green = 5-DTAF, red = Nile Red per study description, samples not identical). Shapes 56x512x512x3 to 420x520x969x3. The two mosaic images are named clahe_denoised-scaleZx2 (CLAHE, denoised, z rescaled x2); the two Series files are not.
