notes: 'The TIFF training zip lists 5 ovule stacks (folders 1135, 1136, 1137, 1139 and 1170; 7 files each:
  nuclei TO-PRO-3, H2B-tdTomato, cell wall, cell boundary prediction, initial nuclei GT, gold nuclei GT,
  cell segmentation), ~10 GB uncompressed. The H5 zip ("Training data and Models.zip", 10 GB) also holds
  47 trained models; its contents were not listed. Further zips hold figure data from other species (Cardamine
  hirsuta, Antirrhinum majus, mouse blastocyst, etc.) with segmentations. Voxel size 0.126 x 0.126 x 0.33
  um is from the BioStudies acquisition text and may vary per stack. Train/val/test split not stated in
  sources checked (study record, listing, paper abstract/intro). enricher: size_bytes = sum of the 11
  zips in Nuclei_training_segmentation.json (was null). Stack 1135 TIFF header says 0.127 x 0.127 x 0.284
  um, unlike the 0.126 x 0.126 x 0.33 um acquisition text; record value kept.'
