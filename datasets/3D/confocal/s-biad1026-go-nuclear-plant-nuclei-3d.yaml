notes: 'The TIFF training zip lists 5 ovule stacks (folders 1135, 1136, 1137, 1139 and 1170; 7 files each: nuclei TO-PRO-3,
  H2B-tdTomato, cell wall, cell boundary prediction, initial nuclei GT, gold nuclei GT, cell segmentation), ~10 GB uncompressed.
  The H5 zip ("Training data and Models.zip", 10 GB) also holds 47 trained models; its contents were not listed. Further zips
  hold figure data from other species (Cardamine hirsuta, Antirrhinum majus, mouse blastocyst, etc.) with segmentations. Voxel
  size 0.126 x 0.126 x 0.33 um is from the BioStudies acquisition text and may vary per stack. Total size not computed (zips
  total tens of GB). Train/val/test split not stated in sources checked (study record, listing, paper abstract/intro).'
