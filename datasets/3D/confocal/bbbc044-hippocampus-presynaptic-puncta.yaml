notes: 'Originals 126 MB and validation data 325 MB (two zips, 473.2 MB in all); each stack 15 z-images
  at 0.14 um step, 1024x1024, 8-bit, one stain per file. Annotations exist only inside rectangular validation
  regions. enricher: voxel size 57.3x57.3x140 nm from the TIFF headers (Zeiss LSM VoxelSizeX/Y 0.0573
  um, ImageJ spacing 0.14 um; z matches the BBBC page and paper), was null. enricher: channels 4 -> 1
  (the 4-channel acquisition is released as one channel per stack: vGlut-1 or vGat). enricher: size from
  the zip listing (was null). Each stack has two expert files (expert1/expert2).'
