notes: 'Same data is IDR idr0079 (data DOI 10.17867/10000138). enricher: voxel size set to null (was 99.2x99.2x224.5
  nm): ImageJ calibration differs between experiments: x/y 99.21 nm (A, C-J), 102.44 nm (B), 85.20 nm (K, fixed
  pea3 smFISH); z 224.54 nm (A, B, C, F, I, J), 220.0 nm (D, E, G, H), 186.74 nm (K); one file probed per experiment.
  enricher: formats tiff (plain .tif ImageJ hyperstacks, not OME-TIFF; was ome-tiff); n_items 584 files (BioStudies
  file list: 11 experiment folders, 233 _seg label stacks), one channel per file. Segmentations are automatic and
  manually checked, not hand-drawn. Paper Methods and Data availability read.'
