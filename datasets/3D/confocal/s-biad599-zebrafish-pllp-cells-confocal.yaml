title: An image-based data-driven analysis of cellular architecture in a developing tissue (zebrafish lateral line
  primordium, 3D confocal with cell segmentations)
short_name: Zebrafish lateral-line 3D cells (confocal)
description: '3D AiryScan FAST-mode confocal stacks of the zebrafish posterior lateral line primordium (cldnB:lyn-EGFP
  membrane label, some stacks with a second label such as nuclei, actin, Golgi or endosome markers), each paired
  with a 3D single-cell instance segmentation (uint16 label stack named <id>_seg). Segmentations came from an automated
  membrane-based pipeline and were manually checked; stacks with more than ~10% missed or mis-segmented cells were
  discarded. Two components: live imaging (IDR experimentA, 40x) and fixed embryos with pea3 smFISH (experimentB,
  63x).'
