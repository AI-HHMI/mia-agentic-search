notes: >-
  Zenodo lists 10 P. spadonia + 12 multispecies brains with labels and 5 test brains (27 image volumes; test brains may overlap). Archive is a RAR so contents could not be listed (peek_archive supports zip only); image format TIFF per paper Methods (converted to NRRD for ANTs), label file format not verified. Voxel size ~0.7x0.7x5 um from page and paper Methods. Paper Data availability gives no extra file details. A newer Zenodo version exists. Annotation presence is from the record description, not a file listing.
