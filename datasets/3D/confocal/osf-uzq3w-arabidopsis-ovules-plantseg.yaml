notes: 'Hosted as OSF components train (22 files), val (2) and test (7) under project uzq3w. File names carry a ds2x / ds2 suffix, so the files may be downscaled versus the 0.075 x 0.075 x 0.235 um voxel size stated on the project wiki and in the paper; downscaling of these files is not documented, so voxel_size_nm is the stated acquisition value and may not match the files. The paper reports 48 stacks (39 train, 2 val, 7 test) but OSF lists 31 files (22 train, 2 val, 7 test). Training files also hold a label_with_ignore array. No license is stated on OSF (node_license null); the paper is CC BY 4.0 but states no dataset license, so license is unknown. Staining/dye not specified for ovules. Checked OSF API, wiki and the paper (PMC).'

