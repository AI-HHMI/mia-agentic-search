notes: 'Nuclei voxel size 0.207x0.207x1 um or 0.23x0.23x1 um depending on stack (record uses the first);
  membrane stacks are MuVi-SPIM at 0.295x0.295x1 um (paper Methods). Archive (peek_archive): 41 .h5, 4
  png, 1 md; Nuclei/{train,test} (35) and Membrane/{train,val} (6). Paper (Bondarenko et al. 2023, EMBO
  J) found 2026-10-29 via a Europe PMC search for the dataset DOI; its Data Availability cites this deposit
  and github.com/kreshuklab/mouse-embryo-seg. Nuclei GT: network predictions manually proofread in Paintera,
  iteratively; membrane GT: pretrained PlantSeg output manually corrected, so source = proofread. enricher:
  two HDF5 files sampled; raw/label pairs confirmed (instance IDs); size matches the listing.'
