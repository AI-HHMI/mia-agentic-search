notes: 'Record 14390418 (latest version 16362349) holds four data zips (species 22.6 GB, slice_culture
  11.1 GB, myocardial_infarction 9.0 GB, human 1.06 GB; size_bytes is their sum) plus mp4/html web visualisations.
  Only human.zip could be listed (NRRD imgs_norm + labels, test folder); the other zips could not be listed,
  so their layout is unverified. Paper Table 1: 20 infarction, 27 slice-culture, 24 multispecies, 2 human
  stacks. Voxel size varies by subset (200 nm isotropic infarction/human; 100x100x200 nm slice culture;
  166-227 nm xy, 180 nm z multispecies); 200 nm is the infarction/human value. Labels: semi-automatic
  segmentation proofread in SegmentPuzzler. NRRD is not a schema format, hence other. Per-file downloads
  only, so download_url is null.'
