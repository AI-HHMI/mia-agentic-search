  notes: 'Listing: Zenodo API, 8 files, 48,840,181,334 B exact (data zips + web-vis zips + readme). Only human.zip could be expanded (4 NRRD members); species, slice_culture and myocardial_infarction are
    7z archives named .zip (first bytes 7z signature), so their members cannot be listed or fetched as zip members. Headers read from the NRRD text headers of all 4 human members (no sample measured: NRRD
