notes: 'Zenodo 14390418 (latest 16362349): species.zip 22.6 GB, slice_culture.zip 11.1 GB, myocardial_infarction.zip 9.0 GB, human.zip 1.06 GB, readme.pdf, 3 web-vis zips (mp4/html). enricher: species/slice_culture/myocardial_infarction
  "zip" files are 7z archives (7z signature), only human.zip is a real zip. Paper Table 1: 20 infarction (rabbit, 200x200x200 nm), 27 slice-culture (rabbit, 100x100x200 nm), 24 multispecies (mouse, rat,
  rabbit, pig, horse, elephant; (166-227)^2 x 180 nm), 2 human (200x200x200 nm). enricher: voxel size set to null (was 200 iso): subsets differ (rule: one shared value only). organisms: Homo sapiens = human.zip;
  Oryctolagus cuniculus = myocardial_infarction.zip, slice_culture.zip; species.zip = the six multispecies animals. Labels: semi-automatic, proofread in SegmentPuzzler. NRRD is not a schema format, hence
  other.'
