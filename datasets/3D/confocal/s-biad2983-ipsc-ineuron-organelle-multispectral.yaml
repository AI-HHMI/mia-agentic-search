notes: 'File list: 395 acquisitions (43 iPSC, 97/94/82/79 iNeuron at day 7/14/21/28), each with raw CZI, unmixed CZI
  and deconvolved TIFF; 3,883 segmentation TIFFs (one per organelle or region per stack). Segmentations are automatic
  (infer-subc), with some cell masks manually refined in Napari per the study page. The paper is a preprint
  whose full text is not available through Europe PMC, so only the study page and abstract were read: voxel size is
  not stated there (only 63x/1.4 NA, 2.2x zoom, 1.2 um z slices) and total size is not given.
  Timelapse acquisitions are mentioned on the study page but the listing shows z-stack snapshots.'
