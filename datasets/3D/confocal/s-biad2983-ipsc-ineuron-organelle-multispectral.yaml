notes: 'File list: 395 acquisitions (43 iPSC, 97/94/82/79 iNeuron at day 7/14/21/28), each with raw CZI,
  unmixed CZI and deconvolved TIFF; 3,883 segmentation TIFFs (one per organelle or region per stack).
  Segmentations are automatic (infer-subc), with some cell masks manually refined in Napari per the study
  page. The paper is a preprint whose full text is not available through Europe PMC, so only the study
  page and abstract were read. Timelapse acquisitions are mentioned on the study page but the listing
  shows z-stack snapshots. enricher: voxel size 70.64x70.64x450.74 nm from CZI acquisition metadata (Z
  interval 0.4507 um) and OME header (was null); the study page says "1.2 um slices", likely optical section
  thickness, not the z step. Size from the BioStudies file list.'
