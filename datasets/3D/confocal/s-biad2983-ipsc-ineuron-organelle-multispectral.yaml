description: 3D multispectral confocal z-stacks (395 stacks) of live KOLF2.1J hiPSCs and iNeurons at day
  7, 14, 21 and 28, labelled for eight organelles (nucleus, ER, Golgi, mitochondria, peroxisomes, lysosomes,
  lipid droplets, plasma membrane). Raw CZI, linearly unmixed CZI and deconvolved TIFF stacks are provided
  together with 3D instance segmentations per organelle plus cell (iPSC) or soma/neurite (iNeuron) region
  masks.
