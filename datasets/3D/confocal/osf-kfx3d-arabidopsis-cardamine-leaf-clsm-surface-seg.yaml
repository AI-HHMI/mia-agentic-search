notes: 'OSF storage lists 5 TIFF stacks (Col0_03_T1, Col0_07_T1, Col0_07_T2, Ox_T1, Ox_T2) and 5 same-named .mgxm files (~1.19 GB total). The OSF project has no license and no description; the paper (eLife, open access) says all training and validation data were deposited on OSF and that leaf ground truth is a MorphoGraphX auto-segmentation with all errors fixed manually. Voxel sizes are stated only as a range for the leaf stacks (0.33x0.33x0.5 to 0.75x0.75x0.6 um), not per file, so voxel_size_nm is null. Which stacks are A. thaliana versus C. hirsuta, and the meaning of "Ox" and T1/T2, are not stated on OSF or in the paper text read. Only the 5 leaf stacks were checked here; the other PlantSeg OSF components (ovules, lateral root primordia, inflorescence meristem) are separate datasets. Segmentation is a surface segmentation of the cells in MorphoGraphX mesh format, which needs MorphoGraphX to read.'
