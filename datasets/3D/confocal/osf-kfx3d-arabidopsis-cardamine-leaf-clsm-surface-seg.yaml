notes: 'OSF storage lists 6 TIFF stacks (Col0_03_T1, Col0_03_T2, Col0_07_T1, Col0_07_T2, Ox_T1, Ox_T2) and 6 same-named .mgxm files (1.77 GB). No license on OSF node kfx3d or parent uzq3w (node_license null, wiki silent). Paper: leaf GT is a MorphoGraphX auto-segmentation with all errors fixed manually. Voxel sizes differ per stack (ImageJ headers, ZYX nm): Col0_* 600x758x758; Ox_T1 500x416x416; Ox_T2 500x334x334; so voxel_size_nm is null. Paper gives the range 0.33x0.33x0.5 to 0.75x0.75x0.6 um. Which stacks are A. thaliana vs C. hirsuta is not stated on OSF or in the paper. Labels are MorphoGraphX .mgxm (MGXM 2.0 binary) surface meshes, not label volumes. enricher: n_items 6 and size 1.77 GB from OSF API listing (harvest saw page 1 only).'
