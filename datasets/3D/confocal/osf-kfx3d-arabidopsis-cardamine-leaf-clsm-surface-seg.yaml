  notes: 'OSF has no folders; file list and exact sizes from the OSF v2 API (2 pages, 12 files, total 1,770,578,329 B); tools/listing.py does not read OSF so size_source is page-stated, not file-listing. All 6 TIFFs probed: uint16, LZW, ImageJ ZYX, shapes Col0_03_T1 225x707x637, Col0_03_T2 470x1022x753, Col0_07_T1 223x512x512, Col0_07_T2 275x834x616, Ox_T1 282x732x1310, Ox_T2 395x897x1850. Value range [0, 65520] from one sample (Col0_07_T1, 54 distinct values, 79% zeros); normalization unknown. Labels: .mgxm read only to its 64-byte header (MGXM 2.0); no reader among the allowed tools, so label dtype/encoding stay unknown. No single archive: each file has a direct OSF link (https://osf.io/download/<id>/ from the API); data.download_url stays null. Organism per file not stated anywhere checked; names suggest Col0 = A. thaliana Col-0 and Ox = C. hirsuta Oxford, unconfirmed.'
