notes: 'Both Zenodo pages are one-line descriptions with no paper, keywords or voxel size, and the record cites no publication (nothing found
  linked from either page), so tissue, stain, voxel size and annotation method are unknown. TIFF headers (probe): images are uint8 stacks of
  161x428x428 (01), 241x524x524 (02), 181x608x608 (03), 150x724x724 (04) (z,y,x); label 01.tif is uint16, 161x428x428, ImageJ min 2 max 89,
  so labels look like per-cell ids, but the encoding was not documented. size_bytes is images (241.3 MB) only; label files add 482.5 MB.
  Only 4 volumes, so it suits testing or small-scale training.'
