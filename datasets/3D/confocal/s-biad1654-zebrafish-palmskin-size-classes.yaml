notes: 'Six zips under AISEC.data/ (BioStudies file API, sizes summed): raw_data 28.9 GB (722 image folders: z-stack .tif plus .seg*.pkl/.png, .csv),
  dl_datasets 35.2 GB (491,693 files: test/train/valid crops by fish), ml_datasets 49 KB (ml_dataset.csv), models (3 zips, not data). Paper (PMC): 722 images
  from 361 larvae; size classes by k-means on bright-field trunk area (218 small, 74 medium, 69 large); fish-wise split 260/29/72 for DL; Leica SP8 25x/0.95,
  1024x1024 px, 2 um z sections over 48-84 um; max projections feed the DL models, so a 2D variant is also provided. Pixel size is not stated (465 um field
  over 1024 px suggests about 0.45 um but is not reported) so voxel_size is null. Cellpose Cyto3 was fine-tuned on 231 manually refined images and applied to
  the rest, hence source mixed. License CC0 from the BioStudies record.'
