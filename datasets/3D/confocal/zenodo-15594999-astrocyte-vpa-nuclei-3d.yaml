notes: 'Masks are automatic: Farsight 3D nuclear segmentation on deconvolved images, then hole filling, removal of edge-touching
  or merged objects and visual inspection (paper Methods); no manual annotation. Zeiss LSM 710, 63x 1.4 NA. Time points are
  separate samples (days 3, 5, 7), so treated as 3D. Voxel size differs between subsets, so voxel_size_nm stays null: vpa_day5
  .meta (Zeiss) ScalingX/Y 8.786e-8 m, Z 3.2465e-7 m = 87.9 x 87.9 x 324.7 nm; file names encode 88x88x325 for nha_day3, nha_day7,
  vpa_day3, vpa_day5, vpa_day7 and 80x80x325 for nha_day5. enricher: n_items 832 -> 216 mask volumes in the archives (the
  record''s 512 + 320 count nuclei); annotations verified.'
