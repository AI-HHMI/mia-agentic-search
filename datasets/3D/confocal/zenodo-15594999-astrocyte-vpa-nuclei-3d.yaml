notes: 'From the Zenodo record and the paper Methods (open access, Europe PMC). Twelve tar.gz archives (6 deconvolved
  image sets of 3 to 9 GB and 6 small mask sets; 37.6 GB in total); the archives cannot be listed remotely, so file
  names and counts inside them are unverified and annotations_verified is false. n_items is the mask count from
  the record (512 NHA + 320 VPA). Masks are automatic: Farsight 3D nuclear segmentation on deconvolved images, followed
  by hole filling, removal of edge-touching or merged objects and visual inspection; there is no manual annotation.
  Zeiss LSM 710, 63x 1.4 NA; voxel size not found in the Methods or the record, so it is null. Time points are separate
  samples (days 3, 5, 7), so treated as 3D.'
