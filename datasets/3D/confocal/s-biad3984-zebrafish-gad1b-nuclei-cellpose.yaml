notes: 'Read the BioStudies record (CC0, thesis abstract, Zeiss LSM 880 Airyscan, 40x), the FTP file index (27 files, about 242 GB; sizes rounded) and file_list_fish7.tsv. Only larva fish7 is
  deposited although the abstract analyses four larvae. The two segmentation masks (about 47-49 MB, uint16, deflate, 131x7086x1600) are described by the file list with a note to confirm they match the
  source crop; the file list also has CLAHE, denoised and downsampled variants that are not annotations. Masks come from a finetuned Cellpose model, so annotation source is automatic. No publication is
  listed on the record (a thesis), so no paper was read. The raw TIFF header (ImageJ) stores 1 um pixels, which looks like an uncalibrated default, so voxel size is left null. Channel count is from the
  record (GCaMP6s, DsRed, Alexa 647).'
