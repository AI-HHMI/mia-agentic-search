notes: 'Read the Kaggle dataset record (description, license MIT, 5.79 GB, updated 2025-06-22), the NIDDL README and the Nature
  Communications paper (Methods, Data availability). The Kaggle description names the HDF5 files and their keys, but I could
  not list the files (Kaggle needs a login), so formats and n_items (">5,000 images") come from the description, and 3D
  covers the whole-brain stacks while the nerve-cord and PVD sets are 2D. The paper says raw training data are "available
  upon request", whereas Kaggle now hosts them, so the paper''s own statement is outdated. Voxel size and objective are
  not given on the Kaggle page; the paper says the objectives per data type are in its Methods, but the text read did not
  state them. Noisy and clean images were acquired of the same sample at low and high laser power (for example 110 vs 1000
  settings), which gives restoration pairs. No train/test split is provided. Download is through Kaggle (login required).'
