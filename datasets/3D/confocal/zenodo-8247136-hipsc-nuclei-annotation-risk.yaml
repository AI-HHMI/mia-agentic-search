notes: 'Zenodo record holds only masks (masks/Napari-GT 20, Slicer-GT 20, bioGT 53) and trained models (~3.6 GB checkpoints);
  raw images are in the Allen Quilt package aics/hipsc_single_cell_image_dataset (s3://allencell, LMNB1 line, by FOVId; get_nuclei_data.py).
  Paper: 560 nuclei manually segmented in 20 images (Napari-GT, Slicer-GT: manual, DNA channel); bioGT by seeded watershed
  on lamin B1 (automatic); 18 held-out bioGT images for evaluation. enricher: voxel size 108.333x108.333x290 nm from the OME-XML
  of an Allen LMNB1 FOV (FOVId 1860, not one of the 53; PhysicalSizeX/Y 0.10833 um, Z 0.29 um, 924x624x70), the same grid
  as every mask (70x624x924); was null.'
