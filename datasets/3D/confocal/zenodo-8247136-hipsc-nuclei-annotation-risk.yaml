short_name: hiPSC 3D nuclei masks, manual vs bioGT (confocal)
description: 'Instance masks of hiPS cell nuclei in 3D confocal images (DNA dye and lamin B1 channels) from the public Allen
  Institute hiPSC single-cell image dataset: 20 images annotated manually in Napari and in 3D Slicer (560 nuclei, DNA channel
  only) and 53 images with ''bioGT'' masks derived from the lamin B1 channel by seeded watershed, plus trained EmbedSeg, StarDist-3D
  and Cellpose models.'
