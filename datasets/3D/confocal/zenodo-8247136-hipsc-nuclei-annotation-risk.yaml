notes: 'Zenodo record holds only masks (masks/Napari-GT 20, masks/Slicer-GT 20, masks/bioGT 53, listed with peek_archive)
  and trained models (about 3.6 GB of checkpoints, hence the zip size); the matching raw images are in the public Allen Institute
  Quilt package aics/hipsc_single_cell_image_dataset (registry s3://allencell, LMNB1 line, files named by FOVId), fetched
  by the authors'' get_nuclei_data.py (GitHub repo has no license file). Paper (ICCV 2023 workshop PDF read; no preprint found
  in Europe PMC): 560 nuclei manually segmented in 20 images (Napari-GT and Slicer-GT, DNA channel only); bioGT by seeded
  watershed on lamin B1; 18 held-out images with bioGT for evaluation. Voxel size and microscope are not stated in the Zenodo
  record, the paper''s methods or the download script, so voxel_size_nm is null.'
