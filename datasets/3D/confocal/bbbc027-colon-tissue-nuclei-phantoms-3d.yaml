notes: 'Fully synthetic: images come from a simulator and the ground truth is the phantom itself (source automatic). Voxel size is from the ICS headers (range request; x,y 0.123806 um, z 0.1238 um). 60 images and 60 label volumes = 3 parts x 2 SNR levels x 10 files; part 1 of each was listed with peek_archive, parts 2 and 3 only by HEAD (12 zips, 9.14 GB). Page calls the ground truth binary foreground masks; whether the 16-bit label ICS files hold instance ids was not checked. Paper (ICIAR 2011) is paywalled and not in Europe PMC: only the abstract on muni.cz was read; doi.org redirects to Springer. Format other = ICS.'
