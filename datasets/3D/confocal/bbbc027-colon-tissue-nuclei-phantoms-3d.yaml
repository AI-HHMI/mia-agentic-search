  notes: 'ICS 2.0 files (not readable by probe.py): headers read via zip range requests with a scratch script. Header scale
    x,y 0.123806 um, z 0.1238 um (images) / 0.123806 um (labels), units micrometers, software i3dlib. Label volume 0000 (low
    SNR) decoded fully: values {0,1}, 21% foreground, binary (not instance ids). Raw value ranges are from one partial sample
    per SNR level. Normalization unknown (simulated images). Data are offered as 12 zips (no single archive); download_url
    is the landing page, the zip URLs are in the layout and sample. Zip members are stored (no zip compression) and support
