title: BBBC027 - Synthetic 3D digital phantoms of colon tissue nuclei (high and low SNR)
short_name: Synthetic colon-tissue nuclei phantoms (3D)
description: 30 simulated 3D fluorescence stacks (1300x1030x129, 16-bit ICS) of clustered nuclei in a digital phantom of colon
  tissue, each provided in a high-SNR and a low-SNR rendering, with binary foreground/background ground-truth volumes for
  every image. Made with a virtual microscope imitating a Zeiss S100 63x/1.40 oil objective with an Atto CARV confocal unit.
