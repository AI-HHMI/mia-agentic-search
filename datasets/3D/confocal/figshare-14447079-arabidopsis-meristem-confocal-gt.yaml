notes: 'The 205 MB zip (28 TIFFs, 3.5 GB uncompressed) holds confocal_01-04_image.tif and gt_01-04_segmentation.tif in
  Orignal_and_Ground_truth/, plus one 3D segmentation per pipeline (Plantseg, Unet_Ws, MARS, Cellpose, MRCNN_WS) per
  stack; the pipeline outputs are automatic predictions, not ground truth. Voxel size, microscope and annotation
  procedure for these four stacks are not stated on the figshare page or in the paper text read; the TIFF headers
  could not be read from the deflated zip members. The paper describes the test stacks (from Refahi et al. 2021,
  Dev Cell) as having expert ground truth, but does not say which four stacks were deposited here. The paper''s
  full ten-stack test set is a separate figshare item (16602323), and its training stacks are described in the
  paper''s S3 File, which was not available.'
