notes: 'Six collections in 28 RAR archives (55.7 GB); one 2D TIFF per z slice, SWC per tree (enricher,
  RAR headers). Stack counts (training/qualifier/final) from the paper table via PMC: climbing fiber 3,
  olfactory 9, layer 1 axons 22, neuromuscular 472, CA3 interneuron 8, layer 6 neuron 53 (final round
  only), so 567 in total. Pixel sizes XY/Z (um) differ by collection: 0.04/0.33, 0.33/1.0, 0.29/1.0, 0.10/0.20,
  0.22/0.33, 0.10/0.30, hence voxel_size_nm is null. Modalities: brightfield (climbing fiber, CA3, layer
  6), confocal (olfactory, neuromuscular), in vivo two-photon (layer 1 axons). No license or terms of
  use found on the DIADEM site or in the paper (data "freely released", citation requested; HHMI copyright
  footer). organisms: Rattus norvegicus = Cerebellar Climbing Fibers, Hippocampal CA3 Interneuron; Drosophila
  melanogaster = Olfactory Projection Fibers; Mus musculus = Neocortical Layer 1 Axons, Neuromuscular
  Projection Fibers; Felis catus = Visual Cortical Layer 6 Neuron.'
