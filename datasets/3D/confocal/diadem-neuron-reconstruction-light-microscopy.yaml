title: 'DIADEM challenge data sets: light-microscopy image stacks of neurons with gold-standard digital reconstructions'
short_name: DIADEM neuron tracing (light microscopy)
description: 'Six data set collections from the 2009-2010 DIADEM challenge: image stacks (TIFF) of axonal and dendritic arbors
  (cerebellar climbing fibers, Drosophila olfactory projection neurons, neocortical layer 1 axons, neuromuscular projection
  fibers, hippocampal CA3 interneurons, visual cortical layer 6 neurons) from brightfield, confocal and two-photon microscopy,
  each with manual or semi-manual gold-standard reconstructions in SWC format.'
