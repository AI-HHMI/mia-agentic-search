description: Fixed Arabidopsis thaliana ovules at all developmental stages imaged by confocal laser scanning microscopy, with hand-curated 3D cell instance segmentation ground truth. 48 volumetric stacks split into train/validate/test folders of HDF5 files holding uint8 raw and uint16 label volumes. Used to train and evaluate PlantSeg.
