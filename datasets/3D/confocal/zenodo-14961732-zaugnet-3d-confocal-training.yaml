description: Training and test image patches and pretrained models for ZAugNet, a self-supervised z-slice interpolation network,
  covering four biological samples with different microscopy types - ascidian embryo membranes (confocal), colorectal cancer
  organoid nuclei (confocal), microtubule filaments in fibroblasts (Airyscan) and a time-lapse human embryo (transmitted light,
  11 focal planes).
