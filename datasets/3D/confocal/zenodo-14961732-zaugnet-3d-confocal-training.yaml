notes: 'No labels: training data for a self-supervised z-slice interpolation method; zip holds 353 TIFF stacks (train/test per sample) plus 8 .pt models (not data). Voxel sizes differ by sample (paper Methods): ascidians 1x1x1 um; filaments 63 nm xy, 100 nm z; nuclei 1 um z, xy not stated; human embryo not stated. Files are z-subsampled (''factor2'' in names), so voxel_size_nm is null. organisms: Phallusia mammillata = ascidians/, Mus musculus = filaments/, Homo sapiens = nuclei/ and humans/. modalities: confocal = ascidians/, nuclei/; super-resolution (Airyscan) = filaments/; brightfield (transmitted light) = humans/. enricher: channels 1 (grayscale uint8 ImageJ TIFFs, from headers).'
