  notes: 'Complete Zenodo listing: one zip, 2,252,586,153 bytes, 363 members. Filaments test, nuclei test and ascidians test members were read whole (about 36 MB compressed), nuclei train header probed; ImageJ hyperstack axes from the headers (ZYX or TZYX), uint8, uncompressed, no pixel calibration (1/1 resolution). Values from single files: filaments test [0, 7], mean 0.01 (very sparse); nuclei test [0, 255]; ascidians test [0, 255]. Human embryo and ascidians train headers were read from the first 1 MB of the inflated member (800x800 pages; 833x5 and 139x36 images). The 8 .pt files under results/ are PyTorch models, not image data; not opened. ''factor2'' in file names marks z subsampling: per the README, train/ holds the high-resolution stacks and test/ the low-resolution stacks to augment. Voxel size not set: differs by sample (see notes) and z is changed by subsampling; checked TIFF headers, Zenodo API, paper Methods, GitHub README.'
