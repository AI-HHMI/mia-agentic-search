notes: 'No labels: the data is released as training data for a self-supervised method that predicts missing z slices from
  neighbours. The zip holds 353 TIFF patches plus 8 .pt model files; test folders exist (e.g. filaments/test), so splits are
  provided per sample. Voxel sizes differ by sample and the Zenodo page gives none; the paper Methods state 1x1x1 um for the
  ascidian embryos and 63 nm lateral by 100 nm axial for the filaments, and none for the organoid nuclei or the human embryo,
  so voxel_size_nm is null. Organism list is read from the sample descriptions (the fibroblasts are described as mouse embryonic
  fibroblasts). Counts of patches per sample were not tallied.'
