notes: 'Synthetic (simulated) images from the group virtual microscope (modelled Zeiss S100, 63x/1.40 oil objective, Atto CARV confocal unit, Micromax CCD), not real microscopy; labels are generated with the images. The CBIA page states no license or terms beyond a citation request, and gives no voxel size. The low-noise zip (1.54 GB) holds 30 image-final and 30 image-labels TIFF volumes (peek_archive); the high-noise zip was not listed. Paper is not open access (abstract only). The page also offers ICS and HDF5 copies.'
