notes: 'Synthetic (simulated) images from the group virtual microscope (modelled Zeiss S100, 63x/1.40
  oil objective, Atto CARV confocal unit, Micromax CCD), not real microscopy; labels are generated with
  the images. The CBIA page states no license or terms beyond a citation request,. enricher: voxel size
  123.806x123.806x123.8 nm from the ICS headers (parameter scale, micrometers) of the same data (was null);
  the page says ICS, HDF5 and 3D-TIFF copies hold the same data. the high-SNR label sample has 15 non-zero
  ids (1-15) and the page says each image set holds up to 15 nuclei, so labels are per-nucleus instance
  ids. Size and n_items are for the 2 3D-TIFF zips (file listing). organism left empty: simulated phantoms;
  the page names the cell type but no species.'
