notes: 'Zip listed with peek_archive: 200 TIFFs = 100 pairs (92 training + 8 test), matching the paper Methods (25 stacks
  of 1024x1024x32 split into four 512x512x32 stacks). Task is image-to-image translation (label-free prediction); no schema
  task value fits, so ml.tasks is other and the pairs are recorded as restoration-pairs. The Zenodo page says the publication
  is unpublished, but the record is part of the ZeroCostDL4Mic paper, whose Methods were read. Part of the ZeroCostDL4Mic
  example-dataset series (each has its own Zenodo record).'
