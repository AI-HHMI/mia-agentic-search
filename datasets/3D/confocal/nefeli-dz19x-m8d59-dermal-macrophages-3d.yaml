title: A large-scale expert-annotated 3D image dataset of dermal tissue macrophages
short_name: Dermal macrophage 3D instance masks (confocal)
description: 31 five-channel confocal z-stacks of mouse ear dermis (20 steady-state, 11 five days after Staphylococcus
  aureus infection) stained for Collagen IV, F4/80, CD206 and DAPI, with 3D instance segmentation masks of 947
  individual macrophages that were generated automatically and corrected by experts.
