notes: 'Landing page (Nefeli RDM) was unreachable this run (503), so no file listing, sizes or direct download URL
  were seen; size_bytes and download_url are null. Facts are from the paper Data Records and Methods (PMC13683376) and
  DataCite (CC-BY-4.0, SPDX). Layout per paper: images/ and masks/, each with AdultMice (20 stacks) and AdultMice-Infected
  (11 stacks); 5-channel TIFFs (Collagen IV, F4/80, CD206, DAPI, brightfield), 22 slices of 1024x1024, pixel ~0.21 um,
  slice spacing ~1.51 um (Zeiss LSM 880, 40x). Masks: YOLO, Otsu, Cellpose and SAM2, corrected by experts in Napari.
  Coverage partial: only macrophages with visible nuclei. About 85 development volumes are not released. No splits. enricher: voxel size 210x210x1510 nm confirmed by the code repo config (pixel_size_xy 0.21, pixel_size_z 1.51 microns); paper says ~0.21/~1.51 um.'
