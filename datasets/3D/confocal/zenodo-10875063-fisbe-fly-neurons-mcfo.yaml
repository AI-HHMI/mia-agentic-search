description: FlyLight Instance Segmentation Benchmark. 101 three-colour (MCFO) confocal volumes of Drosophila
  melanogaster nervous systems with pixel-wise instance masks for about 590 manually segmented neurons
  (30 completely labeled images, 71 partly labeled). Stored as one zarr per sample (volumes/raw and volumes/gt_instances,
  CZYX), with a recommended train/validation/test split.
