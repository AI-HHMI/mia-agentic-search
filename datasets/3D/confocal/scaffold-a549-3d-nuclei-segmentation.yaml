notes: 'Zip (161.8 MB): train/ 20 unlabelled uint8 .npy volumes (64x512x512), test/
  one image plus int32 label .npy, fig/ PNG previews; .npy is not a schema format,
  hence other. Only 1 of 21 volumes is annotated (3 annotators, 9 annotations merged),
  so labels serve evaluation; the other 20 are for unsupervised training. Voxel size
  left null: the arXiv AD-GAN appendix gives 0.4151 um/voxel for the 1024x1024x128
  originals, but released volumes were cropped and resized to 512x512x64 with no per-axis
  size stated. License is the repository''s MIT LICENSE. Journal paper not open access;
  read the arXiv preprint, README and zip listing.'
