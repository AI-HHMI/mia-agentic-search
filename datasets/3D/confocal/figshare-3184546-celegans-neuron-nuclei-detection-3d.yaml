notes: 'Three zips: data.zip (Data1 = 12 worm stacks, 3-channel TIFF: DiR Ch1, mCherry Ch2, bright field
  Ch3, plus *_aligned.tif and *_edited*.mat ground truth; Data2 GT .mat; Data3 = one 2D time-lapse TIFF
  + .mat), data2.zip (one 18.6 GB TIFF, 3D time-lapse of JN2101, 591 frames, spinning disk) and software.zip.
  GT = nucleus centres (about 190 per Data1 stack) found by peak_detection_12 and corrected manually;
  Data2/Data3 tracks after frame 1 were not corrected (readme). License MIT (figshare record and data/readme_data.txt).
  Also on SSBD (not checked). enricher: voxel size set to null (was 240x240x252 nm, Data1 only): paper
  Methods give Data1 0.240x0.240x0.252 um, Data2 0.33x0.33x1.40 um, Data3 0.254x0.254 um; size_bytes now
  the complete figshare listing incl. software.zip (was 7,970,944,599).'
