title: Materials for "Accurate automatic detection of densely distributed cell nuclei in 3D space"
short_name: C. elegans head neuron nuclei detection (confocal)
description: Confocal 3D stacks of the head neuronal nuclei (mCherry) of 12 adult C. elegans (about 190
  densely packed nuclei each) with manually corrected nucleus centre positions as ground truth, plus a
  spinning-disk 3D time-lapse (591 frames) and a 2D calcium-imaging time-lapse with corrected nuclei,
  from the paper that introduced a Gaussian-mixture nucleus detector.
