notes: 'Record has three zips: data.zip (2.6 GB, listed: Data1 = 12 worm stacks as 3-channel TIFF (mCherry, DiR dye, bright
  field) plus aligned TIFFs and *_edited.mat ground truth; Data3 = one 2D time-lapse TIFF with its .mat), data2.zip (5.4 GB, one
  18.6 GB TIFF: the 3D time-lapse of strain JN2101, 591 frames, spinning disk) and software.zip (code, not counted in
  size_bytes). Voxel size 0.240 x 0.240 x 0.252 um is for Data1 (Leica SP5); Data2 is 0.33 x 0.33 x 1.40 um and Data3
  (2D) 0.254 um. Ground truth is nucleus centre positions (about 190 per Data1 stack) corrected by experimental specialists
  with the authors'' GUI after automatic detection; the Data2 ground-truth .mat is in data.zip. The record page itself returned
  403 to the fetch tool, so the facts come from the figshare API record, the zip listings and the paper. License: the figshare
  record and the readme state MIT. The same data is also listed on SSBD (ssbd.qbic.riken.jp/set/20160501), which was not
  checked.'
