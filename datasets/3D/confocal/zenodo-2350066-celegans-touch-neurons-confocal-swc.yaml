notes: 'Archive listing (peek_archive): ALM/images 258 + PLM/images 235 TIFF stacks (23.8 GB uncompressed;
  zip is 155.5 MB compressed), ALM/trees 258 + PLM/trees 225 SWC files. Voxel size from paper Methods:
  x,y 223 nm (1024x1024 px, 1.28x zoom), z step 300 nm; not stated on the Zenodo page. Traces were generated
  automatically with APP2; PLM trees carry manual annotations (non-zero node types) of PLM-PVM connections,
  so the skeleton source is mixed. PLM stacks were stitched and Gaussian-blurred per Zenodo description.
  File names follow STRAIN_SERIES_AGE_NEURON#. The Zenodo page header lists 41.5 GB total data volume
  but the file list holds only the 155.5 MB zip. Sources checked: Zenodo page/API, archive listing, paper
  full text (Europe PMC).'
