notes: 'Portal page and GraphQL API: 114 runs in datasets 10521 (58), 10522 (42), 10523 (14); 456 tomograms
  (4 per run: raw, filtered, 2 denoised) and 228 annotations (membrane mask + sample mesh per run). Run
  L10_ts_005 checked: tomograms 548x772x320 at 10.005 A, raw MRC 541.5 MB (HEAD request). Annotations
  are automatic (membrain-seg MemBrain_seg_v10_alpha; mesh from octopi), not manual. Sibling of already
  catalogued czcdp-10365 (same lab and sessions, different deposition and datasets; 10364 focuses on the
  nucleus, 10365 on nuclear pores). License: the portal page does not state one; CC0 is taken from the
  portal data-submission policy as for 10365. enricher: size_bytes from API file sizes (was null). Paper
  PNAS 10.1073/pnas.2426449122 (full text read via Europe PMC) is about chromatin condensates; it is the
  portal-listed publication, not a description of these tomograms, and gives no extra imaging parameters
  for them.'
