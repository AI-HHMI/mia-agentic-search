notes: 'Portal page and GraphQL API: 400 runs (300 general, 50 chromatin, 50 minimal bacterium), 1,600
  tomograms (four variants per run), 75,934 simulated annotations. Tomograms sampled at 6.8 A voxel spacing
  (600x600x92-122 voxels in the runs checked). Data are simulated, not microscope images; ground truth
  comes from the simulator. The deposition cites the CryoSiam preprint (bioRxiv 10.1101/2025.11.11.687379),
  which Europe PMC full text could not provide, so it was not read and is not listed as a publication.
  size_bytes not determined. License: portal policy says CC0.'
