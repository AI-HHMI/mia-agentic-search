notes: 'Portal page and GraphQL API: 400 runs in datasets 10490 (300 general), 10491 (50 chromatin), 10492 (50 minimal bacterium),
  1,600 tomograms (four variants per run: Tomograms/100 and 101 raw, 102 filtered, 103 denoised). The API now lists 39,347
  simulated annotations (75,934 at harvest) with 115,281 files. Tomograms at 6.8 A, 600x600x51-149 voxels. Data are simulated,
  not microscope images; ground truth comes from the simulator. The deposition cites the CryoSiam preprint (bioRxiv 10.1101/2025.11.11.687379),
  which Europe PMC full text could not provide, so it was not read and is not listed as a publication. License: portal policy
  says CC0. enricher: size_bytes from API file sizes (was null).'
