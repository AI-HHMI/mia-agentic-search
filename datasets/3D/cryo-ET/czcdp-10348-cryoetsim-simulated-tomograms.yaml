title: 'CryoETSim: simulated cryo-ET tomograms with voxel-level ground-truth masks (CZ portal 10348)'
short_name: Simulated cryo-ET tomograms with masks (CryoETSim)
description: 400 simulated cryo-electron tomograms (cryo-TomoSim) in three scenes (macromolecular crowding, chromatin, minimal
  bacterium), each with four reconstructed variants and paired semantic masks (coarse 5-class and fine scene-specific classes)
  plus per-particle instance masks for the general scene; made for self-supervised representation learning (CryoSiam).
