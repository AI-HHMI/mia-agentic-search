schema_version: '1.2'
id: czcdp-10007-yeast-lamella-cryoet-ribosome-picks
title: Saccharomyces cerevisiae cryo-FIB lamella tomograms with 80S ribosome picks
short_name: Yeast lamella 80S ribosome picks (cryo-ET)
description: Cryo-electron tomograms of S. cerevisiae cells on plasma-FIB-milled lamellae (270 run folders in dataset 10007),
  collected on a Krios G4 with Selectris X and Falcon 4 (EER frames). Each run holds tilt series, alignments and tomograms
  at 7.84 A voxel spacing, with 80S ribosome positions and orientations picked with crYOLO as oriented points. Used to evaluate
  cryoDRGN-ET reconstruction of the ribosome conformational landscape in cells.
