notes: 'Portal dataset 10007 (related entry EMPIAR-11658) has 270 run folders in the public S3 bucket; the GraphQL API
  reports 251 annotations for deposition 10007. One run was listed in full: EER frames, alignments, a 2.1 GB tomogram (mrc
  and OME-Zarr, VoxelSpacing7.840) and a cytosolic_ribosome annotation (crYOLO picking, automated, ground_truth_status
  false, 20 objects). Membrane masks in the same run folders come from a separate deposition (10301, TARDIS) and are not
  part of this record. Picks are automated, so the training signal is modest. Voxel spacing 7.84 A is from the run
  folder name; the paper gives a 1.96 A physical pixel size, so check per-run spacing. Total size not stated. Paper: bioRxiv
  preprint, full text read. License is the portal policy (CC0).'
