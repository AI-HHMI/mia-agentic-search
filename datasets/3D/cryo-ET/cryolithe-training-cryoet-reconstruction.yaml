notes: 'Targets are algorithmic reconstructions (cryo-CARE+IsoNet, Icecream), not manual labels; usable as restoration/reconstruction training pairs. Voxel size not stated on the dataset card, the file listing or the GitHub docs; the source EMPIAR entries list 1.96 A (11830 raw tilt series) and 3.52 A (11058 raw stacks), but the Hugging Face files appear to be downsampled so the pixel size was not assumed. Full arXiv text could not be fetched (PDF too large, HTML 404), so the paper Methods were not read. Number of tomograms and total size are not stated (listing is paginated; the first 1000 entries sum to about 534 GB). Dataset card has no explicit paper link.'
