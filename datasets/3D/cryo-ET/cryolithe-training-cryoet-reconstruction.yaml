title: CryoLithe training data - cryo-ET tilt series with reference reconstructions
short_name: CryoLithe cryo-ET tilt series and reconstructions
description: Training data for the CryoLithe cryo-ET reconstruction model, hosted on Hugging Face. Per tomogram folder, the dataset holds the tilt series (MRC, plus odd/even split versions), tilt angles (.tlt/.rawtlt), and reference reconstructions (Icecream, IsoNet/cryo-CARE, FBP) used as training targets. Subset of tomograms from EMPIAR-11830 (Chlamydomonas reinhardtii, cryo-plasmaFIB lamellae) and EMPIAR-11058 (Thermoanaerobacter kivui cells).
