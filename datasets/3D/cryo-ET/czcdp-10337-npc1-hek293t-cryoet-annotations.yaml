notes: 'Deposition 10337 contains one portal dataset, 10456, with 4 runs; each run has a filtered and
  a denoised WBP tomogram (1011x1011x394 voxels, 14.985 A, float32 MRC by file size), 8 tomogram files
  and 12.89 GB in total from the portal GraphQL API. Only run 25jul29a_Position_3 has annotations (5):
  membrane (membrain-seg), lysosome (SABER), mitochondrion (nnInteractive + smoothing) as segmentation
  masks, cytosolic ribosome (octopi + RELION) and microtubule (nnInteractive + spline fit, hybrid) as
  oriented points; all are marked groundTruthStatus false by the portal, so the labels are predictions,
  not manual ground truth. The dataset page lists no publication or EMPIAR/EMDB entry, and the portal
  page does not state a license; CC0 follows from the portal data-submission policy ("anyone will be able
  to access it subject to a CC0 license"). Voxel size converted from 14.985 A to nm. The tomography files
  were not opened.'
