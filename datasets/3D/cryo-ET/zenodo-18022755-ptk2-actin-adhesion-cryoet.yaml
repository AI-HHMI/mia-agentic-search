notes: 'Zenodo lists 40 files: 14 tomogram tarballs (one .mrc each), 14 actin segmentation tarballs (one .mrc each; checked 01 and tomogram 03 by tar header range read) and 12 .point pick files (none for tomograms 08, 13); no single archive, so download_url is null. Voxel size 10.1 A is from the paper Methods (cellular tomograms, 5.05 A binned 2x); tomograms are denoised (cryoCARE) and IsoNet-restored. Segmentations are from a neural-network semantic segmentation; sinusoidal regions were annotated manually in 3DMOD; the record does not say what the .point picks hold. Cells are PtK2 (ATCC CCL-56); no species is given on the pages read, so organism is empty.'
