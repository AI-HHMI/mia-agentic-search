id: empiar-10988-spombe-cryoet-ribosome-organelle-gt
title: S. pombe cryo-FIB lamella tomograms (defocus and Volta phase plate) with ground-truth organelle, membrane, cytosol, ribosome and FAS annotations
short_name: S. pombe organelles, ribosomes, FAS (cryo-ET)
description: >-
  Twenty cryo-ET tomograms of Schizosaccharomyces pombe cryo-FIB lamellae, ten acquired with a Volta phase plate
  and ten defocus-only, with per-tomogram label volumes: organelles, membranes, cytosol, and ribosomes and fatty
  acid synthase (FAS) as spherical masks. Released as the gold-standard training and benchmark data of the DeePiCt
  workflow, together with tilt series and raw movie frames.
