  notes: 'EMPIAR FTP times out here and listing.py over the HTTP index timed out too, so the data/{VPP,DEF}/{labels,tomograms}
    HTTP indexes were read directly (rounded sizes, frames/ and metadata/ not listed); size stays the
    page-stated 305.5 GB. Headers - TS_0005.rec MRC mode 0 (int8 by MRC2014) 960x928x500 (x,y,z), min/max
    -128/127; TS_0005_organelles.mrc float32 same shape, header min/max 0/10; TS_0005_cyto_ribosomes.mrc
    float32 header 0/1. Classes from organelle_labels.txt (VPP); semantic IDs per the README (\"voxel
    labels of individual organelles\"). Binary encoding of per-structure volumes inferred from header
    min/max 0/1 (cyto_ribosomes only). No sample: files are 0.4-3.3 GB MRCs and sample.py does not crop
    MRC. Tomogram z extent varies (sizes 425 MB - 1.7 GB).'
