notes: >-
  Two subsets of 10 tomograms each: VPP (49 label files) and defocus-only DEF (45 label files); 4x binned tomograms at
  13.48 A voxel size (original 3.37 A). Label volumes are 32-bit float MRC: organelles (one label per organelle),
  membranes, cytosol, and ribosomes and FAS as spheres. The paper Methods describe organelles and cytosol as manual
  Amira segmentations, membranes as partly manual with CNN-assisted correction, and ribosomes and FAS from an
  iterative workflow of template matching, DeePiCt predictions and manual picking, hence source: mixed. Not every
  tomogram has every label type (membranes annotated on 10 VPP and 5 defocus tomograms per the paper). Total entry
  size 305.5 GB includes 1,020 raw movie TIFFs and tilt series; tomograms plus labels are a small part of it. No
  split files provided; the paper uses 5-fold cross-validation on the VPP set. CC0 read from the EMPIAR entry page.
  Related RPE1 actin and microtubule entry is EMPIAR-10989.
