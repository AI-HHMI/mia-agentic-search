notes: 'Counts from the CryoET Data Portal GraphQL API: 5 datasets (10512-10516, 109 runs), 134 tomograms, 13 annotation classes
  (105 each for ER and plasma membrane, 102 microtubule, 56 mitochondrial outer membrane); the description says all 105
  tomograms carry a segmentation. Annotations are hybrid (MemBrain-seg and TARDIS-MT pre-segmentation, manual curation in
  Amira). Voxel spacing varies (21.6 A for 81 tomograms, 20.579 A for 20, 10.8 A for 33); 2.16 nm is the most common.
  Tomogram MRCs sum to 324.7 GB; annotation size is not stated, so size_bytes is null. Refined re-annotations of 15
  tomograms are a separate deposition (CZCDP-10366). The preprint is not open access (abstract only). License is the
  portal submission policy (CC0).'
