notes: 'Counts from the CryoET Data Portal GraphQL API: 5 datasets (10512-10516, 109 runs), 134 tomograms, 13 annotation classes
  (105 each for ER and plasma membrane, 102 microtubule, 56 mitochondrial outer membrane); the description says all 105 tomograms
  carry a segmentation. Annotations are hybrid (MemBrain-seg and TARDIS-MT pre-segmentation, manual curation in Amira). enricher:
  voxel size null (was 2.16 nm): annotated tomograms come at 21.6 A (10512, 10514-10516), 20.579 A (10513) and 10.8 A (10512,
  10515, 10516), per GraphQL and OME-Zarr scale. Tomogram MRCs sum to 324.7 GB; annotation size is not stated, so size_bytes
  is null. Refined re-annotations of 15 tomograms are a separate deposition (CZCDP-10366). The preprint is not open access
  (abstract only). License is the portal submission policy (CC0). enricher: source proofread (was mixed): every mask is MemBrain-seg/TARDIS-MT
  output curated in Amira (method_type hybrid).'
