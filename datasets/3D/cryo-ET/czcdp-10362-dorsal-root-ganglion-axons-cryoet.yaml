schema_version: '1.2'
id: czcdp-10362-dorsal-root-ganglion-axons-cryoet
title: Cryo-electron tomography of axons and varicosities in cultured primary mouse dorsal root ganglion neurons (baseline
  data and annotations)
short_name: Mouse DRG axon organelles (cryo-ET)
description: 105 cryo-electron tomograms of intact, unmilled axons and varicosities of cultured primary mouse dorsal root
  ganglion neurons, each with multi-class organelle segmentations (plasma membrane, microtubules, mitochondrial outer and
  inner membrane, endoplasmic reticulum, vesicles, endosomes, multivesicular bodies, lamellar bodies, phagophores). Membranes
  were pre-segmented with MemBrain-seg and microtubules with TARDIS-MT, then manually curated in Amira.
