notes: 'Deposition README: 12 tomograms (cent1-12), each with label volumes in the labels folder (3 to 5 per
  tomogram: ribosomes, microtubules, membranes, centrioles for all but 2 mitotic tomograms, matrix for 7 tomograms;
  the listing of 7 matrix files matches the README). Annotation procedure (manual vs. network-assisted) is not
  stated in the README or the abstract; the paper is not open access in Europe PMC, so Methods were not read
  (annotations.source left unknown). Voxel size is for the 4x binned tomograms (README: 13.48 A). Size 111.4 GB
  is the EMPIAR-stated total including raw frames. License CC0-1.0 as reported by the EMPIAR entry record.'
