schema_version: '1.2'
id: empiar-12049-celegans-centrosome-cryoet
title: Cryo-Electron Tomography Data and Comprehensive Annotation of C. elegans Centrosomes in Interphase and Mitosis
short_name: C. elegans centrosome annotations (cryo-ET)
description: Twelve cryo-FIB lamella cryo-electron tomograms (4x binned, 928x960, 1.348 nm voxels) of centrosomes
  in dissociated C. elegans embryonic cells across the cell cycle (interphase, prophase, metaphase, anaphase,
  telophase), with dense annotation volumes of ribosomes, microtubules, membranes, centrioles and the centrosomal
  matrix. Raw multi-frame tilt micrographs and tilt-series metadata are also included.
