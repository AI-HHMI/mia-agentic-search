notes: 'Synthetic data: tomograms are simulated (TEM Simulator + IMOD reconstruction), not experimental. Two archives,
  training.tar.gz (20.2 GB) and validation.tar.gz (3.4 GB), listed in the record; the validation archive head was
  listed with a range request (validation/round_1/tomo_08/ with coords/*.coords and subvolume .mrc files); the training
  archive was not listed. Per the paper, 11 protein sets x 8 tomograms of 512x512x200 voxels at 1.02 nm; tomograms
  1-7 for training and 8 for validation; 98,400 training and 24,600 validation subvolumes of 37^3 voxels (800/200
  per class, 123 classes). The 1.02 nm voxel size is the simulated tomogram pixel size stated in the paper Methods;
  subvolume voxel size in the archives not checked. Raw simulated tomograms are in a separate record (10.5281/zenodo.6637357).
  download_url left null: two tar.gz archives. enricher: n_items 123000 = 98,400 + 24,600 subvolumes per the paper
  (was null); coords files read (x y z per line).'
