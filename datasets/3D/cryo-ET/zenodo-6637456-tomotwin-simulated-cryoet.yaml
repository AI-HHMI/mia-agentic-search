id: zenodo-6637456-tomotwin-simulated-cryoet
title: Training and validation data for the TomoTwin cryo-ET particle picking model (simulated tomograms)
short_name: TomoTwin simulated cryo-ET particle subvolumes
description: Training and validation subvolumes (37x37x37 voxel .mrc files) cut from simulated cryo-electron
  tomograms of 120 proteins plus membranes, noise and fiducials, with per-tomogram particle coordinate
  files, used to train the generalized particle-picking model TomoTwin. Tomograms were simulated with TEM
  Simulator and reconstructed with IMOD.
