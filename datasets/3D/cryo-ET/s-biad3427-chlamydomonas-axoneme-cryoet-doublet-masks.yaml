notes: 'Five tomograms (about 2.1 GB each, float32 multi-page TIFF, 1024 x 1024 pages per a header probe
  of tilt1) and five mask TIFFs (about 5.5 MB each). Masks were made with the nnInteractive napari plugin
  and manually checked or corrected (annotation method on the BioStudies record); the record also mentions
  RELION STAR files but only the two TIFF folders are in the file listing. Pixel size is not stated on
  the BioStudies record, and the record lists no publication, so no paper could be read; voxel_size_nm
  is null. enricher: TIFF axes zyx (512 pages of 1024x1024 per tomogram and mask; the pages of a reconstructed
  tomogram are its z slices, per the study "Filtered tomograms"; the files do not name the axis).'
