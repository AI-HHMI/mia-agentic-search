  notes: 'Listing: tools/listing.py on the BioStudies Files folder: 14 files, ~10.77 GB (HTTP index, rounded;
    the study JSON file lists give exact sizes: 5 x 2,149,686,280 B tomograms, masks 5,046,624-6,294,256
    B). probe.py: tomogram tilt1 plain TIFF float32 1024x1024 pages, uncompressed, page axis not stated;
    mask tilt1 tifffile-shaped 512x1024x1024 uint32 deflate. sample.py on mask tilt1 (5.5 MB): IDs 0-24
    (23 non-zero, 14 absent), 97% zero (one sample). No tomogram sampled (2.1 GB each, over budget). Voxel
