schema_version: '1.2'
id: dataverse-k4jkcw-etsam-cryoet-membranes
title: ETSAM Dataset - Annotations and Simulated Tomograms
short_name: Cryo-ET cell membrane segmentation (ETSAM)
description: Cell-membrane annotations (binary target masks) for cryo-ET tomograms, with PolNet-simulated tomograms and
  a few experimental tomograms, used to train and test the ETSAM membrane-segmentation model. Per the paper, training
  uses 83 experimental tomograms from 25 CryoET Data Portal datasets plus 28 simulated tomograms; the test set has 10
  experimental tomograms whose ground truth was cleaned and corrected manually slice by slice (the deposit page also
  mentions 10 simulated and 17 experimental test tomograms). Most experimental tomograms are not in the deposit and must
  be fetched from the CryoET Data Portal.
