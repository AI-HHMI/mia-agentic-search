notes: 'Dataverse v5 lists 165 files (127.3 GB): <CDP dataset>/<run>/target_mask (experimental masks), emdb/ and empiar_11718/ (mask + tomogram),
  polnet_data_1/ (10 simulated, 1 GB each) and polnet_data_2/ (18 simulated, 250 MB each). Most experimental runs have a mask only; their tomograms come from
  the CryoET Data Portal. Per the paper, experimental masks come from the CDP (often AI-made) and were manually cleaned; test ground truth is hybrid AI plus
  manual correction (source=mixed). Paper and deposit page disagree on test composition (10 experimental vs 10 simulated + 17 experimental). No split file
  is listed. Voxel size is not stated on the page or in the paper and varies per run; organisms are mixed and not listed per file.'
