notes: 'Portal GraphQL API: deposition 10006 (deposited 2023-10-11, released 2023-12-10), one dataset (10006), 156 raw WBP
  tomograms at 6.128 A (66.1 GB MRC), 156 spike annotations flagged ground truth, method "Template matching + 3D classification
  filtering" (TOM/AV3 + RELION), shape type OrientedPoint, 4,104 objects in total. The portal marks them hybrid, so source
  is mixed; the picks are not manually placed. Related entry: EMPIAR-10493. The Nature paper is not open access in Europe
  PMC: only the abstract was read, so sample preparation and virion counts are not checked. enricher: spike picks are *_orientedpoint.ndjson
  (S3); masks in Annotations/101-104 come from portal depositions 10301/10303/10331 (automated), not this record.'
