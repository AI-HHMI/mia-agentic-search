notes: 'Zenodo record lists 8 MRC files (65-162 MB, about 842 MB in total). Header probe of empiar_11830_0909_gt.mrc: 141x803x803 zyx, int8, values 0-1, voxel 0.784 nm (matches the 7.84 A in the TomoSegNet preprint). Paper (bioRxiv, abstract plus full-text page): ground truth = MemBrain-Seg initial segmentation manually refined by an expert; membrane class only. The deposit has no raw images; raw tomograms are EMPIAR-11830 (catalogued separately as empiar-11830-chlamydomonas-cryoet-visual-proteomics), so this record is a label set for those tomograms. Label encoding of other MRC files not probed. Only 8 tomograms; confidence capped accordingly.'
