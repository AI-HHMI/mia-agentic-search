notes: 'Test deposition CZCDP-10347 (843 tomograms, 327 annotations, portal datasets 10485-10489, all
  Vibrio cholerae, released 2026-04-29). Training annotations: CZCDP-10332. No license on the portal pages
  or dataset/annotation metadata read (a 2026 benchmark paper, arXiv 2606.10255, says CC-BY-4.0 for the
  data, unverified), so license left unknown. Kaggle page could not be read. enricher: voxel size 1.3328
  nm isotropic from the deposition page (all 843 tomograms at voxelSpacing 13.328 A) and the OME-Zarr/MRC
  headers (was null). enricher: annotations.source proofread from annotation metadata ("initial prediction
  by ML model + verified and corrected by hand", method_type hybrid; was mixed). enricher: annotations.coverage:
