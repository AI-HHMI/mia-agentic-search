notes: 'Borderline method-supplement deposit: 5 tilt-series are described (2 experimental, 3 simulated with noisy and ground-truth versions); the rest is code, atomic structures, exit waves and trained U-Nets. Checked the Zenodo page, README.txt, the listing of 4_Traning_set_generation_via_TEMsimulation.zip and the first 100,000 characters of the AIP article (no open full text elsewhere). Pixel/voxel size is not stated there (maybe in the supplement): null. Data are MATLAB .mat files (not inspected), hence other. The 13.9 GB and 27.3 GB zips were not listed, so annotations_verified is false; training pairs are generated by shipped MATLAB scripts from exit waves. Experimental tilt-series have no ground truth. Data CC BY-NC-SA 4.0, code GPL-3.0 or later.'
