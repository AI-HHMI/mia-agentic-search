title: Supervised Cryo-EM Tomography Denoising Enabled by Physics-Based Image Simulation
short_name: POPC liposome cryo-ET denoising pairs (simulated)
description: Data and code for supervised cryo-ET denoising of POPC liposomes. Includes multislice-simulated tilt-series with paired noisy and noise-free ground-truth images (low-noise pair, high-noise pair, deformed liposome), the exit-wave data used to generate a training set, trained U-Net denoisers, and two experimental tilt-series of liposome pairs recorded at 340 and 30 e/A^2 total dose.
