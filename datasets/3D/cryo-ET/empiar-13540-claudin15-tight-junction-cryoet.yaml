notes: 'EMPIAR lists 13 CLDN15 and 4 quinKO tomograms; the HTTP index (rounded, 894 GB, 747 files) shows per tomogram P<n>_rec.mrc, one P<n>_seg.mod for 16 of them (12 of 13 CLDN15, 4 of 4 qKO) and a raw_data folder with TIFF frames, MRC tilt stacks and mdoc files. MRC header probes: voxel 0.3356 nm (CLDN15 tomogram 1) and 0.168 nm (CLDN15 tomograms 5 and 13, qKO 1), int8 or int16, so voxel_size_nm is null as it differs between tomograms. The paper is not open access (Europe PMC gave the abstract only), so the cell line and species, the annotation procedure and who traced the models are not known; organism is left empty and source unknown. Models outline tight junction regions and membranes (EMPIAR descriptions), not individual pore features. EMPIAR page shows a CC0 badge.'
