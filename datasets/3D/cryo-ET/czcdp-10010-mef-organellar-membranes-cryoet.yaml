notes: 'API: 88 annotations in 32 runs (mitochondrial outer membrane 32, inner membrane 32, ER membrane
  24), methodType ''hybrid'' (TomoSegMemTV + manual correction in Amira). Voxel spacings 12.4-28.4 A,
  so voxel_size_nm is null. Portal description says tomograms of mouse embryonic fibroblasts from FIB-SEM
  lamella. API counts, organisms, voxel spacings; S3 metadata JSON: method, software, authors. No publication
  or DOI is listed for the deposition on the portal, so publications is empty and no paper was read. License:
  the portal''s data submission policy states that published data is available under CC0. Download is
  via the portal/S3 per run. enricher: size from the API file sizes (MRC tomograms + MRC masks); voxel
  size stays null (13.4 A x49 annotations, 12.44 x23, 14.36 x11, 14.2 x3, 28.4 x2). enricher: annotations.source
  proofread (TomoSegMemTV + manual correction in Amira, API hybrid; was mixed). coverage: ER membrane
  masked in 24 of 32 runs, mitochondrial membranes in all 32.'
