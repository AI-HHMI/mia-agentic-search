notes: 'Synthetic (simulated) data, not real microscope images: the ground truth is exact by construction
  (source: automatic). Files: tomo_rec_0..5.mrc (float32, 250x1000x1000 zyx voxels, about 1 GB each) and
  for each index N two int8 masks, N_gt_visible_membrane_mask.mrc and N_gt_mw_membrane_mask.mrc (250 MB
  each); 18 files, 9.0 GB. Voxel size 1 nm (isotropic) is read from the MRC header cell dimensions of
  tomo_rec_0 and the mask 0 (headers range-requested with tools/probe.py); the header value is not otherwise
  documented on the Zenodo page. No related paper or README is listed on the record; a BPS2026 conference
  abstract on PolNet-based synthetic training data exists but could not be confirmed as the source of
  this dataset, so no publication is cited. Train/test split not provided. The same group released a TomoSegNet
  membrane GT set (zenodo-23737482) that is a different dataset. enricher: size from the Zenodo file listing;
  download_url is the record (18 separate files, no archive).'
