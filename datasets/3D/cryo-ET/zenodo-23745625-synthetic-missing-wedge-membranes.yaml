title: A synthetic dataset for the quantitative analysis of the missing-wedge membranes
short_name: Synthetic cryo-ET membranes (missing wedge)
description: Six synthetic cryo-electron tomograms generated with PolNet v1.1.2 (tilting scheme +/-60
  degrees), each paired with ground-truth membrane masks split into visible and missing-wedge membranes.
  Intended for quantifying how the missing wedge affects membrane segmentation.
