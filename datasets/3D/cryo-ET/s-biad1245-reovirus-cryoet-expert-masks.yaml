title: Expert segmentation masks of virus-like particles and organelles in a reovirus-infected cell cryo-electron
  tomogram
short_name: Reovirus cryo-ET expert instance masks
description: 'Manual expert segmentation masks (painted in Napari and SuRVoS2) for the cryo-electron tomogram
  of orthoreovirus-infected cells deposited as S-BIAD1243: gold-standard masks for the main ROI (z 16-144,
  y 450-1900, x 450-1900) and a smaller ROI, masks for double-layered and single-layered particles, mitochondria,
  lipid vesicles in a movie crop, background masks, and a CSV of particle locations and classes derived
  from the gold mask. Raw tomogram volumes are in S-BIAD1243.'
