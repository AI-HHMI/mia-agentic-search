notes: 'Different from catalogued S-BIAD1243 (raw tomogram + crowdsourced points): this study holds only
  the manual expert masks (10 files, 22.6 MB: 9 TIFF + 1 CSV) for the same tomogram; the raw volumes needed
  to train are in S-BIAD1243 (Original_Tomogram.tif and ROI crops whose names match the mask ROI coordinates).
  License is not stated on the S-BIAD1245 study (S-BIAD1243 states CC0), so spdx is unknown. Voxel size
  not stated in either study record or file lists; the method paper (Pennington et al., no DOI given)
  was not found by tools/paper.py. Sample and organism taken from the S-BIAD1243 study record (MA104,
  Chlorocebus sabaeus, Krios 300 keV, K2 Summit). S-BIAD1244 holds model predictions and is not catalogued.
  Coverage is sparse: masks cover cropped ROIs of a single tomogram. Download URL not set; files live
  under the study FTP Files/ directory.'
