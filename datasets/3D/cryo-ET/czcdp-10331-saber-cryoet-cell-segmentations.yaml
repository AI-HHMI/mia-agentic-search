notes: 'Portal GraphQL (2026-10-17): 4,259 annotations in 1,559 runs of 15 datasets; 4,173 automated (SABER), 86 hybrid (nnInteractive/SABER,
  ground truth) on inclusion body and cell masks of 10062/10064/10077. Objects: intracellular anatomical structure, inclusion
  body, virus-like particle, polar tube, nuclear envelope, lysosome (all 70 lysosome masks are 0 B). Voxel spacing differs
  by dataset (5.006-16.8 A), so voxel size stays null (see technical.notes). organisms: Legionella pneumophila = 10062-10064,
  10076-10079, 10082-10085; Encephalitozoon intestinalis = 10437; Mycoplasma mycoides subsp. capri str. GM12 (JCVI-Syn3A)
  = 10442, 10452; SARS-CoV-2 = 10006; Homo sapiens = 10444. Authors redacted pending peer review; no publication. License:
  portal policy says CC0. enricher: organism, n_items, size_bytes from API (were empty).'
