short_name: Cryo-ET cell segmentations (SABER)
description: Semantic and instance segmentations of whole cells, lysosomes and bacterial cell components in cryo-ET tomograms,
  produced with SABER (a SAM2-based expert-in-the-loop framework) with some nnInteractive refinement; each mask has a centre
  point marking object instances.
