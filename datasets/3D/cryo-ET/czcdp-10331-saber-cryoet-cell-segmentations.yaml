notes: 'Portal page and GraphQL API: 4,916 annotations over about 1,178 runs (API sample capped at 3,000
  annotations); mostly automated (SABER), 82 hybrid (semi-manual nnInteractive). Objects include intracellular
  anatomical structure, inclusion body, virus-like particle, polar tube, lysosome, nuclear envelope. Voxel
  spacing differs between runs (5.006 and 13.72 A seen), so voxel size is left null; organisms are not
  listed per run here (one run is E. intestinalis). The deposition lists 0 tomograms itself; they sit
  in the source datasets. The portal notes authors were redacted pending peer review. No publication listed.
  License: portal policy says CC0.'
