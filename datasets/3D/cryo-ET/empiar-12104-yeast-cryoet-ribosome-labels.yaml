schema_version: '1.2'
id: empiar-12104-yeast-cryoet-ribosome-labels
title: Cryo-electron tomograms of S. cerevisiae cryo-FIB lamellae with ribosome annotation volumes and
  particle lists
short_name: Yeast lamella ribosome labels (cryo-ET)
description: 14 AreTomo-reconstructed cryo-electron tomograms (13.7 A voxels) of cryo-FIB-milled Saccharomyces
  cerevisiae BY4741 lamellae, 4 from control cells in glucose-rich medium and 10 from acute glucose starvation,
  each with a 3D ribosome annotation volume and cleaned ribosome particle coordinates (.box). Raw frames,
  tilt-series stacks and alignment metadata are deposited too.
