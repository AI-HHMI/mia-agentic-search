notes: 'README: 14 tomograms (control TS_006/007/008/017; starvation TS_001-4, 007, 008, 010, 014, 017,
  018), used to determine polysome assembly states; "cleaned particle lists and 3D annotation volumes
  for ribosomes" in labels folders (Control/labels: 4 .box + 4 .mrc; Acute_glucose_starvation/labels:
  10 + 10). Tomograms (AreTomo, 4x binned) 500 x 1440 x 1022 float32, 13.7 A voxels (README, EMPIAR, headers);
  label volumes uint16 same shape, values 0-1 (binary ribosome mask). The Mol Cell paper is not open access
  (abstract only), so how ribosomes were picked and cleaned is not confirmed: annotation source unknown.
  License CC0 on the EMPIAR page. enricher: size_bytes from EMPIAR dataset_size 165.4 GB (GiB; HTTP index
  177.4 GB decimal) (was null).'
