notes: 'README: 14 tomograms (control TS_006/007/008/017; starvation TS_001-4, 007, 008, 010, 014, 017, 018), used to determine polysome
  assembly states; "cleaned particle lists and 3D annotation volumes for ribosomes" in labels folders (Control/labels: 4 .box + 4 .mrc;
  Acute_glucose_starvation/labels: 10 + 10). Probed: tomogram TS_006_aretomo.mrc float32 500 x 1440 x 1022 with 1.37 nm voxels (matches EMPIAR 13.7 A);
  label TS_006.mrc uint16 same shape, values 0-1 (binary ribosome mask). The Mol Cell paper is not open access (abstract only was read;
  no Methods), so how ribosomes were picked and cleaned is not confirmed, hence annotation source unknown and class encoding
  assumed binary from one probed file. Fully manual vs template-matched picking not stated. Tomogram files are named *_aretomo.mrc in tomograms/.
  License shown as CC0 on the EMPIAR page. Size stated by listing: ~177 GB (raw frames dominate).'
