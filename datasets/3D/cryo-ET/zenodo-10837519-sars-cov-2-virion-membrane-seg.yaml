notes: 'Very small: a single tomogram with one automatically generated membrane mesh. Voxel size 1.2256 nm read from the MRC header with tools/probe.py (not stated on the Zenodo page). Paper (Ke et al., Nature 2020) is not open access, so only the abstract was read; Methods and Data availability not read. The mesh is a surface (.obj), not a voxel mask. Zenodo page names EMPIAR-10493 and the Cryo-ET Data Portal as the raw data source.'
