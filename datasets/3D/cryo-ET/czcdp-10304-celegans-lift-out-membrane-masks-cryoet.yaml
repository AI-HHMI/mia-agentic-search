notes: 'API: 99 annotations in 99 runs, object ''membrane'', all at VoxelSpacing7.560 A (0.756 nm), methodType ''hybrid''
  (denoising + MemBrain-seg + manual post-processing; extent of manual correction not stated). The tomograms belong to portal
