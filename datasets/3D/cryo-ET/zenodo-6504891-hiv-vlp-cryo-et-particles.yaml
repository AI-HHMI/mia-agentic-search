notes: Voxel size 10 A (1 nm) comes from the file name (10.00Apx) and the MRC header, whose cell dimensions give 1.0 nm; the
  page does not state it. Only one tomogram, a derived (reconstructed) volume of EMPIAR-10164, not the raw tilt series. No
  paper is cited on the Zenodo page and a Europe PMC title search found none, so how the poses were obtained is unknown. A
  second Zenodo record (12743310) re-deposits the particle picks with pixel size added. Particle count not checked.
