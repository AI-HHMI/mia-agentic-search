title: 3D reconstruction of HIV virus-like particles from cryo-electron tomography data
short_name: HIV VLP tomogram with particle poses (cryo-ET)
description: A single 540x540x404 cryo-electron tomogram of HIV virus-like particles (reconstructed at 10 A/voxel from
  EMPIAR-10164) together with the associated particle poses (coordinates and Euler angles) in a RELION STAR file. Deposited
  by Alister Burt on Zenodo. The page gives no paper; the tomogram is derived from EMPIAR-10164.
