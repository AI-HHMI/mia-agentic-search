description: One cryo-electron tomogram from the edge of a DIV4 cultured primary hippocampal neuron with hand-segmented
  binary masks for 9 classes (actin, cofilactin, microtubule, membrane, ribosome, TriC, carbon, fiducials, background),
  provided as MRC files and a Dragonfly ORS object. Released as training data for multi-slice U-Net segmentation.
