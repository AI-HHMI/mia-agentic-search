notes: 'Only one tomogram (Titan Krios G3i, TFS Tomography 5.0, IMOD reconstruction, pixel size 13.6 A/pix, hand-segmented
  in Dragonfly 2022.1 per README), so small in image count but a ~340 MB volume with 9 dense manual class masks.
  Zip listing via peek_archive: 10 .mrc + 1 .ORSObject. Paper full text is not open access (only abstract read);
  organism (presumably rat/mouse neurons) not stated in dataset page, README or abstract.  Zenodo record carries
  a Dryad DOI. enricher: size_bytes = exact record total 1,073,707,483 (README + zip; the record has only these
  2 files, not 38.7 GB); voxel size 1.3603 nm confirmed by the MRC headers.'
