notes: 'HF repo (~2 MB) holds Croissant metadata and split CSVs; tomograms and labels are on the CryoET Data Portal S3 bucket
  (Yeast portal datasets 10000/10001; Bacterial 13 datasets, deposition CZCDP-10350; Phantom 10440/10445/10446; MotorBench
  ~90 datasets, CZCDP-10332/10347). Paper/card total 2993 tomograms. Paper CC BY 4.0, data CC0 1.0 (card). enricher: voxel
  size left null: Croissant voxel_spacings.csv differ by sub-benchmark (Yeast 13.48 A, Bacterial 20.0 A, Phantom 4.99 and
  10.012 A, MotorBench 5.12-19.733 A per run). organisms: S. pombe = yeast/; V. cholerae = MotorBench test (CZCDP-10347);
  Bacterial = 8 genera (Bdellovibrio, Coxiella, Hylemonella, Hyphomonas, Legionella, Pseudomonas, Salmonella, Vibrio), MotorBench
  train multi-genus, Phantom = purified-protein lysate; not all listed in organism. Annotation source: Bacterial new by authors,
  Yeast curated from de Teresa-Trueba 2023, Phantom manual picks (Peck 2025), MotorBench Kaggle community picks.'
