notes: 'The Hugging Face repo (about 2 MB) holds only Croissant metadata and split
  CSVs; tomograms stream from the CryoET Data Portal via copick (Portal IDs: Yeast
  DS-10000, DS-10001, CZCDP-10351; Bacterial CZCDP-10350; Phantom DS-10440, DS-10445,
  DS-10446; MotorBench CZCDP-10332 and CZCDP-10347). n_items=2993 is the paper total
  of tomograms. Voxel size 10 A is stated by the dataset card only for the Phantom
  sub-benchmark; other sub-benchmarks vary and were not stated on the card or in the
  paper text read, so voxel_size_nm is left null (Phantom is 10 A = 1 nm; the enricher
  should check the rest). Total byte size not stated. Paper listed as CC BY 4.0, data
  as CC0 1.0. The paper is under NeurIPS 2026 review per the dataset card. No peek
  possible: no archive; data not fetched.'
