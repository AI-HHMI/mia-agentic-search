    mask int8 same grid; bacterial, phantom, MotorBench MRCs float32. Sample (one, level-2 OME-Zarr crop 125x232x240): tomogram
    float32 -44.7..28.8, mean 1.37, std 2.6; mask {0,1}, 0.7% foreground, identical shape. Voxel size varies by sub-benchmark
