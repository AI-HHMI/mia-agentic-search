title: 'POPSICLE: benchmark datasets for segmentation and localization in cryo-ET'
short_name: POPSICLE cryo-ET segmentation/picking benchmarks
description: 'Benchmark suite of four cryo-ET sub-benchmarks built on CryoET Data Portal tomograms: Yeast (S. pombe organelle
  segmentation), Bacterial (compartment, membrane and flagellum segmentation, 8 genera), Phantom (point picks of six protein
  classes in lysate) and MotorBench (flagellar motor localization). The Hugging Face repository holds the Croissant metadata
  and split indices; tomograms and annotations are streamed from the CryoET Data Portal.'
