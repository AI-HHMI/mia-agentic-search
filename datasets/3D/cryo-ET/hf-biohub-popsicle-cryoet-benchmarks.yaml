        nucleus; bacterial: cytosole, flagellum, inclusion, intermembrane-space, membrane; phantom: membrane)'
    alignment: same-grid
    alignment_notes: 'One binary mask per object per run, same shape and voxel spacing as the tomogram at that VoxelSpacing
      (probed yeast and bacterial pairs; paper: masks of identical shape). Pairing: same <dataset>/<run>/VoxelSpacing<A>;
      the segmentations.csv url column names the exact annotation ids (portal runs carry extra annotations not used by POPSICLE).'
