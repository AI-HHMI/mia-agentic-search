notes: 'Zenodo v1 (2025-03-26): one 14.3 GB zip; peek_archive lists 490 .nii.gz plus dataset_description.txt: 236 image/label
  pairs in imagesTr/labelsTr and 9 in imagesVal/labelsVal (spinach 91, chlamy 52, rory 20, polnet 20, cts 20, deepict 15, atty 8,
  virly 7, hdcr 3 in train). The authors call the validation set a dummy split and advise custom cross-validation. Voxel size 10 A
  is the common rescaled size on the Zenodo page. Paper: labels came from iterative prediction plus manual correction over five
  rounds (EMPIAR-12612, EMPIAR-11830, collaborator, synthetic, EMPIAR-10988), hence proofread; the authors note the GT came from
  predictions. Organisms listed are only the two named in the paper; other sources are not itemised. Sources checked: Zenodo
  page and API, zip listing and description, paper full text (bioRxiv).'
