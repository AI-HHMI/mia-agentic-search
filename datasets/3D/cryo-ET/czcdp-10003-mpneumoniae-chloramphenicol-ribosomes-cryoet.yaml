notes: 'Portal dataset 10003 (related entries EMPIAR-10731 and EMPIAR-10499) has 65 run folders (TS_01 ...), matching the 65
  Cm-treated tomograms in the paper. TS_01 was listed in full: motion frames (TIFF), gain, a 1.55 GB tomogram (mrc and
  OME-Zarr, VoxelSpacing6.802), ribosome annotation 100 (ground_truth_status true, hybrid: pyTOM template matching, manual
  filtering and RELION 3D classification, 353 particles in that tomogram), membrane annotation 101 (TARDIS, automated,
  deposition 10301) and a membrain-seg prediction (102, deposition 10303, automated). Membrane masks are therefore automated
  and only the ribosome picks are curated. Total size is not stated. The paper (Xue et al. 2022, full text read) analyses
  65 Cm-treated tomograms and processed them in Warp and M; the Warp/M paper (10.1038/s41592-020-01054-7) was not read.
  License is the portal policy (CC0).'
