title: Microtubule doublet from mouse sperm
short_name: Mouse sperm axoneme doublet picks (cryo-ET)
description: 39 cryo-electron tomograms (5.224 A/voxel) of FIB-milled lamellae of EHNA-treated mouse sperm flagella, with point
  annotations of microtubule doublets at the 48 nm repeat (6,761 picks) and 96 nm repeat (3,845 picks), obtained by template
  matching, manual filtering and 3D classification filtering. Used for subtomogram averaging of the doublet.
