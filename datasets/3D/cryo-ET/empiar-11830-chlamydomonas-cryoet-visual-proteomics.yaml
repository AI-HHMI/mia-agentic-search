notes: 'EMPIAR-11830 itself lists no annotations; annotations are described in the ChlamyAnnotations GitHub README (particle annotations, 25-feature segmentation from CryoET Data Portal deposition 10314, manual annotation spreadsheet on Zenodo) and were not opened as files, so annotations_verified is false and the number of annotated tomograms is not stated. Image sets: 1829 EER tilt series (4096x4096), 1829 cryoCARE-denoised tomograms and 1829 IMOD CTF-corrected tomograms (both MRC, 1024x1024 in-plane). Pixel spacing is given as 1.96 (tilt series) and 7.84 (tomograms) without units on the PDBj page, so voxel_size_nm is null. EER tilt series are listed here, not in data.formats. Total size 32.12 TB (tilt series 26.8 TB, denoised 3.6 TB, CTF-corrected 1.8 TB per the repo README). Microscope not stated on the pages read. Paper full text not available open access (Europe PMC lists no full text, bioRxiv returned 429), so only the abstract was read. Same data is on CryoET Data Portal dataset 10302.'
