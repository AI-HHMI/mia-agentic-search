short_name: Chlamydomonas in situ cryo-ET tomograms
description: 1,829 in situ cryo-ET tilt series of Chlamydomonas reinhardtii cryo-plasmaFIB lamellae with
  cryoCARE-denoised and CTF-corrected bin4 tomograms (MRC). Community resource for method development;
  macromolecule particle annotations (ribosome, Rubisco, nucleosome, microtubule, clathrin, photosystem
  II, ATP synthase and others) and a 25-class feature segmentation are published separately in the ChlamyAnnotations
  repository.
