notes: 'Image sets (EMPIAR API): 1829 EER tilt series (4096x4096, pixel 1.96 A), 1829 cryoCARE-denoised
  tomograms (cryocare_bin4, MRC float32) and 1829 IMOD 3D-CTF-corrected tomograms (ctf3d_bin4, MRC int16),
  1024x1024 in-plane at 7.84 A. enricher: voxel size 0.784 nm isotropic from the tomogram MRC header (cryocare_bin4/1.mrc)
  and EMPIAR pixel_width 7.84 A (was null). Annotations: the CryoET Data Portal copy (dataset 10302, tomograms
  deposition 10300, same release date) carries per-tomogram segmentation masks from depositions 10314
  (Ais CNNs) and 10303 (MemBrain-seg); all checked are method_type automated, ground_truth_status false,
  so annotations.source is automatic. The ChlamyAnnotations GitHub and Chlamy_Tomo_Annotations.xlsx were
  not opened. EER tilt series are listed here, not in data.formats. Total size 32.1 TB (EMPIAR).'
