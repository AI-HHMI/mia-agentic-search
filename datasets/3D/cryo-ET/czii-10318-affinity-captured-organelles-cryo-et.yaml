notes: 'Deposition 10318: 12 portal datasets (10444-10467), 13,694 runs, 27,388 tomograms (one denoised
  + one filtered WBP reconstruction per run), 25,210 annotations. No paper or preprint found. Segmentations
  are automatic predictions (groundTruthStatus false): 12,604 membrane masks (membrain-seg 0.0.1) and
  12,606 intracellular membrane-bounded organelle masks (SABER 0.9.0). enricher: voxel size 0.5006 nm
  isotropic from portal API voxelSpacing 5.006 A and MRC/OME-Zarr headers (was 0.154 nm, the 1.54 A frame
  pixel size from the announcement). enricher: license CC0-1.0 from the portal data submission policy
  (was unknown). enricher: formats mrc / ome-zarr / precomputed from the S3 listing (was other); portal
  page returns 200, url_ok true.'
