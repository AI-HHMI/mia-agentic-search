title: Large-scale cryo-ET dataset of affinity-captured organelles (LAMP1/TMEM192) from HEK293T cells
  under multiple physiological states
short_name: Affinity-captured lysosome organelles (cryo-ET)
description: 'CryoET Data Portal deposition 10318: ~13,700 tilt series (27,388 tomograms) of lysosomes,
  late endosomes and microsomes affinity-captured from HEK293T lysates on anti-GFP nanobody grids (GFP-LAMP1
  or GFP-TMEM192), across untreated, bafilomycin A1, amino-acid starved and re-fed states. Includes raw
  frames, alignments, tomograms and 25,210 semantic segmentations of organelles generated with SABER and
  Membrain-Seg.'
