notes: 'Five acquisitions (data/211206, 220330, 220504, 220506, 220720), each with TIFF movies, MRC tilt series and 4x-binned float32 MRC tomograms. Voxel sizes differ: tomograms 13.7 A = 1.37 nm in 211206/220330/220506/220720 (16 tomograms); 13.4804 A = 1.348 nm in 220504 (1 tomogram), per EMPIAR API and README, so voxel_size_nm is null. Annotations: 123 GEM2 particle coordinates in 5 STAR files; paper Methods: DeePiCt CNN detections curated (60 kept) plus 63 added manually after visual inspection, refined by subtomogram averaging (source mixed). No segmentations. Size 174.2 GB as stated by EMPIAR. enricher: license CC0-1.0 from EMPIAR FAQ (was unknown); voxel size set null (was 1.37, not shared by all tomograms); annotations verified.'
