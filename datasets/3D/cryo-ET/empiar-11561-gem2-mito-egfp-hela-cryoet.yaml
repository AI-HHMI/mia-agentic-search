notes: 'Five acquisitions, each with micrographs (TIFF movies, 8-10 frames), tilt series and tomograms (32-bit float MRC, binned 4x): pixel size 3.425 A (tomograms 13.7 A = 1.37 nm; dataset 3 is 3.370 A / 13.48 A = 1.348 nm). Total size 174.2 GB per EMPIAR. Annotations: STAR files of GEM2 particle coordinates per the EMPIAR entry; the paper says coordinates came from DeePiCt detection followed by subtomogram-averaging refinement (so a mix of automatic and manual curation); the STAR files themselves were not opened and no segmentations are listed. EMPIAR API record shows no explicit license (not stated in the content read). The paper (Nature Methods 2023, CC-BY) Data availability points to EMPIAR-11561 and EMD-18194. Only about 17 tomograms, so it is a small training set.'
