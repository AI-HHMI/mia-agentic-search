  notes: 'Listing: the EBI HTTP indexes of data/ and each tomograms/ folder were read (tools/listing.py timed out on the full tree via FTP and got a 403 deeper in alignment/), so the listing is not complete and the size is EMPIAR''s stated 174.2 GB. Tomograms: 17 x ~2.7-2.9 GB. Probed TS_016 header (MRC, float32, zyx 500x1440x1022, 1.37 nm, uncompressed, 64 kB extended header). The 211206.star was read in full (814 B). No sample download: a tomogram (2.9 GB) is over the 500 MB budget. No single archive: files are direct HTTPS on ftp.ebi.ac.uk (per-file).'
