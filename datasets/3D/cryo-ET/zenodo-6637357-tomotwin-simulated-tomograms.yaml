description: Simulated cryo-ET tomograms (TEM-Simulator + IMOD reconstruction) used to train TomoTwin for particle picking. Eleven training sets (tomo_simulation_round_1-11) plus one generalization set; each tomogram folder holds a reconstructed tilt series (tiltseries_rec.mrc) and .coord files with ground-truth coordinates of the individual simulated proteins.
