notes: 'Synthetic data: tilt series simulated with TEM-Simulator and reconstructed with IMOD, so it is
  not experimental microscopy; kept because it is the released training data of a published cryo-ET particle
  picker. Files are .tar.gz; the enricher streamed the start of one archive (see technical) but did not
  reach the coordinate files, so annotations_verified stays false. The paper Methods state 8 tomograms
  of 512x512x200 voxels per protein set at 1.02 nm pixel size (11 sets), so about 88 training tomograms
  plus the generalization tomogram; n_items left null as the Zenodo archives were not unpacked. Size is
  the sum of the 12 Zenodo files. Related deposit 6637456 holds the extracted training/validation subvolumes.
  enricher: listing confirms size; MRC header of one tomogram read (512x512x200 float32, 10.204 A/px).'
