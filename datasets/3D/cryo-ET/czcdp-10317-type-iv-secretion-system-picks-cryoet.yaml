notes: 'API: 31 annotations in 31 runs (24 in dataset 10064, 5 in 10080, 1 each in 10075 and 10081), voxel spacings 15.6 A
  (24) and 16.8 A (7). All manual, ground-truth flagged. Portal GraphQL API (annotations filtered by depositionId) gives the
  counts, organisms and voxel spacings; the per-annotation S3 metadata JSON gives method, software, shape type and authors.
  No publication or DOI is listed for the deposition on the portal, so publications is empty and no paper was read. License:
  the portal''s data submission policy states that published data is available under CC0. Tomogram voxel sizes differ between
  datasets (stated in the portal as VoxelSpacing in angstrom), so voxel_size_nm is null; download is via the portal/S3 per
  run. Files were not opened.'
