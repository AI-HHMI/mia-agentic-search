  notes: 'Listing (Zenodo API): 80 files, 1886350142 bytes, complete. Probed TS_3_2, TS_24, TS_8 .mrc (int8, zyx, 160/280/198 x 720 x 512, header voxel 26.8 Å isotropic) and IGtomo08_px5434 / IGtomo11_px4335 .tif. Sampled TS_3_2_rec.mrc (58983424 bytes; value range from this one sample) and TS_3_2_rec.xyz (93 rows x 3 columns, read as text; dtype is the text values, not a stored type). No single archive: download_url is the landing page; each file is direct at https://zenodo.org/records/22960491/files/<name>?download=1. Voxel size conflict: Zenodo 1.3 nm vs MRC header 2.68 nm vs preprint acquisition pixel 3.4 Å (binning not stated); z not stated anywhere except the header.'
