notes: 'Zenodo file list: 16 .mrc tomograms (1.27 GB, 1.3 nm pixel size per record description), 16 .xyz IMOD gold particle coordinate files, 48 .tif 2D micrographs (619 MB; pixel size in file name, 4335 = 4.3 Å, 5434 = 5.4 Å). Paper is not open access (only the abstract was read), so organism, sample preparation, annotation procedure (picking by hand or automatic) and the exact publication date are not confirmed; the Zenodo record gives only the year 2026. Voxel size: the record description gives 1.3 nm pixel size for the tomograms; z spacing is not stated, so z is null. Annotations are gold particle point positions (immunogold labels), not segmentation. The paper is the source for how the data were used (3D/2D cluster analysis).'
