notes: 'Zenodo: 16 .mrc tomograms with 16 .xyz IMOD gold coordinate files (TS_12_rec.mrc pairs with "TS_12_rec (copy 1).xyz"), plus 48 unlabelled 2D cryo-EM micrographs (.tif, pixel size in file name, 4335 = 4.3 Å, 5434 = 5.4 Å). enricher: organism Rattus norvegicus and annotation source automatic from the bioRxiv preprint Methods ("Primary rat hippocampus neurons"; "Gold-labelling was picked by using IMOD findbeads3d") (were empty/unknown). Coverage: only immunogold particles are marked, no other structures. Voxel size: Zenodo gives 1.3 nm for the tomograms; the MRC headers say 2.68 nm isotropic and the preprint gives a 3.4 Å acquisition pixel without binning. Kept the Zenodo value; z not stated, so null. The 2D .tif micrographs are 2D data inside a 3D record.'
