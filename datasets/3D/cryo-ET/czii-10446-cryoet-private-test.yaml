notes: 'Private test split of the phantom deposition CZCDP-10310 (paper: 7 training, 121 public test,
  364 private test tomograms); sibling of DS-10445 (public test, separate PR/record) and DS-10440 (training).
  The portal page lists 1,456 tomograms across 364 runs (several reconstructions per run) and 24,958 annotations.
  CC0 stated in the paper Fig. 2 legend for datasets 10440/10441/10445/10446. Voxel size not set: the
  page shows a 4.99 A spacing for the example run (TS_100_4) but the sibling record 10445 has 1.0012 nm
  from its OME-Zarr scale, so left null for the enricher. Format OME-Zarr inferred from paper Methods
  and portal viewer (zarr://), not from a file listing; size not stated. Organism empty: lysate plus purified
  proteins from several species. Sources: portal page (first 100k chars of a very long page) and paper
  full text.'
