notes: 'Private test split of the phantom deposition CZCDP-10310 (paper: 7 training, 121 public test, 364 private
  test tomograms); sibling of DS-10445 (public test, separate PR/record) and DS-10440 (training). The portal page
  lists 1,456 tomograms across 364 runs (several reconstructions per run) and 24,958 annotations. CC0 stated in
  the paper Fig. 2 legend for datasets 10440/10441/10445/10446. enricher: organism Homo sapiens: the paper Methods
  say the cell lysate came from a HEK293T cell line; the spiked-in purified proteins come from other sources. enricher:
  voxel size 0.499 nm from the OME-Zarr scale (4.99 A), the grid of all annotations; 10.012 A versions of each tomogram
  also exist. enricher: formats ome-zarr and mrc confirmed in the S3 listing.'
