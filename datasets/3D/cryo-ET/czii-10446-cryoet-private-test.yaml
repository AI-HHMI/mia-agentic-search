title: CryoET Object Identification Challenge - Private Test Dataset (DS-10446)
short_name: CryoET phantom private test set (cryo-ET)
description: 'Private test split of the experimental cryo-ET phantom (cell lysate spiked with six protein species)
  from the CZII CryoET Object Identification Challenge: 364 runs with tilt series, alignments, tomograms (denoised,
  CTF-corrected variants) and hand-curated ground-truth annotations for apo-ferritin, beta-amylase, beta-galactosidase,
  cytosolic ribosomes, thyroglobulin and virus-like particles, plus membrane segmentations. Private leaderboard
  scores on Kaggle were computed from it. Krios G4, Falcon 4i, Selectris X.'
