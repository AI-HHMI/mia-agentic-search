notes: 'FTP data/EMPIAR/: DA (62 folders), GLU (43), DHS (25), DA-PSD (2); each holds NAME.mrc (DHS: NAME_normalized_smoothed_2.mrc),
  NAME.mod and often NAME.png. enricher: voxel size set to null (was 1.559): EMPIAR states 15.59 A for
  the whole image set, but the paper Methods give two datasets, Talos Arctica (3.987 A, binned by 4, 1.595
  nm) and Glacios 2 (3.117 A, binned by 4, 1.247 nm), and which files come from which is not stated; MRC
  headers say 1 A (unset) for DA/GLU samples and 1.5588 nm for DA-PSD/0056_4. enricher: size 142.6 GB
  from the HTTP index (EMPIAR 133.0 GB = GiB). Models: per-object names (plasma membrane, SV.NNN vesicles,
  AZ, POST, side structures) drawn in 3dmod; only tomograms selected for analysis were segmented. Paper
  is open access (CC BY).'
