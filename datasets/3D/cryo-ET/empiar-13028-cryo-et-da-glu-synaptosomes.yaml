notes: 'FTP data/EMPIAR/ holds DA (62 folders), GLU (43), DHS (25) and DA-PSD (2); each folder such as DA/0056_0 has NAME.mrc (256 MB),
  NAME.mod and NAME.png (directory listing). EMPIAR reports 400 items and a 15.59 A pixel (1.559 nm) for the binned tomograms;
  n_items=132 is the number of folders counted, so the 400 may count files. The paper says plasma membranes, vesicles and organelles
  were manually segmented in 3dmod (membranes meshed, vesicles and organelles interpolated into closed objects) but the models
  of only the tomograms analysed may be included. Original tilt-series pixel sizes were 3.987 A (Talos Arctica) and 3.117 A (Glacios 2).
  Paper is open access (CC BY).'
