notes: 'EMPIAR API entry and entry page read; the file tree was not listed (FTP/Globus listing not read), so the segmentation file format and folder contents come from the entry description only (annotations_verified false). Size 35.7 GB is the page-stated figure (rounded; EMPIAR reports GB). Frame pixel size 1.66 A in super-resolution mode; the tomogram voxel size is not stated on the entry page or in the paper text read, so voxel_size_nm is null. Paper Methods: nuclear envelope segmented automatically by tensor voting then refined manually in Amira, filaments traced in Amira (Cylinder Correlation); the deposited segmentation is described as the concave nuclear region, and it is not stated whether it is exactly that Amira output. Entry holds one tomogram (one imageset of 57 multiframe micrographs). Cross-reference EMD-35979. License CC0 per the EMPIAR entry page.'
