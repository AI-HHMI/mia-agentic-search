schema_version: '1.2'
id: czcdp-10318-lysosome-organelles-cryoet
title: Large-scale cryo-ET dataset of affinity-captured organelles
short_name: Affinity-captured lysosome organelles (cryo-ET)
description: 13,694 tilt series (27,388 tomograms) of lysosomes, late endosomes and microsomes affinity-captured
  from HEK293T cell lysates (anti-GFP nanobody grids against GFP-LAMP1 or GFP-TMEM192) under four physiological
  conditions, with 25,210 automated semantic segmentations of organelles and membranes (SABER and Membrain-Seg).
