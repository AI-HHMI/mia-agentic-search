notes: 'Found via the CZII 3dem announcement (Jan 2026). No publication or DOI submitted (checked all three). Annotations
  are automated (SABER, Membrain-Seg), not manually verified. Voxel size 5.006 A is from dataset 10466 VoxelSpacing
  paths; the announcement gives 1.54 A as the raw pixel size, and other datasets in the deposition may use other
  spacings (page was truncated, only dataset 10466 was visible). Total size not stated. Tomogram count 27,388 includes
  the deposition-wide figure; dataset 10466 alone has 5,056 tomograms and 4,778 annotations. enricher: license CC0-1.0
  from the portal data submission policy (public data "subject to a CC0 license"; was unknown); formats mrc + ome-zarr
  (each tomogram and mask in both).'
