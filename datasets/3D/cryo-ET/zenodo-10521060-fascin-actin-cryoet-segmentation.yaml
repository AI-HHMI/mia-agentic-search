notes: 'The Zenodo page does not name the paper; the link to the fascin paper (Gong, Reynolds et al. 2025)
  is inferred from the depositor (the paper''s co-first author), the actin/fascin content and the paper
  Methods, which describe the denoising and semantic segmentation networks, tomogram binning by 3 to 7.8
  A and 27 tilt series. The paper''s own data statement cites a different Zenodo record (10.5281/zenodo.10456803,
  networks and synthetic data), not this one. Segmentation maps are neural-network predictions (trained
  on synthetic data), not manual labels, and are binarized at 0.95. Number of tomograms in the archives
  is unknown (tar.gz files not listed); voxel size 0.78 nm is the 7.8 A bin3 pixel size from the paper
  Methods. Size is the sum of the four Zenodo files.'
