notes: 'Segmentation folder has only 3 files (2 .cxs, 1 .em, 2.8 GB); the paper says PreSM/PoSM were semi-automatically segmented and synapse structures annotated in IMOD, but the deposited segmentations are ChimeraX sessions and coordinates, not per-tomogram label volumes, so coverage is partial and files are not directly ML-ready. Voxel size 1.12 nm is the EMPIAR record value for the ultrafresh 4x-binned tomograms (11.2 A); the paper states 2.89 A unbinned pixel and the tilt series record 2.984 A, so the value is uncertain; in-tissue tomogram pixel size not stated in the EMPIAR record. Total size ~474 GB by HTTP index (EMPIAR states 442.9 GB). Sources checked: EMPIAR page/API, file listing, paper Methods and Data availability.'
