schema_version: '1.2'
id: empiar-12795-psd95-synapse-cryoet
title: cryoCLEM-guided cryoET of adult brain Psd95-containing synapses ('ultra fresh' preparation and brain tissue cryo-section
  tomograms)
short_name: Mouse brain Psd95 synapse tomograms (cryo-ET)
description: 143 cryo-ET tilt series and 4x-binned tomograms of Psd95-GFP-labelled glutamatergic synapses from adult mouse
  forebrain, 93 from an 'ultra fresh' synaptoneurosome preparation and 50 from in-tissue vitreous cryo-sections, located by
  cryoCLEM. Segmentation files are deposited as ChimeraX sessions and an EM motive list of pre- and postsynaptic membrane
  (PreSM / PoSM) segmentation coordinates.
