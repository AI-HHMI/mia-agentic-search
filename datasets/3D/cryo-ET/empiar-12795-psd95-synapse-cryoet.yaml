notes: 'Labels are not per-tomogram label volumes: data/segmentations holds 2 ChimeraX sessions (1.3 GB each) and one EM motive
  list (22 MB, 292,789 points x 20 fields), so coverage is partial and files need conversion before ML use. Paper: PreSM/PoSM
  semi-automatically segmented, structures annotated in IMOD by curators. enricher: voxel size 1.194 nm from paper Methods
  ("binned to a voxel size of 11.94 A (binned 4x)"; ultra-fresh MRC header 11.936 A agrees; in-tissue header 12.0 A; EMPIAR
  states 11.2 A, which conflicts) (was 1.12). size_bytes = EMPIAR dataset_size "442.9 GB" (the HTTP index sums ~473.9 GB,
  so EMPIAR likely means GiB). download_url set to the https EMPIAR tree (was null).'
