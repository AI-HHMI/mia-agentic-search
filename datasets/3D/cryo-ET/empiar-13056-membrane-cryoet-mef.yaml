notes: 'enricher: FTP listing has 24 MEF label volumes (Mito_ER + otherOrg for 12 bin8 tomograms, 13.3 A/px) and
  11 yeast label volumes; other tomograms are unlabeled. Voxel size given is the segmentation tomogram (bin8); raw
  data 0.1663 nm/px (bin6 thickness tomograms 0.998 nm). Segmentation labels (OMM, IMM, ER, vesicles) and method
  (Membrain-Seg + Amira curation) from the bioRxiv preprint; Europe PMC was unavailable (503) so paper read via
  bioRxiv full text; the preprint had placeholder accessions. organisms: Mus musculus = data/morphometrics_thickness/
  and data/atpsynthase_structure/ (mtGFP MEFs, readme.txt); Saccharomyces cerevisiae = data/yeast/. Coverage: voxel
  labels exist only for the 12 bin8 MEF tomograms (Voxel_segmentations/, 2 files each) and 11 yeast tomograms; atpsynthase_structure
  has none.'
