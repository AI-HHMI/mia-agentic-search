title: Surface morphometrics reveals local membrane thickness variation in organellar subcompartments
short_name: Organelle membrane segmentation (cryo-ET, MEF)
description: 'Cryo-ET of cryo-FIB lamellae from mouse embryonic fibroblasts (mitochondrially localized GFP) and
  CHX-treated S. cerevisiae: raw frames, tilt series, reconstructed tomograms (bin4/6/8), ATP synthase particle
  coordinates, and a voxel segmentation of organelle membranes (outer/inner mitochondrial membrane, ER, vesicles)
  produced with Membrain-Seg and manually curated in Amira.'
