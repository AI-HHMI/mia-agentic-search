notes: 'Zip (14.3 GB) holds 490 .nii.gz files plus dataset_description.txt: 236 training and 9 validation patch
  pairs (imagesTr/labelsTr, imagesVal/labelsVal). The description says the validation set is a dummy and recommends
  custom cross-validation, so no real split is provided. Patches were rescaled to a common 10 Angstrom voxel (1
  nm) per the record description. Organism and annotation procedure (manual vs automatic per source) not stated
  on the record or dataset_description.txt; the full paper text (Nature Methods, not open access; bioRxiv 10.1101/2024.01.05.574336
  returned HTTP 429) could not be read, only the abstract. Record contents were checked: Zenodo API record, zip
  listing and dataset_description.txt. enricher: sampled one val pair: 225^3 float64 NIfTI image (mean ~0) and float64
  label with values in 0..2.'
