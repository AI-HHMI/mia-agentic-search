  notes: 'Zenodo listing complete and exact (14,261,003,563 B, 491 members). Sample (val spinach_tomo38_patch030_split0):
    image float64 225^3, -5.67..6.74, mean -0.018, std 0.75 (close to zero-mean, not exactly standardized; not documented);
