title: Cryo electron tomography of Rhinovirus 2-infected cos-7 cells
short_name: Rhinovirus 2-infected COS-7 tomogram (cryo-ET)
description: One cryo-ET tomogram (tomo7, 41-tilt dose-symmetric tilt series, 5.532 A pixel) of a COS-7 cell vitrified 60 minutes after rhinovirus 2 infection, with a segmentation in which membranes and microfilaments were segmented manually and virions, empty particles and ribosomes were located by template matching.
