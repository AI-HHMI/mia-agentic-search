notes: 'EMPIAR API entry and the open-access paper (Methods) read; the file tree was not listed, so annotation file names
  come from the entry description (annotations_verified false). Voxel size 1.66 nm is the full tomogram (tomo7_full_rec.mrc,
  16.60 A); the segmentation uses the cropped tomogram at 22.13 A. The entry holds one tomogram (EMD-15710 and EMD-15711 cross-references);
  the paper reports more than 250 tomograms in total, but only this one is deposited here. Organism Chlorocebus sabaeus is
  inferred from the COS-7 cell line; the paper text read calls them fibroblast-like cos-7 cells. License CC0-1.0 as reported
  by the EMPIAR search listing for this entry (the entry API record has no license field). enricher: voxel size 1.66 -> 2.2128
  nm: the deposited tomogram is only the crop (MRC header and entry: 22.13 A); the full 16.6 A tomogram is not in the file
  tree.'
