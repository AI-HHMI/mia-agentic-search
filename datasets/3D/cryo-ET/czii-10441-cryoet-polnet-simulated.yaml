    0 crop [200,157,315] float32 -16.28..17.67 (mean -0.006, std 3.02); cytosolic_ribosome mask zarr level 0 crop
    [200,315,630] {0: 19686771, 1: 158229}. Value ranges from one sample each. cytosolic_ribosome-1.0.json: annotation_method
    "polnet-simulated ground truth", method_type simulated, object_count 148; its ndjson has 147 lines. Masks: one
    array per class so each converts as its own label class. No single archive: data.download_url stays the portal
    page; direct files are the S3 objects in the listing (https://cryoet-data-portal-public.s3.amazonaws.com/10441/...).
    The .zarr copies and the tilt series are not listed as arrays. Voxel 1.0 nm from the MRC header (10 A) and tomogram_metadata.json
    voxel_spacing 10.0, agrees with the record.'
