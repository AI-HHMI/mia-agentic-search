title: CZII CryoET Object Identification Challenge - PolNet-simulated training tomograms (DS-10441)
short_name: PolNet simulated protein tomograms (cryo-ET)
description: 27 simulated cryo-ET tilt series and tomograms generated with PolNet, with ground truth point labels and
  semantic masks for six protein complexes (apo-ferritin, beta-amylase, beta-galactosidase, cytosolic ribosome, thyroglobulin,
  virus-like particle) and membranes. Released as the simulated training set of the CZII CryoET Object Identification
  Challenge, alongside the experimental phantom set (DS-10440).
