notes: 'Portal page and GraphQL API: 27 runs, 27 raw tomograms (all 630x630x200 voxels at 10.0 A spacing, WBP), 189
  annotations (7 objects per run); annotation files by format: 189 zarr, 189 mrc, 162 ndjson, so points exist for
  six classes and masks for all classes plus membrane. Annotation method string on the API is "polnet-simulated
  ground truth". Paper (bioRxiv 10.1101/2024.11.04.621686) Data availability: simulated data are PolNet simulations
  on the portal as dataset 10441; the paper describes the experimental phantom (10440) in detail and not the simulation
  parameters. Organism is not applicable (simulated; portal says not_reported). Tilt series and alignments are
  available per the portal page; frames and CTF are not. License from the portal data submission policy (CC0). Total
  size not stated on the pages read, so size_bytes is null. Complements the catalogued experimental set czii-10440
  (real phantom lysate data); this record is the simulated counterpart.'
