notes: 'Voxel size 20 A (resampled) from the portal page. Organism list not given as scientific names on the portal (13 source datasets, Coxiella burnetii named), so left empty. Class counts, microscope parameters and tomogram file formats (OME-Zarr/MRC are portal conventions per the copick paper) not confirmed from a file listing. CC0 stated in the POPSICLE paper. 68/12 train/test split from the paper. Sources checked: deposition page, POPSICLE arXiv paper, copick paper (PMC); annotation files not seen in a listing, so annotations_verified is false. Distinct from czii-10440 (particle picking phantom).'
