schema_version: '1.2'
id: czcdp-10350-popsicle-bacterial-cryoet
title: 'The POPSICLE Bacterial Segmentation Dataset: multi-class compartment segmentations for bacterial
  cryo-ET data'
short_name: Bacterial cell compartment segmentation (cryo-ET)
description: 80 bacterial cryo-ET tomograms resampled to 20 A with semantic segmentations of five compartments
  (cytoplasm, membrane, intermembrane/periplasmic space, flagellum, inclusion/dense body). Annotations
  started from napari-nnInteractive, were combined with portal membrane segmentations in a copick curation
  pipeline and proofread manually per tomogram. Part of the POPSICLE benchmark; 68 train / 12 test tomograms.
