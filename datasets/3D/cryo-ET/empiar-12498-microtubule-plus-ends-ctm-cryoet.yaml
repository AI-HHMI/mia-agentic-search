      name: microtubule protofilament tracing (mesh)
    alignment: unknown
    alignment_notes: sff tomoNN[_k] in PFtracing_models/dataset_N belongs to tilt series tomoNN in micrographs/dataset_N
      (tomoNN_<tilt>_<date>.tif + tomoNN.mrc.mdoc); every traced tomogram has its tilt series (21 + 6
      + 7 series, 16 + 6 + 7 traced). Each .sff is EMDB-SFF 0.8 XML (IMOD export) with one segment holding
      a mesh (base64 vertices/normals/triangles), transform scale 4.34 A and bounding box 300x600x300,
      i.e. coordinates of a subtomogram reconstructed from the tilt series (EMDB), not of the raw movies;
      the subtomogram origin within the tomogram is not given here.
  notes: 'File index of the EMPIAR HTTPS tree (FTP timed out): 1946 files, 21 + 6 + 7 tilt series in dataset_1..3
    (34 .mdoc), 1875 tilt movies. HTTP index sizes are rounded, so size is EMPIAR''s stated 58.0 GiB (index
    sum 62254761164 B agrees). Raw value_range from one sampled movie (counting-mode electron counts,
    mostly 0-5); normalization none inferred from EMPIAR "non-motion corrected raw movie frames" and the
    separate gain reference. Label .sff read as XML (one file, 60 KB): mesh vertices are float32 base64.
    Voxel size: x/y 2.17 A/px from EMPIAR XML pixelWidth, mdoc PixelSpacing and paper Methods; no z exists
    for tilt-series projections (the 4.34 A isotropic scale belongs to the EMDB subtomograms, not to these
    files), so z stays null. Labels cannot be overlaid on the raw data without reconstructing the tomogram
    and the subtomogram origin.'
