notes: '34 tilt series of non-motion-corrected multi-frame TIFF micrographs (8 frames per tilt, 3838x3710,
  uint16, 2.17 A/px per EMPIAR API and paper Methods). The paper reports protofilament tracing of 33 plus-end
  microtubules over three CTM replicate datasets (20 + 6 + 7). The tracings were made on cryoCARE-denoised
  subtomograms (the related EMDB entry) reconstructed from these tilt series, not on the raw movies; no
  tomograms are in the EMPIAR entry. Z voxel size left null because only the tilt-series pixel size is
  stated. Companion entry for the EB3-only control condition is EMPIAR-12499 (same paper, different sample).
  EMPIAR license read from the page badge (CC0). enricher: labels are .sff meshes (IMOD .mod originals);
  size 58.0 GB as stated by EMPIAR is GiB; download_url set to the EMPIAR HTTPS tree (was null).'
