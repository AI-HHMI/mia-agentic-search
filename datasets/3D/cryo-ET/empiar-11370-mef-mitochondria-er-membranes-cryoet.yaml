  notes: EMPIAR FTP times out here; data/, Tomograms/ and Voxel_Segmentations/ HTTP indexes read directly
    (34 label files, 133-238 MB, rounded sizes); size stays page-stated. Headers of TE3 - tomogram float32
    960x928x157 (x,y,z), min/max -4925/2796; labels MRC mode 0 (int8) same shape, header min/max 0/2,
    so up to 3 values; which ID is which membrane (OMM, IMM, ER per the paper) is not stated in the README,
    so classes null. Header voxel 1.34 nm for TE3 (= 3.345 A x 4); other tomograms with 3.11 A tilt series
    would be about 1.24 nm, so imaging.voxel_size_nm stays null. No sample (label files over 130 MB each;
    time budget).
