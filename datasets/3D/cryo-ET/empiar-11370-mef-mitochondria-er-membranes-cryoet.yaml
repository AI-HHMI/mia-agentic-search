id: empiar-11370-mef-mitochondria-er-membranes-cryoet
title: Cryo-ET of mouse embryonic fibroblast lamellae with mitochondria and ER membrane voxel segmentations
short_name: MEF mitochondria and ER membranes (cryo-ET)
description: >-
  Thirty-four cryo-FIB lamella tomograms (bin 4) of mouse embryonic fibroblasts with GFP-labelled mitochondria, treated
  with vehicle or thapsigargin, with Amira voxel segmentations of the outer and inner mitochondrial membranes and ER
  for each tomogram, plus tilt series and polygon surface meshes derived from the segmentations.
