notes: >-
  34 bin-4 tomograms (960 x 928 in plane per the EMPIAR record) and 34 matching label volumes, one per tomogram, named
  TE*_tomo.rec.mrc and TE*_labels.rec.mrc. Per the paper Methods, membranes were segmented from correlation volumes
  and curated in Amira (outer and inner mitochondrial membranes and ER as separate labels; threshold
  selection, magic wand, paint tool), hence source: mixed. Tilt series have pixel spacing 3.11 or 3.345 A (per mdoc
  files), so bin-4 voxels are about 1.24 or 1.34 nm; the EMPIAR record gives no tomogram pixel size, so voxel_size_nm
  is null. Entry size 126.9 GB is mostly tilt series. Not the same data as EMPIAR-13056 (a later deposit from the same lab):
  this entry accompanies the 2023 JCB surface morphometrics paper. CC0 read from the EMPIAR entry page.
