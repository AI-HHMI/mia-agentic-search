notes: 'Portal GraphQL: deposition 10341 (released 2026-01-09) has 1516 annotations over 312 runs in datasets
  10468 (defocus, 912 annotations) and 10469 (Volta phase plate, 604). Tomograms: 5.006 A (1260x1260x492) and
  5.005 A (1252x1252x488), denoised and filtered versions. Annotation methods: only 15 sets are manual particle
  selection (ChimeraX-copick); the rest are hybrid or automated. S3 listing of run 25jul02a_Position_1 confirms
  membrane-1.0_segmentationmask.mrc and cytosolic_ribosome-1.0_orientedpoint.ndjson. Organism is reported as
  not_reported by the portal and no publication is linked, so no paper was read; the sample is described only as
  PP7 virus-like particles. License from the portal data submission policy (CC0). Total size not computed. Related
  but distinct from czcdp-10310 (the earlier phantom).'
