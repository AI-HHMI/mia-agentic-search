notes: 'Portal GraphQL: deposition 10341 (released 2026-01-09) has 1516 annotations over 312 runs in datasets
  10468 (defocus, 912 annotations) and 10469 (Volta phase plate, 604). Tomograms: 5.006 A (1260x1260x492)
  and 5.005 A (1252x1252x488), denoised and filtered versions. Annotation methods: only 15 sets are manual
  particle selection (ChimeraX-copick); the rest are hybrid or automated. S3 listing of run 25jul02a_Position_1
  confirms membrane-1.0_segmentationmask.mrc and cytosolic_ribosome-1.0_orientedpoint.ndjson. Organism
  is reported as not_reported by the portal and no publication is linked, so no paper was read; the sample
  is described only as PP7 virus-like particles. License from the portal data submission policy (CC0).
  Related but distinct from czcdp-10310 (the earlier phantom). enricher: size from API file sizes (was
  null). Voxel size: 10468 runs 5.006 A, 10469 runs 5.005 A (MRC headers / API); record keeps 0.5006 nm,
  0.02% off for the 115 runs of 10469.'
