description: Two cryo-ET datasets (Volta phase plate at low defocus, and conventional higher defocus) of a 2-protein
  phantom sample with PP7 virus-like particles, on the CZ cryoET portal. 312 runs with denoised and CTF-filtered
  tomograms (5.0 A/voxel), hand-curated and refined picks of PP7 virus-like capsids and cytosolic ribosomes, plus
  automated membrane segmentation masks.
