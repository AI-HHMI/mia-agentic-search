schema_version: '1.2'
id: zenodo-22238302-robpicker-cryoet-ribosomes
title: Datasets associated with RobPicker (cryo-ET particle picking, D1, D2, D5)
short_name: RobPicker cryo-ET ribosome/ATP synthase picks
description: 34 denoised, binned cryo-electron tomograms (MRC) of three cell types, each paired with an XML object
  list of particle centres (x, y, z, Euler angles, class label). D1 - Chlamydomonas reinhardtii (18 tomograms; ATP
  synthase and 80S ribosomes; subset of EMPIAR-11830); D2 - Saccharomyces cerevisiae lamellae (6 tomograms; 80S
  ribosomes; from EMPIAR-12534); D5 - Schizosaccharomyces pombe VPP tomograms (10 tomograms; fatty acid synthase
  and cytosolic ribosomes; from EMPIAR-10988 / DeePiCt). Fixed train/valid/test splits for D1 and D2, five-fold
  cross-validation for D5. Released with the RobPicker paper (D3 and D4 are not included).
