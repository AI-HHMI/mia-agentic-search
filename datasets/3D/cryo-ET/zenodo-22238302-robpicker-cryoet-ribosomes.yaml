notes: 'Voxel size is stated in the README only for D1 (7.84 A) and D5 (13.48 A), not for D2, so it is
  left null here (the tomograms differ per dataset). Annotation source: template matching plus manual
  curation / classification (D1, D2) and iterative manual+CNN workflow (D5); the README says D2 class
  1 is "retained source objects not used as the reported target". Archives are .tar.zst (not listed
  inside); the structure and counts come from the Zenodo README, so annotations_verified is false. Size
  is the sum of the Zenodo files. D3 and D4 are on request only and not part of this record. The tomograms
  derive from EMPIAR-11830, EMPIAR-12534 and EMPIAR-10988; check that those are not already catalogued
  separately.'
