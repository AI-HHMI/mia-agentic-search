short_name: PolNet simulated cryo-ET particle picking
description: 27 simulated cryo-ET runs (tilt series and tomograms) generated with PolNet, with ground truth oriented
  point coordinates and segmentation masks for six simulated classes (alkaline phosphatase, cytosolic ribosome,
  GroEL-GroES, nucleosome, major vault protein, Chikungunya virus-like capsid) plus membranes, released by the CZ
  Imaging Institute for benchmarking and training cryo-ET particle picking algorithms.
