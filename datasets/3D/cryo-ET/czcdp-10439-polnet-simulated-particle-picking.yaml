notes: 'Portal page and GraphQL API: 27 runs, 27 raw tomograms (all 630x630x200 voxels at 10.0 A spacing), 189 annotations
  (7 objects per run, method ''polnet-simulated ground truth''); annotation files: 189 zarr, 189 mrc, 162 ndjson. Annotated
  objects per the page: alkaline phosphatase, cytosolic ribosome, GroEL-GroES, nucleosome, major vault protein, Chikungunya
  VLP, plus membrane masks. The IEEE TMI PolNet paper is not open access; only its abstract was read. License from the portal
  data submission policy (CC0); the portion of the dataset page read did not state it. Total size not stated. Same simulator
  and grid as the CZII challenge simulated set (czii-10441) but a different dataset with different protein classes. enricher:
  size 37,151,268,780 B from the complete S3 listing (was null); voxel 1.0 nm confirmed by MRC header and tomogram_metadata.json;
  organism empty because the data are in silico (dataset_metadata.json organism not_reported).'
