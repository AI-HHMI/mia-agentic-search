title: In situ cryo-ET structure of phycobilisome–photosystem II supercomplex from red alga
short_name: Red alga thylakoid membrane and PBS-PSII (cryo-ET)
description: 60 reconstructed cryo-FIB lamella cryo-electron tomograms of the red alga Porphyridium purpureum (4x binned,
  1.3684 nm voxels) with manually picked and STOPGAP-refined PBS-PSII particle coordinates. Four tomograms have a thylakoid-membrane
  segmentation volume and a PBS-PSII annotation volume (.em, averages mapped back), one of them (Fig1_tomo_012) together with
  its tomogram.
