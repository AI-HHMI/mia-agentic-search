notes: 'Annotations exist for a single tomogram only (Fig1_tomo_012 membrane segmentation and PBS-PSII
  annotation, from the EMPIAR API record); the other 59 tomograms are unlabeled, so this is a small labeled
  set inside a large unlabeled one. The paper Methods say PBS-PSII particles were picked manually (75,310 sub-tomograms);
  how the membrane segmentation was made is not stated there; file listing not inspected, so annotations_verified is
  false. Voxel size 13.684 A is from the EMPIAR record (binning 4; paper states a 3.421 A raw pixel size).
  EMPIAR lists 60 tomograms while the paper Methods mention 51 tilt series. Paper Data availability lists
  only EMDB maps (EMD-31241..45). Checked: EMPIAR landing page, EMPIAR API record, paper full text.'
