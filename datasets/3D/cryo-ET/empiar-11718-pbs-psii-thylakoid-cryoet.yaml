notes: 'Label volumes: Tomograms_Segmentation_Annotation_for_publication/ has membrane segmentations + PBS annotation .em
  for Fig1_tomo_012, FigS1B_tomo_9_2_006, tomo_2_1_008 and tomo_10_1_013; only Fig1_tomo_012 has its tomogram in the entry
  (Tomograms_bin4/Fig1_tomo_012_tomogram.mc); the other 59 tomograms carry particle coordinates only. Paper Methods: membranes
  segmented with TomoSegMemTV, Amira and ChimeraX; PBS-PSII picked manually and refined with STOPGAP, averages re-mapped into
  the tomograms (so source mixed). Voxel size 13.684 A from EMPIAR (binning 4) and MRC headers; paper raw pixel 3.421 A. EMPIAR
  lists 60 tomograms; paper Methods mention 51 tilt series. enricher: no raw tilt series are in the entry (description corrected);
  download_url set to the https tree.'
