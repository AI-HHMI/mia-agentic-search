title: POPSICLE Bacterial Segmentation Dataset (CryoET Data Portal deposition CZCDP-10350)
short_name: Bacterial cell cryo-ET segmentation (5 classes)
description: Semantic segmentation masks (cytoplasm, bacterial-type flagellum, membrane, dense body, periplasmic/intermembrane
  space) for 80 bacterial cryo-electron tomograms from 13 contributing portal datasets, released as the bacterial segmentation
  benchmark of POPSICLE (68 train / 12 test tomograms). Annotations were made with napari-nnInteractive, an agent-designed
  copick curation pipeline and manual refinement.
