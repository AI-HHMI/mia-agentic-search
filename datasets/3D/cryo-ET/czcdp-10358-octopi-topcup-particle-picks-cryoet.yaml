notes: 'Portal GraphQL (2026-10-17): 6,372 automated annotations, 6,110 OrientedPoint ndjson (Octopi and TopCup, often two
  files per protein per run) and 262 MemBrain-seg membrane masks, in 1,056 runs of 11 datasets; 215,955 picks. Voxel spacing
  differs by dataset (4.99-10.012 A), so voxel size stays null (see technical.notes). organisms: Homo sapiens = 10426, 10427,
  10431-10433, 10435 (unroofed cells); Mus musculus = 10453 (synaptic vesicles); Escherichia coli = 10493 (BL21(DE3), GroEL/PP7);
  10440, 10445, 10446 (CZII object-identification challenge phantom samples) report none. Labels are model predictions, validated
  by subtomogram averaging per the description; no publication is listed. License: portal policy says CC0. enricher: organism,
  n_items, size_bytes from API.'
