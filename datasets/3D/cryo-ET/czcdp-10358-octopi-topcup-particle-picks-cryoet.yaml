description: 'Particle picks from two deep-learning detectors (self-configuring Octopi 3D U-Net and the
  TopCup baseline) over cryo-ET datasets: GroEL in E. coli, six phantom/ML-challenge test proteins, ribosomes
  in unroofed cells and V-ATPase on synaptic vesicles; all picks validated by subtomogram averaging with
  py2rely (RELION-5).'
