notes: 'Portal page and GraphQL API: 423 runs in 9 datasets (10510: 223, 10534: 145, 10531: 66, 10532: 60, 10533:
  58, 10530: 34, 10528: 29, 10527: 22, 10529: 9); 3,453 tomograms (raw, filtered, denoised per run) and 846 annotations
  (membrane mask via membrain-seg + sample-boundary mesh from an octopi 3D U-Net, 423 each). Tomograms 810x810x564
  voxels at 10.012 A (most runs) or 1248x1248x564 at 10.01 A (58 raw tomograms, i.e. some runs); voxel_size uses
  10.012 A. Annotations are automatic, not manual. Portal lists EMPIAR-13281 as related (not in catalog). License
  not stated on the deposition page; CC0 taken from the portal data-submission policy as for the other portal records.
  Total size not computed. Paper (Cell Rep Methods, full text read via Europe PMC) describes the lift-out workflow
  and vesicle segmentation with Volume Segmantics; it does not describe the membrane masks.'
