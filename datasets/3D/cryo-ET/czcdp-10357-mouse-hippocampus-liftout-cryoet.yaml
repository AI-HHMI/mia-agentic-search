notes: 'Portal GraphQL API: 423 annotated runs in 8 datasets (10534: 145, 10531: 66, 10532: 60, 10533:
  58, 10530: 34, 10528: 29, 10527: 22, 10529: 9); 5 tomograms per run (raw, 2 filtered, 2 denoised; 2,115
  in total) and 846 annotations (membrane mask via membrain-seg + sample-boundary mesh from octopi, 423
  each). Annotations are automatic, not manual. Portal lists EMPIAR-13281 as related (not in catalog).
  License not stated on the deposition page; CC0 taken from the portal data-submission policy. Paper (Cell
  Rep Methods, full text read) describes the lift-out workflow, not the membrane masks. enricher: voxel
  size set to null (was 1.0012 nm): datasets 10527-10532 and 10534 are 810x810x564 at 10.012 A, dataset
  10533 is 1248x1248x564 at 10.010 A (API voxelSpacing and MRC headers). enricher: n_items = annotated
  runs; size_bytes from API file sizes (was null); dataset list corrected (10510 has no runs of this deposition).'
