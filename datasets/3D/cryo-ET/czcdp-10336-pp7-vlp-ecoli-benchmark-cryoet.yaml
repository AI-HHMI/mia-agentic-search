notes: 'Portal GraphQL: deposition 10336 (released 2025-11-07; linked preprint doi 10.64898/2026.05.20.726049)
  has about 2,000 annotations in 796 runs of datasets 10455 (1059 annotations), 10493 (817) and 10494
  (124). Annotation methods are mostly computational: Octopi prediction plus 2D/3D classification and
  RELION refinement, pytom-match-pick template matching, MemBrain-seg for membranes, and only 3 manual
  picks (ChimeraX-copick), so these are algorithmic labels rather than expert ground truth. Tomograms:
  4.995 A, 1230x1230x480, denoised and filtered. The preprint is not open access, only its abstract was
  available (Europe PMC); the abstract describes PP7 VLPs overexpressed in E. coli as an in situ benchmark.
  License from the portal policy (CC0). enricher: GraphQL now lists 2,108 annotations in 840 runs; n_items
  796 -> 840; size from API file sizes (was null).'
