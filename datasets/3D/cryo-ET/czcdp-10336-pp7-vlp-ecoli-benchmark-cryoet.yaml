notes: 'Portal GraphQL: deposition 10336 (released 2025-11-07; linked preprint doi 10.64898/2026.05.20.726049) has
  about 2,000 annotations in 796 runs of datasets 10455 (1059 annotations), 10493 (817) and 10494 (124). Annotation
  methods are mostly computational: Octopi prediction plus 2D/3D classification and RELION refinement, pytom-match-pick
  template matching, MemBrain-seg for membranes, and only 3 manual picks (ChimeraX-copick), so these are algorithmic
  labels rather than expert ground truth. Tomograms: 4.995 A, 1230x1230x480, denoised and filtered. S3 listing of
  run 25aug25a_Position_1 shows membrane masks (MRC) and oriented-point ndjson for pseudomonas_phage_pp7_vlp. The
  preprint is not open access, only its abstract was available (Europe PMC); the abstract describes PP7 VLPs
  overexpressed in E. coli as an in situ benchmark. Total size not computed. License from the portal policy (CC0).'
