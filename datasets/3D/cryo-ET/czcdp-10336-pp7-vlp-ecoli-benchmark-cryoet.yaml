title: In situ virus-like particles in E. coli for microscopy and pipeline benchmarking (CZ portal 10336)
short_name: PP7 VLP capsid picks in E. coli (cryo-ET)
description: Cryo-ET benchmark of PP7 bacteriophage virus-like particles overexpressed in E. coli BL21(DE3), in three
  datasets (3.3 A, plunge-frozen 3.0 A and lamella 3.9 A resolution targets) on the CZ cryoET portal. About 800 runs
  with denoised and filtered tomograms (4.995 A/voxel) and oriented point sets for PP7 capsids and GroEL, plus
  membrane segmentation masks, produced by template matching or Octopi prediction with RELION refinement.
