notes: 'Zenodo record is minimal ("More details will follow"), no paper cited, so organism, sample, pixel size, annotation procedure and microscope are unknown. The 30.5 MB zip holds 3 MRC files for a single 160^3 patch (tomo02_patch000): tomos_raw, patches_preprocessed and patches_labels. Only one volume, so this is a very small sample. enricher: authors Lamm, Lorenz and date 2023-03-16 from the Zenodo API (was Helmholtz AI / null). enricher: labels hold 0/1/2; MemBrain-seg docs name the training-patch classes membrane, no membrane and ignore, but don''t state the numeric mapping for this file. The larger MemBrain-seg training set is a separate Zenodo record (15089686).'
