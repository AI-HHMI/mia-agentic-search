  notes: 'Listing of the one Zenodo zip is complete (3 MRC members, 30,505,967 bytes zipped). Raw and label sampled in full with tools/sample.py (15.2 MB downloaded); the raw value range is the MRC header min/max (same as the sample). MRC headers store voxel size 0 A. Voxel size not found; checked: MRC headers, Zenodo API record (description ''More details will follow''), zip listing (no README), MemBrain-seg GitHub README and docs (Training, Annotations), MemBrain v2 preprint (bioRxiv 10.1101/2024.01.05.574336; only the default rescaling to 10 A, not this patch''s size), Zenodo 15089686 (rescaled patches, not these files). Organism not stated in any of these sources. Annotation source not stated for this record (the preprint describes manually refined patches, but the record doesn''t cite it). Direct download: the zip and both sample members passed probe.py --download-check (range requests).'
