notes: 'Split (15 train / 4 test tomograms) and CC0 1.0 license taken from the POPSICLE paper (arXiv HTML), not from the deposition
  page. Tomograms live in DS-10000/DS-10001 (EMPIAR-10988 source). Voxel size 13.48 A from deposition page. File format not
  stated on the deposition page or paper (portal listing not fetched), so ''other''. Annotation file listing not seen, hence
  annotations_verified false. Masks were made with a hybrid 2D-CNN + manual correction pipeline. enricher: formats from annotation
  metadata/probe (OME-Zarr + MRC, was other); annotations verified (deposition 10351 masks found in DS-10000 runs). enricher:
  source mixed = DS-10000 masks 2D CNN + manual correction, DS-10001 manual segmentation (annotation_method in TS_026 annotation
  JSON).'
