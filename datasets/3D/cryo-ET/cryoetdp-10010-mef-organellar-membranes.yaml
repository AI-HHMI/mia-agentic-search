notes: 'Portal page lists 34 tomograms and 131 annotations. License CC0 is stated on the linked EMPIAR-11370 entry
  (same data), not on the portal page. enricher: voxel size set to null (was 1.34 nm): tomogram_metadata voxel_spacing
  differs by run: 13.4 A = 18 runs (TE10, TF5, UE1...), 12.44 A = 9 (TE2, TE7, UE3...), 14.36 A = 5 (UE10, UF1-UF4),
  28.4 A = UF5, 14.2 A = UF6; isotropic within a run (MRC/OME-Zarr headers agree). enricher: annotations.source
  mixed: mito outer/inner and ER membrane masks are TomoSegMemTV + manual Amira correction (hybrid, ground truth);
  ''membrane'' (TARDIS) and membrain_seg_prediction masks are automated, not ground truth. Coverage: mito outer/inner
  masks in 32 of 34 runs, ER in 24, membrane in 9, membrain-seg in 34. enricher: size from full S3 listing.'
