notes: Portal page lists 34 tomograms and 131 annotations (some marked ground truth); annotation of the sampled
  run (TE10) is TomoSegMemTV segmentation with manual correction in Amira, ground_truth_status true. Voxel spacing
  13.4 A (1.34 nm) for the sampled run; portal also shows 12.44 A (1.244 nm) for others, so voxel size is not uniform.
  License CC0 is stated on the linked EMPIAR-11370 entry (same data, cross-referenced in portal metadata), not on
  the portal page itself; the portal page shows no license text. Annotation coverage per tomogram not verified (not
  every run necessarily annotated). Paper Data availability section covers only code (GPLv3).
