      \  model_<0-9>/reconstruction.mrc          512x512x512 float32 (WBP, 1 nm)\n  model_<0-9>/grandmodel.mrc\
      \              512x512x512 float32 (noise-free model)\n  model_<0-9>/class_mask.mrc            \
      \  512x512x512 float32 (class ids 0-15)\n  model_<0-9>/occupancy_mask.mrc          512x512x512 float32\
      \ (particle ids)\n  model_<0-9>/particle_locations.txt      class X Y Z rotZ1 rotX rotZ2\n  model_<0-9>/projections_unbinned.mrc\
      \    1024x1024x61 float32 tilt series\n  model_<0-9>/alignment_simulated.txt     tilt angles\nshrec21_contest_dataset.zip\
      \ (datafile/309090; 7,823,307,210 B; 83 files): same without model_9 ground truth\nshrec21_diff_dataset.zip\
