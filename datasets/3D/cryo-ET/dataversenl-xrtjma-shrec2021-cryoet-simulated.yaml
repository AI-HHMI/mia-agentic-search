  notes: 'Listing: zip central directories of all five Dataverse files read with Range GETs (complete;
    size = exact sum). Members are deflate-compressed MRC (mode 2 float32, no extended header). MRC headers
    carry no usable calibration (cella 0 or 1 A/px defaults); 1 nm voxel from readme. Sample: class_mask
    and occupancy_mask of model_0 decoded in full (16 integer values 0-15; 1402 ids 0-1401); reconstruction
    value_range from the first 25 of 512 slices only; grandmodel.mrc (noise-free model, 512^3 float32,
    header range 0-29.56, same shape as reconstruction) is left out of arrays: miao has no slot for it.
    Organism: none, the volumes are simulated (PDB structures). Normalization not documented. The no-mirroring
    zip has masks/grandmodel on a 512x512x180 grid vs 512^3 reconstruction (offset not documented), so
    the arrays describe the full_dataset zip only.'
