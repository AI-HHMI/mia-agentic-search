notes: 'Simulated data, not real specimens. File listing came from the DataverseNL API (five zips: contest 7.8 GB, diff 73 MB, full
  7.9 GB, full without mirroring 9.0 GB, original ground truth 6.8 GB); zip contents could not be listed because the server does not
  support range requests, so file formats are unverified (listed as other) and annotation files are taken from the track page
  description. size_bytes is the sum of all five zips, which overlap (the full, contest and diff archives repackage the same tomograms), so it overstates the unique data. The track page notes class 4V94 was generated incorrectly (two mirrored copies) and was removed from
  evaluation. One tomogram is the contest test tomogram. Related to, but distinct from, the SHREC 2019 simulated dataset in
  the catalog and TomoTwin.'
