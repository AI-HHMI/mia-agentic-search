notes: 'Simulated data, not real specimens. size_bytes is the exact sum of all five Dataverse zips, which
  overlap (contest, diff and full repackage the same tomograms; full_dataset alone is 7.9 GB and has all
  10 tomograms with ground truth). Class 4V94 was generated incorrectly (mirrored) and removed from evaluation
  (track page). Model 9 is the contest test tomogram. Related to, but distinct from, SHREC 2019 and TomoTwin
  in the catalog.

  enricher: formats mrc (was other); annotation files confirmed from zip listings and readme; download_url
  = full_dataset zip (was null); voxel size 1 nm confirmed by readme ("binned from 5.0A to 10.0A"); MRC
  headers carry no calibration.'
