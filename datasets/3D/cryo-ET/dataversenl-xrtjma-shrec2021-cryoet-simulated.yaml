title: 'SHREC Cryo-ET 2021 Dataset: Classification in Cryo-Electron Tomograms'
short_name: SHREC 2021 simulated cryo-ET particles
description: Ten simulated cryo-electron tomograms (512x512x512 voxels at 1 nm/voxel) of cell-like volumes containing
  up to about 1,500 particles from 13 protein classes plus vesicles and gold fiducials, with particle locations, class
  masks, occupancy volumes, noise-free ground-truth volumes and projections. Built as a benchmark for localization
  and classification of macromolecules in tomograms.
