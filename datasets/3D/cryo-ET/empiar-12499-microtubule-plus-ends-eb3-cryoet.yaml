  notes: 'File index of the EMPIAR HTTPS tree (FTP timed out): 2950 files, 12 + 39 tilt series in dataset_1
    / dataset_2 (51 .mdoc), 2870 tilt movies. HTTP index sizes are rounded, so size is EMPIAR''s stated
    75.9 GiB (index sum 81462350437 B agrees). Raw value_range from one sampled movie (counting-mode electron
    counts, mostly 0-5); normalization none inferred from EMPIAR "non-motion corrected raw movie frames"
    and the separate gain reference. Label .sff read as XML (one file, 60 KB): mesh vertices are float32
    base64. Voxel size: x/y 2.17 A/px from EMPIAR XML pixelWidth, mdoc PixelSpacing and paper Methods;
    no z exists for tilt-series projections (the 4.34 A isotropic scale belongs to the EMDB subtomograms,
    not to these files), so z stays null. Labels cannot be overlaid on the raw data without reconstructing
    the tomogram and the subtomogram origin.'
