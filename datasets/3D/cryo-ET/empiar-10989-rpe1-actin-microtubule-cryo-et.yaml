notes: 'Entry data: 179 raw multi-frame TIFF micrographs (3.3702 A/px), 3 reconstructed tomograms (MRC, 13.48 A/px = 1.348 nm,
  4x binned), 3 tilt-series stacks (MRC). voxel_size_nm is the tomogram voxel size. Ground truth: actin segmentation for all 3
  tomograms, microtubules for tomogram 0004 only; also filtered tomograms and DeePiCt actin predictions. Paper (PMC9911354) names
  RPE-1 as the cell line (human) and says segmentations were done with Amira filament tracing followed by manual curation;
  pixel size/microscope for the RPE-1 tomograms are not stated there. EMPIAR page said organism not stated; Homo sapiens
  inferred from RPE-1 cell line in paper. Annotation file names not verified (ftp subfolders labels/ and
  actin_ground_truth_coordinates/ not listed). Sibling entry EMPIAR-10988 (S. pombe) is a different dataset. EMPIAR API
  returned 503 this run.'
