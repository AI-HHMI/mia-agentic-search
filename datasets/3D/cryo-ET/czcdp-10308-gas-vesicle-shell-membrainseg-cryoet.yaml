notes: 'API: 486 annotations in 486 runs, methodType ''automated'' (model predictions, no manual correction
  stated, so quality is unverified); voxel spacings 5.06-13.5 A. SegmentationMask files in zarr and mrc.
  API counts, organisms, voxel spacings; S3 metadata JSON: method, software, authors. No publication or
  DOI is listed for the deposition on the portal, so publications is empty and no paper was read. License:
  the portal''s data submission policy states that published data is available under CC0. Tomogram voxel
  sizes differ between datasets (stated in the portal as VoxelSpacing in angstrom), so voxel_size_nm is
  null; download is via the portal/S3 per run. enricher: size from the API file sizes (MRC tomograms +
  MRC masks); voxel size stays null (10 A x263, 6.748 A x187, 13.496 A x26, 5.6, 11.2, 5.061 A). coverage:
  one whole-tomogram mask per run, automated, so completeness is unverified.'
