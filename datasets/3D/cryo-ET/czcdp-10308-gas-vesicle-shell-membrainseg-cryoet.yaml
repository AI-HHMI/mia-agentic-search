notes: 'API: 486 annotations in 486 runs, methodType ''automated'' (model predictions, no manual correction stated, so quality
  is unverified); voxel spacings 5.06-13.5 A. SegmentationMask files in zarr and mrc. Portal GraphQL API (annotations filtered
  by depositionId) gives the counts, organisms and voxel spacings; the per-annotation S3 metadata JSON gives method, software,
  shape type and authors. No publication or DOI is listed for the deposition on the portal, so publications is empty and no
  paper was read. License: the portal''s data submission policy states that published data is available under CC0. Tomogram
  voxel sizes differ between datasets (stated in the portal as VoxelSpacing in angstrom), so voxel_size_nm is null; download
  is via the portal/S3 per run. Files were not opened.'
