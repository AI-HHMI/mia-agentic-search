notes: 'Per the README, labels are 13.48 A voxel MRC volumes of actin and both plasma membranes for each
  of the 70 tomograms (17 iMC control, 9 iMC induced, 6 CAEzrin control, 20 CAEzrin induced, 8 6FP-iMC
  control, 10 6FP-iMC induced). Paper Methods: actin from automated filament tracing in Amira (cylinder
  template) then manually curated in Dragonfly and exported as a binary mask; membranes segmented with
  MemBrain-seg, plasma-membrane regions extracted and cleaned manually, hence source mixed. Entry size
  804.3 GB includes raw frames and tilt series; tomograms and labels are about 1.6-1.7 GB each. Label
  file dtype and encoding not inspected. License not shown on the EMPIAR entry page as fetched, the API
  record or the paper''s Data availability statement, so left unknown. A representative tomogram is also
  in EMDB EMD-56367.'
