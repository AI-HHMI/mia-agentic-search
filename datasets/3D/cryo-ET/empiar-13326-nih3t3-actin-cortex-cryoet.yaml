title: Cryo-electron tomography of the actin cortex of NIH 3T3 fibroblasts upon regulation of membrane-to-cortex
  attachment
short_name: NIH 3T3 actin cortex and membranes (cryo-ET)
description: 70 cryo-FIB lamella tomograms (4x binned, 13.48 A voxels) of NIH 3T3 fibroblasts in six conditions
  (iMC, CAezrin and 6FP-iMC, each with and without doxycycline induction), with raw tilt-movie frames and, for every
  tomogram, MRC label volumes of cortical actin filaments and the two adjacent plasma membranes.
