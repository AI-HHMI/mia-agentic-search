notes: 'Per the README, labels are 13.48 A voxel MRC volumes of actin and both plasma membranes for each of the
  70 tomograms (17 iMC control, 9 iMC induced, 6 CAEzrin control, 20 CAEzrin induced, 8 6FP-iMC control, 10 6FP-iMC
  induced). Paper Methods: actin from automated filament tracing in Amira, then manually curated in Dragonfly and
  exported as a binary mask; membranes segmented with MemBrain-seg, then plasma-membrane regions extracted and cleaned
  manually. enricher: source proofread (was mixed): both label sets are automatic outputs manually curated (paper
  Methods). Entry size 804.3 GB includes raw frames and tilt series; tomograms and labels are 1.77 GB each. enricher:
  license CC0-1.0 from the EMPIAR entry page license badge (was unknown). A representative tomogram is also in EMDB
  EMD-56367.'
