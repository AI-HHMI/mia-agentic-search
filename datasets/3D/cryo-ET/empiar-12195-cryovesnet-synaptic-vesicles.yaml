id: empiar-12195-cryovesnet-synaptic-vesicles
title: Training Set for CryoVesNet - Cryo-electron tomograms of rat synaptosomes and synaptic vesicle segmentation
short_name: Synaptic vesicles in rat synaptosomes (cryo-ET)
description: Nine cryo-ET tilt series of rat synaptosomes with their reconstructed tomograms, binned/trimmed NAD-denoised
  tomograms, and manual IMOD segmentations (segmentation region, active zone, synaptic vesicles as spheres) plus
  an MRC label volume (0 outside region, 1 background, 2 active zone, 10+ one integer per vesicle). Used as the
  training set of CryoVesNet.
