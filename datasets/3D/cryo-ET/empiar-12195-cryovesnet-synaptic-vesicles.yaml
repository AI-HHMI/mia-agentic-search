notes: 'Size 8.9 GB and 9 tomograms per EMPIAR API record. Voxel size not stated in the EMPIAR record
  or paper for the deposited tomograms (paper says binned tomograms used for analysis had 2.1-2.4 nm voxels,
  heterogeneous pixel sizes otherwise). Paper names 9 training tomograms; test sets are not part of this
  entry. The paper text is CC BY-NC-SA but the EMPIAR entry is CC0. Paper Methods give no microscope details
  (refers to Radecke et al. 2023 for sample preparation). enricher: listing shows 53 files, ~9.5 GB (HTTP
  index, rounded); headers of tomogram 1 give 2.16 nm voxels; voxel_size_nm left null as the paper reports
  heterogeneous pixel sizes. maintainer 2026-10-06: isotropic, differs per tomogram (MRC headers, processed/label
  grid): ctrl_1 2.16, ctrl_2 2.24, ctrl_3-6 2.13, ctrl_7-9 2.25 nm; full tomograms/spray_ctrl_6.rec is
  1.42 nm. voxel_size_nm stays null.'
