description: Manual (6) and automated (38) cytosolic ribosome particle annotations in cryo-electron tomograms
  of plasma membranes isolated from human cells by unroofing; manual picks made with copick were used
  to train an octopi detector, and the automated set is the particles contributing to a 7.5 A RELION ribosome
  average.
