notes: 'API: 44 annotations in 38 runs (38 automated, 6 manual), VoxelSpacing8.660 A (0.866 nm), object ''cytosolic ribosome''.
  The portal description states the manual picks trained the octopi model. Portal GraphQL API (annotations filtered by depositionId)
  gives the counts, organisms and voxel spacings; the per-annotation S3 metadata JSON gives method, software, shape type and
  authors. No publication or DOI is listed for the deposition on the portal, so publications is empty and no paper was read.
  License: the portal''s data submission policy states that published data is available under CC0. Download is via the portal/S3
  per run. Files were not opened.'
