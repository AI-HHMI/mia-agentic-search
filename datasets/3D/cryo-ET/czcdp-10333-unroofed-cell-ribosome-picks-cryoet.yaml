  the portal''s data submission policy states that published data is available under CC0. Download is
  via the portal/S3 per run. enricher: size from the API file sizes (all 3 MRC tomograms per run + ndjson);
  voxel size 8.66 A confirmed in MRC headers (all runs, API). enricher: source stays mixed: manual Point
  files (6 runs, copick) vs automated OrientedPoint files (38 runs, octopi); arrays 1 and 2.'
