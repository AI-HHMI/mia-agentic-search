title: Cryo-electron tomography of centrosomes in C. elegans embryonic cells
short_name: C. elegans centrosome segmentations (cryo-ET)
description: 12 cryo-electron tomograms (Volta phase plate, 13.48 A/voxel) of centrosomes in dissociated C. elegans embryonic cells
  across the cell cycle (interphase to telophase), with segmentation masks of centrioles, microtubules, ribosomes, membranes and
  pericentriolar material. Segmentations combine DeePiCt, Amira cylinder correlation and Ilastik predictions with manual inspection and correction.
