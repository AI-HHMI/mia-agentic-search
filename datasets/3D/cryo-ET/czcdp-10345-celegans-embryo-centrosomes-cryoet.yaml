notes: 'Portal GraphQL API: deposition 10345, one dataset (10477), 12 filtered tomograms at 13.481 A (21.5 GB MRC), annotations
  per tomogram: microtubule 12, cytosolic ribosome 12, membrane 12, centriole 10 (manual tracing in Amira) and pericentriolar
  material 7 (Ilastik); all flagged as ground truth on the portal, all shape type SegmentationMask. Methods per class from
  the portal annotation records (DeePiCt, Amira, Ilastik, with manual correction), so source is mixed. Related entries: EMPIAR-12049
  and EMD-19778 to 19781. The paper (Dev Cell 2025) is not open access in Europe PMC: only the abstract was read. Tilt-series
  and tomogram counts are as reported by the portal API. enricher: masks are int8 OME-Zarr + MRC per class (S3 listing); centriole
  manual, the other four hybrid (automated then inspected in Amira), hence mixed.'
