title: Cryo-electron tomogram of reovirus-infected cells with crowdsourced virus particle locations and classes
short_name: Reovirus particle points in cell (cryo-ET)
description: >-
  One cryo-FIB lamella tomogram of orthoreovirus-infected MA104 cells (raw and total-variation denoised, with three
  cropped regions) and Zooniverse citizen-science annotations: candidate virus particle locations (3D points) and
  2D and 3D aggregated class labels for those particles.
