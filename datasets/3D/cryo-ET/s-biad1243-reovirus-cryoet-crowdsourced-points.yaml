notes: >-
  A single tomogram, so n_items is 1. Eight files, 7.3 GB: Original_Tomogram.tif (probed: float32, 165 x 2100 x 2100,
  axis order not stated in the file), a TV-denoised version, three cropped ROI stacks, and three CSVs. Annotations are
  crowdsourced (Zooniverse volunteers, post-processed with outlier removal, rated medium confidence in the record):
  VirusPicker_Locations.csv has candidate particle positions (z, x, y); the 2D and 3D classifier CSVs give aggregated
  class codes. The coverage and counts of CSV rows were not checked beyond the first lines. The study paper reports a
  calibrated pixel size of 1.8 A for the tilt series, but the binning of the deposited tomogram is not stated, so
  voxel_size_nm is null. The crowdsourcing method paper (Pennington et al.) could not be read in full; the biological
  paper (Sutton et al. 2020) was. S-BIAD1244 and S-BIAD1245 hold related model segmentations and manual masks for the
  same project and are not catalogued here.
