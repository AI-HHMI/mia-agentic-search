  10314)
short_name: Chlamydomonas cryo-ET organelle segmentations
description: Voxel-wise segmentations of 23 organelles and macromolecular complexes (membranes, ribosomes, ATP synthase, RuBisCO,
  chaperonin, proteasome, chloroplast, pyrenoid, mitochondrion, Golgi, ER, ...) across the 1,829 C. reinhardtii tomograms
  of the cryo-PFIB community dataset, generated with Ais and Pom convolutional networks trained on sparse manual annotations.
