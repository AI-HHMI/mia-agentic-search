notes: 'Portal page and GraphQL API: 33,927 automated segmentation masks (23 classes) for 1,829 runs of datasets 10302 (1,811)
  and 10301 (18); the tomograms (deposition 10300, denoised, 7.84 A, 1024x1024x512) sit in those datasets. Masks are on the
  same 7.84 A grid (MRC headers, 536,871,936 B each = 512x1024x1024 int8), not 15.68 A. 18 ribosome masks are 0 B. Differs
  from the existing record of the same tomograms (EMPIAR-11830): this one is the derived 23-class segmentation set. The preprint
  (read via tools/paper.py) says networks were trained on sparse manual annotations. The deposition also cites the Ais paper
  (eLife 10.7554/eLife.98552). License: portal policy says CC0 (the preprint text is CC BY-NC). enricher: size_bytes from
  API (was null).'
