notes: 'Portal page and GraphQL API: 33,927 automated segmentation masks for 1,829 volumes; the deposition
  itself lists 0 tomograms, which are in portal dataset 10302 (7.84 A voxel spacing, 1024x1024x512 in
  the run checked). Differs from the existing record of the same tomograms (EMPIAR-11830): this one is
  the derived 23-class segmentation set. The preprint (read via tools/paper.py) says networks were trained
  on sparse manual annotations (about 1.5 tomograms equivalent) and computed at 15.68 A binning, so the
  portal masks may be at a different grid than 7.84 A; this was not checked. The deposition also cites
  the Ais paper (eLife 10.7554/eLife.98552). size_bytes not determined. License: portal policy says CC0
  (the preprint text is CC BY-NC).'
