notes: 'Portal: 18 runs, voxel spacing 7.84 A (OME-Zarr scale 7.84 angstrom, enricher-confirmed); related EMPIAR-11756
  (raw tilt series, MRC). enricher: license CC0-1.0 from the portal data submission policy (public data "subject
  to a CC0 license"; was unknown); dataset_metadata.json states none. enricher: annotations.source mixed (was unknown):
  330 segmentation masks are CNN/MemBrain-seg predictions (annotation JSON method_type automated, ground_truth_status
  false); 27 oriented-point sets are hybrid (template matching + manual filtering + 3D classification, ground_truth_status
  true). enricher: coverage partial: each run has its own subset of 26 object classes (e.g. ribosome 34, membrane
  32 annotation files over 18 runs). enricher: formats ome-zarr + mrc (both served), size from the complete S3 listing
  (includes EER frames and gains).'
