title: In situ cryo-ET dataset of Chlamydomonas reinhardtii prepared using cryo-plasmaFIB milling (DS-10301)
short_name: Chlamydomonas in situ lamellae (cryo-ET)
description: '18 in situ cryo-ET tomograms of cryo-plasmaFIB milled Chlamydomonas reinhardtii lamellae,
  from several lamella positions, on the CZ CryoET Data Portal with 379 annotations: segmentation masks
  (e.g. cell wall, membranes, chloroplast stroma, ER, cytoplasm) and oriented-point annotations of complexes
  (F1-F0 ATP synthase, cytosolic ribosome, nucleosome, RuBisCO, proteasome). Same data as the EMPIAR-11756
  test subset (tilt series and TOMOMAN project).'
