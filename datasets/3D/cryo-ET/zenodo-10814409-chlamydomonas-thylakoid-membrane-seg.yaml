notes: >-
  Very small: two tomogram crops (S1_M3b_StII_grow2_1 and S1_M3c_StOI_grow2_1; ~40 MB total from the Zenodo
  file list, with .mrc, _seg.mrc and .obj for each). The Zenodo page does not state modality, organism or
  voxel size; modality and organism are taken from the linked paper (cryo-ET of Chlamydomonas thylakoids;
  source tomograms EMD-10780). The paper's segmentations were produced by threshold-based selection of
  template-matching correlation volumes in Amira (one-voxel-wide membrane centre lines, grown by 2 or 10
  voxels), so the labels are semi-automatic; whether these exact files are the grown versions is not stated.
  Paper says bin4 tomograms at 13.68 A pixel size were used, but the voxel size of these deposited files is
  not stated on the page, so it is left null. Species Chlamydomonas reinhardtii is inferred from the paper title
  and Methods (Chlamydomonas); the Zenodo page says only Chlamydomonas.
