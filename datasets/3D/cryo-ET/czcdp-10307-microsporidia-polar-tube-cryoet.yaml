notes: 'Portal GraphQL API: deposition 10307, datasets 10436 (91 runs), 10437 (94) and 10438 (12), 197 raw tomograms (683
  GB MRC) at 13.72 A (94), 13.41 A (58), 8.308 A (32) or 6.596 A (9). 78 annotation records on 9 runs, shape type SegmentationMask
  (checked on one), made with Dragonfly (manual tracing, or a 2D U-Net trained on 5 manually labelled slices) and flagged
  hybrid, so only about 5 percent of tomograms are labelled. Per the paper Data availability the same data and segmentations
  are also in EMPIAR-12175, EMPIAR-12176 and EMPIAR-12177 (not catalogued). Paper is a bioRxiv preprint, read in full text.
  Subtomogram averages are in EMDB (EMD-45671 to 45674). enricher: voxel size null (was 1.372 nm): the 9 annotated runs are
  at 13.72 A (4), 13.41, 13.19, 16.616 and 26.38 A x2 (GraphQL annotation files). organisms: Encephalitozoon intestinalis
  = 10436/, 10437/; Encephalitozoon hellem = 10438/ (dataset_metadata.json).'
