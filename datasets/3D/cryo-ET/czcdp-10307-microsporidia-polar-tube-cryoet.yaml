title: In situ architecture of the polar tube invasion apparatus from microsporidian parasites
short_name: Microsporidia spore polar tube (cryo-ET)
description: 197 cryo-electron tomograms of cryo-FIB-milled (waffle method) dormant spores of Encephalitozoon intestinalis
  (185) and Encephalitozoon hellem (12), in three portal datasets. A subset of tomograms carries manual and manually curated
  segmentation masks of spore organelles (polar tube, polaroplast, plasma membrane, endospore, exospore, nucleus), including
  9 spores segmented for the study (6 E. intestinalis, 3 E. hellem).
