notes: 'Portal GraphQL: deposition 10338 (released 2026-04-20) has 82 hybrid-method annotations in 10 runs of dataset
  10155 (classes: cytoplasm x20, bacterial-type flagellum x18, dense body x14, periplasmic space x10, intracellular
  anatomical structure x10, membrane x10); 20 tomograms (raw, per-run two reconstructions) at voxel spacings
  16.1 to 20 A, so the voxel size varies per run and is left null (sizes e.g. 928x928x800 at 19.315 A). The S3
  listing of run ycw2013-05-01-34 shows MRC and OME-Zarr masks plus an ndjson per class. The deposition''s
  linked publication is the copick toolkit paper (data availability names CZCDP-10338); it does not describe
  the annotation counts or imaging details, which come from the portal API. License: the portal data submission
  policy states published data is CC0. Authors are not listed in the API fields available. Total size not
  stated; not computed. Tomograms are the raw tomograms of dataset 10155 (also present in the portal).'
