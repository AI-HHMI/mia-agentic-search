short_name: Bdellovibrio compartment masks (cryo-ET)
description: Membrane and compartment segmentation masks (cell, cytoplasm, periplasmic space, bacterial-type flagellum,
  dense body, membrane) for 10 cryo-electron tomograms of attack-phase Bdellovibrio bacteriovorus (portal dataset 10155),
  made by combining automated membrane predictions with semi-manual napari-nnInteractive annotation and an agent-designed
  curation pipeline built with copick-mcp.
