notes: 'Portal GraphQL API: deposition 10334, one dataset (10453), 95 tomograms (all raw, 13.44 A, 70.0 GB of MRC), and 4 annotations per
  tomogram (V-ATPase complex 981 particles, V0 domain 981, clathrin coat 401, clathrin complex 1,911), all OrientedPoint
  shapes; method text says manual picking (Dynamo, RELION 4 for refinement). Coverage is partial: only these four
  protein classes are picked, not all densities. The portal also lists EMPIAR-12794 and EMD-18556/18557/18568/18572/18578
  as related entries. Whether the picks are in the paper SI as well was not checked. Annotation file formats were not
  listed by the API call used. The paper (PNAS 2024) is open access; the Methods and Data availability were read.'
