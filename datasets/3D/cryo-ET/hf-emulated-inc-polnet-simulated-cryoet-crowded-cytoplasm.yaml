short_name: Simulated crowded-cytoplasm cryo-ET (polnet)
description: 48 simulated cryo-electron tomograms of crowded cytoplasm at 10 A per voxel (400 x 400 x 60-100 voxels), generated with polnet and IMOD. Each folder has the 8-bit MRC reconstruction, the noise-free float32 density, a label volume, and objects.csv with the position and orientation of every placed complex, membrane protein and filament subunit (16 cytosolic complexes from wwPDB templates, membranes, microtubules and actin).
