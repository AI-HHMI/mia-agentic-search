      \                  in_mbs/*.mbs, in_tem/default.tem, pns/*.pns, scene.yaml\n  structures/<PDB>.cif.gz  16 wwPDB mmCIF\
      \ models\n  templates/<pdb>.mrc      density templates (float32, 10 A)\n  train/labels.csv         label value -> kind,\
      \ name (28 classes)\n  train/t000 ... t047/     48 tomograms (per card; t000-t004 read)\n    tomogram.mrc          \
      \ reconstruction, int8\n    density.mrc            noise-free density, float32\n    labels.mrc             label volume,\
      \ int8\n    objects.csv            kind, name, x, y, z (A), q1-q4"
