notes: 'Synthetic data, not real micrographs; ground truth is exact by construction (source automatic). One 2.75 GB train.tar.gz; its contents are taken from the dataset card and were not listed (peek_archive handles zips only), hence annotations_verified false. Voxel size 10 A = 1 nm is from the card. The card has no paper; the simulator is polnet (Apache-2.0, commit 73e613c) and the particle templates come from wwPDB entries (CC0). Number of tomograms (48) and sizes are from the card. Different from the real-data Biohub POPSICLE set and from zenodo-23745625 (a different PolNet release).'
