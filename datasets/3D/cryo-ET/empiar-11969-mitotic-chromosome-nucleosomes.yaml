notes: 'Only one reconstructed tomogram (4x binned, 0.83 nm) plus 41 unaligned tilt images and one aligned tilt
  series. Nucleosome picks (about 18k per the paper) are automatic (Template Learning and template matching), not
  manually verified ground truth, and picks are of limited use as supervised labels. Template matching set contains
  some false positives per the paper. Total size and per-file sizes not verified. Overall a single volume, so borderline
  on size. enricher: size estimated from the EMPIAR HTTP index (was null). Pick files seen: TemplateLearning.coords
  18071 rows, TemplateMatching.coords 18070 rows (x y z). MRC header states 0.4 nm voxels vs the record''s 0.83
  nm; record kept.'
