title: GRIP-Tomo 2.0 ML Model Training Data (experimental and simulated cryo-ET subtomograms)
short_name: Cryo-ET protein subtomogram classes
description: Experimental and cisTEM-simulated cryo-ET subtomograms (MRC cubes of 219 voxels per side) of horse L-apoferritin,
  beta-galactosidase and noise-only regions, used to train and test the GRIP-Tomo 2.0 protein classifier. Seven tar.gz archives
  with experimental subtomograms from EMPIAR-10787 and from a PNNL protein-mixture tomogram, a sliding-window tomogram set,
  and four simulated (mock) sets with varying dose, thickness and calibration.
