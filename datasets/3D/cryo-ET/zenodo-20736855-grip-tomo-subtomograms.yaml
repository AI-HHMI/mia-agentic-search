notes: 'Seven .tar.gz archives (34.2 GB, Zenodo API), so contents could not be listed with peek_archive; class membership comes from the
  Zenodo README and description, and folder layout is unverified. Paper: MRC volumes of 219 x 219 x 219 voxels, about 1 A per voxel; the
  experimental protein-mixture tilt series was 1.1 A/pixel (Krios G3i), 174 subvolumes manually picked across apoferritin,
  beta-galactosidase and noise; the EMPIAR-10787 set uses 50 apoferritin picks and 50 noise regions. Per-archive subtomogram counts, the exact
  voxel size of each archive (bin0.5 / simulated) and train/test splits are not stated, so n_items and voxel size are null. Labels are
  per-subtomogram classes (classification), not voxel masks; the simulated data are cisTEM mock volumes. Organism not stated for the purified proteins.'
