notes: 'Seven .tar.gz archives (34.4 GB, Zenodo API). Labels are per-subtomogram classes given by folder (classification),
  not voxel masks; the mock data are cisTEM simulations from PDB 2W0O / 6DRV. Voxel size differs by subset, so null: paper
  says protein mixture tilt series 1.1 A/px (archive named bin0.5), EMPIAR-10787 effective (binned) 1.34 A/px, and the 219^3
  cubes ~1 A per voxel; MRC headers carry no cell size. enricher: organisms: Equus caballus = */horse-l-apoferritin/ (equine
  spleen apoferritin), Escherichia coli = */betagal/ (paper Methods); noise/ folders have no protein (was []). enricher: annotations
  verified from class folders in the archives.'
