notes: 'Software-demo data: only two tomograms. Tomograms are 623.6 MB (M. genitalium, .mrc) and 1.39 GB (EMPIAR-10304 tomogram 10, .em); particle lists and segmentation are in EM format (.em). Paper Methods state pixel sizes of 8.4 A (EMPIAR-10304 SART reconstruction) and 13 A (M. genitalium, binned), so voxel size differs per tomogram and is left null. Particle-list annotation procedure: template matching (EMPIAR-10304) and previous sub-tomogram alignment (M. genitalium NAP); the segmentation procedure is not described, hence source unknown. Sources checked: Zenodo record, both zip listings, full paper text.'
