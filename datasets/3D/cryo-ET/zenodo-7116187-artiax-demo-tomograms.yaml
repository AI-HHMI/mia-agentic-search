  notes: 'Both zips deflate-compress their members, which tools/probe.py could not read; headers and values were read with a streaming zip reader (fsspec + zipfile) instead. Value ranges are from one partial sample each: the first 100 M voxels (~160 of 250 slices) of the M. genitalium tomogram and the whole segmentation; the EMPIAR tomogram (1.39 GB) was not sampled. terminalOrganelle1/2.mrc in demo/ have the tomogram''s shape but compress to 3.7 MB, i.e. mostly zeros (masked sub-regions for the demo scene); they are not listed as arrays. *.pdb, the low-pass EMDB maps and *.py/*.cxc scripts are not training data. Voxel size not set: two tomograms with different pixel sizes (8.4 A and 13 A, paper Methods / NOTE). No single archive covers the dataset: two direct Zenodo zips (both usable, range requests), so data.download_url stays null.'
