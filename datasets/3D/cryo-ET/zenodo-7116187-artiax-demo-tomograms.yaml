notes: 'Software-demo data: two tomograms. organisms: Mycoplasma genitalium = mycoplasma_genitalium.zip, Escherichia coli = empiar_10304.zip. Voxel size differs per tomogram: 8.4 A (EMPIAR-10304, paper Methods and empiar_10304/NOTE) and 13 A (M. genitalium, binned, paper Methods), so left null. EMPIAR tomogram, membrane segmentation and particle lists are EM-format (.em, not in the format enum); M. genitalium tomogram is MRC. Annotation source: particle lists from template matching (EMPIAR-10304) and earlier sub-tomogram alignment (NAP); segmentation procedure not described, so source unknown. Coverage partial: particle lists cover selected complexes only. enricher: size 1.80 GB from Zenodo file listing (was null); authors and date from Zenodo API.'
