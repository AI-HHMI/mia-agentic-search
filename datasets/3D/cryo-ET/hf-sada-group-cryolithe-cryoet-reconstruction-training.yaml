notes: 'Derived from two public EMPIAR entries (EMPIAR-11830, EMPIAR-11058, both released under CC0 there); the Hugging Face card gives MIT for this
  repository. The "labels" are the reference reconstructions made by self-supervised denoisers, not manual ground truth. Counts from the file tree:
  empiar-11058 8 tomogram folders (80 files, 41.5 GB), empiar-11830 138 folders (1,306 files, 963.8 GB). Header probes (probe.py): EMPIAR-11830 tilt
  series 41x1024x1024 at 0.784 nm; EMPIAR-11058 tilt series 57x928x928 at 1.408 nm in x and y; reconstruction volumes have no pixel size set, so
  voxel size is left null. The arXiv paper gives no dataset link; the card says the data are for training the CryoLithe models, and organism for
  EMPIAR-11058 is from the EMPIAR entry title.'
