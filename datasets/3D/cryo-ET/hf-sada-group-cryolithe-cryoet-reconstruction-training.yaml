  notes: 'Listing: tools/listing.py on the HF repo, 1,388 files, 1,005,348,713,378 bytes, complete, exact
    (1,017 .mrc, 300 .tlt, 69 .rawtlt). Glob counts: 435 tilt series, 290 split FBP, 145 Icecream, 145
    IsoNet_or_DDW volumes; tomo_323 uses the older names. Headers probed (MRC, uncompressed): empiar-11058/tomo_001
    tilt series 57x928x928 float32, volumes 464x928x928 (float32 targets, float16 FBP); empiar-11830/tomo_001
    tilt series 41x1024x1024, Icecream 512x1024x1024. Not sampled: the smallest raw/target pair is 2.4
    GB (budget 500 MB). The README names the targets *_corrected.mrc / *_icecream.mrc, but the files are
    *_IsoNet_or_DDW.mrc / *_Icecream.mrc. Voxel size not settled: volume headers carry no pixel size;
    tilt series headers 1.408 nm (11058, z 0.352) and 0.784 nm (11830); the arXiv paper states per-experiment
    pixel sizes in math markup the text extraction lost; checked HF card, README, paper HTML. No single
    archive: data.download_url stays the HF repo (per-file resolve/main links).'
