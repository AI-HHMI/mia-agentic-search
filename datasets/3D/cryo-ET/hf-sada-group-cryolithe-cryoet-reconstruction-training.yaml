title: CryoLithe training data, cryo-ET tilt series with denoised reconstruction targets (EMPIAR-11830 and EMPIAR-11058)
short_name: CryoLithe cryo-ET tilt series and target tomograms
description: Training data of the CryoLithe cryo-ET reconstruction network, 1,386 files (1.0 TB) for 8 tomograms of EMPIAR-11058 (T. kivui) and
  138 of EMPIAR-11830 (Chlamydomonas reinhardtii) as MRC. Each has the aligned tilt series, odd/even or split half tilt series, tilt angles and
  the reference reconstructions (cryo-CARE plus IsoNet or DeepDeWedge, and Icecream) used as training targets for denoising and missing-wedge correction.
