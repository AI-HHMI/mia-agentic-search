notes: 'n_items = 7 train + 121 public test + 364 private test experimental tomograms (paper text); the 27 synthetic
  tomograms are extra. Portal deposition page lists 1,995 tomograms in total (multiple spacings/datasets), which
  was not reconciled. CC0 stated in paper Fig. 2 legend; portal deposition page did not display a license. Ground
  truth is acknowledged as incomplete by authors. Portal file listing not inspected (JS app), hence annotations_verified
  false. Private test labels may not be public. enricher: deposition spans portal datasets 10440, 10441, 10445,
  10446; annotation files (ndjson points, zarr/mrc masks) seen in S3 listing and sampled. enricher: voxel size set
  to null (was 0.151 nm = 1.51 A detector pixel from the paper, matching no file): tomograms are at 10.012 and 4.990
  A (10440/10445/10446) and 10.000 A (10441, synthetic), per OME-Zarr scale and S3 VoxelSpacing folders.'
