  notes: 'Deposition 10310 = portal datasets 10440/10441/10445/10446 (portal API). S3 listing of all four capped
    at 50k files per prefix, so no total; >=1.9 TB listed. Run TS_5_4 (10440) has 4 tomograms: 10.012 A and 4.99
    A, denoised and filtered WBP; probe: OME-Zarr v2, 3 levels, blosc-lz4, float32, scale in angstrom. Voxel size:
    OME-Zarr scale 10.012 A (probe); runs also have VoxelSpacing4.990, and 10441 has VoxelSpacing10.000, so no single
    value (record null). Value range from a central crop of level 0 (184x157x315). Membrane mask crop: int8 {0,1}.
    Annotation sets 100-105 are ground truth (metadata ground_truth_status true, e.g. 100 ferritin_complex, 46 objects;
    ndjson 45 lines, 4,838 B); 107-117 are automated predictions (113 cytosolic_ribosome: ground_truth_status false),
    so the sample now uses set 100. Several particle-class masks also exist per run (listing).'
