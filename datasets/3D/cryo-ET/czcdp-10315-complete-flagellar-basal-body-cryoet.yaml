notes: 'API: 40 annotations in 40 runs of datasets 10062, 10064, 10065, 10069, 10074, 10075 (L. pneumophila) and 10102 (P.
  mirabilis); voxel spacings 13.059, 15.6 and 16.8 A; all manual, ground-truth flagged. Related to deposition 10302 (partial
  basal bodies). Portal GraphQL API (annotations filtered by depositionId) gives the counts, organisms and voxel spacings;
  the per-annotation S3 metadata JSON gives method, software, shape type and authors. No publication or DOI is listed for
  the deposition on the portal, so publications is empty and no paper was read. License: the portal''s data submission policy
  states that published data is available under CC0. Tomogram voxel sizes differ between datasets (stated in the portal as
  VoxelSpacing in angstrom), so voxel_size_nm is null; download is via the portal/S3 per run. Files were not opened.'
