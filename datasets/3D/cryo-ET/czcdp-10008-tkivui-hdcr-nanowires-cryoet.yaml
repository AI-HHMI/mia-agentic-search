notes: 'Portal dataset 10008 (related entry EMPIAR-11058) has 20 run folders; the full S3 listing (4,436 objects, 110.2 GB
  including raw frames) shows only 8 runs with reconstructed tomograms (14.08 A, 1.6 GB each) and annotations, so n_items is
  8. Annotations per run: HDCR filament oriented points (92 objects in run 3) and cytosolic ribosome oriented points (2,104
  in run 3), both ground_truth_status true (STOPGAP template matching, manual filtering, 3D classification); membrane masks
  (TARDIS, automated, deposition 10301) and a membrain-seg prediction (deposition 10303) are automated. The paper is not
  open access (Europe PMC gives only the abstract), so Methods were not read; strain, grid and vitrification come from the
  portal metadata. License is the portal policy (CC0).'
