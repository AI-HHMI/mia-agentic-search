notes: 'Portal dataset 10008 (related entry EMPIAR-11058) has 20 run folders. Annotations per run: HDCR filament oriented
  points (92 objects in run 3) and cytosolic ribosome oriented points (2,104 in run 3), both ground_truth_status true (STOPGAP
  template matching, manual filtering, 3D classification); membrane masks (TARDIS, automated, deposition 10301) and a membrain-seg
  prediction (deposition 10303) are automated. The paper is not open access (Europe PMC gives only the abstract), so Methods
  were not read; strain, grid and vitrification come from the portal metadata. License is the portal policy (CC0). enricher:
  the portal API lists 20 tomograms (14.08 A, all runs), so n_items is 20 and the description says twenty (was 8 from an earlier
  listing); size from a complete S3 listing (293.4 GB, was 110.2 GB); tomograms are denoised (API).'
