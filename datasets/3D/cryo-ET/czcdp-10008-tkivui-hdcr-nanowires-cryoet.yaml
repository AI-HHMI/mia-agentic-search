description: Twenty cryo-electron tomograms of FIB-milled lamellae of Thermoanaerobacter kivui cells (14.08 A voxel spacing)
  within a 20-run portal dataset, annotated with oriented points for membrane-anchored hydrogen-dependent CO2 reductase (HDCR)
  filaments and cytosolic ribosomes (STOPGAP template matching with manual filtering and 3D classification), plus membrane
  segmentations.
