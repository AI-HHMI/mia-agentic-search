notes: 'Data is simulated, not real cryo-ET. Dataverse lists three zips: contest dataset (6.84 GB, without
  test ground truth), difference dataset (199 MB, test ground truth and evaluation script) and the full
  dataset (7.03 GB); size_bytes sums the three, so it double counts the contest and full sets. enricher:
  zips listed and readme read; formats MRC + txt (was other), annotations confirmed; download_url = full
  archive (was null). The paper PDF (Eurographics) returned 403 and the paper tool found no full text,
  so voxel size, tomogram size and particle counts come from the track page and the Dataverse abstract;
  noise level, tilt geometry and the simulator were not stated. Ground truth comes from the simulation,
  hence source automatic. Related to but distinct from the TomoTwin simulated dataset in the catalog.'
