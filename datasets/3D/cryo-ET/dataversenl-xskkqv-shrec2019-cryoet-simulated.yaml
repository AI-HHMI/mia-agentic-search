title: SHREC Cryo-ET 2019 - simulated cryo-electron tomograms for particle localization and classification
short_name: SHREC 2019 simulated cryo-ET particle benchmark
description: Ten simulated cryo-electron tomograms (512 x 512 x 512 voxels at 1 nm) of a cell-like volume,
  each with about 2,500 particles of 12 protein types (PDB 1bxn, 1qvr, 1s3x, 1u6g, 2cg9, 3cf3, 3d2f, 3gl1,
  3h84, 3qm1, 4b4t, 4d8q), with projections, ground-truth volumes and particle location and class lists
  for nine tomograms; the tenth is the withheld test tomogram, whose ground truth is in a separate difference
  archive.
