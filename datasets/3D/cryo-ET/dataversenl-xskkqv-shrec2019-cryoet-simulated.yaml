notes: 'Data is simulated, not real cryo-ET. Dataverse lists three zips: contest dataset (6.84 GB, without test ground truth), difference dataset (199 MB, test ground truth and evaluation script) and the full dataset (7.03 GB); size_bytes sums the three, so it double counts the contest and full sets. The zips could not be listed (connection reset on range requests), so file formats and the exact ground-truth encoding were not confirmed, hence formats other and annotations_verified false; the track page describes the ground truth as a volume plus a particle location and class file. The paper PDF (Eurographics) returned 403 and the paper tool found no full text, so voxel size, tomogram size and particle counts come from the track page and the Dataverse abstract; noise level, tilt geometry and the simulator were not stated. Ground truth comes from the simulation, hence source automatic. Related to but distinct from the TomoTwin simulated dataset in the catalog.'
