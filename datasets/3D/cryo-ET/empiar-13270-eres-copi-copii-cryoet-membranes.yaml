notes: 'HTTP index of ERES_Paper/: denoised/ 63 MRC (45.3 GB), predictions/ 63 MRC (28.4 GB), frames/
  2641 MRC (610 GB), job001 STAR, mdoc_correctedFractions 63. EMPIAR: "Membranes were segmented using
  membrain-seg v2"; the paper (full text read) says tomograms were denoised with WarpTools and segmented
  with MemBrain-seg, and coated membranes were also segmented manually in Segger (those manual labels
  are not in the listing). So the labels are automatic predictions, not curated ground truth. Voxel 1.0
  nm (10 A per EMPIAR, file names and headers). License CC0 on the EMPIAR page. The paper preprint title
  differs from the EMPIAR citation title. enricher: size_bytes from EMPIAR dataset_size 637.7 GB (GiB;
  HTTP index 684.0 GB decimal) (was null).'
