description: 63 denoised cryo-ET tomograms (896 x 896 x ~448 voxels, 10 A voxels) of cryo-FIB-milled human RPE-1 cell lamellae
  targeted to ER exit sites by cryo-CLEM, paired with 63 MemBrain-seg v2 membrane segmentation volumes. The entry also
  deposits the raw frames (2.24 A pixels), mdoc files and a ribosome particle STAR file.
