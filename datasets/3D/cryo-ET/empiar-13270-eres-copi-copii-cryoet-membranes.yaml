notes: 'HTTP index of ERES_Paper/: denoised/ 63 MRC (45.3 GB), predictions/ 63 MRC (28.4 GB), frames/ 2641 MRC (610 GB), job001 STAR,
  mdoc_correctedFractions 63. EMPIAR describes the predictions as "Membranes were segmented using membrain-seg v2"; the paper
  (full text read) states tomograms were denoised with the WarpTools denoiser and segmented with MemBrain-seg, and that coated
  membranes were additionally segmented manually in Segger (those manual labels are not in the file listing). So the
  labels here are automatic predictions, not curated ground truth. One denoised tomogram and its prediction were header-probed: 448 x 896 x 896, voxel 1.0 nm
  (10 A, matching the EMPIAR entry and file names), prediction int8 values 0-43 (probably per-component IDs; encoding not documented). The denoised
  float16 tomograms are the training-ready images; the raw frames are huge. License shown as CC0 on the EMPIAR page.
  The paper preprint title differs from the EMPIAR citation title.'
