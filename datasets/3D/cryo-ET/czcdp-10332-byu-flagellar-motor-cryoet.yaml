description: Point annotations of bacterial flagellar motors in cryo-electron tomograms, released as the
  training split of the Kaggle 'BYU - Locating Bacterial Flagellar Motors' challenge and used as MotorBench
  in the POPSICLE benchmark (1,559 training tomograms; a separate test deposition CZCDP-10347 has 843
  tomograms). Annotations were produced with a 3D U-Net ensemble followed by manual curation in napari.
