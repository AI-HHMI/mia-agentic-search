notes: 'Train split is deposition CZCDP-10332 (1,559 annotations; the deposition holds only annotations
  on existing portal tomograms). Test split: CZCDP-10347. CC0 stated for POPSICLE datasets in the arXiv
  paper, not on the deposition page. enricher: organism from the deposition page organismName values (15
  species; was Campylobacter, Vibrio cholerae). organisms: Campylobacter jejuni = dataset 10212 (dataset_metadata.json);
  the other source datasets were not resolved to IDs (GraphQL unreachable); one organism per <dataset>/
  folder. enricher: annotations.source proofread (annotation metadata: "3D UNet ensemble -> Napari manual
  annotation", hybrid, ground truth; was mixed). enricher: coverage: one point file per annotated run
  (1 point in run mba2012-01-13-1); whether runs without motors are included is not stated. Voxel size
  varies by source dataset (15.6 A for 10212), so left null.'
