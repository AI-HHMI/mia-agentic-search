notes: 'EMPIAR API: raw frames + .mdocs (2,028 items, 3.52 A pixel), 18 denoised tomograms (MRC, 14.08 A) and 9 MemBrain-seg
  membrane segmentations (MRC). Entry size 303.9 GB; per-set sizes not listed, so size_bytes is null. Segmentations
  are nnU-Net predictions with manual cleaning (mixed). PSII positions: 14,433 PSII, 937 cytb6f, 5,934 unknown on 303
  membranes, manually corrected (paper Methods). Zenodo companion zip lists 656 .star, 412 .nii.gz, 328 .obj files.
  CC0 stated on the EMPIAR page; z voxel size not stated in the API.'
