notes: 'EMPIAR API: raw frames + .mdocs (2,028 items, 3.52 A pixel), 18 denoised tomograms (MRC, 14.08 A) and 9
  MemBrain-seg membrane segmentations (MRC). Entry size 303.9 GB; per-set sizes not listed, so size_bytes is null.
  Segmentations are nnU-Net predictions with manual cleaning (mixed). PSII positions: 14,433 PSII, 937 cytb6f, 5,934
  unknown on 303 membranes, manually corrected (paper Methods). Zenodo companion zip lists 656 .star, 412 .nii.gz,
  328 .obj files. CC0 stated on the EMPIAR page. enricher: file listing and MRC headers checked; formats unchanged.
  enricher: z voxel 1.408 nm (was null): paper (PMC12425480) gives 3D distances in bin4 voxels ("21 bin4 voxels,
  corresponding to 29.6 nm"), i.e. isotropic 1.41 nm; EMPIAR API gives 14.08 A xy. source mixed: segmentations/*.mrc
  are MemBrain-seg (nnU-Net) predictions, the .star particle positions were manually corrected. coverage partial:
  9 of 18 tomograms have a membrane segmentation.'
