notes: 'Zenodo v1 (2025-07-14, 30 files, 7.15 GB): ten tomograms (50, 167, 298, 649, 909, 929, 2162, 2803, 2836, 2917) as Tomo_<n>.tiff
  (uint8, 1024 x 1024 pages, uncompressed per probe; page axis unstated) plus a ZIP of binary label volumes per tomogram and a
  partly repeated figure-specific ZIP. Voxel size not stated for these exports (paper: nominal 1.96 A, 7.84 A at 4x binning; binning
  of these TIFFs not verified), so null. Labels are those shown in paper Figures 2 and 3 (Amira and Dragonfly U-nets, MemBrain-seg,
  particle map-backs), so only some structures per tomogram, hence source mixed and coverage partial. Full 1,829-tomogram raw data
  is EMPIAR-11830 and the comprehensive segmentations are CryoET Data Portal deposition 10314; this is a small separate subset.
  Sources checked: Zenodo page and API, two ZIP listings, probe of one tomogram, paper full text (bioRxiv).'
