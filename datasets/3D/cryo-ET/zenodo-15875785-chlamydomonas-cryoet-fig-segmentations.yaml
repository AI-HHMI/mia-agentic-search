notes: 'Zenodo v1 (2025-07-14, 30 files, 7.15 GB): ten tomograms Tomo_<n>.tiff (512x1024x1024; uint8, Tomo_167 float32) and per tomogram
  a ZIP of binary label volumes plus a mostly duplicate figure ZIP (_figN_X). Tomogram numbers and shapes match EMPIAR-11830 bin4 reconstructions
  (cryocare_bin4/<n>.mrc, 512x1024x1024), whose headers give different voxel sizes: 7.28 A (50, 167), 7.60 A (298), 7.84 A (649, 909,
  929, 2162, 2803, 2836, 2917); EMPIAR states 7.84 A for the set. So voxel_size_nm stays null. Labels are those shown in paper Figs
  2-3: Amira/Dragonfly U-net predictions, MemBrain-seg membranes and STA particle map-backs, so only some structures per tomogram (coverage
  partial). enricher: annotations.source mixed -> automatic (all from networks or map-backs, paper Methods: Segmentation).'
