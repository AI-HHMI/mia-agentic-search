notes: 'API: 100 annotations in 100 runs, object ''cytosolic ribosome'', VoxelSpacing7.560 A (0.756 nm), methodType ''automated''
  (template matching + classification filtering). Same tomograms as the membrane masks of deposition 10304 (separate record).
  Portal GraphQL API (annotations filtered by depositionId) gives the counts, organisms and voxel spacings; the per-annotation
  S3 metadata JSON gives method, software, shape type and authors. No publication or DOI is listed for the deposition on the
  portal, so publications is empty and no paper was read. License: the portal''s data submission policy states that published
  data is available under CC0. Download is via the portal/S3 per run. Files were not opened.'
