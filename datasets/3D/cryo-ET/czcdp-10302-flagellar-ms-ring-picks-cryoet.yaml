notes: 'API: 307 annotations, one per run (307 tomograms), object ''flagellar basal body, MS ring'', all methodType manual,
  ground-truth flagged; datasets 10043-10052, 10138, 10143, 10148, 10154, 10161; voxel spacings 16.1-19.7 A. Portal GraphQL
  API (annotations filtered by depositionId) gives the counts, organisms and voxel spacings; the per-annotation S3 metadata
  JSON gives method, software, shape type and authors. No publication or DOI is listed for the deposition on the portal, so
  publications is empty and no paper was read. License: the portal''s data submission policy states that published data is
  available under CC0. Tomogram voxel sizes differ between datasets (stated in the portal as VoxelSpacing in angstrom), so
  voxel_size_nm is null; download is via the portal/S3 per run. Files were not opened.'
