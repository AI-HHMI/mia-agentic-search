notes: 'Record covers the phantom benchmark spread over portal datasets 10440, 10441, 10445, 10446 (CC0 per the paper); landing page is
  DS-10440 only (7 runs, 28 tomograms, 126 annotations, voxel spacing 1.0012 nm as listed on the portal; raw pixel size in the paper
  is 0.151 nm, tomograms are binned). Total 492 tomograms and ~60,000 labels come from the paper; the arXiv POPSICLE paper describes
  a 7 train / 485 test split. Annotations are acknowledged incomplete by the authors. Organisms/species sources inferred from the paper Table 1
  (human ribosome, bovine thyroglobulin, E. coli beta-galactosidase, equine apoferritin, sweet potato beta-amylase, PP7 phage VLP - the VLP is not
  listed as an organism). Annotation file listing not browsed directly; annotations_verified false. Sources checked: portal dataset page, paper full text, POPSICLE arXiv.'
