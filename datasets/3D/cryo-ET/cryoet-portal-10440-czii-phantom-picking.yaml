schema_version: '1.1'
id: cryoet-portal-10440-czii-phantom-picking
title: Experimental cryo-ET phantom dataset with ground-truth particle annotations for six molecular species (CZII CryoET Object Identification Challenge)
short_name: Cryo-ET phantom particle picking (lysate)
description: Experimental cryo-ET phantom of a lysate mixed with purified proteins and virus-like particles, released as a benchmark
  for particle picking. Of 1,070 collected tilt series, 492 tomograms were retained and annotated with ~60,000
  ground-truth point labels for six species (80S ribosome, PP7 VLP, thyroglobulin, beta-galactosidase, apoferritin,
  beta-amylase). Seven annotated tomograms served as training data in the Kaggle challenge, the rest as test data.
