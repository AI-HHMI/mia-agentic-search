notes: 'Portal page lists 7 runs / 28 tomograms at 10.012 A voxel spacing (bin-shown reconstructions); paper Methods
  give 1.51 A raw pixel size for the collected data. Voxel size recorded is the portal page''s 10.012 A (1.0012
  nm). Paper reports ~60,000 ground-truth particles across all 492 phantom tomograms (train + public + private test);
  train-set per-class counts not verified. Authors not extracted from fetched pages. File formats (OME-Zarr tomograms,
  MRC) from paper Methods and portal description, not from a file listing. CC0 stated in paper. Sources checked:
  portal page, paper full text (PMC), POPSICLE arXiv page. enricher: complete S3 listing of dataset 10440 (5407
  files, 132.0 GB incl. 21.4 GB EER frames); annotation files seen and sampled; run TS_5_4 also has 4.99 A tomograms.'
