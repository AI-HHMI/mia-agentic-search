title: CZII CryoET Object Identification Challenge - experimental phantom training data (DS-10440)
short_name: CryoET phantom lysate particle picking (cryo-ET)
description: Experimental cryo-ET phantom of lysosome-enriched HEK293T lysate spiked with six protein species (apo-ferritin,
  beta-amylase, beta-galactosidase, 80S ribosome, thyroglobulin, PP7 virus-like particle), with hand-curated point
  annotations of particle centres. Released as the training set (7 runs) of the CZII CryoET Object Identification
  Challenge; public and private test sets are separate portal datasets.
