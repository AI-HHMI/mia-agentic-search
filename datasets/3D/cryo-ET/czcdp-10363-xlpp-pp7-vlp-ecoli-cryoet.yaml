notes: 'Portal GraphQL: deposition 10363 (released 2026-09-11) has 315 annotations in 107 runs of datasets
  10518 (147 annotations, xLPP off), 10519 (90) and 10520 (78); all virus-like capsid, 208 hybrid and
  107 automated; no manual sets. Tomograms come at 10.403 A (886x630x246; raw, filtered, denoised) and
  5.003 A (1842x1310x512). No publication is linked to the deposition, so no paper was read. Labels are
  algorithmic (Octopi, subtomogram averaging), not expert ground truth, and the deposition is aimed at
  comparing phase-contrast conditions. Related to czcdp-10336 (the same PP7 VLP sample type, a different
  experiment). License from the portal policy (CC0). enricher: all 315 annotations sit on the 5.003 A
  filtered tomograms, so voxel size 0.5003 nm (was null); membrane masks belong to another deposition,
  types now points only; size from API file sizes.'
