title: Crossed laser phase plate (xLPP) tomography of PP7 virus-like particles in E. coli (CZ portal 10363)
short_name: xLPP vs defocus PP7 VLP picks (cryo-ET)
description: Three matched cryo-ET datasets collected back-to-back on one grid of E. coli overexpressing PP7 virus-like
  particles (xLPP off at 2-3 um underfocus, xLPP on at 2-3 um, xLPP on at 0.5-1.5 um), deposited on the CZ cryoET
  portal with AreTomo3 reconstructions, oriented PP7 capsid positions (Octopi prediction, RELION 5 subtomogram
  averaging) and membrane segmentation masks for 107 runs.
