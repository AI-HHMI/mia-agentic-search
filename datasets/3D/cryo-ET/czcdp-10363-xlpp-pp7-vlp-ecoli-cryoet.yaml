notes: 'Portal GraphQL: deposition 10363 (released 2026-09-11) has 315 annotations in 107 runs of datasets 10518
  (147 annotations, xLPP off), 10519 (90) and 10520 (78); all virus-like capsid, 208 hybrid and 107 automated; no
  manual sets. Tomograms come at 10.403 A (886x630x246; raw, filtered, denoised) and 5.003 A (1842x1310x512),
  so the voxel size varies and is left null. S3 listing of run pt117_ts_001 in dataset 10518 shows
  Annotations/100/membrane-1.0_segmentationmask.mrc plus tomograms and alignments. No publication is linked
  to the deposition, so no paper was read. Labels are algorithmic (Octopi, subtomogram averaging), not expert ground
  truth, and the deposition is aimed at comparing phase-contrast conditions. Related to czcdp-10336 (the same PP7 VLP
  sample type, a different experiment). License from the portal policy (CC0). Total size not computed.'
