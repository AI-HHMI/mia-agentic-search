notes: 'size_bytes is the sum of the three Zenodo zips (cmm_files 1.46 MB, denoised_tomos 649 MB, trained_networks
  536 MB). denoised_tomos.zip holds 27 .mrc files listed by peek_archive (17 tension_NN, 10 compression_NN).
  Voxel size 0.96 nm is the pixel size the paper Methods give for in vitro tomograms (9.6 A after binning
  by 4); the MRC headers were not read. The tomograms are the outputs of a denoising autoencoder, not
  raw reconstructions, and the raw tilt series are not in this record. Filament traces are manual centre-line
  picks (Chimera marker sets) smoothed with splines, per Methods; the number of traced filaments per tomogram
  is not stated. Machine-learning use is limited: denoising networks are included, but no paired noisy/clean
  data; ml.tasks other. Organism taken from the paper (chicken skeletal actin); authors not listed in
  the Zenodo API record checked. enricher: MRC headers read (float32, no voxel size stored); 128 .cmm
  traces.'
