notes: 'Paired label-free (Phase3D) to fluorescence (nuclei, membrane) image-translation data for virtual staining. enricher:
  the VSCyto2D test zips (a549/bj5a *_test, no_pertubation_Phase1e-3-9x3x3_binned) carry instance-segmentation channels (nuclei_segmentation,
  cell_segmentation; Nuclei-Labels), so annotations.present is now true (was false); other zips hold images only. Paper: segmentations
  human-corrected (napari annotator), hence source proofread. organisms: Homo sapiens = VSCyto2D/, VSCyto3D/; Danio rerio
  = VSNeuromast/. Voxel size differs per zip (OME scale, z/y/x nm): VSNeuromast 330/108/108 and 330/202/202, VSCyto3D test
  HEK 400/325/325, VSCyto2D bj5a train 994/323/323, a549 timelapse 2000/325/325; other zips uncalibrated (identity), so voxel_size_nm
  stays null. License: BioStudies CC BY 4.0 (preprint page links CC BY-NC 4.0).'
