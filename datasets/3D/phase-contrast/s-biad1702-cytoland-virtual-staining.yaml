notes: 'Usable as paired label-free to fluorescence image-translation data (virtual staining), not as segmentation
  labels: no mask files were seen in the listing (VSCyto2D train/test, VSCyto3D train/test, VSNeuromast train/test,
  all OME-Zarr zips; the VSNeuromast test zip was opened with peek_archive and holds zarr arrays only), so annotations.present
  is false. The paper says the nuclei/cell test segmentations were proofread, but these are not in the listing.
  Total size is the HTTP-index estimate (about 1.3 TB, rounded). Pixel/voxel size is only given in the paper as
  camera pixel sizes (6.5 um, 4.6 um) with resampling and 2.1x downsampling, not as a per-dataset voxel size, so
  it is left null. Paper full text (bioRxiv XML) says the training datasets would be shared via a public archive;
  this study is that archive. The BioStudies record states CC BY 4.0 while the preprint page links CC BY-NC 4.0;
  the archive record was used.'
