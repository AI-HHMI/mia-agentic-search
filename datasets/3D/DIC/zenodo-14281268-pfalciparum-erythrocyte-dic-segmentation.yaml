notes: 'Three zips: parasite_labelled (47 stacks; mask-r ring, mask-ts trophozoite/schizont), rbc_labelled (64 stacks in valid1-3)
  and wholelife_unlabelled (38 time-lapse tifs, no GT). results/ folders hold Cellpose CV predictions (.h5) and metrics (.pkl).
  Voxel size 0.079 um x 0.25 um z from paper Methods; ImageJ headers agree (79.23 nm, spacing 0.25 um). Ground truth: erythrocytes
  by ilastik carving on CellBrite fluorescence, parasites manual in Imaris (hence mixed: rbc_labelled = automatic-assisted
  carving, parasite_labelled = manual). organisms: every file shows human erythrocytes (Homo sapiens), infected ones contain
  P. falciparum; not separable by folder. enricher: GT is channel 1 of the same TIFF as the DIC raw (repo utils.tif_to_h5:
  img[:,0]=data, img[:,1]=seg).'
