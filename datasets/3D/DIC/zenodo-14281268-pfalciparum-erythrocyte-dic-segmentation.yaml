notes: 'Three zips: parasite_labelled (47 stacks, 557 files; mask-r ring and mask-ts trophozoite/schizont folders, .tif and
  .h5), rbc_labelled (64 stacks, 764 files; train/valid folders with *_merge.tif and .h5) and wholelife_unlabelled (8 GB uncompressed,
  whole life cycle time-lapses, no labels). Counts of 64 + 47 labelled stacks are from the paper; the zip index shows 47 tif
  in parasite_labelled and 64 *_merge.tif in rbc_labelled. Voxel size is the acquisition pixel size 0.079 um with 0.25 um
  z-steps from the paper Methods; the DIC images are 3D Airyscan-processed. Ground truth: erythrocytes by ilastik carving
  on CellBrite fluorescence, parasites by manual labelling in Imaris (hence mixed). Exact meaning of .h5 files (predictions,
  folds) not examined.'
