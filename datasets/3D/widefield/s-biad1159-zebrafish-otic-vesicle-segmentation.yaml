notes: 'Counts come from the two file lists: 11,052 images (Nikon 5,846 and Leica 5,206; brightfield,
  GFP and mCherry channels), 240 masks, and an is_training_data column marking 240 images (51 of the 254
  stacks) as training data, which are exactly the 240 images that have masks. The masks are described
  as manually created by the depositors (study metadata, annotation method expertly annotated); the paper
  retrained its deep-learning segmentation model on data from both microscopes, but the mask-making procedure
  was not read in detail. The remaining images are unlabelled and include the test experiments. Dimensionality
  is 3D because the files are z-slices of stacks (a slice column). Pixel size and z spacing were not found.
  The paper is open access; its Data availability statement points to this deposit. enricher: size from
  BIA file lists.'
