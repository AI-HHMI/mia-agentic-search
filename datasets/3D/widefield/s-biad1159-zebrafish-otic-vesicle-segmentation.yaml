short_name: Zebrafish otic vesicle infection (widefield)
description: 11,052 widefield TIFF slices (brightfield, GFP and mCherry channels; 254 z-stacks from a Leica DMi8 and a Nikon Eclipse Ti2-E) of 2-day-old zebrafish
  with Pseudomonas aeruginosa, Acinetobacter baumannii and Klebsiella pneumoniae injected into the otic vesicle singly or in pairs, with 240 manually created
  segmentation masks (otic vesicle and enclosed calcite dots) for the slices flagged as training data.
