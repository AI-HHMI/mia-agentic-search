    stack member is 674 MB compressed, over the 500 MB budget, so value_range is unknown. ROI zips of
    AV203 read in full (1,765 B): 12 ROIs each (Box: 10 polygons + 2 rectangles incl. a whole-section
    bregma ROI; Point: 11 points + 1 rectangle). Channel identities are not stated. Labels are very sparse
    (about 12 area markers per brain). voxel size not found; checked: TIFF tags + ImageJ description,
    Zenodo API record and description, paper Methods (10x slide scanner, 100 um sections, no pixel size),
    ASC header (Neurolucida Resolution 5.987 refers to the tracing images, not these stacks). download_url:
    no single archive; the five AV#.zip files and the ASC files are direct Zenodo links (see listing).'
