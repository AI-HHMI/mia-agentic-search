notes: 'Only AV198.zip was listed with peek_archive: AV198_stack.tif (3.2 GB), ROI_Box.zip, ROI_Point.zip
  and PDFs of coronal sections on Paxinos drawings; the other four zips are assumed to share this layout
  per the Zenodo description. Voxel/pixel size and z-spacing not stated on the Zenodo record, in the paper
  Methods (10x slide scanner, 20x confocal; section thickness 100 um) or the file listing. Annotations
  are sparse: projection-area ROIs and 15 neuron tracings, not dense masks; no tracing images are included.
  Tracing .ASC files are 3D neuron skeletons. n_items counts 5 stacks + 15 tracings. Paper full text read
  via Europe PMC. enricher: modality confocal removed (the deposited stacks are the slide-scanner whole-brain
  series; no confocal images in the files); channels 2 from TIFF header; annotation types from the ROI
  files (rectangles/polygons + points). enricher: all five AV zips listed, same layout confirmed.'
