  z-spacing not stated on the Zenodo record, in the paper Methods (10x slide scanner,
  20x confocal; section thickness 100 um) or the file listing. Annotations are sparse:
  projection-area ROIs and 15 neuron tracings, not dense masks; no tracing images
  are included. Tracing .ASC files are 3D neuron skeletons. n_items counts 5 stacks
  + 15 tracings. Paper full text read via Europe PMC.'
