notes: 'Four files - Zstacks.zip (3.97 GB, 44 Zeiss .zvi stacks of about 150 MB), MaxIntensityProjections.zip (211 MB, 44 .zvi),
  ManualPeroxisomeCounts.csv (about 8,300 rows of per-cell counts from two counters) and ImageAndStrainTable.csv - so
  download_url is null and size_bytes is the sum. ZVI is not in the schema format list, hence other. The counts are per cell
  but cell identifiers only reflect counting order, so they cannot be matched to specific cells or to masks; this is a
  validation set for an image-analysis tool, usable for count regression or evaluation rather than segmentation training.
  X/Y pixel size is not stated in the Zenodo description or in the paper text read (100x objective, AxioCam HRm camera), so voxel_size_nm is null; the Z spacing of 0.204 um is stated. Stacks are 14-bit per the paper. ml.tasks is other (counting).'
