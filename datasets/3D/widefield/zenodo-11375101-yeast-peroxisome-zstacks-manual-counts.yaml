title: Manual quantification of peroxisome counts in yeast from 2-channel fluorescence Z-stacks
short_name: Yeast peroxisome counts (widefield Z-stacks)
description: 44 two-channel widefield fluorescence Z-stacks (26 slices, 0.204 um spacing) of Saccharomyces cerevisiae wild type and
  peroxisome-defect mutants - calcofluor white for cell outlines and GFP-PTS1 for peroxisomes - with per-cell peroxisome
  counts made manually by two counters on deconvolved maximum-intensity projections (provided too). Released to validate
  the perox-per-cell software.
