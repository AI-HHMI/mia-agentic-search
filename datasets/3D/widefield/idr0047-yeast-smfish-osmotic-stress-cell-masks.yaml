notes: 'Size and count are the sums of the paper table: 63+64+72+71+67 = 337 stacks, 55.46+53.71+59.66+56.23+52.38 = 277.4 GB. The paper says the same data are also in BioImage Archive S-BIAD1 and a Dropbox
  folder. Masks are automatic (DAPI/brightfield thresholds chosen manually per stack). xy pixel size not stated in the study file or paper text read (IDR metadata of sampled image has none), so xy left
  null. z spacing is 200 nm per the study file; voxel_size_nm left null because x/y is unknown. enricher: mask TIFFs found on EBI FTP (annotations_verified true); Exp1_rep1 has analysed files for 6 of its
  stacks only (0,10,...,50 min, im1), so coverage partial (was dense).'
