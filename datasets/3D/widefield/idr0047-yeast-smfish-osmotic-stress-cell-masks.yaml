notes: 'Size and count are the sums of the paper table: 63+64+72+71+67 = 337 stacks, 55.46+53.71+59.66+56.23+52.38 = 277.4
  GB. The paper says the same data are also in BioImage Archive S-BIAD1 and a Dropbox folder. Mask ROIs were seen through
  the IDR API on sampled images (list capped at 200 per request); that they are cell/nuclear masks is inferred from the paper
  and study protocol (segmented nuclear and cell boundary masks), not checked shape by shape. Masks are automatic (DAPI/brightfield
  thresholds chosen manually per stack). xy pixel size not stated in the study file or paper text read (IDR metadata of sampled
  image has none), so xy left null. Cell-level coverage per image not verified. z spacing is 200 nm per the study file; voxel_size_nm
  left null because x/y is unknown.'
