schema_version: '1.2'
id: idr0047-yeast-smfish-osmotic-stress-cell-masks
title: A microscopy data set of discrete spatial and temporal single molecule RNA expression in single cells (idr0047)
short_name: Yeast smFISH z-stacks with cell masks (widefield)
description: 337 widefield z-stacks (2048x2048 px, 25-26 planes at 200 nm; brightfield, DAPI, TMR and Cy5 channels) of S.
  cerevisiae BY4741 fixed at 16 time points after 0.2 M or 0.4 M NaCl stress, with smFISH for STL1 and CTT1 mRNA. Cell and
  nuclear segmentation masks (from brightfield and DAPI, thresholds set by eye) are stored as mask ROIs in the IDR, plus segmented
  and processed RNA images and per-cell RNA counts.
