notes: 'Mixed study: LM = quapos_lm/ (Zeiss Apotome 20x z-stacks, TIFF + CZI); TEM = quapos_tem/ (5000x BMP + ImageJ .roi,
  287.5 px/um = ~3.48 nm). First modality and 3D describe the LM part. voxel_size_nm left null because the subsets differ:
  LM original stacks 322.5 x 322.5 x 490 nm (ImageJ header; paper: 1 px = 0.323 um), TEM ~3.48 nm/px. Annotated LM training
  set: 21 crops with sparse labels (~100 px per class in 3 z-slices); test set: 7 crops fully annotated in 3 z-slices by two
  persons. BMP/ROI/CZI-only parts are not representable in data.formats. enricher: size 48.87 GB summed from the 10 BioStudies
  file lists (was null); download_url set to the HTTPS file tree (was null).'
