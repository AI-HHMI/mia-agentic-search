notes: 'Mixed study: LM (Zeiss Apotome 20x, Z-stacks) and TEM (5000x, 287.5 pixels per um) parts are listed together; the first
  modality and 3D dimensionality describe the LM part. Pixel/voxel size is not stated for LM (zoom varies per image) and the
  paper gives 287.5 px/um only for TEM (about 3.5 nm), so voxel_size_nm is left null. File listings (BioStudies file lists):
  LM training 84 TIFFs / 1.8 GB and test 84 TIFFs / 1.8 GB (original, normalised and annotation folders; 21 annotation TIFFs
  in the training set), 105 CZI Z-stack files (25.7 GB) in the developmental series; TEM development 74 BMP images with ROI
  zips and degeneration 13 BMP images with ROI zips. BMP/TXT/ROI files are not representable in data.formats. Total size and
  item count not computed. Sparse (100 pixels per class per image) training labels on the LM part.'
