id: s-biad1078-mouse-retina-photoreceptor-outer-segments
title: Automated quantification of photoreceptor outer segments in developing and degenerating retinas on microscopy images
  across scales
short_name: Mouse retina photoreceptor outer segments (LM/TEM)
description: Light-microscopy and TEM images of mouse retinal sections for quantifying photoreceptor outer segments (POS).
  The light-microscopy part has S-opsin-stained Z-stacks with a 21-image training set (sparse hand-drawn signal/background
  pixel labels, napari) and a test set annotated in three Z-sections by two annotators, plus unprocessed CZI series; the TEM
  part has 5000x images of POS with hand-drawn ImageJ ROIs for wild type development and for degeneration (WT, RhoKO, rd19).
