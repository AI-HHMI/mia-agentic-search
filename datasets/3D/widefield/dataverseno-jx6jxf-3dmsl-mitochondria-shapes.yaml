notes: 'Synthetic microscopy: images are simulated (PSF and noise model) from mitochondria shapes segmented in published mouse-liver FIB-SEM data (masks verified and corrected by the source authors); no real optical images. Ten ~8.5 GB zips (~85 GB, 27,272 instances) on DataverseNO; zips not listed (no readable index), so layout is from the README. Simulated systems have different pixel sizes (48, 70, 109 nm per paper table; folder mapping unverified), so voxel size is null. Mesh, point cloud and occupancy formats are described under annotations.format. Per-file download ids (e.g. datafile 231793 = 1_1_2729.zip), so download_url is null.'
