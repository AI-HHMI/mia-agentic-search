notes: 'Files per Zenodo record: out_{c00,c90}_{dr10,dr90}_image.tif (13.3 MB each), matching *_label.tif (21.5 MB each), PSF_widefield_0.75NA_1.0ri_300nm_1400nm.tif/.ics. Meaning of c00/c90 and dr10/dr90
