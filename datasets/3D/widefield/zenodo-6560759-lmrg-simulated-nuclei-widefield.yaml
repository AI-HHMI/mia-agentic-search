notes: 'Files per Zenodo record: out_{c00,c90}_{dr10,dr90}_image.tif (13.3 MB each), matching *_label.tif (21.5 MB each),
  PSF_widefield_0.75NA_1.0ri_300nm_1400nm.tif/.ics. Meaning of c00/c90 and dr10/dr90 is not defined on the record; number
  of nuclei and label encoding are not stated on the record, and the study GitHub README and a literature search found no
  paper, so they stay unknown. size_bytes is the sum of the listed file sizes (~173 MB). Labels are inferred to come from
  the simulation (source: automatic). Sibling record 6560910 (simulated confocal FISH in C. elegans) is a separate dataset
  not covered here. enricher: voxel size 123.806x123.806x200 nm from the image TIFF calibration (ImageJ), z agrees with ''z
  step = 0.2'' (um) in the study''s hl60 Cytopacq configs (was null); size_bytes from the Zenodo listing.'
