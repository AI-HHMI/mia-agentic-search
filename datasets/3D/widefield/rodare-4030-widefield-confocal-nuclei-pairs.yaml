  notes: 'Listing: tools/listing.py over all 6 files (zips expanded), 73,940,290,883 bytes, complete.
    Raw TIFFs are single 2D uint16 planes (probe could not read deflated members; sampled with tools/sample.py):
    widefield [290, 12447], confocal [38, 865] (one sample each). npz members read from their .npy headers
    only (no data downloaded, no unpickling): train/val/test hold w.npy/c.npy float32, confocal_widefield.npz
    holds w_img/c_img float64; the record page says npz values are normalized to 0-1. npz array shapes
    are per patch (leading patch axis left out). The api/files/... URLs do not answer range requests;
    the record/4030/files/<name> form does (206), so the sample uses that. Host rodare.hzdr.de is not
    on the TensorSwitch allowlist. No single archive holds the whole dataset, so download_url stays the
    landing page. Voxel size: z 700 nm applies to widefield and the npz patches; the raw confocal TIFFs
    have a 300 nm z step (paper Methods).'
