notes: 'Version 2 of the Rodare record (concept DOI 10.14278/rodare.2667; v1 = rodare.2668, only the 6.3 GB confocal_widefield.npz test sample of 600 patches). v2 lists 6 files, 73.9 GB: Confocal-20x.zip, Widefield-20x.zip (listed: 2880 TIFFs of 8.4 MB in ZStep folders), train.npz, val.npz, test.npz, confocal_widefield.npz. Stacks are 2048x2048 px = 699 um per side (xy ~341.3 nm, computed from those two stated numbers); widefield z step 0.7 um, confocal 0.3 um, confocal 92 planes downsampled to the 40 widefield planes, so z is given as 700 nm. Nikon 20x, ImageXpress Confocal, ex 405 / em 452 nm. The record text describes only the 600-patch set (shape [600,128,128,40]); the split npz files and Confocal-20x.zip were not opened. The paper trains on simulated data and uses this set only as a prospective test. Pairs are paired acquisitions, not manual labels. Checked: Rodare record pages and API (v1, v2), Widefield zip listing, paper Methods and Data availability.'
