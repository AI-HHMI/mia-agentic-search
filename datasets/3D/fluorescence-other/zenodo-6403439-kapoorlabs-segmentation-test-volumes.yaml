notes: 'Small bundle of test cases, not a full training set (zip listings via peek_archive): Nuclei3D.zip is one
  3D stack with Raw/GT/Prediction TIFFs, Nuclei_cell_mask.zip one 2D image with Raw/GT/Prediction, Ascadian_data_GT_model.zip
  one time point (206 MB) with GT, a VollSeg prediction and UNet weights; test_datasets_segmentation.zip lists raw
  TIFFs only. GT exists only for Nuclei3D, Nuclei_cell_mask and the ascidian time point; annotator, voxel size and
  species are not stated (source unknown). No paper is linked on the record. Dimensionality 3D reflects the largest
  volumes; two sets are 2D or 2D+t. enricher: annotation types from samples (instance IDs in Nuclei3D and ascidian
  GT, binary mask in Nuclei_cell_mask; was other). Pixel size differs by subset (Nuclei_cell_mask header 0.69 um,
  others uncalibrated), so voxel_size_nm stays null.'
