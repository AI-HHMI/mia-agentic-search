notes: 'Small bundle of test cases, not a full training set (zip listings via peek_archive): Nuclei3D.zip
  is one 3D stack with Raw/GT/Prediction TIFFs, Nuclei_cell_mask.zip one 2D image with Raw/GT/Prediction,
