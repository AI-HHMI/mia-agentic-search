notes: 'Zip listed with peek_archive: 126 files = 31 ND2 colour stacks, 62 .mat (processed colour stack
  and *_ID neuron files), 31 .qpdata QuPath segmentations. Segmentations are in QuPath format and were
  not inspected, so the segmentation type (instance vs points/ROIs) is an assumption from the description
  ("neuron segmentations", centroids). The .mat and .qpdata files are described in annotations.format.
  Source images come from Zenodo 4516655 (NeuroPAL microfluidic chip images, paper listed above; abstract
  read via Europe PMC only). enricher: voxel size 266.67x266.67x1500 nm and 5 channels from ND2 headers
  of a head and a tail stack (was null; not stated on the page); ND2 metadata: Plan Apo VC 60x WI objective,
  fluorescence, channels 405/488/640/488/561 nm. Annotation procedure not stated.'
