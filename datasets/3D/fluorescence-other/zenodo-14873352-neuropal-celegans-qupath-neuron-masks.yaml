notes: 'Zip listed with peek_archive: 126 files = 31 ND2 colour stacks, 62 .mat (processed colour stack and *_ID neuron files),
  31 .qpdata QuPath segmentations. Segmentations are in QuPath format and were not inspected, so the segmentation type (instance
  vs points/ROIs) is an assumption from the description ("neuron segmentations", centroids). The .mat and .qpdata files are
  described in annotations.format. Source images come from Zenodo 4516655 (NeuroPAL microfluidic chip images, also cited paper
  above). Voxel size and microscope settings are not stated on the dataset page; the paper is not open access in Europe PMC
  and bioRxiv full text was not read, so the specific microscope/modality (multicolour fluorescence, ND2) is not verified,
  so modality is the generic fluorescence-other. Annotation procedure not stated.'
