title: A Million-Scale, Difficulty-Stratified Optical-Microscopy Image Annotation for Neuron Reconstruction
short_name: Neuron tracing blocks with SWC (light microscopy)
description: Five representative subsets (28.1 GB in five zips) of a standardized dataset of 8,092,547 difficulty-graded 3D
  image blocks of mouse brain neurons. Each block is a TIFF volume with a gold-standard neuronal skeleton in SWC format,
  plus seed points and reconstruction direction information for tracing. The complete dataset is hosted in the HiNeuron Ver2
  database, outside this record.
