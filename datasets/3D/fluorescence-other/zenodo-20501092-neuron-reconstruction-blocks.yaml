notes: 'Zenodo record has no paper link; the arXiv preprint 2508.02059 (Chen et al., "A large-scale complexity-graded dataset
  of neuronal images and annotations", fMOST mouse brains, SparseTracer plus back-to-back manual verification, four difficulty
  levels, 13.57M blocks, voxel 0.32-0.35 um x 1-2 um in the paper) looks like the same project but its block counts differ
  (13.57M vs 8,092,547 here), so it is not listed in publications and the imaging modality (fMOST), organism and annotation
  source (proofread) are taken from it as a likely match. Voxel size for these five subsets was not verified. enricher: all
  five zips listed: 12,903 blocks of 101^3 uint16 with one SWC each (n_items). The arXiv authors include Mingwei Liao,
  the Zenodo uploader. Splits not provided. Full dataset is on the HiNeuron Ver2 portal (atlas.brainsmatics.cn), not fetched.'
