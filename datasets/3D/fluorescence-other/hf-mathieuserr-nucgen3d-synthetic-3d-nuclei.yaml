notes: 'Hugging Face card, repo tree (nucgen3D_v1.tar.gz 7.7 GB, noise.tar.gz 9.7 GB), GitHub README,
  bioRxiv PDF links and the Europe PMC abstract were read. The card states 40,000 3D images (~10 M nuclei)
  with "the labelisation" and noise templates; the first entries of the tar.gz (read by range request,
  first 6 MB) are nucgen3D_v1/images/nucgen_b{1,2}_sim_NNNNN.tif, 8 pages of 512 x 512, 8-bit (2,098,570
  bytes each). The label folder, mask format and encoding were not reached in that range, so annotations_verified
  is false. Synthetic data: no voxel size is defined for simulated volumes; none stated on the card, GitHub
  README or abstract. No licence stated on the card (no metadata licence field); the preprint carries
  CC BY 4.0 for the article only, so licence is unknown. The full text of the journal article is not open
  access (Europe PMC abstract only). enricher: size 17,422,295,598 B from HF file listing (was 17,422,289,781).'
