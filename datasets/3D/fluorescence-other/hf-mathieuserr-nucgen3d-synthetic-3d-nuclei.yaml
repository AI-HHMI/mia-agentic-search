title: NucGen3D - synthetic 3D fluorescence-like volumes of cell nuclei with ground-truth masks
short_name: NucGen3D synthetic 3D nuclei (fluorescence-like)
description: About 40,000 simulated 3D microscopy-like volumes of cell nuclei (roughly 10 million nuclei)
  generated procedurally from 2D Data Science Bowl 2018 nuclei, released with paired ground-truth masks
  for training and benchmarking 3D nuclear segmentation models. The same repository holds Perlin and anisotropic
  noise templates for realistic augmentation. Images are 8 x 512 x 512 8-bit TIFF volumes.
