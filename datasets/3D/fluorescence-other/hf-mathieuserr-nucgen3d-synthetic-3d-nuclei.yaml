  notes: 'Listing: Hugging Face API tree (4 files, exact sizes). The archives are gzip tars, so members
    cannot be listed or fetched without streaming from the start: I streamed the first 150 MB of nucgen3D_v1.tar.gz
    (member names only, 916 image TIFFs, no mask folder yet) and decoded the first 6 members from its
    first 700 KB; first 3 MB of noise.tar.gz for member names. Masks (~6.5 GB into the archive at ~164
    KB per compressed image) are out of the 500 MB sample budget, so their format, encoding and folder
    are unverified. The training code (nucgen3D/model/train_data_generator.py) reads <root>/images and
    <root>/masks with identical file names. value_range from 6 images: all span 0-255, means 1.1-5.8 (mostly
    empty background). Images are noiseless simulations (paper Methods); noise is added at training time
    from the noise templates. voxel size not defined: synthetic volumes; checked TIFF headers (1/1, no
    unit), HF card, GitHub README, bioRxiv full text (0.415x0.415x0.8 um is for the real evaluation data,
    not the simulations). No direct file per sample: only the two tar.gz archives.'
