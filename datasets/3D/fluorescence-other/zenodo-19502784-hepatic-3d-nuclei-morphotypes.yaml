notes: 'Zenodo README and file listing: raw_data.zip (4.8 GB, 15 TIFFs of about 1 to 1.2 GB each: images/, labels/,
  class/ for 5 volumes); preprocessed_data.zip holds single-nucleus patches (112^3) and masks with train/val/test
  assignments for leave-one-animal-out CV; the other archives are features, models and statistics. 14,385 nuclei
  in five classes; class labels are marker-assisted reference morphotypes. GitHub README: isotropic 0.3 um voxels,
  one volume per animal, data from Universidad de Concepcion. Microscope, how the instance labels were made, array
  shape and dtype are not stated (probe of the zip member failed), so source is unknown and modality is fluorescence-other.
  No paper is linked (the GitHub README cites only the 3DINO model paper). Related to catalogued zenodo-18517324
  (NucVerse3D, same lab, mouse liver at 0.3 um) but a different set: these are whole volumes of about 1 GB each
  with cell-type class volumes. size_bytes is the whole Zenodo record.'
