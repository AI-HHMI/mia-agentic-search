  notes: 'Listing: tools/listing.py of the Zenodo record with zip expansion (8 files, 29,326 zip members, 12,457,668,846
    B, complete). Raw: images/2.tif is an ImageJ TIFF (ImageJ=1.54p, slices=332, big-endian, uncompressed, no resolution
    tags), so axes zyx; read from its header and first 4 pages by range request, value_range [0, 65534] is from
    those 4 pages only. labels/2.tif and class/2.tif were sampled whole (tifffile-written plain multi-page TIFFs,
    shape [332, 874, 1671], uint16; axes zyx as they match the raw ImageJ z-stack). Member sizes of the 5 volumes
    differ (0.97 to 1.22 GB), so shape varies. Class codes from config/class_names.json in the GitHub repo. preprocessed_data.zip
    patches/masks (112^3 single-nucleus TIFFs) were not probed. Open: how the instance labels were made and the
    microscope (preprint full text not openly readable).'
