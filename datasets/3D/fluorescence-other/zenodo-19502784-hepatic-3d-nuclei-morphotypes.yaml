notes: 'Zenodo README and listing: raw_data.zip holds images/, labels/, class/ (5 TIFF volumes each, one per animal);
  preprocessed_data.zip holds 14,385 single-nucleus patches (112^3) and masks with train/val/test splits for leave-one-animal-out
  CV; other archives are features, models and statistics. Class labels are marker-assisted reference morphotypes.
  GitHub README: isotropic 0.3 um voxels, data from Universidad de Concepcion. Microscope and how the instance labels
  were made are not stated (preprint full text not openly readable), so source is unknown and modality is fluorescence-other.
  Related to zenodo-18517324 (NucVerse3D, same lab) but a different set. size_bytes is the whole Zenodo record.
  enricher: added the Research Square preprint (was none); voxel size confirmed from GitHub README (TIFF headers
  are uncalibrated).'
