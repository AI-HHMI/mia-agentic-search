notes: 'Four zips (Denoising, Phantom_spheres, Confocal_2_STED, Expansion_Microscopy) of raw/gt TIFF volumes per
  Readme.txt, plus live_cell_test_data.zip; about 1150 .tif files listed with peek_archive (raw and GT counted separately).
  Voxel size, organism and cell types are not stated on the record or Readme; the full paper was not open access
  (abstract only), so they are null. Licence conflict: record metadata CC-BY-4.0, Readme BSD 3-Clause; metadata
  value used. enricher: no single archive (5 zips + Readme), so download_url is the record page; zip URLs are /api/records/4624364/files/<name>.zip/content.
  Readme: U2OS cells for the live-cell mitochondria test only; voxel sizes differ per subset and are not stated
  in files or Readme.'
