notes: 'Page states image size 66.56 x 66.56 x 15.08 microns for 1024 x 1024 x 52 pixels; voxel size (65, 65, 290 nm) is derived from that. Image dataset zip is 572.2 MB (10 tif files, listed with peek_archive); ground truth zip contains a single 109 MB tif (ground_truth_segmented.tif). Only one annotated volume exists - the edge and centre colony stacks have no ground truth. The page links no paper (says results are to be submitted), so no publication is listed. The label encoding (instance IDs vs binary) was not inspected. The exact modality (widefield vs spinning disk) is not stated on the page - the Zeiss AxioObserver with ORCA-Flash 4.0 is named, so fluorescence-other is used. The ground-truth CSV is shown on the page but the zip listed only the tif.'
