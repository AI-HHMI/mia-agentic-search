notes: 'Files: mouse_block_groundtruth.tar.xz (3.76 GB, image blocks as Vaa3D .v3dpbd files, seen by streaming the
  start of the archive), manual_swc_cropped.zip (1,512 .swc files, listed with peek_archive), trace_and_evaluation_codes.zip
  (3 .py files). Image blocks are not .tiff etc., hence formats: other. The record lists no publication, and the
  PyTube GitHub page does not describe the benchmark, and a Europe PMC/Crossref title search found no paper, so
  voxel size, microscope settings, block dimensions and the annotation procedure are not stated in any source
  checked. The image-block count (1,512) is taken from the record description; the tar.xz was not fully listed.
  The task is neuron tracing (skeleton reconstruction). fMOST is named in the title only; modality is recorded as fluorescence-other.'
