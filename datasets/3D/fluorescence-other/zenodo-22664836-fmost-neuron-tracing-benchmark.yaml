notes: 'Files: mouse_block_groundtruth.tar.xz (3.76 GB, image blocks as Vaa3D .v3dpbd files), manual_swc_cropped.zip (1,512 .swc
  files), trace_and_evaluation_codes.zip (3 .py files). Image blocks are not .tiff etc., hence formats: other. The record lists no
  publication, and the PyTube GitHub page does not describe the benchmark, and a Europe PMC/Crossref title search found no paper, so
  voxel size, microscope settings and the annotation procedure are not stated in any source checked. The task is neuron tracing
  (skeleton reconstruction). fMOST is named in the title only; modality is recorded as fluorescence-other. enricher: channels 1 (was
  null) from the .v3dpbd headers (1024x1024x256x1, uint8); SWC coordinates are in block voxels (soma at the block centre).'
