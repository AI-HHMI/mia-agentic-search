short_name: Simulated 3D embryo-like cells with masks (fluor.)
description: 47 artificial 3D fluorescence-like microscopy images of simulated foam-like early-embryo cell aggregates (2 to
  11 cells, varied cell sizes and interfacial tensions), each with a filled label (cell segmentation) volume, a multimaterial
  surface mesh and ground-truth tensions and pressures as NumPy arrays. Made to benchmark cellular force inference from segmented
  microscopy images.
