notes: 'Synthetic data: the Zenodo page states these are artificial fluorescence microscopy images created from simulations,
  not biological ones. License conflict on the Zenodo page: the metadata field says CC-BY-4.0 while the description text says
  CC-BY-NC-4.0; the stricter NC licence is recorded. The zip was listed with peek_archive (329 files: 94 tif = 47 microscopy
  + 47 labels_filled, 47 .rec meshes, 188 .npy), so n_items counts the 47 image/label pairs. Pixel/voxel size of the artificial
  images is not stated on the Zenodo page or in the paper (the paper''s 1 um pixel size refers to real Phallusia embryo imaging).
  The paper''s main use of the data is benchmarking a mesh generation and force-inference pipeline (n = 54 simulated embryos
  in the paper vs 47 in the record). enricher: sampled embryo 002: uint8 image and int32 label volume, both 115 pages of 200x115,
  label values 0-2 (background + 2 cells).'
