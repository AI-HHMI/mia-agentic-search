notes: 'Read the DANDI API record and asset listing (21 NWB files: 19 of about 250-277 MB, 2 of about 13.8 GB; 46.25 GB; CC-BY-4.0)
  and, by range request, the structure of one file (sub-20221106-21-00-09): acquisition/NeuroPALImageRaw/data (1000, 240,
  48, 6) uint16 uncompressed, grid_spacing 0.3208, 0.3208, 0.75 um, with ID_labels and voxel_mask for the neuron ROIs; other
  files may differ slightly. Experiment description in the file: optogenetic stimulation of single neurons. No paper is cited
  on the DANDI record (wormid.org lists it as unpublished Kato lab data), so no paper could be read and the imaging system
  and labelling procedure are not documented; the microscope type is not stated, so modality is fluorescence-other. Same lab
  and layout as DANDI 000472 and 001623 (not duplicates; different files).'
