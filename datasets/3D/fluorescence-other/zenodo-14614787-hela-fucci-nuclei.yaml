  notes: 'Listing: Zenodo API (1 file, 769,550,779 bytes, complete). The 7z (LZMA2, solid) cannot be listed
    by listing.py/peek_archive; a scratch script (requests + stdlib lzma) read its 32-byte start header
    and the 18 KB LZMA-encoded end header: 1463 .tiff entries, no folders, names <plate well field>_n<id>_c<k>.tiff
    with k 0/1/2 (314/716/433). It then decompressed the first 3 MB of the solid stream (6.0 MB fetched
    in total) and read the first 2 files with tifffile: ImageJ-less tifffile CZYX uint16 deflate, shapes
    (4,5,171,136) and (4,5,171,148) (crop size varies). Channel 3 is binary {0,1}. Normalization none:
    integer values in a low detector range, unclipped (inferred). Sample null: TensorSwitch cannot read
    7z members, so no small direct unit exists; the whole archive is the only download. Phase-class mapping
    of _c0/_c1/_c2 and channel order not documented in the Zenodo record or S-BIAD1659 metadata; code
    repo (github.com/15bonte/cell_cycle_classification) README read, loaders not.'
