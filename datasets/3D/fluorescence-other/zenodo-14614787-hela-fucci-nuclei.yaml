notes: 'Single 7z archive (769.6 MB); Lateral pixel size 0.102 um is from the parent study S-BIAD1659
  (Opera Phenix Plus, 63x water, 5 focal planes 1 um apart, 20 min frames); it is not stated on the Zenodo
  page. Labels in the parent study: G1 217,465, S 257,984, G2/M 160,855 nuclei, cell-cycle phase assigned
  manually from PIP-FUCCI intensity along Cellpose-segmented, TrackMate-tracked nuclei with all 15,026
  tracks reviewed (paper Methods); the segmentation mask itself is automatic (Cellpose 2.0 fine-tuned).
  Full study CC0 on BIA; this subset CC-BY-4.0. enricher: 7z header read: 1463 TIFF nucleus crops, CZYX
  4x5 planes; dimensionality 3D (was 2D), z 1000 nm from S-BIAD1659 (5 focal planes 1 um apart), formats
  tiff (was other), n_items 1463.'
