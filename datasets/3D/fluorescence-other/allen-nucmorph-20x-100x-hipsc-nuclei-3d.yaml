short_name: hiPSC nuclei 3D, 20x/100x pairs + masks
description: 410 field-of-view 3D image pairs of lamin B1-tagged human iPS cell colonies imaged at 20x
  and 100x magnification, with watershed nuclear segmentations of the 100x images and a train/valid/test
  manifest. Used to fine-tune a vision-transformer nuclear segmentation decoder that predicts 100x-quality
  segmentation from 20x images.
