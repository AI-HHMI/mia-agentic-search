notes: 'One sub-dataset (segmentation_decoder_training_fov_dataset) of the Allen nuc-morph-dataset package.
  Size and counts from a complete S3 listing: 410 files each in high_res_100x, low_res_20x and watershed_segmentation_100x,
  18 model predictions; manifest splits 372 train / 20 valid / 18 test. Header probe of IMG_0000: 20x
  36x238x358, 100x and watershed 94x595x895, uint16 deflate OME-TIFF. Voxel size, microscope and objectives
  are not stated in the README and the paper Methods could not be read (journal version not open access,
  bioRxiv rate-limited), so voxel size is null and modality is generic; the paper summary page says lamin
  B1-tagged hiPSCs. Labels are watershed segmentations of the 100x images (automatic). Licence is the
  Allen Institute custom Terms of Use. enricher: all three folders sampled for IMG_0000; size confirmed
  by the S3 listing.'
