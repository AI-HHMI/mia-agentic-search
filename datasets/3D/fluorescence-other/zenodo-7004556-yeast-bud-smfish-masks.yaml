notes: 'Full file list from the Zenodo API: 32 files, six 1.74 GB multichannel TIFF stacks (CY3.5, CY3, DAPI, CY5), six DIC TIFFs,
  18 mask TIFFs (cell, bud, nuclear per set; one control nuclear mask is misspelled CONTRUL_03_MASK_nuc.tif) and two FISH-QUANT
  spot text files. The description calls the masks examples and does not say how they were made or whether every cell is
  masked, so annotation source is unknown. Microscope, objective, pixel size and z step are not stated on the page; the TIFFs
  were not opened. Mask images are 10.6 MB each, the same size as the DIC images. No paper is linked, so none was read. Small
  set (six fields) intended as tutorial example data.'
