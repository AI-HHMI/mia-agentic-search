title: 'Saccharomyces cerevisiae Bud-Annotation pipeline: Napari Example Data'
short_name: Yeast bud smFISH cell/nucleus/bud masks
description: Six three-channel-plus-DAPI smFISH image sets of budding yeast (3 EXPERIMENT with a bud-localisation
  element in the mRNA reporter, 3 CONTROL), each a 41-plane z-stack in CY5, CY3.5, CY3 and DAPI with a
  matching DIC image, and example cell, nucleus and bud mask images for every set plus FISH-QUANT spot
  tables for the CY3.5 channel. Example data for a napari bud-annotation plugin.
