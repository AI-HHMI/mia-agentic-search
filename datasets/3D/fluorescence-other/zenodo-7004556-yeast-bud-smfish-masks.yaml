notes: 'Full file list from the Zenodo API: 32 files, six 1.74 GB multichannel TIFF stacks (CY3.5, CY3,
  DAPI, CY5), six DIC TIFFs, 18 mask TIFFs (cell, bud, nuclear per set; one control nuclear mask is misspelled
  CONTRUL_03_MASK_nuc.tif) and two FISH-QUANT spot text files. The description calls the masks examples
  and does not say how they were made or whether every cell is masked, so annotation source is unknown.
  Microscope (Olympus BX63, 100x/1.4, ORCA-Fusion) from the OME-XML. No paper is linked, so none was read.
  Small set (six fields) intended as tutorial example data. enricher: voxel size 64.777 x 64.777 x 200
  nm from OME-XML (PhysicalSizeX/Y 0.0648 um; plane PositionZ steps of 0.2 um), matching FISH-QUANT Pix-XY
  64.5 / Pix-Z 200 (was null). Masks hold instance IDs: semantic -> instance.'
