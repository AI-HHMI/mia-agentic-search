title: 3D Nuclei Segmentation for Multi-cellular Quantification of Zebrafish Embryos Using NISNet3D
short_name: Zebrafish embryo 3D nuclei segmentation
description: Manually curated 3D nuclei instance segmentation data for four whole-mount zebrafish embryos at different developmental stages, each with over 8,000 cells. Cropped raw image sub-volumes (TIFF) are paired with hand-labelled nuclei volumes (NRRD with ITK-SNAP files); full-embryo CZI acquisitions are included for Embryo1 and Embryo4. Two embryos were used for training NISNet3D and two for validation.
