notes: 'Four zips (Embryo1-4) were listed with peek_archive: Embryo1 has 50 cropped TIFFs, 36 NRRD labels,
  1 CZI; Embryo2 51 TIFFs, 29 NRRD, no CZI; Embryo3 18 TIFFs, 16 NRRD; Embryo4 50 TIFFs, 30 NRRD, 1 CZI.
  Imaging modality, voxel size, stage and staining are not stated on the Zenodo page, the Electronic Imaging
  abstract (full text not open access) or in the file listing, so modality is the generic fluorescence-other
  and voxel size is null. The open NISNet3D Scientific Reports paper (PMC10261124) describes different
  volumes (cleared rat/mouse tissue) and was not used for these values. Label granularity (instance vs
  binary) was not verified from file contents. enricher: size_bytes from the complete Zenodo listing (was
  3533821438). formats: czi added (2 full-embryo files); labels are NRRD (see annotations.format). annotations_verified
  after reading 2 NRRD labels.'
