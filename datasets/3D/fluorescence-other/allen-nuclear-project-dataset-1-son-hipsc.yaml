notes: 'Very large: 59,650 crop_raw files (3.39 TB) and 59,651 crop_seg files (20.6 GB) from a complete
  S3 listing; metadata.csv has 67,236 rows (more than the files listed). Voxel size 0.108 um isotropic
  per metadata.csv scale_micron; README says originals were 0.108 x 0.108 x 0.29 um and Z was interpolated.
  No paper is linked, so no Methods were read; microscope, objective and who/what produced the segmentations
  are not stated in the README (annotation source unknown). The 3 label-free channels (FBL, NPM1, LMNB1)
  are model predictions, not measurements, and the README advises using the DNA-based nuclear segmentation.
  mitotic_stage comes from an automatic classifier still in R&D. Sibling packages nuclear_project_dataset_2
  to 4 (TRF2, POLR2A, PCNA lines) are not covered here. Licence is the Allen Institute custom Terms of
  Use. enricher: size set to the exact S3 listing total incl. README/metadata (was 3,411,348,793,539).'
