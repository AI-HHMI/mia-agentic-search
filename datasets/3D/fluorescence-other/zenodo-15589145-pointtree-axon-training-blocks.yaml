description: 18 sparse-labelled mouse brain image blocks with neuron axons (raw 3D TIFF volumes of about
  268 MB each), each with a segmentation mask TIFF and an SWC skeleton traced semi-automatically with
  GTree, used as training data for the PointTree axon-reconstruction network. The same Zenodo record also
  holds the PointTree software and the figure data of the paper.
