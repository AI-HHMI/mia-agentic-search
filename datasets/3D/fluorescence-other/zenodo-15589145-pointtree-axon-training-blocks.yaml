notes: 'Record covers dataset_for_training.zip (peek_archive: raw_image/1..18.tif at 268.5 MB each, mask/1..18.tif,
  swc_file/1..18.swc; 4.9 GB uncompressed). The Zenodo record also holds PointTree_software.zip and figure data
  zips (Full_data1/2, patch_data, data_for_different_SNR, etc.), not described here. The paper says each training set
  has 20 blocks of 512x512x512 voxels, which does not match the 18 blocks listed, so counts are from the file listing.
  Voxel size is not stated in the paper text or ReadMe I read (skeleton points are interpolated to under 1 um spacing).
  The skeletons come from the semi-automatic GTree software with manual modification per the paper; masks are
  derived from them, so they are listed as proofread. Which of the two imaging systems each block comes from is not
  stated. Only raw_image, mask and swc folders were verified by listing; mask encoding was not opened.'
