  notes: 'listing.py on the zip: 54 members with exact sizes, 2,113,629,212 B = size_bytes. probe.py:
    mask/1.tif 512 pages 512x512 uint8 LZW (tifffile shaped layout, axis order not in the file); raw_image/1.tif
    is deflated in the zip and could not be header-probed. sample.py on block 1 (114,579,275 + 4,230,956
    B downloaded): raw 512x512x512 uint16 [0, 2816], mean 32, hint 12-bit detector range (normalization
    none, inferred); mask [0, 253], 254 values, 97.6% zeros; same shape (from one sample). swc_file/1.swc
    head read with peek_archive. Download: the zip and its raw/mask/swc members pass --download-check.
    The paper describes 2 training sets of 20 blocks; the zip has 18. Voxel size not found; checked: TIFF
    headers, Zenodo ReadMe.MD, paper full text (Europe PMC: block sizes in voxels only), Seg_Net README.
    Blocks come from CSFT or HD-fMOST data, and the zip does not say which, so an upstream voxel size
    cannot be assigned.'
