notes: 'From the Edmond API record and the deposit index.html: CC0 1.0, 8 tar.gz archives, 35.84 GB in
  total (Planaria 14.1 GB, Tribolium 5.1, Drosophila 3.6, Liver 0.9, Retina 5.5, Flywing 4.8, tubulin_gfp
  0.6, tubulin_granules 1.3). This is the original CARE deposit; the AI4Life-MDC25 Planaria and Tribolium
  records (zenodo-15615592, zenodo-15615943) re-host subsets only. Edmond HTML is bot-blocked, tar.gz
  cannot be listed remotely and the paper is not open access (abstract only), so per-experiment modality
  (hence fluorescence-other), organism, file counts and most voxel sizes are unconfirmed (stated: Drosophila
  test 0.39 x 0.39 x 1.95 um, Retina 0.195 x 0.195 x 2 um). n_items counts archives. Training patches
  are npz (formats other); TIFF is named only for the synthetic tubulin test stacks. The index repeats
  the Planaria text for the granules archive. enricher: download_method http (each archive is direct via
  /api/access/datafile/<id>).'
