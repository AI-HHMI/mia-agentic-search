title: 'Content-aware image restoration (CARE): training and test data for denoising, isotropic reconstruction,
  projection and synthetic super-resolution'
short_name: CARE restoration pairs, 8 fluorescence sets
description: Original training and test data of the CARE paper (Weigert et al., Nature Methods 2018) on
  Max Planck Edmond. Eight archives hold low/high pairs of image patches (numpy npz) plus test stacks
  for Planaria and Tribolium denoising (3 low-photon conditions plus ground truth), Drosophila, Retina
  and Liver isotropic reconstruction from anisotropic stacks, Flywing surface projection, and synthetic
  tubulin and granule restoration.
