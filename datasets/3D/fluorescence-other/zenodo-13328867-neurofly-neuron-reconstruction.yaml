notes: 'The Zenodo record has no description and lists the creator as Anonymous; the link to the NeuroFly
  paper comes from the project (arXiv 2411.04715, code github.com/beanli161514/neurofly). 20 files: z002.zarr.zip
  (8.9 GB), z002/rm009/fmost/mouse *_labeled.zip, several RM009_*.tif volumes with .db annotation databases,
  fmost_test.tif. mouse_labeled.zip (listed with peek_archive) holds 174 TIFFs: img_N.tif image blocks
  with mask_N.tif skeleton masks in skels/. The paper (v1 HTML) states 1 um/voxel for its fluorescence
  images, so the voxel size is that value, not read from these files; Macaque species not stated (genus
  used). Annotation: skeletons traced by choosing two terminal points and brightest-path search, with
  proofreading in a napari tool (paper v1). organisms (README table): Macaca = rm009_labeled.zip, RM009_*;
  Mus musculus = mouse_labeled.zip, z002*, fmost_*. Imaging VISoR, fmost_* fMOST.'
