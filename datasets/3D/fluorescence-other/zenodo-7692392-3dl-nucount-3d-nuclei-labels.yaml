notes: 'nucount_dataset.zip (3.7 MB): 0.tif (the 63x256x256 uint8 image volume) and 95 files labels/Labels [N].tif
  (N 1 to 97, two numbers missing). enricher: each label file is a full 63x256x256 int32 volume holding one object
  with one id (Labels [1] = id 2, Labels [2] = id 3 in the files sampled), so the 95 files are per-object masks
  that together give the instances. The Zenodo description is the only source: no paper, microscope, voxel size,
  organism or stain is stated, so those fields are null/other. Single small volume, the lower bound of the size
  rule. Annotation was manual in Napari per the description.'
