notes: 'nucount_dataset.zip (3.7 MB) lists 96 TIFFs by peek_archive: 0.tif (3.2 MB, the image volume) and 95 files in labels/ named
  Labels [N].tif (about 0.1 MB each), which is more than the 63 slices of the stated volume, so how the label files relate to slices
  or label versions is not confirmed. The Zenodo description is the only source: no paper, microscope, voxel size, organism or stain
  is stated, so those fields are null/other. Single small volume, so this is the lower bound of the size rule. Annotation was
  manual in Napari per the description; whether the labels are instances (StarDist 3D needs them) is inferred.'
