notes: 'Read README, metadata.csv (1,906 rows, 0.108333 um isotropic; originals 0.108 x 0.108 x 0.29 um) and the S3 listing (size =
  sum of crop_raw and crop_seg). Masks are 0/255 uint8 per channel. Stages: M0 1,824; M6M7_single 41; M4M5 17; M1M2 14; M3 9; M6M7_complete
  1. Cell and DNA masks were regenerated with a deep learning model; flag_for_removal-low_counts marks cells with under 31 TRF2 clusters.
  Mitotic cell_stage comes from rules plus a classifier. Same series as catalogued nuclear project dataset 1 (SON), different tagged
  structure. S3 was listed because the Quilt viewer is JavaScript only. License: Allen Institute Terms of Use (non-commercial research,
  attribution; commercial needs written permission). No paper is linked.'
