notes: 'DANDI API record (CC-BY-4.0, 10 NWB files, 835 MB, draft version only) and NWB headers read by range requests for 4 of the 10 files:
  raw volume (x,y,z,c) e.g. 935x222x37x5 uint16, grid_spacing 0.2078/0.2078/0.75 um (0.2076-0.2078 xy across files seen), 5 optical channels
  (mTagBFP2, TagRFP-T, GFP-GCaMP, CyOFP1, mNeptune 2.5), NeuroPALNeurons segmentation with 192-196 ROIs and ID_labels. Cell paper (Yemini 2021) is
  not open access in Europe PMC, so only its abstract was read; the dandiset description also names the Statistical Atlas of C. elegans Neurons
  paper (not read). Microscope and objective were not found in the dandiset metadata or file headers, hence the generic fluorescence-other
  modality. The other 6 files were not inspected. Differs from DANDI 000714 and 000472 (other NeuroPAL datasets).'
