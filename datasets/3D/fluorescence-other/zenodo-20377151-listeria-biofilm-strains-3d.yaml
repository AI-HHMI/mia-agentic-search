notes: 'Labels are image-level strain identities: 8 strains (workbook sheets L455, L628, L394, ATCC 19115, L634,
  L1323, L1764, L1823), 125 stacks each, strain also in the file name (_st_<strain>_); no pixel-level annotation.
  The MicroICS paper was not found (Europe PMC, Crossref, web search), so modality stays fluorescence-other (images
  were exported from Zeiss .lsm files per lsm_to_tif.ijm, which suggests laser scanning confocal, unconfirmed). No splits.
  enricher: voxel size 131.79x131.79x500 nm from the TIFF ImageJ calibration (7.587931 px/um, spacing 0.5 um), identical
  in two stacks from different dates (was null). enricher: size_bytes is the exact total of all 6 deposit files (was
  the zip alone).'
