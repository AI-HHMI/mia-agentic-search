notes: 'Labels are image-level strain identities (workbook has one sheet per strain: L455, L628, L394, ATCC
  19115, L634, L1323, L1764, L1823; L455 has 125 stacks), no pixel-level annotation. Zip listed with peek_archive
  (1000 .tif, 44.0 GB uncompressed). Microscope/technique not named on the page and the MicroICS paper was
  not found (Europe PMC, Crossref), so modality is fluorescence-other (the LSM-to-TIFF macro hints at laser
  scanning confocal, unconfirmed). Voxel size and stack shape not stated in the record or workbook; TIFF headers
  inside the deflated zip could not be read. No splits.'
