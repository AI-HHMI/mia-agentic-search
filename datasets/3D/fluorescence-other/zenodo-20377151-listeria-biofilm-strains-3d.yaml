short_name: Listeria biofilm 3D strain classification (fluor.)
description: 1,000 3D fluorescence image stacks (Syto9 channel, TIFF) of Listeria monocytogenes biofilms grown
  in microtiter plates, from 8 strains, with a metadata table giving strain, well, position, growth conditions
  and image quality for every stack, plus precomputed MicroICS and BiofilmQ structural-feature tables used
  for a strain-identification classifier benchmark.
