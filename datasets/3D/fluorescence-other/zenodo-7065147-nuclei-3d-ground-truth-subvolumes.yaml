      't') and the deeper synthetic/ files. One sample reached full 0-255 range; normalization not stated, left unknown.
      Rat_liver_1 is annotated whole so its subvolume shape may differ (shape_varies).
  - role: label
    path_pattern: ground_truth_and_synthetic/*/*/*_gt.tif
    format: tiff
    axes: zyx
    shape:
