notes: 'Single zip (514 MB) = whole dataset. readme.txt confirms CC-BY-NC-ND (Zenodo page said CC-BY-4.0). 31 manual
  real subvolumes + ~350 SpCycleGAN synthetic pairs (synthetic not listed as arrays, machine-generated). enricher:
  labels uint16 instance IDs (unique voxel intensity per nucleus, per NISNet3D paper + sampling); images uint8. Voxel
  size not stated (readme and both papers give none; 8 source volumes differ) - left null. organisms: Rattus norvegicus
  = Rat_liver_1/, Scale-cleared_rat_kidney_1/, BABB-cleared_kidney_1/; Mus musculus = Cleared_mouse_intestine_1/; Homo
  sapiens = Diabetic_Biopsy_Human_Spectral_1/,_3/, Kidney_Cortex_Human_Spectral_1/, Kidney_Human_Nephrectomy_1/.'
technical:
  method: sample
  size_source: file-listing
  layout:
