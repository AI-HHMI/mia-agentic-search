      ground_truth_and_synthetic/                      (514 MB zip, 762 files, 1797.9 MB uncompressed)
        readme.txt
        <source_volume>/                               (8 folders: BABB-cleared_kidney_1, Rat_liver_1, ...)
          <subvolume>/
            <subvolume>.tif                            (real image, 128^3 uint8, 2.5 MB)
            <subvolume>_gt.tif                          (manual gt, 128^3 uint16 instance IDs, 4.2 MB)
          synthetic/
            syn/volNNN.tif                              (synthetic image)
            gt/volNNN.tif                               (synthetic gt, 128^3 uint16 instance IDs)
    n_files: 762
    listing_complete: true
  sample:
