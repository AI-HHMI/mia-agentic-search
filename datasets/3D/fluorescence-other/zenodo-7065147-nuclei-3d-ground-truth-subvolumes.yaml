      name: nucleus
    alignment: same-grid
    alignment_notes: '<name>_gt.tif pairs 1:1 with <name>.tif in the same subdirectory, same 128^3 grid. Values are
      unique voxel intensities per nucleus (0=background); sampled gt had IDs 0-5, a synthetic gt had 0-40.'
  notes: 'Listed the one zip with peek_archive (762 files, 31 real image/gt pairs + ~350 synthetic pairs + readme).
