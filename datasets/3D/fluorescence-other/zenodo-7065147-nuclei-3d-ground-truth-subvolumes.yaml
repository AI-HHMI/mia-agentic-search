notes: 'Listed the single zip with peek_archive (762 files: 761 TIFF and readme.txt; eight source-volume folders, 31 *_gt.tif manual ground-truth subvolumes with
  their image subvolumes, and about 346 synthetic volumes with labels). The Zenodo record says CC-BY-4.0, but the readme.txt inside the archive states CC BY-NC-ND,
  so the stricter in-archive terms are recorded. The bioRxiv paper could not be fetched (HTTP 429); the open NISNet3D paper (PMC) states the data availability
  and says ground truth for four of the volumes was drawn manually in ITK-SNAP, one annotator per subvolume checked by a biologist. Voxel size is not stated per
  volume (only 1x1x1 um in a figure caption), microscope types for the human volumes and the label encoding (instance IDs vs binary) were not inspected.'
