title: 3D Organoid Microscopy Dataset for Volumetric Deconvolution
short_name: 3D breast organoid deconvolution pairs
description: 3D fluorescence volumes of breast-cell-line organoids (DAPI and membrane channels) from three microscope setups
  (folders Zeiss-1, Zeiss-2, olympus) stored as NIfTI. In the Zeiss-1 set each raw volume sits next to a processed counterpart
  in a gt/ folder, giving raw / processed pairs for volumetric deconvolution and image restoration.
