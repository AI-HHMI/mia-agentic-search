notes: 'Zenodo record (description only repeats the title) and the zip listing read: 30 .nii.gz files, folders olympus/, Zeiss-1/,
  Zeiss-2/ each with dapi/ and membrane/; only Zeiss-1 has gt/ subfolders (5 processed dapi volumes listed and 3 membrane
  ones in the truncated listing) next to the raw volumes, so pairs cover part of the data. No paper, microscope model, voxel
  size, species or processing method is stated, so modality is fluorescence-other, organism is empty and what the processed
  volumes are (deconvolution output) is inferred from the title and file names. The same authors have a different catalog
  record, zenodo-20499199 (12 organoid volumes with segmentation masks). enricher: NIfTI headers give 172.5x172.5x1000 nm
  voxels for all 26 Zeiss-1/Zeiss-2 files, but the 4 olympus/ files (float32, 960x1280) carry the 1 mm header default, so
  voxel_size_nm stays null (subsets not shown to share one). Organism stays empty: cell lines are named only in file names.'
