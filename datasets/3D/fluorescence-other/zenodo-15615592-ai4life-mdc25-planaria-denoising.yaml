notes: 'Archive.zip (16.3 GB) holds 35,890 TIFFs: small_crops 17,900 noisy + 17,900 gt, large_crops 45
  noisy + 45 gt. The CARE paper is not open access, so only its abstract was read; the specific microscope,
  voxel size, species and labelling are therefore not confirmed and modality is set to fluorescence-other.
  The Zenodo page says it is a subset of the Denoising Planaria collection (original at Max Planck Edmond).
  No train/val split given; the challenge uses withheld test data.

  enricher: size_bytes from exact Zenodo listing (was null). maintainer 2026-10-06: voxel size searched,
  not found (Zenodo, challenge pages, Edmond metadata, CARE supplement; headers uncalibrated).'
