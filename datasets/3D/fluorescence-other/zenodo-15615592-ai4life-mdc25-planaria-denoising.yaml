notes: 'Archive.zip is 16.3 GB (Zenodo page). peek_archive lists 35,890 TIFFs: small_crops 17,900 noisy + 17,900 gt, large_crops
  45 noisy + 45 gt. A probed small crop is a float32 TIFF of shape 16x64x64 (ImageJ stack, uncompressed); large crops could
  not be probed. The CARE paper is not open access, so only its abstract was read; the specific microscope, voxel size,
  species and labelling are therefore not confirmed and modality is set to fluorescence-other. The Zenodo page says it is a
  subset of the Denoising Planaria collection (original at Max Planck Edmond). No train/val split given; the challenge uses
  withheld test data.'
