notes: 'Read README, metadata.csv (2,420 rows, 0.108333 um isotropic; originals 0.108 x 0.108 x 0.29 um) and the S3 listing (size =
  sum of crop_raw and crop_seg). Masks are 0/255 uint8 per channel. Stages: M0 2,275; M6M7_single 65; M4M5 36; M1M2 26; M3 15; M6M7_complete
  3. PCNA masks are blank for cells without replication foci (~40%). Interphase stage (cell_stage_fine) was set manually by an expert;
  mitotic stage from rules plus a classifier. How masks were made is not stated. Same series as catalogued nuclear project dataset 1
  (SON), different tagged structure. S3 was listed because the Quilt viewer is JavaScript only. License: Allen Institute Terms of Use
  (non-commercial research, attribution; commercial needs written permission). No paper is linked.'
