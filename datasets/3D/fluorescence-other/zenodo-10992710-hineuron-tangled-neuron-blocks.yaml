schema_version: '1.2'
id: zenodo-10992710-hineuron-tangled-neuron-blocks
title: A Hierarchically Annotated Dataset Drives Tangled Filament Recognition in Digital Neuron Reconstruction
short_name: HiNeuron tangled neuron blocks with SWC (fMOST)
description: About 2,800 difficult-to-recognize 3D image blocks of tangled mouse-brain neuronal fibers
  imaged with fMOST (TDI-fMOST and HD-fMOST, 16-bit TIFF), from seven specimens, graded into three density
  levels. Each block comes with a manual gold-standard SWC reconstruction of the target neuron, tracing
  start point and direction files, and an axially enhanced isotropic version of the image.
