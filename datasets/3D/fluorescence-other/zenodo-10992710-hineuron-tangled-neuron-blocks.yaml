notes: 'Zenodo gives no license; the portal (atlas.brainsmatics.cn/HiNeuron) says CC0 but also "free for academic use only", so spdx is custom. Specimen zips hold nested Neuron<N>.zip files; inner layout (image, image_isotopic, swc per Level1-3, 16-bit TIFF) is from the portal and paper, not listed from the archive, so annotations_verified is false. n_items 2,809 is the portal count (paper: about 2,800). Voxel size differs by specimen (0.35x0.35x1 um TDI-fMOST for 1-3; 0.32x0.32x1 um HD-fMOST for 4-7), so voxel_size_nm is null. This is the original HiNeuron of the Patterns 2024 paper; the larger Ver2 subset on Zenodo 20501092 is a separate catalog record.'
