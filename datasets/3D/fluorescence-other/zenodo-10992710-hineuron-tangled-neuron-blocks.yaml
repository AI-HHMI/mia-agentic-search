  notes: 'Exact Zenodo listing (11 files, 20,131,300,515 B). Specimen zips contain nested deflated Neuron<N>.zip
    files, so one (Specimen5/Neuron1.zip, 31 MB) was downloaded and listed in memory: 70 members, Level1
    18 blocks + Level2 1 block, each with image/, image_isotropic/ and swc/. TIFFs are plain multi-page
    (tifffile IYX); pages recorded as z because the isotropic copy has 61 x 3.125 = 191 pages, matching
    specimen 5''s 0.32 x 0.32 x 1 um voxels. Sampled 124.tif 61x61x146 uint16 0-3493 (mean 5; normalization
    none inferred: raw detector values), 142.tif 77x120x98, isotropic 124.tif 191x61x146. TensorSwitch
    cannot address a zip inside a zip.'
