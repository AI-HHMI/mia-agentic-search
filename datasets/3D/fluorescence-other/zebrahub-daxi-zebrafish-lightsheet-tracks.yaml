notes: 'Hosted at https://public.czbiohub.org/royerlab/zebrahub/imaging/single-objective/ (Caddy file index): ZSNS001/002/003/004/005 .ome.zarr plus ZSNS001, 001_tail, 003, 004, 005 _tracks.csv
