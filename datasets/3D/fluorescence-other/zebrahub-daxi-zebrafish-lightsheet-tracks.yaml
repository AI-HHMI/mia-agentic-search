  (791,1,448,2174,2423) uint16, blosc lz4, chunks 1x1x128x362x362, scale z 1.24, y/x 0.439 um (also in the neuroglancer
  JSONs of ZSNS001/003/004/005 and the tail crop). Tracks are automatic (Ultrack), not proofread as a whole; the paper manually
  curated only selected tracks. The page also lists two OpenSiMView datasets (ZMNS001/002) not found in this directory.
