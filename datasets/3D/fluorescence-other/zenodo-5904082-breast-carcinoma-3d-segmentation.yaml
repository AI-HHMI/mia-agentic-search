notes: 'Checked the Zenodo record, API record and both zip listings (peek_archive). Two zips: carcinoma_version2.zip
  (805 MB; 1387 TIFFs: Raw 1055, RealMask 166, BinaryMask 166) and Carcinoma_human_breast_cells.zip (143 MB; 83 each
  of Raw, RealMask, BinaryMask). n_items = 332 is the sum of RealMask files in both zips (166 + 166); the
  counts across the two zips were not reconciled with each other. Raw has more files than masks in version2, so only part of Raw is
  labelled. Exact imaging modality, voxel size and channels are not stated on the record (keywords say membrane labelled,
  CZI); modality fluorescence-other is inferred. No paper is cited on the record, so none was read. Original source
  dataset (celltrackingchallenge.net 3D datasets) was not fetched.'
