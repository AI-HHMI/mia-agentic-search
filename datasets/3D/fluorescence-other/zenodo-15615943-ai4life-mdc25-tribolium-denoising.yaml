notes: 'Archive.zip (4.5 GB compressed, 8.2 GB uncompressed) lists 31,000 TIFFs in two folders, noisy/
  (15,500) and gt/ (15,500) with matching names (peek_archive). Dimensionality 3D is inferred from the
  CARE Tribolium data and the sibling Planaria record (16-slice crops), not checked in headers here. The
  CARE paper is not open access, so only its abstract was read; microscope, voxel size and labelling are
  not confirmed, so modality is fluorescence-other. Zenodo page links the original dataset at Edmond (10.17617/3.FDFZOF)
  and the challenge page for the subset organisation; neither was fetched. No train/val split provided.
  Sibling of the Planaria subset already in the catalog. maintainer 2026-10-06: voxel size searched, not
  found (Zenodo, challenge pages, Edmond metadata; headers uncalibrated).'
