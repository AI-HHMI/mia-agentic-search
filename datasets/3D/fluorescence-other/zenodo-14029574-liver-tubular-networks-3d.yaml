notes: 'Four zips (2.61 GB). BC.zip and Sinusoids_filled.zip: training_data (1 volume + mask) and test_data
  (2 + masks) in images/ and masks/ (peek_archive). vessels.zip: 48 TIFF patch volumes, only first entries
  listed. Sinusoids.zip could not be listed (SSL error), layout assumed alike. Voxel size, staining, microscope
  and mask procedure are not stated on the Zenodo record (no description), GitHub README or JoVE abstract;
  the full text is not open access and TIFF headers were unreadable via the zip probe, so they are null.
  Modality is generic fluorescence-other, not confirmed as confocal. Origin of the vessels set is not
  stated. Code is GPL-3.0; the dataset is CC-BY-4.0 per Zenodo. enricher: size 2,608,273,698 B from exact
  listing; n_items 39 raw volumes (3x3 BC/Sinusoids/Sinusoids_filled + 24 vessels patches); Sinusoids.zip
  listed: same layout as BC.'
