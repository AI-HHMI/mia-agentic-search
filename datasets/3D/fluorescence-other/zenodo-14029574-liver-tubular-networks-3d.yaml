  notes: 'Exact listing of all 4 zips (67 members, 2,608,273,698 B; Zenodo API URL for Sinusoids.zip failed
    with SSL EOF, the /records/ URL worked). Headers of the big BC volumes are not readable inside the
    deflated zip, so they were sampled: BC img1 raw 200x1280x720 uint16 (ImageJ axes ZYX), 22-4095 (saturates
    the 12-bit range; normalization "none" inferred), mask same shape uint8 {0,255}. vessels patchvolume_000:
    raw 92x500x500 uint16 0-249, mask uint8 with 48 values. Value ranges are from one sample each. Test
    volume shapes (img2/img3, ~1.3x larger) not measured. No voxel size in the TIFF headers; macro gives
    only a z/xy ratio 1.846 for vessels, no unit. Voxel size not found; checked: TIFF headers, Zenodo
    API (no description), ImageJ macro, GitHub README, Europe PMC (JoVE full text not open access, no
    preprint found on arXiv).'
