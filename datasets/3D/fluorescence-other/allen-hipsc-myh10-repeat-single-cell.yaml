notes: 'Read README, metadata.csv (395 cells from 62 FOVs, all MYH10, scale 0.108333 um isotropic, channels dna/membrane/structure in the raw crops; masks for dna, membrane, membrane roof, struct, struct roof) and the S3 listing (size is the sum of all objects: 10.7 GB crops, 12.6 GB FOVs). Stages: M0 380, M4M5 5, M6M7_single 5, M6M7_complete 3. Supplementary package to the larger catalogued hiPSC single-cell image dataset (allen-hipsc-single-cell-image-dataset), a separate repeat of the MYH10 line. How the segmentations were produced is not stated in the README and no paper is linked. License: Allen Institute Terms of Use (non-commercial research, attribution; commercial needs written permission).'
