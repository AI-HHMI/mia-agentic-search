short_name: hiPSC MYH10 3D single cells + masks (confocal)
description: 'Repeat acquisition of the MYH10-mEGFP hiPSC line from the Allen Institute for Cell Science: 395 cropped 3D single-cell
  images (DNA, membrane and MYH10 channels) with 8-bit segmentation masks, plus the 62 source field-of-view images with their cell and
  nuclear instance segmentations and MYH10 structure segmentations, and a cell-cycle stage label per cell.'
