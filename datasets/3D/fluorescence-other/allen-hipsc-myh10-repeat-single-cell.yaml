    ZCYX uint8, instance ids: nucleus, cell, nucleus contour, cell contour) and struct_seg_path/*_struct_segmentation.tiff (75x600x900
    ZYX uint8, 0/255, header 108.33x108.33x290 nm). All 5 files of the first row pass download-check; no archive, download_url stays
    the S3 prefix.'
