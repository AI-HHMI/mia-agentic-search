  notes: 'S3 listing complete (978 files, exact sizes). Probed the first metadata.csv crop pair (raw 84x3x266x252 ZCYX uint16, seg 84x5x266x252
    uint8, deflate) and its FOV files. Sampled the crop pair: raw 369..8924 (one cell), seg {0,255}. technical.arrays describes the
