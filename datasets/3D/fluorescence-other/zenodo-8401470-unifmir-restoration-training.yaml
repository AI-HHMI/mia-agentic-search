notes: '14 tgz archives (about 46 GB) on Zenodo; archive contents were not listed (tgz cannot be peeked
  remotely), so formats are listed as other (README mentions npz training files generated with CSBDeep,
  plus TIFF in source sets) and item counts are unknown. Record is a preprocessed re-packaging of public
  datasets: CARE (Planaria, Tribolium, liver, Flywing), BioSR (figshare 13264793; already on main as figshare-13264793-biosr-sim-sr-pairs),
  VCD-LFM (zenodo 4390067), DeepBacs (zenodo 6460867) and ShareLoc (zenodo 7234161), so substantial overlap
  with other catalog records; it differs by being the augmented/preprocessed UniFMIR training package.
  License on the Zenodo page is CC-BY-4.0 but the description says licenses of the original datasets apply.
  Dimensionality is mixed (2D and 3D sets); voxel/pixel sizes, organisms and per-set microscope types
  not recorded. The full paper is not open access; only the abstract and GitHub README were read.'
