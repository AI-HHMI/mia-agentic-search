  notes: 'Zenodo API lists 14 tgz files, 46,875,822,001 B (complete, exact). tgz has no index, so contents were
    read by streaming: BioSR_WF_to_SIM_test.tgz in full (126.7 MB; 1615 members) and the first 4 MB of every other
    archive (member names, npy headers). Sampled 4 LR + 4 GT test TIFFs: float32 in [0, 1] (value range from these
    samples only). Training sets are CSBDeep npz packs (X inputs, Y targets); Shareloc holds .smlm localization
    files, not images. npz and smlm are not schema formats. Sets differ in dimensionality (BioSR 2D, Planaria/Tribolium
    3D patches) and in pixel size, so voxel_size_nm stays null: the paper is not open access and no per-set pixel
    size is stated on the Zenodo page or GitHub README; organisms are not stated there either. No single archive
    holds the whole dataset: data.download_url is the record page, the direct files are the 14 Zenodo file links.'
