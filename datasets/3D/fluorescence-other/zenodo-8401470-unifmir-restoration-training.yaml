notes: '14 tgz archives (46.9 GB) on Zenodo. Re-packaging of public datasets: CARE (Planaria, Tribolium, liver,
  Flywing), BioSR (figshare 13264793, on main as figshare-13264793-biosr-sim-sr-pairs), VCD-LFM (zenodo 4390067),
  DeepBacs (zenodo 6460867), ShareLoc (zenodo 7234161); overlaps other records. License on Zenodo is CC-BY-4.0 but
  the description says licenses of the original datasets apply. Mixed 2D/3D sets; voxel sizes and organisms not
  stated in what was read (paper not open access). enricher: formats other -> tiff, png from the streamed archives
  (training packs are CSBDeep npz, Shareloc .smlm: no schema format); annotations_verified true (paired LR/GT files
  seen).'
