description: 'Two small OME-Zarr files (zip-compressed) of human induced pluripotent stem cells imaged at 40x on a Yokogawa
  CV7000 and processed with the Fractal platform: a 3D image (3 channels: DAPI, nanog, Lamin B1; 10 z planes, 2x2 fields of
  view of a well) with a Cellpose nuclear segmentation as 3D label image and measurement tables, plus a maximum-intensity-projection
  version with extra threshold-based labels. Derived from Zenodo 7057076.'
