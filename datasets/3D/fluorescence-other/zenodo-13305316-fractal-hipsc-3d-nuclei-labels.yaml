notes: 'Zip listing and OME-NGFF metadata (peek_archive): well B/03, image array 3 x 10 x 4320 x 5120 uint16 (blosc lz4),
  pixel 0.1625 um and z step 1.0 um, 5 pyramid levels, a labels group "nuclei" and ROI/regionprops tables. Labels are automatic
  (Cellpose via Fractal), not manual. Single processed well of a test/example dataset, not a curated benchmark. Modality:
  the Zenodo text says Yokogawa CV7000 at 40x immunofluorescence; spinning-disk is not stated there, so fluorescence-other.
  Not the same as zenodo-7120354 (older Fractal version, labels only in the MIP). Parent raw images: Zenodo 7057076 (PNG).
  No paper listed. Checked: Zenodo record, API, zarr metadata. enricher: labels are on a 4x coarser xy grid (0.65 um) than
  the image (0.1625 um), per labels/nuclei/.zattrs.'
