notes: 'Zenodo files: raw_data.zip (5.08 GB; nested total_vascular_data.zip 4.7 GB and analysis_data.zip 370 MB,
  not opened), train_data.zip (643 MB; listed: 199 images + 199 masks + 199 SWC, 20 test images with
  masks, split txt files), BVLab-Annotation.zip (annotation software, 420 MB), Segmentation codes.zip.
  Resolution 1 x 1 x 2 um from the README. Annotations come from a semi-automatic human-in-the-loop
  pipeline (skeleton and radii traced semi-manually, masks generated, then proofread), hence source mixed.
  Licence: Zenodo metadata says CC BY 4.0, but the README says the data are for academic research only
  and to contact the author for commercial use, so the terms are partly contradictory. n_items 60 is the
  block count from the paper; the training set uses 192^3 sub-blocks. fMOST is not in the modality enum,
  so fluorescence-other.'
