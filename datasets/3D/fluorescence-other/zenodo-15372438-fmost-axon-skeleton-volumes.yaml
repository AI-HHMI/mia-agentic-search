notes: 'Zenodo record lists images.rar (6.09 GB), swc.rar, mask.rar and train/val/test .txt files (CC-BY-4.0).
  The archives are RAR, which peek_archive cannot list, so the image file format inside (and annotations_verified)
  is unconfirmed and formats is other. Counts 852 = 676 + 85 + 91 are from the paper Methods. Organism:
  the paper abstract and Methods say mouse brain samples, one sentence in the Introduction says rat; mouse
  recorded. Voxel size is not stated in the paper text or Zenodo description. The Data availability sentence
  gives the Zenodo record; the paper reports 90 test blocks in Results but 91 in Methods. enricher: RAR5
  headers read: images/, mask/ (852 .tif each) and swc/ (852 .swc) with matching stems; formats set to
  tiff, annotations verified. Members are RAR-compressed (method 3), so no header or sample was read.'
