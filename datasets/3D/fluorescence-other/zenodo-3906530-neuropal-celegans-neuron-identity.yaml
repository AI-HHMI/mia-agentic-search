title: NeuroPAL Data
short_name: C. elegans NeuroPAL neuron identity volumes
description: 'Multicolour (NeuroPAL: RGB plus panneuronal white channel, with a DIC channel) 3D volumes
  of the head and tail of 10 young-adult C. elegans otIs669 hermaphrodites, each with an identification
  file listing the position, name and confidence of every identified neuron (identified by one expert).
  The same archive also holds whole-brain GCaMP6s activity traces with neuron identities for 49 further
  animals (21 heads and 21 tails of OH16230, 7 heads of OH15500).'
