notes: 'NeuroPAL data.zip: 43 .mat files plus README.md and LICENSE.md. README: 10 animals with head and tail volumes
  (n_items 20), each with a *_ID.mat identification file; the 3 activity-trace .mat files are not images. README
  and Zenodo license field: MIT. All neurons identified by one annotator (README). enricher: files are MATLAB v5
  MAT-files, not HDF5 as the README says; data.formats hdf5 -> other. enricher: channels 5 confirmed in the files.
  enricher: voxel size left null: info.scale (um/px) is 0.20768/0.20768/0.75 in 70_YApLR.mat and 0.20757/0.20757/0.75
  in 76_YApDV.mat, so lateral size differs slightly per volume.'
