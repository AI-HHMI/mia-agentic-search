notes: 'NeuroPAL data.zip (1.1 GB) listed with peek_archive: 43 .mat files plus README.md and LICENSE.md;
  the listed image files are "NeuroPAL ID Images/otIs669 Young Adults/{Dorsal-Ventral,Left-Right} Views/<animal>_YA{a,p}{DV,LR}.mat"
  with matching *_ID.mat identification files. The README says 10 animals with head and tail volumes,
  so n_items is 20 (the listing also shows several view variants, count of volumes by view not verified).
  The activity traces (.mat) are not images. Files are called HDF5 by the README. Pixel size is stored
  per volume in the .mat "scale" field (microns/pixel) and is not stated in the README or abstract; the
  full paper text is not open access (Europe PMC), so voxel size, microscope and objective were not read
  from Methods. The README names an MIT license and the Zenodo license field says MIT. All neurons were
  identified by one annotator, per the README. Number of channels (5) is RGBW plus the DIC channel index
  per the README, not checked in the files.'
