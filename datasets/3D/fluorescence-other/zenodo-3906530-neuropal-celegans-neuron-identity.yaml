  notes: 'Sampled with an ad hoc MAT v5 reader (numpy + zlib, no scipy/MATLAB): 70_YApLR.mat (23.25 MB), 76_YApDV.mat,
    70_YApLR_ID.mat, 11_YAaLR_ID.mat; 50.9 MB total. value_range [0, 65535] is from one sample (both volumes span
    the full uint16 range). Files are MATLAB v5 (zlib-compressed elements), not HDF5 as the README says; TensorSwitch
    has no MAT reader, so automatic conversion is not possible as is. ID files store neurons as a MATLAB object
    (MCOS); mp_params is readable. Voxel size not set: info.scale differs per volume in the 4th digit (0.20768 vs
    0.20757 um lateral, 0.75 um z in both); checked: file headers (2 of 20 volumes), Zenodo API, README, bioRxiv
