    no resolution tags. Some scan folders are ''Resampled''/''derived'' per their file names. value_range from one sample
    slice each; label slice 045 of PMA_2_11 holds values 0-6 (0 = 70% unlabelled, 6 = 29%, 1-5 < 0.2% each); the value-to-class
