notes: 'The dataset card holds only front matter (license cc-by-4.0, tags micro-ct, manduca, muscle, segmentation); there is
  no description, no paper, no voxel size, no label classes and no stated annotation procedure, so those fields are null/unknown.
  Species is given only as "manduca" in the tags (genus used; Manduca sexta not confirmed). Structure from peek_archive: three
  zips (abdominal 9,150 files, postabdominal 6,946, thoracal 6,436 TIFF slices), each with six scan folders and six matching
  _label folders with identical slice counts, i.e. 18 image/label volume pairs, 13.0 GB in total. The repository also ships
  trained Dragonfly (.ORSModel) models under dragonfly_models/ and a 1334x1448 uint8 example.tiff. Which tissue (muscle) classes
  the labels hold was not read from file contents.'
