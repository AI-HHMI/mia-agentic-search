notes: 'Files from the OPARA bundle listing: three coarse-scan zips (EPP120/180/240_CS.zip, about 5.2-5.5 GB each, raw .vol), four high-resolution Zeiss .txm files (about 2 GB each), seven segmented TIFF volumes (three coarse, four high-resolution ROIs, 0.3-1 GB each), ROI definition zips and .pca/.pcr parameter files. Voxel size 7 um is the coarse-scan VoxelSizeX/Y of 0.00699985 mm in EPP120_CS.pca (the record text also mentions a 26 um plane resolution, which was not reconciled); the voxel size of the high-resolution ROI scans is not stated in the files read, so the stated voxel size applies to the coarse scans only. Segmentation used Fiji Trainable WEKA Segmentation (classifier trained on one slice, automatic, no manual proofreading stated). formats lists only tiff (the segmentations); the raw .vol and .txm files are not in the schema format list. No archive contents were opened. No paper is linked on the OPARA record, so none is listed.'
