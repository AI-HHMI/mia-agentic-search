notes: 'Files (OPARA bundle, 28 bitstreams): coarse scans (CS, GE v|tome|x L 450) as EPP120/180/240_CS.zip each holding one
  .vol, with .pca/.pcr parameter files; high-resolution ROI scans (HRS, Zeiss Versa 520) as four .txm files; segmented TIFF
  stacks for the three coarse scans, four HRS ROIs and four small CS ROIs; ROI definition zips (ImageJ .roi). Segmentation:
  Fiji Trainable WEKA (classifier trained on one slice, automatic). Classes cell walls, cell volume, background (OPARA TechnicalInfo).
  formats lists tiff only; .vol and .txm are not schema formats. enricher: voxel size set to null (was 7000 isotropic): CS
  .vol 6.99985 um (EPP120_CS.pca VoxelSizeX), CS segmented TIFFs 26.36 x 26.36 x 6.99 um (ImageJ header; OPARA: 26 um plane,
  7 um axial), HRS segmented 1.0024 um isotropic (ImageJ header).'
