description: One whole-body nano-CT volume of a 152 um long tardigrade (Hypsibius exemplaris), isotropic
  270 nm voxels, with its manually segmented label field covering the major organs (digestive system,
  salivary glands, ovary, Malpighian tubules, brain and ganglia) and 137 individually segmented storage
  cells. The processed image stack and the label field are separate 3D TIFF files, deposited as figshare
  supplementary files of the paper.
