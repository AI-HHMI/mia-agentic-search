notes: 'A single specimen: one volume (3D TIFF, 48.8 MB, figshare 8116028) plus its label field (3D TIFF, 1.6 MB, separate figshare record 8116031, https://ndownloader.figshare.com/files/15132596). Figshare lists the license as "CC BY + CC0" with the CC BY 4.0 URL; CC-BY-4.0 used. Voxel size 270 nm isotropic is from the paper Methods for the whole-body scan (a head region was rescanned at 200 nm; its labels were merged into the label field per the paper); the TIFF headers were not read, so the array shape and whether the deposited stack is downsampled are unknown. The label field is much smaller than the image stack and the number of label classes is not stated; the paper says the majority of structures were segmented manually in Fiji and Amira. Paper availability statement: data are included in the additional files.'
