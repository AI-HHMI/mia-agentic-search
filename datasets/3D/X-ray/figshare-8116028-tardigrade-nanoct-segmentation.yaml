notes: 'A single specimen: one volume (3D TIFF, 48.8 MB, figshare 8116028) plus its label field (3D TIFF,
  1.6 MB, separate figshare record 8116031, https://ndownloader.figshare.com/files/15132596). Figshare
  lists the license as "CC BY + CC0" with the CC BY 4.0 URL; CC-BY-4.0 used. Voxel size 270 nm isotropic
  is from the paper Methods for the whole-body scan (a head region was rescanned at 200 nm; its labels
  were merged into the label field per the paper);  The label field is much smaller than the image stack;
  the paper says the majority of structures were segmented manually in Fiji and Amira. Paper availability
  statement: data are included in the additional files. enricher: types now semantic-segmentation only
  (was +instance): the label file holds 12 values (0-11), not per-cell IDs for the 137 storage cells.
  Stack 644x268x289 at 270 nm = 174x72x78 um, consistent with the 152 um animal (not downsampled). The
  200 nm head scan (paper Additional files 5/6) is not part of this record.'
