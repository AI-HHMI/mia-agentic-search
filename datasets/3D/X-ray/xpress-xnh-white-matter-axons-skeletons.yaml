title: 'XPRESS: Xray Projectomic Reconstruction - Extracting Segmentation with Skeletons (ISBI 2023)'
short_name: Mouse white matter axon skeletons (X-ray XNH)
description: Three X-ray holographic nanotomography (XNH) volumes (training, validation, test; 1200^3 voxels each) of
  mouse cortical white matter from the XPRESS ISBI 2023 challenge. Training and validation volumes carry manual axon
  skeleton annotations (1815 axons in total) and the training volume a 200^3-voxel voxel-wise instance segmentation of
  myelinated axons. Test volume is raw only.
