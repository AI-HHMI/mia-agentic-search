notes: 'From Multiscale_File_List.tsv and the FTP folder listings: 19 *_IMAGE/*_LABELS pairs (microCT of whole organs
  and villi, SBF-SEM volumes). Images are TIFF or HDF5 (+ .xml) up to 24 GB; Voxel sizes range 3-150 um (microCT)
  and are 0 for SBF-SEM in the file list, so none is recorded. Giraffe and rhino species are not named, so omitted
  from organism. Masks: Microscopy Image Browser, thresholding plus semi-manual curation. Paper not open access;
  abstract only. enricher: size_bytes = sum of Content-Length over all 62 files (GIRAFFE_1 and GIRAFFE_3 IMAGE.h5
  report no size: index shows 0). organisms: Mus musculus = MOUSE_*, Homo sapiens = HUMAN_*, Bos taurus = COW_*,
  Ovis aries = SHEEP_*, Equus asinus = DONKEY_*; GIRAFFE_*, RHINO_* unnamed species. modality: SBF-SEM = *_SBFSEM_*,
  X-ray = *_microCT_*.'
