notes: 'From Multiscale_File_List.tsv and the FTP folder listings: 19 *_IMAGE/*_LABELS pairs (microCT of whole organs and
  villi, SBF-SEM volumes). Images are TIFF or HDF5 (+ .xml) up to 24 GB; the listing shows size 0 for GIRAFFE_1 and GIRAFFE_3
  IMAGE.h5. Voxel sizes range 3-150 um (microCT) and are 0 for SBF-SEM in the file list, so none is recorded. Giraffe and
  rhino species are not named, so omitted from organism. Masks: Microscopy Image Browser, thresholding plus semi-manual curation.
  Paper not open access; abstract only.'
