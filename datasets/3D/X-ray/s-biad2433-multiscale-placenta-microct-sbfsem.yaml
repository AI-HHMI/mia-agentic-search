short_name: Mammalian placenta microCT and SBF-SEM with labels
description: Multiscale 3D image datasets of mammalian placentas (mouse, human, giraffe, cow, sheep, donkey, rhino)
  with matching label volumes, listed as 19 image/label pairs - whole-organ and villi microCT (voxel 3-150 um),
  and SBF-SEM volumes of microvilli and a giraffe villus - plus ten human H&E slide-scanner PNGs without labels
  and COMSOL model files. Segmentation masks were made in Microscopy Image Browser by intensity thresholding with
  semi-manual curation.
