notes: 'Single 35 GB zip (24,518 files, listed with peek_archive): 24,158 DICOM slices under Original data,
  358 automatic-segmentation NRRD files (2014 Paper (Lau) cohort) and only one manual segmentation (907-L,
  .seg.nrrd plus label NRRD and colour table). Number of scanned knees and voxel size are not stated on
  the Zenodo page or the paper abstract (paper not open access, full text unavailable), so voxel_size_nm
  and n_items are null; authors are not captured from the page. Micro-CT, not light/electron microscopy;
  included as X-ray. The paper is the cohort source; the dataset itself was released to benchmark Kitware
  3D bone characterization tools.'
