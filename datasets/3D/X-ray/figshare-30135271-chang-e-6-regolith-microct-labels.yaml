notes: 'Three zips (peek_archive), 1,000 TIFF slices each: raw 16-bit (12.7 MB per slice), semantic label overlays and instance label overlays (13.0 MB per slice). Slice count, 2516 x 2516 px size and 0.9923 um voxel come from the figshare description and paper Methods. Labels are model outputs: a few sparse manual pixel labels (edge/particle/pore) were grown into random-forest pseudo-labels, used to train a U-Net, followed by marker-controlled watershed for instances; the paper reports no instance-level manual ground truth for the whole volume. Whether the TIFFs are colour overlays or label indices was not checked, hence the label format is not stated. The figshare landing page answered with a bot challenge (HTTP 202/403) so the record was read through the figshare API; the BSE CSV tables (grain sizes) are also included. Lunar material, so organism is empty.'
