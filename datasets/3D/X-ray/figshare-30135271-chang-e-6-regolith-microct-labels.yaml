title: Chang'E-6 lunar regolith micro-CT slices with semantic and particle instance segmentation labels
short_name: Lunar regolith micro-CT particle labels (X-ray)
description: 1,000 consecutive axial micro-CT slices (2516 x 2516 px, 16-bit, 0.9923 um isotropic voxels)
  of about 30 mg of Chang'E-6 far-side lunar regolith sample CE6C0200, with matching 3-class semantic
  segmentation (particle, pore, edge) and particle instance segmentation label overlays, plus grain-size
  tables from a backscattered-electron (BSE) analysis of the same sample. The labels come from a semi-supervised
  pipeline (sparse manual labels, random-forest pseudo-labels, U-Net, watershed), not full manual annotation.
