notes: 'Figshare item with two rats (AWA030, AWB008): per rat a downsampled image nii.gz (factor 4, 613 x 613 px slices at 40 um per the TOML; full-resolution scans were not uploaded, only their TOML config at 10 um) and a muscle-layer segmentation nii.gz (file listing only; mask labels, size and annotator are not described). Differs from the other uterine sets (estrus, diestrus, proestrus, metestrus, AWA015) by animal and cycle stage. Companion paper (Roesler et al., J Anat) covers AWA015 only, so none is cited here.'
