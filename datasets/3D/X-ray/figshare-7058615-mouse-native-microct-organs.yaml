notes: 'Single zip (1_nativeCTdata.zip) of Analyze files: per scan folder CT140 and CT280 volumes plus Organ*.img/.cls
  labels. Sibling record for the contrast-enhanced scans is figshare 7058618 (not included here). Related annotation-only
  re-labelling is Zenodo 5121272. enricher: voxel size 28000 -> 280000 nm: the paper reconstructs at 28 um, but
  the files are a pyramid (CT140, CT280; "CT280 is generated by averaging eight neighboring voxels of CT140") and
  the native segmentations use CT280; Analyze headers give 0.28 mm for CT280 and all label volumes, 0.14 mm for
  CT140. The 28 um reconstruction is not in the archive.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  1 file, 4.5 GB (figshare)\n  1_nativeCTdata.zip   1506 members, 10.0 GB uncompressed\n    1_nativeCTdata/M<01-20>_<time>/\
      \   140 scan folders (0.25h, 002h, 004h, 008h, ...)\n      CT140.hdr/.img    int16  284 x 210 x 400 (x,y,z)\
      \   0.14 mm   ~48 MB\n      CT280.hdr/.img    int16  142 x 105 x 200           0.28 mm   ~6 MB\n      Organ.hdr/.img/.cls\
      \          uint8 on the CT280 grid (105 folders)\n      Organ1.*, Organ2.* (or 'Organ2 .*')  two evaluators\
      \ (35 folders)\n      Bed.hdr/.img/.cls            mouse bed / body classes 0-5\n      Thumbs.db (2 folders)"
    n_files: 1
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/12981293::1_nativeCTdata/M01_0.25h/CT280.img
    - https://ndownloader.figshare.com/files/12981293::1_nativeCTdata/M01_0.25h/CT280.hdr
    - https://ndownloader.figshare.com/files/12981293::1_nativeCTdata/M01_0.25h/Organ1.img
    - https://ndownloader.figshare.com/files/12981293::1_nativeCTdata/M01_0.25h/Organ1.hdr
    - https://ndownloader.figshare.com/files/12981293::1_nativeCTdata/M01_0.25h/Organ1.cls
    size_bytes: 8946995
    description: 'Scan M01 at 0.25 h: the CT280 volume and the first evaluator''s organ labels with their class
      file.'
  arrays:
  - role: raw
    path_pattern: 1_nativeCTdata/*/CT280.img
    format: other
    axes: zyx
    shape:
    - 200
    - 105
    - 142
    shape_varies: null
    dtype: int16
    compression: none
    value_range:
    - -1000
    - 4513
    normalization: none
    alignment: not-applicable
    alignment_notes: Analyze 7.5, little-endian, header dims x,y,z = 142,105,200, pixdim 0.28 mm; Hounsfield units
      (paper). Pair each .img with its .hdr.
  - role: raw
    path_pattern: 1_nativeCTdata/*/CT140.img
    format: other
    axes: zyx
    shape:
    - 400
    - 210
    - 284
    shape_varies: null
    dtype: int16
    compression: none
    value_range: null
    normalization: none
    alignment: not-applicable
    alignment_notes: Finer pyramid level, pixdim 0.14 mm; CT280 is CT140 averaged 2x2x2 (paper). Labels are not
      on this grid.
  - role: label
    path_pattern: 1_nativeCTdata/*/Organ*.img
    format: other
    axes: zyx
    shape:
    - 200
    - 105
    - 142
    shape_varies: null
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 10
    normalization: none
    encoding: semantic-ids
    classes:
    - id: 0
      name: unclassified
    - id: 1
      name: Bone
    - id: 2
      name: Lung
    - id: 3
      name: Heart
    - id: 4
      name: Liver
    - id: 5
      name: Intestine
    - id: 6
      name: Bladder
    - id: 7
      name: Spleen
    - id: 8
      name: Stomach
    - id: 9
      name: Muscle
    - id: 10
      name: Kidneys
    alignment: same-grid
    alignment_notes: 'Same grid as CT280 in the same folder. Class IDs differ between files: read each file''s .cls
      (classes above are M01_0.25h/Organ1.cls; Organ2.cls there adds Trachea and orders 1-11 differently).'
  - role: label
    path_pattern: 1_nativeCTdata/*/Bed.img
    format: other
    axes: zyx
    shape:
    - 200
    - 105
    - 142
    shape_varies: null
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 5
    normalization: none
    encoding: semantic-ids
    classes: null
    alignment: same-grid
    alignment_notes: Bed.cls names the classes only 1-5; the paper says it covers the mouse bed and whole body.
  notes: 'Listed with tools/listing.py (figshare): 1 file, 4,495,345,483 B; members with tools/peek_archive.py (1506).
    Read 5 .hdr headers and sampled CT280, Organ1 and Bed of M01_0.25h (3.4 MB compressed) with nibabel''s Analyze
    header reader. value_range from one scan. Analyze 7.5 is not a TensorSwitch input format (format other). Label
    file names are inconsistent: Organ, Organ1/Organ2 and "Organ2 " with a trailing space; .cls class indices differ
    per file.'
