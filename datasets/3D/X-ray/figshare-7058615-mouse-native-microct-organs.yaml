title: Native micro-CT scans of mice with manual whole-body organ segmentations
short_name: Mouse whole-body organ segmentation (micro-CT)
description: 140 native (no contrast agent) whole-body micro-CT volumes of 20 female BALB/c nu/nu mice, each imaged
  at seven time points, with manual and semi-automatic 3D organ segmentations (bones, lung, spleen, liver, stomach,
  kidneys, intestine, heart, bladder, thigh muscle, etc.). 35 scans have a second evaluator's segmentation. Part
  of the Rosenhain et al. 2018 preclinical micro-CT database.
