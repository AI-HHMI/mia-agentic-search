notes: 'Files listed from the BioImage Archive FTP: Human_embryo_atlas.zip (about 17 GB, raw reconstructed slices and STL
  models per sample), Segmented_masks.zip (92 MB; peek_archive: 12,243 files, 5.0 GB uncompressed, TIFF slices) and a
  file list xlsx. The paper (Sci Data 2024, full text read) gives isotropic voxel sizes per sample (25 um for 13-14
  weeks, then 29, 32, 36, 36 and 35 um for 15-19 weeks), so a single voxel size is not recorded. Segmentation was done
  manually in Avizo on every 3rd to 5th slice with linear interpolation between slices, then cartilage and ossification
  regions were split by grey value. The study page states CC0 while the paper links CC BY 4.0; the BioStudies entry (CC0) is used.
  The Human_embryo_atlas.zip index could not be read (server did not report a size), so its contents follow the paper
  description. The release date is not stated on the entry, so date_published is null.'
