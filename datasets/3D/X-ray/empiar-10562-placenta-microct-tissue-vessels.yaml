notes: 'Listing: raw_tomogram_data (2120 TIFF slices) and segmented_data with four files (two 13.5 GB
  predicted segmentations, a 56.6 MB tissue training HDF5 and a 16.8 MB vessel training TIFF). Paper Methods:
  ground-truth for Specimen 1 was made with SuRVoS on a 256^3 px region (vessels) and 384^3 px region
  (tissue), then a U-Net predicted the full volume, so annotation source is mixed and coverage partial.
  Effective isotropic pixel size 0.81 um is from the paper for its scans; it is assumed to apply to this
  entry (the EMPIAR record has no pixel size). The paper data statement says the second specimen is at
  EMPIAR-10563, which is not part of this record. File names use sample ID 123761 while the paper mentions
  DLS IDs 13761 / 123861, so the exact mapping of training/predicted files to specimens was not verified.
  n_items=1 volume. A related ROI-crop training dataset of the same work is EMPIAR-13952 (separate PR).'
