title: Stacked Dense Denoise-Segmentation Volumetric Annotations (X-ray micro-CT of a corroding Al/Mg pin)
short_name: Al/Mg corrosion micro-CT 4-class labels (X-ray)
description: Volumetric 4-class annotations (air, base material, magnesium deposits, gas pockets) of a synchrotron micro-CT
  tomogram of a salt-water droplet on a 500 micron aluminium pin with magnesium deposits, imaged at Diamond Light Source
  I13-2. The same tomogram is deposited as two reconstructions (FBP from 3601 projections, CGLS from 91 projections), which
  gives a high-quality / undersampled pair for denoising and segmentation. Reconstructions are 2160 x 2560 x 2560 voxels.
