notes: 'Three Zenodo records: annotations 2646117 (annotations0.zip, 94 MB; one 57 GB HDF5), CGLS reconstruction from 91 projections
  2645838 (30.8 GB zip) and FBP reconstruction from 3601 projections 2645965 (30.4 GB zip); size_bytes sums the three zips.
  Classes from the Sci Rep paper (PMC8640015) and the open-access Mach Vis Appl paper. Labels made with SuRVoS (semi-automatic
  workbench) on the FBP reconstruction, so source stays unknown. The paper split the volume into 64^3 cubes (70/10/20) but
  no split files are provided. organism: none, non-biological sample (Al/Mg pin with salt-water droplet). enricher: annotations.format
  dtype/shape from HDF5 header; download_url set to landing page (dataset is three archives); voxel size still not stated
  anywhere.'
