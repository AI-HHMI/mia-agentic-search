notes: 'Three Zenodo records: annotations 2646117 (annotations0.zip, 94 MB; one 57 GB HDF5 when unzipped), CGLS reconstruction
  from 91 projections 2645838 (30.8 GB zip) and FBP reconstruction from 3601 projections 2645965 (30.4 GB zip); size_bytes
  sums the three zips. Classes and tomogram size (2160x2560x2560) are from the Sci Rep paper (PMC8640015) that reuses the
  data; the Mach Vis Appl network paper was not open access (abstract only). One highly sampled tomogram was annotated and
  split into 64^3 cubes per the paper, but no split files are provided. Zenodo says SuRVoS (semi-automatic) was used, so
  source is unknown. Voxel size not stated on Zenodo pages or paper text read; HDF5 headers not probed. Related unannotated
  4D series: zenodo 4293394 (not included).'
