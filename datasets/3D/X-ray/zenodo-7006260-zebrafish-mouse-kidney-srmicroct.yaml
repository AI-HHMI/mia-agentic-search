description: 'Reconstructed synchrotron radiation micro-CT (ANATOMIX, SOLEIL; 0.65 um pixel size) volumes of gentamicin-treated and
  control zebrafish larvae and mouse kidney biopsies, with manually segmented masks: the proximal tubule lumen in zebrafish larvae and
  individual glomeruli in mouse kidney. Provided as full-size, cropped high-resolution and binned TIFF stacks.'
