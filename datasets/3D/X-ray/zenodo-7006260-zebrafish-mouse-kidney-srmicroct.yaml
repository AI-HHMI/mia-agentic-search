notes: 'Tiny dataset by item count: 2 zebrafish scans (control, treated) and 2 mouse
  kidney scans (control, treated), each with masks; sizes from Zenodo (zips 15.4 +
  5.6 GB, total 21.0 GB incl. supplements). Voxel size 0.65 um isotropic from paper
  Methods (effective pixel size of the original SRuCT); the binned copies are 2x coarser.
  Zip listings via peek_archive: 40 tif files incl. *_Binary_lumen.tif masks and glomerulus
  crops; mask-to-raw file pairing is by file name only and was not checked against
  the headers. Species per paper: zebrafish larvae and mouse. Mask coverage is partial
  (one structure per scan; five glomeruli per mouse scan). Labels are for tubule lumen
  / glomeruli only. No download_url set: two zips on Zenodo.'
