notes: '2 zebrafish scans (control, treated) and 2 mouse kidney scans, each with manual Amira masks (paper Methods). Voxel size 0.65
  um isotropic (paper Methods) applies to the original-resolution crops in High_res_cropped/; the top-level volumes and masks are binned
  copies, resolution halved in each dimension (Zenodo description), i.e. 1.3 um. organisms: Danio rerio = Zebrafish_embryo.zip, Mus
  musculus = Mouse_kidney.zip. Coverage partial: zebrafish masks mark the proximal tubule lumen; each mouse mask marks one glomerulus
  (5 per scan). enricher: channels 1 (was null); size from the full Zenodo listing (was 21.0 GB rounded); download_url set to the record
  page (two zips, no single archive).'
