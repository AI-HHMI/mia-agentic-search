notes: 'Single volume only. The mask is a thresholded segmentation (anisotropic diffusion, global threshold 0.5, hole filling)
  produced by the authors, not manual annotation, so it is a weak label. No associated paper is listed in the Zenodo record
  (checked record metadata and description), so no paper was read. Files are headerless .raw zips: the binarized zip lists
  one 1157.6 MB uint8 raw member (peek_archive); the uint16 raw zip was not listed. Formats are headerless raw volumes, hence
  other. size_bytes is the sum of the two zip files (72,033,752 + 2,261,837,075). enricher: voxel size 1124.997 nm from the
  Zenodo description ("Voxel size: 1.124997 um", was rounded to 1125); size confirmed by file listing; data.download_url set
  to the record page (two direct zips, no single archive); sample read shows little-endian uint16 raw and {0,1} uint8 mask.'
