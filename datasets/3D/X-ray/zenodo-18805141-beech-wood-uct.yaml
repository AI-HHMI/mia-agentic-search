  notes: 'Listing (Zenodo API, zip central directories): 2 zips, 2,333,870,827 B, complete. Both zips use deflate around a
    headerless .raw member whose size equals 1050^3 x bytes per voxel. Sample (own script, requests + zlib, streamed from
    the start of each deflate member): raw first 10 slices (22.0 MB compressed read) min 164, max 65342, mean 32764, std 8003;
    little-endian gives smooth slices (mean |dx| 2142 vs 21815 big-endian). Mask first 59 slices (4.2 MB read): values {0,1}.
    value_range is from these partial samples only. Normalization unknown: Zenodo calls the raw volume "unprocessed", but
    it spans almost the full uint16 range, which suggests rescaling at reconstruction. Axis order not stated (cubic volume,
    so shape is unambiguous; z-slowest is the usual convention but unconfirmed); axes left null. Format is headerless raw
    (other); TensorSwitch has no reader for it, so automatic conversion needs a raw reader with dtype, byte order and shape
    from the file name.'
