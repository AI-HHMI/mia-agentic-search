  notes: 'Zenodo listing (tools/listing.py): 63 files, 29,507,489,467 B, file-listing (includes 3 x 49
    MB models). Probed recon_W16_D_S1_R3 pair, recon_W16_D_S1_R2.tif (1641x1080 pages, LZW) and SPP_P21_SCE2_C2_ROI_1.labels.tif
    (128x1750x1750, uncompressed); 07_top.tif_roi1.tif and recon_W16_D_S1_R2.label.tif gave no header
    in time. Sampled the smallest pair (7.9 MB): raw uint8 0-255 (56 distinct values, mean 75.7), label
