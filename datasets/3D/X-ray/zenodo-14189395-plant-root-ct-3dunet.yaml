    microCT 6.5 um, X-TEK XTH 225 45 um), so imaging.voxel_size_nm stays null; per-file values are in
    notes. Checked: TIFF headers (no calibration), xlsx, Zenodo API record, DeepBranchAI paper. Files
    are individual direct links; no single archive.'
