title: Training Data - Plant root segmentation using 3D-Unet
short_name: Plant roots in soil CT segmentation (X-ray)
description: X-ray micro-CT volumes of wheat, barley and maize roots growing in soil with matching root label volumes, used to train a
  3D U-Net for root segmentation. The deposit has 29 image volumes with TIFF label volumes (scanned at ANSTO micro-CT, 6.5 um, or
  an X-TEK XTH 225 system, 45 um), a summary spreadsheet and three PyTorch model files.
