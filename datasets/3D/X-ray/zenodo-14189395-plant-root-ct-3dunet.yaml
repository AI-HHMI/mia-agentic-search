notes: 'Zenodo file list: 29 image volumes, 30 label files (the label recon_BARLEYWT_WW_S1_R1.label.tif has no image in the deposit although the
  summary spreadsheet lists the image), the summary xlsx and three .pytorch models. The xlsx gives plant and scanner per file: wheat, barley and
  maize roots; ANSTO microCT at 6.5 um (most files) and X-TEK XTH 225 at 45 um (maize ROI files), so voxel_size_nm is null as it differs by
  file. Organism names are the xlsx common names mapped to species and are not stated as binomials. The Zenodo page has only a one-line description
  and no listed paper; the DeepBranchAI paper (full text read) reports using 29 root volumes from this record, so it is cited as a user of
  the data. Label origin is not described, so source is unknown. download_url is null because the data are many separate TIFF files.'
