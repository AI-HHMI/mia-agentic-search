notes: 'Synchrotron X-ray tomography (microscopy-scale, 0.3 to 2.6 um pixels); no labels, usable as real
  multi-resolution data for super-resolution. The record holds 4 HDF5 files of 500 MB (500 x 1000 x 1000
  voxels, 8-bit crops). Pixel sizes per file (Zenodo description): 169068 = 2.6 um, 169067 = 1.625 um,
  169066 = 0.8125 um, 169065 (listed as 160695) = 0.3125 um; the paper gives 0.325 um for the finest scan,
  so the exact value is unresolved and voxel_size_nm is null because it differs per file. Full-size raw
  and processed volumes (over 50 GB each, 2510 x 2510 x 2110 voxels) are separate Zenodo entries: 12206815,
  13327651, 13327682, 13327692 (processed) plus raw entries listed in the paper (13327891, 13327931, 13327958,
  13327961). A DIAD XRD-CT dataset and a DIAD XCT dataset from the same paper are separate entries and
  not covered here. The paper states the four resolutions were spatially aligned for the shown sub-slice;
  alignment of the 8-bit crops was not checked.'
