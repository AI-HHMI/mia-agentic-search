title: Multi-resolution synchrotron X-ray tomography of a zinc-doped zeolite 13X particle (8-bit sub-volumes)
short_name: Zeolite 13X multi-resolution XCT (X-ray)
description: Four spatially aligned 8-bit sub-volumes (500 x 1000 x 1000 voxels each) of one zinc-doped
  zeolite 13X particle, imaged by synchrotron X-ray computed tomography on beamline I13-2 at Diamond Light
  Source at four pixel sizes, offered as experimentally acquired low- and high-resolution data for benchmarking
  super-resolution and data-fusion methods. The full volumes (over 50 GB each) are in linked Zenodo entries.
