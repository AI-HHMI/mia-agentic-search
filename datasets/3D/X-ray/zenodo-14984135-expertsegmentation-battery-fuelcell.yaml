notes: 'Zenodo lists 8 TIFFs (about 57 MB): NMC_3D, Graphite_3D, PEMFC_3D, NMC_2D and a _Labels file for each. Headers
  (probe.py): NMC_3D is a 75x75x75 uint16 stack, Graphite_3D is at least 119x128x128 uint16, NMC_2D is a 1195x14967
  uint8 image; PEMFC_3D header could not be read (SSL error). Hand labels made with Ilastik; 2, 4, 3 and 5 phases
  for NMC_3D, NMC_2D, Graphite_3D and PEMFC_3D. Materials-science data, small sample volumes released with an NeurIPS
  2024 submission; the volumes come from earlier published electrode and fuel-cell studies cited in the Zenodo references.
  Voxel and pixel sizes are not stated on the Zenodo page, the docs readme or the paper abstract; the Acta Materialia
  paper is not open access and was not read in full. Primary modality is micro-CT (X-ray); the SEM image has no
  enum value so ''other'' is listed.'
