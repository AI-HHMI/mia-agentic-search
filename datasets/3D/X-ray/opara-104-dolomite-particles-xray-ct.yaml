notes: 'Files: Dolomit_raw.zip (993 .tiff slices, ~2 MB each) and Dolomit_segmented.zip (951 .tif slices
  in Split30/), plus acquisition/reconstruction/size-distribution images; size_bytes is the OPARA datacite.size.
  Voxel size is not in the metadata or paper; x=y=z=1.9969 µm is the instrument pixel size read from the
  deposited reconstruction screenshot (Info panel, 4x lens, binning 2), not checked against TIFF headers.
  The segmented stack has 951 slices vs 993 raw, so alignment is unverified. Paper: particles segmented
  by single-threshold binarisation plus watershed in ImageJ, then manually sorted (under/over-segmented
  particles discarded), hence source mixed; label encoding not inspected. Sibling PARROT records (same
  scanner, other materials, separate samples): Mica (OPARA-107), Al2O3 (OPARA-105), Limestone (OPARA-108),
  Quartz (OPARA-106), soda-lime glass (OPARA-109). Non-biological sample, so organism is empty.'
