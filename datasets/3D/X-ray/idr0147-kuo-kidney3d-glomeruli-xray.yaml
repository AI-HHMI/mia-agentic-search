notes: 'Manual annotations (glomeruli D4, extrarenal fat D9) exist only for Kidney_2 as 3 small ROIs each; remaining
  segmentations (vessels, tubules, whole-kidney glomeruli) are semi-automatic and the paper states they are not
  validated as ground truth. Total size not stated on IDR API record or paper. Download method (Aspera/FTP/Globus
  via IDR) not verified on the page; the OME-TIFF files are also viewable/downloadable via the IDR web client. Checked:
  IDR project API record, map annotation, Kidney_2 file listing, paper full text (Europe PMC). enricher: IDR API
  lists 3 datasets (Kidney_1 27, Kidney_2 47, Kidney_3 29 images); only Kidney_2 has the manual D4/D9 ROI annotations.'
