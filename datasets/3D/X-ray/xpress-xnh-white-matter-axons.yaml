notes: 'Files are 6 GitHub release assets (htem/xpress-challenge-files v1.0); size_bytes is their sum.
  Test ground truth is not public; validation has skeletons but no voxel labels. Paper: three 1200^3 volumes
  at 33.3 nm isotropic, skeletons in 1100^3 (training, test) and 700^3 (validation) subvolumes, 1815 axons;
  voxel-wise ground truth only for a limited training subset. No data license on the challenge page, repo
  README or paper (only the Grand Challenge terms of service), so license is unknown. Source: arXiv 2302.03819
  and challenge page. enricher: HDF5 read: volumes/raw 1200^3 uint8, volumes/labels 200^3 uint32 at offset
  16500 nm, resolution attr 33 nm (paper 33.3 kept). The .npz skeleton files are pickled networkx Graphs,
  not NumPy archives; reading them needs unpickling (untrusted, not done).'
