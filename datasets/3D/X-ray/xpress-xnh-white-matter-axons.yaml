notes: 'Files are GitHub release assets (htem/xpress-challenge-files v1.0): training raw 1,532,488,158 B, training voxel labels 1,919,638 B,
  validation raw 1,511,816,554 B, test raw 1,457,181,029 B, training/validation skeletons 2,525,185 B / 472,951 B. Test
  ground truth is not public (scoring by organisers); validation has skeletons but no voxel labels. Per the paper: three
  1200^3 volumes at 33.3 nm isotropic, skeleton annotation of 1100^3 (training, test) and 700^3 (validation) subvolumes,
  1815 axons in total; voxel-wise ground truth only for a limited training subset. No data license stated on the challenge
  page, the repo README or the paper; the page points to the Grand Challenge terms of service only, so license is unknown.
  HDF5 internals (dataset names, dtype, axes) not inspected (reading headers not done); size_bytes is the sum of the six release assets. Source: arXiv 2302.03819 (ar5iv) and challenge page.'
