title: Estrus datasets (rat uterus PTA micro-CT with muscle masks)
short_name: Rat uterus micro-CT muscle masks (estrus)
description: Downsampled (40 um/voxel) PTA-stained micro-CT volumes of the uteri of two female rats (AWA033 and AWB011) in
  the estrus stage of the oestrous cycle, each with a manual segmentation mask of the muscle layers (myometrium), as NIfTI
  archives, with TOML configuration files for the downsampled and full-resolution (10 um) datasets.
