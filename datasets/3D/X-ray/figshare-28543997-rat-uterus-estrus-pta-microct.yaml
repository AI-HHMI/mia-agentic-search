notes: 'Figshare item with two rats (AWA033, AWB011): per rat a downsampled image nii.gz (factor 4, 613 x 613 px slices at
  40 um per the TOML; full-resolution scans were not uploaded, only their TOML config at 10 um) and a muscle-layer segmentation
  nii.gz. Differs from the other uterine sets (estrus, diestrus, proestrus, metestrus, AWA015) by animal and cycle stage.
  Companion paper (Roesler et al., J Anat) covers AWA015 only, so none is cited here. enricher: masks read (binary 0/255,
  same grid as the image); annotator and method not stated (source unknown).'
