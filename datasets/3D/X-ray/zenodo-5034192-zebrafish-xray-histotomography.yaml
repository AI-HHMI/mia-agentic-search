notes: 'Zenodo copy of the Dryad deposit; CC0 per the Zenodo API. 11 files (7z archives plus syGlass .syg projects), 25.6
  GB, listed from the API and README manifest; archives not opened. README: one 5 dpf larva was manually segmented into brain
  regions (vibe-Z atlas) and registered onto four others; nuclei are ilastik probability maps (automatic); 75 um3 validation
  regions were manually annotated. Voxel size 0.743 um isotropic for 5 dpf larvae, 1.43 um for the 33 dpf juvenile (paper
  Methods). Full bit-depth scans are on request only (paper Data availability). enricher: download_url set to the landing
  page (11 separate files, all 7z/syg; no single archive). voxel_size_nm (743) fits the 5 dpf files only; 33dpf_1 is 1430
  nm.'
