notes: 'Files: TIFF.zip (1.32 GB, 995 .tiff slices of ~2 MB plus a .txt) and TIFF_processed.zip (28 MB,
  821 .tif slices of ~1 MB), plus overview/parameter screenshots and image_processing.txt. Pixel size
  5.8850 um (voxel size x=y=z=5885 nm) read from the deposited reconstruction screenshot (Info panel:
  4x lens, 80 kV, 993 x 1013); not in the metadata or checked against TIFF headers. The binary stack comes
  from a fixed Fiji pipeline (non-local means 50/50, unsharp mask 1.5/0.8, threshold 27756-49087, remove
  outliers 1.5/50), so the labels are automatic thresholding rather than manual annotation; 821 vs 995
  slices means the stacks may be cropped or offset. Paper full text not accessible (MDPI returns 403,
  not open on Europe PMC); only the abstract and the OPARA description were read. Label encoding and image
  shape not inspected.'
