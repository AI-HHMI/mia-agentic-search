notes: 'One CT stack per specimen (Image_Files.zip, 19.4 GB, 16-bit TIFF, 992x1015 px slices) plus manual labels (38 MB zip). Paper splits the 50 specimens 20 train / 10 val / 20 test, but the zips could not be listed (Dryad downloads need a token), so splits_provided is false and formats lists tiff only; the Dryad record also holds a 783 MB network file (.h5), shape-analysis zips and PLY meshes. Paper reports about 11,947 manually labelled 2D slices. Voxel size 1.75 um from paper Methods. Checked: Dryad page and API record, full paper.'
