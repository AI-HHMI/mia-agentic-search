notes: 'One CT stack per specimen (50 16-bit TIFF stacks, ~992x1015 px slices) plus manual 8-bit labels (38 MB zip). Paper
  splits the 50 specimens 20 train / 10 val / 20 test; splits not marked in the files. Record also holds a 783 MB network
  file (.h5), shape-analysis zips and PLY/VTK meshes. Paper reports about 11,947 manually labelled 2D slices. Voxel size 1.75
  um from paper Methods; TIFF resolution tag 1.757 um agrees. enricher: files listed and sampled via the identical Zenodo
  mirror 10.5281/zenodo.11402134 (Dryad blocks scripted downloads).'
