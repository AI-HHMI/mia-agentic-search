short_name: Human pancreas islet segmentation (synchrotron CT)
description: 55 synchrotron radiation micro-CT volumes (650 nm isotropic) of 1 mm human pancreatic tissue cores
  from 32 individuals (donors, non-diabetic, insulin-dependent diabetes, post-neoadjuvant chemotherapy) with matching
  histology images, expert-validated islet of Langerhans annotations for four volumes and trained 2.5D U-Net models.
