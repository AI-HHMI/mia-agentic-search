notes: 'File lists (four sub-cohorts, 272,643 files, 1.21 TB): per volume raw_data/X-Ray_tomography slices (254,156
  TIFF), raw_data/histology (HE, insulin, Ki-67 TIFF), and for 4 of the 55 volumes processed_data/deep_learning/annotation
  (18,148 slices) plus a network zip; only a few volumes have histology masks. So most volumes are unlabelled and
  annotation coverage is partial. The accompanying paper (a data descriptor named on the study page) was not found
  in Europe PMC or by web search, so authors and publications are left empty and the abstract on the BioImage Archive
  page was used. Download via the Globus button on the study page; WebKnossos links are in WK_links_P.csv. coverage:
  islet annotation slices exist for 4 of 55 cores, every slice of each (e.g. P_1_5_1: 4916 of 4916).'
