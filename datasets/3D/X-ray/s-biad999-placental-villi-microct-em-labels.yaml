notes: 'From File List.tsv: Fig_1_Data holds 34 microCT sources (cropped cubes with curated and uncurated labels, and whole
  tissue pieces with labels), Fig_2_Data holds 16 2D EM cross-section pairs, 1 SBF-SEM villus pair and 2 COMSOL models. Paper
  (open access, read): microCT at 4.8 um isotropic voxels (file list says 4 um), labels by intensity thresholding in MIB with
  semi-manual curation and removal of components under 1k voxels. Mule is a hybrid and is not listed under organism. Archive
  formats include a .mph model and csv, not recorded as formats. enricher: organisms by file prefix: Homo sapiens = HUMAN_*,
  Equus caballus = HORSE_*, Equus asinus = DONKEY_*, Equus grevyi = ZEBRA_*, Equus ferus = WILD_* (Przewalski), MULE_* = hybrid.
  Modalities: X-ray = Fig_1_Data, SBF-SEM = Fig_2_Data (2D EM cross sections were imaged on the 3View block face per the paper;
  TEM removed). Voxel size per subset in technical.notes (still null). Coverage: cubes 128^3 subvolumes.'
