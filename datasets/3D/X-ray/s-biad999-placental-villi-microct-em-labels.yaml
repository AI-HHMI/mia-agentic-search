notes: 'From File List.tsv: Fig_1_Data holds 34 microCT sources (cropped cubes with curated and uncurated labels, and whole
  tissue pieces with labels), Fig_2_Data holds 16 2D EM cross-section pairs, 1 SBF-SEM villus pair and 2 COMSOL models. Paper
  (open access, read): microCT at 4.8 um isotropic voxels (file list says 4 um), labels by intensity thresholding in MIB with
  semi-manual curation and removal of components under 1k voxels. EM voxel sizes were not read. Mule is a hybrid and is not
  listed under organism. Archive formats include a .mph model and csv, not recorded as formats.'
