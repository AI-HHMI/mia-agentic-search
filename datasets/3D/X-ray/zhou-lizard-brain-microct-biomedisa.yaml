notes: 'Landing page via WebFetch returned 403; metadata taken from the figshare API record (logged). Figshare files: 06_recon.zip (uncropped
  example), SegmForDLmanual.zip (30 TIFFs = 15 image/label pairs, semi-manual labels: ~20-30 slices manually in Dragonfly then Biomedisa-extended),
  SegmFromDLalgorithm.zip (28 files, labels predicted by the DL network; listing checked with peek_archive), 28_100kV..._recon.zip,
  four Biomedisa trained-network .h5 files. The paper says 29 specimens were scanned. Voxel size 17.4 um effective, from paper Methods
  (isotropic). Label class values/order not documented in the sources checked (paper figure lists six regions by colour). Mixed annotation
  source: manual training labels plus network-predicted labels. enricher: channels 1 (single-channel uint16 CT, sampled); size from
  complete figshare listing; voxel size confirmed by TIFF XResolution (17.42 um).'
