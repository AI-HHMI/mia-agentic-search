  notes: 'Listing: tools/listing.py on the figshare API, 8 files, 6,662,290,233 B, complete; zip members via peek_archive. Sampled SegmForDLmanual
    27_image.tiff + 27_label.tiff (36,952,831 + 301,313 B compressed) with a scratch script using tools/peek_archive.read_member and
    tools/sample.stats (sample.py treats the extension-less figshare zip URL as HDF5). Image: uint16 173x210x550, 7556-45787 (one sample),
    plain TIFF, no ImageJ/OME metadata. Label: uint8, values 0-6 (82.6% background), all 7 present. SegmFromDLalgorithm 02_label.tif
    header probed: uint8 deflate 192x251x583. Voxel size: TIFF XResolution 17.42 um agrees with the paper''s effective 17.4 um. The
    28 recon Header.txt says ''Pixel Size = 15.222057'' (no unit, before magnification compensation per the paper), not used. Not described
    as arrays: 06_recon and 28 recon (uncropped whole-head slice TIFFs, no labels) and the Biomedisa networks (.tar.h5). No single archive
    holds the image/label pairs and the recons, so data.download_url stays null; direct per-file links are https://ndownloader.figshare.com/files/<id>
    (ids in the tree).'
