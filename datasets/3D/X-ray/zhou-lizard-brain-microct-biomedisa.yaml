title: X-ray microCT of Podarcis bocagei lizard heads with semi-manual and deep-learning segmentation labels of six brain regions
short_name: Lizard brain regions segmentation (X-ray microCT)
description: PTA-stained lizard (Podarcis bocagei) head microCT volumes cropped to the brain, with 3D label volumes for six brain regions
  (olfactory bulbs, telencephalon, diencephalon, midbrain, cerebellum, brainstem). SegmForDLmanual holds 15 image/label pairs segmented
  semi-manually and used as training data; SegmFromDLalgorithm holds 14 pairs with labels predicted by a deep-learning network. Also
  an uncropped example scan, one more full-head recon and Biomedisa networks trained on 5-11 volumes.
