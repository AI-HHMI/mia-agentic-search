notes: 'Zip is in nnU-Net layout (Dataset208_murine: imagesTr, labelsTr, imagesTs, labelsTs, dataset.json with numTraining
  200). The record text says 248 scans; the zip holds 1,088 .nii.gz files including macOS ._ copies. The header of one training
  scan (Mur_00004) reads 23.1 um isotropic voxels, 475 x 544 x 519, int16; voxel sizes likely differ between in vivo and ex
  vivo scans (spreadsheet lists Quantum GX2 and FX scanners), so voxel_size_nm is left null. The manuscript is under review
  and no paper link exists yet, so publications is empty and the annotation procedure (record says "reference standard segmentations")
  could not be read; source is unknown. The trained model is in a separate Zenodo record (10.5281/zenodo.19612302).'
