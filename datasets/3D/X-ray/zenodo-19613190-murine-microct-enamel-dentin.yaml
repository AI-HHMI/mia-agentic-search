notes: 'Zip is in nnU-Net layout (Dataset208_murine: imagesTr 200, labelsTr 200, imagesTs 48, labelsTs 48, predictionTs 48, dataset.json with numTraining 200), plus 545 macOS ._ copies. The manuscript is under review and no paper link exists yet, so publications is empty and the annotation procedure (record says "reference standard segmentations") could not be read; source is unknown. The trained model is in a separate Zenodo record (10.5281/zenodo.19612302). enricher: voxel_size_nm stays null: NIfTI headers differ between scans, about 23.12 x 23.16 x 23.16 um (Mur_00004, Mur_00212; 475x544x519) and 20.0 um isotropic (Mur_00133, Mur_00193, Mur_00244; 512^3); the spreadsheet lists in vivo Quantum GX2 / FX and ex vivo Quantum GX2 scans but no voxel size or case IDs.'
