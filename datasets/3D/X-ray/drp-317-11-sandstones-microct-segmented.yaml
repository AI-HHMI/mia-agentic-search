notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field; the paper (Scientific Reports) is CC-BY-4.0. Zip listing (peek_archive): 33 .raw volumes of 1000 MB each (11 samples x grayscale, filtered grayscale and binary) plus previews. The files are headerless raw arrays, which is not in the format enum, hence other. The segmentation is a global IsoData threshold (a different level per sample) on the contrast-filtered 8-bit image, not manual annotation, so it is a weak label; the paper confirms the 2.25 um voxel size, the 1000^3 cubes and the 16-bit to 8-bit conversion. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory and metadata JSON were fetched.'
