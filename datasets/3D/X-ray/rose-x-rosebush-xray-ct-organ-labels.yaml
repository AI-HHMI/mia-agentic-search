notes: 'One zip, ROSE-X.zip (1.53 GB), on a Nextcloud share; direct link from the share page menu. Contents per paper Additional
  file 1: raw X-ray stacks (16-bit TIFF), binary shoot/pot/tag masks (1-bit), organ label stacks (8-bit), shoot-surface masks
  and labels, labelled PLY point clouds. Pixel spacing 0.9766 mm, slice spacing 0.5 mm (paper Methods; the raw ImageJ headers
  agree). Labels: ilastik pixel classifier, then every voxel error corrected by hand (proofread). No licence or terms found
  for the data on the share page, in the paper or in Additional file 1 (the paper itself is CC BY 4.0), so spdx is unknown.
  Dataset DOI none; date_published is the paper date. enricher: formats other -> tiff (probed); size from the share listing
  (was null); download_url = direct zip (was null).'
