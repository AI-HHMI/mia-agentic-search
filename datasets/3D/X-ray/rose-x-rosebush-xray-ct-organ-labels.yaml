  notes: 'Listing: share page menu link (Nextcloud public DAV) serves ROSE-X.zip, 1,534,546,269 bytes, range requests OK;
    central directory read by range (77 members). Sampled S268660_labels.tiff and S268660_binary.tiff in full (members inflated),
    and the first 1.5 MB of S268660.tif (header + first slices: 0-3442 over 5 slices, not a full value range). Shape 601x512x512
