notes: 'Landing page is a Nextcloud share holding one file, ROSE-X.zip (size not shown); peek_archive timed out on
  the Nextcloud download endpoint, so contents and formats were not listed. Per the paper: raw X-ray image stack,
  binary shoot/pot/tag masks with organ labels, surface masks with labels, and labelled point clouds (formats in
  the paper Additional file 1, not read; hence formats other). Pixel spacing 0.9766 mm and slice spacing 0.5 mm
  (paper Methods; converted to nm). Labels: ilastik pixel classifier trained on one plant, then every voxel error
  manually corrected (proofread). Paper is CC BY 4.0 but no licence or terms were found for the data on the share
  page or in the paper, so spdx is unknown. Dataset DOI none; date_published is the paper publication date (Europe PMC pub-date). Data availability in the
  paper says the full dataset is on a University of Angers website (this share).'
