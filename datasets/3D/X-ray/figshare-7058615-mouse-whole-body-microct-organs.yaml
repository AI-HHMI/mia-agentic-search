  notes: 'Listing: figshare API, 2 zips, 8,858,363,164 B exact (file-listing); zip central directories read in place. Headers:
    Analyze 7.5 (348 B) parsed with nibabel for M01_0.25h of both zips. Sample: native M01_0.25h CT280.img, Organ1.img, Organ2.img
    (11.9 MB, streamed from the zip): CT280 int16 [-1000, 4513] (one sample; Hounsfield units per paper, so normalization
    none), Organ1 ids 0-10, Organ2 ids 0-11. Value ranges are from one sample. Format other: Analyze 7.5 is not NIfTI and
    not in the schema list. Class index meaning varies per file: always read the sibling .cls. Some file names contain a space
    before the extension (''Organ2 .img'', ''Bed .img''). Axes zyx follow the Analyze dim order (x fastest). Voxel size from
    headers (0.14 / 0.28 mm) agrees with the paper''s acquired voxel size 0.28 mm and FOV; the paper''s ''reconstructed at
    28 um'' is inconsistent with the files.'
