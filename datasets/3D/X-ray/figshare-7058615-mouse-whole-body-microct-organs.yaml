notes: 'Two figshare items, both CC0 (paper CC BY 4.0): native (140 scans) and contrast-enhanced (85 scans) zips, Analyze
  7.5 .hdr/.img pairs (not in the schema format list, hence other). Preclinical whole-body micro-CT (organ-level, not cellular),
  so scope is borderline; confidence capped at 0.6. No direct single archive: two zips (https://ndownloader.figshare.com/files/12981293
  and /13329248). authors not recorded. No train/test split. enricher: voxel size 280x280x280 um from Analyze headers (CT280
  and all native/_280 labels; CT140 and _140 labels are 140 um), matching the paper''s ''acquired voxel sizes 0.28 mm''; the
  paper''s ''reconstructed at 28 um'' does not match the files (was 28000 nm).'
