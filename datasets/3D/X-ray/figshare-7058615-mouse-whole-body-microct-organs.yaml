schema_version: '1.2'
id: figshare-7058615-mouse-whole-body-microct-organs
title: Preclinical mouse whole-body micro-CT database with 3D organ segmentations
short_name: Mouse whole-body micro-CT organ segmentations
description: 225 murine whole-body 3D micro-CT scans (140 native scans from 20 BALB/c nu/nu mice, 85 contrast-enhanced scans
  from 10 A431-tumour-bearing mice with ExiTron nano 6000) stored at 0.14 mm (CT140) and 0.28 mm (CT280) isotropic voxels, each with manual 3D organ
  segmentations (bones, lung, spleen, liver, stomach, kidneys, intestine, muscle and others) stored as 8-bit class-index volumes
  with .cls class description files. A subset of scans has segmentations from two independent evaluators. Each scan comes
  as a resolution pyramid (CT140, CT280).
