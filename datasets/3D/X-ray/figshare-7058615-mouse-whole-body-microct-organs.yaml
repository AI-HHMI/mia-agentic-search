notes: 'Two figshare files: 1_nativeCTdata.zip (4.50 GB, 140 scans, 1506 files) and 2_contrast-enhanced CT zip (4.36 GB, 85 scans, 1342 files; download file names differ from the paper). Both figshare items are CC0; the paper is CC BY 4.0. Data are Analyze .hdr/.img pairs, which are not in the schema format list, hence formats other. This is preclinical whole-body micro-CT at 28 um voxels (organ-level, not cellular microscopy), so scope is borderline and confidence is capped at 0.6. Download URLs not listed in download_url because there are two separate archives (https://ndownloader.figshare.com/files/12981293 and /13329248). authors not recorded: the page text read did not list them. No train/test split is provided.'
