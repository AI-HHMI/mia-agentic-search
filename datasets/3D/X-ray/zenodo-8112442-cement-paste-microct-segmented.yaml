notes: '15 files (1.3 GB) from the Zenodo API: original_*.tif (3 real micro-CT volumes: 030_412, 040_550,
  045_550 voxels per side), denoised_*.npy, segmented_*.npy, and 6 simulated volumes (HYMOSTRUC, CEMHYD3D;
  200^3 voxels) that are not images. n_items counts all files. Zenodo gives 1 um/voxel for all. The record
  describes the segmentation as made from the denoised image but not how (method unknown), so source is
  unknown; the supporting paper (Limtong et al., Cement and Concrete Composites, manuscript CCC-D-23-00329)
  was not read and is not listed. Only 3 real volumes, so small training signal. npy files are not a listed
  format. No split.'
