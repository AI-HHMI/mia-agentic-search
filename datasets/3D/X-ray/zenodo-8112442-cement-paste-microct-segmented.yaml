  notes: 'Listed all 15 files (Zenodo API); probed both TIFF headers (ImageJ, zyx, uint8, uncompressed)
    and read the .npy headers by range (descr ''|u1'', C order, shapes 412^3 / 550^3 / 200^3). Sampled
    the 030 pair whole (sample.py for the TIFF; a requests + numpy script with allow_pickle=False for
    the .npy, 139.9 MB). value_range from that pair only: label 030 has classes 0-3 (no air void; fractions
