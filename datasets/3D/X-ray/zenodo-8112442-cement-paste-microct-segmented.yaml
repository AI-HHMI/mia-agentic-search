notes: '15 files (1.3 GB): original_*.tif (3 real micro-CT volumes, 412^3, 550^3, 550^3 voxels), denoised_*.npy,
  segmented_*.npy, and 6 simulated volumes (HYMOSTRUC, CEMHYD3D; 200^3 voxels) that are not images. Zenodo
  gives 1 um/voxel for all. The record says the segmentation was made from the denoised image but not
  how, so source is unknown. Only 3 real volumes. npy is not a listed format (label arrays are format
  other). No split. enricher: paper found via Crossref title search (Cement and Concrete Composites 2023,
  10.1016/j.cemconcomp.2023.105299; no open full text); n_items 15 -> 3 (real raw/label volume pairs);
  size from file listing.'
