notes: 'License: docs.neurodata.io/xbrain: Open Data Commons Attribution License (ODC-BY 1.0); repo code
  is Apache-2.0. Voxel size 0.65 um isotropic (paper Methods; groundtruth README; BossDB coord frame).
  Annotated subvolumes per README: V1 300x300x100 (dense cells+vessels), V0 inside V1 (two annotators),
  V2 small test set, V3 held-out test (centroids). enricher: the ground-truth/validation zips (dl.dropboxusercontent.com/u/1260288/...)
  return 404; the only annotated data still online is V1 raw + cell instance map + centroids in the repo
  MAT file, so n_items 4->1, types semantic-segmentation->instance-segmentation, splits_provided true->false,
  download_url = that MAT file. license custom->ODC-By-1.0 (same statement, SPDX id). Full unlabelled
  raw volume (2560x2560x2015 uint8) is on BossDB dyer/dyer16 (precomputed).'
