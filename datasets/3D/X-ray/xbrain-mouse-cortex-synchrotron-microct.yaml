      Mean 0.0, std 19.2: zero-mean but not unit variance; the README describes the original V1 image
      as 8-bit.'
  - role: label
    path_pattern: code/celldetect/data/traindata-celldetect-V1.mat
    format: other
    axes: zxy
    shape:
    - 100
    - 300
    - 300
    shape_varies: false
    dtype: uint16
    compression: none
    value_range:
    - 0
    - 321
    normalization: none
    encoding: instance-ids
    classes:
    - id: 0
      name: background
    - id: null
      name: cell body (one id per cell, 1-321)
    alignment: same-grid
    alignment_notes: MAT variable M, same file and shape as IM. 321 ids = the 321 columns of Centroids_gt;
      centroid i (x,y,z, 1-based) lies in id i at M[y,x,z] for the first 5 checked, which fixes dim0=y,
      dim1=x. 5.0% of voxels labelled.
  - role: label
    path_pattern: code/celldetect/data/traindata-celldetect-V1.mat
    format: other
    axes: null
    shape:
    - 3
    - 321
    shape_varies: false
    dtype: uint16
    compression: none
    value_range:
    - 5
    - 297
    encoding: points-table
    alignment: same-grid
    alignment_notes: 'MAT variable Centroids_gt: rows x,y,z (README), 1-based voxel coordinates in V1.
      Centroids_xb (3x302) in the same file are xbrain detections, not ground truth.'
  notes: 'Sample: downloaded the 68.4 MB MAT file once, read with scipy.io.loadmat (no pickles), deleted;
    value ranges from this one file. Dataset size = this file (the only annotated data still downloadable);
    groundtruth.zip and validation.zip on dl.dropboxusercontent.com/u/1260288 return HTTP 404, so V0/V2/V3
    and vessel labels (Vmap0) are not obtainable. data/ in the repo holds only READMEs and notebooks.
    Full raw volume (unlabelled): BossDB dyer/dyer16 image channel, precomputed at https://bossdb-open-data.s3.amazonaws.com/neurodata/dyer/dyer16/image/
    (uint8, zyx 2015x2560x2560, 650 nm isotropic, raw encoding, 6 levels); BossDB XBrainGTech5/Proj4 has
    cells_Pub/vessels_Pub channels (xbrain outputs, not manual). MAT is not a TensorSwitch input format,
    so the record is not convertible as is.'
