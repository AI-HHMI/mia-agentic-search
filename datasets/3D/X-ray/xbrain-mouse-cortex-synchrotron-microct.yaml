notes: 'License: docs.neurodata.io/xbrain states data is released under the Open Data Commons Attribution
  License (ODC-BY 1.0); no SPDX id in the schema list, so custom. Voxel size 0.65 um from paper Methods
  (10x objective; 2560x2560 reconstructed slices); analysed volume 1400x2480x1547 voxels, but the full
  raw volume is not confirmed to be in the repo (README says the full validation/groundtruth zip is not
  in the repo due to size; getdata notebooks fetch via ndio). Annotated volumes per README: V1 300x300x100
  (only one with dense cells+vessels), V0 inside V1 with two annotators, V2 small cell-detection test
  set, V3 held-out test with centroids only; n_items=4 counts these. Size not stated on any page read.
  File formats MAT (version not checked) and .nii; formats set to other because MAT is not in the enum.
  Download method not a direct archive; files listed on GitHub tree page (sizes not shown).'
