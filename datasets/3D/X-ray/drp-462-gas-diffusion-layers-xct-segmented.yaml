title: X-ray tomography dataset of gas diffusion layers with different coating percentages along with their corresponding segmented images
short_name: Gas diffusion layers X-ray CT with segmentations
description: 'High-resolution (2.05 um) 3D X-ray tomograms of fuel-cell gas diffusion layers with 5, 20, 40 and 60% PTFE coating, imaged dry and with water, each with a segmentation: dry volumes (pore vs fiber) and wet volumes (fiber, air, water), made with 3D Weka segmentation and used to train deep learning segmentation models.'
