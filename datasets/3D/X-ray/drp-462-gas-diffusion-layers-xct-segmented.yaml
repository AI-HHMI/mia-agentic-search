notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Zip listing (peek_archive): 16 TIFFs (4 coatings x dry, wet, segmented dry, segmented wet), 10.6 GB uncompressed; raw volumes are 16-bit unsigned, segmentations 8-bit per the metadata. n_items counts the 8 raw (dry and wet) volumes. Segmentations come from the 3D Weka method (automatic) per the record description, which says deep learning models were trained on this base-case data. The related paper is not open access and only its Crossref record could be read, so the exact train/test usage and image dimensions are not verified. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory and metadata JSON were fetched.'
