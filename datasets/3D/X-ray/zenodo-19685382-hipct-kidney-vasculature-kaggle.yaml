short_name: Human kidney vasculature segmentation (HiP-CT)
description: Complete data of the Kaggle competition "SenNet + HOA - Hacking the Human Vasculature in 3D"; HiP-CT (hierarchical
  phase-contrast tomography) volumes of five human kidneys as TIFF slice stacks, with gold-standard 3D blood-vessel labels
  for the training kidneys (dense and sparse), a high-resolution volume of interest, test kidneys, whole-kidney test volumes
  and the predictions of the top-5 teams.
