notes: 'Zip listed (33,642 members): competition-data/train/{kidney_1_dense, kidney_1_voi, kidney_2, kidney_3_sparse} images+labels,
  kidney_3_dense labels only (slices 0496-0996 of kidney_3, images in kidney_3_sparse), test kidney_5/6 images+labels, whole-kidney
  test images, additional 13 um VOI with labels, team predictions as RLE CSV. Paper (bioRxiv): labels made semi-manually in Amira by
  curators, checked by further curators. enricher: voxel_size_nm set to null (was 50000x50000x50000) because subsets differ: training
  kidneys ~50 um/voxel, public test kidney_5 50.28 um/voxel, private test kidney_6 63.08 um/voxel (paper); kidney_1_voi is a higher-resolution
  VOI (value not stated); additional VOI 13 um (folder name). Differs from catalogued zenodo-15397768 (HiP-CT glomeruli).'
