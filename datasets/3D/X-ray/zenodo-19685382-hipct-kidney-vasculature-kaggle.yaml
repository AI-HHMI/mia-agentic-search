notes: 'Zip listed with peek_archive (33,642 files): competition-data/train/{kidney_1_dense, kidney_1_voi, kidney_2, kidney_3_dense,
  kidney_3_sparse}, test kidney_5/6, whole-kidney test volumes, additional 13 um VOI with labels, team predictions as RLE CSV.
  Paper (bioRxiv full text): gold labels made in Amira by curators, re-labelled by a second curator; training kidneys ~50 um/voxel,
  private test 63 um/voxel. VOI voxel sizes were not read, so voxel_size_nm gives the whole-kidney value. n_items counts volumes.
  Differs from catalogued zenodo-15397768 (HiP-CT glomeruli): different labels and release. Kaggle pages not fetched.'
