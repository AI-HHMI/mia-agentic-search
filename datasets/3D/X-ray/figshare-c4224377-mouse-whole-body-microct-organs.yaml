short_name: Mouse whole-body micro-CT organ masks (X-ray)
description: 225 murine whole-body micro-CT scans (140 native scans of 20 nude mice at seven time points, 85 contrast-enhanced
  scans of 10 tumour-bearing mice) with manual 3D organ segmentations (bone, lung, heart, liver, spleen, kidneys, stomach,
  intestine, bladder, partial thigh muscle, subcutaneous tumour); second-evaluator segmentations exist for 35 native and 39
  contrast-enhanced scans.
