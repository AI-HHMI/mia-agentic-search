notes: 'Two figshare files: 1_nativeCTdata.zip (files/12981293, 4,495,345,483 B; 140 scan folders) and 2_contrast-enhancedCTdata_modified.zip
  (files/13329248, 4,363,017,681 B; 85 folders); no single archive, so download_url is empty. Both figshare articles state
  CC0; the paper is CC BY 4.0. Voxel size left null: the paper says images were reconstructed at 28 um isotropic and stored
  as a pyramid CT140 / CT280 (CT280 = 2x2x2 average of CT140); the Analyze headers store pixdim 0.14 / 0.28 with no unit (vox_units
  empty), so no source states the stored voxel size with a unit. Bones, lung and spleen semi-automatic, other organs manual
  (paper), hence source mixed. Analyze 7.5 is not a listed format, so formats is other. No split is defined. enricher: label
  class indices differ per file; each Organ*.img has a .cls file mapping indices to organ names.'
