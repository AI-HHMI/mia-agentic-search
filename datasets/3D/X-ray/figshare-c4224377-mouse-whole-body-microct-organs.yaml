notes: 'Two figshare files (peek_archive): 1_nativeCTdata.zip (files/12981293, 4.50 GB, 595 .hdr/.img pairs) and 2_contrast-enhanced
  zip (files/13329248, 4.36 GB, 504 pairs); no single archive, so download_url is empty. Both figshare articles state
  CC0; the paper is CC BY 4.0. Voxel size left null: the paper says 28 um isotropic reconstruction, but each scan folder
  holds CT140.img (about 48 MB) and CT280.img (one eighth the size), which by name suggest 140 and 280 um voxels; the
  Analyze headers could not be read remotely. Bones, lung and spleen were segmented semi-automatically, other organs
  by manual delineation (paper figure legend), hence source mixed. Analyze is not a listed format, so formats is other.
  No split is defined.'
