short_name: Placenta synchrotron micro-CT villi/vessel labels
description: Four TIFF volumes cropped from a synchrotron micro-CT scan of human placenta, prepared as
  a Volume-Segmantics tutorial dataset. A 256-cube image comes with two overlapping label volumes (villous
  tree network and nested blood vessel network) for volumetric semantic segmentation training, plus a
  700-cube unlabelled volume for prediction.
