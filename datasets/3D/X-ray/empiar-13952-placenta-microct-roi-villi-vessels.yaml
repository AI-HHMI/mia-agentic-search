notes: 'Directory listing shows exactly 4 files (256CUBE image 55.8 MB, Villi labels 0.9 MB, Vessel labels
  0.7 MB, 700CUBE image 1.14 GB; size_bytes is their sum from Content-Length). The EMPIAR record says
  all four were cropped from a much larger scan volume for a tutorial; it does not state voxel size or
  how the labels were made. The cited 2021 paper (same placenta micro-CT work) gives 0.81 um effective
  isotropic pixel size for its scans and SuRVoS-made ground truth for Specimen 1, but the link between
  those scans and these crops is not stated on the EMPIAR entry, so voxel_size_nm is null and annotation
  source is unknown. Authors are not listed in the API record fields read; license CC0 is the EMPIAR entry
  licence. The release date is 2026-09-18 per the API record. enricher: 256-cube image + binary int64
  villi and vessel volumes on the same grid; 700-cube image has no labels.'
