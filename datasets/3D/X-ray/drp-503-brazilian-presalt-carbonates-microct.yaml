notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field; the Scientific Data paper itself is CC-BY-NC-ND. Files are NetCDF (.nc), which is not in the format enum, hence other. Zip listing (peek_archive): 64 .nc files (32 grayscale + 32 segmented), 120 GB uncompressed. Voxel size differs per sample so voxel_size_nm is null: sidewall samples (SW) 6 um high / 48 um low, plugs (P) 8 um high / 64 um low, per the metadata and paper. Segmentations are automatic (Otsu thresholds followed by watershed) and were checked against laboratory porosity in the paper; grayscale volumes are 16-bit per the paper. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory and metadata JSON were fetched instead. Low/high pairs are registered by the authors, which suits super-resolution training.'
