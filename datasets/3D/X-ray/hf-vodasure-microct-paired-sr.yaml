notes: 'Lab micro-CT (Zeiss Xradia Versa 520 for wood/cardboard/MDF/ox bone; Nikon XT H 225 for femurs/vertebrae),
  i.e. X-ray volumes of mostly non-biological and bone samples, not microscopy of cells. Training signal
  is paired real low/high-resolution scans (restoration pairs), no labels. Voxel size differs per sample
  and per resolution level (paper supplementary Table 4 lists, e.g., HR 1.199-2.031 um and LR 4.8-8.1
  um for Zeiss samples), so voxel_size_nm is left null. Archives: 24 tar.gz (14 train, 10 test; wood/MDF/cardboard/ox
  bone split into _0 test and _1 train parts), 489.1 GB exact; the paper counts 16 samples / 32 scans.
  enricher: license CC-BY-4.0 -> CC-BY-SA-4.0 from the _LICENSE_ file in the HF repo ("licensed under
  CC BY-SA 4.0"); the dataset card metadata says cc-by-4.0, the project page CC BY-SA. organisms: Homo
  sapiens = Femur_*, Vertebrae_*; Bos taurus = Ox_bone_*; wood species not given as NCBI names. Paper:
  arXiv 2603.23153 (CVPR 2026), read from the arXiv PDF.'
