notes: 'Lab micro-CT (Zeiss Xradia Versa 520 for wood/cardboard/MDF/ox bone; Nikon XT H 225 for femurs/vertebrae),
  i.e. X-ray volumes of mostly non-biological and bone samples, not microscopy of cells. Training signal
  is paired real low/high-resolution scans (restoration pairs), no labels. Voxel size differs per sample
  and per resolution level (paper supplementary Table 4 lists, e.g., HR 1.199-2.031 um and LR 4.8-8.1
  um for Zeiss samples), so voxel_size_nm is left null. Archives: HF lists 23 tar.gz archives (14 train,
  10 test, ~489 GB total per README); the paper counts 16 samples / 32 scans. License CC-BY-4.0 from the
  Hugging Face dataset card; the project page itself is CC BY-SA. Organisms: human femur/vertebra and
  ox bone; plant species of the wood samples not listed as NCBI names. Paper has no DOI yet (arXiv 2603.23153,
  CVPR 2026); not read via tools/paper.py (not indexed by Europe PMC), full text read from the arXiv PDF.'
