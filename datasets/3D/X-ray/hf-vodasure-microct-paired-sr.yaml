id: hf-vodasure-microct-paired-sr
title: 'VoDaSuRe: paired high- and low-resolution lab micro-CT volumes for volumetric super-resolution'
short_name: Paired high/low-resolution lab micro-CT volumes
description: 32 lab micro-CT scans of 16 samples (wood species, cardboard, MDF, ox bone, four human femurs
  and four vertebrae), each scanned at a high and a lower resolution on the same scanner, with the low-resolution
  scan coregistered to the high-resolution one (REG) alongside the unregistered LR scan. Stored as multiscale
  OME-Zarr with HR, LR and REG groups and train/test splits. Released for real-world volumetric super-resolution
  and domain-shift studies.
