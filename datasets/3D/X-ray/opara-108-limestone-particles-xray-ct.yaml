description: One Zeiss Xradia Versa 510 X-ray microscopy tomogram (4x optical lens) of Limestone particles
  embedded in wax, as a reconstructed raw TIFF stack (993 slices) plus a segmented TIFF stack (951 slices)
  in which every discrete particle has its own grey value. Part of the PARROT open archive of particle-discrete
  tomographic datasets; acquisition and reconstruction parameters and the particle size distribution are
  given as images.
