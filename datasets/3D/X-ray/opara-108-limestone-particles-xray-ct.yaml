notes: 'Files: Limestone_raw.zip (993 .tiff slices, ~2 MB each) and Limestone_segmented.zip (951 .tif slices in
  Split20/), plus acquisition/reconstruction/size-distribution images; size_bytes is the OPARA datacite.size. Voxel
  size: pixel size stated in the deposited acquisition screenshot (see technical.notes). The segmented stack has
  951 slices vs 993 raw, so alignment is unverified. Paper: particles segmented by single-threshold binarisation
  plus watershed in ImageJ, then manually sorted (under/over-segmented particles discarded), hence source mixed.
  Sibling PARROT records: OPARA-104 to -109. Non-biological sample, so organism is empty. enricher: label encoding
  instance-ids from sample; voxel size checked against the screenshot.'
