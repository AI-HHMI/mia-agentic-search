  notes: 'Exact Zenodo listing (zip indexes expanded). Shapes, dtype (uint8) and HDF5 dataset paths from pa66_volumes.xdmf;
    .raw.info files give NUM_X/Y/Z (1300/1040/1900 for pa66, 1579/1845/2002 for crack) and member sizes match 1
    byte/voxel. Axes zyx: XDMF dimensions list 1900 1040 1300 against NUM_Z/NUM_Y/NUM_X. Raw values are integers
    0-255 per the paper (Paganin-filtered PyHST2 reconstruction, so normalization unknown). HDF5 header probe of
    the 6.95 GB file kept failing on intermittent TLS errors from zenodo.org, so compression is unknown (the HDF5
    file is smaller than the uncompressed volumes, ~17.6 GB, so it is likely compressed). XDMF spacing 1.3 has no
    unit; the paper states an effective pixel size of 1.3 um. Model outputs in the same file (/crack/crack_prediction,
    /pa66_test/prediction = last 300 z-slices, /pa66_test/error) are not listed as arrays: they are predictions,
    not training data.'
