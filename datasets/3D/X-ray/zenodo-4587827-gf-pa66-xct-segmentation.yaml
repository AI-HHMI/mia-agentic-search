notes: 'Materials-science X-ray CT (composite), not biological; kept as a real X-ray volume with a dense
  ground-truth segmentation. Formats are headerless PyHST .raw volumes with .raw.info text files (also
  one HDF5 file pa66_volumes.h5 of 6.95 GB with an XDMF index, not opened). Voxel size, bit depth, class
  labels and annotation procedure are not stated on the Zenodo page, in the archive info files or in
  the paper abstract; the paper full text is not open access in Europe PMC and the publisher page returned
  503, so they are left null/unknown. n_items counts the two labelled/unlabelled volumes pa66 (labelled)
  and crack (no ground truth, only a model prediction). Size is the sum of the five Zenodo files (pa66.zip
  2.35 GB, crack.zip 4.62 GB, pa66_test.zip 28 MB, pa66_volumes.h5 6.95 GB). Trained models are in zenodo.4601560.'
