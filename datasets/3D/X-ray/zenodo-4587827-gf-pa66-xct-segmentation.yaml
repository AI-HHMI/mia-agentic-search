notes: 'Materials-science X-ray CT (composite), not biological. Volumes come both as headerless PyHST .raw files
  with .raw.info sizes (zips) and in one HDF5 file pa66_volumes.h5 indexed by pa66_volumes.xdmf. Paper split: z-slices
  1300 train / 128 val / 300 test with 86-slice margins (not separate files). n_items counts pa66 (labelled) and
  crack (unlabelled, model prediction only). Trained models are in zenodo.4601560. enricher: voxel size 1.3 um isotropic
  from paper Methods (effective pixel size 1.3 um) and XDMF spacing 1.3 (was null). enricher: classes 0/1/2 = matrix/fiber/porosity
  and annotation procedure (seeded region growing + manual correction of ring artifacts) from paper Data availability
  / Methods; source set to proofread (was unknown). enricher: formats [hdf5] (was other; .raw volumes have no listed
  format), download_url set to the HDF5 file, size from Zenodo file listing.'
