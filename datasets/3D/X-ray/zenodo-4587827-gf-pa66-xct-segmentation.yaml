short_name: GF-PA66 composite X-ray CT segmentation
description: 3D X-ray computed tomography volume of a glass fiber-reinforced polyamide 66 (GF-PA66) specimen with
  a voxel-wise ground-truth segmentation (pa66.raw and pa66.ground_truth.raw, 1300 x 1040 x 1900 voxels each), plus
  a second unlabelled crack-specimen volume (crack.raw) and the U-Net predictions and error volume for a test region.
  Released for 2D/3D image segmentation with the modular U-Net of Bertoldo et al. (2021).
