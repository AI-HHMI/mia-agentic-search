title: 3 tomographic data sets of nano-CT measurements of a 30:70 vol-% mixture of talcum and saxolite
short_name: Talc/saxolite particle mixture (nano-CT)
description: Three nano-CT sub-volumes (field of view about 65 µm, Zeiss Xradia 810 Ultra) of a 30:70 vol-% talc/saxolite
  particle mixture in epoxy with carbon black spacers. Each comes as a reconstructed grey-value TIFF stack plus
  a TIFF stack of particle-discrete phase labels obtained by correlating with FIB-SEM EDXS maps (talc and saxolite
  attenuate X-rays alike), and a particle-wise MetaImage (.mha) volume without phase information.
