notes: 'Files: First/Second/Third_Volume.zip (29.0, 32.4, 32.4 GB) plus contents.txt (listing). From contents.txt:
  volume 1 has 1627 TIFF slices in Rotated/ and 1627 in ''Rotated and segmented''; volumes 2 and 3 have
  1568 each, plus one *_particlewise.mha (~15.4 GB) per volume. Voxel size not stated on the item page,
  metadata or contents.txt, and no related publication is cited, so it is null; the segmentation procedure
  is only described as an algorithm trained on EDXS-correlated data (source recorded as automatic, details
  unknown). Volumes were rotated to correct the FIB tilt (folder names say rotated). Label encoding, dtype
  and image shape not inspected. Software: Arivis Vision 4D 3.5, ASTRA toolbox 2.1.0.'
