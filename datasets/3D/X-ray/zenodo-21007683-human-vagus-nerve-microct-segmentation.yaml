notes: 'Zip listing (central directory): 3,610 files = 1,801 raw image DICOM slices in source/<segment>/img
  and 1,801 mask DICOM slices in derivative/<segment>/mask for segments 795, 796, 797, 798 (433 slices
  each) and 813 (69 slices), plus 2 STL files and 5 SPARC xlsx metadata files and a README. Zip is 12.4
  GB compressed (about 59 GB uncompressed); the description says about 65 GB. No associated paper was
  found on the record or by web search, so how the masks were made (manual vs. network-assisted) is not
  stated, hence annotations.source unknown. Voxel size from the record text (6.43 um isotropic), confirmed
  by DICOM PixelSpacing/SliceThickness 0.00643 mm. enricher: slice counts corrected from the zip index
  (was 434/70). Related, differently sampled human vagus micro-CT data exist on the SPARC portal but are
  not covered here.'
