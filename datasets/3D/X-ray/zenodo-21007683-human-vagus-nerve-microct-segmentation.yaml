  notes: 'Listing: Zenodo API (1 file, 12,375,893,829 B) and the zip central directory (3,610 members:
    3,602 .dcm, 5 .xlsx, 2 .stl, README.md; 59.1 GB uncompressed). tools/listing.py --expand-zips held
