title: Human cervical vagus nerve micro-CT with epineurium and endoneurium segmentation masks
short_name: Human vagus nerve micro-CT tissue masks (X-ray)
description: One right human cervical vagus nerve imaged post mortem by micro-computed tomography (6.43
  um isotropic voxels, 2864 x 2864 slices, 16-bit) in five consecutive segments from the nodose ganglion
  to the superior cardiac branch, with per-slice DICOM masks for epineurium, endoneurium and background
  aligned 1:1 with the image stacks, plus reconstructed epineurium and endoneurium STL surface models.
  Organised in the SPARC SDS layout.
