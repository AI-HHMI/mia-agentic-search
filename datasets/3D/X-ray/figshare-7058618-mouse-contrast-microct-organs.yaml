title: Contrast-enhanced micro-CT scans of mice with manual whole-body organ segmentations
short_name: Mouse contrast micro-CT organ segmentation
description: 85 contrast-enhanced (ExiTron nano 6000) whole-body micro-CT volumes of ten female A431-tumor-bearing BALB/cAnNRj-Foxn1nu
  mice scanned at multiple time points on an InSyTe micro-CT, with manual and semi-automatic 3D organ segmentations
  (bones, lung, spleen, liver, stomach, kidneys, intestine, tumor, heart, bladder, thigh muscle). 39 scans have a second
  evaluator's segmentation. Part of the Rosenhain et al. 2018 preclinical micro-CT database.
