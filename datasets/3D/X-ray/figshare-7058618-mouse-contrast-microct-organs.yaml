notes: 'Single zip (2_contrast-enhancedCTdata_modified.zip) of Analyze-format files (CT140/CT280 volumes
  plus Organ1/Organ2 *_140/_280 .img/.hdr/.cls labels and Bed masks per scan folder). Sibling record covers
  the native scans (figshare 7058615). Authors not filled in. enricher: voxel size set to null (was 28000
  nm isotropic from the paper): the Analyze headers give 0.14 (CT140, 308x242x484) and 0.28 (CT280, 154x121x242)
  per axis, i.e. 140 and 280 um if mm as usual, matching the file names, so the released files are two
  resampled grids, not the 28 um reconstruction. Organ1 and Organ2 .cls files use different class index
  maps (e.g. 1 = Heart in Organ1, Spleen in Organ2).'
