  notes: 'Listing: Figshare API (tools/listing.py), 8 files, all with exact sizes. All 8 files were downloaded (small) and
    read with nibabel / as text, then deleted. value_range over both images. Voxel size 40 um confirmed by each <ID>_PTA_1_Rec_Trans_downsampled.toml
    (resolution=40.000000 or 40.000720; thickness scaling_factor = 0.040 # in mm); NIfTI headers carry the 1 mm default. Full-resolution
