notes: 'One zip per mouse (mouse_01 to mouse_10; zip mouse_02 listed: images/ with 5 .nii.gz files and labels/vessel_mask.nii.gz). metadata.xlsx gives isotropic voxel spacing of 22.92 um for the eight in vivo cases (mouse_02,03,05-10) and 10.54 um for the two ex vivo cases (mouse_01, 04), so voxel_size_nm is null here; matrix sizes about 530-560 x 410-480 x 670-760 (in vivo) and about 1050 x 800-940 x 1450-1520 (ex vivo). The README says the annotation procedure is described in the accompanying Data Descriptor, which is not cited on the record, so publications is empty; the README also still says the license will be added, while the Zenodo record states CC-BY-4.0. A software archive (~207 MB, PreSeg-2.5D code and checkpoints) is on the record. X-ray micro-CT, not light or electron microscopy. size_bytes sums the ten case zips (without the code archive).'
