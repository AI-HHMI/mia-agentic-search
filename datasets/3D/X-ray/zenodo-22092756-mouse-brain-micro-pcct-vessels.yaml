description: Ten mouse brain photon-counting micro-CT cases (eight in vivo, two ex vivo at higher resolution),
  each with five co-registered NIfTI volumes (total attenuation and contrast-agent map, whole-brain and
  intracranial, plus a hydroxyapatite map) and one manually reviewed binary vessel mask on the same voxel
  grid.
