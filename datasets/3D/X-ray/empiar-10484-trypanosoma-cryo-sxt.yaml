notes: 'Single tomogram (one volume), so small in item count but with 9 annotation volumes. EMPIAR title and file
  list say only "Trypanosoma"; the linked SuRVoS paper describes a T. brucei procyclic cell (29-13) SXT reconstruction
  (WBP) annotated by a novice in ~8 h with SuRVoS, which is assumed to be this entry. Paper: SXT at Diamond B24,
  40 nm zone plate, 16 nm/pixel images; the reconstructed voxel size of the deposited volume is not stated on the
  EMPIAR page, file listing or paper, so voxel_size_nm is null. Class meaning of each label file ("arbitrarily defined
  by the annotator") is not documented on the page; annotation coverage not stated. License CC0 per EMPIAR entry.
  enricher: size_bytes 1,629,812,411 exact (all 15 files; was 1.5 GB). Label volumes are int8 binary masks on the
  same 135x927x728 grid as RawData.rec.'
