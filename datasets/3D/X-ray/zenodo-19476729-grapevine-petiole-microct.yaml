notes: 'Description and acquisition parameters (23 keV, 10x optical magnification, 6.35 um effective pixel size, 2560x2560 reconstructed slices, HDF5 raw + 32-bit TIFF recon) are from the Zenodo record and README.md. Archives are .tar.zst and cannot be indexed remotely, so annotations.tar.zst (42 masks, 806 MB) was not opened: mask format, class names and which scans they cover are unknown (annotations_verified false, coverage sparse because only 42 slices are annotated). Zenodo metadata gives CC-BY-4.0 but the README still says "[License to be determined]" and "[Citation to be added upon publication]"; the Zenodo license is used. No paper is listed. Voxel size assumes isotropic 6.35 um reconstruction (stated as effective pixel size). Size from DATA_DESCRIPTION.md (201.2 GB).'
