notes: 'No license in the BioStudies record or the preprint text, so license is unknown. Voxel size varies per file (file lists: SR-uCT 13 um, Skyscan 1272 5 um, Nanotom 7 and 10 um), hence null. Annotation lists: 56 SHVR mask-related files (.mask, .tf, .screen) and 6 ViNE mesh files (.ply, .clr), in the authors own formats. Stack lists also include cropped copies, so the number of distinct stacks was not counted. Only vascular strands were annotated in selected stacks (partial). Preprint full text read.'
