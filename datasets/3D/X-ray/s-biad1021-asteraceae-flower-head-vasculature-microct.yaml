      \  cropped stack used for segmentation\n    SHVR/[<Species>n/]<Species>n.{mask,tf,screen}\n    ViNE/<Species>n.{ply,clr}\
      \           (Gerbera2, Sunflower1, Bellis1)\n"
    n_files: null
