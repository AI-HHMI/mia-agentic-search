    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/021/S-BIAD1021/Files/FlowerHeadData/Fig5_a_b_c_GerberaDev/SHVR/GerberaDev1/GerberaDev1.mask
    size_bytes: 112848626
    description: 'GerberaDev1 (Skyscan 1272, 5 um): SHVR image stack 353x348x306 uint16 (75 MB) and its
      SHVR mask (38 MB).'
  arrays:
  - role: raw
    path_pattern: FlowerHeadData/*/SHVR/**.tif
    format: tiff
    axes: zyx
    shape:
    - 353
    - 348
    - 306
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 1511
    - 65535
    normalization: unknown
    alignment: not-applicable
    alignment_notes: SHVR copies are the (often cropped) stacks the masks were drawn on; full stacks sit
      one folder up. ImageJ stack, 353 slices; spacing 1.9685e-4 inch = 5.0 um, matching file_list_2 (Skyscan
      1272, 5 um). Bit depth 8 or 16 per stack (file lists). value_range is the ImageJ header min/max.
  - role: label
    path_pattern: FlowerHeadData/*/SHVR/**.mask
    format: other
    axes: null
    shape:
    - 37590264
    shape_varies: true
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 1
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 1
      name: vascular strands
    alignment: same-grid
    alignment_notes: 'Pairing: <name>.mask next to SHVR/<name>.tif (file_list_mifa_annotations_1 "Source
      image"). Headerless: byte count equals the voxel count of the SHVR tif (37,590,264 = 353x348x306),
      so it is that grid flattened; the byte order of axes is not documented (presumably the stack order
      z, y, x), so axes stay null. Reshape needs the shape from the tif. Echinops has no .mask (its rows
      list the tif).'
  notes: 'File structure from the study file lists (37 image stacks incl. 18 SHVR copies; 56 SHVR annotation
    files; 6 ViNE files) and the HTTP index of Fig5_a_b_c_GerberaDev; listing.py over the whole tree did
    not finish in this run, so no confirmed size or file count. Headers: GerberaDev1 SHVR tif via probe.py.
    Sample: GerberaDev1.mask by range (128 B head, all zeros, and a 2 MB middle chunk: {0: 1,822,002,
    1: 177,999}). Mask class name from the record (vascular strands annotated). Voxel size differs per
    stack (file lists: SR-uCT 13 or 3.61 um, Skyscan 5 um, Nanotom 7 or 10 um), so it stays null. .mask
    is a custom raw format TensorSwitch cannot read without the shape.'
