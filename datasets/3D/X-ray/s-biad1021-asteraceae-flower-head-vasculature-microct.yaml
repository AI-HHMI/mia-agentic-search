title: Micro-CT of Asteraceae flower heads with manual vascular strand segmentation masks and meshes
short_name: Flower head vasculature segmentation (micro-CT)
description: Synchrotron and laboratory micro-CT image stacks of flower heads from eight Asteraceae species
  (gerbera, sunflower, Bellis, thistle, coneflower, Tanacetum, Craspedia, Echinops) including developmental
  stages, with vascular strands segmented by haptic and virtual-reality annotation tools as SHVR mask
  files and ViNE-segmented polygon meshes.
