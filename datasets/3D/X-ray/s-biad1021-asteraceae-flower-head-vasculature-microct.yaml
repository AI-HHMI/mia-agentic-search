notes: 'No license in the BioStudies record or the preprint text, so license is unknown. Voxel size varies
  per file (file lists: SR-uCT 13 um, Skyscan 1272 5 um, Nanotom 7 and 10 um), hence null. Annotation
  lists: 56 SHVR mask-related files (.mask, .tf, .screen) and 6 ViNE mesh files (.ply, .clr), in the authors
  own formats. Stack lists also include cropped copies, so the number of distinct stacks was not counted.
  Only vascular strands were annotated in selected stacks (partial). Preprint full text read. enricher:
  GerberaDev1.mask is 37,590,264 B = 353x348x306 voxels of its SHVR tif, values {0,1} in a 2 MB slice.
  organisms (file lists): Gerbera hybrida = Fig1, Fig2, Fig5_a_b_c, FigS1, FigS5; Helianthus annuus =
  Fig3_b_c_d, Fig5_d_e_f; Bellis perennis = Fig3_f_g_h, Fig5_g_h_i; Cirsium = Fig4_b_c; Echinacea = Fig4_e_f;
  Tanacetum = Fig4_h_i, FigS4_d; Craspedia = Fig4_k_l; Echinops = Fig4_n_o.'
technical:
