notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Archive (45.0 GB zip, ~85,600 members
  incl. thumbnails): HQ dataset and LQ dataset (1,426 32-bit TIFF slices each, 15 um isotropic voxels
  per metadata and paper, GE v|tome|x L300, 200 kV, 70 uA; HQ ~90 min, LQ ~12 min scan, both from the
  same core), 14 denoised versions of the LQ volume (Gaussian, median, NLM, anisotropic diffusion, bilateral,
  SNN, Noise2Clean, CCGAN, RDN, Noise2Void, Noise2Noise at 0/25/50/75% clean reference) and 17 segmented
  volumes (glass/brine/scCO2, ilastik random forest with sparse user scribbles, about 0.005% of voxels
  per the paper). The paper does not describe how HQ and LQ volumes were registered (''Registered'' appears
  in LQ file names). No train/test split is provided. The dataset page on digitalrocksportal.org redirects
  to a tombstone page; the public TACC archive directory and metadata JSON were used.'
