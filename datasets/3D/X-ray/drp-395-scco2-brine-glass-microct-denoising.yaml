title: scCO2-Brine-Glass Dataset for Comparing Image Denoising Algorithms
short_name: scCO2-brine glass micro-CT denoising pairs
description: 'Micro-CT tomogram (1,426 slices, 15 um voxels) of a borosilicate sintered-glass core saturated
  with brine and supercritical CO2, scanned twice: a high-exposure high-quality (HQ, ~90 min) and a low-exposure
  low-quality (LQ, ~12 min) scan. Also provides LQ volumes denoised by six traditional filters and by
  supervised, unsupervised and semi-supervised deep-learning models, and ilastik three-phase segmentations
  (glass, brine, scCO2) of the HQ, LQ and every denoised volume.'
