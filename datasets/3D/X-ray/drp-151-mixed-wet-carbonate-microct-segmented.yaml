notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Archive (3.7 GB zip, 38 members,
  listed with peek_archive): per sample (Sample1 weakly water-wet, Sample2 and Sample3 mixed-wet) a raw
  .raw volume (~1.19 GB each, headerless binary; the dtype is not stated on the page) and a segmented
  .raw (~0.59 GB), with histogram CSVs and preview images. Segmentation: Trainable WEKA Segmentation with
  fast-random-forest and mean/variance texture filters, trained on manually annotated pixels of each phase
  (paper Methods; scanner ZEISS Xradia VersaXRM-500, 2 um voxels), so the labels are classifier output.
  Format is headerless .raw, which is not in the format enum (other). No train/test split. Portal page
  is a tombstone; TACC archive used. enricher: annotations.source automatic (was mixed); dtype uint16
  and shape from metadata.'
