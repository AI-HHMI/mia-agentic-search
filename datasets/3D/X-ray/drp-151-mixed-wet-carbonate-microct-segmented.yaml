title: X-ray micro-tomography datasets of mixed-wet carbonate reservoir rocks for in situ effective contact
  angle measurements
short_name: Carbonate rock micro-CT, oil/brine/rock labels
description: Three 976 x 1014 x 601 voxel X-ray micro-CT volumes (2 um voxels) of carbonate reservoir
  rock samples after 20 pore volumes of waterflooding at subsurface conditions, each with a raw grayscale
  volume and an 8-bit segmentation into oil, brine and rock phases produced with Trainable WEKA Segmentation
  (classifier trained on manually annotated pixels).
