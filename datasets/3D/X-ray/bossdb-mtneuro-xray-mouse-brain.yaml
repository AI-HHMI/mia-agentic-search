notes: 'Four 256x256x360-voxel cutouts (somatosensory cortex, striatum, VPM thalamus, zona incerta) at
  1.17 um isotropic, per project page. Paper full text not open access (Europe PMC); only abstract and
  project page read. Storage format on BossDB, annotation procedure, and exact BossDB collection URL not
  confirmed; formats set to other for that reason. License CC BY 4.0 stated on project page for imaging
  data. enricher: data found as precomputed layers on s3://bossdb-open-data/prasad/prasad2020 (formats
  other -> precomputed); stored resolution is 1000 nm, not 1170 nm. enricher: coverage per MTNeuro README:
  ROI annotations plus densely annotated 3D cutouts; pixel_annotation has data in 119 full-res chunks
  only. download_url bossdb.org -> the S3 prefix holding the precomputed layers.'
