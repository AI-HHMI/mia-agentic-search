notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Archive (2.6 GB zip, 9 members,
  listed with peek_archive): three tomogram zips (Castlegate CG_tomo.zip 911 MB, Leopard tomoHiRes_SS_nc.zip
  767 MB, Bentheimer tomo_R_SSw_SS_nc.zip 828 MB) and four segmentation .nc.zips (Bentheimer phase labels,
  Bentheimer multi-clay labels, Leopard 4 phases, Castlegate 3 phases). Voxel size per metadata: 2.15
  um for Bentheimer and Leopard, 3.4 um for Castlegate, so voxel_size_nm is null (one value per record).
  Related to catalog record drp-425 (same group, different Bentheimer/other samples). How the segmentations
  were made (manual or algorithmic) is not stated on the record or in the Crossref metadata; the papers
  are not open access. Format is netCDF, which is not in the format enum (other). The portal page redirects
  to a tombstone; the TACC archive directory and metadata JSON were used.'
