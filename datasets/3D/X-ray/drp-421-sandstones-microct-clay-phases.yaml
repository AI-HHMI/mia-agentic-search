short_name: Sandstone micro-CT with clay/mineral phase labels
description: 800^3 micro-CT tomograms of Bentheimer, Castlegate and Leopard sandstones with voxel-wise
  segmentations into macro-pore, clay region, quartz and, for Bentheimer and Leopard, feldspar and/or
  high-density mineral phases; a second Bentheimer segmentation distinguishes clay phases of different
  micro-porosity. Released to study clay effects and NMR relaxation.
