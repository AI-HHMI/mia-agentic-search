  microstructure: 591 scans (about 1.3 mm wide, cropped to 1601x1601x2156 voxels) of 149 samples from
  25 cheese types, released as three downscaled sets of 192x192x192 volumes (Small 591, Base 4,728, Large
  37,824). Labels are the 25 cheese types (coarse) and the 149 samples (fine).'
