notes: 'Author list and publication date not read from a fetched page (the HF card names only the first author
  Pieta et al.), so left empty. Full data: raw scans on the DTU archive (archive.compute.dtu.dk/files/public/projects/MozzaVID/,
  returned 503 or an empty listing from this environment, so its file listing was not seen) as ~5.1 GB uint8
  TIFFs (2156x1601x1601) per scan in 25 class folders, plus three Hugging Face WebDataset sets (dtudk/MozzaVID_Small
  8.37 GB, _Base, _Large; Large needs >300 GB). Small/Base/Large have effective voxel sizes of roughly 8x/4x/2x
  the raw 0.55 um pixel size, which the paper does not state; voxel size given is the raw pixel size from the
  paper, z not stated. License CC-BY-SA-4.0 is from the Hugging Face dataset card; the README and paper state none
  for the data (CC BY 4.0 on the arXiv page applies to the article). X-ray synchrotron CT with class labels only
  (no masks). File-level annotation structure not verified because the archive listing was unavailable.'
