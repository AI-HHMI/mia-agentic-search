notes: 'FTP: raw_tomogram_data/ (2120 tomo_120077_NNNNN.tiff slices) and segmented_data/sample_120077_segmented_data.tif.
  Voxel size 0.81 um is the paper effective isotropic pixel size of the scan (Methods); the segmented
  volume is the central 1500^3 crop down-sampled to 750^3 (paper), so ~1.63 um, not stated per file. enricher:
  source manual: the paper says this down-sampled crop of Specimen 2 was manually segmented in SuRVoS
  and lists the manual segmentations as DLS ID 120077, the ID in the file name; coverage partial (central
  crop). U-Net training data are on Zenodo 4249627. Differs from catalogued empiar-10562 (another scan).
  enricher: size 53.8 GB from the HTTP index (was 50.5e9; EMPIAR 50.5 GB = GiB).'
