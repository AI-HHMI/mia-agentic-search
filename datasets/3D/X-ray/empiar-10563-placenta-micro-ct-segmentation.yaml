notes: 'FTP listing: raw_tomogram_data/ (tomo_120077_NNNNN.tiff, 24 MB each, 2120 slices per EMPIAR) and segmented_data/sample_120077_segmented_data.tif
  (402 MB). Voxel size 0.81 um is the paper effective isotropic pixel size for the scans (Methods); the segmented volume is a
  1500^3 central crop downsampled to 750^3 per the paper, so its voxel is probably 1620 nm; neither is stated per file. Whether
  this segmented file is the manual SuRVoS segmentation (paper: eight manually segmented subvolumes) or the U-Net prediction,
  and its class labels, is not stated on the EMPIAR page; source set to mixed. Paper lists manual segmentations (DLS ID 120077), predicted segmentations (123861) on EMPIAR-10562/10563; U-Net training data are on Zenodo 4249627. Only one specimen volume. Differs from catalogued empiar-10562 (a different scan, 75 GB, with U-Net vessel/tissue training data and predicted segmentations): this entry is the second tissue volume with the 750^3 segmented file.'
