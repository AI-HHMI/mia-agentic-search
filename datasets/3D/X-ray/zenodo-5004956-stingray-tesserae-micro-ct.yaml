  notes: 'Amira (.am) files are not readable by tools/probe.py or tools/sample.py; the whole 17.8 MB zip was downloaded
    once (within budget) and the AmiraMesh headers and data of 5 files were decoded with a scratch script (numpy,
    HxByteRLE). value_range from one file per array (region 1), observed only. Bounding boxes are in um: region
    1 x 4486.57-5650.39 over 120 voxels = 9.78 um, matching the paper. Not described as arrays: Input-CT_region-1_smoothed.am
    and pipeline intermediates (Foreground, distance map, S, Watershed segmentation/graph, surfaces) in data/Segmentation-pipeline/;
    data/Evaluation_landmarks/ holds foreground segmentations of the full dataset 1 (558x495x1385, its raw CT is
    not in the deposit), tessera landmarks (.landmarkAscii) and precision/recall CSVs. AmiraMesh is not a format
    TensorSwitch reads, so automatic conversion is unlikely without a reader.'
