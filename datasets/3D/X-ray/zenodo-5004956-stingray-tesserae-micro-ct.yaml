notes: 'One 17.8 MB zip (56 files, listed with peek_archive): Segmentation-pipeline/ (Input-CT_region-1/2/3.am
  crops plus smoothed, foreground, distance-map and label intermediates), Evaluation_manual-regions/ (masks,
  four Manual-segmentation files per region, final pipeline segmentation per region) and Evaluation_landmarks/
  (foreground segmentations, landmarks, precision-recall CSVs). Only small sub-regions of the hyomandibula
  scans are included, not the full datasets I-III of the paper. Voxel size 9.78 um is the resampled value
  from the paper Methods (original scan 4.89 um). Manual ground truth covers small parts of one hyomandibula;
  pipeline segmentations are manually corrected, so source is mixed. Amira (.am) is not in the format enum,
  so formats is other. The Zenodo record DOI is a Dryad DOI.'
