short_name: Stingray tessellated cartilage tesserae (micro-CT)
description: Three small micro-CT sub-volumes (regions 1-3, 9.78 um voxels) of round stingray (Urobatis halleri)
  hyomandibula cartilage in Amira format, with manual tessera-by-tessera ground-truth segmentations by four annotators
  for each region, the final automated pipeline segmentations, manually placed tessera landmarks for dataset 1 with
  precision/recall tables, and intermediate results of a watershed segmentation pipeline.
