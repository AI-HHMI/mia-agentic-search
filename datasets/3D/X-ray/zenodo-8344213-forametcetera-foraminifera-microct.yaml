notes: 'Source: Zenodo record and the open-access Scientific Data paper (Europe PMC full text; Methods, Data
  Records). 15 um is the stated scan resolution (Neoscan N80 FP micro-CT, 67 kV, 0.5 mm Al filter), taken
  as isotropic voxel size. The 3D group-scans and specimens are .nrrd volumes (not in the schema format
  list); the reconstructed cross-sections are 8-bit PNG stacks, so formats lists png only. The zip
  (4.5 GB) could not be listed (server refuses range requests), so the folder layout (Group_scans, Specimens,
  Reconstructions) is taken from the paper, not verified. Labels are species/non-foraminifera group membership
  plus automatic threshold segmentation of individual specimens, not manual pixel annotation. Raw projections
  (332 GB) are only available on request and are not part of the download. This is micro-CT of individual
  specimens rather than light/electron microscopy; confidence reflects that. Species counts per group
  are in Table 2 of the paper.'
