    zeros (first section, one sample). Read the NRRD header of Group-scan_A2.2.nrrd and Reconstructions/A2.2/A2.2_.log
    (NeoScan): Pixel Size (um)=15.000025, "Minimum/Maximum for CS to Image Conversion" 0.09/0.9 (paper: only intensities
    0.09-0.9 retained, so contrast-stretched). The specimen NRRD header could not be read (Zenodo connection resets),
    so its shape/dtype stay open. NRRD is not a schema format and TensorSwitch has no NRRD reader as far as the
    record says; the PNG stacks are the convertible raw data. Organisms per paper Table 2: A* Alveolinella quoyi,
    B* Operculina ammonoides, C1.2 Marginopora santoensis, D* Baculogypsinoides sphaerulata, γ/θ non-foraminiferan
