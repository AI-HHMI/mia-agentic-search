title: 'ForametCeTera: micro-CT scans of individual benthic foraminifera and non-foraminiferan material'
short_name: ForametCeTera foraminifera micro-CT (X-ray)
description: 436 3D micro-CT volumes of individual specimens (288 benthic foraminifera from four species and 148
  pieces of non-foraminiferan material), segmented out of 11 group-scans, together with the reconstructed 2D cross-section
  stacks and 3D group-scan volumes. Intended for developing segmentation and classification methods for CT scans
  of sediment core samples.
