notes: 'Source: Zenodo record and the open-access Scientific Data paper (Europe PMC full text; Methods, Data Records).
  15 um is the stated scan resolution (Neoscan N80 FP micro-CT, 67 kV, 0.5 mm Al filter), isotropic. Group-scans
  and specimens are .nrrd volumes (not in the schema format list); the reconstructed cross-sections are 8-bit PNG
  stacks, so formats lists png only. Labels are species/non-foraminifera group membership plus automatic threshold
  segmentation of individual specimens, not manual pixel annotation. Raw projections (332 GB) are only available
  on request. Species counts per group are in Table 2 of the paper. enricher: zip listed, layout confirmed (Group-scans,
  Reconstructions, Specimens); voxel size confirmed by NeoScan .log "Pixel Size (um)=15.000025"; organisms per folder
  in technical.notes.'
