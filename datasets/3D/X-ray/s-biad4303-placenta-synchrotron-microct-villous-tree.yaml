notes: 'From the BioStudies record, the file listing (RAW 79 .h5, CROP 79 .tif, VILLI_SEGMENTATION 79 .tif, VASCULATURE_SEGMENTATION
  20 .tif, about 6.2 TB, sizes rounded by the index so size_bytes is null) and the open-access Ando et al. 2026 paper (0.81
  um pixels, Napari pseudo-labelling). The 0.81 um is the raw-scan pixel size; none is stated for the crops. Masks are
  model predictions with manual correction (source mixed); no splits; mask label values not stated. 79 scans come from
  22 placentas. Differs from S-BIAD1130, S-BIAD1270 and EMPIAR-10563 (other acquisitions).'
