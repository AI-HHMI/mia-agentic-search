notes: 'From the BioStudies record, its file list and the open-access Ando et al. 2026 paper (0.81 um
  pixels, Napari pseudo-labelling). Masks are model predictions with manual correction (source mixed);
  coverage: each CROP has a villi mask, 20 of 79 also a vasculature mask. No splits. 79 scans from 22
  placentas. Differs from S-BIAD1130, S-BIAD1270 and EMPIAR-10563. enricher: voxel size 0.81 micron/voxel
  confirmed for RAW, CROP and masks by the BioStudies file attributes. enricher: size_bytes 6209330701188
  from the BioStudies file list (exact per-file sizes, 263 files; was null). enricher: masks are binary
  {0,1} int64 TIFFs (sampled). RAW/DAPHNE-99_180531 and _180532 are not valid HDF5 (no signature).'
