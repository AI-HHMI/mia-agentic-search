id: s-biad4303-placenta-synchrotron-microct-villous-tree
title: Human Placenta Data, Crops and Tissue Segmentation of Synchrotron micro-CT images
short_name: Human placenta villous tree (synchrotron micro-CT)
description: 79 synchrotron micro-CT scan sets of human placental tissue (0.81 um isotropic pixels, Diamond
  Light Source beamline I13), hosted in the BioImage Archive. Each set has the raw reconstruction (HDF5),
  a cropped volume (TIFF) and a villous-tree segmentation mask (TIFF); 20 of the sets also have a vasculature
  segmentation mask. Masks were made with Volume Segmantics 2D multi-axis U-Net models trained on manually
  annotated ROIs and then manually corrected in Napari.
