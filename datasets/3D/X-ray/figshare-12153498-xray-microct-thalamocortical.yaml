notes: 'Sibling deposits: raw 1420x5805x720 8-bit volume (figshare 12153573, 8 multipage TIFFs of ~742 MB each,
  CC-BY-4.0), region-of-interest annotations (doi 10.6084/m9.figshare.12153549.v1) and bossDB project prasad2020.
  Paper Methods: pixel-level annotations are 4 volumes of 257x257x361 voxels (cortex, zona incerta, striatum, TRN)
  with 11 densely annotated slices each (44 images), classes cell / myelinated axon / blood vessel, annotated manually.
  The archive lists imgs_{ctx,str,trn,zi}.npz and masks_{ctx,str,trn,zi}.npz (4.2 / 2.1 MB each); exact array
  shapes and label values were not inspected (npz not opened), so n_items is null. The archive also holds 360 small
  tif files of the inter-rater reliability test. Sources checked: figshare API record, archive listing, paper full text.'
