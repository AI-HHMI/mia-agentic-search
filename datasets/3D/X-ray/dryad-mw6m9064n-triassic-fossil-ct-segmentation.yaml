notes: 'Zip contents (2,159 CT slices, 18 training masks) come from the Dryad page description; the archive itself
  could not be listed (Dryad API and file_stream need a token or reject automated clients with 403), so file
  names and the binary mask encoding are unverified. Only 18 of 2,159 slices carry manual labels (every 100th
  slice). The page says 10 um voxel size; the paper text checked does not restate it, and isotropy is assumed.
  The README says every 200th slice, the paper says 18 slices at every 100th, and the paper writes the specimen
  as QMF60828 in one place. Dryad license is CC0 but the authors ask users to request consent before taxonomic,
  morphological or taphonomic use; the paper is CC BY 4.0. Sources checked: Dryad page and API, paper full text.'
