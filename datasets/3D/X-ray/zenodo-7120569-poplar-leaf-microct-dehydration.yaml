title: MicroCT scans of a hybrid poplar leaf dehydrating, with annotated slices for model training
short_name: Poplar leaf dehydration microCT, labelled slices
description: Synchrotron microCT (TOMCAT beamline, Swiss Light Source) of a hybrid poplar leaf strip scanned at five time
  points (0-30 min) as it dehydrates, with absorption (gridrec) and phase-contrast (Paganin) reconstructions as 8-bit 3D stacks
  and hand-labelled slices (ground truth) in cross-sectional, longitudinal and paradermal orientations for each time point,
  intended for training segmentation models.
