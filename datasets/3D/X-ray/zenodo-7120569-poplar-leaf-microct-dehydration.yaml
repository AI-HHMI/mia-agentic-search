notes: 'Counts: 10 reconstruction stacks (5 time points x GRID/PAGANIN, zipped TIFF, ~1.55 GB each unzipped) plus 15 labelled-slice
  stacks (5 time points x 3 orientations). Voxel size 0.1625 um from the Zenodo description; the reconstruction TIFF header
  agrees (ImageJ spacing=0.1625, unit um). Labelled stacks are uint8 with values {0,100,152,170,202,255} in a sample; class
  names are not documented on the record, so classes are unknown. Only selected slices are labelled (positions in Labeled_slices_positions.txt,
  1-based). No paper describing this dataset was found; the authors'' method paper (10.1002/aps3.11380) covers a different
  dataset.'
