notes: 'Counts: 10 reconstruction stacks (5 time points x GRID/PAGANIN, zipped TIFF, ~1.7 GB each unzipped) plus 15 labelled-slice
  stacks (5 time points x 3 orientations). Voxel size 0.1625 um comes from the Zenodo description (reconstruction, field of
  view ~416x416x312 um); file header of a labelled stack carries no calibration. Labelled stacks are uint8, e.g. 20 slices
  of 1152x1350, but the class values and class names were not documented on the record or checked, so the label encoding is
  unknown. Only selected slices per stack are labelled (hence sparse). No paper describing this specific dataset was found
  with tools/paper.py; the authors'' related method paper (Digitally deconstructing leaves, 10.1002/aps3.11380) covers a different
  dataset and was not cited here.'
