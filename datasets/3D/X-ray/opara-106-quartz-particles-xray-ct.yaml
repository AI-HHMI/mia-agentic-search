notes: 'Files: Quartz_raw_Part1.zip + Quartz_raw_Part2.zip (2243 .tiff slices in total, ~2 MB each) and Quartz_segmented.zip
  (2210 .tif slices in Split25/), plus acquisition/reconstruction/size-distribution images; size_bytes is the OPARA
  datacite.size. Voxel size: pixel size stated in the deposited acquisition screenshot (see technical.notes). The
  segmented stack has 2210 slices vs 2243 raw, so alignment is unverified. Paper: particles segmented by single-threshold
  binarisation plus watershed in ImageJ, then manually sorted (under/over-segmented particles discarded), hence
  source mixed. Sibling PARROT records: OPARA-104 to -109. Non-biological sample, so organism is empty. enricher:
  label encoding instance-ids from sample; voxel size checked against the screenshot.'
