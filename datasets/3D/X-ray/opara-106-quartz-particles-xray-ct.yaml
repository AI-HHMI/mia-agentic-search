title: 'Tomographic dataset of a particulate Quartz sample: X-ray microscopy volume with per-particle
  segmentation'
short_name: Quartz particles segmentation (X-ray CT)
description: One Zeiss Xradia Versa 510 X-ray microscopy tomogram (4x optical lens) of Quartz particles
  embedded in wax, as a reconstructed raw TIFF stack (2243 slices, split over two raw zips) plus a segmented
  TIFF stack (2210 slices) in which every discrete particle has its own grey value. Part of the PARROT
  open archive of particle-discrete tomographic datasets; acquisition and reconstruction parameters and
  the particle size distribution are given as images.
