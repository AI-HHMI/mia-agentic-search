notes: 'Files: Quartz_raw_Part1.zip + Quartz_raw_Part2.zip (2243 .tiff slices in total, ~2 MB each) and
  Quartz_segmented.zip (2210 .tif slices in Split25/), plus acquisition/reconstruction/size-distribution
  images; size_bytes is the OPARA datacite.size. Voxel size is not in the metadata or paper; x=y=z=2.0210
  µm is the instrument pixel size read from the deposited reconstruction screenshot (Info panel, 4x lens,
  binning 2), not checked against TIFF headers. The segmented stack has 2210 slices vs 2243 raw, so alignment
  is unverified. Paper: particles segmented by single-threshold binarisation plus watershed in ImageJ,
  then manually sorted (under/over-segmented particles discarded), hence source mixed; label encoding
  not inspected. Sibling PARROT records (same scanner, other materials, separate samples): Mica (OPARA-107),
  Al2O3 (OPARA-105), Dolomite (OPARA-104), Limestone (OPARA-108), Soda-lime glass (OPARA-109). Non-biological
  sample, so organism is empty.'
