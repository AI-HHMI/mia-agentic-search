notes: 'One whole-brain HiP-CT volume (18709 x 18709 x 21517 voxels, 7.72 um per the XPCT.json sidecar
  and paper). The XPCT.ome.zarr is one split zip archive (.z01-.z08 + .zip, 2.46 TB; paper: ~13.7 TiB
  uncompressed), so all 9 parts are needed. Labels are not a curated ML set: left hippocampus manually
  refined on 200 of 4,000 slices then interpolated, anterior cerebral artery segmented manually in WEBKNOSSOS
  (sidecar: "Manual segmentation"), FastSurfer dseg automatic on a 494 um binned volume, plus white-matter
  masks. The 7 um masks are crops of the original grid; their offsets are not stated in the files. Authors
  not in the BioStudies API response. Also on Human Organ Atlas and EBRAINS. enricher: size from file-list-hipct.json
  + HTTP index (was null); download_url = FTP folder (was null).'
