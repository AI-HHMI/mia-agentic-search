title: Extremely Brilliant Brain - isotropic microscale human brain HiP-CT dataset with segmentation masks
short_name: Whole human brain HiP-CT with masks (X-ray)
description: One whole adult human brain imaged with hierarchical phase-contrast tomography (HiP-CT, synchrotron
  X-ray) at 7.72 um isotropic voxel size, with a registered 3T T2-weighted MRI. Derivative masks include
  a manually refined left-hippocampus mask, a blood-vessel (anterior cerebral artery) mask, white-matter
  masks and a FastSurfer whole-brain segmentation computed on a binned volume.
