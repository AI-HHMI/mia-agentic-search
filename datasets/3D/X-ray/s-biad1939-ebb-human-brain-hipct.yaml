notes: 'A single volume (the benchmark criterion of >=1 volume is met). The BioImage Archive file listing (file-list-hipct.json) shows XPCT.ome.zarr as a single 262 GB zip
  plus eight 275 GB split-zip parts (.z01-.z08), so these are two packagings of the same data and the total size is not stated; the paper gives ~13.7 TiB uncompressed. Labels
  are not a curated ML training set: per the paper the left hippocampus was manually refined on 200 of 4,000 slices then interpolated (Dice 0.627 vs FastSurfer initial surface),
  the anterior cerebral artery lumen was segmented in WEBKNOSSOS (some discontinuities), and FastSurfer labels were computed on a 494 um binned volume (automatic, from MRI-style
  pipeline); white-matter masks are also provided. Authors are not listed in the BioStudies API response read, so authors is empty. Also available via Human Organ Atlas and EBRAINS.
  Voxel size 7.72 um from the paper and archive description.'
