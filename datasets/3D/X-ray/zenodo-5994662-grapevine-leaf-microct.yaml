notes: 'Voxel size differs by cultivar: Cabernet Sauvignon (CS_*) 0.1625 um (40x; ImageJ header of CS GRID/PAGANIN/SEGMENTED
  agrees), Blaufränkisch (BF_*) 0.325 um (20x) (Zenodo page, AoB Plants Methods), so voxel_size_nm stays null. 52 scans, one
  zip per scan and type (GRID, PAGANIN, labelled-stack, SEGMENTED, STOMATAL_REGIONS). Annotation source mixed: labelled-stack
  = hand-labelled slices (background, epidermis, vasculature; mesophyll/airspace by thresholding), SEGMENTED = random-forest
  predictions trained on them, STOMATAL = individually segmented stomatal vaporsheds. Coverage: labelled-stack holds only
  the labelled slices (14 of 1920 in CS_Sun_Plant3_1; page says at least nine per scan), slice indices not given. enricher:
  size 192,183,356,177 B from Zenodo file listing (was ~192.2 GB page estimate); zip contents listed with peek_archive.'
