notes: 'Voxel size differs by cultivar and is not a single value: Cabernet Sauvignon 0.1625 um (40x), Blaufränkisch
  0.325 um (20x) (Zenodo page and AoB Plants Methods), so voxel_size_nm is left null. 52 scans, one file per scan
  and type (GRID, PAGANIN, labelled-stack, SEGMENTED), about 192 GB total, of which the labelled-stack zips are
  only ~15 MB; at least nine slices per scan are hand labelled (background, epidermis, vasculature; mesophyll and
  airspace by thresholding with manual correction), the SEGMENTED stacks are random-forest predictions trained
  on those slices. Zip contents could not be listed with peek_archive (server reports no size); file types come from
  the Zenodo file names and the page ("all 8-bit grayscale TIF"). Zenodo page cites the AoB Plants paper as "accepted";
  its DOI comes from the paper search result, the Methods were read on PMC. The 2020 Applications in Plant Sciences
  method paper (cited on the Zenodo page) was read in full via Europe PMC.'
