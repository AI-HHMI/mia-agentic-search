title: MicroCT scans of sun and shade grown leaves of Cabernet Sauvignon and Blaufränkisch grapevine (Vitis vinifera L.)
short_name: Grapevine leaf tissue segmentation (microCT)
description: Synchrotron X-ray microCT scans (TOMCAT, Swiss Light Source) of 52 leaf strips from sun and shade grown Cabernet
  Sauvignon and Blaufränkisch grapevine leaves. Each scan comes as absorption (GRID) and phase-contrast (PAGANIN) reconstructions
  with hand-labelled ground-truth slices (background, epidermis, vasculature), a random-forest segmentation of the full stack
  and stomatal-region stacks.
