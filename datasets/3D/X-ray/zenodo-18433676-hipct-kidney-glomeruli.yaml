notes: 'Zenodo record has six files; the usable training data is two archives: highres_training_16bit_cubes.zip (9.36
  GB, 40 raw cubes) and highres_training_labels.zip (16.6 MB, 40 label volumes); size_bytes is the sum of those two.
  Derived files (nnunet_models.zip 2.33 GB, predictions.zip 0.48 GB, cortex_masks.zip 0.19 GB) are excluded. enricher:
  labels are binary {0,1} semantic masks of glomeruli (was instance-segmentation); inspected cube/label 0, 10, 20, 39,
  all int8 {0,1}. enricher: voxel size varies by donor (isotropic HiP-CT, from Manual_annotated_..._spreadsheet.xlsx
  "Sample" column): cubes 0-19 = 5 um (S-20-28), cubes 20-35 = 5.2 um (LADAF 2021-17 left+right kidney), cubes 36-39 =
  2.58 um (LADAF-2020-27 left kidney); imaging.voxel_size_nm left null because no single value covers all cubes - split
  per donor for conversion (5000/5200/2580 nm isotropic). Zenodo publication date not read, so date_published null.'
