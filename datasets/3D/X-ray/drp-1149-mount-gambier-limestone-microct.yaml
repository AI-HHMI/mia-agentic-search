notes: 'Source: Digital Rocks Portal / Digital Porous Media Portal; the portal landing page was not reachable, so landing_url is the public TACC archive directory and the record metadata JSON, both fetched. No license in the metadata or listing, hence license unknown; no author list in the metadata fields read (authors left empty). Zip listing (peek_archive): 154 files, 129.8 GB uncompressed; original greyscale stack as 118 NetCDF blocks (.nc, not in the format enum, so only tiff is listed), converted 1280^3 greyscale TIFF, full-volume TIFF (MTG_Original.tif, 60 GB), three-phase label TIFF, classifier model, pore-network files, STL and OpenFOAM meshes. Labels come from a trained Weka classifier (automatic); the description says a detailed data manuscript will follow, and the related paper (doi 10.1007/s11242-026-02295-4) is not open access so only its abstract (which repeats the dataset description) was read. Greyscale stack is described as 8-bit; bit depth of file not verified.'
