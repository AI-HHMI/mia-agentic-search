title: Micro-CT dataset of Mount Gambier Limestone with Segmentation Classifier, Dual Pore Network Model
  and Finite Volume Meshes
short_name: Limestone 3-phase segmentation (micro-CT)
description: 'Micro-CT of a Mount Gambier limestone plug scanned at 2.675 um voxels on a Thermo Scientific
  HeliScan system (UNSW Tyree facility): the full reconstructed greyscale stack, a 1280^3 voxel benchmark
  subvolume with a three-phase segmentation (macro-porosity, micro-porosity, solid) made with Trainable
  Weka 3D Segmentation, the trained classifier, plus pore-network models and meshes.'
