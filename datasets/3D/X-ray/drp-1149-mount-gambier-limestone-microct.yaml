notes: 'Source: Digital Rocks Portal / Digital Porous Media Portal; the portal landing page was not reachable,
  so landing_url is the public TACC archive directory and the record metadata JSON, both fetched. No license
  in the metadata or listing, hence license unknown; Zip: 154 files incl. 118 NetCDF blocks (.nc, not
  in the format enum), TIFF stacks, labels, classifier, pore networks, meshes. Labels come from a trained
  Weka classifier (automatic); the description says a detailed data manuscript will follow, and the related
  paper (doi 10.1007/s11242-026-02295-4) is not open access so only its abstract (which repeats the dataset
  description) was read. enricher: authors from metadata JSON; size exact from zip listing; greyscale
  TIFFs are 16-bit (REV uint16, MTG_Original int16) although the metadata says 8-bit; classes 0 macropore,
  1 microporous, 2 solid from the code README (whose CC BY 4.0 covers the code repo, not stated for the
  data).'
