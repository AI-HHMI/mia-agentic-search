notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Archive (5.9 GB zip, 19 members,
  listed with peek_archive): full original stack Mt.Simon_6926.tif (8.0 GB), top and bottom cropped cubes
  each with Raw.tif and Filtered.tif (1.0 GB each) and Segmented.tif (0.5 GB), and two ganglion TIFFs
  (0.5 GB each) for the top cube. The metadata cites the dataset DOI itself as its only related publication
  (title ''Influence of Clay Wettability Alteration on Relative Permeability''), with no separate paper
  DOI, so no paper was read; the segmentation method, phase labels and voxel size of the cropped cubes
  (assumed the same 2.21 um as the original stack) are not stated. Portal page is a tombstone; TACC archive
  used. enricher: Segmented.tif values 0/155/255 (3 phases, names not stated).'
