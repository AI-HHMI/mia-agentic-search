schema_version: '1.2'
id: drp-304-mt-simon-sandstone-microct-residual
title: Micro-CT scans of Mt. Simon sandstone at residual conditions used for contact angle measurements
  and analyzing the influence of clay regions
short_name: Mt. Simon sandstone residual-saturation micro-CT
description: Micro-CT TIFF stack (2.21 um voxels) of a Mt. Simon sandstone core (6,926 ft depth, 0.25
  in x 1 in sub-sample) at residual conditions, plus two cropped regions of interest (top and bottom)
  each with raw, filtered and segmented volumes; the top region also has binary volumes of ganglia trapped
  in clay and in regular pores. Used for contact angle measurements and the influence of clay-rich pore
  regions on residual trapping.
