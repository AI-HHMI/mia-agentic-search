notes: 'Files: Experiment1-5000rpm-10min.zip (1.1 GB), Experiment2-4000rpm-10min.zip (1.1 GB), Experiment3-3000rpm-20min.zip (1.1 GB). Only the Experiment 1 zip was listed (950 raw TIFF slices, 976 x 944, pixel size 0.401117 um from Raw_Images/Header.txt; 9 segmented particle crops with 79-273 slices each; README.txt describes the structure); Experiments 2 and 3 are assumed to share the layout and their pixel sizes were not read. Segmentation was done with Fiji Trainable Weka Segmentation 3D (machine-learned, no manual proofreading stated); coverage is partial because only extracted particles are segmented, not whole volumes. The associated paper (3D Characterization of Dry Particle Coating Structures originating from the Mechano-Fusion Process) was not read, so it is not listed. Same research group as opara-1322 (a different material system, alumina/PTFE).'
