notes: 'Files: three zips, one per mechano-fusion experiment, each with Raw_Images (reconstructed 16-bit slices + Header.txt),
  Segmented_Images/ParticleN (binary Alumina, Polystyrene and watershed-split Polystyrene stacks per extracted particle; 9,
  8 and 9 particles), Process_Data CSVs, README.txt and CT reconstruction info. Segmentation: Fiji Trainable Weka Segmentation
  3D (automatic, no proofreading stated). Coverage partial: only extracted particle crops are segmented, without stated crop
  offsets. Paper (3D Characterization of Dry Particle Coating Structures originating from the Mechano-Fusion Process) not
  read, so not listed. enricher: voxel size set to null (was 401.1 for all): Header.txt Pixel Size 0.401117 um (Exp1), 0.415736
  um (Exp2), 0.415804 um (Exp3), isotropic CT voxels.'
