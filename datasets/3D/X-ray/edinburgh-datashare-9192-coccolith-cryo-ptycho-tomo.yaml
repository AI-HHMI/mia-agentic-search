notes: 'Two tomograms (delta and beta, 480 TIFF slices of 6.4 MB each, 3.08 GB uncompressed each) plus
  Avizo segmentation.zip (1.9 MB; label file named tomo_delta_SAM2_..., which suggests a SAM2-assisted
  segmentation, not confirmed). Listings from peek_archive and the README (docx, three lines). No paper
  is linked on the record, the title says G. huxleyi while the abstract says G. oceanica. Voxel size,
  energy and labelled classes are not stated;  Only the delta tomogram is segmented, so there is a single
  labelled volume. enricher: label file opened: 1792x1792x480 uint8 Avizo labels on the delta grid, 54
  materials (coccolith stages), all 480 slices labelled.'
