notes: 'Files (OPARA item API, bundle listing): micro-CT-lower-FOV.zip (1.2 GB, 3,781 files: Raw_images plus three segmentation
  stacks plus Preview.PNG), micro-CT-upper-FOV.zip (1.2 GB), high-res-SEM.zip (164 MB, 20 TIFFs in five cross-section folders
  plus Pixel-seg.ilp) and README.md. The segmentations come from a two-step Dragonfly pipeline described in the README (automatic,
  no manual proofreading stated); the second modality listed is other because the 20 BSE SEM cross-section images (0.12 um
  pixels, Tescan Amber) are unlabeled apart from one ilastik classifier. The related paper (Rieder et al.) was not found in
  Europe PMC, so it is not listed in publications and the segmentation procedure was read only from the README. Micro-CT:
  16-bit, 40x optical magnification, about 80 kV, 1601 projections. enricher: size_bytes from file listing (was datacite 2584758691).'
