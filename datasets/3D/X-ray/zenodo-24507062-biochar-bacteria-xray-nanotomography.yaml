notes: 'Labels: biochar and void by a random forest trained per sample on the hand-annotated slices (*_manual_annotations.zip, manual), bacteria by thresholding (automatic), so source is mixed. organisms:
  Staphylococcus aureus = *_EMRSA15_*, Pseudomonas aeruginosa = *_RP73_*. Individual files are directly downloadable from the record, no single archive. Voxel size 0.126 um from README and per-sample metadata
  JSON (UT_250_RP73: 0.12607 um). Related paper (Fady et al. 2025, Sci Rep, doi 10.1038/s41598-024-83825-2) covers the biochars and strains, not this dataset. Only ~2.8k labelled bacteria voxels per volume.
  enricher: TIFF axes zyx from ImageJ headers and README; size confirmed by file listing.'
