  notes: 'Listing: Zenodo API, 61 files, 3,916,496,376 bytes (complete). Headers: ImageJ TIFFs, axes ZYX, spacing 0.12607-0.12608 um. Samples: UT_RAW_EMRSA15 normalised (146.9 MB, full range 0-65535, p1
    0, p50 26701, p99 33181; zeros = outside field of view) and labels (values 0-3, 250 bacteria voxels in sample); PT_350_RP73 labels and reconstruction (0-65535). Value ranges are from these single samples.
    Manual annotation slices: 0 presumably unannotated (README gives 1=biochar 2=void 3=bacteria in the TIFF description). Per-sample voxel sizes differ in the 5th digit (0.12607-0.12608 um); README states
    0.126 um for all. No single archive: files are direct per-file Zenodo links (data.download_url is the record page; the Zenodo files-archive endpoint returns HTTP 403). Hand-annotated slices (2D) are left out of the sample unit; they are training inputs for the
    random forest, not volume labels.'
