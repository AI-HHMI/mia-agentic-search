notes: 'Labels were produced by a random forest trained per sample on hand-annotated slices (biochar, void) and thresholding (bacteria), so source is mixed; hand-annotated slices (e.g. 149 training + 7
  testing for UT_250_RP73) are included as zips. 61 files, 3.9 GB; individual files (e.g. <sample>_labels.tif) are directly downloadable from the record, no single archive. Voxel size 0.126 um from README
  and per-sample metadata JSON (UT_250_RP73 read: 0.12607 um). Related paper (Fady et al. 2025, Sci Rep, doi 10.1038/s41598-024-83825-2) covers the biochars and strains, not this dataset, and was not read.
  The dataset is X-ray microscopy of bacteria in biochar, with only ~2.8k labelled bacteria voxels per volume.'
