notes: 'Two Figshare zips (articles 7058615 native, 7058618 contrast-enhanced, both CC0), both listed with peek_archive: 4.5
  GB with 595 .hdr/.img pairs and 314 .cls files, and 4.4 GB (files/13329248) with 504 pairs and 334 .cls files; size_bytes
  is their sum. Analyze (.hdr/.img) is not a listed format, hence other; segmentations are .cls class files. Per the paper
  (full text read): 140 native and 85 contrast-enhanced scans, Tomoscope Duo and InSyTe scanners, Hounsfield units, manual
  segmentation after semi-automatic bone and lung delineation. n_items counts scans, not files. enricher: voxel size 0.28
  mm (paper: "acquired voxel sizes were 0.28 mm"; CT280/Organ headers 0.28; CT140 is 0.14), was 28 um; removed annotation
  type organelle (organs, not organelles).'
