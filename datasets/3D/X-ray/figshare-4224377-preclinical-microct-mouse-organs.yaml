notes: 'Two Figshare zips (articles 7058615 native, 7058618 contrast-enhanced, both CC0), both listed with peek_archive: 4.5 GB
  with 595 .hdr/.img pairs and 314 .cls files, and 4.4 GB (files/13329248) with 504 pairs and 334 .cls files; size_bytes
