  paper (full text read): 140 native and 85 contrast-enhanced scans, 28 um isotropic, Tomoscope Duo and InSyTe
  scanners, Hounsfield units, manual segmentation after semi-automatic bone and lung delineation. n_items counts scans,
  not files.'
