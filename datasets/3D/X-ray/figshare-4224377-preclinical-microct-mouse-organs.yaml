title: A preclinical micro-computed tomography database including 3D whole body organ segmentations
short_name: Mouse whole-body organ segmentation (micro-CT)
description: 225 murine 3D whole-body micro-CT scans, 140 native scans of 20 BALB/c nu/nu mice at seven time points and
  85 contrast-enhanced scans of ten A431-tumour-bearing mice, reconstructed at 28 um isotropic voxels, each with manual
  3D organ segmentations (bone, lung, heart, liver, spleen, kidneys and others). Some scans have a second evaluator's
  segmentation for comparison.
