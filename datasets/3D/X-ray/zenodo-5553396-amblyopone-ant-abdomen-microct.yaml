notes: 'Zenodo lists two files: Amblyopone_australis_CASENT0753222_CT.zip (3.5 GB, peek_archive: 2,149 .tif slices plus an
  Amira .info with pixelsize 2.44 and 2.44 um slice spacing) and Amblyopone_australis_CASENT0753222_Segmentation.ORSSession
  (5.9 GB). Labels exist only inside the proprietary ORS Dragonfly session, so they are not directly usable as masks without
  Dragonfly; this is why confidence is 0.5. The Zenodo text calls the second file a .zip but the file is a .ORSSession. The
  paper (J Morphol 2022) is not open access, abstract only; label classes and who segmented are not stated. A single specimen.'
