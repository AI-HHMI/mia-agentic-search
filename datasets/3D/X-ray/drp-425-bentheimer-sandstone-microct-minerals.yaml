notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Zip listing (peek_archive): five *_tomo.tar.gz tomograms (2.3-3.0 GB each), five *_seg label files (.nc or .tar.gz), NMR .mat and CSV files; 14.3 GB. The tar and netCDF members were not opened, so file formats (netCDF per the description) are unverified and listed as other. Voxel sizes differ per sample (2.16, 2.16, 2.23, 2.26 and 2.89 um per the metadata), so voxel_size_nm is null; the metadata gives the BHYA unit as nanometer, which is a typo for 2.16 um. How the segmentation was made (manual or algorithmic) is not stated on the record, so annotation source is unknown. The related papers are not open access and only their Crossref record could be read. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory and metadata JSON were fetched.'
