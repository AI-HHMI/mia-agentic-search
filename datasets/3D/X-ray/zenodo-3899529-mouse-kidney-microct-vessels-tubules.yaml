notes: 'Single volume: Data_Kidney_X-ray_micro-CT.zip (3,301 TIFF slices, 21.7 GB, raw volume) pairs with Segmentation_Blood_Tubules_Tissue.zip (3,301 TIFF slices, 0.54 GB); both zips were listed with peek_archive. Voxel size 3.3 um isotropic is stated on the Zenodo record; the paper abstract mentions 3.3 and 4.4 um isotropic voxels and that vascular and tubular systems were segmented, but the paper is not open access and the Methods could not be read, so the segmentation procedure (annotations.source) is unknown. The record also holds a 281 MB supplemental video, not counted in size_bytes.'
