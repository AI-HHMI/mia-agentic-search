notes: 'Files from the BioImage Archive: Pony_Placenta_microCT.tif ("Source image") and Pony_Placenta_Labels.tif
  ("Label"), described in Pony File List.tsv. The meaning of the 8 label values (0-7) is not stated on the entry;
  the paper (Placenta 2024) is not open access, only the abstract was read. Single specimen: one large volume. enricher:
  voxel size 172 um isotropic from Pony File List.tsv (XY 172 um, Z 172 um; was null). Both TIFFs carry "MIB Resample
  [6264 4152 1 726 1]->[3132 2076 1 363 1]", i.e. the 86 um scan in the study text was downsampled 2x, and their
  BoundingBox spans match 172 um voxels. size_bytes from Content-Length of all 4 files; doi and release date from
  the BioStudies API. Coverage dense: the entry calls the labels "segmented labels of an entire pony placenta";
  annotation source not stated.'
