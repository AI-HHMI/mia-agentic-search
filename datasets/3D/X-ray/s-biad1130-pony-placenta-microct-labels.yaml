description: One whole-organ microCT volume of a formalin-fixed, Lugol's iodine-stained term pony placenta (2.2
  GB TIFF) with a matching labels volume (45 MB TIFF) on the same grid, hosted in the BioImage Archive. The study
  describes the labels as segmented labels of the entire placenta; the associated paper quantifies gross morphometry
  and vascular branching morphometry from the single dataset.
