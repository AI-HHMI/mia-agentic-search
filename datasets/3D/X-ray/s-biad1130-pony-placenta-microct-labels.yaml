notes: 'Files listed from the BioImage Archive FTP: Pony_Placenta_microCT.tif (2.2 GB, "Source image") and Pony_Placenta_Labels.tif
  (45 MB, "Label"), described in Pony File List.tsv. Voxel size is inconsistent within the archive entry: the study
  text states an isotropic voxel edge of 86 um, while the file list gives XY 172 um and Z 172 um (possibly a binned
  version), so voxel_size_nm is left null. The meaning of the label values (vessel network vs. placental tissue
  classes) is not stated on the entry; the paper (Placenta 2024, not open access, only the abstract was read) was
  not available in full text. Release date is not shown in the API record. Single specimen, so it is one large volume
  rather than many samples; file headers were not opened (probe timed out).'
