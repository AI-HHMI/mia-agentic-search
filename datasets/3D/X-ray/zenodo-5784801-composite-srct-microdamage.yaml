notes: 'Zenodo mirror of the Dryad dataset 10.5061/dryad.ffbg79cwb (CC0 on the Zenodo record). Voxel size
  not stated in the README, Zenodo record, ESRF news item or paper abstract; the full text is not open
  access and the MIT DSpace manuscript was behind a bot check, so it was not read. Beamline ID19 from
  the ESRF news page. Annotations are human-traced damage labels, sparse (<<1% of volume). README gives
  a train/validation/test split by scan ID (dataset-5INL.yaml example). 30 zips of 6-8 GB each (~216 GB
  total from the Zenodo file list); each holds an images/ and an annotations/ TIFF stack. Material is
  an engineered composite, not biological tissue. enricher: technical block from listing + one sampled
  slice pair.'
