notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Archive (1.9 GB zip, 25 members,
  listed with peek_archive): per sample 16-bit grayscale, 8-bit grayscale (re-quantized with ImageJ) and
  segmented TIFF volumes. Voxel sizes differ per sample (sand pack 5.2 um, Bentheimer 5.4 um, fieldstone
  4.98 um, Ketton 5 um per the description), so voxel_size_nm is null. The fieldstone and Ketton volumes
  are subsets of other Digital Rocks Portal projects (297 and 167). The segmentation method and label
  values are not stated on the record; the paper is not open access (Crossref only), so annotation source
  is unknown. The portal page redirects to a tombstone; the TACC archive directory and metadata JSON were
  used.'
