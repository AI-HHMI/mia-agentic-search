notes: 'Seven zips (89062, 89064, 89069, 89075, 89090, 89113, SLS; 75.9 GB total) plus README and LICENSE. README: folders per scan with 01_tomodata, 04_unet_segmentations; 89062 and 89069 also hold 02_unet_training_and_validation sub-volumes and 03_RootPainter files; 40 central ground-truth XY slices in 01_tomodata; data in HDF5 except RootPainter (TIFF slices). 89062.zip was listed (1067 files, 49.6 GB uncompressed); other zips not listed. Voxel size, number and size of sub-volumes and classes are not on the Zenodo page, README or GitHub README; the paper (MDPI Methane) full text was not accessible (403, not in Europe PMC), so these stay empty. The preprint title on the record differs from the published paper.'
