notes: 'Three brains (tissue58, mouse4, tissue49; reconstructions reported as 3.9, 4.3 and 5.3 TB at full
  resolution), 185,582 files in the study; reconstructions at binning levels b1 (0.65 um), b8 and b32,
  so total size is not stated and left null. Annotation method per the BIA record: manual segmentation
  of 86 coronal slices of mouse4 at 0.65 um (Amira) used as ground truth to train a MONAI U-Net for choroid
  plexus epithelium and stroma, applied to the other brains; ventricle and brain masks come from sparse
  manual slices interpolated with Biomedisa. Hence source mixed, coverage partial; only the manual slices
  are expert ground truth. The accompanying paper was not found on Europe PMC by title and has no DOI
  in the BIA record, so only the BIA description was read; Methods details beyond it are unchecked. The
  same brains have an H&E histology comparison for tissue58.'
