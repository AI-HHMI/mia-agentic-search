title: Whole-brain synchrotron X-ray microtomography of three mouse brains with choroid plexus and ventricle
  segmentations
short_name: Mouse brain choroid plexus segmentations (X-ray)
description: 'Synchrotron X-ray microtomography (0.65 um isotropic voxels, mosaic-tiled) of three entire
  healthy mouse brains, with reconstructions at several binning levels and annotations of the choroid
  plexus (epithelium and stroma), ventricles and brain: manual slice segmentations used as ground truth,
  Biomedisa-interpolated masks, and U-Net predictions with post-processing.'
