title: 'Tomographic dataset of a particulate Soda-lime glass sample: X-ray microscopy volume with per-particle
  segmentation'
short_name: Soda-lime glass particles segmentation (X-ray CT)
description: One Zeiss Xradia Versa 510 X-ray microscopy tomogram (4x optical lens) of Soda-lime glass
  particles embedded in epoxy resin mixed with graphite nanoparticles as spacer, as a reconstructed raw
  TIFF stack (2916 slices, split over three raw zips) plus a segmented TIFF stack (2881 slices) in which
  every discrete particle has its own grey value. Part of the PARROT open archive of particle-discrete
  tomographic datasets; acquisition and reconstruction parameters and the particle size distribution are
  given as images.
