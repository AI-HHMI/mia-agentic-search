  notes: 'Zenodo listing complete and exact (95 files). Downloaded NF54_native.tar.gz (11,744,858 bytes)
    and read it with tarfile without extracting: 336 TIFFs, 35,090,422 bytes; slices 000 and 168: 514x1091
    uint8, PackBits, single page, no ImageJ metadata; values 0-0 and 0-61 (mean 10.5), so value range
    is from two slices of one volume. tar.gz members can''t be read by range, so other volumes were not
    opened. Read all 11 info.txt files (voxel sizes) and the first 120 bytes of NF54_bones.stl. Voxel
    size varies by stage (5 / 15 / 15.06 / 40 um), so imaging.voxel_size_nm stays null. No single archive:
    data.download_url stays null; every file is a direct Zenodo link with range requests.'
