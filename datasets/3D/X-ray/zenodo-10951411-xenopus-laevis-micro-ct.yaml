description: Reconstructed 8-bit micro-CT TIFF stacks of 10 Xenopus laevis animals from tadpole (NF44-45)
  to adult, each scanned natively (hard tissue) and after iodine staining (soft tissue), i.e. 20 volumes,
  with .stl surface models (body, skeleton, skull, brain, gut) for selected individuals and stages.
