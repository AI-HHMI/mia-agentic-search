notes: 'Annotations are surface meshes (.stl) only for selected stages/structures, not voxel masks; the
  annotation procedure is not described in the paper, so source is unknown and training use needs mesh
  voxelisation. Checked Zenodo record (file list), and paper Methods/Data availability (GigaScience, full
  text via Europe PMC). Paper also deposits the TIFFs in GigaDB. Marginal as a training set: primarily
  an anatomical atlas. enricher: voxel size varies, so null (isotropic, from <stage>_info.txt): NF44-45,
  NF52, NF53 5 um; NF54, NF57 15 um; NF59, NF62, NF66 15.06 um; Male, Female 40 um.'
