notes: 'Voxel size varies per sample (5 um for NF44-45 up to 40 um for the adult female, per paper Methods;
  per-sample values are in the paper''s Supplementary Table S1 and info.txt files, not captured here),
  so voxel_size_nm is null. Annotations are surface meshes (.stl) only for selected stages/structures,
  not voxel masks; the annotation procedure is not described in the paper, so source is unknown and training
  use needs mesh voxelisation. Checked Zenodo record (file list), and paper Methods/Data availability
  (GigaScience, full text via Europe PMC). Paper also deposits the TIFFs in GigaDB. Marginal as a training
  set: primarily an anatomical atlas.'
