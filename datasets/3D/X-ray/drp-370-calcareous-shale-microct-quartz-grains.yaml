notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Archive (6.7 GB zip, 30 members,
  listed with peek_archive): A4-1 raw subsets 1-4 (~0.8 GB TIFF each) and A4-1 segmented parts 1-2 (~0.68
