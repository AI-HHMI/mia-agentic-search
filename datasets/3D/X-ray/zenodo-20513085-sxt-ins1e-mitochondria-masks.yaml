title: Soft X-ray tomograms of INS-1E beta cells with cell, nucleus and mitochondria segmentation masks
short_name: INS-1E beta cell organelles (soft X-ray)
description: 55 whole-cell soft X-ray tomography reconstructions of cryo-preserved rat INS-1E pancreatic
  beta cells (unstimulated and stimulated with glucose, Exendin-4 or both for 1, 5 or 30 min), each with
  a segmentation mask labelling exterior, cell, nucleus and mitochondria. Tomograms are MRC volumes scaled
  to linear absorption coefficients; a metadata table gives condition, time point and voxel length per
  cell.
