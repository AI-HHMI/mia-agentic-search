notes: 'The record has four files - Raw_tomograms.zip (17.4 GB, 55 scaled .mrc, 24.3 GB uncompressed), Labels.zip (52 MB,
  55 .mrc, 12.1 GB uncompressed), Cell_Metadata.csv and README.txt - so download_url is null and size_bytes is the sum of
  the four files. Voxel_Length in Cell_Metadata.csv is one value per cell (taken as isotropic): 0.03682 um for 32 cells,
  0.03742 um for 19, 0.04158 um for 3 and 0.04551 um for 1, so 36.8 nm is the majority value, not universal. Tomograms
  were acquired on the XM-2 microscope at the ALS (517 eV, 60 nm zone plate). The preprint says the tomograms and masks come
  from earlier published datasets (White 2020; Loconte 2022) and describes the masks as manually segmented; the Zenodo
  README does not say who segmented them, and the related works it lists include automatic segmentation tools, so
  annotations.source manual comes from the preprint alone. Only the first 100 kB of the preprint text was read.'
