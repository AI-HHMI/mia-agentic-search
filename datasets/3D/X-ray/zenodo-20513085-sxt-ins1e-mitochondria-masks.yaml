notes: 'Four files: Raw_tomograms.zip (17.4 GB, 55 LAC-scaled .mrc), Labels.zip (52 MB, 55 .mrc), Cell_Metadata.csv,
  README.txt; size_bytes is their sum. Voxel_Length (Cell_Metadata.csv, one isotropic value per cell):
  36.82 nm for 32 cells, 37.42 nm for 19, 41.58 nm for 3, 45.51 nm for 1. enricher: voxel size 36.8 nm
  -> null (cells differ; per-cell values in Cell_Metadata.csv, MRC headers carry none). XM-2 microscope
  at the ALS (517 eV, 60 nm zone plate). The preprint says tomograms and masks come from earlier datasets
  (White 2020; Loconte 2022) and calls the masks manually segmented; the README does not say who segmented
  them. download_url: no single archive (two zips); the landing page is kept.'
