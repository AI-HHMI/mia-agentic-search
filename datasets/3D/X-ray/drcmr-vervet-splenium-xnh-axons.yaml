notes: 'No license or usage terms on the landing page or in the paper (the paper''s CC BY-NC-ND is the article license), so
  license is unknown. Paper Methods (PNAS 2020): 75 nm pixel size, 2048^3 voxel volumes; convenience volumes 410^3 at 375
  nm (NIfTI). Only large axons (>~2 um) are segmented, so labels are sparse. n_items=4 counts the public XNH volumes per the
  paper. Species mapped from "vervet monkey" to Chlorocebus pygerythrus. enricher: annotations.source mixed (was manual):
  cell clusters, vessels and vacuoles by in-house MATLAB thresholding/morphology (automatic); 54 axons from a rough ITK-SNAP
  paintbrush pass refined by an in-house MATLAB method (semi-automatic). Files not reachable this run (TLS failure).'
