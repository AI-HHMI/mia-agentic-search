notes: 'No license or usage terms are stated on the landing page or in the paper (the CC BY-NC-ND link in the paper text is the article license), so license is unknown. The download directory returned HTTP 503 and curl failed TLS verification, so file listing, sizes and annotation file formats were not seen. Paper Methods (PNAS 2020, Europe PMC): splenium scanned at 75 nm pixel size, 2048^3 voxel volumes; the downsampled convenience volumes are 410^3 at 375 nm. Only large axons (>~2 um) are segmented, so labels are sparse. n_items=4 counts the public XNH volumes per the paper. Species mapped from "vervet monkey" to Chlorocebus pygerythrus; label encoding unverified.'
