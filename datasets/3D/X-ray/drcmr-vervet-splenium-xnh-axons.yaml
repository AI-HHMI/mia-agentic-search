schema_version: '1.2'
id: drcmr-vervet-splenium-xnh-axons
title: Vervet monkey splenium X-ray nano-holotomography volumes with axon, cell, vessel and vacuole segmentations
short_name: Monkey white matter axons (X-ray holotomography)
description: Four synchrotron X-ray nano-holotomography (XNH) volumes of the splenium of a vervet monkey corpus callosum (75
  nm isotropic voxels at full resolution, plus downsampled convenience volumes), with segmentations of 54 large axons from
  one volume and of cell clusters, blood vessels and vacuoles from the stitched extended volume. Diffusion MRI of the same
  brain is also provided on the same page.
