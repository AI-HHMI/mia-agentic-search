notes: 'WT_normative_masks.zip (287.5 MB) holds, for each of 75 eyes (5 stages, LE/RE), 360 radial sections
  in four parallel folders: raw (WT<s>dpf_raw_PRL_lens), lens and PRL binary masks, and a PNG _mask series
  that the README doesn''t explain. Paper Methods: sagittal stacks radially resliced around the lens at
  1 deg steps (360 slices per eye); pixels 1 um isotropic. model_files.zip: 9 held-out CZI sections (README
  says 12) with per-class OME-TIFF ground truth, and 200 DeepLabCut PNG frames with 12 keypoints. Lens/PRL
  masks come from an arivis model + DeepLabCut with manual inspection (mixed source). enricher: raw sections
  found in the zip (the harvester noted none); voxel z 1000 -> null, because the slice axis is an angle
  (1 deg), not a length; formats + ome-tiff; size_bytes from the full listing; n_items = 75 eye series;
  download_url = WT_normative_masks.zip.'
