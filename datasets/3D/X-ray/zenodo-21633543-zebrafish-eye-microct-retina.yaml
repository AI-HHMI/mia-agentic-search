notes: 'Borderline: the 108,000-file WT_normative_masks.zip (287.5 MB, TIFF/PNG) holds the lens/PRL mask series (README: "image
  series ... anatomical layer segmented image"), and the raw micro-CT stacks are not deposited. Raw images in the deposit are
  the held-out test sections (9 CZI in model_files.zip listing, 12 per README) with manual ground truth, and 200 PNG frames with DeepLabCut keypoints. The
  lens/PRL masks were produced by an arivis Cloud model (EfficientNet-B0 U-Net) and DeepLabCut, then inspected manually, so the label source is mixed. Pixel
  size is 1 um isotropic per the paper Methods and the mask README. size_bytes is the sum of the file sizes listed on the Zenodo page (about 1.33 GB),
  which also holds five AVI videos and Excel measurement tables. Zenodo record 21633543 is the version cited by the DOI 10.5281/zenodo.21415264 concept record.'
