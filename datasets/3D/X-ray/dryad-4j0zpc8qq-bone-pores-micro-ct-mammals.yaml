notes: 'Twenty scan zips (44.6 GB total with models and software): 6 mouse bones (9.1 or 11.3 um), leopard (66.8 um), capybara (120.7 um, labels only), sea otter (30 um, labels only) and 11 river otter
  (50 um, updated labels only; their raw scans are in the existing record dryad-b2rbnzsq4-otter-long-bone-micro-ct, which this dataset extends with mouse and other species, new labels and a new
  model). Voxel size is that of the six mouse scans (9.1 um; 11.3 for one); other scans differ. Dryad downloads need a token, so zip contents were not listed (annotations_verified false) and file layout
  comes from the page README; the README does not describe label values. Labels: Avizo 3D masks (Otsu thresholding plus filtering, with manual corrections), hence mixed. Dryad API reports CC0-1.0; the
  landing page text does not state it.'
