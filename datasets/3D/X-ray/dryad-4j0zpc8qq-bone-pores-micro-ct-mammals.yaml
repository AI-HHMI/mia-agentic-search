notes: 'Twenty scan zips: 6 mouse, leopard, capybara (subvolume), sea otter and 11 river otter (labels only; raw in dryad-b2rbnzsq4-otter-long-bone-micro-ct). Dryad downloads need a browser session, so zips were not listed (annotations_verified false); layout from the page README, which does not give label values. Labels: Avizo masks (Otsu plus filtering, manual corrections), hence mixed. License CC0-1.0 per Dryad API. enricher: voxel_size_nm null (was 9100, mouse only); page Table 1 per scan, isotropic: 9.1 um (5 mouse), 11.3 um (1R_1U_HF), 66.8 (leopard), 120.7 (capybara), 50.0 (river otter), 30.0 (sea otter). organisms: Mus musculus = *R_*U_HF.zip; Panthera pardus = AMNH_Mammals_M-89009_F.zip; Hydrochoerus hydrochaeris = AMNH_Mammals_M-206440_mixed.zip; Enhydra lutris = ZMB_Mam_30740_HRU.zip; Lontra canadensis = OMNH/UAM/UF/UWBM zips.'
