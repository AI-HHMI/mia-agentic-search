notes: 'peek_archive of nii_gzs4.zip (24.8 GB, 62 .nii.gz): 31 image volumes (24.75 GB, names ending _crop_mask,
  _crop or none) and 31 masks named *_seg.nii.gz (54 MB in total). The Zenodo description is a single line plus
  a one-row table with unexplained numbers (N 4, 19, 4, 0.24), so voxel size, scanner, staining (file names mention
  PTA 14d for some), who segmented and how are not stated and no paper is linked. Sibling records exist for Dataset
  No. 3 (zenodo 15123180, full dataset before exclusion criteria), No. 5 (15123160) and a training notebook (15126203);
  this record is only No. 4. enricher: NIfTI headers give a different isotropic voxel size per volume (13.97-18.70
  um in 3 probed), so voxel_size_nm stays null.'
