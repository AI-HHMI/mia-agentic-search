notes: 'The Mendeley description lists raw/, labels/ and split/ folders (917 per-slice files, one 5-class
  map 0-4), but the only file, "Fish 1.zip" (1.85 GB; 54.3 GB unpacked), holds 5 multipage BigTIFFs: KCA109_s1s2_sagittal_8bit_1.tiff
  (raw) and Brain/Heart/LeftEye/RightEye.tiff, one int16 stack per organ. enricher: splits_provided false
  (no split files in the download; was true from the page text). enricher: label values read: Brain and
  Heart are {0,2}; LeftEye/RightEye have values 2-6 (undocumented sub-structures); per-organ voxel fractions
  match the description (brain 1.36%, heart 0.09%, eyes 0.49%/0.50%). enricher: channels 1 (8-bit greyscale).
  Voxel size 0.5 um isotropic from the Mendeley description. Paper (Reza et al.) submitted to Scientific
  Reports, not found in Europe PMC.'
