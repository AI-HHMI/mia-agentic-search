  label stack per organ); no split files were seen, so splits_provided reflects the
  page description only. Related paper (Reza et al.) is submitted to Scientific Reports
  and was not found in Europe PMC; voxel size and annotation procedure come from the
  Mendeley description. Mendeley may return 403 to some clients.'
