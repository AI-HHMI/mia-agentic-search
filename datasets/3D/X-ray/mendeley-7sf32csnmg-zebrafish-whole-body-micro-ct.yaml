notes: 'Landing page lists raw/, labels/ and split/ folders (917 slices, 1052x6760
  px, 733 train / 184 held-out slice indices), but the actual file listing is one
  zip, "Fish 1.zip" (1.85 GB), whose contents (peek_archive) are 5 multipage TIFFs:
