notes: 'Different from the human vagus nerve record zenodo-21007683 (same group and SPARC layout, but a human
  nerve in five segments at 6.43 um voxels); this one is a single rabbit nerve at about 6 um (README:
  166.67 px/mm), monofascicular, so the mask is binary only. Zenodo size is the zip (740 MB uncompressed,
  2705 files). The README does not say how the masks were made (source unknown) and lists the associated
  article and software as DOI pending, so there is no publication to read.'
