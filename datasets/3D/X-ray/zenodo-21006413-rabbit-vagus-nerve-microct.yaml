title: Rabbit Cervical Vagus Nerve Micro-Computed Tomography Dataset from Nodose Ganglion to Superior Cardiac
  Branch with Tissue Segmentations and 3D Reconstruction
short_name: Rabbit vagus nerve segmentation (micro-CT)
description: One Lugol's-iodine-stained micro-CT volume (1350 slices, 345 x 385 px, 16-bit, about 6 um
  isotropic) of a right rabbit cervical vagus nerve from the nodose ganglion to the superior cardiac branch,
  with per-slice binary nerve-versus-background DICOM masks aligned 1:1 with the slices and a reconstructed
  STL surface model.
