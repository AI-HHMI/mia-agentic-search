notes: 'Voxel sizes differ per embryo (2.6, 3.0, 5.0, 6.0, 6.0, 5.8, 5.5 um, paper Table 1); voxel_size_nm shows the smallest (E12.5)
  only because the schema takes one value. Dataset size (about 1 GB), CC0 licence and landing URL come from the DataCite
  record. gigadb.org renders client-side, so the file listing could not be read; formats, folder layout and masks come
  from the paper Data Availability section (annotations_verified false). Masks cover nasal capsule cartilage (all
  stages) and mesenchymal condensations (E12.5, E13.5), not whole heads; only every third slice was segmented manually, the
  rest interpolated. .stl models are also included. Micro-CT of whole embryos at 2.6 to 6 um, so only borderline microscopy.
  Not stated: exact file sizes, train/test split.'
