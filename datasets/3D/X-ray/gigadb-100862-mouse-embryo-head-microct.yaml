notes: 'Voxel sizes differ per embryo (isotropic, GigaDB file API and <sample>_info.txt): E12.5 2.6, E13.5 3.0, E14.5 5.0,
  E15.5 6.0, E16.5 6.0, E17.5 5.8, E18.5 5.5 um, so voxel_size_nm is null. CC0 per readme_100862.txt. Files: per-sample Images/Masks
  tar.gz on GigaDB Wasabi S3 plus .stl surface models and info.txt. Masks: 0 background, 1 = nasal capsule cartilage (all
  stages) plus mesenchymal condensations (E12.5, E13.5) in one class; every third slice segmented manually in Avizo, the rest
  linearly interpolated (paper). Not whole-head labels. No train/test split. enricher: voxel size set to null (was 2600 nm,
  the E12.5 value only); size 7.6 GB from complete S3 listing (was null); channels 1 from TIFF headers; annotations verified
  from E14.5 masks.'
