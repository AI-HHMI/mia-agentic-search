notes: 'Only one volume (n_items counts the three files: data.zip, raw volume, label). The raw volume NT32_tomo3_.raw
  is a headerless binary file (2048^3 uint16, 8 GiB), not NIfTI; the label is NIfTI. Voxel size 130 nm isotropic:
  effective pixel size in the Sci Rep paper Methods (same 2048^3 scan); the label grid is 4x coarser (about 520
  nm). The figshare description calls NT32 a micro-CT scan; the paper calls the technique X-ray phase-contrast holographic
  nanotomography. data.zip (184 kB, notebook images) could not be listed (ndownloader.figshare.com blocked); download_url
  not set because individual file links are on a blocked host. The paper''s data availability statement says patient
  data access is restricted by the ethics committee, yet the figshare record is public under CC BY 4.0. DTU landing
  page gave 403; figshare API used. enricher: size from figshare file listing; coverage = centre lines for 216 of
  several hundred nerves; annotation method not stated (CVPR paper).'
