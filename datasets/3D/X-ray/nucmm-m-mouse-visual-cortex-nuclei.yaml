notes: 'The Hugging Face card describes the data as "electron microscopy", but the paper (arXiv 2107.05840) states the mouse volume is 3D X-ray micro-CT, so modality is X-ray. Voxel size (720 nm isotropic), full volume size and the proofreading procedure are from the paper; the Hugging Face copy is a set of 200^3 crops (4 train, 4 val, ~39.9 MB). License MIT is only the tag on the Hugging Face re-upload; the paper and project page state no license, so the original terms are unverified. Authors list is partial (first/last author names only seen as Zudi Lin, Donglai Wei; 13 coauthors not read). The official project page (connectomics-bazaar) and nucmm.grand-challenge.org (403) were not usable for a download link. Related: NucMM-Z (zebrafish EM) is a separate dataset.'
