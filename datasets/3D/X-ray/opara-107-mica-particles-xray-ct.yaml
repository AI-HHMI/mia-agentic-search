notes: 'Files: Mica_raw.zip (992 .tiff slices, ~2 MB each) and Mica_segmented.zip (951 .tif slices in Split30/),
  plus acquisition/reconstruction/size-distribution images; size_bytes is the OPARA datacite.size. Voxel size: acquisition.PNG
  Info panel of the reconstructed volume (984 x 1009, matching the TIFFs) states pixel size 1.9965 um. The segmented
  stack has 951 slices vs 992 raw, so alignment is unverified. Paper: particles segmented by single-threshold binarisation
  plus watershed in ImageJ, then manually sorted (under/over-segmented particles discarded), hence source mixed;
  Sibling PARROT records (same scanner, other materials, separate samples): Al2O3 (OPARA-105), Dolomite (OPARA-104),
  Limestone (OPARA-108), Quartz (OPARA-106), soda-lime glass (OPARA-109). Non-biological sample, so organism is
  empty. enricher: label encoding instance-ids from sample; voxel size checked against acquisition.PNG.'
