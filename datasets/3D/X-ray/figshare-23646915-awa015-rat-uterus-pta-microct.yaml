notes: 'Figshare item, 10 files (19.1 GB): raw micro-CT .bmp stacks in zips (whole organ at 10.94 um per scan log; ovarian,
  central, cervical segments at 1.5 um per paper), png mask zips (whole organ, ovarian segment), downsampled.zip (nii.gz images
  + masks, factor 4) and H&E histology + masks as nii.gz. Raw .bmp is not in the schema format list. Voxel size is the whole-organ
  raw scan. Masks drawn manually in ITK-SNAP on the downsampled stacks (paper). The estrus/diestrus/proestrus/metestrus sets
  are separate records. enricher: modality brightfield added = AWA015_histology*.nii.gz (H&E), X-ray = all other files. enricher:
  downsampled voxel 44 um (organ) / 6.0 um (ovarian), from downsampled logs; NIfTI headers say 1 mm (default). enricher: masks
  cover whole organ + ovarian segment only (coverage).'
