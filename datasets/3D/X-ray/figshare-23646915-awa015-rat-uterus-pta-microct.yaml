notes: 'Figshare item, 10 files (19.1 GB): raw micro-CT .bmp stacks in zips (whole organ 2704 slices at 10.94 um from the scan log; ovarian, central and cervical segments at 1.5 um per the paper), png mask zips (whole organ, ovarian segment), downsampled.zip (png/nii.gz, factor 4) and H&E histology with masks as nii.gz. Raw .bmp is not in the schema format list, so formats lists png and nifti. Recorded voxel size is the whole-organ scan; downsampled masks are at 43.77 um (organ) and 6.0 um (ovarian segment). Masks drawn manually in ITK-SNAP; three observers reached Dice 0.91 on micro-CT. Only the whole organ and the ovarian segment have masks. The estrus/diestrus/proestrus/metestrus sets from other rats are separate records.'
