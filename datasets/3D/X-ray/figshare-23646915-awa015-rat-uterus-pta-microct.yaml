  notes: 'Listing: Figshare API + zip indexes, 10 files, 19,132,237,763 B exact (16,372 zip members). tools/listing.py and
    peek_archive.py could not read 4 of the zips (mask zips, downsampled.zip, Cev): HEAD on the objectext.auckland.ac.nz redirect
    returns 403 with a 1,083 B body, which the tools take as the archive size; a 1-byte range GET gives the real size and
    the zips are fine. Their indexes and members were read with an ad hoc range-request script (57,002,602 B in all). The
    same bug makes probe --download-check reject downsampled.zip::<member>, so the micro-CT NIfTI pair (downsampled.zip::downsampled/AWA015_PTA_1_Rec_Trans.nii.gz
    + _muscle_segmentation.nii.gz) is not in sample.urls; the histology pair is. value_range from one slice / one volume each.
    No single archive for the whole dataset: download_url is the landing page.'
