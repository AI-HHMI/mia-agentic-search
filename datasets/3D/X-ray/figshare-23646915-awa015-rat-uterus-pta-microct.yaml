description: PTA-stained micro-CT of one whole oestrus Sprague Dawley rat uterus (10.9 um/voxel) and of three ~2 mm segments
  (1.5 um/voxel), with manually drawn myometrium (muscle layer) segmentation masks for the whole organ and the ovarian segment,
  plus H&E histology slices at four locations with muscle masks. Downsampled NIfTI versions of images and masks are included.
