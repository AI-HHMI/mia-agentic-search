title: Torch3Dseg - Dataset
short_name: Textile reinforcement CT yarn segmentation (X-ray)
description: Annotated sub-volumes (height x 256 x 256 voxels) of in-situ X-ray computed tomography scans
  of dry multilayer textile reinforcements under compaction, with semantic labels for background/matrix,
  weft and fill yarns (plus yarn instance maps in some files), stored as NRRD and HDF5 for training a
  3D-UNet. Eight labelled volumes plus two trained checkpoints are in the archive.
