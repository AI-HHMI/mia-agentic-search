notes: 'Non-biological sample (technical textile reinforcement) imaged by X-ray micro-CT. Zip lists 31
  files: 8 .vol.nrrd with 8 .seg.nrrd labels, 6 *.train.h5 and 4 *.eval.h5 files (train/eval split by
  file name), 2 .seg.h5, two PyTorch checkpoints and a machine-data xlsx. The paper (arXiv 2508.10943,
  read) gives 20.22 um per voxel, three classes labelled in 3D Slicer with model-assisted pre-labels corrected
  by hand, hence source mixed; the Zenodo text says only the .h5 files are used for training. n_items
  counts the eight labelled sub-volumes. The Zenodo record is titled Torch3Dseg and the record text lists
  several layer zips, but only 285-10_layer.zip is attached. enricher: HDF5 volumeinfo says VoxelSize
  0.020618 (mm), the paper 20.22 um; kept the paper value.'
