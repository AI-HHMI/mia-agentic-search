notes: 'Files are GitHub release v1.0 assets of github.com/htem/xpress-challenge-files (8 assets: training raw + voxel labels, validation raw, test raw as HDF5; training/validation skeletons as NPZ), per the challenge page; the asset list itself could not be fetched, so sizes and exact names are unverified. No data license stated on the challenge page, paper or GitHub repo (only Grand Challenge general terms). Voxel size 33.3 nm is after upsampling from 100 nm raw acquisition. Skeleton-annotated sub-volumes are 1100^3 (train/test) and 700^3 (validation); test labels are withheld. Full paper text not retrievable via tools/paper.py (not in Europe PMC/Crossref); read via ar5iv HTML. Authors not recorded.'
