description: Three 1200^3-voxel X-ray holographic nano-tomography (XNH) volumes of mouse cortical white matter (training, validation, test) for 3D axon segmentation. Training and validation volumes carry manual axon skeleton tracings (1815 axons annotated in total); the training volume also has voxel-wise labels for a 200^3-voxel region. Test labels are withheld by the organisers.
