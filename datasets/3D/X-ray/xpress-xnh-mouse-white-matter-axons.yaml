notes: 'Files: 6 GitHub release v1.0 assets of htem/xpress-challenge-files linked from the challenge page (no single archive). No data license stated on the challenge page, paper or GitHub repo (only Grand Challenge general terms). Voxel size 33.3 nm per paper (HDF5 attrs say resolution 33); upsampled from 100 nm raw acquisition. Coverage: skeletons in 1100^3 (train/test) and 700^3 (validation) sub-volumes; voxel labels only in a 200^3 crop of the training volume at offset 16500 nm (voxel 500,500,500); test labels withheld. Annotation: manual (WebKnossos tracing). enricher: size 4.5 GB from file listing (was null); annotation type semantic -> instance-segmentation (sample: 51 axon IDs); annotations verified.'
