title: High resolution annotated HiP-CT training dataset for paper - Multiscale Segmentation using Hierarchical Phase-contrast
  Tomography and Deep Learning
short_name: Human kidney glomeruli segmentation (HiP-CT)
description: 40 manually annotated 512x512x512 cubes (16-bit) cropped from high-resolution volumes of interest of four intact
  human kidneys (three donors) scanned with hierarchical phase-contrast tomography (HiP-CT) at ESRF, with matching manual
  glomerulus segmentation labels. Released with a multiscale glomeruli segmentation pipeline paper that benchmarks nnU-Net,
  SwinUNETR, UNETR and V-Net on the cubes.
