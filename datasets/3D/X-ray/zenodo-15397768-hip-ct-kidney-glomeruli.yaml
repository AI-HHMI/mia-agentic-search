notes: 'Files (peek_archive): highres_training_16bit_cubes.zip holds 40 TIFFs (complete_cube_0..39, 269 MB each); highres_training_labels.zip holds 40 label TIFFs (complete_label_0..39, 134 MB each, i.e. one byte per voxel); plus a spreadsheet with per-cube details. Voxel size is not a single value: the paper (Methods/Results) states the annotated high-resolution cubes range from 2.58 to 5.2 um/voxel (binned by 2) across the four kidneys; the per-cube values are in the Zenodo spreadsheet, which was not read, so voxel_size_nm is null. The paper reports glomeruli as sparse (mean 3.5% of voxels within a 128^3 patch) and splits train/test at the cube level in the paper, but the Zenodo record does not provide a split file.'
