notes: 'highres_training_16bit_cubes.zip: 40 uint16 512^3 TIFF cubes (complete_cube_0..39); highres_training_labels.zip: 40
  binary label TIFFs (complete_label_N), plus a per-cube spreadsheet. Voxel size differs by kidney, so voxel_size_nm is null.
  Per the spreadsheet: cubes 0-19 S-20-28 "5um", 20-35 LADAF 2021-17 left/right "5.2um", 36-39 LADAF-2020-27 left "2.58um";
  the paper says the cubes are 2.58-5.2 um/voxel "binned by 2", and whether those values are before or after binning is not
  stated. Glomeruli are sparse (paper: mean 3.5% of voxels per 128^3 patch). The paper splits train/test by cube, but Zenodo
  has no split file. enricher: size from the Zenodo file listing (was the page total).'
