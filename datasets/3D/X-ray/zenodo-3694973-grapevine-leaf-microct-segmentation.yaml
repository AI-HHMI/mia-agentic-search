notes: 'A single scan (one volume): 24 manually labelled slices (80, 140, ... 1840) plus a random-forest prediction for the remaining
  slices (machine-generated, not proofread). Voxel size from the Zenodo description: 0.325 um in x/y (after halving) and 0.1625 um in
  z (slice spacing). Classes named in the paper: airspace, mesophyll cells, epidermis, background (veins/bundle sheath are not evenly
  segmented). size_bytes is the sum of the six listed files (approx 1.81 GB); n_items counts the volume. Zenodo 3694972 (a sibling record)
  was not accessible (HTTP 302 via API) and was not evaluated. The Hand_labelled_slices.tif pixel values/class encoding were not inspected.
  enricher: size_bytes from the exact Zenodo listing (1,832,610,206 B).'
