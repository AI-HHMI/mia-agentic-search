id: dryad-b2rbnzsq4-otter-long-bone-micro-ct
title: Micro-CT scans of North American river otter limb bones with cortical bone, trabecular bone and pore segmentations (BONe)
short_name: Otter long bone segmentation (micro-CT)
description: Micro-CT volumes of 38 limb bones (humerus, radius, ulna, femur, tibia, fibula) from nine North American river otters (Lontra canadensis), plus skull data, with reference 3D segmentations of cortical bone, trabecular bone and medullary pores made in Avizo. The 12 volumes of the deep learning sample were split into fitting (training and validation) and testing sets. The record also holds composite training volumes, trained models and predictions.
