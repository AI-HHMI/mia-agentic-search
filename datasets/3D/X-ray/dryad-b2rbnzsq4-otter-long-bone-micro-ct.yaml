notes: 'Dryad record: CC0, 72.8 GB, 16 files: 12 per-volume zips (Data/{Fitting,Testing}/<name>/ with _Raw, CTP-label and
  four Predict_* slice-TIFF folders plus .xtekct/.info scan metadata), _composite.zip (22 GB, the 8 fitting volumes appended
  into one sample), _Models.zip, _Scripts.zip and README.md. Paper: 12 volumes in the deep learning sample, 8 for fitting,
  4 testing; reference segmentation by one annotator in Avizo 3D. Also includes models and predictions. enricher: formats
  tiff and annotation layout from the Dryad README file tree (was other). enricher: annotations.source proofread (was manual):
  paper Methods, auto-thresholding plus top-hat and ambient occlusion, manually inspected and corrected. enricher: voxel size
  49.99 um is from the Dryad README scan table (Res. (um) column, 49.99 for every specimen), not the paper.'
