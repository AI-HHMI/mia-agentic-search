notes: 'Checked the Dryad API record (CC0, 72.8 GB, 16 files incl. per-specimen zips, a 22 GB composite zip, models, scripts, README) and the full paper (Methods, Data availability). Dryad downloads need auth and refuse range requests, so zip contents could not be listed: formats is other (unverified) and the annotation layout is unverified. Paper: 12 volumes in the deep learning sample, 8 for fitting, rest testing; reference segmentation by one annotator in Avizo 3D. Voxel size 49.99 um is from the Methods scan table; some scans have other or blank entries, so it may vary. Also includes skull scans, models and predictions.'
