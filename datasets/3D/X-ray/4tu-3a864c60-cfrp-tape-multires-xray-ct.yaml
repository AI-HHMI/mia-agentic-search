notes: 'Three zips: Microscopy_images.zip (1.27 GB; 162 .vk4 + 162 .png, 0.7 um pixels), XrayCT_Cropped_and_Registered_Reconstructed.zip
  (15.1 GB; listed with peek_archive: per-specimen _CRR.tif, _CRR_TWS_F.tif, _CRR_TWS_P.tif, _CRR_ST.mat;
  download_url points here) and XrayCT_Reconstructed_Image_Dataset.zip (106 GB, raw .txm per the paper;
  not listed). Voxel size is 0.8, 2.0 or 3.5 um per scan (isotropic); the record gives the finest. Labels
  come from Trainable Weka Segmentation (trained on user labels), so source is mixed; fibre labels exist
  for 0.8 and 2.0 um (plus one 3.5 um file), pore labels for all three. The registered multi-resolution
  stacks may also suit resolution-pair or registration work. n_items is the 4 specimens.'
