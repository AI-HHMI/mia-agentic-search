notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. The record covers both 2D (12,000 images; 9600 train / 1200 valid / 1200 test) and 3D (3,000 volumes; 2400 / 300 / 300), so dimensionality is set to 3D. The low-resolution inputs are synthetic (Matlab imresize / imresize3 downsampling of the HR crops), not separate acquisitions. The two big files are nested zips (DeepRockSR-2D.zip 9.9 GB, DeepRockSR-3D.zip 5.5 GB) that peek_archive cannot open, so counts and the folder layout come from the record description, not from a listing. Source volumes come from other portal projects (211, 135, 134, 6, 58, 72, 73, 21, 20) and their voxel sizes are not given here, so voxel_size_nm is null. The related paper is not open access and only its Crossref record could be read.'
