  notes: 'Both data zips are stored (not deflated) inside the archive zip, so a short script listed them
    by range requests and read single members: sandstone test 0901 HR/x2/x4 MAT and 3601 HR/x4 PNG (~1.3
    MB). Value ranges are from those files only. The shuffled2D/3D folders hold the combined, shuffled
    set, so the 150,000 files are 2x the 12,000 2D + 3,000 3D items (each with 4 LR versions). No sample
    unit: members of a zip nested in a zip can''t be addressed as zip::member, and the inner zips are
    5.5 / 9.9 GB. Voxel size: not in the metadata JSON; crops come from 11 rocks of 9 earlier DRP projects
    with their own voxel sizes, so there is no single value (upstream pages not read). TensorSwitch''s
    planner reads hdf5 only from .h5/.hdf5/.hdf/.he5 names. Download host web.corral.tacc.utexas.edu is
    not on TensorSwitch''s allowlist.'
