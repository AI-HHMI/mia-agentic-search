description: 'Greyscale micro-CT rock images organised like DIV2K for super-resolution training: 12,000 2D images (500x500 PNG) and 3,000 3D volumes (100^3 MAT) cropped from sandstone, carbonate and coal samples of earlier portal projects, each with high-resolution targets and x2 / x4 low-resolution versions (default and randomised downsampling), split into train, validation and test sets.'
