title: 'MTNeuro: multi-task X-ray microtomography benchmark of mouse brain (BossDB
  prasad2020)'
short_name: MTNeuro mouse brain microstructures (X-ray)
description: Multi-task benchmark built on volumetric, 1.17 um isotropic X-ray microtomography
  of a mouse thalamocortical brain section, hosted on BossDB (project prasad2020).
  Provides cutouts (256x256x360) from somatosensory cortex, striatum, ventral posterior
  thalamus and zona incerta, with brain-region labels and pixel-level semantic segmentation
  of cell bodies, blood vessels, axons and background, with separate train/validation/test
  cutouts per task.
