notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Files: netCDF classic .nc raw tomogram
  blocks (2520x2520x40 voxels, variable ''tomo'', concatenate along z; not in the format enum) and Matlab
  v7.3 .mat (HDF5). Zip: 233 .nc blocks and 12 .mat files. Voxel size differs by subset: HR 2.68 um, LR
  10.72 um (metadata voxelX/Y/Z); HR volumes are 4x the LR domain. Segmentation (Avizo watershed + hysteresis)
  is automatic. The related paper is not open access (Crossref record only); the testing volume is the
  first 256 LR / 1024 HR voxels per axis, no split files. TACC archive directory and metadata JSON were
  used instead of digitalrocksportal.org. enricher: voxel_size_nm 2680 -> null (LR arrays are 10720 nm);
  formats other -> hdf5 (.mat v7.3); size exact from zip listing.'
