title: A Multi-Resolution Complex Carbonates Micro-CT Dataset (MRCCM)
short_name: Carbonate multi-resolution micro-CT
description: 'Micro-CT of two complex carbonates (Indiana Limestone and a Middle Eastern carbonate), 6
  mm core plugs scanned on a HeliScan micro-CT at 2.68 um (high resolution) and 10.72 um (low resolution):
  raw tomograms, matching registered LR and HR volumes, and three-phase HR segmentations (macropores,
  solid, microporosity) made with Avizo watershed and hysteresis, for super-resolution and segmentation
  benchmarking.'
