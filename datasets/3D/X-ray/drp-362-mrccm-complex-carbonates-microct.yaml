notes: 'License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Files are NetCDF (.nc raw tomogram blocks of 2520x2520x40 voxels to concatenate along z) and Matlab v7.3 (.mat), neither in the format enum, hence other. Zip listing (peek_archive): 233 .nc blocks and 12 .mat files, 148 GB uncompressed. voxel_size_nm is the HR value; the LR scans are 10.72 um (HR volumes are 4x the LR domain). The segmentation (Avizo watershed + hysteresis) is automatic. The related paper is not open access and only its Crossref record could be read; the description says the testing volume is the first 256 LR / 1024 HR voxels per axis, but no official split files are provided. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory and metadata JSON were fetched.'
