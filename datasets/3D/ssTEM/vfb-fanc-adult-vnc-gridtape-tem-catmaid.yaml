  notes: 'EM inspected via the BossDB precomputed info (probe.py: uint8, zyx [4400, 264192, 137216], chunks [16, 512, 512],
    4.3 x 4.3 x 45 nm, 6 levels) and provenance; CATMAID tiles also exist in the public GCS bucket gs://vnc1_r066/alignmentV3/jpgs_for_catmaid
    (zoom folders 0-9) and on VFB/MRC-LMB mirrors (type 5, 1024 px tiles). Download: the BossDB info passes --download-check
    (usable, host allowed); chunked store, so TensorSwitch reads it remotely. Size 172.6 TB is the paper''s raw-image total;
    uncompressed full-resolution volume is 137216 x 264192 x 4400 B = ~159.5 TB. Voxel size 4.3 x 4.3 x 45 nm agrees across
    CATMAID stack info, BossDB info and paper (4.3 x 4.3 nm per pixel, 45 nm sections). Labels: CATMAID API (1,535 skeletons,
    project 1) or the paper''s SWC files on GitHub; synapses mostly automatic (3D U-Net) per the record. Value range not sampled.'
