notes: 'No data license is stated on the VFB page or in the paper; the GitHub repo htem/GridTape_VNC_paper (code and SWC neuron_reconstructions)
  carries a GPL-3.0 LICENSE file, which says nothing about the EM images. Size (172.6 TB raw, 20.6 million images), specimen
  and counts (507 motor neurons, 655 partially reconstructed sensory neurons) come from the paper Methods. The VFB instance
  also has project 2 (JRC2018_VNC_FEMALE). The skeleton count is the length of the public list for project 1. Author list
  is partial (first three as cited on the VFB page). enricher: EM found as neuroglancer precomputed on BossDB open data (s3
  bossdb-open-data/phelps_hildebrand_graham2021/FANC/em, 4.3x4.3x45 nm, per the paper''s Data availability and the repo README);
  data.formats and download_url updated (were jpeg / null).'
