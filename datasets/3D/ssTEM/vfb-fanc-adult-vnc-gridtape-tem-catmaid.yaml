description: 'Female Adult Nerve Cord (FANC): ventral nerve cord of an adult female Drosophila melanogaster imaged by GridTape
  serial-section TEM (83968 x 222464 x 4399 voxels at 4.3 x 4.3 x 45 nm; raw data about 172.6 TB) with manually traced motor
  and sensory neurons and automatically predicted synapses, in a public read-only CATMAID instance hosted by Virtual Fly Brain
  (also aligned to the JRC2018 VNC female template).'
