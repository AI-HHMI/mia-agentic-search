notes: No data license is stated on the VFB page or in the paper text read. Per the paper, EM images are also on BossDB (project
  phelps_hildebrand_graham2020) with CATMAID-ready JPEG tiles in a public Google Cloud bucket and tracings on GitHub (htem/GridTape_VNC_paper);
  those were not probed here. Size (172.6 TB, 20.6 million images), specimen and counts (507 motor neurons, 655 partially
  reconstructed sensory neurons) come from the paper Methods; the stack info lists tile mirrors at flyem.mrc-lmb.cam.ac.uk/vnc1/
  (not probed). The VFB instance also has project 2 (JRC2018_VNC_FEMALE, neurons aligned to a template). The skeleton count
  is the length of the public list for project 1 and may include tracings from later studies. Author list is partial (first
  three as cited on the VFB page).
