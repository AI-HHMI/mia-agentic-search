notes: 'Voxel size 1 x 1 x 50 nm (12830 x 8346 x 303 voxels) from the BossDB coordinate frame; licence
  CC-BY-4.0 from the DataCite record of the BossDB DOI. The 1986 paper is not open access (abstract only
  was read). Who made the seg channel, how (manual or automatic), what it labels (neurons, all cells)
  and its coverage are not described by the BossDB API record, DataCite record or the paper abstract,
  so annotation coverage and source are unknown. Modality (TEM) is inferred from the 1986 paper title/abstract
  mentioning electron micrographs of serial sections, the specific microscope type is not stated. enricher:
  1 nm lateral voxel size is only the BossDB frame / info value and looks like a placeholder; no source
  read states the pixel size of the digitized micrographs.'
