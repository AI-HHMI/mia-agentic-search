  notes: 'Complete S3 listing of white1986/ (42,180 objects, 24,190,408,475 B, exact). Probed all info
    files. Sampled chunk 1_1_50/5632-6144_6656-7168_208-224 of em_rechunked (3.83 MB gzip: uint8 min 24
    max 250 mean 139.8) and seg_rechunked (63 KB gzip: 27 ids, max 182, 50% zero); ranges from one chunk.
    With uint8 labels and 27 distinct ids in one small chunk, the ids are likely per-cell, but no source
    says so, so encoding stays unknown. Voxel size search: BossDB coord frame and every info file give
    1x1x50 nm; the 1 nm lateral value looks like a placeholder. Not confirmed: paper not open access (abstract
    only), BossDB/DataCite records give no pixel size.'
