notes: 'No license or terms of use found on the challenge page, zip listing or paper (Data availability
  only says the datasets are available on the challenge website), so license is unknown. The original
  challenge server (brainiac2.mit.edu) is decommissioned; data is served as a 31.5 MB zip from downloads.imagej.net
  containing train-volume.tif, train-labels.tif, test-volume.tif, test-labels.tif and an error-metrics
  script (listed with peek_archive). The paper says test ground truth was withheld during the challenge;
  the zip now lists test-labels.tif. Voxel size 4x4x50 nm from the challenge page and paper. Annotation
  source: training labels by one expert, test labels by two experts with consensus (paper Methods). size_bytes
  and n_items (train and test volumes) are approximate.'
