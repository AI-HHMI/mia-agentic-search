short_name: EMNeuron multi-species volume EM neurons
description: Training and validation archives of EMNeuron, a database of 16 volume
  EM datasets (4 in-house, 12 public, 8 nm-scale SBF-SEM, ATUM-SEM, FIB-SEM and ssTEM
  from fly, fish, mouse, human, zebra finch) built for the SegNeuron generalist neuron
  instance segmentation model; the paper reports over 22 billion voxels of which over
  3 billion are densely labelled.
