notes: 'HF repo has two RAR archives: labeled.rar (2.35 GB) and valid.rar (0.59 GB),
  card license MIT; the card has no other text. Archive contents could not be listed
  (no RAR tool), so formats and annotation layout come from the SegNeuron GitHub README
  (TIFF raw + *_MaskIns.tif pairs) and are unverified. MICCAI 2024 paper Table 1:
  16 datasets (13 for development, 3 for evaluation), tangential resolution adjusted
  to 6-9 nm, z 8-50 nm; 12 are public (ZFinch, ZFish, MitoEM, H01, Kasthuri, HBrain,
  FIB25, Minnie, Pinky, FAFB, Basil, Harris) and 4 in-house; the MIT card licence
  may not override the upstream licences. Many parts overlap datasets already in the
  catalog. Voxel size 8x8x40 nm is the most common setting, not uniform. Organism
  field left empty because it varies per sub-dataset; modality ssTEM chosen as the
  largest group (mixed SBF-SEM/ATUM/FIB-SEM).'
