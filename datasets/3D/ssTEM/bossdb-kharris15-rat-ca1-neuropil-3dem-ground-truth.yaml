  (BossDB kharris15)
short_name: Rat CA1 neuropil dense reconstruction (ssTEM)
description: Three serial-section EM volumes of adult rat hippocampal CA1 neuropil (spine, oblique dendrite
  and apical dendrite volumes; ~2 nm pixels, ~50-60 nm sections) with dense manual ground-truth reconstructions
  of all axons, dendrites, glia and synapses, plus traced subcellular structures, exported to BossDB as
  an annotation channel (anno) per volume.
