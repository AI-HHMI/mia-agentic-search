notes: 'Paper (open access, CC BY 4.0): all axons, dendrites, glia and synapses were reconstructed in a cube (~10 um3, spine volume), a cylinder (~43 um3, oblique dendrite) and a parallelepiped (~178 um3, apical dendrite); originally served by the Open Connectome Project, now on BossDB (experiments apical, oblique, spine, each with em and anno channels). BossDB coordinate frames give 2 x 2 x 50 nm (paper: ~2.2 nm pixels, sections 49 nm for oblique/apical and 59 nm for spine, so z differs slightly per volume). Licence CC-BY-4.0 stated in the paper and in the DataCite record. Publication date not read. Author names are initials from the Europe PMC author string.'
