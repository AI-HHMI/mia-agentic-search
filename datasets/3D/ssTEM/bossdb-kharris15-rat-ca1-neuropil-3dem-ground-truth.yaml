  notes: 'Complete S3 listing of neurodata/kharris15/ (6848 objects, 6,424,036,412 B, exact). Probed all
    six info files. Sampled one em chunk (spine 2_2_50/4096-4608_4096-4608_32-48, 2,341,612 B brotli):
    uint8 min 0 max 255 mean 72.4, 33% zeros; value range from one chunk. Labels not sampled: compressed_segmentation
    chunks need a decoder the allowed tools lack, so encoding (instance vs class ids) is unknown. Voxel
    2x2x50 nm from info files and BossDB coord frames; paper states ~2.2 nm/pixel and 49 nm (oblique,
    apical) / 59 nm (spine) sections, so the stored z of 50 nm is BossDB''s rounded value.'
