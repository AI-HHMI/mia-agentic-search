title: Segmented anisotropic ssTEM dataset of neural tissue (Drosophila larva ventral nerve cord)
short_name: Drosophila VNC neural tissue labels (ssTEM)
description: >-
  Two ssTEM image stacks of 20 sections each from the third instar Drosophila melanogaster larva ventral nerve cord
  (approx. 4.7 x 4.7 x 1 um, 4.6 x 4.6 nm/pixel, 45-50 nm sections). Stack 1 has dense labels for neuron membranes
  (with orientation and junctions), mitochondria, synapses and glia/extracellular space; stack 2 is the unlabeled test stack.
