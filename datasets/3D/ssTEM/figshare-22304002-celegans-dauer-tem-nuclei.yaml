notes: 'The figshare record has one link-only file (data.janelia.org/Neo5n) that redirects to the janelia-cosem-datasets S3 bucket, folder jrc_dauer-larva (N5 and a Zarr copy, OpenOrganelle dataset jrc_dauer-larva). From the N5 metadata: em/tem-uint8 is 140184 x 22032 x 581 voxels (uint8, 4 x 4 x 70 nm), labels/nucleus_seg is 14018 x 2203 x 581 uint16 at 40 x 40 x 70 nm. Figshare description: Leginon acquisition, TrakEM2 reconstruction, nuclei segmented with a custom active-contour and machine-learning approach; no proofreading is stated, so source is automatic. No paper is cited on the figshare page. Total size not computed (many chunk files). The Zarr copy was listed but not opened. Only nuclei are labelled. The figshare landing page returned 403 to the fetch tool, so the record was read through the figshare API instead (url_ok false).'
