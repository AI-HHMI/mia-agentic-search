  notes: 'Inspected via the CATMAID stack info, one tile header (MRC-LMB mirror) and one skeleton JSON. The paper''s Key Resources
    and Data availability point to temca2data.org (bigtiles.html) and the VFB CATMAID; temca2data.org did not answer this
    run, so no archive or chunked store (precomputed / N5) was found from a page read here. data.download_url stays null,
    download_method api. Download link search: tile URL has range requests but host flyem.mrc-lmb.cam.ac.uk is not on TensorSwitch''s
    allowlist; the CATMAID API host fafb.catmaid.virtualflybrain.org is not allowed and has no range requests. Size 106 TB
    is the paper''s figure (kept); uncompressed full-resolution volume is 253952 x 155648 x 7063 B = ~279 TB. Voxel size 4
    x 4 x 40 nm from the stack info agrees with the paper. License: none found for the data (the article itself is CC BY 4.0;
    VFB page and paper give no data license). Value range not sampled.'
