notes: No data license is stated on the VFB page (open read-only access, citation guidelines only); the Cell article is CC
  BY but the paper text read does not give a dataset license. Size (about 106 TB from about 21 million images), voxel size
  and specimen come from the paper Methods; section thickness is 35-40 nm there, 40 nm in the CATMAID stack. The paper says
  image data are also at temca2data.org and virtualflybrain.org (not probed here); tiles are JPEG pyramids at flyem.mrc-lmb.cam.ac.uk/fafb-tiles/
  (from the stack info, not probed). The skeleton count is the length of the public skeleton list and includes neurons from
  about 20 studies; the paper itself traced only selected circuits (e.g. Kenyon cells, 578 calyx boutons). Author list holds
  only the first author (Zheng Z) as cited on the VFB page.
