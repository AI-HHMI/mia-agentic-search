short_name: Drosophila adult whole brain neurons (TEM)
description: Full adult female Drosophila melanogaster brain imaged by serial-section TEM (253952 x 155648 x 7063 voxels at
  4 x 4 x 40 nm; about 106 TB, 21 million camera images) with manually traced neuron skeletons and synapse annotations from
  about 20 studies, in a public read-only CATMAID instance hosted by Virtual Fly Brain.
