notes: 'BossDB API (public): coordinate frame 131072 x 147456 x 7010 voxels at 8 x 8 x 45 nm base resolution; the paper states acquisition at
  4 x 4 x 45 nm and segmentation at 16 x 16 x 45 nm (cells, mitochondria). Channel em is uint8 CloudVolume (bucket bossdb-open-data, path
  bates_phelps_kim_yang2025/banc/em); seg_v888 is uint64. Paper Data availability: aligned image and flat segmentations on BossDB; synapses, skeletons, meshes
  and metadata also on Harvard Dataverse (10.7910/DVN/7WTH1N) and a Google Storage bucket. No data license is stated on BossDB or in the Data
  availability (the article itself is CC BY 4.0), so spdx is unknown. Total size not found. Segmentation is CNN output with extensive but
  ongoing human proofreading; no train/test split. BossDB page text unreadable (JavaScript); details from the BossDB API and the paper. Authors
  are the first four in the paper author list (initials only).'
