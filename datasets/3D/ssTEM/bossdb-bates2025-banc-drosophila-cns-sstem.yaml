short_name: Drosophila brain-and-nerve-cord connectome (ssTEM)
description: Serial-section TEM volume (GridTape, 7,010 sections of 45-50 nm) of the connected central nervous system of one adult
  female Drosophila melanogaster, with CNN cell, nucleus and mitochondria segmentations, synapse detections, and community-proofread
  neuron segmentation (about 160,000 neurons expected; 133,120 proofread neurons matched to cell types). The aligned EM, segmentations and
  synapses are on BossDB.
