schema_version: '1.2'
id: brainem-neuron-segmentation-benchmark
title: 'BrainEM: A Large-Scale and Diverse Benchmark for EM Neuron Segmentation in Connectomics'
short_name: BrainEM neuron instance segmentation (EM)
description: Benchmark for dense 3D neuron instance segmentation in electron microscopy connectomics. It combines 16 EM datasets (CREMI,
  FlyWire, FIB25, AC3/AC4, Wafer4, H01-AxonEM, FAFB and others, plus the newly acquired mouse V1 dataset MC93) into a Same-Source track
  (train on CREMI, test on FlyWire) and a Cross-Source track (train on several sources, test on held-out FIB25, AC3, Wafer4 and MC93).
  Images and integer instance-label volumes are provided as HDF5 and multi-page TIFF, with manifests of raw/label pairs.
