notes: 'Collection declared CC BY-NC 4.0 but subsets keep source terms: MC93, FIB25, H01-AxonEM, pinkey-AxonEM, Basil, Harris, Hemi-brain-fib
  CC BY 4.0; Flywire CC BY-NC 4.0; AC3-AC4, FAFB, MiRA-*, cremi, wafer4 research use only. 600 rows (480 train/20 val/100 test). organisms
  (subsets/*.json): Drosophila melanogaster = cremi/, FAFB/, FIB25/, Flywire/, Hemi-brain-fib/ (fly); Mus musculus = AC3-AC4/, Basil/,
  MC93/, MiRA-PIB/, MiRA-SCN/, pinkey-AxonEM/, wafer4/; Rattus norvegicus = Harris/, MiRA-ADWT/; Homo sapiens = H01-AxonEM/; Danio rerio
  = MiRA-ZF/. modality: ssTEM = AC3-AC4, Basil, cremi, FAFB, Flywire, Harris, pinkey; ATUM-SEM (ssSEM) = H01, MC93, MiRA-ADWT/SCN/ZF;
  FIB-SEM = FIB25, Hemi-brain-fib; other = wafer4 (multi-beam SEM), MiRA-PIB. annotations: MC93 manual (TrakEM2, 5-10% proofread); FlyWire
  public consensus segmentation; others from upstream. enricher: voxel size left null (differs per subset), organisms, modalities, channels
  and size from listing/subset metadata.'
