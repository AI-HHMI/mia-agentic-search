title: ConnectomeBench2 - EM and mesh renderings of expert connectome proofreading edits (mouse, fly, human, zebrafish)
short_name: Connectome proofreading EM crops (4 species)
description: 401,170 samples of real merge and split proofreading edits and synthetic controls from four open EM connectomes
  (MICrONS mouse, FlyWire fly, H01 human, zebrafish). Each sample has 224 x 224 mesh renderings and, for 251,499 samples,
  224 x 224 EM views (xy, xz, yz, oblique) whose channels are raw EM and the masks of one or two segments. Labels
  are the proofreading decisions, with train, validation and test splits.
