notes: 'Hugging Face listing: 506 parquet shards (121.3 GB, 401,170 samples per shards.csv; 319,727 train / 43,517 validation /
  37,926 test per the card), metadata sidecars, croissant.json. The main branch is the V1 submission; the card says the
  v2 revision matches the arXiv paper. Licence: the card says "other" and asks users to comply with the upstream licenses
  (MICrONS and H01 CC BY 4.0, FlyWire and fish1 CC BY-NC 4.0 per the paper), final outbound licence still to be set, so
  spdx is custom. Labels are expert proofreading edits pulled from CAVE (paper), not pixel annotations of raw EM; the EM
  views are 224 x 224 crops (render extents 1.5-2.5 um) whose voxel size is not stated in the card or the paper
  text read, so voxel size is null. Imaging per source connectome is serial-section EM; modality ssTEM is a
  best fit and the H01 and fish1 acquisition type was not checked. Not a classic segmentation dataset: mainly a
  proofreading benchmark with image and mesh inputs.'
