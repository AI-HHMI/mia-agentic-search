notes: 'No license or terms are stated on the VFB page (open read-only access, citation guidelines only). The VFB page says
  the volume is not actively worked on and holds all reconstructions regardless of completeness or review status; the papers
  annotation marks the subset published in Valdes-Aleman et al. 2021 (doi 10.1016/j.neuron.2020.10.004, called Control-2 there).
  That paper could not be read (publisher 403, Europe PMC 503), so it is not listed in publications. Voxel size follows the
  CATMAID stack metadata (4 x 4 x 45 nm); the page text says 3.8 x 3.8 x 40 nm, so the two disagree. Image tiles are JPEG
  pyramids (VFB base https://virtualflybrain.org/data/EM/abd1.5/, probed by the enricher: 256x256 uint8 JPEG). Stored size
  is not stated. enricher: same volume on open-neurodata S3 as precomputed (cardona/acardona_abd1_5); formats, download_url
  updated (were jpeg/null). Related VFB volumes: IAV-Robo, IAV-TNT, L1EM.'
