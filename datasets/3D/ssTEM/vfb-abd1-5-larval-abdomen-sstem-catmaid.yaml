  notes: 'Inspected via the CATMAID stack info, one tile header and one skeleton JSON. No archive or chunked store (OME-Zarr
    / N5 / precomputed) exists: the EM is a JPEG tile pyramid (one file per 256x256 tile per section per zoom), and the tracings
    come from the CATMAID REST API, so data.download_url stays null and download_method api. Download link search: tile URL
    works with range requests but host virtualflybrain.org is not on TensorSwitch''s allowlist; the API JSON has no range
    requests and its host abd1.5.catmaid.virtualflybrain.org is not allowed either. Tile listing not crawled (462 section
    folders, ~5.7M files with pyramid), so no file-listing size. Voxel size: the stack info says 4 x 4 x 45 nm, the VFB page
    text says 3.8 x 3.8 x 40 nm; the record keeps the stack metadata value (unchanged) and the conflict stays open (paper
    unread, Europe PMC 503). The page''s sentence and the broken-slice list (99, 349-351) are identical to the IAV-Robo instance,
    which hints the page text may be copied from there, but this is not confirmed. Value range not sampled. License: none
    found; checked the VFB hosted page, VFB knowledge base (no DataSet for ABD1.5; only Valdes_Aleman2021, CC-BY-4.0, which
    covers that paper''s neurons, not this whole instance). size estimated (uncompressed): raw 1 x 462x18326x22775 uint8 =
    192,827,088,300 B (192.8 GB).'
