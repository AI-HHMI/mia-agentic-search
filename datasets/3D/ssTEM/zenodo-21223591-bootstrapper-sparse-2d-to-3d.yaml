notes: 'Repackaging of public datasets (CREMI, Harris 2015, Wolny 2020 plant tissue, MitoEM, Cell Tracking Challenge, LICONN, PRISM) with dense and sparse labels used to evaluate the bootstrapper method; users are asked to cite both the originals and this archive, so overlap with individual records of the originals is possible (checked: no catalog match on accession, DOI or paper). The tar archive was not listed (peek_archive handles zip only), so the structure comes from the Zenodo description and annotations_verified is false. Voxel size differs per dataset (see description), so imaging.voxel_size_nm is null. Organisms listed from the preprint text (CREMI Drosophila, LICONN mouse cortex); the species of the other volumes are not stated on the page and are not listed. Sparse labels for the core datasets were derived from the dense ones (preprint Methods).'
