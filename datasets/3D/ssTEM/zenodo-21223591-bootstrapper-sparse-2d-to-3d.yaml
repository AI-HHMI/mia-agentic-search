notes: 'Repackaging of public datasets (CREMI, Harris 2015, Wolny 2020 plant tissue, MitoEM, Cell Tracking Challenge,
  LICONN, PRISM) with dense and sparse labels used to evaluate the bootstrapper method; users are asked to cite
  both the originals and this archive, so overlap with individual records of the originals is possible (checked:
  no catalog match on accession, DOI or paper). The tar archive was not listed (peek_archive handles zip only),
  so the structure comes from the Zenodo description and annotations_verified is false. Voxel size differs per dataset
  (see description), so imaging.voxel_size_nm is null. organisms: Drosophila melanogaster = cremi_a/b/c, cremi_clefts;
  Mus musculus = liconn (preprint); others not stated. Sparse labels for the core datasets were derived from the
  dense ones (preprint Methods). enricher: tar walk shows zarr v2 labels (uint64) in epi.'
technical:
  method: header
  size_source: page-stated
  layout:
    tree: "data.tar  (3,896,176,640 B; the record's only file; plain tar, read by header walk)\n  data/<dataset>/volume_1.zarr/\
      \   (zarr v2, '/' or '.' chunk keys, blosc-lz4)\n    raw/, labels/, sparse_labels/ [, sparse_labels_mask/]\n\
      \  data/<dataset>/volume_2.zarr/{raw,labels}   (core datasets only, per the Zenodo description)\n  datasets:\
      \ cremi_a, cremi_b, cremi_c, epi, fib, harris15 (core); liconn, mitoem, cremi_clefts, fluo, prism\n  tar order\
      \ starts with data/epi/; also holds macOS '._*' resource-fork files next to chunks\n  first 300 tar entries\
      \ read (data/epi/volume_1.zarr only)"
    n_files: 1
    listing_complete: false
  sample: null
  arrays:
  - role: label
    path_pattern: data/*/volume_[12].zarr/labels
    format: zarr
    axes: zyx
    shape:
