    alignment: unknown
    alignment_notes: 'epi/volume_1.zarr/labels .zarray: shape 320x960x1000, chunks 20x120x125, <u8, blosc lz4. Dense
      instance labels per the description; raw .zarray not reached by the walk, so raw/label grids are not compared.'
  - role: label
    path_pattern: data/*/volume_1.zarr/sparse_labels
    format: zarr
    axes: zyx
    shape:
    - 1
    - 960
    - 946
    shape_varies: true
    dtype: uint64
    compression: blosc
    value_range: null
    normalization: none
    encoding: instance-ids
    classes: null
    alignment: offset
    alignment_notes: 'epi sparse_labels: one z-slice 1x960x946 (chunks 1x240x237), .zattrs axis_names z,y,x, units
      nm, voxel_size [235,75,75], offset [57810,0,1425] nm, i.e. a single annotated 2D section placed by a world
      offset. sparse_labels_mask (|u1, same shape/offset) marks the annotated pixels.'
  notes: 'Header-level: data.tar is one plain tar of zarr stores (one file per chunk), which no allowed tool lists;
    an ad hoc script walked the first 300 tar headers by range requests (~2.4 MB) and read the .zgroup/.zarray/.zattrs
    met on the way (all in data/epi/volume_1.zarr). The tar holds tens of thousands of chunk files, so a full walk
    (1 request each) was not done: listing_complete false, per-dataset shapes unknown. No chunk was decoded. Size:
    the Zenodo API states the one file as 3,896,176,640 B (page-stated, since the tar contents were not fully listed).
    Voxel sizes differ per dataset (Zenodo description, z,y,x nm): cremi_a/b/c 40,8,8; epi 235,75,75 (also in the
    epi .zattrs); fib 8,8,8; harris15 50,8,8; liconn 24,18,18; mitoem 30,8,8; cremi_clefts 40,4,4; fluo 1,1,1 (2D+t);
    prism 400,168,168 (18 channels). TensorSwitch cannot read tar members, so no sample unit.'
