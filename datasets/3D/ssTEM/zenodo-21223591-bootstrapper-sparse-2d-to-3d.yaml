title: Bootstrapper datasets, 3D EM and expansion-microscopy volumes with dense and sparse instance labels
short_name: Bootstrapper 3D EM volumes, dense+sparse labels
description: 'Archive (data.tar, 3.9 GB, zarr arrays) accompanying "A general method for bootstrapping dense 3D segmentations from sparse 2D annotations". Six core datasets (cremi_a, cremi_b, cremi_c, epi, fib, harris15) each hold volume_1.zarr with raw, dense labels and sparse_labels, plus a held-out volume_2.zarr with raw and labels. Five single-volume datasets (liconn, mitoem, cremi_clefts, fluo, prism) hold volume_1.zarr with a sparse_labels_mask. Voxel sizes (z,y,x in nm) are listed per dataset on the Zenodo page: for example 40,8,8 for CREMI, 8,8,8 for the FIB-SEM volume, 24,18,18 for LICONN.'
