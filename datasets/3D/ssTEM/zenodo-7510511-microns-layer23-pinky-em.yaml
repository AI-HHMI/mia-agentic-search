notes: 'CC-BY-4.0 is the license of the Zenodo data-tables record; the microns-explorer phase1 page states
  none (Terms not read). Imagery and segmentation: public bossdb-open-data S3 prefix iarpa_microns/pinky
  (em uint8 4x4x40 nm grid, seg uint64 8x8x40 nm, offset sub-box). enricher: seg provenance names gs://microns_public_datasets/pinky100_v185/seg,
  confirming this prefix is Pinky100. enricher: voxel size kept at 3.58x3.58x40 nm (page and paper state
  imaging at 3.58 nm); the precomputed info files label the stored grid 4x4x40 nm, conflict noted. enricher:
  annotations_verified true (seg layer probed, one chunk decoded: 150 uint64 IDs). Seg is automated (watershed
  + mean-affinity agglomeration, paper Methods) with 364 neurons proofread; synapses, nuclei, mitochondria
  are CSV tables on Zenodo. The VAST ground truth and cleft training labels described in the paper are
  not in this bucket. Different volume from the minnie65 record.'
