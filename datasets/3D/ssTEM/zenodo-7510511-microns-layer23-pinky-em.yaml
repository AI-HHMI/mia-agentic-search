    array). No file listing (millions of chunk objects). Direct links: chunked stores, so sample.urls
    are the layer roots, read remotely; no single archive of the EM exists. size estimated (uncompressed):
    raw 1 x 2192x83968x124928 uint8 + label 1 x 2176x26112x43520 uint64 = 42,776,330,764,288 B (42.8 TB).
