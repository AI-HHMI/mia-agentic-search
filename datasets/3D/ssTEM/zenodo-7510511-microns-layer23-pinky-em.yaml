  notes: 'Shapes, dtypes, chunks and scales from the precomputed info JSONs (x,y,z in the files, written
    here as z,y,x). Sampled one em mip0 chunk (512x512x16, 3,564,975 B gzip on the wire, 4,194,304 B raw):
