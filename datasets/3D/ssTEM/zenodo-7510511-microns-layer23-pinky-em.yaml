notes: 'CC-BY-4.0 is the license of the Zenodo data-tables record (10.5281/zenodo.7510511); the microns-explorer phase1 page states no license itself and links Terms and Conditions (not read). Imagery and segmentation sit in the public bossdb-open-data S3 bucket under iarpa_microns/pinky (em uint8 at 4x4x40 nm, seg uint64 at 8x8x40 nm, offset sub-box); that this prefix is the layer 2/3 volume is inferred from the name and matching 40 nm sections, not stated on a page read. The Zenodo record holds tables and two-photon data, not EM. Paper: 3.58x3.58x40 nm, human VAST ground truth of 1.29 billion voxels, synaptic cleft annotations (310.7 um3, train/val/test). Different volume from the minnie65 record already in the catalog. Annotation files were not browsed in a listing (annotations_verified false); the Zenodo layer23_v185.tar.gz (11 GB) contents were not listed.'
