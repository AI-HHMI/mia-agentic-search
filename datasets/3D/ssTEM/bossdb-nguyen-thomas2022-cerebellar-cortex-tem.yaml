notes: 'License CC-BY-4.0 from the DataCite record of the BossDB DOI. Voxel size 4 x 4 x 40 nm is the
  BossDB coordinate frame of cb2 (the paper Results give 4 x 4 nm per pixel, Methods 4.3 nm; sections
  ~45 nm thick); the segmentation frame is 16 x 16 x 40 nm. The segmentation is automatic (3D U-Net affinities,
  watershed and agglomeration) with paper-level proofreading; the extent of proofread voxels in the BossDB
  channel is not stated. The visible paper text did not include the data availability section (truncated),
  so BossDB hosting is taken from the DataCite record and BossDB API. enricher: seg info places the labels
  at z -1280..-32 (offset -1280, 1248 sections) vs em z 0..1200, and no source read gives the mapping,
  so alignment is unknown.'
