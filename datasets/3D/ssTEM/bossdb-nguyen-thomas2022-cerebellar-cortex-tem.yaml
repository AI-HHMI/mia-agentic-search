short_name: Mouse cerebellar cortex neurons (TEM)
description: Serial-section transmission EM volume (GridTape, 1,176 parasagittal sections) of lobule V
  of the adult mouse cerebellar vermis with a CNN-based automatic neuron segmentation (cb2_seg channel
  on BossDB). Paper-level manual proofreading reconstructed 153 Purkinje cells, 784 mossy fibre boutons
  and thousands of granule cells and axons, and predicted synaptic clefts with a synful-based network.
