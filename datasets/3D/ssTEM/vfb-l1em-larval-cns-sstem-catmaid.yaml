notes: No license or terms are stated on the VFB page (open read-only access, citation guidelines only) or in the paper text
  read (data and materials statement points to the VFB CATMAID instance; article text under the AAAS reuse license). Stored
  size is not stated. Image tiles are JPEG pyramids (mirror bases are listed in the instance stack info; the VFB base is https://virtualflybrain.org/data/EM/L1EM/0111-8/,
  not probed). Volume size, voxel size and the 3016-neuron / 548,000-synapse brain connectome come from the Methods and abstract
  of Winding et al. (read from a PDF copy at par.nsf.gov); the skeleton count is the length of the public skeleton list and
  also includes neurons from ~27 earlier studies. Author list is partial (first five of the paper). Only part of the reconstructed
  CNS is in the brain connectome; sensory and motor neurons are present as axons and dendrites only.
