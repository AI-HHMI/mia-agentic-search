short_name: Drosophila L1 larva whole CNS neurons (ssTEM)
description: Serial-section TEM volume of the whole central nervous system of a 6-hour-old first-instar Drosophila larva (28128
  x 31840 x 4841 voxels at 3.8 x 3.8 x 50 nm), with manually traced neuron skeletons and synapses from many studies, including
  the full brain connectome of Winding et al. 2023, in a public read-only CATMAID instance hosted by Virtual Fly Brain.
