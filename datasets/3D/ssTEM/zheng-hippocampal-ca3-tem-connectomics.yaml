notes: 'Landing page is the paper''s code repo, whose README gives the data access (CloudVolume path gs://zheng_mouse_hippocampus_production/v2/seg_m195,
  CAVE, https://pyr.ai) and says the work is CC BY-NC 4.0; no separate data license was found, so this is a best reading.
  The bucket (public listing) holds img_aligned_18nm, seg_m153/m195/m357, nuclei, ws and mask layers; the seg_m195 info file
  was fetched. Voxel size and volume (51,421 x 57,385 x 2,048 voxels, ~4 trillion voxels) are from the paper Methods. Segmentation
  is automatic (affinity U-Net fine-tuned on manual annotations, agglomerated), with about 40% of voxels proofread (pyramidal
  and mossy-fiber axons); the README asks for contact with the Seung Lab for a full volume copy. Total size in bytes not stated.
  pyr.ai (proofreading portal) is a separate request-access route. Exact image-layer format/size was not inspected. enricher:
  size estimated from info shapes (was null).'
