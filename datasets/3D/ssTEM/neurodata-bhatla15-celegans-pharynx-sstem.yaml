  notes: 'Complete S3 listing of open-neurodata/bhatla/ (133,654 objects, 42,156,121,067 B exact; only ritaN2 =
    worm #1 exists). Probed both info files (image raw encoding, 8 anisotropic levels; annotation compressed_segmentation
    8x8x8 blocks, 1 level). Chunks are served with Content-Encoding: br (brotli), hence compression other for the
    image. Sampled with a requests-only script (precomputed is not read by sample.py): image chunk 6144-6656_7168-7680_592-608
    (2.6 MB) uint8 0-255 mean 96 (its label chunk is empty); image chunk 7680-8192_8192-8704_64-80 (3.6 MB) uint8
    0-255 mean 142, p1 39 p99 218; its label chunk (52 KB) has 10 ids (0..34), 91% labelled. Ranges from these chunks
    only. encoding instance-ids from the page (tracing of all neurons, per-cell objects) and the sample (small integer
    ids, one per object); class names per id not published. normalization unknown: no docs on contrast processing.'
