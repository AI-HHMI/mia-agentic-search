notes: 'Image layer 13101 x 14378 x 1199 voxels uint8; annotation layer same grid, uint64. Page: volumes for three
  worms, tracing of all neurons and selected cell types plus I2 synapses; only worm #1 (ritaN2) is hosted on S3.
  License ODC-By v1.0 as stated on the landing page. enricher: size 42.2 GB from complete S3 listing (was null).
  enricher: voxel 2x2x50 nm confirmed by info files and BossDB provenance (voxel_unit nanometers). enricher: annotations_verified
  true (label chunks sampled). enricher: coverage partial: labels in all 75 z-slabs but in 2,777 of 56,550 chunks
  (pharynx region only; selected cell types). enricher: no separate synapse layer on S3; synapses may be ids inside
  the annotation layer (unconfirmed, paper supplement not readable).'
