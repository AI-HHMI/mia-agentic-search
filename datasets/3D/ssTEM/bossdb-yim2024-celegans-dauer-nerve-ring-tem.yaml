title: High-resolution transmission electron microscopy dataset of C. elegans dauer nerve ring (BossDB,
  with neuron, mitochondria and synapse segmentation)
short_name: C. elegans dauer nerve ring segmentation (ssTEM)
description: Serial-section TEM volume (364 sections at 50 nm) of the nerve ring of a C. elegans dauer
  larva with VAST-traced neuron segmentation, predicted mitochondria segmentation and proofread presynaptic
  active-zone (synapse) segmentation channels on BossDB, from the dauer comparative connectomics study.
  The paper also released ground-truth active zone labels used to train the synapse detector.
