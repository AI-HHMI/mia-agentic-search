notes: 'The BossDB project page is yim_choe_bae2023 (DOI 10.60533/boss-2023-rtph) while the API collection
  holding the data is named yim_choe_bae2024, experiment dauer1_364. Voxel size 1 x 1 x 50 nm from its
  BossDB coordinate frame (9800 x 9792 x 364 voxels); the paper says 50 nm sections. Licence CC-BY-4.0
  from DataCite (the article is also CC BY 4.0). Neurons were manually traced in VAST; mitochondria segmentation
  and the synapse segmentation (CNN-predicted, then proofread) are channels whose exact provenance beyond
  the paper is not described on BossDB. Paper links BossDB and GitHub (jabae/Yim-Choe-Bae-et_al-2024).
  Project page is JavaScript-rendered. enricher: labels on three grids (neurons 1x1x50, active zones 2x2x50,
  mitochondria 8x8x50 nm), all offset 0. The paper states 50 nm sections but no pixel size (its synapse
  network works at 2x2 nm).'
