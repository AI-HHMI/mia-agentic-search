notes: 'Four tar.gz archives (sparse 439 MB, cremi_realigned 1.5 GB, focused 331 MB, glia 5.2 GB) (contents
  listed by the enricher). The CREMI volumes are re-aligned versions of the CREMI challenge data (see
  the existing CREMI record on main); the focused, sparse and glia sets are additional. ssTEM is the best-fit
  modality for the FAFB serial-section EM source but is not stated on the Zenodo page. Voxel size not
  stated on the Zenodo page or in the FlyWire paper''s Methods text read (only a 64x64x40 nm transform
  grid is mentioned). download_url left null because the record has four separate archives. enricher:
  focused and sparse .h5 volumes carry resolution [40, 8, 8] nm (z, y, x) on every dataset; cremi_realigned
  and glia could not be read (2.1 GB and 5.2 GB members), so voxel_size_nm stays null (subsets may differ).
  Annotations verified (segmentation datasets seen).'
