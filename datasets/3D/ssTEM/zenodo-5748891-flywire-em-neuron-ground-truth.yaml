  notes: 'Zenodo listing: 4 tar.gz, exact sizes. Archives streamed in memory (tarfile); each .h5 member
    written to a temp file, headers read with h5py, then deleted (nothing run). focused.tar.gz read in
    full (331,282,554 B; at least 7 volumes, member list in the PR comment truncated), first 90 MB of
    sparse.tar.gz (5 volumes), first 75 MB of cremi_realigned.tar.gz (only the 2.1 GB cremi_b_realigned.h5
    header entry, unreadable). glia.tar.gz not opened. All datasets uncompressed, contiguous. Image ranges
    from 64^3 corner crops only (0..253 over volumes); segmentation/mask/mitochondria corners were all
    0, so their value ranges are unknown; segmentation encoding instance-ids from the docs (neuron reconstruction
    ground truth). Axes null: the files give only resolution [40, 8, 8], not axis names (CREMI convention
    would be zyx). Sample budget used (~496 MB).'
