title: Segmented anisotropic ssTEM dataset of neural tissue (Drosophila third-instar larva ventral nerve
  cord)
short_name: Drosophila larval VNC neural tissue (ssTEM)
description: Two ssTEM image stacks (20 sections each, about 4.7 x 4.7 x 1 um) of the ventral nerve cord
  of a Drosophila melanogaster third-instar larva. Stack 1 has dense labels for oriented neuron membranes,
  membrane junctions, mitochondria, synapses and glia/extracellular space and serves as training data;
  stack 2 provides raw test images whose ground truth is withheld by the maintainers.
