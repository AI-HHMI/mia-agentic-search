notes: 'Data are hosted on GitHub; the figshare record (10.6084/m9.figshare.856713) only holds a preview
  image. Licence conflict: GitHub README says CC BY-NC-SA 3.0, figshare metadata says CC BY 4.0; the stricter
  terms of the data host are recorded. Not the ISBI 2012 data (first-instar, 4 nm): this is third-instar,
  4.6 nm/pixel. Each stack is 20 single-section files (1024x1024), slice index = file name. Stack 2 has
  no ground truth. Annotator and procedure not stated and no paper listed, so source is unknown. enricher:
  voxel z set to null (was 47.5, a midpoint): README and figshare state only "section thickness of 45-50
  nm". enricher: size 44.1 MB from a listing of all 121 files.'
