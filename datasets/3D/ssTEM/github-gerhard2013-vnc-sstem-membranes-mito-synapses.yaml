notes: 'Data are hosted on GitHub; the figshare record (10.6084/m9.figshare.856713) only holds a preview image. Licence conflict: GitHub README says CC BY-NC-SA 3.0, figshare metadata says CC BY 4.0; the stricter terms of the data host are recorded. Not the ISBI 2012 data (first-instar, 4 nm): this is third-instar, 4.6 nm/pixel, 45-50 nm sections (z = midpoint). Listings checked: stack1/raw (20 tif), stack1/labels (20 png), stack2/raw (20 tif); other label folders not listed. Stack 2 has no ground truth. Annotator and procedure not stated and no paper listed, so source is unknown. Size and image dimensions not stated; no direct archive URL.'
