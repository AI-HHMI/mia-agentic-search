notes: 'Synthetic data. OSF listing: images/ 200 TIFF (12.6 GB) named synthetic_DR2_t###_ch01_*.tif and masks/ 199
  TIFF (0.9 GB) named DR2_t###_ch01_*_TwangSegmentation_Out1.tif, so one image has no mask. Voxel size is the
  real DDR source data resolution (1.37 um isotropic, multi-photon) per the paper; whether the synthetic stacks
  keep that grid is not stated. Masks derive from an automatic segmentation (Twang), not manual annotation.
  The OSF node shows no license (paper itself is CC BY 4.0), so the dataset license is unknown. Sibling OSF
  records from the same paper (5EFM9 membranes, E6N7B meristem membranes) are not covered here.
  Checked: OSF node and file listing, paper full text.'
