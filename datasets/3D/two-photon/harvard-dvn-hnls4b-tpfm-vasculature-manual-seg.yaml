description: Two-photon fluorescence microscopy stacks of mouse brain vasculature labelled with gel-BSA-FITC
  (500 planes) or lectin-FITC (287 planes), 0.59 x 0.59 x 2 um voxels, each with a manually segmented
  stack of the same tissue (500 and 128 planes), from a study comparing the two stains for automatic vessel
  segmentation; each stack is a series of single-plane TIFFs in its own Dataverse deposit.
