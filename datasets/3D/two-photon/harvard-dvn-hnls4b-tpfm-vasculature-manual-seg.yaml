notes: 'Four Dataverse deposits (all CC0, released 2018-06-20) read through the API file listings; size_bytes is their summed file sizes. Plane counts differ between the lectin raw stack (287) and its manual segmentation (128), so the lectin labels cover only part of the stack; the gel-BSA stack and segmentation both have 500 planes. Voxel size 0.59 x 0.59 x 2 um is from the raw deposits descriptions. Bit depth and plane dimensions were not read, and the paper (full text read via Europe PMC) describes a TPFM comparison of the two stains and automatic segmentation scored against manual segmentation, with no data link. Sibling deposits of the same author hold Markov random field automatic segmentations (DVN/TSQFWC, DVN/NLV2EQ), which are not ground truth. Download URL left empty because no direct file link was tested.'
