notes: 'Zip listing (peek_archive): 100 TIFFs (1.3 GB uncompressed) and 100 PNGs, with a "Test data" folder; record
  states 80 training / 20 test images. Pixel size 0.147 um from the record (z step not stated, z FWHM 2.5 um
  given as PSF; paper describes the images as stacks, with the algorithm applied to mean intensity projections).
  Paper compares the algorithm to manual labelling by 3 expert neurobiologists; whether the released
  boxes come from all three or a consensus was not found in the sections read, so source manual.'
