notes: 'Synthetic data. OSF listing: images/ 199 TIFF (12.5 GB) named synthetic_DR2_t###_ch00_*.tif and masks/ 198
  TIFF (12.5 GB) named instances_DR2_t###_ch00_*.tif, so one image has no mask. Voxel size is the real DDR
  source data resolution (1.37 um isotropic, multi-photon) per the paper; whether the synthetic stacks keep
  that grid is not stated. Masks derive from automatic segmentation, not manual annotation. The OSF node
  shows no license (paper itself is CC BY 4.0), so the dataset license is unknown. Sibling of the OSF
  nuclei set 9RG2D from the same paper (this one is the membrane channel, ch00).
  Checked: OSF node and file listing, paper full text.'
