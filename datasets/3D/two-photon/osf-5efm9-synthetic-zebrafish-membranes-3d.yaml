notes: 'Synthetic data. OSF listing: images/ 199 TIFF (12.5 GB) named synthetic_DR2_t###_ch00_*.tif and
  masks/ 198 TIFF (12.5 GB) named instances_DR2_t###_ch00_*.tif, so one image has no mask. Voxel size
  is the real DDR source data resolution (1.37 um isotropic, multi-photon) per the paper; whether the
  synthetic stacks keep that grid is not stated. Masks derive from automatic segmentation, not manual
  annotation. Sibling of the OSF nuclei set 9RG2D from the same paper (this one is the membrane channel,
  ch00). Checked: OSF node and file listing, paper full text. enricher: license Apache-2.0 from the OSF
  node license (API https://api.osf.io/v2/licenses/563c1cf88c5e4a3877f9e96d/; was unknown). Stacks are
  512x512x120 (paper: DDR stacks 512 x 512 x z voxel), so TIFF pages are z.'
