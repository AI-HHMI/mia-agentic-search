notes: "Benchmark: two-photon stack from rat hippocampal CA1 (organotypic slice culture), 94 x 94 x 500 nm voxels (record and paper), annotated by three experts pixel-wise as *.mask (HDF5) and dendrites traced as SWC, plus spine centre-of-mass points from seven raters. Training and validation data are d3set files (HDF5) built from 3D stacks of various resolutions, sources, wavelengths and modalities (paper Table 1, not read in detail), so the voxel size given applies to the benchmark only, the number of training stacks is not recorded and the organisms of the training data (the paper mentions rat, mouse and human data) are not listed. The d3set and mask internals were not opened."
