notes: 'Benchmark: two-photon stack of rat hippocampal CA1 (organotypic slice culture), 94 x 94 x 500 nm voxels
  (Zenodo), spines annotated pixel-wise by three experts (*.mask, HDF5), dendrites traced as SWC, spine centre points
  in a CSV. enricher: voxel size 94x94x500 nm -> null, because the subsets differ: benchmark 94 x 94 x 500 nm (Zenodo);
  validation d3set meta Resolution_XY 0.1035 um, Z 0.5 um; training d3set (31 stacks) Resolution_XY 0.0232-0.1245
  um, Z 0.5 or 1 um. enricher: Segmentation_*.mask arrays are 71 x 1444 x 366 vs the TIFF 71 x 366 x 1444 (y and
  x swapped).'
