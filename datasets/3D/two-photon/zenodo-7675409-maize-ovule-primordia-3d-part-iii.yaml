notes: 'Zenodo lists 14 Imaris .ims files (24.9 GB), one per ovule primordium or floret meristem, CC-BY-4.0. Paper Methods
  (Europe PMC full text): 300 nm cubic voxels, multiphoton imaging, semi-automated segmentation in Imaris, manual layer/position
  annotation (11 cell types). Differs from the catalogued Part I (zenodo-7671594): same paper and protocol but different
  ovule files (Part I 18 files, Part II 10.5281/zenodo.7675365, Part III this record). The segmentation objects inside the
  .ims were not opened, so annotations_verified is false and format is "other" (Imaris .ims, an HDF5-based container; no
  HDF5 file inspected here). No train/test split.'
