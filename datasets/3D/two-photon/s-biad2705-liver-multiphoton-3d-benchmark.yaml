title: A multi-structure 3D multiphoton liver microscopy dataset integrating real, physics-based, and GAN-simulated volumes
  for benchmarking bioimage analysis
short_name: Mouse liver 3D structures (multiphoton)
description: Four real multiphoton (Zeiss LSM 780) 3D liver volumes with manually curated masks of cell borders, bile canaliculi,
  sinusoids and nuclei, plus idealized tissue models, conventional and CycleGAN-simulated volumes, PSFs, trained models and
  restoration/segmentation test outputs (about 500 GB).
