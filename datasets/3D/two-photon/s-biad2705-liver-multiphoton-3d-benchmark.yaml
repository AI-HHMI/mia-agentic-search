notes: 'Real data: 4 mice (G1, G2, Ch2, Ch3) with 8 raw .lsm stacks (m1, m2 each), 4 preprocessed five-channel
  TIFF stacks and 4 segmented-mask stacks; the rest is simulated or derived (conventional and CycleGAN
  simulations, idealized masks, RL/SelfNet restoration outputs, models; 21,793 files in SelfNet_train).
  Paper abstract: 44 volumes, ~500 GB total. Voxel size 0.3 um is the stated acquisition voxel size of
  the microscopy (isotropy of simulated volumes not checked). Raw stacks are .lsm (not a schema format),
  so formats lists tiff only. Only the preprint abstract was available (Europe PMC, full text not open);
  preprint DOI from the Europe PMC record. Train/test splits not defined. enricher: size_bytes = sum of
  Dataset_table_20260814.json (23,149 files; was null).'
