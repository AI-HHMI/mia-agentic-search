notes: 'Zenodo lists 16 Imaris .ims files (one per ovule primordium or floret meristem), CC-BY-4.0. Paper Methods
  (Europe PMC full text): 300 nm cubic voxels, multiphoton imaging (740 nm excitation), Imaris Cell segmentation,
  manual layer/position labelling; the paper cites this record in its Data Availability Statement. Voxel size and
  channel count are taken from the paper as for the sibling parts (not re-checked in file headers). Differs from
  the catalogued Part I (zenodo-7671594) and Part III (zenodo-7675409): same paper and protocol, different ovule
  files. No train/test split. enricher: annotations verified in 295.ims headers (Imaris Cell objects + uint32 mask
  images); source mixed = cells by automatic Imaris watershed, manually curated (proofread), layer/position labels
  manual (paper Methods). Header extent 151.82 x 151.82 x 78.3 um over 512 x 512 x 261 px (296.5 x 296.5 x 300 nm);
  kept the paper value 300 nm cubic.'
