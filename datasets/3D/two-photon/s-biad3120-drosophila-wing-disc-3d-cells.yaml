notes: 'Files listing: WD1-3.tif and WD1-3_MBS.tif stacks with matching *_labels.tif, plus file_list_*.tsv (annotation type
  segmentation_mask per image). Voxel size is from the WD1.tif ImageJ header (x/y 42.99 nm, z spacing 0.5002 um, 50 slices of
  512 x 512, uint8); other stacks not probed and the paper says z steps were 0.3 or 0.5 um. Labels probed for WD1 (int32, same
  50 x 512 x 512 shape). Paper (bioRxiv preprint, CC BY-NC) says segmentation used Cellpose cyto3 with manual correction in napari,
  hence source mixed. Total size is the sum of the FTP listing sizes (~203 MB, rounded). Study page lists the paper as PNAS 2026;
  only the preprint was read. The record leaves channels at 1 (one GFP membrane channel per file).'
