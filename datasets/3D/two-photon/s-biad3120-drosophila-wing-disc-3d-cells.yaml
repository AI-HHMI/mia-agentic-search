notes: 'Files listing: WD1-3.tif and WD1-3_MBS.tif stacks with matching *_labels.tif, plus file_list_*.tsv
  (annotation type segmentation_mask per image). Labels probed for WD1 (int32, same 50 x 512 x 512 shape).
  Paper (bioRxiv preprint, CC BY-NC) says segmentation used Cellpose cyto3 with manual correction in napari,
  hence source mixed. Total size is the sum of the FTP listing sizes (~203 MB, rounded). Study page lists
  the paper as PNAS 2026; only the preprint was read. The record leaves channels at 1 (one GFP membrane
  channel per file). enricher: z was 500.2 nm from WD1 only; headers of all 6 stacks give z 500.2 (WD1,
  WD3) or 298.5 nm (WD2, WD1-3_MBS), so z is null now (x/y 42.99 nm shared). Size from exact per-file
  sizes (was the rounded 203 MB).'
