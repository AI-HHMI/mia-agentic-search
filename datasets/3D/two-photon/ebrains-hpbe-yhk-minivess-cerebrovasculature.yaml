title: 'MiniVess: rodent cerebrovasculature from in vivo two-photon microscopy with segmentation ground truth'
short_name: MiniVess rodent brain vessels (two-photon)
description: 70 3D two-photon fluorescence microscopy volumes of cortical blood vessels in mice and rats (Texas Red
  dextran angiography through a cranial window), each paired with a binary vessel segmentation volume made by image
  processing, a 2D U-Net and five rounds of manual proofreading. Stored as NIfTI (.nii.gz) with matching '_y' files
  for the labels.
