notes: 'The license comes from the DataCite record of the DOI (CC-BY-NC-SA-4.0; the CC-BY in the Scientific
  Data paper covers the article). File naming (mvNN.nii.gz and mvNN_y.nii.gz) is from the GitHub README
  and the paper; the 70 count is from the paper and DataCite abstract. Voxel size varies per volume: lateral
  0.621-0.994 um/pixel (512 x 512), z step 1-10 um (paper Methods; per-volume values in its Supplementary
  Table 1), so voxel_size_nm is null. Acquired on an Olympus FV1000MPE with a 25x NA 1.05 objective, 12-bit
  data saved as 16-bit NIfTI. Raw files were originally .oib/.oir. Ground truth: thresholding pipeline,
  then U-Net, then 5 rounds of manual correction in 3D Slicer, checked by two further annotators. enricher:
  EBRAINS data-proxy API lists 211 files (984,676,438 B, incl. Licence (CCBY-NC-SA).pdf) and serves them
  without login, so access open is confirmed; size_bytes set from it; confidence 0.6 -> 0.7.'
