notes: 'The EBRAINS landing page is rendered in JavaScript, so its file listing, total size and access terms could not
  be read; the license comes from the DataCite record of the DOI (CC-BY-NC-SA-4.0; the CC-BY in the Scientific Data
  paper covers the article). Whether EBRAINS asks for a free login before download was not verified, so access is
  recorded as open from the public DOI record. File naming (mvNN.nii.gz and mvNN_y.nii.gz) is from the GitHub README
  and the paper; the 70 count is from the paper and DataCite abstract. Voxel size varies per volume: lateral 0.621-0.994
  um/pixel (512 x 512), z step 1-10 um (paper Methods; per-volume values in its Supplementary Table 1), so voxel_size_nm
  is null. Acquired on an Olympus FV1000MPE with a 25x NA 1.05 objective, 12-bit data saved as 16-bit NIfTI. Raw files
  were originally .oib/.oir. Ground truth: thresholding pipeline, then U-Net, then 5 rounds of manual correction in
  3D Slicer, checked by two further annotators.'
