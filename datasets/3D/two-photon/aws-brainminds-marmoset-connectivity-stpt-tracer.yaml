title: 'Brain/MINDS Marmoset Connectivity Resource on AWS: STPT anterograde tracer volumes of 52 marmoset brains'
short_name: Marmoset brain tracer volumes (serial 2-photon)
description: Serial two-photon tomography (STPT) volumes of 52 marmoset brains with AAV anterograde tracer injections in prefrontal cortex,
  resampled to a common template, with deep-network tracer-signal segmentation (tracer-positive voxels, tracer density, signal), detected
  injection-site cell positions, tractography streamlines and Nissl/backlit images. Stored as NIfTI volumes on a public S3 bucket.
