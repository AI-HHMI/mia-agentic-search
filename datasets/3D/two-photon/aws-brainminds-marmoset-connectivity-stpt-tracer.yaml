notes: 'Public S3 bucket s3://brainminds-marmoset-connectivity (ap-northeast-1), release BMCR_v02; download_url null (prefix tree). Listing:
  BMCR_core_data has Processed_tracer_data, Tissuecyte, meta_data (52 animals each) and Backlit_and_Nissl (51). The 3D_stacks are NIfTI at 50 um
  isotropic per the paper; native STPT sections are 1.385 um/px, 50 um section spacing, but full-resolution sections were not found in the bucket
  listing read. Labels come from an automated U-Net trained on ~600 manually screened sections (tracer segmentation) and manual cell annotations (injection site
  cells); the pipeline is automatic, so labels are not manual ground truth. Retrograde data cover 19 of the animals. Total size not determined.'
