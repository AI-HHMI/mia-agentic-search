notes: 'Checked the GitHub repository page and README (folders denoised/, experiments/, labels/) and the arXiv paper via
  ar5iv. The repository page shows an MIT licence; the README text does not state one and no LICENSE file was opened,
  so the MIT is as displayed on the page. The file listing could not be read (GitHub API unavailable), so file counts,
  names and sizes were not checked: annotations_verified is false, size_bytes is null and n_items is the 12 stacks
  from the paper and README. The paper gives xy voxel size 0.621-2.485 um depending on acquisition, with 5 um z
  spacing; 0.621 um is the smallest value, not a single dataset-wide value. Stacks are 512x512 with 10-27 slices.
  download_method is other (GitHub repository; the transfer mechanism was not checked). The paper
  describes 16-bit OME-TIFF conversion but the README describes 8-bit multi-layer TIFF for the denoised stacks. The
  repo ships experiment outputs (experiments/) which are model predictions, not labels.'
