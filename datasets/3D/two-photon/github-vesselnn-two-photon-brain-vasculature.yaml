notes: 'Checked the GitHub repository page and README (folders denoised/, experiments/, labels/) and the
  arXiv paper via ar5iv. n_items is the 12 stacks from the paper and README. The paper gives xy voxel
  size 0.621-2.485 um depending on acquisition, with 5 um z spacing; 0.621 um is the smallest value, not
  a single dataset-wide value. Stacks are 512x512 with 10-27 slices. download_method is other (GitHub
  repository; the transfer mechanism was not checked). The paper describes 16-bit OME-TIFF conversion
  but the README describes 8-bit multi-layer TIFF for the denoised stacks. The repo ships experiment outputs
  (experiments/) which are model predictions, not labels. enricher: LICENSE file read (MIT); size from
  a complete file listing (was null); label stacks sampled, annotations_verified true (was false).'
