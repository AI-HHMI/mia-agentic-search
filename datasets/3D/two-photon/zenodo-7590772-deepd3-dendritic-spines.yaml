id: zenodo-7590772-deepd3-dendritic-spines
title: DeepD3 Datasets
short_name: DeepD3 dendritic spines and dendrites (2-photon)
description: Training, validation and benchmark data for the DeepD3 dendritic spine and dendrite segmentation framework.
  The training and validation sets are 3D fluorescence stacks (mostly two-photon, plus confocal) of neurons with pixel-precise
  dendritic spine masks and 3D dendrite tracings. The benchmark is a two-photon stack of rat hippocampal CA1 dendrites annotated by
  three experts (spine masks, dendrite SWC tracings) and by seven experts for spine positions.
