notes: 'Public S3 bucket s3://janelia-mouselight-imagery (us-east-1, no account needed); download_url
  null because it is a prefix tree. Listing 2026-10-23: images/ 66 brain-date prefixes (excluding nws_test,
  zarrtest); tracings/tracing_complete/ 51 brains, one folder per neuron; segmentation/ 29; registration/
  45. Paper: >1,000 neurons, two annotators each, consensus after random-forest segmentation and proofreading.
  Voxel size 0.3x0.3x1 um is the acquisition value (stored resampled to 0.25x0.25x1); images are a KTX/TIFF
  octree for HortaCloud (default.*.tif is a low-res overview), so raw-image format, per-brain size and
  total size were not verified. Only some brains have tracings. CC BY 4.0 is from the AWS registry; the
  Janelia project page states no license. enricher: channels 2 (default.0/1.tif, one channel each per
  README); full-res imagery is a KTX octree (no listed format).'
