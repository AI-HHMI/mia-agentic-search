schema_version: '1.2'
id: idr0075-honeybee-mushroom-body-boutons
title: Two-photon synapsin-labelled honey bee mushroom body with microglomeruli point ROIs
short_name: Honeybee mushroom body boutons (two-photon)
description: Two-photon image stacks of whole-mounted, cleared honey bee (Apis mellifera) brains immunolabelled
  for synapsin (SYNORF1, Alexa 488). For each of 10 bees there is a low-resolution overview stack of the mushroom
  body calyx and a high-resolution stack of a lip subregion in which synaptic boutons (microglomeruli) were located
  by an automated multi-threshold segmentation protocol; the lip-subregion images carry point ROIs marking microglomerulus
  centres.
