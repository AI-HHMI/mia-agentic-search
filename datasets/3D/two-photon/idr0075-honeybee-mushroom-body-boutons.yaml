notes: 'Labels are algorithm-derived (multi-threshold segmentation in AMIRA, centres merged if closer
  than 0.8 um), not manual, and only centre points are provided, so they are a noisy detection signal.
  10 bees x 2 images (overview 1.031x1.031x5 um; lip subregion 0.3438x0.3438x0.5 um; voxel size listed
  is the lip subregion). Original file format not stated on the IDR record, annotation file or paper,
  so formats is other; total size not reported. Point ROIs were checked on one image (Bee_01 lip subregion)
  only. Sources checked - IDR project/annotation records, study file, annotation CSV, paper Methods and
  Data availability (Europe PMC). enricher: size_bytes ~1.01 GB estimated as uncompressed uint16 pixel
  data (20 images, 512x512, 1932 planes in total) from the IDR API (was null).'
