notes: 'Files (Dryad API): Raw_Images.zip 8.10 GB, Monoculture_Annotations.zip 4.7
  MB, Triculture_Annoations.zip 5.0 MB, Data_records.zip, HelperFunctions.zip, README.md.
  License CC0-1.0 from the Dryad API record (the landing page text does not name it).
  Zip contents could not be listed: Dryad file downloads need a bearer token (API
  401) and the file_stream URL returns 403 for range requests, so annotation file
  formats, counts and image sizes come from the Dryad description and the paper (cells
  annotated manually in Napari on integrated intensity images; neurons by shape, microglia
  and astrocytes by feature criteria; only annotated regions were analysed). n_items,
  voxel size and train/val/test splits are not stated on the page, API record or paper.
  Paper full text read via Europe PMC. Browser download from the Dryad page works
  for the public files; no direct unauthenticated link, so download_url is null.'
