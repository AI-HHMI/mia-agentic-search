notes: 'Zenodo lists 18 Imaris .ims files (48.3 GB), one per ovule primordium or floret meristem, described as segmented and
  annotated as in the paper. Paper Methods: watershed on the cell-wall signal in Imaris, manual curation and layer/position
  labels. The segmentation objects inside the .ims were not opened (no HDF5 reader here), so annotations_verified is false;
  enricher: formats hdf5 (was other), h5py found the HDF5 superblock of 185.ims (stored eof = file size). Voxel size is the
  paper''s 0.3 um cubic voxels. The full collection (48 ovules, 7,369 cells) is split over three Zenodo records: this Part
  I, Part II 10.5281/zenodo.7675365 and Part III 10.5281/zenodo.7675409; only Part I is described. No train/test split. enricher:
  annotations.source proofread (was mixed): paper Methods, automatic watershed in Imaris then manual curation; of 38 annotated
  images 25 fully curated, 13 only for the central L2 cell and contact-1 neighbours.'
