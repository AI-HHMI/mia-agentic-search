notes: 'Zenodo lists 18 Imaris .ims files (about 48.3 GB; the 3.0 TB on the page looks like a usage statistic), one per
  ovule primordium or floret meristem, described as segmented and annotated as in the paper. Paper Methods: watershed
  on the cell-wall signal in Imaris, manual curation and layer/position labels. The segmentation objects inside
  the .ims were not opened (no HDF5 reader here), so annotations_verified is false; .ims is probably HDF5-based
  but unchecked, hence formats other. Voxel size is the paper''s 0.3 um cubic voxels. The full collection (48 ovules,
  7,369 cells) is split over three Zenodo records: this Part I, Part II 10.5281/zenodo.7675365 and Part III
  10.5281/zenodo.7675409; only Part I is described. No train/test split.'
