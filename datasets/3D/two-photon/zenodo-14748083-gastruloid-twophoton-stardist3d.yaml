notes: 'zenodo_tapenade_data.zip (9.41 GB; 789 files: 549 TIFF, 216 NPY) holds figure-reproduction folders plus stardist_training_datasets/
  (trainval_dataset/train and val with 68 and 61 image/mask pairs, annotator1 with 3 image/label pairs, annotator2 with
  one annotated block). A second file stardist_tapenade_model.zip (12.6 MB) has the trained weights; size_bytes counts both
  files. The paper (Table 3) lists three nuclei training sets (dense 3D 1,018 nuclei at Y/X 0.25 um, Z 1 um; two 3D+t
  sets at 0.62 um with 100 and 3,296 nuclei); voxel size given is the dense set only and varies across the record. All
  training data are two-photon. Masks are manual annotations in 3D, partial crops of samples. Channel count is four for
  the main immunostained images. Not all folders are labelled data: most are analysis outputs.'
