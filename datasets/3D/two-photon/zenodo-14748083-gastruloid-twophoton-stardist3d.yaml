title: Analysis Data and Stardist3D Trained Weights for Whole-mount Gastruloid Deep Imaging and Multiscale Analysis
short_name: Gastruloid nuclei 3D two-photon (StarDist3D)
description: Dual-view, multi-colour two-photon (and some confocal) stacks of whole-mount immunostained mouse gastruloids
  (Hoechst, T-Bra, Oct4, FoxA2, Sox2, E-cad), with 3D nuclei instance annotations used to train a custom StarDist3D model,
  plus the data behind the paper's figures (registered dual-view fusions, segmentations, masks, wavelength/depth
  calibration stacks). The training set holds image/mask crops in train and val folders and two annotators' blocks.
