notes: 'zenodo_tapenade_data.zip (9.41 GB, 797 members) holds figure-reproduction folders plus stardist_training_datasets/
  (trainval_dataset train 68 and val 61 image/mask pairs of 64^3 crops, annotator1 3 image/label pairs, annotator2 blocks);
  stardist_tapenade_model.zip has the weights. Voxel sizes differ by subset (paper): trainval crops resampled to 0.62
  um isotropic (Methods); dense fixed set Y/X 0.25, Z 1 um and two 3D+t sets Y/X 0.62, Z 1 um (Table 3); figure folders
  e.g. [1, 0.6, 0.6] um (3c readme). enricher: voxel size set to null (was the dense set''s 250x250x1000 nm). All two-photon;
  masks are manual 3D annotations of crops. Most other folders are analysis outputs, not labelled data.'
