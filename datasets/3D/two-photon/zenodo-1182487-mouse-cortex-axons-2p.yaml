notes: 'Zip (126 MB) lists 20 Images- TIFF stacks, 20 Labels- binary TIFFs, 20 SWC tracings and 20 MAX
  JPEGs. Voxel size (0.147 um xy, 1 um z) from the Zenodo description and paper Methods. Authors not in
  the fetched record text. Tasks other = centerline tracing. Zenodo landing page was read via its API
  record. enricher: the binary masks are 2D (512x512, one per stack) and the sampled SWC has z = 0, so
  labels are 2D annotations of 3D stacks (24 x 512 x 512 uint16 in 01.tif), not 3D masks; OME-XML in the
  stack confirms 0.147027 x 0.147027 x 1 um.'
