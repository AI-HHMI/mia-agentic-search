description: In vivo two-photon volumes of H2B-eGFP-labelled cell nuclei in the mouse neocortex with manually traced
  3D nucleus segmentations (StarDist training ground truth), plus raw and segmented volumes with cell-type labels
  (neurons, excitatory/inhibitory neurons, astroglia, microglia, oligodendroglia, endothelial cells) for nucleus
  classification.
