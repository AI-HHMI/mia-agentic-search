notes: 'Six files (145 GB in total): StardistTraining.tar.gz (144 MB; read its tar headers: 15 raw TIFF volumes in RawData/ and 15 manually segmented TIFF volumes in SegmentedGroundtruth/, named 1-15.tif), StardistModel.tar.gz (trained model), CelltypeClassification.tar.gz (80 GB) and CelltypeClassificationExcInhNeurons.tar.gz (32 GB) with raw and segmented data, RawdataResults.tar.gz (34 GB) and ClassificationTrainingDataSet.tab. Only the StardistTraining archive was opened; contents of the other archives are described by the dataset page only. Voxel size from paper Methods (0.29 um lateral, 2 um axial, TriM Scope II, 16x NA 0.8). Number of manually traced nuclei and the train/validation split of the StarDist ground truth were not located in the main text (shown in S1I Fig). download_url points to the StarDist training archive only.'
