    alignment_notes: 'Pairs by file name: RawData/N.tif <-> SegmentedGroundtruth/N.tif (N = 1-15); sampled pair
      14 has identical shape. 0 = background, 183 distinct nucleus IDs in crop 14 (glasbey LUT in the ImageJ metadata).'
  notes: 'Size: Dataverse API filesize of all six files (sum 145,214,666,937 B); listing.py did not finish on the
    large Heidata files, so the sizes are the repository API values. Sample: streamed StardistTraining.tar.gz (88.5
    MB read, logged) to RawData/14.tif and SegmentedGroundtruth/14.tif, read with tifffile: both uint16 zyx [25,352,395],
    uncompressed, no XY calibration in the TIFF tags. value_range from that one pair. normalization none is inferred
    (integer PMT counts, no clipping). Only the StarDist training archive was inspected; the classification archives
    (145 GB together) were not opened. No sample.urls: the data are only offered as tar.gz archives, and TensorSwitch
    can pull members only from zip archives; a sample needs the whole 144 MB StardistTraining.tar.gz. Host heidata.uni-heidelberg.de
    is not on the TensorSwitch fetch allowlist (range requests work).'
