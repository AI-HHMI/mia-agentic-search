notes: 'Six files (145 GB in total): StardistTraining.tar.gz (144 MB; read its tar headers: 15 raw TIFF volumes
  in RawData/ and 15 manually segmented TIFF volumes in SegmentedGroundtruth/, named 1-15.tif), StardistModel.tar.gz
  (trained model), CelltypeClassification.tar.gz (80 GB) and CelltypeClassificationExcInhNeurons.tar.gz (32 GB)
  with raw and segmented data, RawdataResults.tar.gz (34 GB) and ClassificationTrainingDataSet.tab. Voxel size from
  paper Methods (0.29 um/pixel lateral, 2 um z step). enricher: annotations.source manual -> mixed: StarDist GT
  manually traced in Fiji (15 crops, ~150-200 nuclei each); classification archives hold automatic StarDist segmentations
  with manually selected cell-type ground truth (paper Methods). enricher: download_url -> landing page (six separate
  files, no single archive; StarDist training archive is datafile/12026).'
technical:
