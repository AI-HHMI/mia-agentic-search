  notes: 'MetaImage (.mha, zlib-compressed) is not readable by probe.py/sample.py, so headers (4 KB range reads)
    and samples were read with a short requests+numpy script. Sizes from the EBI HTTP index (rounded), so size is
    estimated. Shapes per structure (DimSize): c-Fos 200^3, cell nuclei 200^3, AD plaques 300^3. ElementSpacing
    1 1 1 (uncalibrated), so voxel size stays null. Value range from one c-Fos sample (header of a nuclei raw patch
    reports max 65535, i.e. saturated). Nuclei and c-Fos masks are binary {0,1}, not instance IDs. Second pass 2026-10-06:
    listing and sample pair repeated with a scratch MetaImage reader; MHA headers say ElementSpacing 1 1 1 (uncalibrated),
    so voxel size stays null (per-structure values in record notes). Size from the BioStudies file lists (76 files,
    exact sizes) instead of the rounded HTTP index.'
