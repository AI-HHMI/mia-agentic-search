notes: 'Item count 38 = 9 nuclei + 9 c-Fos + 20 plaque raw patches (from the isolated_raw_*.tsv file lists), each
  with a matching gt mask. Format is .mha (MetaImage), not in the schema enum. Voxel size differs per structure
  (nuclei 0.54 um xy / 5 um z; c-Fos 1.625 um xy / 6 um z; plaque 1.63 um xy / 4 um z) so left null. No paper is
  linked on the BioStudies record. Sibling of S-BIAD2106 (contiguous structures). enricher: size 922,281,063 B =
  sum of the BioStudies JSON file lists (76 data files); annotations verified from listing + sample (38 raw / 38
  gt .mha). organisms: Homo sapiens = cell_nuclei_* files; Mus musculus = cfos_neuron_* and AD_plaques_* files (BioStudies
  biosamples + file lists).'
