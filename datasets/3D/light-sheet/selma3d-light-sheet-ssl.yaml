notes: 'Data download requires a free Grand Challenge account and joining the challenge; file listing not inspected,
  so counts (35 volumes + 315 patches) and formats (TIFF unannotated, NIfTI annotated) come from the paper (arXiv v2).
  Voxel size varies by structure (paper: vessels 1.625x1.625x3 um, c-Fos 1.625x1.625x6 um, nuclei 0.54x0.54x5 um, Abeta
  1.63x1.63x4 um) so is left null. License CC BY-NC-ND 4.0 is stated in the paper header, not seen on the challenge page.
  Annotations manual by 4 experts with senior review. DOI of the paper not found via Europe PMC/Crossref. enricher: challenge
  Dataset page states ''CC-BY-NC'' (no version) vs CC BY-NC-ND 4.0 in the paper; spdx kept. Training sets are hosted
  openly on BioStudies S-BIAD1196/S-BIAD1197 (separate PRs); validation set via a Google Drive link.'
