description: 'Light-sheet microscopy volumes of cleared mouse and human brain tissue: 35 large unannotated 3D images
  (>1000^3 voxels) for self-supervised pretraining, plus 315 manually annotated small patches (fine-tuning, preliminary
  and final test) for vessels, c-Fos+ cells, nuclei, amyloid-beta plaques and microglia. Released for the SELMA3D challenge
  at MICCAI 2024.'
