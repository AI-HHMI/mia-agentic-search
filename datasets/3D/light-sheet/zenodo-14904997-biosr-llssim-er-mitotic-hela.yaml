description: 'Paired lattice light-sheet SIM (LLS-SIM) volumes of endoplasmic reticulum in metaphase mitotic
  cells: for each of 22 cells, five raw stacks acquired at increasing fluorescence/SNR levels plus a ground-truth
  LLS-SIM volume reconstructed from the highest-SNR raw data, for training denoising and super-resolution
  networks. One of the ten BioSR for LLS-SIM specimen datasets.'
