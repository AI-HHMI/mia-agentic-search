notes: 'Single zip, 10106.9 MB compressed, 132 .mrc files (peek_archive): 22 Cell_NNN folders with Raw_LLS_SIM_SNR1-5.mrc
  (118.8 MB each) and GT_LLS_SIM.mrc (178.1 MB). Sibling of the other BioSR for LLS-SIM specimen datasets
  (parent record zenodo.org/records/14322457); differs from them in specimen only. Voxel size is not stated
  on the Zenodo pages; the Nature Methods paper is not open access (only the abstract was read through
  Europe PMC) and probe.py could not read the MRC headers, so voxel size is null. Organism Homo sapiens
  follows from the HeLa cell line named in the parent description (ER in mitotic HeLa cells during metaphase).
  enricher: technical block from listing + MRC headers; 22 pairs and raw 256x512x151x3 confirmed by the
  Research Square supplement table.'
