notes: 'Segmentation and skeleton masks are automatic outputs of the VesselExpress pipeline (thresholding + Frangi filter),
  not manual annotations, so they are weak labels. Zip: 473 members = 152 raw volumes (Raw/*.tif|.tiff), 151 of them with
  Binary_/Graph_ outputs of the same name and 19 config JSONs, per experiment folder (Figure2C_E/VE<A-G>_<ROI size>, Figure3/<brain
  region>, Figure4/<organ>); ~124 GB uncompressed. Organs per Figure4 folder: bladder, brain, ear, heart, liver, muscle, spinal
  cord, tongue (all Mus musculus). No train/val/test split. enricher: voxel size 1015.625 x 1015.625 x 2000 nm (z,y,x ''2.0,1.015625,1.015625''
  in every readable config JSON; paper: pixel_dimensions ''voxel size in um'', z step 2 um), was null; n_items 454 -> 152
  raw volumes; channels 1.'
technical:
