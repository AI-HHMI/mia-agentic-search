      \  Figure4/{Bladder,Brain,Ear,Heart,Liver,Muscle,Spinalcord,Tongue}/Raw/   .tif|.tiff + <organ>_config.json\n  Figure4/{...}/Binary/,\
      \ Graph/\n  473 members: 115 .tif + 339 .tiff (raw, Binary_, Graph_) + 19 .json"
