notes: 'Segmentation and skeleton masks are automatic outputs of the VesselExpress
  pipeline (Allen Cell Segmenter-style thresholding + Frangi filter), not manual annotations,
  so they are weak labels. Zip listing (tools/peek_archive.py): 473 files, 339 .tiff
  (Binary_/Graph_ outputs) and 115 .tif (raw) plus 19 JSON configs, organised per
  ROI size (e.g. Figure2C_E/VEA_0.25mm^3/{Raw,Binary,Graph}); total ~124 GB uncompressed.
  Voxel size differs per volume and is stored in the brain_config.json files (one
  inspected: z 2.0 um, x/y 1.015625 um); not set here because it was not checked for
  every volume. No train/val/test split.'
