      \ Figure2C_E/VE<A-G>_<..>mm^3/Binary/          (x7 dirs)   4 .tiff each (Binary_<raw name>.tiff)\n  Figure2C_E/VE<A-G>_<..>mm^3/Graph/\
      \           (x7 dirs)   4 .tiff each (Graph_<raw name>.tiff)\n  Figure3/{Cortex,Hippocampus,Midbrain,Striatum}/Raw/\
