notes: 'Single zip, archive: 22526.8 MB compressed · 288 files · 41078.8 MB uncompressed (peek_archive;
  all .mrc; per cell folder: Raw_LLS_SIM_SNR1-5.mrc and GT_LLS_SIM.mrc, e.g. 95 MB raw and 143 MB GT stacks
  in the inner mitochondrial membrane set). The parent record zenodo.org/records/14322457 (training dataset.xlsx)
  lists 48 cells, raw size 256x512x151x3 (W x H x Z x phases) before deskew and 1205x768x151 after deskew;
  the file count in this zip version may differ from that table, so n_items is null. This is one of ten
  specimen datasets (granular component, chromosomes, fibrillar center, fibrillarin, lysosome, microtubules,
  ER in Cos-7, F-actin in pollen tubes, inner mitochondrial membrane, ER in mitotic HeLa) that differ
  in specimen and label only. Pixel/voxel size not stated on the Zenodo pages or the xlsx; Nature Methods
  paper is not open access (only the abstract was read through Europe PMC), so voxel size is null. enricher:
  n_items 48 = cell folders in the zip (was null).'
