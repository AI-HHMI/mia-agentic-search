  notes: 'Zenodo listing: 1 zip, exact size, 228 .mrc members in 38 Cell_<NNN> folders (6 files each;
    the parent xlsx lists 32 cells). Probed Cell_017: 5 raw stacks 453x512x512 uint16, GT 151x768x768
    float32, uncompressed MRC (one SNR4 probe hit a TLS error). Sampled SNR1 raw: 40..268, 12-bit-range
    hint (normalization none inferred: unclipped camera counts), and GT: -2218.5..6564.3 float with negatives
    (reconstruction output); one cell only. MRC headers give pixel spacing 0.0926 / 0.0617 / 0.3906 in
    the Angstrom field, likely um values (92.6 nm raw, 61.7 nm GT lateral, 390.6 nm z), not used since
    no doc confirms them. Raw axes left null: the 453 planes interleave z and SIM phases. maintainer 2026-10-06:
    voxel size 92.6x92.6x390.6 nm is the raw acquisition grid, from the MRC header (words 11-13 hold the
    pixel size in um, per the authors'' func_deskew.m; probe.py misreads them as A) and the paper''s 0.39
    um sample-piezo step. The stacks are not deskewed, so z is the scan step in the skewed frame. GT_LLS_SIM.mrc
    targets are 61.73 nm laterally (1.5x upsampled), same z.'
