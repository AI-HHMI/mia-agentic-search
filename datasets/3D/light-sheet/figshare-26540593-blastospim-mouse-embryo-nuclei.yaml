notes: 'The Figshare API lists 500 files (23.2 GB, capped at 500 so the listing may be incomplete): image/mask pairs named like F38_105_image_0001.npy.gz and F38_105_masks_0001.npy.gz, so formats is other (gzipped NumPy arrays), and the total size is not recorded. Counts of 573 + 80 annotated images come from the description and paper. Paper Methods give 0.208 um xy voxel size for the BlastoSPIM images; the z step is only said to equal that of the Platynereis set in Lalit et al. 2022 and is not stated, so z is null. The train/validation/test split is described in the paper and published on blastospim.flatironinstitute.org, which was not fetched, so the exact assignment of files is not verified. The paper also reports ten confocal-imaged embryos with ground truth (461 nuclei) used for generalisation; their presence in this deposit was not checked.'
