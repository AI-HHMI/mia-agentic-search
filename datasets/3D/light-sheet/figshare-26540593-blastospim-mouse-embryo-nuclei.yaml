notes: 'The Figshare API lists 500 files (23.2 GB; the enricher confirmed exactly 500 by paging): image/mask
  pairs named like F38_105_image_0001.npy.gz and F38_105_masks_0001.npy.gz, so formats is other (gzipped
  NumPy arrays). Counts of 573 + 80 annotated images come from the description and paper. Paper Methods
  give 0.208 um xy voxel size for the BlastoSPIM images; z 2.0 um is stated in the BlastoSPIM preprint
  (PMC10055179). The train/validation/test split is described in the paper and published on blastospim.flatironinstitute.org,
  which was not fetched, so the exact assignment of files is not verified. The paper also reports ten
  confocal-imaged embryos with ground truth (461 nuclei) used for generalisation; their presence in this
  deposit was not checked. enricher: voxel z 2000 nm from preprint (was null); size confirmed.'
