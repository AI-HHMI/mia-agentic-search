notes: 'Everything here comes from the Zenodo record description and the PAC-MAP GitHub page; the paper is not open
  access (Europe PMC abstract only) and the bioRxiv preprint (10.1101/2024.07.18.602066) returned HTTP 429, and
  the 18.7 GB dataset_upload.zip could not be listed (peek_archive TLS errors), so voxel size, microscope, stain,
  patch/nucleus counts, and image dimensions are unknown. Annotation source is "mixed": weak seeded-watershed
  centroids for LN18-RED pretraining, manual centroids for SH-SY5Y train and test. Size is the sum of three Zenodo
  files (dataset_upload.zip 18.7 GB, preprocessed_images.zip 13.9 GB, models.zip 0.7 GB of model weights);
  n_items not stated. Formats: patches are .tif per the description; CSV is the annotation format.'
