notes: 'Annotation source is "mixed": weak seeded-watershed centroids for LN18-RED pretraining, manual centroids
  for SH-SY5Y train and test. Paper not open access; bioRxiv preprint returned HTTP 429. enricher: size 33,339,885,884
  B confirmed by Zenodo file listing; models.zip (0.7 GB) holds model weights only. enricher: voxel size 359.4x359.4x1999.9
  nm from the preprocessed TIFF ImageJ header (unit=micron, spacing=1.9999, 2.7824 px/micron) and PAC-MAP configs
  voxelsize [1.9999, 0.3594, 0.3594] (was null); configs set target = current voxel size, so patches are not resampled.
