title: Spheroid LSFM dataset with nuclei centroid annotations
short_name: Spheroid nuclei centroids (light-sheet)
description: Light-sheet fluorescence microscopy image patches of 3D spheroids of two cell lines (LN18-RED and SH-SY5Y)
  with nuclei centroid annotations for model training and evaluation. LN18-RED holds pretraining patches with weak
  centroid annotations (from seeded watershed); SH-SY5Y holds train/validation and test patches with manual centroid
  annotations. Preprocessed whole images and trained model weights are included.
