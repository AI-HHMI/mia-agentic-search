notes: 'Licence (CC-BY 4.0) is stated in the GitHub release notes. Voxel size, modality and sample come
  from the arXiv preprint (2101.10033); the paper reports 95 train / 2 val / 2 test volumes, but the release
  zip holds only 9 image/mask pairs (~104 MB each) under train/, so the released split differs and no
  test folder is present. Zip listed with peek_archive, not extracted. Annotation procedure not described
  in the arXiv text read; publisher full text is not open access. Publication date not checked. Sibling
  datasets in the same release (Mouse-Skull-Nuclei, Mouse-Organoid-Cells, Platynereis-ISH-Nuclei, Arabidopsis,
  C.elegans, Lucchi) are not yet catalogued.

  enricher: n_items 18 -> 9 (9 image volumes + 9 masks); size confirmed by zip listing.'
