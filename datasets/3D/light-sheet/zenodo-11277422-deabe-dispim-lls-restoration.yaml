title: DeAbePlusData - example training and test data for DeAbe and multi-step deep-learning restoration
  (diSPIM and lattice light-sheet)
short_name: DeAbe light-sheet restoration pairs (diSPIM/LLS)
description: Zenodo record with two sets of example data for the DeAbe de-aberration network and its multi-step
  models. Data 1 is fixed PtK2 cells (actin) imaged with a lattice light-sheet microscope, with training,
  test and adaptive-optics benchmark images. Data 2 is C. elegans embryos (membrane marker, strain od58)
  imaged on a dual-view diSPIM, organised as the training data of three steps (DL DeAbe, DL Decon, DL
  Iso) plus test data.
