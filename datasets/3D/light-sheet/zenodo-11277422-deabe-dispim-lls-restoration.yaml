notes: 'Files are .rar archives (sizes 1.2 GB, 19.7 GB, 11.0 GB, 9 MB, 6 MB), which tools/peek_archive.py cannot list; only the first 3 MB of Test_Data.rar and Step3_DL_Iso.rar were read, showing .tif volumes (e.g. Test_Data/input/SPIMA/SPIMA-80.tif) and a CARE model (.h5), so the full contents, item counts and the exact pair layout are not verified. Voxel size is the diSPIM raw size from the README (0.1625 x 0.1625 x 1.0 um); the PtK2 lattice light-sheet data is 108 x 108 x 215 nm. Targets are produced by processing (DeAbe/joint deconvolution/AO benchmark), not manual labels; the paper says the training volumes were derived this way (Methods). Number of volumes and authors not extracted. The README does not state the license text; the license CC-BY-4.0 is from the Zenodo record metadata.'
