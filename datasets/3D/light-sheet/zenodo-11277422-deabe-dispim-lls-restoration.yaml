notes: 'Files are 5 .rar archives (RAR5, members compressed) plus README.txt. The enricher listed them
  by walking the RAR headers with range requests: Test_Data 12 files (SPIMA-80.tif / SPIMB-80.tif inputs,
  .bat and config .json), Step3_DL_Iso 6 (CARE model, blur kernel), FixedCell_PtK2 53 (CropForTraining/img_N.tif
  x50, TestImage/Aberrated.tif, GT.tif, GT_rotated.tif), Step2_DL_Decon 463 (Decon_Training_Data/Raw_DeAbe
  and GT_Decon, 199 + 22 validation pairs, plus RCAN model), Step1_DL_DeAbe more than 3,000 (DeAbe_Training_Data/Aberrated_Crop/SPIMA-*_*.tif;
  walk stopped at 3,000). Voxel size is the diSPIM raw size from the README (0.1625 x 0.1625 x 1.0 um);
  PtK2 lattice light-sheet data are 108 x 108 x 215 nm. Targets come from processing, not manual labels.
  organisms: Caenorhabditis elegans = Step1_DL_DeAbe, Step2_DL_Decon, Step3_DL_Iso, Test_Data; Potorous
  tridactylus = FixedCell_PtK2 (README).'
