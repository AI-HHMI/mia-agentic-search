notes: Details from the OSF project wiki (uzq3w) and the PlantSeg paper (Wolny et al. 2020, eLife); the wiki states each HDF5 file holds 'raw' (uint8) and 'label' (uint16) datasets organised in train/validate/test folders. The OSF file listing of this component returned no files through the API in this run, so file names, counts and sizes could not be confirmed. No dataset license is stated on OSF (node license empty); only the paper is CC BY 4.0, so license is unknown. Download URL not found. n_items is the 27 ground-truth images stated in the paper (it elsewhere describes a 27/2/4 train/val/test split of time points, which sums to 33; the discrepancy is unresolved); the number of files on OSF is unverified. The paper calls the ground truth hand-curated, hence source proofread.
