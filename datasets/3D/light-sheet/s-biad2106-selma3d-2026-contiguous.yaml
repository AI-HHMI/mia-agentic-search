notes: 'Annotated training subset of the 2026 edition of SELMA3D (different data from the 2024 edition S-BIAD1196/S-BIAD1197). Files are MetaImage (.mha) patches, a format not in the schema list, hence other: 16 vessel + 16 nerve + 12 axon raw patches, each with a matching gt mask (counted from the BioStudies file lists). Total size not confirmed. Voxel size differs per structure (vessels 1.625x1.625x3 um; nerves 5.9x5.9x8 um; axons 0.4x0.36x0.26 um), so it is left null. Annotation procedure: manual by 4 experts, verified by an expert and reviewed by organisers. No paper for the 2026 edition was found or read; checked BioStudies record and file lists.'
