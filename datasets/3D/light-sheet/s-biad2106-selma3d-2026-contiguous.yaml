  notes: 'FTP listing timed out, so listing.py fell back to the HTTP index: 102 files, about 1.66 GB from
    rounded sizes (estimated, not confirmed). Read the first 800 B (text MetaImage header) of 2 raw/gt
    pairs with curl range requests. blood_vessel_patchvolume_000: raw MET_USHORT, DimSize 500 500 50,
    header pixel range 266-65442; gt MET_UCHAR, range 0-1. Human_NEFH_GM: raw MET_USHORT 100x250x250,
    range 230-11038; gt MET_UCHAR 0-1, TransformMatrix -1 0 0 0 -1 0 0 0 1 (LPI). CompressedData = True
    (MetaIO; listed as compression other). ElementSpacing is 1 1 1 in all four files, so the headers carry
    no physical calibration; voxel sizes stay per-structure as stated on BioStudies. No pixels were downloaded.
    The value ranges are the headers'' Smallest/LargestImagePixelValue, not measured.'
