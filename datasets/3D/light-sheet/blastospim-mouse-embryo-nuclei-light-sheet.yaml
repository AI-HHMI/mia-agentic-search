notes: 'Hosted on the Flatiron Institute BlastoSPIM site (the project site blastospim.flatironinstitute.org links to this series page; the mirror under users.flatironinstitute.org serves the zips). No license or terms for the data were found on the site or in the paper Data availability/Methods (the paper article itself is CC BY 4.0, which is not stated for the data), so license is unknown. Zip sizes from HTTP headers: BlastoSPIM1 train 32.9 GB, val 2.39 GB, test_lowSNR 3.32 GB, test_modSNR 2.17 GB; BlastoSPIM2 train 16.5 GB (val/test sizes for 2.0 not checked), so size_bytes is left null. peek_archive of BlastoSPIM1_val.zip shows 93 .npy files (images/, masks/, crop/ per series), 11.7 GB uncompressed; the .npy format has no matching schema format value, hence other. Voxel size (0.208 um xy, 2.0 um z) is from the project landing page. Paper also reports 10 additional spinning-disk confocal embryos annotated (461 nuclei) used for generalisation; not confirmed as part of the downloads.'
