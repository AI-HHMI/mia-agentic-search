notes: 'Hosted on the Flatiron Institute BlastoSPIM site (users.flatironinstitute.org serves the 8 zips). No license or terms
  for the data on the site, the code page or the paper (the article is CC BY 4.0; the linked processing-pipeline GitHub repo
  is GPL-3.0, which covers code), so license is unknown. .npy has no schema format value, hence other. Voxel size 0.208 um
  xy, 2.0 um z: landing page and paper Methods. Paper also reports 10 spinning-disk confocal embryos (461 nuclei) for generalisation;
  not found in the downloads. enricher: size_bytes 60,605,540,609 from the complete listing of all 8 zips (was null).'
