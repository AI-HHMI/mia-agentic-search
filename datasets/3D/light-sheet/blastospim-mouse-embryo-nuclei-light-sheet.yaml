      crop/<series>_crop_NNNN.npy holds an int64 scalar (1 for H10_011), meaning not documented'
  notes: 'Listing: listing.py over all 8 zips (60,605,540,609 bytes, exact; 1,882 members). npy headers read by range (no
    unpickling): H10_011 image (71,986,720) uint16, mask same shape uint8; O_111 image (56,2048,2048); Blast_001 image/mask
    (91,2048,2048). Sample H10_011 pair (30.2 MB compressed): image [0,229] p1/p50/p99 109/118/128; mask ids 0-8 (8 nuclei);
    value_range from that one pair. axes left null: .npy stores no axis names and the docs do not give the order; the first
    axis is the shortest (71-91), consistent with z at 2 um. Conversion: .npy is not a format TensorSwitch reads, and users.flatironinstitute.org
    is not on its allowlist (member links pass --download-check otherwise). License: none found (site, code page, paper Data
    availability, pipeline repo).'
