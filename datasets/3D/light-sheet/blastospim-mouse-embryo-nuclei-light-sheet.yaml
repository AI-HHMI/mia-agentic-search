short_name: BlastoSPIM mouse embryo nuclei (light-sheet)
description: 653 manually annotated 3D light-sheet (InVi SPIM) images of H2B-miRFP720-expressing preimplantation mouse embryos
  (BlastoSPIM 1.0 - 573 images from 31 embryos; BlastoSPIM 2.0 - 80 late-blastocyst images from 25 embryos) with full 3D nuclear
  instance labels (18,336 nuclei in total). Provided as train/validation/test (low and moderate SNR) zip archives of .npy
  image and mask arrays.
