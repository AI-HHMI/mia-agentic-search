notes: 'Record has 80 files (82.7 GB): 78 per-lung zips (Lung_*, VAAD_*, ITLI_*, INLA_*, NOAI_*) plus
  two PDFs (overview, naming strategy). Listed Lung_014 (raw AF545 TIFF 1.5 GB + AI results TIFF) and
  VAAD_003 (01 Raw imaging data, 02 AI results airway masks for AF545 and AF740, 03 Processed data). Segmentations
  are nnU-Net predictions (automatic) trained actively with 3 manually annotated full lungs plus corrected
  images (paper Methods); the manual reference annotations are mentioned in the Data availability statement
  but were not found in the two listed zips. Scans: Ultramicroscope II, 2x/0.5 NA objective, 0.63x zoom
  for whole lungs, z step 10-15 um (3-7 um for high-magnification scans); xy voxel size is not stated,
  so voxel_size_nm is null. Not all 78 zips were listed. enricher: voxel x/y 5159 nm from ImageJ calibration
  (0.193836 px/um) in 3 probed raw/label TIFFs (was null); z null: headers say 20 um, paper 10-15 um.'
