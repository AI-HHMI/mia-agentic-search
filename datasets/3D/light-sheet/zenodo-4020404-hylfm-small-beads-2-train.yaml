description: Training data for HyLFM-Net, a light-field volume reconstruction network, from a hybrid light-field and
  light-sheet microscope. Each of 137 time points has a light-field image (small_2_lf), a second set of stacks
  (small_2_lr) and a registered light-sheet stack used as ground truth (small_2_ls_reg, HDF5), imaged on fluorescent
  beads.
