notes: 'Record title says train data; the zip listings show 137 TIFFs each in small_2_lf (2.3 MB each) and small_2_lr
  (about 60 MB each), matching the 137 bead stacks (261 x 400 x 100 um) the preprint lists as HyLFM-Net bead training
  data. The ls_reg HDF5 (27 GB) was not inspected. What lr holds, voxel size and bead size are not stated on the
  record or in the preprint Methods. Sibling Zenodo records Small Beads 0 (validation, 4 time points) and 1 (training)
  exist. Paper source is the bioRxiv preprint (its data availability statement only promises release at publication).'
