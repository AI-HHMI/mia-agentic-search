notes: 'Two Figshare items, both CC BY 4.0: Single_Cells (3 confocal stacks, 67 slices of 106x86 px, ImageJ header 621.6 nm xy, 4.7 MB) and Spheroids (3 LSFM stacks, 262 slices of 1920x1920 for the first,
  9.5 GB). Each stack has a manual GT mask and an automatic MatRad-OIDS mask (tool output, hence source mixed); only the *_Masks_GT files are manual. Only 6 volumes, so this is a small tool-validation
  set. Spheroid TIFF header has no voxel calibration and the page gives none; no paper was found in Europe PMC (the article is cited as 2026, MatRad-OIDS), so voxel size and annotator details are
  not stated. Cell GT masks are small (33 KB to 0.65 MB). Spheroid files: MA1_F05_ang1, MA2_G09_ang1, MA3_G04_ang1.'
