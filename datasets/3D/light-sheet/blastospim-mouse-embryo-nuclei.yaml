notes: 'Hosted on the project website (Flatiron Institute), not a public repository. Counts, voxel size
  (0.208 um xy, 2.0 um z), microscope (InVi SPIM light-sheet), annotation tool (AnnotatorJ) and the CC BY-ND
  4.0 licence come from the PMC preprint text; the data page gives the 573 + 80 volume counts. Listed with
  peek_archive: BlastoSPIM1_train.zip (32.9 GB compressed, 1359 .npy files, images/ + masks/ + crop/ per
  time point), BlastoSPIM1_val.zip (2.4 GB), BlastoSPIM2_train.zip (16.5 GB); the test archives (low/moderate
  SNR) and BlastoSPIM2 val/test were not listed, so total size is not given. Files are .npy, which is not
  in the format enum, hence other. The published Development paper is paywalled to this run, so the author
  list is incomplete (only the first author, Nunley, was seen). NoDerivatives licence: redistribution
  of adapted material is restricted.'
