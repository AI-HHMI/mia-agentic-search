title: 'BlastoSPIM: 3D nuclear instance segmentation ground truth for preimplantation mouse embryos (light-sheet)'
short_name: BlastoSPIM mouse embryo 3D nuclei (light-sheet)
description: 653 manually annotated 3D light-sheet volumes of H2B-miRFP720-expressing preimplantation
  mouse embryos (BlastoSPIM 1.0 with 573 volumes from 31 embryos, BlastoSPIM 2.0 with 80 late-stage volumes)
  with 3D nuclear instance labels (18,336 nuclei in total), provided as train / validation / test (low
  and moderate SNR) archives of NumPy arrays.
