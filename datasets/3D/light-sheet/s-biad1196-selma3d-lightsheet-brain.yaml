title: 3D light-sheet microscopy data for SELMA3D 2024 challenge - Training subset with annotations
short_name: SELMA3D brain structure masks (light-sheet)
description: 'Annotated 3D light-sheet microscopy patches of cleared brain tissue from the SELMA3D 2024 challenge
  on self-supervised learning for segmentation. Four structure types with voxel-wise manual annotations: blood vessels
  (500x500x50, 2 channels), cell nuclei (200x200x200), c-Fos-positive cells (100x100x100) and Alzheimer''s amyloid
  plaques (300x300x300).'
