title: 'HyLFM-Net dataset: hatchling medaka heart'
short_name: Medaka heart light-field/light-sheet pairs
description: Paired light-field and light-sheet images of beating and arrested hatchling (8 dpf) medaka hearts from
  a hybrid light-field light-sheet microscope, used to train and evaluate HyLFM-Net, a network reconstructing volumes
  from raw light-field images. Five specimens plus a bead reference stack for registration, as zip archives of TIFF
  frames (lf_raw, lf_rectified, spim_slice).
