title: Datasets for Zero-Shot DeconvNet
short_name: ZS-DeconvNet denoising/SR training (TIRF, LLSM)
description: 'Representative training images (with PSF files) and 2D/3D time-lapse recordings used to
  train ZS-DeconvNet, an unsupervised (zero-shot, no ground truth) denoising and super-resolution network.
  Contains six zip archives: 2D TIRF-SIM-system images of lysosomes and microtubules (train_data and PSF),
  3D confocal stacks with PSFs, 2D time-lapse (Lifeact/Myosin-II, Rab11/Lamp1) and 3D lattice light-sheet
  time-lapses (SC35/H2B, mitosis H2B and mitochondria).'
