notes: 'Released as training data of an unsupervised method (no ground-truth images): usable for self-supervised denoising
  / super-resolution, no labels. Archives listed with peek_archive: 2D data.zip has 38 train_data TIFFs (Lysosome 10, Microtubule
  28) plus PSFs; 3D data.zip has 135 files (confocal train_data .mrc stacks and PSF TIFFs; one config file gives 0.2 um xy
  and 0.5 um z intervals for the sampled stack only, so voxel size left null); time-lapse archives hold large TIFF series
  (SC35_H2B alone 722 files). Size is the sum of the six Zenodo file sizes. Voxel/pixel size, per-archive organism and species
  are not stated on the Zenodo page or in the paper Methods/Data availability (paper says other data are available on request
  and points to the GitHub tutorial page). Organism list reflects cell lines named in the paper Methods (COS-7, SUM159, HeLa,
  293T). Mixed 2D/3D/time-lapse content; dimensionality set to 3D by volume.'
