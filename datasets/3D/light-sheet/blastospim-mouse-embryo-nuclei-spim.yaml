short_name: Mouse embryo nuclei instances (light-sheet)
description: 653 light-sheet 3D images of H2B-miRFP720 preimplantation mouse embryos (573 in BlastoSPIM
  1.0, 80 late-blastocyst images in 2.0) with manually annotated 3D nuclear instance masks (18,336 nuclei),
  distributed as train / validation / low-SNR test / moderate-SNR test zip archives of .npy image and
  mask arrays.
