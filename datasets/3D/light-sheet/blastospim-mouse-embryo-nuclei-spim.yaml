notes: 'Hosted on the Flatiron Institute project site as zips under ../sample/ (BlastoSPIM1_{train,val,test_lowSNR,test_modSNR}.zip
  and BlastoSPIM2_*). Only BlastoSPIM1_val.zip was listed with peek_archive (2.39 GB compressed, 93 .npy files, 11.7 GB uncompressed):
  per-sample folders with images/*_image_0001.npy, masks/*_masks_0001.npy and crop/*_crop_0001.npy; other zips not listed, total
  size unknown. Formats other because .npy is not in the schema list. Voxel size 0.208 um xy and 2 um z per the dataset page; paper
  states 0.208 um xy and equal z resolution to the Platynereis data. No license or terms for the data found on the dataset page
  or paper (the preprint itself is CC-BY-ND 4.0, which is not a dataset license). Paper says raw images were annotated as .tiff
  stacks with AnnotatorJ; the distributed archives are .npy. n_items = 653 annotated images (573 + 80). Paper also describes
  10 spinning-disk confocal and other ground-truth sets, which are not confirmed as part of these downloads.'
