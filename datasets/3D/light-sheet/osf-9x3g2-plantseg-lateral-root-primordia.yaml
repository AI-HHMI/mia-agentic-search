notes: 'OSF project 9x3g2 holds 21 HDF5 files (Movie1/2/3_*_crop_gt.h5, 1.6 GB). The PlantSeg paper deposits its data at osf.io/uzq3w,
  whose components list no files via the OSF API, and describes ground truth for 27 lateral root primordia images from three
  movies. The link between 9x3g2 and the paper is inferred from the Movie1-3 naming; the file count (21) differs from the
  paper (27). Voxel size is from the paper, not file headers. Whether the files contain a raw array was not checked. No license
  is stated on the OSF nodes; the paper is CC BY 4.0, which may not cover the data.'
