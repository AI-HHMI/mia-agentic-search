notes: OSF node 9x3g2 is the 'train' component of LateralRootPrimordia (2rszy) under the paper's deposit
  uzq3w; its siblings are 'val' (vs6gb, 2 files, 127 MB), 'test' (tn4xj, 4 files, 359 MB) and 'nuclei'
  (thxzn). 21 train + 2 val + 4 test = the paper's 27 ground-truth LRP images, so this record covers the
  21 training crops. Each HDF5 holds 'raw' (uint8) and 'label' (uint16 cell ids). Voxel size from the
  paper (0.1625 x 0.1625 x 0.250 um, the movies' acquisition); the files carry no calibration attributes.
  No license on any OSF node (9x3g2, 2rszy, uzq3w); the paper is CC BY 4.0, which may not cover the data.
