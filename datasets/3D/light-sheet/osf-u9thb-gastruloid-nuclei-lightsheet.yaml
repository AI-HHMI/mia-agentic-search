notes: 'OSF API listing: 15 image TIFFs (~6.6 GB; 2d_*, 3d_*, 4d_* names, with/without Chiron; what 2d/4d
  mean is not stated) and 16 mask files (~1.1 GB, one .tif/.tiff duplicate). description.txt: raw nuclei
  channel 0, warped to 0.55 um isotropic voxels, masks only deflated. Paper: nuclei segmented in 3D with
  Cellpose (Cyto model), no manual correction mentioned, so source is automatic; OSF node has no license
  (the arXiv CC BY label covers the paper only). Not stated: objective, cell line, gastruloids per condition,
  publication date. Paper read via arxiv.org/html (not in Europe PMC). enricher: size_bytes from the full
  OSF API file listing (was 7,735,587,036); masks are instance ids (sampled).'
