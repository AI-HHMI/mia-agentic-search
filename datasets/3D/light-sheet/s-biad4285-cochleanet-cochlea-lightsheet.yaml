    data in the preprint. Each zip is a direct file on ftp.ebi.ac.uk (range requests work); there is no single archive, so
    data.download_url stays the Files/ folder. Voxel 0.38 um isotropic confirmed by the OME-Zarr scale of s0. Whole-dataset
