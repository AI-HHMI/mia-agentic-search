notes: 'Study released 2026-10-20: 2 cochleae (M_02R mouse, G_1L gerbil), 3 stain volumes each (PV, Vglut3, CTBP2; 40-110
  GB zip each) plus SGN and IHC label zips (10-139 MB). Labels are predictions of the CochleaNet models (bioimage.io), explicitly
  not proofread, so they are pseudo-labels rather than ground truth; the paper reports that the models were trained on expert-annotated
  sub-volumes (not part of this deposit) and validated against consensus expert point annotations. Voxel size 0.38 um isotropic
  from the study description and paper Methods. M_SGN.ome.zarr.zip was listed with peek_archive (OME-Zarr, 6099 members);
  all zips were listed by the enricher. No train/val/test split. enricher: size 481,138,322,865 B from a complete listing
  with exact sizes (was null). organisms: Mus musculus = M_*.ome.zarr.zip, Meriones unguiculatus = G_*.ome.zarr.zip. Labels:
  SGN on the PV grid, IHC on the Vglut3 grid (file_list_*_segmentation.tsv).'
