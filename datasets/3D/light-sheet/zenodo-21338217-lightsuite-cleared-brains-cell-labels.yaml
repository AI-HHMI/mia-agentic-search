title: Data set for "LightSuite - scalable atlas registration and cell detection across the central nervous system"
short_name: Cleared mouse brain cell detection (light-sheet)
description: Companion data of the LightSuite software paper. 34 cleared TRAP2;Ai14 mouse brains (light-sheet, tdTomato) and 9
  autofluorescence brains registered to the Allen CCFv3, 5 cleared spinal cords (mesoSPIM, DAPI and mEGFP), registration landmarks and
  transforms, whole-brain tdTomato+ candidate cell detections with CNN soma classification, and a cell classifier with 8,174 manually
  labelled patches (4,681 cells and 3,493 non-cells). The README also describes a cell detection benchmark of 16 subvolumes with
  12 manually annotated, but that archive is not among the files listed on the Zenodo record.
