notes: 'From the Zenodo API record, the README (read in full) and the cell_classifier.zip listing (network + training_data .mat).
  Voxel size is that of the deposited 20 um registration volumes; original TRAP2 stacks were 1.44 x 1.44 x 5 um (561 nm channel
  only). 48 volumes = 34 TRAP2 + 9 barrel + 5 spinal cords. The README-described cell_detection_benchmark archive (12 annotated
  subvolumes) is not among the listed files, so it could not be verified; the annotated data seen are the classifier training
  patches (1 = cell, 0 = non-cell, per README). Paper text/abstract not available; main content is registration inputs and
  outputs, a software companion dataset.'
