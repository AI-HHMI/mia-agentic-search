  notes: 'MetaImage (.mha, zlib-compressed, LOCAL data) is not readable by probe.py/sample.py, so headers and the
    sample were read with a short requests+numpy script (key output in the PR comment). Sizes from the EBI HTTP
    index (rounded; FTP timed out), so size is estimated. Shapes vary per structure (MHA DimSize x y z): axon DimSize
    100x250x250 (zyx array [250,250,100]), blood vessel 500x500x50, peripheral nerve 400x400x400 (record description
    says 300^3 for nerves). ElementSpacing is 1 1 1 (uncalibrated), so voxel size stays null. Axon patches have
    TransformMatrix -1 -1 1 (LPI) vs identity (RAI) for vessel/nerve. Value range from one axon sample; masks {0,1}
    uint8. Second pass 2026-10-06: listing and sample pair repeated with a scratch MetaImage reader; MHA headers
    say ElementSpacing 1 1 1 (uncalibrated), so voxel size stays null (per-structure values in record notes). Size
    from the BioStudies file lists (88 files, exact sizes) instead of the rounded HTTP index.'
