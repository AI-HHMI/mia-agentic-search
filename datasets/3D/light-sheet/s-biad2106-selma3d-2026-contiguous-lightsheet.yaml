short_name: SELMA3D vessel, nerve, axon masks (light-sheet)
description: 'Annotated 3D light-sheet microscopy patches of contiguous structures from the SELMA3D 2026 challenge
  on self-supervised learning for LSM segmentation: brain blood vessels (500x500x50 voxels), peripheral nerves (300x300x300)
  from cleared mouse, and axons from macaque and human brain imaged with SCAPE. Each patch has a manually annotated
  pixel-wise segmentation mask.'
