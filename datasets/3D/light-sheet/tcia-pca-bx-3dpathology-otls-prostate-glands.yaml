notes: 'TCIA collection page (v1, 2023-03-07): 118 images / 50 patients, 3.8 TB, HDF5, XML and TIFF, Aspera
  (Faspex) download only, CC BY 4.0 plus the TCIA Data Usage Policy; DOI 10.7937/44MA-GX21. No file listing
  is published. Released: 2x-downsampled fused two-channel HDF5 (TO-PRO-3 nuclear, eosin), synthetic CK8
  at 2x, lumen/epithelium/stroma masks at 4x, clinical CSV and cancer-region coordinates. Masks are ITAS3D
  output (automatic; paper: 10 volumes manually annotated only for validation). Paper Data availability
  says data on request; TCIA lists open download, treated as authoritative. enricher: voxel_size_nm null
  (was 440x440: the paper''s ~0.44 um/pixel is the raw acquisition; released files are 2x/4x downsampled
  and no source states their size). doi added from the TCIA page.'
