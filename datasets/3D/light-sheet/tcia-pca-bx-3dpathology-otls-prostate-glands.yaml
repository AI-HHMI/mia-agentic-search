notes: 'TCIA page (Version 5 shown by cache) gives 118 images/50 patients, 3.8 TB, HDF5+TIFF+XML, Aspera
  download, CC BY 4.0 plus TCIA Data Usage Policy; no dataset DOI assigned ("DOI goes here"), no file
  listing or folder structure on the page, so formats/counts come from the summary only. Voxel size: paper
  Methods state near-Nyquist sampling of ~0.44 um/pixel (lateral, raw OTLS); z spacing and the pixel sizes
  of the 2x/4x downsampled products are not stated. Masks: per the paper, glands are segmented by ITAS3D
  (image translation to synthetic CK8 then classical segmentation), i.e. automatic; only 10 volumes (512x512x100
  px) were manually annotated for validation. Which masks are in the TCIA release is not stated. The paper
  Data availability says full 3D data are available on request, whereas the TCIA page lists open download;
  TCIA is treated as authoritative. Modality channel count (T&E two fluorophores) from paper Methods.
  Authors are those of the paper (Europe PMC author string).'
