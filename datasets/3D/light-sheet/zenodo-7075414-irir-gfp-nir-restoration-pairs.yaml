schema_version: '1.2'
id: zenodo-7075414-irir-gfp-nir-restoration-pairs
title: IRIR dataset and code - paired GFP and near-infrared light-sheet stacks of zebrafish and Drosophila for deep-tissue
  image restoration
short_name: IR2 GFP/NIR restoration pairs (light-sheet)
description: Zenodo record accompanying the IR2 paper. Fixed zebrafish larvae (Tg(kdrl:GFP), Tg(h2b:GFP)) and Drosophila
  embryos expressing GFP are imaged by light-sheet microscopy in the GFP channel and, after anti-GFP staining with
  a near-infrared dye, in the NIR channel (ch00 / ch01), giving paired degraded and high-contrast ground-truth volumes
  for supervised restoration. Time-lapse (TL) zip files hold live GFP recordings to which the trained network is
  applied, and a codes zip holds the CSBDeep training and evaluation scripts.
