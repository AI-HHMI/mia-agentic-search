notes: 'Files seen in the Zenodo record: fish-kdrlGFP.zip, fish-h2bGFP.zip, fish-h2bGFP_TL.zip, fly-his2avGFP.zip, fly-his2avGFP_TL.zip, deeprest.zip, codes.zip (peek_archive: fish-kdrlGFP holds ch00.tif and ch01.tif per fish and timepoint; fly-his2avGFP holds ch00.tif, ch01.tif and restored.tif; codes holds 28 .py and 5 .ipynb files). In-plane pixel size of the custom IR-mSPIM is not stated in the paper (only 11.1x magnification on an Andor Zyla 4.2 sCMOS); the Luxendo pescoid data is 0.39 um/pixel but is not clearly part of this record, so voxel_size_nm is null (z-step 5 um zebrafish, 2.5 um Drosophila, from Methods). n_items not stated. The paper does not state a data availability URL in the text read; the record title and description match the paper.'
