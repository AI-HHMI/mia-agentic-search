description: 1000 unannotated 3D patches (250x250x250 voxels) of cell nuclei in cleared whole-brain light-sheet volumes, sampled
  evenly (250 each) from the four nuclei samples of the SELMA3D 2024 challenge training subset without annotations. Intended
  for self-supervised learning of 3D light-sheet segmentation.
