notes: 'Unannotated by design (self-supervised use). Zip listing via peek_archive: 1000 patch_*.nii.gz in Nuclei/patches/sample1-4
  plus 4 extraction_metadata.json. Voxel size is taken from the source BioStudies study S-BIAD1197 (nuclei: 0.54 um x/y nominal
  resolution, 5 um z step); whether patches were resampled is not stated. Organism (Homo sapiens for nuclei images) also from
  S-BIAD1197. Associated paper (Zenodo 10.5281/zenodo.10991463) full text not retrievable, so not listed. Single 32 GB zip.
  enricher: channels 1 (single-channel float32 patches, sampled; was null).'
