  notes: 'Listing: Zenodo API (1 zip, exact) plus the zip''s central directory (1000 .nii.gz, 4 json). Probed patch_0000 of
    sample1 (8 MB read). Sampled sample1/patch_0000 and sample3/patch_0000 (64 MB with nibabel): 250x250x250 float32, integer
    values 678-23857 and 603-33769 (two samples), no zeros; values look like 16-bit intensities stored as float, but the deposit
    doesn''t say whether they were rescaled. NIfTI header has a default 1.0 spacing with unknown units (sform identity), so
    it holds no calibration. Voxel size 0.54x0.54x5 um is the record''s value from S-BIAD1197 (nuclei acquisition); the deposit
    doesn''t say whether the patches were resampled. No labels by design (self-supervised).'
