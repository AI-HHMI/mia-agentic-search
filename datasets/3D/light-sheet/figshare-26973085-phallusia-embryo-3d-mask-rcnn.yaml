notes: 'This record is the test set only (PM1 embryo): Inputs.zip has 100 input tiffs (16.8 MB each, 1.7
  GB uncompressed), ASTEC_Ground_truth.zip has 100 label tiffs, and the other zips hold 3D Mask R-CNN
  and Cellpose predictions and network weights. The full Phallusia dataset in the paper (21 embryos, 1,742
  volumes, Guignard et al. 2020, Science) is not in this deposit. The paper crops and resizes volumes
  to 256^3 voxels, and no voxel size is stated on the Figshare page, the GitHub README or the paper text
  read, so voxel size is null. enricher: annotations.source proofread (was automatic): the paper says
  ASTEC seeds are manually validated and a manual curation step follows; axes zyx from the docs (one 3D
  volume per time point).'
