  notes: 'Listing: listing.py on the 6 figshare files (1,004,204,240 B, file-listing) plus each zip index.
    Header probe could not reach the TIFF IFDs inside deflated members, so the two sample members were
    read whole with a scratch range reader (tools/peek_archive + tifffile, 6.8 MB compressed): no calibration
    (resolution 1/1, no unit). Value ranges from t001. Model predictions and weights (see tree) are listed
    but not described as arrays: not training data. Download: figshare zips are direct, ranges and zip
    members work; no single archive (data.download_url stays the article). Voxel size not found: the volumes
    were cropped and resized to 256^3 from isotropic SPIM images (paper section 2.3.2) and no resulting
    size is stated; checked TIFF tags, figshare description, paper full text (Europe PMC), GitHub README
    per harvester.'
