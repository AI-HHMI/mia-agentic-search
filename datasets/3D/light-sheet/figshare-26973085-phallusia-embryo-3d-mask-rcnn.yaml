notes: 'This record is the test set only (PM1 embryo): Inputs.zip has 100 input tiffs (16.8 MB each, 1.7 GB uncompressed),
  ASTEC_Ground_truth.zip has 100 label tiffs, and the other zips hold 3D Mask R-CNN and Cellpose predictions and network
  weights. The full Phallusia dataset in the paper (21 embryos, 1,742 volumes, Guignard et al. 2020, Science) is not in this
  deposit. The paper crops and resizes volumes to 256^3 voxels, and no voxel size is stated on the Figshare page, the GitHub
  README or the paper text read, so voxel size is null. The ASTEC ground truth comes from the ASTEC segmentation pipeline of
  Guignard et al. (automatic, with curation described in that paper, which was not read), so source is automatic.'
