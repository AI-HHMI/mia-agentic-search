title: Phallusia mammillata embryo PM1 light-sheet series with ASTEC 3D cell instance segmentation, with
  3D Mask R-CNN and Cellpose predictions
short_name: Phallusia embryo 3D cell instances (SPIM)
description: Test set of the Phallusia mammillata (ascidian) embryo dataset used to train and evaluate
  a 3D Mask R-CNN. It has 100 fused multiview SPIM volumes of the PM1 embryo (membrane signal) with ASTEC
  3D cell instance segmentations as ground truth, plus 3D Mask R-CNN and Cellpose predictions and the
  trained network weights.
