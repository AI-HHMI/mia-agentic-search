  notes: 'Listing: Zenodo API, 16 files, 2,632,157,569 B (exact). Headers of all 13 NIfTI files probed
    (range requests): shape 670x1224x470 (zyx; nibabel order 470x1224x670), pixdim 0.004 mm isotropic,
    gzip; dtype int16 for 11 averages, float32 for TO-PRO, uint16 for the segmentation. Segmentation downloaded
    whole (3,415,115 B): values 0-904, 203 distinct IDs, 88% zero (background); label table lists 204
    entries (0-904), so IDs are region classes (semantic-ids). Raw sample (GFAP, 138 MB) failed twice
    on Zenodo (connection broken after 87 MB / too slow), so raw value ranges are not measured and normalization
