notes: 'This is an atlas: 12 group-average volumes (one per stain, each averaged over registered brains) plus one manual region segmentation, so it holds essentially a single labelled brain volume, not many training samples. Individual raw scans are not included. Voxel size 4 um isotropic is the atlas-space resolution stated in the paper Methods (acquired at 3.25 um in-plane, 4 um axial; registration done at 8 um). The record DOI is the one the Zenodo record lists (Dryad DOI); the paper cites the same Dryad DOI. The paper full text (Europe PMC) and Zenodo API were read; the ReadMe.pdf was not.'
