title: BioSR for LLS-SIM - paired lattice light-sheet and LLS-SIM volumes for super-resolution meta-training (Zenodo 14920947)
short_name: BioSR LLS-SIM paired SR volumes (light-sheet)
description: Paired diffraction-limited lattice light-sheet (LLSM) and lattice light-sheet structured illumination (LLS-SIM) volumes
  of 10 subcellular specimens for training super-resolution networks. About 30-50 ROIs per specimen were imaged at five intensity
  levels and the highest-intensity raw data reconstructed with conventional LLS-SIM as ground truth. This hub record holds the test
  data and pretrained models; the per-specimen training sets are separate Zenodo records.
