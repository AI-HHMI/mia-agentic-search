notes: 'Hub record of a multi-record release. The test data ships as nested zips (Demo_Data_for_RL_DFN, Demo_Data_for_VSI_SR, Demo_Data_for_3D_IsoRecon,
  Pretrained_Model_RL_DFN; 2.4 GB), whose inner file formats were not listed, hence formats other. The training volumes are separate
  CC-BY-4.0 records, e.g. 14904846 (chromosomes, 22.5 GB zip) and 14351669, 14903845, 14909576, 14909579, 14911758, 14904997 (others in the
  same series). Pixel size of the raw LLSM data is not stated in the Zenodo records or the bioRxiv preprint (only 61.7 nm for the isotropic
  SR volume; z-steps 0.2 or 0.39 um); the Nature Methods full text is not open access, so the voxel size was left null. Ground truth is
  the conventional LLS-SIM reconstruction, so there are no manual annotations.'
