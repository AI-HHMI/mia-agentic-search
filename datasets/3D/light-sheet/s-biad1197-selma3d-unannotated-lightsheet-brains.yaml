notes: 'Explicitly released without annotations for self-supervised pretraining (the annotated fine-tuning patches are a separate release). 63,411 files, all .tif slices: 35 sample stacks (vessel 9, amyloid plaque 4, c-Fos 18, nucleus 4; counted from the per-structure sample tables). Voxel size, channel count and total size were not stated on the BioStudies record, grand-challenge page, the Zenodo record (the paper there is a short PDF) or the file listing, so they are null. No peer-reviewed paper found: the BioStudies record cites only the Zenodo record 10991463 (a short descriptive PDF titled "Self-supervised learning for 3D light-sheet microscopy image segmentation"), which is not listed as a publication. Organism: nucleus images are human brain, the others mouse.'
