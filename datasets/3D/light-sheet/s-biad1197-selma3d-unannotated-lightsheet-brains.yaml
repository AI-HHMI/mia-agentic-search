notes: 'Explicitly released without annotations for self-supervised pretraining (annotated fine-tuning
  patches are a separate release). 63,411 .tif slices forming 35 sample stacks (vessel 9, amyloid plaque
  4, c-Fos 18, nucleus 4). No peer-reviewed paper found; BioStudies cites only Zenodo 10991463 (a short
  PDF). enricher: size_bytes 3,890,705,828,060 B summed from the four per-structure file lists (was null).
  organisms: Homo sapiens = cell_nucleus/, Mus musculus = vessel/, Ab_plaques/, c-Fos_brain_cells/ (BioStudies
  Biosample sections). enricher: voxel size differs by subset (BioStudies Image acquisition sections,
  nominal): vessel 1625x1625x3000 nm, c-Fos 1625x1625x6000 nm, amyloid plaque 1630x1630x4000 nm, cell
  nucleus 540x540x5000 nm, so voxel_size_nm stays null.'
