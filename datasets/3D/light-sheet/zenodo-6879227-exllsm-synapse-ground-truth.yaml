notes: 'Zenodo file list (63 files, 5.3 GB): 31 RAWDATA crops and 31 matching SYNAPSES/SYNAPSEMASKS crops plus README; crops are 100^3 to 500^3 voxels (2 MB, 250 MB). Paper Methods: ground truth presynaptic sites were manually segmented on 100^3 and 500^3 crops of nc82 (Bruchpilot) signal; the paper also points to the same ground truth at Dryad (doi 10.5061/dryad.5hqbzkh8b). Voxel size 104 x 104 x 180 nm is the original voxel size the paper gives for the ExLLSM data in expanded-sample coordinates (8x expansion; effective resolution 30 x 30 x 100 nm); the paper does not restate it per crop. formats is other because .nrrd is not a listed format. Raw pixel type not checked.'
