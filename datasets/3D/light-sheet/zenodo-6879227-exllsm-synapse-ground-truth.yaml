  notes: 'NRRD (NRRD0004, encoding raw, endian big, uncompressed); header sizes are fastest-first x y z, so arrays
    are zyx in C order. Crops are 100^3 (raw 2,000,242 B) or 500^3 (raw 250,000,242 B), going by file sizes and
    headers read. Sampled (one sample each, 6.0 MB total): lateralhorn3 RAWDATA uint16 0..4453 (mean 33, p99.9 670),
    its SYNAPSES uint8 {0,255} (0.5% foreground); lateralhorn9 SYNAPSEMASKS uint8 {0,255}, RAWDATA uint16 0..697.
    Label dtype varies: mushroombody1 SYNAPSEMASKS header says uint16 500^3 (values not sampled), mushroombody0
    SYNAPSEMASKS uint8. Most headers carry unit spacing (1.0, "pixel"); opticlobe1 RAWDATA carries 0.104/0.104/0.18
    (labelled "pixel"), which matches the paper in um. NRRD is not a listed format (other); TensorSwitch may not
    read it.'
