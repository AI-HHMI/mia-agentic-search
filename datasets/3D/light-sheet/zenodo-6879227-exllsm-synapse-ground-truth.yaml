id: zenodo-6879227-exllsm-synapse-ground-truth
title: Ground truth data used to train the synapse classifier used in Lillvis et al., 2022 for ExLLSM circuit reconstruction
short_name: Drosophila brain synapse ground truth (ExLLSM)
description: 31 crops of 8x expanded Drosophila melanogaster brain tissue imaged with expansion lattice light-sheet microscopy (ExLLSM), with the presynaptic marker Bruchpilot labelled by nc82 antibody. Each raw crop (RAWDATA.nrrd) comes with manually annotated ground truth presynaptic sites (SYNAPSES.nrrd or SYNAPSEMASKS.nrrd), from optic lobe, protocerebrum, lateral horn, mushroom body, ellipsoid body and antennal lobe. Used to train the U-Net synapse classifier of the ExLLSM circuit reconstruction pipeline.
