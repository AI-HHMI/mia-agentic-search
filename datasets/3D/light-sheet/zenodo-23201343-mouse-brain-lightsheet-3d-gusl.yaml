notes: 'Three uncompressed tar archives (cFOS 384 MB, Lectin 892 MB, TH 4.1 GB). Tar headers read over
  range requests: cFOS holds training_data/DatasetTIFF/images/01 and masks/01 with one TIFF per z slice
  (51 slices each seen; ~5 MB images, ~2.5 MB masks); TH has test/01/Flatten_561/*.tif, so it also has
  a test split. Lectin.tar was not opened. The manuscript is not identified on the record and could not
  be found, so there is no paper source; voxel size, annotation procedure, number of volumes and mask
  class encoding are unknown. Data come from the FIDELITY study (Lin et al.) per the record. download_url
  is null because the record has three archives. enricher: tar headers walked (cFOS 100 slices, Lectin
  874 files, TH first 200 entries); annotations verified. Lectin image header calibration 1.82 um/px lateral
  (ImageJ), no z; cFOS and TH uncalibrated, so voxel_size_nm stays null.'
