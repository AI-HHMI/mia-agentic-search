notes: 'Patches per structure (gt file counts from listing): AD plaques 34, vessels 24 (raw has 2 channels),
  c-Fos 19, nuclei 12 (shannel_cells folder). Voxel size varies by structure (xy/z um: vessels 1.625/3,
  nuclei 0.54/5, c-Fos 1.625/6, plaques 1.63/4 per BioStudies) so voxel_size_nm is null. Masks made by
  hierarchical review with VR visualization. License: BioStudies says CC BY 4.0, but the challenge page
  says CC-BY-NC and the arXiv paper BY-NC-ND; BioStudies value used. Companion unannotated set S-BIAD1197
  has its own PR. Paper full text not retrievable through paper.py (arXiv only); abstract page read. File
  sizes not checked. enricher: formats nifti (was other); size_bytes ~2.7 GB estimated from the rounded
  EBI HTTP index (was null). maintainer 2026-10-06: per structure (BioStudies image acquisition): vessels
  1625x1625x3000, nuclei 540x540x5000, c-Fos 1625x1625x6000, plaques 1630x1630x4000 nm. NIfTI zooms are
  a 1.0 default. voxel_size_nm stays null.'
