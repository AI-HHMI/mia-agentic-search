title: 3D nucleus annotations of a light-sheet neurosphere by three experts (Hollandi et al. neurosphere masks)
short_name: Neurosphere 3D nucleus masks (light-sheet)
description: Label volumes (Labels.tiff) for a 3D light-sheet fluorescence image of a small neurosphere spheroid with fluorescently
  labelled nuclei (116 slices, 52 cells per the 3d-cell-annotator.org sample-data page), annotated independently by three
  experts. Each expert annotated it four ways (manual twice, with the Minimal-contour tool, and with Minimal-contour plus
  interpolation) in napari-biomag-annotator, giving 12 Labels.tiff volumes, each with an annotation-time CSV and a screen-recording
  video. The image itself is not in this deposit; it is the OpenSegSPIM Neurosphere_Dataset.zip linked from 3d-cell-annotator.org.
