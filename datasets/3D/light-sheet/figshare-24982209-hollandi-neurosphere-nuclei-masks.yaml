notes: 'Labels only: the neurosphere image (Neurosphere_Dataset.zip on SourceForge, from OpenSegSPIM, Gole et al. 2016) is not in this
  deposit, so raw-to-label pairing needs that second download (not fetched here; the SourceForge link redirects). Voxel size and
  organism/cell type are not stated in the figshare description, the 3d-cell-annotator page or the bioRxiv text read (116 slices,
  lower resolution with overlapping objects). Expert1.zip was listed with tools/peek_archive.py: 4 variants, each a 0.1-0.2 MB
  Labels.tiff, a CSV and a 1.5-2.7 GB .mkv (7.7 GB uncompressed in that zip), so most of the 3.8 GB is screen recordings. License is the
  GPL v3 or later stated on the figshare record, with the record text limiting use to academic research. The sibling records
  (embryo masks, 2D, co-culture, mitotic spheroid) are separate figshare items already in the catalog.'
