notes: 'Labels only: the neurosphere image is OpenSegSPIM Neurosphere_Dataset.zip on SourceForge (OriginalStack.tif,
  116 x 150 x 150 uint16, the same grid as Labels.tiff; enricher read it). Voxel size and organism/cell
  type are not stated in the figshare description, the 3d-cell-annotator page or the bioRxiv text; the
  OpenSegSPIM paper is not open access. Each Expert zip holds 4 variants, each a 0.1-0.2 MB Labels.tiff,
  a CSV and a 1.5-2.7 GB .mkv, so most of the 3.8 GB is screen recordings. License is the GPL v3 or later
  stated on the figshare record, with the record text limiting use to academic research. Sibling records
  (embryo masks, 2D, co-culture, mitotic spheroid) are separate figshare items.'
