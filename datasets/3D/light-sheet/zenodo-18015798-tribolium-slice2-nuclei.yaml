notes: Voxel size of the fused isotropic images is not stated on the Zenodo page, file listing, or paper Methods/Data Records
  (only the raw lateral pixel spacing 0.645 um and axial z-stack pitch 2.58 um); left null. Zenodo 18015798 is the concept
  record (current version 20391579, v2; v1 had duplicated nuclei positions). The image series themselves are in separate Zenodo
  records per dataset (community https://zenodo.org/communities/slice-2); this record covers the segmentation archives only
  (16 zips, ~2 GB, 3D+t time points chosen for segmentation). Segmentation is stored as Arivis .sis/.objects/.metadata files
  plus XLSX centroid tables next to a TIF copy of each segmented image; no label TIFFs, so use needs Arivis Pro or the XLSX
  coordinates. Peeked DS0012 zip only.
