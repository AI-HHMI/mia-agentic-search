title: SLICE-2 Tribolium castaneum gastrulation light-sheet datasets with blastoderm and serosa nuclei segmentation
short_name: Tribolium gastrulation nuclei segmentation (LSFM)
description: Manually segmented nuclei in fused, deconvolved 3D light-sheet fluorescence images of Tribolium castaneum embryos
  (H2A/H2B-mEmerald) from the SLICE-2 collection. Blastodermal nuclei are segmented in 14 of 16 datasets and serosa nuclei
  in 7, using Arivis Pro with review by a second researcher. Each archive contains the cropped, intensity-adjusted images,
  the Arivis segmentation files and nuclei coordinate tables.
