  notes: 'Listing: tools/listing.py over the 5 zips (1901 members, exact sizes; 470,427,775,942 B compressed).
    Headers: lf_raw/lf_rectified via probe.py (zip members); ls and spim_registered via a range-reading
    zip script (deflated members, first IFD only). value_range from one sample (lf_rectified b11mu_0/00000,
    2.2 MB); spim_registered not sampled (2.2 GB per file, deflated). Voxel size not found; checked: TIFF
    headers (no resolution/spacing tags in spim_registered, ImageJ description has none), BioStudies API,
    bioRxiv preprint full text (Methods give stack extents, not spacing), hylfm-net README and dataset
    code. The published Nature Methods paper is not open access. Download: each zip is a direct file on
    ftp.ebi.ac.uk (range requests ok); download_url kept as the Files/ folder since there are 5 archives.'
