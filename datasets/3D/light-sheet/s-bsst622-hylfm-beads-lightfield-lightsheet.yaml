notes: 'No license stated on the BioStudies record (code repo is MIT; data license not given). Paper not
  open access (abstract only); voxel size not on the record. Organism n.a. (beads). size_bytes is the
  sum of the 5 zips. Phantom bead data, less biologically relevant. modality other = light-field. Sister
  datasets from the same paper: S-BSST604 (medaka heart), S-BSST633 (zebrafish larvae). enricher: all
  5 zips listed (1901 members); n_items 488 = spim_registered volumes (448 with LF frames; beads_large
  has none). annotations.source automatic: targets are light-sheet stacks registered by an affine from
  Fiji Multiview Reconstruction (preprint Methods). Voxel size not stated in headers, BioStudies or preprint.'
