title: Co-culture (HeLa Kyoto + MRC-5) spheroid light-sheet images with nucleus masks
short_name: HeLa/MRC-5 spheroid nuclei (light-sheet)
description: Six light-sheet z-stacks of multicellular HeLa Kyoto (EGFP-alpha-tubulin/H2B-mCherry) and MRC-5 fibroblast
  co-culture spheroids, 4 channels (DAPI, tubulin, mCherry, phalloidin) as multi-page 16-bit TIFF, plus a deconvolved
  (LIGHTNING) DAPI-only version, with expert nucleus annotations (one zip of masks per spheroid). Released with the
  napari-biomag-annotator paper as 2D/3D nucleus segmentation training data targeting spheroids.
