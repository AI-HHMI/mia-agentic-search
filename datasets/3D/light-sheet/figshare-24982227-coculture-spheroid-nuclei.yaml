  notes: 'Listing: tools/listing.py on the 3 figshare files, 2,757,450,510 B, complete; zip members via
    peek_archive. masks.zip (3.6 MB) downloaded whole, nested zips read in memory with zipfile/tifffile
    (nothing extracted or run), then deleted: 5 Labels.tiff, int32, 197-478 instance ids, spheroid 016
    has no mask. Raw members are deflated and their TIFF IFDs sit far from the start, so headers could
    not be read by range; LIGHTNING 012 (142 MB, read twice) and channels 007 ch00 (82 MB) were downloaded
    and measured, then discarded. Both are RGB uint8 LZW, not the "multi-page 16-bit" the figshare description
    states; XResolution is 72 dpi (uncalibrated). The 3D+RGB layout means axes zyxs; value ranges are
    from one sample each. No single archive holds everything, so download_url stays null.'
