notes: 'Part of a 6-article figshare collection (10.6084/m9.figshare.c.7020531.v1) that accompanies the
  paper. Files: channels.zip (6 spheroids x 4 channels, 24 TIFFs, 14.8 GB uncompressed), LIGHTNING_DAPI_only.zip
  (6 deconvolved DAPI TIFFs), masks.zip (5 nested zips). Pixel size 0.1437 um and z step 3.7 um from the
  figshare description and paper Methods. The paper (CC BY-NC-ND) states the dataset is intended for 2/3D
  nucleus segmentation training; the exact nucleus count is not stated. Licence is shown by figshare as
  GPL 3.0+. The paper PDF was not read in the publisher version; full text from bioRxiv via tools/paper.py.
  Downloads are per-file figshare links, so download_url is null. enricher: 5 of 6 spheroids have instance
  masks (none for 016), so coverage is partial; image files are RGB uint8, not 16-bit (inspected).'
