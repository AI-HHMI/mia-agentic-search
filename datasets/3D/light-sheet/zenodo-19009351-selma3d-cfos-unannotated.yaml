  notes: 'Listing: Zenodo API (1 zip, exact) plus the zip central directory (1000 .nii.gz, 2 json). Probed sample1/patch_0000 (8 MB read). Sampled sample11/patch_0000 (29.2 MB): 250x250x250 float32, integer values 482-17711 (one sample; p50 2083, p99 3188), no zeros; looks like 16-bit intensities stored as float; the deposit does not say whether they were rescaled. NIfTI zooms 1.0,1.0,1.0 (no calibration). Voxel size 1.625x1.625x6 um is from S-BIAD1197 "Image acquisition - c-Fos-positive cell images" (nominal; re-read this run); the deposit does not say whether the patches were resampled. No labels by design (self-supervised). tools/sample.py rejects Zenodo .../files/<name>.zip/content specs; sampled via https://zenodo.org/records/19009351/files/Cells.zip instead.'
