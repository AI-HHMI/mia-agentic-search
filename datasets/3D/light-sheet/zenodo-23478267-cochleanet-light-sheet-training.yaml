notes: 'Three zips (SGN_v1 490 MB, IHC_v1 3.3 GB, synapses_v1 329 MB), 48 + 89 + 15 crops; each has README.md
  and crops.tsv. IHC_v1 and synapses_v1 file listings and READMEs were read with peek_archive; the SGN_v1
  zip could not be listed (SSL error on range requests), so its layout is taken from the Zenodo description
  (TIFF crops with instance annotation, 40 train / 8 val) and assumed to match IHC_v1. Voxel size 0.38 um
  isotropic in all three archives (README: TIFF/Zarr files do not store it). Annotation per paper: experts
  corrected CellPose / uSAM initial segmentations in napari (SGN, IHC) and intensity-based synapse detections,
  hence source mixed. IHC crops come from mouse and gerbil (README); mouse only for SGN and synapses per
  record text. License MIT per Zenodo record. The paper text mentions 56 SGN training sub-volumes; the
  record lists 48 SGN crops (record count used).'
