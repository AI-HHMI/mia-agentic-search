    compression: none
    encoding: points-table
    classes:
    - id: null
      name: ribbon synapse (CtBP2 punctum)
    alignment: same-grid
    alignment_notes: Pairing rule - labels/<name>.csv pairs with images/<name>.zarr. Columns axis-0, axis-1, axis-2 = Z, Y, X in voxels of raw (sub-voxel floats), one synapse per row.
  notes: >-
    Listing: tools/listing.py on the three Zenodo zips with --expand-zips: 3 files, 1808 zip members,
    4,081,482,928 bytes (file-listing, complete; matches the Zenodo API sizes). Sample (value ranges from one
    crop each): SGN M_19R_crop_04_PV raw 64x256x256 uint16, 83-1145 (12-bit range hint), label uint32 with 100
    distinct IDs (0 = 79% background); IHC M_01L_crop_0516-1274-1078_Vglut3 raw 64x256x256 uint16 80-6034, label
    uint64 with 13 values (0-230). Headers: SGN raw uncompressed, IHC raw and SGN labels deflate; TIFFs carry no
    axis order or calibration, axes zyx from the READMEs. Dtypes vary per crop (SGN raw uint16 or float32 per
    README; label uint32/uint64 seen). synapses_v1: Zarr v2 groups stored inside the zip (.zarray read with
    peek_archive: shape 40x120x146 <u2 blosc lz4); CSV point tables, sub-voxel float coordinates. No single
    archive: the three zips are direct links (https://zenodo.org/records/23478267/files/<name>.zip), so
    download_url stays the record page. Voxel size 380 nm isotropic from the READMEs and paper Methods.
