    alignment_notes: Pairing rule - <name>.tif pairs with <name>_annotations.tif in the same folder (README; same shape in the sample). _empty crops have no SGN.
  - role: raw
    path_pattern: IHC_v1.zip/IHC_v1/*/*_Vglut3{.tif,_empty.tif}
