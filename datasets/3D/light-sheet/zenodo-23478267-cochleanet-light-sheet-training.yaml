title: CochleaNet training data for SGN segmentation, IHC segmentation and ribbon synapse detection
short_name: Cochlea SGN, IHC and synapse labels (light-sheet)
description: Training and validation crops from light-sheet microscopy of cleared mouse and gerbil cochleae
  at 0.38 um isotropic voxels. Three archives, one per CochleaNet model - spiral ganglion neuron (PV stain,
  48 crops, instance labels), inner hair cell (Vglut3 stain, 89 crops, instance labels) and ribbon synapse
  (CtBP2 stain, 15 crops, point annotations) - each with a train/val split and a crops.tsv table.
