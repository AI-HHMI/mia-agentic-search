notes: 'Three zips (SGN_v1 490 MB, IHC_v1 3.3 GB, synapses_v1 329 MB), 48 + 89 + 15 crops; each has README.md
  and crops.tsv. Voxel size 0.38 um isotropic in all three READMEs (TIFF/Zarr files do not store it); paper
  Methods: effective pixel size at the sample plane 380 nm. Paper text mentions 56 SGN training sub-volumes;
  the archives hold 48 SGN crops (count used). License MIT per Zenodo record. organisms: Meriones unguiculatus
  = IHC_v1 crops named G_* (36 of 89); Mus musculus = all other IHC_v1 crops, all of SGN_v1 and synapses_v1
  (READMEs, crops.tsv). enricher: annotations.source proofread (was mixed): paper Methods says SGN/IHC masks
  are CellPose/uSAM results corrected manually in napari and synapses are IMARIS spot detections corrected
  manually. enricher: SGN_v1 zip now listed (48 TIFF crops + 48 annotations, matches the Zenodo description).'
