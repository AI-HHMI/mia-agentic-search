notes: 'Unlabeled by design; usable for self-supervised pretraining (explicit challenge purpose). Files are 16-bit
  TIFF slice stacks (63,411 files). Voxel size varies per sub-collection and is not a single value: 1.625 um xy
  / 3 um z (vessels), 0.54 um xy / 5 um z (nuclei), 1.625 um xy / 6 um z (c-Fos), 1.63 um xy / 4 um z (plaques).
  License conflict: BioStudies states CC BY 4.0, the challenge page says CC-BY-NC and the arXiv paper lists CC BY-NC-ND
  4.0; the repository record is used here, so verify before use. Paper full text not read (arXiv abstract only).
  enricher: data are per-z-slice 2D uint16 TIFFs in <structure>/sample<N>/C0<c>/C0<c>_NNNN.tif (vessel has two channel
  folders C00, C01); enricher: size 3,890,705,828,060 B = sum of the 4 BioStudies file lists (63,411 files). organisms:
  Homo sapiens = cell_nucleus/; Mus musculus = vessel/, c-Fos_brain_cells/, Ab_plaques/ (BioStudies biosamples).'
