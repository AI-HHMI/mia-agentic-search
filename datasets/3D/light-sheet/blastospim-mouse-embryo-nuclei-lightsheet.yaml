notes: 'Eight zips (BlastoSPIM1_train/val/test_lowSNR/test_modSNR, BlastoSPIM2_train/val/test_lowSNR/test_modSNR):
  all members are .npy (images, masks and, for set 1, crop arrays); 0.29 TB uncompressed. The zips hold
  about 574 image volumes for set 1 plus set 2 volumes, versus 653 stated on the page and in the paper;
  n_items follows the paper. Voxel size 0.208 x 0.208 x 2.0 um per the website. The website states no
  data licence; the Development paper is CC BY 4.0, but that licence was not confirmed for the data, so
  spdx is unknown. Instance masks are described in the paper as manually drawn contours (AnnotatorJ) with
  curation. enricher: size_bytes = 60,605,540,609 B from the complete listing of the eight zips (was an
  approximate 63.55e9).'
