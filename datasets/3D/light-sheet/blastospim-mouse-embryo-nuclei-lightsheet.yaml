  notes: 'Listing: central directories of all 8 zips (1,882 members, exact sizes). probe.py does not read
    .npy, so a scratch script read the NumPy headers by HTTP range (deflated members, numpy.lib.format
    header readers, no pickle): image (71, 866, 960) uint16 Fortran order; mask same shape uint8; crop
    a 0-d int64 = 1. One contiguous 832k-element block from the middle of each array was decoded (not
    a z-plane, because of Fortran order): image 23..181, mean 119; mask max 4, 3 distinct in the block,
    99% zero. Instance-ids per the paper (per-nucleus labels); uint8 masks allow at most 255 nuclei. Axis
    order not stated in the files. Second pass: whole T1_003 pair read (zip members by range, numpy.lib.format,
    no pickle; 35,892,203 B compressed): image 71x866x960 uint16 Fortran order 0..243 (213 values); mask
    uint8 0..4, 5 values (4 nuclei), 99.8% zero. Globs match 656/656 images and 656/656 masks across the
    8 zips. No other host found (paper points to blastospim.flatironinstitute.org); .npy is not readable
    by TensorSwitch, so the planner stays blocked.'
