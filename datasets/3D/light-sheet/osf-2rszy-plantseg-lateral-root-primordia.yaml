notes: "Voxel size 0.1625 x 0.1625 x 0.250 um from the paper and wiki. Labeled items are individual time points picked from three time-lapses (the images are time-lapse data; only selected time points are annotated, so treated as 3D). Paper: ground truth bootstrapped with ilastik autocontext/multicut, then iteratively hand-curated. No license is stated on the OSF project or component pages, in the project wiki or in the paper (checked this run). The OSF API listed no files for the component (osfstorage empty), so file counts, sizes and annotation files could not be listed; format and layout (train/validate/test HDF5 files with 'raw' uint8 and 'label' uint16) come from the project wiki on osf.io/uzq3w. Size and download URL not stated."
