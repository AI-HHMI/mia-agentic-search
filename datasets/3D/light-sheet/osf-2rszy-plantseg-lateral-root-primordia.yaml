notes: 'Voxel size 0.1625 x 0.1625 x 0.250 um from the paper and wiki. Labeled items are individual time
  points picked from three time-lapses (only selected time points are annotated, so treated as 3D). Paper:
  ground truth bootstrapped with ilastik autocontext/multicut, then iteratively hand-curated. No license
  is stated on the OSF project, components, wiki or paper. enricher: files are in child components train
  (9x3g2, 21), val (vs6gb, 2), test (tn4xj, 4) and nuclei (thxzn, 3 nuclear-marker volumes): 30 HDF5 files,
  2,423,438,640 bytes from the OSF files API; n_items now 30. File names Movie<k>_T<time>_crop_gt.h5.'
