      \           sequential z-slice TIFFs (uint16, LZW)\n  <Marker>_brain_<n>/label/TRAIN/             3 CSVs (<Marker>_brain<n>_region[1-3]_gt.csv)\n\
      \  <Marker>_brain_<n>/label/TEST/              empty (test labels not public)\nper brain: image/ slices, size\n  GFAP_brain_12\
      \  2184 .tiff  155.3 GB\n  IBA1_brain_11  1963 .tiff  130.1 GB\n  NeuN_brain_5   1869 .tif    99.4 GB\n  PV_brain_9\
      \     1921 .tif   179.8 GB\n  TH_brain_7     1840 .tif    77.9 GB\n  cFos_brain_8   1634 .tif    76.3 GB\n"
