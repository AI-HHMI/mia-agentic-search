schema_version: '1.2'
id: canvas-lifecanvas-wholebrain-lsfm-cell-detection
title: 'CANVAS: whole-brain light-sheet benchmark for cell detection'
short_name: CANVAS whole-brain cell detection (light-sheet)
description: Six whole mouse brain (cFos - one hemisphere) SmartSPIM light-sheet volumes, one per marker (NeuN, cFos, PV, TH,
  IBA1, GFAP), with 93,046 cell centroids (model candidates reviewed by seven annotators, missed cells added manually) in train and test regions of interest (three ROIs per marker for each).
  Images are sequential TIFF z-slices, ground truth is one CSV per ROI, and each marker is distributed as one tar. Comes with
  a public leaderboard.
