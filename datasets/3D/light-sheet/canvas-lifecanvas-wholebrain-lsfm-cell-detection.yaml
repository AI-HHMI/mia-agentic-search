notes: 'Custom LifeCanvas Dataset License Agreement (free for academic / non-commercial research; no redistribution; commercial
  use needs a licence); terms are accepted on download, no account is needed. Size is the sum of the six tar files in the
  directory listing (718.8 GB). Counts of centroids (45,745 train / 47,301 test), voxel size 1.8 x 1.8 x 4 um and the markers
  come from the arXiv HTML; the paper does not announce the test labels publicly although a label/TEST folder is listed (its
  contents were not opened). The site is a JavaScript page, so the file listing was read from the images.lightsheetdata.com
  directory index. Annotation: baseline-model candidates (167,950 reviewed) checked by seven annotators with MorPheT, missed
  cells added in WebKnossos; TH, GFAP and IBA1 were annotated from scratch (arXiv HTML). The cFos brain covers one hemisphere.
  Voxel size was not checked in image headers. A Zarr/Neuroglancer version is mentioned in the paper but its paths were not
  verified.'
technical:
  method: sample
  size_source: file-listing
  layout:
