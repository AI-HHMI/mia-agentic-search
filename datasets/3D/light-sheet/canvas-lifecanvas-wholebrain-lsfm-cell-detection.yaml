      in the GFAP ROI checked; its meaning is not documented.'
  notes: 'Exact recursive listing of the http index (11,445 files, 1,437,690,570,501 bytes). Each brain is offered twice (folder
    and one .tar of 65-180 GB, no range requests), so size_bytes is one copy: folders + CSVs + licenses = 718,840,880,901
    bytes (the tars sum to 718,849,689,600). Probed slice 000000 of NeuN, GFAP and IBA1 (uint16, LZW, single page, no calibration;
    the paper says zlib). Sampled the NeuN slice (8.96 MB): min 0 max 2372 mean 1.35 (edge slice, mostly background; one sample).
    Read two CSVs: NeuN region2 1,766 rows (label 1), GFAP region1 1,944 rows (label -1). label/TEST/ folders are empty.'
