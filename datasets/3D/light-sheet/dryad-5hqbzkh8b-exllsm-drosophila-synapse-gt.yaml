notes: 'Dryad API file listing (version 3, 63 files, 6.06 GB): 31 RAWDATA.nrrd files each with a SYNAPSEMASKS.nrrd or SYNAPSES.nrrd mask
  (1 MB to 250 MB each) plus README.txt. License CC0-1.0 from the Dryad API record (the landing page only says licensed for reuse).
  Paper (eLife 2022, open access, Methods read): ground truth from 100^3 and 500^3 pixel crops of BRP staining, sites segmented
  semi-automatically in VVD Viewer then manually inspected, over 10,000 sites from 25 brains; 8x expansion. The paper gives the
  acquired voxel size 104 x 104 x 180 nm for ExLLSM image volumes (in expanded tissue; effective resolution about 30 x 30 x 100
  nm) - the file headers were not read, so the voxel size is taken from the paper and may not match every crop. nrrd is not
  a listed format, so formats is other. Whether masks are binary or labelled sites was not checked.'
