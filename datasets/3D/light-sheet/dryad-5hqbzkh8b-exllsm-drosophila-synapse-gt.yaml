title: Drosophila brain presynaptic site ground truth for expansion lattice light-sheet microscopy (ExLLSM, nc82/BRP)
short_name: Drosophila brain presynaptic sites (ExLLSM)
description: Ground truth used to train the U-Net synapse classifier of the ExLLSM circuit reconstruction pipeline of Lillvis et al.
  2022. Raw image crops of Bruchpilot (nc82 antibody or STaR-BRP) labelled Drosophila brain regions imaged at 8x expansion with lattice
  light-sheet microscopy, each paired with a presynaptic site mask. 31 raw/mask pairs from antennal lobe, ellipsoid body, lateral horn,
  mushroom body, optic lobe and protocerebrum; more than 10,000 sites from 25 brains.
