title: Spheroid light-sheet dataset with nuclei centroid annotations (LN18-RED and SH-SY5Y)
short_name: Spheroid nuclei centroids (light-sheet)
description: Light-sheet (Leica TCS SP8 Digital LightSheet) volumes of SiR-DNA-stained, cleared SH-SY5Y and LN18-RED spheroids,
  cut into 256 x 256 x 46 voxel TIFF patches with one CSV of nuclei centroids per patch. SH-SY5Y has 30 training and 18 test
  patches with manual centroids placed in napari; LN18-RED has a large pretraining set of patches with weak centroids from
  a seeded-watershed pipeline. Preprocessed whole-spheroid TIFFs are included for reference.
