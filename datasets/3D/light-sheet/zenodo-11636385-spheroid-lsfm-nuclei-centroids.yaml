notes: 'Size is the sum of the two zip files on Zenodo (dataset_upload.zip 18.73 GB, preprocessed_images.zip 13.88 GB). The
  outer zip holds nested zips (SH-SY5Y/train.zip, SH-SY5Y/test.zip, LN18-RED pretrain patches, patches_binary, points_csv);
  their members were not listed, so TIFF patches and CSV points come from the Zenodo description folder tree, not a file listing.
  Voxel size 0.3594 x 0.3594 x 1.9999 um is from the Zenodo description and the preprint. Patch counts: 30 SH-SY5Y training
  and 18 test patches manually annotated; 2,373 LN18-RED pretraining patches with weak watershed centroids (preprint). Manual
  annotation covers only SH-SY5Y; annotations are therefore mixed. The journal paper is paywalled, so Methods were read from
  the bioRxiv preprint. Pixel size was not checked in file headers.'
