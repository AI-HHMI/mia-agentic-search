notes: 'Unannotated by design (self-supervised use, per the source challenge S-BIAD1197). Zip listing via peek_archive: 1000
  patch_*.nii.gz in Vessels/patches/sample3_C00 and sample3_C01 plus 2 extraction_metadata.json. Voxel size is the nominal
  acquisition resolution of the source BioStudies study S-BIAD1197 (blood vessels: 1.625 um x/y, 3 um z step); whether patches
  were resampled is not stated. Organism also from S-BIAD1197. Associated challenge paper (Zenodo 10.5281/zenodo.10991463)
  not consulted in this run, so not listed. Sibling of the existing nuclei record zenodo-19020760-selma3d-nuclei-unannotated;
  different structure and samples. Single 34 GB zip.'
