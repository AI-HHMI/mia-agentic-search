  notes: 'Listing: Zenodo API (1 zip, exact) plus the zip central directory (1000 .nii.gz, 2 json). Probed sample3_C00/patch_0000 (8 MB read). Sampled sample3_C01/patch_0000 (27.8 MB): 250x250x250 float32, integer values 3-65437 (one sample; p50 730, p99 26470), no zeros; looks like 16-bit intensities stored as float; the deposit does not say whether they were rescaled. NIfTI zooms 1.0,1.0,1.0 (no calibration). Voxel size 1.625x1.625x3 um is from S-BIAD1197 "Image acquisition - blood vessel images" (nominal; re-read this run); the deposit does not say whether the patches were resampled. axes zyx from the probe (NIfTI xyz on disk, reported slowest-first). No labels by design (self-supervised). tools/sample.py rejects Zenodo .../files/<name>.zip/content specs (path does not end in .zip); sampled via https://zenodo.org/records/19020812/files/Vessels.zip instead.'
