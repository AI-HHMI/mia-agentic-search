    found in the headers. Sample (first slice of TH_neurons sample1, likely the volume edge): 0..449, mean 4.9,
    p99 24 (hint: 12-bit range); not representative of the stack interior. Second pass 2026-10-07: re-probed cell_nucleus/sample3/C01/C01_0000.tif
    and re-sampled TH_neurons/sample1/slice_0000.tif (same results); read all 7 tsv file lists (35,967 paths, all
    under microscopy_image/microscopy_image/; the earlier brain_microscopy_image/ tree line was wrong) and set a
