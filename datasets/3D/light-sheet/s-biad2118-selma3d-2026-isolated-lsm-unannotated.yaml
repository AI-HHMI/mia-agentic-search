notes: 'Released explicitly as the unannotated self-supervised training set of SELMA3D 2026, so usable without labels. size_bytes
  and n_items (35,967 TIFF slices) are the sums over the 7 per-structure JSON file lists in Files/ (7 images categories; 30
  images per the API record). Voxel size varies per image (xy 0.54-1.87 um, z 2-6 um per record) and is not given per file,
  so left null. No linked paper on the record. Differs from companion sets: S-BIAD3281 (patches cropped from these images),
  S-BIAD2119 (contiguous structures, unannotated), S-BIAD2110/2106 (annotated).'
