notes: 'Released explicitly as the unannotated self-supervised training set of SELMA3D 2026, so usable without labels.
  size_bytes and n_items (35,967 TIFF slices) are the sums over the 7 per-structure JSON file lists in Files/ (7
  images categories; 30 images per the API record). Voxel size varies per image (xy 0.54-1.866 um, z 2-6 um per
  the API image acquisition sections) and is not given per file, so left null. No linked paper on the record. enricher:
  two slices probed (uint16 LZW TIFF, 7322x8584 and 13307x17238) and one sampled (see technical). organisms (BioStudies
  Biosamples; folders matched by structure name): Mus musculus = c-Fos_brain_cells/, Ab_plaques/, TH_neurons/, GFAP_astrocytes/;
  Homo sapiens = cell_nucleus/, Collagen2_collagenous_structure/ (chondrocyte), SOX9_chondrogenic_cell/. enricher:
  modality widefield added: the API says TH_neurons and GFAP_astrocytes were imaged wide-field on a Keyence BZ-X810;
  the rest on LaVision UltraII / light-sheet.'
