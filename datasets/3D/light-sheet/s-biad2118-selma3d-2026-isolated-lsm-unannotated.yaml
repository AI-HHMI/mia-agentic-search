  notes: 'Each 3D image is stored as a folder of single-page 2D TIFF slices (z stack), so arrays describe one slice.
    Directory index and the per-structure tsv lists read; the 35,967 files were not listed recursively, so size
    stays page-stated (sum of the json file lists). Probes: TH_neurons/sample1/slice_0000.tif uint16 7322x8584 LZW;
