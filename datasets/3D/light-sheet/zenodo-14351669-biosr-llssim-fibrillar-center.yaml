  notes: 'Zenodo listing plus zip central directory: 276 members (46 cells x 6 mrc), 19,628,590,342 B
    compressed, complete. MRC headers (Cell001): raw SNR1 uint16 453x512x256 (nz x ny x nx), space group
    0 (image stack), header min/max/mean unset, cell-dimension voxel size implausible (~0.01 nm, unset);
    GT float32 151x768x384, same header caveats. Axes left null because the raw z axis interleaves planes
    and phases. sample.py downloaded both members (211,348,682 B, logged) but its output was not captured,
    so no value ranges are recorded and method stays header. maintainer 2026-10-06: voxel size 92.6x92.6x390.6
    nm is the raw acquisition grid, from the MRC header (words 11-13 hold the pixel size in um, per the
    authors'' func_deskew.m; probe.py misreads them as A) and the paper''s 0.39 um sample-piezo step.
    The stacks are not deskewed, so z is the scan step in the skewed frame. GT_LLS_SIM.mrc targets are
    61.73 nm laterally (1.5x upsampled), same z.'
