notes: 'Zenodo record has a one-line description and no linked paper; web search found none. Contents are from listing the
  3.9 GB zip (25 files: Raw Data.tif 763x2048x2048 uint16, Transformed Raw Data.tif, Instance Segmented Transformed Raw Data.tif
  140x480x280, a Original Size instance TIFF, 10 training slices with _seg.npy, one Cellpose model file) and TIFF header probes.
  Pixel/voxel size, what Transformed means (likely a deskew or resample), who made the labels and how are not stated in any
  source checked (record, headers). The raw TIFF has an unstated page axis. Only 10 slices are hand-labelled training data,
  the 3D instance volume is probably model output (source unknown). Single volume, so size is at the lower limit. enricher:
  transformed volume axes zxy from the training-slice shapes; labels hold 623 instance ids (sampled).'
