description: 'Paired lattice light-sheet (LLS-SIM) volumes of Fibrillarin (HeLa, label FBL-mEmerald):
  for each cell five raw stacks at increasing fluorescence/SNR levels plus a ground-truth LLS-SIM volume
  reconstructed from the highest-SNR raw data, for training denoising and super-resolution networks. One
  of the ten BioSR for LLS-SIM specimen datasets.'
