notes: 'No paper is cited in the BioStudies record and none was found by title search in Europe PMC; authors are not listed
  in the record text read, so authors is empty. The annotations are Arivis Vision4D project files (proprietary .sis/.objects),
  not standard mask images; the exported -features.xlsx tables hold the measured outlines. Pixel size is not stated (2X objective,
  zoom 0.63, 1 µm z step; 62-64 max-projection planes per brain after resampling), so voxel size is null. Listing from the
  FTP index: 35 zip archives (about 31.4 GB, sizes rounded from the index) in Adult Brains/ (conventional and germ-free,
  females and two male batches, with contour annotation zips) and P8 Brains/ (control and hydrocephalus), plus results .xlsx
  files; the first brain zip (Female Conv 1) holds 128 TIFF planes plus the Arivis files. Annotation present only where an Arivis
  .objects file is included.'
