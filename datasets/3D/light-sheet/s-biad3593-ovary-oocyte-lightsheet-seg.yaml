short_name: Mouse ovary oocytes (light-sheet, DDX4)
description: SPIM (Luxendo MuVi) volumes of cleared whole adult mouse ovaries (5 to 60 weeks) stained
  with a DDX4 antibody for oocytes, released with the ovarian reserve aging study. The raw whole-ovary
  images are in BioImages; a labelled oocyte_training archive holds raw and label TIFF pairs (train and
  validation) used to train the BiaPy oocyte instance-segmentation model.
