notes: 'The labelled training set is a zip on a personal SharePoint link (listed with peek_archive: 240.9 MB, 146 TIFFs = train/raw
  67, train/label 67, val/raw 7, val/label 7), so the link may not be permanent. The permanent records hold raw data only:
  BioImages S-BIAD3593 (CC BY 4.0, 7 files, released 2026-08-09) and Zenodo 10.5281/zenodo.19085211 (raw_ovary.rar, 13.0 GB,
  one ovary each at 5, 10, 22, 30, 40, 50, 60 weeks, plus a checkpoint). The CC BY 4.0 license was read on those records; the
  labelled archive itself states none. The torch-em docs list 66 training volumes; the archive has 67. The paper says oocytes
  were segmented manually in 3D SPIM volumes to train a BiaPy model; pixel size 0.867 um and 2.5 um z spacing come from the
  paper Methods (Luxendo MuViSPIM, 10x), and the shape of the training TIFFs was not checked.'
