notes: 'The Zenodo record is a code snapshot (delivr_cfos v1.0.0) whose zip holds training_data/: microglia raw+gt (160 .nii.gz each), cFos raw (48) and gt (41; pairing not confirmed), listed with peek_archive. Paper Methods: c-Fos brains on UltraMicroscope II, 1.625 um xy, 6 um z, 48 VR-annotated 100^3 patches (5,889 cells); microglia on Blaze 12x, 0.54 um xy, 161 patches (3,798 somata). Voxel size null: two sub-datasets differ. Annotated in VR (syGlass), manual. Code is MIT; record states CC-BY-4.0. Whole-brain scans (S-BIAD1019) are separate; GitHub copies not accessible here.'
