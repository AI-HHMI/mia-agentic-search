notes: 'Released explicitly as the unannotated self-supervised training set of SELMA3D 2026, so usable
  without labels. size_bytes and n_items are the sums over the 7 per-structure *_patches.json file lists
  in Files/ (17,470 .nii.gz patches, matching the counts on the record). Voxel size varies by image (xy
  0.54-1.87 um, z 2-6 um per record) and is not given per file, so left null. No linked paper. Differs
  from companion sets: S-BIAD2118 (the large source images), S-BIAD3277 (contiguous-structure patches),
  S-BIAD2110 (annotated isolated patches). enricher: NIfTI format confirmed from headers; HTTP index lists
  17,484 files (patches + 14 json/tsv lists); one patch sampled.'
