notes: 'Released explicitly as the unannotated self-supervised training set of SELMA3D 2026, so usable without labels.
  size_bytes and n_items are the sums over the 7 per-structure *_patches.json file lists in Files/ (17,470 .nii.gz
  patches, matching the counts on the record). Voxel size varies by image (xy 0.54-1.866 um, z 2-6 um per the API
  image acquisition sections) and is not given per file, so left null. No linked paper. enricher: NIfTI format confirmed
  from headers; HTTP index lists 17,484 files (patches + 14 json/tsv lists); one patch sampled. organisms (API Biosamples;
  folders by structure name): Mus musculus = c-Fos_brain_cells/, Ab_plaques/, TH_neurons/, GFAP_astrocytes/; Homo
  sapiens = cell_nucleus/, Collagen_Chondrocytes/, Sox9_Chondrogenic_cells/. enricher: widefield added: API says
  TH_neurons and GFAP_astrocytes were imaged wide-field (Keyence BZ-X810).'
