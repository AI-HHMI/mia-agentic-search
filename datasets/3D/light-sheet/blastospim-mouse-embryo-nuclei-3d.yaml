notes: 'License/terms not stated on the dataset site (main/series pages) or in the preprint text; the CC BY-ND 4.0 link in
  the preprint covers the article, not the data. Pixel size from the site (0.208 um xy, 2.0 um z). Archives (peeked: BlastoSPIM1_val.zip,
  BlastoSPIM2_val.zip) contain per-embryo folders with images/*.npy and masks/*.npy (plus crop/*.npy for BlastoSPIM 1); .npy
  is not a listed format so formats=[other]. Total download size not stated. Microscope model not named; the preprint (bioRxiv
  2023, later Development 151(21):dev202817) calls it selective plane illumination microscopy. Also annotated in the paper:
  10 spinning-disk embryos (461 nuclei), not confirmed as part of the downloads.'
