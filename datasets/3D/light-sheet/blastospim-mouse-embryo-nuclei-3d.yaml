schema_version: '1.2'
id: blastospim-mouse-embryo-nuclei-3d
title: 'BlastoSPIM: 3D nuclear instance segmentation ground truth for preimplantation mouse embryos'
short_name: Mouse embryo 3D nuclei segmentation (light-sheet)
description: Light-sheet (SPIM) 3D images of live preimplantation mouse embryos expressing the nuclear reporter H2B-miRFP720,
  with manually annotated 3D nuclear instance segmentation. BlastoSPIM 1.0 has 573 annotated 3D images (31 embryos, 11,708
  nuclei, 116 polar bodies; 8- to 64-cell stages) and BlastoSPIM 2.0 has 80 annotated late-stage images (25 embryos, 6,628
  nuclei; 64- to >100-cell stages). Train, validation and test (low and moderate SNR) archives are provided.
