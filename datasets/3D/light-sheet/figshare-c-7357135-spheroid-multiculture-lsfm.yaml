notes: 'Figshare collection of 20 articles (365 files, 168.55 GB in total): 18 stacks groups named <tumour>_<time>[_dox] (one
  16-bit multi-TIFF per spheroid and channel, 38-90 z-sections of 2048x2048, ~0.5 GB each), Maximum_Intensity_Projection_images_and_masks
  (MIP zip 864 MB with MIP_masks.zip 0.5 MB) and Tumour-stroma_spheroid_multicultures_features (CSV/XLS morphology). Masks are
  2D whole-spheroid outlines drawn by an expert on the 1683x1683 MIPs (0.175 um pixel), not single-cell labels, despite the title.
