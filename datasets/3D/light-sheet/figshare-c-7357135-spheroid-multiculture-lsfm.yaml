title: Single-cell light-sheet fluorescence 3D images of tumour-stroma spheroid multicultures
short_name: Tumour-stroma spheroids 3D light-sheet
description: 90 light-sheet (Leica TCS SP8 DLS) 3D stacks of tumour-stroma spheroid multicultures (T-47D, A375 or MG-63
  tumour cells with MRC-5 fibroblasts and EA.hy926 endothelial cells), control or doxorubicin-treated, imaged at 24, 48 and
  96 h in four channels (nuclei, endothelial, tumour, fibroblast). Includes maximum-intensity projections with manually
  drawn whole-spheroid binary masks and extracted morphological features.
