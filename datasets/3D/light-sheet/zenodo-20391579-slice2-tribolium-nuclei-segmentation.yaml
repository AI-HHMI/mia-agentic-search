notes: 'v2 holds 16 segmentation zips (2.1 GB), one per SLICE-2 dataset; blastodermal nuclei segmented
  in 14 datasets, serosa nuclei in 7 (paper). Only DS0012 and DS0003 were listed: each has one time point
  (Arivis .sis/.objects/.metadata, 3D TIFF, NucleiCoordinates.xlsx). Masks are in proprietary Arivis files,
  so only the coordinate tables are open-format; no label TIFFs were seen. Manual segmentation (Arivis
  Pro), reviewed by a second researcher. Voxel size: raw lateral 0.645 um, axial 2.58 um (paper); fused
  isotropic voxel size not stated, so z is null. Raw SLICE-2 images are separate Zenodo records. v1 had
  duplicated nuclei positions, fixed in v2. enricher: all 16 zips listed (108 members); open-format labels
  are the per-nucleus coordinate tables only.'
