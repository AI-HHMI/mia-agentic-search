  notes: 'listing.py (Zenodo + 16 zip directories): 16 files, 2,132,289,406 B exact (= size_bytes), 108
    members: 24 .TIF, 21 .xlsx, 21 each of .sis/.objects/.metadata. probe.py could not parse the deflated
    TIFF member; a range-read zip script extracted it (8.2 MB) and the coordinate table (0.13 MB). TIFF:
    1000 pages of 600x600 uint16, Adobe deflate (32946), no calibration; 99.3% zeros (masked or cropped
    embryo), nonzero values 315-65535 with 3,991 distinct values, p50 25,004 - so intensities saturate
    at 65535 (hint only, normalization unknown). XLSX sheet1 spans A1:D3610 (about 3,609 nuclei, 4 columns,
    names Nucleus_0001...). No open-format instance masks were seen. Values are from one dataset (DS0015).'
