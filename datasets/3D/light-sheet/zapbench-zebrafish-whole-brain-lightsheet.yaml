  - role: label
    path_pattern: 20240930/annotations/*/labels/rechunked
    format: zarr
    axes: xyz
    shape:
    - 100
    - 100
    - 288
    shape_varies: true
    dtype: uint64
    compression: blosc
    encoding: instance-ids
    alignment: same-grid
    alignment_notes: manual neuron instance labels, same shape and units as anatomy/clahe of the same subvolume
      (pair by subvolume folder). labels/raw holds the original annotation at 2x (203 x 203 x 500 nm, e.g. 200x200x602);
      labels/filtered equals rechunked in the two subvolumes sampled
  notes: 'Listing: GCS JSON API (folder prefixes, every zarr.json under annotations/); not a full object listing
    (raw alone has ~6.8 M chunks), so size is estimated. Sampled whole: subvolume_1 anatomy/clahe uint16 100x100x288
    range 182-63506 (mean 9848); labels/rechunked uint64 593 ids, 87 % background, 240 of 288 z slices labelled;
    eval_subvolume_1: 50x50x288, range 311-62413, 112 ids, 115 z slices labelled (custom zarr script, ~65 MB uncompressed).
    value range from these samples only; the folder name says CLAHE (contrast-limited adaptive histogram equalization)
    but no doc states the processing, so normalization unknown. The anatomy subvolumes are 406 x 406 x 1000 nm while
    imaging.voxel_size_nm (406 x 406 x 4000) is the raw/segmentation grid: take scale from each zarr.json. Direct
    access: zarr stores on storage.googleapis.com (not on the TensorSwitch allowlist); gsutil also works. size estimated
    (uncompressed): raw 1 x 2048x1328x72x7879 uint16 + label 1 x 2048x1328x72 uint64 + raw 11 x 100x100x288 uint16
    + label 11 x 100x100x288 uint64 = 3,087,639,641,088 B (3.1 TB); shapes vary, so approximate; other arrays in
    the bucket (aligned, df_over_f, anatomy, ...) not counted.'
