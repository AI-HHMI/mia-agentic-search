schema_version: '1.2'
id: zapbench-zebrafish-whole-brain-lightsheet
title: ZAPBench - larval zebrafish whole-brain light-sheet activity volumes with neuron segmentation
short_name: Zebrafish whole-brain activity (light-sheet)
description: Whole-brain calcium-imaging (GCaMP) light-sheet recording of a larval zebrafish, 2048x1328x72 voxels
  over 7,879 timepoints (406 x 406 nm x 4 um xy-z, 0.914 s per volume), released as Zarr v3 with motion-aligned
  and dF/F volumes, a higher-z-resolution anatomy volume, about 2,000 manually annotated neurons (training/eval
  subvolumes) and a flood-filling-network voxel-level segmentation of about 70,000 neurons. Built as the ZAPBench
  neural activity forecasting benchmark with per-condition train/validation/test splits.
