notes: 'Hosted on a public Google Cloud Storage bucket (gs://zapbench-release/volumes/20240930/, also via storage.googleapis.com and gsutil), hence repository other. Arrays (zarr v3): raw uint16 2048x1328x72x7879 xyzt at 406 nm x 406 nm x 4 um x 0.9141 s (from zarr.json), aligned, df_over_f, anatomy (1 um z per paper), segmentation uint64, mask, traces, annotations/subvolume_1-3 and eval_subvolume_1-8. License CC-BY 4.0 per the README (GitHub code Apache-2.0). Paper: about 2,000 neurons were manually annotated (CellMap Project, Janelia) to train a one-shot flood-filling-network segmentation of about 70,000 neurons, so source is mixed and coverage partial. Total size not stated and the bucket listing was truncated, so size_bytes is null. Main purpose is activity forecasting; usable for segmentation and calcium-imaging work. Paper read as the arXiv PDF (appendix B); no DOI found.'
