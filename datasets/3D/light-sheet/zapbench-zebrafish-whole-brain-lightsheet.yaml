notes: 'Hosted on a public GCS bucket (gs://zapbench-release/volumes/20240930/), hence repository other. Zarr v3
  arrays: raw uint16 xyzt 2048x1328x72x7879 at 406 nm x 406 nm x 4 um x 0.9141 s; segmentation uint64 on the same
  xyz grid; anatomy 2048x1328x288 at 1 um z; aligned, df_over_f, mask, traces. License CC-BY 4.0 per the README.
  Paper: about 2,000 neurons manually annotated (CellMap, Janelia) to train a flood-filling-network segmentation
  of about 70,000 neurons. source mixed: annotations/subvolume_1-3 and eval_subvolume_1-8 labels are manual, segmentation/
  is automatic (FFN). enricher: voxel_size_nm is the raw/segmentation grid; the annotation subvolumes are 406 x
  406 x 1000 nm (their zarr.json dimension_units). enricher: channels 1 (single-channel raw zarr). Paper read as
  the arXiv PDF; no DOI found.'
