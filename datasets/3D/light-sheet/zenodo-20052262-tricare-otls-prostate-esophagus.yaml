title: Deep-learning triage of 3D pathology datasets for comprehensive and efficient pathologist assessments
short_name: TRICARE 3D pathology prostate/esophagus (OTLS)
description: >-
  Open-top light-sheet (OTLS) 3D pathology images of prostate cancer biopsies and Barrett's esophagus
  endoscopic biopsies, released with the TRICARE triage model. For each annotated 2D level, neighbouring
  depth levels are included (about 80 um above and below for prostate at ~5 um intervals, about 40 um for
  esophagus at ~3 um intervals). Development and independent test cohorts are provided for each use case,
  with binary labels (normal_tissue / tumor_tissue) in spreadsheets.
