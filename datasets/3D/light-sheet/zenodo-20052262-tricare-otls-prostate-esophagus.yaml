notes: >-
  Labels are slide/image-level classification labels (majority opinion of a pathologist panel on one or two
  central levels per biopsy; 6 GU pathologists for prostate, 3 GI pathologists for esophagus), not pixel
  masks; the neighbouring depth levels are unlabelled context. Total ~191 GB in 28 files (Zenodo file list);
  part of the esophagus development cohort is hosted on Google Drive instead. Image file format inside the
  zip/7z archives could not be listed (peek_archive failed with an SSL error on the large zips), so formats
  is 'other'; the dataset page does not state it. Voxel size differs by cohort: prostate ~1 um isotropic
  sampling, esophagus 0.4 um isotropic (preprint Methods), so it is left null. Organism is not stated on the
  Zenodo page (clinical human specimens implied). Preprint states license for the paper as CC BY-NC-ND;
  the Zenodo record is CC-BY-NC-4.0. Items counts: prostate development CSV ~121 slides, test ~87.
