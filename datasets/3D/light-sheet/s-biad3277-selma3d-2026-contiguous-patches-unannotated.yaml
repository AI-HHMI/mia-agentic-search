notes: |-
  Explicitly released as the unannotated self-supervised training set of SELMA3D 2026, so usable without labels. n_items 19600 = patch count in the 10 per-structure file lists (confirmed by the enricher from the JSON file lists). Voxel size not stated on the record (varies per structure per the API record, e.g. axon 0.4x0.36x0.26 um); no linked paper. Companion sets: S-BIAD2119 (unannotated large volumes), S-BIAD2106/2110 (annotated).
  enricher: size_bytes 671,447,498,021 = sum of exact sizes in the 10 *_patches.json file lists plus 20 list files (was null).
  enricher: format nifti confirmed from headers.

  enricher: organisms (API Biosamples): Homo sapiens = NF_peripheral_nerve/, Beta3tubulin_cranial_nerve/, axonal_markers/ (human; API also lists a macaque brain biosample there, organism written as Mus musculus); Mus musculus = all other folders.
