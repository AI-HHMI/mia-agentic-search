notes: 'Explicitly released as the unannotated self-supervised training set of SELMA3D 2026, so usable
  without labels. n_items 19600 = sum of .nii.gz patch paths in the 10 per-structure TSV file lists (Beta3-tubulin
  1200, CTIP2 3300, NF 1050, P75 3150, PGP 1300, SMA 850, TH 2250, axonal 2500, brain vessel 2700, LYVE1
  1300); BioStudies text implies ~20,500 so the count may be approximate. Format inferred from .nii.gz paths
  in the file lists; patch files not opened. Total size and voxel size not stated on the BioStudies record
  (voxel sizes vary per structure, per the API record e.g. axon 0.4x0.36x0.26 um); no linked paper on the record
  (Publication section empty); challenge site not fetched. Companion sets: S-BIAD2119 (unannotated large
  volumes, pending), S-BIAD2106/2110 (annotated).'
