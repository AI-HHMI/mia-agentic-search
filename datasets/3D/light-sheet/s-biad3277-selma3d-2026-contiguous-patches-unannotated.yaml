  without annotations
short_name: SELMA3D unannotated 3D patches (light-sheet)
description: Cropped 3D patches from large light-sheet images of contiguous structures (brain blood vessels,
  arteries, peripheral and cranial nerves, lymphatic vessels, sympathetic nerves, cortical neurons, axons),
  released without annotations as the self-supervised training set of the SELMA3D 2026 challenge on 3D
  light-sheet image segmentation.
