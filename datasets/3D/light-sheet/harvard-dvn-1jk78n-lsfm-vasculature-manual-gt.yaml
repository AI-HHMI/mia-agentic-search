description: Three manually segmented light-sheet fluorescence microscopy stacks (gt_1 to gt_3) of the gel-BSA-FITC-stained, CLARITY-cleared mouse brain vasculature, used to calibrate the beta parameter of a Markov random field segmentation; the matching original stacks (Beta_calibration_1 to 3, 0.65 x 0.65 x 2 um voxels) and 16 region stacks are in a companion deposit.
