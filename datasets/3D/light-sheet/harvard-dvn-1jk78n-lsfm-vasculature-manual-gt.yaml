notes: 'Dataverse API listings of this deposit (19 files, 268 MB) and the companion raw deposit doi:10.7910/DVN/YS7WVW
  (19 files, 923 MB: Beta_calibration_1-3 and 16 region stacks, voxel 0.65 x 0.65 x 2 um); size_bytes
  is the sum of both. Pairing gt_i with Beta_calibration_i is inferred from the description and identical
  file sizes, not stated. The paper does not state a data availability link; its Methods describe gel-BSA-FITC
  staining, CLARITY and TDE clearing and a custom LSFM, and a manual segmentation of ROIs used to score
  an automatic method. Two more Di Giovanna deposits hold two-photon manual segmentation stacks of vessels
  (DVN/HNLS4B and DVN/THWOKH) and were not included. enricher: sampled Beta_calibration_1 is itself binary
  (uint8, 2 values) although described as native stacks, so gt_i may lack a raw intensity partner; region
  stacks are uint16 raw (confidence 0.65 -> 0.55).'
