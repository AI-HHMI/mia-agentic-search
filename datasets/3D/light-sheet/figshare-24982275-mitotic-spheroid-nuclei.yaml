title: Light-sheet images of 90 cleared cancer spheroids with mitotic nucleus masks
short_name: Spheroid mitotic nuclei masks (light-sheet)
description: Labels.tiff masks of dividing (mitotic) nuclei for 90 multicellular cancer spheroids (T-47D, 5-8F, Huh-7D12;
  five clearing protocols plus uncleared) imaged by light-sheet microscopy with DRAQ5-stained nuclei. The masks are on figshare
  article 24982275; the matching 16-bit multi-page TIFF z-stacks are in the separate figshare collection 12620078 (Diosdi et al.).
  Annotated by the napari-biomag-annotator authors as training data for segmenting mitotic nuclei in 3D.
