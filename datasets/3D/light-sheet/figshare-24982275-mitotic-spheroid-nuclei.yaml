notes: 'Masks (6.7 MB zip, files/44001744) and images (90 TIFFs, 44.4 GB total, figshare 10.6084/m9.figshare.12620078.v1,
  named CellLine_ClearingProtocol_SpheroidNumber) are separate figshare items; the mask folder names match
  the image names. The 12620078 deposit states copyright for academic research use and redistribution
  under GPL v3 or later. Pixel size 0.1437 um and 3.7 um z gap from the 12620078 description. Paper states
  878 objects were annotated as dividing cells and that only mitotic cells are labelled, hence sparse
  coverage. Size = images + masks. Paper (CC BY-NC-ND) full text from bioRxiv via tools/paper.py. enricher:
  download_url set to the landing page (no single archive; was the mask zip only).'
