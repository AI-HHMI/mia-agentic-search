notes: 'Harvard Dataverse record lists one file, AIMOS_LSFM.tar.gz (378 MB), CC0 1.0, released 2020-04-27 by Oliver Schoppe (TUM).
  The tar.gz could not be listed by this run (peek_archive reads zip only), so file names, array formats and annotation file
  layout are unverified. The AIMOS paper (Nature Communications 2020) states the light-sheet data were 15 mice at 6 um/voxel,
  each scan available native and with PI staining, and that volumetric data are handled as NIfTI (NiBabel), so formats nifti
  and the 6 um isotropic voxel size are taken from the paper, not from file headers; isotropy is an assumption of the stated
  single value. The record text lists brain, lungs, heart, liver, kidneys and spleen; the paper also mentions further organs
  for the CT sets, which are separate datasets.'
