notes: 'Harvard Dataverse lists one file, AIMOS_LSFM.tar.gz (377,953,705 bytes), CC0 1.0, released 2020-04-27 by Oliver Schoppe (TUM).
  The tar holds mouse_<n>/ folders with scan_native.nii.gz, scan_pi.nii.gz, GT.nii.gz and preview.png. The paper (Nat Commun 2020) says
  the light-sheet scans were acquired at 6 um isotropic resolution, but the deposited NIfTI volumes are only about 250 x 500 x 130 voxels
  per whole mouse, so they are downsampled and 6 um does not apply to them. Their headers carry the default 1.0 spacing with no units.
  enricher: voxel size removed (was 6000 nm isotropic, from the paper); channels 2 (native autofluorescence and PI, one file each).
  Class IDs 1-6 (Brain, Heart, Lung, Liver, Kidney, Spleen; 0 background) come from the AIMOS code (AIMOS_prepare_custom_data.py, dataset
  ''LSFM''). The CT sets are separate datasets.'
