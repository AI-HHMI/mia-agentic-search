  notes: 'tar.gz has no index, so it was read as a stream: two 60 MB prefixes (120 MB total), listing the first 10 members and sampling
    mouse_8/GT, mouse_5/scan_native and mouse_5/scan_pi. NIfTI shapes from nibabel are (x, y, z) = (250, 500, 129) for the mouse_5 scans
    and (250, 500, 137) for the mouse_8 GT. They are written here in zyx (slowest to fastest) order, so z varies between mice. Header
    zooms are 1.0 with unknown units. GT has 7 IDs (0-6). Value ranges come from one volume each. The member listing is incomplete (n_files
    unknown); the size is the exact file size from the Dataverse API (page-stated). TensorSwitch cannot take single members out of a tar.gz, so no sample file matches an array. Voxel size not set: the paper''s 6 um is the acquisition resolution, and the
    files are downsampled (a whole mouse in 500 voxels). Checked: NIfTI headers, Dataverse API metadata, paper full text (Methods, Data
    availability, Fig. 6), AIMOS README and code (no per-file spacing). The paper processed scans at 240 um/vx, but nothing says that
    is the deposited spacing.'
