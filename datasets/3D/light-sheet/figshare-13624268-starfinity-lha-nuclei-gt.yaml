notes: 'Figshare API: train.zip (101 MB) and model.zip (trained model, not data); CC BY 4.0. peek_archive of train.zip: train/images/A-F.tif paired with train/masks/A-F.tif (six volumes; macOS junk and two .smbdelete files ignored). Per the record, Paintera annotation at 0.23 x 0.23 x 0.42 um, then down-sampled 4x4x2 to 0.92 x 0.92 x 0.84 um for training; voxel_size_nm is that stated size in post-expansion units. Not confirmed whether zip volumes are down-sampled (headers not read). Preprint (Cell paper is not open access): Zeiss Lightsheet Z.1, 248 then 827 cells annotated from LHA, CEA and cortex of C57BL6/J mice; DAPI stains cytosolic RNA. No split provided.'
