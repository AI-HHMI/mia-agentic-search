    SM8_Epcam.tif, SM8_LL.tif, SM8_RU.tif. Samples read by range with a short tifffile/fsspec script:
    image page 107 (uint16 149-7066, mean 721; ~2 MB), mask SM8_LL page 23 ({0: 3497, 255: 1636}). Voxel
