      \   45 image stacks, 0.36-174 GB each\n    Mask/<specimen>_<lobe>[_<n>um].tif           101 per-lobe\
      \ binary masks\n    Mesh/<specimen>_<lobe|FULL|B<n>>.obj         90 meshes\n    Cleaned_CSV/<specimen>_<lobe>_clean[ed]_{edge_list,node_positions}.dat\
      \   216 graph files\n"
    n_files: 469
    listing_complete: true
