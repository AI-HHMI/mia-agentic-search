schema_version: '1.2'
id: s-biad2441-human-fetal-lung-lightsheet-airway-masks
title: Light-sheet images of developing human fetal lungs with airway segmentation masks, meshes and branching
  graphs
short_name: Human fetal lung airway masks (light-sheet)
description: 53 cleared whole-lung light-sheet stacks (E-cadherin, EpCAM or SOX9/SOX2 labelling, 1.63
  x 1.63 x 2 um voxels) of human embryos and fetuses at 6-12 post-conceptional weeks, with per-lobe binary
  airway masks, surface meshes (OBJ) and skeleton network graphs derived from a pixel-classifier or U-Net
  segmentation followed by manual mesh correction.
