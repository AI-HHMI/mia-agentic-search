notes: 'Licence CC BY-NC 4.0 (BioStudies record). Segmentation: Aivia pixel classifier (5-11 PCW) or a
  light-weight U-Net (older lungs), then OBJ meshes manually corrected in Meshmixer (proofread); masks
  are "binary mask from meshes", converted to an isotropic image volume. File lists: masks 101 rows mapped
  to source Biomarker images, meshes 90, graphs 216. No publication is listed. enricher: voxel_size_nm
  set to null (was 1630 x 1630 x 2000): it differs per specimen. Study text: typically xy 1.625 um, z
  step 3 um; SM8_Epcam.tif header 1.625 x 1.625 x 4.0 um; the file probed by the harvester 1.63 x 1.63
  x 2.0 um; masks 7 um isotropic (SM8 headers; some mask names say _4um or _7um). channels: 1 or 2 per
  Biomarker file.'
technical:
  method: sample
  size_source: page-stated
  layout:
