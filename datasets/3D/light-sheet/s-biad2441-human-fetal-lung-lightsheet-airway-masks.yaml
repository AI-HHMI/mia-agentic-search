notes: 'Licence CC BY-NC 4.0 (BioStudies record). Record text says 4X objective, xy 1.625 um, z step 3 um; the probed file header says 1.63 x 1.63 x 2.0 um, so the header is used and the difference is unexplained. Segmentation: Aivia pixel classifier (5-11 PCW) or a light-weight U-Net (older lungs), then OBJ meshes manually corrected in Meshmixer. File lists: masks 101 rows mapped to source Biomarker images, meshes 90, graphs 216. No publication is listed, so no paper was read. Probed: image uint16 1466 slices x 2 channels x 1878 x 1099; mask uint8 101 x 142 x 95 (per-lobe crop, apparently downsampled), so raw/mask grid alignment is not established.'
