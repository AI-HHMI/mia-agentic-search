    - 255
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: airway epithelium (lobe)
    alignment: unknown
    alignment_notes: One mask per lobe, named <specimen>_<lobe>; pairing with the image via the "Source
      study" column of Files list_masks (e.g. SM8_LL.tif -> SM8/Biomarker/SM8_Epcam.tif). Masks are rasterized
      from meshes as isotropic volumes (7 um in SM8 headers) and cropped to the lobe; the crop offset
      relative to the image is not stored, so they are neither on the image grid nor registered to it.
  notes: 'File list from the BioStudies files API (461 files with exact byte sizes, 1,478,536,819,896
