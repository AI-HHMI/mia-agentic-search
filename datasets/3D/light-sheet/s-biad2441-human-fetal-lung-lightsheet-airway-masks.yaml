    alignment_notes: 'SM8_Epcam.tif is an ImageJ stack whose 215 planes are stored as frames (probe axes
      tyx); they are the light-sheet z steps (study text: z-stack, header spacing 4.0 um), so zyx. Other
      Biomarker files hold 2 channels (harvester probe: 1466 x 2 x 1878 x 1099), so shape and channel
      count vary.'
  - role: label
    path_pattern: Lung Files/*/Mask/*.tif
    format: tiff
    axes: zyx
    shape:
