  notes: 'Listing: tools/listing.py --expand-zips on the Kaggle bundle (signed storage.googleapis.com redirect):
    50,014,512,872 B, 420 members, complete. Zip central directory CRC32s: all 42 file names have one CRC across
    the ten folders, so the bundle holds 21 unique pairs ten times. Headers read by decompressing the first 400
    KB of image_0 nucleus angle/fused and image_15 membrane angle/fused: BigTIFF, 860 x 731 px, 222 slices, uint16,
    no compression, ImageJ description with physical_size_x/y 0.195 um, z 1.0 um, unit um, channel nucleus/membrane.
