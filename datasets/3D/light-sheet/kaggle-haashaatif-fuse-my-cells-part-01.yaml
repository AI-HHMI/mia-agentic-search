notes: 'Third-party Kaggle re-upload of the Fuse My Cells challenge data (fusemycells.grand-challenge.org returned
  403, so the original host, license and the challenge data paper were not read). Kaggle API record (CC BY-SA 4.0,
  148 GB) and file listing (420 TIFFs in ten folders; the angle/fused pair is the input/target). Part 2 (haashaatif/fuse-my-cells-part-02)
  is the same size and lists CC BY-NC-SA 4.0, so the license is inconsistent between parts and the original terms
  should be checked. The fused volumes are produced by multiview fusion, so source automatic. Sample types and microscope
  are not stated on the page. enricher: the ten folders are byte-identical copies (same 42 names, sizes and CRC32),
  so 21 unique pairs (n_items was 210); voxel size 195x195x1000 nm from the TIFF ImageJ/physical_size header tags
  (was null); size_bytes is the bundle zip.'
