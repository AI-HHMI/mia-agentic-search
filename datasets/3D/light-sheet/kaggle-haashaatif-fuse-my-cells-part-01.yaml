notes: 'Third-party Kaggle re-upload of the Fuse My Cells challenge data (fusemycells.grand-challenge.org returned 403, so the original
  host, license and the challenge data paper were not read). Kaggle API record (CC BY-SA 4.0, 148 GB) and file listing (420
  TIFFs in ten folders, each 9 membrane and 12 nucleus pairs of equal size; the angle/fused pair is the input/target). Part 2
  (haashaatif/fuse-my-cells-part-02) is the same size and lists CC BY-NC-SA 4.0, so the license is inconsistent between parts and
  the original terms should be checked. The fused volumes are produced by multiview fusion, so source automatic. Voxel size,
  sample types and microscope are not stated on the page (a downstream arXiv paper resamples to 0.6 um isotropic, not the native
  size). Dimensionality and 3D arrays inferred from the challenge description and file sizes, headers not read.'
