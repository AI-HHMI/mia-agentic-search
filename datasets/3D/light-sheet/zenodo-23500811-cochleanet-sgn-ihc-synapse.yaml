notes: 'Newer Zenodo deposit than datasets/3D/light-sheet/zenodo-23478267-cochleanet-light-sheet-training.yaml: low-res SGN/IHC training
  zips plus three-annotator evaluation zips (5 files). enricher: voxel size set to null (was 380 iso): subsets differ (READMEs): *_evaluation
  380x380x380 nm; SGN-lowres 1887.779x1887.779x3000; IHC-lowres LV_M_* 1887.779x1887.779x3000, LV_Mar_01 3775.558x3775.558x6000, M_*
  about 1520x1520x3040. organisms: marmoset = LV_Mar_01_* crops in SGN-lowres_v1/ and IHC-lowres_v1/ (species name not stated, not listed);
  Mus musculus = all other files. annotations: manual except IHC-lowres M_* crops (automatic segmentation, downscaled); evaluation slabs:
  points in plane 10 of 20 only (partial). n_items 74 = 18 + 26 crops, 12 + 12 slabs, 6 Zarr crops.'
