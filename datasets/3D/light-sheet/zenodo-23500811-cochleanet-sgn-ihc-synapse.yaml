notes: 'Differs from datasets/3D/light-sheet/zenodo-23478267-cochleanet-light-sheet-training.yaml (earlier Zenodo deposit
  with the high-res SGN_v1, IHC_v1, synapses_v1 training zips): this newer Zenodo record (2026-10-20, CC-BY-4.0) lists different
  files, the low-res SGN/IHC training zips (SGN-lowres, IHC-lowres) and the three-annotator evaluation zips, and its description
  repeats the high-res zips, not yet listed when fetched. Peeked: SGN-lowres (18 image/label pairs, 15 train + 3 val), IHC-lowres,
  synapses_evaluation (6 Zarr crops + CSV points). Voxel size 0.38 um isotropic for the high-res/evaluation data (description,
  paper Methods); lowres sets are 1.888 x 1.888 x 3.0 um (README, not in TIFFs). Gerbil and marmoset crops exist; only Mus
  musculus listed since species names are unstated in sources read. Paper (bioRxiv, full text read) says data released on
  acceptance.'
