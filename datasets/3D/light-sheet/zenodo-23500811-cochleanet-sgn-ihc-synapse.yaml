short_name: Cochlea low-res SGN/IHC + consensus eval (LSFM)
description: 'Annotated 3D crops of cleared cochleae imaged by light-sheet microscopy: instance masks of spiral ganglion neurons
  (parvalbumin) and inner hair cells (Vglut3, Myo7a, calretinin), and point annotations of CtBP2 ribbon synapses, with training/validation
  splits, plus consensus annotations from three annotators for evaluation.'
