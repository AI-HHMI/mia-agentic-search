  notes: 'Zenodo listing: 1 zip, exact size, 294 .mrc members in 49 Cell<NNN> folders (6 files each).
    Probed Cell001: 5 raw stacks 363x512x256 uint16 and GT 121x768x384 float32, uncompressed MRC. Sampled
    SNR1 raw: 41..222, 12-bit-range hint (normalization none inferred: unclipped camera counts); GT -3797.06..16141.09
    float with negatives (reconstruction output); one cell only. MRC headers store 0.0926 / 0.0617 / 0.3906
    in the Angstrom field, likely um (92.6 nm raw, 61.7 nm GT lateral, 390.6 nm z), not used since no
    doc confirms them. Raw axes null: planes interleave z and SIM phases. First raw sample attempt hit
    a TLS error and was retried. maintainer 2026-10-06: voxel size 92.6x92.6x390.6 nm is the raw acquisition
    grid, from the MRC header (words 11-13 hold the pixel size in um, per the authors'' func_deskew.m;
    probe.py misreads them as A) and the paper''s 0.39 um sample-piezo step. The stacks are not deskewed,
    so z is the scan step in the skewed frame. GT_LLS_SIM.mrc targets are 61.73 nm laterally (1.5x upsampled),
    same z.'
