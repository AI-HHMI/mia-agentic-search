notes: 'From the Zenodo record (25 files: 12 TIFF, 12 CSV, one PDF) and the deliverable D2.3 PDF in the record, which gives the volume
  size (196 x 196 x 65 voxels = 128 x 128 x 130 um), the annotation procedure and 10,207 annotated nuclei. Species and the nuclear stain
  are not stated in the record or PDF, so organism and labels_stains are empty. No single archive; files are downloaded individually
  (download_url is the record). size_bytes sums all 25 files including the PDF. License is CC BY-NC. enricher: voxel size 650x650x2000
  nm from the Bladder TIFF ImageJ calibration (0.65 um, spacing 2.0 um; was 653x653x2000 computed from the PDF extent, which agrees);
  LymphNode TIFFs carry an uncalibrated 1 um default. CSV axis-0/1/2 = z/y/x in voxels.'
