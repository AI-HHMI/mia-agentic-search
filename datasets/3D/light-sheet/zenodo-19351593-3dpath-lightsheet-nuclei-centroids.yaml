title: Manually annotated light-sheet microscopy images
short_name: Bladder and lymph node nuclei points (light-sheet)
description: 12 small 3D light-sheet volumes (196 x 196 x 65 voxels, 16-bit TIFF, one nuclear-marker channel) of histological
  samples, 8 from bladder and 4 from lymph node, with manually annotated nucleus centroids (x, y, z) in a CSV per volume,
  10,207 nuclei in total. Annotated in Napari by trained personnel and reviewed by a second annotator. Created in the EU
  3DPATH project to train and evaluate nucleus detection.
