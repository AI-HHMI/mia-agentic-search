notes: 'From the Zenodo record (25 files: 12 TIFF, 12 CSV, one PDF) and the deliverable D2.3 PDF in the record, which gives
  the volume size (196 x 196 x 65 voxels = 128 x 128 x 130 um), the annotation procedure and 10,207 annotated nuclei. Voxel
  size is computed from that stated physical volume (about 0.653 um in x and y, 2.0 um in z), not stated per voxel. Species
  and the nuclear stain are not stated in the record or PDF, so organism and labels_stains are empty. There is no single
  archive; the files are downloaded individually from the record (download_url is null). size_bytes sums all 25 files
  including the PDF. The CSV header was read (index, axis-0, axis-1, axis-2); the TIFFs were not opened. License is CC BY-NC.'
