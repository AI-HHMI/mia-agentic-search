notes: 'Checked: arXiv abstract and HTML full text, project site (a JS app; the file index and LICENSE.md were read from the bucket at images.lightsheetdata.com), the NeuN_brain_5 folder listing (image/ TIFF slices, label/TRAIN and TEST, a ~99 GB .tar, LICENSE.md). Only the NeuN folder was listed; the other five folders were seen at top level only. The Europe PMC/bioRxiv tool could not find the paper (arXiv only). Voxel size 1.8x1.8x4 um is from the paper HTML as summarised by WebFetch. Total size is not stated: raw volumes are 65-140 GB compressed each. Annotation authorship/procedure not verified (source unknown). License is a custom LifeCanvas agreement: free for academic and non-commercial research only, no redistribution, commercial use needs a license, so it is not an open license; the dataset is freely downloadable without registration. Test-set annotations are not public. cFos covers one hemisphere only.'
