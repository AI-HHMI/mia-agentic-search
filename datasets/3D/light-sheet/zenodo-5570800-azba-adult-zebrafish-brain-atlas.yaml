notes: 'Atlas data: the labels annotate one average template, so there is a single labelled volume (one training pair at
  best); useful for registration and atlas-based segmentation more than for deep-learning training. Size is the sum of the
  Zenodo file sizes (13 average NIfTI volumes + segmentation; text files and ReadMe.pdf excluded). Voxel size of 4 um isotropic
  is from the paper (channels resampled to the atlas at 4 um isotropic); it was not checked in the NIfTI headers (files not
  opened). Per-file download links are on the Zenodo record (API lists files but they were not individually probed).
  Zenodo states CC0 while the paper data statement links CC-BY; the Zenodo license is used. Sources checked: Zenodo
  record and file list, eLife paper full text (Methods and Data availability; the paper cites Dryad, Zenodo hosts the same
  files).'
