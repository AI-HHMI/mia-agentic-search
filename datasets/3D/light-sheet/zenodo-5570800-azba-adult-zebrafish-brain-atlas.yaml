title: A 3D Adult Zebrafish Brain Atlas (AZBA) with 200+ manually segmented regions
short_name: Adult zebrafish brain atlas (light-sheet)
description: Average light-sheet volumes of cleared adult zebrafish brains (TO-PRO-3 nuclear stain, autofluorescence and
  twelve antibody/marker channels) registered to a common atlas space, plus one manual segmentation volume that delineates
  the brain into more than 200 neuroanatomical regions (NIfTI, with label descriptions and structure tree).
