notes: '28 raw/label stack pairs per the file lists (4 test, 22 train, 2 val; the paper says ground truth for 27 images).
  Labels were bootstrapped with ilastik multicut, proofread in Paintera and refined iteratively with PlantSeg (BioStudies
  annotation text). No license or terms were found on the BioStudies record, its JSON/TSV, or in the paper (the CC-BY text
  in the paper covers the article; the paper says all data are also on OSF https://osf.io/uzq3w, which was not opened). Voxel
  size 0.1625 x 0.1625 x 0.25 um is from the paper Methods for the movies; the file TIFFs are plain multi-page with no calibration
  (probed one raw file: uint8, 620x1330 pages; label uint16). Total size not computed.'
