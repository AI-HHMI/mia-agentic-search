notes: 'Part of the BioSR for LLS-SIM collection (isPartOf 10.5281/zenodo.14322457); the hub record zenodo-14920947 (open PR) holds the
  test data and models, and each specimen training set is its own Zenodo record, so this is a different dataset from the hub. Zip
  listing (peek_archive): 132 .mrc files, 22 cells x 6 files, 16.98 GB uncompressed. Ground truth is the conventional LLS-SIM reconstruction,
  not manual annotation. Voxel size left null: the MRC headers give implausible values (x/y 0.0062 nm for the GT file, 0.0093 nm for
  raw; z 0.0391 nm) and no pixel size is stated on the Zenodo record; the Nature Methods paper is not open access (Europe PMC lists
  the abstract only) so Methods could not be read.'
