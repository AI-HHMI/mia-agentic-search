title: BioSR for LLS-SIM - paired lattice light-sheet and LLS-SIM volumes of ER in metaphase HeLa cells
short_name: LLS-SIM super-resolution pairs, mitotic ER
description: One specimen subset (endoplasmic reticulum in HeLa cells in metaphase of mitosis) of the BioSR for LLS-SIM training
  collection. 22 ROIs (Cell001 onwards), each with five raw LLS-SIM stacks acquired at increasing light intensity (SNR1 to SNR5)
  and a ground-truth LLS-SIM volume reconstructed conventionally from the highest-intensity raw data, for training super-resolution
  and restoration networks.
