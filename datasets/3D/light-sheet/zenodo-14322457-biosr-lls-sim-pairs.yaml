notes: 'Parent record holds test data and pretrained models; each of the ten training sets is a separate Zenodo
  record (per-specimen DOIs in the parent description), roughly 230 GB in total. Listing the ER-mitotic-HeLa
  zip (14374080) showed 22 cells, each with Raw_LLS_SIM_SNR1-5.mrc plus GT_LLS_SIM.mrc, all MRC. Other zips were not
  listed. Voxel size and species are not stated on the Zenodo pages; the Nature Methods paper is not open access, so only
  its abstract was read. No manual annotations: the target is the LLS-SIM reconstruction.'
