title: BioSR for LLS-SIM (paired diffraction-limited LLSM and super-resolution LLS-SIM volumes)
short_name: BioSR LLS-SIM super-resolution pairs (light-sheet)
description: Paired diffraction-limited lattice light-sheet and super-resolved LLS-SIM volumes of ten subcellular
  structures (granular component, chromosomes, fibrillar center, fibrillarin, lysosome, microtubules, F-actin
  in pollen tubes, inner mitochondrial membrane, ER in Cos-7 cells and in mitotic HeLa cells), 30-50 ROIs each at
  five light intensities, with a test set and pretrained models in the parent record.
