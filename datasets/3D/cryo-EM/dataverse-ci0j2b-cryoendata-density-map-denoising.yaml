schema_version: '1.2'
id: dataverse-ci0j2b-cryoendata-density-map-denoising
title: CryoEnData - experimental cryo-EM density maps paired with PDB-derived label maps for denoising
short_name: CryoEnData cryo-EM map denoising pairs
description: Experimental single-particle cryo-EM density maps from EMDB (1 to 4 Angstrom resolution,
  resampled to 1 Angstrom voxels), each paired with a voxel-aligned noise-free regression label map and
  two classification label maps (structure versus background, and atom type) generated from the matching
  PDB atomic model, plus the PDB assembly and a simulated map. Intended for supervised training of cryo-EM
  map enhancement and denoising.
