notes: 'These are 3D cryo-EM reconstructions (density maps) rather than raw micrographs; included because they form supervised restoration pairs (experimental map versus noise-free label map) from a cryo-EM source. Labels are generated automatically from PDB atomic models, not annotated by hand. The paper says 650 maps; the Harvard Dataverse file listing fetched in this run holds 290 entries per file type (290 experimental maps, 290 PDB assemblies, 290 simulated maps and 290 of each of the three label map types, plus one zip, 7o71.zip, 114.6 MB) totalling 144.3 GB, so n_items is 290 as listed and the 650 figure could not be confirmed in the deposit. Voxel size 1 Angstrom (0.1 nm) is stated in the paper for every map (resampled with ChimeraX). The paper recommends splitting by resolution, as in Cryo2StructData; no split files are provided. The Dataverse license field reads CC BY 4.0.'
