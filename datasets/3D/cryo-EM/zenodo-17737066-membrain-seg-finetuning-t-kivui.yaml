notes: '20 .nii.gz patches (imagesTr 8 + imagesVal 2, labelsTr 8 + labelsVal 2) plus dataset_description.txt: 160^3 patches
  extracted at 7.92 A and rescaled to 10 A, so voxel_size_nm is the rescaled 1 nm. File names (6, 12, 16_2, 21) suggest four
  tomograms; count not stated. Paper full text unreachable (bioRxiv 429, Europe PMC 500, Nature Methods not OA), so how these
  labels were made is unverified: annotations.source stays unknown. The MemBrain-seg docs describe fine-tuning patches as
  manually corrected model predictions with an ignore label, not confirmed for this deposit. Labels mark every voxel, but
  about half are label 2 (ignore, excluded from training). enricher: formats nifti (was other); size_bytes from Zenodo file
  listing (was 151700000).'
