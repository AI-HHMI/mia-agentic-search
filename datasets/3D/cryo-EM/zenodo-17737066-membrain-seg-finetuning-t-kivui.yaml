  notes: 'Listed the Zenodo record and its zip (21 members, exact sizes). Probed one raw and one label member (headers); sampled
    the pair 16_2_patch2 (15.2 MB). value_range is from that one sample. Raw is float32 with mean -0.04 and std 0.27: not
    rescaled to [0, 1] nor standardized, and no doc says how it was normalized, so normalization unknown. Labels hold {0,1,2};
    the membrane/no membrane/ignore classes are named in the MemBrain-seg Annotations docs and the code uses ignore_label=2
    (0 = no membrane by elimination). NIfTI header zooms are 1.0 (mm default) and were ignored; voxel size 10 A from dataset_description.txt
    and the Zenodo description. Axes are the probe''s reading of the NIfTI header.'
