notes: 'Archive listing (peek_archive): 20 .nii.gz patches (imagesTr 8 + imagesVal 2, labelsTr 8 + labelsVal 2, about 15 MB per
  image) plus dataset_description.txt, which states 160^3 patches extracted at 7.92 A and rescaled to 10 A (voxel_size_nm is
  the rescaled 1 nm). Only 10 patches from a few tomograms (file names 6, 12, 16_2, 21 suggest four tomograms; count not
  stated). The MemBrain v2 paper (Nature Methods 2026) is not open access and the bioRxiv preprint was rate limited (429)
  in this run, so only the abstract was read: how these labels were made and the microscope/acquisition details are
  unverified, so annotation source is unknown. NIfTI is not in the schema format list, so formats is other.'
