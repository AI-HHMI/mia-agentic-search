notes: 'The page says Nicolas Rivron "has waived all copyright and related or neighboring rights" to the set; this is CC0-style wording, so spdx is CC0-1.0, but the page names no licence ID or URL. Image zip is 65.5 MB with two tif files (C0.tif and C2.tif, 132 MB each, listed with peek_archive); channel meaning is not stated on the page, so labels_stains is empty. The ground truth tif is a separate 88,085,681-byte file (HTTP HEAD). Only z spacing (0.5 um) is stated; xy pixel size is not on the page. No paper is linked (page says the set is to be evaluated in a publication to be submitted). It is a single annotated volume. Label encoding (instance IDs vs binary) was not inspected.'
