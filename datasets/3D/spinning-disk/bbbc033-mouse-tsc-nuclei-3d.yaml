short_name: Mouse TSC 3D nuclei (spinning disk)
description: 3D image of a clustered monolayer of mouse trophoblast stem cell nuclei from the Hubrecht
  Institute (Rivron lab), acquired on a PerkinElmer Ultraview VoX spinning disk combined with a Leica
  SP8 and a 63x immersion objective, 0.5 um between z-slices. The image set comes with a manually annotated
  and segmented 3D nucleus ground truth image.
