title: OpenCell on AWS (raw confocal images of endogenously tagged HEK293T lines)
short_name: OpenCell tagged HEK293T proteins (spinning disk)
description: 6,301 two-channel 3D spinning-disk confocal stacks (51 z-slices, 600 x 600 px, Hoechst nuclear stain plus an mNeonGreen-tagged protein) of live HEK293T cell lines, one library line per protein (about 1,300 genes), with a 2D projection TIFF for each stack. Released on the AWS Open Data program as the final OpenCell dataset; the paper describes manual protein localization annotation into 15 cellular compartments (Table S6, published with the paper, not in the bucket).
