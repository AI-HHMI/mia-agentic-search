notes: 'S3 listing complete: 12,602 TIFFs (6,301 *_stack.tif of 51 z x 2 channels x 600 x 600 uint16, ImageJ calibration 0.2 x 0.2 x 0.5 um, and 6,301 *_proj.tif 2-channel projections), 912.3 GB, one folder per gene (microscopy/raw/<GENE>_<ENSG>/). Probed one stack and one projection header only. Not a labelled set in the bucket: the localization annotations (15 compartments, 3 confidence grades, manual) are in the paper supplement (Table S6), which was not fetched, so annotations.present is false and annotations_verified false; usable for self-supervised training (the registry page says it supports training ML models on localization patterns; the cytoself model was trained on it). The paper text read (PMC author manuscript, first 100k characters) names 63x/1.47 NA spinning-disk confocal and 5 FOV per target (6,375 stacks reported vs 6,301 listed); vendor not stated. Registry license CC BY-SA 4.0.'
