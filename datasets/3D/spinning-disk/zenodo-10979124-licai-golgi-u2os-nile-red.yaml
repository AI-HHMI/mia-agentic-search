      the GFP channel is the ground-truth source, so raw and its target sit on the same grid in one file.'
  notes: 'Listing: Zenodo API + zip central directory, Golgi.zip 3,606,795,814 B exact, 41 TIFF members, all *_ALN.tif
    (7,701,697,102 B uncompressed). Sample: Upload/20210824-U2OS-NileRed-Golgi-004_ALN.tif (48.0 MB compressed in
    the zip; streamed and read with tifffile): ImageJ 1.53c hyperstack, ZCYX [16,3,1004,1004] uint16, uncompressed;
    channel ranges 0-9984, 55-11017, 0-2893 (one sample). No channel is binary; no mask files anywhere in the archive,
    so the ground-truth masks the paper trains on are not included. Voxel size checked: TIFF/ImageJ header, Zenodo
    API record (no description), LiCAI GitHub README, bioRxiv preprint and Nat Commun 2025 full text (resolution
