notes: 'Download page lists 13 tar.gz files (about 1.3-52 GB each, sizes printed as "Gb", total about 289 GB; not summed into size_bytes because units are ambiguous). Streaming the first members of timelapse_wt2_s2.tar.gz
  showed bf_tNNN.tiff files of 74,964,032 B, so TIFF is confirmed for that archive only; other archives were not listed. Paper: Zeiss spinning disk, 100x/1.25 W (0.108 um/px) and 63x (0.086 um/px); inputs
  were resized to 0.29 um isotropic for training, so the voxel size inside the archives is not stated and left null. Image counts and train/test split not stated on the pages. Terms: Allen Institute Terms
  of Use allow research and noncommercial use, citation required (custom). Targets are fluorescence images, not manual labels (source automatic). Differs from zenodo-3748967-fnet-hela-tom20-labelfree: different
  cells and data release.'
