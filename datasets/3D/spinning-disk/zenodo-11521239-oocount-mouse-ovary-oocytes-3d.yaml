notes: Only two example volumes (adult and perinatal ovary) are deposited, in nested zips (Example Data/Adult .zip 2.3 GB,
  Perinatal.zip 0.5 GB; peek_archive lists only the outer level), so the file list below comes from the README rather than
  a listing of the inner zips. Labels are StarDist model outputs, some manually corrected (-CORR files), not a hand-annotated
  training set; the manually annotated training images for the models are not part of this record. The same record also holds
  the StarDist 3D models and scripts. Voxel sizes come from the README (adult x/y 0.241 um, z 3 um; perinatal x/y 0.603 um,
  z 0.996 um); voxel_size_nm lists the adult values. Paper full text not open access (Europe PMC abstract only; bioRxiv 10.1101/2024.05.13.593993
  related).
