notes: 'Only two example volumes (adult 3 months, perinatal P3) are deposited, as nested zips (Example_Data_.zip > Adult .zip
  / Perinatal.zip, both deflated). Labels are StarDist model outputs, some manually corrected (-CORR files), plus APOC classes
  from sparse user annotation; the models'' hand-annotated training images are not deposited. The record also holds StarDist
  3D models and scripts. Voxel sizes differ per subset (README): adult x/y 0.241 um, z 3 um; perinatal x/y 0.603 um, z 0.996
  um. Paper full text not open access (bioRxiv 10.1101/2024.05.13.593993 related). enricher: voxel_size_nm set to null (was
  adult values 241x241x3000; the two volumes differ, see above). enricher: size from Zenodo file listing (zip + README).'
