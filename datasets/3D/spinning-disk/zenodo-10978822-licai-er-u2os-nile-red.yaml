notes: 'Archive listed with peek_archive; contents are TIFF stacks only. Zenodo page has no description; the title
  and the LiCAI GitHub README call it a training dataset for segmentation, and the preprint Methods say networks
  were trained on super-resolution images with ground-truth binary masks (manual annotation, or colocalization with
  organelle-GFP segmented by a pre-trained network), but no mask files were seen in the listing, so annotation source,
  coverage and format are unconfirmed. Sibling dataset zenodo-7724799 (mitochondria) stores fluo/ratio/label as
  separate TIFFs. Voxel size not stated on the Zenodo record, GitHub README or preprint text read. Preprint license
  is CC-BY-NC-ND vs. Zenodo CC-BY-4.0. enricher: sampled a stack: 3 intensity channels, no binary mask channel or
  mask files (annotations_verified stays false); annotations.source automatic (FG-net masks from the GFP channel,
  Nat Commun 2025 Methods); n_items 46 from listing.'
