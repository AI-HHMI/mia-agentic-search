      Channel order not stated (paper: green GFP colocalization, yellow 580-653 nm and red 665-705 nm Nile Red);
      the GFP channel is the ground-truth source, so raw and its target sit on the same grid in one file.'
  notes: 'Listing: Zenodo API + zip central directory, ER.zip 3,712,740,634 B exact, 46 TIFF members (8.59 GB uncompressed).
    Sample: Upload/20210820-U2OS-NileRed-ER-008_ALN.tif (60.7 MB compressed in the zip, deflate; read with tifffile):
    ImageJ 1.53c hyperstack, ZCYX [20,3,1004,1004] uint16, uncompressed; per-channel ranges 0-4360, 45-6552, 0-1331
    (one sample). No channel is binary; no mask files anywhere in the archive, so the ER ground-truth masks the
    paper trains on are not included. Header calibration: 10 px/micron (0.1 um = 100 nm in x, y) and spacing 0.3
    um (300 nm); not filled into voxel_size_nm because no document states it (sibling MITO record zenodo-7724799
    has 65x65x300 nm from the paper supplement, which conflicts in x/y). Voxel size checked: TIFF/ImageJ header,
    Zenodo API record (no description), LiCAI GitHub README, bioRxiv preprint and Nat Commun 2025 full text (Methods
    give resolution ~143 nm, FoV 1200 px, not the pixel size); Nat Commun supplementary information and peer-review
    file (PSF/resolution only, no pixel size).'
