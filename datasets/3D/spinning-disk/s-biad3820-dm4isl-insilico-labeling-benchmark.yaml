notes: 'Held-out test benchmark only (128 patches per organelle), not a training set; the paired brightfield/fluorescence patches can serve as in silico
  labeling pairs and the manual error flags as a model-evaluation label. Patch shape 16x64x64 uint8 from a TIFF header (axis order not stated in
  the file, probably z,y,x). Voxel size not stated in the BioStudies record, file headers or the GitHub README; the record cites the Allen Institute
  hiPSC acquisition (Viana et al. 2023, 120x spinning-disk confocal). The preprint full text could not be found in Europe PMC/Crossref (GitHub README
  says manuscript under review, bioRxiv 2026), so the paper was not read. Mitochondria set has no uncertainty or manual-error annotations. The
  GitHub code repository is CC BY-NC 4.0 whereas the BioStudies record states CC BY 4.0 for the data. Source images derive from the Allen Institute
  hiPSC pipeline_integrated_cell dataset.'
