notes: 'Held-out test benchmark only (128 patches per organelle), not a training set; BF/GT pairs serve as in silico labeling pairs, the per-patch manual
  error flags (metadata CSV) as an evaluation label. Mitochondria has no DDPMstd, uncertainty maps or error annotations. Code repo is CC BY-NC 4.0; BioStudies
  states CC BY 4.0 for the data. Paper (bioRxiv 2026, under review) not found in Europe PMC/Crossref. Patches derive from the Allen Institute hiPSC pipeline_integrated_cell
  FOVs, rescaled during data prep (MaskInterpreter data.md: z rescaling factor 3), so upstream voxel sizes do not apply. enricher: doi 10.6019/S-BIAD3820
  from the BioStudies API (was null); size and n_items (5888 TIFFs) from the BioStudies file lists (was 6056867633 / 5908).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "DM4ISL_BIA_submission/  (6 organelle folders, same layout)\n  Actin_filaments/Actin_filaments_metadata.csv   1 file\n  Actin_filaments/BF/  \
      \            128 files  8.8 MB  NNN_BF.tiff\n  Actin_filaments/GT/              128 files  8.8 MB  NNN_GT.tiff\n  Actin_filaments/DDPM/          \
      \  128 files  8.8 MB  NNN_DDPM.tiff\n  Actin_filaments/DDPMavg/         128 files  8.8 MB  NNN_DDPMavg.tiff (DM4ISL)\n  Actin_filaments/DDPMstd/ \
      \        128 files 33.9 MB  NNN_DDPMstd.tiff\n  Actin_filaments/GAN/             128 files  8.8 MB\n  Actin_filaments/UncertaintyMaps/ 128 files \
      \ 1.1 GB\n  Actin_filaments/Unet/            128 files  8.8 MB\n  DNA/ ...                          same 8 folders + DNA_metadata.csv\n  Microtubules/\
      \ ...                 same 8 folders + Microtubules_metadata.csv\n  Mitochondria/ ...                 BF, GT, DDPM, DDPMavg, GAN, Unet + csv (no DDPMstd,\
      \ no UncertaintyMaps)\n  Nuclear_envelope/ ...             same 8 folders + csv\n  Nucleoli/ ...                     same 8 folders + csv"
    n_files: 5894
    listing_complete: true
  sample:
    urls:
    - https://ftp.ebi.ac.uk/pub/databases/biostudies/S-BIAD/820/S-BIAD3820/Files/DM4ISL_BIA_submission/DNA/BF/000_BF.tiff
    - https://ftp.ebi.ac.uk/pub/databases/biostudies/S-BIAD/820/S-BIAD3820/Files/DM4ISL_BIA_submission/DNA/GT/000_GT.tiff
    size_bytes: 136564
    description: 'One DNA patch: brightfield input and ground-truth fluorescence target (16x64x64 uint8 each).'
  arrays:
  - role: raw
    path_pattern: '*/BF/*_BF.tiff'
    format: tiff
    axes: zyx
    shape:
    - 16
    - 64
    - 64
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 86
    - 239
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Brightfield 3D patch (model input).
  - role: target
    path_pattern: '*/GT/*_GT.tiff'
    format: tiff
    axes: zyx
    shape:
    - 16
    - 64
    - 64
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 1
    - 255
    normalization: unknown
    alignment: same-grid
    alignment_notes: 'Ground-truth organelle fluorescence patch for the in silico labeling task. Pairs by organelle folder and 3-digit stem: <org>/BF/NNN_BF.tiff
      <-> <org>/GT/NNN_GT.tiff (and NNN_<model>.tiff); row sample_id NNN of <org>_metadata.csv gives source FOV and crop x,y,z.'
  - role: other
    path_pattern: '*/{DDPM,DDPMavg,GAN,Unet}/*.tiff'
    format: tiff
    axes: zyx
    shape:
    - 16
    - 64
    - 64
    shape_varies: false
    dtype: uint8
    compression: none
    normalization: unknown
    alignment: same-grid
    alignment_notes: Model predictions (DDPM = standard diffusion model, DDPMavg = DM4ISL, GAN, U-Net); same stem as BF.
  - role: other
    path_pattern: '*/DDPMstd/*_DDPMstd.tiff'
    format: tiff
    axes: zyx
    shape:
    - 16
    - 64
    - 64
    shape_varies: false
    dtype: float32
    compression: none
    normalization: unknown
    alignment: same-grid
    alignment_notes: Per-pixel standard deviation across DM4ISL intermediate denoising steps (5 organelles).
  - role: other
    path_pattern: '*/UncertaintyMaps/*_UncertaintyMaps.tiff'
    format: tiff
    axes: null
    shape:
    - 128
    - 16
    - 64
    - 64
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 255
    normalization: unknown
    encoding: binary
    alignment: unknown
    alignment_notes: Binary uncertainty maps (values 0/255 in the sample); each file holds 128 x 16x64x64 pages, the meaning of the leading axis of 128
      is not documented.
  - role: label
    path_pattern: '*/*_metadata.csv'
    format: csv
    axes: null
    shape:
    - 128
    - 8
    shape_varies: false
    dtype: unknown
    compression: none
    encoding: other
    classes:
    - id: unet_manual_error
      name: manual substantial error in U-Net prediction (True/False)
    - id: dm4isl_manual_error
      name: manual substantial error in DM4ISL prediction (True/False)
    - id: uncertainty_evaluation
      name: TP / FP / FN / recovered / ood
    alignment: not-applicable
    alignment_notes: One row per patch (sample_id = file stem); columns sample_id, local_fov_name, x, y, z and the three annotation fields; empty for mitochondria
      per the study description.
  notes: 'Size 6,070,684,025 B = sum of the exact sizes in the six BioStudies file lists (5894 files); tools/listing.py could only read the HTTP index (FTP
    refused, rounded sizes, 6,055,958,321 B), so size_source is page-stated. Headers probed for DNA/000 of BF, GT, DDPMavg, DDPMstd, UncertaintyMaps, Unet:
    plain uncompressed TIFF, 16 pages of 64x64 (UncertaintyMaps 2048 pages = 128x16x64x64). Axes zyx from the docs (3D patches) and the 16 page count; the
    crop columns x,y,z in the metadata CSV. value_range from one sample (DNA 000: BF 86-239, GT 1-255 with 244 distinct values, i.e. intensities, not labels;
    UncertaintyMaps {0,255}, 99.6% zero). Voxel size not found; checked: TIFF headers (no calibration), BioStudies API (acquisition section quotes Viana
    et al. 2023 microscope only), file lists, metadata CSV, DM4ISL README, MaskInterpreter data docs (z rescaling during prep), paper (not found). No single
    archive: data.download_url stays the folder; direct per-file https URLs are in the listing.'
