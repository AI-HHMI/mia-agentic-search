schema_version: '1.2'
id: s-biad3820-dm4isl-insilico-labeling-benchmark
title: 'DM4ISL: Prediction Error Annotation and Uncertainty Benchmark Dataset'
short_name: DM4ISL in silico labeling benchmark (confocal)
description: Six organelle-specific held-out test sets (DNA, nuclear envelope, nucleoli, actin filaments, microtubules, mitochondria) of 128 paired
  3D brightfield and ground-truth fluorescence patches each (16 x 64 x 64 voxels, uint8), cropped from the Allen Institute hiPSC spinning-disk confocal
  dataset. Each set adds predictions from four in silico labeling models (DDPM, DM4ISL, GAN, U-Net); for five organelles also per-pixel standard-deviation
  maps, binary uncertainty maps and expert annotations of substantial prediction errors.
