short_name: hiPSC cardiomyocyte ACTN2 patterns (confocal)
description: Eighteen 3D spinning-disk confocal z-stacks (63x) of replated WTC-11 hiPSC-derived cardiomyocytes with
  endogenously mEGFP-tagged alpha-actinin-2, each with a matching bright-field stack, plus a manifest of 3,489
  expert point annotations (x, y, z) in five sarcomere organization classes (diffuse/other, fibers, disorganized
  puncta, organized puncta, organized z-disks).
