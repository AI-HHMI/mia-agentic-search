notes: 'Public S3 prefix s3://allencell/aics/cardio-classifier-brightfield/ holds 36 TIFFs (18 stacks, each as _gfp.tif and _brf.tif, 11.1 GB in total) and manifest.csv. One gfp TIFF was probed: uint16, 50 x 1736 x 1776, uncompressed. The manifest has 3,489 point rows over 18 ImageName values (C3 906, C1 727, C2 688, C0 596, C4 572). No README or paper link is in the folder. It is matched to Gerbin et al. (bioRxiv/Cell Systems) by the five class names and 18 z-stacks: the Methods describe an expert annotating regions of 18 representative ACTN2-mEGFP z-stacks by clicking points in Napari, five classes, a ResNet18 classifier; the preprint says 3,589 regions where the manifest has 3,489. Voxel size is from the preprint Methods (0.120 um xy, 0.33 um z, 63x spinning disk); the role of the bright-field stacks in the labels was not stated. Terms: Allen Institute terms of use (research or noncommercial use); no SPDX licence.'
