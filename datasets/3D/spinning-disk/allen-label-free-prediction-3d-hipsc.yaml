id: allen-label-free-prediction-3d-hipsc
title: Allen Institute label-free prediction training data (3D transmitted light to fluorescence)
short_name: Label-free 3D fluorescence prediction (hiPSC)
description: Paired 3D z-stacks of live human cells (mostly genome-edited hiPSC lines) imaged on a Zeiss spinning-disk microscope, with a transmitted-light channel (bright-field or DIC) and fluorescence channels (DNA, membrane, and an endogenously tagged subcellular structure). Released as 13 tar.gz archives, one per structure, to train transmitted-light-to-fluorescence prediction models (Ounkomol et al. 2018).
