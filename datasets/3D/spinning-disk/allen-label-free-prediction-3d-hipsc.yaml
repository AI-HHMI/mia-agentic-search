notes: 'Voxel size differs by subset (CZI headers, paper Methods: 100x 0.108 um/px, 63x 0.086 um/px, z 0.29 um):
  100x archives 108.3x108.3x290 nm; membrane_caax_63x 86x86x290 nm; dic_lamin_b1 172x172x290 nm (63x DIC, 924x624
  px); st6gal1 not read; so voxel_size_nm is null. The paper''s 0.29 um isotropic stacks are its own resampling,
  not the released files. Archives hold Zeiss CZI z-stacks (7 channels: CellMask, EGFP/RFP, Hoechst, each twice,
  plus transmitted light) and, in timelapse_wt2_s2, TIFFs. License: no dataset-specific license; the site Terms
  of use allow noncommercial research use, hence custom. Splits: paper Supplementary Table 1. enricher: formats
  czi+tiff (was other), channels 7, size from S3 listing, voxel size null (was 108x108x290, subsets differ).'
