notes: 'Voxel size is from the paper Methods for raw 100x data (0.108 um/px XY, 0.29 um z-interval); the paper also states stacks were resampled to 0.29 um isotropic, and the membrane archive is 63x (0.086 um/px), so the archives'' actual voxel size was not verified. Archive contents/formats (tar.gz) were not inspected: the file format inside is not stated on the download page or the paper (data.formats other is a placeholder). Image count not stated (paper: 30 image pairs per structure for some models; DNA+ set 540 z-stacks, not in these archives). Total ~289 GB summed from the sizes listed on the landing page. License: no dataset-specific license; the site Terms of use allow noncommercial research use, hence custom. Splits: paper Supplementary Table 1 gives train/test splits.'
