  notes: 'Listing: S3 bucket listing of the prefix (exact sizes); size_bytes = the 13 linked tar.gz archives (310,783,257,452
    B), excluding EM_med.zip and index.html. n_files counts archives; members were not counted (tar.gz has no index;
    listing a whole archive needs it all downloaded). Headers: first 3 MB of each archive''s gzip stream inflated
    (Python zlib/requests, 39 MB in total) to read the tar header and the first member''s CZI file header, subblock
    directory and metadata XML (12 of 13; st6gal1''s metadata sits at the end of its file). All CZI: Gray16 (uint16)
    per channel, subblocks uncompressed, 100x files SizeX 924, SizeY 624, SizeZ 59-75, SizeC 7, scale 1.0833e-7
    m x/y, 2.9e-7 m z; membrane_caax_63x 1848x1248x75, 6 channels, 8.598e-8 m; dic_lamin_b1 924x624x70, 7 channels,
    1.7196e-7 m (63x DIC). timelapse_wt2_s2/bf_t016.tiff: tifffile-shaped TIFF, shape [65,624,924] uint16, uncompressed;
    the axis order of its 65 pages is not stated (z per time point likely, unverified), so axes null. No value ranges
    (no tools/sample.py run; members are 0.5-2 GB inside 11-56 GB archives). Voxel size: per subset in notes; not
    one value. Downloads: path-style S3 URLs are direct and support ranges but s3-us-west-2.amazonaws.com is not
    on the TensorSwitch allowlist; the virtual-hosted form fails TLS (dotted bucket name). No single archive: data.download_url
    stays the index page.'
