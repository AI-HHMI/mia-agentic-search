notes: 'Zip listings: S2_Files.zip (IFimagedata, 8 stacks, each IFdataN{red,green,labels}.tif, 68 MB)
  and S3_Files.zip (LIVEimagedata, 12 stacks, each LIVEdataN{red,green,labels}.tif, 82 MB); S1_Files.zip
  (18 MB) holds MATLAB code plus two example FAK-condition stacks. The paper also analyses 24 FAK-inhibitor
  stacks (5x objective, 2.5 um pixels) that have no ground truth labels. Voxel size from the paper: ~0.5
  um per pixel within an image, 10 um between slices (stacks of 9-22 images, 512x672 px); raw is 12-bit
  in uint16, labels uint8 0/149/255 (enricher sample). The labels were drawn by the experimenting biologists
  in Adobe Photoshop. Download URL is the immunofluorescence zip; the live-cell zip is https://ndownloader.figshare.com/files/2598095.
  enricher: size_bytes = complete figshare listing (16 files incl. videos, figures, code zip; was 150,047,288
  for the two data zips).'
