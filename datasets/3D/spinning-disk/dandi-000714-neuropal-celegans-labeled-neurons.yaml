  notes: 'Listed the 9 DANDI assets (API, exact sizes, 478,075,700 B). Downloaded sub-8 (49.2 MB) and read it with h5py:
    NeuroPALImageRaw/data (563,388,28,4) uint16 uncompressed, values 374-65535 (saturated at the top; one sample); RGBW
    channel order [0,1,2,3]; NeuroPALNeurons voxel_mask of 118 ROIs (first rows like (239,132,19,1.0)), ID_labels as
