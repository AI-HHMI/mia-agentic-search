description: Five 3D spinning-disk confocal stacks of Vibrio cholerae biofilms (raw and deconvolved, 61
  nm pixels, 100 nm z-step) with semi-manual single-cell label images, one fully manual annotated crop,
  15 synthetic image/label training volumes, five trained StarDist models, and segmentation predictions
  on E. coli, Pseudomonas and Salmonella biofilms.
