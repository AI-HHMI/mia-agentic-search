notes: 'One 8.35 GB ZENODO.zip (186 files, 20.8 GB uncompressed) plus a README. Per peek_archive: 5 StarDist
  models, 5 raw and 5 deconvolved biofilm stacks with acquisition settings, semi-manual labels, one fully
  manual crop, 15 synthetic image/label volumes, and E. coli, Pseudomonas and Salmonella images with model-predicted
