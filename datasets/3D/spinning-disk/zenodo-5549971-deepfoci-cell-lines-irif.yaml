notes: 'Part 2 of the DeepFoci deposit; part 1 (nuclei and colocalized foci in primary cultures,
  10.5281/zenodo.4067741) is a separate record on main. Zips: cell_lines_U87 (348 FOVs x 3 channel TIFFs +
  labels.json) and cell_lines_NHDF (331 FOVs); the record text also mentions mask.tif and control.png per FOV,
  but neither is in the zips. Pixel size from the paper: "90.0 x 67.2 x 15 um xyz (1392 x 1040 x 50 px)", z step
  0.3 um; it also gives 1.95 um = 30 px. The files are 1362 x 1010 px (probed), 30 px smaller in x and y than
  stated, which fits a crop, not a resample (not stated). Labels: manual points per channel. No split; the
  paper used 5-fold cross-validation. enricher: TIFF axes yxz (50 z slices stored as 50 samples per pixel).'
