notes: 'Part 2 of the DeepFoci deposit; part 1 (nuclei and colocalized foci in primary cultures,
  10.5281/zenodo.4067741) is a separate record on main and differs in cell types and annotation. Listed zips:
  cell_lines_U87 (1044 tif = 348 FOVs x 3 channels + 348 labels.json) and cell_lines_NHDF (993 tif = 331
  FOVs x 3 channels + 331 labels.json); the record text also mentions mask.tif and control.png per FOV, but
  neither appeared in the zip listings. Pixel size derived from the paper (90.0 x 67.2 um field of
  1392 x 1040 px, z step 0.3 um, 100x NA 1.3 oil, Leica DM RXA with CSU-10 spinning disk); the dataset page
  states no pixel size. Focus labels are points per channel
  (gH2AX, 53BP1, colocalized); the paper says the cell-line foci were labeled manually in each channel. No
  train/val/test split is provided; the paper used 5-fold cross-validation by experiment.'
