short_name: Prostate cancer spheroids 3D stacks (confocal)
description: Confocal spinning-disk 3D image stacks of fluorescent multicellular spheroid cultures (LNCaP and PC346c prostate cancer
  cells co-cultured with cancer-associated fibroblasts; tRFP, Hoechst and EdU channels), with manually segmented 2D ground truth masks
  of the spheroids on the maximum intensity projections of eight LNCaP/CAF stacks. Each spheroid is classified into one of five separability
  classes.
