notes: 'Dryad API listing (28 files, 23.8 GB): 16 PC346c stacks (field_001-004, four wells, 966 MB each), 8 LNCaP/CAF stacks (stack_333-340),
  S2_File.tif (example stack), S6_File_v2.tif (EdU-positive cell detection example), S3_File.zip (11.6 MB, 2D ground truth masks) and
  README.txt. License CC0-1.0 from the Dryad API record (the landing page only says licensed for reuse). The zip could not be listed
  (Dryad file downloads need authentication), so annotations_verified is false; the paper says the masks cover the MIPs of 8 image stacks
  and gives the five classes. Paper (PLOS ONE 2016, open access) read: Yokogawa CellVoyager 7000 spinning disk, 10x/0.4 NA objective,
  10 um z separation; lateral pixel size not stated in the paper text read or on the dataset page, so voxel_size_nm is null. Ground
  truth is 2D on projections, not 3D.'
