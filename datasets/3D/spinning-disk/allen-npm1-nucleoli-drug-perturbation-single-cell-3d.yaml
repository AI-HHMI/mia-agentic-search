short_name: hiPSC nucleoli NPM1 drug perturbation (confocal)
description: 1,025 single-cell 3D spinning-disk confocal crops of WTC-11 hiPS cells with endogenously mEGFP-tagged nucleophosmin
  (NPM1, nucleolar granular component), imaged after treatment with 16 drugs or DMSO control. Each cell comes with the raw
  structure crop, a 3D nuclear segmentation and a 3D nucleoli segmentation from the Allen Cell and Structure Segmenter, plus
  a manifest with drug condition and train/valid/test split.
