  arrays:
  - role: raw
    path_pattern: single_cell/struc_raw/*.tiff
    format: tiff
    axes: zyx
    shape:
    - 27
    - 120
    - 108
    shape_varies: true
    dtype: float64
    compression: none
    value_range:
    - 0.0
    - 1.0
    normalization: rescaled
    alignment: not-applicable
    alignment_notes: Single-channel 3D crop per cell (tifffile 'shaped' TIFF, shape stored without axis names; z is the 27-page
      axis). Shape varies per cell (second sample 27x126x78).
  - role: label
    path_pattern: single_cell/nucleus/*.tiff
    format: tiff
    axes: zyx
    shape:
    - 27
    - 120
    - 108
    shape_varies: true
    dtype: int64
    compression: none
    value_range:
    - 0
    - 1
    normalization: unknown
    encoding: binary
    classes:
    - id: 1
      name: nucleus
    alignment: same-grid
    alignment_notes: Pairs with struc_raw by CellId file name (manifest columns crop_raw / crop_seg_nuc); identical shape
      to the raw crop.
  - role: label
    path_pattern: single_cell/struc_classical/*.tiff
    format: ome-tiff
    axes: zyx
    shape:
    - 97
    - 129
    - 117
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    encoding: unknown
    classes:
    - id: null
      name: nucleoli
    alignment: unknown
    alignment_notes: Pairs by CellId (manifest column crop_seg) but on a different grid than raw/nucleus (97x129x117 vs 27x120x108;
      97x135x87 vs 27x126x78 for a second cell; z ratio ~3.6, xy ~0.93). No resampling or physical size stated in the README,
      manifest, paper or OME header. Values mostly 0/255 with 51 distinct values (95% zero), so possibly an interpolated binary
      mask.
  notes: Listing of the full S3 prefix (3,097 files, exact sizes). Probed one file per folder; sampled two cells (0000b617-...,
    000b2dd6-...); value ranges are from these samples. Raw crops are float64 rescaled to [0, 1]. nucleus has 1,035 files
    vs 1,025 raw crops (manifest lists 1,025 cells). TIFF axes zyx for struc_raw/nucleus inferred from the 3D single-channel
    shape (the files do not name axes); struc_classical axes from OME-XML. Voxel size 108x108x290 nm is the FOV acquisition
    size from the paper and fits raw/nucleus crops; the struc_classical grid's voxel size is not stated. No single archive;
    files are individual S3 objects (s3://allencell/aics/NPM1_single_cell_drug_perturbations/).
