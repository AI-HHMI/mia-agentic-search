notes: 'Public S3 prefix s3://allencell/aics/NPM1_single_cell_drug_perturbations/: manifest.csv lists 1,025 cells (train 717, valid 154, test 154; 16 drugs plus DMSO) with single_cell/{nucleus,struc_classical,struc_raw}/<CellId>.tiff. Folder file counts and total size were not counted. Per the paper, nucleoli were segmented with the Allen Cell and Structure Segmenter (classical workflow) and nuclei with a UNet trained on bright-field, so labels are automatic with manual selection of nuclei. Voxel size is the FOV acquisition size from the paper (0.108 um xy, 0.29 um z); crops were not checked in TIFF headers. Terms: Allen Institute terms of use (research or noncommercial use); no SPDX licence. Different from allen-hipsc-single-cell-image-dataset.'
