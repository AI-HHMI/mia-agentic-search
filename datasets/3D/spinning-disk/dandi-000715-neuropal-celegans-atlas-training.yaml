notes: 'DANDI API record (CC-BY-4.0, 10 NWB files, 835 MB, draft version only). Cell paper (Yemini 2021) not open access
  in Europe PMC (abstract only). Differs from DANDI 000714 and 000472 (other NeuroPAL datasets). enricher: voxel size
  differs between files, so voxel_size_nm is null (was 207.7 x 207.7 x 750 nm). NWB grid_spacing (um): x = y = 0.2076-0.2078
  in all 10 files; z = 0.75 in 9 files, 1.021465 in sub-7-YAaLR. enricher: modality spinning-disk from the NWB device
  ("Spinning Disk Confocal Nikon Ti-e 60x Objective, 1.2 NA"; was fluorescence-other). coverage: each file marks 189-196
  head neurons with one centre voxel and a neuron name (ID_labels), not every cell.'
