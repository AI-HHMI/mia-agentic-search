    alignment_notes: 'One row (x, y, z voxel index, weight 1) per neuron, 189-196 rows per file; the NWB description: "Neuron
      centers for multichannel volumetric image". Each row''s neuron name is in ID_labels (ragged, via ID_labels_index), e.g.
      I1R, I1L, AMSOL. Compound dtype (uint32 x/y/z, float32 weight).'
  notes: 'Listing: DANDI asset API, 10 files, exact sizes. Read the HDF5 metadata of all 10 files by range requests
    (h5py + fsspec; grid_spacing, raw shape, ROI count, device) and probed sub-7-YAaLR (tools/probe.py). Sampled a central
    crop of sub-7 raw data (34,340,864 B, 440 x 264 x 29 x 5): min 0, max 65535, p0.1 0, p99.9 65535, hint full dtype range
    saturated (one sample), hence contrast-stretched. Raw data are uncompressed and unchunked. Voxel size per file (NWB
    grid_spacing, um): 0.2076-0.2078 x/y everywhere; z 0.75 except sub-7-YAaLR (1.021465), so no single voxel size. The
    api.dandiarchive.org download URLs redirect to dandiarchive.s3.amazonaws.com blobs; the blob URL is used for the sample.
    No single archive: data.download_url stays the dandiset page.'
