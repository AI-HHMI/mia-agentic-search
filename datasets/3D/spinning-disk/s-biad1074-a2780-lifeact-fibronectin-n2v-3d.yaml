notes: 'Noise2Void is self-supervised, so no labels are needed; usable for denoising training. File list: 2 training
  stacks and 96 test stacks (train/test column in file_list.tsv). The deposit describes the images as "paired";
  the paper says N2V needs no paired data, and no clean targets were seen. Calibration (133.34 nm, isotropic,
  13x512x512 uint16) read from the header of one training stack with probe.py; ImageJ metadata, so other stacks
  are unchecked. No license is stated on the BioStudies record or file listing. The deposit lists a different
  paper (cell-derived matrices protocol, doi 10.1038/nprot.2017.107; abstract only); the ZeroCostDL4Mic paper
  Methods describe the 3D Noise2Void data. Sizes are rounded HTTP-index values. Sibling deposit S-BIAD925 has
  the same title and description and a larger file count (400 vs 196); not compared in detail, so it may be
  a re-deposit.'
