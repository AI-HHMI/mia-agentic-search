notes: 'Three zips (32.6 GB): 01_03_cell_segmentation (7.8 GB, listed: 9,043 members, TIFFs, per-image zipped TIFF
  channels, .roi/.rois zips and CSVs), 01_02_rho0 and 01_01_no_primary (not listed). Cell ROIs are manual outlines used
  to test the tool; image count not determined (null). The paper (bioRxiv, Methods) states an Andor Dragonfly 500
  spinning disk on a Nikon TiE with 100x or 60x NA 1.4 objectives; voxel size is not stated, and which objective
  applies to this dataset was not confirmed. The ROIs cover manually chosen cells only (partial coverage). This is a
  tool-validation dataset rather than a training benchmark, hence the low confidence. Data availability lists four
  related Zenodo records (7633157, 7634535, 7634645, 7634604) not covered here.'
