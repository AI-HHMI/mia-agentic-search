notes: 'Three zips (32.6 GB) of mtFociCounter inputs and outputs. 444 input stacks (tiff_input*/, 3 channels,
  2048x2048) with manual cell ROI sets and per-cell binary masks. Paper (bioRxiv): Andor Dragonfly 500,
  100x or 60x NA 1.4; 3T3 z-stacks every 0.3 um. Tool-validation data rather than a training benchmark,
  hence low confidence. Data availability lists four related Zenodo records (7633157, 7634535, 7634645,
  7634604) not covered here. enricher: voxel x/y 60.3 nm from ImageJ TIFF calibration (16.585681 px/um),
  was null; z left null: headers give 0.2625 and 0.275 um, paper 0.3 um. enricher: annotations.source
  mixed: cell ROIs and 3T3 nucleus masks manual (paper), mitoBinary and foci masks automatic. n_items
  = input stacks (was null). coverage: only manually selected cells are outlined; masks are per-cell 2D
  crops.'
