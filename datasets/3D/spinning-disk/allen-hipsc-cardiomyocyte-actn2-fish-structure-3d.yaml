notes: 'Allen data package for Gerbin et al. (Cell Systems 2021) on public S3 bucket allencell. Counts are from the package README (1,215 FISH FOVs with 12,941 cells; 1,696 live FOVs with 18,045 cells; expert scores for 6,677 cells). Folders: raw_images, 2d_segmented_fields (10-channel max-projection TIFFs incl. cell and structure segmentation channels), 3d_actn2_segmentation (AICS segmenter), manual_expert_scores, actn2_pattern_ml_classifier_train, scRNA-seq and feature tables. Segmentation method of the 2D cell masks was not checked. Voxel size is from the preprint Methods for the live ACTN2-mEGFP imaging (0.120 um xy, 0.33 um z) and not checked for FISH stacks. Total size not measured. Overlaps with the separate record allen-cardio-classifier-actn2-hipsc-cm-3d-points (classifier point labels). Terms: Allen Institute terms of use; no SPDX licence.'
