title: 'Cell states beyond transcriptomics: hiPSC-derived cardiomyocyte FISH and live imaging data package (Allen)'
short_name: hiPSC cardiomyocyte ACTN2 FISH cells (confocal)
description: 2,911 fields of view of hiPSC-derived cardiomyocytes (WTC-11, mEGFP alpha-actinin-2) imaged by 3D
  spinning-disk confocal with bright-field and nuclear stain, 1,215 after RNA-FISH (12,941 cells, two probes per
  cell) and 1,696 live (18,045 cells). Includes 2D maximum-projection TIFFs with cell, nucleus and structure
  segmentation channels, 3D ACTN2 structure segmentations, expert sarcomere organization scores (1 to 5) for
  6,677 cells, the ACTN2 pattern classifier training data, and derived feature tables and scRNA-seq data.
