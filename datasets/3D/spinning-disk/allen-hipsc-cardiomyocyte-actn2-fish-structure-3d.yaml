  notes: Full S3 listing (70,291 files, exact sizes, 4,828,445,349,336 B). Probed one FISH raw channel file (OME-TIFF, OME-XML
    for 6 channels, PhysicalSize 0.120 x 0.120 x 0.330 um) and its 3D segmentation. Sampled the whole raw C5 file (308,456,437
    B; sample.py's page-wise reader failed on it) and the segmentation (1,262,804 B). With only C5 present tifffile zero-filled
    the other five channels, so the observed 0-22733 range is not the channel's range (value_range left null). Segmentation
    values {0, 255}, 1.4% foreground. 2D folders (segmented fields with cell/nucleus/structure channels, nuclear masks, single-cell
    crops) and the tables are not described as arrays here; they are 2D derivatives of the same FOVs. No single archive; files
    are individual S3 objects (quilt package).
