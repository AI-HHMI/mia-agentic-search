    alignment_notes: 'Multi-file OME-TIFF: each <fov>_C<n>.tif stores one channel (50 pages, 308 MB) and its OME-XML describes
      the whole 6-channel set (CZYX 6 x 50 x 1736 x 1776, PhysicalSize 0.120/0.120/0.330 um). Readers assemble the channels
      from the sibling _C0.._C5 files in the same folder and zero-fill missing ones. Channels per raw_images/README: 0 = 638
      (FISH probe), 1 = nuclear, 2 = bright-field, 3 = 561 (FISH probe), 4 = bright-field, 5 = 488 (ACTN2-mEGFP). The pattern
      names the C5 file so each FOV is converted once.'
