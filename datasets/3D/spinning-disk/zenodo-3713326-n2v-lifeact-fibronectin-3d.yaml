  training stacks, probe), not slices, so n_items = 98 volumes. The TIFF calibration says 0.13334 um in x, y and
  z, which conflicts with the 195 nm xy / 500 nm z in the description; the record keeps the described values. enricher:
  download_url set to the single zip (Zenodo API file URL; was the record page).'
