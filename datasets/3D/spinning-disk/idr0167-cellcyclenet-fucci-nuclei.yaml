  notes: 'Listing: HTTP index of S-BIAD1752/Files (FTP timed out), 2741 files, sizes rounded; size_bytes = index
    total (~1.16 TB, all files incl. the zipped OME-Zarr copies). size estimated (uncompressed): raw 594 x 150x3x1024x1024
    uint16 + label 594 x 150x1024x1024 uint8 + raw 90 x 71x3x1440x1920 uint16 + label 90 x 71x1440x1920 uint16 =
    795,333,427,200 B (795.3 GB), TIFFs only. Sample: tile_x1_y1_masks_filtered.tif downloaded whole (157 MB): values
    0-4, 99.7% background, IDs match obj_num in the GT table. Raw TIFFs (~0.9-1.2 GB) exceed the budget and page-wise
    sampling failed, so raw value range unknown; raw shapes/dtypes from headers. Mask TIFF axes zyx: plain page
    stack whose page count equals the paired raw''s z slices (paper: 3D Cellpose masks). *.zarr.zip are OME-Zarr
    v0.4 (axes czyx, 5 levels, blosc lz4, scale 1.0 = uncalibrated) with labels/segmentation_mask; arrays describe
    the TIFF copies. voxel size not set: subsets differ (paper Methods: 60x 182x182x200 nm, 40x 188x188x500 nm;
    paper also says 183 nm XY for confocal); OME-Zarr scales uncalibrated. Direct links: every file on ftp.ebi.ac.uk
    https (range requests); download_url is the Files/ folder, no single archive.'
