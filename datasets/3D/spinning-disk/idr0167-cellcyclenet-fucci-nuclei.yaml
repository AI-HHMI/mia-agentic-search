schema_version: '1.2'
id: idr0167-cellcyclenet-fucci-nuclei
title: Predicting cell cycle stage from 3D single-cell nuclear-stained images (CellCycleNet)
short_name: CellCycleNet FUCCI 3T3 nuclei (confocal)
description: '3D fluorescence image tiles of fixed interphase mouse 3T3 fibroblasts carrying the Fucci2a
  cell cycle reporter and stained with DAPI, from two instruments: a 60x spinning-disk confocal set and
  a 40x widefield epifluorescence set. Each tile comes with 3D Cellpose nuclear instance masks and per-nucleus
  ground-truth cell cycle labels (G1 vs S/G2) derived from the Fucci2a reporter intensities, released
  as benchmarks for cell cycle classification from DAPI alone.'
