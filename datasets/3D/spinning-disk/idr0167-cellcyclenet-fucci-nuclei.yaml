notes: 'Same data is deposited in the BioImage Archive as S-BIAD1752 (2725 files; Zarr, JSON file lists,
  .tsv); IDR idr0167 has experimentA = 60x spinning-disk confocal (voxel 182x182x200 nm per paper Methods;
  BIA says 183 nm in one place) and experimentB = 40x Keyence widefield epifluorescence (188x188x500 nm).
  voxel_size_nm given for the confocal set only. landing_url is the IDR project 3351 page (reachable via
  the IDR API; the webclient page is JS-rendered). Labels: ground-truth G1/S-G2 assigned from Fucci2a
  intensities after Cellpose segmentation (automatic); paper reports 4,076 labelled cells. Annotation
  files were seen in the BioStudies record and study file but not in a file listing, so annotations_verified
  false. Total size and exact image count not stated. Checked: IDR study file and annotation CSV, BioStudies
  record, paper full text (Methods, Data availability).'
