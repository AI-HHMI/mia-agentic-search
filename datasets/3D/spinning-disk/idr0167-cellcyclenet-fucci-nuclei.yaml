notes: 'Same data is deposited in the BioImage Archive as S-BIAD1752 (2725 files; Zarr, JSON file lists, .tsv);
  IDR idr0167 has experimentA = 60x spinning-disk confocal and experimentB = 40x Keyence widefield epifluorescence.
  landing_url is the IDR project 3351 page (reachable via the IDR API; the webclient page is JS-rendered). Labels:
  ground-truth G1/S-G2 assigned from Fucci2a intensities after Cellpose segmentation (automatic); paper reports
  4,076 labelled cells. Total size and exact image count not stated. enricher: voxel_size_nm null (was 182x182x200,
  60x only): subsets differ, see technical.notes; formats + tiff; n_items 684 tiles from listing; annotations verified
  (mask sampled).'
