description: Training datasets and StarDist models for OoCount, from spinning-disk confocal 3D images of cleared whole-mount
  perinatal and adult mouse ovaries with oocytes labelled by DDX4. Oocytes were manually annotated in Napari to train StarDist
  instance segmentation and a classifier of follicle growth stage.
