notes: 'Zenodo holds OoCount-Stardist.zip (5.7 GB) containing "Training Datasets.zip" (5.68 GB) and "StarDist Models .zip"
  (31 MB); these nested zips were not opened, so file formats, image counts and the label files are unverified (formats other
  until listed; n_items null). Voxel size 0.603 x 0.603 x 0.996 um is for the perinatal training images per the preprint Methods;
  adult images are 0.241 x 0.241 x 3 um (the preprint is inconsistent on adult xy), so voxel_size covers perinatal only. Annotation
  by manual labelling in Napari per the preprint; number of training images and split not reported. The peer-reviewed version
  (Biol Reprod 2025, 10.1093/biolre/ioaf023) is not open access and was not read. enricher: Dryad 10.5061/dryad.nk98sf81r
  (Zenodo isSourceOf) holds TrainingDatasets.zip 5.82 GB, ExampleData.zip, StardistModels.zip under CC0-1.0; its downloads
  need a login (401). Nested zips are deflated 4 levels deep; contents unverified.'
