description: 'Whole-mount spinning-disk confocal volumes of pancreatic cancer cell and cancer-associated fibroblast
  tumoroids (CellVoyager CV8000, 20x, 0.322 um/px). The segmentation_validation component pairs a 30 GB archive
  of high z-resolution (1.5 um) image stacks with 3D nuclear label volumes for wells B08-E08 in three versions:
  Cellpose3 predicted, corrected and an IF-derived set. Time-course, pilot-screen and 650-compound screen components
  hold images only.'
