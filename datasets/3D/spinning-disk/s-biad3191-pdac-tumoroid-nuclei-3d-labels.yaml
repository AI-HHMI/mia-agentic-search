notes: 'segmentation_validation.json lists 19 files: images_high_z_res.tar.zst (30.1 GB), labels_high_z_res.tar.zst
  (119 MB), label volumes of 1.45 GB each in labels/predicted (4 wells B08-E08), labels/corrected (3 wells plus
  3 restitched) and labels/IF (4 wells), and three CSVs of segmentation statistics. The study says nuclei were segmented
  with Cellpose3 (cyto3, diameter 25, 2.5D stitching); how the "corrected" labels were produced (manual correction)
  and what the "IF" labels are were not described, so source is mixed and these are unverified. The tar.zst archives
  are not a listed format, so formats lists tiff only. No paper is listed on the entry and the nuclear stain and
  channel count are not stated in the parts read.  enricher: voxel size 0.322 um/px (study Image acquisition) and
  1.5 um z-spacing (Extended Data Fig. 3 title) for the segmentation_validation component (was null); other components
  not checked. Label TIFFs probed: 50x3814x3814 uint16.'
