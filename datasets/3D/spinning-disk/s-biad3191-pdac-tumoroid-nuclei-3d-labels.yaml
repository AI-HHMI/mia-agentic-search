notes: 'segmentation_validation.json lists 19 files: images_high_z_res.tar.zst (30.1 GB), labels_high_z_res.tar.zst (119 MB),
  label volumes of 1.45 GB each in labels/predicted (4 wells B08-E08), labels/corrected (3 wells plus 3 restitched) and labels/IF
  (4 wells), and three CSVs of segmentation statistics. The study says nuclei were segmented with Cellpose3 (cyto3, diameter
  25, 2.5D stitching); how the "corrected" labels were produced (manual correction) and what the "IF" labels are were not
  described, so source is mixed and these are unverified. Label values and the match between tar contents and the per-well
  label tifs were not inspected. The tar.zst archives are not a listed format, so formats lists tiff only. No paper is listed
  on the entry and the nuclear stain and channel count are not stated in the parts read. Time-course, pilot screen and tumoroid
  screen components were not examined for labels.'
