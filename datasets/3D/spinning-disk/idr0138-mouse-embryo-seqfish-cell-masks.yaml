title: Integration of spatial and single-cell transcriptomic data elucidates mouse organogenesis (idr0138)
short_name: Mouse embryo seqFISH with cell masks (confocal)
description: 'seqFISH imaging of sagittal sections of E8.5 (8-12 somite) C57BL/6J mouse embryos: 2,912 OME-Zarr fields of view (2048x2048 px, 4 channels, 6 z-slices) across the hybridisation rounds of two
  embryo experiments, with cell segmentation masks (about 2,000 per field) stored as mask ROIs in the IDR. Segmentation used membrane stains (cadherins/beta-catenin) with Ilastik Multicut.'
