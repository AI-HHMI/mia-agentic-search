notes: 'Image count (2,912) is the sum over the 64 IDR datasets (one per hybridisation round) of the study; the same fields of view recur across rounds. Masks come from semi-automatic segmentation (membrane
  stains aligned to the first round with DAPI, Ilastik probability maps, Multicut; 2D labels per z-slice) per the paper Methods, hence source mixed. Study file gives the total as about 0.5 TB (not an exact
  byte count). Objective of the seqFISH imaging is not stated in the study file or the paper Methods read (the 10x/6.74 um z-step in the paper refers to separate Zeiss 880 tile scans); the imaging method
  "spinning disk confocal" is from the study file. The paper says raw image data are available on request, but the IDR deposit holds the OME-Zarr images openly. enricher: voxel size 110x110x4000 nm from
  the OME-Zarr scale (was null); size_bytes 5e11 from the study file "Total Tb 0.5" (approximate).'
