notes: 'Listed zips: nucleus_segmentation (555 files, 277 data + mask pairs split test/train/val by folder), foci_detection_training_subset (481 files), foci_detection_testing_subset (100 tif + 100 _pos.csv); the validation subset zip (10.2 GB) was not listed. size_bytes sums the four zips (about 122 GB); n_items = 277 nucleus FOVs + 240 + 120 + 100 foci FOVs from the record text. Record states 50 z slices at 0.3 um step, 100x NA 1.3 oil lens, Leica DM RXA with CSU-10 confocal unit (spinning disk), hyperstack tiffs XYCZ; lateral pixel size not stated on the record. Part 2 (cell lines U-87/NHDF, 679 FOVs) is a separate record, 10.5281/zenodo.5549971, not included here. The published paper (Comput Struct Biotechnol J 2021, Europe PMC full text) confirms the microscope, 0.3 um z step and that nuclei and foci were manually annotated in 3D by one expert; it states no lateral pixel size. Whether nucleus masks are semantic or instance labels is not stated.'
