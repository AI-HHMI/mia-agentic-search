id: s-biad2156-hipsc-brightfield-to-fluorescence-single-cell
title: Cell-context dependent in silico organelle localization in label-free microscopy images
short_name: hiPSC brightfield-to-fluorescence cell pairs (3D)
description: About 14,000 single-cell 3D crops of gene-edited WTC-11 human iPS cells for six EGFP-tagged structures
  (actin filaments, endoplasmic reticulum, Golgi, microtubules, mitochondria, nuclear envelope). Each cell has
  a brightfield "signal" stack, the matching fluorescence "target" stack and a binary cell mask, plus per-structure
  metadata with mitotic stage, colony-edge flag and neighbours. Built for training in silico labeling models
  (label-free to fluorescence translation).
