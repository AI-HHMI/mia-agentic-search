notes: 'Derived from the Allen Institute WTC-11 hiPS Single-Cell Image Dataset v128, which the catalog also holds
  as allen-hipsc-single-cell-image-dataset (200,000+ cells, S3). This record is a different deposit: a curated
  subset of single-cell brightfield/fluorescence pairs with masks and context metadata, uploaded to the BioImage
  Archive by the CELTIC authors. n_items 14054 is an estimate: the file lists of the six structures hold about
  42,200 files, i.e. 3 tiffs per cell after subtracting 4 metadata files per structure; not confirmed by opening
  the folders. Voxel size is taken from the paper Methods for the source FOV images (0.108 um pixels, 0.29 um
  z spacing); whether the cell crops were resampled is not stated, and the deposit has no size listing (size_bytes
  null). Masks and mitotic-stage annotations come from the AICS dataset metadata (deep-learning classifier and
  rule-based criteria per the paper). Image dtype and axes were not inspected.'
