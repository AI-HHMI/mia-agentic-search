notes: 'Derived from the Allen Institute WTC-11 hiPS Single-Cell Image Dataset v128, which the catalog
  also holds as allen-hipsc-single-cell-image-dataset (200,000+ cells, S3). This record is a different
  deposit: a curated subset of single-cell brightfield/fluorescence pairs with masks and context metadata,
  uploaded to the BioImage Archive by the CELTIC authors. Voxel size is taken from the paper Methods for
  the source FOV images (0.108 um pixels, 0.29 um z spacing); the paper describes cropping, not resampling,
  of the deposited cells. Masks and mitotic-stage annotations come from the AICS dataset metadata (deep-learning
  classifier and rule-based criteria per the paper). enricher: size 127.4 GB and 14,054 cells (3 TIFFs
  each) confirmed from the deposit''s file lists (*20250720.json).'
