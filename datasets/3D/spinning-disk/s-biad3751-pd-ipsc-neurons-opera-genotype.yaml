notes: 'Six zips (Lab 1 and Lab 2 batches, 11-77 GB each). Each holds per-well TIFFs and a platemap xlsx
  (not decoded). Labels are line genotype (experimental metadata). Channels and planes vary by experiment
  (paper Supplementary Table 4, not accessible). Pixel size is not stated (camera 6.5 um; 20x Lab 2, 40x
  Lab 1), so voxel size is null. The preprint says raw images are on request; the archive deposit is CC0.
  Single-cell feature tables are a separate Zenodo deposit (10.5281/zenodo.18323330). The paper splits
  cells 60/20/20, not by lab. enricher: all 6 zips listed: 91,530 TIFFs (n_items), 4-5 channels and 3-4
  planes per batch, so channels is null; size from listing.'
