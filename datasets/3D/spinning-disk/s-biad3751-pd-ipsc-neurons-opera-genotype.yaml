id: s-biad3751-pd-ipsc-neurons-opera-genotype
title: Machine learning image analysis predicts Parkinson disease genotype and mitochondrial lysosomal abnormalities in iPS neurons
short_name: Parkinson iPSC neurons genotype (spinning-disk)
description: Raw high-content spinning-disk confocal images (Opera Phenix) of iPSC-derived cortical neurons from 13 lines (3 PRKN,
  3 LRRK2, 3 SNCA, 4 control), labelled for mitochondria, lysosomes, cytoplasm or viability and nuclei, from two laboratories in
  several plate batches. Each zip holds the per-well TIFFs and a platemap spreadsheet mapping wells to cell line and genotype group,
  which were used as labels to train genotype classifiers.
