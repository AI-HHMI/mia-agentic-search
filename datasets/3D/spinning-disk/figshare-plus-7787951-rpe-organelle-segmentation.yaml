title: Retinal Pigment Epithelium (RPE) Segmentation and Intensity - 3D spinning-disk stacks of 16 organelle-tagged iPSC-RPE lines with cell, nucleus and organelle segmentations
short_name: iPSC-RPE 3D organelle segmentation (spinning disk)
description: 3,840 three-channel (phalloidin actin, Hoechst nuclei, one GFP-tagged organelle) z-stacks of iPSC-derived retinal pigment
  epithelium from 16 isogenic Allen Institute iPSC lines, imaged weekly for four weeks under PGE2 or HPI4 treatment, with matching segmentation
  stacks (cell borders, nuclear borders, organelles) from the POLARIS Mask R-CNN pipeline. The collection also holds the Mask R-CNN training
  data (37 manually annotated stacks, annotated in VIA, with 2D slices, model weights and training logs) and a demo set.
