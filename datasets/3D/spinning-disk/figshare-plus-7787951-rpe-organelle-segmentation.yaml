notes: 'Collection of figshare.plus items: intensity stacks 28824257 (3,841 OME-TIFF, 858.7 GB), segmentation stacks 28821213 (3,840 TIFF,
  30.8 GB) and pipeline/training/demo 28832501 (RpeMapTrainingData.zip 4.5 GB, demo 4.9 GB, Windows software 3.3 GB). Size sums the
  first two and the training zip. The training zip lists 1,944 PNG slices, 36 VIA JSON files, 2 Mask R-CNN weights and logs (peek_archive).
  Per the paper, Mask R-CNN was trained on 37 manually annotated stacks (six operators, seeded by classical masks) for cell and nuclear
  borders; the released segmentation stacks come from the model (organelles from model-based segmentation), so source is mixed.
  Microscope: Yokogawa CellVoyager 7000, 60x water NA 1.2, 2x2 binning. Voxel size is 0.217 x 0.217 x 0.5 um per the Figshare record. Which
  stack channel holds which organelle follows the file name tag; a per-file label for each of the 16 tags was not checked.'
