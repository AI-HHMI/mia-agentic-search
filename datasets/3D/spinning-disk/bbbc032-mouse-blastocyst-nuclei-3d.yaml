notes: 'Single volume only (4 channel TIFFs, BBBC032_v1_dataset.zip, 1.14 GB compressed, plus a 473.5 MB ground-truth TIFF; size_bytes is the compressed zip plus ground truth, approximate). Microscope per page: PerkinElmer Ultraview VoX spinning disk combined with Leica SP8. Voxel size from the ground-truth TIFF header (0.101 x 0.101 x 0.5 um, matches the page physical dimensions 103.4 x 135.7 x 86 um). Whether the ground truth holds per-nucleus instance IDs or a binary/semantic mask was not verified (uint16, max value 62804 in header), so it is listed as semantic-segmentation. No paper cited on the dataset page; none searched successfully. Checked: dataset page, zip listing, ground-truth header.'
