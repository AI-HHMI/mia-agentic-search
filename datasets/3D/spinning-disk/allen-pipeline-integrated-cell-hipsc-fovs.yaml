  arrays:
  - role: raw
    path_pattern: fovs/*.ome.tiff
    format: ome-tiff
    axes: zcyx
    shape:
    - 70
    - 7
    - 624
    - 924
    shape_varies: true
    dtype: uint16
    compression: lzw
    value_range:
    - 344
    - 600
    normalization: unknown
    alignment: not-applicable
    alignment_notes: OME-XML (Bio-Formats 5.5.3) DimensionOrder XYCZT, PhysicalSize 0.10833 x 0.10833 x 0.29 um; this FOV
      has 7 channels (CMDRP_1, CMDRP, EGFP_1, EGFP, H3342_1, H3342, ...). Channel indices per FOV in metadata.csv (ChannelNumber638,
      ChannelNumberStruct, ChannelNumber405, ChannelNumberBrightfield).
  - role: label
    path_pattern: dna_segmentations/*_nucWholeIndexImageScale.tiff
    format: tiff
    axes: zyx
    shape:
    - 70
    - 624
    - 924
    shape_varies: true
    dtype: uint16
    compression: lzw
    value_range:
    - 0
    - 9
    normalization: unknown
    encoding: instance-ids
    classes:
    - id: null
      name: nucleus
    alignment: same-grid
    alignment_notes: Pairs with the FOV via metadata.csv (SourceReadPath / NucleusSegmentationReadPath per cell row). Plain
      multi-page TIFF with 70 pages = the FOV's 70 z slices, same y/x; z axis inferred from that match. IDs 1-9 per FOV are
      cell indices (CellIndex in metadata.csv; 'WholeIndexImage' in the name).
  - role: label
    path_pattern: membrane_segmentations/*_cellWholeIndexImageScale.tiff
    format: tiff
    axes: zyx
    shape:
    - 70
    - 624
    - 924
    shape_varies: true
    dtype: uint16
    compression: lzw
    value_range:
    - 0
    - 9
    normalization: unknown
    encoding: instance-ids
    classes:
    - id: null
      name: cell
    alignment: same-grid
    alignment_notes: Same pairing and grid as dna_segmentations (MembraneSegmentationReadPath); IDs match CellIndex.
  - role: label
    path_pattern: structure_segmentations/*_struct_segmentation.tiff
    format: ome-tiff
    axes: zyx
    shape:
    - 70
    - 624
    - 924
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    encoding: binary
    classes:
    - id: 255
      name: tagged structure (per cell line; StructureShortName in metadata.csv)
    alignment: same-grid
    alignment_notes: StructureSegmentationReadPath in metadata.csv; OME axes zyx, same z/y/x as the FOV.
  notes: Full S3 listing (154,325 files, exact sizes). Every folder holds 11,023 named .tiff files plus 11,023 extension-less
    objects of the same count (quilt-style copies; fovs/ totals 8.2 TB for 22,046 objects, so they are full-size); the path_patterns
    select the named files. Probed one FOV and its six label files; tools/probe.py reported the FOV as a plain TIFF, but tifffile
    over range requests reads it as OME (ZCYX 70 x 7 x 624 x 924). Sampled (page-wise) 2 FOV pages, which gave 344-600 (one
    sample, two pages; partial because of SSL retries), and the three segmentations in full (1.14 MB). Contour images (dna/membrane/structure_contours)
    are not described as arrays. No archive; individual S3 objects.
