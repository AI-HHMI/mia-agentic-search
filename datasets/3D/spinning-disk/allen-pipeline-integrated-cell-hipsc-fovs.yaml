notes: 'Public S3 prefix s3://allencell/aics/pipeline_integrated_cell/ (README.md, metadata.csv, fovs, dna_*, membrane_*, structure_* folders). metadata.csv has 39,200 cell rows over 11,023 FOV ids, 20 cell lines and 19 structures; workflows Pipeline 4, 4.1, 4.2 and 4.4, objective 100x, PixelScaleX/Y 0.1083 um and Z 0.29 um (from the table). FOV OME-TIFFs listed are about 260 to 400 MB each, so the total is several TB; not measured. Segmentation algorithms named in the table: Matlab nucleus/membrane segmentation and per-structure Python segmentation, so labels are automatic. No paper is cited in the package; the README points to the Allen Cell methods pages. This is an earlier packaging of Allen Pipeline 4 cells and overlaps with allen-hipsc-single-cell-image-dataset (hipsc_single_cell_image_dataset); overlap was not quantified. Terms: Allen Institute terms of use; no SPDX licence.'
