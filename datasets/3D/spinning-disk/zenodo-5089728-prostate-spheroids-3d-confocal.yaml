notes: 'Zenodo lists 16 files: stack_333 to stack_340 and field_001 to field_004 (12 multipage TIFF stacks,
  about 966 MB each), S2_File.tif, S6_File_v2.tif, README.txt and S3_File.zip. peek_archive of S3_File.zip
  shows RoiImage_0333..0340.tif and RoiSet_333..340.zip, i.e. ROI annotations for stacks 333-340 only; the
  paper Ground truth section says masks were drawn manually in the Fiji RoiManager on the MIP of 3D homogeneous
  LNCaP cultures with five visibility classes, and that the ground truth is supplementary S2 File, whereas
  this record names it S3_File.zip, so the match is inferred. The roles of S2_File.tif, S6_File_v2.tif and
  field_001-004 are not stated; the four field stacks appear to have no ROI files. Voxel size from README:
  1.3 um lateral, 10 um z-separation, CellVoyager 7000, 10x/0.4 NA objective, 16-bit TIFF. Only the 2D
  masks (on MIPs) are labels; no 3D labels. download_url is null because the files are individual TIFFs.'
