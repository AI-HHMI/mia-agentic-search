schema_version: '1.2'
id: idr0112-motor-neurons-vcp-als-stress
title: Image-based deep learning reveals the responses of human motor neurons to stress and VCP-related ALS
short_name: iPSC motor neurons VCP-ALS vs stress (confocal)
description: High-content spinning-disk confocal images (Opera Phenix, 1080 x 1080, z-stacks) of iPSC-derived human motor neurons from
  control and VCP-mutant ALS lines, untreated or exposed to oxidative, osmotic or heat stress and recovery, stained for DAPI, beta III-tubulin
  and one of five ALS-related RNA-binding proteins. The study lists 59,468 images over 30 plates. Per-image metadata give diagnosis
  and treatment, which the paper used as class labels for CNN classifiers.
