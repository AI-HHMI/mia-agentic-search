notes: 'Size 0.626 TB, 59,468 images and 1080x1080 pixels are from the IDR study file. The IDR image header of one image (13441326) gives
  1080x1080x4 planes, 3 channels, uint16, but its PhysicalSizeX of 341.28 um is implausible, so voxel size is left null (not found in the paper
  Methods either; objectives x40/x63 water from the study file). Labels: per-image map annotations (Diagnosis Healthy, Treatment Description untreated,
  cell line) were seen on one image; the paper trains classifiers for ALS vs control and untreated vs oxidative / heat / osmotic stress, but
  provides no split. Files on the FTP are single-plane TIFFs (e.g. 002002-1-001001001.tif); authors taken from the paper citation.'
