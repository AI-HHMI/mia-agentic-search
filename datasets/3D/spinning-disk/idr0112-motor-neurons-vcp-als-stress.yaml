notes: 'Size 0.626 TB, 59,468 images and 1080x1080 pixels are from the IDR study file. The IDR image header and the OME companion files give
  1080x1080x4 planes, 3 channels, uint16, but PhysicalSizeX/Y of 341.28 um, which is implausible per pixel (likely the field width), so voxel
  size stays null; the paper states 1 um z steps (3-5 planes) but no lateral pixel size, and the schema needs x and y. Labels: per-well IDR
  annotation CSV (Diagnosis, Mutation, Treatment, cell line); the paper trains classifiers for ALS vs control and untreated vs oxidative /
  heat / osmotic stress, but provides no split. Authors taken from the paper citation. enricher: release date 2021-09-01 from the study
  file (was null); annotations_verified true after reading the screenA annotation CSV (was false).'
