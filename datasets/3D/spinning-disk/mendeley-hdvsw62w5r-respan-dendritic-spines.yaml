notes: 'Version 4: three zips, 111.0 MB (Mendeley files API). enricher: labels are RESPAN outputs, not ground truth: the RESPAN
  README calls Validation_Data/Segmentation_Labels the folder ''created by RESPAN during analysis'' that is compared against
  a separate ground-truth folder; the expert consensus masks from the paper are not in this deposit (source was manual, now
  automatic; types was instance-segmentation, now semantic-segmentation: one sampled label holds values 0-5). Voxel size 65x65x150
  nm from the dataset description and paper Methods, confirmed by the raw TIFF header (15.4025 px/um, ImageJ spacing 0.15
  um). Only 5 volumes; the nnU-Net training data are not in this deposit.'
