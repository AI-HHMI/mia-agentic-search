notes: 'Version 4 (2026-04-21): three zips, 111.0 MB in total (Mendeley files API): 5 raw .tif stacks
  and two RESPAN results archives. Listed the v2 copies of the datasets and first results zip with peek_archive
  (same ids and sizes as in v4): Validation_Data/Segmentation_Labels holds one .tif per stack. The 2025_07
  results zip was not listed. The paper says two experts annotated these five spinning-disk images as
  a ground-truth consensus mask; I assume the Validation_Data labels are that mask, which the dataset
  page does not state. Spine arrays, meshes and tables are RESPAN pipeline outputs. Label values were
  not inspected. Only 5 volumes; the nnU-Net training data are not in this deposit. Voxel size from the
  dataset description and paper Methods.'
