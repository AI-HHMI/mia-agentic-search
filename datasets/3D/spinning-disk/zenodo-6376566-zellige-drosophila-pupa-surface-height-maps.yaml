title: 'Zellige example dataset: Drosophila pupal wing and abdomen'
short_name: Drosophila pupa tissue surfaces (spinning disk)
description: One spinning-disk confocal z-stack (1200 x 1200 x 51 px) of a Drosophila pupa about 24 h
  after puparium formation (E-cadherin-GFP), covering part of the wing and abdomen. Expert-drawn ground-truth
  height maps are provided for four surfaces (abdomen cuticle, abdomen epithelium, wing cuticle, wing
  epithelium), together with the height maps reconstructed by the Zellige software.
