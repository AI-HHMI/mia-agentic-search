notes: 'Very small: a single volume with ground-truth height maps for four surfaces (surface extraction,
  not voxel masks), so the training signal is one example; it is an example/benchmark case of the Zellige
  tool (sibling of the inner-ear organoid record). Pixel size 0.183 µm and "z step <1 µm" are from the
  Zenodo description; z is null because no exact step is given (not in the Zenodo record or the preprint
  Methods, which describe a Nikon Plan Apo 60x NA 1.4 spinning disk with Prime95B camera). Zenodo lists
  9 TIFF files (~160.6 MB): raw stack Fly_c01_f0001_p013.tif (146.9 MB) plus Surface1-4 ground-truth and
  Zellige height maps. Zellige maps are predictions, not ground truth (subtract 1 before comparing). Sources
  checked: Zenodo record and API, preprint full text (Example 1, Methods, data availability).'
