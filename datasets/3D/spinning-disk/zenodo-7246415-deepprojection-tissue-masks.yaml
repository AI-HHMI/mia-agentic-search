notes: 'training_data.zip (1.1 GB): dorsal_closure/{stack,mask} 151 TIFF pairs, zebrafish/{stack,mask} 9 pairs. Voxel sizes
  differ by subset (README): Drosophila 365x365x1000 nm (~5.5 MB files) or 167x167x1000 nm (files > 40 MB); zebrafish 600x600x2000
  nm, so voxel_size_nm is null (enricher; was 365x365x1000). organisms: Drosophila melanogaster = dorsal_closure/, Danio rerio
  = zebrafish/. modality: spinning-disk (Zeiss Axiovert 200M, Yokogawa CSU-W1) = dorsal_closure/, confocal (Leica SP8) = zebrafish/.
  Masks drawn manually in Fiji (preprint). enricher: dorsal_closure masks are the raw stack with voxels outside the target
  tissue set to 0 (not binary); zebrafish masks are binary 0/255. test_data.zip (7.9 GB, unlabelled test stacks) is not counted
  in size. Journal article not open access; preprint full text read.'
