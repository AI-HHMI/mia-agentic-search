notes: 'training_data.zip (1.1 GB, 4.2 GB uncompressed) lists 323 entries: dorsal_closure/{stack,mask} with 151 TIFF pairs each and zebrafish/{stack,mask} with 9 pairs each. Voxel size varies by file and is stated in the README: Drosophila 0.365 um xy (small files) or 0.167 um xy (large files > 40 MB), 1 um z; zebrafish 0.6 um xy, 2 um z. The value above is the Drosophila small-file size; zebrafish uses 600 x 600 x 2000 nm. Spinning-disk confocal (Zeiss Axiovert 200M with Yokogawa CSU-W1) for Drosophila, Leica SP8 confocal for zebrafish. Masks were drawn manually in Fiji (paper preprint). The same Zenodo record also holds test_data.zip (7.9 GB) and trained models, not counted in size above. Journal article is not open access; preprint full text read.'
