notes: 'Mendeley Data API: 59 files, 2,563,737,828 B. Images: 9 training stacks (7, 8, 13, 14, N-1, N-2,
  N-5, N-9, N-11; float32 normalised to [0,1]) with 9 label stacks, 12 unlabelled before/after-ablation
  stacks (uint16), plus code and ~2.2 GB of .hdf5 model checkpoints. Paper: 8 human-labelled volumes,
  63x spinning-disk confocal, images resized to 32 x 512 x 512 for the model. The paper says nine vs eight
  labelled stacks inconsistently. n_items 19 counts image TIFFs. Files are individual Mendeley downloads
  (no single archive), so download_url is null. enricher: annotation types instance-segmentation -> semantic-segmentation
  (the label files are binary {0,1} masks, sampled); coverage dense -> partial (only 9 of 21 image stacks
  have labels).'
