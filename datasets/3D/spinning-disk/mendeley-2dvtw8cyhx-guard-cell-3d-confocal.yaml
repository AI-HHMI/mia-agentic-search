short_name: Arabidopsis guard cell 3D segmentation (confocal)
description: Spinning-disk confocal z-stacks (LTI6b-GFP plasma-membrane marker) of stomatal guard cells in
  Arabidopsis thaliana cotyledon epidermis, with hand-annotated 3D guard-cell label volumes for nine stacks
  (five training, three test, one more in the labelled set) plus before/after laser-ablation stacks of
  neighbouring pavement cells. Released with the 3D CellNet guard-cell segmentation model, code and checkpoints.
