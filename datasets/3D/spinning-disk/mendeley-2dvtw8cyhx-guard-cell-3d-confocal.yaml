notes: 'Mendeley Data API listing: 14 before/after or numbered image stacks (1-1, 1-2, 2-1, 2-2, 3-1, 7, 8, 13, 14),
  five N-<k>.tif stacks, nine label-*.tif volumes (7, 8, 13, 14, N-1, 2, 5, 9, 11), plus code, checkpoints (~2.5 GB
  total with .hdf5 models). Paper: 8 labelled volumes were split 5 train / 3 test; images are 512 x 512
  slices resized to 32 planes in the pipeline. Zeiss Cell Observer SD, Yokogawa CSU-X1, 63x/1.4 NA oil. Voxel size
  not stated in the paper text or record listing (TIFF headers were not read), so null. The paper says nine
  vs eight stacks inconsistently; n_items 19 counts image TIFFs in the listing. Files are individual Mendeley
  downloads (no single archive), so download_url is null.'
