notes: 'Dryad file downloads need a bearer token via the API, so the zips could not be listed and the README
  was not read; contents come from the Dryad page/API file list (TrainingDatasets.zip 5.8 GB, ExampleData.zip
  2.8 GB, StardistModels.zip 32 MB, Code.zip, README.md; total from the API listing) and the paper Methods
  (read via PMC). Voxel size is for the perinatal training data (x/y 0.603 um, z 0.996 um); adult training
  data are x/y 0.241 um, z 3 um. Annotation label type (instance masks vs points), number of annotated oocytes
  and train/validation split are not stated in the sources read; instance-segmentation is inferred from the
  StarDist models trained on napari annotations. Image count unknown. Dryad reuse licence is CC0 per API record.'
