notes: 'Hosted in the public Allen Cell S3 bucket (Quilt package aics/mitotic_annotation). Size and count
  from a complete S3 listing: 5,764 crop_raw files (256.6 GB) and 5,764 crop_seg files (0.97 GB); label
  counts from metadata.csv: M0 2516, M4M5 927, M3 823, M6M7_half 561, M1M2 441, M6M7_early 338, dead 103,
  wrong 35, blob 20. Voxel size is from the README (0.108 um isotropic after Z interpolation); the paper
  Methods give 0.108333 um and Zeiss spinning-disk confocals (10x/0.45 or 100x/1.25 W objectives; the
  3D crops come from the 100x set). Licence is the Allen Institute custom Terms of Use (research and noncommercial
  use allowed, attribution required, no commercial redistribution without permission), not an SPDX licence.
  Who made the class labels and how is not stated in the README or the paper text read; annotation source
  left unknown. Image channel count (3) is per README. enricher: size = exact S3 listing total (was 257,518,644,006).'
