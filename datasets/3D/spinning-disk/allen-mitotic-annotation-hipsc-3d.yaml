title: Annotated Dataset for Building a Mitotic Classifier Used in the hiPSC Single Cell Image Dataset
short_name: hiPSC 3D cells, mitotic stage labels (confocal)
description: 5,764 3D single-cell crops of live WTC-11 hiPSCs (DNA dye, membrane dye and a GFP-tagged structure
  channel) with nuclear and cell segmentation masks and one of 9 class labels each (M0, M1M2, M3, M4M5, M6M7_early,
  M6M7_half, wrong, blob, dead), used to train the mitotic-stage classifier of the Allen Cell hiPSC single-cell
  image dataset.
