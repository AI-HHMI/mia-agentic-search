notes: 'BioStudies hosts only masks: Aggregations.zip (18 TIFF stacks, ROI_*.tiff, from volunteer drawings aggregated with
  CRIA), Expert.zip (2 stacks), Predictions.zip (U-Net outputs, not labels), classifications.tar.gz (~1 GB raw Zooniverse
  CSV) and movies. Images are linked EMPIAR entries: EMPIAR-10478 (18 cropped 2000x2000 8-bit ROIs, 100 Angstrom pixels, TIFF)
  and EMPIAR-10094 (full 8192x8192 DM4 volume, 518 images). Annotation stack to ROI image pairing is by file name and was
  not verified. No license or terms stated on the BioStudies entry or EMPIAR records read. Paper full text not open in Europe
  PMC (abstract only; bioRxiv preprint rate-limited), so splits and annotation details come from the BioStudies text.'
