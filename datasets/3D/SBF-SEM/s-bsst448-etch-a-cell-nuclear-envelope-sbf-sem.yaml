description: 'Nuclear envelope segmentations of HeLa cells imaged by serial block-face SEM (10x10x50 nm):
  consensus masks aggregated from Etch a Cell volunteer drawings for 18 cropped ROI volumes, two expert-segmented
  stacks, U-Net predictions and the raw Zooniverse classifications. The images themselves are in EMPIAR-10478
  (crops) and EMPIAR-10094.'
