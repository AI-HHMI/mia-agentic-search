notes: 'This Zenodo record holds only the labels (300 .mat files, 23.4 MB total from the Zenodo file list); the raw
  images are EMPIAR-10094 (518 DM4 slices of 8192 x 8192, 129.8 GB per the EMPIAR API). The Zenodo page says the data
  are in EMPIAR-10094 but does not say which raw slices GT_Slice_1..300 correspond to, nor whether labels are cropped;
  the paper (single-cell version of the ground truth) uses slices 101-180 for training, so slice numbering vs the raw
  stack is unconfirmed. The paper describes the nuclear envelope as manually delineated in Amira with the other classes
  from algorithmic steps, hence source mixed. The paper text read describes the earlier single-cell labelling; this
  multi-nuclei deposit is described only on the Zenodo page. Formats: labels are .mat, raw is DM4, neither is a listed
  format, so other.'
