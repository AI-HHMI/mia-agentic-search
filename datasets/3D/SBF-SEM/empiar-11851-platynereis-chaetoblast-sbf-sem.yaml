    (values 0-3). normalization contrast-stretched: the .am headers record MIB ContrastGamma Min/Max and "Converted
    from uint16 to uint8" (Joint also "Normalize Masked area"). MIB .model files (MATLAB) duplicate the label TIFFs
    and are not listed as arrays. size: per-file HTTP Content-Length summed (listing.py fell back to the rounded
    HTTP index after FTP timed out), so page-stated, not file-listing. No single archive: download_url stays the
    data folder; direct files are listed above.'
