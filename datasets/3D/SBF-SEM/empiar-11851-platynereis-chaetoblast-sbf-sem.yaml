notes: 'Three volumes, each as a full stack plus a cropped sub-volume carrying the labels; images are AmiraMesh
  .am (uint8, uncompressed), labels LZW TIFF and MIB .model, so formats lists tiff only. Paper Methods: structures
  were manually segmented on about every 10-15th slice in MIB, then used to train a DeepMIB U-net that produced
  the full model, hence source mixed; only the cropped regions are labelled (coverage partial). enricher: license
  CC0-1.0 from EMPIAR policies (''All data in EMPIAR is freely and publicly available ... under the CC0 licence'')
  (was unknown). enricher: size_bytes 85,552,309,485 = sum of per-file Content-Length (EMPIAR API states 79.7 GB,
  i.e. GiB) (was 79.7e9). enricher: voxel size 10x10x40 nm confirmed by EMPIAR API image sets and the .am BoundingBox.'
