notes: 'Three volumes, each as a full stack (.am, 13-36 GB) plus a cropped .am carrying the labels; images
  are Amira .am files, labels TIFF and MIB .model, so formats lists tiff only. Paper Methods: structures
  were manually segmented on about every 10-15th slice in MIB, then used to train a DeepMIB U-net that
  produced the full model, hence source mixed; the cropped regions only are labelled (coverage partial).
  The entry''s image sets are typed as PNG 1376/936/1071 images; this was not reconciled with the .am
  file listing. License not shown on the EMPIAR entry page as fetched, the API record or the paper, so
  left unknown. Entry size 79.7 GB.'
