title: Serial Block Face Scanning Electron Microscopy dataset of fetal day 64 guinea pig psoas muscle in
  transverse
short_name: Guinea pig fetal psoas muscle (SBF-SEM)
description: 'Aligned stack of 93 SBF-SEM images (1024 x 1024) of a transverse section of late-fetal (day
  64) guinea pig psoas skeletal muscle, with an Amira surface model ("Labels.surf") of segmented structures.
  The stack accompanies the Journal of Microscopy guide to analysis and reconstruction of SBF-SEM data,
  in which the nucleus, nucleolus, chromatin and mitochondria are segmented in Fiji, Amira and MIB.'
