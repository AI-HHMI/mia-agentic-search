notes: 'A single small volume. The only annotation file is an Amira surface model of one ROI (name refers
  to slice 0007); which structures it contains is not stated on the EMPIAR entry or the paper, which
  segments nucleus, nucleolus, chromatin and mitochondria in this dataset with Fiji, Amira and MIB, so
  annotation coverage is unknown and the .surf must be converted to label volumes before training. The
  EMPIAR entry gives pixel size 0.0067628 um (6.7628 nm) and the paper gives 70 nm section thickness
  (z). Species name is derived from "guinea pig" in the paper (Duncan Hartley guinea pigs). License
  CC0 as listed by EMPIAR (the paper itself is CC BY 4.0). size_bytes is the total of the HTTP index
  of the data folder (rounded sizes); EMPIAR states 264.4 MB. The same paper also cites EMPIAR-10152
  (adult locust optic lobe), not covered here.'
