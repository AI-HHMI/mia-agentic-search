notes: 'A single small volume. The only annotation is an Amira surface model (.surf mesh, not a label
  volume; must be rasterized before training). Its header names materials Exterior, Inside, Mito, Nucleus,
  Nucleolus_1, Chromatin_, Material6 on a 1026x1026x95 grid (the stack plus 1 voxel padding). EMPIAR gives
  pixel size 0.0067628 um and z 70 nm; the .surf GridBox (um) agrees. Species from "guinea pig" in the
  paper (Duncan Hartley). License CC0 per EMPIAR. The same paper also cites EMPIAR-10152 (locust), not
  covered here. enricher: annotations.types semantic-segmentation+organelle (were instance-segmentation;
  the .surf holds per-class materials). enricher: annotations.source mixed (paper: Amira models used manual
  segmentation every 5th slice with interpolation, mitochondria thresholded). enricher: size_bytes 277221498
  from exact per-file listing (was HTTP index estimate).'
