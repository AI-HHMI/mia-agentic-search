schema_version: '1.2'
id: platelet-em-sbfsem-organelles
title: 3D Platelet EM - dense organelle segmentation of human platelets (SBF-SEM)
short_name: Human platelet organelles (SBF-SEM)
description: Labeled serial block-face SEM volumes of human blood platelets from Guay et al. 2021 (NIH/NIBIB LCIMB with UAMS),
  packaged on Hugging Face as multipage TIFF. Train and eval volumes come from donor 1, a held-out test volume from donor
  2. Dense 7-class semantic labels (background, cell, mitochondrion, alpha granule, canalicular vessel, dense granule, dense
  granule core), plus instance maps for train and eval.
