notes: 'Hugging Face mirror of the original platelet-em data (original hosted as platelet_data_1219.zip on Dropbox, linked from leapmanlab.github.io/dense-cell). License is the HF tag nih-public-release ("US-Government work (LCIMB, NIH/NIBIB)"); the lab page states no terms, so spdx is custom. Voxel size: the paper states 10 nm lateral and 50 nm axial for the source subjects; the HF README says ~40 nm z. The paper value is used here; the discrepancy is unresolved. Volumes are crops (train 50x800x800, eval 24x800x800, test 121x609x400) of the paper images (250x2000x2000 and 239x2000x2000). The README notes the released label indices 3=alpha granule and 4=canalicular vessel are the reverse of the paper text. n_items counts the three volumes (train/eval/test). download_url is null because the files are listed in the repo tree, not one archive.'
