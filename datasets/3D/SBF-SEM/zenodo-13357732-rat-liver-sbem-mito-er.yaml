notes: 'The Zenodo labels are model predictions (source automatic), not manual ground truth. The paper says the
  manual ground-truth annotation (120 patches, 18 slices) is shared on a GitHub repository, but that URL (github.com/Xrioen/cross-tissue-transfer-learning-in-VEM)
  returned 404, so manual labels were not seen. Voxel size 8 x 8 x 50 nm from the paper Methods and Zenodo text.
  Both files are VAST formats (open with VAST Lite), hence formats other; their internal layout was not inspected.
  The two files total 30.2 GB. enricher: both VAST headers store a 7000 x 7000 x 219 grid and 8, 8, 50 voxel size,
  matching the record.'
