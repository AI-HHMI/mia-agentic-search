title: Volumetric electron microscopy of rat liver section, raw data + mitochondria and ER predictions
short_name: Rat liver mitochondria and ER (SBF-SEM)
description: A serial block-face SEM volume of rat liver (219 sections, 50 nm thick, 7000 x 7000 px tiles at 8 nm
  per pixel) as a VAST project, together with whole-volume mitochondria and endoplasmic reticulum
  segmentations predicted by a transfer-learned 3D ResU-Net, released with a paper on cross-tissue
  transfer learning for organelle segmentation.
