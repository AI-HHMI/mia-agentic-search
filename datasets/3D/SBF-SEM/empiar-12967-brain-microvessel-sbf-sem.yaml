description: Two SBF-SEM volumes of 3D-engineered human brain microvessels (endothelial cells and pericytes
  in collagen hydrogel), one treated with media only and one with P. falciparum egress media, each with
  the 8-bit image volume binned to 22x22x250 nm and a matching segmentation volume (endothelial cells
  and pericytes, semi-manual in Amira).
