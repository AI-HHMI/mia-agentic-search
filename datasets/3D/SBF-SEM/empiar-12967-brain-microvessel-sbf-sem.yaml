notes: 'EMPIAR lists 4 TIFF stacks: two 8-bit volumes (379 and 405 slices) and a segmentation stack for
  each. Paper Methods (bioRxiv preprint): acquired at 15 nm pixel / 50 nm slices on Zeiss Gemini2 + Gatan
  3View, binned to 22x22x250 nm for segmentation; endothelial cells and pericytes segmented semi-manually
  (every fifth section, interpolated) in Amira. Label values not stated in sources read; the sampled segmentation
  holds 40 distinct values, so it may separate individual cells. No train/test split. Homo sapiens from
  primary human cells in Methods. Preprint data availability statement absent. enricher: size_bytes =
  2,509,000,400 B from an exact listing of the 5 files (was null). enricher: ImageJ calibration in the
  raw stacks says 73.3 nm xy and 249.8 nm z, which conflicts with the 22 nm in the file names and paper;
  record value kept.'
