notes: 'EMPIAR API lists 4 TIFF stacks: two 8-bit volumes (379 and 405 slices) and a segmentation stack for each. Dataset size 2.3 GB per EMPIAR; exact byte count not given. Paper Methods (bioRxiv preprint): acquired at 15 nm pixel / 50 nm slices on Zeiss Gemini2 + Gatan 3View, binned to 22x22x250 nm for segmentation; endothelial cells and pericytes segmented semi-manually (magic wand/brush on every fifth section, interpolated) in Amira. Segmentation is therefore partly interpolated. Label values (which integer is endothelium vs pericyte) not stated in sources read. Labelled semantic-segmentation (two cell types); whether instances are separated is not stated. No train/test split. Humans: Homo sapiens from primary human cells in Methods. Download method not verified (EMPIAR offers several transfer options). Preprint data availability statement absent.'
