notes: 'Original release: the lab page links a Dropbox ZIP (platelet_data_1219.zip,
  about 180 MB) with images, labels and a training error-weighting array; no license
  or terms on that page, so license is unknown. The class scheme, volume sizes (50x800x800,
  24x800x800, 121x609x400) and the 40x10x10 nm voxel size (z,y,x) come from the Hugging
  Face mirror card MedOtter/3D-Platelet-EM (which says it follows the official distribution)
  and the paper''s description of the subvolumes; the paper text read does not state
  a voxel size (it says volumes were binned by 2 in x and y). The mirror also says
  the released integer encoding swaps alpha granule and canalicular vessel relative
  to the paper''s prose. The ZIP contents were not listed (Dropbox link, not opened),
  so formats and file counts are taken from the mirror and unverified; labels are
  manual (Amira, tool-assisted) and repeatedly expert-reviewed per the paper. n_items
  counts the three volumes.'
