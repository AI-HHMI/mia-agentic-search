notes: 'Voxel size 16 x 16 x 25 nm (extent 8192 x 7424 x 3328 voxels) from the BossDB coordinate frame;
  licence CC-BY-4.0 from the DataCite record of the BossDB DOI. The paper is not open access (Europe PMC
  has no full text), so only the abstract was read: it describes crowd-sourced manual annotation plus
  machine-learning segmentation of serial block-face EM data. How the BossDB segmentation channel relates
  to the proofread reconstructions (and the volume extent of annotated regions) is not stated on the pages
  read. enricher: the segmentation layer (9216 x 8192 x 3360) extends past the image (8192 x 7680 x 3328)
  from the same origin at the same resolution.'
