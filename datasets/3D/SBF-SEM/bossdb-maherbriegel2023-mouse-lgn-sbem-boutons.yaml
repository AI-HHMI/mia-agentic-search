  notes: 'Full S3 listing of MaherBriegel2023/ (tools/listing.py, 99,239 objects, exact sizes, 42,790,278,159 B
    incl. meshes). All six info files probed: uint8 images 8192x8192x200 (Lgn200) and x300 (Lgn300), uint64 segmentations,
    encoding raw, served gzip, resolution 5x5x75 nm, voxel_offset 0. Sampled: Lgn200/sbem 5_5_75 chunk 4096-4224_4096-4224_96-128
    (uint8 0-255, mean 141), one full-res cells chunk (all background), and the 80_80_75 chunk 0-512_0-512_64-128
    of each label layer (cells {0,1,2}, synapses 38 values max 255, terminals 64 values max 255, vessels {0,3,4});
    value ranges are from these chunks only. Label encodings are left unknown: the IDs look like object IDs, but
    no source says so, and the layers were exported from Reconstruct tracings (paper Methods). License: none on
    the BossDB API, S3 prefix or the paper (Data availability only names BossDB); the AWS Open Data registry entry
    for bossdb-open-data lists CC-BY-4.0, CC0-1.0 and CC-BY-NC-SA-4.0 across projects without saying which applies
    here.'
