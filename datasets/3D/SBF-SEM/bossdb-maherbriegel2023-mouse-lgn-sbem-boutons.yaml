notes: 'Landing page is a JS shell; facts come from the BossDB API, S3 listing and the paper (Methods 2.1-2.2, Data
  availability). Lgn200 (8192 x 8192 x 200) has layers sbem, cells, synapses, terminals, vessels; Lgn300 (8192 x
  8192 x 300) has only sbem. Paper: 1,048 boutons traced by unbiased sampling plus 80 dendrite segments, so labels
  cover only traced objects (partial). No licence found on the BossDB project, API or paper text read; the paper
  is open access (Frontiers). Imaging done at Renovo Neural; microscope model not stated. enricher: size 42.8 GB
  from the full S3 listing (was null).'
