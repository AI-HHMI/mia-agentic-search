title: Citizen science, cells and CNNs – deep learning for automatic segmentation of the nuclear envelope in electron
  microscopy data, trained with volunteer segmentations
short_name: HeLa nuclear envelope segmentation (SBF-SEM)
description: 'Benchmark data from the Etch a Cell citizen-science project: nuclear envelope segmentations of HeLa
  cells imaged by serial block-face SEM (10 nm pixels, 50 nm slices). The BioStudies record holds 2 expert manual
  segmentation stacks, 18 consensus segmentation stacks aggregated from volunteer annotations (CRIA algorithm),
  18 U-Net prediction stacks and the raw Zooniverse classifications. The corresponding raw EM ROIs (18 cropped regions)
  are deposited separately as EMPIAR-10478 (full volume EMPIAR-10094).'
