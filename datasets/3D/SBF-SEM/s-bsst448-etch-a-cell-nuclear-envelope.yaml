notes: 'No license stated on the BioStudies record or EMPIAR-10478 entry (the CC-BY 4.0 in the preprint covers the
  article). Raw images are not in this study: they are EMPIAR-10478 (18 TIFF ROI stacks, 2000x2000x300, 15.6 GB,
  no annotations there) and EMPIAR-10094 (full volume); ROI names in Aggregations.zip match the paper''s 18 cells.
  Only 2 ROIs have expert ground truth; the rest are volunteer-consensus masks. Voxel size and sample from paper
  Methods (10 nm pixel, 50 nm slice; data downscaled to 50 nm isotropic for model). Expert/Aggregation file contents
  listed via peek_archive; whether masks are binary vs. labelled was not inspected. n_items counts the 2+18+18 TIFF
  stacks in the zip listings (Predictions.zip count taken from the study page). enricher: size_bytes = BioStudies
  files (exact) + EMPIAR-10478 ROIs (rounded index), estimated (was null).'
