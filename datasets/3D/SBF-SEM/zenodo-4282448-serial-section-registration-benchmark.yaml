title: Evaluating registrations of serial sections with distortions of the ground truths. Supplemental
  data
short_name: Serial-section registration benchmark (EM, LS, CT)
description: 'Benchmark data for registration of serial sections with known ground truth: undistorted
  3D stacks of animal lungs (SBF-SEM of adult mouse lung, 1000 images of 1.5k x 1.5k px; UltraMicroscope
  II light-sheet of rat lung, 300 images of 3.9k x 3.9k px; micro-CT of rabbit lung, 600 images) plus
  versions with synthetic local distortions, local distortions with global rigid transformations (the
  benchmark input), SURF-rigid pre-registered versions, distortion maps, the true rigid transformations,
  visualisations and elastix parameter files. A REAL set holds two real toluidine-blue serial sections
  of the rabbit lung as reference.'
