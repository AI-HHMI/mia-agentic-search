notes: 'Task is registration of serial sections: ground truth is the undistorted stack, the distortions are synthetic
  (generated with github.com/olegl/distort), so no manual labels. Files are 22 .7z archives that peek_archive cannot
  list, so image file format and exact per-set image counts beyond the paper (EM 1000, LS 300, CT 600 + 50 extra
  at each end in some sets, REAL 2) were not verified; formats is other for that reason. Voxel size varies by modality
  (paper: EM 0.15 um/voxel in the benchmark crop, assumed isotropic here; light-sheet 5.16 x 5.16 x 15 um; micro-CT
  7.0 um isotropic; REAL sections 0.22 um/pixel), only the EM value is recorded. Images were reduced to 8 bit and
  EM/LS were individually normalised per the paper. Paper full text read from the arXiv preprint (CC BY-NC-ND);
  the Zenodo record states CC-BY-4.0 for the data.'
