notes: 'Task is registration of serial sections: ground truth is the undistorted stack, distortions are
  synthetic (github.com/olegl/distort), so no manual labels. Voxel size differs by subset, so voxel_size_nm
  is null (paper): EM 0.15 um/voxel, LS 5.16 x 5.16 x 15 um/voxel, CT 7.0 um isometric, REAL 0.22 um/pixel.
  Images reduced to 8 bit; EM/LS normalised per the paper. Paper read from the arXiv preprint (CC BY-NC-ND);
  Zenodo states CC-BY-4.0 for the data. organisms: Mus musculus = EM_*.7z, Rattus norvegicus = LS_*.7z,
  Oryctolagus cuniculus = CT_*.7z and REAL_challenge.7z. modality: SBF-SEM = EM_*, light-sheet = LS_*,
  X-ray (micro-CT) = CT_*; REAL = toluidine-blue light micrographs. enricher: voxel_size_nm null (was
  150x150x150, EM only); formats png, tiff from the 7z indexes (was other).'
