notes: 'HF dataset card and API: MIT license in card metadata, no paper or citation linked, so none is listed. Files: train/
  and test/ each hold one raw stack (~148 MB) plus Labels_*.tif (~3 MB); the volume (281 slices) is split in half along x
  (234 slices x 1125 x 563 px per half per the TIFF header). Voxel size is not stated on the card; ~18 nm isotropic is derived
  from the MIB ''BoundingBox'' in the TIFF header (x 10.116 um/563 px, y 20.232 um/1125 px, z 4.194 um/234 slices, all ~18
  nm), so treat it as inferred. Organism is inferred from the Vero cell line (the card does not name the species). Label values
  and the page axis (z) are not documented; ''organelle'' = mitochondria. Microscope model not stated. enricher: size 302840780
  B from the HF file listing (was the harvester sum); axes zyx from the MIB header (Chop [y,x,z]: z1:z2 1:234).'
