  notes: 'Listed via the HF tree API (6 files, 302840780 B, complete). Probed both train TIFFs: plain multi-page TIFF, 234
    pages of 1125x563, uint8; raw uncompressed, labels LZW. Header ImageDescription (MIB): "BoundingBox 9.738 19.854 -0.450
    19.782 0.407 4.601 ... MIB Chop: [y1:y2,x1:x2,:,z1:z2,t]: 1:1125,564:1126,:,1:234,1", so pages are z (axes zyx). Sampled
    the train pair: raw 0-255 (mean 131, p1 0, p99.9 255; full range used and saturated at both ends, so contrast-stretched
    is inferred), labels {0: 18325437, 1: 200782} (1.1% foreground, binary; class 1 = mitochondria per the card). Value ranges
    are from one sample. Voxel size 18 nm isotropic is the record value derived from the MIB BoundingBox (um extents / pixel
    counts, ~17.9-18.0 nm per axis); no page states it (checked: TIFF headers, HF card, HF API, sibling H446 card which states
    90 nm for its own data, web search for a paper or code repo: none found). No single archive: files are per-file HF resolve
    URLs (direct, range requests). README says 281x1126x1125 px; the files hold 234 z slices per half.'
