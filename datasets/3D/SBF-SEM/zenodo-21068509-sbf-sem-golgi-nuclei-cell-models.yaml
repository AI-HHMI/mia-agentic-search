title: Test datasets for Golgi Orientation plugin of Microscopy Image Browser
short_name: Cell, nucleus and Golgi segmentation (SBF-SEM)
description: Four downsampled serial block-face SEM volumes (isotropic 80 nm voxels, Amira Mesh) with MIB segmentation models.
  Three cropped-cell volumes (BStem01-03) each carry a multi-material model for cell outline, nucleus and Golgi apparatus;
  one complete volume carries three model files with consistent cell, Golgi and nucleus labels. Example data for the Golgi
  Orientation plugin of Microscopy Image Browser.
