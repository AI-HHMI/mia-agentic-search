notes: 'Both zips listed with peek_archive: 01_Cropped_cells_80nm.zip holds three .am volumes (8.7-11.4
  MB) with one Labels_*.model each, and 02_Complete_models_80nm.zip holds one 377.7 MB .am volume with
  three Labels_*.model files; each also contains a GolgiOrientation.mat/.xls result file. The volumes
  are downsampled versions of the plugin paper data, so they are small example data rather than a full
  training set. The description does not name the reference publication or say how the segmentations were
  made (manual or automatic), nor the species or tissue, so organism is empty and annotation source is
  unknown; no paper was cited on the page and a title search did not identify it. Total 4 volumes, 276
  MB. enricher: formats other -> hdf5: the MIB .model files are MATLAB 7.3 MAT files (HDF5, label volume
  imOut); the raw .am volumes are Amira Mesh, not in the format list.'
