description: Three serial block-face SEM subvolumes of human platelets (training, evaluation and test) with manual voxel-wise
  labels in seven classes - background, cell, mitochondrion, canalicular channel, alpha granule, dense granule and dense
  granule core - plus a training error-weighting array, released with the dense cellular segmentation 2D-3D ensemble paper.
