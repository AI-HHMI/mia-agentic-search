notes: 'Zip listed with peek_archive (188.7 MB compressed, 411.6 MB uncompressed, 7 TIFFs): train-images/-labels, eval-images/-labels,
  test-images/-labels and train-error-weights (256 MB). Paper (open access, full text read): training image 50x800x800 voxels and
  evaluation image 24x800x800 from donor 1, test image 121x609x400 from donor 2; training and evaluation labels cover the whole
  volume, the test labels cover a single cell, hence partial coverage. Labels were made tool-assisted in Amira and reviewed by
  experts. No license: the lab page only says the data is freely available for replication. Voxel size is not stated on the page or
  in the paper text (the data were binned by 2 in x and y). The authors list was not extracted; the dataset has no DOI.'
