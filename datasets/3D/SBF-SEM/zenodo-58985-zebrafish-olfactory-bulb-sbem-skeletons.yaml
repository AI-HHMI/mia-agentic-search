title: Dense skeleton reconstructions of neurons in the larval zebrafish olfactory bulb (SBEM volume
  with 1,022 traced neurons)
short_name: Zebrafish olfactory bulb neuron skeletons (SBEM)
description: Serial block-face EM stack of the olfactory bulb of a 4.5 dpf zebrafish larva (4,746 images at
  9.25 x 9.25 x 25 nm), with manually traced and error-corrected skeletons of 1,022 neurons (~98% of the olfactory
  bulb neurons) and 17 annotated glomeruli. The skeletons are on Zenodo; the image volume is served by BossDB
  (collection wanner16).
