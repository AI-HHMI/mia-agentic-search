notes: 'Per-cell voxel sizes in the EMPIAR entry vary (about 27-36 nm in xy and 65-90 nm in z for most cells; a few entries list odd values such as 3 x 3 x 75 or 70 x 70 x 65 nm, and the DM4 raw sets give none), and the paper states raw pixel size depended on the cell, so voxel_size_nm is left null; the paper analysed data binned to 25 x 25 x 60 nm. Three cells (Anaphase 4, Metaphase 1, Prometaphase 3) are raw 16-bit DM4, the others binned 8-bit TIFF. Segmentation: chromosomes thresholded on the cytoplasm-chromosome grey-value difference and separated with the Amira separate objects module, with chromosome identity assigned by the authors (paper Methods), hence source mixed. Only the Anaphase 1 AMIRA files folder (Chr.am, SegChromosomes.label.am) was listed directly; the EMPIAR entry lists segmentations for all 13 cells. Labels are in the proprietary Amira format, which may need conversion. Organism is Homo sapiens (RPE1 hTERT CDK1as cells); cell stage counts follow the EMPIAR image set names.'
