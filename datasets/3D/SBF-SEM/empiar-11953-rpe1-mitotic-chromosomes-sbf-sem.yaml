title: Exploring the 3D structure of chromosomes in mitotic cells
short_name: Mitotic chromosomes in human cells (SBF-SEM)
description: Thirteen SBF-SEM volumes of whole human RPE1 cells from prometaphase to telophase (two early and two late prometaphases, three metaphases, four anaphases, two telophases), each with chromosome segmentation and, for most cells, individually separated chromosomes or chromatids as Amira label files. Image stacks are TIFF (8-bit, binned) or raw 16-bit DM4.
