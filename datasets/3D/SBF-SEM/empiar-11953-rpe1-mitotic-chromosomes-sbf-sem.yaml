notes: 'Per-cell voxel sizes in the EMPIAR entry vary (about 27-36 nm in xy and 65-90 nm in z for most
  cells; a few entries list odd values such as 3 x 3 x 75 or 70 x 70 x 65 nm, and the DM4 raw sets give
  none), and the paper states raw pixel size depended on the cell, so voxel_size_nm is left null; the
  paper analysed data binned to 25 x 25 x 60 nm. Three cells (Anaphase 4, Metaphase 1, Prometaphase 3)
  are raw 16-bit DM4, the others binned 8-bit TIFF. Segmentation: chromosomes thresholded on the cytoplasm-chromosome
  grey-value difference and separated with the Amira separate objects module, with chromosome identity
  assigned by the authors (paper Methods), hence source mixed. Cell stage counts follow the EMPIAR image
  set names. enricher: labels are AmiraMesh files (every cell folder has some); 3 cells are DM4 only.
  "Early prometaphase 1" and "Early prometphase 1" look like copies (169 tif + 2 am each).'
