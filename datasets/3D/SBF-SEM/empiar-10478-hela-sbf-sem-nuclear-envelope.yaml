notes: 'Raw ROIs are in EMPIAR-10478 (18 TIFF stacks, 100 A pixel, 50 nm slices, per EMPIAR API); masks are hosted
  separately on BioStudies S-BSST448, whose record states no license (EMPIAR entry is CC0 per its license badge;
  the preprint is CC BY 4.0). Mask stacks match the ROI file names (peek_archive of Aggregations.zip/Expert.zip).
  The full 8192x8192x518 source volume is EMPIAR-10094. Slices per ROI vary (150-300; edge ROIs smaller). Aggregated
  masks come from volunteer annotations (CRIA algorithm), expert masks exist only for 2 ROIs. Annotation sources:
  Aggregations = volunteer manual tracings merged by CRIA; Expert = manual (2 ROIs). enricher: headers confirm 10x10x50
  nm (ImageJ calibration).'
