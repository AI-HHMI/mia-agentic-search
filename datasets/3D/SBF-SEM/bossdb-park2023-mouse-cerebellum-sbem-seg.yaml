notes: 'Facts come from the BossDB API (collection, experiment, coordinate frame, channels), the S3 info files of the em and seg channels and the DataCite record (CC BY 4.0, title, creators); the project page itself is script-rendered. The BossDB coordinate frame lists 7296 x 5120 x 1024 voxels while the S3 info of seg gives 14592 x 10240 x 1024 at 12 nm, so the extent is quoted from the info file. No paper, organism detail beyond mouse, annotation procedure or segmentation proofreading status was found: the DataCite record has no related identifiers and a web search for the 2023 study returned nothing, so annotation source and coverage are unknown. The date is the DataCite year 2023.'
