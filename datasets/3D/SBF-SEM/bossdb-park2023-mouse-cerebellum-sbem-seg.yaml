    chunk 12_12_50/7168-7680_5120-5632_512-513: em (242 KB gzip) uint8 min 0 max 255, p1/p50/p99 51/168/230;
    seg (11 KB gzip) uint32, 70 ids, max 43253, 18.7% zero; ranges from one chunk. encoding instance-ids
    from the sample (dozens of large ids in one 512x512 tile of a neuron segmentation layer). Voxel 12x12x50
    nm from the info files, agrees with the record. A complete S3 listing was not feasible (~1.6 M chunk
    objects; stopped after 15 min). Annotation source and coverage stay unknown: no paper found (DataCite
    has no related identifiers; a web search by authors found none). size estimated (uncompressed): raw 1 x 1024x10240x14592 uint8 + label 1 x 1024x10240x14592 uint32 = 765,041,049,600 B (765.0 GB), finest level only.'
