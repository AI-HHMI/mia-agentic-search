notes: 'The Zenodo record holds only the label images (300 slices, TIFF + MAT); the raw SBF-SEM images (EMPIAR-10094,
  DM4, 8192x8192 px, 517 slices, 10x10x50 nm) are a separate download, and the paper trains on 2000x2000 crops. Ground
  truth was made with manual nuclear-envelope delineation (Amira) combined with algorithmic steps (paper Methods), hence
  source mixed. Train/test split not provided as files (paper uses a slice subset for U-Net training). EMPIAR-10094 license
  not stated in the API record; paper text is CC-BY 4.0. enricher: size_bytes from the exact Zenodo file listing (601
  files; was 76,725,730).'
