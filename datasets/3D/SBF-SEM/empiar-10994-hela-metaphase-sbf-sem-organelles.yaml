description: Two SBF-SEM volumes of HeLa cells in metaphase (control, 578 sections; REEP3/4 knockdown, 471 sections; 30 nm sections, about 15 nm pixels) with organelle label volumes covering a quadrant of each cell. Control labels distinguish mitochondria, ER, ER near chromosomes, chromosomes, centrioles and peripheral ER, plus a whole-cell outline; knockdown labels cover mitochondria, lipid droplets, ER and chromosomes.
