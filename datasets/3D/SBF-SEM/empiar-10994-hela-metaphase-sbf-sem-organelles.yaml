notes: 'Two cells, each a stack of per-section 2D TIFFs: control (160621_HeLa_Control, 578 sections, EMPIAR
  pixel 151.884 A = 15.19 nm) and REEP3/4 KD (161107_HeLa_REEP3-4_KD_LBR, 471 sections, 148.183 A = 14.82
  nm); z 30 nm for both (EMPIAR). enricher: voxel size 15.19x15.19x30 -> null (the two cells differ in
  x/y). Raw volumes are 16-bit DM4 (01_original_images); 8-bit aligned, cropped, contrast-normalised TIFFs
  in 02_processed_dataset; labels in 03_models. Labels cover one quadrant of each cell and the spindle
  interior (readme: "Model of one quadrant"). Segmented in Microscopy Image Browser; manual vs semi-automatic
  not stated, so source unknown. Size 8.7 GB is the EMPIAR entry size. No train/val/test split.'
