notes: 'Two cells: control (160621_HeLa_Control, 578 sections, EMPIAR API pixel size 151.884 A = 15.19 nm) and REEP3/4 KD (161107_HeLa_REEP3-4_KD_LBR, 471 sections, 148.183 A = 14.82 nm); voxel_size_nm gives the control values, the paper Methods state about 15 nm XY and 30 nm sections. Raw volumes are 16-bit DM4 (01_original_images), processed 8-bit TIFF stacks are in 02_processed_dataset (the control folder also holds an Amira .am file); the formats field lists tiff only for the processed and label stacks. Labels cover only one quadrant of each cell and the spindle interior. Segmentation was done in Microscopy Image Browser per the paper; whether it was manual or semi-automatic is not stated in the paper text or EMPIAR entry, so annotations.source is unknown. Size 8.7 GB is the EMPIAR entry size, given as 8700000000 bytes. No train/val/test split.'
