title: Segmentation of brain ultrastructures in 3D electron microscopy
short_name: Rat white and gray matter ultrastructure (SBEM)
description: Serial block-face SEM volumes of rat brain, 10 white matter samples (corpus callosum and cingulum of sham-operated
  and traumatic-brain-injury rats, each at low resolution 50 nm isotropic and high resolution 15 x 15 x 50 nm) and 6 gray
  matter samples (somatosensory cortex layer VI), with automatic segmentations of myelin, myelinated axons and (low
  resolution) cell nuclei produced by the ACSON, DeepACSON and gACSON pipelines.
