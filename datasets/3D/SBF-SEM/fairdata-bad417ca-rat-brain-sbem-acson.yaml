notes: 'Metax file listing (89 files, 107.8 GB): per sample folder, White matter EM has <id>.h5 images (HM = high resolution
  15 x 15 x 50 nm, 15 um cube, about 0.3-0.5 GB; LM = low resolution 50 x 50 x 50 nm, 200 x 100 x 65 um, 5-11 GB), plus _myelin.mat,
  _myelinated_axons.mat and LM _nucleus.mat segmentations; Gray matter EM has .mat image volumes (HM, 15 x 15 x 50 nm) with
  _myelin.mat and _myelinated_axons.mat. n_items 26 = 20 white matter volumes (10 samples x 2 resolutions) + 6 gray matter
  volumes. The labels are automatic (ACSON / DeepACSON / gACSON), not manually proofread; the paper reports expert evaluation
  of 50 low-resolution patches. voxel_size_nm gives the high-resolution setting; low-resolution volumes are 50 x 50 x 50 nm.
  The .mat files were not opened (whether they are HDF5-based v7.3 is not stated); the README.docx in the dataset was not read.
  No direct download URL was found: files are served through the Fairdata (IDA) service.'
