notes: 'FTP: P400_SBF_SEM_F1S1_run17_EMPIAR-10463/ (raw Digital Micrograph .dm4 slices, ROI_00 to ROI_04), ROI00_composite/Composite.tif
  (4.6 GB) and Survey_Image.dm4. Annotation is sparse: per the paper a middle slice of each visible Toxoplasma (39 parasites in
  two larvae; 36 in the fish shown) was manually segmented in TrakEM2 to aid correlation, not a dense labelling. EMPIAR gives
  50 nm pixels (500 A) for the composite and 6-7.8 nm for ROI01-04; z step is 50 nm per the paper; the .dm4 raw format is not
  in the schema list (formats lists the TIFF composite). Authors are not listed in the EMPIAR API record. Related BioStudies
  S-BSST429 not read.'
