notes: 'Annotations (this deposit, 713 MB, IMOD .mod/.obj for SBEM volumes 1-4) are separate from the
  images: the raw SBEM volumes (SBEM_Volume_1-4 as .mrc, 90.9 GB in total) are in the companion Dryad
  deposit doi:10.5061/dryad.8kprr4z3r (CC0), and the paper says the volumes are also in the Cell Image
  Library (CIL:57519, 54614, 54609, 57579). size_bytes is the sum of both Dryad deposits. Volume 1 covers
  about 70% of antennal sensilla; volumes 2-4 are subsets, so coverage is partial; models are contours
  drawn in IMOD, so they must be converted to label volumes before training. Voxel size and section thickness
  are not stated on either Dryad page, the eLife reviewed-preprint Methods or the Dryad READMEs. Dryad
  file downloads need a bearer token, so no direct download link is given. Organism from the paper; strain
  not specified. enricher: download_url set to the image deposit page (no direct link: Dryad API 401).'
