title: Zebra finch J0126 SBEM - densely labelled neurite training volumes with skeleton validation and test sets
short_name: Zebra finch neuropil neurite labels (SBEM)
description: Hugging Face repack of the J0126 zebra finch serial block-face EM ground truth from the flood-filling-networks paper,
  with 33 densely labelled neurite subvolumes (150 voxels per side, one 128 x 256 x 256), manually traced skeletons of 12 validation
  and 50 test neurons, and 465 proofread nucleus instances at 80 nm. The raw volume itself is on Google Cloud Storage.
