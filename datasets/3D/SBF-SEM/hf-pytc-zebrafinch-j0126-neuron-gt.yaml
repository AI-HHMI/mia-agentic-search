notes: 'Read the HF card and API record, listed the 395 MB training zip (165 HDF5 files in im_raw, seg_gt and padded variants), and
  the authors'' original Google Cloud README, which describes 33 dense ground-truth HDF5 volumes (uint64 /main, ZYX), the realigned
  raw volume and the FFN segmentation, all at 9 x 9 x 20 nm. The HF card states MIT; the original GCS README states no license,
  so the terms come from the HF re-host. The paper is not open access, so only its abstract was read; sample details
  and imaging are not confirmed from the full text, and the organism comes from the dataset name and the README. The
  large raw image volume (precomputed, GCS) and the 1.7 GB tissue mask tar are not part of the n_items count. Authors are
  from the paper citation in the GCS README. enricher: size_bytes is now all 7 HF files (was the zip only).'
