    resolution attributes. No pixel sample measured: sample.py cannot read an HDF5 dataset inside a zip and does
    not read N5, so value ranges and label value sets are unknown (one sample.py attempt on nuclei_05 downloaded
    the 11.5 MB member and then refused it as HDF5-in-zip). Shapes are per representative block; other blocks differ
    (membrane 9, nuclei 12, cuticle 5, cilia 5).'
