notes: 'Four zips (membrane 3.05 GB, nuclei 3.05 GB, cuticle 0.34 GB, cilia 0.32 GB). Listings via peek_archive:
  membrane is N5 (3,538 files, including volumes/labels/segmentation; 9 blocks per the record); nuclei 12 HDF5 blocks;
  cilia 5 HDF5 files (train_data_cilia_01-03, val_data_cilia_01-02); cuticle N5 blocks. Voxel size varies by structure:
  membrane 20x20x25 nm, nuclei 80x80x100 nm, cuticle 40x40x50 nm; cilia is 20x20x25 nm on the Zenodo record but
  the paper Methods say cilia segmentation used full resolution 10x10x25 nm, so the cilia pixel size is uncertain.
  The voxel_size_nm field holds the membrane value. Labels were annotated by human experts in KNOSSOS per the paper,
  with some initial membrane and nuclei training data from ariadne.ai (per record). The bioimage.io upload zenodo
  13219871 is a pointer to this record and is not a separate dataset. Raw/label dataset names inside the HDF5/N5
  files were not read. size_bytes is the sum of the four zips.'
