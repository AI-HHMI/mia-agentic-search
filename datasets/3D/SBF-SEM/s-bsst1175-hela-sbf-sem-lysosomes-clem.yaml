  notes: 'BioStudies API lists 5 files with exact sizes (37,567,888,633 B); size_source page-stated. Headers probed for the
    label and both composites. tools/sample.py fails on these EBI files (range reader error), so label slices z 40, 66 and
    95 (105.5 MB each) and the 5 channels of 28 nm composite slice 66 were read directly by range (about 351 MB); values are
    from those slices only. Voxel size: no single value, since the arrays differ (label 7 nm, composites 14 and 28 nm xy,
    all 50 nm z; ImageJ headers and file descriptions); checked: headers, BioStudies record, paper Methods (binned x2 and
    x4 from 7 nm). The unregistered Airyscan CZI and BigWarp landmarks CSV are listed in the layout, not as arrays. Download:
    every file is a direct, range-capable HTTPS link on ftp.ebi.ac.uk (download-check usable for the label and both composites);
    no single archive, so download_url is the Files/ folder.'
