title: Benchmark Airyscan data matching SBF SEM data deposited on EMPIAR-11666
short_name: HeLa SBF-SEM lysosomes with Airyscan (CLEM)
description: Volume CLEM benchmark of a HeLa cell. A Zeiss LSM900 Airyscan fluorescence stack (Hoechst, GFP-TGN46,
  LysoTracker, MitoTracker) of the fixed cell, the same cell imaged by SBF-SEM at 7 nm xy (binned composites at
  14 and 28 nm), BigWarp landmarks, and a manual 3D segmentation of 4 lysosomes in the SBF-SEM volume
  (TrakEM2 label TIFF).
