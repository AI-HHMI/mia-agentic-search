notes: 'Only 4 lysosomes are labelled in a single cell volume, so the annotation is sparse and intended as a registration
  accuracy benchmark. The raw SBF-SEM stack (native 7x7x50 nm per the paper) is on EMPIAR-11666, not in this study; this study
  holds the Airyscan stack, landmarks, labels and composites. Sizes sum the 5 files in the BioStudies record. enricher: voxel
  size null (was 7x7x50): files differ, label 7.01x7.01x50 nm, composites 14.03x14.03x50 and 28.06x28.06x50 nm (ImageJ headers,
  file descriptions). enricher: license custom (was CC0-1.0, which no fetched page states; the BioStudies record has no license
  field): BioImage Archive FAQ says unlicensed data "are available under the EMBL-EBI Terms of Use which places no restrictions
  on use or redistribution".'
