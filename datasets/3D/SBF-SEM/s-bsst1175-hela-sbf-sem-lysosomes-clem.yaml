notes: 'Only 4 lysosomes are labelled in a single cell volume, so the annotation is sparse and intended as a registration
  accuracy benchmark; it is small as a segmentation training set. Voxel size: the paper Methods state the EM volume
  was binned x2 and x4 in xy to 14x14x50 nm and 28x28x50 nm, so native is 7x7x50 nm (labels are at 7 nm). The
  raw SBF-SEM stack itself is on EMPIAR-11666, not in this study; this study holds the Airyscan stack, landmarks,
  labels and composites. Sizes sum the 5 files listed in the BioStudies record (about 37.6 GB). No direct download
  URL recorded; the BioStudies page and API list the files.'
