notes: 'Files named on the CAI2R page: datac.nii (200-slice SEM stack), maskc.nii, myelin_mask.nii, fibers.nii;
  no direct links: a form (email, affiliation, agreement to terms, reCAPTCHA) must be submitted, hence access=registration.
  Terms (custom): free of charge, non-commercial academic use only, credit the author and cite the related papers.
  Acquisition per the 2019 paper (PMC6510616): 3View SBF-SEM (Zeiss Gemini 300), 6x6x100 nm as acquired, downsampled
  to 24x24x100 nm, first 200 of 401 slices kept (36x48x20 um). annotations source mixed: fibers.nii = 321 axons
  by random walker from 451 manual seeds (semi-automatic, validated against 97 manually carved axons); myelin_mask.nii
  = automatic (ilastik pixel classifier); maskc.nii foreground mask, method not stated. enricher: files not inspectable
  (registration form only); NYU data catalog and RaW-seg GitHub README also point only to the form.'
