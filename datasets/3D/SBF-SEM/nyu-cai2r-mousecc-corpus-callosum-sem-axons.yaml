short_name: Mouse corpus callosum axon segmentation (SBF-SEM)
description: One 3D serial block-face SEM volume (200 slices, 24 x 24 x 100 nm) of the mouse genu of the
  corpus callosum with a foreground mask, a myelin mask and a semi-automatic intra-axonal space (axon)
  segmentation, from Lee et al. 2019 (also cited by the NYU Langone data catalog). Data are released on
  the CAI2R website after a registration form.
