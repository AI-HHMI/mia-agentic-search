notes: 'Files named on the CAI2R page: datac.nii (200-slice SEM stack), maskc.nii, myelin_mask.nii, fibers.nii;
  no direct links, a form (email, affiliation, agreement to terms) must be submitted, hence access=registration.
  Terms (custom): free of charge, non-commercial academic use only, credit the author and cite the related
  papers. Acquisition per the 2019 paper (PMC6510616): 3View serial block-face SEM on a Zeiss Gemini 300,
  6 x 6 x 100 nm as acquired, downsampled to 24 x 24 x 100 nm, first 200 of 401 slices kept (36 x 48 x
  20 um). Segmentation: 321 axons by random-walker from 451 manual seeds with a myelin mask from an ilastik
  pixel classifier (semi-automatic, proofread), validated against 97 manually carved axons. Annotation
  files not listed inside an archive (NIfTI names taken from the web page), so annotations_verified is
  false. The 2019 paper''s data availability statement was not seen in the part of the text read. A DOI
  for the dataset is not given.'
