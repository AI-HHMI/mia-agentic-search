title: Zebra finch j0126 SBEM - dense neuron instance labels and skeletons from the flood-filling network paper
short_name: Zebra finch j0126 neuron segmentation (SBF-SEM)
description: Processed ground truth for the zebra finch brain serial block-face EM volume j0126 used in the
  flood-filling network (FFN) paper. 33 densely labeled 150-voxel subvolumes (raw image plus neuron instance
  labels, with padded variants), manually traced skeletons for 12 validation and 50 test neurons, 465
  proofread nucleus instances at 80 nm and a tissue/border exclusion mask for the full volume.
