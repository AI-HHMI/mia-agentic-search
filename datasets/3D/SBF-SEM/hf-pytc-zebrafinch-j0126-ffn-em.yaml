notes: 'HF repo (2.16 GB): j0126-train-33vol.zip (395 MB, 165 HDF5 files = 33 volumes x 5 per README: im_raw, seg_gt,
  padded versions, skeletons), valid_12_skeletons.h5, test_50_skeletons.h5, ffn_node_lut_test_50.h5,
  j0126-nucleus-instances-80nm.h5 and j0126-tissue-border-keep-mask.tar (1.69 GB; the full-volume mask at
  9x9x20 nm). The full raw image and FFN segmentation are not in the repo; they stream from the Google Cloud
  Storage bucket named in the README (precomputed, via cloud-volume). Only the first 40 zip paths were listed
  by peek_archive; seg_gt contents rely on the README and the file count. Voxel size 9x9x20 nm from the dataset
  card and the paper (bioRxiv preprint read; Nature Methods full text not open access). The preprint says
  35 dense subvolumes in one place and 33 in another; the card says 33. License MIT is the HF card tag; the
  paper states no data licence. Organism from the paper (zebra finch), the card does not name it. Authors
  not listed on the card.'
