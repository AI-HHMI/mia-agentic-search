title: Three-dimensional nanostructure of an intact microglia cell
short_name: Microglia cell organelle models (SBEM)
description: Two serial block-face EM (SBEM) stacks (389 and 515 sections) of mouse hippocampus CA1
  containing one intact microglia cell, with manually segmented 3D IMOD models of the cell body, nucleus,
  mitochondria and lyso-/phagosomes, plus mesh exports (OBJ, Blender).
