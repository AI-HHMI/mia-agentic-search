notes: 'Voxel size given is for the PFIB-SEM volumes; SBF-SEM stacks are 15 nm XY with 20/25/50 nm Z.
  Labels cover only the PFIB_seg 2 us reference volume (mitochondria, synapses); the other stacks are
  denoising data. Files are 0.3-5.8 GB TIFFs, 14 total (34.3 GB). Checked Zenodo page, API file listing
  and preprint full text (Methods); train/test split not stated in the deposit. Organism for SBF-SEM stacks
  assumed mouse from the paper Methods (sample preparation); not stated per file. enricher: Zenodo listing
  has 15 TIFFs (was 14; 34,346,654,690 bytes). PFIB_seg raw, 2 us reference and mitos label TIFFs are
  181x1300x1300 uint8 stacks on the same grid.'
