notes: 'Landing page says the data is "freely available for download to facilitate replication" but names no license
  (the article itself is CC-BY-4.0). Zip listed with peek_archive: train/eval/test images and labels as TIFF, plus
  train-error-weights.tif. Label TIFF headers (probe): uint16, deflate, page shapes 800x800 (train, eval) and 609x400
  (test); image headers not readable by range probe. Voxel size 10 nm lateral, 50 nm axial and the instrument are from the
  paper (PMC full text); the released crops are assumed to share it. Labels made by tool-assisted manual segmentation in Amira,
  reviewed by experts (paper). Label class list and number of classes not stated on the page; the paper full text was read
  via PMC only for methods summary. Hosted on Dropbox.'
