notes: 'Same ROI as the multi-nuclei record zenodo-6355622 (open PR claude/dataset/zenodo-6355622-hela-multinuclei-sbf-sem-labels),
  but a different labelling: here only the central cell/nucleus is labelled (600 files:
  300 TIFF + 300 .mat label slices, ~50 MB), while 6355622 labels all visible nuclei
  and ships .mat only. The record contains labels only; the raw images are in EMPIAR-10094
  (not fetched in this run). Voxel size 10 x 10 x 50 nm, the 8192 x 8192 x 517 volume
  and the 2000 x 2000 x 300 ROI are from the paper Methods (J. Imaging 2023, 9, 59,
  CC BY 4.0). Format of the TIFF label slices (bit depth/label encoding) was not inspected.'
