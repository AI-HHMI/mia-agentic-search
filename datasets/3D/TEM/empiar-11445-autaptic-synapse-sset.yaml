notes: 'FTP holds 5 joined wild-type volumes (a2, a4, a5, t1, t2 _join.mrc) and their IMOD models (data/*.mod;
  semi-automated IMOD segmentation per paper Methods). The 4 Kif18A volumes and the .hff conversions listed
  in the EMPIAR XML are not in the FTP tree. Plus 36 dual-axis tilt series (.st). Voxel size differs per
  volume: a2/a4/a5 1.303 nm (header; paper: 1.303 nm after 2x binning), t1/t2 2.052 nm (header; EMPIAR
  bin2 20.52 A), so null. Models: synaptic vesicles, terminal membrane, microtubules, active zone, endosomes,
  mitochondria (partial coverage). enricher: n_items 9 -> 5 (FTP listing); size 123.8 GB from EMPIAR dataset_size
  (was null; HTTP index 133.3 GB rounded, so EMPIAR likely means GiB).'
