notes: 'EMPIAR lists 5 wild-type and 4 Kif18A joined volumes, each with a segmentation of synaptic vesicles and cellular
  membranes (IMOD models, semi-automated per the paper Methods), plus 66 dual-axis tilt series (about 93 GB .st files).
  Total 123.8 GB per EMPIAR; the HTTP index estimates 133 GB, so size_bytes is null. Voxel size differs: wild-type
  tilt series 1.3 nm and 2.052 nm, Kif18A 2.052 nm; the paper states 1.303 nm after 2x binning, and no single value
  fits all volumes, so null. Only synaptic vesicles and cellular membranes are modelled (no dense labels), so coverage is
  partial; label class meaning beyond the EMPIAR description was not inspected. The paper full text came from Europe PMC.'
