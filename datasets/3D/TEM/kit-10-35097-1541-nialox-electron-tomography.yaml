notes: 'Only two volumes (ET1, ET2), so a small dataset, but each has voxel-level labels. Sources: RADAR4KIT landing page (single 165.1 MB archive, CC BY-SA 4.0, no embargo), DataCite record, KITopen page, and the open-access ChemCatChem paper (Methods, p. 14: Themis 300 STEM at 300 kV, HAADF tilt series over about +-74 deg in 2 deg steps, SIRT + DART reconstruction; isotropic voxel 0.29 nm for ET1 and 0.58 nm for ET2, which is why voxel_size_nm is null: the two volumes differ). The archive is a tar (DataCite format application/x-tar) and could not be listed remotely, so the file format of the volumes (the readme says Avizo and ImageJ can import them), the archive layout and the label encoding are unverified; formats is therefore other. The direct download URL is behind the RADAR4KIT download button and was not found. Label provenance (manual vs algorithmic thresholding in Avizo) is not stated on the pages read.'
