notes: 'File lists show 152 source tomograms and 152 annotation masks, all named tomogram-NNN_train.tif;
  voxel size 1.55 nm from the file list; first rows are single-axis TEM tomography of mouse organotypic
  hippocampal slices (other rows not all inspected, so imaging conditions may vary). Study page and API
  record state no license or terms (the CC-BY in the paper text applies to the article), so license is
  unknown. Total size not stated. The paper says data from unpublished micrographs is available on Zenodo
  later / on request; this BioImage Archive study is the open training subset. Annotation is manual
  IMOD for a subset of vesicles, network-extended and proofread; coverage described only for vesicles
  fully inside the tomogram.'
