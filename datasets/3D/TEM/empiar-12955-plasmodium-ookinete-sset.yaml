id: empiar-12955-plasmodium-ookinete-sset
title: Plasmodium berghei ookinete serial-section electron tomogram with organelle segmentation
short_name: Plasmodium ookinete organelles (serial-section ET)
description: >-
  One stitched serial-section electron tomogram (ssET) of a mature Plasmodium berghei ookinete and a matching
  full-cell segmentation of 22 annotated organelles and subcellular structures (e.g. nucleus, mitochondria,
  apicoplast, micronemes, subpellicular microtubules), released with a study of ookinete development by volume EM.
