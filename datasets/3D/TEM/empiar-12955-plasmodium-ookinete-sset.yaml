notes: >-
  Single volume: stitched tomogram (7.4 GB) plus one segmentation (17 MB), both binned x2; voxel size 22.36 A taken
  from the EMPIAR imageset record (not stated in the paper). The EMPIAR deposition text calls it a cryo-electron
  tomogram, but the paper Methods describe resin-embedded 200 nm sections imaged on a Tecnai F20 (SerialEM, IMOD),
  so it is recorded as TEM. Segmentation of 22 structures is from the EMPIAR citation details; segmentation was
  done in IMOD. Related SBF-SEM data are in EMPIAR-12951. CC0 licence read from the EMPIAR entry page summary.
  Pixel size not given in paper Methods; no train/test split.
