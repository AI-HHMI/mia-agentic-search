title: Electron Tomography of Inner Ear Ribbon Synapses
short_name: Inner ear ribbon synapse tomograms (TEM)
description: 28 room-temperature electron tomograms of mouse and rat inner hair cell ribbon synapses as HDF5 files with raw
  volumes and IMOD-derived binary masks for presynaptic density, postsynaptic density, active zone membrane and synaptic ribbon,
  plus instance masks of vesicles near the active zone. Used to train ribbon synapse segmentation in SynapseNet.
