notes: 'Zip listing: rat/ (19 tomograms), tether/ (3) and vesicle_pools/ (6), 28 HDF5 files; the record says 9 mouse tomograms
  (6 from Chakrabarti et al. 2018 and 2022, 3 unpublished) and 19 rat tomograms (Michanski et al. 2023). Which label datasets
  exist in each folder was not checked inside the HDF5 files (headers not read). Voxel size and microscope are not stated on the
  Zenodo record; the paper text read describes the acquisition only in general terms. No train/test split is provided in the
  zip. The record cites the SynapseNet paper as "preprint to be published"; the published version is listed under publications.
  Same author deposited a related dataset (zenodo 14330011, SynapseNet training data on synaptic vesicles and active zones).'
