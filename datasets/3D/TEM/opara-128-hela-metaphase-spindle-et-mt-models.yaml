notes: 'Files: Metaphase_#1/2/3_Tomogram.zip (44.6, 75.2, 69.1 GB; each holds the whole cell folder incl. Tomogram_Stack/*_Tomo_Stack.am)
  and Metaphase_#1/2/3.zip (0.26-0.91 GB, models, surfaces and ASGA .xlsx without the stack). Paper: pixel size
  2.32 nm (Tecnai F30, 300 kV, 4700x, tilt -65 to +65 deg, dual axis, IMOD); MTs segmented automatically in Amira
  then manually corrected and stitched across sections (hence source mixed). z voxel size not stated (stacks were
  later z-expanded by factors 1.3, 1.4, 1.42). OPARA-177 (10.25532/OPARA-177, ~290 GB) is the same three spindles
  after z-expansion per the paper''s data availability, so it is not proposed separately. The paper also mentions
  TIFF versions, but none appear in the archive listings (only .am and .xlsx). Metaphase_#1 lists a T_0494 ASGA
  file, probably misplaced. enricher: .am stack headers read (uint8 lattices); z voxel size still null (header only,
  no unit).'
