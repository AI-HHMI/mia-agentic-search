description: Serial-section dual-axis electron tomograms of three whole HeLa Kyoto metaphase spindles (22 to 35
  semi-thick sections each, 2 x 3 montages), released with the 3D microtubule models (spatial graphs of all MTs
  and of kinetochore MTs), chromosome and centrosome surfaces and the quantitative analysis tables from the eLife
  paper on kinetochore-fibers. Tomograms are Amira .am stacks of 44.6 to 75.2 GB per cell.
