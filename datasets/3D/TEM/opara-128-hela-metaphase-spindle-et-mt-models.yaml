  notes: 'Listing: OPARA DSpace bitstreams API, 7 files, 204,526,715,255 B exact (= record size); zip central directories:
    each Tomogram zip has 80 members (1 stack, 4 MT models, 2 surfaces, 73 ASGA .xlsx), each small zip the same
    79 without the stack. Headers: first 6 KB of stored zip members read by range request for the three stacks,
    spatialgraphs and chromosome surfaces (no data sampled; the smallest stack is 47.6 GB, so there is no small
    sample unit). Voxel size: x/y 2.32 nm from the paper (final pixel size 2.32 nm); the stack BoundingBoxes give
    23.2 units per voxel in x, y and z (23.0 x/y for #3), consistent with 2.32 nm if the units are Angstrom, but
    no unit is stated, so z stays null. The paper applies Z-factors 1.3/1.4/1.42 to the models, not stated for the
    stacks. Checked: .am headers, OPARA metadata, paper Methods (eLife 2022). Download: six direct zips on opara.zih.tu-dresden.de
    (host not allowlisted); Amira .am is not a TensorSwitch format.'
