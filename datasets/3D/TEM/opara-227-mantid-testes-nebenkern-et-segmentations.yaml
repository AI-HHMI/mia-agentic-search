notes: 'One file Mantid_ultrastructure.zip (7.6 GB, 40 members, 13.1 GB uncompressed): Tomography/ Fig.1 (SC tomogram
  1.29 GB + DNA and nuclear-membrane surfaces + polycomplexes), Fig.3 (stitched cropped nebenkern tomogram 3.28
  GB + stitched MT trace + binary and surface label files), Fig.4 (late nebenkern and flagellum tomograms 1.36/1.49
  GB with surfaces, axoneme, MTs); TEM/ (16 TIFF, 12.4 MB each); Light microscopy/ (4 TIFF). Paper: dual-axis tilt
  series at 4700x, pixel size 2.572 nm, -60 to +60 deg, Tecnai F30; serial 300 nm sections stitched with microtubule
  landmarks, membranes segmented automatically in Amira (morphological Laplacian etc.) with manual steps (hence
  mixed). Only some structures are segmented, hence partial coverage. License on the OPARA page is CC BY-NC-SA 4.0
  (non-commercial) although the PLoS One article is CC BY. enricher: z 2.572 nm from the .am headers (Units Å, BoundingBox;
  was null). Modalities: TEM = Tomography/, TEM/; phase-contrast = Light microscopy/.'
