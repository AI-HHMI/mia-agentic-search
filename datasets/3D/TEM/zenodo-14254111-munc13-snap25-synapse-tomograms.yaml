notes: 'Zip listed with peek_archive: Munc13DKO 46 and SNAP25 55 HDF5 tomograms (_crop.h5) plus 21 IMOD .mod files
  in manual_annotations (Zenodo says 20 tomograms). HDF5 internals (raw, vesicles, az, mask) come from the record
  description and were not opened. Vesicle labels are automatic (SynapseNet); active zones are automatic with
  manual correction; only the manual_annotations subset is fully manual, so source is mixed. Voxel size 1.55 nm is
  the value the paper gives for the Imig 2014 / Maus 2020 tomograms; these are cropped copies, and isotropy
  of the crops was not checked. Mouse is the paper''s organism for these slices; the KO genotypes are
  from the record. No train/test split is provided. Part of the SynapseNet data release (see also
  zenodo-14330011 and zenodo-14232607 records in this catalog).'
