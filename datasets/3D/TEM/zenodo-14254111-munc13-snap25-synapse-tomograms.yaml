title: Munc13/SNAP25 Analysis Dataset
short_name: Munc13/SNAP25 synapse tomograms (TEM)
description: 101 cropped room-temperature electron tomograms of hippocampal Schaffer collateral synapses from
  Munc13-1/2 double-knockout and SNAP-25-deficient mouse neurons and matched controls, stored as HDF5 with the raw
  tomogram, automatic synaptic vesicle segmentation, a manually corrected active-zone segmentation and a presynaptic
  terminal mask, plus IMOD manual annotations for 20 of the tomograms.
