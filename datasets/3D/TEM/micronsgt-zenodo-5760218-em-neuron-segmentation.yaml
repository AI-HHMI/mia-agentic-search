description: Ground-truth dataset for 3D neuron segmentation from electron microscopy images of mouse visual cortex, created for IARPA's MICrONS program. Three archives (basil, minnie, pinky) contain HDF5 volumes with EM image, segmentation and mask, plus optional mitochondria, synapse (PSD) and fold annotations and object, myelin, blood-vessel, soma and nucleus ID lists.
