notes: 'HF repo holds 6 HDF5 files (image + vessel ground truth per species), 60.0 GB. Voxel size differs per species
  (paper Table I, nm, axis order not stated: mouse 320x256x256, macaque 240x176x176, human 264x256x256), so voxel_size_nm
  is null. Image sizes (voxels): mouse 2495x3571x2495, macaque 450x1271x995, human 661x7752x13500. Mouse and human annotated
  on every 4th slice. Modality per paper: mouse TEM, macaque SBEM, human MultiSEM (other). MIT is the HF card tag; project
  page and paper state no data licence (CC BY-NC-ND on arXiv covers the paper). Source volumes (MICrONS, Loomba et al.,
  H01) may carry their own terms. HDF5 dataset names not inspected. Paper has no DOI (TriSAM preprint, read via arXiv HTML).'
