short_name: BvEM cortical blood vessel segmentation (vEM)
description: Benchmark of three large volume-EM datasets of cortex (adult mouse visual cortex, macaque
  superior temporal gyrus, human temporal lobe), resampled to near-isotropic 200-300 nm voxels, with proofread
  3D blood vessel instance segmentations. Image volumes are derived from MICrONS, the macaque study of
  Loomba et al. and the H01 human dataset.
