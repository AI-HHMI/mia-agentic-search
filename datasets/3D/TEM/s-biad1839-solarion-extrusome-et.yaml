title: Electron tomography of the protist Solarion arienae with a manually segmented extrusome tomogram
short_name: Solarion arienae extrusome tomograms (TEM ET)
description: 'Raw tilt series and reconstructed serial-section tomograms (MRC) of whole cells and the extrusome
  of the protist Solarion arienae, acquired by TEM electron tomography. The tomogram of the extrusome
  (Extrusome_new_1_sec5_x40k) comes with a manual segmentation made in IMOD (an IMOD model file, listed
  as a segmentation mask).'
