notes: 'Only the extrusome tomogram (x40k, pixel spacing 2.902 A in its SerialEM mdoc, binning 1) has
  an annotation: one IMOD model file; the whole-cell and ROI tomograms (x8k) are unannotated. n_items
  counts the 16 reconstructed (_rec.mrc) tomograms in the file listing; raw tilt series, joined volumes
  and a Raw 2D images.zip are also deposited (total size not summed). No paper is listed on the BioStudies
  record and none was found in Europe PMC/Crossref by title search; the BioStudies record states the license
  as CC0. enricher: voxel size null (was 0.2902 x/y, the x40k tilt-series pixel): the annotated Extrusome
  _rec.mrc is binned 2x, 0.5804 nm isotropic (MRC header; IMOD model header pixsize 0.5804 nm); other
  tomograms 1.44 nm (x8k) or 0.9624 nm (Initial_Cell_ROI2), MRC headers. enricher: size = sum of the BioStudies
  file lists (52 files + model). coverage: model contours on 8-286 of 287 slices, 16-54 contours per object
  for 4 of 6 objects (sparse slices).'
