notes: 'Only the extrusome tomogram (x40k, pixel spacing 2.902 A in its SerialEM mdoc, binning 1) has an annotation:
  one IMOD model file; the whole-cell and ROI tomograms (x8k) are unannotated. n_items counts the 16 reconstructed
  (_rec.mrc) tomograms in the file listing; raw tilt series, joined volumes and a Raw 2D images.zip are also
  deposited (total size not summed). Voxel size x/y is the tilt-series pixel spacing of the annotated x40k
  series; z and the reconstructed-volume binning are not stated. The x8k tomograms have a different pixel
  size (not read). No paper is listed on the BioStudies record and none was found in Europe PMC/Crossref
  by title search; the BioStudies record states the license as CC0.'
