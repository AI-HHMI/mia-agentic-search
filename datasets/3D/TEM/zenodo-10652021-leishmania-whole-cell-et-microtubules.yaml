title: Leishmania mexicana whole cell electron tomography with sub-pellicular microtubule models
short_name: Leishmania whole-cell tomograms, microtubules (ET)
description: Three whole Leishmania mexicana promastigote cells (c01-c03) reconstructed by serial-section
  dual-axis electron tomography. Fields of view from 7-11 serial 300 nm sections were reconstructed, montaged
  and stacked into one whole-cell volume per cell (8-bit multi-slice TIFF). Each cell comes with IMOD/3dmod
  model files tracing the sub-pellicular microtubules (before and after joining across section boundaries)
  and the cell midline.
