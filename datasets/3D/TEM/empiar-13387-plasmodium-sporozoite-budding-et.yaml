notes: 'FTP PbSFA_Tomo/Figure8A-F: one tomogram .mrc (1.6-6.7 GB) and one Segmentation_*.mod each, plus extras (Tomo_SFA1KO_elongation_bin.mrc,
  Tomo_SFA2KO_initiation_old.mrc, the older tomogram on which the SFA2KO initiation segmentation was drawn). SFA1KO elongation
  segmentation was drawn on the further-binned 3.8116 nm tomogram; SFA2KO elongation pixel is 2.236 nm. Which structures are
  segmented (organelles, nucleus, apical structures) is not listed on the EMPIAR page; the paper text read does not detail
  classes, so annotation type is set from the general description. The dataset-level voxel size is the 1.9058 nm of most tomograms.
  Only 6 volumes. Paper is open access.'
