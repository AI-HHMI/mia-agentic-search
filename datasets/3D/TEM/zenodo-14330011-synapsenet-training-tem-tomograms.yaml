notes: 'Zip listing: vesicles/ (train 20 chemical_fixation + 137 single_axis_tem, test 3 + 15) and active_zones/ (train 18
  + 114, test 6 + 38) HDF5 files, 351 files in total; the same tomogram can appear in both folders with different labels,
  so the number of distinct tomograms is lower than 351. Voxel size is not stated on the Zenodo record or in the paper text
  that was read (the paper says average pixel sizes are stored in the SynapseNet python library); acquisition was a 200 kV
  JEM-2100 at 30,000x magnification, tilt range +/-60 degrees. The record description cites the SynapseNet paper as "preprint
  to be published"; the published version is listed under publications. Related records from the same group (inner ear ribbon
  synapses, zenodo 14232607) are separate datasets. Annotations were exported from IMOD and post-processed; the original studies
  are Imig et al. 2014 and Maus et al. 2020.'
