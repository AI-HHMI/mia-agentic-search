short_name: Synaptic vesicle and active zone tomograms (TEM)
description: Room-temperature single-axis TEM tomograms of Schaffer collateral and mossy fiber synapses in mouse organotypic
  hippocampal slices (high-pressure frozen) plus chemically fixed mouse tissue, stored as HDF5 with raw volumes and IMOD-derived
  labels for synaptic vesicles (instance masks) and active zones (binary masks), in train and test folders. Used to train
  SynapseNet.
