notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei
  only; the record gives the source EM voxel size as 6 x 6 x 6 nm (x, y, z), matching the EM .zattrs (fibsem-uint8, s0 scale
  6 nm). EM s0 is zyx 12698 x 7000 x 9000 uint8 (zstd, chunks 128^3, 7 levels); label s0 is zyx 793 x 437 x 562 uint8 at 96
  nm (translation 45 nm, 5 levels); label .zattrs declare instance_segmentation (absent 0, unknown 255). The label array sits
  under labels/inference in the bucket but Figshare describes it as manual. Organism from the record title (mouse Spinal Cord).
  The Figshare file is a link-only entry to the S3 prefix; no paper is cited on the record. Different volume from figshare-26513227-jrc-mus-sc-zp105a-nuclei-fib-sem
  (jrc_mus-sc-zp105a, a different animal/volume of the same tissue). enricher: size from a complete S3 listing (was the 800
  GB uncompressed s0 estimate).'
