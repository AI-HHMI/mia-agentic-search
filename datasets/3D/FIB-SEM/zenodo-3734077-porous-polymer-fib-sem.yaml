notes: 'Archive listing (peek_archive): data.zip has 600 TIFF slices (~15 MB each, 9.16 GB uncompressed),
  manual_segmentation.zip has 3 .mat files. Paper Methods: BSE detector, 10 nm pixel size, aligned volumes
  of 2247 x 3372 pixels and 200 slices (about 10 um deep, so z spacing about 50 nm is derived, not stated
  directly); manual labels cover 100 random 256 x 256 regions per volume (about 0.5% of data), with 7-slice
  neighbourhoods; classes solid (EC) and pore (leached HPC). Materials-science sample, no organism. The
  zip holds the unaligned raw slices; the paper aligns them with ImageJ StackReg. Manual masks are .mat
  (not inspected). size_bytes is the uncompressed raw slice total. Other Zenodo files (processed_data_model_segmentation.zip,
  21 GB) hold model outputs and are not counted.'
