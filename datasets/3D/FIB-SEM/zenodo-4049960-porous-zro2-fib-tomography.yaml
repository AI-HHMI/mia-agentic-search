title: FIB-tomography data of porous Zr-oxide fabricated with varying sintering conditions
short_name: Porous Zr-oxide ceramic pores/solid (FIB-SEM)
description: Nine FIB-SEM tomography volumes (10 nm isotropic voxels, 559-990 slices each) of porous Zr-oxide
  ceramics sintered at 1250-1350 C for 1-3 h, each as a grayscale TIFF stack with a binarized solid/pore
  segmentation stack, plus visualizations and a spreadsheet of voxel counts and microstructure measures.
