notes: 'Only 5 lysosomes are labelled in a single cell volume, so the annotation is sparse and meant as a registration accuracy
  benchmark. The raw FIB-SEM stack (5 nm isotropic per the paper and EMPIAR-10819) is on EMPIAR-10819, not in this study.
  Sizes sum the 5 files listed in the BioStudies record. enricher: voxel size 20x20x20 nm = the composite (image) files, per
  their descriptions ("downscaled 20nm FIB SEM data") and ImageJ headers; the label TIFF is at 10 nm (file name, header spacing
  0.00999 micron), a 2x finer grid (was 10x10x10). enricher: license custom: no license on the record; BioImage Archive FAQ
  says such data "are available under the EMBL-EBI Terms of Use which places no restrictions on use or redistribution" (was
  unknown). enricher: date_published 2021-10-13 from BioStudies ReleaseDate.'
