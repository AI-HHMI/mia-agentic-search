description: Volume CLEM benchmark of a HeLa cell. A Zeiss LSM900 Airyscan fluorescence stack (Hoechst, GFP-TGN46, LysoTracker,
  MitoTracker) of the fixed cell, BigWarp landmarks, affine and thin-plate-spline composites with 20 nm FIB-SEM data, and
  a manual 3D segmentation of 5 lysosomes in the FIB-SEM volume (TrakEM2 label TIFF, 10 nm).
