  notes: 'size estimated (uncompressed): raw 1 x 12664x1200x8750 uint16 + label 1 x 25328x2400x17500 uint8 + label 1 x 25328x2400x17500
    uint16 + label 1 x 25328x2400x17500 uint16 = 5,584,824,000,000 B (5.6 TB). s0 levels only; gzip chunks download much smaller (labels
    are mostly 0). Probes: N5 attributes.json of em/fibsem-uint16 and labels/{er,mito,mito-mem}_{seg,pred}. Samples: zarr EM s3 central
    crop 395x150x273 (32.4 MB, range 71-510, 12-bit-like); one central N5 s4 block each of er_seg (13 KB), mito_seg (10 KB), mito-mem_seg
    (0.6 KB, all 0), er_pred (46 KB, 0-200). Value ranges are from these single samples. Prediction maps (*_pred, uint8) are not listed
    as arrays; the segmentations are the labels. Labels cover the whole volume at 4 nm (2x EM resolution); TensorSwitch must downsample
    labels by 2 or upsample EM to pair them. No direct single-file download: the dataset is chunked N5/Zarr stores on the public S3
    bucket janelia-cosem-datasets (host allowed); sample.urls are the store roots. Voxel size 8 nm EM / 4 nm labels from N5 pixelResolution,
    matching the figshare record.'
