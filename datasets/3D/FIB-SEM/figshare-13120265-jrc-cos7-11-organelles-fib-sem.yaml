notes: 'Figshare API record: "Included in Dataset: predictions, segmentations" (ER, mito, mito membrane), EM 8 nm, segmentation 4 nm,
  CC BY 4.0. Labels are automatic network predictions, not manual. The EM has its own record (DOI 10.25378/janelia.13123385). S3 listing:
  er/mito/mito-mem as _seg and _pred; er_seg is uint8, 17500 x 2400 x 25328 voxels at 4 nm. Organism is the species of COS-7 (not stated
  on the figshare page). The Heinrich et al. 2021 paper is not open access in Europe PMC, so only its metadata was read. Total size
  not stated. Differs from figshare-26512378 (manual nucleus labels, same volume): this one has automatic ER and mitochondria labels.
  EM array path (fibsem-uint16) seen in the S3 listing only. enricher: technical block from N5/Zarr headers and samples; labels at 4
  nm are 2x the 8 nm EM grid.'
