notes: 'Figshare record (link-only file) and S3 listing read. EM at em/fibsem-uint8; main label group DSM-2_WG_simple-seg_DSM-ER-KRT-PM-endo
  (3217 x 447 x 1584, x y z, uint8, 8 nm); only a sub-region is labelled (partial). Paper Methods (PMC author manuscript):
  ER, mitochondria, plasma membrane from COSEM network predictions; keratin, ribosomes, desmosome plaque from ilastik;
  then proofread, microtubules and endosomes by hand, so source is mixed. *_pred groups are predictions. enricher:
  main label group holds semantic ids 0-5 (decoded chunks); size estimated from shapes.'
