notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 4 x 4 x 3.48 nm (x, y, z), matching the EM .zattrs. EM s0 is zyx 11998 x 3200 x 18500
  uint8 (zstd); label s0 is zyx 750 x 200 x 1157 uint8 at 55.68 x 64 x 64 nm with translation 26.1 / 30 / 30 nm; label .zattrs declare
  instance_segmentation (absent 0, unknown 255). The label array sits under labels/inference in the bucket but Figshare describes it
  as manual. Organism and total size not stated on the Figshare record or the zarr metadata, left empty/null; the cited bioRxiv paper
  (10.1101/2024.09.05.611438) was not read this run. The Figshare file is a link-only entry (data.janelia.org/D9CCk). enricher: size
  estimated from shapes (technical.notes); encoding from cellmap .zattrs (instance_segmentation, absent 0, unknown 255).'
