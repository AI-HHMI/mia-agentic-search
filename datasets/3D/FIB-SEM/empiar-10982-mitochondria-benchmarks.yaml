notes: 'Pixel sizes per EMPIAR API for volumes (x,y; values are A, so /10 for nm): C. elegans 240, fly
  brain 120, glycolytic muscle 180, HeLa 150, Lucchi++ 50, salivary gland 150; z spacing and TEM pixel
  size ("low nm range") not stated on the dataset page, API record or PMC article summary, so voxel_size_nm
  is null. EMPIAR lists experiment type FIB-SEM; per-volume modalities (some are other vEM types) not
  individually stated, so modality is approximate. n_items = 6 volumes + 100 TEM images. License CC0 is
  the standard EMPIAR licence (cc0 link on entry page). Annotation coverage/source not stated on sources
  checked; the paper full text is not open access (PMC page was only summarized, Methods not read in detail).
  enricher: listing, headers and samples confirm 6 volume pairs + 100 TEM image/mask pairs with instance
  labels.'
