  notes: 'EMPIAR FTP timed out, so listings come from the HTTP index (rounded sizes, ~4.37 GB); size_bytes
    keeps the page-stated 4.1 GB. The first listing of the entry root omitted data/tem_benchmark/, so
    that folder was listed separately (200 files). Samples: hela_cell_em.tif uint8 [256,256,256] 1..200;
    hela_cell_mito.tif uint8 same shape, 69 unique (0..68) = instance IDs; TEM 0s1JawDdbBymwtwOjgx8 image
    uint8 [1024,1024] 0..255, mask int32 18 unique (0..17). Other volumes differ in size (salivary gland
    3.2 GB); their label dtype was not checked, so uint8 may not hold for all. maintainer 2026-10-06:
    the EMPIAR API pixel sizes are in A, not nm. Volumes are isotropic: C. elegans 24, fly brain 12, glycolytic
    muscle 18, HeLa 15, salivary gland 15, Lucchi++ 5 nm. TEM images: not stated. voxel_size_nm stays
    null (sizes differ).'
