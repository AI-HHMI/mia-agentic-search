notes: "Figshare record (CC BY 4.0, refined automatic segmentation): Nuclei segmentations in jrc_mus-heart-1 using Cellpose 2.0 with minimal manual corrections. Classes annotated: Nucleus. EM voxel size 8 x 8 x 8 (x, y, z) nm (matches the EM .zattrs); EM s0 is zyx [16984, 18961, 20404] uint8; label s0 is zyx [1058, 1185, 1275] uint16 at 128 x 128 x 128 nm in the label .zattrs; label .zattrs declare semantic_segmentation. Size is the uncompressed EM s0 voxel count times bytes per voxel, not a stored size. The Figshare record is a link-only entry (data on S3 via s3://janelia-cosem-datasets/jrc_mus-heart-1/jrc_mus-heart-1.zarr/recon-1/labels/inference/segmentations/nuc/). Organism from the record title. Sample source: Janelia CellMap data release paper 10.1101/2024.09.05.611438 (listed in the Figshare references; paper text read via bioRxiv)."
