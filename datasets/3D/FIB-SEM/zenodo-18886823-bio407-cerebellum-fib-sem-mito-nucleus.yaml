  notes: 'Listing: tools/listing.py on the Zenodo API record with --expand-zips: 1 zip, 4,753,832,274 B (file-listing, complete),
    7 members. tools/probe.py read the two label stacks (tifffile, int32, deflate, 530 pages); the raw stacks are big-endian
    ImageJ TIFFs inside a deflated zip member, which probe.py could not parse, so their first IFDs were read by a scratch
    script (zip member range + zlib, ~1.5 MB). Both label stacks were downloaded whole (4.9 MB compressed) and measured (values
    above, one sample each); the raw crop (448 MB compressed) was not downloaded, so its value range is not recorded. Voxel
    size 10 x 10 x 10 nm: ImageJ header of the aligned crop (unit=nm, spacing=10.0, XResolution 100000/1000000 px per nm)
    and the page (pixel size 10 nm). Download: the zip is one direct file (download_url); sample members by zip::member. Arrays
    list the labelled crop only; the unlabelled stacks (unaligned run 150 x 6784 x 6784, rawdata 510 x 2016 x 3744, cropped
    510 x 1016 x 936, all uint8 big-endian ImageJ TIFFs, uncalibrated) and the MoBIE export (3 x 1237 x 2146 float32 composite)
    are in the tree only.'
