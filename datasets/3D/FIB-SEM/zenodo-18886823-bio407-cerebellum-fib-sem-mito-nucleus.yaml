notes: 'Sources: Zenodo API record (REMBI metadata) and the zip (7 TIFFs, 11.8 GB uncompressed). No paper; student course
  data (UZH BIO407) from surplus tissue of Maheshwari et al., Brain Pathol 2023 (that paper uses TEM, not this FIB-SEM run).
  enricher: voxel size z = 10 nm from the ImageJ header of the aligned crop (unit=nm, spacing=10.0, XResolution 0.1 px/nm),
  matching the page''s 10 nm pixel size (was z null). enricher: annotations.source unknown (was manual): the page does not
  say how the students segmented, and the nucleus mask holds 6 values, the mitochondria mask 369 IDs. Labels cover the whole
  aligned crop (530 x 1010 x 1014 px); the crop region within the full run is not specified. The other raw stacks (unaligned
  run, raw, cropped) are uncalibrated in their headers.'
