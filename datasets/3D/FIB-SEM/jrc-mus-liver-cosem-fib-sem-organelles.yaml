notes: 'S3 listing: jrc_mus-liver.zarr/recon-1/labels/groundtruth has 40 cropN groups; em/fibsem-uint8
  is uint8 with 8 nm scale in its .zattrs. size_bytes = uncompressed s0 voxels. The bucket README says
  groundtruth blocks are labelled voxel-by-voxel by a human annotator; CC-BY-4.0 is stated for the collection
  on the AWS registry page. Species and tissue are inferred from the dataset name; sample prep, annotators
  and per-crop provenance are not documented in the sources read (the COSEM preprint describes cell-culture
  volumes, not these tissue volumes), and the Nature paper is paywalled. Different volume and crops from
  the other jrc_* records. Train/val split undocumented. enricher: size_bytes now raw s0 + groundtruth
  crops s0 (estimated, uncompressed).'
