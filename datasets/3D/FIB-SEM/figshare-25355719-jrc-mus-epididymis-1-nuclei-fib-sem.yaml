notes: 'Link-only figshare record (CC BY 4.0); data on S3. Nuclei labels made with Cellpose 2.0 with minimal manual corrections. EM and labels
  are in the same zarr: recon-1/em/fibsem-uint8 s0 [1763, 5061, 5187] uint8 at 4 nm; label s0 [324, 316, 110] uint16 at 64 nm (zarr metadata;
  the figshare text agrees). EM source DOI 10.25378/janelia.22190377. No dataset paper is listed on the record (only the Cellpose software paper,
  10.1038/s41592-022-01663-4); mouse age and strain are not stated. The label array shape looks x,y,z-ordered (110 x 64 nm = 7 um matches the
  EM z extent) although its .zattrs declare zyx; check axes before use. Total size not stated, not summed.'
