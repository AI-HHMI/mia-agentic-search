description: Eight volume-EM datasets (FIB-SEM, SBF-SEM, ssSEM) from mouse and human tissues and cell lines with
  expert-verified 3D mitochondria instance labels, emphasising dense packing, hyperfused networks and thin connections.
  Distributed as nnU-Net-layout NIfTI archives and OME-Zarr copies, with official train/validation/test splits,
  checksums and baseline scripts.
