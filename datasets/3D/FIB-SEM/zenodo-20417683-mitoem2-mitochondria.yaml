  notes: 'Zenodo listing is complete and exact (40,783,731,955 B = record value). Only the Jurkat sub-dataset was
    opened. NIfTI headers give 16,000,000 nm spacing (spacing 16 stored with the wrong unit); metadata.csv and dataset.json
    say 16x16x16 nm, so headers are not a usable calibration. Jurkat dataset.json (auto-generated for nnU-Net) lists
    labels background 0 / mitochondria 1 / boundary 2 and "licence: Unknown", but the sampled label has 125 distinct
    IDs (0..124), i.e. instance IDs; metadata.csv states CC-BY-4.0 per sub-dataset. Value ranges from one pair:
    raw 11..250 (p50 212), label 0..124. Shapes vary per sub-dataset (see metadata.csv). OME-Zarr zips hold Zarr
    v3 multiscales (zarr.json, s0..s2).'
