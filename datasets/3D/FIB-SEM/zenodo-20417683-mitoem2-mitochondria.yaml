notes: 'Voxel size varies per sub-dataset (16x16x16 nm for FIB-SEM sets, 8x8x30 nm for ssSEM/SBF-SEM sets
  per metadata.csv), so voxel_size_nm is null. Sub-datasets are 28 volumes with over 8,000 labelled instances
  (paper). Label files verified by listing the Jurkat zip (peek_archive); other archives not listed. Checked
  Zenodo record, metadata.csv and the paper full text on Europe PMC. enricher: formats nifti (was other),
  from NIfTI headers. maintainer 2026-10-06: per metadata.csv: Beta, Jurkat, Macro, Podo, Sperm (FIB-SEM)
  16x16x16 nm; Mossy, Pyra (ssSEM), Stem (SBF-SEM) 8x8x30 nm. voxel_size_nm stays null (sizes differ).'
