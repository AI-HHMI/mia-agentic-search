notes: 'Figshare page lists "Included in Dataset: predictions, segmentations", EM voxel size 8 nm, segmentation voxel size
  4 nm, classes endo, ER, mito, nucleus, PM, vesicle, license CC BY 4.0; EM data has its own DOI 10.25378/janelia.13123415.
  Bucket checks: EM zarr recon-1/em/fibsem-uint8 s0 is 7584 x 1000 x 9375 uint8 zstd; N5 labels (e.g. mito_seg s0 18750 x
  2000 x 15168 uint16, mito_pred uint8, er_seg uint8) at 4 x 4 x 4 nm. Labels are machine output, not manual ground truth.
  The Nature paper is not open access and the bioRxiv preprint returned HTTP 429 in this run, so only the abstract was read.
  Sibling volumes with the same pipeline are in the catalog (e.g. jrc_choroid-plexus-2). enricher: download_url set to the
  volume prefix (EM is in the .zarr, labels in the .n5); size estimated.'
