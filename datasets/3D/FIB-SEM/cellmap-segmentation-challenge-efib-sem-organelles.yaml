notes: 'The Figshare item itself only holds the white-paper PDF; the imaging data and crops are hosted on OpenOrganelle
  / S3 and fetched with the challenge repo''s `csc fetch-data` (default download ~36.7 GB as zarr). Voxel size varies
  per dataset (challenge page: 4 nm or 8 nm; jrc_hela-2 EM is 4x4x5.24 nm per OME-Zarr scale, its crops 2x2x2.62
  nm), so null. Per-crop annotation coverage, exact split and file listing were not inspected (Figshare landing
  page returned 403; the white paper PDF was not read). License CC BY 4.0 is from the Figshare record. Collection
  DOI 10.25378/janelia.c.7456966 has 311 articles (per-crop records). enricher: jrc_hela-2 inspected on S3 (OME-Zarr,
  binary masks per crop); annotations_verified left unchanged (line touched in a human edit). enricher: voxel_size_nm
  set to null (was 4x4x4; datasets differ). Coverage: sparse dense-labelled crops inside each EM volume (e.g. jrc_hela-2
  crop1 200x1000x1000 at 2 nm), not whole volumes.'
