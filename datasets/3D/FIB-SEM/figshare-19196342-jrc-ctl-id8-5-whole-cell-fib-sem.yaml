notes: 'EM volume is Figshare 10.6084/m9.figshare.14447568 (jrc_ctl-id8-5); the segmentations are 10.6084/m9.figshare.19196342,
  both CC BY 4.0. Bucket arrays checked: EM recon-1/em/fibsem-uint8 s0 1500 x 5495 x 5200 (z y x) uint8
