title: Interleaved scanning electron microscopy of vitrified Euglena gracilis with manual segmentation of the degradation compartment
short_name: Euglena degradation compartment (cryo FIB-SEM)
description: One 124-slice cryo FIB-SEM volume (1920 x 1920 px, 6.34 nm pixels) of plunge-frozen Euglena gracilis cells imaged
  with interleaved scanning to reduce charging artefacts, with two manual segmentation volumes of the degradation compartment
  of one cell (compartment labels and its internal content). Raw sub-frame TIFFs and aligned frames are deposited too.
