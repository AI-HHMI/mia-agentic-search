notes: 'EMPIAR API lists two segmentations of stack_nonperp2_8b_bandC_minus_background-used-for-seg.tif
  (uint8 stack used for segmentation): E.gracilis_DC_seg.tif (degradation compartment of one of the two
  cells; IDs 0-32) and internal_content_DC_seg.tif (its content; IDs 0-1527). All three are 124 x 1920
  x 1920 ImageJ stacks without spacing. Pixel size 6.34 nm (EMPIAR); slice thickness not stated in the
  entry, XML, headers, paper or code README, so z is null. Paper: manual segmentation in Amira of a 1600
  um3 volume. Coverage partial: only the degradation compartment of one cell is segmented. The other ~260
  GB are raw sub-frames and aligned frames. Same paper and method as EMPIAR-12244 (mouse cortex), different
  specimen. License CC0 on the EMPIAR page. enricher: size_bytes from EMPIAR dataset_size 249.7 GB (GiB;
  HTTP index 268.2 GB decimal) (was null).'
