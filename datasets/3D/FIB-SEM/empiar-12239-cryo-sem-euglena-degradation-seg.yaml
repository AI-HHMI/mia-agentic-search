notes: 'EMPIAR API lists two segmentations: E.gracilis_DC_seg.tif (degradation compartment of one of two cells; header values 0-32,
  organelle labels defined per the entry) and internal_content_DC_seg.tif (content of the degradation compartment; values
  0-1527). Both were header-probed: float32, 124 x 1920 x 1920, no spacing stored. Pixel size 6.34 nm from the EMPIAR entry; slice
  thickness is not stated in the entry, file headers or the paper text read, so z is null. Paper (full text read): manual
  segmentation in Amira of a 1600 um3 volume. Only the degradation compartment of one cell is segmented, hence partial coverage.
  The folder also holds stack_nonperp2_8b_bandC_minus_background-used-for-seg.tif (background-subtracted stack used for
  segmentation). The other ~260 GB are raw sub-frames and aligned frames. Same paper and imaging method as EMPIAR-12244 (mouse cortex),
  a different specimen. License shown as CC0 on the EMPIAR page.'
