notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 4 x 4 x 4 nm (x, y, z), matching the EM .zattrs (fibsem-uint16). EM s0 is zyx 12101 x
  3233 x 3736 uint16; label s0 is zyx 1512 x 404 x 467 uint8 at 32 x 32 x 32 nm; label .zattrs declare instance_segmentation. The label
  array sits under labels/inference in the bucket but Figshare describes it as manual. Total size not stated on the Figshare record
  or zarr metadata, left null; The Figshare file is a link-only entry. enricher: size estimated from shapes (technical.notes); encoding
  from cellmap .zattrs (instance_segmentation, absent 0, unknown 255). enricher: organism Homo sapiens inferred from the cell line name
  (A431), as for the sibling records on main.'
