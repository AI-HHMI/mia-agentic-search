notes: 'The Figshare record (CC BY 4.0) lists the annotation as dense manual nucleus segmentations made
  in Amira (protocols.io Amira vEM protocol) and gives the source EM voxel size as 2 x 2 x 2 (x, y, z);
  the EM array in the bucket (recon-2/em/fibsem-int16) has s0 at 4 nm per its .zattrs, which is the value
  used here, and the label array s0 is at 64 nm. The label array lives under labels/inference in the bucket
  but is described as manual by the Figshare record. The Figshare record cites a bioRxiv paper (10.1101/2024.09.05.611438)
  that could not be read (HTTP 429), so no publication is listed. Only the nucleus class is annotated.
  enricher: Figshare''s 2 nm / 41.22 x 8.74 x 3.63 um match recon-1 (2 nm, 20609 x 4368 x 1813 px); the
  nuc labels match the recon-2 extent (4 nm EM), so recon-2 is the raw used here. formats ome-zarr (was
  zarr), per the stores'' multiscales.'
