schema_version: '1.2'
id: empiar-12244-cryo-sem-mouse-cortex-axon-seg
title: Interleaved scanning electron microscopy of vitrified adult mouse cortex with manual axon and microglia
  segmentation
short_name: Mouse cortex axons and microglia (cryo FIB-SEM)
description: One 180-slice cryo FIB-SEM volume (6.34 nm pixels, 50 nm slices) of high-pressure-frozen
  118-day-old mouse cortex imaged with interleaved scanning to reduce charging artefacts, plus a manual
  Amira segmentation of axons with their internal structure and of microglia. The entry also deposits
  the raw sub-frame TIFFs and aligned frames from which the volume was built.
