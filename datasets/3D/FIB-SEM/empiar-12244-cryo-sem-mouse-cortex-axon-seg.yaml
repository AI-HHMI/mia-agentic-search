notes: 'EMPIAR API lists one segmentation, data/118-day old mouse cortex/brain_for_seg_b_bck.labels.tif
  ("segmentation of the different axon and their internal structure as well as microglia"), derived from
  brain_for_seg.tif; both are 180 x 1635 x 1920 (ImageJ spacing 50 nm, 6.34 nm pixels; paper: 6.34 nm
  pixel size). Labels are a uint8 palette TIFF with 23 nonzero IDs; class names are not stated in the
  files or the paper. Paper: manual segmentation in Amira. The segmented volume is one ~2.3 GB stack;
  the rest (~368 GB) are raw sub-frames and aligned frames. License CC0 on the EMPIAR page. Sibling EMPIAR-12239
  (E. gracilis) is a separate dataset. enricher: size_bytes from EMPIAR dataset_size 344.8 GB (read as
  GiB; the HTTP index totals 370.1 GB decimal) (was null).'
