notes: 'EMPIAR API lists one segmentation, data/118-day old mouse cortex/brain_for_seg_b_bck.labels.tif ("segmentation of the
  different axon and their internal structure as well as microglia"), derived from brain_for_seg.tif. Both files were
  header-probed: 180 x 1635 x 1920, ImageJ spacing 50 nm, 6.34 nm pixels (paper: in-lens SE, 6.34 nm pixel size); the labels
  are uint8 palette TIFF, so class names are not stated in the files. The paper (full text read) says volumes were manually
  segmented in Amira (1334 um3 mouse brain volume); the class list was not found in the paper text. The segmented volume
  is a single volume (~2.3 GB); the remaining ~370 GB are raw sub-frames and aligned frames. License shown as CC0 on the EMPIAR page.
  Sibling entry EMPIAR-12239 (E. gracilis) is a separate dataset. Size stated by EMPIAR: 344.8 GB.'
