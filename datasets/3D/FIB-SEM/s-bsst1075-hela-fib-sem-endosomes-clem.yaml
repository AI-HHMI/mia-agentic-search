short_name: HeLa FIB-SEM endosomes with Airyscan (CLEM)
description: Volume CLEM benchmark of a HeLa cell. A Zeiss LSM900 Airyscan fluorescence stack (Hoechst, GFP-TGN46, wheat germ
  agglutinin AF594, MitoTracker) of the fixed cell, BigWarp landmarks, affine and thin-plate-spline composites with 20 nm
  FIB-SEM data, and a manual 3D segmentation of 4 endosomes in the FIB-SEM volume (TrakEM2 label TIFF, 20 nm).
