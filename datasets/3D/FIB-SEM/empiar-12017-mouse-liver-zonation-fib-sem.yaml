short_name: Mouse liver organelle segmentations (FIB-SEM)
description: Eight enhanced FIB-SEM volumes of mouse liver hepatocytes at 8 nm isotropic voxels (lean
  fasted, obese fasted, lean fed, obese fed, obese LacZ, obese RRBP1, pericentral, periportal). Most come
  with per-class segmentation stacks (ER, lipid droplets, mitochondria instances, nucleus, plasma/cell
  membrane); the fed volumes carry only mitochondria instances here, and the pericentral/periportal volumes
  are raw images only.
