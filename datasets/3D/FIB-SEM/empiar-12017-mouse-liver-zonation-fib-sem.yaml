description: Eight enhanced FIB-SEM volumes of mouse liver hepatocytes at 8 nm isotropic voxels (lean fasted, obese
  fasted, lean fed, obese fed, obese LacZ, obese RRBP1, pericentral, periportal). Most come with per-class
