notes: 'Different from EMPIAR-10791 (pending PR; Nature 2022 paper): this entry holds the volumes of the
  2024 Nature Communications paper (fasted, LacZ, RRBP1, pericentral, periportal); the lean-fed and obese-fed
  entries here only repeat mitochondria instance segmentations, with raw and other classes in EMPIAR-10791.
  Segmentations were produced by a 3D U-Net CNN (ariadne.ai 3dEMtrace) with object proof-reading, per
  the paper Methods, so labels are automatic, not manual ground truth. Size 2.9 TB compressed is page-stated
  (20 TB uncompressed); the per-volume listing was seen for Lean Fasted only (ER, LD, mitochondria instance,
  nucleus, plasma membrane zips + raw TIFF folder). The 1858 RRBP1 volume has 65 resin-containing slices
  to delete; the 2679 LacZ volume has only 3629 segmentation images for 7705 raw slices. Pericentral/periportal
  are raw only. The CC0 license is the EMPIAR entry-page license link. enricher: one volume inspected;
  README confirms 8 nm isotropic.'
