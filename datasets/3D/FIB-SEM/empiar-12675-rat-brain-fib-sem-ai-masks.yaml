notes: 'EMPIAR API: 492 TIFF slices, 1549 x 1104 px, 8-bit; a second image set is one PNG (manual annotation of slice 1);
  the masks are described only as "AI-generated segmentation". What structure the masks mark is not stated; the abstract describes
  AI-derived masks of a targeted region of interest for adaptive scanning. Paper not open access (abstract only), so z step
  and class definition are unknown. enricher: pixel size 5 nm from EMPIAR pixel_width 50.0 (EMPIAR unit Å; was 50 nm). enricher:
  masks are 0002-0500.png at 2000 x 1536 px, not the 1549 x 1104 frame grid, so they do not pair 1:1 with frames 0001-0492;
  only labels/0001.png sits on the frame grid. enricher: formats add png (masks/labels).'
