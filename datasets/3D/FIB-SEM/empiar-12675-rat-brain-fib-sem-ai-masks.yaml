notes: 'EMPIAR API: one image set of 492 TIFF slices, 1549 x 1104 px, 8-bit, 50 nm pixel size; a second image set "annotation
  by user" is one PNG (manual annotation of the first slice); the segmentation entry is described only as "AI-generated
  segmentation" (Rat_Brain/mask). The file listing shows 499 mask PNGs against 492 frames, which was not reconciled. The
  masks are automatic, so labels are not manually verified except for the first slice. What structure the masks mark is not
  stated on the EMPIAR page; the paper abstract describes AI-derived masks of a targeted region of interest for adaptive
  scanning. The paper is not open access (only the abstract was read), so z step, microscope settings and the class definition
  are unknown. Total size is the HTTP-index estimate (about 854 MB).'
