title: 'MANC: connectome of the male adult Drosophila ventral nerve cord (FIB-SEM)'
short_name: Male Drosophila ventral nerve cord (FIB-SEM)
description: FIB-SEM volume (8 nm isotropic) of the ventral nerve cord of one adult male Drosophila melanogaster, cut into 25
  hot-knife slabs imaged on seven FIB-SEM machines, with flood-filling-network neuron segmentation, proofreading, about 10 million
  automatically detected pre-synaptic T-bars and 74 million post-synaptic densities, and about 23,000 annotated neurons.
  Released by HHMI Janelia FlyEM with the Cambridge Connectomics Group and Google Research (v1.0 June 2023, v1.2 March 2024).
