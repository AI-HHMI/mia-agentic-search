notes: 'S3 listing: jrc_jurkat-1.zarr/recon-1/labels/groundtruth has 20 crops; em/fibsem-uint8 is uint8
  zstd, scale from its .zattrs. size_bytes = uncompressed s0 voxels (compressed size unknown). COSEM preprint
