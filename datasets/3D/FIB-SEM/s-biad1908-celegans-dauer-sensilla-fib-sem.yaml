notes: 'Data is hosted on Zenodo 10.5281/zenodo.5525883 (CC-BY-4.0 there; the BioStudies record states CC0 and links to
  Zenodo for the raw data). Zip listings: dauer_E1 2000 TIFFs (20.4 GB uncompressed), dauer_E2 971 (3.1 GB), dauer_E3
  2300 (10.4 GB), L1_E4 3754 (15.3 GB). Paper Methods: 5 nm pixel size, about 8 nm milling steps; L1E4 was resliced and
  rescaled by bilinear interpolation, so its voxel size may differ from the others. Voxel z=8 nm is "about 8 nm" per
  the paper. Annotations: dauer_E1v.mod, dauer_E2v.mod, L1_E4v.mod and dauer_E3v_s.mod are volumetric reconstructions
  with CATMAID skeletons; dauer_E1v_s.mod is a skeleton model of a quarter-size-reduced version of E1 (open without
  images). Annotations cover selected cells in each volume (the most anterior 2000 images of DauerE1), not dense
  segmentation, and require IMOD (3dmod) to convert to masks. size_bytes sums Zenodo file sizes (zips plus .mod).'
