short_name: Mouse brain low/high-SNR denoising pair (FIB-SEM)
description: One pair of experimentally acquired FIB-SEM volumes of mouse brain. The low-SNR volume is a single-exposure acquisition
  and the high-SNR reference is derived from matched images averaged across 300 single-exposure frames. File names state a
  10 x 10 x 50 nm voxel size. Released by Beihang University and Tsinghua University under CC0 for low-SNR EM restoration;
  a companion Zenodo record (23390645) holds simulated low-SNR volumes from MitoEM-R.
