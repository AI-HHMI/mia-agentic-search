notes: 'Read the HF card, API record (8,484 files, 27.8 GB summed) and catalog.json (212 volumes: 178 FIB-SEM, 16 ssTEM, 10 ssSEM,
  8 SBF-SEM; 29,833 instances; 15 distinct voxel sizes, so voxel_size_nm is null). The card says license "other" and that
  terms are per volume (see each volume''s source), with caveats for MICrONS and CellMap, so spdx is custom. Some labels were
  converted from binary masks to instances. Monkey and Drosophila volumes are left out of the organism list because the species
  are not named. No authors or paper are named. It re-packages sources that overlap catalogued records (MitoEM, Lucchi,
  CellMap, MitoEM2.0).'
