title: MitoVerse - 3D electron microscopy volumes from many tissues with mitochondria instance labels
short_name: Multi-source 3D EM mitochondria instance labels
description: 212 volume-EM crops (FIB-SEM, ssTEM, ssSEM and SBF-SEM) from 13 source datasets across mouse, human, monkey, fly,
  zebrafish, worm and rat tissue, each as a zarr store with a uint8 image array and a mitochondria instance label array
  (29,833 mitochondria in total), with split files for the CellMap and MitoEM2.0 benchmarks.
