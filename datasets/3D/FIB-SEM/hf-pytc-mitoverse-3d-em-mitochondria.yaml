  notes: 'Listed the HF repo (8,484 files, exact sizes, 27,782,790,706 B). Read .zattrs and .zarray of kasthuri++_test.zarr:
    img and mito are zarr v2, shape (75,776,667), chunks (64,512,512), blosc zstd level 5, uint8; mitoEM-H.zarr/mito is
    uint16 (500,4096,4096). Sampled the whole kasthuri++_test volume (38.8 MB raw + label): img 0-255, mean 71.2 (hint:
    full range used, possibly contrast-stretched; catalog says uint8 passthrough here, other volumes were rescaled from
    float, e.g. p0.5/p99.5); mito 0-119, 120 unique ids (matches n_instances 119). Voxel sizes differ between volumes
    (catalog.json voxel_nm, x,y,z): 8x8x8 nm (157 volumes), 8x8x40 (16), 16x16x16 (10), 8x8x30 (7), 16x16x15 (5), and 10
    others, so imaging.voxel_size_nm stays null. Species in catalog.json: Mouse 119, Human 59, Monkey 15, Drosophila 13,
    Zebrafish 4, C. elegans 1, Rat 1. No single direct archive: data are zarr stores (download_url stays null).'
