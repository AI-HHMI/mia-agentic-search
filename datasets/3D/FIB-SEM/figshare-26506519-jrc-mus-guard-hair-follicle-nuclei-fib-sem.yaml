notes: "Figshare record (CC BY 4.0, refined automatic segmentation): Nuclei segmentations in jrc_mus-guard-hair-follicle using Cellpose 3.0.9 with cursory manual corrections. Classes annotated: Nucleus. EM voxel size 6 x 6 x 6 (x, y, z) nm (matches the EM .zattrs); EM s0 is zyx [12992, 16000, 14720] uint8; label s0 is zyx [812, 1000, 920] uint16 at 96 x 96 x 96 nm in the label .zattrs (the Figshare description says 128 x 128 x 128 (x, y, z) nm; the zarr metadata is used); label .zattrs declare instance_segmentation. Size is the uncompressed EM s0 voxel count times bytes per voxel, not a stored size. The Figshare record is a link-only entry (data on S3 via s3://janelia-cosem-datasets/jrc_mus-guard-hair-follicle/jrc_mus-guard-hair-follicle.zarr/recon-1/labels/inference/segmentations/nuc/). Organism from the record title. Sample source: Janelia CellMap data release paper 10.1101/2024.09.05.611438 (listed in the Figshare references; paper text read via bioRxiv)."
