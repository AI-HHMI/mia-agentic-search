title: FIB-SEM Trypanosoma cruzi cell samples
short_name: Trypanosoma cruzi cells multi-resolution (FIB-SEM)
description: One FIB-SEM volume of Trypanosoma cruzi cells (488 slices) stored at three resolutions (250 nm low-resolution,
  100 nm high-resolution ROI and a merged image), with AI-generated ROI segmentation masks (201 files) and a manual
  annotation of the first slice. Deposited as a demonstration of AI-driven contextual volume EM acquisition.
