notes: 'The masks are labelled only as AI-generated segmentation in the EMPIAR record; what structure they delineate
  (region of interest for targeted high-resolution acquisition) is not stated and the classes were not inspected. Mask/
  holds 201 files for 488 slices. The associated manuscript (Contextual High-throughput 3D Volume Electron Microscopy
  Data Acquisition Using Artificial Intelligence) is unpublished with no DOI, so no paper full text could be read. Voxel
  size is 100 nm in x/y (high-resolution and merged) and 250 nm (low-resolution); slice spacing in z is not stated in the
  EMPIAR record. Total size 11.5 GB from the HTTP index (rounded). The same group deposited a plant FIB-SEM dataset
  (EMPIAR-12659) with the same layout.'
