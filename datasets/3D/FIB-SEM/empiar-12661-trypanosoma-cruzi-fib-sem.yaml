description: One FIB-SEM volume of Trypanosoma cruzi cells (488 slices) stored at three resolutions (25
  nm low-resolution, 10 nm high-resolution ROI and a merged image; 5 nm slices), with AI-generated ROI
  segmentation masks (201 files) and a manual annotation of the first slice. Deposited as a demonstration
  of AI-driven contextual volume EM acquisition.
