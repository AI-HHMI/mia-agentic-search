notes: 'S3 listing: jrc_mus-heart-4.zarr/recon-1/labels/groundtruth has 4 cropN groups (crop1149, crop1150, crop1151, crop1152);
  em/fibsem-uint16 s0 is uint16, shape 6705 x 9038 x 18005 (z, y, x) with 8 nm scale in its Zarr v3 / OME-Zarr 0.5
  metadata. size_bytes = uncompressed raw s0 voxels x 2 bytes (crops add little). crop1149 lists 39 class names in its zarr.json;
  the other crops were not opened, so classes present per crop may differ. The bucket README says groundtruth blocks
  are labelled voxel-by-voxel by a human annotator; CC-BY-4.0 is stated for the collection on the AWS registry page.
  Species and tissue are inferred from the dataset name; sample prep, annotators and per-crop provenance are not
  documented in the sources read, and no paper specific to this volume was found (the COSEM/CellMap publications
  describe other volumes). Separate volume from the other jrc_* CellMap records; own crops. Train/val split undocumented.'
