notes: 'Single ImageJ-style TIFF stack Seeger_5_reg.tif (uint8, 470 x 1602 x 2268, uncompressed, no spatial
  calibration in the header) plus two IMOD models (20190819_Gobs_model_C1.mod, 20190830_Gobs_model_C2.mod).
  Voxel size is not stated: the TIFF header is uncalibrated, the EMPIAR entry lists pixel size 1.0 (a
  placeholder), and the paper Methods give no pixel or slice size; the IMOD models only store a z scale of
  4.49 relative to xy. The paper (Methods, Results) says healthy cells were manually segmented in 3dmod
  (IMOD 4.9); the G. obscuriglobus model was reconstructed as a control for T. immobilis, covers a single
  budding cell pair including the condensed nucleoid, and shows invaginated membranes. Which structures are
  in C1 versus C2 is not stated. Segmentations are contour models, not voxel masks; alignment to the stack
  grid was not checked. Companion record: the same study deposited T. immobilis as EMPIAR-10554. License
  CC0 from the EMPIAR page badge.'
