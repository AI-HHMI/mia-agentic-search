notes: 'Single ImageJ TIFF stack Seeger_5_reg.tif (uint8, 470x1602x2268, uncompressed, no spatial calibration) plus
  two IMOD models (20190819_Gobs_model_C1.mod, 20190830_Gobs_model_C2.mod). Voxel size not stated: TIFF uncalibrated,
  EMPIAR pixel size 1.0 (placeholder), paper gives none. enricher: the IMOD model headers state pixsize 5 nm with
  z scale 4.49 (C1) / 4.05 (C2), inconsistent with each other and, in the companion EMPIAR-10554, with its TIFF
  calibration, so not used. Paper: healthy cells manually segmented in 3dmod (IMOD 4.9); the G. obscuriglobus model
  is a control for T. immobilis, a budding cell pair with condensed nucleoid. enricher: model objects C1 = cell
  envelope, cytoplasmic membrane, nucleoid, large poly-P granule; C2 = cell envelope, large poly-P granule, DNA,
  cytoplasmic membrane. Contour models, not voxel masks. Companion record: EMPIAR-10554. License CC0 from the EMPIAR
  page badge.'
