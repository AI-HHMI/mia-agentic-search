description: Enhanced FIB-SEM volume of mouse cerebral cortex (4 nm isotropic, 25.4 x 25.6 x 23.6 um;
  5910 x 6395 x 6351 voxels) from HHMI Janelia's CellMap project, hosted on OpenOrganelle / S3 as OME-Zarr.
