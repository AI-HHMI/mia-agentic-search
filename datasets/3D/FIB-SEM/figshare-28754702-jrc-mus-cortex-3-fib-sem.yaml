notes: 'Figshare record and the public S3 bucket listing read. EM: recon-1/em/fibsem-int16 (int16, 5910 x 6395 x 6351, 128^3 chunks, zstd,
  OME-NGFF 0.4, s0-s8, 4 nm). Ground truth: seven crops (crop1033-1037, 1045, 1046) with per-class arrays; crop1033 label arrays are zarr v3
  uint8, 500^3 voxels, 2 nm, OME 0.5. The S3 listing shows many class folders per crop, which probably include classes empty
  in that crop; which classes are annotated per crop and the annotation method were not stated on the pages read, so source is unknown.
  The listed paper (Xu et al. 2021, Nature) is the general CellMap/COSEM atlas, its full text was not available, and it predates this 2023
  acquisition. Total size not stated. Other Janelia eFIB-SEM mouse volumes without a groundtruth folder (e.g. jrc_mus-hippocampus-2)
  were not proposed.'
