  read: cell type/organism (HeLa, Homo sapiens), sample prep, train/val split and per-crop classes are
  inferred from the dataset name or not checked. The OpenOrganelle portal and figshare pages returned
  404/403. size_bytes not determined. The bucket holds many other COSEM/CellMap datasets (jrc_cos7-*,
  jrc_ctl-id8-*, ...) that could become separate records.

