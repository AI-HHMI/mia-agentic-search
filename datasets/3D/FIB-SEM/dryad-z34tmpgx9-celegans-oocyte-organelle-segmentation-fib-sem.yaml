title: C. elegans oocyte FIB-SEM organelle segmentations (machine-learning whole-oocyte and hand-segmented
  substacks)
short_name: C. elegans oocyte organelle segmentation (FIB-SEM)
description: Organelle segmentations of two osmium-stained wild-type C. elegans oocytes (the mature -1 and
  the less mature -7 oocyte) imaged by FIB-SEM at 6 nm isotropic. Two whole-oocyte machine-learning segmentations
  (binned 2x2x2, 11.98 nm) with 9 organelle classes (yolk granules, mitochondria, ER, yolk-like vesicles,
  Golgi, three miscellaneous vesicle types, nucleus), plus three 21-section hand-segmented substacks (5.99
  nm) stored as segmentation layers over the EM. The raw volumes are deposited separately at EMPIAR-14008
  and EMPIAR-13896.
