notes: 'The EMPIAR record describes the segmentation as AI-generated on a 1500x1500 px corner crop; masks only cover that
  crop (coverage: top-left 1500x1500 px of slices 001-376; slice 000 and the rest of each slice unlabelled). Class meaning
  of the masks was not stated. enricher: voxel size x/y 3 nm from EMPIAR API pixel_width 30.0 (Å) and the file names "ICD
  voxel 3 nm" (was 30 nm, an Å/nm mix-up); z not stated, so it stays null. enricher: license CC0-1.0 from the EMPIAR policies
  page ("All data in EMPIAR is ... available ... under the CC0 licence"). enricher: formats tiff + png (masks), channels 1
  (grey stored as RGBA). enricher: added the EMPIAR-cited paper (Europe PMC match, Microsc Microanal 2026; not open access,
  abstract only). Different dataset from EMPIAR-12581 by the same depositor.'
