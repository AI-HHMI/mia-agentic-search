notes: 'Figshare API record (13 files: 8640_2.mrc 5.7 GB raw volume plus its ''_levels'' copy, ''Aligned 1780 of
  1780.tif'' 6.6 GB, a zip of 1,878 SEM slice images, and nine .ORSObject label files) and the Nature Communications
  paper (Europe PMC full text, Methods) read. Voxel size 6.7 x 6.7 x 7 nm is from the record description (''close
  to isotropic''). Segmentation: nucleus by MIB graphcut; symbionts, hydrogenosomes and symbiosome membrane by DeepMIB
  (DeepLabV3 ResNet50) then manually refined; plasma membrane manual, so source is mixed. Distinct from figshare-31894429
  (two high-pressure-frozen volumes). The ORSObject label files are a proprietary format and their label values
  were not inspected; the paper''s data availability statement was not found in the full text read. Not stated whether
  8640_2_levels.mrc is a duplicate of 8640_2.mrc (same byte size). enricher: MRC header says 6.744 x 6.744 x 70
  nm; kept the descriptions 7 nm z.'
