  notes: 'Figshare API: 13 files, 19,809,121,872 B (complete). Probed headers of both MRCs, the aligned TIFF and
    one zip slice (005.tif); read the first 20 KB of Nucleus.ORSObject. Not sampled: the smallest raw file is 1.5
    GB (zip) and labels are proprietary. The zip holds 512 TIFFs although it is named 001-1878, and its slices (1615
    x 2456) are not the aligned grid. No single archive: data.download_url is the record page; direct per-file links
    are ndownloader.figshare.com/files/<id> (all checked usable). Labels are ORSObject only, which TensorSwitch
    cannot read; a human would need Dragonfly to export them.'
