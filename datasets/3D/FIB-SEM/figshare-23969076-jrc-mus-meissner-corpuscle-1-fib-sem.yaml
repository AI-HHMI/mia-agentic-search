notes: Facts from the Figshare record 23969076 (segmentation; EM volume DOI 10.25378/janelia.23969070) and the S3 zarr metadata.
  EM s0 is 9600 x 7680 x 6144 uint8 at 6 nm; size_bytes is that uncompressed size. Label arrays (Ab_RA_TrkB) share the EM
  grid; they carry no class metadata and the Neuron paper full text was not reachable, so what they label (likely axon and
  cell types by array name) and instance vs semantic are not confirmed, hence annotation type other and coverage unknown.
  A separate record covers nuclei labels of this volume (Cellpose-based); these are the other proofread segmentations.
