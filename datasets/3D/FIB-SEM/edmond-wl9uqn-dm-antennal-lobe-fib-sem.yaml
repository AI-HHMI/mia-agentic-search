notes: 'Nine Edmond files: three stacks as .tar of 256/512 px JPEG CATMAID tiles (4.3, 5.6, 8.2 GB), three
  CATMAID JSON exports (neurons, connectors, tags, annotations) and three YAML stack headers. All fibers
  traced and all synapses annotated by hand in CATMAID; no voxel segmentation. enricher: voxel size set
  to null (was 4.9 x 4.9 x 20): subsets differ. Paper Methods: first-fly DA2 and DL5 4.9 x 4.9 x 20 nm,
  second-fly DA2 4.4 x 4.4 x 20 nm; YAML headers: VII_DA2 4.4 x 4.4 x 20, X_DA2 4.8 x 4.8 x 20, X_DL5
  4.89 x 4.89 x 20 nm. No single archive; files via /api/access/datafile/<id>.'
