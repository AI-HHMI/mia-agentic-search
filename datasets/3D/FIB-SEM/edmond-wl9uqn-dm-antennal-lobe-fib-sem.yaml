notes: >-
  Nine Edmond files: three stacks as .tar (stacked 256 px JPEG tiles for CATMAID; 4.3, 5.6 and 8.2 GB; no remote index, so members were not listed), three CATMAID JSON exports (neurons,
  connectors, tags, annotations) and three YAML headers (stack sizes 4490x4290x572 and 4551x4614x769). Voxel size is the paper's 4.9 x 4.9 x 20 nm for DA2 and DL5 of the first fly; the
  X_DA2 header says 4.8 and the partial second-fly DA2 is 4.4 x 4.4 x 20 nm. All fibers were traced manually and all synapses annotated by hand in CATMAID; there is no voxel segmentation.
  No single direct download link, so download_url is null (files via /api/access/datafile/<id>).
