  Three FIB-SEM volumes (20 nm z steps) of olfactory glomeruli DA2 (two flies, one partial) and DL5 of the Drosophila melanogaster antennal lobe, with CATMAID skeleton reconstructions of all
  neurons and manually mapped synapses (T-bars, inputs, outputs) as JSON, and stack metadata in YAML.
