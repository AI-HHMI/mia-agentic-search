title: SBF-SEM and FIB-SEM datasets and models of human macrophage and A431 cells
short_name: Macrophage/A431 nucleus & lipid droplets (vEM)
description: Seven volume EM datasets (2 FIB-SEM of primary human macrophages, control and TNFa-treated, at 6x6x12 nm; 5 SBF-SEM of A431 cells and macrophages at 10-15 nm pixels and 30 nm slices) with manual/semi-automatic
  segmentation models of the nucleus, lipid droplets and, for the FIB-SEM volumes, Golgi, ER, mitochondria and nuclear pore locations.
