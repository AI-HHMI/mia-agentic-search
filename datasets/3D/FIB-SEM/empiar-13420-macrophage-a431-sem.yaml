notes: Voxel size given is for the two FIB-SEM volumes (6x6x12 nm); the five SBF-SEM volumes are 10x10x30 or 15x15x30 nm. Labels (from the EMPIAR API record) cover nucleus and lipid droplets in 6 volumes
  (nuclei/LDs in SBF-SEM; nucleus, LDs, Golgi, ER, mitochondria and nuclear-pore coordinates in the FIB-SEM volumes); some volumes have no labels. Nuclear-pore annotation was manual on ~1/6 of the envelope,
  then CNN-assisted and corrected (paper Methods). Total size 37.9 GB per EMPIAR search record. Label files were not seen in a file listing (FTP listing not fetched), hence annotations_verified false. No
  predefined splits.
