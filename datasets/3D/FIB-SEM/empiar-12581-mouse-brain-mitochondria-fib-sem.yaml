  notes: 'Listed the EMPIAR HTTP index (FTP timed out): 2187 files, sizes rounded, so size_source estimated
    (6,501,704,656 B summed from the index; EMPIAR states 6.0 GB). Probed frames/0000.tif (plain single-page
    TIFF, uint8, uncompressed, 1768x2048), Mask/0000_mask.tif (uint8 LZW), Visualization/0000_segmentation.tif
    (RGB, 884x1024) and labels/brain_mit/0000.png (1-bit grey). Sampled raw 0100.tif (0-255, p1 0, p99
    249, 1.7% zeros: possibly contrast-stretched, so normalization unknown) and Mask/0100_mask.tif ({0,255},
    16% foreground); value ranges are from one sample. PNG labels measured with a short script (161 KB):
    bool, mit 7.2%, neuron 12.9%, nucleus 31.7% foreground on slice 0100. Voxel size: x/y 80 nm from EMPIAR
    API pixel_width/pixel_height; z not found (checked: TIFF headers, EMPIAR API and XML, entry page,
    Europe PMC full-text search for EMPIAR-12581, title search: no paper). No single archive: data.download_url
    stays the folder; direct files are listed under data/brain_downsampled/. frames/Visualization/ holds
    RGB overlay renderings (884x1024x3 uint8 LZW, half resolution) for viewing; not listed as an array.
    Not download-ready: z spacing unknown; the volume is stored as one 2D TIFF per slice (planner plans
    one slice); PNG slice labels not supported by the planner.'
