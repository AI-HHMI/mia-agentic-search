notes: 'Read the Figshare records of the volume (24164004) and the annotation (25800004, crop421) and
  the S3 EM .zarray (zyx [6634, 6152, 4746], uint8) and crop .zattrs. size_bytes is the uncompressed EM
  size from that shape (Figshare entries are link-only; data are chunked stores on S3). Annotated voxel
  size 16 x 16 x 16 nm, annotated region 8.8 x 8.8 x 9.34 um at offset 3222 x 4022 x 17190 nm; classes
  annotated: nucleus (Figshare record). The group also lists other CellMap class arrays but only nucleus
  is stated as annotated; nuc s0 is 584 x 550 x 550 uint8 (.zattrs: instance_segmentation). Manual segmentation
  in Amira 3D 2021.1 (CellMap protocol). The listed 2021 Nature atlas paper is not open access; only its
  abstract was read.'
