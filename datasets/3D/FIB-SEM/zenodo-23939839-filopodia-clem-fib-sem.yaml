notes: 'Example-sized deposit (zips of crops, 24/6/73/23 files each, plus one 3.4 GB correlated Airyscan/FIB-SEM TIFF), not a full benchmark; complete raw paired volumes are a separate deposit (10.5281/zenodo.23930009). Zip contents listed with peek_archive. Voxel size 10 nm isotropic is the calibration in the OME-TIFF segmentation volumes (probe.py), not confirmed by the paper; the preprint full text is not open access (Europe PMC) and bioRxiv returned 429, so organism/cell line, FIB-SEM voxel size and annotation protocol were not verified. Raw-vs-label pairing is by file name (e.g. FIB-SEM_Box1_DL-1_CropCellCellInterface.tif and _labels.tif). Dataset page does not state organism.'
