short_name: Filopodia interface segmentation (FIB-SEM)
description: Correlative Airyscan fluorescence and FIB-SEM data supporting the preprint "Filopodia-mediated trans-endocytosis".
  Contains a correlated Airyscan/FIB-SEM example volume, manual segmentations of the cell-cell interface and of
  individual intercellular filopodia, and segmentations of MYO10HMM-GFP-correlated puncta, as zips of TIFF / OME-TIFF
  files.
