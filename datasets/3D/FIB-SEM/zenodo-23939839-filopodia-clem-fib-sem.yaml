  - role: label
    path_pattern: Examples of segmentation Interesting structures/*_SEG.tif
    format: tiff
    axes: zcyx
    shape:
    - 76
    - 2
    - 164
    - 222
    shape_varies: true
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 255
    encoding: unknown
    alignment: same-grid
    alignment_notes: <crop>_SEG.tif pairs with <crop>.tif; ImageJ hyperstack with 2 channels, each {0,255} in the
