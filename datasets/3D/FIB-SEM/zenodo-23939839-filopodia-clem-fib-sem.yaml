      \ (+ __composite), Box3_Dot<NN>.tif + __volume.ome.tif\n  Examples of filopodia segmentation.zip     231 MB\
      \   24 files: FIB-SEM_Box1_Filopodia01-10.tif + __volume.ome.tif (+ composites)\n  Examples of segmentation\
      \ Interesting structures.zip  101 MB  23 files: <crop>.tif, <crop>_SEG.tif, <crop>__volume.ome.tif\n  Examples\
      \ of cell-cell interface segmentation.zip     270 MB   6 files: FIB-SEM_Box1_DL-1_CropCellCellInterface.tif\
      \ + _labels.tif, Filopodia02 + __interface.ome.tif\n  preview.png  1.7 MB"
