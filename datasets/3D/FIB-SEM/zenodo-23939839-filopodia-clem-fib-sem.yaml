  notes: 'Listing: Zenodo API (6 files, exact sizes) and each zip central directory (peek_archive; 127 members).
    listing.py --expand-zips hung on the /content URLs, so zips were listed one by one. Probed 7 headers; sampled
    Box3_220-295 raw + SEG + __volume and Filopodia01 raw + mask (~8 MB transferred). Values are from one sample
    per array. tools/sample.py needs the zip URL to end in .zip, so the zenodo.org/records/.../files/<name>.zip
    links from the record page were used (download-check usable, ranges ok). Not described as arrays: the cell-cell
    interface pair (290 MB each, deflated, header not probed), the MYO10 dot crops, the 3.6 GB correlated FOV1 TIFF
    and Imaris .ims files. Voxel size: label OME-TIFFs say 10x10x10 nm; raw Filopodia01 header says 10.16x10.16x25.4
    nm, Box3 raw is uncalibrated; preprint Methods not readable (not OA, bioRxiv 429), Zenodo pages state none.
    No single archive: data.download_url left null; the 5 zips are direct links on zenodo.org/records/23939839/files/.'
