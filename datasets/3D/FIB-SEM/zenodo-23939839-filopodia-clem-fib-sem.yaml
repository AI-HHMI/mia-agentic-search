notes: 'Example-sized deposit (crops), not a full benchmark; raw paired volumes are Zenodo 23930009. Raw/label pairing
  by file name. Preprint full text not open access; bioRxiv returned 429. enricher: organism Homo sapiens (was empty):
  Zenodo 23930009 says the CLEM/FIB-SEM data are DCIS.com cell monolayers; Cellosaurus CVCL_5552 gives Homo sapiens.
  enricher: voxel size 10 nm kept from the label OME-TIFFs; raw TIFF headers disagree (10.16x10.16x25.4 nm or inch
  units), no doc states it. enricher: formats + png (preview, orthoslice PNGs); size from the Zenodo file listing.
  enricher: coverage = sparse crops (filopodia, interface, MYO10 dots, interesting structures); manual per Zenodo
  text, puncta method not stated.'
