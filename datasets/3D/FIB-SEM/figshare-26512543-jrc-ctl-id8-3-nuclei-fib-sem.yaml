notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 8 x 8 x 8 nm (x, y, z), matching the EM .zattrs (fibsem-uint8, s0 scale 8 nm).
  EM s0 is zyx 1600 x 4028 x 8750 uint8 (zstd, chunks 64^3, 6 levels); label s0 is zyx 100 x 251 x 546 uint8
  at 128 nm (translation 60 nm, 3 levels); label .zattrs declare instance_segmentation (absent 0, unknown 255). The label array sits under
  labels/inference in the bucket but Figshare describes it as manual. Organism is not stated on the Figshare record (title: Killer T-Cell attacking cancer cell), so organism is left empty. size_bytes is the uncompressed s0 size of EM plus label
  (compressed chunks are smaller). The Figshare file is a link-only entry to the S3 prefix; no paper is cited on the record. Different volume
  from the CellMap nuclei records of other volumes, e.g. figshare-26513227-jrc-mus-sc-zp105a-nuclei-fib-sem.'
