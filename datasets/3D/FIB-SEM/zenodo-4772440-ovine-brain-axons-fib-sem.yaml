notes: 'One 2.5 GB zip (613 files). Listed with tools/peek_archive.py: 01_FIBSEM_images holds three zips (04_05_06_CC, _CR, _FO; README: black-and-white .bmp slices at 0.020 um/pixel plus a .tif with acquisition settings, "ready for import into MIMICS"); 02_MIMICS_files holds 15 .mcs files (1.8 GB) and 584 centreline .txt files; 03_scripts holds 8 .m and 3 .mat files. The segmentation is stored in MIMICS .mcs, a proprietary format, so usable labels may need MIMICS to export; the image zips were not unpacked, so the number of slices per volume and the exact count of image volumes are not stated here (paper: three areas from three brains, one 3D volume each acquired in ~8 h). Paper Methods: 150 nm slice thickness, 764 x 1024 px frames at 0.020 um/pixel, axons manually segmented in MIMICS on every slice. Zenodo record licence is CC BY-NC 4.0 (the paper itself is CC BY 4.0). Non-commercial licence limits use.'
