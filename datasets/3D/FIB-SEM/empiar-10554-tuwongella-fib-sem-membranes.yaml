notes: 'Single ImageJ TIFF stack "Aligned 464 of 464.tif" (uint16, 464x2082x3720, uncompressed) with six IMOD models.
  Voxel size 8x8x20 nm is the ImageJ calibration in the TIFF header; EMPIAR lists pixel size 1.0 (placeholder) and
  the paper gives none. enricher: the IMOD model headers state pixsize 3 nm with z scale 6.47 (19.41 nm; C2: 1 pixel,
  uncalibrated), conflicting with the TIFF xy 8 nm; record value kept, confidence lowered to 0.65. Paper: healthy
  cells manually segmented in 3dmod (IMOD 4.9), cytoplasmic membrane and cell envelope; C1 objects (membrane damage,
  ruptured/empty vesicles) match the damaged cell of Fig. 1C. enricher: coverage = six single cells (C1-C6) in one
  stack, contours only on the slices each cell spans. Segmentations are contour models, not voxel masks. Companion
  record: EMPIAR-10553. License CC0 from the EMPIAR page badge.'
