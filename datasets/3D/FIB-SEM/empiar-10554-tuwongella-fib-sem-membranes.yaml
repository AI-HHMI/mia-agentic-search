notes: 'Single ImageJ-style TIFF stack "Aligned 464 of 464.tif" (uint16, 464 x 2082 x 3720, uncompressed) with
  six IMOD models. Voxel size 8 x 8 x 20 nm is the calibration stored in the TIFF header (probe of the file
  header); the EMPIAR entry lists pixel size 1.0 (placeholder) and the paper Methods give no voxel size.
  The paper (Methods, Results) says cells with healthy morphology were manually segmented in 3dmod (IMOD
  4.9): the cytoplasmic membrane and cell envelope; Figure 1 shows four manually segmented cells (C3-C6),
  three fully and one partially reconstructed. The role of the C1 and C2 models and why no SFF conversion
  exists for C2 are not stated. Segmentations are contour models, not voxel masks; their alignment to the
  stack grid was not checked. Companion record: the same study deposited G. obscuriglobus as EMPIAR-10553.
  License CC0 from the EMPIAR page badge.'
