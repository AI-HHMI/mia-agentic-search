notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 2 x 2 x 2 nm (x, y, z), but the EM .zattrs (fibsem-int16) give 4 x 4 x 5.08 nm (x, y,
  z), used here. EM s0 is zyx 560 x 1700 x 5550 int16; label s0 is zyx 35 x 106 x 346 uint8 at 81.28 x 64 x 64 nm; label .zattrs declare
  instance_segmentation. The label array sits under labels/inference in the bucket but Figshare describes it as manual. Total size not
  stated on the Figshare record or zarr metadata, left null; The Figshare file is a link-only entry. enricher: size estimated from shapes
  (technical.notes); encoding from cellmap .zattrs (instance_segmentation, absent 0, unknown 255). enricher: organism Chlorocebus sabaeus
  inferred from the cell line name (COS-7), as for the sibling records on main.'
