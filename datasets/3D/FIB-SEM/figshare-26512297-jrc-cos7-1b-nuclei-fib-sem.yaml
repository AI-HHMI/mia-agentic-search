notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol),
  class nuclei only; the record gives the source EM voxel size as 2 x 2 x 2 nm (x, y, z), but the EM .zattrs (fibsem-int16)
  give 4 x 4 x 5.08 nm (x, y, z), used here. EM s0 is zyx 560 x 1700 x 5550 int16; label s0 is zyx 35 x 106 x 346
  uint8 at 81.28 x 64 x 64 nm; label .zattrs declare instance_segmentation. The label array sits under labels/inference
  in the bucket but Figshare describes it as manual. Total size not stated on the Figshare record or zarr metadata,
  left null; organism not stated on the record, left empty. The Figshare file is a link-only entry; the bioRxiv
  paper cited by sibling records (10.1101/2024.09.05.611438) could not be read (HTTP 429) and is not cited on this
  record.'
