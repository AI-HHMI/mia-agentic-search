notes: 'S3 listing: jrc_macrophage-2.zarr/recon-1/labels/groundtruth has 18 crops; em/fibsem-uint8 is
  uint8 zstd, scale from its .zattrs. size_bytes = uncompressed s0 voxels (compressed size unknown). COSEM
  preprint full text: blocks manually segmented in HeLa, Jurkat, Macrophage and SUM159 volumes (Amira-Avizo),
  holdout blocks for validation; sample prep per Xu et al. 2020. CC-BY-4.0 is stated for the collection
  on the AWS registry page. Species not stated in sources read. Separate volume from sibling jrc-hela-2
  record; own crops. Per-crop train/val split undocumented. enricher: size_bytes now raw s0 + groundtruth
  crops s0 (estimated, uncompressed). enricher: species still not found (bucket README, zarr attributes,
  COSEM preprint text checked).'
