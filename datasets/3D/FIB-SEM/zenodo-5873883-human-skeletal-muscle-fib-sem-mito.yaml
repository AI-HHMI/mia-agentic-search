  notes: 'Zenodo listing with zip members (tools/listing.py, 3 files, 35,884,020,572 B, complete). Members
    are deflated, so headers were read by decompressing the start of each member: ImageJ calibration 33.33
    px/um (30 nm) in x/y and spacing 0.03 um in z for the Standardised and Segmentation files of all 10
    individuals (11 files checked). Sample GT110_A2 raw (12.5 MB compressed) and Mito mask (0.24 MB):
    both 155 x 155 x 775 uint8; raw range [0, 255] (one sample, n_unique 56, saturated at both ends);
    mask values {0, 255}, 2.2 % foreground. 7 segmentation files have no class in the name (e.g. GT045_A1.tif)
    and are not covered by either label pattern; a nested Segmentations/A1.zip was not opened. TIFFs are
    uncompressed: each member size equals its voxel count (e.g. 155*155*775 = 18.6 MB). Parts 2-6 (raw
    aligned files) are separate Zenodo records, not included here. Binned and Aligned Files/ (13 files,
    12 .tif + GT045_A1.mrc, unlabelled) are left out of arrays: binned acquisitions at 15 or 30 nm per
    Dataset structure.rtf (GT_073_A1 header: 15 nm, 531 x 1459 x 2775).'
