notes: 'Zip listed: 40 standardised volumes, 44 segmentation TIFFs (27 Mito, 10 Z-disk, 7 unnamed), 13
  binned aligned files (one .mrc). Coverage is partial: mitochondria for most volumes, Z-disk for some,
  none for e.g. GT_042. Raw aligned files of the same individuals are in parts 2-6 (Zenodo 5874820, 5874844,
  5874885, 5874883, 5874899). Segmentations are semi-automated (Weka) per the abstract; full text not
  open access. n_items counts the standardised volumes. enricher: voxel size 30x30x30 nm from the ImageJ
  headers of the Standardised and Segmentation TIFFs (was null); Dataset structure.rtf states binning
  to 15 or 30 nm. enricher: download_url = the part-1 zip (was null).'
