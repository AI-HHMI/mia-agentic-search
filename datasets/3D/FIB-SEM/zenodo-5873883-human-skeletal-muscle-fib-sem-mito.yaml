notes: 'Zip listed with peek_archive: 40 standardised volumes, 57 segmentation TIFFs (mitochondria for most volumes,
  Z-disk for some, so coverage is partial; e.g. GT_042 has none), 22 binned aligned volumes, one .mrc. Part 1 is
  the labelled part; raw aligned files of the same individuals are in parts 2-6 (Zenodo 5874820, 5874844, 5874885,
  5874883, 5874899). The dataset-structure file says raw data were 5x5x15 nm and binned to 15x15x15 nm (later datasets
  15 to 30 nm); the voxel size of the standardised volumes and segmentations is not stated there or in the open
  abstract, so voxel_size_nm is null. Segmentations come from semi-automated Weka segmentation per the abstract.
  The paper full text is not open access, so staining, muscle site and exact annotation protocol were not read.
  n_items counts the standardised volumes.'
