notes: 'Download page lists the aligned EM as N5 at 8 nm isotropic (gs://flyem_cns_z0720_07m_dvidcoords_n5, uint8, no CLAHE) and a CLAHE
  Neuroglancer-precomputed copy (gs://flyem-male-cns/em/em-clahe-jpeg); proofread segmentation gs://flyem-male-cns/v1.0/segmentation. The
  paper Data availability gives the static download bucket gs://flyem-male-cns. License CC-BY 4.0 as stated on the download page and the
  Janelia news page. The preprint (v2, 2025-10-30) is the full text read; the Cell version (2026) is not open access and was not read. Release
  v1.0 announced 2026-06-08 on the Janelia news page. Total size not stated (160 teravoxels uncompressed); the volume is far too large to
  download in full. Synapse detections average precision/recall 0.82/0.81 (paper). Same sample as the right optic lobe connectome (Nern et
  al.). No train/test split.'
