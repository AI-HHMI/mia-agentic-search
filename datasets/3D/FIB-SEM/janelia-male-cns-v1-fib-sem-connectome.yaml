title: 'MaleCNS v1.0: complete FIB-SEM connectome of the adult male Drosophila central nervous system'
short_name: Male Drosophila CNS connectome (FIB-SEM)
description: 8 nm isotropic eFIB-SEM volume (160 teravoxels, 0.082 mm3) of the whole central nervous system of one adult male Drosophila
  melanogaster (central brain, optic lobes, ventral nerve cord, neck connective), with flood-filling-network neuron segmentation that is
  fully proofread (166,691 neurons), nuclei segmentation, automatic synapse detections (46 million presynapses) and neurotransmitter
  predictions. Released as v1.0 by HHMI Janelia FlyEM with the Cambridge connectomics group and Google.
