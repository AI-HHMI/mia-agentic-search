notes: 'The Figshare record (CC BY 4.0) lists the annotation as dense manual nucleus segmentations made
  in Amira (protocols.io Amira vEM protocol) and gives the source EM voxel size as 8 x 8 x 8 (X, Y, Z);
  the EM array in the bucket (recon-1/em/fibsem-uint16) has s0 at 8 x 8 x 8 nm (x, y, z) per its .zattrs,
  which is the value used here, and the label array s0 is at 64 x 64 x 32 nm (x, y, z). The label array
  lives under labels/inference in the bucket but is described as manual by the Figshare record. The Figshare
  record cites a bioRxiv paper (10.1101/2024.09.05.611438) that could not be read (HTTP 429), so no publication
  is listed. Only the nucleus class is annotated. enricher: formats ome-zarr (was zarr), per the stores''
  multiscales.'
