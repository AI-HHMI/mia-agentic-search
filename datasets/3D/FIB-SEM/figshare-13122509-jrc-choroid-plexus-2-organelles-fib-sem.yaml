notes: 'EM volume is Figshare 10.25378/janelia.13123427 (CC BY 4.0, 8 nm, 29 x 34 x 5 um); segmentations
  are 10.25378/janelia.13122509 (CC BY 4.0). Bucket arrays checked: EM recon-1/em/fibsem-uint8 s0 3750
  x 3750 x 1794; mito_seg s0 3588 x 7500 x 7500 uint16 at 4 nm, mito_pred uint8. Segmentations are machine
  output (the Figshare record says predictions and segmentations, classes endo, ER, mito, nucleus, PM,
  vesicle), not manual ground truth. Related paper: Heinrich et al. (bioRxiv 2020; Nature 2021); the bioRxiv
  text was read. The choroid plexus data itself is cited to Coulter et al. 2018. enricher: labels at 4
  nm vs EM 8 nm, apparently in x,y,z order (see technical).'
