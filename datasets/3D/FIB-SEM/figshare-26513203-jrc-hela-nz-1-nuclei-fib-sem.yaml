notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 8 x 8 x 7.9 nm (x, y, z), but the EM .zattrs (fibsem-int16) give 8 x 8 x 7.79 nm (x,
  y, z), used here. EM s0 is zyx 9382 x 500 x 12400 int16; label s0 is zyx 1172 x 62 x 1550 uint8 at 62.32 x 64 x 64 nm; label .zattrs
  declare instance_segmentation. The label array sits under labels/inference in the bucket but Figshare describes it as manual. Total
  size not stated on the Figshare record or zarr metadata, left null; The Figshare file is a link-only entry. enricher: size estimated
  from shapes (technical.notes); encoding from cellmap .zattrs (instance_segmentation, absent 0, unknown 255). enricher: organism Homo
  sapiens inferred from the cell line name (HeLa), as for the sibling records on main.'
