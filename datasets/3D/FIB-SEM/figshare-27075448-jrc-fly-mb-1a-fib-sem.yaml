notes: 'Figshare record of the EM volume, the six per-crop annotation records (crop120-123, 134, 178, titled "Manual organelle segmentations") and
  the public S3 bucket were read. EM array recon-1/em/fibsem-uint8: uint8, (z,y,x) 9504 x 9286 x 11005, 4 nm, zstd 64x128x128 chunks. Each crop
  is 0.8 um^3 annotated at 2 nm; class sets differ per crop (11 to 29 classes; crop134 has only Golgi, endosome and vesicle structures and cell).
  The listed paper (Xu et al. 2021 Nature) is the general COSEM atlas, its full text was not available, and it was not read. Total size not stated.'
