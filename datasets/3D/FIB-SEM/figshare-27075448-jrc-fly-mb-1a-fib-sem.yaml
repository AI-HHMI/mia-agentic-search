title: Near-isotropic, reconstructed volume electron microscopy (FIB-SEM) of Drosophila mushroom body (jrc_fly-mb-1a)
short_name: Drosophila mushroom body organelle crops (FIB-SEM)
description: FIB-SEM volume of the alpha lobe of the mushroom body of a 6-day-old female Drosophila (4 nm isotropic, 44 x 37 x 38 um)
  from the CellMap 2024 Segmentation Challenge, hosted as OME-Zarr on S3 / OpenOrganelle. Six manually segmented ground-truth
  crops (crop120-123, 134, 178; 0.8 um cubes at 2 nm) label 11 to 29 organelle and cell-structure classes such as mitochondria, ER, Golgi,
  endosomes, microtubules and nucleus, each published as its own Figshare item.
