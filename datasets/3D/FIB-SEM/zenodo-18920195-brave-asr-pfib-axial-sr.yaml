notes: 'Usable without labels as restoration (axial super-resolution) data: README table lists five TIFF volumes
  (5 nm raw 2000x2000x800; 5, 10, 20 and 40 nm slice thickness, each 2000x2000x256), all 5 nm XY, Thermo Fisher
  plasma-FIB, 1 us dwell, SIFT-registered. Z spacing differs by volume (5/10/20/40 nm), so voxel_size_nm.z is null.
  Size is the sum of the Zenodo file sizes (about 15.2 GB, includes evaluate.py, README and CSV). The description
  cites the SkelEM framework (ECCV 2026) but gives no paper DOI and none was looked up, so publications is empty.
  No segmentation labels are provided. enricher: headers differ from the README table: raw volume is 800x3000x3708,
  the 5 nm aligned volume has 800 slices (README: 256).'
