title: FIB-SEM dataset showing localization of a Golgi matrix protein GM130 in human hepatocellular carcinoma cell (Huh-7)
short_name: Huh-7 immunogold GM130 segmentation (FIB-SEM)
description: One FIB-SEM volume of 564 slices (4 x 4 x 8 nm voxels) of an immunogold-labelled Huh-7 human hepatoma cell (anti-GM130,
  OTO-stained), with a matching stack of 564 label images segmenting the immunogold particles. The labels were produced in
  DeepMIB, trained on 54 images.
