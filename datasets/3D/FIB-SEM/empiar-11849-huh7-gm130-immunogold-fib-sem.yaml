    and Labels/..._001.tif: plain single-page TIFF, 1397x3269 uint8, LZW, MIB header (BoundingBox, crop, drift correction).
    Sampled slice 282 pair (1.73 MB + 32 KB): raw [0,255], mean 209, p0.1 = 3 (saturated only at 255, so normalization unknown);
    label values {0,1}, 0.12% foreground. Value ranges are from one slice. TensorSwitch planner: per-slice TIFF stacks are
    read as 2D, so the record is not download-ready until the planner can stack a folder. No single archive: data.download_url
    stays the folder; direct files are listed under data/Images and data/Labels.'
