short_name: U2-OS organelle segmentation (FIB-SEM)
description: Ground-truth image/label training sets and DeepMIB projects for segmenting the nuclear envelope,
  mitochondria, endoplasmic reticulum and Golgi in a FIB-SEM volume of a human U2-OS osteosarcoma cell.
  Archives contain Amira (.am) image slices with matching label TIFFs, trained networks and prediction
  crops. The full volume is EMPIAR-11746.
