notes: Voxel size (2.5 x 2.5 x 5 nm) is taken from the EMPIAR-11746 record of the full volume; the Zenodo
  page does not state it and the Zenodo crops may be binned (a bin2 prediction crop exists). Zenodo page,
  file listings (peek_archive of 1_NE.zip, 0_Segmentation.zip, 1_Golgi.zip) and the DeepMIB paper were
  checked; the paper does not describe this dataset in detail. Annotation procedure is not stated on the
  Zenodo page (EMPIAR notes manual plus MIB deep-learning generated labels), so source is unknown. Label
  files were not individually listed beyond the .tif files paired with .am images.
