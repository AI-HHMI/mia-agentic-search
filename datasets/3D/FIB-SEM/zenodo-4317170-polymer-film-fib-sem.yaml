title: Convolutional neural networks for segmentation of FIB-SEM nanotomography data from porous polymer
  films for controlled drug release (dataset and code)
short_name: Porous polymer film pore segmentation (FIB-SEM)
description: Three FIB-SEM tomography volumes (HPC22, HPC30, HPC45) of porous ethyl cellulose films with
  the HPC phase leached out, supplied as 600 raw TIFF slices, with manual pore/solid segmentations of
  selected regions, train/validation/test region indices, trained CNN models, final segmentation PNG slices
  and Python/Matlab code. Released with the Journal of Microscopy paper.
