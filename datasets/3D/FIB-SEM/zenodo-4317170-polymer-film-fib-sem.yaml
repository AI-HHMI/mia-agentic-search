notes: 'Zenodo record is a single 9.2 GB zip (peek_archive: 600 raw .tif slices, 600 seg .png, 15 .npy,
  8 .mat, models, code). The readme says manual segmentations come from previous work and the data split
  is stored as region-index files. Voxel size, publication date and per-volume dimensions not stated on
  the Zenodo record or readme; paper full text is not open access (abstract only read), so voxel_size_nm
  is null. n_items = 3 volumes. enricher: manual segmentations found in data/manual_segmentation (100
  binary 256x256 patches per volume), annotations_verified now true. maintainer 2026-10-06: 10 nm pixels
  and 50 nm slice thickness, from the open-access full text (Chalmers repository).'
