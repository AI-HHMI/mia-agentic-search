notes: 'Read four Janelia figshare records (EM 33050051, manual cells 33966127, nuclei 33966160, stylet
  cavities 33965986; all CC BY 4.0) and listed the S3 bucket (1,592 objects, 598.6 GB under the zarr;
  labels 25.8 MB). The EM array is 36877 x 5529 x 6360 (z,y,x) uint8, sharded and zstd-compressed. The
  cell and nuc label arrays exist at recon-1/labels/inference/segmentations/{cell,nuc}; a third array
  named anatomy (64 nm, uint64) is presumably the cavity segmentation, but the figshare record does not
  name the array and the figshare "Dataset URL" omits the recon-1 level. The figshare records label the
  segmentations manual (Amira-Avizo); the paper cited on the EM record (Xu et al. 2017, eLife 25916) is
  the FIB-SEM instrument paper, not a description of this dataset, so no publication is listed. The EM
  and the three label sets are separate figshare records of one acquisition, treated here as one dataset.
  enricher: labels span the full EM extent at 32 nm (was: sub-volume).'
