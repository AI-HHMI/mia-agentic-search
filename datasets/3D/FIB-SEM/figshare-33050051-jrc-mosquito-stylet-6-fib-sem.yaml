description: Enhanced FIB-SEM volume jrc_mosquito-stylet-6 of the stylet of an adult female Aedes aegypti
  mosquito from the Janelia CellMap project, imaged at 8 nm isotropic voxels (50.88 x 44.23 x 295.02 um)
  and stored as a Zarr v3 array on the public janelia-cosem-datasets S3 bucket (OpenOrganelle). Three
  manual dense segmentations made in Amira-Avizo accompany it - cells, nuclei and stylet cavities - released
  as separate Janelia figshare records.
