  notes: 'HTTP index lists 20 files (19 MRC + README.rtf), ~78.2 GB with rounded sizes (FTP listing timed out),
    so size_bytes stays null; EMPIAR states 72.9 GB. Headers (probe.py, 7 files): F059 1446x1683x1928, F107_A1 1350x1506x1647,
    F107_A2 1610x1410x1386, F107_A3 1749x1524x2130 (z,y,x), all MRC mode 0 (int8), uncompressed. Header voxel size
    is 20 nm isotropic for F059 but 30 nm isotropic for all F107 files;  Sample: middle z-slice read by range from
    4 files (custom script, 12.2 MB): F059 raw int8 [-128, 84], mean -67.7, -128 in ~50% of pixels (likely padding
    outside the sample); F059 mitos and nuclei masks contain only -128 and 127 (binary, stored as signed int8: 127
    = foreground); F107_A1 entotic_cell is all -128 in its middle slice. Class names from file names. Values are
    from single slices. Second pass: voxel_size_nm null because subsets differ (F059 20 nm iso; F107 30x30x40 nm
    per paper Methods, header 30 iso). Voxel size checked: MRC headers, EMPIAR API (no pixel_width), paper Methods.
