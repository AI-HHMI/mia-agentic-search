notes: 'Total size stated as 72.9 GB on EMPIAR (not summed from the listing, so size_bytes left null). The
  README lists 4 acquisitions, F059, F107_A1, F107_A2, F107_A3; the listing shows a raw volume plus 2-5
  mask volumes each. Voxel size 20 nm is from the MRC header of F059_bin2.mrc (1446x1683x1928, int8); the
  paper says whole-organoid acquisitions at 15x15x20 nm were binned twice and cells at 10 nm isotropic, so
  the header value is unverified for the other volumes. License CC0 from the EMPIAR page title block. Segmentations
  were produced by Dragonfly CNNs trained on manual annotation of 2-5 subframes per dataset, so labels are
  model predictions (source: automatic). Also deposited as BioImage Archive S-BIAD610 (fluorescence plus
  EM).'
