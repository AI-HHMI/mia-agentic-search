notes: 'Total size stated as 72.9 GB on EMPIAR. README lists 4 acquisitions, F059, F107_A1-A3; each has a raw volume
  plus 2-5 mask volumes. License CC0 from the EMPIAR page. Segmentations from Dragonfly CNNs trained on manual annotation
  of 2-5 subframes per dataset (source: automatic). Also deposited as BioImage Archive S-BIAD610. voxel sizes differ
  by subset: F059 20 nm isotropic (MRC header; paper: 10 nm isotropic cells, binned 2x); F107_A1-A3 30x30x40 nm
  (paper Methods: 15x15x20 nm whole organoids binned twice; MRC header says 30 nm isotropic, docs win). enricher:
  voxel_size_nm set to null (was 20x20x20, F059 only).'
