description: One 4 nm isotropic enhanced FIB-SEM volume (8525 x 8628 x 8460 voxels, 33.8 x 34.1 x 35 um)
  of a Planococcus citri bacteriocyte containing the nested endosymbionts Tremblaya princeps and Moranella
  endobia, with segmentation volumes for mitochondria, lysosomes, nucleus and the two endosymbionts, stored
  as an OME-Zarr with a multiscale pyramid and a labels group. The raw volume is also deposited as a single
  MRC file in EMPIAR-13995.
