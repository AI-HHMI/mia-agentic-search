notes: 'Read: Figshare record, EMPIAR-13995 entry, Neuroglancer state file, zarr metadata. Raw array (z,y,x)
  8525 x 8628 x 8460, uint16, OME-NGFF 0.4 multiscale; five label arrays (Lysosomes, Mitochondria, Moranella,
  Nucleus, Tremblaya) share the grid. Segmentations were made with the Empanada napari plugin (model versus
  manual proofreading not stated, hence mixed). The preprint is not open access, so only its abstract
  was read.  Only the Figshare record states a license. enricher: size_bytes estimated from the zarr shapes/dtypes
  (level 0, uncompressed; was null). EMPIAR states about 1.1 TB for the raw MRC. organisms: one volume;
  Planococcus citri is the host cell, labels/Tremblaya and labels/Moranella mark the two endosymbionts.'
