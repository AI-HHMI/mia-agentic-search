notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 8 x 8 x 8 nm (x, y, z), matching the EM .zattrs (fibsem-uint8). EM s0 is zyx 1375 x 4933
  x 7500 uint8; label s0 is zyx 85 x 308 x 468 uint8 at 128 x 128 x 128 nm; label .zattrs declare instance_segmentation. The label array
  sits under labels/inference in the bucket but Figshare describes it as manual. Total size not stated on the Figshare record or zarr
  metadata, left null; organism not stated on the record, left empty. The Figshare file is a link-only entry. enricher: size estimated
  from shapes (technical.notes); encoding from cellmap .zattrs (instance_segmentation, absent 0, unknown 255).'
