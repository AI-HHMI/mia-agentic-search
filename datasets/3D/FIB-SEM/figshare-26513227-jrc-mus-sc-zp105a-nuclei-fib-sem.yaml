notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 6.0 x 6.0 x 6.0 nm (x, y, z), matching the EM .zattrs (fibsem-uint8). EM s0 is zyx 12000
  x 5000 x 6600 uint8; label s0 is zyx 750 x 312 x 412 uint8 at 96 x 96 x 96 nm; label .zattrs declare instance_segmentation. The label
  array sits under labels/inference in the bucket but Figshare describes it as manual. Organism from the record title. The Figshare
  file is a link-only entry; the bioRxiv paper cited by sibling records (10.1101/2024.09.05.611438) could not be read (HTTP 429) and
  is not cited on this record. enricher: size estimated from shapes (technical.notes); label values are instance IDs (cellmap .zattrs:
  instance_segmentation, absent 0, unknown 255).'
