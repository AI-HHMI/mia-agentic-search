notes: "Figshare record (CC BY 4.0, refined automatic segmentation): Nuclei segmentations in jrc_mus-liver-2 using Cellpose 3.0.9 with cursory manual corrections.. Classes annotated: Nucleus. EM voxel size 8.0 x 8.0 x 8.0 (X, Y, Z) nm (matches the EM .zattrs), EM s0 is zyx [10276, 11511, 12713] |u1 (|u1 = uint8); label s0 is zyx [642, 719, 794] <u2 at 128 x 128 x 128 (x, y, z) nm; label .zattrs declare instance_segmentation. Size is the uncompressed EM s0 voxel count, not a stored size. The Figshare record is a link-only entry (data on S3 via s3://janelia-cosem-datasets/jrc_mus-liver-2/jrc_mus-liver-2.zarr/recon-1/labels/inference/segmentations/nuc/). Organism from the record title. Sample source: Janelia CellMap data release paper 10.1101/2024.09.05.611438 (listed in the Figshare references; the paper text read via Europe PMC/bioRxiv)."
