notes: 'Figshare (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class
  Nuclei; it states the source EM voxel size as 4 x 4 x 4, but the source EM record (10.25378/janelia.24222898)
  and the EM .zattrs give 4 x 4 x 2.96 nm (x, y, z), used here. Label s0 is at 32 x 32 x 23.68 nm. The label array
  sits under labels/inference in the bucket but Figshare describes it as manual. Cited bioRxiv paper (10.1101/2024.09.05.611438)
  could not be read (HTTP 429). enricher: formats ome-zarr (was zarr), per the stores'' multiscales; size from a
  complete S3 listing (was null); voxel size confirmed by the source EM Figshare record.'
