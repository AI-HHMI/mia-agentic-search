notes: 'The Figshare record (CC BY 4.0) lists the annotation as dense manual nucleus segmentations made in Amira (protocols.io
  Amira vEM protocol) and gives the source EM voxel size as 4 x 4 x 4 (X, Y, Z); the EM array in the bucket (recon-2/em/fibsem-int16) has
  s0 at 4 x 4 x 2.96 nm (x, y, z) per its .zattrs, which is the value used here, and the label array s0 is at 32 x 32 x 23.68 nm (x, y, z). The label
  array lives under labels/inference in the bucket but is described as manual by the Figshare record. The Figshare record cites a
  bioRxiv paper (10.1101/2024.09.05.611438) that could not be read (HTTP 429), so no publication is listed. Total size was not
  measured. Only the nucleus class is annotated.'
