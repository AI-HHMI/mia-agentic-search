notes: 'Figshare record of the EM volume, the four crop annotation records (crop378-381) and the public
  S3 listing were read. EM array recon-1/em/fibsem-uint8 is uint8 of shape (z,y,x) 40152 x 19814 x 20629
  at 8 nm with zstd chunks 64x128x128 (OME-NGFF multiscale s0 upward). Annotations: Amira manual segmentation
  following the protocols.io organelle protocol; crop378 and crop379 label nucleus (16 x 16 x 16 um),
  crop380 and crop381 label mitochondria (6.4 x 6.4 x 16 um); other class folders in the S3 listing belong
  to the challenge template and were not checked for content. No paper is cited beyond the CellMap challenge
  DOI and a 2017 eLife reference, so none was read. The CellMap 2024 Segmentation Challenge record in
  the catalog covers these crops in aggregate; this record is the single volume. enricher: size_bytes
  estimated from the array shapes (was null).'
