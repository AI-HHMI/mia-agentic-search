notes: 'Linked to FIB-25 by the Janelia FlyEM release page (same dataset as medulla7column; ground truth
  not pixel-perfect). LICENSE.txt is a Creative Commons public licence text without a named version, recorded
  as custom. PNAS paper not open access (abstract only). The 100 GB FIB-25 raw tar has no ground truth
  or stated licence; not covered. training_sample1 has raw only (used for ilastik boundary training).
  enricher: voxel size 10x10x10 nm from the per-sample README.txt files (''isotropic resolution of 10nm'';
  was 8x8x8).'
