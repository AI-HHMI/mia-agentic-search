notes: 'Linked to FIB-25 by the Janelia FlyEM release page (same dataset as medulla7column; ground truth not
  pixel-perfect; training2 = 250^3, val = 500^3 voxels). Voxel size uncertain: arXiv 1905.06236 says FIB-25
  was imaged at 8 nm but its 520^3 and 250^3 training subvolumes are at 10 nm; the repo does not state it.
  LICENSE.txt is a Creative Commons public licence text without a named version, recorded as custom.
