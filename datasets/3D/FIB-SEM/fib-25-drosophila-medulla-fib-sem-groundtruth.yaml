  sample:
    urls:
    - https://raw.githubusercontent.com/janelia-flyem/neuroproof_examples/master/training_sample2/grayscale_maps/iso.2600.png
    - https://raw.githubusercontent.com/janelia-flyem/neuroproof_examples/master/training_sample2/groundtruth.h5.gz
    size_bytes: 1294649
    description: First grayscale slice of training_sample2 and its ground-truth HDF5 (gzip-compressed
      file; the whole 250^3 label volume). The full raw volume is the 250 PNGs iso.2600-2849.png.
  arrays:
  - role: raw
    path_pattern: training_sample[12]/grayscale_maps/iso.*.png
    format: png
    axes: yx
    shape:
    - 250
    - 250
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 44
    - 213
    normalization: unknown
    alignment: not-applicable
    alignment_notes: One 8-bit grey PNG per z slice, 250 per sample; z order = file number (iso.2600-2849).
  - role: raw
    path_pattern: validation_sample/grayscale_maps/iso.*.png
    format: png
    axes: yx
    shape:
    - 520
    - 520
    shape_varies: false
    dtype: uint8
    compression: png
    normalization: unknown
    alignment: not-applicable
    alignment_notes: One 8-bit grey PNG per z slice, 520 slices; z order = file number (iso.03490-04009).
      Probed, not sampled.
  - role: label
    path_pattern: training_sample2/groundtruth.h5.gz (stack)
    format: hdf5
    axes: zyx
    shape:
    - 250
    - 250
    - 250
    shape_varies: false
    dtype: int32
    compression: none
    value_range:
    - 0
    - 21316
    encoding: instance-ids
    alignment: same-grid
    alignment_notes: Neuron ground truth for training_sample2/grayscale_maps (250 slices of 250x250, z,y,x
      per README). 'stack' holds 21,317 supervoxel IDs; 'transforms' (21317x2 int64) maps them to 526
      bodies, so body IDs = transforms applied to stack. File is gzip-wrapped (.h5.gz) and must be gunzipped
      first.
  - role: label
    path_pattern: validation_sample/groundtruth.h5.gz (stack)
    format: hdf5
    axes: zyx
    shape:
    - 520
    - 520
    - 520
    shape_varies: false
    dtype: int64
    compression: none
    encoding: instance-ids
    alignment: same-grid
    alignment_notes: Neuron ground truth for validation_sample/grayscale_maps (520 slices of 520x520).
      'transforms' is the identity (2084 bodies), so 'stack' values are body IDs. Also holds a 'synapse-annotations'
      dataset (not inspected). File is gzip-wrapped (.h5.gz).
  notes: 'size estimated (uncompressed): raw 500 x 250x250 uint8 + raw 520 x 520x520 uint8 + label 1 x
    250x250x250 int32 + label 1 x 520x520x520 int64 = 1,359,222,000 B (1.4 GB). Not counted: oversegmentations,
    boundary prediction, classifiers and results (non-PNG files total 193.2 MB compressed, from HTTP Content-Length).
    File list from a git tree of master (1035 files); exact sizes known only for the non-PNG files and
    294 PNGs, so no file-listing size. Sampled: one training_sample2 PNG (value_range from that slice
    only), training_sample2 groundtruth.h5 and oversegmented_stack_labels.h5, validation groundtruth.h5.
    All .h5 files are whole-file gzip (.h5.gz); datasets inside are uncompressed and unchunked, so they
    must be gunzipped before HDF5 reading. No single direct archive: GitHub archive zip returned 403 here;
    files are direct on raw.githubusercontent.com. Voxel size 10 nm isotropic from the three sample README.txt
    files.'
