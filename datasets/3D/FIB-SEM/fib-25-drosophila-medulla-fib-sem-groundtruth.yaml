schema_version: '1.2'
id: fib-25-drosophila-medulla-fib-sem-groundtruth
title: FlyEM FIB-25 Drosophila medulla FIB-SEM training and validation volumes with neuron ground truth
  (NeuroProof examples)
short_name: Drosophila medulla neuron segmentation (FIB-SEM)
description: Three small FIB-SEM subvolumes of the Drosophila optic-lobe medulla (training_sample1, training_sample2,
  validation_sample) distributed in the janelia-flyem/neuroproof_examples GitHub repository. Each comes
  with grayscale image maps; training_sample2 and validation_sample also have supervoxel over-segmentations
  and human ground-truth neuron segmentations as HDF5 (gzip-compressed). They come from the FIB-25 seven-column
  medulla data and are widely used for neuron-segmentation benchmarking (e.g. flood-filling networks).
