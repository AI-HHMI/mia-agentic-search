title: Chinese Hamster Ovary cell FIB-SEM volume with AI-generated masks and a manual first-slice annotation
short_name: CHO cells FIB-SEM with AI masks
description: A 1043-slice FIB-SEM image stack of a Chinese Hamster Ovary (CHO) cell line sample (9 nm pixels per EMPIAR, 90 Å),
  deposited with a folder of AI-generated segmentation masks (one PNG per slice) and one manual annotation of the first slice.
  From a study on AI-guided adaptive scanning for volume electron microscopy.
