notes: 'EMPIAR API/XML record and FTP listing: data/CHO-cells/frames (1043 TIFF slices, 1536 x 1324), mask (AI-generated segmentation, PNG per slice),
  labels (one manual PNG for the first slice; its slice index is 0000 and the stack starts at 0001). Pixel size 90.0 (EMPIAR units are
  angstrom, so 9 nm); slice thickness not stated in the EMPIAR record or the abstract. Instrument note: Thermo Scientific Auto Slice & View v5
  (Spin Mill). Paper (Microscopy and Microanalysis 2026) is not open access in Europe PMC, so only the abstract was read; mask classes (what
  region the AI mask targets) are not described in the entry. Mask values and alignment were not inspected. Differs from EMPIAR-12675 (rat brain,
  5 nm pixels, same study and same kind of deposit): this is a CHO cell-line sample. size_bytes is the EMPIAR-stated 1.3 GB (rounded). Organism taken from the cell-line name (CHO, Cricetulus griseus).'
