notes: 'EMPIAR API/XML record and FTP listing: data/CHO-cells/frames (1043 TIFF slices), mask (AI-generated segmentation,
  one PNG per slice), labels (one manual PNG of the first slice, named Slice-0000 while frames start at 0001). Pixel size
  90.0 Å in EMPIAR = 9 nm; slice thickness not stated. Paper (Microscopy and Microanalysis 2026) not open access, abstract
  only: the masks mark an AI-derived region of interest for adaptive scanning; mask classes are not named. Differs from
  EMPIAR-12675 (rat brain, 5 nm pixels, same study). size_bytes is the EMPIAR-stated 1.3 GB. Organism from the cell-line name
  (CHO). annotations.source mixed: mask/ = automatic (AI), labels/ = manual. coverage: mask/ covers every slice, labels/
  one slice. enricher: frames, masks and the manual label are all 1324 x 1534 px (probed), so masks pair 1:1 with frames.'
