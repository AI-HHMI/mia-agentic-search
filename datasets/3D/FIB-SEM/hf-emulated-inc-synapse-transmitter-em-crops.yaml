description: 49,704 small FIB-SEM cubes (40 x 40 x 40 voxels, 8 nm isotropic, uint8) cut around presynaptic T-bars of 4,142 neurons of the Drosophila melanogaster male central nervous system (12 crops per neuron), labelled per neuron with the neurotransmitter used (acetylcholine, GABA, glutamate or monoamine), cell type code and region. Intended for training neurotransmitter classifiers from EM.
