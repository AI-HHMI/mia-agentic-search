notes: 'Derived from the Janelia male CNS connectome v1.0 (EM, T-bars, cell types; catalogued as janelia-male-cns-v1-fib-sem-connectome) and the drosophila_neurotransmitters v1.1.0 transmitter ground truth (Zenodo 10.5281/zenodo.20818142; monoamines merged). A small-crop classification set, not the full volume. Crops are .npy arrays (not in the schema format list, so other). The card names a separate train.csv but the repo listing shows only train.tar, README.md and .gitattributes, so annotations are unverified. Labels are per neuron, not per voxel; ids are anonymised. No paper on the card; voxel size is from the card.'
