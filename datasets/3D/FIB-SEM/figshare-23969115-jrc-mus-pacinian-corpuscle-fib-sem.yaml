notes: 'Facts from the Figshare records of the segmentation (23969115) and EM volume (23969112) and the S3 zarr metadata. Acquired
  at 12 nm isotropic, 58.0 x 62.5 x 291.1 um; the S3 EM array is stored at 6 nm scale (48576 x 10496 x 9728 uint8) and the label array
