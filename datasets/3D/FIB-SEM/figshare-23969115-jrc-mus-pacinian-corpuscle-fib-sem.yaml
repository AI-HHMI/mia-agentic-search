description: Isotropic FIB-SEM volume (jrc_mus-pacinian-corpuscle, 58.0 x 62.5 x 291.1 um, acquired at 12 nm) of a Pacinian
  corpuscle from the fibular periosteum of a 16-week-old Plp1-EGFP mouse, with a manually proofread automatic segmentation
  as an OME-Zarr label array (labels/inference/Ab_RA, 12 nm). Ground-truth annotation and proofreading were done at Harvard
  Medical School for the mechanosensory end-organ reconstructions of Handler et al. The volume is hosted on the janelia-cosem-datasets
  S3 bucket (OpenOrganelle).
