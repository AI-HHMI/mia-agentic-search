notes: 'Facts from the Figshare records of the segmentation (23969115) and EM volume (23969112) and the S3 zarr metadata.
  Acquired at 12 nm isotropic, 58.0 x 62.5 x 291.1 um; the S3 EM array is stored at 6 nm scale (48576 x 10496 x 9728 uint8)
  and the label array at 12 nm (24288 x 5248 x 4864); size_bytes is the uncompressed EM + label s0 size, Figshare entries are link-only.
  The label array (Ab_RA) has no class names in its attributes and the Neuron paper full text was not reachable, so labelled
  structures and instance vs semantic are not confirmed; Source is proofread per Figshare. enricher: label sampled: binary
  0/1 mask (Ab_RA), annotation type other -> semantic-segmentation; voxel size kept at the Figshare-stated 12 nm although
  EM s0 is stored at a 6 nm scale.'
