notes: 'Figshare record of the EM volume, all 19 per-crop annotation records ("Manual organelle segmentations",
  crop333, 340-342, 353-358, 362, 366-370, 376, 387, 408) and the public S3 bucket were read. EM array
  recon-1/em/fibsem-uint8: uint8, (z,y,x) 53336 x 19466 x 26250 at 8 nm, 128^3 zstd chunks (about 426.7
  um along z; the Figshare data-dimension line says 42 um, which disagrees with the array). Crops 333,
  340-342, 368-370, 376 are 1.6 um cubes at 4 nm with 16 to 30 classes; crops 353, 354, 362, 366 (lipid
  droplets), 355, 356 (peroxisome and mitochondria), 357, 358, 367 (nucleus), 387, 408 (peroxisome) are
  single-class or two-class blocks of 6 to 48 um at 32 nm. No paper is cited beyond the CellMap challenge
  DOI and a 2017 eLife reference, so none was read. The catalog also holds jrc_mus-liver-zon-1 and the
  challenge aggregate; this is a different volume. enricher: size_bytes estimated from the array shapes
  (was null).'
