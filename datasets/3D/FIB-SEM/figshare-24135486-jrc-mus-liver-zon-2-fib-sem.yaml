short_name: Mouse liver acinus organelle crops (FIB-SEM)
description: Very large FIB-SEM volume of a mouse hepatic acinus (8 nm isotropic, 210 x 156 x 427 um) from the CellMap 2024 Segmentation
  Challenge, hosted as OME-Zarr on S3 / OpenOrganelle. Nineteen manually segmented ground-truth crops label either many organelle classes
  (8 crops of 1.6 um cubes at 4 nm, 16 to 30 classes) or single structures such as lipid droplets, peroxisomes, mitochondria and
  nuclei (11 crops at 32 nm), each published as its own Figshare item.
