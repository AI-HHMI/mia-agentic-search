notes: 'Voxel size varies per subset and is not recorded as a single value. Per the paper: ME2-Beta/Jurkat/Macro/Podo/Sperm
  16x16x16 nm FIB-SEM; ME2-Mossy/Pyra 8x8x30 nm ssSEM; ME2-Stem 8x8x30 nm SBF-SEM. License differs between sources:
  BioStudies states CC0, the Zenodo copy states CC-BY-4.0; the BioStudies (CC0) value is recorded, reviewer should
  confirm. Total size is the sum of the eight Zenodo zips; volume count not stated on the page. enricher: files
  listed from the Zenodo mirror 17635006 (8 zips, total equals size_bytes). Stem label sample holds 729 instance
  IDs although the auto-generated dataset.json lists background/mitochondria/boundary. organisms (BioStudies biosamples):
  Mus musculus = Dataset001_ME2-Beta, 004_ME2-Mossy, 005_ME2-Podo, 008_ME2-Stem; Homo sapiens = 002_ME2-Jurkat,
  003_ME2-Macro, 006_ME2-Pyra; Drosophila melanogaster = 007_ME2-Sperm.'
