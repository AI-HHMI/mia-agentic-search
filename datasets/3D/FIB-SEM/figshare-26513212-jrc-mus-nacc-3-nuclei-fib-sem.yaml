notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 4 x 4 x 3.8 nm (x, y, z), but the EM .zattrs (fibsem-int16) give 4 x 4 x 3.83 nm (x,
  y, z), used here. EM s0 is zyx 732 x 5250 x 5108 int16; label s0 is zyx 91 x 656 x 638 uint8 at 30.64 x 32 x 32 nm; label .zattrs
  declare instance_segmentation. The label array sits under labels/inference in the bucket but Figshare describes it as manual. Organism
  from the record title. The Figshare file is a link-only entry. enricher: size estimated from shapes (technical.notes); encoding from
  cellmap .zattrs (instance_segmentation, absent 0, unknown 255).'
