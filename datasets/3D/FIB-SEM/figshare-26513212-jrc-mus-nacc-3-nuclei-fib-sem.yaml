notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol),
  class nuclei only; the record gives the source EM voxel size as 4 x 4 x 3.8 nm (x, y, z), but the EM .zattrs (fibsem-int16)
  give 4 x 4 x 3.83 nm (x, y, z), used here. EM s0 is zyx 732 x 5250 x 5108 int16; label s0 is zyx 91 x 656 x 638
  uint8 at 30.64 x 32 x 32 nm; label .zattrs declare instance_segmentation. The label array sits under labels/inference
  in the bucket but Figshare describes it as manual. Total size not stated on the Figshare record or zarr metadata,
  left null; organism taken from the record title. The Figshare file is a link-only entry; the bioRxiv paper cited
  by sibling records (10.1101/2024.09.05.611438) could not be read (HTTP 429) and is not cited on this record.'
