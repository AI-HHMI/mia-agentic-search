notes: The Figshare record (CC BY 4.0) lists dense manual nucleus segmentations made in Amira (protocols.io
  Amira vEM protocol) and gives the source EM voxel size as 4.0 x 4.0 x 4.6 (X, Y, Z) nm. The bucket EM
  array is recon-1/em/fibsem-uint8; its label array nuc/s0 has shape 477 x 175 x 1000 (z y x) uint8 at
  72.96 x 64 x 64 nm. The label array lives under labels/inference in the bucket but is described as manual
  by the Figshare record. Only the nucleus class is annotated. No paper is cited on the Figshare record.
  Size not determined. The same EM volume is already in the catalog with organelle crops (jrc-sum159-1-cosem-fib-sem-organelles);
  this record is the separate nucleus annotation deposit.
