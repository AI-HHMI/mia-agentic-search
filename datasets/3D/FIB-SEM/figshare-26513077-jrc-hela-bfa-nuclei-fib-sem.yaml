notes: The Figshare record (CC BY 4.0) lists the annotation as dense manual nucleus segmentations made
  in Amira (protocols.io Amira vEM protocol), class nuclei only; it gives the source EM voxel size as
  8 x 8 x 8 (X, Y, Z), matching the EM .zattrs (s0 8 x 8 x 8 nm, 6 levels). EM s0 is zyx 6452 x 600 x
  8125 uint8; label s0 is zyx 806 x 75 x 1015 at 64 x 64 x 64 nm (z y x, 3 levels), per the .zarray and
  .zattrs. size_bytes is the uncompressed s0 size of both arrays (compressed chunks download smaller);
  the bucket was not listed. Organism is inferred from the sample description. The label array sits under
  labels/inference in the bucket but the Figshare record describes it as manual. No paper is listed on
  the Figshare record other than the protocol.
