notes: 'HTTP index (rounded sizes, about 11.0 GB, 2421 files): HeLaWT_Raw (993 slice TIFFs plus 6 segmentation TIFFs), HeLaSTARD3_WT_Raw (810) and HeLaSTARD3_FA_YA_Raw (600), each with ER, Endosomes, Mitochondria and matching _ROI segmentation TIFFs; EMPIAR lists 994 for HeLa/Ctrl (one slice difference vs the index). Paper Methods: voxel size 8 x 8 x 8 nm (HeLa/Ctrl), 5 x 5 x 10 nm (HeLa/STARD3), 8 x 8 x 8 nm (HeLa/STARD3 FYAA); different per volume so voxel_size_nm is null. Annotation: 7-10 sub-stacks per condition were segmented manually in Fiji Segmentation Editor, used to train DeepSCEM U-Nets, the models were applied to the full stacks, predictions curated in MIB and smoothed, and one ROI per volume was carefully curated in MIB (hence source mixed). EMPIAR page shows a CC0 badge. The paper describes preprocessing (detector merge, filtering, CLAHE, SIFT alignment) before segmentation; whether the deposited slices are the preprocessed ones is not stated.'
