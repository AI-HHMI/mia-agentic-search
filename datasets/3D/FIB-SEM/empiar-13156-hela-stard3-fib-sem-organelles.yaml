  notes: 'Listing: HTTP index of the EMPIAR https mirror (FTP timed out), 2421 files, rounded sizes summing to ~10.97
    GB; EMPIAR states 10.3 GB, so size_source is estimated. Probed headers: raw slice uint8 uncompressed 1092x2516
    (ImageJ calibration 1 px = 1 micron, an uncalibrated default, ignored); label stacks plain multi-page TIFF,
    uint8, LZW, 1092x2516 pages. Sampled (one sample each, HeLaSTARD3_FA_YA): raw slice image001 range 0-255 (saturated
    at 255); ER.tif, Endosomes_ROI.tif, Mitochondria_ROI.tif read as 600 pages, values {0,1}. ER_ROI, Endosomes
    and Mitochondria not sampled (header only, encoding unknown). Label page axis is z: EMPIAR describes them as
    segmentations of the reconstructed volume with ROIs in X x Y x Z, and the page count equals the raw slice count.
    Voxel size differs per volume (EMPIAR pixel_width 80 A = 8 nm for HeLa/Ctrl and HeLa/STARD3 FA/YA, 50 A = 5
    nm for HeLa/STARD3; paper Methods z 8, 10, 8 nm), so voxel_size_nm stays null. No single archive: data.download_url
    is the https folder; direct per-file URLs are in the listing (also Globus/Aspera via EMPIAR).'
