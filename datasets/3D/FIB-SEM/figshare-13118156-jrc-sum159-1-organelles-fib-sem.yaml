notes: 'Figshare page states "Included in Dataset: manual annotations", EM and segmentation voxel size 4.0 nm, license
  CC BY 4.0, EM data DOI 10.25378/janelia.13114352. N5 metadata on the bucket: EM em/fibsem-uint16 s0 is 16000 x 2800 x 7632
  (x, y, z) uint16 gzip with pixelResolution 4.0 x 4.0 x 4.56 nm, so z spacing differs from the stated 4.0 nm; labels/gt s0
  is 32000 x 5600 x 15264 uint64 at 2.0 x 2.0 x 2.28 nm with 11 subvolumes typed training. Full size not confirmed.
  The Nature paper is not open access and the bioRxiv preprint returned HTTP 429 in this run, so only the abstract
  was read (annotations up to 35 organelle classes, 4 nm FIB-SEM); per-class list for this volume not verified.
  Sibling OpenOrganelle volumes in the catalog carry machine segmentations; this one carries the manual ground truth.'
