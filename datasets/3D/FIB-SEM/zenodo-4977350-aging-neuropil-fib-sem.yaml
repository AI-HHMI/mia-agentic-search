notes: 'Six zips (Mouse 1-6), each one FIB-SEM stack of single-slice TIFFs plus one .blend reconstruction
  (axons, dendrites, PSDs, mitochondria). Mice 1, 3, 6 are 4 months, 2, 4, 5 are 24 months (README). Labels
  are meshes, not label volumes. enricher: coverage dense (was partial): per paper Methods/Fig 4 the released
  stacks are the 5x5x5 um sub-cubes in which all axons, dendrites and synapses were reconstructed (readmes:
  size 5x5x5 um). enricher: source mixed (was manual): axons/dendrites segmented in Ilastik, synapses
  in TrakEM2 (paper). Voxel size differs per subset (TIFF ImageJ headers, consistent with the 5 um extent):
  Mouse 1-2 6x6 nm, Mouse 3-6 5x5 nm; z not stated anywhere checked; left null. Size is the sum of the
  6 zips plus README (file listing).'
