notes: 'Each of six zips (Mouse 1-6) holds one .blend reconstruction plus a FIB-SEM TIFF stack (~280 sections in Mouse 1). Reconstructions are meshes, not label volumes; the paper says dense reconstructions were made in 5x5x5 um sub-cubes and synapses annotated across the full volumes, so coverage is partial. Voxel size is not stated in the Zenodo record, the paper Methods (volumes 660-1520 um3, 10 us dwell) or the zip listing (a per-mouse size readme is mentioned but was not found in Mouse 1.zip); left null. Size is the sum of the 6 zip sizes.'
