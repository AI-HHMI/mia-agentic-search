notes: 'No license is stated on the BioStudies record or in the paper, so license is unknown. 34 cell
  volumes (cellN.tif: oceanica 5 nM 8, oceanica 100 nM 11, pseudonana 5 nM 8, pseudonana 100 nM 7). Segmentation
  manual or semi-automatic in 3D Slicer 5.2.2, hence source mixed. enricher: voxel size conflict, kept
  null: the paper (Angulo et al. 2026, ISME Commun., Methods) says FIB-SEM at isotropic 6 nm, binned two-fold
  to "a final isotropic voxel size of 12 nm" and "true voxel size (12 nm)", while the BioStudies annotation
  text says "true voxel size (16 nm)"; file headers carry none (NRRD spacing 1). Paper added. size_bytes
  = sum of the four BioStudies file lists (exact, 244 files). Some .seg.nrrd files hold extra work-in-progress
  segments (e.g. "mito_test", "chloro_test"). organisms: Thalassiosira oceanica = Thalassiossira_oceanica_5nM/,
  Thalassiossira_oceanica_100nM/; Thalassiosira pseudonana = Thalassiossira_pseudonana_5nM/, Thalassiossira_pseudonana_100nM/.'
