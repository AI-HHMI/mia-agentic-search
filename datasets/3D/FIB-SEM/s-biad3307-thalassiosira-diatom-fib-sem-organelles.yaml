notes: 'No license is stated on the BioStudies record, so license is unknown. The record lists no publication, so no paper could be read; the study title is the only citation. Cell volume count (34) comes from counting cellN.tif entries in the four file lists (oceanica 5 nM 8, oceanica 100 nM 11, pseudonana 5 nM 8, pseudonana 100 nM 7) and may include stray entries. Segmentation text on the record: voxels classified manually or semi-automatically in 3D Slicer 5.2.2, corrected to a true voxel size of 16 nm, hence source mixed; whether the voxels are isotropic is not stated, so voxel_size_nm is null. Instrument, sample preparation and acquisition fields are empty on the record. Size was not summed (one cell volume HEAD request showed 13 MB).'
