notes: 'Masks are labelled only as AI-generated segmentation of an ROI in the EMPIAR record; which structures or classes
  they delineate was not inspected. The cited Methods in Cell Biology chapter describes sample preparation only (not open
  access, full text not read; abstract only), so voxel size z, and the exact relationship between the dataset and the
  chapter, were not confirmed. A second, unpublished manuscript (Contextual High-throughput 3D Volume Electron
  Microscopy Data Acquisition Using Artificial Intelligence) is also cited. Pixel size is 6 nm (high-resolution ROI)
  and 500 nm (low-resolution); slice spacing is not stated. Total size 666 GB from the HTTP index (rounded). Same group and
  layout as EMPIAR-12661 (Trypanosoma cruzi).'
