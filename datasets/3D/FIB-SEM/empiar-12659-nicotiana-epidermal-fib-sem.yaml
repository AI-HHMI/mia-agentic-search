title: FIB-SEM Nicotiana benthamiana epidermal cell
short_name: Nicotiana epidermal cell masks (FIB-SEM)
description: A 6,113-slice FIB-SEM volume of a Nicotiana benthamiana epidermal cell stored as a 50 nm
  low-resolution series and a 6 nm high-resolution ROI series (6 nm slices) (plus aligned merged images),
  with AI-generated segmentation masks of the ROI and 5 manual ROI annotations on low-resolution slices.
  Deposited as a demonstration of AI-driven contextual volume EM acquisition.
