notes: 'Main paper: Hurnik Konecna et al., Contextual High-Throughput 3D vEM Data Acquisition Using AI
  (Microsc. Microanal. 2026, doi 10.1093/mam/ozag014; preprint 10.1101/2025.05.15.654255); the Methods
  in Cell Biology chapter is the sample-prep protocol. Mask/ holds the AI masks that set where each slice
  was scanned at high resolution (ROI: plant cell wall and cytoplasm, paper Fig. legend); Annotation/
  holds the manual ROI annotations (first slice plus the 4 re-annotations at slices 508, 1198, 2702, 2805,
  paper). enricher: voxel size 6x6x6 nm from the preprint (figure legends "10211x3928, Voxel size 6x6x6
  nm"; Supp. Table 2: slice 6 nm, AS pixel 6x6, regular scan 50x50) and the AlignedAmira .info (pixelsize
  6 6, z step 6); was 6x6xnull. Low-res is 50x50x6 nm (EMPIAR 500, in Angstrom); description fixed.'
