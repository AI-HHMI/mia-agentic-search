notes: 'Link-only figshare record (CC BY 4.0); data on S3. Nuclei labels made with Cellpose 2.0 with minimal
  manual corrections. EM and labels are in the same zarr: recon-1/em/fibsem-uint8 s0 [14381, 14130, 18284]
  uint8 at 8 nm; label s0 [898, 883, 1142] uint16 at 128 nm (zarr metadata; the figshare text agrees).
  EM source DOI 10.25378/janelia.23411843. The cited paper (bioRxiv 10.1101/2024.09.05.611438, full text
  read) covers P7 mouse pancreas and the Cellpose nuclei protocol. Different volume from the catalogued
  jrc_mus-pancreas-3. Total size not stated, not summed. enricher: source proofread (was mixed; Cellpose
  + manual corrections). enricher: n5 added (EM also as .n5 in the bucket).'
