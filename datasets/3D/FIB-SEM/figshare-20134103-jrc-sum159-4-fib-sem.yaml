notes: 'Figshare record of the EM volume, the 18 per-crop annotation records ("Manual organelle segmentations", e.g. crop186, crop211, crop219) and
  the public S3 bucket were read. EM array recon-1/em/fibsem-uint8: uint8, (z,y,x) 5975 x 1062 x 11875, 8 nm, zstd 64^3 chunks. Crops:
  crop186-189, 201-203, 206, 208-210, 212, 213, 216-219 are 1.6 um cubes annotated at 4 nm with 17 to 40 classes each (crop-dependent mixes of
  mitochondria, ER, endosomes, vesicles, lysosomes, lipid droplets, nucleus/chromatin, microtubules, cell, ecs); crop211 is 6.4 um at 8 nm with
  nucleus and mitochondria only. Annotators: CellMap team (Amira workflow per Figshare titles). No paper is cited beyond the CellMap challenge DOI
  and a 2017 eLife reference (Xu et al.), so none was read. The catalog also holds the CellMap 2024 challenge as an aggregate record and
  jrc_sum159-1; this is a different volume. Total size not stated.'
