title: Near-isotropic, reconstructed volume electron microscopy (FIB-SEM) of immortalized breast cancer cell (jrc_sum159-4)
short_name: SUM-159 cell organelle crops (FIB-SEM)
description: FIB-SEM volume of a wild-type SUM-159 breast cancer cell (8 nm isotropic, 95 x 8.5 x 47.8 um) from the CellMap 2024
  Segmentation Challenge, hosted as OME-Zarr on S3 / OpenOrganelle. Eighteen manually segmented ground-truth crops (crop186-189,
  201-203, 206, 208-213, 216-219; mostly 1.6 um cubes at 4 nm) label up to 40+ cell-structure classes such as mitochondria, ER, endosomes,
  lysosomes, lipid droplets, nucleus, chromatin and microtubules, each published as its own Figshare item.
