title: High resolution 3D imaging of liver subcellular architecture and its link to metabolic function
short_name: Mouse liver organelles (FIB-SEM)
description: Four enhanced FIB-SEM volumes of mouse liver (lean, two obese, obese Climp63) at 8 nm isotropic voxels, each
  with per-class organelle segmentation stacks (ER, ER sheets, ER tubules, mitochondria, lipid droplets, cell and nuclear
  membrane), plus a down-sampled evaluation set with raw data, manual annotation and predictions.
