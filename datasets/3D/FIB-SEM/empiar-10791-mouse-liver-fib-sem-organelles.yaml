notes: 'EMPIAR API: volumes 6461 (lean, 12000x8000x5638), 6464 (obese1, 9112x10200x7896), 9430 (obese2, 8000x8050x8501)
  and 1857 (obese Climp63, 9700x9650x3629), 8 nm isotropic, 8-bit TIFF; entry is 2.8 TB. Segmentations are deep-learning
  predictions per class (the Climp63 volume has no nuclear membrane class); the evaluation set (25 TIFF stacks,
  down-sampled) has manual annotations on small test volumes. The paper is not open access, only its abstract was
  read, so sample details beyond lean/obese mice are not confirmed. File listing was not browsed, so annotations_verified
  is false. size_bytes left null (only the rounded 2.8 TB total is given). enricher: file listing, headers and one
  raw/label slice pair checked; annotations_verified true (segmentation zips seen and sampled); confidence 0.7 ->
  0.75.'
