description: 14 densely annotated 400x400x400-voxel isotropic (8 nm) FIB-SEM volumes of Megaphragma viggianii
  (microwasp) brains from three specimens with presynapse and postsynapse point annotations and their
  one-to-many connectivity; 5 labeled volumes for training and 9 test volumes for out-of-domain evaluation
  (WASPSYN challenge).
