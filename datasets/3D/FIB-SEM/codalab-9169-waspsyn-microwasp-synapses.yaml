notes: 'Data are served from the Codalab competition page, which requires logging in; the page content
  that lists the files and terms was not visible without login, so annotations_verified is false and no
  file listing or size was read. Voxel size, 14 volumes (3 + 3 + 8 chunks of 400^3 voxels), 5 train /
  9 test split, point annotations and CATMAID / NeuTu annotation tools come from the arXiv preprint; the
  CC-BY release after the challenge and the Codalab hosting come from the arXiv and PMC pages (license
  is stated only as "CC-BY license" with no version, so spdx is "custom"). The arXiv changelog says training
  and test data were released in H5 format (2023-01-31). The 9 test volumes are unlabeled on the platform
  (evaluation by submission), so only 5 labeled volumes are directly usable for training. enricher: the
  Codalab page now renders without login; its Terms say academic use only, commercial use prohibited (alongside
  "CC-BY"). Downloads still need login.'
