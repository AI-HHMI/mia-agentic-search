notes: 'S3 listing: jrc_mus-heart-6.zarr/recon-1/labels/groundtruth has 4 cropN groups (crop1145, crop1146,
  crop1147, crop1148); em/fibsem-uint16 s0 is uint16, shape 16348 x 13476 x 14081 (z, y, x) with 8 nm
  scale in its Zarr v3 / OME-Zarr 0.5 metadata. size_bytes = uncompressed raw s0 voxels x 2 bytes (crops
  add little). crop1145 lists 45 class names in its zarr.json; the other crops were not opened, so classes
  present per crop may differ. The bucket README says groundtruth blocks are labelled voxel-by-voxel by
  a human annotator; CC-BY-4.0 is stated for the collection on the AWS registry page. Species and tissue
  are inferred from the dataset name; sample prep, annotators and per-crop provenance are not documented
  in the sources read, and no paper specific to this volume was found (the COSEM/CellMap publications
  describe other volumes). Separate volume from the other jrc_* CellMap records; own crops. Train/val
  split undocumented.'
