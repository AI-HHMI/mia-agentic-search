notes: 'S3 listing: jrc_mus-liver-8.zarr/recon-1/labels/groundtruth has 10 cropN groups (crop1071-1075,
  crop1123-1127); em/fibsem-uint16 s0 is uint16, shape 6217 x 10257 x 16582 (z, y, x) with 8 nm scale
  in its Zarr v3 / OME-Zarr 0.5 metadata (sharded, 1024^3 chunks). size_bytes = uncompressed raw s0 voxels
  x 2 bytes (crops add about 0.2 GB per array). crop1071 lists 55 class names in its zarr.json; the other
  crops were not opened, so classes present per crop may differ. The bucket README says groundtruth blocks
  are labelled voxel-by-voxel by a human annotator; CC-BY-4.0 is stated for the collection on the AWS
  registry page. Species and tissue are inferred from the dataset name; sample prep, annotators and per-crop
  provenance are not documented in the sources read, and no paper specific to this volume was found (the
  COSEM/CellMap publications describe other volumes). Separate volume from the sibling jrc_mus-liver record;
  own crops. Train/val split undocumented.'
