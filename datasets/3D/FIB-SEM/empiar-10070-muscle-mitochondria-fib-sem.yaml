notes: 'One volume (b3talongmusc20130301.mrc, 777 MB, 291 slices). Annotations are STL surface meshes
  of selected structures for the paper figures (not dense labels). License CC0 from the EMPIAR page badge.
  enricher: voxel size 15x15x15 nm from paper Methods (PMC6988728) and MRC header (was 50x50x15: EMPIAR
  pixelWidth is in Angstrom). enricher: annotations.source mixed per paper Methods: whole-image segmentation
  by median filter + manually set thresholds and ImageJ outlier removal; individual mitochondria manually
  traced in TrakEM2 by two observers. Which STL came from which method is not stated (AutoMinusMito.stl
  suggests the thresholded one). enricher: the STL meshes are not voxel labels; their alignment to the
  MRC grid is not stated.'
