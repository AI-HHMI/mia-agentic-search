notes: 'Single-volume dataset. Size stated as 14.5 GB on EMPIAR. Voxel size 8 nm isotropic from the paper Methods.
  Segmentation is manual (MIB / Amira with interpolation) per the paper. Licence CC0 from the EMPIAR page. enricher:
  .hff is HDF5 (EMDB-SFF); tar.gz holds STL meshes. enricher: organism Ensiculifera tyrrhenica from paper Results
  (was empty; NCBI taxid 66473). coverage: one whole cell; a subset of organelles segmented (13 SFF segments; 16
  MoBIE masks). EMPIAR labels are surface meshes only; voxel masks (binary, 16 nm) are in the MoBIE project on s3.embl.de.'
