notes: 'Single-volume dataset (n_items 1). Size stated as 14.5 GB on EMPIAR; not summed from the listing.
  Voxel size 8 nm isotropic is from the paper Methods; the TIFF header has no calibration (2718x2718 uint8
  per slice, uncompressed). The dinoflagellate is not identified to species in the pages checked, so organism
  is left empty. Segmentation is manual (MIB / Amira with interpolation) per the paper, but the annotation
  files are in Amira .hff format and a .tar.gz, neither of which was opened (tar.gz contents unlisted);
  the set of segmented classes is only partly known from the paper text. Licence CC0 from the EMPIAR page.'
