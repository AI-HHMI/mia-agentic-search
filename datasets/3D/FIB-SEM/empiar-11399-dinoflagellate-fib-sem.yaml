  notes: 'HTTP index (FTP timed out): FIBSEM/ 1,937 TIFF slices amst_crop_0101-2037 (~14.2 GB) and segmentation/
    2 files (~1.3 GB); ~15.5 GB rounded vs 14.5 GB stated on EMPIAR, so size_bytes stays null. probe.py: amst_crop_0101.tif
    2718x2718 uint8, uncompressed, no calibration. sample.py on amst_crop_1000.tif: uint8 [0, 255], mean 54.5, std
    63.1, p50 49, p99 251, saturated at 0 (hint: possibly contrast-stretched, not confirmed). The .hff header (probe.py,
    7 MB) is HDF5 with EMDB-SFF global_external_references; a deeper walk of its groups timed out. First 16 MB of
    individual_segments.tar.gz decompressed to one member header, 01-Chloroplast.stl (227.9 MB), so per-segment
    labels are surface meshes. Voxel masks were not observed, so label encoding, classes and alignment stay unknown.
    Values are from one slice. Second pass: .hff walked (custom h5py script, 16 MB read): primary_descriptor mesh_list,
    13 mesh segments, no lattice. MoBIE S3 (paper): raw N5 photosynthetic_dinoflagellate.n5 [1937,2718,2718] uint8
    8 nm, and 14 binary organelle N5 masks at 16 nm (Chloroplast [969,1359,1359]). s3.embl.de is not on the TensorSwitch
    allowlist; the N5 masks are not in sample.urls because they need their own 16 nm voxel size.'
