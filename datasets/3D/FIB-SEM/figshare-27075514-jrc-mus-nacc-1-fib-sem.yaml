notes: 'Read the Figshare records of the volume (27075514) and the annotation (24246661, crop115) and
  the S3 EM .zarray (zyx [563, 2442, 2361], uint8) and crop .zattrs. size_bytes is the uncompressed EM
  size from that shape (Figshare entries are link-only; data are chunked stores on S3). Annotated voxel
  size 2 x 2 x 2 nm, annotated region 1.2 x 1.2 x 1.2 um at offset 6399 x 7999 x -1 nm (crop115 Figshare
  record).  Manual segmentation in Amira 3D 2021.1 (CellMap protocol). The listed 2021 Nature atlas paper
  is not open access; only its abstract was read. enricher: crop115 holds an "all" array (class IDs) plus
  69 per-class arrays (S3 listing).'
