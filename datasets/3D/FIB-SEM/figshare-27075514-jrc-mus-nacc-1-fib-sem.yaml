description: FIB-SEM volume jrc_mus-nacc-1 (nucleus accumbens, 4 nm isotropic, 9.44 x 9.77 x 2.25 um)
  from the CellMap 2024 Segmentation Challenge, hosted as OME-Zarr on the janelia-cosem-datasets S3 bucket
  (OpenOrganelle), with one manually segmented crop (crop115, 1.2 um cube at 2 nm) with about 21 annotated
  classes including extracellular space, plasma membrane, mitochondria (membrane, lumen, ribosomes), endoplasmic
  reticulum, endosomes, vesicles, microtubules, cytosol and cell as OME-Zarr label arrays.
