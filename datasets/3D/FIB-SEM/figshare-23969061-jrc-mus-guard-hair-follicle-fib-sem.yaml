short_name: Mouse guard hair follicle segmentation (FIB-SEM)
description: Isotropic FIB-SEM volume jrc_mus-guard-hair-follicle (88.1 x 95.9 x 77.6 um, 6 nm voxels) of a guard hair follicle from the back of a 3-week-old C57BL/6J mouse, with manually proofread automatic segmentations of the follicle's sensory axons, Schwann cells and nuclei as OME-Zarr label arrays. Ground-truth annotation and proofreading were done at Harvard Medical School for the mechanosensory end-organ reconstructions of Handler et al. The volume is hosted on the janelia-cosem-datasets S3 bucket (OpenOrganelle).
