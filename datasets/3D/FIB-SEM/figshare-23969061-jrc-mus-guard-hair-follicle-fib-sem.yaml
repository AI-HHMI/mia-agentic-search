notes: 'Facts from the Figshare records of the segmentation (23969061) and EM volume (23969052) and the S3 zarr metadata. EM array fibsem-uint8 is zyx 12992 x 16000 x 14720 uint8 at 6 nm, matching the stated 88.1 x 95.9 x 77.6 um. Label arrays: seven 6 nm uint8 arrays (Ab_RA, Ab_field, Ad_circ, CSC, Small_lan, cTSC, lTSC) with no class names in their metadata (not sampled, so binary vs instance is unconfirmed) and nuc at 96 nm uint16, tagged instance_segmentation in its metadata. The Neuron paper (not open access, full text unavailable) is not read, so what each acronym denotes is unconfirmed. size_bytes is the uncompressed s0 estimate of the EM plus seven 6 nm label arrays; the Figshare entry is link-only. Part of the same Handler et al. series as the catalogued Pacinian corpuscle volume; this is a different sample.'
