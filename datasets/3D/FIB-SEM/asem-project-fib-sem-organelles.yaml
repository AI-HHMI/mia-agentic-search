notes: 'Bucket s3://asem-project/datasets/ lists 34 numbered cell folders (e.g. 1A, 46, 100) plus example_cell.zarr;
  1A contains a .zarr and a _tiff folder. Per-cell label files, total size and counts were not enumerated (zarr
  trees are very large). Paper: nominal 5 or 10 nm isotropic voxels for the Kirchhausen cells and 4 x 4 x 3-5 nm
  for COSEM/OpenOrganelle cells used for comparison; exact per-cell voxel size not checked, so voxel_size_nm is
  null. Which cell types are in which bucket folder and whether OpenOrganelle COSEM volumes are among the folders were not
  verified. Annotations are manual or semi-automated (ilastik carving, VAST) in small subvolumes of 2-80 um3.
  Licence CC BY-SA 4.0 as stated on the registry page. Registry page lists no DOI for the dataset itself.'
