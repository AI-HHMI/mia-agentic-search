notes: 'Derived collection: the pretraining volumes are re-packaged OpenOrganelle FIB-SEM datasets (original
  OpenOrganelle licenses/DOIs are listed per dataset in the metadata sheet); the MIT license is the Hugging
  Face card license and the data licence of the underlying OpenOrganelle volumes is not restated by the
  authors. Hosted on Hugging Face (~2.96 GB membrane attention maps rar, four downstream rar archives
  of 0.16-0.57 GB, metadata xlsx saved as .csv) and Google Drive (full pretraining set, not fetched).
  Contents of the rar archives could not be listed (peek_archive handles zip only), so file formats (tiff
  per the README) and label layout are unverified. Metadata sheet: 40 source datasets, resolution 4/6/8
  nm per dataset (voxel_size_nm left null since it varies), 24 mouse, 13 human, 3 monkey (monkey species
  not named). The paper (IEEE TMI) is not open access; abstract read via Europe PMC, details from the
  GitHub README. Possible overlap with OpenOrganelle records in this catalog.'
