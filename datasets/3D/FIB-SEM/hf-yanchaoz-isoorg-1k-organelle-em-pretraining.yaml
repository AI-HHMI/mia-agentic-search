  notes: 'Listing: HF tree (tools/listing.py) 8 files, 4,427,874,342 B exact, but the 928 pretraining
    volumes are only in a Google Drive folder (volumes/, not listable or fetchable), so the listing is
    incomplete and the size unknown. RAR members listed by walking RAR5 headers with range requests (custom
    script, ~560 KB read, no decompression): CMCT 48 files, CMCC 60, ASEM-ER 4, BetaSeg 8 (all .tif),
    MAMs first 15 of ~928 members. Members are RAR-compressed, so TIFF headers (shape, dtype, axes) cannot
    be read without extracting; no extractor available and TensorSwitch cannot read rar, so sample is
    null. Voxel size not set: metadata sheet gives 4, 6 or 8 nm per source dataset (varies); downstream
    sets inherit their sources. README: inputs normalised by /255.'
