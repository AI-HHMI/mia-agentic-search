short_name: IsoOrg-1K organelle volume EM (FIB-SEM)
description: 'OrgMIM release for IEEE TMI 2026: IsoOrg-1K, 928 organelle-centric isotropic FIB-SEM volumes
  (>120 billion voxels) collected from OpenOrganelle (40 source datasets listed in a metadata sheet: cultured
  cells and tissues, 4-8 nm resolution, human, mouse and monkey) for self-supervised pretraining, plus
  precomputed membrane attention maps and four processed downstream organelle-segmentation datasets (ASEM-ER,
  BetaSeg, CMCC, CMCT). The Hugging Face repository holds the membrane maps, downstream sets and the metadata
  sheet; the full pretraining volumes are on a Google Drive folder linked from the GitHub README.'
