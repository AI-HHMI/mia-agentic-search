notes: 'Figshare (CC BY 4.0, refined automatic): Nuclei segmentations in jrc_mus-kidney-3 using Cellpose
  2.0 with minimal manual corrections. Classes annotated: Nucleus. EM s0 (fibsem-uint8) is zyx [20384,
  15098, 17920] uint8 at 8 x 8 x 8 nm (z y x), 14 levels; label s0 is zyx [1274, 943, 1120] uint16 (blosc)
  at 128 x 128 x 128 nm (z y x). Link-only Figshare entry to the S3 prefix. size_bytes = uncompressed
  s0 EM + label. Organism from title. Differs from figshare-24020799-jrc-mus-kidney-3-fib-sem (same EM
  volume, one manual crop472): this deposit holds whole-volume nucleus labels. Label .zattrs declare no
  type; instance-segmentation inferred from Cellpose uint16 output. Paper 10.1101/2024.09.05.611438 (P7
  series, full text read) is not in Figshare references. enricher: annotations.source proofread (Cellpose
  2.0 output with minimal manual corrections; was mixed).'
