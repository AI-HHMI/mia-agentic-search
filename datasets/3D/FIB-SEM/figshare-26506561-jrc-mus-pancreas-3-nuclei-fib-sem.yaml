notes: "Figshare record (CC BY 4.0, refined automatic segmentation): Nuclei segmentations in jrc_mus-pancreas-3 using Cellpose 3.0.9 with cursory manual corrections.. Classes annotated: Nucleus. EM voxel size 4.0 x 4.0 x 4.0 (X, Y, Z) nm (matches the EM .zattrs), EM s0 is zyx [2060, 4920, 4800] <u2 (|u1 = uint8); label s0 is zyx [128, 307, 300] |u1 at 64 x 64 x 64 nm in the label .zattrs' + (f' (the Figshare description says 128 x 128 x 128 (x, y, z) nm; the zarr metadata is used)' if mismatch else '') + f'; label .zattrs declare instance_segmentation. Size is the uncompressed EM s0 voxel count, not a stored size. The Figshare record is a link-only entry (data on S3 via s3://janelia-cosem-datasets/jrc_mus-pancreas-3/jrc_mus-pancreas-3.zarr/recon-1/labels/inference/segmentations/nuc/). Organism from the record title. Sample source: Janelia CellMap data release paper 10.1101/2024.09.05.611438 (listed in the Figshare references; the paper text read via Europe PMC/bioRxiv)."
