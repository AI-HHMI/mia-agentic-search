description: Demo FIB-SEM data from the Nature Protocols pipeline for organelle segmentation in pancreatic beta
  cells - a raw 16 nm isotropic FIB-SEM stack of a mouse pancreatic cell (high_c1) with segmentation masks (nucleus,
  mitochondria, membrane, insulin granules, Golgi, centrioles, microtubules) and small volumetric training sets
  for Golgi and secretory granule segmentation.
