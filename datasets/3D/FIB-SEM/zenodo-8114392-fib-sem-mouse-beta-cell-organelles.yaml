      \ *_All_MTs_annotation.xml   8 files 390.8 MB\ndata_golgi.zip/data_golgi/{train,val}/{images,masks}/*.tif\
      \      8+8 train, 1+1 val\ndata_granules.zip/data_granules/{train,val}/{images,masks}/*.tif 4+4 train, 1+1\
      \ val\nmycell.n5.zip/mycell.n5/  N5 container (analysis/... distance maps etc.), 38,038 files 23.9 GB uncompressed\n"
    n_files: 5
    listing_complete: true
