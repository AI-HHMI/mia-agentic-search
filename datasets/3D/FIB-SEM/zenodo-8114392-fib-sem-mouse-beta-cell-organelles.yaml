notes: 'Demo data of the Nature Protocols paper (full text not open access; the arXiv preprint was read). n_items
  = 1 raw volume (high_c1_source.tif, 16 nm isotropic after binning from 4 nm, per the preprint and Zenodo page);
  additional training crops: data_golgi (8 train + 1 val image/mask pairs) and data_granules (4 train + 1 val pairs).
  size_bytes is the sum of all five Zenodo files, of which mycell.n5.zip (8.2 GB) is the input for the spatial-analysis
  demo. Raw full-resolution (4 nm) volumes are hosted on OpenOrganelle, not on this record. Organism taken from
  the Zenodo description ("mouse pancreatic cell"); the sample preparation details are in the cited original beta
  cell studies and were not read. Masks were produced with ilastik autocontext and deep learning plus manual correction
  per the preprint, so annotation source is "mixed".

  enricher: the top-level high_c1_source.tif file is a zip archive holding one member high_c1_source.tif (359 MB).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "high_c1_source.tif   (actually a zip: high_c1_source.tif, 359 MB)\nhigh_c1.zip/high_c1/  high_c1_source.tif,\
