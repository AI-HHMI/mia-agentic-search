  notes: 'EMPIAR HTTP index listing (50 files, rounded sizes). Raw overviews are ImageJ zyx TIFFs with calibration
    6.5104/6.5104/10 nm (Set1-3) and 16/16/20 nm (Set4); test ROI 3.2552/3.2552/10 nm. Organelle label TIFFs are
    plain multi-page LZW TIFFs written by MIB; their ImageJ description states slices=725/858/618 (unit nm, spacing
    10), so pages are z; tools/sample.py read 724 pages for Set1, equal to the raw. Sampled (205 MB): Set4 raw 18-191,
    Set4 mask {0,255}, Set1 labels 0-10 (all 11 values present). Raw values are inverted BSE signal per EMPIAR (test
    ROI), normalization otherwise unknown. Membrane prediction (float32), CLAHE copies, test-ROI model outputs and
    duplicate folders are not listed as arrays. No single archive: files are direct under the EMPIAR https tree.'
