notes: 'Voxel sizes differ by stack (EMPIAR API and TIFF headers agree): HeLa overviews Set1-3 6.5104 x 6.5104 x
  10 nm, test ROI 3.2552 x 3.2552 x 10 nm, muscle Set4 16 x 16 x 20 nm; voxel_size_nm is null for that reason (enricher:
  was 6.5104/6.5104/10). organisms: Homo sapiens = Set1-3 and DATASET1_TEST_ROI; Mus musculus = Set4 / DATASET4_Muscle
  / data/Dataset4_*. annotations.source mixed: organelle classes from manual MIB classification, classifier outputs
  and human-in-the-loop steps (paper Methods); Set4 mito mask and test-ROI U-Net classifications are model outputs.
  coverage: Set1-3 organelle labels span the full overview volumes, Set4 has a binary mitochondria mask only. Size
  32.8 GB as stated by EMPIAR; n_items counts 4 overview stacks and the test ROI. DATASET1_Overview/ and DATASET4_Muscle/
  repeat files of Set1/Set4.'
