notes: 'Pixel sizes differ by stack: 6.5104 nm for the three HeLa overviews (10 nm slices; recorded here),
  3.2552 nm for the test ROI (10 nm slices) and 16 nm / 20 nm slices for the muscle dataset. Labels were
  made by a mix of manual classification in MIB (Golgi etc.), classifier outputs and human-in-the-loop
  steps (paper Methods), so the source is mixed; the TIFF label files are named in the EMPIAR API record
  but the file listing was not opened, so annotations_verified is false. The download URL is the EMPIAR entry page (file URLs not checked). Size 32.8 GB as stated
  by EMPIAR; n_items counts 4 overview stacks and the test ROI.'
