title: Source data for AI-directed voxel extraction and volume EM identify intrusions as sites of mitochondrial contact
short_name: HeLa and muscle FIB-SEM organelle class labels
description: 'FIB-SEM source data for the AIVE (AI-directed voxel extraction) paper: three half-scale overview
  FIB-SEM stacks of HeLa cells (6.51 nm pixels, 10 nm slices; 724, 858 and 618 slices), each with a TIFF
  volume of organelle class labels (mitochondria, lipid droplets, early/late endosomes, Golgi, nucleus,
  cytoskeleton, ER, plasma membrane, vesicles) and random-forest membrane probability maps, plus a mouse
  tibialis anterior muscle stack (16 nm pixels, 20 nm slices) with a mitochondrial class volume, and a
  cropped HeLa test ROI (3.26 nm pixels, 121 slices) with membrane predictions of six classifiers and
  human vs U-Net mitochondria classifications.'
