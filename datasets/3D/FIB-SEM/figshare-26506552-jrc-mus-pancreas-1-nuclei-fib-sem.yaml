notes: 'Link-only figshare record (CC BY 4.0); data on S3. Nuclei labels made with Cellpose 3.0.9 plus
  cursory manual corrections. The zarr''s recon-1/em/ is empty: EM exists only as jrc_mus-pancreas-1.n5/em/fibsem-uint16
