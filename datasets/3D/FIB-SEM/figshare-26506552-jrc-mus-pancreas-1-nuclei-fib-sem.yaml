  nm zyx, shape [457, 313, 469] uint16). Figshare text says labels are 128 nm; zarr metadata used. EM
  source DOI 10.25378/janelia.13114499. The cited paper (bioRxiv 10.1101/2024.09.05.611438) covers P7
  mouse tissues, not this islet volume; sample from the record title. Different volume from catalogued
  jrc_mus-pancreas-3. Total size not stated, not summed. enricher: source proofread (was mixed; Cellpose
  + manual corrections).'
