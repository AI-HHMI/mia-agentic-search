notes: 'Link-only figshare record (CC BY 4.0); data on S3. Nuclei labels made with Cellpose 3.0.9 plus cursory manual corrections. The zarr''s
  recon-1/em/ is empty: EM exists only as jrc_mus-pancreas-1.n5/em/fibsem-uint16 (uint16, x,y,z = 7500 x 5000 x 7312, 4.0 x 4.0 x 3.4 nm); labels
  are in the zarr (s0 54.4 x 64 x 64 nm zyx, shape [457, 313, 469] uint16). Figshare text says labels are 128 nm; zarr metadata used. EM source
  DOI 10.25378/janelia.13114499. The cited paper (bioRxiv 10.1101/2024.09.05.611438) covers P7 mouse tissues, not this islet volume; sample from
  the record title. Different volume from catalogued jrc_mus-pancreas-3. Total size not stated, not summed.'
