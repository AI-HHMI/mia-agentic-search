notes: 'EM Figshare record (27075529) and crop record (24255814, crop193) read; bucket listing shows 20 groundtruth
  crops (190-228) and em/fibsem-uint8 (s0 zyx 16302 x 11403 x 15149 uint8, 8 nm; size is this uncompressed estimate).
  Crop193 is annotated by hand in Amira at 4 nm over 1.6 um; crops differ in classes, per-crop extents were not
  all checked. Only a few cubic micrometres are labelled, hence sparse coverage. Organism taken from the sample
  (human patient tissue). No paper is cited; the EM record''s publication field lists only ''Xu et al., 2017'' (not
  looked up). Separate Figshare records exist per crop; this record covers the whole volume''s ground truth. enricher:
  18 crops in the bucket (was 20); size now includes the 18 label crops.'
