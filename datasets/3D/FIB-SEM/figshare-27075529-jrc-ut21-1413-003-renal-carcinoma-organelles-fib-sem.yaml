  with manual organelle segmentations
short_name: Human renal carcinoma organelles (FIB-SEM)
description: Reconstructed 8 nm isotropic FIB-SEM volume jrc_ut21-1413-003 (130 x 91 x 121 um) of human renal cell
  carcinoma tissue (healthy, marginal and cancerous regions) from the Janelia CellMap 2024 Segmentation Challenge,
  on the public janelia-cosem-datasets S3 bucket (OpenOrganelle), with 20 manually segmented ground-truth crops
  (Amira) covering up to 60+ organelle classes (cell, plasma membrane, mitochondria, ER, vesicles, endosomes, nucleus
  parts, microtubules and others), stored as OME-Zarr label groups.
