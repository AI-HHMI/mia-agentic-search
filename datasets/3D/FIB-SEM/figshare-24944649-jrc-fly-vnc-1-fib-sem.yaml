notes: 'Figshare record (v2), the six per-crop annotation records (crop78, 79, 173, 174, 176, 185, titled
  "Manual organelle segmentations") and the public S3 bucket were read. recon-1 EM is fibsem-uint8, (z,y,x)
  2000 x 2500 x 9400 at 4 nm (the grid the labels belong to); recon-2 is a larger fibsem-int16 reconstruction,
  (z,y,x) 3427 x 5123 x 10059, with no labels folder. Crops are 0.8 to 1.2 um blocks at 2 nm with class
  sets that differ per crop. A separate Figshare item (24944739, 2024) carries the same acquisition ID
  and was not treated as a different dataset. The listed papers (Xu et al. 2021 Nature; Scheffer et al.
  2020; Xu et al. 2017) were not read; the Nature paper has no open full text via Europe PMC. enricher:
  size_bytes estimated from the array shapes (was null).'
