title: Near-isotropic, reconstructed volume electron microscopy (FIB-SEM) of Drosophila ventral nerve
  cord (jrc_fly-vnc-1)
short_name: Drosophila nerve cord organelle crops (FIB-SEM)
description: FIB-SEM volume of a ventral nerve cord subset of an adult male Drosophila (4 nm isotropic,
  37.6 x 10 x 8 um) from HHMI Janelia, hosted as OME-Zarr on S3 / OpenOrganelle. Six manually segmented
  ground-truth crops (crop78, 79, 173, 174, 176, 185; about 1 um cubes at 2 nm) label organelle and cell-structure
  classes such as mitochondria, ER, vesicles, microtubules and the plasma membrane, each published as
  its own Figshare item. A second, larger reconstruction (recon-2) of the same sample is also provided
  without labels.
