notes: 'S3 listing: jrc_mus-kidney-4.zarr/recon-1/labels/groundtruth has 6 cropN groups (crop1134, crop1135,
  crop1136, crop1137, crop1138, crop1144); em/fibsem-uint16 s0 is uint16, shape 7305 x 8662 x 21597 (z,
  y, x) with 8 nm scale in its Zarr v3 / OME-Zarr 0.5 metadata. size_bytes = uncompressed raw s0 voxels
  x 2 bytes (crops add little). crop1134 lists 28 class names in its zarr.json; the other crops were not
  opened, so classes present per crop may differ. The bucket README says groundtruth blocks are labelled
  voxel-by-voxel by a human annotator; CC-BY-4.0 is stated for the collection on the AWS registry page.
  Species and tissue are inferred from the dataset name; sample prep, annotators and per-crop provenance
  are not documented in the sources read, and no paper specific to this volume was found (the COSEM/CellMap
  publications describe other volumes). Separate volume from the other jrc_* CellMap records; own crops.
  Train/val split undocumented.'
