notes: 'Voxel size from the EMPIAR API: pixel 25 A (2.5 nm) in x and y, Z-step 50 A (5 nm). Segmentations
  were made in Microscopy Image Browser: lipid droplets, lysosomes and peroxisomes manually, nuclear envelope,
  Golgi, ER and mitochondria with its deep learning tool (EMPIAR API description). The paper (Nat Cell
  Biol 2024) is not open access; only the abstract was available via Europe PMC, so Methods were not read.
  Cross-referenced entry EMPIAR-11849 was not checked. enricher: labels inspected (uint8 class IDs 0-8,
  one LZW TIFF per slice, same grid as the images). HTTP index total 5.6 GB (rounded), page states 5.2
  GB.'
