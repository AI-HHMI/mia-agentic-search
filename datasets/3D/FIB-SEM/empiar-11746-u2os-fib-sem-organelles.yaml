id: empiar-11746-u2os-fib-sem-organelles
title: FIB-SEM dataset of a human bone osteosarcoma epithelial cell (U2-OS) with organelle segmentations
short_name: U2-OS cell organelle segmentation (FIB-SEM)
description: Aligned and pre-processed FIB-SEM volume of a human U2-OS cell (1168 slices of 3394 x 1385 pixels, unsigned
  byte TIFF) with a paired label volume of eight organelle classes (nuclear envelope, lipid droplets, lysosomes,
  mitochondria, Golgi, endoplasmic reticulum, peroxisomes, other unclassified objects). Deposited as a reference
  dataset for volume EM data sharing and reuse.
