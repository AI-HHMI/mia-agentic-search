  then proofread, microtubules and endosomes by hand, so source is mixed. *_pred groups are predictions. Nuclei-only
  labels of this volume are in figshare-26511841 (zarr). enricher: label group shape corrected to x y z order from
  N5 attributes; it holds semantic ids 0-7 (decoded chunks).'
