notes: 'Figshare record (link-only file) and S3 listing read. EM at em/fibsem-uint8; main label group DSM-3_2-2_simple-seg
  (1868 x 1001 x 2017, x y z, uint8, 4 nm); only a sub-region is labelled (partial). Paper Methods (PMC author manuscript):
