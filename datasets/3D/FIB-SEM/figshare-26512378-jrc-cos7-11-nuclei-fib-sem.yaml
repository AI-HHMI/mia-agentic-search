notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol),
  class nuclei only; the record gives the source EM voxel size as 8.0 x 8.0 x 8.0 nm (x, y, z), matching the EM
  .zattrs (fibsem-uint16). EM s0 is zyx 12664 x 1200 x 8750 uint16; label s0 is zyx 1583 x 150 x 1093 uint8 at 64
  x 64 x 64 nm; label .zattrs declare instance_segmentation. The label array sits under labels/inference in the
  bucket but Figshare describes it as manual. Total size not stated on the Figshare record or zarr metadata, left
  null; organism not stated on the record, left empty. The Figshare file is a link-only entry; the bioRxiv paper
  cited by sibling records (10.1101/2024.09.05.611438) could not be read (HTTP 429) and is not cited on this record.'
