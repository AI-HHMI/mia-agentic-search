notes: 'Figshare record (CC BY 4.0): dense manual nucleus segmentation in Amira (protocols.io Amira vEM protocol), class nuclei only;
  the record gives the source EM voxel size as 8.0 x 8.0 x 8.0 nm (x, y, z), matching the EM .zattrs (fibsem-uint16). EM s0 is zyx 12664
  x 1200 x 8750 uint16; label s0 is zyx 1583 x 150 x 1093 uint8 at 64 x 64 x 64 nm; label .zattrs declare instance_segmentation. The
  label array sits under labels/inference in the bucket but Figshare describes it as manual. Total size not stated on the Figshare record
  or zarr metadata, left null; The Figshare file is a link-only entry. enricher: size estimated from shapes (technical.notes); encoding
  from cellmap .zattrs (instance_segmentation, absent 0, unknown 255). enricher: organism Chlorocebus sabaeus inferred from the cell
  line name (COS-7), as for the sibling records on main.'
