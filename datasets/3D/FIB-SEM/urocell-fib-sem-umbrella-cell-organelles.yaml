  notes: 'File names from a blobless git clone of the repository (1,989 files; the .obj meshes are Git LFS, the NIfTI
    volumes are plain git files served by raw.githubusercontent.com). File sizes are not in that listing, so size_bytes
    stays null (only the two sampled files are known: 16,375,615 and 120,030 B). Sampled data/fib1-0-0-0.nii.gz: 256^3
    float32, 66-251, mean 212.7; mito/instance/fib1-0-0-0.nii.gz: 256^3 int16, 0-39, 40 unique (instances). Other label
    folders were not sampled (dtype unknown; README gives 0/1 binary, 0/1/2 for branched and contacting). The NIfTI header
    voxel size is not usable (2.2e11 nm); the record keeps 16x16x15 nm from the README. mito/branched and mito/contacting
    (0/1/2 classes) are not listed as arrays.'
