notes: 'Per the repository README: eight sub-volumes cut from 1056 serial sections (1366x1180 px); original pixels 5.49 nm binned 3x in x/y,
  giving about 16 x 16 x 15 nm voxels. Mitochondria and endolysosomes annotated in 5 sub-volumes each, fusiform vesicles in 4, Golgi in all 8 (approximate
  except 2 precise). Raw volumes are data/fib1-*.nii.gz (8 files listed). The paper is not open access, so only the abstract was read; annotation procedure
  (manual vs proofread) is therefore unknown, and annotation file listings were checked only at folder level. File sizes and repository download
  method were not shown, so size_bytes is null. Second paper: Zerovnik Mekuc et al. 2022, doi 10.1016/j.cmpb.2022.106959.'
