notes: 'ResearchData.zip (413 MB): 200 FIB-SEM slices, FinalSegmentation (one 3D TIFF plus 3 HR-SEM TIFFs;
  Readme gives grey values), TEM and EDX images, and 17,902 PGM slices of synthetic model realizations.
  n_items counts real TIFF images only. Voxel size from the arXiv preprint 2310.07017 Methods (16.6 nm
  pixel, 20 nm slices; HR-SEM 5 nm). Single particle volume, so small training signal. No split. enricher:
  annotations.source mixed -> automatic (Ilastik random forest from a few hand-labelled voxels, then local
  Otsu and a majority filter; paper 2.4). The 3D segmentation is a 578x866 px cutout of the 884x1024 slices
  (paper: a cutout from the inner structure); its offset is not stated. size from file listing. organism:
  none (battery material).'
