  arrays:
  - role: raw
    path_pattern: ResearchData.zip/FIB-SEM-tomography-imagestack/NVP_8_SV_[0-9][0-9][0-9].tif
    format: tiff
    axes: yx
    shape:
    - 884
    - 1024
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: one slice per file, 200 files = z (20 nm steps, paper); file number = slice index
  - role: label
    path_pattern: ResearchData.zip/FinalSegmentation/FIB-SEM_segmented_image_data_3D.tif
    format: tiff
    axes: zyx
    shape:
    - 200
    - 578
    - 866
    shape_varies: false
    dtype: float32
    compression: none
    value_range:
    - 0
    - 255
    encoding: binary
    classes:
    - id: 0
      name: complement (carbon and pores)
    - id: 255
      name: NVP
    alignment: cropped
    alignment_notes: '200 slices like the raw stack, but 578x866 px against 884x1024 raw px: a cutout
      from the particle interior (paper section 3); the crop offset is not stated in the Readme or paper'
  - role: raw
    path_pattern: ResearchData.zip/HR-SEM-x-sections/NVP2_6500VSz_00[6-8].tif
    format: tiff
    axes: yxs
    shape:
    - 943
    - 1024
    - 3
    shape_varies: false
    dtype: uint8
    compression: none
    alignment: not-applicable
    alignment_notes: 2D HR-SEM cross-sections, 5 nm pixels, stored as RGB (photometric 2)
  - role: label
    path_pattern: ResearchData.zip/FinalSegmentation/NVP2_6500VSz_00[7-9]_segmented.tif
    format: tiff
    axes: yx
    shape:
    - 852
    - 1010
    shape_varies: true
    dtype: uint8
    compression: none
    encoding: semantic-ids
    classes:
    - id: 0
      name: carbon
    - id: 128
      name: pores
    - id: 255
      name: NVP
    alignment: unknown
    alignment_notes: 'file numbers 007-009 against raw 006-008 and smaller shapes (722x670, 852x1010,
      884x1022 against 943x1024): pairing and crop are not documented'
  notes: 'Listed the Zenodo record (one zip, every member listed); probed headers of the FIB-SEM slices
    001-002, the HR-SEM images and the 2D segmentations; sampled slice 100 (668 KB) and the 3D segmentation
    (6.7 MB compressed in the zip). value_range from these samples only. Raw slice 100: uint8, p50 77,
    saturated at 255 (p99 = 255), normalization unknown. The 3D segmentation is float32 holding 0/255
    only (79.7 % zeros), axes ZYX from the TIFF reader. The 3D label is cropped in y/x with an unstated
    offset, so it cannot be put on the raw grid without registration. HR-SEM raw/label pairing is unclear
    (numbers shifted by one, shapes differ). VirtualStructures holds synthetic model realizations (PGM
    slices, 16.6 nm cubic voxels per the paper), not imaging data; not described as arrays. Voxel size
    16.6 x 16.6 x 20 nm from the paper Methods (it later also says 16 nm x 16 nm x 20 nm); no calibration
    in the TIFF headers.'
