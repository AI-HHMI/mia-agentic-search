title: Research data for stochastic 3D modeling of nanostructured NVP/C sodium-ion battery particles (FIB-SEM,
  HR-SEM, TEM, EDX)
short_name: NVP/C battery particle segmentation (FIB-SEM)
description: FIB-SEM tomography stack (200 slices, 16.6 x 16.6 x 20 nm) of a Na3V2(PO4)3/C (NVP/C) active-material
  particle with its 3D NVP segmentation, three HR-SEM cross-section images (5 nm pixels) with three-phase
  segmentation (NVP, pores, carbon), plus TEM and EDX images and virtual nanostructures generated by the
  paper stochastic model.
