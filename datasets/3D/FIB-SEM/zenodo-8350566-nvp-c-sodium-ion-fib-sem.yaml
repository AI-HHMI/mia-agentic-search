notes: 'ResearchData.zip (413 MB) listed with peek_archive: 200 FIB-SEM slices, FinalSegmentation (one
  3D TIFF plus 3 HR-SEM TIFFs; Readme gives grey values), TEM and EDX images, and about 18,000 PGM slices
  of synthetic model realizations. n_items counts real TIFF images only. Voxel size from the arXiv preprint
  2310.07017 Methods (16.6 nm pixel, 20 nm slices; HR-SEM 5 nm). Labels: Ilastik random forest on a few
  hand-labelled voxels plus Otsu and majority filters (source mixed); carbon and pores are separated only
  in the 2D HR-SEM images. Single particle volume, so small training signal. No split.'
