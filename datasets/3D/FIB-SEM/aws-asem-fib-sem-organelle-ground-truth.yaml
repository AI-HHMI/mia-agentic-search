notes: 'Bucket s3://asem-project/datasets/ (us-east-1, anonymous), 35 cell folders; labels/ only in 1E
  (ccp), 2E (ccp, er, mito), 3A (mito, np, np_bottom), 46, 58, 61, 64 (er, golgi, mito); others raw/predictions
  only. Labels are small blocks (about 2-80 um3, paper). Annotation source: mito via Ilastik carving,
  ER/Golgi via graph-cut tool, both edited in VAST; NP and CCP manual in VAST (paper Methods). Organism
  lists human cell lines only; BSC-1 and macrophage species not stated in sources read. Licence CC BY-SA
  4.0 (registry, bucket README, LICENSE). enricher: voxel size set to null (was 5x5x5): labelled volumes
  differ, .zattrs resolution 4 nm for 1E, 2E, 3A and 5 nm for 46, 58, 61, 64; datasets_info.xlsx also
  lists 10 nm cells. enricher: download_url = registry page (no single archive; S3 Zarr stores).'
