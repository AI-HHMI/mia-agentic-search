notes: 'Bucket s3://asem-project/datasets/ (us-east-1, anonymous). 35 numbered dataset
  folders (e.g. 46, 58, 1E, 3A); S3 listing shows a labels/ group only in 1E (ccp),
  2E (ccp, er, mito), 3A (mito, np, np_bottom), 46, 58, 61, 64 (er, golgi, mito);
  others have raw/predictions only, so coverage is partial and the paper says labels
  are small blocks (about 2-80 um3). Spot-checked: 46 raw uint8 1921x1100x4600 at
  5 nm, labels/mito uint32 same shape; 3A and 1E at 4 nm. Voxel size recorded as 5
  nm (several volumes are 4 nm, SUM159 about 10 nm per paper). Organism lists human
  cell lines only; the species of BSC-1 and macrophage cells was not checked. Licence
  CC BY-SA 4.0 from registry. Some labelled volumes are re-used COSEM/OpenOrganelle
  data (paper Table S1, not read). Total size not measured (chunked Zarr).'
