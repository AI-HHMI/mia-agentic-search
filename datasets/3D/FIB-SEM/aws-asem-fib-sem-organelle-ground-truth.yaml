  Golgi, nuclear pores, clathrin-coated pits)'
short_name: ASEM FIB-SEM cells with organelle labels
description: Isotropic 4-5 nm FIB-SEM volumes of whole cultured cells (chemically
  fixed and high-pressure frozen) from the Kirchhausen lab, stored as Zarr (and TIFF)
  in the AWS ASEM bucket. Seven volumes carry manual/semi-automated ground-truth blocks
  for mitochondria, ER, Golgi apparatus, nuclear pores or clathrin-coated pits; the
  other volumes hold raw data and model predictions only.
