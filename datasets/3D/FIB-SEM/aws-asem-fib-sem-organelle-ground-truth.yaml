    - id: null
      name: np
    - id: null
      name: np_bottom
    alignment: offset
    alignment_notes: 'One binary array per class, named by its folder (labels/<class>). Each label .zattrs
      has offset (nm, z,y,x) and resolution equal to the raw; voxel index = (label offset - raw offset)/resolution.
      Some labels cover the whole raw grid (1E ccp, 2E ccp, 3A np, 46/58 all, 61 mito), others are crops
      (2E mito 200^3 at offset [4060,1264,1176] nm). dtype uint8 (0/255: ccp, np, 2E/3A mito) or uint32
      (0/1: er, golgi, 46-64 mito).'
  notes: 'Inspected Zarr metadata (.zarray/.zattrs) of raw and every label array of the 7 labelled cells
    (S3 delimiter listings), bucket README/LICENSE, datasets_info.xlsx, incasem README. Zarr v2, numcodecs
    zlib (recorded as deflate), chunks 128^3 (46 raw 256^3), dimension_separator ".". Axes z,y,x per incasem
    README ("offset and shape ... in z, y, x"; .zattrs offset in nm). Resolution per .zattrs: 4 nm isotropic
    (1E, 2E, 3A), 5 nm (46, 58, 61, 64), so record voxel size is null; TensorSwitch needs the per-volume
    .zattrs resolution. Samples (one each, central chunk-aligned crops): 2E raw [251,491,472] uint8 96-255
    (p99 = 255, top saturated); 2E labels/mito full 200^3 uint8 {0,255} 31% fg; 2E labels/er [110,290,255]
    uint32 {0,1}. Each cell also holds raw_equalized_0.02 (CLAHE), predictions/ (model output, not ground
    truth), neuroglancer_volumes/ pyramids and a <cell>_tiff/ copy as 2D TIFF stacks. Size not measured:
    a full S3 listing of datasets/ did not finish in 15 min (very many chunk objects); not stated on any
    page read, and no estimate since shapes vary per cell. No single archive: data are folders of Zarr
    chunks in the bucket (README suggests aws s3 cp / quilt3). Not download-ready: arrays are nested in
    Zarr groups (<cell>.zarr/volumes/...), whose URLs do not end in .zarr, so the planner matches no sample;
    voxel size differs per cell; many labels are offset crops.'
