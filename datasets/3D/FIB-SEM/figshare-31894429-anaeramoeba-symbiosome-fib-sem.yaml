notes: 'Facts come from the Figshare API record (11 files) and its README.md and Manifest. Volume 9235_1
  is 8.43 x 8.43 x 8.0 nm, 1,725 slices (2.9 GB mrc); volume 9235_2 is 6.744 x 6.744 x 7.0 nm, 1,300 slices
  (8.65 GB mrc) (README and MRC headers); voxel_size_nm is null because they differ. Labels are MIB model
  files (Microscopy Image Browser format, not a standard array format). Segmentation = manual annotation
  every 50 slices, a 2.5D DeepLabv3+/ResNet50 model trained in MIB, SAM2 and extensive manual refinement,
  hence source mixed. No related paper is listed in the record or README. enricher: size from complete
  listing; voxel size null (volumes differ).'
