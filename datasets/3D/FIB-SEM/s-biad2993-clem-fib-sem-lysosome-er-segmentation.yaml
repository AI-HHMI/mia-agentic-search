title: A high-performance end-to-end 3D CLEM processing workflow for facilities
short_name: CLEM FIB-SEM organelle segmentation (MEF, HeLa)
description: Two correlative light and electron microscopy (CLEM) datasets, mouse embryonic fibroblasts and HeLa
  cells, each with a raw and aligned FIB-SEM volume (5-6 nm isotropic), a registered fluorescence volume
  (lattice SIM or widefield) and a segmentation volume of a region of interest (lysosomes, late endosomes,
  mitochondria, endoplasmic reticulum) made semi-manually with nnInteractive and Empanada in napari.
