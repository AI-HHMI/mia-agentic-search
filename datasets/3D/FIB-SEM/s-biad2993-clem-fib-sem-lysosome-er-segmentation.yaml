  notes: 'Sizes and file count from the BioStudies file lists (dataset1_clem.json 4,788 files, dataset2_clem.json
    1,420, segmentation.json 1; study info says 6,209 files); listing.py on the FTP index gave 4,739 files with
    approximate sizes, so size_source is page-stated. Header probes: registered EM (dataset 1), segcrop-Composite,
    dataset 2 seg, aligned_denoised, aligned and raw slices. Sampled: dataset 2 seg (whole, 1.6 MB), aligned slice_00000
    (2.1 MB), three z planes x 4 channels of segcrop-Composite (by range). Not inspected: the CZI and LM TIFF. No
    single archive; files are served individually from ftp.ebi.ac.uk (https), so download_url stays null. voxel
    size: 6 nm (dataset 1, study record + ImageJ header) and 5 nm (dataset 2, study record); not set because they
    differ.'
