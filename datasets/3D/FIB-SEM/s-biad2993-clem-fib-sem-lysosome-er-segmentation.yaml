notes: Voxel size is the FIB-SEM voxel of dataset 1 (6 x 6 x 6 nm); dataset 2 is 5 x 5 x 5 nm, and the SIM
  volume of dataset 1 is 31.3 x 31.3 x 109.6 nm (all from the BioImage Archive study record). The
  segmentation covers only a region of interest. The study record says one strategy was automatic Empanada-MitoNet
  segmentation, so the masks may mix automatic and semi-manual labels; which class is stored in which
  file is not stated in the listing, and the preprint full text is not open access (Europe PMC abstract
  only, bioRxiv returned 429), so class encoding and ROI size are unknown. Dataset 2 holds a 10 GB denoised
  volume next to raw and aligned EM. data.download_url left null because the study spans many folders.
