notes: 'FIB-SEM voxels differ per dataset (BioImage Archive study record): dataset 1 6 x 6 x 6 nm (also in
  the ImageJ headers), dataset 2 5 x 5 x 5 nm; SIM of dataset 1 is 31.3 x 31.3 x 109.6 nm. Enricher set voxel_size_nm
  to null (was 6 x 6 x 6) because the two EM volumes do not share one. organisms: Mus musculus = clemdataset1-ipp2026/,
  Homo sapiens = dataset2-NalanLiv-IPP/. Modality: EM = */EM/ and */segmentation, */seg; light = clemdataset1-ipp2026/LM
  (lattice SIM, CZI) and dataset2-NalanLiv-IPP/LM (widefield TIFF). Annotation source mixed: the study says automatic
  Empanada-MitoNet segmentation, or a retrained model with semi-manual nnInteractive GT; which file is which is
  not stated. Coverage: dataset 1 labels a 468 x 495 px crop over all 728 slices, dataset 2 a 492 x 519 px crop
  over 449 slices. Enricher added czi and set size from the BioStudies file lists.'
