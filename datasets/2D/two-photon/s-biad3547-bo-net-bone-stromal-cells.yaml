notes: 'Annotation file lists hold 283 masks: blood vessels 8, bone (confocal) 57, bone (multiphoton) 90, osteoblasts 96,
  osteoclasts 32; matching *_Acquisition folders hold the images (one probed MAX projection: 2022x2022 uint16, 2D). The paper''s
  21,395 patches (17,104 train / 4,291 validation, 512x512) are processed/augmented, not this release; the BioStudies text
  says the file list should hold the original masks and sources. No split files in the lists read. Confocal: 608 um field,
  1024 px; multiphoton pixel size and channels not stated in sources read. Image counts in *_Acquisition lists not individually
  checked. Total size not computed. Dimensionality 2D reflects the max projections probed; confocal source stacks may be 3D.'
