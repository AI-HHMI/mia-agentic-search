notes: 'Found via the 2026 J Biophotonics paper (Europe PMC full text read) and the Zenodo description. Patch counts (5,078 mixed and
  3,424 isolated) are from the record text; the isolated-cell zip was listed with peek_archive (3,424 TIFF, class suffixes in file
  names), the mixed-sample zip was not listed. Pixel size 400 nm follows from the stated 64x64 px = 25.6 um patch (full images
  1,024 px over 405 um). Only 64x64 patches are provided, not the full raw fields of view. Labels for the six-class set come from the
  experimental design (purity above 95 percent), not per-cell annotation, so source is mixed. No train/test split is provided.'
