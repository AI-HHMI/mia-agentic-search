title: Label-free two-photon autofluorescence images of different immune cell types
short_name: Immune cell autofluorescence patches (two-photon)
description: 64x64 px multi-channel TIFF patches (NADH and FAD autofluorescence plus Dodt contrast) centred on single mouse
  immune cells imaged by multiphoton microscopy. One zip has 5,078 T cell vs neutrophil patches from mixed samples (APC-CD3
  antibody signal gives the labels); the other has 3,424 patches of six isolated cell types (CD4 and CD8 T cells, B cells,
  macrophages, dendritic cells, neutrophils) labelled by sample.
