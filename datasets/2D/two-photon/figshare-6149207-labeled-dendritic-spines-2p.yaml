  notes: 'Listing: the figshare API gives 1 file of 22,149,550 B. Inside the RAR (scratch script, requests
    only): the RAR5 quick-open cache (one 185,295 B range read of the tail) holds the 1836 TIFF headers
    (unpacked 29,931,580 B), and a sequential read of the first 256 KB shows each spine folder also has
    a .csv and a .txt. The cache omits these small files, so their total count is inferred from the folder
    count. All members are RAR-compressed (method 3), so no member could be read without a RAR decoder
    (none allowed): TIFF shape, dtype and the CSV/TXT contents are unread. No sample.urls: TensorSwitch
    can''t read RAR members. Voxel size: kept the paper''s approximate 67 nm (about 15 px per um, Methods);
    per-image scale is in spine_info*.txt.'
