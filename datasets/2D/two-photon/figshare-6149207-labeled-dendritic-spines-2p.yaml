notes: 'Single 22 MB RAR5 (Labeled_Spines_Smirnov_Garrett_et_al_2018.rar). Paper Methods: custom two-photon
  microscope (ScanImage), 60x objective, 128 x 128 px images, field ~8 x 8 or 16 x 16 um, about 15 pixels
  per um in X and Y, so x = y = 67 nm is approximate (the scale varies with image zoom and is stored in
  each folder''s spine_info txt). Organism taken from the paper (C57BL/6J wild type and IGF1R/insulin
  receptor cKO pups). enricher: formats other -> tiff and n_items 1,837 (paper) -> 1,836 (spine folders
  in the RAR''s file headers); annotation files seen in the RAR headers.'
