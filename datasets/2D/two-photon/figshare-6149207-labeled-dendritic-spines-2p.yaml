title: Labeled dendritic spines - bounding-box training data from two-photon images of GFP-labelled hippocampal
  neurons
short_name: Dendritic spine boxes (two-photon)
description: Two-photon images of dendritic spines on GFP-labelled CA1 neurons in mouse organotypic hippocampal
  slice cultures, each folder holding an image, a .csv of spine bounding boxes ([x, y, width, length]),
  a text file of spine-centre coordinates and the pixels-per-micron scale. Released as the training data
  for a spine identification tool (MATLAB neural network classifier); the paper reports 1,837 images used
  for training, validation and testing.
