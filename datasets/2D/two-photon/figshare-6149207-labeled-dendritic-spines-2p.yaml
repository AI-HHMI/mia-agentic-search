notes: 'Single 22 MB RAR (Labeled_Spines_Smirnov_Garrett_et_al_2018.rar) that cannot be listed remotely, so
  the image file format and the exact image count in the archive are unverified (n_items is the paper count
  of 1,837 images used; the figshare text only says a collection of images). Paper Methods: custom two-photon
  microscope (ScanImage), 60x objective, 128 x 128 px images, field ~8 x 8 or 16 x 16 um, about 15 pixels per
  um in X and Y, so x = y = 67 nm is approximate (scale varies by image zoom and is stored in each folder).
  Organism taken from the paper (C57BL/6J wild type and IGF1R/insulin receptor cKO pups).'
