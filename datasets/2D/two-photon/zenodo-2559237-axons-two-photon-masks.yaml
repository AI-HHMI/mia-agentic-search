notes: Dataset.zip (23.4 MB) lists 304 PNGs (152 images + 152 masks) under train/ and test/. Images are 2D max projections
  of 3D stacks taken from Bass et al. 2017 and Canty et al. 2018 (bioRxiv); the masks were produced manually by the depositor.
  Pixel size is not stated on the Zenodo page; the Bass 2017 paper (PLoS One, Methods) gives 0.147 um per pixel at 512x512
  for its own dataset, but this deposit also includes Canty et al. images, and Canty et al. 2018 (bioRxiv Methods) used "typically
  100 x 100 um field of view, 512 x 512 pixels", so the sources differ and voxel_size_nm is left null. The capsule-GAN MIDL
  2019 paper that this record is cited with could not be found in Europe PMC; it was not read. Which images come from which
  source is not stated.
