notes: 'image.zip (405 PNG, 239 MB) and label.zip (405 PNG, 5.5 MB) were listed with peek_archive. Pixel size is derived, not stated: paper Table I gives a 1 x 1 mm2 field of view at 1024 x 1024 px, i.e. about 977 nm/px. The 270/135 train/test split is stated on the Figshare record and in the paper (Methods); the zips do not contain split folders, so the file lists for each split are not verified. The paper says only part of the 2PFM dataset is on GitHub; the Figshare record holds the 405 images. Objective 16x, 0.8 NA (custom-built 2PFM).'
