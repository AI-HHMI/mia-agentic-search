notes: 'Zip indexes read with peek_archive (test_dataset.zip 1,326 TIFFs; train_dataset.zip 21,114 TIFFs; all .tif). Pairs:
  train Brain_SRS 7,485 + Ovarian 3,072; test Brain_SRS 151 over 10 cases and Ovarian 512 over 8 cases (counted from folder
  listing; n_items = 2 x pairs). The third file checkpoints.zip (328 MB, pretrained models) is included in size_bytes. The
  target is a virtual-staining (image translation) task, which the schema has no value for, hence ml.tasks other and annotations
  restoration-pairs. Paper Methods: SRS patches 340 x 340 and MP patches 544 x 544 px; H&E from adjacent (not identical) sections,
  so pairs are only approximately aligned. Pixel size not stated on the Zenodo page or in the paper text; enricher: TIFF headers
  read: all probed patches (SRS and MP, A and B) are 544x544x3 RGB uint8, not 340x340 as the paper says for SRS. The paper
  says the SRS data are also on Harvard Dataverse (10.7910/DVN/EZW4EK); that copy was not fetched.'
