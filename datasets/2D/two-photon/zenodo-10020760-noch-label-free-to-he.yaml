title: Public data for nonlinear optical computational histology (NOCH)
short_name: Label-free SRS/MP to H&E paired patches
description: Paired image patches for label-free-to-H&E virtual staining. Input patches (trainA/testA) are stimulated Raman
  scattering (SRS) images of human brain tumours and multiphoton (MP) images of human ovarian tissue; targets (trainB/testB)
  are bright-field H&E images of adjacent sections. Released with the NOCH contrastive-learning framework, with a train and
  a test archive and pretrained checkpoints.
