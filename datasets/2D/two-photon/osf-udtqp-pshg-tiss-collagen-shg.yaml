      \  skin tissue H&E-stained/    53 ROI folders + .txt\n  skin tissue unstained/      53 ROI folders\
      \ + .txt\n  thyroid tissue H&E-stained/ 40 ROI folders + .txt\n    <tissue>_[HE_]<n>/  (e.g. breast_HE_1:\
      \ 217 files, 211,157,245 B)\n      <tissue>_HE_<n>_TPEF.tif                     512x512 uint8\n\
      \      BSHG/<tissue>_HE_<n>_BSHG_p<0..180>.tif      10 x 512x512 uint8\n      BSHG/Results/<param>[_<SD|MAD|ENTROPY>_<circular|square>_<3|7|15>].tif\
      \  98 x 512x512 float32\n      FSHG/ (same as BSHG)"
