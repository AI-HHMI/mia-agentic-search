notes: 'OSF project udtqp (CC-By 4.0 in the OSF API record) has five folders (breast/skin/thyroid, H&E-stained
  or unstained) and "dataset info.txt", which describes the layout: [tissue]_[ROI] folders with BSHG/FSHG
  subfolders of 8-bit .tif SHG images named by polarization angle, one TPEF image per ROI, and 32-bit
  .tif computed maps in Results subfolders. 482 stacks = (48+53+40 unstained + 47+53 H&E ROIs) x 2 detection
  configurations. Labels are ROI-level classes, not masks. Pixel size not stated (paper: 125 x 125 um2
  scans of 512 x 512 px). date_published is the OSF creation date (article 2022-07). Modality two-photon:
  Leica TCS SP with Ti:Sapphire laser. No split provided; no single archive, so download_url is null.
  enricher: ROI class lists read and files listed (annotations_verified true); channels 1 from TIFF headers.'
technical:
