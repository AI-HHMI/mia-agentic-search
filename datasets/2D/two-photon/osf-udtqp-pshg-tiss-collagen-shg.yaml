schema_version: '1.2'
id: osf-udtqp-pshg-tiss-collagen-shg
title: 'PSHG-TISS: A collection of polarization-resolved second harmonic generation microscopy images of fixed tissues'
short_name: Tissue polarization-resolved SHG (multiphoton)
description: 482 polarization-resolved second harmonic generation (PSHG) image stacks (10 SHG images per stack, linear polarization
  0-180 deg in 20 deg steps, forward and backward detection) with a TPEF image per ROI, from H&E-stained and unstained thin
  sections of human breast, skin and thyroid tissue. Each ROI is annotated by class (breast - normal TDLU, ductal carcinoma
  in situ, invasive carcinoma; skin - papillary dermis, reticular dermis, subcutaneous tissue; thyroid - follicular adenoma,
  papillary carcinoma), and the collection adds computed collagen-structure maps (chi tensor ratios, orientation, pitch
  angle, R2/ERR/SNR) and local-dispersion images.
