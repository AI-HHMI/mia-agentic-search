  notes: 'Listing via the OSF API: top two levels in full (5 tissue folders, 241 ROI folders = 47+48+53+53+40,
    the 5 class .txt files, dataset info.txt) and one ROI (breast_HE_1) in full; the other 240 ROIs were
    not walked (one API request per folder at 1 req/s), so n_files and the total size are not confirmed.
    Probes (ImageJ TIFF, no calibration): BSHG_p0 and TPEF 512x512 uint8, Results/CHI3115.tif 512x512
    float32, all uncompressed. Sample (BSHG_p0, 267 KB): 0..255, mean 7.7, 55% zeros (one sample). Size
    estimate not made: the Results count per ROI is known only for breast_HE_1 (196 files); if all ROIs
    match it (211 MB each) the total is about 51 GB. Voxel size not found; checked: TIFF headers, dataset
    info.txt, OSF API, paper Methods (only "125 x 125 um2" scans of 512 x 512 px; pixel size not stated).
    No single archive: files are per-file OSF download links (osf.io/download/<id>/, usable).'
