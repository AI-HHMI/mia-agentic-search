notes: 'IIT Dataverse deposit (212 files, 1.38 GB); Read the README, file listing and paper full text.
  Spines: 50 images + 100 manual masks (_spines and _dendrites per image); paper text mentions 27 training
  images. Restoration: 50 low-SNR images are artificially degraded copies of the same 50 spine images,
  not experimental pairs. Also holds 2204 + 459 labelled calcium traces (HDF5) and trained models. Dataverse
  lists CC BY 4.0. enricher: voxel size set to null (was 35 nm, the paper average for 27 training images):
  pixel size varies per image, TIFF ImageJ calibration 90.6, 117.2, 189.7 nm/px for img_0001-0003.'
