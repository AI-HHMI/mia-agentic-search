description: Two-photon images of Alexa-594-filled dendrites of mouse ventral CA1 pyramidal neurons (50
  images at various resolutions) with manual pixel-level masks for spines and dendrites, 50 matching artificially
  degraded low-SNR images for content-aware restoration, and calcium traces with event labels for a classifier.
  Includes trained models.
