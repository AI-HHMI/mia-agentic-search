notes: 'IIT Dataverse deposit (212 files, 1.38 GB); download_url left null because
  no direct archive link was tested. Read the README, file listing and paper full
  text. Spines: 50 images + 100 manual masks (_spines and _dendrites per image); paper
  text mentions 27 training images. Restoration: 50 low-SNR images are artificially
  degraded copies of the same 50 spine images, not experimental pairs. Also holds
  2204 + 459 labelled calcium traces (HDF5) and trained models. Pixel size varies
  per image (resolutions.npy); 35 nm is the paper average (0.035 +/- 0.010 um). Dataverse
  lists CC BY 4.0.'
