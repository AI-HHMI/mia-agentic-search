notes: 'Zip listings: t5 training has 314 TIFF crops (the record says 150 training images; 314 TIFFs and
  150 segmentation files do not match, so n_items uses the 150 npy segmentations and the record text),
  t5 segmentation files has 150 *_seg.npy, Max projections has 347 TIFF movies. size_bytes = training
  + segmentation zips only; the record also holds 640 MB of movies and model/Trackmate zips. Record Methods:
  27 4D multiphoton movies every 10 min, 350 single-channel single-cell-thick layers (10-30 um) max projected,
  5th time point used for Cellpose 2.2.2 training after manual correction of segmentation of 150 images,
  hence source mixed. Authors are not listed on the record, so authors is empty. The paper (Cell Reports
  2024) is not open access, only the Europe PMC abstract was read. Pixel size and microscope model not
  stated on the record. Modality two-photon from the record ''multiphoton microscopy''.  The .npy segmentation
  format is described in annotations.format.'
