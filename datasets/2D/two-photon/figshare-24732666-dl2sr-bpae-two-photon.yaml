description: 'Diffraction-limited to super-resolution (DL2SR) dataset: 16 fields of view of BPAE cells (nuclei, F-actin, mitochondria
  stained) imaged on a custom two-photon microscope, 50 noisy 256x256 images per field of view, each field with a super-resolution
  target image computed with the SRRF ImageJ plugin. Paper uses 15 fields for training and one for testing.'
