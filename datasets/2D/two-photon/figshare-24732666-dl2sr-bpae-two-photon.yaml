notes: 'Zip lists 816 TIFFs: 16 FOV folders x 50 images plus 16 SRRF targets (Target/). The record text says 15 FOVs train and 1 test, the
  paper (full text read) says FOV 8 is the test field and the rest train; no split files ship. The paper gives 40x 0.8 NA objective,
  800 nm excitation and 200 nm pixel width; the labelled structures (nuclei, F-actin, mitochondria) come from the paper text, the exact dyes are not named. Super-resolution targets are computed with the SRRF ImageJ plugin, not
  measured with an SR microscope, hence automatic. Landing page fetched through the figshare API record (curate.nd.edu page not opened).'
