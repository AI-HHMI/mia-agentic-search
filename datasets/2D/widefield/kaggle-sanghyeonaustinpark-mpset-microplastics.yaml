notes: 'Kaggle API record (CC BY 4.0, 2.25 GB, v8) and paper full text read; the JavaScript-rendered Kaggle page gave no
  file listing, so folder structure comes from the description (spiked_fl/spiked_mask: 5 images; clam_fl/clam_mask:
  19 images, .tiff). Only the 24 test/spiked images are on Kaggle; the paper''s 99 training/validation composites are
  not part of this dataset. Paper Methods: Olympus SZX10 stereomicroscope with FGFP filter set, DigiRetina 16 camera
  (1600x1200 tiles stitched into composites); pixel size and channel count are not stated.
  Masks made from RGB thresholding refined by three researchers with pixel-wise annotation.'
