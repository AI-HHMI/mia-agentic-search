notes: 'Read the Zenodo API record (CC BY 4.0, single 3.5 GB tar.gz) and the bioRxiv preprint full text. Paper: training
  database of 309 time-lapse mitotic cells (40x and 60x) giving 11,797 150x150 crops, annotated in Advanced Cell Classifier
  on the regression plane, split by cell trajectory into train/validation/test. The tar.gz cannot be listed remotely, so
  file format, per-split counts of the v2 release (augmented), and the label file layout were not verified (formats other).
  Pixel size per magnification is not stated for the crops. ML task: regression of plane coordinates (ml.tasks other).'
