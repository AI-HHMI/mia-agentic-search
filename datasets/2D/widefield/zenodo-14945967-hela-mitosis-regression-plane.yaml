schema_version: '1.2'
id: zenodo-14945967-hela-mitosis-regression-plane
title: 'Deep regression plane training dataset for the Morpho-Proteomic Atlas of Mitosis: annotated HeLa mitotic cell crops
  (Zenodo)'
short_name: HeLa mitotic stage regression plane crops
description: Single-cell image crops (150x150 px, two channels EGFP-alpha-tubulin and H2B-mCherry) of live-imaged then fixed
  HeLa Kyoto cells tracked through mitosis, each annotated by experts with a coordinate on a circular regression plane (interphase
  plus prophase to telophase) that encodes continuous mitotic stage. Release v2 is the split (train/validation/test) and augmented
  set used to train the paper's regression and classification networks.
