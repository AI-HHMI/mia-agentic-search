  notes: 'The dataset is one 3.5 GB tar.gz (size from the Zenodo API file record). tar.gz cannot be indexed remotely, so I
    streamed the first 60 MB (two passes of 30 MB, logged) and read member names and 6 members in memory: val/images/*.jpg
    are 224x224 RGB uint8 JPEGs (zero-padded/resized from the paper''s 150x150 crops; R and G carry signal, B max 15-25, i.e.
    two channels packed into RGB), val/labels/*.tif are 1x2 uint16 TIFFs (PackBits) with plane coordinates (observed 670-9341).
    Value ranges are from these few samples. Train/test folder sizes and the per-split counts were not reached. No sample
    unit: TensorSwitch cannot pull single members out of a tar.gz; the whole archive is a direct link (download-check usable,
    range requests). Voxel size: not stated for the resized crops; checked the Zenodo record description; the preprint full
    text could not be fetched this run (bioRxiv blocked, Europe PMC PPR1002479 has no full text), the harvester''s notes say
    it gives no crop pixel size. 2D data: not covered by the miao layout yet.'
