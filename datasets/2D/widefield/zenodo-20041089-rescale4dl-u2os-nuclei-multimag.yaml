description: Colocalised widefield fluorescence images (Hoechst) of fixed U2OS cell nuclei acquired at
  10x, 20x, 40x and 60x on a Nikon Ti2, with label images, split into training and test sets per magnification
  (28 training + 8 test image/label pairs per magnification, 144 pairs in total). Part of the ReScale4DL
  study of pixel size versus segmentation accuracy.
