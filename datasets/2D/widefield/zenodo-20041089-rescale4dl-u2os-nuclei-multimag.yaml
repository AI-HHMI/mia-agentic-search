notes: 'Zip listings (peek_archive) show images/ and labels/ TIFF pairs: 28 training + 8 test per magnification
  (10x, 20x, 40x, 60x). Total size is the sum of the 8 zip files listed on Zenodo plus metadata CSVs (approximate).
  Pixel size differs per magnification; the 10x metadata CSV gives a calibration of 0.649 um/pixel (2048x2048
  pixels, 16-bit, objective NA 0.3); other magnifications were not checked so voxel_size_nm is null. Nikon
  Ti2 widefield acquisition is from the Zenodo description. The annotation procedure and whether labels
  are instance masks are not described on the Zenodo page; the ReScale4DL preprint text read (Europe PMC)
  does not describe this U2OS dataset, so annotation source is unknown and the label type (instance) is
  inferred from the dataset name/StarDist use in the preprint. Modality: widefield fluorescence (Hoechst).
  enricher: channels 1 from TIFF headers (was null). Labels confirmed as instance IDs. The size is now
  confirmed by a complete listing (13 files).'
