id: zenodo-19500864-cdk-reporter-ephb4-nuclei
title: Microscopy image dataset of Cdk2 and Cdk4 activity reporters, phase contrast and histone H2B paired with nuclear segmentation
short_name: EpH4 Cdk2/Cdk4 reporter nuclei (widefield)
description: 288 four-channel widefield fluorescence images (phase contrast, DHB-Venus Cdk2 reporter, mCherry-Cdk4-KTR, H2B-mTurquoise
  nuclear marker; 1392 x 1040 px, 16-bit TIFF) of EpH4 mammary epithelial cells with over 118,000 cells, under six conditions (two cell
  densities, DMSO control, Cdk2 inhibitor III, palbociclib, and both inhibitors; three biological replicates). Each image has a matching
  nuclear label image segmented from the H2B channel with StarDist.
