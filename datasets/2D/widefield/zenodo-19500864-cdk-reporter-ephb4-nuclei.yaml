notes: 'From the Zenodo record and the zip listing via peek_archive (576 TIFF files: 288 images in tiff_files/ and 288 label
  images in label_files/). Leica DMI8 widefield, 20x/0.40 objective, 0.4604 um pixel, as stated on the record. The nuclear
  labels were generated by a pretrained StarDist model (not manually annotated or proofread, as far as the record says), so
  they are automatic. The record lists no related paper, only the code repository; organism is not named on the record (EpH4
  is a mouse mammary epithelial line, but this was not stated), so organism is left empty. The label TIFF bit depth was not
  opened.'
