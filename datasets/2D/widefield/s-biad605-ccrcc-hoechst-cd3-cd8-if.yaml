notes: 'Files per the file list: 10 slides/*.czi (ICAIRD ids), ccrcc/clinical_data.csv and ccrcc/patches.tar.gz
  (75 GB). Cell masks are StarDist outputs (automatic), with class CD3 / CD8 (subset of CD3) / neither,
  per the study description. Patch count and split not stated on the study page or arXiv abstract; the
  Data (MDPI) paper returned 403 and Europe PMC has no full text, so it was not read. Study License field
  says CC0. enricher: voxel size 227 nm and 5 channels (Hoechst, FITC, Cy3, Cy5, AF750) from CZI metadata
  (were null / 3); patches are 256x256 PNGs (raw per channel, per-class cell masks, per-patch JSON), seen
  by streaming the start of the tar.gz, so png added to formats and annotations_verified set; size_bytes
  from the BioStudies files API (was null).'
