notes: 'Single 1.5 GB zip (249 files, 2.0 GB uncompressed). Listing (peek_archive): ''Cellpose Training
  Folder/train'' and ''/test'' with image crops, *_masks.tif labels and Cellpose *_flows.tif; the zip
  also holds QuPath projects (.qpproj/.qpdata), whole-slide .vsi/.ets images, the Cellpose model, Groovy
  scripts and a QC notebook. Per the eLife paper Methods: four cross-section images were annotated in
  multiple regions, 15 areas for training and 4 for validation; crops were downsampled 4x to 1.2876 um/px
  (voxel_size_nm set to that training pixel size; the original 20x scanner images are finer). Imaging:
  Olympus VS120-S6-W slide scanner, 20x/0.75 objective; channels DAPI, laminin, CD45 (3). Mouse strain
  C57BL/6J. The license applies to the Zenodo record; the Readme is silent on licensing. enricher: n_items
  18 raw/mask pairs (14 train, 4 test) and size from Zenodo listing; channels 1 (training crops are single-channel
  float32, probed; was 3).'
