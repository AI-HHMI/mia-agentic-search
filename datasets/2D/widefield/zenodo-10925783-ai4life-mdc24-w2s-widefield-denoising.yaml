notes: 'Single noisy.tiff (188,807,950 B): an ImageJ hyperstack of 120 images x 3 channels x 512x512, int16 (header; the Zenodo
  description says 120 three-channel images, so the ImageJ slice axis is the image index). Training signal: the AI4Life denoising
  challenge page says unsupervised training uses only noisy images, and lists W2S among its datasets. The full original W2S
  (360 sets, noise-free and SIM references, https://datasets.epfl.ch/w2s/W2S_raw.zip) is not this record. enricher: organism
  and sample from the W2S paper (arXiv PDF): widefield images of human cells, Nikon SIM setup (Eclipse T1), channels 488/561/640
  nm; pixel size not stated in the paper (setup details are in its supplement, not read). Challenge page states no license;
  CC-BY-4.0 is from Zenodo.'
