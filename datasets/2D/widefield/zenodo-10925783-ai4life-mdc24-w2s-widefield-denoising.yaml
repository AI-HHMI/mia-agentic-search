notes: 'Single noisy.tiff (189 MB) with 120 three-channel images, per the Zenodo description; the TIFF itself was not opened,
  so image size and axes are unverified. Training signal: the AI4Life denoising challenge page says unsupervised training
  uses only noisy images, and lists W2S among its datasets. The full original W2S (360 sets, noise-free and SIM references,
  https://datasets.epfl.ch/w2s/W2S_raw.zip per the GitHub README) is not this record. Pixel size, sample/cell type, wavelengths
  and microscope are not stated on the Zenodo page, arXiv abstract, GitHub README or challenge page; the paper full text was
  not available through paper.py and the ECCV PDF was not read. The challenge pages on grand-challenge.org returned 403.
  Challenge page states no license; CC-BY-4.0 is from Zenodo.'
