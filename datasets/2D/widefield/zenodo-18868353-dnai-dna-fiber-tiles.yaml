notes: 'DNAI_Data_V2.zip lists 3,690 files (3,670 PNG + 20 JPEG): train has 125 Origins, 580 S1 and 831 V0 image/mask
  pairs (1,536), test has 58 Origins and 201 V0 (259), intergrader has 14 image folders with annotations
  by H1-H4. Paper: 1,795 non-overlapping 2048 x 2048 tiles from Zeiss Z2 whole-slide scans, 14,728 fibers
  labelled, 20% of train reserved as validation (no validation folder in the zip). Pixel size 0.26 um
  from the Zenodo description. Label pixel values and what the Origins/S1/V0 folders denote (assay
  conditions, replication origins, S1 nuclease treatment) were not opened or confirmed beyond the folder
  names and paper. The paper also mentions DeltaVision and Leica confocal images used in other
  experiments, not in this data.'
