notes: 'Sibling of TrypTag (s-biad1866), different organism. Files.json: 44,843 images + 44,843 masks, 2,666
  genes. Image: 3x2048x2048 uint16; mask: 2048x2048 uint16. Masks are Cellpose predictions; only 100 images
  per stage were hand-outlined for fine-tuning (not separately listed), so source is automatic. Channels
  (study component): 1 phase contrast, 2 mNeonGreen, 3 Hoechst DNA. Paper not open access (abstract only).
  enricher: voxel size 103.1746 nm from the OME-XML PhysicalSizeX/Y (0.1031746 um) of the image files (was
  103.2, derived from camera specs). enricher: size_bytes from Files.json per-file sizes (was null).'
