notes: 'Covers the three db_*.zip segmentation sets of the Zenodo record (peek_archive: 122, 105 and 135 image/label
  pairs, 336 + 629 + 510 MB; size_bytes is their summed zip size). The record also holds demos (demo_adcc, demo_ricm),
  trained models, and two single-cell signal classification/regression sets (db-si-NucPI, db-si-NucCondensation) that are
  not described here. Pixel size is stored per frame in the JSON files and differs between sets: 0.3112 um (MCF-7 nuclei
  frame checked), 0.1568 um (NK frame checked) and 0.2 um (RICM frame checked), so voxel_size_nm is null. The paper
  mentions 20x/0.4 (0.31 um) and 40x/1.3 (0.157 um) objectives. The channel list varies (up to five channels: brightfield,
  Hoechst, PI, CFSE, LAMP1). Split not provided. Annotators are experts per the paper; the MCF-7 and NK sets use
  multiple channels and time information, and the RICM set was pre-annotated by thresholding then corrected manually.
  License is CC BY-NC 4.0, which limits commercial use.'
