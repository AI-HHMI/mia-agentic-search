description: 'Three sets of multichannel time-lapse frames with instance-segmentation labels made with Celldetective''s
  napari plugin: MCF-7 nuclei in co-culture with NK cells (122 frames), primary NK cells in co-culture with MCF-7 (105
  frames) and primary NK cells spreading on an antibody-coated surface imaged by reflection interference contrast
  microscopy (135 frames). Each frame is a multichannel TIFF with a *_labelled.tif mask and a JSON describing the channels
  and pixel calibration.'
