notes: 'Covers the three db_*.zip segmentation sets of the Zenodo record (122, 105 and 135 pairs). The record also holds demos
  (demo_adcc, demo_ricm), trained models, and two single-cell signal classification/regression sets (db-si-NucPI, db-si-NucCondensation)
  that are not described here. Pixel size is stored per frame in the JSON files and differs between sets: 0.3112 um (MCF-7
  nuclei frame checked), 0.1568 um (NK frame checked) and 0.2 um (RICM frame checked), so voxel_size_nm is null. The channel
  list varies (up to five channels: brightfield, Hoechst, PI, CFSE, LAMP1). Annotators are experts per the paper; the MCF-7
  and NK sets use multiple channels and time information, and the RICM set was pre-annotated by thresholding then corrected
  manually. organisms: Homo sapiens = MCF-7/NK sets; Mus musculus = mouse T cells in some RICM frames. enricher: test folders
  exist (mcf7 test_set/ 8 pairs, ricm test/ 10 pairs), so splits_provided true (was false).'
