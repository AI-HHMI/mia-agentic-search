title: 'W2S: Widefield2SIM joint denoising and super-resolution dataset'
short_name: W2S widefield-to-SIM restoration pairs
description: 360 image sets of human cells (120 fields of view x 3 wavelengths) imaged on a Nikon SIM setup. Each set has
  widefield low-resolution images at five noise levels (1, 2, 4, 8, 16 averaged captures), a noise-free widefield image (average
  of 400 captures) and a 2x higher-resolution SIM image, all aligned.
