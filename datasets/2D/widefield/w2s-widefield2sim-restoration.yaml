notes: 'Restoration pairs (no annotations). Full original W2S; the catalog record zenodo-10925783 is only the 120-image noisy
  subset released for the AI4Life-MDC24 challenge. W2S_raw.zip lists (tools/peek_archive.py) 1080 .npy files plus 1 .txt, raw/ImageNNN/
  with wf_channelK.npy (400 widefield captures, 209.7 MB each), sim_channelK.npy (2.1 MB) and sim_input_channelK.npy (7.9 MB);
  archive is 43.7 GB compressed, 79 GB uncompressed (size_bytes left null: the HTTP content-length header was 0). Widefield
  512x512, SIM 1024x1024 (paper). Pixel size and microscope details are not stated on the GitHub page or in the paper main
  text (setup details are in the supplement, not read); no license is stated on the GitHub page, the zip host or in the paper;
  authors list not extracted from the pages read. Paper DOI not verified, so only the arXiv URL is given.'
