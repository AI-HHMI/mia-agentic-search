description: 2,253 multi-channel ND2 acquisitions of HeLa cells (453 untreated plus 450 each treated with
  nocodazole, Rac1 inhibitor, taxol or Y-27632) imaged at 60x with several optical modalities (brightfield,
  RICM, widefield fluorescence, TIRF, confocal; 11 channels). The 453 untreated cells have actin and nucleus
  annotation TIFF masks. Metadata includes TIRF penetration depths and blank reference acquisitions.
