notes: 'Zenodo record has no description; one 35 GB zip. peek_archive listing (3,183 files): hela/ 453 ND2, hela_annotations/actin
  and /nucleus 453 TIFF each, nocodazole, rac1_inhibitor, taxol, y27632 450 ND2 each (no annotations), metadata/
  with 2 CSV (hela_cells_with_neighbours, tirf_penetration_depth) and blank ND2 files. Paper is not open access
  (Europe PMC abstract only; Sci Data page needs a login redirect), so modalities, channel count (also in file
  names: 11Channel) and the annotated mask types (abstract: nuclei and footprint) are from the abstract and folder
  names, and do not fully agree (folders say actin and nucleus). Pixel size, mask annotation procedure and splits
  not found. Annotation coverage partial: only untreated HeLa. Modality list order: widefield first as a best guess.'
