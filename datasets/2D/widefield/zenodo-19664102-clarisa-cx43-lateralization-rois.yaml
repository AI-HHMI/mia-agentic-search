id: zenodo-19664102-clarisa-cx43-lateralization-rois
title: CLARISA Connexin-43 fluorescence sections with terminal/lateralized ROI labels
short_name: Rat heart connexin-43 ROIs (fluorescence)
description: Seven large fluorescence immunohistochemistry images (six annotated whole tissue sections plus one independent
  test section) of Wistar rat left-ventricular cryosections stained for connexin-43 (CX43) and F-actin, imaged on a Zeiss
  Axio Imager Z2 with ApoTome.2. A single domain expert labelled 3,139 CX43-positive regions of interest (bounding boxes)
  as terminal (1,969) or lateralized (1,170); a section-level train/validation/test split (IM6, IM9, IM133 / IM1315 / IM1313,
  IM1314) is used in the paper. Images are on Zenodo; the ROI annotations are `.spydata` files in the CLARISA GitHub repository.
