notes: 'Seven TIFF sections (about 876 MB) on Zenodo, CC-BY-4.0: im6, im9, im133, im1313, im1314, im1315 at 0.227 um/px and
  the independent test section im15 at 0.3 um/px. The ROI labels are not in the Zenodo file list; they are six .spydata files
  in the GitHub repo dgattari/CLARISA (data/dataset), which shows no license file, and the README points to the Zenodo record
  for the images. im15 has no .spydata file in that listing. Single expert annotator (paper reports a repeat-annotation check).
