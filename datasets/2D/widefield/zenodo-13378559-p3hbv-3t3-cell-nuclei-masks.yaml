notes: 'Zip listing (8,895 members): 75 raw .tif (250 MB) in folders by film concentration (1.0-3.0 %) and sample, with 4,365
  cell_masks and 4,408 nuclei_masks .png files (a few folders use cell_mask/). The description says images were taken on a
  Leica DMI8 fluorescence microscope with 20x in the file names; image size, pixel size and annotation method (manual vs.
  tool-assisted) are not stated, and the TIFF header has no usable calibration, so voxel size is null and annotation source
  is recorded as unknown. No paper is linked on the record and none was found; the record has no related identifiers. Mask
  counts differ slightly between cells and nuclei per image. enricher: raw TIFFs are RGB composites (FITC green + DAPI blue,
  LZW, 1440x1920x3); masks are one binary PNG per cell or nucleus.'
