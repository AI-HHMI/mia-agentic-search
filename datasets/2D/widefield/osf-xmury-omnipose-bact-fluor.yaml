notes: 'Sibling of osf-xmury-omnipose-bact-phase (same OSF project xmury, folder datasets/bact_fluor): fluorescence channels
  with the phase-contrast labels transferred, so different images (paper: 33,200 cells; 14,587 in test). OSF API listing:
  591 files, 692,188,684 B incl. .DS_Store; train_sorted 143 images each with *_masks.tif and *_flows.tif; test_sorted 75
  image/mask pairs; groups A22, bthai, cex, vibrio, wiggins. Licence is the project-root license.txt (CC BY-NC 3.0, also named
  in the paper''s Data Availability), applied by location. Pixel size, organism per folder and fluorophore per image not stated
  in listing or paper; left null/empty. enricher: listing, headers and one sample pair checked; voxel size still not stated
  (paper, OSF wiki, headers).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "datasets/bact_fluor/ (OSF project xmury)\n  train_sorted/<group>/<name>.tif + <name>_masks.tif + <name>_flows.tif\
      \   143 triples\n    A22 14, bthai 28, cex 35, vibrio 7, wiggins 59\n  test_sorted/<group>/<name>.tif + <name>_masks.tif\
      \   75 pairs\n    A22 2, bthai 6, cex 2, vibrio 7, wiggins 58\n579 .tif + 12 .DS_Store = 591 files, 692,188,684 B\n"
    n_files: 591
    listing_complete: true
  sample:
    urls:
    - https://osf.io/download/62f59a31170d5207c7c27ab0/
    - https://osf.io/download/62f5970d21d7ec0810c70d56/
    size_bytes: 490512
    description: test_sorted/wiggins/wiggins_ensemble_fluor_73.tif and its _masks.tif (a median-sized pair).
  arrays:
  - role: raw
