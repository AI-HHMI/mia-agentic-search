    - 0
    - 65535
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: label
    path_pattern: '{train,test}_sorted/*/*_masks.tif'
    format: tiff
    axes: yx
    shape:
    - 350
    - 350
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 0
    - 62
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: <name>_masks.tif sits beside <name>.tif in the same group folder; identical shapes in every probed pair
      (350x350, 335x284).
  notes: 'Listing of datasets/bact_fluor by a scratch script over the OSF API (paginated, exact per-file sizes; tools/listing.py
    has no OSF support, so size_source is page-stated). 218 image/mask pairs (143 train, 75 test) + 143 *_flows.tif (precomputed
    Cellpose/Omnipose flow targets, train only; not listed as an array) + 12 .DS_Store. Raw glob *[!s].tif excludes *_masks.tif
    and *_flows.tif (no image name ends in s). Shapes vary: 335x284 (vibrio) to 2038x2038 (cex). Sample wiggins_ensemble_fluor_73:
    raw uint16 350x350 uncompressed, 0..65535 (full range, normalization undocumented); mask uint16 0..62, 63 values (instance
    IDs, matches the docs). Value ranges from one pair. Voxel size not found; checked: TIFF headers (no calibration), paper
    Methods (only generic "about 0.1 um"; four labs and microscopes), OSF wiki home, OSF project root. Organism per group
    folder not stated. 2D record: the miao layout covers 3D only, so it stays not download-ready.'
