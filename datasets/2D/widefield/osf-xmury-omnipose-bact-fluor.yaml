short_name: Bacterial cell segmentation (fluorescence)
description: 'bact_fluor training and test sets from the Omnipose project: fluorescence micrographs (cytosolic and membrane
  labels) of morphologically diverse bacteria, each with a 16-bit instance label mask obtained by applying the manual phase-contrast
  annotations to the matching fluorescence channel. Organised as train_sorted and test_sorted folders per species or source.'
