  notes: 'Listing of the data zip alone: 41,275,333 B exact, 381 members (the record size covers the data
    zip only; the separate model zip is not training data). Probed and sampled one S. aureus pair (JE2NileRed_..._001_1):
    raw uint16 256x256, range 3800-15520, ImageJ calibration 79.9 nm/px (matches the 80 nm stated for
    S. aureus); mask uint16 with 91 distinct values (max 141), so instance IDs. normalization none is
    inferred from raw 16-bit values without clipping. Only S. aureus files were inspected; E. coli and
    B. subtilis image sizes and pixel sizes (79/65 nm per the docs) were not checked. Notes.txt says the
    data are pooled train/test images of the three species, prepared for StarDist/SplineDist.'
