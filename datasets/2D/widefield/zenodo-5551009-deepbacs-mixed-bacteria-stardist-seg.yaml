notes: 'Zip listing (peek_archive, 381 members): training/source 155 + training/target 155, test/source
  35 + test/target 35 TIFFs (380 total, counted as n_items). Mixed pixel sizes per species, so voxel_size_nm
  is null; per-species values are in sample. Microscopes, pixel sizes and manual annotation are from the
  Zenodo description and paper. The single StarDist model zip is not part of the data. Related to the
  single-species DeepBacs records but a different, combined dataset. Mask values were not inspected. enricher:
  size confirmed by listing the data zip (model zip excluded); masks are instance IDs per sample.'
