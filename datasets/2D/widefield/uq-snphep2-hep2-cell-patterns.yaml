title: SNPHEp-2 dataset
short_name: HEp-2 cell staining patterns (IIF)
description: 1,884 cell images cut from 40 indirect immunofluorescence specimen images of HEp-2000 slides, each with a cell mask
  extracted from the DAPI channel and one of five staining-pattern labels (centromere, coarse speckled, fine speckled,
  homogeneous, nucleolar), with a 905/979 train/test split and five-fold validation.
