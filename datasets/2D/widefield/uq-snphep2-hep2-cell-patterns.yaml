notes: 'Single dataset page (read in full). Terms: NICTA license, free for non-commercial research, teaching and personal use, must cite NICTA and Wiliem et al., WACV 2013, pp. 95-102, derived versions must be marked, no commercial use (custom, non-commercial). Images zip is about 3 MB (the page); the server reports no size so it could not be listed with peek_archive, hence format, file layout and mask encoding are unverified (formats other). A roughly 1 GB patch-feature tar.gz is also linked. The paper was not found in Europe PMC or Crossref, so it is cited only in notes. Image size, pixel size and species are not stated on the page; masks come from the DAPI channel (automatic); who assigned the pattern labels and how is not stated on the page (source mixed).'
