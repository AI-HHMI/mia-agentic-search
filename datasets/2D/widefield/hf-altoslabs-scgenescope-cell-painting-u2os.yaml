  notes: 'HF listing of the repo (tools/listing.py): 54 files, 594.8 GB; the 28 files under measured/imaging sum
    to 120,929,129,253 B (data.size_bytes). Smallest zip (round_1/batch3/MIC1227_CP_Batch3_Plate3B_1) listed: 1,630
    TIFFs, 326 per channel folder, 82.2 MB unpacked. Probed AGP crop: 224x224 uint8, uncompressed, one page. Sampled
    AGP (range 3-254) and DNA (0-140) of crop A2-Site_0; ranges from this one crop only. Per the paper appendix,
    crops are nuclei-centred 224x224 boxes from the focal plane of 2250x2250x13 widefield stacks (CellPose nuclei);
    per-channel percentile clipping, standardization and min-max normalization are described for model inference,
    and whether the uint8 crops carry them isn''t stated, so normalization is unknown. Treatment labels: not in
    the zips; presumably the round_*.h5 manifests (PyTables table, 449,238 rows in round 1), not verified. Voxel
    size not found; checked: TIFF tags (no calibration), HF dataset card (licence only), paper appendix A.1 (Nikon
    Ti2E, 40x NA 0.95, 2250 px FOV; no pixel size).'
