notes: 'Size 120,929,129,253 B is the sum of files under measured/imaging (HF tree API); the repo also holds scRNA-seq h5ad
  files (features/ folders), total repo 646 GB. Image zips (plate.zip per plate) hold single-cell TIFF crops (peeked one 684
  MB zip: 20,940 tiffs); measured/imaging/round_1.h5 and round_2.h5 contents not inspected. Labels are per-treatment (28 chemicals),
  not masks; label file layout not inspected. Imaged on a Nikon Ti2E, 40x NA 0.95 epifluorescence (paper appendix); pixel
  size and crop size not stated. Paper: 716,767 scImages; train/val/WE test/HE test = 146,389 / 138,842 / 138,842 / 231,710
  images. HF viewer fails with 401 on a plate.zip, files are not gated per API. Dataset card empty except licence.'
