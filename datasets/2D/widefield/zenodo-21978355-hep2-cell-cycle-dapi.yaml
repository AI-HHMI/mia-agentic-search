notes: 'Zenodo 18337703 (concept id) resolves to v3, 10.5281/zenodo.21978355. Counts from the Zenodo page: ExpD 10,000 patches, CNN-D 100,000, DAPI_Full_FOV 1,000 (n_items 111,000); listed ExpD (class folders of .webp) and DAPI_Full_FOV (1,000 .webp) with peek_archive; CNN-D zip not listed. Pixel size 0.46510 um (465.1 nm) and 20x from the paper Methods (PMC13534591). ExpD labelled by two immunology experts with consensus; CNN-D pre-classified by a VGG16 trained on ExpD then expert-reviewed, so source is mixed. Full-field images are unlabelled. WebP is not in the schema format list, hence other. No split files seen.'
