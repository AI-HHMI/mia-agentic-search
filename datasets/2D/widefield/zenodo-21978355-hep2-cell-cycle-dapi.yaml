id: zenodo-21978355-hep2-cell-cycle-dapi
title: The human epithelial cell cycle dataset for deep learning and biomedical research (HEp-2 dataset)
short_name: HEp-2 cell cycle phase images (DAPI)
description: DAPI-stained HEp-2 cells on glass slides imaged by a 20x inverted fluorescence microscope, released as 256 x 256 single-cell patches classified into interphase, prophase, metaphase, anaphase, telophase, triple (division defects) and artefact, plus 1,000 full 1936 x 1216 fields of view. ExpD holds 10,000 patches labelled by two immunology experts; CNN-D holds 100,000 patches pre-classified by a VGG16 network and reviewed by the experts.
