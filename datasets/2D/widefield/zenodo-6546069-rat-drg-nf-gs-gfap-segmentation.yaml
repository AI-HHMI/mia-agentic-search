notes: 'Pixel size 0.908 um/pixel and 2541 images (847 per marker) are from the paper Methods; the channel count is not stated (folder names DAPI and GFAP appear in the listing; the paper names NF, GFAP and GS markers). Only 15 images per marker (3 expert annotators, STAPLE consensus) are manual ground truth (12 NF and 24 GS/GFAP images used for training); masks for the remaining images are deepflash2 model predictions, hence annotations.source mixed and coverage partial. Annotations_ratDRG.rar could not be listed remotely (rar), so annotations_verified is false; one zip (sham_d14_rat3.zip) was listed: 128 tif images and 192 png files. 26 files, 18.2 GB in total, one zip per animal plus 3 model zips and the annotations rar; no single direct archive, so download_url is null.'
