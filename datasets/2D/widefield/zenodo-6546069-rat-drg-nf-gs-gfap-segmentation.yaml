notes: 'Pixel size 0.908 um/pixel and 2541 images (847 per marker) are from the paper Methods. Only 15 images per marker (3 expert annotators, STAPLE consensus) are manual ground truth (in Annotations_ratDRG.rar, rar, not listable remotely); the per-image masks in the animal zips (<marker>_pred/masks) are deepflash2 model predictions, hence annotations.source mixed and coverage partial. 26 files, 18.2 GB, one zip per animal plus 2 model zips and the annotations rar; no single archive for the whole dataset. enricher: channels 4 (DAPI, GFAP, GS, NF folders per section in every listed zip; was null). enricher: annotations_verified true (mask PNGs listed and sampled). enricher: download_url set to the Zenodo record (many files; was null).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: |-
      ./                                          26 files   18.2 GB  .zip 25, .rar 1 (Annotations_ratDRG.rar)
      zip contents (20 of 25 zips expanded; 6923 members):
      GS+GFAP model.zip/GS+GFAP/                   3 files  293.6 MB  .pth
      NF model.zip                                 (not expanded)
      {SNI,sham}_d{7,14}_rat#.zip/<animal>/<section>/ (23 animal zips; sections L4CL, L4IL, L5CL, L5IL)
        DAPI/NNNN.tif                       raw channel, uint16
        GFAP/NNNN.tif                       raw channel, uint16
        GS/NNNN.tif                         raw channel, uint16
        NF/NNNN.tif                         raw channel, uint16
        GFAP_pred/masks/NNNN.png            predicted binary mask
        GFAP_pred/uncertainties/NNNN.png    prediction uncertainty map
        GS_pred/masks/NNNN.png
        GS_pred/uncertainties/NNNN.png
        NF_pred/masks/NNNN.png
        NF_pred/uncertainties/NNNN.png
      e.g. sham_d14_rat3.zip: 320 members, 128 .tif (914.0 MB) + 192 .png (74.8 MB) uncompressed
    n_files: 26
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/6546069/files/sham_d14_rat3.zip::sham_d14_rat3/L4CL/NF/0001.tif
