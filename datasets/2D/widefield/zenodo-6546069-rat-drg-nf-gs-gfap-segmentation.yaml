    shape_varies: true
    dtype: uint16
    compression: none
    value_range: [155, 16383]
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Neurofilament (NF) channel. Single-page TIFF (tiff_layout shaped, axes yx). File sizes differ (7.9-12.9 MB), so shapes vary per image.
  - role: raw
    path_pattern: '*.zip/*/*/GS/*.tif'
    format: tiff
    axes: yx
    shape: [2042, 1926]
    shape_varies: true
    dtype: uint16
    compression: none
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Glutamine synthetase (GS) channel; same file names and sizes as the NF channel of the section (header of NF probed; GS not probed separately).
  - role: raw
    path_pattern: '*.zip/*/*/GFAP/*.tif'
    format: tiff
    axes: yx
    shape: [2042, 1926]
    shape_varies: true
    dtype: uint16
    compression: none
    normalization: unknown
    alignment: not-applicable
    alignment_notes: GFAP channel; same file names and sizes as the NF channel of the section (not probed separately).
  - role: raw
    path_pattern: '*.zip/*/*/DAPI/*.tif'
    format: tiff
    axes: yx
    shape: [2042, 1926]
    shape_varies: true
    dtype: uint16
    compression: none
    normalization: unknown
    alignment: not-applicable
    alignment_notes: DAPI channel (no masks); same file names and sizes as the NF channel (not probed separately).
  - role: label
    path_pattern: '*.zip/*/*/NF_pred/masks/*.png'
    format: png
    axes: yx
    shape: [2042, 1926]
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range: [0, 255]
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: NF-positive neuronal somata
    alignment: same-grid
    alignment_notes: 'Pairing rule: <section>/NF_pred/masks/NNNN.png labels <section>/NF/NNNN.tif (same shape in the sample). deepflash2 predictions (automatic), not manual annotations.'
  - role: label
    path_pattern: '*.zip/*/*/GS_pred/masks/*.png'
    format: png
    axes: yx
    shape: [2042, 1926]
    shape_varies: true
    dtype: uint8
    compression: deflate
    encoding: binary
    classes:
    - id: 255
      name: GS-positive ring-shaped glial cells
    alignment: same-grid
    alignment_notes: 'Pairing rule: <section>/GS_pred/masks/NNNN.png labels <section>/GS/NNNN.tif. deepflash2 predictions (GS+GFAP model); not sampled, binary 0/255 assumed from the NF mask sample only.'
  - role: label
    path_pattern: '*.zip/*/*/GFAP_pred/masks/*.png'
    format: png
    axes: yx
    shape: [2042, 1926]
    shape_varies: true
    dtype: uint8
    compression: deflate
    encoding: binary
    classes:
    - id: 255
      name: GFAP-positive ring-shaped glial cells
    alignment: same-grid
    alignment_notes: 'Pairing rule: <section>/GFAP_pred/masks/NNNN.png labels <section>/GFAP/NNNN.tif. deepflash2 predictions (GS+GFAP model); not sampled.'
  notes: >-
    Listing: tools/listing.py on the Zenodo record, 26 files, 18,182,466,983 bytes (file-listing, complete); with
    --expand-zips 20 of 25 zips were expanded (6923 members), the rar cannot be listed. Probed (zip members of
    sham_d14_rat3.zip): NF/0001.tif uint16 2042x1926 uncompressed single page; NF_pred/masks/0001.png and
    uncertainties/0001.png uint8 grey 2042x1926 (the *_pred/uncertainties/*.png files are per-pixel model uncertainty maps, same grid; not listed as an array). Sampled NF/0001.tif (5.4 MB compressed in zip): 155-16383, p50 272,
    saturated at the 14-bit maximum (16383); NF mask values {0: 3614768, 255: 318124}. Value ranges are from this one
    sample only. Class names from the paper (NF model segments NF-positive neuronal somata; GS+GFAP model segments
    ring-shaped glial cells). The manual expert annotations (15 images per marker, 3 annotators) are only in
    Annotations_ratDRG.rar, which could not be inspected; its layout is unknown. The GS+GFAP model zip holds .pth weights
    (not opened). Data offered as 26 separate files on Zenodo, no single archive; direct files are
    https://zenodo.org/records/6546069/files/<name>.
