id: gigadb-100888-fluorescence-denoising-pairs
title: Paired low/high-exposure fluorescence microscopy images for denoising (GigaDB 100888)
short_name: Paired low/high-SNR fluorescence (denoising)
description: Six datasets of whole fluorescence images recorded as pairs with short (low-SNR) and long (high-SNR) exposure, or low and high laser power and detector gain on a confocal. Five widefield sets were taken on an Olympus IX83 (60x with two noise levels, 20x, 100x nucleus and 100x membrane) and one on a Leica SP5 confocal. Samples are a FluoCells No. 1 slide (actin and mitochondria in bovine pulmonary artery endothelial cells) and HepG2 cells with a DiI membrane stain. The paper provides CARE, Noise2Void and BM3D baselines.
