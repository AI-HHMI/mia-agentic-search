notes: 'The GigaDB page is a JavaScript app and the CNGB FTP listing returned 404, so the file listing
  was not seen (file formats unknown, hence formats other; annotations_verified false). Facts come from
  the DataCite record (CC0-1.0, about 1 GB) and the paper (Table 1: 100, 100, 100, 79, 104 and 84 image
  pairs; image sizes 2048x2048, 1024x1024 or 512x512; pixel sizes 108, 108, 325, 96, 65 and 65 nm for
  datasets 1-6, so voxel_size_nm is null as it varies; n_items is the sum 567 of those counts, and it
  is unclear whether datasets 1-3 and 4 hold one pair per channel, since they have actin and mitochondria
  channels). The paper says the last 10% of images in each dataset were used for testing, but no official
  split is stated in the deposit. The paper text states all files are CC0 with a request for attribution.
  Channel count per image is not stated. enricher: GigaDB file API lists 42 files, 15.28 GB (was 1 GB
  from DataCite); data are 16-bit multi-page TIFF stacks (formats tiff).'
