notes: 'No manual labels: the usable training signal is the separate fluorescence channels (actin, tubulin, nuclei), which
  the muSplit paper (ICCV 2023) sums to create superimposed inputs for learned image decomposition (three tasks: Actin vs
  Tubulin, Actin vs Nuclei, Tubulin vs Nucleus), so this is a borderline fit for the usable criteria and ml.tasks is other.
  Zenodo record and zip listing checked: PaviaATN.zip holds one multi-page TIFF (OptiMEM100x014.tif, ~3.6 GB uncompressed),
  README.md and LICENSE.txt (CC BY 4.0). Optical mode is stated as a Crest V3 spinning-disk confocal used in widefield mode.
  The paper splits 80/10/10 for its own experiments, but the dataset ships no split files. enricher: voxel size 65 x 65 nm
  from the TIFF''s ImageJ calibration (15.384615 px/um, unit micron; plausible for 100x widefield; README and paper give none;
  was null). enricher: the TIFF holds 61 frames x 4 channels (ImageJ images=244), README says 62 images.'
