notes: 'No manual labels: the usable training signal is the separate fluorescence channels (actin, tubulin, nuclei),
  which the muSplit paper (ICCV 2023) sums to create superimposed inputs for learned image decomposition (three tasks:
  Actin vs Tubulin, Actin vs Nuclei, Tubulin vs Nucleus), so this is a borderline fit for the usable criteria
  and ml.tasks is other. Zenodo record and zip listing checked: PaviaATN.zip holds one multi-page TIFF
  (OptiMEM100x014.tif, ~3.6 GB uncompressed), README.md and LICENSE.txt (CC BY 4.0). The record text says 62 images
  of 2720 x 2720 with 4 channels; the TIFF page layout was not inspected. Pixel size is not stated in the README,
  Zenodo record or the paper (arXiv v5 text, including supplement S.3), so voxel_size_nm is null. Optical mode is
  stated as a Crest V3 spinning-disk confocal used in widefield mode. The paper splits 80/10/10 for its own experiments,
  but the dataset ships no split files.'
