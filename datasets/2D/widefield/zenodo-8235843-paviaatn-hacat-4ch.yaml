description: 'PaviaATN: 62 four-channel fluorescence microscopy images (2720 x 2720) of human HaCaT keratinocytes expressing
  GFP-tubulin, RFP-LifeAct and a FastFUCCI cell-cycle reporter, imaged on a Nikon Ti2 with a 100x silicon oil objective. Channels
  label nuclei (two channels), actin and tubulin. Introduced for the muSplit image-decomposition benchmark (ICCV 2023), where
  the separate channels serve as ground-truth targets for splitting superimposed structures.'
