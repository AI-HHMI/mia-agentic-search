notes: 'Counts from the archive listing (peek_archive): images train 1706 / val 213 / test 214, masks 6068 / 769 / 756. Crops
  are 200x200 MIP images from 100x oil objective z-stacks (40-50 slices at 0.21 um; paper Methods); pixel size not stated
  on the SSBD page or in the paper text. Only wild-type SK1 cells; gip1-delta images are not in this set. The full SSBD project
  (10.5 GB) also holds raw Leica Thunder data and figure data; this record covers the annotated MMdet dataset zip. Annotation:
  manual ROIs in Fiji on cropped cells. enricher: size_bytes = zip size from file listing (was 340.7 MB uncompressed).'
