schema_version: '1.2'
id: lha-dlbcl-macrophage-ihc-fluorescence-masks
title: Image dataset for automated macrophage detection in immunostained lymphoma tissue (DLBCL)
short_name: DLBCL macrophage IHC cell masks (fluorescence)
description: Four-channel (CD14, CD163, Pax5, DAPI) fluorescence slide-scanner images of 44 immunostained diffuse large B-cell
  lymphoma tumour subregions, cut into 1000 x 1000 pixel tiles, with automatically generated segmentation masks for macrophages
  (CD14, CD163, double-stained), B-cells and all nuclei, convex-hull masks, ROF-filtered versions and an evaluation-region
  mask per tile, plus BCL2 scores per specimen.
