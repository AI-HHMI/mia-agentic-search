notes: 'Hosted at the Leipzig Health Atlas as 46 zip files (one per specimen, two split in a/b; sizes in the paper Table
  3 sum to 17,444 MB, so size_bytes is that number times 1,048,576), each with its own LHA ID (example 7YXMMFNPDG-0 for specimen
  01, read; the page lists the file as 161 MB, CC0 1.0); snapshots also in GigaDB per the paper. n_items counts the 44 specimens
  (tiles of 1000 x 1000 pixels inside each zip, 19 files per tile). Pixel size is derived from the paper figure legend
  (1,000 x 1,000 pixels = 450 x 450 um). The masks are produced by an automated reference method (Wagner et al.), not
  by hand, so annotations source is automatic and they are not ground truth in the manual sense. Zip contents were not
  listed (LHA download not tried); the file naming and mask types come from the paper Dataset structure section, hence
  annotations_verified false. Plain download link not found because each specimen has its own page.'
