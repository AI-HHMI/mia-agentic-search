  notes: 'Size: sum of the exact per-file sizes in Files.json (7,348 files, 82,068,852,699 B; the top-level
    list files are not counted), so page-stated; tools/listing.py was not run. Probed Tb427.01.2670_4_C_1.tif
    (ImageJ cyx 3x2160x2560 uint16, uncompressed, spacing 0.1032 um, display min 138 max 17974) and _thr.tif
    (ImageJ 2x2160x2560 uint8); no pixel data sampled. Read the field JSON. Voxel size 103.2 nm from the
    ImageJ header; the paper Methods (PMC10209625) state a single 63x NA 1.4 objective with an Andor Neo
    v5.5 camera, consistent with 103 nm/px. Channel order of the 3 channels is not stated (phase contrast
    objective, mNG, Hoechst per Methods). No single archive: download_url is the Files/ folder; files
    are direct https URLs.'
