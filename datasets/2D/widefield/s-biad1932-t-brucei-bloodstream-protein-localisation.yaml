notes: 'Counts come from Files.tsv (1,836 each of corrected image, localisation annotation, cell ROI and
  thresholded image files; 264 gene IDs). Differs from the genome-wide procyclic TrypTag deposit S-BIAD1866
  (different life-cycle stage, strain and imaging protocol: bloodstream form Lister 427, lightly fixed
  cells, a 63x NA 1.4 phase objective on a Leica DM5500 B with Andor Neo sCMOS); the deposit layout and
  annotation scheme are analogous. The stated coverage is that all generated cell lines were annotated;
  labels are per cell line and repeated per image. Cell ROIs are automated. Authors are those of the associated
  paper. enricher: voxel size 103.2 nm and channels 3 from the ImageJ header, single 63x objective per
  paper Methods (was null); size from Files.json.'
