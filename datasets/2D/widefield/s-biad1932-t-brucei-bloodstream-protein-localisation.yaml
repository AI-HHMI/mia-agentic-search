title: 'Trypanosoma brucei bloodstream form tagging: Targeted subcellular protein localisation'
short_name: T. brucei bloodstream form protein localisation
description: Widefield epifluorescence images of bloodstream-form Trypanosoma brucei Lister 427 cell lines expressing proteins endogenously tagged with
  mNeonGreen at the N or C terminus (lightly fixed, Hoechst-stained), 1,836 corrected images from 264 genes, each with a per-image protein localisation annotation made
  by at least three experts, automatically detected single-cell regions of interest and a thresholded image, in a directory structure like the TrypTag procyclic-form deposit.
