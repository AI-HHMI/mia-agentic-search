notes: 'Three zips of PNG crops in slender/ and stumpy/ folders (train 20,570, validation
  6,362, test 6,363 files = 33,295, matching the paper''s 14,325 slender + 18,970
  stumpy cells). Zenodo also holds two notebooks. Crops come from 828 widefield images
  (ZEISS Cell Observer, 63x/1.4 oil, 0.103 um pixel) and were cut by Cellpose; which
  channel the crops show (brightfield, GFP or Hoechst were acquired) is not stated,
  and the 103 nm pixel size is the original camera value, not verified for the 299x299
  crops. Classes were visually confirmed per paper; Zenodo''s Excel split files are
  not in the file list fetched. Sources checked: Zenodo record and zip listings, paper
  full text (Europe PMC).'
