notes: 'Paper (ECCV Workshops 2020, arXiv:2003.05961, no DOI found) Section 4.1 gives the split: 240 training and 120 test sets. Pixel size not stated on the GitHub README, the EPFL listing or the paper main text (supplement not read). No license or terms found on the GitHub page, README or EPFL bucket listing. Zip contents listed with peek_archive: 1080 .npy files (Image002.., wf/sim/sim_input per channel) plus one .txt, 79 GB uncompressed. File extension .npy is not a listed format so formats is other. Microscope is a Nikon SIM setup (paper text reads "Eclipse T1").'
