title: 'W2S: Microscopy Data with Joint Denoising and Super-Resolution for Widefield to SIM Mapping'
short_name: W2S widefield-to-SIM denoising and SR pairs
description: 'Widefield2SIM (W2S): 120 fields of view of human cells imaged on a Nikon SIM (Eclipse T1) system in three channels
  (488, 561, 640 nm), giving 360 image sets. Each set holds 400 raw 512 x 512 widefield captures (from which noisy images
  averaging 1, 2, 4, 8 and 16 captures and a noise-free average are built) and one 1024 x 1024 SIM image, for joint denoising
  and super-resolution training.'
