notes: 'Synthetic microscopy: images are simulated (PSF and noise model) from mitochondria shapes segmented in published mouse-liver FIB-SEM data (EMPIAR-10791; masks verified and corrected by the source authors); no real optical images. Ten ~8.5 GB zips (27,272 instances) on DataverseNO. Paper Table 2 pixel sizes: Con1 70 nm, Epi1 109 nm, Conf2 48 nm; Table 1 swaps the Conf1/Conf2 folder descriptions, so voxel size is null. Ground truth is per-instance 3D shape (mesh, point cloud, occupancy), not pixel masks aligned to the images. enricher: dimensionality 2D (was 3D): every image TIFF is one 128x128 page, and the paper says z-stacks are not included. enricher: size from the Dataverse API file sizes (was the same total, approximate).'
