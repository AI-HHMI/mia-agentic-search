  notes: 'Listed: the Dataverse API (12 files, exact sizes) and the central directory of 1_1_2729.zip (68,193 members) via range requests from my own script, because tools/peek_archive.py and probe.py size files with HEAD, and dataverse.no answers HEAD from their User-Agent with a 583-byte 403 page. Sampled instance 1 (3 TIFFs, npz, mesh; 6.2 MB read). value_range is from one image per microscope. Each TIFF is a plain single page, 128x128 uint16, so axes yx. Size is the sum of the API file sizes (zipped); zip 1 is 21.1 GB uncompressed. Voxel size not set: per-microscope pixel sizes from paper Table 2, folder mapping ambiguous; code repo github.com/bioailab/3DMSL not checked (not reachable from this session). No single archive: 10 per-range zips, each at https://dataverse.no/api/access/datafile/<id> (ids in the Dataverse API). dataverse.no is not on TensorSwitch''s allowlist.'
