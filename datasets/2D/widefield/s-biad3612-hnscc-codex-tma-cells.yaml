title: Spatial analysis of head and neck cancer identifies two ecosystems with distinct modes of epithelial-to-mesenchymal
  transition
short_name: Laryngeal SCC CODEX cell polygons (multiplex IF)
description: CODEX multiplexed fluorescence images (31-marker panel plus DAPI) of 28 quality-controlled 2 mm cores from a
  human laryngeal squamous cell carcinoma tissue microarray (full stitched TMA plus per-core OME-TIFFs), with per-core GeoJSON
  cell and nucleus segmentation polygons (InstanSeg) and tumor-nest boundary polygons, plus per-cell marker-intensity tables.
  Annotations were produced computationally, so they are pseudo-labels rather than manual ground truth.
