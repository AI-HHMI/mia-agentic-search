notes: 'Listing: images/cores 28 OME-TIFFs, images/full_tma 1 QPTIFF (173.7 GB, not counted in n_items), annotations 28 cell/nucleus
  GeoJSON + 28 tumor-boundary GeoJSON, analysis_tables 2 CSVs. Segmentation polygons come from InstanSeg (DAPI plus ATP1A1/HLA-A/CD45)
  and tumor boundaries from a random-forest pixel classifier, i.e. no manual annotation. No associated paper is listed in
  the archive record. Core OME-TIFFs hold 77 channels (OME channel names); marker_panel.tsv lists the 31 markers retained
  after QC. enricher: size_bytes from the BioStudies file API (was null); Core_A2_tumor_boundary.geojson is 0 bytes.'
