notes: 'Listing (FTP/HTTP index): images/cores 28 OME-TIFFs (92.1 GB), images/full_tma 1 QPTIFF (173.9 GB, not counted
  in n_items), annotations 28 cell/nucleus GeoJSON (2.6 GB) + 28 tumor-boundary GeoJSON, analysis_tables 2 CSVs (1.2
  GB); total about 270 GB (sizes rounded, so size_bytes left null). Probed Core_A2.ome.tif: uint16, LZW, 5046x5683,
  77 channel planes, pixel size 0.5067 um stored in the OME header. Segmentation polygons come from InstanSeg
  (DAPI plus ATP1A1/HLA-A/CD45) and the tumor boundaries from a random-forest pixel classifier, i.e. no manual
  annotation. No associated paper is listed in the archive record (its Publication section is empty), so
  Methods text comes only from the BioStudies entry. Only 7 of the 31 markers are listed in labels_stains.'
