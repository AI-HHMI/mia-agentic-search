notes: 'HUVEC_IMG.zip listed with peek_archive: 326 TIFFs (about 2.1 MB each) in NIDDL/High_SNR and NIDDL/Low_SNR (163 pairs per the description), plus a .DS_Store. The ten videos (about 2.1 GB each) are separate TIFF files on the record. Usable as a restoration (denoising) pair set; no manual annotations. Pixel size, microscope and objective are not stated on the record, and no related paper is listed, so none was read; voxel size left null. n_items counts the TIFFs in the pair archive only. enricher: pixel size 400.933 nm from the MetaMorph spatial-calibration tags (20x objective, 2x2 binning) of the pair TIFFs and videos (was null); channels 1 from the headers (was null); size_bytes is now the whole record, 12 files incl. the videos (was the zip only).'
