notes: 'Synthetic images, not real micrographs. The zip has 10 folders (0.00, 0.11, 0.14, 0.20, 0.22, 0.29, 0.37, 0.46,
  0.51, 0.56), each with 30 cell, 30 cell_gt, 30 nucleus and 30 nucleus_gt PNGs (1392 x 1040 RGB, probed from the
  headers). The folder names are presumably the cell-overlap degree; the paper describes sequences of 30 images per
  segmentation task and overlap degree but the figshare page does not label the folders. Pixel size is not stated (the
  images are simulated). The real B cell images the simulation is modelled on are a separate figshare deposit
  (13102958). The paper states the data sets are available as supplementary material; the paper PDF and Additional
  files were not opened. Ground truth format (outline images) was probed for size and shape only, not viewed.'
