notes: 'Raw archive W2S_raw.zip (43.7 GB compressed, 1081 files: 1080 .npy plus one .txt) listed with
  peek_archive; size_bytes is the compressed zip size (79 GB uncompressed). The listing shows ImageNNN
  folders with wf/sim/sim_input channel arrays; the listing was truncated so the exact FOV count in the
  zip was not enumerated (paper: 120 FOVs x 3 channels). No license on the GitHub page, paper page or
  download location; pixel size not stated in the ar5iv text or GitHub README. Paper full text was not
  available through Europe PMC/Crossref (arXiv only, read via ar5iv); the ECCV 2020 DOI was not confirmed
  and is not given. Paper states a 240/120 train/test split of image sets. The landing page is the GitHub
  repo (code, normalized data, supplement); raw data is on the EPFL server. Relation to catalogued records:
  none matched in dedup. enricher: size_bytes from the zip Content-Length (was rounded). Zip readme.txt:
  120 FOVs, FOV 001-080 train, 081-120 test; no license in it.'
