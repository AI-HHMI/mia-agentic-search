title: 'W2S: Microscopy Data with Joint Denoising and Super-Resolution for Widefield to SIM Mapping'
short_name: W2S widefield-to-SIM denoising and SR pairs
description: Paired real fluorescence microscopy data from a Nikon SIM setup. For 120 fields of view in 3
  wavelength channels, noisy widefield captures (400 raw captures per channel; noise levels from averaging
  1, 2, 4, 8 or 16 captures), a noise-free widefield image (average of all 400) and the matching
  structured-illumination (SIM) high-resolution image. Released for joint denoising and super-resolution.
