title: A brain-wide, annotated dataset of WFA-positive perineuronal nets and parvalbumin neurons in the adult mouse brain
short_name: Mouse brain PNN and PV cell locations (widefield)
description: Two-channel fluorescence images (WFA for perineuronal nets, parvalbumin) of coronal brain slices from 7 adult
  C57BL/6J mice, with the (x, y) locations of detected PNNs and PV cells for each image, binary tissue masks, thumbnails,
  and files for alignment of each slice to the Allen Brain Atlas CCFv3 (QuickNII, VisuAlign, displacement fields).
