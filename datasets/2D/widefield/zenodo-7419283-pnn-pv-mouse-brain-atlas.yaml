notes: 'One 48.7 GB zip (79.2 GB uncompressed) with 7 mouse folders: 842 high-resolution TIFF images, 842 PNG tissue masks,
  1,684 CSV location files (two per image, one per channel), 14 XML and 7 JSON alignment files. The Zenodo text says the CSVs
  hold the locations of PNNs and PV cells detected in each image; the companion record (10.5281/zenodo.7886215) describes
  quality-controlled predictions of deep learning cell-counting models, so the points are treated as automatic, not manual.
  Pixel size and microscope are not stated on the Zenodo page or in the CC4B-info.xml read; the Cell Reports article is not
  open access, only its abstract was read. Records of the same atlas appear in the continuing deposit 7886215. enricher: the
  842 TIFFs are one file per channel (-C1 WFA/PNN, -C2 PV), 421 slices.'
