notes: 'Zip listed with peek_archive (7,630 members): data/training/cellpose has 7 cell TIFF + _seg.npy
  pairs and 5 DAPI nuclei TIF + _seg.npy pairs (~100 MB per TIFF), models/cellpose holds the two models,
  analysis/segmentation holds 7,604 PNG model outputs (not raw images). Preprint Methods: Leica epifluorescence,
  63x/1.40 oil, z-stacks max-projected (so 2D), Cellpose 2.2.3 masks with cell masks manually curated
  in napari (source mixed). Pixel size not stated on the Zenodo page or Methods; zip TIFF headers not
  probed. 12 pairs is near the size threshold. enricher: coverage partial (README: sparse human cell labels);
  seq_2nt cell images 103 nm/px per GitHub README, nuclei subset not stated, so voxel size left null.'
