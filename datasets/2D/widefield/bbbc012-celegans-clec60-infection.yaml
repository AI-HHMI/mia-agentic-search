notes: 'No license on the page (only "Copyright Broad Institute"), so spdx is unknown. Labels are the control group only,
  no per-worm masks. Weak training signal: image-level positive/negative controls. enricher: zip listing resolves the counts:
  pmk1_plate2 has 48 wells (M01-N24) and wt_plate2 72 wells (A01-C24), 3 channel files per well (w1 brightfield, w2 GFP, w3
  mCherry), 120 fields x 3 = 360 TIFFs; the page says 48 per control. enricher: pixel size not stated (TIFF header: binning
  2x2 of a 1392x1040 sensor, no calibration; page and Wahlby 2012 full text in PMC give only the 696x520 image size).'
