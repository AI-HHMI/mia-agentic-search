title: Data for size comparison of Escherichia coli single cells for segmentation error propagation
short_name: E. coli FM 4-64 single-cell masks (fluorescence)
description: 864 plane-selected, deconvolved FM 4-64 membrane-stained fluorescence images of single Escherichia coli MG1655 cells with two sets of segmentation masks per image, semi-manual contours made with the JFilament Fiji plugin and automatic masks from the Omnipose-based FMSeg model, used to assess how segmentation differences propagate into cell-size measurements.
