notes: 'Study record and HTTP file listing read: Ecoli_segmentation/Cells, FMSeg and JFilament each hold 864 TIFF files (9.9 MB, 4.3 MB, 4.3 MB; sizes rounded by the HTTP index), total about 20.2 MB. Paper (Communications Biology 2026, open access, Europe PMC) read; it describes the FMSeg Omnipose model, JFilament active-contour annotation and a DeltaVision Ultra microscope with 100x/1.45 NA objective and PCO Edge sCMOS camera, but the pixel size of these images is not stated in the study record or the paper text read, so voxel_size_nm is null. Images appear to be single-cell crops, but this is inferred from file sizes, not confirmed. Modality recorded as widefield because the study record says fluorescence microscopy on a DeltaVision widefield system with deconvolution. Annotation source is mixed: JFilament masks are semi-automatic with manual guidance, FMSeg masks are model-generated, and the record does not say which set is treated as ground truth.'
