notes: 'License CC0 read from the BioStudies record. Archive is a plain tar (despite .tar.gz name); only
  its first 2 MB were listed (train/nuclei_masks/*.tif), so the micronuclei mask folders, val/test folders
  and per-image counts were not seen. 232 images / 5685 micronuclei come from the Biosample description.
  The listed paper (eLife, Hatch lab) describes the MNFinder data; the mnDINO paper itself was not found
  in Europe PMC, so pixel size and annotation procedure for the mnDINO data are not confirmed (voxel size
  not stated on dataset page). Dimensionality, channels and widefield modality inferred from the microscope
  descriptions (epifluorescence). splits_provided inferred from the train/ folder name. enricher: size_bytes
  from the exact listing of all 3 files in Files/ (was the tar alone, 110 B less).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "Files/\n  annotated_mn_datasets.tar.gz  1,105,448,960 B (uncompressed tar despite the name)\n\
      \    annotated_mn_datasets/\n      train/{images,nuclei_masks}/<name>.tif\n      validation/{nuclei_masks,...}/<name>.tif\n\
      \      test/{images,nuclei_masks}/<name>.tif\n    names: IXMtest_<well>_s<site>_w1<uuid>.tif (520x696),\
      \ 2022-..._RPE1-N.tif, 2022-10-14_U2OS-N.tif,\n           20X_c0-DAPI_A1_Tile-N.tif (17.5 MB), 2023-05-31_misc-*.tif\n\
      \  MN_dataset.json, MN_dataset.tsv  (file list: only the tar)\n(folders seen by walking tar headers\
      \ at 9 offsets; no micronucleus-mask folder seen)\n"
    n_files: 3
    listing_complete: true
  sample:
    urls:
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/809/S-BIAD2809/Files/annotated_mn_datasets.tar.gz::annotated_mn_datasets/train/images/IXMtest_H17_s1_w10A751E6C-5D06-4147-AB73-7FFAE0B57CC5.tif
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/809/S-BIAD2809/Files/annotated_mn_datasets.tar.gz::annotated_mn_datasets/train/nuclei_masks/IXMtest_F21_s1_w1E2770CF6-417B-4804-9B45-6EE7D783D8CA.tif
    size_bytes: 1448192
    description: One ImageXpress image and one nuclei mask from train/ (not a matching pair); tar members
      can be read by byte range
  arrays:
  - role: raw
    path_pattern: annotated_mn_datasets.tar.gz::annotated_mn_datasets/{train,validation,test}/images/*.tif
    format: tiff
    axes: yx
    shape:
    - 520
    - 696
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 118
    - 1693
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: label
    path_pattern: annotated_mn_datasets.tar.gz::annotated_mn_datasets/{train,validation,test}/nuclei_masks/*.tif
    format: tiff
    axes: yx
    shape:
    - 520
    - 696
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 0
    - 116
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: nuclei_masks/<name>.tif has the same name as images/<name>.tif in the same split
      (e.g. 20X_c0-DAPI_A1_Tile-N in both); member sizes match per name type (724,096 B for IXMtest files
      in both folders). A matching pair was not opened.
  notes: 'Exact sizes from HTTP Content-Length of the 3 files in Files/ (MN_dataset.tsv lists only the
    tar). The tar is uncompressed, so a scratch script walked its 512-byte headers by range requests at
    9 offsets (112.6 MB read in total, mostly 20 MB chunks to find headers) and extracted two members.
    Image IXMtest_H17_s1: uint16 520x696 uncompressed, 118-1693 (p50 159), normalization unknown. Nuclei
    mask IXMtest_F21_s1: uint16 520x696, 117 values 0-116, consecutive: instance IDs. Member sizes differ
    by source (0.26-17.5 MB), so shape varies. A micronucleus mask folder was not seen in the headers
    read; the record annotations.format already notes this.'
