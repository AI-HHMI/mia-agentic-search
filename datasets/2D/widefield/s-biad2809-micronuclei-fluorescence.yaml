notes: 'License CC0 read from the BioStudies record. Archive is a plain tar (despite .tar.gz name); only its first 2 MB were listed (train/nuclei_masks/*.tif), so the micronuclei mask folders, val/test folders and per-image counts were not seen. 232 images / 5685 micronuclei come from the Biosample description. The listed paper (eLife, Hatch lab) describes the MNFinder data; the mnDINO paper itself was not found in Europe PMC, so pixel size and annotation procedure for the mnDINO data are not confirmed (voxel size not stated on dataset page). Dimensionality, channels and widefield modality inferred from the microscope descriptions (epifluorescence). splits_provided inferred from the train/ folder name.'
