notes: Zip listed with peek_archive (23,594 tif = 11,797 Images + 11,797 Labels, 5 FeatureMatrix.xlsx, 5 trSet_attributes.xml).
  Pixel size not stated on the Zenodo page, in the zip's xml or in the preprint Methods (checked). The preprint says cells
  were segmented with nucleAIzer and annotated by experts in Advanced Cell Classifier; the exact columns of the xlsx
  and which annotation lives in which file were not read, so the Labels/ masks are inferred to be the segmentations.
  Image count 11,797 is the Images/ folder count; size is 2.42 GB compressed zip (4.7 GB uncompressed). The page lists
  a newer version (v2, split and augmented) that is not catalogued here.
