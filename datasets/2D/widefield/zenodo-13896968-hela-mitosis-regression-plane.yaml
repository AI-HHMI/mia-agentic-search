id: zenodo-13896968-hela-mitosis-regression-plane
title: Deep regression plane training dataset for Morpho-Proteomic-Atlas-of-Mitosis
short_name: HeLa mitotic cell crops and masks (widefield)
description: 11,797 single-cell crops (224 x 224 px, padded with zeros) of live HeLa Kyoto cells expressing GFP-alpha-tubulin
  and H2B-mCherry, imaged by time-lapse widefield microscopy at 40x and 60x in five measurements, each with a matching
  label mask tif per crop and a FeatureMatrix.xlsx plus trSet_attributes.xml. Mitotic cells were placed by experts on a
  360-degree regression plane of mitosis (interphase, prophase to telophase), the training data for a mitotic-stage
  regression and classification network. Version 1 is the raw training dataset; a newer version holds the split and
  augmented set used in the article.
