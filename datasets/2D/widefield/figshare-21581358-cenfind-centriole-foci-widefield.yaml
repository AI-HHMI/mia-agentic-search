title: CenFind datasets - immunofluorescence max projections of human cells with centriole foci coordinates and nuclei masks
short_name: CenFind centriole foci and nuclei (widefield)
description: Five widefield immunofluorescence datasets (three hTERT RPE-1, one U-2 OS, one RPE-1 tp53-/- with Centrinone) of human tissue-culture cells stained for centriole, procentriole and PCM markers plus a DNA dye. Each dataset has max-projection TIFFs of 24 or 25 fields of view, manual X-Y point annotations of immunodetected foci per channel, nuclei masks, and train/test field lists, as used to train and test the CenFind / SpotNet detector.
