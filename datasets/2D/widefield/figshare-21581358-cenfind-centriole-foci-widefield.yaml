notes: 'One zip (cenfind_datasets.zip, 2.57 GB, 581 files: 248 .tif and 333 .txt; peek_archive). Folder names: RPE1wt_CEP63+CETN2+PCNT_1,
  RPE1wt_CP110+GTU88+PCNT_2, RPE1wt_CEP152+GTU88+PCNT_1, RPE1p53+Cnone_CEP63+CETN2+PCNT_1, U2OS_CEP63+SAS6+PCNT_1,
  each with projections/, annotations/, fields.txt, test.txt, train.txt. Paper Methods: 24-25 fields of view per
  dataset (about 31 cells each), max-projected, split into single-channel images, foci annotated with Labelbox as
  X-Y points, nuclei masks from automated plus manual freehand labelling; pixel size 102.5 nm (2048 px, 300 nm z-step
  before projection). The figshare record states MIT; the paper itself is open access. enricher: n_items 124 = projection
  TIFFs in the zip listing (was null); projections are 4-page TIFFs (Hoechst in channel 0, per paper).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "cenfind_datasets.zip (2.57 GB; 581 members)\n<dataset>/   (5: RPE1wt_CEP63+CETN2+PCNT_1, RPE1wt_CP110+GTU88+PCNT_2,\
      \ RPE1wt_CEP152+GTU88+PCNT_1,\n               RPE1p53+Cnone_CEP63+CETN2+PCNT_1, U2OS_CEP63+SAS6+PCNT_1)\n\
      \  fields.txt, train.txt, test.txt   (field name,channel lists)\n  projections/   24-25 <dataset>_MMStack_<n>-Pos_<r>_<c>_max.tif\
      \   (33.6 MB, 4x2048x2048 uint16)\n  annotations/cells/   24-25 <field>_max_C0.tif   (nuclei masks, 2048x2048\
      \ uint16)\n  annotations/centrioles/   62-64 <field>_max_C<1-3>.txt   (foci x,y per channel)"
    n_files: 1
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/38248110::U2OS_CEP63+SAS6+PCNT_1/projections/U2OS_CEP63+SAS6+PCNT_1_MMStack_5-Pos_000_000_max.tif
    - https://ndownloader.figshare.com/files/38248110::U2OS_CEP63+SAS6+PCNT_1/annotations/cells/U2OS_CEP63+SAS6+PCNT_1_MMStack_5-Pos_000_000_max_C0.tif
    - https://ndownloader.figshare.com/files/38248110::U2OS_CEP63+SAS6+PCNT_1/annotations/centrioles/U2OS_CEP63+SAS6+PCNT_1_MMStack_5-Pos_000_000_max_C1.txt
    size_bytes: 41944136
    description: 'U2OS field Pos_000_000: 4-channel max projection, its nuclei mask (C0) and the C1 foci point list
      (zip members, uncompressed sizes).'
  arrays:
  - role: raw
    path_pattern: '*/projections/*_max.tif'
    format: tiff
    axes: cyx
    shape:
    - 4
    - 2048
    - 2048
    shape_varies: false
    dtype: uint16
    compression: none
    value_range:
    - 121
    - 17481
    normalization: none
    alignment: not-applicable
    alignment_notes: 'Plain multi-page TIFF (tifffile QYX, 4 pages); pages are channels: paper says nuclei (Hoechst)
      are channel 0, markers in channels 1-3 (folder name order), and file suffixes _C0.._C3 index them.'
  - role: label
    path_pattern: '*/annotations/cells/*_max_C0.tif'
    format: tiff
    axes: yx
    shape:
    - 2048
    - 2048
    shape_varies: false
    dtype: uint16
    compression: none
    value_range:
    - 0
    - 5
    normalization: none
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: 'Nuclei masks of channel 0 (paper: automated box labelling refined by freehand segmentation).
      Sample has values 0-5, read as nucleus IDs (inferred). Pairing rule: <field>_max.tif <-> annotations/cells/<field>_max_C0.tif;
      same 2048x2048 grid.'
  - role: label
    path_pattern: '*/annotations/centrioles/*_max_C[1-3].txt'
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: none
    encoding: points-table
    classes: null
    alignment: same-grid
    alignment_notes: 'One text file per field and marker channel: lines "a,b" of focus pixel coordinates (paper:
      X-Y points from Labelbox; sample first line 184,393, so column order not confirmed). Pairing rule: <field>_max_C<k>.txt
      annotates channel k of <field>_max.tif.'
  notes: 'Listing: whole zip via tools/listing.py --expand-zips (581 members: 124 projections, 124 nucleus masks,
    318 point files, 15 lists; 2,567,537,809 B). Sampled U2OS Pos_000_000 (17.3 MB downloaded, deflated members):
    raw 4x2048x2048 uint16 121-17481 (p50 210); mask 2048x2048 uint16 values 0-5; ranges from one sample. TIFF member
    sizes equal shape x 2 bytes plus header, so compression none. normalization none: paper says 16-bit OME TIFFs
    were max-projected; contrast adjustment was only for annotation. train.txt/test.txt list field,channel pairs.
    Voxel size 102.5 nm from paper Methods (unchanged).'
