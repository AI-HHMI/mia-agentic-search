notes: 'One zip (cenfind_datasets.zip, 2.57 GB, 581 files: 248 .tif and 333 .txt; peek_archive). Folder names: RPE1wt_CEP63+CETN2+PCNT_1, RPE1wt_CP110+GTU88+PCNT_2, RPE1wt_CEP152+GTU88+PCNT_1, RPE1p53+Cnone_CEP63+CETN2+PCNT_1, U2OS_CEP63+SAS6+PCNT_1, each with projections/, annotations/, fields.txt, test.txt, train.txt. Paper Methods: 24-25 fields of view per dataset (about 31 cells each), max-projected, split into single-channel images, foci annotated with Labelbox as X-Y points, nuclei masks from automated plus manual freehand labelling; pixel size 102.5 nm (2048 px, 300 nm z-step before projection). n_items not summed from the archive listing. Whether the TIFF members hold single or multi-channel images was not checked, so channels is the paper-level count (three markers plus DNA). The figshare record states MIT; the paper itself is open access.'
