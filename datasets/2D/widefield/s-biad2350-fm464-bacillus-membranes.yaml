notes: 'Folders: Omnipose_training (143 raw images, 1144 deconvolved files, 143 masks) and Omnipose_benchmark
  (56 raw images and 56 test masks, plus model outputs). Total size and counts (1870 files, 41.5 GB incl.
  model segmentations) come from the BioStudies file listing, which also includes other model outputs;
  training+benchmark images and masks are a small fraction. Pixel size not stated on the BioStudies record
  or paper Methods; (enricher: benchmark raw TIFF header says 64.5 nm/px, not copied because no doc states
  it). Training images are max-projections of z-stacks (paper: 143 images, >7000 cells; 56 benchmark images).
  Licence shown as CC0 on BioStudies. enricher: channels 1 (single-page grayscale TIFFs); annotations_verified
  true (mask sampled).'
