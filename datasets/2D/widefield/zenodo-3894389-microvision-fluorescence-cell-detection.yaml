notes: 'Latest version (v3) of the Zenodo concept; earlier version 2632769 (2019, 94.8 MB, fewer images) is the same collection
  and was not recorded separately. Checked the Zenodo API record, microvision.zip index (12,598 files: 4,127 .jpg, 4,134
  .xml, 4,124 .txt, plus csv/py/name files) and the paper (Europe PMC full text, Methods). Images come from several
  widefield microscopes (Olympus IX73 100x NA 1.4, DeltaVision 60x, Zeiss Axiovert, Nikon TE300 40x/10x) with per-dataset
  pixel sizes not stated in one place, so voxel size is null. n_items counts .jpg files in the archive and includes
  repeated augmentation/subset variants if present (not verified). Organism inferred from cell line names (COS-7
  is Chlorocebus, not listed). The neuroblastoma phalloidin images come from the Cell Image Library with converted
  annotations. Paper figure licence footnote is CC BY-NC-SA, the Zenodo record says CC-BY-4.0, which was used.'
