description: MicroVision collection of widefield fluorescence images of several cell types (erythroblast,
  neuroblastoma, fibroblast, eukaryote, C127, HEK and COS-7 cells; DAPI, phalloidin, nucleopore and peroxisome
  stains) with manually drawn bounding boxes around each cell, pre-split into train and test sets, in
  Pascal VOC XML and YOLO txt formats.
