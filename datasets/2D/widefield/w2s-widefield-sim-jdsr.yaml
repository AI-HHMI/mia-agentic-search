schema_version: '1.2'
id: w2s-widefield-sim-jdsr
title: 'W2S: Widefield2SIM joint denoising and super-resolution microscopy dataset'
short_name: W2S widefield-to-SIM denoising/SR pairs
description: 360 sets (120 fields of view x 3 channels at 488/561/640 nm) of human-cell
  fluorescence images from a Nikon SIM microscope. Each set holds widefield images
  at 5 noise levels (1, 2, 4, 8, 16 averaged captures of 512x512 px), a noise-free
  widefield image (average of 400 captures) and a 1024x1024 px SIM image as high-resolution
  target. Released as a benchmark for joint denoising and super-resolution.
