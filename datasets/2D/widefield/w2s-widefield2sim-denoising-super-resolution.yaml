schema_version: '1.2'
id: w2s-widefield2sim-denoising-super-resolution
title: 'W2S: Widefield2SIM joint denoising and super-resolution dataset'
short_name: W2S widefield-to-SIM denoising/SR (fluorescence)
description: Real fluorescence images of human cells for joint denoising and super-resolution. 120 fields of
  view captured in three channels (488, 561, 640 nm) give 360 image sets; each set has widefield images
  at five noise levels (1, 2, 4, 8 or 16 averaged captures, 512x512 px), a near noise-free widefield
  image (average of 400 captures) and a 1024x1024 SIM image as high-resolution target. 240 sets are for
  training and 120 for testing.
