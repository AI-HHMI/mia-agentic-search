notes: 'Restoration-pair dataset (no labels). Formats: raw data are NumPy .npy arrays (1,080 files plus a text file in W2S_raw.zip), which the schema has no value for, hence other; the GitHub repo also provides normalized data for h5 generation. No license stated on the GitHub page, the EPFL download or in the paper read (only "code and data available"); pixel size, objective and sample details are not stated in the paper main text (supplementary material not read). Zip is about 43.7 GB compressed (peek_archive: 79 GB uncompressed), exact bytes not stated. Split from paper: 240 training sets, 120 test sets. Checked GitHub README, zip listing and the full arXiv paper.'
