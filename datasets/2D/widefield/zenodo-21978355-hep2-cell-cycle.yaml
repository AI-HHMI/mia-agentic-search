notes: 'Zenodo version 2 (2026-08-17) of concept DOI 10.5281/zenodo.18337703 (the paper cites the concept record). Zip
  indexes read without downloading: ExpD 10,000 WebP, CNN-D 100,000 WebP in class folders, DAPI_Full_FOV 1,000 WebP;
  size is the sum of the 3 zips plus a 986-byte metadata txt. Labels are image-level classes, not masks. ExpD is expert
  labelled; CNN-D labels were pre-classified by a VGG16 and reviewed by two experts (source: mixed). Pixel size 0.4651
  um from the paper Methods; device akironNEO, 20x/0.4 objective. No train/test split provided in the Zenodo record;
  paper mentions a test set without specifying a split file. The zip with full field-of-view images has no labels. Zenodo
  page says 32-bit WebP while the paper says uint8 single-channel; not resolved. enricher: WebP headers read: VP8L (lossless),
  256x256 crops and 1936x1216 FOV images.'
