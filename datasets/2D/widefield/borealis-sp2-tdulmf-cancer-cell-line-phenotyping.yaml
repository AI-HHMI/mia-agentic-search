id: borealis-sp2-tdulmf-cancer-cell-line-phenotyping
title: Image-based phenotyping of disaggregated cells - 10X brightfield and fluorescence images of eight
  cancer cell lines
short_name: Cancer cell line phenotyping images (widefield)
description: 4,008 four-channel TIFF fields (brightfield, Hoechst, SiR-actin, calcein green) of trypsinised
  cells from eight cancer cell lines imaged at 10X on a Nikon Ti-2E, grouped by cell line with separately
  imaged test sets, plus 20X transfer-learning training and test sets; used to train a CNN to classify
  single cells by cell line.
