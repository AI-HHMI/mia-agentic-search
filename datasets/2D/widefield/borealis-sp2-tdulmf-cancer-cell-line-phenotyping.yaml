notes: 'Dataverse file listing via API (4,009 files, 216.0 GB: 4,008 TIFFs and a README) with the README and the bioRxiv preprint Methods read. The labels are the cell line seeded in each well, encoded in file names rather than a separate table; source is left unknown because they come from experimental design, not annotation. The paper trains on 75 x 75 pixel single-cell crops cut out by thresholding the DAPI channel, which are not part of the deposit. Pixel size is not stated in the README or the preprint (10X objective only), so it is null. The README says each TIFF holds several locations (6) while the preprint describes 16 images per well and channel; image counts per file were not checked. Download URL not set because the whole-dataset API link was not tested.'
