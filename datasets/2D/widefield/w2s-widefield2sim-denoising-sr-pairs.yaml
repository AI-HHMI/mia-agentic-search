title: 'W2S: Microscopy Data with Joint Denoising and Super-Resolution for Widefield to SIM Mapping'
short_name: W2S widefield-to-SIM denoising/SR pairs
description: '360 image sets (120 fields of view x 3 wavelengths: 488, 561, 640 nm) of human cells imaged on a Nikon SIM system.
  Each set has widefield images at five noise levels (averages of 1, 2, 4, 8, 16 raw captures; 512x512 px), a noise-free widefield
  image (average of 400 captures) and a 1024x1024 px SIM image as high-resolution target; about 144,000 raw images in total.'
