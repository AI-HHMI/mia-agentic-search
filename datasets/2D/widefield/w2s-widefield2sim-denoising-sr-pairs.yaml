notes: 'License not stated on the GitHub README, the EPFL bucket listing or the paper text (ar5iv). Pixel size, objective,
  cell types and fluorophores not stated there either (the paper defers setup details to supplementary material, not read).
  The paper was read via ar5iv (arXiv HTML); tools/paper.py found no match for it. It states 240 sets for training and 120
  for testing, but the zip holds a single raw/ tree (peek_archive: 1,080 .npy files in raw/Image*/ plus one txt, 79 GB uncompressed)
  and the split itself is applied by the code. Data are NumPy arrays, which are not in the schema format list, hence formats
  other. The 400-capture noise-free reference and SIM target are derived from the same acquisitions, not manual annotation.'
