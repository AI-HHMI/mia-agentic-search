notes: 'Pixel size varies by objective (paper Methods: 0.32 um at 20x, 0.16 um at 40x air and oil, 0.10 um at 63x), so voxel_size_nm is left null. Images
  per objective: 9 (20x), 19 (40x air), 20 (40x oil), 22 (63x); nuclei 3,394 in total (paper Table 1). data.zip (100 MB, listed with peek_archive: 914 files)
  holds, per magnification, folders of raw 16-bit TIFF images, outlier-removed and normalised variants, 8-bit variants, mask and distance-map PNGs and ImageJ
  RoiSet zips; so the 70 raw images are repeated in several processed variants. Apache-2.0 is the license of the GitHub repository that hosts the data;
  the paper does not state a separate data license. Authors and date (2021-05-27, paper first publication) are from the Europe PMC record of the paper;
  the repository itself shows no release date. Microscope: Zeiss Axio Imager Z1 with TissueFAXS, Hamamatsu monochrome camera. enricher: size 100,074,298
  B from file listing (was null); license.url = repo LICENSE (Apache-2.0).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "data.zip (100,074,298 B, 914 members)\n  {20x, 40x air, 40x oil, 63x oil}/   9 / 19 / 20 / 22 images each, same subfolders:\n    images_16bit/\
      \                     raw 16-bit TIFFs (<organ>_<mag>_<n>.tif)\n    images_16bit_out_rm/              16-bit, outliers removed\n    images_16bit_out_rm_normmax/\
      \      16-bit, outliers removed + max-normalised\n    images_8bit_raw/                  8-bit TIFFs\n    label masks/                      instance-label\
      \ TIFFs (uint16)\n    label masks modify/               label TIFFs (same sizes as label masks/)\n    mask binary/                      binary PNGs\
      \ (0/255)\n    mask binary without border/       binary PNGs, borders removed\n    mask binary without border erode/ binary PNGs, borders removed,\
      \ eroded\n    distance maps/                    distance-transform PNGs\n    weighted_maps/, weighted_maps_erode/  weight-map PNGs\n    imageJ_zips/\
      \                      ImageJ RoiSet zips\n    Nuclei Mark up on 5 mouse tissues*.zip  one ROI archive per magnification"
    n_files: 914
    listing_complete: true
  sample:
    urls:
    - https://raw.githubusercontent.com/masih4/BitDepth_NucSeg/master/data/data.zip::20x/images_16bit/bone_20x_2.tif
    - https://raw.githubusercontent.com/masih4/BitDepth_NucSeg/master/data/data.zip::20x/label masks/bone_20x_2.tif
    size_bytes: 548352
    description: one 20x bone image (16-bit TIFF) and its instance-label TIFF
  arrays:
  - role: raw
    path_pattern: data.zip/*/images_16bit/*.tif
    format: tiff
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: uint16
    compression: packbits
    value_range:
    - 223
    - 4823
    normalization: none
    alignment: not-applicable
    alignment_notes: Single-page plain TIFFs, 1 sample/pixel (20x and 63x probed). Processed variants of the same 70 images in images_16bit_out_rm/, images_16bit_out_rm_normmax/
      (sample spans 0-65535) and images_8bit_raw/ (uint8).
  - role: label
    path_pattern: data.zip/*/label masks/*.tif
    format: tiff
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: uint16
    compression: packbits
    value_range:
    - 0
    - 19
    normalization: none
    encoding: instance-ids
    classes:
    - id: 0
      name: background
    - id: null
      name: nucleus (one id per instance)
    alignment: same-grid
    alignment_notes: 'Pairing: same file name in <mag>/images_16bit/ and <mag>/label masks/. Labels generated in MATLAB from manual ImageJ ROIs (paper Methods).'
  - role: label
    path_pattern: data.zip/*/mask binary/*.png
    format: png
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: nucleus
    alignment: same-grid
    alignment_notes: Same stem as the raw TIFF, .png. Foreground pixels equal the instance mask foreground in the sample (5,129 px).
  notes: 'Listing: tools/listing.py --expand-zips on data.zip (the only data file in the repo data/ folder): 914 members, 100,074,298 B exact. Probed 16-bit,
    8-bit, label TIFFs and binary PNG headers (20x, 63x). Sampled 20x/bone_20x_2 (raw, normmax variant, 8-bit, label tif, binary png; ~806 KB). value_range
    from one sample: raw [223,4823]; normalization none inferred (raw 16-bit camera values, unclipped). Label tif has 19 nucleus ids + 0. 8-bit variant
    spans only [1,19] in the sample (apparently a /256 conversion). Also in the zip: distance maps, weight maps, border-removed masks, ImageJ RoiSets. Voxel
    size differs by objective (paper: 0.32/0.16/0.16/0.10 um), so voxel_size_nm stays null. Repo README says "5 human organs"; the paper says mouse organs
    (record keeps Mus musculus).'
