short_name: Mouse organ DAPI nuclei segmentation (widefield)
description: 70 manually segmented DAPI-stained fluorescence image patches (512 x 512, 16-bit, plus 8-bit versions) of paraffin sections of mouse bone,
  heart, kidney, liver and muscle at 20x, 40x (air and oil) and 63x, with 3,394 annotated nuclei, ImageJ ROI sets, label and binary masks and distance maps.
