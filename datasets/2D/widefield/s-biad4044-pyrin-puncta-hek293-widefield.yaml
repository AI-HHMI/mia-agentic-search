notes: 'Masks are generated automatically with Cellpose (v4.2.1.1, cpsam_v2) and were not stated to be manually corrected; hence source: automatic. File lists: 233 image TIFFs (1.95 GB) and 234 mask TIFFs (1.96 GB), file names encode replicate and condition. Image counts per condition, mask dtype/encoding and a linked publication are not stated in the study record (publication section has no details); the study page itself is the only description, and it is short. The sample preparation text mentions THP-1 cells although the biosample is HEK293, likely a copy from the sister study S-BIAD4043. Size is the sum of image files only. The study files were read through the BioStudies file-list JSONs; direct download URL not determined (file API only).'
