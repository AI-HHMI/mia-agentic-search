notes: 'Listed with peek_archive: Denoising_biolum.zip (5,000 TIFFs in Low and High folders, 2,500 each,
  about 1024x512), Denoising_biolum_LF.zip (4,068 TIFFs in GT and input folders), Experimental_LightField_muscle.zip
