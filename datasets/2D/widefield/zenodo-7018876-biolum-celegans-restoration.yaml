title: Volumetric imaging of cellular dynamics with deep learning enhanced bioluminescence microscopy
short_name: C. elegans low-light restoration pairs (widefield)
description: Paired training data for deep-learning restoration of low-light microscopy of C. elegans. Four zips hold (1) 2,500 pairs of 4 ms vs 100 ms bioluminescence-protein (mTurquoise-nanolantern) widefield images, (2) bioluminescence light-field images at short vs 10 s exposure with ground truth, (3) experimental light-field images paired with epifluorescence stacks, and (4) synthetic light-field images paired with experimental stacks.
