notes: 'Listed with peek_archive: Denoising_biolum.zip (5,000 TIFFs in Low and High folders, 2,500 each, about 1024x512), Denoising_biolum_LF.zip (4,068 TIFFs in GT and input folders), Experimental_LightField_muscle.zip (2,552 TIFFs), Synthetic_LightField_muscle.zip (15,036 TIFFs). The ReadMe PDF in the record describes the acquisition. The bioRxiv preprint full text was not retrievable (rate-limited), so the published version of the paper was not read; details come from the ReadMe and the abstract. n_items counts only the 5,000 denoising images. The synthetic light-field zip contains simulated light-field images generated from real stacks. Pixel size and light-field geometry are not given in the ReadMe. Split files are not provided.'
