notes: 'Pixel size not stated on the Figshare record, readme or paper; images were resized to 800 x 600 px (original scale unknown); the paper
  gives a 50 um scale bar only for figures. Imaging with a Nikon Microphot FXA upright fluorescence microscope, CCD camera, 20x objective. Archive listed
  with peek_archive: 258 .tiff images (DAPI and Cy3 channels as separate files, in two folders listed: RIP and TuJ1 among seven antibody folders) and 261 .csv
  (dot annotations plus split lists); labels_stains lists the antibody names seen in file names and readme. Subfield images (F1.1, F1.2) should be used with caution per the readme. The Figshare landing page itself
  was read through the Figshare API (HTML page blocked).'
