title: 'IDCIA: Immunocytochemistry Dataset for Cellular Image Analysis'
short_name: Rat AHPC immunocytochemistry cell counting (IF)
description: 258 grayscale fluorescence microscopy images (resized to 800 x 600 px, 20x objective) of rat adult hippocampal
  progenitor cells (AHPCs) after electrical stimulation, immunolabeled with seven primary antibodies plus DAPI. Each image
  has a CSV of dot annotations (cell coordinates) made with the ImageJ Cell Counter, with train/validation/test file lists,
  for cell counting and detection.
