notes: 'Labels are image-level organelle classes (one directory per class), not masks. Widefield classes
  (one tar.bz2 each): cytoskeleton, ER, cytoplasmic, Golgi, lysosome, membrane, mitochondria, nuclear,
  nucleoli; plus labeled-confocal.tar.bz2 and unlabeled.tar.bz2. enricher: organism Mus musculus from
  the archive READMEs ("NIH 3T3 cells were tagged using CD tagging") (was empty). enricher: n_items 1686
  = labeled images per paper Table 2 (RT-widefield 1382, RT-confocal 304; unlabeled set not counted),
  each a protein + dna TIFF pair. enricher: size 2.77 GB from the complete Zenodo file listing. Pixel
  size not stated anywhere checked (see technical.notes).'
