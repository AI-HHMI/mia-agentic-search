title: Data from Determining the subcellular location of new proteins from microscope images using local features
short_name: CD-tagged protein localization (fluorescence)
description: Fluorescence microscope images of GFP-tagged proteins (CD tagging) localizing to different organelles, in a widefield and a confocal subset. Each image has two channels (GFP-tagged protein and Hoechst nuclear marker); images are organised one directory per organelle class, with several proteins per class and several images per protein. Organelle classes were annotated by visual inspection. Also includes an unlabeled image set.
