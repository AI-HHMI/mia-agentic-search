notes: 'Labels are image-level organelle classes (directory per class), not masks. Pixel size, organism and image counts are not stated in the Zenodo record, the READMEs or the paper abstract (full text not open access; tar.bz2 archives cannot be listed without downloading). The paper title of the cited method (García Osuna 2007) mentions 3T3 cells, but this was not confirmed for these files, so organism is left empty. Archives: per-class widefield tar.bz2 files plus labeled-confocal and unlabeled. Sources checked: Zenodo record and API, READMEs, Europe PMC abstract.'
