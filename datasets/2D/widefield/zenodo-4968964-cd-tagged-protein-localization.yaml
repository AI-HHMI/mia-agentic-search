  notes: 'Inspected by streaming ER.tar.bz2 (94.9 MB, the smallest class archive) with a stdlib tarfile
    script: 102 members, 50 protein + 50 dna TIFFs, README and description.txt (original .bmp source paths,
    no pixel size). Sampled ER/02-004-protein.tiff (uint16, 1024x1344, single page, LZW, observed [414,
    1126]) and ER/00-008-dna.tiff (uint8, 1024x1344, observed [0, 255]); value ranges from one sample
    each. TIFF resolution tags are the 72 dpi default. Other class archives, labeled-confocal (646 MB,
    Zeiss confocal) and unlabeled (604 MB) not opened (budget); confocal image shape unknown. Voxel size
    not found; checked: TIFF headers, Zenodo API record, READMEs, description.txt, paper full text (PMC3753569,
    Datasets section), murphylab.web.cmu.edu/data (unreachable). Download: per-class archives on Zenodo
    (files[].links.self), all direct and range-capable; no single archive, so data.download_url stays
    the record page. Paper Table 2 lists 10 widefield classes; the Zenodo record has 9 class archives.'
