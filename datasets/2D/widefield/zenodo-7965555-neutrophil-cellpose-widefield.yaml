    416x956 uncompressed, no calibration). Sampled one test pair (396 KB compressed): raw min 0 max 12441 mean 289; mask values
    0..3 (3 cells, 99.5% background), one sample. Training_Set/Log.txt is a Cellpose GUI log: masks computed by a model and
