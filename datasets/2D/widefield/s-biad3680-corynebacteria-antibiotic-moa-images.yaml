notes: 'Counts come from the three dataset file lists (25,197 + 7,496 + 3,150 TIFFs in 867 condition folders). Labels are the experimental condition in
  the folder name (experimental metadata, not manual annotation); the MoA class of each antibiotic is in Table 1 of the paper (e.g. cell wall, DNA gyrase,
  ribosome, RNA polymerase) and is not stored in the deposit. Pixel size is the paper''s stated XY image resolution of 0.0941867 um (63x water objective). File
  names (ch123) suggest a 3-channel merged image per field; zip or TIFF headers were not opened, so channel order and bit depth are unverified. The paper trains on
  five of six plates (80/20 train/validation) and tests on a hold-out plate; no split file is provided. The paper lists the code at github krentzd/morphoscreen.'
