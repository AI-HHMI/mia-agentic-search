id: s-biad3680-corynebacteria-antibiotic-moa-images
title: Deep learning extracts MoA-specific signatures from high-throughput images of chemically and genetically perturbed Corynebacteria
short_name: Corynebacterium antibiotic MoA images (widefield)
description: 35,843 widefield TIFF images (2160x2160, Hoechst nucleoid and FM4-64 membrane stains plus brightfield) of Corynebacterium glutamicum
  from three Opera Phenix datasets - 25,197 images of bacteria exposed to antibiotics at 0.5 to 10x MIC on six plates, 7,496 images from a time-point and
  concentration series, and 3,150 images of drug-treated bacteria and mutant strains. Images are organised in folders named by condition, used as labels
  to train mode-of-action classifiers.
