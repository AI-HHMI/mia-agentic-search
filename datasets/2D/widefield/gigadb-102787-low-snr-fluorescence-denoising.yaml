notes: 'Hosted on GigaDB (not in the repository enum, so other). images.tgz (15.7 GB) holds full-size TIFF pairs;
  crops.tgz (11.3 GB) holds 512x512 crops (17,568 pairs per paper). Paper text says 12 sub-datasets in the abstract
  but 15 in the GigaDB record and Data availability. Train/test: 90/10 per paper, done by the authors in code (last
  10% is test set), so no split files are confirmed. Pixel size, exact objectives and species of earthworm and fish
  not stated on the GigaDB record, README or the paper text I read (abstract/PMC summary); .tgz contents were not
  listed. Paper full text could not be retrieved via tools/paper.py (Europe PMC 503). enricher: size_bytes = complete
  S3 listing of all 6 files (images, crops, results, code, checkpoints .tgz + readme; was images.tgz only). README
  confirms CC0 1.0.'
