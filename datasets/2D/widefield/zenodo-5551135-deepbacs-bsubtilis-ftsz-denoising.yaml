notes: 'Zip listing (peek_archive): time_series/ 3 OME-TIFF stacks (~255 MB each) and train/ 3 single-frame
  TIFFs (~2 MB each). Unlabelled data for Noise2Void-style self-supervised denoising (the description
  shows raw vs Noise2Void-denoised images); there are no clean targets. n_items 3 = the time-series stacks;
  each should hold roughly 120 frames (1 frame/s for 2 min per the description), frame counts not read
  from the headers. Small file count, borderline on the size criterion. Distinct from zenodo-5639253 and
  zenodo-5550968, which are labelled segmentation sets of the same strain. enricher: size_bytes = complete
  Zenodo listing incl. the example PNG (was the zip only, 435,654,091). Train TIFF header confirms 65
  nm pixels.'
