title: 'W2S: Widefield2SIM microscopy data for joint denoising and super-resolution'
short_name: W2S widefield-to-SIM denoising and SR pairs
description: 'Paired fluorescence microscopy data of human cells: 120 fields of view in 3 wavelengths (360 image sets), each with
  400 raw widefield captures (512x512, used to derive 5 noise levels by averaging 1, 2, 4, 8 or 16 captures plus a noise-free
  average) and a matching 2x higher-resolution SIM image (1024x1024), released for benchmarking joint denoising and super-resolution.'
