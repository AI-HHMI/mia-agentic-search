notes: 'Single 43.7 GB zip (1080 .npy plus one .txt) listed with peek_archive: per image folder wf_channel*.npy (~210 MB),
  sim_channel*.npy (~2 MB, SIM target) and sim_input_channel*.npy. Raw widefield 512x512, SIM 1024x1024 per the paper (Nikon
  SIM Eclipse T1 setup, 120 FOVs x 3 channels, 400 captures each). No license on the GitHub README, the EPFL bucket listing
  or the arXiv text, so spdx is unknown. Pixel size, cell type and fixation state not stated in README or paper main text
