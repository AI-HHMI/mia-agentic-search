title: 'W2S: Microscopy Data with Joint Denoising and Super-Resolution for Widefield to SIM Mapping'
short_name: W2S widefield-to-SIM denoising pairs (widefield)
description: Widefield fluorescence images of human cells paired with structured-illumination (SIM) super-resolution targets,
  for joint denoising and super-resolution. 120 fields of view, each imaged at 488, 561 and 640 nm (360 sets), with 400 raw
  512 x 512 widefield captures per set (averaged to five noise levels, avg1 to avg16, plus a 400-frame noise-free average) and
  one 1024 x 1024 SIM image as the high-resolution target. 240 sets are for training and 120 for testing.
