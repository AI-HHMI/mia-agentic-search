notes: 'GitHub README, arXiv/ar5iv full text and peek_archive of W2S_raw.zip (43.7 GB compressed, 79.0 GB uncompressed, 1,081
  files: 1,080 .npy plus one .txt, in raw/ImageNNN/ folders; wf_channel*.npy about 210 MB each (400 x 512 x 512 at 2 bytes), sim_channel*.npy
