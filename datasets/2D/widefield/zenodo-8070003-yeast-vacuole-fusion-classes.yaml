notes: 'Zip listing (peek_archive) shows 18,362 TIFFs in three class folders. The linked preprint (lipophagy in yeast) describes
  32x32 px single-cell ROIs that were manually annotated as healthy vs sick vacuole phenotypes; the three folder names here
  (fully-fused, partially-fused, rejected) are not described in the preprint text, so the class definitions and the exact
  image size in this deposit were not verified. Pixel size is not stated in the preprint Methods read. Baseline code is
  the LipoSeg repository named in the preprint data-availability statement.'
