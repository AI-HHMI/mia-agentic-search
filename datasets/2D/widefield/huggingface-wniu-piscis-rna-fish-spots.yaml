  notes: 'Listed all 1272 HF files (complete, exact sizes, 1,291,310,879 bytes; 20251212 = 76,145,591 bytes). Probed experimental TIFFs (256x256, 254x256, 256x154 uint16, uncompressed, no calibration) and
