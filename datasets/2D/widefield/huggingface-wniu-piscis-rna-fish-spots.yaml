schema_version: '1.2'
id: huggingface-wniu-piscis-rna-fish-spots
title: Piscis RNA FISH spot detection training and test dataset
short_name: RNA FISH spot detection, manual spots (widefield)
description: 598 single-molecule RNA FISH / HCR RNA FISH widefield fluorescence images (358 experimental from human fibroblasts, melanoma, lung adenocarcinoma and macrophages, plus 240 synthetic images
  from the deepBlink datasets) with per-spot coordinates annotated manually in NimbusImage and refined to subpixel accuracy by Gaussian fitting. Split into 418 training, 89 validation and 91 test images
  (256x256 crops). Released with the Piscis spot-detection method.
