    ranges from one sample each. Experimental normalization none inferred (uint16 in camera range, unclipped). Label CSV read: 111 lines, 2 float columns. Counts match the paper: 358 experimental + 240
    synthetic. Voxel size not found; checked: TIFF headers, HF API and card, README, paper full text (Methods), Piscis GitHub README and data.py. Download: per-file HF resolve links, no single archive.
    2D data, so not covered by the miao layout yet.'
