notes: 'License MIT is taken from the Hugging Face dataset card metadata (the paper itself is CC BY-NC-ND 4.0). Physical pixel size is not stated in the paper (only 60x/1.4NA and 256x256 crops), the HF
  listing or the dataset card. Hugging Face tree holds several snapshots: 20230905 is the one the paper cites (combined.npz, per-channel .npz, raw images as .nc with NimbusImage .json annotations); 20251212
  holds 598 .tif images with per-image .csv spot coordinates in train/val/test x/ and y/ folders (formats: tiff chosen for that layout; .npz/.nc/.json variants also exist). Synthetic subset (240 images
  from deepBlink Particle/Microtubule/Receptor/Vesicle sets) is mixed in; deepBlink is a separate catalog entry. Dataset size in bytes and TIFF headers not inspected; the layout comes from the HF API file
  listing.'
