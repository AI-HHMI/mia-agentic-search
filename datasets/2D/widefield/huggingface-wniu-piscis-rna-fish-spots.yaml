notes: 'License MIT from the Hugging Face dataset card metadata (paper is CC BY-NC-ND 4.0). Pixel size not stated in the paper (60x/1.4NA Nikon Ti-E), dataset card, TIFF headers or the Piscis code README.
  HF repo holds snapshots 20230616/20230709/20230905 (.npz, .nc, NimbusImage .json) and 20251212 (598 .tif + 598 .csv in <subset>/<split>/x|y/); this record describes 20251212. Synthetic subset (240 images
  from deepBlink Particle/Microtubule/Receptor/Vesicle) is mixed in; deepBlink is a separate catalog entry. enricher: channels 1 (single-channel TIFFs, was null); size 1.29 GB from the full HF listing,
  all snapshots (was null); 20251212 alone is 76 MB.'
