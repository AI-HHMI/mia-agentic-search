id: w2s-widefield-to-sim
title: 'W2S: Microscopy Data with Joint Denoising and Super-Resolution for Widefield to SIM Mapping'
short_name: W2S widefield-to-SIM denoising and SR pairs
description: Widefield2SIM (W2S). 120 fields of view of human cells, each imaged in three fluorescence
  channels (488, 561, 640 nm) on a Nikon SIM microscope. Per FOV and channel, 400 raw widefield captures
  (used to build five noise levels by averaging 1, 2, 4, 8 or 16 captures, plus a noise-free 400-frame
  average) are paired with one 2x higher-resolution SIM reconstruction. Intended for joint denoising and
  super-resolution benchmarking.
