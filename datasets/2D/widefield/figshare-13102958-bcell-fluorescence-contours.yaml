short_name: Murine B cell actin and nuclei (fluorescence)
description: 21 fluorescence images of phalloidin-rhodamine-stained F-actin (cell) and 21 DAPI nuclei
  images of LPS-activated murine B cells spread on anti-BCR or anti-CD19 coated slides (with a cytochalasin
  D control), each with a ground-truth image of coloured per-object contours. Captured on a Zeiss AxioScan.Z1
  slide scanner.
