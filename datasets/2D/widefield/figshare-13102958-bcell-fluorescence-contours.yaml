notes: 'Zip lists 84 PNGs (1388 x 1040 RGB): cell000-020 and nucleus000-020 with matching cell_gt/nucleus_gt images. Ground
  truth is drawn as coloured outlines, not filled label masks (seen by viewing cell_gt000). Pixel size, objective and
  who annotated were not stated on the figshare page; the cited paper (Wiesmann et al. 2015, Curr Dir Biomed Eng
  1:224-227, doi 10.1515/cdbme-2015-0056) is not open access and only its abstract was available. The same authors
  deposited a separate simulated-image set (figshare 13102961), not covered here. Images appear as single-channel
  intensity stored as RGB.'
