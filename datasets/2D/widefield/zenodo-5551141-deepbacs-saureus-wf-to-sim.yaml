title: DeepBacs S. aureus SIM prediction dataset and CARE model
short_name: S. aureus widefield/SIM pairs (Nile Red)
description: >-
  Paired widefield and structured illumination microscopy (SIM) reconstructions of live, membrane-labelled
  (Nile Red) Staphylococcus aureus JE2 cells under agarose pads (1024x1024 px, 40 nm/px), 94 training and
  5 test pairs, for widefield-to-SIM super-resolution prediction. The record also holds a trained CARE model.
