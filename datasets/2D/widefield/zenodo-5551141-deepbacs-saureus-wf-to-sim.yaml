notes: >-
  Zip listing (peek_archive): train/WF 94 + train/SIM 94, test/WF 5 + test/SIM 5 TIFFs; n_items 99 = pairs.
  Widefield images were scaled 2x to match the SIM pixel size (record description); WF 16-bit, SIM 32-bit.
  Same family as the E. coli SIM-prediction record (zenodo-5551153) but a different species, dye and image set.
  The CARE model zip (148 MB) in the same record is not counted in size_bytes. The record page gives no
  separate license URL; CC-BY-4.0 is taken from the Zenodo metadata.
