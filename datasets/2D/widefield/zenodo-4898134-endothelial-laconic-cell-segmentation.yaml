notes: 'Zip (ground truth_v2.zip): GFP_original/ 434 tif, Hoechst_1/Pos0..Pos433/ (Hoechst tif + Micro-Manager metadata.txt),
  gtruth_uint8/ 434 png, readme.txt (''gtruth_uint8 contains the ground truth images with categorical labeling''). Class
  ids from the authors'' code (classNames background, border, cell, nuclei = 0-3). Paper (STAR Protocols 2021): U-Net
  semantic segmentation; does not say how the labels were made (troubleshooting mentions checking CellProfiler output
  on fixed samples), so annotations.source is unknown. Pixel size not stated anywhere (Micro-Manager PixelSizeUm: 0;
  Olympus IX-71, 10x/0.25, Prime95B camera). Modality widefield inferred from the epifluorescence microscope. Also on
  Zenodo: demo_images.zip (1.5 GB, unlabeled) and network.mat. enricher: size is the full Zenodo listing (was the GT
  zip only).'
