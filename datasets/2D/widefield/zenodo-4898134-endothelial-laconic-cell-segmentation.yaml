notes: 'Zip listing (ground truth_v2.zip, 1738 files): GFP_original/ (434 tif), Hoechst_1/PosN/ (434 positions with
  DAPI tif), gtruth_uint8/ (434 png) and readme.txt (not readable remotely: deflate64 compression). Paper (STAR Protocols
  2021, open access via Europe PMC) says the network classifies pixels into nucleus, cytoplasm, cell boundary and
  background, and that the ground-truth sample set is this deposit; the paper text does not describe how the
  labels were generated beyond mentioning CellProfiler output on fixed samples, so annotations.source is unknown
  and the exact class-to-pixel-value encoding is not confirmed. Pixel size not stated on the Zenodo page or in
  the paper text (microscope: Olympus IX-71 epifluorescence, 10x Plan C Achromat NA 0.25). Modality widefield
  is inferred from that epifluorescence microscope. Channels: the GFP-channel and Hoechst images per position.
  Zenodo files also include demo_images.zip (1.5 GB, unlabeled) and network.mat (trained U-Net).'
