title: Human aortic endothelial cell ground truth dataset
short_name: Endothelial cell segmentation (widefield)
description: 434 fields of view of human aortic endothelial cells expressing the lactate sensor Laconic (GFP-channel
  images) and stained with Hoechst (nuclei, 434 positions), with 434 ground-truth label images (PNG) used to train a
  U-Net that splits pixels into nucleus, cytoplasm, cell boundary and background. Also ships demo images and the trained
  network (network.mat).
