notes: 'n_items = 513 training images (training_data.zip: images/, masks/, classes/ folders, 513 each, plus dataset_split.json)
  + 52 TIFFs in data_set_HT1080.zip (HT1080 20x/40x test data incl. masks and masks_disagreement from a second annotator).
  size_bytes is the sum of these two zips (1,482,707,007 + 667,877,876); the Zenodo record is 5.4 GB in total because
  it also holds trained StarDist / InstanSeg / Cellpose-SAM models, videos, source data and code, which are not
  training data. Pixel size 335 nm is that of the 20x data to which the training crops were scaled (paper Methods);
  other magnifications were rescaled. Training data mix HaCaT and HT1080 images at various magnifications and SNR;
  channels = 3 (two FUCCI channels + a structural channel) per the paper. Annotation was human-in-the-loop (initial
  automated masks curated manually).

  enricher: split counts from dataset_split.json: 436 training / 77 validation.'
