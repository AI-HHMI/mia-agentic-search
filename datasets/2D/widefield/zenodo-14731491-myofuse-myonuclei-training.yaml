notes: 'Zip listing (peek_archive): Images/ 20 TIFFs (H_*, 10 human; M_*, 10 mouse), Masks/ 20 TIFFs with matching names, and a
  62.9 MB extensionless "labels" entry. Paper (open access, full text read): the classifier was trained on 10 patches
  (1000x1000 px) per cell type, annotated with the Svetlana napari plugin from the MyHC channel only; nuclei masks come from a
  Cellpose model trained on 5 images with human-in-the-loop. Which content sits in Masks/ versus labels was not checked in the
  files, so the mask description is inferred from the paper; source is therefore mixed (manual classification labels, Cellpose-derived
  nuclei masks). Imaging: Zeiss Cell Observer widefield, 10x/0.3 Plan-NeoFluar, Hamamatsu ORCA-R2; pixel size not stated in
  the paper or on the Zenodo page. The Zenodo "available" date (2025-12-13) conflicts with its publication date (2025-02-13);
  the paper is dated 2026. The paper also states the test images and code are on GitHub (MIT).'
