notes: 'Zip listing (peek_archive): Images/ 20 TIFFs (H_*, 10 human; M_*, 10 mouse), Masks/ 20 TIFFs with
  matching names, and a 62.9 MB extensionless "labels" entry. Paper (open access, full text read): the
  classifier was trained on 10 patches (1000x1000 px) per cell type, annotated with the Svetlana napari
  plugin from the MyHC channel only; nuclei masks come from a Cellpose model trained on 5 images with
  human-in-the-loop. Source is therefore mixed (manual classification labels, Cellpose-derived nuclei
  masks). Pixel size not stated in the paper or on Zenodo. The paper also states the test images and code
  are on GitHub (MIT). enricher: channels 1 (was 2): each image TIFF holds one float32 channel (MyHC per
  the paper''s annotation note, inferred). organisms: Homo sapiens = Images/H_*, Masks/H_*; Mus musculus
  = Images/M_*, Masks/M_*.'
