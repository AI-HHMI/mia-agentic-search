notes: 'Labels come from experimental design (dust added to rows A-G, row H clean; label by well from
  file names): a Classification_Set.zip with 16,003 entries (Classification_Small/{train,val,test}/{Nuclei,Artifact}:
  6300+6300 train, 697+700 val, 1000+1000 test PNG patches) is verified in the listing. Pixel-level masks
  are weak, algorithmically derived (paper), and were not located as a separate download in the file list,
  so only classification is claimed. The raw images are in spa.tar.gz split into three parts (size_bytes
  is the sum of all four files) (paper: 2160x2160 images, 384 sites per subset). Pixel size is not stated
  on the record or in the paper text read. Version 2442 of concept record 1435; the files are open (access_right
  open). enricher: raw spa.tar.gz images are MetaXpress 16-bit TIFFs (2160x2160, LZW) with .HTD plate
  files; 10x TIFF header calibration 0.65 um/px, 4x not read, so voxel_size_nm stays null.'
