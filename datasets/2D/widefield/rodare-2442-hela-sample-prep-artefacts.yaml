title: High-content multi-spectral fluorescence microscopy sample preparation artefacts (HeLa cells with dust)
short_name: HeLa high-content artefact classification
description: Multispectral (DAPI, CFP, GFP, TRITC, Cy5) high-content fluorescence images of fixed, Hoechst-stained HeLa
  cells in a 96-well plate with laboratory dust added as a titrated sample preparation artefact, imaged with 4x and 10x
  objectives on an ImageXpress Micro XL. Includes a ready-made classification set of 256x256 patches labelled Nuclei vs
  Artifact with train/val/test folders; the raw 2160x2160 images allow weak pixel-level artefact masks from multi-exposure
  averaging.
