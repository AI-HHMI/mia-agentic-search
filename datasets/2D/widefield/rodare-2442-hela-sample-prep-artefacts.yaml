notes: 'Labels come from experimental design (dust added to rows A-G, row H clean; label by well from file names): a
  Classification_Set.zip with 16,003 entries (Classification_Small/{train,val,test}/{Nuclei,Artifact}: 6300+6300 train,
  697+700 val, 1000+1000 test PNG patches) is verified in the listing. Pixel-level masks are weak, algorithmically derived
  (paper), and were not located as a separate download in the file list, so only classification is claimed. The raw
  images are in spa.tar.gz split into three parts (size_bytes is the sum of all four files), which peek_archive cannot list, so the raw image format is not confirmed from a listing (the paper gives 2160x2160 images,
  384 sites per subset); formats lists only the verified PNG patches. Pixel size is not stated on the record or in the
  paper text read.  Version 2442 of concept
  record 1435; the files are open (access_right open).'
