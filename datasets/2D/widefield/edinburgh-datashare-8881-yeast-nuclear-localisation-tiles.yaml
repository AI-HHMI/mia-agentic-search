notes: 'Tiles.zip (1.14 GB) lists 183,190 .pt PyTorch tensor files (1x3x117x117, about 0.3 MB each uncompressed) in All/<strain>_<n>/sorted/ plus one .dat table with the ground truth; .pt files are pickles and must not be unpickled untrusted. Labels are computed, not manual: the paper derives nuclear localisation from the Nhp6a-mCherry marker with Otsu thresholding (paper: about 180,000 single-cell images, 90/10 train/validation split, 5-min intervals, 5 z-sections 0.6 um apart). Microscope Nikon Ti Eclipse, 60x NA 1.4, Prime 95B (11 um camera pixel); effective pixel size not stated. The paper is inconsistent on which strains were used for training. The zip holds the full set; a reduced example set is in the GitLab repository. Data license is the DataShare record CC BY 4.0.'
