  notes: 'Listing: DataShare REST API (Tiles.zip 1,141,524,598 + script 10,656 + README 1,716 = 1,141,536,970
    bytes, complete) and the Tiles.zip central directory (183,190 .pt + 1 .dat). Sampled: one .pt member
    (6.8 KB compressed, 329,846 bytes) and the first 2 KB of AllInfo_2002.dat via range requests. Each
    channel of the sampled tile spans [0,1] (rescaled per channel, inferred from one tile). No sample
    unit is set: .pt is not a format TensorSwitch reads and the files are pickles (must not be unpickled),
    so any loader needs a pickle-free reader. Voxel size not found; checked: README.txt, training script,
    DataShare metadata, .pt content (no calibration); the paper (PMC12133273, read by the harvester) gives
    60x objective and an 11 um camera pixel but no effective pixel size (not computed from specs). Download:
    Tiles.zip is direct (range requests) but host datashare.ed.ac.uk is not on the TensorSwitch allowlist;
    data.download_url keeps it as the single archive. 2D records are outside the miao layout.'
