title: Quantifying the nuclear localisation of transcription factors
short_name: Yeast nuclear localisation cell tiles
description: Masked single-cell image tiles (117x117 px; bright-field, transcription factor-GFP and nuclear
  marker-mCherry channels) of budding yeast strains carrying Msn2-GFP, Dot6-GFP or Mig1-GFP, imaged in
  a microfluidic device over time. Each tile has a ground-truth nuclear localisation value listed in an
  accompanying table, used to train a CNN that predicts nuclear localisation from the GFP (and optionally
  bright-field) channels.
