notes: 'Counts from the zip listings (peek_archive): lung trainset 15 patches, X96165X3 trainset 10, Z96512T5 trainset 20
  + testset 7 (test has semantic masks only); each patch has instance and semantic masks. n_items 52 counts 256x256 patches;
  each zip also holds one whole-slide TIFF and a .raw.gef expression file. Three zips, so no single download_url. Paper (bioRxiv
  full text) gives DAPI 20x/0.5 NA and H&E 10x/0.75 NA scanning and QuPath patch annotation for the brain sections; the lung
  H&E slice (10x Visium HD) is only described on the Zenodo page. Which zip is which section is inferred from file names.
  Pixel size is not stated on the page, listings or paper Methods, so voxel_size_nm is null.'
