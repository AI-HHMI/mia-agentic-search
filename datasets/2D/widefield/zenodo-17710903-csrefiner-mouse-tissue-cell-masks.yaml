title: 'CSRefiner demo datasets: DAPI and H&E mouse tissue sections with manually curated cell masks'
short_name: Mouse tissue cell masks, DAPI and H&E (CSRefiner)
description: 'Three mouse tissue sections from spatial-transcriptomics platforms, each as a registered whole-slide image plus
  256x256 pixel patches with manually curated cell masks (instance and semantic): an FFPE DAPI-stained brain section (20 train
  and 7 test patches), a fresh-frozen H&E brain section (10 train patches) and a fresh-frozen H&E lung section (15 train patches).
  Raw transcript tables (.gef) are also included. Released with CSRefiner, a framework for fine-tuning cell segmentation models
  on small annotated sets.'
