description: Multi-channel (DAPI, F-actin, vimentin, Lamin A) fluorescence images of MDCK epithelial cells acquired on a Nikon Ti2 with
  a 60x 1.4 NA oil objective at 0.11 um per pixel. The release has 39 raw Nikon ND2 acquisitions and a zip of 424 processed 512x512,
  4-channel ground-truth PNG patches that the authors used to train an end-to-end learning pipeline.
