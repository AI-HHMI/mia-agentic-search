notes: 'Files: 39 raw Nikon ND2 acquisitions (about 42.8 MB each), multi-channel-edof_dataset_png.zip with 424 PNG patches
  (listed with peek_archive), README.txt, a preview PNG. The README says the 512x512, 4-channel patches are the ground truth
  used to train an end-to-end learning pipeline; channels C0 DAPI, C1 F-actin, C2 vimentin, C3 Lamin A; 0.11 um pixels; 60x
  1.4 NA oil objective, LED illumination. No segmentation or label files, so annotations.present is false and the training
  signal is judged to be reconstruction (extended depth of field); that is a judgement call, hence confidence 0.55. The Tampere
  portal page states all rights reserved without naming a license; Zenodo gives CC BY 4.0. The associated manuscript is not
  named on either page, so no publication is listed and no paper was read. Whether ND2 files hold z-stacks is not stated.'
