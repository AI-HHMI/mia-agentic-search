notes: 'Files: 36 raw Nikon ND2 acquisitions (~42.8 MB each; 32 named ND Acquisition[ N].nd2, 4 named 60x_MDCK_..._00N.nd2), multi-channel-edof_dataset_png.zip
  with 424 4-channel 512x512 PNG patches, README.txt, a preview PNG. Channels C0 DAPI, C1 F-actin, C2 vimentin, C3 Lamin A; 0.11 um
  pixels (README). No labels: the patches are the in-focus ground truth from which the paper synthesizes defocused sensor images for
  EDoF reconstruction training (training signal judged as reconstruction). Tampere portal says all rights reserved; Zenodo gives CC
  BY 4.0. enricher: paper found (Light Sci Appl 2026, cites this Zenodo record); organism Canis lupus familiaris from paper (Madin Darby
  canine kidney) and Cellosaurus CVCL_0422 (was []); size from Zenodo file listing (was null); raw ND2 count corrected to 36 (was 39
  = all files).'
