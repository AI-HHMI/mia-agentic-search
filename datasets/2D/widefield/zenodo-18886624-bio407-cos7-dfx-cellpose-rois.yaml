notes: 'Sources: Zenodo API record and landing page, zip listing (54 processed TIFFs, 54 *_rois.zip, FIJI macros,
  R script, raw .lif/.lifext). Masks are Cellpose v3 output (cyto, diameter 300, DAPI+actin channels), not described
  as manually corrected, so annotations.source is automatic (silver-standard labels). Widefield from the macro path
  and the THUNDER instrument. No paper is cited on this record (sibling BIO407 records cite Gottwald et al. 2020).
  Distinct from the other BIO407 records in the catalog (Group 5 FIB-SEM). enricher: pixel size 162.38 nm from the
  TIFF calibration (6.1584 px/um) and the embedded Leica metadata (332.39 um over 2048 px), was null; 2D confirmed
  (SizeZ 1); formats + lif (raw .lif in the zip).'
