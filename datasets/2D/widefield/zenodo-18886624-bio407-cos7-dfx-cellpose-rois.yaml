notes: 'Sources: Zenodo API record and landing page, and the zip listing (peek_archive: 54 processed TIFFs of ~25.4 MB, 54
  *_rois.zip, FIJI macros, R script, one .lif of 1.8 GB). Masks are Cellpose v3 output (cyto, diameter 300, DAPI+actin
  channels) and were not described as manually corrected, so annotations.source is automatic (silver-standard labels). Voxel
  size not stated on the page or the macros; dimensionality 2D is inferred from the single-plane file sizes and TileScan
  naming and is not confirmed (the raw .lif was not opened). Widefield from the macro path (Widefield folder) and THUNDER
  instrument. No paper is cited on this record (sibling BIO407 records cite Gottwald et al. 2020, this one does not). Raw
  .lif/.lifext are in the same zip but not counted as formats beyond tiff. Distinct from the other BIO407 records in the
  catalog (Group 5 FIB-SEM).'
