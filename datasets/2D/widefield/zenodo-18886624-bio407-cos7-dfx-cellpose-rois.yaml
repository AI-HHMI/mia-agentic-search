  notes: 'Listing: Zenodo API + zip directory (tools/listing.py --expand-zips): 1 zip, 2,324,062,612 B, 116 members.
    TIFF members are deflated in the zip, so tools/probe.py could not read the header from a range; sampled 1_Control_P1.tif
    with tools/sample.py (18.9 MB compressed): 3x2048x2048 uint16, axes CYX, values 121-25035 (p1 165, p99 7167),
    one sample only. A scratch script read its TIFF tags (uncompressed, XResolution 6.1584 px/um, ImageJ unit micron,
    embedded Leica metadata: 2048 px over 3.323915e-04 m, SizeZ 1, SizeC 4) and the paired ROI zip (36,168 B): 94
    ImageJ ROIs, all type 7 (freehand). normalization none is inferred: uint16 camera values well below saturation
    and no rescaling in the converter macro (it opens with Bio-Formats autoscale, which only sets display range).
    ROI zips are not a raster format; converting them needs rasterizing to instance masks. The raw .lif (4 channels
    incl. tubulin) was not opened. The .RData file was not loaded (untrusted). Dimensionality 2D is not yet covered
    by the miao layout.'
