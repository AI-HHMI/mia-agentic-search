notes: 'Hosted on HZDR RODARE (DOI 10.14278/rodare.3001, version of 10.14278/rodare.3000). Files: HeLaCytoNuc_train.zip
  (435 MB), _validation.zip (140 MB), _test.zip (76 MB), _test_cellprofiler_masks.zip (3.7 MB), _raw_images.zip (8.6 GB);
  structure per the record description (images/, nuclei_masks/, cytoplasm_masks/ TIFFs). The server ignores range
  requests so the zips could not be listed; annotations_verified is false and the per-split counts are not confirmed
  (2,676 total per the description). Acquisition per the cited screening paper Methods: ImageXpress, 10X 0.45 NA
  objective, DAPI/Hoechst and phalloidin; pixel size is not stated on the record or in the paper Methods, and the
  dataset images are preprocessed (520 x 696 vs raw 1040 x 1392), so voxel size is null. Training masks come from
  CellProfiler (automatic) and test masks were manually annotated, hence source: mixed. Size = train+validation+test
  zips only (650 MB); the raw zip is optional.'
