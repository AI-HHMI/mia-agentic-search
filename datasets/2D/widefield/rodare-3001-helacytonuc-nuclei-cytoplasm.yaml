schema_version: '1.2'
id: rodare-3001-helacytonuc-nuclei-cytoplasm
title: 'HeLaCytoNuc: fluorescence microscopy dataset with segmentation masks for cell nuclei and cytoplasm'
short_name: HeLa nuclei and cytoplasm masks (fluorescence)
description: 2,676 fluorescence micrographs (520 x 696 px, 8-bit RGB; red = phalloidin cytoplasm, blue = DAPI nuclei)
  of fixed HeLa cells, with instance segmentation masks for nuclei and cytoplasm. Train/validation/test split 70:20:10.
  Masks were produced with CellProfiler; the test subset was annotated manually by a specialist (CellProfiler masks for
  the test set are provided separately). The original 16-bit 1040 x 1392 raw images are also provided.
