    - 2
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 26
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'PNG mode LA (grey + alpha): s = [grey, alpha].'
  - role: label
    path_pattern: Simulation/SimEpi1Mito/segment/*/*.png
    format: png
    axes: yxs
    shape:
    - 256
    - 256
    - 3
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: mitochondria
    alignment: same-grid
    alignment_notes: 'segment/<split>/<n>.png pairs with image/<split>/<n>.png (same split and number).
      Masks are grey stored as RGB (samples_identical: true), values {0, 255}. train has one more mask
      (5,449) than images (5,448).'
  notes: 'Listing: Dataverse API (21 files, exact sizes, 86,008,747,736 B total) plus the Simulation.zip
    central directory (15,549 PNGs). tools/listing.py and sample.py could not read the zip directly: the
    datafile URL has no .zip suffix and its presigned S3 redirect answers HEAD with 403, so the repo''s
    readers were run with a ranged-GET HEAD replacement. Sample train/0.png: raw LA uint8, range 26-255
    (one sample); mask 0/255, 2.6% foreground. Real data were not sampled; LiveEpi2Rat _01.tif header:
    ImageJ cyx 3x2048x2048 uint16, 0.13 um/px, spacing 0.31 um. Voxel size: real data 130 nm (one header),
    simulation unknown (physeg generator_batch_parallel.py uses 128 px at 0.042 um, but the PNGs are 256
    px, so the files'' pixel size is not established). Download: all datafile URLs are direct (206, ranges)
    but dataverse.no is not on TensorSwitch''s allowlist; no single archive of the whole dataset.'
