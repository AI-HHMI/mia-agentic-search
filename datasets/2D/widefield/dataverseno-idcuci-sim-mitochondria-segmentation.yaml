notes: 'Only the simulated data carry labels: Simulation.zip (465 MB, 15,549 PNGs) has image/ and segment/
  for train (5,448), val (1,600) and test (726); the ground truth comes from the physics-based simulation.
  The real data (LiveEpi1Rat, LiveEpi1Hu, LiveEpi2Rat time-lapse TIFFs, FixedAiry1Rat Airyscan TIFFs)
  have no masks. Microscopes: DeltaVision OMX Blaze, Zeiss CellDiscoverer 7 (widefield), Zeiss LSM 880
  Airyscan (confocal = FixedAiry1Rat/). organisms: Rattus norvegicus = LiveEpi1Rat/, LiveEpi2Rat/, FixedAiry1Rat/;
  Homo sapiens = LiveEpi1Hu/; Simulation.zip is simulated (no organism). enricher: voxel size stays null:
  real LiveEpi2Rat TIFF header 130 nm/px (ImageJ), simulation pixel size not stated for the 256 px PNGs.
  The paper is not open access.'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "0_ReadMe-1.txt\nSimulation.zip  (465,081,773 B; 15,549 PNGs)\n└── Simulation/SimEpi1Mito/\n\
      \    ├── image/{train 5448, val 1600, test 726}/<n>.png\n    └── segment/{train 5449, val 1600,\
      \ test 726}/<n>.png\nLiveEpi1Rat/  8 × ~10.5 GB time-lapse .tif\nLiveEpi1Hu/   4 × 0.6–6.3 GB .tif\n\
      LiveEpi2Rat/  2 × 30 MB .tif (ImageJ, 3 × 2048 × 2048 uint16)\nFixedAiry1Rat/ 3 × Image<n>_Airyscan_RAW.tif\
      \ + 3 × _AiryscanProcessing.tif"
    n_files: 15569
    listing_complete: true
  sample:
    urls:
    - https://dataverse.no/api/access/datafile/101094::Simulation/SimEpi1Mito/image/train/0.png
    - https://dataverse.no/api/access/datafile/101094::Simulation/SimEpi1Mito/segment/train/0.png
    size_bytes: 60517
    description: one simulated training pair (256 x 256 PNG image and its mask)
  arrays:
  - role: raw
