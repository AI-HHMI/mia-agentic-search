notes: >-
  Only the simulated data carry labels: Simulation.zip (465 MB) holds 15,549 PNG files in image/ and segment/ for train (5,448), val (1,600) and test (726) pairs, indexed from the remote zip. The ground
  truth comes from the physics-based simulation, not from manual annotation. The real data (LiveEpi1Rat, LiveEpi1Hu, LiveEpi2Rat time-lapse TIFFs up to 6 GB each, FixedAiry1Rat Airyscan TIFFs) have no masks
  in the record. Real microscopes: DeltaVision OMX Blaze, Zeiss CellDiscoverer 7 (widefield) and Zeiss LSM 880 Airyscan. Pixel size not stated in the README or record. The paper is not open access
  (only the Crossref record could be read), so voxel size, simulation parameters and the dataset's real-image evaluation are unchecked; the 7,774 pair count is half the PNG count. The README mentions 'Simulations.zip' but the file is Simulation.zip.
