notes: 'Eight zips (5.48 GB per the Zenodo file list); Datasets 3 and 9 are external and not included. Masks exist for
  Datasets 1, 2 (2D mosaics), 4 (E. coli, 81,379 objects) and 10 (3D mouse-brain DAPI volume, 864 nuclei, 100.7 x 100.7
  x 299.8 nm voxels). Per the READMEs (peek_archive), Dataset 4 and 10 masks come from Cellpose-SAM, so labels are automatic
  and unproofread; the method for Datasets 1 and 2 is not stated. Pixel size varies per file, so voxel_size_nm is null.
  Datasets 5-8 are registration images without masks. A registration benchmark, so the masks are a secondary training
  signal. Preprint full text not open access (abstract read).'
