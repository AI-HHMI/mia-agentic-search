description: Large DAPI-stained fluorescence mosaics (HUVEC monolayer, HUVEC/SU.86.86 co-culture, E. coli) and a spinning-disk
  confocal volume of mouse brain, each with a full-image nuclei or bacterial-object segmentation mask, deposited with a
  nuclei-constellation image-registration benchmark. Further zips hold cross-scale and live-to-fixed registration images
  without masks.
