notes: 'Eight zips (5.48 GB); Datasets 3 and 9 are external, not included. Instance masks for Datasets 1, 2 (2D mosaics),
  4 (E. coli, 81,379 objects) and 10 (3D mouse-brain volume, 864 nuclei). Datasets 5-8: registration images, no masks. Labels
  automatic, unproofread: D1 threshold-and-watershed, D2/D4/D10 Cellpose-SAM (READMEs). enricher: voxel size per subset from
  the READMEs (agrees with TIFF calibration): D1 1320.5 nm, D2 634.1 nm, D4 171.875 nm, D10 100.7 x 100.7 x 299.8 nm; they
  differ, so voxel_size_nm stays null. organisms: Homo sapiens = Dataset 1/, Dataset 2/; Escherichia coli = Dataset 4/; Mus
  musculus = Dataset 10/. 2D except Dataset 10 (zyx volume). widefield = D1, D4; spinning-disk confocal = D2, D10. Registration
  benchmark; masks are a secondary training signal.'
