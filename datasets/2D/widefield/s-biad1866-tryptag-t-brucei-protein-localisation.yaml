id: s-biad1866-tryptag-t-brucei-protein-localisation
title: 'TrypTag: Genome-wide subcellular protein localisation in Trypanosoma brucei.'
short_name: TrypTag T. brucei protein localisation (mNG)
description: Widefield epifluorescence images of live procyclic Trypanosoma brucei cell lines expressing proteins endogenously tagged with mNeonGreen at the
  N or C terminus (Hoechst-stained DNA), 71,206 corrected images from 7,791 genes, each with a per-image protein localisation annotation made by at least three
  experts (terms from a localisation ontology), automatically detected single-cell regions of interest and a thresholded image, plus the localisation ontology and gene-level table.
