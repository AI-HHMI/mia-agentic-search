notes: 'Counts come from Files.tsv (71,206 each of corrected image, localisation annotation, cell ROI and thresholded image files in 221 date folders; 7,791 gene
  IDs). Labels are protein localisation terms given per cell line (by at least three experts) and repeated per image; the paper reports annotations for 7,766 of 8,721 proteins.
  Cell ROIs and thresholded images are automated (segmentation after Wheeler et al. 2012). Channels and pixel size were not read from TIFF headers or stated in the metadata (63x
  NA 1.4 oil objective for most images, Andor Neo sCMOS), so channels and voxel size are null. This procyclic-form set is separate from the bloodstream-form tagging set S-BIAD1932,
  which was not recorded here. The depositors ask for citation of Billington et al. 2023. Size not summed.'
