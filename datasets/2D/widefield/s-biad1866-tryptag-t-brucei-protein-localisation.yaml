  notes: 'Files.tsv (read in full) lists 4 x 71,206 per-field files plus 4 top-level files; tools/listing.py
    was not run over the 221 folders. Probed Tb927.8.620_4_C_1.tif (ImageJ, cyx 3x2160x2560 uint16, spacing
    0.1032 um) and _thr.tif (ImageJ, 2x2160x2560 uint8); sampled both (44 MB): raw min 62, max 48338 (one
    sample), thr values {0, 255}. Read the field JSON and roisCells.txt. size estimated (uncompressed):
    raw 71206 x 3x2160x2560 uint16 + label 71206 x 2x2160x2560 uint8 = 3,149,925,580,800 B (3.1 TB); the
    JSON and ROI tables are not counted (HTTP Content-Length of the sample tif 33,182,757 B matches uncompressed).
    Voxel size: the header says 103.2 nm/px, plausible for the 63x objective with the Andor Neo (6.5 um
    pixels), but the paper Methods say images were taken at 100x or 63x ("the vast majority at 63x"),
    so pixel sizes differ between images and voxel_size_nm stays null; checked header, BIA study metadata,
    paper Methods (PMC9981465). No single archive: download_url is the Files/ folder; files are direct
    https URLs.'
