  notes: 'Listing: BioStudies file list Nrf2 lung cancer.json (exact sizes, 325 data files) plus the 2 file-list files; the FTP
    HTTP index agrees with rounded sizes. Read the CZI file header and XML metadata segment by range requests (requests only,
    ~1.5 MB) for L1, L109, L757 and L122: Scaling X = Y = 2.27E-07 m, SizeC 5, Gray16, 14-bit, Axio Scan.Z1, 20x/0.8. No pixel
    data sampled: the smallest CZI is 8.1 GB and its tiles are stored in subblocks this routine cannot read by range. Read
    iCAIRD_L122.annotations in full (25,036,244 B): Layer 1 = 3 polygons (2 negative), Stroma = 2558 polygons (1387 negative),
    Tumour = 3235 polygons (1088 negative). Direct files: every CZI and .annotations file is a direct https file on ftp.ebi.ac.uk
    (no single archive), so data.download_url is the Files/ folder.'
