notes: 'Annotations are derived: tumour/stroma classified by HALO AI trained on pan-cytokeratin areas (paper Methods), so they
  are model outputs (source automatic). The paper says data are available on request, while the archive record is open under CC
  BY 4.0. enricher: voxel size 227 x 227 nm from the CZI Scaling metadata (Distance X/Y 2.27E-07 m, identical in 4 of 162 files
  read; was null); the paper states none. enricher: modality widefield from the CZI channel AcquisitionMode WideField (Axio
  Scan.Z1, Plan-Apochromat 20x/0.8; was fluorescence-other). enricher: size from the BioStudies file list (exact). coverage:
  each slide has an analysed-area layer (Layer 1) and Tumour / Stroma polygons inside it.'
