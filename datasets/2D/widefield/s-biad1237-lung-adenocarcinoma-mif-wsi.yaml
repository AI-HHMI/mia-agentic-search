description: 162 multiplex immunofluorescence whole slide images (Zeiss Axio Scan Z1, CZI) of early-stage lung adenocarcinoma
  stained for NQO1, NRF1, NRF2, pan-cytokeratin and Hoechst, with a HALO annotation file per slide containing the
  analysed area and tumour/stroma regions classified by HALO AI trained on pan-cytokeratin-positive areas.
