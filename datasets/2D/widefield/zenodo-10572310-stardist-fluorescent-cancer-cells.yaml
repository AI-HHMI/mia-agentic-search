notes: 'Zip index read with peek_archive (143 TIFFs, 243 MB): 66 Training_Source images with 66 Training_target masks, 3 QC
  source/target pairs, and the StarDist model with prediction examples. Pixel size 1.3205 um, 1024 x 1024 and bit depths are
  from the Zenodo description (the page labels the images "Brightfield" in one line but describes them as fluorescence; the
  preprint says the cells were labelled with CellTrace, 10x widefield). Masks manually segmented per the Zenodo page; the
  preprint reports a 66-image training set for this model. Same authors and paper as the StarDist brightfield monocyte and
  neutrophil sets, but a different imaging modality and cell labelling. enricher: pixel size 1.3205 um confirmed by the ImageJ
  TIFF header (1320.55 nm).'
