  via metadata (metadata.zip lists filenames_and_plates.csv, test.txt etc.). Checked dataset page, images/masks/metadata
  zip listings and the Caicedo et al. 2019 full text. enricher: size 80,687,375 B from complete listing
  of images/masks/metadata zips (was page-stated 80.7 MB).'
