  notes: 'Complete listing of images.zip, masks.zip, metadata.zip: 80,687,375 bytes, 406 members. Sample
    (one pair): TIFF uint16 [520,696] values 120..4095 (sample.py hint: 12-bit detector range; max hits
    4095), mask PNG RGBA uint8 [520,696,4] with channel values {0,1,2,3,255} (255 = alpha), so instance
    IDs are colour-encoded; n_ids_observed not computed (would need colour decoding). Splits: metadata/training.txt,
    validation.txt, test.txt (readme.txt read).'
