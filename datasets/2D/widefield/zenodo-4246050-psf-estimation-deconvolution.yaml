title: 'PSF Estimation and deconvolution: models, microscopy images, and datasets'
short_name: PSF estimation synthetic and real widefield images
description: Accompanying data of a CNN-based spatially variant point spread function estimation method
  for blind deconvolution and depth estimation. Holds synthetic degraded images with known PSF parameters
  (point, cell and black images under four Gaussian and Zernike degradation models, with train and test
  sets), real widefield images of fixed cells, plant cells and beads on a Leica DM5500, astigmatism stacks
  and trained models.
