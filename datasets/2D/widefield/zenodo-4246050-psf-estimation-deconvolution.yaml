notes: 'Four tar.gz archives (models 0.5 GB, images 15.7 GB, synthetic 6.7 GB, astigmatism 2.0 GB). First
  entries were read by streaming the gzip start: images are 2D TIFFs, synthetic folders hold PNGs, astigmatism
  holds an OME-TIFF stack. README: real images are 1296 x 966 with 3.75 um pixels (camera pixel pitch;
  the sample-plane size depends on the objective, so voxel_size_nm is null), objectives 5x/0.15, 10x/0.3
  and 20x/0.7 air; synthetic data come with PSF parameters, which are the training targets. Image counts
  are not stated and the archives were not fully listed. Paper full text is not open access; only the
  abstract was read, so the PSF-parameter targets and task wording come from the README. Organisms follow
  the README (HeLa, rat brain). enricher: added Convallaria majalis (README); organisms by file name,
  inferred: Homo sapiens = images/2D/*cells*, Rattus norvegicus = *brain*, Convallaria majalis = *plant*;
  synthetic images have none.'
