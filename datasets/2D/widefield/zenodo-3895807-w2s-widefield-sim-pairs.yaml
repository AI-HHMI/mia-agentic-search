notes: 'Single W2S_raw.zip (43.7 GB compressed, 79 GB uncompressed) listed with peek_archive: 1080 .npy files plus one .txt,
  folders raw/ImageNNN/ with wf_channelK.npy (~210 MB), sim_input_channelK.npy (7.9 MB) and sim_channelK.npy (2.1 MB) for K=0-2;
  1080 = 120 FOV x 3 channels x 3 files. Formats other because .npy is not in the schema list. Paper (arXiv ar5iv full text):
  Nikon SIM (Eclipse T1), widefield 512x512, SIM 1024x1024 (2x), 120 FOV x 3 wavelengths, 400 widefield captures per set; noisy
  inputs are averages of 1-16 captures, noise-free LR is the average of all 400. Paper split: 240 sets train, 120 test (the
  zip itself has no split folders, so splits_provided false). Pixel size, objective, fluorophores and cell type not stated on
  the Zenodo page or in the arXiv text (setup deferred to supplementary material, not read). The per-array dtype/shape are not
  verified. Annotations are acquired targets (SIM reconstruction), source automatic.'
