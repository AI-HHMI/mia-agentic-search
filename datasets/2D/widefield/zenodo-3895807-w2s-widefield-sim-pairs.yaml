short_name: Widefield-to-SIM denoising/SR pairs (human cells)
description: 120 fields of view of human cells imaged in 3 wavelengths on a Nikon SIM microscope (360
  image sets), each with 400 repeated widefield captures (for noisy inputs at several averaging levels
  and a noise-free average), the raw SIM input frames and the reconstructed SIM image as high-resolution
  target, for benchmarking joint denoising and super-resolution.
