notes: 'License: none stated on the GitHub README, the EPFL Infoscience record or the paper; the README only asks users to
  cite the paper. Voxel size not stated in the README, paper or supplement (the SIM images have twice the widefield
  resolution, 1024 x 1024 vs 512 x 512 px); the objective is a Plan Apochromat TIRF 100x 1.49 NA on a Nikon SIM
  (Eclipse T1) setup with an Andor iXon3 EMCCD. Cell type and labelled structures are not stated in the sources read.
  The zip (43.7 GB compressed, 79.0 GB uncompressed per tools/peek_archive.py) holds 1080 .npy files (1 .txt) under
  raw/Image*/, so formats is other (NumPy). The paper counts 120 fields of view x 3 channels = 360 image sets and
  144,000 images in total; only the first 40 archive paths were read, so the folder count was not checked. Targets are SIM reconstructions (automatic), not manual labels.'
