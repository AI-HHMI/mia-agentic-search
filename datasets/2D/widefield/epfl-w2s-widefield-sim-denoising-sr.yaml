schema_version: '1.2'
id: epfl-w2s-widefield-sim-denoising-sr
title: 'W2S: Microscopy Data with Joint Denoising and Super-Resolution for Widefield to SIM Mapping'
short_name: Widefield-to-SIM denoising/SR pairs (fluorescence)
description: Widefield2SIM (W2S) pairs real noisy low-resolution widefield fluorescence images of human cells with high-resolution
  structured-illumination microscopy (SIM) images of the same field of view. 120 fields of view were imaged in three channels
  (488, 561 and 640 nm), giving 360 image sets. Each set has 400 consecutive 512 x 512 widefield captures (from which noisy
  images at 1, 2, 4, 8 and 16 averaged frames and a noise-free image averaged over all 400 are derived) and a 1024 x 1024
  SIM image reconstructed with NIS-Elements. The raw archive stores each channel as NumPy arrays (widefield stack plus
  SIM reconstruction and SIM input frames).
