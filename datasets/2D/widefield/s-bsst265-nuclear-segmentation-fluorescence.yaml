notes: 'Pixel size not stated on the BioStudies record, in the zip listing or in the paper text seen (varies by
  magnification 10x-63x and microscope: Zeiss Axioplan II, Zeiss LSM 780, Leica SP8X). Zip holds 194 TIFF, 79 JPEG,
  79 SVG, 115 PNG files plus README. Paper read via PMC page; Europe PMC API was unavailable (503) so tools/paper.py
  could not be used. Train/test split described in paper; exact folder layout not fully listed. enricher: readme.txt
  and cc0.html inside dataset.zip state a CC0 waiver, unlike the CC-BY-4.0 recorded here; license left for review.
  image_description.csv gives the train/test split per image.'
