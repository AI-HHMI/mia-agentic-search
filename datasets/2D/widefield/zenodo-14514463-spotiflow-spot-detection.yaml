title: Spotiflow - benchmarking datasets
short_name: Spotiflow spot-detection benchmark (FISH, live)
description: 1,715 2D fluorescence images with spot-centre annotations in eight datasets used to benchmark Spotiflow
  spot detection - two synthetic (simple and complex PSF), four FISH (DNA FISH, HybISS mouse embryonic brain, MERFISH,
  smFISH) and two live-cell HeLa datasets (telomeres, TERRA RNA). Each image has a CSV of spot coordinates and the
  zip is organised in train/val/test folders per dataset.
