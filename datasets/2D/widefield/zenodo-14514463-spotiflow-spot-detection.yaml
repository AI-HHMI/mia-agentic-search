notes: 'Zenodo API records and the zip listing (peek_archive; 1,715 TIFF + 1,715 CSV, counts per dataset and split
  from the listing) and README read; paper Methods read from bioRxiv full text. Annotation: manual, with LoG or early
  Spotiflow candidates refined by hand; smFISH set is the unmodified Eichenberger et al. 2021 release. Pixel size
  differs per subset and is not given in the zip: HybISS crops come from 0.34 um or 0.15 um pixel acquisitions per
  the Methods, other subsets not stated, so voxel_size_nm is null. Organisms of the DNA FISH, MERFISH and smFISH sets
  are not stated in the sources read. This is version 2 of the Zenodo concept (earlier 10629709 has 7 datasets, without
  DNA FISH); Zenodo 14914082 holds the manuscript data. Zip holds TIFF + CSV only; channel count not checked,
  so channels is null.'
