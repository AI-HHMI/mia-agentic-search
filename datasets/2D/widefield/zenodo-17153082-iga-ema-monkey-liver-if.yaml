notes: 'Data: data.rar (381 MB) in Zenodo record 17153082 (concept 16333475); the RAR cannot be listed remotely
  (no range requests), so the file format and folder layout are unverified: formats is other and the
  split/label layout is inferred from the paper (5-fold cross-validation) and the code README. Paper Methods:
  monkey species not stated (organism left empty; images are of the monkey liver substrate, serum is human), Euroimmun EUROPattern microscope, one field per serum, 368 original untransformed images, ~1,170 x 980
  px, two experts with consensus (disagreements excluded); pixel size and objective not stated, so voxel
  size is null. Counts: 254 samples for binary / 3-class, 294 for 4-class; n_items uses the 368 images. The paper
  says the dataset "will be publicly available" and the Data Availability section points to this record.
  Related code-only Zenodo record 16333476 (and concept 16333475, which also lists data.rar) is the same data.'
