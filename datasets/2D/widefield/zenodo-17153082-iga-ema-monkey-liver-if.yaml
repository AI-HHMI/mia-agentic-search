title: IgA endomysial antibody (EMA-eq) immunofluorescence images on monkey liver substrate, expert-graded
  for celiac disease serology
short_name: IgA EMA monkey-liver patterns (widefield IF)
description: Single-field indirect immunofluorescence images of IgA endomysial antibody (EMA-eq) staining
  on monkey liver substrate, one image per serum sample from patients referred for suspected celiac disease
  at Ege University Hospital (June-December 2023). Each image carries an expert consensus pattern grade
  (negative, weak positive, strong positive, plus a gray-zone class) used for 2-, 3- and 4-class classification
  with 5-fold cross-validation. The paper reports 368 original images of about 1,170 x 980 px, from which
  254 (binary and 3-class) or 294 (4-class) were used.
