notes: 'Zenodo lists DAPI_Full_FOV.zip (772.6 MB, 1,000 full FOV 1936x1216), HEp-2-CNN-D.zip (1.4 GB, 100,000 256x256 crops)
  and HEp-2-ExpD.zip (141.9 MB, 10,000 crops). Images are lossless WebP (not in the schema format list, hence other). The
  zips could not be listed remotely (server reports no size for range requests), so counts and class names come from the Zenodo
  page and paper Methods, and annotations_verified is false. ExpD labels are by two experts; CNN-D labels were pre-classified
  by a VGG16 and reviewed by the experts, hence source mixed. Class is encoded in file names per the paper. Pixel size
  0.4651 um from paper Methods. n_items = 10,000 + 100,000 + 1,000.'
