title: CELLULAR - Drosophila S2 cell autophagy imaging dataset (mRFP-EGFP-Atg8a)
short_name: Drosophila S2 autophagy cells (widefield)
description: 6,240 time-lapse image samples (18,720 raw 2048x2048 TIFs in GFP, RFP and transmitted-light channels) of
  Drosophila S2 cells expressing the tandem mRFP-EGFP-Atg8a autophagy reporter under fed and starved conditions,
  imaged on an ImageXpress Micro Confocal in wide-field mode with a 40x objective. 53 samples carry per-cell PNG segmentation
  masks and YOLOv5 bounding boxes, with each cell classed as basal autophagy, activated autophagy or unknown.
