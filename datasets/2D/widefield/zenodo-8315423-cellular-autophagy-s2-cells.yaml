notes: 'Checked Zenodo record and API, zip listings (images.zip 18,720 TIFs of ~8.4 MB; masks.zip 14,006 PNG masks; metadata.zip
  has two .HTD acquisition files) and the Scientific Data paper (Methods, Data Records). Only 53 of 6,240 image samples
  are annotated (paper: 4,539 basal, 3,191 activated and 6,294 unknown cells); the rest are unlabeled time-lapse images
  that could serve self-supervised work. Annotated by three autophagy scientists in Labelbox on merged color JPGs.
  Pixel size is not stated in the paper or Zenodo description (HTD metadata files were not opened), so voxel_size_nm
  is null. Acquired in wide-field mode on an ImageXpress Micro Confocal system. Size is the sum of all Zenodo files (images.zip
  105.5 GB, images-color.zip 4.7 GB, plus small files = 110.3 GB); the full dataset is large, though masks.zip and bounding-boxes.zip
  are small. n_items counts image samples (3 TIFs each).'
