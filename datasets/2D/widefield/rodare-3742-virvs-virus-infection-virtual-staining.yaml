short_name: Virus-infected cells virtual staining (widefield)
description: Paired brightfield / nuclear-stain inputs (x) and virus-reporter fluorescence targets (y) for
  five viruses (HAdV, HSV-1, VACV, IAV, RV) in four cell types, stored as train/val/test npy arrays, plus
  Cellpose nuclei (and HAdV cell) masks for the test splits. Released with the VIRVS virtual-staining benchmark.
