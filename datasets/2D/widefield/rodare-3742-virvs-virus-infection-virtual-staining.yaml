notes: 'Rodare record, 12 zips, 202 GB: per-virus processed npy zips, *_raw zips, masks.zip, filename_to_index.zip.
  peek_archive: HSV.zip holds only {train,val,test}/{x,y}.npy; masks.zip holds test nuc.npy (HADV, IAV, RV,
  HSV) and HADV cell.npy. Training signal is the paired input/target (virtual staining); masks are automatic
  Cellpose cyto3 outputs on test splits only. Pixel size not stated on the record or paper text read, so
  null; n_items null (arrays of many tiles). Formats: npy has no listed value, hence other. HSV/IAV/RV raw
  images are also in IDR (idr0130/0128/0129). The *_raw zips were not listed.'
