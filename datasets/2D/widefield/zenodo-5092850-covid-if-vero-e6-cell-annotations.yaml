notes: 'Found via the bioimage.io record ilastik/covid_if_training_data (Zenodo 13220124), whose rdf.yaml points
  to this Zenodo record. The zip lists 49 HDF5 files (gt_image_000.h5 ...); the paper says manual annotations cover
  10 images, so how the 49 files relate to those 10 images is not confirmed. Pixel size is not stated in the paper
  (Nikon Ti2, Plan Apo lambda 20x/0.75, Andor iXon DU-888 EM-CCD; four channels: Hoechst, AF488, AF568, AF647/DyLight650).
  The paper also names BioImage Archive S-BIAD24 (raw images and pipeline outputs); that entry was not fetched here
  and is not part of this record. enricher: HDF5 contents inspected (3 raw channels, cell/nucleus instance labels,
  infected labels), see technical; channels 3 as stored (was 4, the acquired channels).'
