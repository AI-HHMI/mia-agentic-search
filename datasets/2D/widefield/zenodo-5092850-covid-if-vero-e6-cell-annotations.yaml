title: 'Covid-IF training data: cell segmentation and infection labels in SARS-CoV-2 immunofluorescence of Vero
  E6 cells'
short_name: SARS-CoV-2 infected Vero E6 cells (widefield)
description: Ground-truth data for a high-throughput immunofluorescence assay of SARS-CoV-2 antibodies. Widefield
  images of Vero E6 cells (Hoechst, serum/antibody and dsRNA virus-marker channels) with manually corrected cell
  instance masks and per-cell infected / non-infected annotations, used to train a boundary-prediction U-Net and
  tune infected-cell classification.
