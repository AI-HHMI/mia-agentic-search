notes: 'Source of facts: figshare API record (the landing page returns 403 to WebFetch), peek_archive listings of both
  zips and the MetaChrome paper (Europe PMC full text). training_fluo.zip holds 78 tif (image, *_masks and *_flows
  files) and traiining_GTG.zip holds 47 png plus 46 *_seg.npy. The paper says 46 G-banding fields of view were
  expert-annotated and that the fluorescence model was trained on hand-annotated images split 70/15/15; the zips do
  not state the splits. The G-banding images come from a publicly available G-banded chromosome dataset cited in
  the paper (its identity was not resolved), so that half may overlap another catalog record. Pixel size is not
  stated on the figshare record or in the paper Methods and was not read from file headers, so voxel_size_nm is
  null. The paper Data availability says data are available on request, but the figshare record is open
  and CC BY 4.0. The figshare description only points to the bioRxiv preprint.'
