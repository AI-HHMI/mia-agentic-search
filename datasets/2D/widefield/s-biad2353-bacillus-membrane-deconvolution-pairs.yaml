notes: 'Companion to catalogued S-BIAD2350 (same paper): that record holds instance-segmentation masks for Omnipose training,
  this one holds the restoration pairs (CARE_training: FM2FM_Input, FP2FM_Input, Target, 200 images each per the file lists;
  CARE_benchmark: 6 raw FM, 6 raw FP, 20 target images, plus FM2FM/FP2FM predictions and their segmentations). The deconvolved
  targets are produced automatically by the microscope software (DeltaVision SoftWorx), the BioStudies record says
  Annotation Type "other". Paper Methods: training images are 2048 x 2048 px, cropped to 1914 x 1914 px after deconvolution,
  from a DeltaVision Ultra with PCO Edge sCMOS and 100x NA 1.45 objective. Pixel size and total size not stated on the BioStudies
  record or in the Methods that were read; release date not recorded. Counts of benchmark images come from the TSV file lists
  (rows minus header).'
