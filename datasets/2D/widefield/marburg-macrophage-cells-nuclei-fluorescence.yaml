notes: 'Ground truth: OpenCV threshold/contour segmentation, then manual correction in Fiji by a biomedical researcher (paper Methods). Pixel size not stated on page, paper, README or TIFF headers. enricher: license CC-BY-4.0 and dataset DOI 10.17192/fdr/185 from the open_UMR record data.uni-marburg.de/handle/dataumr/231 (was unknown; the Box share was unreachable); repository LabWebsite -> other (open_UMR, Marburg institutional repository); download_url -> direct tar.gz on open_UMR; formats tiff confirmed; channels 2 (DAPI = Hoechst 33342 nuclei, mCherry = HCS CellMask Red cells, one file each); annotation source mixed -> proofread; semantic-segmentation added (binary masks/); annotations verified from the full archive.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "synmikro_macrophages.tar.gz  196,880,077 B (808,857,858 B unpacked, 6300 TIFFs)\n  train/images/          128  <NNN>_DAPI.tif, <NNN>_mCherry.tif (64 images x 2 channels)  346.6 MB\n  train/masks/           128  same names, binary masks                                    167.8 MB\n  train/object_masks/<NNN>/  4125  <x>_<y>_<w>_<h>_<DAPI|mCherry>.tif, one per instance  107.1 MB\n  test/images/            36  (18 images x 2 channels)                                   97.4 MB\n  test/masks/             36                                                             47.2 MB\n  test/object_masks/<NNN>/  1022                                                          26.5 MB\n  test_clustered/images/ 156  256x256 uint8 patches of clustered cells                    2.6 MB\n  test_clustered/masks/  156                                                              0.3 MB\n  test_clustered/object_masks/<NNN>/  513                                                13.3 MB"
    n_files: 1
    listing_complete: true
  sample: null
  arrays:
  - role: raw
    path_pattern: synmikro_macrophages.tar.gz::*/images/*.tif
    format: tiff
    axes: yx
    shape:
    - 1024
    - 1280
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 1408
    - 65520
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'One channel per file: <NNN>_DAPI.tif (nuclei, Hoechst 33342) and <NNN>_mCherry.tif (cells, HCS CellMask Red). train/ and test/ images are 1024x1280 uint16; test_clustered/ images are 256x256 uint8 patches (LZW). Plain single-page TIFFs.'
  - role: label
    path_pattern: synmikro_macrophages.tar.gz::*/masks/*.tif
    format: tiff
    axes: yx
    shape:
    - 1024
    - 1280
    shape_varies: true
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: nucleus (DAPI files) / cell (mCherry files)
    alignment: same-grid
    alignment_notes: 'Pairing: <split>/masks/<NNN>_<channel>.tif labels <split>/images/<NNN>_<channel>.tif; same shape (test_clustered masks 256x256, LZW).'
  - role: label
    path_pattern: synmikro_macrophages.tar.gz::*/object_masks/*/*.tif
    format: tiff
    axes: yx
    shape:
    - 1024
    - 1280
    shape_varies: true
    dtype: uint8
    compression: lzw
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: one instance (nucleus for _DAPI, cell for _mCherry)
    alignment: same-grid
    alignment_notes: 'Instance masks: <split>/object_masks/<NNN>/<x>_<y>_<w>_<h>_<channel>.tif is one full-frame binary mask of one object in image <NNN>; x_y_w_h is its bounding box (checked on 2 masks). train 4125 = 2044 cells + 2081 nuclei, test 1022 = 508 + 514, as in the paper.'
  notes: 'The whole tar.gz (196,880,077 B) was streamed once (requests + tarfile) to list all 6300 members; 2 files per folder were kept in a temp dir, read with tifffile, then deleted. value_range from those files only: images 1408-65520, values in steps of 16 (12-bit data shifted to 16 bit) with saturation at 65520. No direct per-file links: only the one tar.gz, and TensorSwitch cannot pull members out of a .tar.gz, so sample is null. Hosts data.uni-marburg.de / open.uni-marburg.de are not on the TensorSwitch allowlist. The Box share in the paper (box.uni-marburg.de) was unreachable from this run (proxy 502). Voxel size not found; checked: TIFF headers (no resolution tags), open_UMR record and API metadata, CELLS page, paper full text (Methods: Nikon Ti-E, 20x Plan Apo VC, DS-Qi1Mc; no pixel size), GitHub README.'
