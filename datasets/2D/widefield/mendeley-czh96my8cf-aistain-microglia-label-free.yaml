notes: 'Mendeley API listing, 457 files: wells A5, B5, C5 with 25 fields each, six 2048 x 2048 TIFFs per field (Transmission, AF 546, DAPI, pHrodo, cytoplasm Objects, cytoplasm Probability), plus OME-XML, the AIstain .nn model and a demo assay. OME-XML: uint16 channels, 0.325 um pixels. Paper (Europe PMC): ground truth gated on CellTracker/Hoechst with manual re-gating (source mixed). Full 2,240-image training and 560-image validation sets are on Zenodo as 7z (10.5281/zenodo.15532325, 15689727), not listed or included here. Label dtype and encoding not probed (host blocks range reads).'
