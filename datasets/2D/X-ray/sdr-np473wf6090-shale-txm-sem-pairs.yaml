notes: 'Stanford Digital Repository record (version 3, one file TXM-SEM.zip, 169 MB): peek_archive lists 298 TIFF files, 149 named
  SEM000-SEM148 in "SEM dataset/" and 149 named TXM000-TXM148, so the pairing is inferred from matching indices and the repository
  description ("acquired and paired TXM-SEM image dataset"); the actual registration of each pair was not checked. The associated
  paper (Computers & Geosciences) is not open access and its abstract is not available through Europe PMC or Crossref, so pixel
  size, instrument settings, how the pairs were registered and the intended ML task (cross-modality enhancement) are unknown.
  Counted as restoration-type pairs because the paper title and record describe the pairs as training data for enhancing microscope
  images; the target (SEM) is a measurement, hence annotations.source automatic is a best fit, not a manual label. Sources checked:
  repository page and JSON record, zip listing, Crossref metadata.'
