notes: 'Stanford Digital Repository v3, one zip (TXM-SEM.zip): 149 TXM (TXM dataset/TXMnnn.tif) and 149 FIB-SEM (SEM dataset/SEMnnn.tif)
  slices of a 30 um Vaca Muerta shale cylinder, paired by index. Paper (accepted manuscript on OSTI): TXM reconstructed at 31.2 nm/px;
  FIB-SEM at 33.6 nm/px was filtered, rotated, padded with black pixels, scaled, resampled at TXM resolution and registered to the matched
  TXM slice; TXM grey values reindexed to 0-255 to match the SEM histogram; SEM charging artifacts masked out. Paper split 119/5/20
  is not in the files. No organism (rock sample). Target (SEM) is a measurement, so annotations.source automatic is a best fit. enricher:
  voxel size 31.2x31.2 nm from paper Section 3.1-3.2 (was null); modality other -> FIB-SEM per paper; ml.tasks adds super-resolution
  (paper tests SISR models).'
