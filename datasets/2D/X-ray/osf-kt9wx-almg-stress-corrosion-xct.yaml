description: 100 in-situ X-ray computed tomography images (2048x2048 TIFF) of an aluminium-magnesium alloy
  sample taken from a retired Navy ship, imaged at the Diamond Light Source synchrotron during a slow-strain
  tension test, with 100 TIFF masks of fractures and inclusions. Masks were generated with image-processing
  methods (weak supervision). Component of the Materials Data Segmentation Benchmark and Model Garden
  (MDS B&MG).
