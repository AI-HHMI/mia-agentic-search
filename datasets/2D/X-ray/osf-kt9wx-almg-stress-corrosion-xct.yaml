notes: 'Materials-science synchrotron X-ray CT (no organism). OSF component kt9wx: Images 100 TIFF (1.26 GB), Masks 100 TIFF (630 MB), Models one 625 MB h5, Scripts folder. Per the wiki the masks were produced by image-processing techniques, not manual labelling, to train the benchmark model weakly supervised (annotation source automatic). Images are described as 2048x2048; whether they are slices of one reconstructed volume is not stated, so the record is 2D and voxel size is not given (not on the wiki or listing). No paper found. License BSD 3-Clause from the OSF project license record (a software license applied to data). Sibling benchmark components are separate datasets.'
