notes: 'Three zips on the USDA Ag Data Commons (Figshare-hosted): soil aggregate (45 MB, 16 image/mask
  pairs in train/test folders), walnut leaves (13.5 MB, 58 PNGs = 29 image/mask pairs in per-leaf train/test
  folders) and almond bud (12 MB, 28 files = 14 pairs). Slices are 2D images from 3D CT scans; the soil
  and leaf scans are 650 nm pixels (10x objective, 23 keV), the almond bud is 1.72 µm pixels (4x lens),
  so voxel_size_nm lists the soil/leaf value only. Almond bud files are JPEG per the archive listing,
  the rest PNG. Mask colour codes are on the landing page. License CC BY 4.0 as stated on the data.gov
  catalog page; the USDA Ag Data Commons page itself returned 403. Size and item counts are from archive
  listings (zip sizes summed, approximate). Publication date not stated on the pages read. enricher: voxel_size_nm
  set to null (was 650 nm): soil/leaf 650 nm vs almond 1.72 um pixels differ; size exact 70,742,954 B.
  organisms: Juglans regia = leaf zip, Prunus dulcis = Almond zip.'
