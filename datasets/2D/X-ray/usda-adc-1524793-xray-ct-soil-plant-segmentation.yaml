id: usda-adc-1524793-xray-ct-soil-plant-segmentation
title: X-ray CT data with semantic annotations for soil aggregate, walnut leaf and almond bud segmentation
short_name: Soil and plant tissue segmentation (X-ray µCT)
description: >-
  Reconstructed X-ray micro-CT slices (ALS beamline 8.3.2) of a forest soil aggregate, six walnut
  (Juglans regia) leaf scans and an almond (Prunus dulcis) flower bud, each with hand-annotated
  multi-class PNG masks (e.g. pores, mineral solids and particulate organic matter for soil;
  epidermis, mesophyll, bundle sheath extension, vein and air for leaves; bud scales, flower tissue
  and air for the bud), released with a Google Colab deep-learning segmentation workflow.
