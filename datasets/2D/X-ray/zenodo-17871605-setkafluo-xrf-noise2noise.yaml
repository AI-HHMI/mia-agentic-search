id: zenodo-17871605-setkafluo-xrf-noise2noise
title: SetkaFluo demo dataset and training inputs for Noise2Noise denoising of multi-element XRF maps
short_name: Multi-element XRF maps for Noise2Noise (X-ray)
description: Example and training data for SetkaFluo, a self-supervised Noise2Noise denoiser for X-ray fluorescence (XRF)
  microscopy maps. Provides per-detector-element XRF maps (statistically independent noisy views of the same scan, used to
  build Noise2Noise training pairs), fitted maps, and low-dose/reference comparison images for a Siemens-star resolution target
  and a cryo-fixed biological cell.
