notes: 'Unlabeled by design: released as Noise2Noise training inputs, so it qualifies as self-supervised/restoration data.
  input_data.zip (480 files: 474 TIFF + 6 NPZ detector-element maps and spectrum) and training.zip (82 files: 75 TIFF plus
  6 model weights .weights.h5, which are not images) were listed with peek_archive; n_items counts the 549 TIFF files plus
  6 NPZ maps and size is the two archives (2.67 GB); the NPZ detector-element arrays (the raw Noise2Noise inputs) are not
  in the formats enum and are described here. Pixel size, number of independent scans and the cell species are not stated
  on the Zenodo page, GitHub README or the paper abstract (paper is not open access; full text not read), so voxel size and
  organism are left empty.'
