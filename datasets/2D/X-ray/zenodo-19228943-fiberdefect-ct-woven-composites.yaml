notes: 'License on the Zenodo page is the custom "Academic Non-Commercial Research License" (commercial use prohibited
  without written permission; cite the paper). Zenodo API metadata lists no license, the license text is shown on
  the record page. FiberDefect-CT.zip listed with peek_archive: 1800 .nii.gz members = image/sample1..9 and label/sample1..9,
  each 100 slices (named sampleN_xy_slice_K and sampleN_xz_slice_K, so two section directions). Voxel/pixel size
  and scanner not stated on the Zenodo page or the GitHub README. The paper (Composites Communications) is not open
  access and was not read; label classes are taken from the record description. How labels were made is not stated,
  so annotations.source is unknown. enricher: sampled labels hold values 0-3 (background + 3 classes); NIfTI headers
  carry the default 1.0 spacing, no calibration.'
