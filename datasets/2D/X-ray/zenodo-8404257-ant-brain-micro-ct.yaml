notes: 'Zenodo API: license cc-zero, files README.md, testing.zip (4.62 GB), training.zip (9.32 GB). Zip listings (peek_archive):
  training.zip has 141,692 members (69,846 .tif plus image/_mask pairs), testing.zip 16,254 files (16,246 .tif, 8 .info);
  masks are named like <species>__maskNNN.tif / <image>_mask.tif. Paper (Natural Sciences) is not open access and its Wiley
  and Authorea pages returned 403, so voxel size, scanner, slice dimensions and the exact mask procedure beyond "semi-manually
  segmented" are not stated on the Zenodo page, abstract or code README (checked all three); voxel_size_nm and n_items left
  null. Author list not retrieved from the sources fetched. Mask class is brain only; the paper says the network generalises
  to other neural tissue.'
