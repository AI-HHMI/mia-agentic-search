notes: 'Materials-science X-ray CT (no organism). OSF component uzxpc: Images 100 JPG, Masks 100 JPG,
  Models 2 h5 (1.06 GB), Scripts 3 .py. Voxel size 1.25 um from the wiki. The 100 images are slices from
  two scans (1100Al_s060_98RH03_02Jy20_1f: 57, _29Jn20_2g: 43; slice numbers not contiguous), so the record
  stays 2D. JPEG masks are lossy: values cluster at 0 and 255 with edge artefacts, threshold at 128. No
  paper found; annotation procedure and source not described. License BSD 3-Clause from the OSF project
  license record (a software license applied to data). enricher: voxel z 1250 -> null (2D record); size
  9.2 MB -> 1,064,640,293 B (full OSF listing incl. models; images + masks 9,228,580 B); files are 1014x992,
  not the 1024x988 the wiki states.'
