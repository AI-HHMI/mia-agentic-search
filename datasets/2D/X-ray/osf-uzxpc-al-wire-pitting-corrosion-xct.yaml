description: 100 in-situ X-ray computed tomography images (1024x988 JPEG, 1.25 um voxels) of a commercial-purity aluminium wire exposed to NaCl droplets at 98% relative humidity, acquired at Sandia National Laboratories, with 100 JPEG masks of corrosion pits. Component of the Materials Data Segmentation Benchmark and Model Garden (MDS B&MG); trained models and inference/evaluation scripts are provided alongside.
