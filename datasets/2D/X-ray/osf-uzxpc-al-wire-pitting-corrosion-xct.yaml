notes: 'Materials-science X-ray CT (no organism). OSF component uzxpc: Images 100 JPG (8.6 MB), Masks 100 JPG (0.6 MB), Models 2 h5 (1.06 GB), Scripts 3 .py. Voxel size 1.25 um and image size 1024x988 are from the wiki; the images are listed as 100 images, and whether they are slices of one volume is not stated, so the record is 2D with isotropic voxel size copied from the wiki. JPEG masks are lossy so values may not be exactly binary. No paper found; annotation procedure and source not described. License BSD 3-Clause from the OSF project license record (a software license applied to data). Sibling benchmark components are separate datasets.'
