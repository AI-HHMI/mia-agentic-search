notes: 'One record for the whole hub: data/datasets.json lists 101 records (About page says 92) with 1,197
  images and masks (per-record counts, not checked in files); 95 Train, 6 Test. Pixel size is per record
  (0.65 um in 61, 0.642 um in 17, others 0.361-1.6 um, none in 10), so voxel_size_nm is null. Files are
  on USDA Ag Data Commons via per-record ndownloader links, which return a WAF challenge here, so archives
  and license could not be read; the JSON license field is empty for all 101. About 64 records cite papers
  (e.g. 10.1093/plphys/kiae659, 10.1111/nph.17772) that were not read. May overlap usda-adc-1524793 (walnut,
  almond). A maintainer may split this per deposit.'
