id: leafcthub-leaf-microct-tissue-segmentation
title: 'Leaf CT Hub: leaf X-ray micro-CT datasets with tissue segmentation masks'
short_name: Plant leaf tissue segmentation (X-ray micro-CT)
description: Catalog of 101 leaf X-ray micro-CT dataset records (57 species, e.g. Viburnum, Pinus, Olea,
  Quercus, Vitis, Populus) each pairing reconstructed 2D cross-section slices with hand-annotated grayscale
  tissue masks (5 to 8 classes such as epidermis, vascular tissue, mesophyll and air space). 1,197 slice/mask
  pairs in total, mostly scanned at ALS beamline 8.3.2. Full-resolution stacks and masks are hosted on
  USDA Ag Data Commons and linked per record.
