notes: 'Zip listing: CFRP 2,754 XCT + 2,754 MASK, FFRP_Autoclave 1,786 + 1,786, FFRP_Oven 1,800 + 1,800
  (12,681 files incl. dataset_info.json). dataset_info.json gives ~1.3 um in-plane only for CFRP (source
  paper); FFRP empty; enricher: slices are 1024x1024, smaller than the stated 3.3 x 2.8 mm FOV at 1.3
  um (crop or resampled is not stated), so voxel_size_nm stays null. Whether slices come from a few volumes
  or many is not stated, so dimensionality is 2D. How the masks were made (manual or model-assisted) is
  not stated, so annotations.source is unknown. The accompanying manuscript is not cited on the record
  and Europe PMC found no match, so publications is empty. The OOD protocols A0-C3 are mentioned but no
  split files were seen in the listing. X-ray CT is micrometre-scale material imaging rather than biological
  microscopy.'
