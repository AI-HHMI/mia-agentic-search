title: Multi-scale annotations of brain structure in a mouse thalamocortical sample (synchrotron X-ray microCT)
short_name: Mouse brain microstructure masks (X-ray microCT)
description: Image crops from four brain regions (somatosensory cortex, striatum, thalamic reticular nucleus, zona
  incerta) of a heavy-metal-stained mouse thalamocortical sample imaged with synchrotron X-ray microCT at 1.17 um
  isotropic resolution, with manual pixel-level masks of cells, myelinated axons and blood vessels. Packaged as
  a notebook archive (image and mask arrays plus inter-rater reliability image sets). The full raw volume and region-of-interest
  annotations are separate figshare/bossDB deposits.
