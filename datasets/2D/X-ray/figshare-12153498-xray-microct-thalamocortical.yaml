notes: 'Deposit content (archive inspected): 128 2D images of 128x128 px (32 per region CTX/STR/TRN/ZI, 150x150
  um, paper Results) with pixel masks 1=axon, 2=blood vessel, 3=cell (ids from the notebook), plus 2x180 128x128
  uint8 tif patches with brain-region class keys (inter-rater test). Sibling deposits: raw 1420x5805x720 8-bit volume
  (figshare 12153573, CC-BY-4.0), ROI annotations (10.6084/m9.figshare.12153549.v1), bossDB prasad2020; the 4 annotated
  257x257x361 volumes in the paper are not in this deposit. enricher: dimensionality 3D -> 2D and voxel z -> null
  (arrays are stacks of independent 2D crops); n_items 128 (was null). Main arrays are .npz (no schema format);
  formats lists tiff for the inter-rater patches.'
