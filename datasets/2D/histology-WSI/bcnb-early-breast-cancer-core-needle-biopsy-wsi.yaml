notes: 'The dataset page offers a request form and the GitHub download_dataset.md links Google Drive, OneDrive, Aliyun and
  Baidu mirrors; the Google Drive folder was listed without signing in: WSIs/ (1.jpg ... with 1.json, 2,116 entries), dataset-splitting/
  (train/val/test id txt), paper_patches.zip, patient-clinical-data.xlsx, README.txt. Probing 1.jpg by header gave a 31001x11486
  RGB JPEG; 1.json holds a "positive" list of polygons with pixel vertices (annotated tumor regions; the page says only part
  of tumor regions are annotated). The paper splits 840 training and 218 test patients (4:1, plus 25% validation) while the
  page says 6:2:2, so the split files should be read. License is the dataset''s own non-commercial, no-redistribution, cite-the-paper
  terms. Pixel size, scanner settings and total size are not stated on the pages read. Publication date taken as unknown (paper
  2021). enricher: download_url = public Drive folder; README.txt repeats the license.'
