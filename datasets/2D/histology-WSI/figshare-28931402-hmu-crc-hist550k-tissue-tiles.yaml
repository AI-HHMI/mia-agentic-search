  notes: 'Listing: Figshare API for the 9 items, 9 files, 69,889,154,635 B, complete. Archive contents: a stdlib-only scratch
    script read each 7z signature header and its LZMA-encoded header by range (0.5-0.76 MB per archive): 557,519 .png names
    in one class folder per archive (paper: 550,000). Sample: decoded the first 1-4 MB of the first data folder of ADI.7z and
    0.4 MB of TUM.7z (LZMA2): the streams are TIFFs (II*), 224x224x3 uint8, LZW, photometric RGB, range 0..255 in the first
    5 tiles (means 171-203); the stream-to-name mapping was not decoded, but every name in the archives ends in .png. Total
    15.8 MB read. No single tile can be fetched directly: 7z is solid LZMA2 (not range-addressable like a zip), so sample
    is null and TensorSwitch cannot use these archives. Class names from the Figshare item titles and the paper. Voxel size
    not found; checked Figshare API metadata, paper full text (only 20x magnification). Download: each ndownloader.figshare.com
