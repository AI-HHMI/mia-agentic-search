short_name: HMU-CRC-Hist550K colorectal tissue tiles (H&E)
description: 550,000 H&E image tiles (224x224 px PNG) from 500 colorectal cancer whole slide images (Aperio AT2, 20x, Harbin Medical University Cancer Hospital, 2013-2015), labelled with eight tumour-microenvironment tissue classes (ADI, DEB, LYM, MUC, MUS, NORM, STR, TUM) from pathologist-drawn regions with three-level cross-validation, plus a clinical metadata spreadsheet (10 clinical parameters). Released as one Figshare item per class (8 archives) plus the clinical file.
