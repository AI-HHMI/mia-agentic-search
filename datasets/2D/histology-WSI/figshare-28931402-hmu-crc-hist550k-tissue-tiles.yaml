notes: 'Data split over nine Figshare items, one per tissue class (ADI 28931402, LYM 28936250, DEB 28939016, MUC 28939100, MUS 28939115, NORM 28939151, STR 28939169, TUM 28939460; one .7z each, 6.7-10.3 GB) plus the clinical xlsx (28940609); all CC BY 4.0 on Figshare (paper CC BY-NC-ND 4.0). Labels are tile-level tissue classes from pathologist-drawn regions, not masks. Pixel size not stated (only 20x). The paper names a CSV clinical file; Figshare has an xlsx. No train/test split. enricher: 7z headers read for all 8 archives (557,519 tile names, folder per class) and the first tiles decoded: the .png-named files are LZW TIFFs (224x224x3 uint8), so formats tiff (was png) and annotations_verified true. size_bytes from the Figshare file listing (was 69.9 GB stated).'
