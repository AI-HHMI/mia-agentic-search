notes: 'The data are split over nine Figshare items, one per tissue class (ADI 28931402, LYM 28936250, DEB 28939016, MUC 28939100, MUS 28939115, NORM 28939151, STR 28939169, TUM 28939460; sizes 6.7-10.3 GB each, all .7z, about 69.9 GB total) plus the clinical xlsx (28940609); all CC BY 4.0 on Figshare (the paper is CC BY-NC-ND 4.0). Archive contents were not listed (7z, cannot be peeked), so annotations_verified is false; the tile size (224x224 PNG), class names and the 550,000 tile count are from the paper. Labels are tile-level tissue classes from pathologist-drawn bounding boxes (the paper calls it pixel-level classification), not segmentation masks. Pixel size is not stated (only 20x magnification). The paper mentions a root folder structure with a CSV named HMU CRC Clinical.csv while Figshare provides an xlsx. No train/test split is provided.'
