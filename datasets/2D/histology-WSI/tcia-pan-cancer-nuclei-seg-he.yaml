title: Pan-Cancer-Nuclei-Seg - Dataset of Segmented Nuclei in H&E Stained Histopathology Images of 10 Cancer Types
short_name: Pan-cancer H&E nuclei segmentation (histology)
description: Nucleus segmentations of 5,060 TCGA H&E whole slide images from 10 cancer types, released as per-slide polygon CSV files (automatic segmentation with slide-level quality control), plus 1,356 manually corrected 256x256 patches at 40x (0.25 um per pixel) from 14 cancer types, as PNG H&E image patches with instance-level masks. The WSIs themselves are not redistributed and come from TCGA/GDC.
