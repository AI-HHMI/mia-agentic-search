notes: 'Two parts. (1) Automatic nucleus polygons for 5,060 TCGA WSIs from 10 cancer types, made with a Mask R-CNN/U-Net pipeline and graded by QC (the WSIs themselves are NOT in the package; download them from TCGA/GDC). (2) Manual segmentation data - 1,356 PNG patches (256x256 at 40x) with H&E image and instance masks, made by correcting Mask R-CNN output. n_items counts the 1,356 manual patches. Size 665.94 GB is the main TCIA Aspera package; the file listing was not inspected (Aspera), so annotations_verified is false. TCIA page states CC BY 3.0 for the data (the paper is CC BY 4.0). The TCIA page gives 1,356 and 1,365 for the patch count; the paper says 1,356. A DICOM-converted version of the automatic segmentation (manifests only, IDC) is on Zenodo 10.5281/zenodo.22818207 (CC BY 4.0, v3 published 2026-10-07). enricher: svs removed from formats (Read-Me: WSIs not redistributed).'
technical:
  method: metadata-only
  size_source: page-stated
  layout:
    tree: |
      TCIA Aspera (Faspex) package, 665.94 GB (page-stated), per TCIA Read-Me.docx:
        <TYPE>_polygon/<WSI name>.svs.tar.gz   per-WSI polygon CSVs, one per 4000x4000 tile
          <x>_<y>_4000_4000_<mpp>_1-features.csv  (AreaInPixels, PhysicalSize, Polygon)
        <TYPE>_meta/                           caMicroscope metadata
        manual_segmentation_data.tar.gz        1,356 (page: 1,365) patches, 256x256 at 40x
          <ID>_crop.png                         H&E patch
          <ID>_labeled_mask_corrected.png       corrected instance mask
          <ID>_labeled_mask_corrected_rgb.png   visualization
          <ID>_labeled_mask_common0.png         extra manual masks (27 patches)
      direct HTTP files on the TCIA page: list_of_verified_wsis.txt, wsi_quality_control_result.txt,
        random_segmentation_region_checking_result.txt, Read-Me.docx,
        Pan-Cancer-Nuclei-Seg_1365patches_to_TCGA-ID_readme.txt
