  notes: 'Metadata only: the data are offered only as a TCIA Aspera/Faspex package (needs IBM Aspera Connect); no
    file listing could be read, nothing was probed or sampled. Arrays, names and the instance-mask encoding come from
    the TCIA Read-Me.docx ("Manually corrected Mask R-CNN''s segmentation results"; page: "instance-level segmentation
    masks") and the patch readme txt; shapes, dtypes and value ranges are open. The 665.94 GB size is page-stated for
    the whole package (mostly polygon CSVs); the manual patch tarball size is not stated. No direct download: checked
    the TCIA page links (only small TXT/DOCX files are HTTP), the Faspex package URL (HTML page, host not on the
    TensorSwitch allowlist), the paper Data Records (TCIA only) and the GitHub README (a Stony Brook Box share of
    the automatic results, not a direct file). Voxel size: 250 nm (0.25 um/px at 40x) from the paper, for the manual
    patches; WSI tiles carry their own mpp in the CSV file names (e.g. 0.2525).'
