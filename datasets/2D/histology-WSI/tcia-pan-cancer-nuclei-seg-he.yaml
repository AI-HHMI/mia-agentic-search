notes: 'Two parts. (1) Automatic nucleus polygons for 5,060 TCGA WSIs from 10 cancer types, made with a Mask R-CNN/U-Net pipeline and graded by QC (the WSIs themselves are NOT in the package; download them from TCGA/GDC). (2) Manual segmentation data - 1,356 PNG patches (256x256 at 40x) with H&E image and instance masks, made by correcting Mask R-CNN output (manual set verified against pathologists). n_items counts the 1,356 manual patches. Size 665.94 GB is the main TCIA Aspera package; the file listing was not inspected (Aspera), so annotations_verified is false. TCIA page states CC BY 3.0 for the data (the paper is CC BY 4.0). The TCIA page gives 1,356 and 1,365 for the patch count; the paper says 1,356. A DICOM-converted version of the automatic segmentation (manifests only, IDC) is on Zenodo 10.5281/zenodo.22818207 (CC BY 4.0, v3 published 2026-10-07).'
