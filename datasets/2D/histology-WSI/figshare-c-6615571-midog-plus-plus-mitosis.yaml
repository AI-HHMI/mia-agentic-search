notes: 'Figshare collection has 506 items: one TIFF per ROI image (a sampled item is 161 MB, CC0), plus the annotation JSON (2.8 MB) and SlideRunner SQLite database. Total size was not summed, so size_bytes is null. Pixel size is 0.23-0.25 um/px depending on scanner (paper table 1: Hamamatsu XR/S360, Leica/Aperio ScanScope CS2, 3DHistech Pannoramic Scan II), not a single value, so voxel_size_nm is null. The MIDOG 2021 training set is already in the catalog separately (zenodo-4643381); this record is the extended MIDOG++ release.'
