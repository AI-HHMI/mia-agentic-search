  notes: 'Exact listing of all 506 figshare items via the collection API (69,851,282,536 B). Probed 545.tiff: 7-page
    tiled TIFF pyramid, base [5412, 7215, 4] uint8 (RGBA, photometric RGB), LZW, 128 px tiles; no resolution tag
    reported. Read MIDOG++.json (2.76 MB): keys info, licenses, images, categories, annotations; 553 image entries
    (vs 503 TIFFs in the collection, not resolved), 26,286 boxes (mitotic figure 11,937, not mitotic figure 14,349),
    all boxes 50 px wide; each annotation has per-expert ''labels''. Most common image sizes 6577x4933 (199), 7215x5412
    (154), 6447x4835 (49). datasets_xvalidation.csv: 392 train / 111 test slides. Pixel values not measured (the
    TIFFs are ~140-160 MB each).'
