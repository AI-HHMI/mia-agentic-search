notes: 'Figshare item v2 with five zips (part01-05, 3.0 GB each, last 2.7 GB) plus a clinical CSV, so download_url is null; the API file list shows part03 twice, size counts it once. Counts
  from listing all five zips: T-G1 61,386, T-G2 70,371, T-G3 51,703 patches (183,460) from 87 slide folders. The page says the complete dataset has GeoJSON region annotations and this release is a
  selected subset, but the numbers listed match the full 183,460 patches, and no GeoJSON files are in the zips. No paper found, so the grading labelling procedure, patch scale and pixel size are not
  stated; annotation source unknown. Labels are slide/region-derived grades, not per-patch pixel masks.'
