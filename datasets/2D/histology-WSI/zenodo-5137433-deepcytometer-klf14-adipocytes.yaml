notes: 'Sources: Zenodo page/API record and bioRxiv full text (tools/paper.py). histology.7z (29.1 GB) holds 165
  Hamamatsu .ndpi slides; klf14.7z (2.3 GB) holds meta CSV, hand-traced windows and intermediate training files;
  deepcytometer_pipeline_v8.zip (60.6 MB) holds weights. Record: 131 windows from 20 slides; paper: 55 windows /
  2,117 contours used for training from the cleaned-up v2 set. Formats list tiff for the training windows; NDPI
  has no enum value. Pixel size 0.454 um from the paper. Splits are 10-fold CV indices in a pickle in the pipeline
  zip. Sibling record Zenodo 5149005 (DeepZoom images, automatic segmentations) not included. enricher: annotations_verified
  true, 131 .svg + 131 .xcf contour files seen in the klf14.7z file index (was false).'
