notes: 'Sources checked: Zenodo page and API record (file list and long description), and the bioRxiv full text via
  tools/paper.py. Files: histology.7z (29.1 GB; 165 whole slides, .ndpi), klf14.7z (2.3 GB; metadata CSV, hand-traced
  windows, intermediate training files) and deepcytometer_pipeline_v8.zip (60.6 MB; weights). The hand-traced data
  is described as 131 windows from 20 slides on the record; the paper reports 55 windows with 2,117 contours used for
  training, from the cleaned-up v2 set. Formats list tiff for the training windows; slides are Hamamatsu NDPI, which
  has no schema enum value. Pixel size 0.454 um stated in the paper (highest resolution level). The 7z archives
  were not opened, so annotation files were not seen in a listing; splits are 10-fold cross-validation indices stored
  in a pickle in the pipeline zip. A sibling record (Zenodo 5149005) holds DeepZoom images and automatic
  segmentations and is not included here. size_bytes is the sum of the three files on this record.'
