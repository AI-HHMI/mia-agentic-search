  notes: 'Both .7z archives are solid LZMA archives that tools/listing.py cannot expand. Their file indexes were
    read with a small requests script: 32-byte start header plus the LZMA-encoded end header by range request (klf14.7z
    99,166 B, histology.7z 3,682 B), names only, no sizes per member. Pipeline zip listed with listing.py. No member
    could be probed or sampled without decompressing a solid block, so shapes, dtypes, compression and value ranges
    of the slides and windows are unknown. Format of the SVG contours is recorded as polygons from the record description
    (vector contours); array format other because svg/ndpi are not enum values. size_bytes = complete Zenodo listing
    (3 files). The 549 .pickle files in training_augmented were not opened.'
