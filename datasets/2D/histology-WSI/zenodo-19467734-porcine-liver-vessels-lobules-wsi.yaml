notes: 'Files are .7z archives, so their contents could not be listed remotely; layout (training/ testing/ with images/ masks/) is from the Zenodo description, patch counts and TIFF format from the paper. Native WSI format not stated (Hamamatsu NanoZoomer; format unconfirmed). Only the 4 training WSIs are described as annotated; the 8 test WSIs are called unannotated in the paper but testing data on Zenodo, so check on download. Bile duct as fourth vessel class is from the paper text and confusion-matrix caption. Split: 10% of patches held out, 5-fold CV in the rest. Concept record 17041226 holds earlier versions (this is v3).'
