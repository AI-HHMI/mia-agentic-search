id: zenodo-12804564-mouse-ovary-follicle-boxes
title: Follicle counting in mouse ovarian images
short_name: Mouse ovary follicle boxes (H&E sections)
description: 643 H&E-stained sections of mouse ovaries from 92 mice (6 to 8 sections per mouse), digitised on a Panoramic
  250 Flash slide scanner (about 0.12 um per pixel, brightfield) and cut into one very large TIFF per section. Each section
  has JSON bounding-box annotations of primordial, primary and secondary follicles, plus per-slide scanner offset files and
  merged annotation files, for follicle detection and counting.
