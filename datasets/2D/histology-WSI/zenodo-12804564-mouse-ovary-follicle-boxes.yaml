notes: 'Zenodo record, zip listing (643 TIFF, 21.8 GB uncompressed; 643 per-section annotation JSON; 118 scanner offset JSON; merged
  all_annotations*.json and annotations_test.json) and the 2018 paper (full text via Europe PMC) were read. Annotation classes in a
  sample file: PMF (primordial), Primaire, Secondaire, with square boxes of 150 or 300 px. A scanner offset file gives 0.1215 um per
  pixel (paper: 0.122 um, 40x objective). The record cites the 2018 paper, which used 24 mice and 1,454 sections, so this 92-mouse,
  643-section release is newer or larger. Who drew the boxes and how annotations_test.json is used are not stated on the record page.
  enricher: download_url set to the direct zip.'
