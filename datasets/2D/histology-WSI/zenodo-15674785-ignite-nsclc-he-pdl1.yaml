title: 'IGNITE data toolkit: tissue-compartment segmentation in H&E and nuclei / PD-L1 detection in IHC, non-small
  cell lung cancer'
short_name: NSCLC H&E tissue segmentation, PD-L1 (histology)
description: 887 fully annotated regions of interest from 155 NSCLC patients. H&E ROIs carry pixel-level semantic
  masks for 16 tissue classes; IHC ROIs carry nuclei and PD-L1-positive tumor cell detection annotations in COCO
  format. Images were extracted at 0.5 um/pixel from slides scanned on different scanners.
