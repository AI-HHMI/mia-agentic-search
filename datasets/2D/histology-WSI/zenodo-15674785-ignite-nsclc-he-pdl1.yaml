notes: 'images.zip is 5.74 GB (1295 PNGs incl. *_with_context variants); annotations.zip 820 files (816 PNG, 4 JSON).
  n_items=887 is the ROI count stated on the Zenodo page and paper, not the PNG count. Paper full text is not in
  Europe PMC (not open access); details taken from arXiv preprint abstract/HTML. Annotation coverage per class not
  stated. Detection annotations are nuclei/cell points or boxes in COCO; exact geometry not confirmed. Modality
  is brightfield histology, not EM/fluorescence. enricher: size_bytes now the full record from a complete file listing
  (8.23 GB incl. models/figures/inference zips; was images.zip only). enricher: splits_provided true, data_overview.csv
  has split (train/validation/test) and validation_fold per ROI (was false).'
