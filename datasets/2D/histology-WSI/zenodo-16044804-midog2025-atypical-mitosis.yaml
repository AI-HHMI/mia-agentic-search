notes: 'Zenodo record lists CC-BY-NC-4.0 and no paper; no publication was found for this specific release (the challenge-description
  PDF is zenodo 15077361). The zip lists 11,937 PNG patches (the Zenodo description says 11,939 figures; the CSV has 11,937
  rows: 1,748 AMF and 10,189 NMF; 8,427 canine, 3,510 human). Patches are 128x128 RGB PNG (probed); pixel size not stated,
  and the slides come from several scanners (CSV Scanner column). Labels are for the mitotic figures of the already catalogued
  MIDOG++ (figshare-c-6615571), but this record is a different dataset: cropped patches with atypical/normal subclass labels
  rather than ROI images with detection boxes. The zip root folder is named MIDOG25_Binary_Classification_Train_Set. enricher:
  size from the Zenodo listing (zip + CSV), download_url -> record page. organisms: per patch in the CSV Species column (Canine
  = Canis lupus familiaris, Human = Homo sapiens); all PNGs share one folder.'
