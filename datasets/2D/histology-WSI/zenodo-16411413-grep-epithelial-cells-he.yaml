title: GrEp dataset - epithelial cell classification in H&E (colorectal, endometrium, pancreas)
short_name: GrEp epithelial nuclei classes (H&E histology)
description: H&E histopathology tiles at 20x (0.5 um/pixel) in three sub-datasets - colorectal, endometrial
  and pancreatic epithelium - released with the GrEp paper on graph-based refinement of epithelial cell
  classification. Each tile has a MATLAB .mat file with nucleus centroids (inst_centroid) and a per-nucleus
  class (inst_type - normal epithelium, malignant epithelium, other). The colorectal part includes subsets
  of Lizard and PanNuke tiles (folder names Lizard_subset_train and Lizard_pannuke_subset_test); train
  and test folders are provided.
