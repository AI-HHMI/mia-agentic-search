      \               148 (3 folds)\n  CRC/TCGA_test/{images/*.tif, centroids/*.mat}                 \
      \    19\nEndometrium.zip (212 MB): Endometrium/{Train,Val,...}/{images/*.tif, centroids/*.mat}\n\
      Pancreas.zip (157 MB): Pancreas/{Train,Val,Test,Test/0_pancreatitis}/{images/*.tif, centroids/*.mat}\
      \  21/12/17/6\n"
