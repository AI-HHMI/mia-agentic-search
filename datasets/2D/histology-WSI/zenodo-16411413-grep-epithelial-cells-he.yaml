    alignment_notes: centroids/<stem>.mat next to images/<stem>.<ext> (e.g. grep_pdac_image20.tif / .mat);
      inst_centroid (x, y) and inst_type per nucleus per the record; .mat contents not read this run.
  notes: 'Listing: tools/listing.py --expand-zips on the Zenodo record: 3 zips, 1,769,193,618 bytes, complete,
    exact. Probed one Pancreas TIFF (1000x1000x3 uint8, uncompressed, ImageJ unit um, 0.486 um/px) and
    one CRC PNG (500x500x3). Reading the .mat members failed on repeated zenodo.org TLS EOF errors, so
    no pixel values or label contents were read (method header). Voxel size: the record keeps 500 nm from
    the Zenodo description; the TIFF header says 486 nm, a conflict noted here. No single archive: download_url
    is now the record page (was null); the 3 zips are direct and usable.'
