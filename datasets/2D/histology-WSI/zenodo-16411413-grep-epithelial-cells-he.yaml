notes: 'Record read through the Zenodo API (zenodo.org/api/records/16411413) and zip listings with peek_archive
  (CRC.zip 1.40 GB, Endometrium.zip 212 MB, Pancreas.zip 157 MB; three downloads, no single archive, so
  download_url is the record page). Counts come from the listings - CRC 461 png + 19 tif, Endometrium
  85 tif, Pancreas 56 tif (n_items 621 images, 620 .mat files). The paper (Pattern Recognition, 10.1016/j.patcog.2025.112197)
  is not open access, so only the DOI metadata was read; staining, annotation procedure, tile size and
  who annotated which sub-dataset are not stated in the Zenodo description, hence annotations.source unknown.
  The CRC folder names indicate Lizard and PanNuke subsets, so part of the images and labels may derive
  from those public datasets. Pixel size 0.5 um at 20x is from the Zenodo description. License is non-commercial.
  enricher: the probed Pancreas TIFF stores 0.486 um/px (ImageJ); the record keeps the documented 0.5
  um.'
