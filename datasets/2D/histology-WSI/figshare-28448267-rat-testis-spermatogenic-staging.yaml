notes: 'Facts come from the figshare API record (landing page gives 403), peek_archive listings and the PLOS One paper
  (Europe PMC full text). Dataset.zip (1.3 GB) has train (1,434 jpg), valid (137) and test (68) folders, each with
  _annotations.coco.json, from a Roboflow export (the README names a Roboflow Universe project, CC BY 4.0). The paper
  says 15,649 tubules were annotated on 683 tiles (478/137/68), so the train folder likely holds Roboflow
  augmented copies (about 3x). WSI_inference.zip has six whole-slide images as JPEG (130 to 294 MB each); the
  checkpoint is a .pth model. Tiles are 4096x4096 crops of the 40x scans; pixel size is not stated, so voxel_size_nm is
  null. The paper splits at tile level, so tiles from one animal can appear in several splits. Annotation was by one
  pathologist, which the paper calls the ground truth.'
