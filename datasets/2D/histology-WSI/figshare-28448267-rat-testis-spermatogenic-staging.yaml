title: Rat testis PAS tiles with seminiferous tubule stage boxes (spermatogenic staging)
short_name: Rat testis tubule stage boxes (PAS histology)
description: Training data for deep-learning spermatogenic staging in PAS-stained Sprague-Dawley rat testes. A zip of
  JPEG tiles cropped from 40x whole slide images with COCO bounding boxes for seminiferous tubules in 14 classes
  (spermatogenic stages plus atrophy), split into train, valid and test, plus six whole-slide images as JPEG and
  a trained detection checkpoint.
