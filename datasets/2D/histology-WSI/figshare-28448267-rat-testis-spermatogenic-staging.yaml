notes: 'Facts from the figshare API record (landing page 403), zip listings and the PLOS One paper. Dataset.zip (1.3 GB) has
  train (1,434 jpg), valid (137) and test (68) folders, each with _annotations.coco.json, from a Roboflow export (the README
  names a Roboflow Universe project, CC BY 4.0). The paper says 15,649 tubules were annotated on 683 tiles (478/137/68), so
  the train folder likely holds Roboflow augmented copies (about 3x). WSI_inference.zip has six whole-slide images as JPEG
  (130 to 294 MB each); the checkpoint is a .pth model. Tiles are 4096x4096 crops of the 40x scans resized to 2048x2048; pixel
  size is not stated, so voxel_size_nm is null. The paper splits at tile level, so tiles from one animal can appear in several
  splits. Annotation was by one pathologist, which the paper calls the ground truth. enricher: COCO annotations carry polygon
  outlines for every tubule (685/685 in test), so instance-segmentation added; n_items 1639 tiles (zip listing).'
