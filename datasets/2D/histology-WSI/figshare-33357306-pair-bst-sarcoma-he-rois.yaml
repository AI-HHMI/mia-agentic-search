short_name: Bone and soft tissue tumor H&E ROIs (WSI)
description: 'Pathologist-Annotated Image Retrieval dataset for Bone and Soft Tissue tumors (PAIR-BST): 470
  H&E whole slide images (SVS) from 268 patients and 2,252 region-of-interest PNG crops, each labelled with
  one of 33 histologic diagnoses, 11 lines of differentiation and 6 growth patterns. A CSV gives the ROI
  corner coordinates on each slide and all labels. Intended as a benchmark for pathology foundation models
  and image retrieval.'
