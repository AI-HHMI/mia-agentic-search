notes: 'Four Figshare+ items form the collection doi:10.25452/figshare.plus.c.8223469: WSIs (470 SVS, 217.9 GB,
  item 33357306), ROI PNG crops in six parts (2,252 PNGs, 78.3 GB, items 33350522, 33350781, 33350909, 33351112,
  33351292, 33353449) and a one-file metadata CSV (item 33383509, header and first rows read). Sizes are exact sums
  of the Figshare API file listings. Pixel size / magnification, scanner and the train/test split are not stated
  in the item descriptions or CSV. The collection title is "PAIR-BST: A region-level H&E histopathology image
  dataset for bone and soft tissue tumors"; no paper was found in Europe PMC or by web search, so none is
  listed. Labels are image-level (per ROI) classes plus ROI boxes (CSV lists four corners), not pixel masks.
  License CC BY-NC 4.0 (non-commercial).'
