notes: 'Zenodo record (README text, file list) gives file naming, 984x984 px patches, binary masks and
  the license text (CC BY-NC-SA 4.0; the Zenodo license field says other-nc, commercial use needs contacting
  the authors). Patch count and splits come from CD3CD20_fileinfo.csv: 24,546 rows = train 20,906 / validation
  2,164 / test 1,476. enricher: the start of the tar.gz was read as a stream; H&E and mask members seen,
  annotations verified (was false). Pixel size 0.220818 um/px (Hamamatsu Nanozoomer S60, 40x) is from
  the paper Methods; lymphocyte masks mark nuclei (Cellpose on DAPI) that are more than 40% positive for
  the CD3/CD20 signal (paper Methods). Sibling of the catalogued SegPath records for panCK, ERG, MIST1
  and MNDA, but a different cell type and different images.'
