id: zenodo-7412529-segpath-cd3cd20-he
title: 'SegPath: large-scale annotation dataset for cell/tissue segmentation in H&E images (anti-CD3/CD20 (lymphocytes))'
short_name: SegPath lymphocyte segmentation (H&E)
description: H&E image patches (984 x 984 px, 40x, 0.22 um/px) of human tumour sections paired with binary lymphocytes
  masks. Masks were generated by destaining the H&E slide, immunofluorescence restaining with CD3CD20 and thresholding
  the fluorescence, not by manual drawing. This is one of the eight SegPath Zenodo records (one per antigen); a CSV
  assigns each patch to train, validation or test.
