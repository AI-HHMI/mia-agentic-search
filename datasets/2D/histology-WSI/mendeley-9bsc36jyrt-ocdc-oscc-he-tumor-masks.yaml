  arrays:
  - role: raw
    path_pattern: '*/tumor/patch/640x640/*/*/01-original/*.png'
    format: png
    axes: yxs
    shape:
    - 640
    - 640
    - 3
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 18
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: RGB H&E patches; 840 in training/, 180 in testing/ (01-roi + 02-non_roi), matching the data article split.
  - role: label
    path_pattern: '*/tumor/patch/640x640/*/*/02-mask/*.png'
    format: png
    axes: yxs
    shape:
    - 640
    - 640
    - 4
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: non-tumor
    - id: 255
      name: tumor
    alignment: same-grid
    alignment_notes: 'Pairing: same file name in the sibling 02-mask/ folder of 01-original/. Mask is RGBA: R=G=B in {0,255} (tumor
      white per the data article); the alpha channel is 255 except where RGB is 0 (0 or a few low values). Use one RGB channel as the
      label.'
  - role: other
    path_pattern: training/tumor/patch/640x640/*/01-roi/03-roi/*.png
    format: png
    axes: yxs
    shape:
    - 640
    - 640
    - 3
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 8
    - 255
    normalization: unknown
    alignment: same-grid
    alignment_notes: Training ROI patches only, same names as 01-original; contents not described in the data-article text read by the
      harvester (probably the image with the ROI applied).
  notes: 'Listing: Mendeley public API files + folders/1 (106 folders), 2,459 files, 1,081,967,447 B from per-file sizes (page-stated:
    tools/listing.py does not walk Mendeley folders). Sampled 1009009_r16c0 original (804,230 B): uint8 640x640x3, range 18-255, p50
