notes: 'The Mendeley API lists 2,459 files: 2,458 PNG (about 1.08 GB) plus the data-article PDF. Almost every PNG name occurs twice
  (a large file and a ~3 KB file, e.g. 1009009_r10c2.png), consistent with an image plus a same-named binary mask; the folder
  layout is not shown by the API, so image/mask folders were not seen directly. The README PDF (data article) states 1,020 images
  of 640x640 px at 20x, pixel size 0.5025 um, tumor regions drawn in GIMP by a specialist and validated by a pathologist, tumor
  shown in white, and a random split into 840 training and 180 test images; the split assignment is not given in the Mendeley
  file list (the GitHub repository dalifreire/tumor_regions_segmentation holds a copy under datasets/OCDC; not fetched). The
  related research article (BSPC 2021) was identified via the PDF and Crossref; its full text was not read. Images come from
  only 15 patients/WSIs, so patches are strongly correlated.'
