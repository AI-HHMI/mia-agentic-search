notes: 'The Mendeley API lists 2,459 files: 2,458 PNG plus the data-article PDF. The README PDF (data article) states 1,020 images of
  640x640 px at 20x, pixel size 0.5025 um, tumor regions drawn in GIMP by a specialist and validated by a pathologist, tumor shown in
  white, and a random split into 840 training and 180 test images. The related research article (BSPC 2021) was identified via the PDF
  and Crossref; its full text was not read. Images come from only 15 patients/WSIs, so patches are strongly correlated. enricher: folder
  tree read from the Mendeley folders API: training/ (840 images) and testing/ (180) under tumor/patch/640x640/<slide>/{01-roi,02-non_roi}/{01-original,02-mask},
  so the split is in the folder names; annotations_verified true (mask sampled).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "MendeleyData_OCDC_2022.pdf                       17.4 MB (data article)\ntraining/tumor/patch/640x640/<slide>/  7 slides,\
      \ 2,098 files, 933 MB\n  <slide>_1..4.png                                 4 per slide, larger overview images (e.g. 1002x933)\n\
      \  01-roi/01-original/<slide>_r<row>c<col>.png      tumor-containing patches (raw)\n  01-roi/02-mask/<same name>.png         \
      \          their masks\n  01-roi/03-roi/<same name>.png                    a third image per ROI patch (not documented)\n  02-non_roi/01-original/*.png,\
      \ 02-non_roi/02-mask/*.png   patches without tumor\ntesting/tumor/patch/640x640/<slide>/  6 slides, 360 files, 132 MB\n  01-roi/{01-original,02-mask}/,\
      \ 02-non_roi/{01-original,02-mask}/\n"
    n_files: 2459
