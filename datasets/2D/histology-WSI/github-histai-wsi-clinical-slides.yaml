notes: 'Annotations are case-level clinical text and codes (diagnosis, conclusion, ICD-10, age, sex),
  not pixel labels. The GitHub README lists 112,801 slides from 47,279 cases in nine Hugging Face subsets
  (hematologic, gastrointestinal, breast, thorax, skin-b1, skin-b2, colorectal-b1, colorectal-b2, mixed);
  arXiv v1 reports an earlier 60,110 slides. Mostly 20X (110,338), 40X (2,463), magnification in file
  names when not 20X; scanners Leica Aperio GT450/AT2, some Hamamatsu/3DHISTECH (paper). The image subsets
  are gated on Hugging Face (manual approval, files return HTTP 401 without a token). License CC BY-NC
  4.0, research use only. Related to but distinct from the SPIDER patch subsets (hf-histai-spider-*).
  enricher: size from the complete HF file listings plus the metadata.json size (was null); metadata.json
  read (first 1.5 KB), so annotations_verified true.'
