title: 'HISTAI: An Open-Source, Large-Scale Whole Slide Image Dataset for Computational Pathology'
short_name: HISTAI clinical whole slide images (histology)
description: >-
  Large collection of clinical whole slide images (about 112,800 slides from about 47,300 cases, mostly H&E at 20X)
  across hematologic, gastrointestinal, breast, thorax, skin and colorectal pathology, released as TIFF files in
  Hugging Face subsets. Each slide comes with per-slide JSON metadata (diagnosis, final pathological conclusion,
  microscopic description, ICD-10 code, age, sex). No pixel-level annotations are described.
