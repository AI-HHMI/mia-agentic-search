notes: >-
  Annotations are slide-level clinical text and codes, not image annotations; no segmentation masks are
  described in the README, the Hugging Face metadata card or the paper. The GitHub README lists 112,801 slides
  from 47,279 cases in nine Hugging Face subsets (hematologic 214, gastrointestinal 202, breast 1,925,
  thorax 829, skin-b2 43,757, skin-b1 7,710, colorectal-b1 5,379, colorectal-b2 94, mixed 52,691); arXiv v1
  reports an earlier 60,110 slides from 26,142 cases. Hugging Face access requires accepting a sharing
  agreement. License is CC BY-NC 4.0, research use only. Pixel size, total size on disk and per-subset file
  listings were not checked (not stated in README, metadata card or paper abstract/summary). Related to but
  distinct from the SPIDER histology patch subsets already proposed (hf-histai-spider-*).
