notes: 'Figshare holds IPD_Brain.csv (95 KB, from the figshare API), labelled.zip (10.8 GB, 482 PNG) and Unlabeled.zip (1.4
  GB, 63 PNG), the two zips listed with peek_archive; these PNGs (RGBA, alpha constant 255) are a lower-resolution version
  (the figshare description points to india-data.org for the full-resolution version, TIFF at four pyramid levels per the
  paper, after registration), so n_items 545 counts the figshare PNGs (the paper counts 547 slides) and the pixel size of
  the PNGs is not stated (left null). CC BY 4.0 from the figshare record; the paper itself is CC BY-NC-ND. enricher: CSV read
  (328 cases, columns as in annotations.format; was not opened). No split is shipped (the paper used an 80:10:10 patient-wise
  split with 10-fold cross-validation).'
