title: 'IPD-Brain: An Indian histopathology dataset for glioma subtype classification'
short_name: Glioma H&E whole-slide images with subtype labels
description: 547 H&E-stained whole-slide images of brain tumours from 367 patients (Nizam's Institute of Medical Sciences,
  Hyderabad), scanned at 40x. 484 slides from 328 patients (glioblastoma 246, astrocytoma 133, oligodendroglioma 105 slides)
  carry slide-level labels in a spreadsheet (diagnosis, subtype, WHO grade, IDH1 R132H, ATRX, TP53, Ki67 index); the
  rest are unlabeled. Slide-level labels, no pixel annotations.
