schema_version: '1.1'
id: zenodo-7412690-segpath-mnda-he
title: 'Large-scale annotation dataset for cell/tissue segmentation in H&E-stained images : anti-MNDA (myeloid cells)'
short_name: SegPath myeloid cell segmentation (H&E)
description: 28,270 H&E image patches (984 x 984 px, 40x, 0.22 um/px) of human tumour tissue-microarray sections
  paired with binary masks of myeloid cell nuclei. Masks come from destaining the H&E slide, restaining
  with anti-MNDA immunofluorescence and thresholding, not from manual drawing. One of the SegPath records
  (one per antigen); a CSV assigns each patch to train, validation or test.
