notes: 'Different from the catalogued SegPath panCK record (zenodo-7412731): other antigen (MNDA, myeloid nuclei),
  other images. Zenodo files: MNDA_MyeloidCell.tar.gz (27,341,828,567 B), MNDA_fileinfo.csv and LICENSE. Patch count
  and split (train 24,630, val 1,788, test 1,852; 28,270 rows) come from MNDA_fileinfo.csv. License is CC-BY-NC-SA
  4.0 per the Zenodo record text (Zenodo field: Other (Non-Commercial)); commercial use needs contacting the authors.
  Pixel size 0.220818 um/px from the paper Methods (Hamamatsu Nanozoomer S60, 40x). Masks are IF-derived, validated
  against pathologists in the paper. enricher: first tar.gz members streamed and one HE/mask pair measured; size_bytes
  = full listing total 27,343,830,656 B (tar.gz + CSV + LICENSE); annotations_verified true. enricher: download_url
  set to the image tar.gz (Zenodo API file URL; was the record page); the record also holds MNDA_fileinfo.csv (splits)
  and LICENSE.'
