description: '1,017 H&E whole-slide images of prostate core needle biopsies from PAR Hospital, Erbil:
  339 glass slides from 185 patients, each rescanned on a Grundium (SVS), a Hamamatsu (NDPI) and a Leica
  (SVS) scanner. slide_labels.tsv gives slide-level Gleason and ISUP grades from three pathologists (339,
  337 and 59 slides graded).'
