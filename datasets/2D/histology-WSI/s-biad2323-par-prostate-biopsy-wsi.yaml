notes: 'BioStudies record (CC BY 4.0), the EMBL-EBI file index and slide_labels.tsv (339 rows, columns
  printed) read; the paper full text (Europe PMC, Scientific Data) confirms 1,017 WSIs, three scanners
  and three pathologists, with a rater table (benign 164/208/11 across raters, ISUP 1-5). Scan pixel sizes
  differ per scanner on the BioStudies record (Grundium 0.25, Hamamatsu 0.22, Leica 0.26 um/px), so voxel
  size is left null. Component folders are component_A_grundium_svs (c001a_grundium.svs, ~270-400 MB each),
  component_B_hamamatsu_ndpi (.ndpi, ~0.7-1.3 GB each), component_C_leica_svs; the formats list holds
  svs (NDPI has no schema entry). The folder is called bia_prostate_wsi in the file index but iraq_prostate_wsi
  in the paper. Labels are slide-level only (no region masks). No single archive, so download_url is null.
  enricher: size_bytes = sum of the four BIA file lists (1,018 files; file lists excluded).'
