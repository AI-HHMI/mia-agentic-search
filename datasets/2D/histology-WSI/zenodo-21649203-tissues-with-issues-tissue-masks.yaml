title: Tissues with Issues Benchmark Dataset
short_name: Multi-stain WSIs with tissue masks (histology)
description: 555 whole-slide images from 10 public datasets (Acrobat, DLBCL-Morph, HISTAI, Human Protein Atlas,
  Monkey, Mostwiedzy, MSKCC, NADT, TCGA, TG-GATEs) covering 29 organs and 36 stainings (H&E, PAS, IHC
  markers, special stains), including pen marks, out-of-focus regions and background artifacts. Each slide
  has tissue/background annotations (XML polygons or splines, groups 'tissue' and 'hole') made by AI-assisted
  annotation refined by two annotators; images are TIFF at 0.5 or 1.0 um/pixel, split over eight Zenodo
  records (parts 1-8).
