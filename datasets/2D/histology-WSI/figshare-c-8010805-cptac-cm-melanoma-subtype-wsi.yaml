notes: 'Collection of four Figshare items (CC BY 4.0 each), one zip per subtype (SSM 10.0 GB, LMM 5.0 GB, NM 8.1 GB, ALM 1.3 GB), so download_url is null; slide counts from
  peek_archive: 30 + 18 + 31 + 3 = 82 .svs, each with .qpdata and .geojson. No paper was found (collection lists no reference, web search found none), so the annotation protocol is
  only what the collection text says: manual annotation under a senior dermatopathologist per the 2022 WHO classification. GeoJSON features read had only objectType annotation and no class names,
  so what the polygons delineate (tumour region vs subtype label) is not confirmed; coverage unknown. pixel size not read. Slides come from the public CPTAC-CM cohort.'
