notes: 'Collection of four Figshare items (CC BY 4.0 each), one zip per subtype (SSM 10.0 GB, LMM 5.0 GB, NM 8.1 GB, ALM 1.3 GB), so download_url is null; 82 .svs, each with .qpdata and .geojson (SSM also
  has a project.qpproj.backup.geojson). No paper was found; annotation protocol only from the collection text (manual, senior dermatopathologist, 2022 WHO classification). GeoJSON features carry only objectType
  annotation and no class names, so what the polygons delineate is not confirmed; coverage unknown. Slides come from the public CPTAC-CM cohort. enricher: channels 3 (RGB SVS headers, was null); pixel size
  left null: 3 of 82 SVS headers read (LMM, SSM, NM) say MPP 0.4942 um at 20x, the other slides were not read.'
