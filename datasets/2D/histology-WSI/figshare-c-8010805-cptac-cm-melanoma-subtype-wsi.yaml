  notes: 'Figshare article APIs + zip central directories (listing.py, complete, 248 zip members, 24,471,798,355 bytes). Three full SVS members were downloaded and read with tifffile (LMM/C3N-00220-21 29.4
    MB, SSM/C3N-01492-22 48.9 MB, NM/C3L-00967-24 55.6 MB compressed): Aperio SVS, tiled 240x240 JPEG RGB uint8 pyramid (baseline + 1 level + thumbnail, label, macro), AppMag 20, MPP 0.4942 um in all three
