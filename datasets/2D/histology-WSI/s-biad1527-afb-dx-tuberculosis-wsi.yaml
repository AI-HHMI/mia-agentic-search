id: s-biad1527-afb-dx-tuberculosis-wsi
title: 'AFB-Dx: A Digital Pathology Dataset for Tuberculosis Detection and Analysis'
short_name: AFB-Dx Ziehl-Neelsen tuberculosis WSIs
description: 421 Ziehl-Neelsen (acid-fast bacilli) stained whole-slide images of human autopsy tissue from
  the Korea National Forensic Service, scanned at 400x with a Roche VENTANA DP 200 (single focus layer).
  Slides are sorted into Positive and Negative folders in two groups (Dataset1 - 130 slides reviewed
  by one pathologist; Dataset2 - 291 slides from commercial laboratories reviewed by two pathologists);
  labels were kept only where RT-PCR and pathologist diagnoses agreed. Staining and sectioning quality
  information is also provided.
