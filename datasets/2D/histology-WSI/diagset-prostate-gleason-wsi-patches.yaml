notes: 'GitHub page says the data are available after registration at ai-econsilio.diag.pl
  with administrator activation (usually under 24 h); that site was not opened. No
  dataset licence stated (the Scientific Reports paper is CC BY 4.0). Scan counts,
  patch counts (2,604,206 in DiagSet-A: 346 train, 42 validation, 42 test scans),
  scan resolution and the nine classes come from the paper (full text via Europe PMC).
  Raw file formats (scans and patch containers) were not seen, so data.formats is
  other; the repo has a Python container for loading DiagSet-A patches. Dataset size
  not stated.'
