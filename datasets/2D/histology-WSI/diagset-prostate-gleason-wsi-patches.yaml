notes: 'GitHub page says the data are available after registration at ai-econsilio.diag.pl
  with administrator activation (usually under 24 h); that site was not opened. No dataset
  licence stated (the Scientific Reports paper is CC BY 4.0). Scan counts, patch counts (2,604,206
  in DiagSet-A: 346 train, 42 validation, 42 test scans), scan resolution and the nine classes
  come from the paper (full text via Europe PMC). enricher: files not inspected (registration
  site, cert error); the repo loader reads DiagSet-A patches as NumPy blobs (np.load) under
  blobs/S/<mag>x/<scan>/<class>/, so data.formats stays other. Voxel size 250 nm is the 40x
  scan resolution (paper); 20x/10x/5x patches are coarser, values not stated. Dataset size
  not stated.'
