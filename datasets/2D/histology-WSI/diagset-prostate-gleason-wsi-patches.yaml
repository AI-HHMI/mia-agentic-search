schema_version: '1.2'
id: diagset-prostate-gleason-wsi-patches
title: 'DiagSet: prostate cancer histopathology scans and patches annotated by Gleason grade'
short_name: Prostate Gleason H&E patches (DiagSet)
description: 'H&E prostate tissue scans (Hamamatsu C12000-22, 40x, 0.25 um/px) annotated by
  three pathologists into regions of nine classes (scan background, tissue background, normal,
  artifact, Gleason 1-5): DiagSet-A with 2.6 million 256x256 patches from 430 annotated scans
  at four magnifications, DiagSet-B with 4,675 scans with binary diagnoses and DiagSet-C with
  46 scans diagnosed independently by several pathologists.'
