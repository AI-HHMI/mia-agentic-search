notes: 'The Figshare collection 10.6084/m9.figshare.c.6472282.v1 holds this dataset (SOPHIE_dataset.zip,
  39.4 GB) and a second article with the training code (22339936). peek_archive on the zip: 61 TIFF WSIs
  (40.9 GB uncompressed) and one XLSX. The paper says 61 slides from 58 patients; SM_0015 has two WSIs
  (two regions of one tumour) and SM_0016 has three (primary tumour and two lymph-node metastases). Labels
  are slide-level diagnoses, not pixel annotations. Pixel size 0.227 um is stated in the paper as the
  40x scanner resolution.'
