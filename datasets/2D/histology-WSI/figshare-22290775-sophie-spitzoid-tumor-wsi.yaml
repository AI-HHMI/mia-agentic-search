title: 'SOPHIE: Spitzoid Tumor dataset with clinical metadata & Whole Slide Images for Deep Learning models'
short_name: Spitzoid tumor H&E whole slide images (SOPHIE)
description: 61 H&E whole slide images from 58 patients (Hospital Clinico Universitario de Valencia, 1988-2020) of Spitz nevus,
  spitzoid melanoma and spitzoid tumour of unknown malignant potential (STUMP), scanned with a Roche Ventana iScan HT at
  40x (0.227 um/pixel) and stored as TIFF. The diagnosis of each slide, confirmed by three pathologists, is encoded
  in the file name (SN_, SM_, STUMP_) and clinical metadata are in an XLSX; no region annotations are provided.
