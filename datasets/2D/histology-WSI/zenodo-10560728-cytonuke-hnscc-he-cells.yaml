title: 'CytoNuke Dataset: whole-cell segmentation in bright-field histological images'
short_name: HNSCC H&E whole-cell segmentation (brightfield)
description: 83 PNG patches (256 x 256 px at 0.5 um/px) of H&E-stained head and neck squamous cell carcinoma
  histology from CPTAC-HNSCC whole-slide images, with 6,683 manual COCO instance annotations (3,991 tumour nuclei
  and 2,607 whole tumour cells including cytoplasm). Annotated in QuPath; the paper splits patches 70/15/15 into
  train/validation/test.
