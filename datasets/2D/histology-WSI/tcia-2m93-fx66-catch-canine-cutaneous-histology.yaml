title: CAnine CuTaneous Cancer Histology Dataset (CATCH)
short_name: Canine cutaneous tumor histology WSIs (H&E)
description: 350 H&E-stained whole slide images (Aperio SVS, 40x) of seven canine cutaneous tumor subtypes (50 slides
  each) from 282 patients, with 12,424 expert polygon annotations in 13 histologic classes (six non-neoplastic
  tissue classes and seven tumor classes), provided as MS COCO JSON and SQLite databases.
