notes: 'Slides are 522 GB of SVS via IBM Aspera or the TCIA PathDB cohort builder (the page does not say if an account is required); annotations download directly as ZIP. Pixel size: 303 slides scanned on a Leica ScanScope CS2 at 0.2533 um/px and 47 on a Leica AT2 at 0.2524 um/px (paper Methods); x/y use 253.3 nm. Annotation files were not listed directly, so sizes come from the TCIA page; polygons cover about 12,424 regions in 13 classes (Table 2) rather than every pixel, hence partial coverage. The same data is mirrored in NCI Imaging Data Commons (DICOM SM plus DICOM ANN) and a Zenodo record (10.5281/zenodo.18526942); the Zenodo record was not opened.'
