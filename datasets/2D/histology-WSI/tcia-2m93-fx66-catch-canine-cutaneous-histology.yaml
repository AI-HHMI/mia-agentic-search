notes: 'Slides: 522.1 GB of SVS via IBM Aspera, or per slide as direct HTTPS files on pathdb.cancerimagingarchive.net
  (URLs in the TCIA cohort-builder CSV); annotations download directly as ZIP. Pixel size: 303 slides on an Aperio
  ScanScope CS2 at 0.2533 um/px, 47 on an Aperio AT2 at 0.2524 um/px (paper Methods; SVS header MPP = 0.2533); x/y
  use 253.3 nm. Polygons cover 12,424 regions in 13 classes rather than every pixel, hence partial coverage. Mirrored
  in NCI Imaging Data Commons as DICOM SM + ANN (Zenodo 10.5281/zenodo.22801241, CC BY 4.0, s5cmd manifests only).
  enricher: license conflict: the TCIA page states CC BY 4.0 for slides and annotations, but the COCO JSON "licenses"
  entry says Attribution-NonCommercial-NoDerivs (CC BY-NC-ND 2.0); spdx kept as the page states, a human should
  check. enricher: annotations_verified true (CATCH.json read).'
