  notes: 'Slide URLs come from the TCIA cohort-builder CSV (350 CATCH rows, 50 per subtype, all "(0.253,0.253)mpp");
    sizes of 2 slides checked with range requests (1,049,383,939 and 648,905,665 B); a full size listing was not
    possible (pathdb resets connections and answers HEAD poorly), so size_bytes is the TCIA page''s 522.1 GB. Header
    of Histiocytoma_01_1.svs: Aperio, 5 pages, page 0 63679x73800x3 uint8, JPEG 2000 (Q=70) tiles 240x240, MPP 0.2533,
    AppMag 40. CATCH.json read in part (first 200 KB): COCO with 13 categories, polygons in pixel coordinates; its
    licenses entry says CC BY-NC-ND 2.0 while the TCIA page says CC BY 4.0. No value range: method header (one slide
    is ~1 GB). data.download_url stays null: the full slide set is one Aspera package; direct per-slide HTTPS files
    exist on pathdb.cancerimagingarchive.net and the annotation zips on www.cancerimagingarchive.net, both not on
    the TensorSwitch allowlist. 2D: outside the miao layout for now.'
