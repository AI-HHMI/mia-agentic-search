notes: 'Annotations are sparse regions, not exhaustive: 1,882 malignant and 374 non-malignant regions
  drawn by one pathologist and reviewed by a second (99.95% agreement, paper), so coverage is "partial"
  and segmentation means region-level classes. Files (Figshare API): BRCA-QuPath-Annot.zip 49.7 GB (296
  files: QuPath .qpproj/.qpdata, json, jpg; the 50 source .svs slides are stored next to the parts per
  the paper), All_patches_50WSIs.zip 10.6 GB (72,317 PNG patches), TCGA-BRCA-public_Dataset.zip 5.8 GB
  (patches from the public TCGA-BRCA tumor/non-tumor annotations) plus three CSVs; size_bytes is the sum
  of all six files. Source slides are TCGA-BRCA from the GDC under TCGA data-use terms (research only),
  which may be stricter than the CC-BY-4.0 on the annotations. enricher: the 50 .svs slides are inside
  BRCA-QuPath-Annot.zip/WSI/ (zip index); one slide''s QuPath server.json states 0.2485 um/px at 40x,
  voxel size left null since slides may vary.'
