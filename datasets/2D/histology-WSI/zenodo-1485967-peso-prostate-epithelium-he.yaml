short_name: PESO prostate epithelium segmentation (H&E WSI)
description: 102 H&E-stained radical prostatectomy whole-slide images (62 training, 40 test) scanned at 20x
  (0.24 um/px), each re-stained with CK8/18 and P63 immunohistochemistry. Training masks are binary epithelium
  masks derived from the IHC slides (color deconvolution / a U-Net) and registered to the H&E slides;
  the test set has color-deconvolution masks with manual correction, and 40 region annotation XML files.
