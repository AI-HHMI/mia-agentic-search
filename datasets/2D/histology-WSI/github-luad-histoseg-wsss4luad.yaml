notes: 'The GitHub README (paper code repo) releases LUAD-HistoSeg through a Google Drive folder, which this run did not open, and
  states no license; its dataset page and the challenge site (wsss4luad.grand-challenge.org, 403 to this run) were not readable.
  CC BY 4.0 comes from a web search result describing the official challenge license page and from a Hugging Face mirror (MedOtter/WSSS4LUAD-v2)
  whose card also lists 10,091 train patches, 40 validation and 80 test patches and 3 classes; patch sizes there vary (about 150-300
  px per side). Counts, class encoding, patch size, magnification and pixel size were therefore not verified against the Drive files.
  The paper (Medical Image Analysis 2022) is not open access and no full text was available, so only the abstract was read. The
  same README also releases BCSS-WSSS, a weak-label derivative of BCSS, which is not part of this record. coverage is partial because
  training patches carry only patch-level labels.'
