notes: 'Data come from the paper''s Google Drive folder (one zip, LUAD-HistoSeg.zip, 2.1 GB). Its Readme.txt and the paper (arXiv 2110.08048)
  describe LUAD-HistoSeg with 4 classes (TE, NEC, LYM, TAS) and 16,678/300/307 patches; the harvest record mixed it up with the WSSS4LUAD
  challenge (3 classes, 10,091/40/80 patches), a different release. enricher: title, description, n_items (was 10211), sample corrected;
  benchmark WSSS4LUAD removed; license set to unknown (was CC-BY-4.0, which came from the WSSS4LUAD challenge pages, not this dataset;
  README, Readme.txt and paper state none). annotations.format (human edit) kept as is, but the zip shows training labels as ''[TE NEC
  LYM TAS]'' flags in file names. Pixel size: paper states 0.0625 um/pixel at 10x, implausible for 10x brightfield, so voxel_size_nm
  left null.'
