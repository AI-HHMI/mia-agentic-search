notes: 'Zenodo record, paper (Sci Rep 2016, full text via Europe PMC) and the tile zip listing (peek_archive: 5,000 TIFF tiles, 258
  MB compressed, class-named folders such as 01_TUMOR) were read. The second file, Kather_texture_2016_larger_images_10.zip (742
  MB), holds ten 5000x5000 px images with mixed tissue and was not listed; it has no per-pixel labels described on the record.
  The paper used 10-fold cross-validation, so no fixed split is provided. Tiles are TIFF per the file listing. Tile classes were
  assigned by manual annotation of contiguous tissue areas that were then tessellated. n_items is 5,000 tiles plus the 10 larger
  images; size_bytes is the sum of the two zips. A later, larger colorectal tissue-type set by the same group (NCT-CRC-HE-100K,
  Zenodo 1214456) is a different dataset already in the catalog.'
