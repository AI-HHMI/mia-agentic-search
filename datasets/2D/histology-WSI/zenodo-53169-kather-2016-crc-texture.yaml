title: Collection of textures in colorectal cancer histology
short_name: Colorectal histology tissue-type tiles (H&E)
description: 5,000 H&E histology tiles of 150x150 px (74x74 um at 0.495 um per pixel, 20x Aperio scans) of human colorectal adenocarcinoma,
  625 per tissue class for eight classes, plus ten larger 5000x5000 px images with mixed tissue types as an application set. The classes
  are tumour epithelium, simple stroma, complex stroma, immune cells, debris, normal mucosal glands, adipose tissue and background.
