schema_version: '1.2'
id: mendeley-cz3xt8mbpn-knee-synovium-he-oa
title: Synovial tissues histology from patients with end-stage osteoarthritis, soft tissue and traumatic
  injuries of the knee
short_name: Knee synovium H&E histology (OA vs injury)
description: H&E-stained knee medial-gutter synovial tissue sections from 32 patients (15 end-stage primary
  osteoarthritis, 9 ligament tears and 8 tibial plateau fractures without arthritis; Liverpool University
  Hospitals), scanned at 20x on an Aperio CS2 and captured at 10x as sequential TIFF image grids per patient
  with a full-section image and a grid map. An XLSX gives patient demographics; the paper tabulates per-patient
  synovitis scores (two assessors, Krenn-based), radiology scores and notes cartilage debris and focal
  inflammatory aggregates.
