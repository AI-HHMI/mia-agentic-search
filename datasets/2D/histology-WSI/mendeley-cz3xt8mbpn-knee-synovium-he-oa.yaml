notes: 'Mendeley API file listing: 495 TIFF files (named HE_group<N>_<sample>_<k>.tif, N = 4 to 10 in
  the names; image grids plus full and map images) and one XLSX, 2.40 GB in total; n_items counts the
  TIFFs. Weak training signal: labels are patient-level pathology groups and per-patient synovitis scores,
  there are no region-level annotations, and only the scores of the OA patients appear in the paper tables,
  so confidence is moderate. How group numbers in the file names map to the three pathology groups was
  not verified. Pixel size not stated (20x scan, 10x captures). Total size from the Mendeley record. enricher:
  32 patient folders; download_url set to the dataset page (no single archive).'
