notes: 'Five zips, 14.45 GB, no single archive; 200 ROI PNGs (100 primary, 100 metastatic) with 200 nuclei and 200 tissue GeoJSON files,
  plus 200 context PNGs. The GigaScience paper (Europe PMC full text) says the public PUMA training set is on Zenodo, matched to this
  record by title only. Paper Methods: Nanozoomer XR, 40x, 0.23 um/px. Record says CC BY 4.0, paper says CC0 1.0; record license used.
  Test sets hidden. enricher: this is v1.0.0 (PNG) of Zenodo concept 10940193; record 14213079 is a later version with the same training
  set as TIFF (01_training_dataset_tif_ROIs.zip etc.). Classes counted in all 400 GeoJSONs: nuclei tumor, lymphocyte, histiocyte, stroma,
  epithelium, endothelium, apoptosis, melanophage, plasma cell, neutrophil; tissue tumor, stroma, blood vessel, epidermis, white background,
  necrosis.'
technical:
