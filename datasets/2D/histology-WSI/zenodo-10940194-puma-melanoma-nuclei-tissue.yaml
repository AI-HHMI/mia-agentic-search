notes: 'Five zips, ~14.5 GB, no single archive (download_url null); peek_archive confirmed 200 ROI PNGs plus 200 nuclei and 200 tissue GeoJSON files; a newer record version exists and was not inspected. The record lists no paper; the GigaScience paper (Europe PMC full text) says the public PUMA training set (206 ROIs) is on Zenodo, matched to this record by title only. Paper Methods: Nanozoomer XR, 40x, 0.23 um/px; nuclei classes incl. tumor, lymphocyte, melanophage, plasma cell; tissue tumor, stroma, epidermis, necrosis, blood vessel. Record says CC BY 4.0, paper says CC0 1.0; record license used. Test sets hidden.'
