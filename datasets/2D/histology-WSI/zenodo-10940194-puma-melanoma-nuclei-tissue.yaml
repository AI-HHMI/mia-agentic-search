title: Melanoma Histopathology Dataset with Tissue and Nuclei Annotations (PUMA training set)
short_name: Melanoma nuclei and tissue segmentation (H&E)
description: 200 H&E melanoma regions of interest (100 primary, 100 metastatic; 1024x1024 px at 40x, 0.23 um/px), each
  with a 5120x5120 px context ROI, and manual GeoJSON annotations of nuclei classes (e.g. tumor, stroma, lymphocyte,
  melanophage) and tissue classes (tumor, stroma, epithelium, necrosis). Public training set of the PUMA challenge.
