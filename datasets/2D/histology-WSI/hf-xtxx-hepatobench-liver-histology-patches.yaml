title: HepatoBench - liver cancer histopathology patch benchmark
short_name: HepatoBench liver tissue patches (histology)
description: '87,301 150x150 px liver histopathology patches (20x) cropped from whole-slide images and assigned by board-certified pathologists to seven tissue classes: tumor, fibrosis, inflammation, necrosis, normal tissue, biliary reaction and steatosis. Released as one zip per class on Hugging Face for patch-level classification and pathology foundation-model evaluation.'
