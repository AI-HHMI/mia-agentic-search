    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'RGB colour patches (PNG colour type 2, samples differ). Labels are not separate files: each patch''s class is its zip and file-name prefix (01_TUM, 02_FIB, 03_INF, 04_NEC, 05_NOR, 06_REA, 07_STE), one class per patch. Members sit at the zip root.'
  notes: 'Listing: HF tree API + zip central directories (tools/listing.py --expand-zips), 10 files, 87,301 PNG members, total 3,615,128,587 bytes, matches dataset_meta.json counts. Probed 06_REA_0.png and 06_REA_1.png (150x150x3 uint8, deflate); sampled 06_REA_0.png (44,200 bytes): value range 0-255 from that one sample, normalization not documented. Classes (README): TUM Tumor, FIB Fibrosis, INF Inflammation, NEC Necrosis, NOR Normal Tissue, REA Biliary Reaction, STE "Steroidal Degeneration" (paper: Steatosis). The paper says the official 7:2:1 partition is released, but no split file is in the HF repo. Voxel size not found; checked: PNG headers (no pHYs calibration reported), README, dataset_meta.json (pixel [150,150] only), paper full text (only "20x magnification"), PFM_Segmentation GitHub README. No single whole-dataset archive: seven per-class zips, direct via resolve/main/<NN_CLS>.zip (range requests OK).'
