notes: 'License conflict: the paper (Usage Notes) says CC BY-NC 4.0 and not for diagnostic model development, while the Hugging Face card says cc-by-4.0; the more restrictive CC BY-NC 4.0 is recorded. Patch count conflict: README and dataset_meta.json give 87,301 patches (13,200 TUM, 26,364 FIB, 4,776 INF, 22,023 NEC, 13,200 NOR, 1,540 REA, 6,198 STE) while the paper text says 140,000 (example numbers); the HF count is used. Seven zips (3.6 GB) listed via the HF API; 06_REA.zip checked with peek_archive (1,540 PNG). The paper also mentions 111 WSIs with tumor/non-tumor contours, not part of the HF release. Stain, scanner and pixel size in um are not stated, so labels_stains is empty and voxel_size_nm null. enricher: files listed, probed and sampled (PNG 150x150 RGB uint8); voxel size still not stated anywhere.'
