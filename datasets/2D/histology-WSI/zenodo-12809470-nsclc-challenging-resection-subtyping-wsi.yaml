short_name: NSCLC challenging resection WSIs, subtype (H&E)
description: 'Anonymized H&E whole-slide images of non-small cell lung cancer (lung adenocarcinoma, LUAD,
  and squamous cell carcinoma, LUSC): "challenging" resection cases (about 2/3 misclassified by the authors''
  AI algorithm or borderline) with subtype ground truth revealed by immunohistochemistry. 30 slides with
  a CSV of slide-level subtype ground truth. Released with the lung cancer pathology platform paper (Kludt
  et al., Cell Reports Medicine 2024) as a test set for subtyping algorithms.'
