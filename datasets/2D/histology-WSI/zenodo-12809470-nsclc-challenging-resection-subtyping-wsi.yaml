notes: 'Zenodo lists no license; the description states "The dataset can be used for academic research
  purposes only", so spdx is custom (research use only). Files read from the Zenodo API listing: 30 slide
  files plus CHALLENGING_GT_RES.csv (opened: GT/file-name columns). 30 cases (16 LUAD, 14 LUSC). Labels
  are slide-level (no pixel annotations); the paper (PMC11524894, Methods and key resources table) lists
  this deposit among the released test datasets and gives subtype ground truth from pathology reports/immunohistochemistry.
  The paper states the WNS and UKK biopsy cohorts were digitized with different scanners but not per file,
  and gives no pixel size for this release. enricher: Aperio headers of all 30 SVS: MPP 0.263296 um (27)
  and 0.262780 um (Case19, 20, 29), so voxel_size_nm stays null. The companion annotated tile dataset
  (UKK L1 SEGM, Zenodo 12818382) is already in the catalog and is a different dataset.'
