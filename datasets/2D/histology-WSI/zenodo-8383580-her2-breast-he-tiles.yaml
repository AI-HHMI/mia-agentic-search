title: 2 million histological images of breast cancer tumors with her2 labels
short_name: Breast cancer H&E tiles with HER2 status
description: 2,051,877 non-overlapping 256 x 256 px H&E tiles (0.5 um/px) from breast cancer biopsy and
  resection slides of A.C. Camargo Cancer Center patients, restricted by a tumour-detection network to
  tumour and surrounding tissue. Tiles are sorted by the slide-level HER2 status (negative, low, high)
  from IHC and ISH tests.
