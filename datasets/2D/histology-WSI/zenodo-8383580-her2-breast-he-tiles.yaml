notes: 'dataset.zip (35.6 GB) lists 2,051,877 JPEGs plus metadata.csv: her2_neg 804,562, her2_low 767,652,
  her2_high 479,663 (zip central directory, not unpacked; enricher: metadata.csv read, 428 slides with
  case_id, slide_id, Target). Labels are weak, slide-level HER2 status (IHC 0 = negative; IHC 1+, or 2+
  with negative ISH = low; 2+ with positive ISH or 3+ = high), not tile-level annotations, and tiles come
  from a tumour-detection network, so some may not show tumour. Tile scale of 0.5 um/px is stated on the
  Zenodo page and in the paper Methods. Counts differ between sources (Zenodo page 426 slides; paper 546
  slides, 504 patients), and the paper says slides were digitised at 0.25 um/px, the Zenodo page says
  40x on a Leica Aperio AT2. source is proofread because ground truth comes from clinical tests, not manual
  image labelling.'
