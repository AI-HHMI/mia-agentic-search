title: Extention to the TNBC dataset, brain section and cell type
short_name: TNBC and brain nuclei cell types (H&E histology)
description: Extension of the TNBC nuclei segmentation dataset with per-nucleus cell-type annotations, plus 18 additional
  annotated H&E images of brain sections downloaded from TCGA. Provided as image/ground-truth PNG folders (Slide_XX / GT_XX)
  in three zips, including integer-coded and colour-coded cell-type masks (12 classes plus background, e.g. cancerous, lymphocyte/plasmocyte,
  fibroblast, endothelial, epithelial, glial, neuron, mitosis).
