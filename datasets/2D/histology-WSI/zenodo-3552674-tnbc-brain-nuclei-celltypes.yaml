notes: 'Zip indexes read with peek_archive: TNBC_and_Brain_dataset.zip has about 68 PNG images in Slide_XX folders and a matching GT_XX mask folder per slide (136 PNGs in total); the celltype_integer zip adds class_definition.txt with the 12 classes. The Zenodo page says the accompanying paper (Scale dependant layer for self-supervised nuclei encoding) is unpublished/submitted, so there is no paper to read; magnification, pixel size and annotation procedure are not stated. Size is the sum of the three zips (the same images in three label encodings), so the true unique data is about a third of this. Extends the TNBC nuclei segmentation dataset (Zenodo 2579118, separate PR) with cell types and 18 brain images; the image count 68 = 50 TNBC + 18 brain is inferred from the description and listing, not stated explicitly.'
