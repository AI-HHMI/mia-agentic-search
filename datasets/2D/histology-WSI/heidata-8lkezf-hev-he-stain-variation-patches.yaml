notes: 'Zip indexes read via ranged GETs. HEV patches (TIFF, 256 x 256 px): test HE 16,303, longHE 16,559, onlyE 16,328, onlyH 16,268,
  shortHE 15,825; train HE 24,453, longHE 24,838, onlyE 24,492, onlyH 24,400, shortHE 23,736; HEV_wsi.zip holds 9 .svs slides (the
  description lists nine stain variants, patches exist for variants 1-5). tumorLymphnode_patches.zip: 3,606 normal and 3,601 tumor PNGs.
  The main use is stain normalization (unpaired image-to-image translation between stain variants of serial sections, so they are
  not pixel-paired); the only class labels are normal vs tumor on the TumorLymphnode patches. Scanner, magnification and pixel size
  are not stated for these sets in the record or in the paper text read. Paper also uses public Mitos-Atypia-14 and Camelyon16, which
  are not part of this record.'
