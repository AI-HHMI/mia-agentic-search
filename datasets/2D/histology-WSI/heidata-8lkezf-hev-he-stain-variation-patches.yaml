description: Heidelberg heiDATA record with the HE-Staining Variation (HEV) set (serial sections of one
  follicular thyroid carcinoma stained with the standard HE protocol or with HE too short or too long,
  hematoxylin only or eosin only; 9 whole-slide .svs files plus 203,202 patches of 256 x 256 px split
  121,919 train / 81,283 test for five variants) and the TumorLymphnode set of 7,207 PNG patches (165
  x 165 px) labelled normal lymph node vs carcinoma infiltration.
