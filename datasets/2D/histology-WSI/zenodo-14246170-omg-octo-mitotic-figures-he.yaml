notes: 'Small 64x64 RGB PNG patches of mitotic figures, not WSIs; paired images/<n>.png and masks/<n>.png.
  image_list.csv: 77,087 rows, all class 1, sources CCMCT 40,190, CMC 13,907, MIDOG 11,937, STMF 8,400,
  TUPAC16 1,999, ICPR2012 654. Masks: SAM outputs prompted by source boxes; human MIDOG++ and STMF masks
  reviewed, canine fully automatic, so source is mixed. organisms: Homo sapiens and Canis lupus familiaris
  per row of image_list.csv (tumour type column, e.g. "human soft tissue tumour"); images/ and masks/
  mix both. Voxel size: paper states only ~0.25 um for the source slides (40x); patch and STMF pixel size
  not stated, so null. No split provided. enricher: size from Zenodo file listing (was 624,755,988).'
