notes: 'Small PNG patches (~8 KB) of mitotic figures, not WSIs. images.tar.gz and masks.tar.gz listed
  from their first entries (paired images/<n>.png, masks/<n>.png); image_list.csv read in full: 77,087
  rows, all class 1, sources CCMCT 40,190, CMC 13,907, MIDOG 11,937, STMF 8,400, TUPAC16 1,999, ICPR2012
  654, with human/canine tumour type per row. Masks are Segment Anything outputs prompted by the source
  bounding boxes (STMF: pathologist/pHH3-assisted labels), with the human MIDOG++ masks reviewed (8%,
  5%, 16% adjusted), so mask quality is automatic with review. Paper: the open-source slides were scanned
  at 40x, ~0.25 um pixel; patch and STMF pixel size not stated, so voxel_size_nm is null. No split provided.
  Re-curation of ICPR, TUPAC, CCMCT, CMC and MIDOG++ (a MIDOG 2022 record exists in the catalog; this
  one adds masks and the STMF set). Latest version of concept DOI 10.5281/zenodo.11521639.'
