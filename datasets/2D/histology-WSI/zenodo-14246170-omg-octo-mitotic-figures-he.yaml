    only. Dataset ships as tar.gz, which TensorSwitch cannot open member by member: the sample unit is
    the two archives (621 MB). image_list.csv (77,087 rows x 4 columns: filename, class, source, tumour
    type; read in full by the harvester) is per-patch metadata, not listed as an array. Voxel size not
