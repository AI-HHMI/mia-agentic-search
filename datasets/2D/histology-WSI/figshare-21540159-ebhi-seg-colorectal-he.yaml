title: 'EBHI-Seg: colorectal H&E histopathology images with ground-truth segmentation masks'
short_name: Colorectal H&E tumor segmentation (EBHI-Seg)
description: 'Enteroscope-biopsy H&E histopathology images of colon tissue at 400x with a ground-truth mask for each image,
  covering six differentiation stages: normal (76), polyp (474), low-grade intraepithelial neoplasia (639), high-grade
  intraepithelial neoplasia (186), serrated adenoma (58) and adenocarcinoma (795). 224 x 224 px PNG images. Prepared by
  12 biomedical researchers and two histopathologists at the Cancer Hospital of China Medical University.'
