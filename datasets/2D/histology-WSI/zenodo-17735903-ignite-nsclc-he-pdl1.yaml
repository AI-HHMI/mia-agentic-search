notes: Pixel size not stated on the Zenodo record or in the preprint beyond the models being trained on patches at 0.5 um/pixel;
  released PNG resolution not verified, so voxel_size_nm is null. images.zip lists 816 H&E PNGs (incl. *_with_context variants)
  and 479 PD-L1 PNGs; annotations.zip has 816 H&E PNG masks and 4 PD-L1 JSONs (nuclei and PD-L1 annotations plus test sets
  with all readers). Annotation JSON schema was not opened (75 MB), format wording is inferred from filenames, so it is not
  claimed to be COCO. Preprint states 91,164 nuclei annotated over 135 PD-L1 ROIs. Train/validation splits are described in
  the preprint (Fig. 3A); a test split exists (incl. TCGA cases). The published version is in IEEE JBHI (doi 10.1109/jbhi.2026.3685529,
  not open access); the arXiv preprint was read. Size = images.zip + annotations.zip; models.zip, figures.zip and inference.zip
  excluded.
