id: zenodo-17735903-ignite-nsclc-he-pdl1
title: 'IGNITE data toolkit: a tissue and cell-level annotated H&E and PD-L1 histopathology image dataset in non-small cell
  lung cancer'
short_name: NSCLC H&E tissue and PD-L1 nuclei (histology)
description: '887 manually annotated regions of interest from 155 NSCLC patients (multi-centre, multi-scanner) for three tasks:
  16-class tissue compartment segmentation in H&E, nuclei detection in PD-L1 IHC, and PD-L1-positive tumor cell detection.
  Images are PNG ROIs (some with surrounding context); annotations are PNG label masks (H&E) and JSON point/cell annotations
  (PD-L1).'
