notes: 'images.zip lists 816 H&E PNGs (incl. *_with_context variants) and 479 PD-L1 PNGs; annotations.zip has 816
  H&E PNG masks and 4 PD-L1 JSONs (nuclei and PD-L1 annotations plus test sets with all readers). Preprint states
  91,164 nuclei annotated over 135 PD-L1 ROIs. Train/validation splits are described in the preprint (Fig. 3A);
  a test split exists (incl. TCGA cases). The published version is in IEEE JBHI (doi 10.1109/jbhi.2026.3685529,
  not open access); the arXiv preprint was read. Size = images.zip + annotations.zip; models.zip, figures.zip and
  inference.zip excluded. enricher: voxel size 500x500 nm from preprint Data Records (''extracted at a resolution
  of 0.5 micrometers per pixel''; was null). enricher: PD-L1 JSONs are MS COCO per the preprint Data Records.'
