    its context variant (1792x1792x3), the H&E mask (991x1129 uint8 gray) and a PD-L1 nuclei image (536x516x4 RGBA).
    Sampled patient10_he_roi1 pair: image 0-255 mean 130 (one sample; normalization unknown), mask values {2,4,5,9}.
    Read he_label_map.json and the head of data_overview.csv (per-ROI split, fold, scanner, shape, area_mm2). Voxel
