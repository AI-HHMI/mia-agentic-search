id: tcia-6kpy-yt49-histologyhsi-bc-recurrence
title: Histological Hyperspectral Breast Cancer Recurrence Database (HistologyHSI-BC Recurrence)
short_name: Breast cancer H&E WSIs with tissue regions (HSI)
description: H&E-stained whole-slide images (3DHISTECH Pannoramic 250 Flash III, 20x, 0.2433 um/pixel, MRXS) of the primary
  tumour of 47 invasive breast carcinoma patients (22 with distant recurrence, 25 without), with pathologist-drawn
  GeoJSON outlines of invasive ductal carcinoma (IDC), healthy tissue and ductal carcinoma in situ (DCIS), reviewed by
  a second pathologist. For ROIs of each class the collection also has paired hyperspectral microscopy images
  (400.5-938 nm, ENVI format, with raw, white/dark references, calibrated cubes and synthetic RGB) and an XLSX with
  clinical, demographic and follow-up data.
