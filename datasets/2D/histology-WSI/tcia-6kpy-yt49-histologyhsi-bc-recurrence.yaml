notes: 'Formats are MRXS (3DHISTECH, with DAT/INI metadata folders) for WSIs and ENVI (flat binary DAT + HDR) for hyperspectral
  cubes; neither is in the schema enum, hence other. TCIA download needs IBM Aspera Connect; the 1.2 TB total (47 subjects,
  8,694 series per the TCIA page) includes the hyperspectral cubes. Tissue annotations are region outlines drawn on the
  WSIs, not exhaustive whole-slide labels (coverage partial). Hyperspectral camera: 826 bands in 400-1000 nm, 7.4 um
  detector pixel, 10x objective captures; the HS pixel size at the sample is not stated in the paper text read. The
  slide-level recurrence outcome is in the clinical XLSX. The file listing was not opened, so annotations_verified is
  false; counts and formats come from the TCIA Data Access table and the paper Data Records section. A sibling TCIA
  collection for glioblastoma (HistologyHSI-GB) is a separate dataset.'
