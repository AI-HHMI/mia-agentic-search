notes: >-
  verification.url_ok is false because the landing page was not fetched successfully (403).
  The figshare collection page returned 403 to WebFetch, so the collection was read through the figshare
  API (file listing and per-file license CC0) and the open-access paper (PMC6872565). Annotations are
  point/box-style cell labels (mitotic figures, look-alikes, mast cells, granulocytes); the paper states 21
  training and 11 test slides. Total size not summed: the 32 SVS files are roughly 0.4-2.5 GB each. Annotation
  coverage 'dense' refers to mitotic figures being annotated on every slide completely. Not found in the
  sources checked: exact box dimensions. The collection lists 36 slide IDs in the API but the paper
  describes 32; n_items follows the paper. The download URL is per file via the figshare API.
