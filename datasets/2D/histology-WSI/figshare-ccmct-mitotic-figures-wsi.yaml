schema_version: '1.2'
id: figshare-ccmct-mitotic-figures-wsi
title: A large-scale dataset for mitotic figure assessment on whole slide images of canine cutaneous mast cell tumor
short_name: Canine mast cell tumor mitotic figures (H&E WSI)
description: >-
  32 H&E-stained whole slide images of canine cutaneous mast cell tumors (low and high grade), scanned at
  0.25 um/pixel, completely annotated for mitotic figures (44,880 in the algorithm-aided variant), with
  secondary annotations for mitotic figure look-alikes, neoplastic mast cells, eosinophilic granulocytes and
  tumor zones. Annotations come as SlideRunner SQLite databases and MS COCO JSON in three variants
  (MEL, HEAEL, ODAEL).
