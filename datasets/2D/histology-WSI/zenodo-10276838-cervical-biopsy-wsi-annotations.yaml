notes: 'Split archive: icaird_cervical.z01-z12 (47 GiB each) plus icaird_cervical.zip
  (40 GiB), 648.8 GB in all; all parts are needed to extract, so download_url is null.
  The zip central directory lists 2540 .isyntax slides, 2540 annotation .txt files
  and cervical/index.csv; members could not be read remotely because they span the
  split parts, so the annotation file format and index columns are not verified (the
  Zenodo page says regions are labelled malignant / high grade / low grade / normal-inflammation
  and that the index lists slide classes and train/val/test membership). iSyntax is
  not in the schema format list, so formats is other. The page lists no related paper;
  ethics REC 16/WS/0207. Checked Zenodo page and zip listing.'
