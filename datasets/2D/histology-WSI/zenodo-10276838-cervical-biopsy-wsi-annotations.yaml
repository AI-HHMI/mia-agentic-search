  notes: 'Listing: Zenodo API, 13 parts with exact sizes, total 648,756,049,539 B (file-listing). Zip64
    central directory (on the .zip part) lists 5084 entries: index.csv, 2540 .txt, 2540 .isyntax. index.csv
    and every annotation file start on disk 0 (.z01), so they were read with range requests (~70 KB);
    slides are spread over all 13 parts. index.csv has 2539 data rows (paper: 2539 WSIs) though the zip
    holds 2540 slides and 2540 annotation files. Annotation sizes 45 B to 6.7 MB; 591 are empty. iSyntax
    slides were not probed: no tool here reads iSyntax, and members spanning split parts cannot be fetched
    one by one. No direct download: Zenodo offers only the split archive (probe --download-check: icaird_cervical.zip
