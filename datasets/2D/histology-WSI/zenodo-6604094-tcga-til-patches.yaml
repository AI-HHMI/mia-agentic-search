short_name: TCGA H&E patches for TIL classification
description: 304,097 PNG patches (100 x 100 px at 0.5 um/px) from TCGA H&E whole-slide images across many
  cancer types, labelled TIL-positive (at least two tumour-infiltrating lymphocytes) or TIL-negative,
  with a metadata CSV giving the train/val/test partition (split by participant), TCGA study and barcode,
  label, path and md5 for each image.
