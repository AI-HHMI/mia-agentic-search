notes: 'Single file TCGA-TILs.tar.gz (6.9 GB); a tar.gz cannot be listed remotely; enricher: first 3 MB
  streamed, layout <study>/<partition>/<til-positive|til-negative>/*.png confirmed (annotations_verified
  true); metadata CSV not reached. Per the description: study-specific folders plus a pancancer folder
  of symlinks. This is a subset of the data of Abousamra et al. with new partitions. Per the paper, that
  training data combined pathologist patch annotations (18 TCGA cancer types) with labels sampled from
  an earlier model''s predictions (4 types: CESC, LUSC, READ, STAD), so the label source is mixed; which
  patches in this subset come from which source was not checked. Underlying slides are TCGA (original
  TCGA terms apply). Patch size 50 x 50 um at 0.5 um/px.'
