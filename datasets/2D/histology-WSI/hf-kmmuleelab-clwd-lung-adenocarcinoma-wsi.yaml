title: 'CLWD: a Chinese histopathology dataset for lung adenocarcinoma subtype classification'
short_name: Lung adenocarcinoma subtype WSIs (H&E)
description: 408 H&E whole-slide images from 210 patients with lung adenocarcinoma, with slide-level subtype
  labels (in situ, cribriform, lepidic, micropapillary, papillary, acinar, solid per WHO 2015, plus a
  WHO 2021-compatible layer) and clinical metadata in a CSV. The Hugging Face repository holds JPG versions
  of the slides.
