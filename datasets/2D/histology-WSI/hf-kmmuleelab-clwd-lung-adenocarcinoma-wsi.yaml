notes: Slide-level (weak) labels only, no regional annotations. The paper reports 408 WSIs in .svs from
  210 patients, available through the lab Pathology Image Repository (not fetched) and a Figshare record
  that holds only CLWD.csv (10.6084/m9.figshare.29035847, CC BY 4.0). The Hugging Face repo (CC BY 4.0)
  lists 386 WSI JPGs (413.6 GB) plus CLWD.csv with 408 rows, so about 22 slides in the CSV have no JPG
  there. Paper says 80x scan magnification and 0.1 um/pixel. The paper uses a patient-level 9:1 split
  with 5-fold CV but no split files are in the listing. The paper dataset DOI on Figshare is dated 2025
  with the HF mirror dated 2026.
