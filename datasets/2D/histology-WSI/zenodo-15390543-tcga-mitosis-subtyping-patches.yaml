notes: 'Checked Zenodo record, API record and the zip listing (8,236 PNGs, no other file types). Per-class counts from
  the listing: typical 3,600, artifact 2,538, mimicker 1,121, atypical 977, across Fold_1-3. The description says 20x
  slides were upsampled from 32x32 to 64x64 and that the initial training patches (MIDOG21/TUPAC plus an internal artifact
  set) are available only by contacting the authors; this release is the curated final subset. Labels were AI pre-classified
  then corrected by three pathologists. No paper is cited in the record and none was found for this specific release
  (web search only surfaced related Jahanifar et al. mitosis-detection papers), so pixel size, tumor types and per-patch
  slide identity are not stated. Authors list only the depositor.'
