short_name: Atypical mitosis subtyping patches (H&E)
description: 8,236 64x64 px PNG patches from H&E histopathology slides (6,000 sampled from TCGA, merged
  with previously labelled patches), in four classes - typical mitosis, atypical mitosis, mimicker and
  artifact - organised into three cross-validation folds. Labels were pre-classified by a model and corrected
  by three board-certified pathologists.
