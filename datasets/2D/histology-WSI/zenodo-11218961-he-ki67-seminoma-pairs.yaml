notes: 'Zenodo record: 39 zips (38 with 2 pairs, 39.zip with 1) plus an example image, 154 PNGs. Neighbouring sections, so no cell-level correspondence between H&E and Ki67 (authors). Task is H&E to Ki67
  translation / Ki67 index prediction, which fits no schema task enum, hence other. enricher: organism Homo sapiens (77 seminoma patients, surgical resection; Data 9(8):100 abstract) (was empty); channels
  3 (RGB PNG, probed); data paper added. Voxel size not stated: scans are 3DHistech Pannoramic 250 Flash III mrxs exported at the second-highest of 8 pyramid levels (BIOINFORMATICS 2024 paper), µm/px not
  given.'
