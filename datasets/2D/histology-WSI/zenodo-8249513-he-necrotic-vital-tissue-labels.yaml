notes: 'Zenodo record (API) read in full: short description, CC-BY-4.0, one 223 MB zip. peek_archive listed
  all 1,399 members: 699 images/*.tif, 699 labels/*.tif with identical names (n_items = 699 pairs), plus
  best_model.pt (130 MB trained model, not data). Zenodo calls it a "test dataset" for a 2D U-Net demo with
  three annotated classes. The cited paper (Radiother Oncol 2022) is not open access; only the abstract was
  read, and it describes head-and-neck squamous cell carcinoma xenograft tumours in 114 mice, but the Zenodo
  record does not say these images come from that study, so organism and tissue are left unknown. Image
  size, pixel size, bit depth, label encoding and whether the tiles are patches of WSIs are not stated
  (tools/probe.py could not read a header from inside the zip); each image is about 0.2 MB. Annotation source
  and coverage per image are not documented. Dimensionality 2D and TIFF format come from the file listing.'
