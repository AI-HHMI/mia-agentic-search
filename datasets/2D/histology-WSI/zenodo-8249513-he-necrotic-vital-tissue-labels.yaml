  notes: 'Listing: Zenodo API + zip central directory: 1 file, 223,250,097 B (exact), 1,399 members (699 images/*.tif,
    699 labels/*.tif, best_model.pt). Probed 2 images + 2 labels (headers): images ImageJ TIFF 256x256x3 RGB uint8
    uncompressed, labels ImageJ composite 3x256x256 uint8; all with unit um and 2.5 um/px. Read 1 image + 2 labels
    via zip ranges (172,843 B compressed; the members are deflated in the zip): image values 3-195, RGB channels
    differ; labels one-hot 0/255 per channel (Unannotated, NonVital, Vital), ch0 empty in both samples. Value ranges
    come from one sample. ImageJ Info of the image names the source scan N182c_SAS_15_..._HE.czi (BioFormatsImageServer,
