notes: 'Zenodo record (API) read in full: short description, CC-BY-4.0, one 223 MB zip with 699 images/*.tif, 699
  labels/*.tif with identical names (n_items = 699 pairs) and best_model.pt (130 MB trained model, not data). Zenodo
  calls it a "test dataset" for a 2D U-Net demo with three classes. The paper (Radiother Oncol 2022) is not open
  access; its abstract describes SAS and UT-SCC-14 HNSCC xenografts in 114 mice. Annotation source and coverage
  are not documented. enricher: voxel size 2500x2500 nm from the ImageJ calibration in the TIFF headers (2.5 um/px);
  no page states it (was null). Organism left empty: scan names in the headers (N182c_SAS_15_..._HE.czi) point to
  the paper''s human SAS xenografts in mice, mixed tissue, not stated. channels 3 (RGB) from headers; download_url
  now the direct zip.'
