short_name: Colorectal H&E 9-class tissue patches (WSI)
description: H&E tissue patches (224x224 px) from colorectal cancer whole-slide images sorted into nine
  tissue classes (adipose, background, debris, lymphocytes, mucus, smooth muscle, normal mucosa, stroma,
  tumour epithelium) - two training sets and one independent test set - plus an evaluation set of 60 image
  blocks with pixel-level pathologist masks of tumour and stroma. Released with a deep learning tumour-stroma-ratio
  model.
