  notes: 'Listing: listing.py --expand-zips on the 4 Zenodo zips (complete, 2,285,266,263 B, 216,803 members:
    216,683 patches + 60 images + 60 masks). Probed: 2 training and 1 test patch (224x224x3 uint8), 4
    evaluation images (1978-1979 px) and 1 mask (1978x1979 uint8 L). Sampled image-100001 + mask-100001
    (1.07 MB) and TUM-100001 from test set 2 (14 KB): patch values 25-255, block 4-255, mask 0-255 with
    80 levels (one sample each). Voxel size not found: JPEGs carry no calibration; the paper (Europe PMC
    full text) says tiles were taken at 20x but gives no pixel size there, and the record`s 0.252 um at
    40x does not appear in that text. All 4 zips and the sample members passed download-check (usable,
    range requests). No single archive covers the dataset, so data.download_url stays null; the four zip
    URLs are in this listing.'
