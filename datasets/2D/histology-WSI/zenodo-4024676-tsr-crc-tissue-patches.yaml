notes: 'Four zips listed with peek_archive: Training-set-part1 (89,099 JPEGs in 9 class folders, TCGA slides), Training-set-part3 (105,084 JPEGs, discovery-cohort slides), Test-set2 (22,500 JPEGs, 2,500 per class, validation-cohort slides) and TSR-evaluation-set (60 images + 60 masks; the paper mentions 126 blocks, the zip holds 60 pairs). The paper''s training part 2 (Kather NCT-HE-100K) and test set 1 (CRC-VAL-HE-7K) are not in this record. Creator is listed on Zenodo only as "Zhao" (no first name); the paper is open access. The scans are 0.252 um/pixel at 40x but the 224 px patches are described as 20x, so the patch pixel size is not stated and is left null. Mask encoding (class values) was not inspected. Zenodo resource type is labelled "Figure" although the record holds image datasets.'
