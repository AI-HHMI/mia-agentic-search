notes: 'Four zips (LNET 3657, GNET 2847, Breast-P1 1330, Breast-P2 1330 image patches = 9164; counted with peek_archive) each hold images/, labels/ (one PNG per cell class per patch) and folds/ (3-fold lists). Breast-P1 and Breast-P2 cover the same regions labeled by two different pathologists. The paper states 202,807 annotated cells and 100 WSIs. Label PNG pixel encoding (point map vs. mask) was not inspected. Pixel size not stated in the paper HTML or HF card (checked); scanner/objective: NanoZoomer S360 at 40x. License taken from the HF README front matter (cc-by-nc-4.0); the paper itself is CC BY-NC-ND on arXiv. Published version is Med Image Anal (Europe PMC abstract only; full text read from arXiv HTML v2).'
