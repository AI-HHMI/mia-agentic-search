notes: 'Counts from the zip listing (peek_archive): IHC/images Train 671 and Validation 200 PNGs, matching masks (871 .npy),
  871 pyramid .tif images and 871 ASAP .xml files in IHC_xml_asap. No licence is stated on the dataset page, only a request to
  cite the NuClick paper, so licence is unknown. The paper is not open access (abstract and the arXiv abstract page only),
  so the tissue/organ, stain, scanner, magnification and pixel size are not known. Annotation source is mixed because the page says labels were produced with the NuClick interactive
  framework. The listing shows the .npy files as masks by folder name only; their encoding was not opened. The WBC
  blood smear set released alongside is a separate record.'
