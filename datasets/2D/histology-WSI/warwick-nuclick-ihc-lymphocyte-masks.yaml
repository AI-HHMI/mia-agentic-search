notes: 'Counts from the zip listing: IHC/images Train 671 and Validation 200 PNGs, matching masks (871 .npy), 871
  tiled .tif images and 871 ASAP .xml files in IHC_xml_asap. No licence is stated on the dataset page, only a request
  to cite the NuClick paper, so licence is unknown. Annotation source is mixed because the page says labels were
  produced with the NuClick interactive framework. The WBC blood smear set released alongside is a separate record.
  enricher: masks opened (uint32 instance IDs, .npy; npy has no data.formats value, so formats stay png + tiff);
  annotations.format updated. enricher: voxel size 240x240 nm from upstream LYON19 (Data page: WSIs at 0.24 um/px,
  ROIs saved at full resolution; was null); arXiv NuClick says the patches are 256x256 crops of LYON19 ROIs (breast,
  colon, prostate; CD3/CD8), and the 871 patches map to 438 of its 441 ROI ids. Resampling is not stated. Organism
  not stated in either source.'
