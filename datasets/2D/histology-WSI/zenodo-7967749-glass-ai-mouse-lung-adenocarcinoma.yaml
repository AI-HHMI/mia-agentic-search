title: Image and label patches used to train GLASS-AI (mouse lung adenocarcinoma H&E)
short_name: Mouse lung adenocarcinoma grading (H&E histology)
description: Paired 224x224 px H&E image patches and label patches from whole slide images of mouse lung adenocarcinoma
  (three mouse models), annotated by expert humans for tumor grade (Grade 1-4 LUAD) plus normal alveolar and
  airway classes. Scanned at 20x, 0.5022 um/pixel. Used to train the GLASS-AI grading and segmentation pipeline.
