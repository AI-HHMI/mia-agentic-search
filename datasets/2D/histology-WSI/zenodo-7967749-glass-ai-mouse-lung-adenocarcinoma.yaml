  notes: 'Zenodo listing with zip members: 1 file, 8,109,058,051 B exact, 70,736 image and 70,736 label
    PNGs. Sampled one image (RGB uint8 224x224, range 8-255) and two labels with a scratch script (repo
    read_member + PIL + numpy): labels are RGB with channel values 0/255, and the distinct colours are
    (255,255,0), (0,255,255) and (255,255,255) in both. So the labels are colour-coded classes; the colour-to-class
    map (6 classes per the paper) is not documented in the data, so classes is null. Values come from
    one image and two labels.'
