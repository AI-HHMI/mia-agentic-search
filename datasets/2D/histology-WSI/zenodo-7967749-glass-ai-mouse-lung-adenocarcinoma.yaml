notes: 'Zip listed with peek_archive (141,474 members): Images/ and Labels/ PNGs, plus .DS_Store and a
  .db file. Scanner, 20x and 0.5022 um/pixel are from the Zenodo description; the paper (read via Europe
  PMC) says patches come from 33 whole slide images of three mouse models, were annotated by human graders
  into six classes (normal alveolar, normal airway, Grade 1-4 LUAD) and used 6000 patches per class for
  training. Some file names carry rotation suffixes (e.g. ".90r."), suggesting augmented copies; this
  was not confirmed, so n_items counts all image files. No train/validation split files provided. enricher:
  n_items 70,737 -> 70,736 (listing: 70,736 PNGs each in Images/ and Labels/, the extra member is OS metadata);
  labels are RGB colour-coded.'
