  regions
short_name: Lung carcinoma in situ H&E slides (WSI)
description: Hamamatsu NanoZoomer H&E whole-slide images (NDPI) of 112 bronchoscopic biopsies of pre-invasive squamous cell
  lung carcinoma in situ lesions (progressive vs regressive), each with hand-annotated carcinoma-in-situ and stromal regions
  (NDPA annotation files). A processed table gives lymphocyte, stromal, tumour and other cell counts within the annotated
  CIS and stromal regions of each slide.
