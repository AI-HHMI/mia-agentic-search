notes: 'FTP listing: 112 .ndpi and 112 .ndpa files in 20200517-ftp (10.4 GB; an earlier 20200417-ftp folder holds 3 more slides) plus assay/processed text files; total ~10.7 GB by HTTP index. NDPA contents were not opened, so annotation geometry is inferred from the file extension and the study description (CIS and stromal regions annotated). License CC-BY-4.0 is from the IDR search listing; the submission template in idr0000-study.txt says only "CC-BY". Pixel size 0.2273 um from OMERO image metadata (Pixels.PhysicalSizeX); varies slightly per slide. Paper full text is not open access (Cancer Discovery 2020, preprint 10.1101/833004 not retrievable), so Methods were not read; the description comes from IDR study files. IDR study release date not stated in the sources checked.'
