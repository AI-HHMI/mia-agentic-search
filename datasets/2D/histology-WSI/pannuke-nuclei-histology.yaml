title: 'PanNuke: pan-cancer H&E histology nuclei instance segmentation and classification (Hugging Face copy)'
short_name: PanNuke nuclei segmentation (H&E histology)
description: 7,901 H&E-stained histology image patches (256x256 px, 40x) from 19 tissue types with instance masks
  for 189,744 nuclei in five classes (neoplastic, inflammatory, connective, dead, epithelial), plus tissue-type
  labels. Provided in three folds. Annotations were generated semi-automatically and quality controlled by clinical
  pathologists. This record is the RationAI Hugging Face parquet copy.
