  notes: 'Listing: tools/listing.py s3://dharani-fetal-brain-atlas/: 3,290 files, 3,065,477,030,677 bytes,
    complete, exact. Probed 3 TIFF headers (Specimen_1_43 annotated, Specimen_1_10 and Specimen_2_409
    unannotated) and read all page shapes of two with tifffile (range reads): pyramids of 6 and 4 levels.
    Read Specimen_2_1675.json (45 KB, 4 polygons) and the ontology header. No pixel data sampled (smallest
    annotated TIFF is 461 MB). Voxel size: paper (PMC11794986) states scanning at 0.5 um/px and "The 466
    Nissl and the corresponding H&E sections are available at 1 um per pixel ... The remaining sections
    are available at 4 um per pixel"; the bucket matches (64000 vs 16000 px, same extent), so voxel_size_nm
    stays null for the mixed record. No single archive: download_url is the S3 prefix; objects are direct
    https URLs.'
