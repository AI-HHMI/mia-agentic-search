notes: 'S3 listing complete (3,290 files, 3.07 TB): data2d/specimen_1..5 hold 2,818 TIFFs and 466 GeoJSON files, data3d has five *_nisl_128mpp_rgb_masked.nii.gz, ontology/ontology.json. The registry page and the paper say 5,132 sections; the bucket lists 2,818 TIFFs, so the full set is probably served only on the brainportal (https://brainportal.humanbrain.in/publicview/index.html). Probed one TIFF: BigTIFF, JPEG-compressed, tiled 2000 x 2000, uint8 RGB, 64000 x 64000 px with 6 pages (probably a pyramid, not stated). Pixel size not in the TIFF: the paper states 0.5 um/pixel scanning (TissueScope LE120) and 1 um/pixel for the released annotated sections, so voxel size is left null. Only the 466 annotated sections have labels; the rest are unlabelled. License CC BY 4.0 on the registry page and in the paper; the paper data statement also says data are available from the corresponding author on request.'
