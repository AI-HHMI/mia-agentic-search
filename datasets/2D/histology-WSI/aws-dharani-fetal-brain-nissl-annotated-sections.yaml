title: DHARANI developing human-brain atlas (Nissl and H&E sections, 14-24 gestational weeks)
short_name: Fetal brain Nissl section atlas (histology)
description: Whole-brain serial histology (Nissl and H&E, 20 um coronal and sagittal sections scanned
  as large BigTIFFs) of five second-trimester human fetal brains (14-24 gestational weeks), 2,818 TIFFs
  in the S3 bucket, with 466 sections annotated by anatomists as GeoJSON polygons of about 500 brain structures,
  fibre tracts, ventricles and transient developmental structures (ontology.json), plus five 3D Nissl
  reconstructions (NIfTI) registered to postmortem MRI.
