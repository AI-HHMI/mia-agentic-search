description: Heidelberg heiDATA record with 204,159 JPEG image tiles (100 x 100 um, ~395 x 395 px nominal)
  cut from scanned H&E liver slides and labelled with 7 classes (colorectal and pancreatic adenocarcinoma
  metastases, bile duct adenoma / peribiliary hamartoma, liver necrosis, bile duct, portal tract / non-neoplastic
  hepatic tissue, connective tissue), with a tab file assigning each tile to a patient-disjoint training
  / validation / test set (116,728 / 44,372 / 43,059).
