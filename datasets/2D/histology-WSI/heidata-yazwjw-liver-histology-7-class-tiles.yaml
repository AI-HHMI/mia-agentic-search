notes: 'Zip member counts read via ranged GETs (JPEGs): colon adenocarcinoma metastasis 38,943, liver necrosis 21,878, pancreas
  adenocarcinoma metastasis 23,375, bile duct 7,809, bile duct adenoma / hamartoma 6,932, liver portal tract 70,880, connective
  tissue 34,342 = 204,159, matching the paper. Paper: slides from the Mainz institute archive (103 colorectal and 101 pancreatic
  metastasis cases, 53 bile duct adenoma / hamartoma), regions annotated in QuPath and cross-validated by four pathologists;
  tiles 100 x 100 um (~395 px; the tab lists 439 px for some tiles). Pixel size derived from 100 um per ~395 px (about 253 nm), not
  stated directly. Sibling heiDATA skin tile dataset (7qcr8s) is a separate record by the same group. Code under Apache-2.0, data CC-BY-4.0.'
