notes: 'Zip member counts read via ranged GETs (JPEGs): colon adenocarcinoma metastasis 38,943, liver
  necrosis 21,878, pancreas adenocarcinoma metastasis 23,375, bile duct 7,809, bile duct adenoma / hamartoma
  6,932, liver portal tract 70,880, connective tissue 34,342 = 204,159, matching the paper. Paper: slides
  from the Mainz institute archive (103 colorectal and 101 pancreatic metastasis cases, 53 bile duct adenoma
  / hamartoma), regions annotated in QuPath and cross-validated by four pathologists; tiles 100 x 100
  um (~395 px). Sibling heiDATA skin tile dataset (7qcr8s) is a separate record by the same group. Code
  under Apache-2.0, data CC-BY-4.0. enricher: voxel size 253 nm removed (was derived from ~395 px per
  100 um; 204,156 of 204,159 tiles are 439-440 px per the tab, so the paper''s ~395 px doesn''t hold;
  no source states a pixel size).'
