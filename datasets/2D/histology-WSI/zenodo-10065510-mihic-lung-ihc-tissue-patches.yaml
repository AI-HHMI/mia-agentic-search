notes: 'One zip with 309,698 PNG patches (peek_archive full listing; matches the paper count) in train/val/test folders
  with six class folders; there is no separate folder for the paper''s Immune cells class, so those patches are presumably
  inside Other (not confirmed). The paper (open access, Methods read) states TMA sections of 188,416 x 110,080 px = 42660.87 x
  24924.15 um at 40x, which gives 0.2264 um/px; the pixel size is computed from those numbers and assumes the 128 x 128 patches
  were not rescaled. Pathologists annotated regions in QuPath. Split is by annotated region, 64/16/20 percent train/val/test.'
