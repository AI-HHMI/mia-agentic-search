notes: 'The Zenodo record (a Dryad mirror) holds one 42.6 GB zip: 88 .tiff slides in test/ and train/ folders (peek_archive),
  orbit.db (46.8 MB) and readme.txt, which states CC0. Paper (PLOS Comput Biol 2020) says 92 slides / ~21,000 annotations
  were used for the model; the record says 88 images and 21,037 annotations. Pixel size and scanner are not stated
  on the record, readme or paper text read, so voxel size is null. Annotations are only readable through Orbit
  or by querying the SQLite database; the schema of orbit.db was not inspected. The paper points to the GPLv3 Orbit software (orbit.bio) and a glomeruli model, but no code page was fetched, so baseline_code_url is null.'
