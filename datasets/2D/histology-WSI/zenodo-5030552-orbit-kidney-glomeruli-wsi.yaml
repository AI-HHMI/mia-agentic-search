notes: 'Zenodo record (Dryad mirror) holds one 42.6 GB zip: 88 .tiff slides (test/ 32, train/ 56; readme says 58/32), orbit.db
  and readme.txt, which states CC0. Paper: 92 slides / ~21,000 annotations used for the model; readme: 88 images, 21,037 annotations.
  Pixel size not stated in readme, Zenodo/Dryad metadata or paper, so voxel size is null. Annotations are Orbit objects in
  SQLite, readable only through Orbit. organisms: Mus musculus = FastRed Mouse and H&E Mouse G1-G3 slides; Rattus norvegicus
  = H&DAB Rat G1-G3 and PAS Rat slides (slide ids per group in readme.txt). enricher: download_url changed to the direct zip;
  channels 3 (RGB) from sample (was null).'
