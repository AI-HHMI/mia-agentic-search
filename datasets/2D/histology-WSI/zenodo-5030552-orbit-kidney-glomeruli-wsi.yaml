    shape_varies: null
    dtype: unknown
    compression: none
    encoding: polygons
    classes:
    - id: null
      name: glomerulus
    alignment: unknown
    alignment_notes: 'SQLite database: RAW_DATA_FILE (88 rows: FILENAME <slide id>.tiff, MD5) and RAW_ANNOTATION (21,037 rows,
      RAW_DATA_FILE_ID, DESCRIPTION, DATA blob). Pairing rule: RAW_ANNOTATION.RAW_DATA_FILE_ID -> RAW_DATA_FILE.FILENAME;
      all 88 slides have annotations. DATA blobs are Java-serialized Orbit shape objects (magic aced0005), so the outline
      coordinates were not decoded (never deserialize dataset objects); their coordinate frame (full-resolution pixels presumably,
      not documented) is unverified.'
  notes: 'Listing: tools/listing.py on the zip with --expand-zips, 90 members, 42,608,028,529 bytes (file-listing, complete).
    Sample: test/6533682.tiff via sample.py (162.1 MB compressed member), 14080x26880x3 uint8 (axes YXS from tifffile), range
    0-255 in that one sample, p1 60, p50 234, p99 243. orbit.db (11.7 MB compressed) read read-only with sqlite3: table schema
    and row counts only. TIFF resolution tags not read: the member is deflated, so header probing needs the whole member and
    a second download timed out. voxel size not found; checked: readme.txt, Zenodo API, Dryad API (usageNotes/methods), paper
    full text (Europe PMC); TIFF resolution tags still open. Labels need conversion from Orbit''s Java objects into masks
    (e.g. by Orbit itself) before automatic conversion.'
