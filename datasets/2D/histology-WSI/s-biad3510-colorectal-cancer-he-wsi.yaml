notes: 'Annotations are slide/tumour-level clinical and molecular labels (no pixel-level masks). The folder holds 2,502
  slide TIFFs (plus one .fic metadata file each), so there are more slides than the ~1,000 cases. The paper is a preprint
  that is not open access, so only its abstract was read; the pixel size comes from the BioImages record. Whether the TIFFs
  are pyramidal was not checked. Total size is estimated from the HTTP index (rounded).'
