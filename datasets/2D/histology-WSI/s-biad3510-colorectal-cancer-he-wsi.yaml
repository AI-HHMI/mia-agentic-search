notes: 'Annotations are tumour-level clinical and molecular labels (no pixel-level masks): Clinical_annotation.csv
  has 1,000 tumour rows x 98 columns; slides are named A2020-<tumour id, 6 digits>_<block>_HE-<scan time>.tiff,
  2,502 slides for 1,000 tumours. The paper is a preprint that is not open access, so only its abstract
  was read; the pixel size (0.25 um/px) comes from the BioImages record. enricher: size_bytes exact from
  the BioStudies file manifest slides.json plus root files (was rounded HTTP index); channels 3 (RGB)
  and pyramidal TIFF from the slide header; license url from the study record.'
