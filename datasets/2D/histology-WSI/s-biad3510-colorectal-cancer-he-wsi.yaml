title: A clinically annotated proteomic and histological resource of 1,000 colorectal cancers
short_name: Colorectal cancer H&E whole slides (histology)
description: H&E whole slide images of treatment-naive colorectal cancer cases from a 1,000-case multimodal
  cohort (proteomics, targeted genomics, histopathology, clinical follow-up), scanned at 40x (0.25 um/pixel)
  on a Philips Ultra Fast Scanner and converted from iSyntax to TIFF. A clinical annotation table gives
  per-tumour labels such as histology, pT/pN/M, UICC stage, grading, MMR/MSI status and survival.
