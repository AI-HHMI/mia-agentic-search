    ("x40 Magnification (0.2500 microns/pixel)"). Whole dataset 3.4 TB: no single archive; data.download_url
    stays the folder, every file is a direct https link under it (manifest slides.json). Conversion: 2D
    records are not yet covered by the miao layout.'
