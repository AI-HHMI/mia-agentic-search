id: s-biad2666-feline-intestine-wsi-villi-crypts
title: Unsupervised Clustering of Feline Small Intestinal Biopsies Reveals Overlapping Patterns in Feline Chronic Enteropathy
short_name: Feline intestine H&E slides, villi and crypts
description: Retrospective H&E whole-slide images of feline small intestinal biopsies from 11 institutions scanned on Olympus and Hamamatsu scanners at 40x,
  with signalment, diagnosis and development/test/grading set flags per slide, 112 manual villus and crypt region annotations (one fully annotated region
  of interest per slide, GeoJSON) for training a semantic segmentation model, and raw Aiforia model outputs.
