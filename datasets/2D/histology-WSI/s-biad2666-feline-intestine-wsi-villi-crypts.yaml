notes: 'Differs from the catalogued S-BIAD1129 (333 slides with lymphocyte and compartment annotations): this deposit is a larger retrospective set of slides
  (study text says 1,121 WSIs from 765 biopsy submissions; the file list has 2,358 files, 1,562 image names, 1,164 NDPI, 398 VSI, 796 ETS) whose only manual
  annotations are 112 villus/crypt layer files, with diagnoses and set flags (model_development 235, model_test 107, pathologist_grading 105 slides) in the file list.
  Slide overlap with S-BIAD1129 was not checked. The annotations were made by one veterinary student under two pathologists (study metadata, confidence High);
  the Aiforia raw output files are model predictions, not annotations, and are not counted. No publication is listed in the study metadata and the paper was not
  found in Europe PMC, so none is cited. Formats other = NDPI, VSI and ETS (not in the schema list). Pixel size is not stated (nominal 40x). Size not summed.'
