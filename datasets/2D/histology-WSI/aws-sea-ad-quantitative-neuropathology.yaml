notes: 'Public S3 bucket s3://sea-ad-quantitative-neuropathology (us-west-2, no account needed); download_url
  null because it is a prefix tree. Layout: <region>/<donor>/<donor>-<slide>-<stain>/{*.svs, *.annotations,
  analysis_masks/, downsampled/}; 5 region folders with 84 donor folders each. One slide read: SVS 51792
  x 47351 px RGB JPEG, Aperio AppMag 20, 6 levels (MPP 0.5016); analysis mask 23547 x 23423. Masks are
  HALO algorithm output (automatic) so label meaning and classes were not documented on the pages read
  (a tutorial PDF exists). Terms: Allen Institute Terms of Use only, no standard license; the portal page
  also says the repository is under review for possible modification. Size not determined. enricher: 2016
  SVS slide folders by S3 listing (4 regions x 84 donors x 6 stains; the MTG+STG folder holds only DeepZoom
  viewer tiles). Pixel size 0.5016 um from SVS headers (MPP, 7 slides, 4 regions, scanner SS7432).'
