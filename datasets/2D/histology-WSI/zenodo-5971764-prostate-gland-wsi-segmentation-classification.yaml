title: Digital Pathology Dataset for Prostate Cancer Diagnosis
short_name: Prostate gland masks and classes (H&E WSI)
description: Patches cropped from 99 H&E whole-slide images (40 prostatectomy and 59 core needle biopsy specimens from 99 patients, Aperio AT2 at 40x, 0.25 um/px) with manually annotated prostate glands classified as benign, malignant, unknown or artifact. A gland segmentation sub-dataset provides 34,340 patches (512 x 512 px at 20x, gland centred) split by patient into train/validation/test, and a gland classification sub-dataset (subset of 46 patients) provides multi-resolution patches (5x, 10x, 20x, 40x) around each annotated gland.
