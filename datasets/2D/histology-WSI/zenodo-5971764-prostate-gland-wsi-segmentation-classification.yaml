notes: 'Two zips on Zenodo (peek_archive): gland_segmentation_dataset.zip (19.7 GB, 99 per-slide tar.gz archives) and gland_classification_dataset.zip (27.3 GB, 184 tar.gz archives at 5x/10x/20x/40x variants), plus info-list txt files. The tar.gz archives were not opened, so patch and mask file formats inside are unverified (format listed as other) and the classification patch count is not given here; 34,340 is the segmentation patch count from the Zenodo description. Pixel size 0.25 um at 40x and the four annotation classes are from the preprint and the Zenodo page. Partial glands at the core edges are not annotated, so coverage is partial. A senior pathologist reviewed 10 % of annotations (paper).'
