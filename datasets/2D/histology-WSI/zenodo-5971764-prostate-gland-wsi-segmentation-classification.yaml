notes: 'Two zips on Zenodo: gland_segmentation_dataset.zip (19.7 GB, 99 per-slide tar.gz) and gland_classification_dataset.zip (27.3 GB, 184 tar.gz in 4 patch variants), plus info-list txt files. 34,340 is the segmentation patch count (Zenodo). Classes from the preprint and the Zenodo page. Partial glands at core edges are not annotated (coverage partial). A senior pathologist reviewed 10 % of annotations; annotation source manual (ASAP tool). enricher: formats png (was other; PNGs inside tar.gz inside the zips, sampled). enricher: voxel size set to null (was 250x250 nm): 0.25 um/px is the specimen-level 40x scan; segmentation patches are at 20x and classification patches at 5x/10x/20x/40x, and no source states the pixel size of the 20x/10x/5x patches.'
