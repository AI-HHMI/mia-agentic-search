id: zenodo-7412500-segpath-mist1-he
title: 'Large-scale annotation dataset for cell/tissue segmentation in H&E-stained images : anti-MIST1
  (plasma cells)'
short_name: SegPath plasma cell segmentation (H&E)
description: 26,462 H&E image patches (984 x 984 px, 40x, 0.22 um/px) of human tumour tissue-microarray
  sections paired with binary masks of plasma cell nuclei. Masks come from destaining the H&E slide, restaining
  with anti-MIST1 immunofluorescence and thresholding, not from manual drawing. One of the SegPath records
  (one per antigen); a CSV assigns each patch to train, validation or test.
