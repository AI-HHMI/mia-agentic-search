notes: 'Different from the catalogued SegPath panCK record (zenodo-7412731): other antigen (MIST1, plasma cell
  nuclei), other images. Zenodo files: MIST1_PlasmaCell.tar.gz (24,891,504,922 B), MIST1_fileinfo.csv and
  LICENSE. The tar.gz was not opened (peek_archive supports zip only), so the masks are not seen in a
  listing; patch count and split (train 22,640, val 1,894, test 1,928; 26,462 rows) come from MIST1_fileinfo.csv.
  License is CC-BY-NC-SA 4.0 per the Zenodo record text (Zenodo field: Other (Non-Commercial)); commercial
  use needs contacting the authors. Pixel size 0.220818 um/px from the paper Methods (Hamamatsu Nanozoomer
  S60, 40x). Masks are IF-derived, validated against pathologists in the paper. download_url is the record.'
