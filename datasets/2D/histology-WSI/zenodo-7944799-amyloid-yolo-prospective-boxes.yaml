short_name: Amyloid-beta plaque and CAA boxes (IHC histology)
description: 200 immunohistochemically stained human brain whole-slide-image tiles (1536 x 1536 px, 56
  slides from three institutions, four amyloid stains) with bounding boxes of cored plaques and cerebral
  amyloid angiopathy drawn independently by four neuropathology experts, plus the consensus-of-two box
  labels (original_data/labels) used to train the YOLOv3 detector. Released inside the code archive of
  the amyloid-yolo paper.
