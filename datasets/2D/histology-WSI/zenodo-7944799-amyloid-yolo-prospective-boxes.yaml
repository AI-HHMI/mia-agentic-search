notes: 'The Zenodo record is a GitHub release archive (amyloid-yolo-paper-v1.0.0.zip, 169.6 MB, 1086 files). peek_archive shows 200 JPEG images in prospective_validation_images/ plus prospective_annotations/ and original_data/labels/ (662 .txt files), with code, weights and CSV tables. The larger training and test images the README places in data.zip are hosted on OSF (10.17605/OSF.IO/FCPMW), but that OSF project listed no files when queried in this run, so only the 200 prospective images are counted. The license is MIT (LICENSE file in the archive; the Zenodo record says other-open); it is not stated whether it covers the data as well as the code. Slides were scanned on Aperio AT2, CS2 and Versa 200 scanners at 20x or 40x; micrometres per pixel are not stated, so voxel_size_nm is null. The paper reports four expert annotators for the 200 prospective images. The earlier tile-level dataset this work builds on (Zenodo 1470797) is a separate record.'
