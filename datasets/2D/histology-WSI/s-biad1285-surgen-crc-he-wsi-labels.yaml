description: 1,020 H&E-stained whole-slide images (ZEISS Axio Scan.Z1, 40x, 0.1112 um per pixel; ZEISS
  CZI and OME-Zarr) from 843 colorectal cancer cases, with case-level labels in two CSV files - KRAS,
  NRAS and BRAF mutation status, mismatch repair and microsatellite instability status, tumour site, stage
  and grade, and five-year survival for one cohort.
