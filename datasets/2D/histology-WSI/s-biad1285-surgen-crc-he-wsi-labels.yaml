notes: 'Labels are case-level clinical and molecular results (the study metadata lists the method as expertly
  annotated), not region or pixel annotations, so annotation source is unknown. Survival data (five-year
  outcome and days to death) exist only for the SR386 cohort (the paper reports 426 cases); the SR1482
  cohort has no survival. Label tables have about 427 (SR386) and 416 (SR1482) case rows; the paper reports
  843 cases and 1,020 slides in total. The OME-Zarr copy was added on 2026-08-03 next to the original
  CZI files. The paper shows a proof-of-concept mismatch-repair prediction model and a GitHub page is
  listed in the study metadata (repository contents not checked). Channels are 3 because the slides are
  RGB H&E (OME-Zarr: 3 channels). enricher: size from BIA file lists.'
