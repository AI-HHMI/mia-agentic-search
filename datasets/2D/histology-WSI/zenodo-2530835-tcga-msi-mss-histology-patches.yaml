id: zenodo-2530835-tcga-msi-mss-histology-patches
title: Histological images for MSI vs. MSS classification in gastrointestinal cancer, FFPE samples
short_name: TCGA colorectal/gastric MSI vs MSS H&E tiles
description: 411,890 H&E image patches (224x224 px at 0.5 um per pixel, Macenko colour-normalised) cut from TCGA formalin-fixed
  paraffin-embedded diagnostic slides of colorectal and gastric cancer, sorted into MSS (microsatellite stable) and MSIMUT (microsatellite
  instable or highly mutated) classes. Eight zip archives give training and test sets per cancer type (CRC_DX and STAD) and class,
  with patients randomised to about 70 % training and 30 % test at patient level.
