notes: 'Zenodo record read in full; STAD_TEST_MSIMUT.zip was listed with peek_archive (27,904 PNG, 3.2 GB, folder MSIMUT, file names
  like blk-AAAASCPPLMFG-TCGA-VQ-A8E3-01Z-00-DX1.png); the other seven zips (3.2 to 10.5 GB each) were not listed, and their patch counts
  come from the record description, which sums to 411,890. Labels are the patient-level MSS or MSIMUT status assigned from TCGA data,
  not per-tile pathologist annotation; training sets were undersampled to balance classes. The record does not cite a paper. The Nature
  Medicine 2019 MSI paper (10.1038/s41591-019-0462-y) is the likely companion, but the record does not say so and its full text is not
  open access, so no publication is listed. Tumour detection and normalisation were automatic. size_bytes is the sum of the eight zips;
  download_url is the record page because there are eight files. enricher: n_items 410,890 from the exact listing of all 8 zips (CRC_DX_TEST_MSIMUT
  holds 28,335 patches, not the 29,335 the description says).'
