notes: 'No license is given on the Zenodo record or in README.txt (license fields are empty); the CC BY 4.0 link in the paper
  applies to the article. Pixel size and scanner are not stated in the Zenodo record, README or paper (only image size 1384
  x 1040 px and magnification written as "x100" in file names); the paper reports the images as histological images of scanned
  sections. Besides masks, every image has a regression score (fraction of damaged nuclei, damaged epidermis area), hence
  ml task "other". 202 of 804 images (25%) have epidermis and high-damage masks (zip holds 1208 PNG: 804 images plus 404 masks).
  database.csv has a stratified 10-fold column (strat_fold). Zenodo record 7282326 is a version of concept DOI 10.5281/zenodo.7266845,
  which the README cites as persistent identifier. enricher: size from the complete Zenodo listing (was 1,573,090,000); README
  license fields checked again, still empty.'
