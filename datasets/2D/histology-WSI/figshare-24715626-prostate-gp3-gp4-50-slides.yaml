notes: 'Figshare record, zip listing (peek_archive) and paper full text read. The paper reports 165,094 image/mask pairs
  at 20x before filtering and 37,932 pairs after removing patches that are all background or all foreground; the
  zip count per slide suggests the unfiltered set, so n_items is the paper figure and is not recounted. Patches are
  256 x 256 px per the paper. The paper splits the 50 slides 32 train / 8 validation / 10 test (its Table 4), which
  is not stored as a file in the record, so splits_provided is false. Annotation was by one pathologist (grades
  agreed by two). Pixel size is not stated (40x scan, 20x patches). Other files in the record: three .hdf5 Keras models
  (377-470 MB each). Checked: record, zip listing, paper.'
