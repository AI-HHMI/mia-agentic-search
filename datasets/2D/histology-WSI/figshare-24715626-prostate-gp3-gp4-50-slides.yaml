short_name: Prostate biopsy H&E benign/malignant masks (WSI)
description: Image patches and ground-truth masks cut at 20x from 50 H&E-stained prostate needle biopsy whole slide
  images (Leica Aperio AT2, scanned at 40x), with glands outlined by a pathologist in ASAP and grouped into
  benign and malignant (Gleason patterns 3 and 4). The record also holds three trained U-Net-family Keras models
  (U-Net, attention U-Net, residual attention U-Net).
