title: MItosis DOmain Generalization (MIDOG) 2021 training data (breast cancer H&E, four scanners)
short_name: MIDOG 2021 mitotic figures (H&E histology)
description: Training set of the MICCAI MIDOG 2021 challenge for scanner-agnostic mitotic figure detection. 200 H&E
  breast cancer regions of interest (2.0 mm2, one per case, all from UMC Utrecht) digitised with four whole slide
  scanners (Hamamatsu XR, Hamamatsu S360, Aperio CS2, Leica GT450; 50 cases each), with COCO-format bounding boxes of
  mitotic figures and of hard negative imposters for the first three scanners.
