notes: 'Zenodo lists 200 TIFFs (26.0 GB) plus MIDOG.json; TIFF structure and the JSON category mapping were not inspected.
  Per the challenge paper (arXiv 2204.03742) scanner D (Leica GT450, images 151-200) has no training annotations, so
  only images 001-150 carry labels. Boxes cover mitotic figures plus hard negatives and expert-disagreement cases. Pixel
  size and label counts are not stated on the Zenodo page or in the arXiv text read. Concept DOI given; the record is
  version 1.0 (10.5281/zenodo.4643381). Different from the MIDOG 2022 and MIDOG++ records in the catalog.'
