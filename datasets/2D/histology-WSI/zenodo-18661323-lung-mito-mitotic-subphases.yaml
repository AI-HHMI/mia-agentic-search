id: zenodo-18661323-lung-mito-mitotic-subphases
title: 'LUNG-MITO and stMIDOG++: A Subphase-Labeled Mitotic Dataset'
short_name: Lung adenocarcinoma mitotic subphases (H&E)
description: LUNG-MITO, 3,526 anonymised 1024x1024 H&E tiles from 21 slides of 10 lung adenocarcinoma patients
  (0.24 um/px), with 5,423 COCO annotations (segmentation mask and bounding box) classed into prophase,
  prometaphase, metaphase, anaphase, telophase, non-mitotic and atypical mitotic figures. The record also
  carries subphase labels and masks for the 503 MIDOG++ crops (26,283 annotations), whose images are hosted
  in the MIDOG++ GitHub repository, not here.
