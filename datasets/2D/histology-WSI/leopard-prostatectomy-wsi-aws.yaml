title: 'LEOPARD: H&E prostatectomy whole-slide images with biochemical recurrence outcome (AWS Open Data)'
short_name: LEOPARD prostatectomy WSIs with recurrence labels
description: 508 H&E-stained prostatectomy whole-slide images (TIFF, 2.14 TB) from Radboud University
  Medical Center in the public S3 bucket leopard-challenge, each with a tissue mask and a per-case biochemical-recurrence
  label (event 1/0) and follow-up time in years, released for the LEOPARD challenge on predicting time
  to recurrence.
