  notes: 'Full bucket listing (tools/listing.py https://leopard-challenge.s3.us-west-2.amazonaws.com/:
    1,017 objects, 2,141,843,791,393 B, complete, exact; the record omitted the 18.8 KB label CSV). Probed
    page shapes of slides 0000, 0250 and 0466 and mask 0466. Sampled tissue mask 0466 (310,422 B): values
    {0,1}. No slide pixels sampled (smallest slide 1.05 GB). Voxel size: not stated on the AWS registry
    page or the challenge Data page; TIFF XResolution of all three probed slides is 10555189/256 px/cm
    (= 0.2425 um/px), not used because no document confirms it. No single archive: download_url stays
    the S3 prefix; sample URLs use the global endpoint leopard-challenge.s3.amazonaws.com (the us-west-2
    host is not on the TensorSwitch allowlist). Data page: publication embargo until the challenge papers
    are out.'
