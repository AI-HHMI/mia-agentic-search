notes: 'Bucket listed in full: 508 case_radboud_*.tif slides (2.14 TB) and 508 *_tissue.tif masks (0.65
  GB) under training/, plus the label CSV as the root object ''training'' (508 rows: 87 with event 1,
  421 with event 0, with follow_up_years). Labels are clinical outcomes per slide, not image annotations,
  so this is a weak training signal (prognosis regression and classification); confidence is lowered for
  that. Licence is as written on the AWS registry page (''CC BY NC SA''), read as CC BY-NC-SA 4.0; the
  bucket has no licence file. Pixel spacing, scanner and the number of patients are not stated on the
  registry page, in the bucket listing or in the CSV, nor on the challenge Data page, so voxel size is
  null (TIFF headers: see technical.notes). No dataset paper is listed by the registry.'
