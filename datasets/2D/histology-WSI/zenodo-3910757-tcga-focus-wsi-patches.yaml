notes: 'Labels are image-level focus quality, not structure annotations. The zip holds 19,346 PNGs: the 14,371 in
  TCGA@Focus.txt (GitHub) plus 4,975 small unlisted ones (<20 KB; one sampled was all zero, i.e. blank). Use the
  txt list. enricher: organism Homo sapiens (TCGA = human cancer slides, genome.gov) (was empty). enricher: size
  23,662,252,880 B from the Zenodo file listing (was 23,675,200,000, the uncompressed sum). enricher: paper read
  on arXiv (2007.06565); it gives no pixel size for TCGA@Focus. Folder names corrected to In Focus / Out of Focus
  / Out of Focus (Marker).'
