notes: 'Labels are image-level focus quality (in-focus / out-focus), not structure annotations. peek_archive of
  TCGA@Focus.zip (23.7 GB, 21,048 files): 19,346 PNGs under "Image Patches Database/In Focus|Out Focus/<organ>/<slide>/patch_i_*_j_*.png", 1,701 per-slide WSI_ROI.xlsx files and one txt. The 19,346 PNG count exceeds the 14,371 patches on the page; the page figure is used for n_items. Pixel size not stated on the Zenodo page or in the archive listing. The Zenodo page asks to cite the FocusLiteNN MICCAI 2020 paper (Wang et al.); that 2020 paper is not indexed in Europe PMC or Crossref (tools/paper.py found nothing), so it could not be read; only the Zenodo page was used.'
