notes: 'Zip listing of the main record: 739 PNG patches, 895 GeoJSON files, metadata CSVs and manifests;
  the metadata README reports 739 patches and 20,021 nuclei from 156 slides. The preprint instead reports
  858-867 patches and 39,246 nuclei over 162-168 WSIs, so the Zenodo deposit holds fewer patches than
  the paper describes. Whole-slide images (MRXS, about 700 GB, 368 slides) are in 11 separate Zenodo records
  (DOIs listed in the main record description, e.g. 10.5281/zenodo.20657725) and were not inspected; these
  are not counted in n_items. Pixel size is 0.125 um/px for 58 WSIs and 0.24 um/px for 310 WSIs (preprint),
  so voxel_size_nm is null. The peer-reviewed Scientific Data version (doi 10.1038/s41597-026-07932-7)
  was not readable (not open access); the arXiv preprint was used. Modality is cytology smears scanned
  as WSI (brightfield).'
