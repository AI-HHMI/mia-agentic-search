description: Oral brush cytology from ten Indian medical centres, Papanicolaou- and May-Grünwald-Giemsa-stained, scanned at 40x. The main Zenodo record holds 739 PNG patches (2048x2048) with QuPath GeoJSON nucleus polygons (about 20,000 nuclei, four cytological categories) and metadata; the MRXS whole-slide images are in 11 linked Zenodo records.
