  notes: 'Complete Zenodo listing of the main record (one zip, 3,953,180,791 B = size_bytes), members
    expanded. The 11 linked WSI records (MRXS) were not listed. Read the zip directory, one patch GeoJSON
    (95,057 B: FeatureCollection, 9 Polygon features, classification name "I"), and data_dictionary.csv
    by range (396,223 B in total). Probed and sampled one patch: 2048x2048x3 uint8 RGB, deflate, values
    [0, 255], mean 249.5 (mostly bright background). The class codes in the GeoJSON are Roman numerals
    ("I"); their mapping to the four cytological categories was not read. Values are from one patch.'
