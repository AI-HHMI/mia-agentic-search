    tools/listing.py could not read the tree (FTP timed out; HTTP index is capped and rounds sizes), so size_source
    is page-stated. Probed 7 RGB tiles and 2 nucleus masks; sampled one tissue tile+mask (mask values 0,1,2 present)
    and one cell_segmentation tile+mask (102 IDs, max 103). value_range is from one sample each. cell_segmentation
    tiles are 257x257 although the README says 512x512; their pixel size relative to the slide is not stated. Voxel
