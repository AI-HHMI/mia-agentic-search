title: Barrett's oesophagus H&E biopsy tiles with manual tissue, nucleus and cell-class annotations (BEACON)
short_name: Barrett's oesophagus H&E annotations (histology)
description: 'H&E tiles (512x512 px) from Barrett''s oesophagus surveillance biopsy whole-slide images,
  each paired with manual pathologist annotations made in QuPath: 4-class pixel-level tissue masks (560
  tiles), per-nucleus instance masks with epithelial/other class (67 tiles), and 25,518 per-cell point
  labels in five classes (71 tiles). Released to train the BEACON tissue segmentation and CellViT nucleus
  models.'
