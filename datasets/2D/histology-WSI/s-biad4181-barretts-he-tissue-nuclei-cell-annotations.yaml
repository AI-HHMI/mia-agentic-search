notes: 'Three annotation sets share slide IDs: tissue_segmentation (560 tile+mask pairs, 8 per slide),
  cell_segmentation (67 tiles, one per slide, instance masks plus classmap.json) and cell_classification
  (71 tiles, 25,518 point labels in five classes: epithelial, lymphocyte, stromal, plasma and other immune
  cells). Annotated by board-certified pathologists in QuPath. Pixel size 0.4548 um (Hamamatsu NanoZoomer,
  20x, test set) or 0.5013 um (Leica Aperio AT2, 20x, discovery set) per the BIA record; voxel_size_nm
  gives the 0.4548 um value, which applies to part of the tiles only. Total size and tile counts for the
  whole archive not stated; the HTTP listing is partial (about 357 MB seen, stopped after 200 directories),
  and the full text of the medRxiv paper is not open access, so only its abstract and the BIA/README descriptions
  were read. No train/test splits provided.'
