notes: 'Three annotation sets share slide IDs: tissue_segmentation (560 tile+mask pairs), cell_segmentation (67
  tiles, instance masks + classmap.json) and cell_classification (71 tiles, 25,518 points in five classes). Manual
  QuPath annotations by pathologists. enricher: voxel size set to null (was 454.8 nm): tiles come from two cohorts
  with different pixel sizes, 0.4548 um (NU test, Hamamatsu NanoZoomer 20x) and 0.5013 um (MDA discovery, Aperio
  AT2 20x) per the BIA record; the BIA file lists give each file''s Cohort (MDA: 400/47/51 tiles, NU: 160/20/20
  in tissue/cell seg/cell class). enricher: size 435,270,913 B from the BIA file lists (1467 files); n_items = 699
  image tiles; channels 3 (RGB). Paper full text not open access. No splits provided.'
