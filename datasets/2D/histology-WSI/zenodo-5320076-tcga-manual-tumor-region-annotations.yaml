title: Manual tumor annotations in TCGA
short_name: TCGA manual tumor region outlines (H&E WSI)
description: Manual outlines of invasive tumor regions on TCGA diagnostic H&E whole slide images for 23 solid tumour types (one zip per type, one polygon-vertex CSV per slide, drawn in QuPath), made to enrich tumour tissue for molecular prediction rather than for pixel-exact segmentation. The slides themselves are not included.
