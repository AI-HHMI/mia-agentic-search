notes: 'The 157.4 MB total is the annotation archives only; the TCGA slides come from the GDC portal (TCGA terms apply). CRC.zip lists 624 CSVs, one per slide, each a list of X_base, Y_base vertices; per-cancer slide counts for the other 22 archives not listed. The record says the aim was not a pixel-perfect tumour annotation (region-level outlines, QuPath v0.1.2). No related paper listed on the Zenodo page, so none read. Pixel size not given. Coverage partial: only invasive tumour regions are outlined.'
