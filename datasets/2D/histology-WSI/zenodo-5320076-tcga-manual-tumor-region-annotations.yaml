notes: 'Annotations are on Zenodo; the TCGA slides come from the GDC portal (TCGA terms apply). The record
  says the aim was not a pixel-perfect tumour annotation (region-level outlines, QuPath v0.1.2). No related
  paper listed on the Zenodo page, so none read. Coverage partial: only invasive tumour regions are outlined.
  enricher: 23 zips hold 10,583 CSVs (956 MB uncompressed); 10,582 match open GDC slides by file name
  (1 KIRP CSV unmatched); size_bytes is now slides (11,346,817,742,101 B, GDC API) + zips (157,407,570
  B), was zips only; n_items = matched slides; channels 3 (RGB SVS). Pixel size not given.'
