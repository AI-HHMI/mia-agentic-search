  notes: 'Listing: Zenodo API (23 zips, complete), zip central directories (10,583 CSVs), GDC files API
    by file name for every CSV (10,582 open SVS, 11.35 TB; 1 KIRP CSV unmatched). Sizes summed from these
    APIs, not tools/listing.py, so size_source stays unknown. Read PRAD/TCGA-HC-8262-01Z-00-DX1 CSV (225
    lines, header X_base, Y_base). Header read of slide 2cd68fa7 (4.9 MB, whole file): 3 pages, level
    0 (9089, 10000, 3) uint8 Aperio JP2000, description has no MPP or AppMag. Voxel size not found; checked:
