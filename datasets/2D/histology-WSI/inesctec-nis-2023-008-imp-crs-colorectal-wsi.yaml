notes: 'Directory listing of open-datasets.inesctec.pt: IMP-CRS2024-Dataset/CRS1 (1132 .svs, 1.17 TB), CRS2 (3301 .svs, 3.43 TB) and CRS_Test (900 .svs, 0.93 TB), each with labels.csv (slide_name, slide_label). Labels are slide-level (weak) classes: 0 non-neoplastic, 1 low-grade, 2 high-grade; the paper says about 10% of slides also carry pixel-level spatial annotations, but the public listing only shows labels.csv, so those are not claimed here. Pixel size 0.26 um/px at 40x on Leica GT450 (paper Methods). License: dataset page links CC BY-NC 2.0; README says CC-NC and research use only, no redistribution. Download via wget -r (README). Paper Data availability: a large portion of the dataset is released.'
