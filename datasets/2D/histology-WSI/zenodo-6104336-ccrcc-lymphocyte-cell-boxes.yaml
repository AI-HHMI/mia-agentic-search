  notes: 'Exact listing of the single zip (424 members, 202,422,290 bytes; PNGs 202,189,769 bytes uncompressed).
    The record description says 426 PNGs; the zip has 423, and data.json has exactly those 423 keys. Probed
    img17_55808x49152.png (512x512x3 uint8) and a TCGA 500x500 tile (500x500x4 uint8, RGBA). Read data.json
