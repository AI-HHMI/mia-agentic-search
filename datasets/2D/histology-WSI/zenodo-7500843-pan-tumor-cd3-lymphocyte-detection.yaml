notes: 'Zenodo file listing: 245 files (92 .tif ROI images, 152 .csv annotation files, LICENSE.txt), 1.27 GB total.
  Zenodo license field says "other-nc"; LICENSE.txt and the paper state CC BY-NC 4.0. Description: scanned at 0.23
  um/px (40x, NanoZoomer 2.0-HT), hence 230 nm. Annotation: five ROIs per indication manually annotated by three
  pathologists (all three plus a consensus provided); all other ROIs annotated semi-automatically with commercial
  image-analysis software, hence source mixed. CSV format read from GC_01.csv. The paper reports train/test experiments
  but the record gives no fixed split, so splits_provided is false.'
