  dataset page; native pixel size 0.50 um/px at 20x is from the paper, the 5x PNG pixel size is not stated, so voxel size
  is null. Paper: 486 resection slides (385 train, 23 dev, 78 test) and 79 biopsy slides. enricher: licence = custom "Dataset
  Research Use Agreement" in the registration form (non-commercial research only, no redistribution, no derivative works)
  (was unknown). enricher: size 89.5 GB = sum of the 11 zip sizes on the dataset page (was null).'
