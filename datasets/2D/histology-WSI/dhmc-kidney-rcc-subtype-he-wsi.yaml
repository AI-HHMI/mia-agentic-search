notes: 'Dataset page: access via a request form that emails download links (expire
  after 4 h); files DHMC_wsi_01.zip to DHMC_wsi_11.zip plus MetaData.csv; no licence
  stated (data released with Dartmouth-Hitchcock IRB permission, de-identified). Files
  were not listed (links require the form), so PNG format, 5x scale and class labels
  come from the dataset page; the native pixel size 0.5 um/px at 20x is from the paper,
  the 5x PNG pixel size is therefore about 2 um but was not stated, so voxel size
  is left null. Paper full text read via Europe PMC: 486 resection slides (385 train,
  23 dev, 78 test) and 79 biopsy slides.'
