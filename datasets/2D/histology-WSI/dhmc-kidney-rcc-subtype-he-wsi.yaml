short_name: Renal cell carcinoma subtype H&E slides (DHMC)
description: 563 H&E-stained whole-slide images from Dartmouth-Hitchcock Medical Center
  (484 resection and 79 biopsy slides, scanned with Aperio AT2 at 20x and provided
  as 5x PNG), labelled by two pathologists with the predominant histological pattern
  (oncocytoma, chromophobe, clear cell or papillary RCC, plus normal), with a metadata
  CSV giving slide type and train/validation/test split.
