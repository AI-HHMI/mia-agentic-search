title: Histological images for tumor detection in gastrointestinal cancer
short_name: GI cancer H&E tissue-class patches (histology)
description: 11,977 H&E-stained image patches (512x512 px, 0.5 um/px) of human colorectal and stomach cancer tissue,
  sorted into three classes - adipose/mucus (ADIMUC), stroma/muscle (STRMUS) and tumor epithelium (TUMSTU). A subset of
  the NCT-CRC-HE-100K data, released to train a tumor-detection network.
