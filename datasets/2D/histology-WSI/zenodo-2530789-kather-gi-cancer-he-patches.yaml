notes: 'Three zips (ADIMUC 3977 PNG, TUMSTU 4000 PNG, STRMUS 4000 PNG; listed with peek_archive) total
  11,977 patches and 5,746,731,916 bytes. Class labels are the folder/zip names; there is no separate
  label file or train/test split. The Zenodo record gives 512x512 px at 0.5 um/px; the related paper describes
  the larger NCT-CRC-HE-100K set (zenodo 1214456, 224x224 px at 0.5 um/px, Macenko-normalised) and does
  not describe this 512 px subset in detail, so the record description is the source for patch size. This
  is a different record from 1214456 (not in the catalog at the time of writing). Download is three separate
  files, so download_url is null. enricher: annotations.format prefixes corrected from the file listing
  (ADI 2446, MUC 1531, STR 1700, MUS 2300, TUM 2389, STU 1611).'
