notes: 'No labels: the signal is registration, the same tissue region in every stain and device, used in the paper for SimCLR self-supervised
  pretraining and domain-shift tests. Collection of 3 Figshare+ articles (CC BY 4.0): PLISM-sm 19.2 GB (PLISM_sm.tar.gz, PNG tiles), PLISM-wsi
  129.3 GB (91 tar.gz of PNG tiles), originals 180.8 GB (91 slides: 52 ndpi, 26 svs, 13 tiff; ndpi is not in the format list). Sizes
  from the Figshare API; n_items is 57,902 + 310,947 (counts from the collection text). Scanner pixel size 0.220 to 0.262 um by device
  (paper table), smartphone pixel size not stated, so voxel size left null. Tar contents were not listed.'
