notes: 'No labels: the signal is registration, the same tissue region in every stain and device, used
  in the paper for SimCLR self-supervised pretraining and domain-shift tests. Collection of 3 Figshare+
  articles (CC BY 4.0): PLISM-sm 19.2 GB (PLISM_sm.tar.gz, PNG tiles), PLISM-wsi 129.3 GB (91 tar.gz of
  PNG tiles), originals 180.8 GB (91 slides: 52 ndpi, 26 svs, 13 tiff; ndpi is not in the format list).
  n_items is 57,902 + 310,947 (collection text). Voxel size left null: it differs by device (paper Table:
  S360 0.229, S210 0.220, SQ 0.221, S60 0.220, AT2 0.253, GT450 0.262, P 0.25 um/pixel; smartphones not
  stated). enricher: the tile CSVs (PLISM_sm_en.csv, PLISM_wsi_en.csv) also give a tissue_type per tile
  (46 TMA tissues), usable as class labels; annotations left as is.'
