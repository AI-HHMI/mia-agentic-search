title: Pathology Images of Scanners and Mobilephones (PLISM), registered H&E images across 13 stain conditions and 13 devices
short_name: PLISM H&E stain and scanner variants (histology)
description: Serial sections of a tissue microarray of 46 human tissues stained under 13 H&E conditions and digitised with 7 slide scanners
  and 6 smartphones, registered so that the same tissue appears in every condition. PLISM-sm has 57,902 smartphone-based image groups,
  PLISM-wsi 310,947 whole-slide tile groups, plus the 91 original unregistered slides; built to train and test models robust to stain
  and scanner domain shift.
