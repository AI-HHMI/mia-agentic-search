notes: 'Zip listing (peek_archive): 57,419 files, 21.6 GB uncompressed (31,895 TIFF, 25,516 PNG, 7 CSV), organised as 20x
  and 40x folders with 256, 512, 1024 (20x) and 1024, 2048 (40x) tiles, each with image/, label/, bwmask/, graymask4/, rgbmask/,
  distmap/ and folds.csv. Annotation: QuPath contours, started by hand and then pre-annotated by MR-NOM and NCIS in an active-learning
  loop and corrected by experts (arXiv 2409.04175), hence source mixed. The preprint gives roughly 70/10/20 % splits and a
  matching radius corresponding to 0.50 um/pixel (20x) and 0.25 um/pixel (40x); the pixel size is not stated on the Zenodo
  page, so voxel_size_nm is left null. The zip is a nested redundant tiling of the same 69 images (n_items counts the 69
  base images). Labels are instance-level only, with neuron/glia classes planned for a later version. Paper full text read
  from the arXiv preprint (the journal version is not open access in Europe PMC).'
