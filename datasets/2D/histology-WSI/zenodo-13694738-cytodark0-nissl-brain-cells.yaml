short_name: Nissl brain cell instances (histology)
description: 69 Nissl-stained brain histology patches (1024 x 1024 at 20x; 58 of them also at 40x, 2048 x 2048) from four
  regions (cerebellum, hippocampus, auditory and visual cortex) of five mammals (bottlenose dolphin, mouse, chimpanzee, macaque,
  bovine), with 38,755 manually corrected cell outlines (neurons and glia) as instance label maps, plus binary, 3-class and
  4-class masks, distance maps, re-tiled 512 and 256 px versions and a train / validation / test fold table.
