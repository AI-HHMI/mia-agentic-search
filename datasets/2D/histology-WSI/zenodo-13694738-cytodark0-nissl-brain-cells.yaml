notes: 'Zip: 20x and 40x folders of 256-2048 px tiles with image/, label/, class masks, distmap/ and folds.csv (see
  technical). Annotation: QuPath contours, started by hand and then pre-annotated by MR-NOM and NCIS in an active-learning
  loop and corrected by experts (arXiv 2409.04175), hence source mixed. The preprint gives roughly 70/10/20 % splits
  and a matching radius corresponding to 0.50 um/pixel (20x) and 0.25 um/pixel (40x); the pixel size is not stated
  on the Zenodo page, so voxel_size_nm is left null. The zip is a nested redundant tiling of the same 69 images
  (n_items counts the 69 base images). Labels are instance-level only, with neuron/glia classes planned for a later
  version. organisms by file-name suffix: Tursiops truncatus = *_Tursiops (53 base patches), Pan troglodytes = *_Chimpanzee
  (7), Mus musculus = *_Mouse (4), Macaca = *_Macaque (4), Bos taurus = *_Bovine (1).'
