notes: 'IEEE DataPort lists the dataset as Open Access with UNITOPatho.zip of 274.98 GB (PNG
  + CSV, two scales). No dataset licence is stated on the DataPort page; the GitHub MIT licence
  covers the code. Details (20x, 0.4415 um/px, 292 slides, 8,669 + 867 patches, 70/30 slide-level
  split) from the ICIP 2021 preprint (arXiv 2101.09991, read as PDF). enricher: access confirmed
  as registration: page says files are accessible to all logged-in users with a free IEEE account;
  AWS S3 access needs a DataPort subscription. enricher: download_url set to the DataPort page
  (the only host; zip behind login). Zenodo 4643645 (CC-BY-4.0) holds only an announcement PDF,
  not the data.'
