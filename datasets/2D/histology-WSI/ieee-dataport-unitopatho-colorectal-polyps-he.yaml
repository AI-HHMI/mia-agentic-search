schema_version: '1.2'
id: ieee-dataport-unitopatho-colorectal-polyps-he
title: 'UniToPatho: labeled H&E patches for colorectal polyp classification and adenoma dysplasia
  grading'
short_name: Colorectal polyp H&E patches (UniToPatho)
description: 9,536 H&E patches cropped from 292 whole-slide images of colorectal polyps (one
  slide per patient, scanned at 20x, 0.4415 um/px), labelled by expert pathologists into six
  classes (normal, hyperplastic polyp, tubular and tubulo-villous adenoma with high- or low-grade
  dysplasia), at 800 um (8,669 patches) and 7,000 um (867 patches) scales, with metadata CSVs
  and a slide-level 204/88 train/test split.
