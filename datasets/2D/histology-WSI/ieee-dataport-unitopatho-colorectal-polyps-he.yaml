notes: IEEE DataPort lists the dataset as Open Access with UNITOPatho.zip of 274.98
  GB (PNG + CSV, two scales); the page says a free IEEE account is enough but another
  passage says a DataPort subscription is required, so access is recorded as registration
  (unconfirmed). No dataset licence is stated on the DataPort page; the GitHub MIT
  licence covers the code. Details (20x, 0.4415 um/px, 292 slides, 8,669 + 867 patches,
  70/30 slide-level split) from the ICIP 2021 preprint (arXiv 2101.09991, read as
  PDF). Patch files and annotations were not listed (the 275 GB archive is behind
  a login), so formats and annotation layout come from the DataPort description.
