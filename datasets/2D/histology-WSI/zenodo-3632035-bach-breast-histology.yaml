notes: 'License is CC BY-NC-ND 4.0 (non-commercial, no derivatives), stated on the Zenodo record and README. Training
  zip listing (peek_archive): 400 TIFF, 30 SVS whole-slide images, 10 XML annotation files, 40 PNG, 1 CSV. n_items
  = 400 microscopy images + 30 WSIs from the training zip; the test set is a separate 3 GB zip, not listed. Pixel
  size 0.42 um (microscopy) / 0.467 um (WSI) from the challenge Dataset page; 420 nm is given for the microscopy
  images only. The paper (Medical Image Analysis 2019) is not open access; only the abstract was read. Part A labels
  are image-level, Part B region polygons cover only 10 slides per the XML count.

  enricher: size_bytes = exact Zenodo listing incl. 2 txt files (was 13383784174).

  enricher: annotations.format detailed from the CSV and A04.xml.'
