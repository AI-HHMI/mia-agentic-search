title: Endometrial Whole Slide Images Dataset
short_name: Endometrial biopsy whole-slide images (H&E)
description: 2,910 H&E-stained whole-slide images of endometrial biopsies from NHS Greater Glasgow and Clyde, each with a
  slide-level diagnosis (malignant, other or benign, insufficient) and QuPath region annotations as GeoJSON plus binary mask
  PNGs, with a train, validation and test split and nuclear morphology tables extracted with HALO AI.
