notes: 'File lists show 2910 .isyntax slides (3.48 TB; the paper says 2,909) and 8,511 annotation-side files (0.48 TB): 2910 .geojson, 2877 _mask.png, 2724 CSV
  nuclear feature tables. Only 525 GeoJSON files are non-empty (the paper: annotate only areas that differ from the slide class, so a blank
  file means the whole slide has the slide class), hence partial coverage. Slide labels: 860 malignant, 1,867 other or benign, 182 insufficient; the split
  (train 1,338, val 660, test 911 by the paper table sum) is defined in the paper, and the metadata CSV was not opened. Scanned on a Philips UFS at 40x, 0.25 um/pixel.
  iSyntax is not in the schema format list, so data.formats is other. Pixel dimensions not read. Checked: BioStudies record and file lists, paper full text (open access).'
