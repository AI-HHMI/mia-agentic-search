notes: 'File lists: 2910 .isyntax slides (3.48 TB; one, IC-EN-00740-01, is 0 bytes, hence the paper''s 2,909) and 8,511 annotation-side
  files: 2910 .geojson, 2877 _mask.png, 2724 HALO nuclear-feature CSVs. Only 525 GeoJSON files are non-empty (only areas differing
  from the slide class are annotated), hence partial coverage. Slide labels: 860 malignant, 1,867 other or benign, 182 insufficient;
  split defined in the paper. 0.25 um/pixel at level 0 (40x, paper). iSyntax is not in the schema format list, so data.formats
  is other. enricher: annotations.source mixed: GeoJSON regions manual (pathologists, QuPath); _mask.png are tissue-detection
  masks (automatic, per BioStudies file attributes); CSVs from HALO AI (automatic). enricher: download_url now the direct-file
  folder (was the landing page).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "Files/  (BioStudies file lists: 11,421 files, 3,957,434,554,012 B)\n  Endometrial Images/\n    IC-EN-<nnnnn>-01.isyntax\
      \                    2910  3,477,440,821,352 B  WSI (0 B to 4.48 GB each)\n    IC-EN-<nnnnn>-01.geojson            \
      \        2910     35,684,115 B  QuPath polygons (2385 empty, 45 B)\n    IC-EN-<nnnnn>-01_mask.png                  \
      \ 2877    849,456,058 B  tissue-detection masks\n    IC-EN-<nnnnn>-01.isyntax_object_Data.csv    2724  479,108,592,487\
      \ B  HALO nuclear features\n  Endometrial_study_component_file_list_updated-IHU.json/.tsv\n  Endometrial_annotations_component_file_list_updated-IHU.json/.tsv\n\
      \  ccRCC HE WSI/   (T3-, T5_, T10_, ... Nuclear morphology/ subfolders; not in the file lists, not inspected)\n"
    n_files: 11421
    listing_complete: true
  sample:
    urls:
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/199/S-BIAD1199/Files/Endometrial%20Images/IC-EN-00001-01.isyntax
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/199/S-BIAD1199/Files/Endometrial%20Images/IC-EN-00001-01.geojson
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/199/S-BIAD1199/Files/Endometrial%20Images/IC-EN-00001-01_mask.png
    size_bytes: 2170591287
    description: 'Slide IC-EN-00001-01: the 2.17 GB iSyntax WSI, its QuPath GeoJSON (24 polygons) and its mask PNG'
  arrays:
  - role: raw
    path_pattern: Endometrial Images/*.isyntax
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: unknown
    lossy: null
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Philips iSyntax (file starts with an XML header); no reader in the inspection tools, so pixel dimensions
      and dtype were not read.
  - role: label
    path_pattern: Endometrial Images/*.geojson
    format: json
    axes: null
    shape:
    - 24
    - 1
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: polygons
    classes: null
    alignment: same-grid
    alignment_notes: 'One GeoJSON FeatureCollection per slide, same stem as the .isyntax; Polygon coordinates in level-0 pixels
      (e.g. x ~40,000, y ~61,000 in IC-EN-00001-01). Only regions differing from the slide-level class are drawn; an empty
      file means the whole slide has the slide class. IC-EN-00001-01: 24 polygons, all classification name "Proliferative"
      (not one of the paper''s two annotation classes "malignant" / "other or benign"; class names in the files vary, so classes
      is left empty).'
  - role: label
    path_pattern: Endometrial Images/*_mask.png
    format: png
    axes: yxs
    shape:
    - 2926
    - 2950
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    lossy: false
    value_range:
    - 0
    - 250
    normalization: none
    encoding: rgb-colors
    classes: null
    n_ids_observed: 5
    alignment: scaled
    alignment_notes: <stem>_mask.png pairs with <stem>.isyntax; a downscaled thumbnail-resolution mask of the whole slide
      (2950x2926 px for IC-EN-00001-01); the scale factor to level 0 is not stated.
  - role: other
    path_pattern: Endometrial Images/*.isyntax_object_Data.csv
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    alignment: unknown
    alignment_notes: 'HALO AI per-nucleus morphological feature tables (BioStudies attribute: "Tabular data of nuclear morphological
      features from annotations"); not opened (74 MB for IC-EN-00001-01).'
  notes: 'Sizes from the BioStudies file lists (JSON, exact per-file bytes for all 11,421 files; their sum equals size_bytes).
    listing.py over the FTP timed out and fell back to the rounded HTTP index (11,421 files, ~3.96 TB), so size_source is
    page-stated. Sampled: IC-EN-00001-01_mask.png (285,880 B): RGB uint8 2926x2950, values {0,75,218,221,250} across channels,
    62% zero (one sample); the paper calls these binary tissue masks (tissue white) but this file is colour-coded, so encoding
    is rgb-colors. Read IC-EN-00001-01.geojson (464,314 B, 24 Polygons, class "Proliferative") and an empty one (45 B). Not
    convertible automatically: the raw slides are Philips iSyntax, which TensorSwitch and the inspection tools cannot read.
    Direct per-file https links exist (EBI FTP); no single archive. Folder "ccRCC HE WSI/" also sits under Files/ but is not
    in the study file lists; not inspected.'
