  notes: 'File list from the Mendeley public API (76 files, sizes sum to 2,964,819,087 B = record size;
    folder names from /folders/2); listing.py cannot read Mendeley, so size_source page-stated. Download
    links (public-files/.../file_downloaded) 302-redirect to S3 objects; the Mendeley URLs return 403
    to scripted clients (Cloudflare), the S3 URLs work with range requests. Probe: two Images/*.jpg files
    are PNG (RGB uint8, 2909x14903 and 6112x14912). Sample pair MD22-04169(B1-4): image 0..255 (mean 230,
    mostly white background; one sample), mask RGB uint8 same shape, channel values {0,48,96,112,127,128,156,160,224,255},
