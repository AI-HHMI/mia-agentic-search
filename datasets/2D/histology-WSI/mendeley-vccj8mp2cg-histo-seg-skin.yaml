notes: 'Facts come from the Mendeley Data API record: description (38 WSI samples, 12 classes annotated by histopathologists), license CC BY 4.0 and a listing of 76 files (38 jpg and 38 png, 2.96 GB). No paper is linked on the record, so none was read. Species, pixel size, scanner and magnification are not stated on the record; organism is left empty (skin cancer and histopathologist annotation suggest human tissue, but this is not stated). Which PNG is the mask and the class-to-value mapping are inferred from the matching file names and not verified. Images are large (about 47 MB per JPEG).'
