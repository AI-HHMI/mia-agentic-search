notes: 'Facts come from the Mendeley Data API record: description (38 WSI samples, 12 classes annotated
  by histopathologists), license CC BY 4.0 and a listing of 76 files (38 jpg and 38 png, 2.96 GB). No
  paper is linked on the record, so none was read. Species, pixel size, scanner and magnification are
  not stated on the record; organism is left empty (skin cancer and histopathologist annotation suggest
  human tissue, but this is not stated). Images/ and Masks/ folders confirmed (enricher); colour-to-class
  mapping not documented. Images are large (about 47 MB per JPEG). enricher: formats jpeg -> png (the
  .jpg files are PNG); masks are RGB colour-coded.'
