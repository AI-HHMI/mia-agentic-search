notes: 'All figures from the TCIA collection page: 4 patients, 1,144 tiles, class counts 536/345/263, Training_Set_1 (11 folders,
  547 images) and Training_Set_2 (12 folders, 597 images), image package about 197 MB via Aspera, CSV direct. The page calls
  the images both Whole Slide Image data and tiles; no SVS is mentioned, so formats is jpeg. The Aspera package was not opened,
  so file names and folder layout are unchecked. Scanner not stated; 10x magnification, pixel size not stated. Paper full
  text is not open access (Europe PMC gives the abstract only), so Methods were not read. Only 4 patients, so patient-level
  generalisation is limited. Annotated by one of two pathologists per tile.'
