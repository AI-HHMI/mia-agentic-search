notes: 'Zip (285 files) holds code (Codes/) plus Dataset/Mink/{Train Data,Test data}/{Images,Masks} and Dataset/Polar bear/{Images,Masks}; counts from the zip listing are 109+8 mink images and 10 polar bear images (mink train masks number 110, one more than images). Species appear only as the folder names Mink and Polar bear, so organism is left empty. Stain, magnification, pixel size, annotator and annotation procedure are not given on the Zenodo record, the GitHub README or in the zip listing, and the paper is under review and was not found on Europe PMC, bioRxiv or arXiv (tools/paper.py found nothing), so these are unknown. Mask label encoding not inspected. Apache-2.0 is the Zenodo license and the GitHub repository licence; it is not stated whether it is meant to cover the images specifically. Modality histology-WSI is the closest enum value for the histology images, which are tiles of about 3 MB, not whole slides.'
