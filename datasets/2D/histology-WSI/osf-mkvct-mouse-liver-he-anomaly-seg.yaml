schema_version: '1.2'
id: osf-mkvct-mouse-liver-he-anomaly-seg
title: Histopathology Mouse Liver Tissue Segmentation Dataset
short_name: Mouse liver H&E lesion masks (WSI tiles)
description: 672x672 px tiles from 742 H&E-stained mouse liver whole-slide images of 44 preclinical studies,
  with pixelwise polygon annotations by a veterinary pathologist for healthy tissue, no-tissue and ten
  lesion classes (apoptosis, artifact, ballooning, cytoplasmic vacuolation, fibrosis, inflammation, macrosteatosis,
  microsteatosis, mitosis, necrosis), with train/val/trainval/test split files.
