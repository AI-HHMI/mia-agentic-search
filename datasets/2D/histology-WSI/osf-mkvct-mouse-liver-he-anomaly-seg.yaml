  notes: 'Listing: OSF storage API walked by a scratch script (listing.py has no OSF support): 93 files,
    21,592,948,413 B, exact per-file sizes; zip members listed for 19_267 (img 44 PNGs + .DS_Store; mask
    44 PNGs); a count over all 88 zips did not finish within the run, so the tile total is unknown. Size
    is the OSF-stated total of a complete listing (size_source page-stated because the listing was not
    made by listing.py). Sample (19_267 tile __58_20): image 672x672x3 uint8, 0-255; mask 672x672x3 uint8
    with values {0, 52, 100, 235}: background black plus 9,308 px of (52,100,235) = macrosteatosis. Value
