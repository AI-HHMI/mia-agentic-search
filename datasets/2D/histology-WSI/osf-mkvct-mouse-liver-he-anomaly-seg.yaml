notes: 'OSF project: data/img/ (44 zips, one per study, PNG tiles in per-slide subfolders), data/mask/
  (44 zips, PNG masks) and data/split/ (train.txt, val.txt, trainval.txt, test.txt, tile paths without
  extension). The central 252x252 px of each 672x672 tile forms a non-overlapping grid; surrounding context
  overlaps. Resolution 0.442 um/px from the project wiki. Test split is built from studies held out of
  training/validation. License: license.txt in the project is CC BY-NC 4.0 (no licence field in the OSF
  metadata). No single archive: per-study zips via the OSF storage API. Tile count not stated (n_items
  null; one study zip, 19_267, has 44 tiles). enricher: mask colour map from the authors'' config.py.'
