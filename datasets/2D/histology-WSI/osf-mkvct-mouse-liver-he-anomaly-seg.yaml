notes: 'OSF project with folders img/ (44 zips, 21.5 GB, one per study, PNG tiles in per-slide subfolders), mask/ (44 zips, 58 MB,
  PNG masks) and split/ (train.txt, val.txt, trainval.txt, test.txt). Listed one image zip (19_267: 44 PNG tiles) and one mask zip
  (23_210: 1,343 PNG masks); the total number of tiles is not stated (742 WSIs, 44 studies), so n_items is null. The central
  252x252 px of each 672x672 tile forms a non-overlapping grid; surrounding context overlaps. Resolution 0.442 um/px from the
  project wiki. Test split is built from studies held out of training/validation. The OSF project metadata has no licence
  field; the license.txt file in the project is CC BY-NC 4.0 and was used. No single archive: the download is per-study zips via the
  OSF storage API (https://api.osf.io/v2/nodes/mkvct/files/osfstorage/). Class value coding of the masks was not checked.'
