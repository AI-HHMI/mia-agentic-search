notes: 'Read the figshare record, listed the 1.05 GB zip with peek_archive (4,230 PNG files, 6 per micrograph: raw image, ROI mask, and vascular_wall and fibrosis masks for each of two experts), and read the GitHub README (folder layout, 5-fold animal-level split in splits_5fold.csv, 2D U-Net baseline train.py). The Scientific Data paper is not open access, so Methods could not be read: pixel size, scanner, objective and image dimensions are not stated on the figshare page, README or abstract. Figshare states CC BY 4.0; Crossref shows CC BY-NC-ND 4.0 for the article itself, not necessarily the data. Counts per folder (705 each) are inferred from 4,230 files / 6 folders.'
