title: 'FRPV-PH: micrographs of rat pulmonary vessels with vascular wall and fibrosis masks from two experts'
short_name: Rat pulmonary vessel fibrosis masks (histology)
description: 705 fixed-size micrographs of pulmonary artery branch segments from male Wistar rats with pulmonary arterial hypertension or chronic thromboembolic pulmonary hypertension, Picro-Mallory-stained lung sections digitized with a whole-slide scanner. Each image has a region-of-interest mask and binary masks of the vascular wall and intramural fibrosis zones from two independent experts. A 5-fold animal-level cross-validation split is provided in the GitHub repository.
