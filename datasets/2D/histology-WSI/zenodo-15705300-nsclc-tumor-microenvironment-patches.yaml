notes: 'Zip has 700 PNG patches and 700 Icy XML files. Pixel size 0.486 um read from pixelSizeX/Y in the XML header
  of two members (units not stated; assumed um as in the Icy format). Annotation classes taken from cytomine.terms
  in two sample XML files (CD3, Nkp46, Tryptase, Tumor, Tumor Islet, Tile); other files may hold more. Stain/staining
  method, organism evidence beyond ''NSCLC'' (human), and the source paper are not given on the Zenodo page, in
  the zip, or via Europe PMC title search, so labels_stains is empty. Annotation coverage and source (manual vs
  automatic) are not stated anywhere, so both are unknown. No train/test split provided. enricher: 10 of 700 XMLs
  read: 747 points (CD3 691, Tryptase 44, Nkp46 11, ...) and 48 polygons (Tile, Tumor, Tumor Islet, Stroma, Necrotic,
  White, Ash); pixelSizeX 0.48619 in all 10.'
