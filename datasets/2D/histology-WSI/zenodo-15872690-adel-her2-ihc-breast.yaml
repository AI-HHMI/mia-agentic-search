notes: 'peek_archive of her2_dataset.zip (version 0.2, 497.1 MB): 418 PNG images in her2_dataset/images, labels.csv
  (columns fname,HER2score), plus a .tsv and a .txt. The Zenodo page says higher-resolution .tar.gz archives (e.g.
  HER2_001_009.tar.gz) live on Hugging Face (aidosSarsembayev/adel_dataset_1), not listed on Zenodo and not checked.
  Scores come from pathology reports (2018 ASCO/CAP; ISH for 2+ cases) rather than image-level re-annotation. Authors
  are not listed on the Zenodo page text read and were not recorded. Pixel size not stated on Zenodo page or paper
  text read; images are JPEG-tiled sub-images converted to PNG so a pixel size would depend on the scan.'
