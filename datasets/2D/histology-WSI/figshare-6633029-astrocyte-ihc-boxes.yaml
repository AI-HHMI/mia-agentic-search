notes: 'Figshare collection of 19 articles, all CC0: ALDH1L1.zip (1.77 GB) and GFAP.zip (2.99 GB) of PNG
  patches plus COCO JSON (peek_archive: 3,705 and 5,025 PNG, 17 and 13 JSON), mmdetection.zip (1.3 GB,
  baseline models), and 16 whole-slide scans in Aperio .tif or MIRAX .mrxs (one Aperio file is 4.0 GB;
  not counted in size_bytes, which is the two patch zips). Paper (open access, read): scanners Aperio
  ScanScope AT Turbo 20x (0.5019 um/px) and Pannoramic Flash Desk DX 40x (0.3557 um/px), so voxel_size_nm
  is null. Splits are patient-level stratified. The baseline code URL points to the mmdetection framework
  the authors used, not a repo of theirs. Download URL left null because the data are many separate figshare
  files; bounding boxes are not instance masks. enricher: patches are RGBA PNG with constant alpha 255
  (channels 3 = RGB).'
