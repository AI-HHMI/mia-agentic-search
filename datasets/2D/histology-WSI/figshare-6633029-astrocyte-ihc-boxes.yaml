title: Annotated dataset for training deep learning models to detect astrocytes in human brain tissue
short_name: Astrocyte boxes in human brain IHC patches
description: 8,730 PNG patches (500 x 500 px) cut from whole-slide scans of post-mortem human brain sections immunostained for GFAP and ALDH1L1, with 103,684 COCO-format bounding boxes around glial cells. Patient-level train and test sets, test sets annotated by junior, mid-level and expert annotators plus consensus; baseline mmdetection models and the raw whole-slide scans are in the same collection.
