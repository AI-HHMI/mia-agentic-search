notes: 'The download page lists 17 archives: primary tumor SVS slides (709 files, about 2.36 TB), lymph
  node slides (369 files, 765 GB), TMAs (368 SVS, 1.2 TB), 709 GeoJSON tumor annotations, 12,236 TMA core
  PNGs, UNI encodings and clinical JSON/CSV/TXT. n_items counts the 1,446 SVS slides; size_bytes sums
  the listed archive sizes. The download page says use is under CC BY (the paper only licenses the article).
  Annotations are sparse tumor-region polygons, no cell-level labels. Pixel size 0.1213 um is the primary/TMA
  scan; lymph nodes are 0.2634 or 0.1945 um. The paper counts 396 lymph node sections, the page lists
  369 files. A TCIA mirror is planned, not checked. enricher: size_bytes exact from listing all 17 archives
  (3.75 TB; the page sizes summed to 4.54).'
