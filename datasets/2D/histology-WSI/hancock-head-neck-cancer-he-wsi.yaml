id: hancock-head-neck-cancer-he-wsi
title: A multimodal dataset for precision oncology in head and neck cancer (HANCOCK)
short_name: HANCOCK head and neck cancer H&E WSIs (histology)
description: H&E whole-slide images of primary head and neck tumors (709 slides from 701 patients, 3DHistech P1000 at 0.1213 um/pixel), 396 lymph node
  sections and 368 immunohistochemistry tissue microarrays (CD3, CD8 and other markers), converted to Aperio SVS, from a Erlangen cohort of 763 patients. Primary
  tumor slides carry sparse pathologist-supervised tumor-region polygons as GeoJSON; the dataset also bundles clinical, blood, text and survival data and
  pre-extracted TMA core PNGs and UNI encodings.
