notes: 'IDR API: project 402 has two datasets, training (1,144 images) and test (1,155 images); the annotation CSV
  (2,299 lines including header) gives per-image diagnosis (e.g. chronic heart failure, ischemic cardiomyopathy)
  and RGB channels. Image files are PNG (names like 33381_0_fal_10_0.png). Paper Methods: WSIs from 209 patients scanned
  at 20x on an Aperio ScanScope, downsampled to 5x, sub-images of about 250x250 pixels; 104 patients for training, 105
  held-out. Labels are patient-level diagnosis (classification), not pixel masks. Per-image pixel size is not stated
  in the IDR record or the paper, and total size is not stated, so both are null; the exact image dimensions were
  not read from the files. Download is through IDR (FTP/Aspera/web); the exact FTP path was not checked.'
