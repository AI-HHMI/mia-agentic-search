notes: 'IDR API: project 402 has two datasets, training (1,144 images) and test (1,155 images); the annotation CSV (2,299
  lines including header) gives per-image diagnosis (e.g. chronic heart failure, ischemic cardiomyopathy) and RGB channels.
  Image files are PNG (names like 33381_0_fal_10_0.png). Paper Methods: WSIs from 209 patients scanned at 20x on an Aperio
  ScanScope, downsampled to 5x, sub-images of about 250x250 pixels; 104 patients for training, 105 held-out. Labels are patient-level
  diagnosis (classification), not pixel masks. enricher: pixel size 2 um from IDR image metadata (PhysicalSizeX/Y 2.0 um for
  all 2,299 images; matches 20x scans downsampled to 5x), was null. enricher: all images 250x250 RGB uint8 (IDR API); direct
  PNGs on the EBI IDR FTP mirror (held-out_validation/ = test, training/fold_1 + training/test_fold_1 = training); size from
  its HTTP index (study file states 314 Mb).'
