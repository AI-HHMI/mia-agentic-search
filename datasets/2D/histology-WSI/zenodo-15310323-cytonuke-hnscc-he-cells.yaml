notes: 'Zip listing (peek_archive): 84 files = coco.json (35.2 MB) plus 83 PNG patches
  named after CPTAC slide tiles (<slide>.svsx<N>y<M>.png). Annotation counts (6,683;
  3,991 nuclei, 2,607 whole cells) are from the Zenodo description; not re-counted
  in coco.json. Pixel size, patch dimensions, annotator count and train/val/test split
  are not stated on the Zenodo record, README or the arXiv abstract; the journal paper
  (10.1016/j.cmpb.2024.108215) is not open access in Europe PMC and the arXiv PDF
  could not be fetched, so Methods were not read. Source images are from CPTAC-HNSCC
  on TCIA (10.7937/K9/TCIA.2018.UW45NH81).'
