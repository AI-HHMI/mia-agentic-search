notes: 'Zip: coco.json (35.2 MB) + 83 PNG patches named <CPTAC slide>.svsx<N>y<M>.png, 256x256 RGB. 6,683 annotations (3,991
  nuclei, 2,607 whole cells) per README. arXiv full text (2401.15638): annotations by a senior pathologist in QuPath, exported
  as COCO JSON; patches 256x256 px at 0.5 um/px; images Macenko-normalized for training and split 70/15/15 by patient, but
  no split file ships with the data. Source images from CPTAC-HNSCC on TCIA (10.7937/K9/TCIA.2018.UW45NH81). enricher: voxel
  size 500 nm from the arXiv Methods (was null), size from the Zenodo listing (README + LICENSE + zip), download_url -> record
  page (zip plus separate README/LICENSE).'
