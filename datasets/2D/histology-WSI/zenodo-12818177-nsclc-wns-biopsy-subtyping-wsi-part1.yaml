notes: 'Zenodo lists no license; the description states "The dataset can be used for academic research purposes only", so
  spdx is custom (research use only). Files read from the Zenodo API listing: 71 slide files plus OWN_WNS_BX_v1_anon_PARTS_1_AND_2.csv
  (opened: GT/file-name columns). Part 2 of the same cohort is Zenodo 12818228; the single GT CSV in each deposit lists both
  parts (141 slides: 89 luad, 52 lusc). Labels are slide-level (no pixel annotations); the paper (PMC11524894, Methods and
  key resources table) lists this deposit among the released test datasets and gives subtype ground truth from pathology reports/immunohistochemistry.
  The paper states the WNS and UKK biopsy cohorts were digitized with different scanners but not per file, and gives no pixel
  size for this release, so voxel size is null. The companion annotated tile dataset (UKK L1 SEGM, Zenodo 12818382) is already
  in the catalog and is a different dataset. Sibling deposit: Zenodo 12818228.'
