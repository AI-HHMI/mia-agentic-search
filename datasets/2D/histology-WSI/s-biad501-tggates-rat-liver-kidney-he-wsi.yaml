notes: '8,342 .svs images (4,475 kidney, 3,867 liver), one JSON each, all rat, 152 compounds. Labels are image-level
  findings and grades curated by the contract labs and peer-reviewed by pathologists (paper); no regions labelled.
  License: BioStudies says CC BY-SA 2.1 JP and links the LSDB terms page (script-rendered, unreadable), so spdx is
  custom; the paper carries a CC BY 4.0 notice. Total size and pixel size not stated on the study page, file listing
  or paper. Differs from zenodo-7541930, which holds polygon annotations on 230 liver slides without the images.'
