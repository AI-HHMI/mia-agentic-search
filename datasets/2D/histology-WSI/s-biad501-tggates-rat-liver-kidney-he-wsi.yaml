description: 8,342 H&E whole-slide images (Aperio .svs) of liver and kidney sections from rats dosed with
  152 compounds in the Open TG-GATEs toxicogenomics project. Each image has a JSON file linking it to
  ChEMBL, with the pathologist-curated histopathology finding, topography and severity grade, plus compound,
  dose, route, sacrifice time and animal metadata.
