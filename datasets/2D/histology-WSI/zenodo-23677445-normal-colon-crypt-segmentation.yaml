notes: 'No publication is listed on the Zenodo record and none was found; pixel size is not stated (record lists
  the slide scanner/microscope specs: Olympus VS200, Nikon A1R). Modality set to histology-WSI because images are
  ROIs extracted from whole-slide scans of stained slides; staining is IHC/chromogenic per the record, not stated
  as H&E for every image. Counts from the zip listing: training/raw_patches_wsi has 293 images (train 221, test
  48, valid 24) with 1,044 crypt masks and 1,445 gland masks; colour-normalised copy has 291 images; Inference/
  holds 648 unlabelled JPG photographs (645 normalised PNGs). Only normal crypts are annotated (annotated with GIMP
  per the record), hence coverage partial. n_items counts the annotated raw images only. enricher: shapes/encoding
  from probed and sampled files; no organism split per file in training/.'
