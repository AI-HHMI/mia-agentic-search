title: Normal Colon Crypt Dataset for U-shaped Crypt Segmentation
short_name: Normal colon crypt instance segmentation (IHC/H&E)
description: 293 annotated regions of interest cropped from slide scans of human and mouse colon sections stained
  for IHC targets (CDX2, CAI, MUC2, KRT20, SLC26A3), with one PNG mask per normal U-shaped crypt (1,044) and per
  gland (1,445), in original and colour-normalised versions and fixed train/valid/test folders. A further 648 unlabelled
  field photographs are included for inference.
