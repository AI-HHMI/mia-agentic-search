description: 21 H&E-stained whole-slide images of canine mammary carcinoma (Aperio SVS, 0.25 um/px) completely
  annotated for mitotic figures (13,937 in the collection description) and hard-negative look-alikes (36,346)
  by expert pathologists, with three annotation variants (MEL, ODAEL, CODAEL) as MS COCO JSON and SlideRunner
  SQLite, plus tumor-region polygons and a region of highest mitotic count.
