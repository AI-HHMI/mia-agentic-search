title: DERMA-PASeg - unstained, PAS-stained and virtually stained skin whole slide images with five-layer segmentation masks
short_name: Skin layer segmentation, PAS slides (brightfield)
description: 32 unstained skin tissue whole slide images imaged on a brightfield microscope, paired with the chemically PAS-stained
  slides (31 stained images listed) and with virtually stained versions generated by a dual contrastive GAN. One PNG mask per slide
  annotates five classes - dermis, epidermis, keratin, dermal-epidermal junction and background - for layer extraction.
