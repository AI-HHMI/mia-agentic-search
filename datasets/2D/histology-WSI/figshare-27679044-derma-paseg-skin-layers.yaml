notes: 'Read the Figshare API record and its flat file list of 127 files (64 plain JPG, 31 -PAS JPG, 32 PNG masks, 901 MB). Names show
  unstained and PAS-stained images and blended_final/blended_test JPGs (presumably the virtually stained images, not stated per
  file). No paper is cited on the record and a title search found none, so microscope, magnification, pixel size, organism (skin;
  species not stated) and who drew the masks are unknown. The description says 32 unstained slides but only 31 PAS files are listed.
  Image sizes were not opened. Coverage is dense per the five-class description. enricher: masks are RGB colour-coded PNGs, 5 colours
  in a sample (colour-to-class map not documented); modality brightfield added (description); images same size as their mask.'
