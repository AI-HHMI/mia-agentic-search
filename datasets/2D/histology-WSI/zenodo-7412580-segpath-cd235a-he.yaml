notes: 'Zenodo record (README text, file list) gives file naming, 984x984 px patches, binary masks and the license text (CC BY-NC-SA 4.0; the Zenodo license field says other-nc, commercial use needs contacting the authors). Patch count and splits come from CD235a_fileinfo.csv: 51,818 rows = train 43,190 / validation 4,448 / test 4,180. The 48.6 GB tar.gz was not opened (peek_archive supports only zip), so annotations_verified is false. Pixel size 0.220818 um/px (Hamamatsu Nanozoomer S60, 40x) is from the paper Methods; RBC masks are the CD235a-positive area that is also red in the H&E image (R>100, G<130, R>B) (paper Methods). Sibling of the catalogued SegPath records for panCK, ERG, MIST1 and MNDA, but a different cell type and different images; the other SegPath records (anti-HepPar1 etc.) were not catalogued here.'
