  notes: 'Zip central directories read by range (zip64, members stored uncompressed): train 3,996 and
    test 2,576 PNGs, matching the README counts; sizes from the Dataverse API. Sampled one member (3.3
    MB): RGBA 768x768 uint8, min 13 max 255, channels differ; PNG pHYs 100395.25 dpi = 253 nm/px (header
    calibration; plausible for a 40x Aperio scan, the README states none). Value range from one patch.
    normalization none: plain RGB export of the scan (inferred). Direct links api/access/datafile/<id>
