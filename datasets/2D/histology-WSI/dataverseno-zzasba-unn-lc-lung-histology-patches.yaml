notes: 'Counts come from the two datasheet CSVs (train 3,996 rows: stroma_tls 1,347, necrosis 1,333, normal_lung 1,008, tumor 308; test 2,576 rows: normal_lung 954, tumor 761, stroma_tls 566, necrosis 295) and the README; size is the sum of the two zip files in the Dataverse listing. Patch file extension .png is taken from the datasheet image names; the zips were not listed (the Dataverse access link does not serve ranged reads, so peek_archive failed). The README gives 768 x 768 pixel patches from 194 slides at 40x but no pixel size in micrometres, so voxel size is null. The paper describes the UNN-LC patch set as the training data of a patch classifier and notes no cell-level ground truth exists. Download URL points at train_subset.zip only (datafile 209120); test_subset.zip is datafile 209122.'
