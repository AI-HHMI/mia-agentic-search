title: UNN-LC High-Resolution Histopathological Lung Tissue Patch Dataset
short_name: UNN-LC lung H&E patches (4 tissue classes)
description: 6,572 patches of 768 x 768 pixels from 194 Aperio 40x H&E whole-slide images of lung cancer
  from the University Hospital of North Norway, labelled by an oncologist and a pathologist as necrosis,
  tumor, stroma_tls (reactive stroma with lymphocyte aggregates) or normal_lung, with predefined training
  (3,996) and testing (2,576) sets and CSV datasheets.
