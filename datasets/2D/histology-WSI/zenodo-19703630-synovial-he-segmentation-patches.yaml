id: zenodo-19703630-synovial-he-segmentation-patches
title: Training patch images and masks for semantic segmentation of human synovial H&E whole slide images
short_name: Human synovial H&E tissue patches (histology)
description: 512x512 pixel patch images (JPEG) cut from H&E-stained whole-slide images of human synovial tissue, each paired
  with a pixel-level segmentation mask (PNG) of histological structures, released as training data for semantic segmentation
  models. The Labels archive holds 2,690 masks from 77 slides; patch file names encode the slide, the pyramid level and the
  crop position.
