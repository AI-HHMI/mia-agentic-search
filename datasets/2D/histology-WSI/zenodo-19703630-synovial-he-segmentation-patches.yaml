notes: 'Zenodo API record read in full; the Images.tar.gz and Labels.tar.gz archives were listed by streaming their headers
  (JPEG patches in Images/, PNG masks in Labels/, 2,690 masks from 77 slides). The record names no associated paper (searched
  the web for the authors and topic without finding one), no class definitions, no pixel size or magnification, no annotation
  procedure and no train/validation split, so annotations.source is unknown and the semantic classes of the masks are undocumented.
  The same authors deposited model-predicted whole-slide segmentation labels in separate Zenodo records (19479198 to 19479682);
  those are not part of this record. enricher: label masks are uint8 semantic class IDs (0-12 seen), class names undocumented.'
