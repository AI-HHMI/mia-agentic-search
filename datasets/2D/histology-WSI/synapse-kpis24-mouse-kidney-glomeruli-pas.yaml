notes: >-
  The Synapse page is JavaScript-rendered and could not be read (no file listing, licence or terms seen); the challenge site (sites.google.com/view/kpis2024) points to the Synapse portal and to updated data v1.1 (syn54077668).
  Access presumably needs a Synapse account (registration) and terms may apply; no licence found. Counts from the paper (Table 1): training 25 WSIs (1786+648+724+1760 patches), validation 8 WSIs (861+274+299+209 patches),
  testing 12 WSIs (test labels were withheld during the challenge; the site says all splits were released); n_items 33 counts the labelled training and validation WSIs. The abstract says over 60 WSIs and 10,000 glomeruli,
  a companion paper says 50 WSIs, so totals are inconsistent. Resolution 0.11 um/px (40x optical, 80x digital) except NEP25 at 0.24-0.25 um/px (20x optical), hence voxel size is left null.
  Download size not stated. The record is not an open-licence record: usage terms must be checked on Synapse.
