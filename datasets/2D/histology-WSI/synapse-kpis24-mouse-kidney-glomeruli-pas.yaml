  MICCAI 2024 KPIs challenge data: PAS-stained whole slide images (pyramidal TIFF) and 2048 x 2048 PNG patches of kidneys from normal mice and three chronic kidney disease models
  (5/6 nephrectomy, diabetic nephropathy eNOS-/- db/db, NEP25), with glomeruli annotated by three pathologists in QuPath for patch-level and WSI-level segmentation and detection.
