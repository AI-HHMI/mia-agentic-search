short_name: LUNG-MITO mitotic subphases (H&E)
description: 1024x1024 H&E tiles of lung adenocarcinoma with mitotic figures segmented and labelled by mitotic subphase (prophase to telophase), atypical mitosis or hard-negative non-mitotic. Released with COCO polygon masks and boxes; the Zenodo record also holds subphase annotations for the MIDOG++ images (images themselves on GitHub).
