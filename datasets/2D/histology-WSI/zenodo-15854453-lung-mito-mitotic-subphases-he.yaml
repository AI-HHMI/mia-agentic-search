notes: 'Zenodo v1 file list: lung_images.zip (6.0 GB), Lung_mito.json (32.2 MB; 5,251 annotations on 2,916
  images), MIDOGpp_subtyping.json (104.5 MB; 26,283 annotations on 503 images). The Zenodo page notes
  a newer version exists; the Scientific Data paper describes 3,526 LUNG-MITO PNGs and 5,423 annotations,
  so counts here follow v1. Pixel size 0.24 um/px per the paper (the preprint also mentions 0.12 um/px
  for 11 slides). lung_images.zip lists 2,916 PNGs (checked with peek_archive). The stMIDOG++ images are
  not in this record (MIDOG++ GitHub, MIT). LUNG-MITO is intended as an evaluation set; the paper trains
  on stMIDOG++ 70/10/20 train/val/test, which is not a split shipped in this record. enricher: download_url
  = lung_images.zip; newer Zenodo version 18661323 ships Lung_mito_extended.zip (7.6 GB) instead.'
