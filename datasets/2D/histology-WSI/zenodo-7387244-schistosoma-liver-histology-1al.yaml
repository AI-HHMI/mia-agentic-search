notes: 'Zip is 35.9 GB compressed with 33 members (peek_archive): 21 .czi slides (11
  H&E, 10 trichrome), 11 .annotations files and README.txt. Annotation files not opened;
  content inferred from the Zenodo description and paper ("annotated and quantified
  the area of individual granulomas, 5-17/liver"), so these are area outlines rather
  than masks. Scan resolution 0.22 um/pixel from the paper Methods. Differs from the
  already catalogued siblings (zenodo 7311985, 7314583, 7319849, 7504268, 7504280,
  7504288, 7504292) only by cage/cross (low shedder, cross A, cage 1): same study
  and structure, different mice and slides. Pairing of annotation to slide: 4_2 has
  an .annotations file but the 4_2 slide is trichrome and 4_3 H&E has none (from file
  names).'
