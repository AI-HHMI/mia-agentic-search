  notes: 'Exact Zenodo listing with zip members expanded (2391 members). Probed patient1_wsi1 WSI (BigTIFF, 12 pyramid
    pages, JPEG RGB, 128px tiles) and its mask (BigTIFF, 9 pages, LZW uint8, 1024px tiles) plus one evaluation ROI
    PNG (2048x2048x3 uint8). Shapes vary per slide. No pixel sampling: a full-resolution mask page decodes to ~20
    GB, so values were not measured; class IDs come from label_map.json. data_overview.csv: 587 development rows
    (rumc 237, tcga 164, nki 113, sch 55, jb 18) with 5 validation folds, 54 evaluation rows (biopticka, scdc, uwmedicine
