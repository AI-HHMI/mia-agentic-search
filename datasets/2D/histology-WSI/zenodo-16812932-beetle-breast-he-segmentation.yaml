description: Multicentric H&E whole-slide images of breast biopsies and resections (587 slides in the development
  set from three clinical centers plus two public sources, seven scanners; external evaluation set of 54 slides
  with 170 densely annotated ROIs) with four-class semantic segmentation annotations (invasive epithelium, non-invasive
  epithelium, necrosis, other).
