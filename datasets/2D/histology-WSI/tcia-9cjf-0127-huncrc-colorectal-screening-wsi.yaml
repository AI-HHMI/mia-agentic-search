notes: 'TCIA lists 421.4 GB: 392 GB whole slides (MRXS and DAT, not in the format list, so formats names
  only the JPEG patches), a 29.4 GB annotated patch set (JPG and CSV) and a clinical CSV; version 3 dated
  2026-05-27. TCIA downloads go through IBM Aspera. Paper: 10 local classes, annotated by a pathology
  resident and checked by a board-certified pathologist. The patch count differs by source (506,586 on
  TCIA, zoom levels 1-2 in the paper). Date published is the TCIA version 1 date. enricher: the paper''s
  Figshare collection (c.5927795, CC0, 431 items) has the masks, QuPath data, slide-level and clinical
  CSVs, per-slide patch zips and 13 updated MRXS slides as direct files; 885 masks listed (200 slides),
  annotations_verified now true.'
