notes: 'TCIA lists 421.4 GB: 392 GB whole slides (MRXS and DAT, listed as other), a 29.4 GB annotated patch set (JPG and CSV) and a clinical CSV; version 3 dated 2026-05-27. Downloads go through IBM Aspera. Paper: 10 local classes (normal tissue is not drawn; the class table includes inflammation, artifact, tumor necrosis, resection edge and suspicious for invasion), annotated by a pathology resident and checked by a board-certified pathologist; unprocessed QuPath annotations and exported pixel masks are said to be in TCIA; the TCIA page does not describe the mask files, so annotation files were not seen in a listing. The patch count differs by source (506,586 on TCIA, zoom levels 0-2 in the paper). Date published is the TCIA version 1 date.'
