notes: 'Kaggle API listing shows CoNSeP/Train (27 images, 27 labels, 27 overlays) and CoNSeP/Test (14 images, 14 labels,
  14 overlays) plus one text file, 806 MB. The paper (HoVer-Net, arXiv 1812.06499) describes 41 tiles of 1,000 x 1,000
  pixels at 40x, 24,319 nuclei and the seven nuclear types; it points to the Warwick TIA data page, which redirects to a
  sign-in page and could not be read. The mirror has no description, and its page lists "Apache 2.0", which looks like the
  uploader''s own choice rather than the original authors'' terms, so the licence is recorded as unknown. Pixel size is not
  stated in the pages read. date_published is the mirror''s last-update date; the paper is from 2018-2019. Overlaps conceptually
  with the CoNSeP tiles reused in Lizard (a separate record), but this is the standalone CoNSeP set.'
