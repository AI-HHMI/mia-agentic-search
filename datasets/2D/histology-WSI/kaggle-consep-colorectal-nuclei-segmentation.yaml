notes: 'Kaggle listing: CoNSeP/Train (27 images, labels, overlays), CoNSeP/Test (14 each), README.txt; 806 MB. Paper
  (HoVer-Net, arXiv 1812.06499): 41 tiles of 1000x1000 px at 40x from 16 CRA WSIs (Omnyx VL120), 24,319 nuclei,
  7 types. Licence unknown: the mirror''s ''Apache 2.0'' looks like the uploader''s choice, the README states only
  a citation requirement, the hover_net repo''s MIT licence covers the code, and the Warwick data page needs sign-in.
  Pixel size not stated (README, paper, PNG headers). date_published is the mirror''s update date. Overlaps the
  CoNSeP tiles reused in Lizard. enricher: splits_provided true (Train/ and Test/ folders); download_url = anonymous
  Kaggle archive API URL (was landing page), method http.'
