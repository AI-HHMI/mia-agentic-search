title: CoNSeP colorectal nuclear segmentation and phenotypes (Kaggle mirror)
short_name: CoNSeP colorectal nuclei H&E (instance + type)
description: 41 H&E-stained colorectal adenocarcinoma image tiles (1,000 x 1,000 px at 40x, 16 whole-slide images from
  University Hospitals Coventry and Warwickshire) with 24,319 exhaustively annotated nuclei carrying instance and class
  labels (normal epithelial, malignant/dysplastic epithelial, fibroblast, muscle, inflammatory, endothelial, miscellaneous),
  introduced with HoVer-Net. The mirror is organised as 27 train and 14 test tiles with image, label and overlay files.
