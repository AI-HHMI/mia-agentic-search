notes: 'BioStudies record (license CC BY 4.0, Philips Ultra Fast Scanner, 0.25 um/pixel) and the EMBL-EBI
  file index read; Files/ lists "Cervical Images/" with per slide .isyntax, .geojson, _mask.png and .isyntax_object_Data.csv
  (the .tsv index lists 2,540 isyntax, 2,539 geojson, 2,538 png and 2,540 csv entries; the paper states
  2,539 of each, used here). Full text of the GigaScience data note (Europe PMC) gives 2,539 slides, 731
  GB in iSyntax, annotation by 4 pathologists plus a trained biomedical scientist, four diagnostic categories
  with subcategories, and a train/validation/test split described in its tables; the split is not stored
  as a file that was checked, so splits_provided is false. iSyntax is not in the schema format list, hence
  formats other. enricher: size_bytes 741.9 GB from the exact Files index (was the paper figure, 731 GB);
  download_url is the Files folder (no archive). 595 of 2,539 GeoJSONs are empty, 2,348 are named "<id>
  .geojson" (space).'
