description: 2,539 H&E whole-slide images of cervical biopsies (one slide per patient, Philips Ultra Fast
  Scanner, 0.25 um/pixel, iSyntax) from Glasgow hospitals, each with pathologist region annotations (GeoJSON),
  a binary mask PNG, a per-slide table of nuclear morphology features and a diagnostic category (malignant,
  high grade, low grade, normal/inflammation) with subcategories.
