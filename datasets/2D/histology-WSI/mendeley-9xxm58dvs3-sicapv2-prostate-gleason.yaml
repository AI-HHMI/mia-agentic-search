  at 10X (50% overlap, at least 20% tissue) with a mask for each patch encoding non-cancerous and Gleason grades 3, 4 and
  5, a patient-based cross-validation partition with patch-level Gleason labels and cribriform pattern ground truth, and a
  slide-level Gleason score table.
