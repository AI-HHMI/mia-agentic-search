notes: 'The single SICAPv2.zip (2.16 GB) was listed with peek_archive: 18,783 JPG patches, 18,783 PNG masks,
  21 XLSX partition tables, 1 .db file and a readme (contents: patches 512 px at 10X, 50% overlap, over 20%
  tissue; masks 0 non-cancerous, 1-3 = Gleason grade 3-5; label from majority vote of the masks).
  n_items is the patch count; the underlying data are 182 whole slide images (paper abstract), which are
  not distributed. The paper is not open access (Europe PMC gives only the abstract), so the scanner,
  pixel size, number of annotating pathologists, and the patient count were not read; the 155 biopsies /
  95 patients figure came only from a secondary web summary and is not stated here. The Mendeley file API
  redirects to an S3 URL; the public-files URL above is the stable download link. Weighted the record
  at 0.75 because annotation procedure and pixel size are unconfirmed.'
