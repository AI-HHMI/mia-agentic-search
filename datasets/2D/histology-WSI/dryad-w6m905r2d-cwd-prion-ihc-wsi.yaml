notes: 'Dryad lists 30 image zips (images01-30.zip, 1.5-8.8 GB each; slide001-slide143.svs), qupath.zip (QuPath project
  with annotations, 13 MB) and README.md; total 172.04 GB. License from the Dryad API (CC0-1.0). Annotations (3,296:
  DMNV 224+/438-, follicles 1,295+/1,339-) are sparse regions on selected structures, not full-slide labels. Paper is
  not open access (only abstract read; it describes a 50-slide blinded test set, which is not in this deposit). Zip members
  were not listed (Dryad file URLs need a download token), so annotations_verified is false. Species counts: white-tailed
  deer 68, sheep 54, elk 14, goat 4, moose 3; 54 slides detected, 89 not detected. Pixel size from the Dryad methods
  (Leica GT450, 400x).'
