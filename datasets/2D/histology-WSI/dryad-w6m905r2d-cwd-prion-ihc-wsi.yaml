title: Deep learning chronic wasting disease (CWD) immunohistochemistry (IHC) image dataset
short_name: Prion IHC whole-slide images, cervid and sheep
description: 143 whole-slide images of prion (PrP, F99) immunohistochemistry on obex (dorsal motor nucleus of the vagus)
  and retropharyngeal lymph node from white-tailed deer, sheep, elk, goat and moose, scanned at 400x (0.264 um/pixel).
  A veterinary pathologist annotated 3,296 regions in QuPath (dorsal motor nucleus positive/negative, lymphoid follicle
  positive/negative), to train deep networks for tissue and anatomical-structure detection.
