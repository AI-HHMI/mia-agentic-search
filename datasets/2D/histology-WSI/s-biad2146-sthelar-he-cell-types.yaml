schema_version: '1.1'
id: s-biad2146-sthelar-he-cell-types
title: STHELAR, a multi-tissue dataset linking spatial transcriptomics and histology for cell type annotation
short_name: STHELAR H&E nuclei and cell types (histology)
description: 31 human FFPE H&E whole-slide images (16 tissue types, 22 cancer and 9 non-cancer patients) co-registered with Xenium
  spatial transcriptomics, tiled into 256x256 px patches (40x and 20x) with nucleus instance masks whose cell-type labels
  (ten categories) are derived from spatial transcriptomics rather than manual drawing. Over 11 million cells.
