notes: 'Labels are NOT manual: nuclei come from Xenium DAPI segmentation and cell types from Tangram plus
  slide-wise clustering of spatial transcriptomics, with only a qualitative pathologist check (paper Methods),
  so source is "automatic" and noisy. 40x folder: images.zip 56.2 GB, 644,305 256x256 RGB PNG patches
  (64 px overlap, cells repeat); masks_cell_ids_nuclei.zip 644,305 NPZ; labels.zip 587,555 NPZ (paper:
  587,555 patches at 40x, 154,814 at 20x). A 20x copy is in data_20x; patch-only subsets are on Hugging
  Face per the paper. Masks, SpatialData zarr and parquet tables are not in the formats list (no enum).
  Pixel size, splits and total size of the 492-file study were not found. enricher: size_bytes from the
  HTTP index of Files/ (494 files, rounded sizes, ~885 GB; was null).'
