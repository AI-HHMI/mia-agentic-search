id: zenodo-10016027-anorak-lung-adenocarcinoma-growth-patterns
title: Lung adenocarcinoma growth pattern annotations for H&E images
short_name: Lung adenocarcinoma growth patterns (H&E)
description: Training data of the ANORAK model. 731 H&E image tiles from TRACERx lung adenocarcinoma slides
  (49 whole-slide images from 49 patients) with pixel-level masks (MATLAB .mat) for six growth patterns
  (cribriform, micropapillary, solid, papillary, acinar, lepidic) plus an "others / non-tissue" class,
  sparsely annotated by three thoracic pathologists. Also includes raw data files for reproducing a paper
  figure.
