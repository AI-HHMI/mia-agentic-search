notes: 'License is Zenodo''s "Academic-Use Only Data License": the page says the data is for academic
  non-commercial use only; commercial users must email the TRACERx CTC. Files: trainset.zip (1.8 GB, 1,462
  members: trainset/image 731 PNG/JPG tiles, trainset/mask 731 .mat masks, listed with peek_archive),
  plus two TXT files for figure 5b (not training data). Annotation per paper: three pathologists sparsely
  annotated 49 WSIs, 3,662 patches of 768x768 px at 20x (~0.45 um/px) for six growth patterns; the 731
  released tiles are the training set, tile size and exact pixel size of the released tiles not stated
  on the Zenodo page and not checked. Voxel size left null for that reason. Split not provided (paper
  used fivefold cross-validation). Paper Methods and Data availability read via Europe PMC. enricher:
  size_bytes set to the complete Zenodo listing total 1,892,050,610 B (was the rounded uncompressed zip
  size); mask files seen in the listing.'
