notes: 'Two zips of WSIs (batch1.zip ~53 GB, batch2.zip ~71 GB per the HTTP index; batch1 lists 18,669 Zarr chunk files, 57
  GB uncompressed) plus annotations.zip with 23 .cz point-annotation files named like 1-102-Temporal_AT8.cz (XML with Zeiss
  scaling metadata, objective Plan-Apochromat 40x/0.95). The WSIs were converted from CZI to Zarr by the authors (paper Methods).
  Pixel size 0.11 um from the paper. Point annotations mark NFTs inside regions of interest (paper: three ROIs of 10,680 x
  21,236 px per WSI); pixel-level masks are not in the listing and are derived by the authors'' point-to-mask code (github
  keiserlab/tangle-tracer), so labels here are points only and coverage is limited to the ROIs. The dataset description says
  it includes all WSIs and annotations used in the study; the paper trains on 15 WSIs (45 ROIs) with 7 test WSIs and 10-fold
  cross-validation, and has a further 24-WSI hold-out batch, but no split files appear in the listing. Not verified: exact
  WSI count, total size, channel layout.'
