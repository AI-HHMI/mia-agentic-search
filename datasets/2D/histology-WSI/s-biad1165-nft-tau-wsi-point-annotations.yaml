notes: 'WSIs as Zarr in two zips (batch1 ~53 GB, batch2 ~71 GB per HTTP index) plus annotations.zip with 23 .cz point-annotation
  XML files (e.g. 1-102-Temporal_AT8.cz). Zarr converted from CZI by the authors; pixel size 0.11 um from the paper. Points
  mark NFTs inside ROIs (paper: three per WSI); pixel masks are not in the listing and come from the authors'' point-to-mask
  code (github keiserlab/tangle-tracer). Paper: 15 train WSIs, 7 test, plus a 24-WSI hold-out batch; no split files listed.
  Not verified: WSI count, total size, channels.'
