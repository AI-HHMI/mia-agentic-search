notes: 'Third-party mirror (MedOtter) of the public CoNIC 2022 training split; the challenge test set is held out. Patches
  are a re-tiled subset of Lizard (in the catalog as a Kaggle mirror): CRAG 2,304, DigestPath 1,799, GlaS 702, PanNuke 112,
  CoNSeP 64; deduplicate by source image before co-benchmarking. Files are 4 Parquet shards with embedded PNGs; Parquet is
  not in the format enum, hence other. Pixel size ~0.5 um from the card and the Lizard paper (20x, "~0.5 um/pixel"; approximate).
  enricher: organism Homo sapiens from the Lizard paper (image regions from patients; was empty). enricher: annotations.source
  proofread: Lizard paper, automatic/semi-automatic predictions refined with pathologist-in-the-loop (was unknown). enricher:
  license.url = dataset card; CoNIC preprint also states CC BY-NC-SA.'
