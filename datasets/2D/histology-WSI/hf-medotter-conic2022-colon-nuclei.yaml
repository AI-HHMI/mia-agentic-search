  notes: 'Hub API tree lists 6 files with exact sizes, 699,833,094 B = size_bytes (harvester had 699,825,302 B, the datasets-server
    download_size). Data are 4 Parquet shards with embedded PNG images; Parquet is not a schema format and is not read by
    TensorSwitch, so arrays use format other. pyarrow is not on the allowed list, so Parquet pages were not decoded: a 64
    KB range read of shard 0 found the first embedded PNG (256x256, 8-bit RGB). Values come from one row (row 0, consep_1-0000)
    as rendered by the HF datasets-server: image (JPEG rendition) uint8 RGB 17..255; inst_map (16-bit PNG) uint16 0..145,
    146 values. class_map is rendered as lossy JPEG by the viewer (9 distinct values incl. artefacts), so its value range
    was not recorded; class ids are from the card. Download: each shard is a direct Hub URL (passes --download-check, xet
    CDN redirect, range requests); no single archive, so download_url stays the dataset page. Voxel size: ~0.5 um/pixel (card;
    Lizard paper Sec. 3.1), lateral only, 2D data.'
