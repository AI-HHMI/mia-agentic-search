notes: 'Third-party mirror (MedOtter) of the public CoNIC 2022 training split; the challenge test set is held out. The
  patches are a re-tiled subset of the Lizard dataset (already in the catalog as a Kaggle mirror) cut into 256x256 tiles
  with instance/class maps plus challenge counts; sources: CRAG 2,304, DigestPath 1,799, GlaS 702, PanNuke 112, CoNSeP 64
  patches. Shares source images with Lizard, PanNuke and GlaS/CRAG, so deduplicate before co-benchmarking. Formats: the
  files are 4 Parquet shards (173.9 + 173.7 + 169.8 + 182.5 MB) with embedded images; Parquet is not in the format enum, hence
  other. Pixel size 0.5 um from the dataset card ("~0.5 um/pixel"); the paper (Med Image Anal 2024) is not open access, only
  the abstract was read, so the annotation procedure (Lizard annotation source) is not verified here. Organism not stated
  on the card (human colon in the CoNIC/Lizard papers, not verified in this run). Checked: dataset card, HF file listing, paper
  abstract.'
