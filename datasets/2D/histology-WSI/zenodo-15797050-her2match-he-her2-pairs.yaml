notes: Zenodo description gives 21,172 tile pairs (train 11,610, validation 3,582, test 5,980), 1024 x 1024 px, 40x, 0.25
  um/pixel, 3DHistech P1000, 17 H&E/HER2 slide pairs on the same tissue sample. peek_archive of tiles.zip confirms 42,344
  JPEGs (HE and IHC, train/val/test); HE_slides.zip and IHC_slides.zip hold 17 MRXS slides each (.mrxs, .ini and .dat files,
  ~18-25 GB uncompressed). formats lists jpeg (tiles); the MRXS whole-slide files are not a schema format. Size is all four
  files. The arXiv abstract (full text not available through Europe PMC/Crossref) does not restate scanner or pixel size,
  nor how the sections were registered; the match between the two stains is described as same-section, but its registration
  accuracy was not checked. Virtual staining (H&E to HER2) has no schema task, hence ml.tasks other; the per-slide HER scores
  support classification. Licence CC-BY-NC-SA-4.0 (non-commercial) per Zenodo.
