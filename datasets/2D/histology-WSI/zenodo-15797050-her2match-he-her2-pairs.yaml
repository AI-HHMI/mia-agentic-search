short_name: Breast H&E / HER2 IHC paired tiles (histology)
description: Paired H&E and HER2 immunohistochemistry tiles (21,172 pairs, 1024 x 1024 px JPEG, 40x, 0.25
  um/pixel) cut from 17 breast-tissue slides stained with H&E and then HER2 on the same section, scanned
  with a 3DHistech P1000. The full whole-slide scans (MRXS) and per-slide HER2 scores are included, with
  train/validation/test splits. Built for H&E-to-HER2 virtual staining.
