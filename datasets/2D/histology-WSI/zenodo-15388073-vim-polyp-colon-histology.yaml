description: 1,903 slide-scanner histopathology images of colon polyp and normal mucosa biopsies from 198 patients (383 polyps) at 2.5x to 40x, each labelled by two pathologists as nonneoplastic, premalignant (neoplastic), carcinoma or normal, with the subtype in the file name. The Zenodo record also holds colonoscopy videos and an IHC score table, which are not microscopy.
