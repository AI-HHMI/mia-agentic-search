notes: 'Zip listed with peek_archive: 1,903 TIFFs (28.2 GB uncompressed, 14.9 MB each at 2.5x) in per-magnification folders; the paper
  gives 393 / 397 / 400 / 399 / 316 images for 2.5x / 5x / 10x / 20x / 40x. Labels are image-level diagnoses from two pathologists,
  read from file names; no masks. Pixel size and scanner model not stated on the record or in the paper text read. The second zip (colonVideosWithLabels.zip,
  19.2 GB) is colonoscopy video, not microscopy, and ihc_data.xlsx holds IHC scores (p53, Ki-67, VEGF, PD-L1, CD34, BRAF); neither is
  part of this record. Size is the histology zip only. Images come from patients with informed consent; the paper states the data are
  anonymised. enricher: size confirmed by Zenodo listing (histology zip only).'
