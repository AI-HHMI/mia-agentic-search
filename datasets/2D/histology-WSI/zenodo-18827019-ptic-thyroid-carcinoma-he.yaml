notes: 'Image-level labels only (PTC-like vs non-PTC-like), no pixel masks; ROIs were pathologist-annotated on the WSIs and the patches cropped from them. Zip listing (peek_archive) shows 1006 .jpg in two folders (Non PTC-like, PTC-like). Pixel size is the approximate 0.26 um/pixel stated by the Zenodo record and paper. The Zenodo record is the latest version (corrected patient count, renamed files). The BMC Research Notes article is CC BY-NC-ND while the Zenodo data are CC BY-SA 4.0. No train/test split was seen in the listing or paper.'
