description: H&E prostate histology images with manual gland and tumour masks released with the RINGS gland segmentation method. The
  training archive holds 1,000 PNG images with 1,000 manual gland masks and 1,000 manual tumour masks, and the test archive holds 500
  images with 500 gland and 500 tumour masks. Image file names encode the patient and field (e.g. P2_F6_7_11_12.png).
