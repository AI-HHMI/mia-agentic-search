notes: 'Mendeley Data API record read and both zips listed with peek_archive (via the S3 redirect of the Mendeley file URLs): TRAIN.zip
  (3.5 GB) has TRAIN/IMAGES, TRAIN/MANUAL GLANDS and TRAIN/MANUAL TUMOR with 1,000 PNG each; TEST.zip (1.8 GB) has the same three
  folders with 500 PNG each. The TEST archive is https://data.mendeley.com/public-files/datasets/h8bdwrtnr5/files/5846b131-09fa-44c5-afa8-8fbc52adbd88/file_downloaded.
  n_items is the 1,500 images; the 3,000 masks are counted separately in the folders. The paper (Artif Intell Med 2021) is not
  open access and only its abstract was read, so scanner, magnification, pixel size, image dimensions, number of patients and
  whether the tumour masks are binary or multi-class are not stated in the sources read. The record page does not say how the
  patches were extracted from slides. The file-name prefixes P1 to P7 suggest seven patients, which is unconfirmed. size_bytes
  is the sum of the two zips.'
