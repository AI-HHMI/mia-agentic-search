notes: 'Mendeley Data API record read; TRAIN.zip (3.5 GB: TRAIN/IMAGES, TRAIN/MANUAL GLANDS, TRAIN/MANUAL TUMOR, 1,000 PNG each) and
  TEST.zip (1.8 GB, same folders, 500 PNG each). TEST archive: s3://prod-dcd-datasets-public-files-eu-west-1/fb055ca6-1fb9-4fdd-a944-8e0f596dd525.
  n_items is the 1,500 images. enricher: voxel size 934x934 nm from the paper manuscript (iris.polito.it, section 3.1: "conversion factor:
  0.934 um/pixel", Hamamatsu NanoZoomer S210), was null; the paper also says 150 patients (10 images each; TRAIN 100, TEST 50) and glands
  annotated manually by two authors; size_bytes is the exact sum of the two zips from the Mendeley API; download_url is the s3:// form
  of the TRAIN.zip object behind the Mendeley link.'
