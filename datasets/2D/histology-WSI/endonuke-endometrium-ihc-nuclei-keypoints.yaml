notes: 'Project page read and data.zip listed with peek_archive (2.19 GB, 7,428 files): 1,780 PNG in data/dataset/images, 1,780 PNG
  in images_context, 2,020 label .txt files (more than tiles because some tiles have several annotators), 1,785 metadata JSON
  and 7 master YAML files. The page says more than 1,600 tiles; tiles with IDs up to 1,600 were manually filtered and higher
  IDs only by a background script. The paper (Data, MDPI 2022, DOI from Europe PMC) could not be read: Europe PMC has no full
  text and the MDPI page returned 403, so authors and the exact release date are left empty and pixel size, magnification
  and scanner are not stated on the project page. The project page says the paper is under review. The dataset has no DOI
  of its own. Class 2 is other nuclei. No train/test split is defined; master YAML files define subsets (bulk, agreement,
  unique).'
