title: 'EndoNuke: Nuclei Detection Dataset for Estrogen and Progesterone Stained IHC Endometrium Scans'
short_name: Endometrium IHC nuclei keypoints (EndoNuke)
description: Image tiles of 100 um x 100 um cut from immunohistochemistry (estrogen and progesterone) stained endometrium scans, with
  every nucleus annotated as a keypoint (x, y, class) as stroma, epithelium or other. The archive holds 1,780 labelled tiles as PNG
  with matching larger context images (9 times larger, unannotated), per-tile JSON metadata and label files, including subsets annotated
  by several annotators for agreement analysis.
