notes: 'Hugging Face API record (one 2.8 GB parquet file, CC0-1.0) and dataset card read; the card quotes the PanopTILs
  page for 1024 x 1024 ROIs at 0.25 um per pixel. Paper full text is not open access, so only the abstract was read
  (bioRxiv/medRxiv preprint of MuTILs/PanopTILs). Tissue regions come from manual BCSS/NuCLS-derived annotation
  and nuclei labels are bootstrapped, then refined by the Hugging Face uploader, so source is mixed; the parquet
  cannot be listed as an image format, so formats is other (images and masks are PNG bytes inside). No authors are
  listed on the card. The card says the original fold splits are not viable after curation and suggests grouped
  splits by slide or hospital. Derived from, and different in content from, NuCLS (nucls-breast-cancer-nuclei-he)
  already in the catalog: it adds BCSS tissue regions and PanopTILs ROIs. enricher: size from the HF file listing;
  row 0 decoded via the datasets-server API.'
