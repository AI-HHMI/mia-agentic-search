title: PanopTILs refined (panoptils_refined)
short_name: PanopTILs refined breast H&E panoptic masks
description: 1,349 H&E image regions (1024 x 1024 px at 0.25 um per pixel) from TCGA invasive breast cancer cases,
  each with a nuclei instance mask, a nuclei class mask and a tissue region mask, refined from the PanopTILs dataset
  (itself built from BCSS and NuCLS). 360 cases with incomplete annotations were dropped and tissue masks were algorithmically
  post-processed. Images and masks are PNG bytes inside one Parquet file.
