  notes: 'HF listing: 4 files, 2,825,438,113 B (= size_bytes, confirmed); the parquet is 2,824,643,624 B, a direct
    link with range requests (usable). probe.py cannot read parquet; the schema (7 columns, 1349 rows in 2 row groups
    of 1073 and 276) is from the HF datasets-server /info API, and row 0 (2.8 MB JSON from /rows) was decoded with
    Pillow: image 1024x1024x3 uint8 0-255; inst 1024x1024 uint16 0-568 (569 values); type uint8 values {0,1,2,3,6};
    sem uint8 values {0,1,2,4}. Values are from one row. No per-file sample unit (one parquet), so sample is null.
    Pixel size 250 nm from the card (quoting PanopTILs: 0.25 MPP) and the MPP-0.2500 tag in the sample column. TensorSwitch
    has no parquet reader, so this record cannot be converted as is.'
