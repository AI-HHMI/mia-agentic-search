notes: 'Hosted as Google Drive downloads linked from the Grand Challenge Data page (training data; testing
  data with ground truth and ambiguous-region masks). Licence CC BY-NC-SA 4.0 as stated on the Data page.
  Counts from the Data page (about 31,000 training nuclei in .xml) and the paper abstract (over 46,000
  nuclei, 37 hospitals, 71 patients, four organs, four nucleus types); the paper is not open access (abstract
  only). MoNuSAC images also appear in the VitaminP compilation (separate PR) but this is the original
  challenge release. enricher: training zip read by range (545.6 MB, 46 patient folders, 209 crops as
  .svs + .tif + .xml); voxel_size_nm from the XML MicronsPerPixel 0.2468 (was null); channels 3 (RGB,
  was null). The testing zip was not inspected, so n_items stays null. Size pass: size_bytes 748,311,586
  B = training zip + testing zip as served by Google Drive (Drive pages state 520M and 193M).'
