  notes: 'Google Drive serves the training zip from drive.usercontent.google.com with range support, so
    its central directory and three members were read by range (tools.peek_archive.zip_entries with a
    range-GET size check, decoded with tifffile in memory). Archive: 627 members, 652,042,357 B uncompressed,
    46 TCGA patient folders. Sample crop TCGA-69-A59K-01Z-00-DX1_001: .svs has 4 pages, first page uint8
    RGB 182x177, Aperio JPEG 2000 (compression 33005, "J2K/KDU Q=99") cut from a 93248x75837 WSI, AppMag
    40, values 23..255; .tif is the same crop as RGBA, LZW, 23..255; .xml starts with <Annotations MicronsPerPixel="0.246800">
    and an Annotation with Attribute Name="Epithelial". Class names in classes are from the Data page.
    Testing data not inspected. Second pass 2026-10-07: drive.google.com/uc now returns a virus-scan page;
    its "Download anyway" form points to drive.usercontent.google.com/download?id=...&export=download&confirm=t,
    which serves the 545,564,883 B zip with range support (download_check: usable except host not allowlisted).
    Re-read crop _001 by range (.tif 182x177x4 uint8 23..255; .xml MicronsPerPixel 0.246800). Real globs
    set. download_url keeps the Drive page: training and testing are two separate zips. Size pass: size
    = the two zips on the Data page, training 545,564,883 B + testing 202,746,703 B (Content-Length of
    the Drive downloads; the Drive pages state 520M and 193M) = 748,311,586 B. Ground-truth/prediction
    images not counted.'
