notes: 'Hosted as Google Drive downloads linked from the Grand Challenge Data page (training data, testing data with
  ground truth and ambiguous-region masks), so sizes and file counts could not be listed and size_bytes/n_items are
  null. Counts and formats come from the Data page (training: .svs and .tif images plus about 31,000 nuclear boundary
  annotations in .xml) and the paper abstract (over 46,000 nuclei, 37 hospitals, 71 patients, four organs, four nucleus
  types); annotations were not seen in a file listing. Number of images, pixel size and scanner are not stated on the
  challenge pages and the paper is not open access (abstract only), so they are unknown. Licence CC BY-NC-SA 4.0 as
  stated on the Data page. MoNuSAC images also appear in the VitaminP compilation (separate PR) but this is the
  original challenge release.'
