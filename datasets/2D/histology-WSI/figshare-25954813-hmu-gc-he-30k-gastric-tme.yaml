notes: 'HMU-GC-HE-30K.zip (3.25 GB) listed with peek_archive: 31,096 PNG files in all_image/<class>/ folders; HMU-GC-Clinical.csv
  is a separate Figshare file. The paper describes eight annotated TME tissue classes and a three-pathologist labelling and
  review workflow; the Figshare description names nine labels (it adds background) and says candidate patches were first predicted
  with a model trained on a colorectal dataset before pathologists selected slides and labelled, so the source is stated as manual
  per the paper. Slides were scanned at 20x; pixel size is not stated. The paper text mentions .svs slides but the zip holds only
  patches. Train/test splits are not provided (the paper describes 20 % test and 10-fold cross-validation).'
