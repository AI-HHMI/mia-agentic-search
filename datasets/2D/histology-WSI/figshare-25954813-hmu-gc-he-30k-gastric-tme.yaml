title: 'HMU-GC-HE-30K: Gastric Cancer Histopathology Tissue Image Dataset (GCHTID)'
short_name: Gastric cancer H&E tissue-class patches
description: 31,096 non-overlapping 224 x 224 px H&E patches from 300 gastric cancer whole-slide images (Harbin Medical University
  Cancer Hospital, 20x Aperio AT2 scans), sorted into folders by tumour-microenvironment tissue class (adipose, debris, lymphocytes,
  mucus, smooth muscle, normal mucosa, stroma, tumour and background) and annotated by pathologists. Released with a clinical
  data spreadsheet and validated with ViT and EfficientNet classifiers.
