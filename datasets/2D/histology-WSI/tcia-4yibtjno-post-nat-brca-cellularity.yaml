notes: 'TCIA states CC BY 3.0 for the slides and the clinical spreadsheet. Downloads use IBM Aspera. 43.2
  GB of slides plus a 25.9 KB xlsx; WSI_train and WSI_test folders hold the Sedeen XML annotations (annotation
  files not seen in a listing). Cellularity colours: pink 0%, blue 0-30%, yellow 31-70%, green 70-100%.
  The related 2017 Cytometry A paper (Peikari et al.) is not open access, only its abstract was read.
  enricher: TCIA page lists 54 subjects and 96 images (description said 64 patients, corrected); slides
  are "uncompressed .svs"; channels 3 (RGB H&E SVS). Akbar et al. 2019 (Sci Rep, PMC6773948, cited on
  the TCIA page) says the SBHSC post-NAT slides were scanned at 20X (0.5 um/pixel), but it describes 53
  included patients, not this collection by name, so voxel_size_nm is left null.'
