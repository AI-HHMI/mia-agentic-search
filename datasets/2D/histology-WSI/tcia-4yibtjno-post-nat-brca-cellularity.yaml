notes: 'TCIA states CC BY 3.0 for the slides and the clinical spreadsheet. Downloads use IBM Aspera. 43.2 GB of slides plus a 25.9 KB xlsx; WSI_train and WSI_test folders hold the Sedeen XML annotations (annotation files not seen in a listing). Cellularity colours: pink 0%, blue 0-30%, yellow 31-70%, green 70-100%. The related 2017 Cytometry A paper (Peikari et al.) is not open access, only its abstract was read. Pixel size and publication date not stated on the page.'
