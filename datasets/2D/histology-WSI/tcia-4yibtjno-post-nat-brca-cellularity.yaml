title: Assessment of Residual Breast Cancer Cellularity after Neoadjuvant Chemotherapy using Digital Pathology
  (Post-NAT-BRCA)
short_name: Post-NAT breast cancer cellularity H&E slides
description: 96 H&E whole slide images (20x, Aperio, Sunnybrook) from 54 breast cancer patients after
  neoadjuvant chemotherapy, with Sedeen XML annotations of tumour cellularity regions (four levels) and
  white cell-level labels for lymphocytes, normal and malignant epithelial cells; train slides marked
  by one rater and test slides by two.
