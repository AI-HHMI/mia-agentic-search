notes: 'Zenodo file list (9 files): gzipped HDF5 x/y arrays and metadata CSVs for train, valid and test (the x arrays total about 8 GB; the h5.gz files were not opened). The paper (arXiv 1806.03962) gives 327,680 patches of 96 x 96 px at 10x with a 75/12.5/12.5 % split and hard-negative mining. Pixel size 972 nm is derived from the paper statement that its 10x Camelyon16 data (4x smaller than the original 0.243 um/px) has 0.972 um per pixel; it is not stated for PCam itself. The Zenodo record lists the MIT license; Camelyon16 source slides come from two centers. Patch labels derive from Camelyon16 pixel-level annotations (how the patch label is computed is not described in the paper text read).'
