  notes: 'Listing: Zenodo API (9 files, exact sizes). The files are gzip-compressed HDF5, which the probe tools cannot read; a scratch script (stdlib gzip/zlib + h5py, no dataset code) read valid_y.h5.gz in full (3,038 B): dataset y (32768,1,1,1) uint8, values {0,1}, mean 0.4995 (50/50 balance as the README says). For valid_x.h5.gz only the first 2,000,000 B were fetched (range request) and decompressed: dataset x (32768,96,96,3) uint8, chunks (32,96,96,3), no HDF5 filter; its chunk index lies beyond the fetched part, so no pixel values were read (value_range null; the full file is 806 MB, over the 500 MB sample budget). Axes: neither the HDF5 attributes (none) nor the README name the axis order (patch, y, x, RGB is implied by 96x96x3), so axes stay null. The trailing 3 is RGB (README: color images). Labels: README Labeling section. Download: every file has a direct Zenodo link (download-check usable, range requests); no single archive, so data.download_url is the record page. TensorSwitch would also need to gunzip the .h5.gz files. Voxel size 972 nm unchanged (paper: 10x data at 0.972 microns per pixel).'
