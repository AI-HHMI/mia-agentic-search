short_name: PatchCamelyon lymph node metastasis patches (H&E)
description: PatchCamelyon (PCam) contains 327,680 color image patches (96 x 96 px, 10x magnification) extracted from H&E-stained histopathologic scans of sentinel lymph node sections in the Camelyon16 challenge, each with a binary label for the presence of metastatic tissue. Patches were selected with hard-negative mining and split 75/12.5/12.5 % into train/validation/test; images are stored as gzipped HDF5 arrays with label arrays and CSV metadata.
