notes: 'Zip index read with peek_archive: 50 PNG images in Slide_XX folders and 50 matching PNG masks in GT_XX folders. The paper is not open access (abstract only via Europe PMC), so magnification, pixel size, image dimensions, annotator details and whether masks are binary or instance-labelled are not stated on the Zenodo page or the abstract; annotation type is recorded as semantic-segmentation and source as manual on that basis but the annotation procedure itself is unverified. Zenodo lists v1.1 (2019-02-27) with small pixel corrections. A related extension with cell-type labels and 18 brain images is Zenodo 3552674 (not recorded here).'
