notes: 'Read the HF card and API record (two parquet files, 92,171,048 B summed). Images and masks are embedded in parquet (data/train, data/test), so formats is other (no listed format fits). The card says masks are single-annotator semantic binary, merged from the source instances, so the per-nucleus instances are not included here. Pixel size is not stated on the card, and the paper (Kumar et al. 2017, not open access; only the abstract was read) was not available in full, so voxel size and organism are null; 40x magnification is stated. The card names a CC BY-NC-SA 4.0 license and says the WSIs come from TCGA. Mirror of the Grand Challenge data via RationAI/MoNuSeg; dedup found no match in the catalog.'
