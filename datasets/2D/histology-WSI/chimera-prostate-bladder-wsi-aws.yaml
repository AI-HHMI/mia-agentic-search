short_name: CHIMERA prostate and bladder WSIs with outcomes
description: 'Version 2 of the CHIMERA challenge training data in the public S3 bucket chimera-challenge:
  548 H&E whole-slide images (TIFF, 1.19 TB) with tissue masks, plus clinical JSON files - task 1: 190
  prostate WSIs from 95 patients with MRI and biochemical-recurrence labels; task 2: 182 bladder WSIs;
  task 3: 176 bladder WSIs with progression outcome and RNA-seq JSON. Includes precomputed tile features.'
