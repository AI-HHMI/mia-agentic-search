notes: 'Bucket listed in full: v2 holds 548 H&E WSIs (190 task 1, 182 task 2, 176 task 3), 95 patients''
  MRI (380 .mha), 169 RNA_masks TIFFs, PyTorch tile features and coordinates; 1.61 TB for v2. A v1 folder
  holds an earlier layout (task1 896 TIFFs, task2 264, task3 252) and is not counted. Labels are clinical
  outcomes per patient (one task 1 JSON shows BCR 1 with time to follow-up; one task 3 JSON shows progression
  0 with follow-up days); a task 2 JSON read has no outcome field, so task 2 labels were not confirmed.
  Weak, outcome-level training signal and multimodal, so confidence is low. Licence is CC BY-NC-SA 4.0
  as stated on the AWS registry page; the bucket has no licence file. Pixel size, scanner, patient counts
  for tasks 2 and 3 and the meaning of RNA_masks were not stated on the pages read (challenge site not
  read), so voxel size is null. The bucket README is a stub.'
