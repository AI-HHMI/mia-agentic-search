description: 'Two breast cancer H&E datasets from 25 invasive carcinoma (NST) patients at 40x: NuSeC, 100 images of 1024x1024 pixels with manual nuclei masks (about 36,000 nuclei, 75 train and 25 test),
  and MiDeSeC, 50 images of 1024x1024 pixels with CSV pixel coordinates of more than 500 mitoses (35 train and 15 test).'
