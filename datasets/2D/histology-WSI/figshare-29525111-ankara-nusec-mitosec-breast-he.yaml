        MiDeSeC/test images/                                     45 files     53.2 MB  .bmp 15, .csv 15, .jpg 15
        MiDeSeC/train images/                                   105 files    123.6 MB  .bmp 35, .csv 35, .jpg 35
        NuSeC/mask of test nuclei/                               25 files    104.9 MB  .tif
        NuSeC/mask of train nuclei/                              75 files    314.6 MB  .tif
        NuSeC/test nuclei/                                       25 files     59.8 MB  .tif
        NuSeC/train nuclei/                                      75 files    176.5 MB  .tif
      PDFs: NuSeC.pdf, MiDeSeC.pdf (dataset descriptions), thesis and CompSegNet papers
    n_files: 5
