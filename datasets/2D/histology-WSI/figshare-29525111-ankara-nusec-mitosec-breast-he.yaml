notes: 'One 402 MB zip: NuSeC 75 train and 25 test RGB TIFF images each with a mask TIFF; MiDeSeC 35 train and 15 test images, each as .jpg, .bmp and .csv (350 members). From the description PDFs (NuSeC.pdf, MiDeSeC.pdf) and the thesis PDF in the item: 25 patients, 40x, 3DHistech Panoramic P250 Flash-3, nuclei annotated one by one in QuPath and reviewed by a pathologist, mitoses marked by a pathologist in QuPath. Pixel size is not stated in any of the four PDFs. enricher: the MiDeSeC .bmp files are RGB images nearly identical to the .jpg (not masks; the thesis mentions annotated images); undocumented, so not listed as an array. enricher: channels 3 (RGB, probed). enricher: size 407,077,879 bytes from the complete Figshare file listing (was the zip size only). enricher: annotations.format corrected (NuSeC masks hold nucleus IDs, not binary; MiDeSeC labels are the CSVs).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: |-
      ./                                                        5 files    407.1 MB  .pdf 4, .zip 1
