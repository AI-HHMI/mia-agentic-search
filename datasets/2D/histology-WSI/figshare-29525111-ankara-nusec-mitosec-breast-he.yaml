notes: 'One 402 MB zip listed with peek_archive: NuSeC 75 train and 25 test images each with a mask TIFF; MiDeSeC 35 train and 15 test images (jpg and bmp) with one CSV each (350 files). Details from
  the two dataset description PDFs in the Figshare item (NuSeC.pdf, MiDeSeC.pdf): 25 patients, 40x, 3DHistech Panoramic P250 Flash-3 scanner, Olympus BX50 microscope, nuclei annotated in QuPath (about 30,000
  train and 6,000 test nuclei), more than 500 mitoses in 50 regions. The item also has two thesis/method PDFs. Pixel size is not stated in the PDFs read. MiDeSeC BMP files are assumed to be the mitosis
  masks; not opened.'
