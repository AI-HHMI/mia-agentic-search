  arrays:
  - role: raw
    path_pattern: '*.zip/*/NuSeC/{train,test} nuclei/*.tif'
    format: tiff
    axes: yxs
    shape: [1024, 1024, 3]
    shape_varies: false
    dtype: uint8
    compression: lzw
    value_range: [7, 255]
    normalization: none
    alignment: not-applicable
    alignment_notes: NuSeC H&E image, RGB (photometric 2, samples differ). The thesis says patches were extracted as RGB 8-bit from the scanner TIFFs and no color normalization was applied.
  - role: label
    path_pattern: '*.zip/*/NuSeC/mask of {train,test} nuclei/*.tif'
    format: tiff
    axes: yx
    shape: [1024, 1024]
    shape_varies: false
    dtype: float32
    compression: none
    value_range: [0, 240]
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: 'Pairing rule: NuSeC/<split> nuclei/<name>.tif pairs with NuSeC/mask of <split> nuclei/<name>.tif (same file name, same 1024x1024 grid). ImageJ TIFF, float32 holding integer values 0-240 in the sample (0 = background), read as one ID per nucleus.'
  - role: raw
    path_pattern: '*.zip/*/MiDeSeC/{train,test} images/*.jpg'
    format: jpeg
    axes: yxs
    shape: [1024, 1024, 3]
    shape_varies: false
    dtype: uint8
    compression: jpeg
    value_range: [0, 255]
    normalization: unknown
    alignment: not-applicable
    alignment_notes: MiDeSeC H&E high-power field, RGB JPEG.
  - role: label
    path_pattern: '*.zip/*/MiDeSeC/{train,test} images/*.csv'
    format: csv
    axes: null
    shape: [4, 138]
    shape_varies: true
    dtype: int64
    compression: none
    encoding: polygons
    classes:
    - id: null
      name: mitosis
    alignment: same-grid
    alignment_notes: 'Pairing rule: <name>.csv annotates <name>.jpg in the same folder. Per MiDeSeC.pdf: no header, one line per mitosis, x,y pixel coordinates, origin top-left. In the sampled files each line is a closed outline (first point = last), padded with empty fields to the longest line.'
  notes: >-
    Listing: tools/listing.py on the Figshare article with --expand-zips, 5 files, 407,077,879 bytes (file-listing,
