description: Whole-slide images (.svs) of H&E-stained gastric biopsies from two Colombian cohorts (149 asymptomatic volunteers
  and 56 patients, five biopsies per case, scanned at 40x, 0.255 um per pixel) with ASAP XML polygon annotations of regions with
  intestinal metaplasia and of the five stomach regions, plus 256 x 256 px image patches from annotated regions, split into
  control and metaplasia folders.
