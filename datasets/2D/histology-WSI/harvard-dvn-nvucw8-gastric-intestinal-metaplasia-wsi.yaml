notes: 'Dataverse file listing: 528 files, 226.9 GB. images/URK has 149 .svs with 149 .xml, images/HUN has 112 .svs with 112
  .xml (n_items 261 slide files); the description speaks of 205 WSIs (five biopsies per case), which does not match the 261
  files and is not resolved. Patches: patches/HUN and patches/URK, three zips each (control part a and b, metaplasia; 0.1
  to 1.7 GB, not opened). The annotated regions are drawn by the most experienced of three pathologists and include stroma
  and surrounding tissue besides metaplastic glands (description). One XML was read to confirm ASAP polygon annotations. The
  linked paper (multi-expert comparative study) was not found in Europe PMC or Crossref. enricher: voxel_size_nm set to null
  (was 255 nm): the description says 0.255 um at x40, but SVS headers say MPP 0.127505 at AppMag 80 (H010-1, H026-1, H052-1,
  U063) and 0.265018 at AppMag 40 (U140), so scans differ. enricher: formats svs + jpeg (patches are JPEG, was png).'
