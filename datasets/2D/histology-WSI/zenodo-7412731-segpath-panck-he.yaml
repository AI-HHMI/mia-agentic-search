notes: 'Zenodo record description (README text) gives file naming, 984x984 px patches and mask encoding; the 51 GB tar.gz was not opened (peek_archive does not support tar.gz), so the patch count is unknown and annotations_verified is false. Licence is CC-BY-NC-SA 4.0 per the Zenodo record text; the Zenodo license field says other-nc; commercial use needs contacting the authors. Pixel size 0.220818 um/px from paper Methods (Hamamatsu Nanozoomer S60, 40x). Masks come from IF restaining, not manual drawing; paper validated them against pathologist annotations. Seven further SegPath records (other antigens) exist and were not catalogued.'
