schema_version: '1.2'
id: zenodo-7412731-segpath-panck-he
title: 'SegPath: large-scale annotation dataset for cell/tissue segmentation in H&E images (anti-panCK
  epithelium)'
short_name: SegPath epithelium segmentation (H&E)
description: H&E image patches (984 x 984 px, scanned at 0.22 um/px) of human tumour sections paired with
  binary epithelium masks. Masks were generated by destaining the H&E slide, immunofluorescence restaining
  with anti-panCK and thresholding the fluorescence, rather than by manual drawing. This Zenodo record
  is one of eight SegPath records (one per antigen/cell type); a CSV assigns each patch to train, validation
  or test.
