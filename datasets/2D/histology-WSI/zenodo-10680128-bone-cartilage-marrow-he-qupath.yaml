notes: 'Two zips: 12 H&E TIFF slides (images for training.zip) and a QuPath project (17 .qpdata, 3 pixel-classifier JSONs, 3 Groovy
  scripts). Paper (doi 10.1177/20417314241257352, QuPath analyses) cites this record: 4 classes bone, bone marrow, cartilage, fibrotic
  tissue; annotations manually drawn on a training image composed of ROIs from representative scans; the classifier output was expert-corrected
  but is not in the files. enricher: paper added (was none); organism Homo sapiens + Mus musculus from paper (human ASC grafts in nude
  mice; every slide holds both, was []); annotations.source manual and coverage sparse from paper and QuPath summaries (was mixed /
  unknown); voxel size set to null (was 363.788): slide calibrations differ, 0.363788 um (651 and 655 SVF 4+1 slides) vs 0.366748 um
  (633, 652, 655, 662 slides) per QuPath server.json.'
