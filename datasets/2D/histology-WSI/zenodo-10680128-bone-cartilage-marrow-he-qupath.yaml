notes: 'Two zips: "images for training.zip" (1.72 GB; 12 TIFF slides, 72-827 MB each, listed with peek_archive) and a 3.4 MB QuPath
  project zip (17 .qpdata annotation files, classifiers/classes.json, 3 Groovy scripts). Record
  describes the files as the training images and their corresponding annotations. Script 1_Create2annotations.groovy runs
  createAnnotationsFromPixelClassifier and has a comment asking the user to correct annotations by hand, so labels are probably
  classifier-generated and manually corrected (source: mixed); the .qpdata contents were not opened and classes.json lists generic
  class names (Tumor, Ignore*, ECAD+ ...), so the exact tissue classes are unverified. Pixel size 0.363788 um read from one image''s
  QuPath server.json only; other slides not checked. Species, number of animals and a paper were not stated on the record page,
  the file listing or the project files; no related publication identifier is given. Annotation coverage unknown.'
