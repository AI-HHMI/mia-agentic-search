title: 'ANHIR: Automatic Non-rigid Histological Image Registration dataset'
short_name: ANHIR differently stained histology slides
description: More than 50 sets of consecutive histological sections of the same tissue, each stained differently
  (H&E, Ki67, CD31, HER2, ER, PR, PAS and others; mouse lung, kidney, mammary gland, human breast, colon,
  gastric and kidney), with manually placed corresponding landmarks in each set for evaluating non-rigid
  registration; training landmarks released, test landmarks withheld.
