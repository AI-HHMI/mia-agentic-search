notes: 'Hosted on grand-challenge.org: accept the licence terms, create an account and join the challenge
  before downloading. Images are JPG at small scales and PNG at 100%, provided at 100, 50, 25, 10 and
  5 percent. The paper reports 8 datasets with 355 images and 18 stains (481 image pairs); the data page
  says 50+ sets, so n_items follows the paper. Test landmarks are withheld for server-side evaluation.
  Original pixel sizes per tissue: lung lesions 0.174 um, lung lobes 1.274, mammary glands 2.294, mouse
  kidney 0.227, colon 0.468, gastric, breast and human kidney 0.2528 (not a single value, so voxel size
  is left null). The TMI paper is not open access; only its abstract was read.'
