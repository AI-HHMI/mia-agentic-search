notes: Paper says the Camelyon+ files are on ScienceDB (10.57760/sciencedb.16442) with directories slide-labels/,
  name-convert/, pixel-annotations/, feature-files/, h5py-files/, and that the WSIs themselves are NOT
  in that deposit but come from the official Camelyon repository (gigadb.org/dataset/100439). The ScienceDB
  and GigaDB pages are JavaScript-rendered and returned only a title here, so file listing, size, image
  file format, pixel size and download URLs were not seen; format is 'other' for that reason and download_url
  is null. License CC0 is from the paper's Data Records section. Annotations were made in ASAP by a pathologist
  and checked by a senior pathologist; slide-level labels are for all 1,350 slides, pixel annotation coverage
  by slide was not checked. The original Camelyon-16/17 data may already be catalogued separately (not
  the same record).
