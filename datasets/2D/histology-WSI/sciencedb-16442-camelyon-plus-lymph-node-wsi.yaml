schema_version: '1.2'
id: sciencedb-16442-camelyon-plus-lymph-node-wsi
title: 'Camelyon+: a cleaned benchmark of breast cancer lymph node metastasis whole slide images'
short_name: Camelyon+ lymph node metastasis (H&E WSI)
description: 'Re-curated version of Camelyon-16 and Camelyon-17: 1,350 H&E whole slide images of breast
  cancer lymph node sections (871 negative, 174 micro-metastasis, 251 macro-metastasis, 54 ITC) after
  removing 49 poor-quality slides, with four-class slide labels and corrected pixel-level tumour annotations
  that also cover the previously unannotated test slides. The ScienceDB deposit holds labels, annotations
  and extracted features; the slide images come from the original Camelyon repository on GigaDB.'
