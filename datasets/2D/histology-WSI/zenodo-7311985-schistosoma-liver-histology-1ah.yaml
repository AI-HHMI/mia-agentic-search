notes: Zip is 24.9 GB compressed with 31 members (peek_archive) - 20 .czi slides (10 H&E, 10 trichrome), 10 .annotations
  files on the H&E slides, one .txt. The annotation files could not be opened (zip method 9), so their exact content
  is inferred from the paper ("annotated and quantified the area of individual granulomas, 5-17/liver"); no segmentation
  masks per se. Scan resolution 0.22 um/pixel is from the paper Methods. Authors and publication date not read
  from the Zenodo page. Siblings (same study, other cages/crosses) include zenodo 7504268, 7319849, 7504280, 7504288,
  7504292; only this deposit is proposed here.
