title: Mice infected with High shedder S. mansoni parasites from cross A - cage 1 - Liver histopathology data
short_name: Mouse liver granuloma histology (WSI)
description: Whole-slide histology of livers from five mice infected with high-shedder Schistosoma mansoni parasites (cross
  A, cage 1). Each mouse has two H&E and two Masson's trichrome slides scanned with a Zeiss Axio Scan.Z1 (20 CZI slide images),
  plus HALO annotation files outlining individual egg-induced granulomas on the H&E slides. One of ten sibling Zenodo deposits
  (one per cage/cross) from the same study.
