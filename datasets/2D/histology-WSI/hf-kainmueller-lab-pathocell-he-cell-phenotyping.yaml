id: hf-kainmueller-lab-pathocell-he-cell-phenotyping
title: 'PathoCell (PhenoCell): H&E colon carcinoma cell phenotyping with 14 cell types'
short_name: Colon carcinoma cell phenotyping (H&E)
description: PhenoCell, the H&E cell-phenotyping dataset of the PathoCellBench (formerly PhenoBench) benchmark. 109 high-resolution fields of view from colon carcinoma tissue microarrays (35 patients, Universitaetsspital Bern) with dense per-cell masks (about 88 million cells) labelled with 14 cell types derived from paired CODEX multiplexed imaging (B cells, macrophages, nerves, dendritic cells, plasma cells, granulocytes, tumor cells, T cells, stroma, adipocytes, vasculature, smooth muscle, NK cells, other). Base, tumor-type and tumor-stage splits are provided. The same repository also bundles PanNuke, Lizard and Arctique in LMDB form; this record covers PhenoCell only.
