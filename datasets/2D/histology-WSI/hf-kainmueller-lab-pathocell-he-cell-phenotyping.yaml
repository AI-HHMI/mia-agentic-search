notes: 'Gated on Hugging Face: files require accepting the conditions and sharing contact information after login (automatic approval), hence access registration. MIT license is from the dataset card (the card does not say whether it also covers the underlying data). Pixel size / magnification not stated on the card, in the paper (arXiv v6 HTML) or the GitHub README, so voxel_size_nm is null; the HDF5 internal layout (channels, H&E vs CODEX) was not inspected because files cannot be read without login. 109 HDF5 files listed (about 38.3 GB) match the 109 FoVs in the paper. The paper states the dataset was first published inside a multiplexed imaging study that had no segmentation masks; masks and 14-type labels are new here. Annotation source: CODEX segmentation plus X-shift clustering with manual expert review, mapped to H&E. The same repository bundles PanNuke, Lizard and Arctique (LMDB); only PhenoCell is covered here.'
