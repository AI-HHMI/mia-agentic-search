notes: 'Mendeley lists two zips (DATASET_A_DIB.zip 1.93 GB: 31 raw WSIs in SVS; DATASET_B_DIB.zip 207 MB: 2,340 PNG
  glomerulus crops, 1,170 normal and 1,170 sclerotic) and states licence CC BY 4.0. Zip contents could not be listed
  with peek_archive (Mendeley does not report a file size), so counts and formats come from the dataset page and the Data
  in Brief paper. The paper says glomeruli contours were annotated by pathologists and gray masks (non-glomerular / normal
  / sclerosed) were created for 1,055 2000x2000 patches, and a figure shows masks for DATASET_A, but the dataset page
  describes DATASET_A as raw SVS only, so whether masks are actually shipped is unverified (annotation type therefore
  limited to classification); the crops in B are described as augmented (rotations, flips, colour transfer). Pixel size is
  not stated (20x only). Data in Brief paper full text read via Europe PMC.'
