notes: 'Multi-scanner SCC subset of the CATCH dataset (catalog record tcia-2m93-fx66-catch-canine-cutaneous-histology, also
  pending as an open PR). It differs from CATCH: it re-digitizes 44 SCC samples with five scanners (220 images, lower-resolution
  4 um/pixel pyramidal TIFFs, not the original 40x SVS) and provides annotations transferred across scanners. Zenodo file
  listing (API): 220 .tif plus scc.json and scc.sqlite. Stain is not stated on the Zenodo page or the arXiv paper text read,
  so labels_stains is empty (CATCH is H&E per its own record). The paper used a slide-level 30/5/9 train/val/test split for
  its experiments but the split is not provided as files. Annotations cover the polygons only (partial coverage). Original
  scanner pixel sizes are 0.22-0.26 um/pixel per the record, but the deposited TIFFs are 4 um/pixel. No download_url set because
  files are individual (222 files) with no single archive.'
