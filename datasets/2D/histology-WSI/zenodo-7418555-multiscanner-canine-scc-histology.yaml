    - id: 4
      name: Epidermis
    - id: 5
      name: Subcutis
    - id: 6
      name: Inflamm/Necrosis
    - id: 11
      name: SCC
    alignment: same-grid
    alignment_notes: 'Pairing rule: COCO images[].file_name = scc_<NN>_<scanner>.tif; annotations[].image_id links polygons
      to it. COCO width/height equal the page-0 TIFF size (scc_08_cs2 5624x4338, scc_08_p1000 4482x10859), so polygon coordinates
      are page-0 pixels. Categories 7-10, 12, 13 (other CATCH tumour types) are defined but unused.'
