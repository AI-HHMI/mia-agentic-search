id: zenodo-7418555-multiscanner-canine-scc-histology
title: Multi-Scanner Canine Cutaneous Squamous Cell Carcinoma Histopathology Dataset
short_name: Canine cutaneous SCC multi-scanner histology WSIs
description: 44 canine cutaneous squamous cell carcinoma slides digitized with five whole-slide scanners (220 pyramidal TIFFs
  at 4 um/pixel). The 1,243 manual polygon annotations (tumor and six skin tissue classes - epidermis, dermis, subcutis, bone,
  cartilage, inflammation/necrosis combined) made on the Aperio CS2 scans were transferred to the other four scanners by WSI
  registration and visually validated; they are provided as MS COCO JSON and a SlideRunner SQLite database. Designed for scanner
  domain-shift and domain-generalization studies.
