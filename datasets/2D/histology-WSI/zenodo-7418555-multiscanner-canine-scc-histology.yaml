    path_pattern: scc.sqlite
    format: other
    axes: null
    shape: null
    shape_varies: null
    dtype: unknown
    compression: unknown
    encoding: polygons
    alignment: unknown
    alignment_notes: SlideRunner SQLite database with the same annotations (per the record); not opened.
  notes: 'Listing: tools/listing.py on the Zenodo record: 222 files, 12,081,080,702 bytes (file-listing, complete). Probe
    of scc_08_cs2.tif and scc_08_p1000.tif: plain pyramidal BigTIFF (no ImageJ/OME metadata), uint8 RGB, deflate, tiled; page
    shapes listed with tifffile (header reads only). Sample: scc_08_cs2.tif page 0 (19,303,740 B): 4338x5624x3 uint8, 12-255,
    p50 236 (mostly white background; one sample only). scc.json (30,323,434 B, read by an ad hoc script): COCO keys info/licenses/categories/images/annotations;
    220 images, 6,215 polygon annotations, 7-94 per image; used category counts Epidermis 2155, SCC 1550, Dermis 1130, Subcutis
    640, Inflamm/Necrosis 500, Bone 205, Cartilage 35. The COCO "licenses" entry says "Attribution-NonCommercial-NoDerivs
    License" (CC BY-NC-ND 2.0); the Zenodo record says CC-BY-4.0, which is kept. No single archive: download_url stays null;
    every file is a direct Zenodo URL (records/7418555/files/<name>). scc.sqlite not inspected.'
