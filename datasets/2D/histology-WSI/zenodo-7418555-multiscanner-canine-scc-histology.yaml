    alignment_notes: 'Pyramidal BigTIFF, tiled 128x128, RGB (photometric 2): page 0 is the full 4 um/px image (axes yxs);
      pages 1+ are reduced-resolution levels (NewSubfileType 1, each half the size; 7 pages for scc_08_cs2, 8 for scc_08_p1000).
      TIFF resolution tags say 10 px/cm (a default), the record states 4 um/px.'
  - role: label
