notes: 'Aggregated, processed redistribution of 15 third-party public datasets (most also catalogued individually); GPL-3.0
  covers the packaging, code and metadata only, and the README says underlying datasets keep their original licenses, so reuse
  terms vary per subset. No paper or author list found on the card or via Europe PMC/Crossref search. Format: NumPy .npy arrays
  (not in schema format list, hence other); N_MoNuSeg.zip (48,254 .npy) and N_BCCD.zip (187,172 .npy) listed with peek_archive.
  n_items = sum of per-subset cell counts in the README (the two iPSC subsets each list 35,308). size_bytes = sum of 16 files
  in the HF API. Voxel/pixel size not stated. Labels marked U in the README have the dataset/folder name as label. Repo created
  2026-06-27 (HF API). Downloads are 15 zip archives, one per source dataset.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "HASSL-SingleCellBench/ (Hugging Face, 18 files, 36.4 GB)\n  README.md, Dataloader_example.ipynb, .gitattributes\n\
