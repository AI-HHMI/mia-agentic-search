      \                  PanNuke 0.71, Satorious 0.32, cyto2 0.65, databowl 0.09, iPSC_Morpologies 0.03, iPSC_QCData 0.90,\n\
      \                  lynsec13 0.26, omnipose 0.52, tissuenet 25.32\ninside each zip: N_<source>/<split>/[<class>/]{original,mask}/cell_<n>.npy\n\
      \  e.g. N_MoNuSeg/train/{original,mask}/ 21,720 each; N_MoNuSeg/test/{original,mask}/ 2,409 each\n"
    n_files: 18
    listing_complete: true
