title: 'HASSL SingleCellBench: single-cell and nucleus crops with masks from 15 public microscopy datasets'
short_name: HASSL SingleCellBench cell crops (mixed)
description: Benchmark collection of single-cell / single-nucleus image crops with binary instance masks, aggregated and preprocessed
  from 15 public datasets (BCCD, CoNIC, Cyto/Cyto2, Data Science Bowl 2018, DynamicNuclearNet, two iPSC datasets, LynSec,
  MoNuSAC, MoNuSeg, NuInsSeg, Omnipose, PanNuke, Sartorius, TissueNet). Each sample is an original/ and mask/ NumPy array
  pair, organised dataset/split/(class)/original+mask. Covers H&E histology, brightfield blood smears, fluorescence, multiplex
  immunofluorescence and phase contrast. Cell-type labels exist for some subsets, otherwise the dataset or folder name is
  the label.
