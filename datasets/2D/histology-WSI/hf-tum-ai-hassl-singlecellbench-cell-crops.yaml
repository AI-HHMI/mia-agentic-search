  - role: label
    path_pattern: N_*/**/mask/*.npy
    format: other
    axes: yx
    shape:
    - 11
    - 11
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    encoding: binary
    classes: null
    alignment: same-grid
    alignment_notes: Pairs by path, original/ -> mask/ with the same cell_<n>.npy name; same H x W as the crop. Values {0,
      255} in all four samples. Cell-type label = class folder where present, otherwise the source dataset (README).
  notes: 'Listing from the Hugging Face API (18 files, exact sizes, 36,374,427,701 B; zips not expanded by listing.py). Opened
    the central directories of N_MoNuSeg.zip (48,261 entries) and N_cyto2.zip (220,265 entries) over range requests and read
    2 original/mask pairs from each with a short numpy script (np.load, allow_pickle=False); about 20 MB of range reads in
    all. tools/probe.py does not read .npy (format other). Value ranges are from these 4 crops only. The other 13 zips, incl.
    N_tissuenet.zip (25.3 GB), were not opened. Pixel size: not stated on the card; it differs per source dataset, so voxel_size_nm
    stays null. Dataloader_example.ipynb not opened (untrusted code). No single archive: 15 per-source zips.'
