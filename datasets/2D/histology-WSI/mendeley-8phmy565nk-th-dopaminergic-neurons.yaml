id: mendeley-8phmy565nk-th-dopaminergic-neurons
title: Mouse substantia nigra sections with manually annotated TH-positive dopaminergic neuron somata
short_name: Mouse dopaminergic neuron somata (histology)
description: 114 whole-section brightfield histology images (8-bit RGB PNG, 0.46 um/pixel, Hamamatsu NanoZoomer
  20x) of mouse coronal brain sections containing the substantia nigra, stained for tyrosine hydroxylase
  (TH) with a haematoxylin or Nissl background stain. Each image has a 16-bit label image in which every
  one of the 18,193 manually labelled TH-positive cell bodies has its own integer value (1..n).
