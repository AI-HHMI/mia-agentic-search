notes: 'Facts from the Mendeley page and public API record (description, method, licence, file list: one
  zip, cell_annotations.zip). enricher: zip index read (228 PNGs: 114 image/ + 114 label/, same names)
  and one pair sampled, so annotations_verified is now true; download_url set to the S3 object the Mendeley
  link redirects to (the Mendeley URL answers scripted requests with 403). No paper is linked on the record;
  the method text cites an earlier Genentech neuroanatomy segmentation study (doi 10.1016/j.neuri.2023.100131,
  not open access) and an OpenReview submission that could not be read, so it is not listed in publications.
  No train/test split is provided.'
