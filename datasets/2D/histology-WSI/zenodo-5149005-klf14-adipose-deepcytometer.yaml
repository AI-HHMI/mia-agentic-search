notes: 'Images are DeepZoom tiles in aida_data_Klf14_v8_images.7z (16.9 GB) and annotations in aida_data_Klf14_v8_annotations.7z
  (page: 22.3 GB listed, 18 GB in text); 7z archives cannot be listed remotely, so file formats and counts
  inside were not verified (n_items 147 = slides segmented per record text and paper, 75 subcutaneous
  + 72 gonadal; one or two tissue slices per slide). Segmentations are DeepCytometer model output (Auto
  and manually Corrected), not purely manual; the 1,903 hand-traced training contours are in the companion
  record 10.5281/zenodo.5137433, not this one. Pixel size 0.454 um at the highest level is from the paper;
  the Zenodo page does not state it. Scanner not identified in paper text checked. Record is intended
  for AIDA visualisation, so tiles may require reassembly for training. enricher: two direct 7z archives
  (no single-file download).'
