  + 72 gonadal; one or two tissue slices per slide). Segmentations are DeepCytometer model output (Auto
  and manually Corrected), not purely manual; the 1,903 hand-traced training contours are in the companion
  record 10.5281/zenodo.5137433, not this one. Pixel size 0.454 um at the highest level is from the paper;
  the Zenodo page does not state it. Scanner not identified in paper text checked. Record is intended
  for AIDA visualisation, so tiles may require reassembly for training. Download URL not set because the
  archives are 7z parts of a 39 GB record.'
