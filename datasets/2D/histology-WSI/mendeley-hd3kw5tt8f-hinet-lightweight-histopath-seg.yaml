notes: 'One zip (HI-NET_final_dataset.zip, 4.5 GB) listed with peek_archive: 15,854 PNGs plus train/val/test .lst files; each
  tile has a *_label.png (c16 = CAMELYON16, c17 = CAMELYON17, iciar18 = ICIAR 2018): train 4734 + 599 + 1012, val 594 + 68
  + 120, test 604 + 86 + 110 pairs. The Mendeley page says the images were downsampled from the gigapixel slides with a sliding
  window and threshold-based region selection and annotated in ASAP; the related paper (Li et al., HI-Net, 2024, no DOI found)
  is not open access and only its abstract was read, so label classes, magnification and pixel size are not stated (masks
  sampled: binary 0/255). Source slides come from other public challenges, so their terms may also apply; the Mendeley record
  states CC BY 4.0. Note the Mendeley files tab is empty in the web view but the API lists the single zip. No DOI for the
  paper was found.'
