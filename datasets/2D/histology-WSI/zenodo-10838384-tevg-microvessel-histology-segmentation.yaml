notes: 'Source slides were scanned on a Vision Slide Assist scanner (West Medica, Perm, Russia), 104 WSIs of about 135,000
  x 123,000 px on average; pixel size is not stated on the Zenodo page or in the paper text read, so voxel size is null.
  Two pathologists annotated independently and a senior pathologist verified every mask (Zenodo description), so source is
  proofread. source_data.zip (6.36 GB) holds all 1401 JPEG patches with their 2802 PNG masks (mask and mask_color) and metadata.csv;
  fold_1..fold_5.zip (6.36 GB each) re-package the same 1401 patches into train/test folders (16 / 4 sheep per fold), so the
  total Zenodo size is about 38 GB but size_bytes counts source_data.zip only. Per-class patch counts per fold are in the
  Zenodo description (Table 1).'
