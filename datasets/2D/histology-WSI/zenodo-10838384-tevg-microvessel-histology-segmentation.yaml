notes: 'Source slides were scanned on a Vision Slide Assist scanner (West Medica, Perm, Russia), 104 WSIs
  of about 135,000 x 123,000 px on average; pixel size is not stated on the Zenodo page or in the paper
  text read, so voxel size is null. Two pathologists annotated independently and a senior pathologist
  verified every mask (Zenodo description), so source is proofread. source_data.zip (6.36 GB) holds all
  1401 JPEG patches with their 2802 PNG masks (mask and mask_color) and metadata.csv; fold_1..fold_5.zip
  (6.36 GB each) re-package the same 1401 patches into train/test folders (16 / 4 sheep per fold). Per-class
  patch counts per fold are in the Zenodo description (Table 1). enricher: size_bytes 6.36 GB -> 38,164,200,743
  (complete Zenodo listing, 9 files incl. the 5 fold zips; source_data.zip alone has every unique patch);
  channels -> 3; mask/ PNGs are one semantic-ID mask, not binary per feature.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "source_data.zip (6.36 GB)\n  source_data/img/<slide>_<tile>.jpg        1401  (6.52 GB, 3000x3000\
      \ RGB)\n  source_data/mask/<slide>_<tile>.png       1401  (33.7 MB, class IDs)\n  source_data/mask_color/<slide>_<tile>.png\
      \ 1401  (74.9 MB, RGB)\n  source_data/metadata.csv\nfold_1.zip .. fold_5.zip (6.36 GB each)\n  fold_<k>/{train,test}/{img,mask,mask_color}/\
      \  (same 1401 patches, subject-wise split)\n+ 3 preview images (2 png, 1 jpg)\n"
    n_files: 9
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/10838384/files/source_data.zip::source_data/img/001_0007.jpg
    - https://zenodo.org/records/10838384/files/source_data.zip::source_data/mask/001_0007.png
    size_bytes: 3835159
    description: One 3000x3000 H&E patch and its class-ID mask
  arrays:
  - role: raw
    path_pattern: source_data.zip::source_data/img/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 3000
    - 3000
    - 3
    shape_varies: false
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: RGB JPEG; metadata.csv gives 3000x3000 per patch.
  - role: label
    path_pattern: source_data.zip::source_data/mask/*.png
    format: png
    axes: yx
    shape:
    - 3000
    - 3000
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 0
    - 7
    normalization: unknown
    encoding: semantic-ids
    classes:
    - id: 0
      name: background
    - id: 1
      name: Arteriole lumen
    - id: 2
      name: Arteriole media
    - id: 3
      name: Arteriole adventitia
    - id: 4
      name: Venule lumen
    - id: 5
      name: Venule wall
    - id: 6
      name: Capillary lumen
    - id: 7
      name: Capillary wall
    - id: 8
      name: Immune cells
    - id: 9
      name: Nerve trunks
    alignment: same-grid
    alignment_notes: Same stem as the image (img/001_0007.jpg <-> mask/001_0007.png), same 3000x3000 grid.
      IDs = metadata.csv class_id (sample values {0,6,7} match the capillary rows for 001_0007). Background
      0 inferred from the sample (99% of pixels).
  - role: label
    path_pattern: source_data.zip::source_data/mask_color/*.png
    format: png
    axes: yxs
    shape:
    - 3000
    - 3000
    - 3
    shape_varies: false
    dtype: uint8
    compression: png
    normalization: unknown
    encoding: rgb-colors
    classes: null
    alignment: same-grid
    alignment_notes: Colour-coded version of mask/, same stem; colour table not documented.
  - role: label
    path_pattern: source_data.zip::source_data/metadata.csv
    format: csv
    axes: null
    shape: null
    shape_varies: null
    dtype: unknown
    compression: none
    normalization: unknown
    encoding: boxes-table
    classes: null
    alignment: same-grid
    alignment_notes: 'One row per object: image_name, slide, tile, x1,y1,x2,y2, area, class_id, class_name,
      split.'
  notes: 'Listing: tools/listing.py --expand-zips on the Zenodo record: 9 files, 38,164,200,743 bytes,
