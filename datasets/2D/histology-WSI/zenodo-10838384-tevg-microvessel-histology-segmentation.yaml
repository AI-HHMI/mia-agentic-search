title: Histological Dataset for Microvascular Segmentation of Tissue-Engineered Vascular Grafts
short_name: Sheep vascular graft H&E microvessel masks
description: 1,401 H&E patches (3000 x 3000 px, JPEG) selected from 104 whole slide images of biodegradable tissue-engineered
  vascular grafts implanted in the carotid arteries of 20 sheep, each annotated with binary masks for nine histological
  features (arteriole lumen, media and adventitia, venule lumen and wall, capillary lumen and wall, immune cells, nerve
  trunks). A 5-fold subject-wise cross-validation split is provided.
