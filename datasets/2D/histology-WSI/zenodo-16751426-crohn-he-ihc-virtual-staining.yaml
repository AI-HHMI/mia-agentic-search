notes: 'One zip with 5,172 PNG tiles (4.8 GB) in 8 folders HE+AE1AE3, HE+CD117, HE+CD15, HE+CD163, HE+CD3, HE+CD8, HE+D2-40, HE+GIEMSA, each with slide_id_N subfolders. The paper (open access) states 480
  WSIs from 59 patients, 30 matched pairs per stain, 40x scans at 0.22 um/px, and an 80/20 slide-level split given in S1 Text, not as files in the zip, so splits_provided is false. Pixel size left null:
  the 512x512 tile halves are resized (the paper trains on 2048 px x10 tiles resized to 512, ~0.88 um/px), but the zip does not state its tiles'' magnification. Task is H&E-to-IHC virtual staining, hence
  other. enricher: channels 3 (probed); tiles are side-by-side H&E|IHC pairs (viewed one tile).'
