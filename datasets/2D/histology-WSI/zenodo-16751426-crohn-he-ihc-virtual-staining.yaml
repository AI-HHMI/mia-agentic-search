notes: 'One zip with 5,172 PNG tiles (4.8 GB); peek_archive listed only the first 40 paths (all in HE+AE1AE3/slide_id_0),
  so the folder layout of the other stains and the exact tile size are not confirmed. The paper (open access, Methods and Data
  availability read) states 480 WSIs from 59 patients, 30 matched pairs per stain, 40x at 0.22 um/px, and that the authors used an
  80/20 slide-level train/test split, but the split is not given as files in the zip, so splits_provided is false. Pixel size is therefore left null: the slides were scanned at 0.22 um/px but the PNG tiles may be
  downsampled (the paper tests 10x tiles resized to 512 px). Task is H&E-to-IHC virtual
  staining, which has no schema task value, hence other.'
