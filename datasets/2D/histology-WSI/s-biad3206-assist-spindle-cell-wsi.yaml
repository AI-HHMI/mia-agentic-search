  notes: 'File list from the BioStudies files API (412 files, exact sizes, 279.1 GB; the FTP HTTP index
    shows the same files with rounded sizes plus two generated file lists). Probed ASSIST_HCUV_235_A.tif
    (smallest, 30.6 MB): 7 pages 26576x21392x3 ... 415x334x3, uint8, JPEG/YCbCr, tiled 512, resolution
    101600 px/inch (0.25 um). ASSIST_UPIGAP_120_A.tif: 10 pages, level 0 69632x161280x3, same encoding.
    probe.py calls these plain multi-page TIFFs; the extra pages are reduced-resolution subfiles (subfiletype
    1), so the axes are yxs (RGB). Read ASSIST_Dataset.xlsx (21,948 B) with openpyxl. Class names are
    only the folder abbreviations; the paper was not readable. No pixel values sampled: level 0 decodes
    to >1.7 GB. Not download-ready: 2D, voxel size differs by scanner.'
