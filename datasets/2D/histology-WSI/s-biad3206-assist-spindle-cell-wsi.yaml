notes: 'Released 2026-10-20, the day of this run. The BioStudies file API lists 412 files: two xlsx label tables and WSI TIFFs under WSI/_1_ood/ (first 125 listed: 115 TIFFs, 45.6 GB, 79 MB to 883 MB each); the remaining listing and the total size were not retrieved, so size_bytes is null. Pixel size differs by scanner (Philips 0.25 um/px, Ventana 0.227 um/px, per the record), so voxel_size_nm is null instead of one value. The Scientific Data paper could not be fetched (Nature redirect, not in Europe PMC), so class names and counts, the split and the annotation procedure come only from the BioStudies record; the spreadsheet header (GT, WSI, center, AnatomicalSite, Morphology) was read but class counts were not tallied. Annotations are slide-level diagnoses (classification), not pixel labels. Author list on the record is abbreviated to the first author named in the citation.'
