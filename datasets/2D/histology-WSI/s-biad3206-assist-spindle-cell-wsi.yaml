notes: 'The Scientific Data paper could not be fetched (Nature redirect, not in Europe PMC), so class
  names, split and annotation procedure come only from the BioStudies record. Annotations are slide-level
  diagnoses (classification), not pixel labels. Author list abbreviated to the first author named in the
  citation. enricher: size 279,096,651,161 B from the BioStudies file API (412 files, exact sizes; was
  null). enricher: ASSIST_Dataset.xlsx has 410 rows: GT -1 = OoD (315, WSI/_1_ood/), 2 (31, 2_df/), 3
  (24, 3_dfs/), 5 (24, 5_afx/), 6 (16, 6_scc/); center HCUV 238, UPIGAP 172. Every slide has a label,
  hence coverage dense (was unknown). Pixel size per scanner (BioStudies Image acquisition): Philips Ultra
  Fast and SG300 (UPIGAP) 0.25 um/px, Ventana iScan HT (HCUV) 0.227 um/px, so voxel_size_nm stays null;
  the HCUV TIFF probed stores 0.25 um/px (101600 px/inch), which conflicts with the record.'
