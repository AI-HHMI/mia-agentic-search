title: PRECISE - PRostate Expert-annotated Contiguous IHC-H&E Serial sEctions
short_name: PRECISE prostate H&E and IHC WSIs, 7-class masks
description: 'Paired H&E and HMWCK-AMACR (CKAPM + racemase) immunohistochemistry whole-slide images of 37
  prostate core needle biopsies from 25 patients (54 image pairs, 108 OME-TIFF files including masks),
  scanned with 3DHISTECH Pannoramic scanners at 0.243 um/pixel. Each slide has a pixel-level expert
  semantic segmentation mask (7 classes: tumor, benign gland, artifact, HGPIN, intraductal carcinoma,
  atypical intraductal proliferation, stroma; 24,387 annotations), validated in three consensus stages
  by two uropathologists. Clinical metadata (age, PSA, ISUP grade, Gleason score) in participants.csv.'
