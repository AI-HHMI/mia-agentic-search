schema_version: '1.2'
id: uq-8be4bd0-nmsc-histopathology-segmentation
title: Histopathology Non-Melanoma Skin Cancer Segmentation Dataset
short_name: Skin cancer H&E tissue segmentation (12 classes)
description: 290 H&E-stained whole-section images of non-melanoma skin cancer (140 basal cell carcinoma, 60 squamous cell
  carcinoma, 90 intra-epidermal carcinoma; shave, punch and excisional biopsies) imaged at 10x (0.67 um per pixel), each with
  a hand-painted 12-class tissue segmentation mask, provided at 1x, 2x, 5x and 10x downsampling, with cancer margin coordinates
  and a 70:15:15 train, validation and test split.
