  notes: 'Data are in IDC (s3://idc-open-data, public); Zenodo has only manifests. Listed 22 of the 1,279 manifest prefixes:
    image series have 6 instances (10.7-11.6 GB per series), annotation series one 6-50 KB instance. A full listing needs
    1,279 bucket requests, so size_bytes stays null and no estimate was made (image-series count not stated; uncompressed
    estimate would be meaningless for JPEG WSIs). Headers read with pydicom (range read): base level 446,692 x 186,095 RGB,
    1024 px tiles, JPEG, PixelSpacing 0.11072 x 0.11054 um; ANN file read in full (50,210 B). The bucket intermittently returns
    404 (retries needed). No sample: pairing an ANN series with its image prefix needs the IDC index (SeriesInstanceUID to
    crdc_series_uuid). Both checked objects pass download-check.'
