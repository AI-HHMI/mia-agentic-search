notes: 'The Zenodo record (v25, 2026-10-07) holds only download manifests (.s5cmd for AWS/GCS and a .dcf) for the IDC collection
  bonemarrowwsi_pediatricleukemia, not the images; download with `idc download <manifest>` (idc-index). The manifest lists
  1,279 IDC series (image and annotation series). Earlier versions (10.5281/zenodo.15490664, a 2-slide sample with annotations;
  10.5281/zenodo.16995570, v22) held fewer annotations. The record text says annotations are available as DICOM Bulk Annotations
  series; Total size not stated (WSIs are multi-GB each; sample slides in 15490664 range up to 6.8 GB). The paper reports
  over 40,000 boxes with more than 28,000 high-quality class labels (33-class classification); the record says 47,176 boxes
  and 49 classes. Case count is 245 on the record vs 246 in the paper. Patient clinical data are in DICOM metadata. enricher:
  one ANN series read (37 RECTANGLE groups) and one WSI header (pixel spacing 0.1107 x 0.1105 um, confirming 110 nm).'
