title: 'BoneMarrowWSI-PediatricLeukemia: A Comprehensive Dataset of Bone Marrow Aspirate Smear Whole Slide Images with Expert
  Annotations and Clinical Data in Pediatric Leukemia'
short_name: Bone marrow smear WSIs, cell boxes (leukemia)
description: Bone marrow aspirate smear whole slide images (May-Gruenwald-Giemsa / Pappenheim stain, 40x, 0.11 um/pixel) from
  245 pediatric leukemia cases, converted to DICOM and served by the NCI Imaging Data Commons, with 47,176 expert bounding-box
  cell annotations in monolayer ROIs (49 consensus cell-type classes; per-session labels included) as DICOM bulk annotations,
  plus clinical and laboratory data.
