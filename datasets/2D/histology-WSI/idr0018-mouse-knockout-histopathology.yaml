notes: 'No paper is associated with the study (publication fields empty in the IDR study file). Most images are raw Hamamatsu
  NDPI whole slides (690 raw, 209 derived per the IDR table; 266 GB in the FTP index), which are not in the schema format
  list, so formats lists only the TIFFs (annotated images and derived files). Phenotype annotations are image-level and
  cover a minority of images (123 of 899 flagged); raw images are not available for all gene knockouts. Pixel size not
  stated in the study files and no file headers were read. The file listing is from the HTTP index (rounded sizes).'
