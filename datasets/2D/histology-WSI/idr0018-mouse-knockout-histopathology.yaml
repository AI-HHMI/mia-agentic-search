id: idr0018-mouse-knockout-histopathology
title: Histopathology of mouse knockouts (14 tissues, 10 gene knockouts, H&E)
short_name: Mouse knockout tissue histopathology (H&E)
description: H&E-stained histopathology slides of 14 tissues from mice carrying 10 different single-gene
  knockouts, produced for the BioMedBridges project (IMPC protocols). The IDR record holds 899 images
  with per-image phenotype annotations (CMPO terms, image-level), and the file archive adds raw NDPI slides,
  NDPA slide annotation files and annotated TIFF images.
