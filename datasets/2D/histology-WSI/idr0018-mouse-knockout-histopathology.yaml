notes: 'No paper is associated with the study (publication fields empty in the IDR study file). Raw images
  are Hamamatsu NDPI whole slides (TIFF-based, so listed as tiff; 230 on the FTP, 690 IDR series), plus
  1280x1024 RGB TIFF crops (209 derived images in IDR; 123 carry phenotype terms). Phenotype annotations
  are image-level and cover a minority of images; raw slides exist only for 5 of the 10 knockouts (Baz1a,
  Ddx41, Eya4, Idh1, Pipox). enricher: pixel size of NDPI level 0 is 227.4x227.6 nm (IDR PhysicalSizeX/Y
  0.2274/0.2276 um, image 1920189); the TIFF crops carry no calibration, so voxel_size_nm stays null.
  The NDPA files hold arrows/pointers, not masks.'
