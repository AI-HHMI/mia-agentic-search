notes: 'Zenodo lists no license; the description states "The dataset can be used for academic research purposes only", so
  spdx is custom (research use only). Files read from the Zenodo API listing: 24 slide files plus CHALLENGING_GT_BX.csv (opened:
  GT/file-name columns). 24 cases (12 LUAD, 12 LUSC); 19 SVS plus 5 NDPI files (NDPI is not in the schema format list, so
  only svs is listed). Labels are slide-level (no pixel annotations); the paper (PMC11524894, Methods and key resources table)
  lists this deposit among the released test datasets and gives subtype ground truth from pathology reports/immunohistochemistry.
  The paper states the WNS and UKK biopsy cohorts were digitized with different scanners but not per file, and gives no pixel
  size for this release, so voxel size is null. The companion annotated tile dataset (UKK L1 SEGM, Zenodo 12818382) is already
  in the catalog and is a different dataset.'
