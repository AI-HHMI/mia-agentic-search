notes: 'Zenodo lists no license; the description states "The dataset can be used for academic research
  purposes only", so spdx is custom (research use only). Files read from the Zenodo API listing: 24 slide
  files plus CHALLENGING_GT_BX.csv (opened: GT/file-name columns). 24 cases (12 LUAD, 12 LUSC); 19 SVS
  plus 5 NDPI (TIFF-based) files. Labels are slide-level (no pixel annotations); the paper (PMC11524894,
  Methods and key resources table) lists this deposit among the released test datasets and gives subtype
  ground truth from pathology reports/immunohistochemistry. enricher: headers give MPP 0.262780 um (19
  Aperio SVS) and 0.23047 um (5 NDPI, 43389 px/cm), so voxel_size_nm stays null; formats + tiff (NDPI).
  The companion annotated tile dataset (UKK L1 SEGM, Zenodo 12818382) is already in the catalog and is
  a different dataset.'
