notes: 'Different from the catalogued SegPath panCK record (zenodo-7412731): other antigen (ERG, endothelial
  nuclei), other images. Zenodo files: ERG_Endothelium.tar.gz (20,956,731,834 B), ERG_fileinfo.csv and
  LICENSE. Patch count and split (train 18,994, val 1,226, test 1,074; 21,294 rows) come from ERG_fileinfo.csv.
  License is CC-BY-NC-SA 4.0 per the Zenodo record text (Zenodo field: Other (Non-Commercial)); commercial
  use needs contacting the authors. Pixel size 0.220818 um/px from the paper Methods (Hamamatsu Nanozoomer
  S60, 40x). Masks are IF-derived, validated against pathologists in the paper. download_url is the record.
  enricher: first tar.gz members streamed and one HE/mask pair measured; size_bytes = full listing total
  20,958,176,647 B (tar.gz + CSV + LICENSE); annotations_verified true.'
