id: zenodo-7412512-segpath-erg-he
title: 'Large-scale annotation dataset for cell/tissue segmentation in H&E-stained images : anti-ERG (endothelial
  cells)'
short_name: SegPath endothelial cell segmentation (H&E)
description: 21,294 H&E image patches (984 x 984 px, 40x, 0.22 um/px) of human tumour tissue-microarray
  sections paired with binary masks of endothelial cell nuclei. Masks come from destaining the H&E slide,
  restaining with anti-ERG immunofluorescence and thresholding, not from manual drawing. One of the SegPath
  records (one per antigen); a CSV assigns each patch to train, validation or test.
