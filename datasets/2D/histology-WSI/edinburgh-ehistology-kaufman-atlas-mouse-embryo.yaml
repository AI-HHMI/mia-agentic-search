notes: 'Edinburgh DataShare community "eHistology Atlas with Kaufman Annotations" (hdl 10283/822) with 4 collections (Plates
  02-15, 16-29, 30-41, coronal supplement S1-S6) and 1,033 items, one item and DOI per image (landing_url 10.7488/ds/1232
  = Plate 38b image b); the paper counts 937 images, so the supplement may be extra. Each item: image.jpg (or .tif), terms.txt,
  details.txt, README.txt, citation.txt, url.txt (README). CC BY 4.0 per DataShare item metadata. GigaDB mirror 10.5524/100365
  (CC0 per DataCite). Size about 118 GB zipped and 0.34 um pixels are from the paper Data records. The annotations are anatomical
  landmark points, not masks; ML task unclear, hence other.'
