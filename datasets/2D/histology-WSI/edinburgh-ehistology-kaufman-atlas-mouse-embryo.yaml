description: 937 high-resolution H&E histology section images of staged mouse embryos (E5.5 to E17.5, Plates 2-41 of the Kaufman
  Atlas), re-digitised at 0.34 um pixels, each with manual point annotations ('flags') carrying the atlas anatomical term
  and an EMAPA ontology term with x,y image coordinates (more than 10,000 flag labels in total).
