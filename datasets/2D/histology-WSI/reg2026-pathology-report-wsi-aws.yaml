notes: 'Bucket listed in full (ap-northeast-2, 2.48 TB): train/ 11,220 TIFF slides (2.29 TB), test1/ 350
  slides (195 GB, manifest says 280 original plus 70 uterus slides), debug/ 7 slides. train_CoT.json has
  11,220 entries whose ids match the train files one to one; first-step organ counts: Prostate 2,418,
  Breast 2,212, Stomach 1,757, Colon 1,751, Urinary bladder 1,079, Lung 945, Uterine cervix 812, Rectum
  244, Nipple 1, Anus 1 (the registry says 7 organs). The registry says about 12,000 cases and a second
  test phase to follow; counts here are what the bucket held when read. The labels are structured report
  content in JSON rather than region annotations. Licence CC BY-NC-SA as written on the registry page
  (read as 4.0); the bucket has no licence file. Pixel size is not stated (challenge data page: 20x magnification
  only, scanners differ by institution), so voxel size is null. No dataset paper is listed.'
