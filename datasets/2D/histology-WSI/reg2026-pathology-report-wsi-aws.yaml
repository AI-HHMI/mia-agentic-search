short_name: REG2026 H&E WSIs with report reasoning data
description: '11,577 de-identified H&E whole-slide images (TIFF, 20x) from institutions in Korea, Turkiye,
  Japan, India and Germany in the public S3 bucket reg2026-challenge-dataset: 11,220 training slides each
  with a chain-of-thought JSON entry (question-answer steps ending in organ, procedure, histologic type
  and grade fields), 350 test1 slides without reference data and 7 debug slides, for pathology report
  generation.'
