notes: 'Files: Patches.zip (19,077 JPEGs in train/val/test, 16.2 GB), NormalizedPatches.zip (same patches colour-normalised, 16.0 GB), Annotations.zip (train/val/test CSVs, listed and read), NormalizedSICAPv2.zip and NormalizedSICAPv2_Annotations.zip (external SICAPv2 dataset, 1.0 GB). Pixel size and magnification are not given on the record; the paper is not open access (abstract only was read), so voxel_size_nm is null. Numeric label codes in the CSVs (0, 1, 2, ... and -1 where an annotator did not label a patch) are not decoded on the Zenodo page; the mapping to Gleason grades is in the paper. size_bytes sums the five zips; n_items counts the CrowdGleason patches only. download_url is null because the record has several files.'
