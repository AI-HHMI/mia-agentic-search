id: zenodo-14178894-crowdgleason-prostate-patches
title: 'The CrowdGleason dataset: learning the Gleason grade from crowds and experts'
short_name: CrowdGleason prostate Gleason-grade patches (H&E)
description: 19,077 H&E patches (512 x 512 px) from 1,045 prostate biopsy whole-slide images with Gleason-grade labels. Training (13,824) and validation (2,327) patches carry crowdsourced labels from up to seven pathologists-in-training; the 2,926-patch test set has a consensus ground truth from expert pathologists. Colour-normalised copies and the external SICAPv2 patches and labels are included.
