title: 'The CrowdGleason dataset: learning the Gleason grade from crowds and experts'
short_name: CrowdGleason prostate Gleason-grade patches (H&E)
description: 19,077 H&E patches (described as 512 x 512; the files are 2048 x 2048 px JPEGs) from 1,045
  prostate biopsy whole-slide images with Gleason-grade labels. Training (13,824) and validation (2,327)
  patches carry crowdsourced labels from up to seven pathologists-in-training; the 2,926-patch test set
  has a consensus ground truth from expert pathologists. Colour-normalised copies and the external SICAPv2
  patches and labels are included.
