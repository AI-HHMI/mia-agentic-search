schema_version: '1.2'
id: tiger-training-breast-wsi-aws
title: 'TIGER training dataset: whole-slide images with tissue, cell, tumor-bulk and TILs-score annotations
  (AWS)'
short_name: TIGER breast cancer WSIs with TIL annotations
description: '371 breast cancer H&E whole-slide images (multiresolution TIFF, 0.5 um/px) from the TIGER
  challenge training set in the public S3 bucket tiger-training: 196 WSIROIS slides with tissue-compartment
  masks and cell annotations (RUMC, Jules Bordet Institute, TCGA-BRCA) plus 2,032 cropped ROI PNGs with
  masks and COCO cell boxes, 93 WSIBULK slides with manual tumor-bulk masks and XML, and 82 WSITILS slides
  with a TILs score per slide.'
