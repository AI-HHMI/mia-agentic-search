notes: 'Figshare API record: CC BY 4.0, 114 files totalling 58.65 GB - 104 .svs slides, 6 zips (annotation
  masks downsampled x64, annotation XML, thumbnails, quality-assessment masks, 308 connected-component
  images), a summary CSV, label-description txt files and a README. The Data Descriptor (PMC12311038)
  gives 104 WSIs (308 tissue strips), 40x scans at 0.25 um/px (KFBIO scanners) or 0.23 um/px (Hamamatsu,
  one site), 10 annotation categories grouped into five histotypes, annotation with OpenHi by two pathologists.
  The paper uses patient-level five-fold cross-validation; no fixed split is shipped. enricher: formats
  other -> svs, png; voxel size 250 nm removed (slides differ: 0.25/0.23 um in paper, 0.2458 in one header).'
