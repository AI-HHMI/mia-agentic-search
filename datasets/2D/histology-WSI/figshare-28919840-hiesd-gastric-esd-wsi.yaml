notes: 'Figshare API record: CC BY 4.0, 114 files totalling 58.65 GB - 104 .svs slides, 6 zips (annotation masks
  downsampled x64, annotation XML, thumbnails, quality-assessment masks, 308 connected-component images), a
  summary CSV, label-description txt files and a README. The Data Descriptor (PMC12311038) gives 104 WSIs
  (308 tissue strips), 40x scans at 0.25 um/px (KFBIO scanners) or 0.23 um/px (Hamamatsu, one site), 10
  annotation categories grouped into five histotypes, annotation with OpenHi by two pathologists. Pixel
  size is recorded as 0.25 um (majority scanner); a minority of slides are 0.23 um. Format SVS is not in
  the format enum, hence other. The paper uses patient-level five-fold cross-validation; no fixed split
  is shipped. Annotation zip contents were not opened (names taken from the Figshare file list).'
