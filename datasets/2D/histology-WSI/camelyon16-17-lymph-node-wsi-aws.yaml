  of breast cancer patients from five Dutch centres, in the public S3 bucket camelyon-dataset: CAMELYON16
  (399 WSIs, 160 XML lesion annotations, 399 tumor and tissue masks) and CAMELYON17 (1,000 WSIs in five
  centres, 50 slides with XML annotations, 100 masks, slide and patient pN-stage labels in stages.csv).'
