notes: 'Bucket listed in full (3.74 TB): CAMELYON16 has 399 images (752 GB), 160 annotation XMLs, 399
  masks and 400 background-tissue files; CAMELYON17 has 1,000 images (2.97 TB), 50 XMLs, 100 masks and
  stages.csv (600 rows, training slides only). Training slides carry the reference standard and the test
  slides are released without it, so only part of the images is annotated; the CAMELYON16 README lists
  20 tumor slides whose annotations are not exhaustive. Pixel size is given only as a range, 0.23-0.25
  um, so voxel size is null. CC0 per the bucket license.txt and the registry. CAMELYON16 and CAMELYON17
  are one release of 1,399 WSIs. Related catalog records are different: zenodo-17549031 (CAMELYON16 context
  annotations) and zenodo-2546921 (PatchCamelyon patches). enricher: source mixed: tumor polygons/masks
  manual, mask label 1 (normal tissue) detected automatically (CAMELYON16 README).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "s3://camelyon-dataset/   2,521 objects, 3.74 TB\nCAMELYON16/\n  README.md  license.txt  checksums.md5\
      \  pathology-tissue-background-segmentation.json\n  images/{normal,tumor,test}_NNN.tif   399  752.5\
      \ GB  pyramidal TIFF, JPEG\n  masks/<stem>_mask.tif                399    9.4 GB  LZW, 1 normal\
      \ tissue, 2 tumor\n  annotations/<stem>.xml               160  ASAP XML polygons\n  background_tissue/<stem>_tissue.tif\
      \  399 (+ results.json)\n  evaluation/  evaluate.py, example.csv, ...\nCAMELYON17/\n  README.md\
      \  license.txt  checksums.md5  stages.csv\n  images/patient_NNN_node_N.tif       1000  2.97 TB\n\
      \  masks/patient_NNN_node_N_mask.tif    100    2.4 GB\n  annotations/patient_NNN_node_N.xml    50\n\
      \  evaluation/  evaluate.py, example.csv\n"
    n_files: 2521
    listing_complete: true
  sample:
    urls:
    - https://camelyon-dataset.s3.amazonaws.com/CAMELYON16/images/tumor_091.tif
    - https://camelyon-dataset.s3.amazonaws.com/CAMELYON16/masks/tumor_091_mask.tif
    - https://camelyon-dataset.s3.amazonaws.com/CAMELYON16/annotations/tumor_091.xml
    size_bytes: 554880131
    description: Smallest CAMELYON16 tumor slide with mask and XML (tumor_091, 546 MB)
  arrays:
  - role: raw
    path_pattern: CAMELYON1[67]/images/*.tif
    format: tiff
    axes: yxs
    shape:
    - 53760
    - 61440
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Pyramidal TIFF (tumor_091: Philips DP v1.0, Hamamatsu scan, 8 levels, level 0 53760x61440);
      axes for page 0, photometric 6 (YCbCr JPEG) = RGB colour. Level-0 pixel spacing from the ImageDescription
      DICOM_PIXEL_SPACING: 0.000226316 x 0.000226321 mm for tumor_091; varies per slide/centre.'
  - role: label
    path_pattern: CAMELYON1[67]/masks/*_mask.tif
    format: tiff
    axes: yx
    shape:
    - 53760
    - 61440
    shape_varies: true
    dtype: uint8
    compression: lzw
    value_range:
    - 0
    - 2
    normalization: unknown
    encoding: semantic-ids
    classes:
    - id: 0
      name: background
    - id: 1
      name: normal tissue
    - id: 2
      name: tumor
    alignment: same-grid
    alignment_notes: images/<stem>.tif <-> masks/<stem>_mask.tif; same level-0 shape, 8-level pyramid
      (lower levels sized slightly differently from the image pyramid). Classes per CAMELYON16 README;
      0 = not tissue/unannotated (inferred). Normal-tissue label missing for non-exhaustively annotated
      slides.
  - role: label
    path_pattern: CAMELYON1[67]/annotations/*.xml
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: polygons
    classes:
    - id: Tumor
      name: tumor
    - id: Exclusion
      name: exclusion
    alignment: same-grid
    alignment_notes: ASAP XML polygons (PartOfGroup Tumor / Exclusion); coordinates in level-0 pixels
      (tumor_091.xml X ~36000 within 61440 wide).
  - role: label
    path_pattern: CAMELYON17/stages.csv
    format: csv
    axes: null
    shape: null
    shape_varies: null
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: other
    classes: null
    alignment: not-applicable
    alignment_notes: Slide-level metastasis class and patient pN stage (600 rows, training slides).
  notes: 'Full bucket listing (tools/listing.py https://camelyon-dataset.s3.us-west-2.amazonaws.com/:
    2,521 objects, 3,738,640,190,043 B, complete, exact; equals the record). Probed tumor_091 image and
    mask and read all page shapes and the image ImageDescription (tifffile, range reads). Sampled the
    mask tumor_091_mask.tif (8,357,394 B): values {0,1,2}; value range from one sample. No slide pixels
    sampled (smallest tumor slide is 546 MB). Voxel size stays null: tumor_091 is 0.2263 um/px, the record
    states 0.23-0.25 um across centres. No single archive: download_url stays the S3 bucket; sample URLs
    use the global endpoint camelyon-dataset.s3.amazonaws.com (the us-west-2 host is not on the TensorSwitch
    allowlist).'
