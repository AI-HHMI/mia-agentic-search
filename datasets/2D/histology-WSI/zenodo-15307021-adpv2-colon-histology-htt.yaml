notes: 'One dataset hosted as three Zenodo records: Part I 15307021 (zips 1-12, 44.0 GB), Part II 15312384 (zips 13-17, 48.7 GB) and Part III 15312792 (zips 18-21, 35.8 GB), all CC BY-NC 4.0; size is the sum of the three API file lists. Listed colon_batch_12.zip (1,000 PNG plus 2 CSVs) and read the first annotation CSV header. Paper (open access): 20,004 patches picked from 125,808 non-background ones, annotated by one trained annotator supervised by a pathologist; pixel size 400 nm follows from 1360 px per 544 um. No official splits; the paper dropped the 110 TCGA slides for fine-tuning.'
