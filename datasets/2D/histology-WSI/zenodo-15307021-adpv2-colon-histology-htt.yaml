title: Atlas of Digital Pathology v2 - hierarchical multi-label tissue-type annotations of healthy colon histology patches
short_name: ADPv2 colon histology tissue types (H&E)
description: 20,004 non-overlapping 1360x1360 px (544 x 544 um) patches from H&E and HPS stained whole-slide images of healthy
  colon biopsies (461 slides from four sources), each annotated with a multi-label, 3-level taxonomy of 32 histological tissue types
  (about 10 labels per patch). Published as three Zenodo records (zips 1-12, 13-17, 18-21) with annotation and metadata CSVs.
