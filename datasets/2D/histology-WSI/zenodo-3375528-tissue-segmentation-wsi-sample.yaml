notes: 'Zenodo API file listing: 35 files, 44.5 GB: 10 WSI TIFFs (2-6 GB each), 10 ASAP XML annotation files and 15
  mask TIFFs (named e.g. tongue_hne_00_mask_cl6_sp0.5.tif; the cl/sp parts are not explained on the page). Only
  a sample of the full 100-WSI development set and 8-WSI dissimilar set described in the paper (read via Europe PMC):
  tissue outlined by medical students on the full-resolution image and checked by a pathology resident, in four
  annotation groups (tissue, background, edge artifacts, inner artifacts) with ASAP. Scanners and pixel sizes differ
  by centre (0.2275-0.5034 um in the paper); the pixel size of these specific sample slides is not stated, so voxel
  size is null. Dimensionality 2D (pyramidal WSIs). The paper''s train/validation/test split applies to the full
  dataset, not this sample. Organism left empty because the Zenodo page does
  not state it.'
