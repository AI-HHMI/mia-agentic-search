title: Breast Cancer Histology and Immunohistochemistry Image Dataset
short_name: Breast cancer H&E and IHC with masks (histology)
description: 55 brightfield fields of view (4096 x 3286 px, x10) from 11 breast cancer cases, five stains
  per case (H&E, ER, HER2, Ki-67, PR immunohistochemistry), each with a binary PNG mask (tumour cells,
  or only positive tumour cells for HER2 and Ki-67), and a per-case JSON with tumour profile, scores and
  image metadata.
