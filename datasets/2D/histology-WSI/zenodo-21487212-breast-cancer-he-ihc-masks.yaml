title: Breast Cancer Histology and Immunohistochemistry Image Dataset
short_name: Breast cancer H&E/IHC tumor-cell masks (histology)
description: 55 high-resolution (4096 x 3286 px) histology fields of view from 11
  breast cancer cases, each case with H&E and four IHC stainings (ER, PR, HER2, Ki-67)
  imaged at 10x, with a binary PNG mask per image (tumor cells; positive tumor cells
  only for HER2 and Ki-67) and per-case JSON metadata (tumor profile, receptor scores,
  antibodies).
