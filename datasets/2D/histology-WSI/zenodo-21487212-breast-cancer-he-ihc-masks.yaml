  notes: 'Listing: Zenodo API + zip central directory (121 members). Probed ER and H&E JPEGs (3286x4096x3
    uint8 RGB, lossy) and the ER mask (3286x4096 1-bit grey PNG, dtype bool, so binary). Sampled ID0001_ER_1.jpg:
    range 41-255, p50 240, mean 232 (mostly bright background); one sample only. tools/sample.py failed
    on the 1-bit mask (numpy bool percentile error), so mask pixel counts were not measured. ID0001.json
    read: patient age/sex, tumour profile, per-stain antibody (DAKO clones), positive-cell %, Allred /
    HER2 scores.'
