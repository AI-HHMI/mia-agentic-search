notes: 'Zenodo record and zip listed with peek_archive (121 files: 55 jpg, 55 png masks, 11 case JSON);
  one case JSON read (ID0001: invasive ductal carcinoma, five stains, x10, mask_type tumor_cells or only_positive_tumor_cells).
  No paper found (Europe PMC title search failed; no related identifiers on Zenodo). Annotation procedure,
  annotators, scanner/camera and pixel size are not stated. Modality histology-WSI is used as the closest
  schema value for H&E/IHC tissue images, though these are fields of view, not whole slides. CC BY-NC
  (non-commercial).'
