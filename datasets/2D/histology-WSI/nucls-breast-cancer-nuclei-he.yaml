notes: 'Data hosted on Google Drive folders linked from the NuCLS Google Sites pages (not opened, so file
  listing and total size not verified; annotation structure taken from the site''s data-format page).
  3,944 FOVs is the single-rater total stated in the paper. Publication date not stated on the pages read.
  enricher: splits_provided true: the QC folder has train_test_splits/ with 12 CSVs (fold_1_train.csv,
  fold_1_test.csv, ...) (was false). enricher: annotations.source stays mixed: QC folder = non-pathologist
  annotations corrected by pathologists, noQC = uncorrected (single-rater page). enricher: coverage partial:
  boxes for all nuclei, boundaries only for a fraction (description); masks do not distinguish boxes from
  segmentations (data-format page).'
