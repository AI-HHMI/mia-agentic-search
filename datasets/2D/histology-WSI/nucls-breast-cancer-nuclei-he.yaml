    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    encoding: other
    classes: null
    alignment: unknown
    alignment_notes: Paired with rgb/ by identical file name. Channel 1 = class label (incl. a special
      fov code for the annotation region), channel 2 x channel 3 = instance label (data-format page).
