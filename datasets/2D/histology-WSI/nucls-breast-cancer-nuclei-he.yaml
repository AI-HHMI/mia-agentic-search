  notes: 'Listed with the Drive embedded folder view (names only, no sizes): QC has 1744 files each in
    rgb/, mask/, csv/ plus 12 split CSVs; noQC subfolders not counted. Sample (one QC FOV): rgb png 368x378x3
    uint8, 19-243; mask png 367x378x3 uint8, 0-253, 36 unique values over all channels (n_ids_observed
    counts values, not decoded instances). Values from one sample. normalization none inferred (8-bit
    RGB scan tiles, no processing described). CSV not read. Direct files: drive.usercontent.google.com/download?id=<file
    id>&export=download serves them with range requests, but that host is not on TensorSwitch''s allowlist.
    No single archive; data.download_url stays the single-rater page. Record is 2D, out of the planner''s
    scope. Size pass: size estimated (uncompressed): raw 3944 x 368x378x3 uint8 + label 3935 x 367x378x3 uint8 = 3,283,538,958 B (3.3 GB); shapes vary, so approximate. Counts from the Drive embedded folder views: QC rgb/mask 1744/1744, noQC rgb/mask 2200/2191 png (raw 3944 = the paper''s single-rater total); CSVs left out.'
