schema_version: '1.2'
id: nucls-breast-cancer-nuclei-he
title: 'NuCLS: crowdsourced nucleus classification, localization and segmentation in breast cancer H&E images'
short_name: Breast cancer nuclei detection/segmentation (H&E)
description: Fields of view (FOVs) from TCGA triple-negative breast cancer H&E slides (125 patients), annotated
  by non-pathologists and pathologists with bounding boxes, class labels and, for a fraction of nuclei, segmentation
  boundaries. Single-rater sets (2,168 uncorrected FOVs; 1,744 pathologist-supervised corrected FOVs) and three
  multi-rater sets. Images at 0.2 microns per pixel, distributed as PNG images, CSV coordinates and PNG masks.
