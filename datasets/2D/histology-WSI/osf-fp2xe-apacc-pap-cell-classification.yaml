notes: 'OSF API (public project with folders dataset_sample and dataset_full) and the Scientific Data paper full text read:
  103,675 cell images (34,721 healthy, 2,942 unhealthy, 62,074 rubbish, 3,884 bothcells) from 21,371 smear slices of 107
