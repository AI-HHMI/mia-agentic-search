  notes: 'Listing: Zenodo API + zip central directories, 820 members, complete. Probed 2 ROI TIFF headers (1024x1024x4 uint8,
    uncompressed, plain). Sampled metastatic_roi_001.tif: range [10,255] (one sample); normalization none = 8-bit scanner
    RGB (inferred). GeoJSON read with peek_archive: nuclei roi_001 has 65+ Polygon features (classes seen: nuclei_tumor, nuclei_lymphocyte,
    nuclei_apoptosis; first 200 KB only); tissue roi_001 has 2 features (tissue_tumor, tissue_necrosis). Class names beyond
    those observed are from the Zenodo description and are written there without the nuclei_/tissue_ prefix; exact property
    strings for unobserved classes not verified. Voxel size 230 nm from Zenodo description and paper; z null (2D). Context-ROI
