notes: 'Size confirmed by Zenodo file listing (4 zips, 14,786,299,425 B). Record is v4; v5 (zenodo 15050523, 2025-03-19) re-adds
  metastatic_roi_103. Paper (GigaScience giaf011, PUMA dataset): 0.23 um/px at 40x; 103 primary + 103 metastatic public training
  ROIs, 104 ROIs held back for the PUMA challenge test sets. Nuclei: HoVer-Net (PanNuke) pre-segmentation, manually corrected
  in QuPath and reviewed by a dermatopathologist; tissue: manual. Hence source mixed: nuclei = proofread, tissue = manual.
  enricher: added paper, size_bytes from listing (was null), download_url = landing page (four zips, no single archive).'
