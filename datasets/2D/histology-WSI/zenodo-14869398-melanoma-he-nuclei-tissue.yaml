description: 205 H&E-stained primary and metastatic melanoma ROIs (1024x1024 px, 40x, 0.23 um/px) with GeoJSON annotations of nuclei (ten classes, HoVer-Net pre-labelled then corrected in QuPath) and tissue (six classes), reviewed by a dermatopathologist. Released for training nuclei and tissue segmentation models; 5120x5120 px context ROIs are also provided.
