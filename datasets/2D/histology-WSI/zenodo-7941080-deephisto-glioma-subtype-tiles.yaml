notes: 'Record has train.zip (19.2 GB), test.zip (2.1 GB) and readme.txt. test.zip was listed with peek_archive: 4,174 PNGs in
  test/astro 465, gbm 241, necro 90, normal 2947, oligo 431, matching the readme table; train.zip was not listed, the readme
  gives train counts astrocytoma 3755, glioblastoma 1633, oligodendroglioma 3384, normal brain 29383, necrosis 389 (about 38.5k
  tiles), so n_items (42,718) is the readme train total (38,544) plus the listed test total (4,174), and size_bytes is the sum of both zips and the readme (21.29 GB). Pixel size 0.25 um/px
  is the average slide resolution stated in the readme and paper. Labels come from region annotations by one pathologist; coverage is partial because only marked regions were tiled. Paper Methods and
  Data availability read (open access).'
