title: 'DeepHisto: Dataset for glioma subtype classification from Whole Slide Images'
short_name: DeepHisto glioma subtype H&E tiles
description: 512 x 512 px H&E tiles from whole slide images of 28 adult-type diffuse glioma cases and normal brain controls,
  labelled from pathologist region annotations as astrocytoma, glioblastoma, oligodendroglioma, normal brain or necrosis, with a
  patient-wise train/test split (about 19 GB train, 2 GB test).
