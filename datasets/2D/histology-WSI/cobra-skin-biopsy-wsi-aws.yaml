short_name: COBRA skin biopsy and resection slides (WSI)
description: '6,891 pyramidal-TIFF whole-slide images (0.5 um/pixel, JPEG) of skin biopsies and basal
  cell carcinoma resections from Radboud University Medical Center, in the public S3 bucket cobra-pathology:
  5,147 BCC-study biopsies with slide-level BCC and low/high-risk labels, 1,248 out-of-distribution biopsies
  with disease-type labels and 496 resections, 196 of them with tumor and epidermis TIFF masks and GeoJSON
  polygons. Also ships tissue masks, thumbnails and PRISM foundation-model embeddings.'
