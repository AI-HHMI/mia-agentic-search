notes: 'S3 bucket cobra-pathology (us-west-2, public, no sign-in) listed in full: packages/bcc 5,147 images
  (211 GB), packages/ood 1,248 (95 GB), packages/resections 496 (286 GB) plus embeddings, tissue masks
  and thumbnails; 814.1 GB in all, images 592.3 GB. Slide labels: bcc_bcc.csv 2,673 BCC and 2,474 non-malignant;
  bcc_risk.csv label counts 0: 2,474, 1: 1,901, 2: 772 (the meaning of labels 1 and 2 is not documented
  on the pages read). Labels were extracted from pathology reports by rules; resection masks are manual
  (196 TIFF masks). Licence conflict: bucket LICENSE, README and AWS registry say CC BY-NC-SA 4.0, the
  Zenodo toolkit record (20266768) says dataset CC BY 4.0; the bucket terms are recorded. Pixel size 0.5
  um from the Zenodo record text; the bucket README says the 0.24 um level was dropped. Stain and scanner
  are not stated on the pages read; the paper is closed access (abstract only).'
