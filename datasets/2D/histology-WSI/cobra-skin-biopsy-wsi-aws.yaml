  notes: 'Full listing of the bucket (tools/listing.py https://cobra-pathology.s3.amazonaws.com/: 42,015
    objects, 814,149,558,738 B, complete, exact; the harvest figure 814,129,151,597 B omitted ~20 MB).
    Probed headers of resection 278c508e (image + mask) and the smallest BCC biopsy, and read all page
    shapes with tifffile. Sampled the mask 278c508e (226,524 B): values 0-3, counts in the read region
    {0: 19833727, 1: 11454, 2: 142, 3: 7063}; value range from one sample. No raw pixels sampled (smallest
