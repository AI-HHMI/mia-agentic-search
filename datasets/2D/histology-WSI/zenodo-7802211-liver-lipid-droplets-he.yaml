title: Dataset for "Segmentation of Lipid Droplets in Histological Images"
short_name: Lipid droplet segmentation in H&E histology
description: Lipid-vacuole (fat droplet) segmentation labels for 54 H&E whole-slide images (19 in dataset A, 35 in dataset B),
  plus 700 manually corrected 256x256 patches with masks from dataset B, and the nnU-Net models and code from a MIDL
  2023 short paper. The whole-slide images of A and B are hosted in two other deposits.
