notes: 'Per the README and zip listings: Labels_Dataset_A.zip (19 droplet-mask TIFFs for FAIRDOMhub WSIs), Labels_Dataset_B.zip
  (masks for 35 WSIs of 10.5281/zenodo.4738561), Corrected_Subset_B.zip (2,800 .nii.gz: 700 256x256 patches x 3 colour
  channels plus 700 manually corrected label images) and Segmentation_Network.zip (code, 5 nnU-Net fold models). WSI masks
  are semi-automatic, so source is mixed; only the 700 patches ship with images, so n_items counts them. The MIDL 2023 paper
  was read as an abstract only, so scanner, pixel size and species are not stated (file names contain Bl6J, a mouse strain,
  not a stated species). No split provided.'
