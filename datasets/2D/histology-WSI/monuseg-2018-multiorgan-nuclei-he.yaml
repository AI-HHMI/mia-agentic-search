notes: 'Data page states 30 training images (about 22,000 boundaries, 40x, TCGA) and 14 test images (about 7,000 boundaries; released to teams submitting methodology manuscripts, so test annotations may not be openly downloadable). Download is via Google Drive links that were not accessible, so the file listing, image format and pixel size are not verified (formats is other). Paper full text is not open access; only the abstract (more than 21,000 annotated nuclei, validated by a medical doctor) was read. The license is stated on the Data page as CC BY-NC-SA 4.0. Digitised H&E slides, so modality is histology-WSI (image patches).'
