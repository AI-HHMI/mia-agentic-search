  notes: 'Drive links from the Data page; the virus-scan page''s form points to drive.usercontent.google.com/download?...&confirm=t,
    which serves the zips with range requests. Listing of all 5 files is exact (189,375,166 B); zip central
    directories read with peek_archive. Headers: training tif TCGA-G9-6348 uint8 RGB 1000x1000, LZW; test
    tif TCGA-HT-8564 uint8 RGB 1000x1000, PackBits. sample.py could not open the zip member (it read the
    URL as HDF5), so no value ranges. XML annotations read: Region/Vertex polygons per nucleus; MicronsPerPixel
    differs per file (0.2462, 0.2520, 0.2525, 0.2527 seen), so voxel_size_nm stays null. Direct whole-dataset
    files are the two zips (training, test), on a host TensorSwitch does not allow yet.'
