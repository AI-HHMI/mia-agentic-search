notes: 'Read the Zenodo API record (41 files, 48.3 GB: 40 per-patient tar.gz and a curated CSV) and the
  arXiv paper (HTML version; the published Medical Image Analysis version is not open access). Ranged-read
  the start of CRC07.tar.gz: it holds CRC07/HE/<class>_<x>_<y>.png patches (about 6 KB each); the mask
  folder and CSV columns (patient, class, cx, cy, mask) were seen in the CSV only, so mask files were
  not directly listed (enricher: mask/ PNGs now seen in CRC05.tar.gz, annotations_verified true). Masks
  are generated automatically with Segment Anything and labels by a classifier on immunofluorescence-derived
  labels (>95% softmax), not manually verified in the final version V1; a first iteration was manually
  reviewed by three non-pathologist authors. Pixel size 0.325 um from the paper. The paper reports one
  patient held out for evaluation but no formal split files.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./   41 files  48.3 GB  .tar.gz 40 (CRC01..CRC40, 258 MB - 3.96 GB), .csv 1 (curated_ImmunoctoV1_refinement2.csv,\
      \ 310,516,995 B)\nCRC<nn>.tar.gz contents (order as streamed from CRC05.tar.gz):\n  CRC<nn>/HE/<class>_<cx>_<cy>.png\
      \     H&E patches, 64x64 RGB (CRC05: 40,635 files)\n  CRC<nn>/mask/<class>_<cx>_<cy>.png   cell\
      \ masks, 64x64 binary, same names as HE/\nclasses in names and CSV: cd4, cd8, bcell, macrophage,\
      \ other"
    n_files: 41
