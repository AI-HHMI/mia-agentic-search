short_name: Immunocto immune cell patches (H&E)
description: 6,848,454 single-cell 64x64 px H&E patches at 40x from colorectal cancer sections of 40 patients,
  each with a binary nucleus mask and a label (2,282,818 immune cells in four subtypes - CD4 T, CD8 T,
  B cells, macrophages - and 4,565,636 other cells), generated automatically with Segment Anything and
  labels derived from co-registered Orion multiplex immunofluorescence.
