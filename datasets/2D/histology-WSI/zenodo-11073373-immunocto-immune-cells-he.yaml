    classes:
    - id: cd4
      name: cd4
    - id: cd8
      name: cd8
    - id: bcell
      name: bcell
    - id: macrophage
      name: macrophage
    - id: other
      name: other
    alignment: not-applicable
    alignment_notes: Columns patient,class,cx,cy,mask; mask is the patch/mask file name inside CRC<patient>.tar.gz.
  notes: 'Listing: listing.py on the Zenodo record (41 files, 48,346,513,642 B exact); tar.gz members
    cannot be listed by range. A scratch tarfile script streamed CRC05.tar.gz (smallest, 258,244,408 B):
    1 MB head gave 159 HE patches, all 64x64 RGB uint8, values 70-255; streaming 251.9 MB compressed reached
    CRC05/mask/ after 40,635 HE files, and 12 masks were all 64x64 uint8 L with values {0, 255}. Value
    ranges from these files only. Classes seen in CRC05 names: other 1626, macrophage 472, cd4 202, cd8
    87, bcell 26 of the first 2,413. sample is null: each patient is one tar.gz and TensorSwitch cannot
    pull single tar.gz members. Voxel size 325 nm from the paper (unchanged); PNGs carry no pHYs.'
