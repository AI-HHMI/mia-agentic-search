    classes: null
    alignment: same-grid
    alignment_notes: 'Pairing rule: CRC<nn>/mask/<name>.png pairs with CRC<nn>/HE/<name>.png (same file
      name, same 64x64 grid). Mask of the centre cell (Segment Anything per the paper); the class is the
      name prefix.'
  - role: label
    path_pattern: curated_ImmunoctoV1_refinement2.csv
    format: csv
    axes: null
    shape: null
    shape_varies: false
    dtype: unknown
    compression: none
