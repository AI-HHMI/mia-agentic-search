notes: 'Read the Zenodo API record (41 files, 48.3 GB: 40 per-patient tar.gz and a curated CSV) and the arXiv paper (HTML version; the published Medical Image Analysis version is not open access). Ranged-read the start
  of CRC07.tar.gz: it holds CRC07/HE/<class>_<x>_<y>.png patches (about 6 KB each); the mask folder and CSV columns (patient, class, cx, cy, mask) were seen in the CSV only, so mask files were not
  directly listed. Masks are generated automatically with Segment Anything and labels by a classifier on immunofluorescence-derived labels (>95% softmax), not manually verified in the final version V1; a first iteration was manually reviewed by three
  non-pathologist authors. Pixel size 0.325 um from the paper. The paper reports one patient held out for evaluation but no formal split files.'
