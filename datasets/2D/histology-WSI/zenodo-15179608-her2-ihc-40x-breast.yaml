title: 'HER2-IHC-40x: High-Resolution Histopathology Image Dataset for HER2 Scoring in Breast Cancer'
short_name: Breast cancer HER2 IHC patches (40x)
description: 1024 x 1024 px patches cut from pathologist-annotated tumour regions of 107 HER2-stained breast cancer whole-slide images
  (40x, 3DHistech Pannoramic DESK), each patch labelled with its HER2 score (0, 1+, 2+, 3+). Two variants are provided, a WSI-level 80/20 split
  (9,940 patches) and a patch-level 80/20 split (10,997 patches).
