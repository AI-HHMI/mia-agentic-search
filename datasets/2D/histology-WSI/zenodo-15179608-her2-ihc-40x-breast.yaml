notes: 'Two zips (her2-ihc-40x-patch.zip 1.65 GB with Patch-based-dataset/{train,test}_data_patch.zip; her2-ihc-40x-wsi.zip 1.51 GB with WSI-based-dataset/{train,test}_data_wsi.zip), each holding nested zips that cannot be listed remotely, so image format and class folders were not checked directly. The paper says patches are .png in its folder table and .jpg in its data-format row, hence both formats listed. Only patch-level data are public: the paper says the .svs WSIs and ROI .png files are not released, although the Zenodo description lists WSI/ and ROI/ folders. Pixel size not stated (3DHistech scanner at 40x). Patch counts: 9,940 (8,093 train / 1,847 test) for the WSI-level split and 10,997 (8,897 / 2,200) for the patch-level split, both from the same 107 slides, so the two zips overlap. Related datasets in this series: HER2-SISH40x (Kaggle, same group).'
