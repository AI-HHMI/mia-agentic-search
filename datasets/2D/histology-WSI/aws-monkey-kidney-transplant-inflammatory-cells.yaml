notes: 's3://monkey-training/ (us-west-2, anonymous): 902 files, 118.2 GB by full listing; images/{pas-cpg,pas-diagnostic,pas-original,ihc,tissue-masks}
  pyramidal BigTIFF, annotations/{json_pixel,json_mm,xml}. CC BY-NC-SA 4.0 per registry and report. Zenodo report 13794656:
  231 annotated ROIs; annotations lie on PAS-CPG scans, others registered. Dots cover ROIs only (partial). No journal paper
  yet. enricher: voxel size 242 nm from TIFF XResolution (41,322 px/cm) and json_pixel/json_mm ratio, consistent with the
  report''s rounded 0.24 um (was 240). enricher: n_items 81 cases in the listing (A 26, B 17, C 20, D 18; was 80). enricher:
  download_url = bucket root (no single archive).'
technical:
  method: header
  size_source: file-listing
  layout:
    tree: "s3://monkey-training/  902 files  118.2 GB (S3 listing, exact sizes)\n  ReadMe.txt\n  annotations/json_pixel/ \
      \  243 files  27.0 MB  <case>_{inflammatory-cells,lymphocytes,monocytes}.json\n  annotations/json_mm/      243 files\
      \  30.0 MB  same, coordinates in mm\n  annotations/xml/           81 files  18.1 MB  <case>.xml (ASAP dots)\n  images/pas-cpg/\
      \            81 files  43.1 GB  <case>_PAS_CPG.tif\n  images/pas-diagnostic/     69 files  27.2 GB  <case>_PAS_Diagnostic.tif\n\
      \  images/pas-original/       18 files   2.7 GB  <case>_PAS_Original.tif\n  images/ihc/                81 files  41.8\
      \ GB  <case>_IHC_CPG.tif\n  images/tissue-masks/       81 files   3.2 GB  <case>_mask.tif\n  metadata/context-information.xlsx\n\
      \  (+3 .DS_Store files)"
    n_files: 902
    listing_complete: true
  sample:
    urls:
    - https://monkey-training.s3.us-west-2.amazonaws.com/images/pas-cpg/D_P000019_PAS_CPG.tif
    - https://monkey-training.s3.us-west-2.amazonaws.com/images/tissue-masks/D_P000019_mask.tif
    - https://monkey-training.s3.us-west-2.amazonaws.com/annotations/json_pixel/D_P000019_monocytes.json
    - https://monkey-training.s3.us-west-2.amazonaws.com/annotations/json_pixel/D_P000019_lymphocytes.json
    size_bytes: 149812180
    description: Smallest PAS-CPG WSI (D_P000019, 137 MB), its ROI tissue mask and its monocyte and lymphocyte dot files (pixel
      coordinates)
  arrays:
  - role: raw
    path_pattern: images/pas-cpg/*_PAS_CPG.tif
    format: tiff
    axes: yxs
    shape:
    - 66560
    - 42240
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Pyramidal tiled BigTIFF: 7-9 reduced-resolution pages (2x steps), 256 px tiles, YCbCr JPEG (RGB colour);
      shape is level 0 of D_P000019. Annotation reference grid.'
  - role: raw
    path_pattern: images/pas-diagnostic/*_PAS_Diagnostic.tif
    format: tiff
    axes: yxs
    shape:
    - 91648
    - 97792
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    normalization: unknown
    alignment: unknown
    alignment_notes: Second scan profile of the same slide (A_P000020 probed); ReadMe says registered to PAS-CPG, but no transform
      file was found and the level-0 shape differs.
  - role: raw
    path_pattern: images/pas-original/*_PAS_Original.tif
    format: tiff
    axes: yxs
    shape:
    - 73216
    - 41984
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    normalization: unknown
    alignment: unknown
    alignment_notes: Scan from the centre of origin (D_P000001 probed); ReadMe says registered to PAS-CPG; no transform file
      found.
  - role: raw
    path_pattern: images/ihc/*_IHC_CPG.tif
    format: tiff
    axes: yxs
    shape:
    - 66560
    - 42240
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    normalization: unknown
    alignment: unknown
    alignment_notes: IHC double-stain restain (monocytes red, lymphocytes brown); D_P000019 level 0 has the PAS-CPG shape,
      10 pages; ReadMe says registered to PAS-CPG.
  - role: label
    path_pattern: images/tissue-masks/*_mask.tif
    format: tiff
    axes: yx
    shape:
    - 66560
    - 42240
    shape_varies: true
    dtype: uint8
    compression: lzw
    encoding: binary
    classes: null
    alignment: same-grid
    alignment_notes: ROI tissue mask, same level-0 shape, pyramid and XResolution as <case>_PAS_CPG.tif (D_P000019); binary
      per ReadMe (values not sampled). Pairs by case id.
  - role: label
    path_pattern: annotations/json_pixel/*_*.json
    format: json
    axes: null
    shape:
    - 177
    - 2
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: points-table
    classes:
    - id: monocytes
      name: monocyte
    - id: lymphocytes
      name: lymphocyte
    - id: inflammatory-cells
      name: inflammatory cell (union of both)
    alignment: same-grid
    alignment_notes: 'Grand-challenge "Multiple points" JSON: points[].point = [x, y] in PAS-CPG level-0 pixels, plus rois
      (polygons) and area_rois; one file per class per case (class in the file name). D_P000019: 177 monocytes, 104 lymphocytes,
      281 inflammatory cells. json_mm holds the same points in mm.'
  - role: label
    path_pattern: annotations/xml/*.xml
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: points-table
    classes: null
    alignment: same-grid
    alignment_notes: 'ASAP XML: Annotation Type="Dot", PartOfGroup lymphocytes / monocytes, integer X/Y in PAS-CPG level-0
      pixels.'
  notes: 'Header inspection: full S3 listing (902 files, 118,154,331,255 bytes, exact); TIFF headers of PAS-CPG, tissue mask
    and IHC for D_P000019 and PAS-CPG A_P000001, PAS-Diagnostic A_P000020, PAS-Original D_P000001 read by range (all pages
    listed); point JSONs and one XML of D_P000019 read whole (87 KB). No pixel sample: each level-0 page decodes to several
    GB, so value_range and mask values were not measured. All six WSIs carry XResolution 41,322 px/cm = 0.242 um/px; json_pixel/json_mm
    ratio gives 0.2420 um/px too. TIFF pages are pyramid levels, not z (axes yxs = level 0). Registration of the other scans
    to PAS-CPG is stated in the ReadMe but no transform files exist in the bucket. Not download-ready: 2D is outside the miao
    layout; host monkey-training.s3.us-west-2.amazonaws.com is not on the TensorSwitch allowlist. No single archive: files
    are per-object in the public bucket.'
