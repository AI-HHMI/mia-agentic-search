notes: 's3://monkey-training/ (us-west-2, anonymous): 903 objects, 118.2 GB by full
  listing; images/{pas-cpg,pas-diagnostic,pas-original,ihc,tissue-masks} pyramidal
  BigTIFF (PAS_CPG probe: 95744x97536, 9 pages, JPEG), annotations/{json,json_mm,xml}.
  80 WSIs, CC BY-NC-SA 4.0 per registry and report. Zenodo report 13794656: 0.24 "mm"/pixel
  (read as 0.24 um), 231 annotated ROIs, ~350 lymphocyte and 180 monocyte dots per
  WSI; annotations lie on PAS-CPG scans, others registered. Dots cover ROIs only (partial).
  No journal paper yet, publications empty; pixel size from report, not file headers.'
