  PAS-stained kidney transplant biopsies'
short_name: Kidney biopsy inflammatory cell dots (PAS WSI)
description: 'Training data of the MONKEY challenge: 80 PAS whole-slide images of
  kidney transplant biopsies from four pathology institutes (several scan profiles
  per case, plus IHC double-stain restains), with dot annotations of monocytes and
  lymphocytes in annotated regions of interest, tissue masks and context metadata,
  hosted on AWS Open Data.'
