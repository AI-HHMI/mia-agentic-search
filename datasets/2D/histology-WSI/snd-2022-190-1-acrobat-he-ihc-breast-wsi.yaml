title: 'ACROBAT: A Multi-Stain Breast Cancer Histological Whole-Slide-Image Data Set'
short_name: ACROBAT paired H&E/IHC breast WSIs (histology)
description: 4,212 whole-slide images from 1,153 breast cancer patients (routine diagnostics, Hamamatsu scanners), each
  patient with one H&E slide and one to four IHC slides (ER, PGR, HER2, KI67), as pyramidal TIFFs from 10x (about 0.92 um/pixel) down.
  Built for the MICCAI 2022 ACROBAT whole-slide registration challenge, with a split of 750 training, 100 validation and 303
  test cases; the paper describes over 35,000 landmark pairs for validation and test pairs and suggests stain transfer and virtual staining as further uses.
