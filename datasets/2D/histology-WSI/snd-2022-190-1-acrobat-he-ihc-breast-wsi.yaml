notes: 'The SND record lists seven image ZIPs (5 train, 1 validation, 1 test, 448.6 GB in total from the listed sizes) plus a metadata CSV, ZIP file lists and
  checksums; no landmark files are in that listing. The paper says landmarks (35,760 pairs) exist only for validation and test image pairs and none for training data,
  but where those landmark files are published was not found on the SND page, the paper or the GitHub repo (which holds protocols and code), so annotations.present is false
  here. The usable training signal is the paired multi-stain WSIs themselves (registration, stain transfer, virtual staining, as the paper suggests), and the training split is
  the bulk of the data. ZIP contents were not listed (the archives are tens of GB; format taken from the paper and SND record). Pixel size 0.92 um is the 10x level stated in
  the paper (originals were scanned at about 0.23 um/pixel but are not distributed). The SND record asks to be notified of publications, which is not mandatory.'
