notes: 'The SND record lists seven image ZIPs (5 train, 1 validation, 1 test) plus a metadata CSV, ZIP file lists
  and checksums; no landmark files are in that listing. The paper says landmarks (35,760 pairs) exist only for validation
  and test image pairs and none for training data, but where those landmark files are published was not found on
  the SND page, the paper or the GitHub repo (which holds protocols and code), so annotations.present is false here.
  The usable training signal is the paired multi-stain WSIs themselves (registration, stain transfer, virtual staining,
  as the paper suggests), and the training split is the bulk of the data. ZIP contents listed by the enricher. Pixel
  size: 0.9073 um from the TIFF header (paper: ca. 0.92 um at 10x; originals were scanned at about 0.23 um/pixel
  but are not distributed). enricher: voxel 920 -> 907.338 nm (TIFF MPP), size from the full listing.'
