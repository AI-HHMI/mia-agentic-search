title: A Pan-Cancer PDX Histology Image Repository with Genomic and Pathologic Annotation
short_name: PDXNet PDX and tumour H&E slides (NCI IDC)
description: More than 1,000 patient-derived xenograft H&E whole slide images plus matched human progenitor tumour slides from the NCI PDXNet programme, converted to DICOM and distributed through the NCI Imaging Data Commons; the Zenodo record holds the download manifests. Most slides carry slide-level pathologist assessments and a subset has pathologist tumour, stroma and necrosis region annotations.
