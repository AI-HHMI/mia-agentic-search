notes: 'The Zenodo record only holds three download manifests (s5cmd for AWS and GCS, one DCF) pointing
  at the NCI Imaging Data Commons. The paper reports 1,094 slides from 351 PDX models, hosted on the Seven
  Bridges CGC; pathologist region annotations (LUSC 15, lung adenocarcinoma 18, breast 8) and HoVer-Net
  outputs are on CGC, not in the IDC manifest. enricher: the v24 AWS manifest lists 919 DICOM series (one
  slide each, 125.6 GB); n_items and size_bytes now follow it (were 1,094 / null). Slide-level tumour,
  necrosis and stroma percentages for 885 slides are in the JAX metadata CSV linked from Zenodo. voxel
  size set to null (was 500 nm): 20x and 40x slides mix (paper), DICOM PixelSpacing 0.5027 and 0.5006
  um in the two series read. organisms: SeriesDescription "Human, ..." = patient progenitor tumour, "Model
  PDX, ..." = PDX grown in mice.'
