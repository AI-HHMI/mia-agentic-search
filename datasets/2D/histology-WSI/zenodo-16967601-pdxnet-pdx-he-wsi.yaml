  notes: 'Listing: Zenodo API (3 manifests), the AWS manifest (919 series) and one S3 ListObjectsV2 per
    series prefix (5,420 objects, 125,612,611,930 B, exact sizes; summed outside tools/listing.py, so
    size_source unknown). 919 series matches the 919 PDMR rows of the JAX metadata CSV, so IDC v24 likely
    holds only the PDMR slides (not verified per slide). Headers read (pydicom, about 150 KB-1.7 MB per
    instance by range) for all instances of series 0018558f (PDX) and 4641d976 (human): SM, RGB uint8,
    level 0 JPEG baseline (1.2.840.10008.1.2.4.50), others explicit VR little endian. Voxel size not set:
    PixelSpacing differs between slides (0.5027 vs 0.5006 um) and 40x slides exist (WUSTL, WISTAR per
    paper). Annotations not verified: the region annotations are on the Seven Bridges CGC (registration),
    only slide-level percentages are open. Direct files: https://idc-open-data.s3.amazonaws.com/<series>/<instance>.dcm
    (no single archive).'
