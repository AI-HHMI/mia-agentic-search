notes: 'The Zenodo record only holds three download manifests (s5cmd for AWS and GCS, one DCF) pointing at the NCI Imaging Data Commons (idc-index / idc download); the images were not listed here, so annotation files were not seen in a file listing. The paper reports 1,094 slides from 351 PDX models, hosted on the Seven Bridges CGC; pathologist region annotations on LUSC n=15, lung adenocarcinoma n=18 and breast n=8; HoVer-Net outputs are automatic. 20x is 0.5 um per pixel, but WUSTL and WISTAR slides were scanned at 40x so pixel size varies. Genomic and clinical metadata are at the PDXNet portal.'
