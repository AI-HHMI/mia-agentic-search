notes: 'The Zenodo description is a single line ("plasma cell/other, 224x224 pixels at 40x magnification
  ... will be updated soon"); no paper is linked and none was found, so no Methods were read. Header of
  image_array_patch_size=224.npy read by range request (shape 8823x224x224x3 uint8). The first annotation.json
  entries show slide_id (A_Train_12.svs), centroid, contour and class_id Plasmacell; the full set of class
  names was not checked. Pixel size, annotator and source of the slides are not stated. Data are NumPy
  files, so formats is other. Only the first part of annotation.json was read. enricher: full annotation.json
  parsed (Plasma cell 2725 / Other 6098, 20 slides); contours are in slide coordinates.'
