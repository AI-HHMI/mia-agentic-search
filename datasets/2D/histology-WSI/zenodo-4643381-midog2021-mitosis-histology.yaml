title: MIDOG 2021 training data (mitotic figure detection across whole slide image scanners)
short_name: Breast cancer mitotic figures (histology WSI)
description: 200 H&E-stained human breast cancer cases from one laboratory (UMC Utrecht), each provided
  as a 2.0 mm2 region of interest scanned on one of four scanners (50 per scanner), with MS COCO bounding-box
  annotations of mitotic figures and hard-negative non-mitotic look-alikes. Released for the MICCAI MIDOG
  2021 scanner-domain-generalization challenge.
