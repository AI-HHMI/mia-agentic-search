notes: 'The Hugging Face repo is gated with automatic approval (click-through, login needed), so the archive
  contents could not be read (the README resolves without login); the file listing shows tar parts (total
  size from the HF API) plus a loader script, so the png format is taken from the GitHub usage example
  and is unverified. Counts, class numbers, the 20x patch layout and the annotation procedure (pathologist-drawn
  regions, similarity-search retrieval, then per-patch pathologist verification, hence mixed) come from
  the SPIDER paper. The paper says patches come from proprietary HistAI slides; pixel size and scanners
  are not stated in the paper or GitHub README. License CC-BY-NC-4.0 is from the HF tag and GitHub README
  (the paper footer shows a different CC variant). enricher: class count 14 -> 13 and class names from
  the README table. Sibling organ sets (skin, colorectal, thorax, breast) are separate repositories and
  records.'
