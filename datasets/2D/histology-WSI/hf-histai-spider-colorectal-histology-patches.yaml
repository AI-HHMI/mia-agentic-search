  77,182 expert-verified central patches (224x224 px at 20x, H&E) in 13 classes from 1,719 whole-slide
  images, each with 24 surrounding context patches forming a 1120x1120 region (1,039,150 unique patches
  in total). Slide-level train/test split (63,989 train / 13,193 test central patches).'
