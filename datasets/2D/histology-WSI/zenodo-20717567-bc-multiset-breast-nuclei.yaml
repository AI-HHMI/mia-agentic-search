id: zenodo-20717567-bc-multiset-breast-nuclei
title: 'BC-MultiSet: A Multi-Task Dataset for Nucleus Segmentation, Classification, and Receptor Status
  Prediction in Invasive Breast Carcinoma'
short_name: Breast carcinoma H&E nuclei (BC-MultiSet)
description: 5,586 H&E-stained image patches (256 x 256 px, 40x) from whole-slide images of 50 invasive
  breast carcinoma patients, with per-nucleus polygon annotations for three classes (tumor, fibroblast,
  inflammatory cells), 109,180 nuclei in total, labelled by two pathologists and reconciled by consensus.
  Organized into four cross-validation folds, with patient-level clinical and molecular data (ER, PR,
  HER2, subtype, Ki67, TILs, grade, age).
