title: 'OCELOT: Overlapped Cell on Tissue Dataset for Histopathology'
short_name: OCELOT cell and tissue annotations (H&E histology)
description: H&E histopathology patch pairs from 304 TCGA whole-slide images (bladder, endometrium, head-and-neck,
  kidney, prostate, stomach), each with a small field-of-view patch (1024 x 1024) carrying tumor/background
  cell point annotations and a larger overlapping field-of-view patch (4096 x 4096) with cancer-area tissue
  masks. About 113K annotated cells; train/validation/test splits provided (v1.0.1).
