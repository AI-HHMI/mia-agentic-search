notes: 'No license is given in the Zenodo metadata or on the challenge/Lunit pages; the challenge page and Lunit
  page say the data requires agreeing to Terms and Conditions before download, which were not read. The zip
  (v1.0.1) holds 1326 JPG patches, 663 cell CSV files, 663 PNG tissue masks and one metadata JSON (663 pairs;
  v1.0.1 dropped 4 under-annotated test cases from the 667 pairs described on the challenge page). Pixel
  size 0.2 um/px from the challenge page. Earlier versions (e.g. zenodo 7844149) are deprecated and
  access-restricted. The CVPR paper full text is not open access in Europe PMC; only the abstract/metadata
  and the dataset pages were read. Splits (train 400, val 137, test 130 per challenge page) are by folder.'
