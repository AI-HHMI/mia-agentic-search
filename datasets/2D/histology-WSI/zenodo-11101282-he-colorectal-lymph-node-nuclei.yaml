notes: 'The Zenodo description is one line ("neoplastic/non-neoplastic, 224x224 pixels at 40x magnification ... will be updated
  soon"); no paper is linked and none was found. Header of image_array_PA1 read by range request (shape 29794x224x224x3 uint8);
  the other seven arrays were not opened, so n_items is null. annotation.zip lists annotation_PA1..PA8.json (peek_archive, 318.7 MB
  uncompressed); the JSON contents and class names were not read. By analogy with the sibling record 11101664
  the JSON probably holds contours and class ids, but this was not verified here. Pixel size, annotator and slide source
  are not stated. NumPy data, so formats is other.'
