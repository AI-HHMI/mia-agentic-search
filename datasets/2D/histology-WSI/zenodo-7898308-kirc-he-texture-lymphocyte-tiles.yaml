notes: 'tissue_classification.zip: 52,713 PNGs (empty 16,026, cancer 13,057, normal 8,652, other 8,522, stroma 5,460, blood 996). binary_lymphocytes.zip: 25,096 PNG entries (tumor 20,092, immune 5,004); Zenodo text and paper say 20,092 low and 5,003 high. Labels are the folder names, read from the zip central directories; zips not unpacked. Pixel size: the paper states ~0.25 "mm/px" (typo for um) for both cohorts, so 250 nm comes from the paper, not tile headers. Tiles are PNG crops, not the whole-slide files. The record also holds two ResNet-18 .pth weight files; download_url is null because it has several files.'
