title: OSCC Primary Tumor and Lymph Node Metastasis Segmentation Dataset
short_name: Oral SCC and lymph node H&E tumor masks
description: Digitized histopathology images of primary oral cavity squamous cell carcinoma (550 H&E images plus 55 cytokeratin-stained
  tumor images) and 167 H&E cervical lymph node images from elective neck dissections, with binary tumor masks manually
  drawn by one experienced board-certified pathologist (cytokeratin slides guided delineation of occult metastases
  in 57 lymph node cases). TIFF images and single-channel TIFF masks, 772 image/mask pairs, no predefined splits.
