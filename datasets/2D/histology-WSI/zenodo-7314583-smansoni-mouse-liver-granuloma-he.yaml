notes: 'Zip listing (peek_archive): 33 members in folders 2AH.1-2AH.5 (one per mouse): 11 H&E .czi each with a matching
  .annotations file, 10 trichrome .czi, and README.txt. Paper Methods: 5-17 granulomas per liver were annotated
  and their area quantified in HALO; scans at 0.22 um/pixel on a Zeiss Axio Scan.Z1. organisms: Mus musculus = every
  slide (host liver); Schistosoma mansoni = the eggs inside the granulomas, same files. This is dataset 3 of 11
  Zenodo deposits of the same study (one per cage and cross); the other deposits were not proposed. n_items counts
  the czi slides. enricher: README and one .annotations read (deflate64 inflated): HALO XML polygons, one per granuloma
  around a single egg; manual (README).'
