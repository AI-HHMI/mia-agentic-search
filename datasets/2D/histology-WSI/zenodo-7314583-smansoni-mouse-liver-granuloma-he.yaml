id: zenodo-7314583-smansoni-mouse-liver-granuloma-he
title: Mice infected with High shedder S. mansoni parasites from cross A - cage 2 - Liver histopathology data.
short_name: Mouse liver schistosome granulomas (H&E WSI)
description: Whole-slide images of liver sections from five BALB/c mice infected with the high-shedder Schistosoma
  mansoni line (cross A, cage 2). For each mouse there are H&E slides with annotation files marking the granuloma
  areas around parasite eggs, plus Masson's trichrome slides used for fibrosis and egg counts. Scanned on a Zeiss
  Axio Scan.Z1 at 0.22 um/pixel.
