description: Whole-slide digital pathology images (Aperio .svs) of blood clots retrieved by mechanical thrombectomy from adult acute ischemic stroke patients. Slides are sorted into folders by clot origin class (cardioembolic / large artery atherosclerosis, other determined causes, unknown), giving slide-level classification labels for stroke-origin prediction.
