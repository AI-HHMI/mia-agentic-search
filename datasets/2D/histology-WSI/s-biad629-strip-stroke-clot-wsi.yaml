notes: 'Labels are slide-level clot-origin classes encoded as folders under Files/STRIP/ (CE_LAA about 1022 slides, Other about 66; Unknown folder listing timed out, study reports 1425 files in total). The CE and LAA classes share one folder, so they are not separable from the listing. No associated paper was found by tools/paper.py (title search), so annotation procedure, split and pixel size are not stated on the study page. Pixel size is not on the study page; Aperio headers were not inspected. Sources checked: BioStudies study record, FTP file listing. Image-level classification only, not segmentation.'
