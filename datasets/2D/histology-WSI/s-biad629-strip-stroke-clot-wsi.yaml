notes: 'Labels are slide-level clot-origin classes. bioimage_file.tsv/.json give Origin_Label per slide: CE 733,
  LAA 289 (both in folder CE_LAA/), Other 66, Unknown 337; 1425 slides, 1195 case_id values (several slides per
  patient), center_ID 1-12 (null for 403). No associated paper found (tools/paper.py title search). Annotation procedure
  and splits not stated. enricher: stain is MSB per the study Specimen section (short_name said H&E). enricher:
  voxel size 518.135 nm from the SVS headers (MPP = 0.518135, same in 6 files from 5 centers; was null). The study
  page states nominal 0.5 um/pixel at 20x for an Aperio scanner, but the headers name a Motic scanner. enricher:
  size from the study file list (exact per-file sizes), was null.'
