notes: 'Zenodo lists no license; the description states "The dataset can be used for academic research
  purposes only", so spdx is custom (research use only). Files read from the Zenodo API listing: 70 slide
  files plus OWN_WNS_BX_v1_anon_PARTS_1_AND_2.csv (opened: GT/file-name columns). Part 1 of the same cohort
  is Zenodo 12818177; the single GT CSV in each deposit lists both parts (141 slides: 89 luad, 52 lusc).
  Labels are slide-level (no pixel annotations); the paper (PMC11524894, Methods and key resources table)
  lists this deposit among the released test datasets and gives subtype ground truth from pathology reports/immunohistochemistry.
  enricher: OME headers give x 230.4732 nm and y 230.4732 or 230.5157 nm per slide, so voxel_size_nm stays
  null (no single value); the paper gives none. The companion annotated tile dataset (UKK L1 SEGM, Zenodo
  12818382) is already in the catalog and is a different dataset. Sibling deposit: Zenodo 12818177.'
