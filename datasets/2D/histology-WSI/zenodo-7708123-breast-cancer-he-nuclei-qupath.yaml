notes: 'Slides are Hamamatsu .ndpi files (not in the schema format list, hence "other"); the two files total 5.04 GB. Annotation
  counts (2,024 nuclei: 1,419 tumor, 605 non-tumor; 762/381 and 657/224 per slide) are from the Zenodo description; the QuPath
  summary.json of the first slide confirms 1,143 annotation objects (Tumor-Nucleus 762, Nucleus 381). Annotations are limited
  to indicated ROIs, hence partial coverage. Only two slides, but each is a multi-gigapixel scan (first slide 136192 x 91392
  px). The Zenodo record lists no related publication, and a search for an associated paper found none, so none is cited.
  enricher: pixel size 0.22098 um (220.985 nm) from QuPath server.json pixelCalibration of both slides (was null). enricher:
  size 5,038,797,637 B from Zenodo file listing (was 5,038,798,590). Slide 2 summary.json counts 663 Tumor-Nucleus / 213 Nucleus
  vs 657/224 in the description.'
