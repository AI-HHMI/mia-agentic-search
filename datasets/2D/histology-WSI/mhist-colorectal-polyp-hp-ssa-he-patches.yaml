schema_version: '1.2'
id: mhist-colorectal-polyp-hp-ssa-he-patches
title: 'MHIST: minimalist histopathology image dataset of colorectal polyps (hyperplastic polyp
  vs. sessile serrated adenoma)'
short_name: Colorectal polyp HP vs SSA H&E patches (MHIST)
description: 3,152 fixed-size (224x224) H&E patches of colorectal polyps from 328 whole-slide
  images (Aperio AT2, 40x, compressed to 8x), labelled hyperplastic polyp or sessile serrated
  adenoma by majority vote of seven gastrointestinal pathologists, with per-image annotator
  agreement counts and a fixed train (2,175) / test (977) split.
