title: 'AI4SkIN: a fusocelular skin dataset with whole slide images for deep learning models'
short_name: Skin spindle cell neoplasm H&E slides (WSI)
description: 641 H&E-stained whole slide images of cutaneous spindle cell neoplasms from two Spanish hospitals (40x scans, 0.227 or
  0.25 um per pixel), grouped by tumour subtype and labelled with a multiclass diagnosis by 2 expert pathologists and 10 pathologists in
  training (crowd labels), plus a spreadsheet of the labels used in the paper's Gaussian-process classification benchmark.
