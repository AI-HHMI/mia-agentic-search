notes: 'Figshare lists WSI.7z (362.8 GB) and AI4SKIN_database_v2.xlsx (v2 only removes duplicate rows). The .7z cannot be listed
  remotely, so the file listing was not seen (annotations_verified false); the layout (slides grouped by subtype, files named
  AI4SkIN_HOSPITAL_NUMBER_SAMPLE.tif) is from the paper Data Records. Slides were scanned on a Ventana iScan HT at 40x (0.227 um/pixel,
  HCUV) and a Philips Ultra Fast Scanner at 40x (0.25 um/pixel, HUSC, converted from .isyntax to tiff); the two scanners differ, so voxel_size_nm is null. The paper describes six classes (one, scc, is under-represented and dropped in the
  validation, leaving 626 WSIs) and patient-level train / validation / test sets (paper Table 3), but no split file was seen in the Figshare listing, so splits_provided is false. Labels are slide-level only, no regions or masks. The paper is CC BY-NC-ND; the Figshare data record is CC BY.'
