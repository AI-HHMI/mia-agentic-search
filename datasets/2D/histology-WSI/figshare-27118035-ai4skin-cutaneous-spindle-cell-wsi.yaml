notes: 'Figshare lists WSI.7z (362.8 GB) and AI4SKIN_database_v2.xlsx (v2 only removes duplicate rows). Slides: Ventana iScan HT 40x
  (0.227 um/pixel, HCUV) and Philips Ultra Fast Scanner 40x (0.25 um/pixel, HUSC, converted from .isyntax to tiff); the two differ,
  so voxel_size_nm is null (HCUV 227 nm = AI4SKIN_HCUV_*.tif, HUSC 250 nm = AI4SKIN_HUSC_*.tif). Labels are slide-level only, no regions
  or masks. The paper is CC BY-NC-ND; the Figshare data record is CC BY. enricher: 7z header read: 641 .tif in 7 class folders (annotations_verified
  true, was false); the xlsx has a subset column (train 384 / val 101 / test 141 for 626 WSIs, scc excluded), so splits_provided true
  (was false).'
