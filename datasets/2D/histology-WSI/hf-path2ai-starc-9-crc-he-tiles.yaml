notes: 'HF repo (API listing, updated 2025-12-11): Training_data_normalized/ has 9 class zips of 70,000 PNG tiles each (BLD.zip listed with peek_archive); Validation_data/ has CURATED-TCGA-CRC-HE-VAL-20K (20,000 PNG) plus two Stanford validation zips not counted in n_items. size_bytes sums training and validation zips (weights excluded). Paper: 256x256 px tiles at 40x (0.25 um/px), Macenko-normalized; labels from DeepCluster++ sampling then pathologist verification. README says a newer version is coming; card front matter says cc-by-4.0. Tiles are crops, not WSIs.'
