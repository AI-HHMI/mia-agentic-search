schema_version: '1.2'
id: hf-path2ai-starc-9-crc-he-tiles
title: 'STARC-9: A Large-scale Dataset for Multi-Class Tissue Classification for CRC Histopathology'
short_name: STARC-9 colorectal tissue tiles (H&E)
description: 630,000 stain-normalized 256x256 H&E tiles (40x, 0.25 um/px) from whole-slide images of about 200 Stanford
  colorectal cancer patients, 70,000 per class across nine tissue classes (ADI, LYM, MUS, FCT, MUC, NCS, BLD, TUM,
  NOR). Tiles were selected with the DeepCluster++ framework and verified by expert gastrointestinal pathologists.
  Also provides three validation sets (STANFORD-CRC-HE-VAL-LARGE and -SMALL, CURATED-TCGA-CRC-HE-VAL-20K) and baseline
  model weights.
