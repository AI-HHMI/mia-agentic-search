id: ami-br-atypical-mitoses-breast
title: 'AMi-Br: Histologic Dataset of Normal and Atypical Mitotic Figures on Human Breast Cancer'
short_name: Atypical vs normal mitoses in breast cancer (H&E)
description: 3,720 mitotic figures from human breast cancer H&E slides, provided as 128x128 px PNG patches
  centred on the original annotations (1,999 from the alternative TUPAC16 labels, 1,721 from MIDOG 2021).
  Each was classified atypical or normal by three blinded experts with a majority vote (832 atypical,
  2,888 normal); a CSV lists slide, coordinates and per-expert labels.
