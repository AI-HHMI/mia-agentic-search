notes: 'No dataset license found on the GitHub page (no LICENSE file at main) or in the paper; the CC
  BY-NC-ND 4.0 shown on arXiv covers the article only. Pixel size, magnification and scanner are not stated
  (paper says six scanners across three centers). Source patches derive from MIDOG 2021 (Zenodo 4643381)
  and the alternative TUPAC16 labels; enricher read the README in full. Paper full text could not be retrieved
  via tools/paper.py (arXiv DOI not indexed), so the arXiv HTML version was used. Patches are in patches/atypical
  and patches/normal; patch/patient-level split notebooks exist but no split files were seen. enricher:
  channels 3 (RGB PNG headers, was null); download_method http (raw.githubusercontent files); size estimated
  from 3720 patches.'
