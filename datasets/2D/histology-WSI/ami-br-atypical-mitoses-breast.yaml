      Folder = majority_atypical. x,y are coordinates on the original slide (not in this repo). expert1/2_label
      give 8 subclasses (NMF prometaphase/metaphase/anaphase-telophase/ring shape; AMF segregation/multipolar/bipolar
      asymmetric/other).'
  notes: 'Listing: git tree of DeepMicroscopy/AMi-Br main (blobless clone, names only; per-file sizes
    not listed). value_range [4,255] from one sample patch (TUPAC16_10.png); 3 probed patches all 128x128x3
