notes: 'The Zenodo records hold only download manifests (s5cmd and Gen3), not image files: 8225132 lists
  419 series (one slide each) in the public idc-open-data S3 bucket, 10462858 lists 96 annotation series
  for a subset of those slides. Annotation is by one pathologist with 8 years of experience (ImageScope
  contours converted to DICOM SR); overlapping contours are possible. Scanner Leica Aperio (DICOM headers).
  The paper is not open access, only its abstract was read; the abstract reports CNN models for molecular
  subtype and survival, not these annotations. Images are hosted at NCI Imaging Data Commons, which has
  no matching repository value, hence repository other; the images record is Zenodo 10.5281/zenodo.8225132
  (CC BY 4.0). enricher: size from S3 listing; channels 3 (RGB, YBR_RCT).'
