notes: 'Training signal is text captions (multiple instance captioning), not masks or boxes; the paper proposes pretraining on them for transfer to pathology tasks. Zips listed with peek_archive: books_set.zip (5.28 GB, 4,270 PNG, captions.json, README) and pubmed_set.zip (478.8 MB, 3,272 JPG plus 37 PNG, captions.json, README). Both READMEs state CC BY-NC-SA 4.0, research use only. Download page warns the dataset size in the paper differs from the downloadable data due to an error. Pixel size, organisms and stains were not given per image, and the images are figures from published works, so magnification varies. Only the arXiv abstract was read for the paper. No single archive URL: two zips, so download_url is left null.'
