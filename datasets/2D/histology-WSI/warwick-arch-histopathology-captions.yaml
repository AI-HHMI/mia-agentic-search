    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    value_range:
    - 14
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: PubMed figure images, mostly JPEG (37 PNG); size varies (450x600, 480x600 seen).
  - role: label
    path_pattern: '*/captions.json'
    format: json
    axes: null
    shape: null
    shape_varies: null
    dtype: unknown
    compression: none
    encoding: other
    classes: null
    alignment: not-applicable
    alignment_notes: 'Text captions, not spatial labels: entries keyed by index with caption and uuid
      (= image file stem); books_set adds figure_id (bag) and letter (instance in the bag, or single),
      per README.'
  notes: 'Listing (tools/listing.py --expand-zips) covers both zips: 7,585 members, exact sizes, total
    5,754,542,808 B. Probe: books PNGs 404x504x3 and 891x1190x4 uint8; PubMed JPEGs 450x600x3 and 480x600x3.
    Sample: one PubMed JPEG 14-255 (one sample). Voxel size not applicable/not found: images are figures
    from textbooks and articles at varying magnification, with no calibration; checked: PNG/JPEG headers,
    README.md, landing page, arXiv abstract. Download links are direct with range requests, but host warwick.ac.uk
    is not on the TensorSwitch allowlist. Two zips, no single archive, so download_url stays null.'
