description: Histopathology figure images extracted from pathology textbooks (books_set, 4,270 PNG) and
  PubMed articles (pubmed_set, 3,309 images), each with its text caption (dense diagnostic and morphological
  descriptions) in a captions.json, released as a multiple instance captioning dataset for pretraining
  pathology representations.
