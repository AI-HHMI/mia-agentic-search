    alignment_notes: Textbook figure panels; RGB or RGBA (891x1190x4 also seen), size varies.
  - role: raw
    path_pattern: pubmed_set/images/*.{jpg,png}
    format: jpeg
    axes: yxs
    shape:
    - 450
