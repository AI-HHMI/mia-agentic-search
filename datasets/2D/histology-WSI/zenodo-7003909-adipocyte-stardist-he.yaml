notes: 'Zenodo description: 292 image patches, ground truth manually annotated in QuPath, split 263 train / 29 validation
  (the archive names the 29-image folder test). round2_data.zip listing (655 files): train/images 263 + train/masks
  263, test/images 29 + test/masks 29 + test/labels 41 + test/QC-Results 30; image files are TIFF/PNG patches, some
  derived from .ndpi scanner files. Pixel size and magnification are not stated on the Zenodo page; the paper is
  a preprint whose full text was not available (abstract only), so staining/scanner details are unconfirmed. The
  record also holds a trained model (.pb) and notebooks. enricher: masks are uint16 instance IDs (sample: 63 IDs
  + background). enricher: channels 3 (RGB TIFF). enricher: voxel size left null: TIFF calibration is 1818.5 nm/px
  in UUID-named patches and 441.5 nm/px in a .ndpi_r5 patch, so subsets differ; no page or paper states it.'
