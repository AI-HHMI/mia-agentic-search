notes: 'Zenodo record (v1.0, CC BY-NC-ND 4.0, two zips) and both zip listings were read. MT1.zip holds
  train/ (4,585 patches), tests/ (147) and labels/ (6,732 label images); MT2.zip holds 2,000 further train
  patches. Every one of the 6,732 patches in MT1 and MT2 has a label named labels_<patch name>, which
  is how the 6,732 count was obtained, although the record title speaks of "labeled and unlabeled" images
  (MT2 may be intended as the unlabeled part; its labels are nevertheless in MT1/labels). Two label images
  and two patches were decoded: 256 x 256 RGB, labels use exactly red, green and blue. The colour-to-class
  mapping, the staining/imaging protocol, pixel size, how labels were made and any paper were not stated
  on the record (no related identifiers). The training split of the study is not described. enricher:
  download_url set to the record page (two zips, MT1.zip and MT2.zip; was null).'
