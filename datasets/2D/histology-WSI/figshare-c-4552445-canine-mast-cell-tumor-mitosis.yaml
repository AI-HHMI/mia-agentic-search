notes: 'Figshare collection of 39 articles: 32 SVS slides (about 2 GB each, e.g. 1018715d369dd0df2fc0.svs 2.04 GB) and 7 database files; the
  size and CC0 license come from the Figshare API records of the collection items (total 47,419,943,804 B). There is no single
