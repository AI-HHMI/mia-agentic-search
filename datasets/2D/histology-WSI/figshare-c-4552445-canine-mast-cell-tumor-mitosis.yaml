title: Canine cutaneous mast cell tumor whole-slide images with complete mitotic figure annotations
short_name: Canine mast cell tumor mitoses (histology WSI)
description: 32 H&E-stained whole-slide images of canine cutaneous mast cell tumors (Aperio SVS, 0.25 um/px)
  completely annotated for mitotic figures, with secondary classes (mitotic figure look-alikes, neoplastic
  mast cells, granulocytes, ambiguous cells). Three annotation variants are provided (expert-labelled MEL, hard-example
  augmented HEAEL, and detector-augmented ODAEL) as MS COCO JSON and SlideRunner SQLite, plus a tumor-zone database.
