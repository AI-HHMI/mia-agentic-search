notes: 'Figshare collection of 39 articles: 32 SVS slides (about 2 GB each, e.g. 1018715d369dd0df2fc0.svs
  2.04 GB) and 7 database files; the size and CC0 license come from the Figshare API records of the collection
  items (total 47,419,943,804 B). There is no single archive, so download_url is null; each slide is its
  own Figshare file (e.g. https://ndownloader.figshare.com/files/16261562). The paper says the slides
  were assigned randomly to training and test (Table 1). Scanned with a Leica ScanScope CS2 at 400x, 0.25
  um/px. Checked: collection and item API records, paper full text (Europe PMC). enricher: SVS header
  MPP 0.2533 um (sample slide) vs 0.25 um in the paper; paper value kept.'
