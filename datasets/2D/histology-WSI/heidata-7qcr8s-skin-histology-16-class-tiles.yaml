notes: 'data.zip (3,879,943,680 B) read via ranged GETs: 129,369 JPEG members (tiles-v2.csv lists 129,364
  tiles from 386 cases), 16 class folders, class_dict.json, tiles-v2.csv. Tile classes: dermis 22,610,
  epidermis 14,118, subcutis 12,053, melanoma 11,682, SqCC 11,182, sebaceous glands 10,907, naevus 10,629,
  BCC 8,923, skeletal muscle 7,732, chondral tissue 7,177, sweat glands 3,571, necrosis 3,033, hair follicle
  2,012, nerves 1,884, vessel 1,643, elastosis 208. Paper: slides annotated by region in QuPath by two
  authors, then 100 x 100 um tiles (~395 px) exported and reviewed; splits are by patient. Pixel size
  derived from 100 um per ~395 px (about 253 nm), not stated directly; the stain is not named in the paper
  or on the record. Whole slides and region annotations are not included, only tiles. Code is Apache-2.0,
  data CC-BY-4.0 per the record.'
