  notes: 'listing.py over the 3 heiDATA files: 3,879,971,272 bytes, exact (Dataverse API). peek_archive.py
    data.zip: 129,371 members (129,369 .jpg, class_dict.json, tiles-v2.csv). Probed and decoded one tile
    (21,558 bytes): 395x395x3 uint8 JPEG, values 38-255, mean 143 (one sample); JFIF density 1:1 without
    units, so no calibration in the file. Read class_dict.json and the CSV header. tools/sample.py failed
    on the JPEG zip member (tried to open it as HDF5), so the tile was decoded with imagecodecs. Voxel
    size: the record''s 253 nm is derived from the paper''s ''100 x 100 um (~395 x 395 px)''; no source
    states a pixel size directly (checked JPEG header, README, Dataverse metadata, paper). data.download_url
    is the one data.zip (range requests work). The CSV is image-level class labels, not masks.'
