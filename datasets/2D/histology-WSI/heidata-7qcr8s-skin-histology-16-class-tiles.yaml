description: Heidelberg heiDATA record with 129,364 JPEG image tiles (100 x 100 um, ~395 x 395 px) cut
  from scanned skin histology slides of 386 cases and labelled with 16 classes (12 non-tumour anatomical
  structures plus BCC, SqCC, naevus and melanoma), with a tiles-v2.csv that assigns each tile to a case-disjoint
  train/validation/test set (88,971 / 12,354 / 28,039).
