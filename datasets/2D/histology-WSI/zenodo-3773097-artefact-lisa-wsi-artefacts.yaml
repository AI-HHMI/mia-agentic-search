notes: 'Zip (176 files): per-slide *-1.25_rgb.png / *-2.5_rgb.png, *_bg.png and *_mask.png in train/ (18 WSIs) validation/
  (3) test/ (1), plus validation_tiles/ (rgb + bg, patch-level artefact table in DATASET.txt). Most artefacts are not annotated
  (918 in train), hence coverage partial; annotations by a biomedical engineer from expert examples (Zenodo description).
  Pixel size not stated (only 1.25x/2.5x magnification). Organism not stated (human tumour tissue presumably, unstated). enricher:
  LICENSE CONFLICT - Zenodo metadata says CC-BY-4.0, the LICENSE file inside the zip says CC-BY-NC-4.0; spdx set to the in-archive
  CC-BY-NC-4.0 (was CC-BY-4.0), needs human review. enricher: size_bytes = exact zip size from the file listing (was uncompressed
  estimate); channels 3 from sample.'
