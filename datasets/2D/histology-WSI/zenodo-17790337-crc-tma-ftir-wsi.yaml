title: Multimodal colorectal cancer dataset (FT-IR spectroscopy and Whole Slide Imaging)
short_name: Colorectal cancer TMA slides with FT-IR cores
description: Nine colorectal cancer tissue microarrays scanned as whole-slide images (3DHISTECH MRXS)
  with 432 tissue cores labelled normal (NC, 139), primary colorectal carcinoma (CRC, 150) or colorectal
  liver metastasis (CRLM, 142; one core 'simple liver'), of which 353 also have a mid-infrared hyperspectral
  image and an RGB reference image (BMP) from the FT-IR microscope; core and patient IDs in per-TMA CSV
  files.
