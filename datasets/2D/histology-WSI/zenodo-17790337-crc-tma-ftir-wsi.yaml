notes: 'Zip (24.3 GB, CC-BY-4.0 on the Zenodo page and README) listed with peek_archive: 9 .mrxs slides
  with .dat folders (13.5 GB), 353 FT-IR spectra .txt (21.1 GB uncompressed) with .json and .stg files,
  353 BMP reference images (7.0 GB) and 10 CSV files. Core counts come from the nine metadata CSVs (432
  rows: CRC 150, CRLM 142, NC 139, one ''simple liver''; 353 with MIR data; 415 on a WSI). Formats: MRXS
  slides, BMP images and FT-IR text tables have no matching schema format, so ''other''. The second modality
  is mid-infrared hyperspectral imaging, listed as ''other''. Stain is not stated in the README or Zenodo
  page and the data paper full text is not online; voxel size is null because the parts differ (WSI 0.2425
  um/px per Slidedat.ini, MIR 25 um/px per the MIR JSON; see technical.notes); who assigned the core labels
  is not stated.'
