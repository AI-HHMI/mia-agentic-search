  notes: 'Single Zenodo file (multimodal_CRC_dataset.zip, 24,276,540,218 B per the Zenodo API and the
    range check); members listed with tools/peek_archive.py (1,770 files, 41.6 GB uncompressed). Read
    README.txt, Slidedat.ini of all 9 TMAs, one MIR JSON and TMA1_core_metadata.csv inside the zip. Sampled
    tma1_F6_cut.bmp (11,284,999 B compressed) with a scratch script (PIL): 2531x2600x3 uint8, min 20 max
    255 mean 157, value range from one sample. MRXS slides not opened (no allowed reader). Voxel size
    by part: WSI 242.53 x 242.65 nm (Slidedat.ini MICROMETER_PER_PIXEL_X/Y, level 0); MIR 25 um (JSON
    x_delta/y_delta); BMP not stated; record value left null because they differ. TensorSwitch cannot
    read MRXS, BMP or the spectra tables. Paper (Sci Data 10.1038/s41597-026-07873-1): full text not online
    yet (article page shows abstract only).'
