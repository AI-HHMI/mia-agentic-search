notes: 'File listing (tools/listing.py) shows 198 SVS slides in four batch folders (50 + 50 + 50 + 48) totalling about 565 GB (sizes estimated from the HTTP index) plus the info TSV and JSON; the TSV was read in full: molecular group Ca A1 76, Ca A2 64, Ca B 52, sc-enriched 6; histological type typical 113, carcinoid 42, atypical 39, NET G3 2, undetermined 2; staining HES 176, HE 22. A header range-request on one slide (TNE0001) reads Aperio AppMag 40 and MPP 0.2519 um; pixel size was not checked on the other slides. Labels are slide-level (molecular group and histology), no region or cell annotations. The molecular groups come from the lungNENomics multi-omics work (Sexton-Oates et al., medRxiv 2025, not read); the cited Mathian et al. 2024 paper (read in full) describes the 259-case cohort and pathology review, and this record holds 198 slides of it. No single archive download URL: files are per-slide under the BioStudies FTP path.'
