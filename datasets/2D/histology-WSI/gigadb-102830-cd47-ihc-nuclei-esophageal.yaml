title: 'CD47-IHCNuSC: nuclear instance segmentation and subtype classification in CD47-stained esophageal cancer IHC images'
short_name: CD47 IHC esophageal nuclei subtypes (histology)
description: >-
  86 non-overlapping 1024 x 1024 RGB patches (70 training, 16 validation/test) from CD47-immunostained
  (DAB, hematoxylin counterstain) esophageal cancer whole-slide images scanned at 0.25 um/pixel (40x), with
  paired MATLAB annotation files holding instance maps, instance IDs, centroids and seven-subtype nuclear type
  maps (positive/negative tumor, immune, other, and negative stroma) covering 18,483 nuclei, plus split identifiers.
