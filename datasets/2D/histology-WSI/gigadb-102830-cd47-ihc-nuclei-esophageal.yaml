notes: >-
  Read the GigaDB API record (files, descriptions), listed both zips with peek_archive (86 TIFF patches,
  86 .mat files) and read the GigaScience paper's Methods and Data availability. License conflict: GigaDB file
  attributes state CC0 1.0 for every file (used here), the dataset image caption says CC-BY, and the GitHub
  README (as quoted in the DataCite record of the code workflow) says CC BY-NC 4.0; the paper's data availability
  states no license. Check before use. Annotations were produced semi-automatically (HoverFast masks refined in
  QuPath, subtypes checked by pathologists), hence source=mixed; the paper says no inter-annotator agreement was
  recorded. The paper says images are released as OME-TIFF but the zip holds plain .tif files (tiff used).
  Size = images zip 227,923,144 B + annotations zip 4,252,185 B + splits JSON 2,902 B. Pixel size 0.25 um/pixel
  from the GigaDB file attributes and the paper. No download_url set: files are two zips, not one archive.
