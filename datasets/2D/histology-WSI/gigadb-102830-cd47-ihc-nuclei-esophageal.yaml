notes: 'Read the GigaDB API record, listed both zips and read the GigaScience paper''s Methods and Data availability. License:
  the deposit''s README and its CC0 license file state that CC0 1.0 is the authoritative license for the GigaDB data deposit
  (the dataset image caption says CC-BY; the FPNuNet code is MIT, separately). Annotations semi-automatic (HoverFast masks
  refined in QuPath, subtypes checked by pathologists), hence source=mixed. The paper says OME-TIFF but the zip holds plain
  .tif files. Pixel size 0.25 um/pixel from the GigaDB file attributes, README and paper. No download_url: two zips, not one
  archive. enricher: size 233,467,777 B from the full file listing (was 232,175,329 B, data files only); license url -> deposit''s
  CC0 file; confidence 0.75 -> 0.85.'
