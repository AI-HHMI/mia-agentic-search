short_name: AMi-Br atypical vs normal mitoses (H&E patches)
description: 3,720 128x128 px H&E patches centred on mitotic figures from the TUPAC16 and MIDOG 2021 breast
  cancer sets, each classified normal or atypical by a three-pathologist majority vote (832 atypical,
  2,888 normal), with a training split file; the benchmark repo also holds held-out sets AtNorM-Br (TCGA
  breast) and AtNorM-MD (MIDOG++ subset).
