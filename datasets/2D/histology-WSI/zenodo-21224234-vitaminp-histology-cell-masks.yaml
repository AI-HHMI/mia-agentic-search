notes: 'Derived compilation of 14 existing public datasets (several, e.g. CryoNuSeg, NuInsSeg, MoNuSeg, are
  catalogued separately); the original datasets may carry their own licences, while this Zenodo deposit states
  CC-BY-4.0. Files are .tar.zst archives (listed via the Zenodo API: 14 per-dataset Zarr archives plus a
  metadata/splits manifest), so contents could not be peeked; masks are asserted by the record description,
  not seen in a listing. Patch size, resolution (pixel size) and per-dataset annotation provenance are not
  stated on the Zenodo record; the paper full text could not be read (only the arXiv abstract page; the PDF
  exceeded the fetch limit), and the GitHub README gives inference settings only (512 px patches, 0.425 um/px
  target, which are model settings, not data properties). n_items is the sum of train/val/test patches from
  the record (10,986 + 1,740 + 2,415). Size 13.9 GB per record page; the API file sizes sum to about 13.9 GB.'
