notes: 'Zip listings (peek_archive): LPE_anonymised.zip holds 4,012 files and LGITL_anonymised.zip 4,014 files (about
  1.1 GB each, 2.3 GB total per the Zenodo page), all named <case>.svs__<level>_<x>_<y>.jpg; n_items counts files
  in the two zips, which may include a few non-image entries. Labels are slide-level: the consensus diagnosis of two
  pathologists using H&E plus CD3/CD20 immunohistochemistry (19 discordant cases excluded), applied to every tile
  of the case; there are no per-tile or pixel annotations. The paper reports tile counts per case from 8 to 357
  and uses case-level 5-fold cross-validation, but the deposit contains no split files; split by case. Scanner is
  an Aperio CS2 at 400x; micrometres per pixel are not stated on the Zenodo page or in the paper Methods, so
  voxel_size_nm is null. Tiles are JPEG (lossy). The Zenodo page itself lists no description of annotations; they
  were confirmed from the paper Methods.'
