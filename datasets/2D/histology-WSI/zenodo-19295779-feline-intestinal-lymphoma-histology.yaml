title: Feline LPE and LGITL Histology tiles
short_name: Feline intestinal lymphoma vs enteritis H&E tiles
description: About 8,000 anonymised 1024x1024 px RGB JPG tiles cut from H&E whole-slide images of feline endoscopic
  small-intestine biopsies, sorted by consensus diagnosis into lymphoplasmacytic enteritis (LPE) and low-grade intestinal
  T-cell lymphoma (LGITL). Used to train and test an InceptionV3 classifier.
