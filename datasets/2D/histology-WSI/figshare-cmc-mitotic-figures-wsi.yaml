notes: >-
  verification.url_ok is false because the figshare collection landing page was not fetched directly (figshare
  pages return 403 to WebFetch). The collection was read through the figshare API (21 SVS files plus two
  annotation zips, each licensed CC0) and the open-access paper (PMC7699627). Annotations are point labels
  (mitotic figure centers with per-expert and final labels) with tumor-area polygons; the paper states 14
  training and 7 test WSIs. Total size not summed (SVS files about 2 GB each). Sibling of the canine
  cutaneous mast cell tumor dataset (different tumor type, different images). Publication date not read.
