id: figshare-cmc-mitotic-figures-wsi
title: A completely annotated whole slide image dataset of canine breast cancer to aid human breast cancer research
short_name: Canine mammary carcinoma mitotic figures (H&E WSI)
description: >-
  21 H&E-stained whole slide images of canine mammary carcinoma scanned at 0.25 um/pixel and completely
  annotated for mitotic figures (13,907) and hard-negative look-alikes (36,379) by experts, plus polygon
  annotations of tumor areas. Annotations come as SlideRunner SQLite databases and MS COCO JSON.
