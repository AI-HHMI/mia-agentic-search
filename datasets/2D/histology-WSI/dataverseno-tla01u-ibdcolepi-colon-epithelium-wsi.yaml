notes: 'Hosted at DataverseNO (API files: WSI_part_01-10.zip of .ndpi slides 3.9-9.8 GB each, TIFF-annotations.zip,
  qupath-project-annotations.zip, patch-dataset-HE.zip, patch-dataset-CD3.zip, trained-models.zip, 80.6 GB in total); a
  Zenodo record 14803380 carries only the README. Slides scanned with a Hamamatsu NanoZoomer S360 at 40x; pixel size not
  stated in the README or paper, so voxel size is null. Split: HE 104 train/val and 36 test WSIs, CD3 90 and 21; 3% of train
  patches go to validation. Annotation was pathologist-checked, built by active learning (model predictions corrected in
  QuPath), hence mixed. Slides are .ndpi, so formats is other. Landing page HTML returned 403 to a script; the DataverseNO
  API record was read instead. Dataverse metadata states CC0 1.0 (version 2, 2023). The Google Drive mirror named in the
  description was not used.'
