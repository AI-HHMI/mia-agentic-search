notes: 'Zenodo lists no license; the description states "The dataset can be used for academic research
  purposes only", so spdx is custom (research use only). Files read from the Zenodo API listing: 88 slide
  files plus UKK_BX_WSI_PARTS_1_AND_2.csv (opened: GT/file-name columns). Part 2 of the same cohort is
  Zenodo 12817969; the single GT CSV in each deposit lists both parts (168 slides: 112 LUAD, 56 LUSC).
  Labels are slide-level (no pixel annotations); the paper (PMC11524894, Methods and key resources table)
  lists this deposit among the released test datasets and gives subtype ground truth from pathology reports/immunohistochemistry.
  enricher: voxel size 262.78 nm from the Aperio header (MPP = 0.262780 um) of all 88 SVS (was null; the
  paper gives none). The companion annotated tile dataset (UKK L1 SEGM, Zenodo 12818382) is already in
  the catalog and is a different dataset. Sibling deposit: Zenodo 12817969.'
