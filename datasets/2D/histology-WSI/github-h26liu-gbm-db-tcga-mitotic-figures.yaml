description: Bounding-box annotations of mitotic figures (normal, atypical and granular classes) on 66
  TCGA glioblastoma H&E whole slide images, produced with a deep active learning pipeline plus pathologist
  review. The repo holds only the JSON annotations; the slides come from the TCGA/GDC portal.
