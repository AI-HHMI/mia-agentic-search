notes: 'Slides are not in the repo: metadata.xlsx maps TCGA image IDs to annotation files and the slides
  are fetched from the GDC portal (TCGA terms apply to the images; CC0-1.0 is the repo license for annotations).
  annotations/ holds 77 JSON files while the paper says 66 WSIs, so n_items follows the paper. Paper reports
  804 normal, 728 atypical and 1,955 granular mitotic figures; initial 2 slides annotated by 3 pathologists,
  the rest by active learning with review of ambiguous cases (source mixed). Splits not provided. enricher:
  all 77 annotated SVS names resolve to open TCGA-GBM files in the GDC API (47.6 GB); the 77 JSONs hold
  6,083 boxes (2,590 atypical, 2,522 normal, 943 granular, 24 uncertain, 4 unnamed); channels 3 (RGB SVS).'
