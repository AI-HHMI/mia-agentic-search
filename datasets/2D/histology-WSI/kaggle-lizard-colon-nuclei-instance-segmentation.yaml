schema_version: '1.2'
id: kaggle-lizard-colon-nuclei-instance-segmentation
title: 'Lizard: A Large-Scale Dataset for Colonic Nuclear Instance Segmentation and Classification (Kaggle mirror)'
short_name: Lizard colon nuclei H&E (instance + class)
description: 238 H&E-stained colon histology image regions at 20x from six dataset sources (DigestPath, GlaS, TCGA,
  PanNuke, CRAG, CoNSeP) with nearly half a million (495,179) labelled nuclei. Each nucleus has an instance label
  and one of six classes (epithelial, connective tissue, lymphocyte, plasma, neutrophil, eosinophil), made with
  a multi-stage annotation pipeline with pathologist-in-the-loop refinement. Overlay previews are included.
