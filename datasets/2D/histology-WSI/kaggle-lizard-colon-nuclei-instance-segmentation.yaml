notes: 'Kaggle API listing shows 238 label .mat files, 238 JPEG overlays, 238 PNG images (80 in Lizard_Images1, 158 in
  Lizard_Images2) and a CSV, README and Python helper; the paper (arXiv 2108.11195) gives 20x magnification, six source
  datasets and 495,179 nuclei in six classes. The official host, warwick.ac.uk/lizard-dataset (cited in the paper),
  redirects to a Warwick sign-in page when fetched, so the Kaggle mirror (CC BY-NC-SA 4.0 per its page) is used as the hosting
  page. Pixel size, train/test splits and per-image sizes are not stated on the pages read. Annotations are semi-automatic
  with pathologist refinement and verification, not fully manual. date_published is the Kaggle last-update date; the paper
  appeared at ICCV 2021.'
