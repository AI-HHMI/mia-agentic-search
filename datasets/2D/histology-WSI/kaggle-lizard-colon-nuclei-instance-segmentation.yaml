    alignment: same-grid
    alignment_notes: 'MATLAB 5 .mat (header ''MATLAB 5''); per read_label.py: inst_map int32 (H, W) of the image,
      0 = background, 1..N nuclei; id (N,1), class (N,1), bbox (N,4: y1,y2,x1,x2), centroid (N,2: x,y). Pairing
      rule: same stem <source>_<n> in Lizard_Images1/2 and Labels/. README class numbering lists Neutrophil twice
