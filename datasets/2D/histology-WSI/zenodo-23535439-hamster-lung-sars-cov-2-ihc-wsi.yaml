  notes: 'Listing: Zenodo API, 45 files, 8,657,311,383 bytes (complete). Probed and sampled 115-23-47.svs (30,613,354 bytes): BigTIFF, tiled 512x512 JPEG Q75, uint8 RGB, level 0 19867x9566, Aperio MPP 0.262238 (matches record voxel size). value_range from this one sample (mean 236.6, background near 255). Labels are QuPath .qpdata files (QuPath''s own serialized object hierarchy, not opened: no listed tool reads it and it is a Java-serialized format); per-slide class counts come from summary.json. Masks would have to be exported with QuPath (e.g. a label-image export), so automatic conversion of the labels is not possible from these files. No single archive for the whole dataset: download_url stays null; direct files are the Zenodo API file links in the listing.'
