notes: 'No associated paper found (Europe PMC title search and web search), so Methods could not be read; sampling, staining and animal details come from the Zenodo description only. Pixel size 0.262238 um from the QuPath server metadata of the slides sampled in Data.zip. Annotations are sparse training regions (Positive/Negative/Region/Ignore classes, from the per-image summary.json), not full-slide labels. Classes.json also lists unused default classes (Tumor, Stroma, ...). enricher: 41 SVS on Zenodo but 42 QuPath entries (115-23-53.svs is in project.qpproj with no image file).'
