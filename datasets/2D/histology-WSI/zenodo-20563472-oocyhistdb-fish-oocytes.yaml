title: 'OocyHistDB: histological images of common snook ovary for oocyte detection and segmentation'
short_name: OocyHistDB fish oocyte stages (H&E histology)
description: H&E histological sections of ovarian tissue from the fish Centropomus undecimalis (common snook), imaged with a
  Leica DM 500 at 200x as 640 x 640 RGB images (305 originals, 772 after augmentation). A specialist annotated 5,680
  oocytes in three developmental classes (pre-vitellogenesis, initial and final vitellogenesis) in Roboflow; train,
  validation and test subsets are provided.
