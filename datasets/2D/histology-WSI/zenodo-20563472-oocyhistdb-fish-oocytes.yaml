notes: 'The Zenodo record holds only readme_vs1.txt; the data is the Roboflow export linked in that readme. That link
  redirects to a signed storage URL for coco-segmentation.zip (401.8 MB, 1217 files: 3 COCO JSON plus jpg images, in
  train/valid/test folders). The zip holds about 1214 images, more than the 772 stated in the readme and Portuguese paper
  (305 originals, augmented by flips, 90 degree rotations, crops; Roboflow exports may include further augmentations), so
  n_items follows the paper and the enricher should recount. The readme says annotations may be boxes or polygons; the
  export name indicates segmentation. The Roboflow link is a tokenised share link and could lapse. Pixel size not stated
  in the readme or paper text read (200x, 640x640 px only). Paper was read from the journal PDF.'
