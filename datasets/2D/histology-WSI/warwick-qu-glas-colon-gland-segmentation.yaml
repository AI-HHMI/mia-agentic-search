notes: 'Terms on the download page: provided for research purposes only, commercial use not allowed; users
  must cite the GlaS contest paper (arXiv 1603.00275, Medical Image Analysis) and the earlier stochastic
  polygons paper. Zip (180.9 MB, 332 members, listed with peek_archive) holds 330 BMP files (165 images
  plus 165 matching _anno.bmp, named train_N, testA_N, testB_N) and Grade.csv. About page: 20x, Zeiss
  MIRAX MIDI scanner, 0.62005 um/pixel, 85 training (37 benign, 48 malignant) and 80 test (37 benign,
  43 malignant) images; Grade.csv shows 85 train, 60 testA and 20 testB rows. Image size was not stated
  on the pages, and the journal paper is not open access via Europe PMC, so the annotation procedure was
  only taken from the about page (expert pathologists). The data format is BMP, which the schema lacks,
  so formats is other. Warwick backup of the challenge site. enricher: voxel size 620.05 nm from the about
  page (was rounded to 620).'
