short_name: Colon gland segmentation (H&E histology)
description: 165 H&E-stained histology images of colorectal tissue (benign and malignant, from 16 sections
  of T3/T4 adenocarcinoma) scanned at 20x, each with a pathologist-provided gland instance annotation
  image, split into 85 training and 80 test images (test A and B), from the GlaS gland segmentation challenge.
  A Grade.csv gives benign or malignant labels and a finer grade per image.
