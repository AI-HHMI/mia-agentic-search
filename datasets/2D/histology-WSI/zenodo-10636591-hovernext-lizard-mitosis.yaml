description: Training and validation data released with HoVer-NeXt (nuclei segmentation and classification in H&E histopathology).
  Three zip archives of NumPy arrays hold a modified Lizard colonic nuclei dataset with an added mitosis class (train/valid
  folds and test), a mitosis dataset with a hold-out H&E mitosis test set, and a hold-out eosinophil validation set with per-image
  centroid CSVs.
