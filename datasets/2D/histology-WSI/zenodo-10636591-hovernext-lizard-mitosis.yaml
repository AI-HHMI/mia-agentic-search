notes: 'Three zips (eos_val, lizard_mitosis, mitosis_ds; 2,729,755,463 B) of NumPy arrays. Paper (PMLR PDF) Supp A.5-A.8:
  Lizard at 0.5mpp, MitEval/EosEval ROIs at ~0.5mpp; mitosis labels from pHH3 restain thresholds plus self-training (automatic),
  Lizard labels from Lizard, eosinophil points manual by a pathologist (source mixed). Zenodo notes some mitoses remain incorrectly
  or incompletely annotated. Same three files as Zenodo 11657620 (PR #399, a later version of the same concept). enricher:
  voxel size 500x500 nm from paper (Lizard 0.5mpp, eval sets ~0.5mpp; mitosis_ds resolution not stated separately, models
  trained on Lizard-mitosis at 0.5mpp) (was null); size from file listing (was 2.73e9 rounded); n_items null (was 3 = zip
  count); download_url = landing page (three zips, no single archive).'
