notes: 'Three zips (eos_val 899.6 MB, lizard_mitosis 888.7 MB, mitosis_ds 941.4 MB; 2.7 GB total) listed with peek_archive: all
  image and label arrays are .npy (not a listed format, hence formats [other]); eos_val has 11 image arrays plus 11 centroid
  CSVs. Pixel size, tile sizes, image counts and annotation procedure are not stated on the Zenodo page or the MLR abstract
  (full paper text not found via tools/paper.py; the Data section was not read). Zenodo notes some mitoses remain incorrectly
  or incompletely annotated. The Lizard part derives from Lizard (Graham et al.), also CC BY-NC-SA 4.0, itself on the CONIC
  challenge page; it may overlap with an existing Lizard record. Annotation source (mixed) and the classification/points
  types are inferred from the files and description, not verified in the paper.'
