  notes: 'Complete Zenodo listing (3 zips, members expanded). probe.py/sample.py do not read .npy, so NPY headers were read
    by zip range with a scratch script (np.load allow_pickle=False / np.frombuffer, no unpickling). eos_val 6_img.npy read
    whole (uint8, 0..255, one sample); centroids_6.csv 71 rows; first 4 tiles of lizard test_labels.npy decoded (ch0 0..148,
    149 values; ch1 0..7). value_range values are from one sample. NPY carries no calibration; voxel size from the paper (~0.5
    mpp). Axes not stated by the files or docs (NPY N,H,W,C order by inspection only), so axes null. .npy is not a format
    TensorSwitch converts. Identical files to Zenodo 11657620 (PR #399).'
