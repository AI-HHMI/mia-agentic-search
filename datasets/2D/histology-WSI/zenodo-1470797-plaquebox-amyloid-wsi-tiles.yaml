short_name: Amyloid-beta plaque tiles and WSIs (IHC histology)
description: 63 amyloid-beta (4G8) immunostained human temporal-cortex whole slide images from the UC
  Davis Alzheimer's Disease Center Brain Bank, plus 80,873 color-normalized 256 x 256 px tiles (train,
  validation and hold-out) with expert multi-label annotations for cored plaque, diffuse plaque, cerebral
  amyloid angiopathy (CAA) or negative, given in CSV files.
