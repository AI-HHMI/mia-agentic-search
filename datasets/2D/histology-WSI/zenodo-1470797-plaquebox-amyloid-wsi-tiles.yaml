notes: 'Five zips on Zenodo (110 GB): Dataset 1a train WSIs, 1b validation WSIs (4 .svs), 2 hold-out WSIs (10 .svs), 3 CERAD-like hold-out WSIs (no tile labels) and Tiles.zip (3.27 GB, 80,873 .jpg tiles plus train/validation/hold-out CSVs: 61,370, 8,630 and 10,873 tiles). WSIs are Aperio .svs. The 0.5 um pixel size is derived from the paper (20x, a 256 px tile is 128 um). Labels come from one expert neuropathologist on stain-detected candidate tiles plus some random negatives, so they are tile-level multi-label classes, not masks. The record counts 63 WSIs; the paper counts 43 slides in its pipeline.'
