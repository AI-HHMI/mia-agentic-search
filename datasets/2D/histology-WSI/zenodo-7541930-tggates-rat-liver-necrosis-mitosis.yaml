    Aperio, level 0 61766x30125 RGB uint8, 256x256 tiles, J2K/YUV16 Q=70 (lossy), AppMag 20, MPP 0.4984, 4 TIFF
    pages (pyramid/thumbnail); 36111.svs: 33863x30871, JPEG Q=70, 240x240 tiles, MPP 0.4916, so slide compression
