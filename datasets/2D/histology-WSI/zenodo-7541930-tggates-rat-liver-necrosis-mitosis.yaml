notes: 'The Zenodo record distributes annotations only (230 *.svs.json + 230 *.svs.geojson, README, LICENSE, slides.json
  per peek_archive); the 230 SVS slides must be downloaded from the Open TG-GATEs database (doi 10.18908/lsdba.nbdc00954-02-000),
  which the description says is CC-BY-SA-2.1-JP. The record states that the annotation files are under the same
  CC-BY-SA-2.1-JP licence (text in the LICENSE file in the archive); the Zenodo licence metadata field is empty, so
  spdx is set to custom rather than guessing an SPDX mapping. Pixel size, stain details and splits are not stated
  on the record; no associated paper found (Europe PMC title search failed; record has no related identifiers).
  Annotation coverage is partial: 6 pathologists, one of whom made ~15,660 of ~18,000 annotations; classes include
  Necrosis (area/single cell), Mitosis, central vein, parenchyma, portal tract, artifacts and others. size_bytes is
  the annotation archive only, not the images.'
