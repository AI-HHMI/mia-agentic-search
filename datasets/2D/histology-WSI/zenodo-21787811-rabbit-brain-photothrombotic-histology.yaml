short_name: Rabbit brain stroke lesion patches (H&E, Nissl)
description: 4,350 histology image patches (BMP) cut from whole-slide scans of rabbit brain sections after
  photothrombotic stroke induction, in two stain-specific sets (H&E and Nissl/cresyl violet) of 2,175
  patches each, sorted into three classes of 725 patches (photothrombotic lesion, necrotic region, normal
  contralesional tissue).
