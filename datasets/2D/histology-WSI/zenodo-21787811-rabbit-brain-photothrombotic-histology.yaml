notes: The images are BMP, a format the schema lacks, so formats is other. Patch pixel size and magnification
  are not stated on the Zenodo page, README, file listing or the open-access Sci Rep paper that describes
  the source slides (only the slide scanner model is given), and the classification paper is not open
  access (abstract and Crossref only), so voxel_size_nm is null; each patch is about 0.2 MB. Patches were
  cut from the same source WSIs, so patch-level splits can leak; no train/val/test split is provided.
  Only multi-HnE.zip was listed with peek_archive; multi-Nissl.zip mirrors it per the README.
