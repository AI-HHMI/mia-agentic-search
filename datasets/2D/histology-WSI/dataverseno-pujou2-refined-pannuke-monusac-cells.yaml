  notes: 'Listing: Dataverse API (3 files with exact sizes; tools/listing.py cannot follow Dataverse''s redirect, so size_source
    is page-stated). Zip central directories read by range requests: 10,724 PNGs (1.33 GB) and 10,724 .npy (24.9 GB uncompressed).
    Sampled 2582_pk_f1 and 514_mk_f3 (PNG + npy each, ~300 KB, np.load with allow_pickle=False): PNG 256x256x3 uint8; masks
    (7,256,256), int32 (pk) / float64 (mk), max 68 / 24, instance ids per channel. Value ranges from these two samples. Voxel
    size not found; checked: Dataverse metadata, README, paper (not open access, abstract only). Upsampled MoNuSAC patches
    make it non-uniform anyway. Direct links: dataverse.no datafile URLs (303 to presigned S3, ranges OK) but dataverse.no
    isn''t on TensorSwitch''s allowlist.'
