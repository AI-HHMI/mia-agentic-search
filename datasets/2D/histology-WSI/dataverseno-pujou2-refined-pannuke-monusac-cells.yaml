short_name: Refined PanNuke+MoNuSAC cell types (H&E)
description: 10,724 H&E-stained 256x256 px image patches (7,901 from PanNuke and 2,823 from MoNuSAC) with per-pixel cell-type
  masks for seven classes (neoplastic, epithelial, lymphocyte, neutrophil, macrophage, dead, connective), obtained by cross-relabeling
  the broad PanNuke inflammatory and MoNuSAC epithelial classes with ResNet50 classifiers.
