notes: Derived from PanNuke and MoNuSAC; this is a different label set (7 refined classes) from those source datasets, not
  a mirror. Counts and structure come from the deposit README (10,724 PNG images and 10,724 .npy masks; peek_archive could
  not read the zips because the server gives no size, so zip members were not listed). File names carry a fold index (f1-f3
  etc.) which the README describes as the split used in experiments; exact fold assignment not verified. README describes
  masks as (7,256,256) yet lists 8 values (0 background plus 7 types), so channel layout should be checked. Labels are model-refined
  (ResNet50 relabeling of original manual annotations), hence source mixed. Pixel size not stated on the deposit; paper full
  text is not open access (Europe PMC abstract only). Original PanNuke / MoNuSAC licences may impose additional terms. size_bytes
  sums the two zips (1,321,043,666 + 48,495,470).
