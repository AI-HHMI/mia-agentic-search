notes: 'Derived from PanNuke and MoNuSAC with 7 refined classes (not a mirror). File names carry a fold index (f1-f3), which
  the README describes as the split used in experiments. Labels are model-refined (ResNet50 relabeling of the original manual
  annotations), hence source mixed. Pixel size not stated on the deposit; paper not open access. Some MoNuSAC patches were
  upsampled to 256x256 (README), so pixel size is not uniform. Original PanNuke / MoNuSAC licences may impose additional terms.
  enricher: size is the sum of the three files in the Dataverse API (was the two zips only). enricher: masks hold instance
  ids per class channel (sampled), not binary as the README says.'
