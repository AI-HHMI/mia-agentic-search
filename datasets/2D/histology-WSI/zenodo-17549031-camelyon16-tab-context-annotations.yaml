notes: 'Annotation-only release: the 73 CAMELYON16 WSIs are NOT included (paper: download the CAMELYON16
  training set, abnormal class, from the GigaScience Database). XML (ASAP polygon) coordinates are in
  level-0 pixels of the matching CAMELYON16 tumor_NNN WSI. Artefact annotations exist for 62 of 73 slides
  in the archive (paper Table 1 says 63). enricher: formats [tiff] (3 sample mask TIFFs; XML is in annotations.format;
  was [other]); download_url = direct Zenodo file (was landing page). Voxel size not stated on the Zenodo
  page, README or paper; the sample mask header gives 243.1 nm/px, but CAMELYON16 slides come from two
  centres, so it is left null.'
