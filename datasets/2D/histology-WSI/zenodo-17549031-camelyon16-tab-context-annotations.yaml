notes: 'Annotation-only release: the 73 CAMELYON16 slides are NOT in this record (the paper says they are omitted for ethical
  reasons and points to the CAMELYON16 data in the GigaScience Database, DOI 10.5524/100439, cited in the paper''s reference
  list; that page was not fetched this run, so the CAMELYON16 license and download format are unchecked). Slide names follow
  tumor_NNN (e.g. A_tumor_034.xml). XML files use the ASAP polygon format of CAMELYON16; the zip is a GitHub release archive
  (212 files: 208 XML, 3 sample mask TIFFs for tumor_034, 1 .py), so `formats` is `other` for the XML (the TIFF masks are
  only three samples). Voxel size is not stated on the Zenodo page, GitHub README or the paper (checked all
  three). Artefact annotations exist for 63 of 73 slides.'
