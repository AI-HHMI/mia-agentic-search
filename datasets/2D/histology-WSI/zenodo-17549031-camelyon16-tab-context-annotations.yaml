schema_version: '1.2'
id: zenodo-17549031-camelyon16-tab-context-annotations
title: Pixel-level annotations of context region for trustworthy diagnosis of Breast Lymph Node Metastasis
  from Histopathological WSI
short_name: CAMELYON16 tissue/artefact regions (histology WSI)
description: Expert polygon annotations of three region categories (diagnostic tissue, background tissue,
  artefacts) on 73 abnormal H&E whole-slide images of breast lymph node metastasis taken from the CAMELYON16
  training set, stored as ASAP XML files (73 tissue, 73 background-tissue and 63 artefact files) with
  three sample binary mask TIFFs and the Python script that rasterises the XML into masks. The WSIs themselves
  are not included; they come from CAMELYON16 (GigaScience Database).
