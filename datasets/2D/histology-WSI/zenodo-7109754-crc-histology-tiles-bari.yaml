notes: 'One zip, 15,856 PNG tiles listed with peek_archive: 3394 TUM, 3327 MUSC_STROMA, 1142 LYM, 3253 DEBRIS_MUCUS,
  2172 NORM, 2568 ADI. Tile size 224 x 224 px at 0.5 um/px and the pathologist annotation are stated on the Zenodo page; the
  linked paper is not open access (abstract only), so scanner and staining details are not confirmed. Class folder names are
  abbreviations; the expansions in the description are inferred from them. The same group has an earlier tile dataset
  (zenodo 4785131, not in the catalog at the time of writing); this record is a different tile set from 10 samples. No
  train/test split is provided in the archive.'
