title: 'ADNP-15: Neuritic plaque segmentation dataset in human brain whole slide images (AT8)'
short_name: Neuritic plaques AT8 brain patches (ADNP-15)
description: 256x256 patches from AT8 (phospho-tau) immunostained frontal cortex whole-slide images of 15 Alzheimer's
  disease brain donors (Neuro-CEB brain bank, Hamamatsu NanoZoomer scans), with neuritic plaque masks from expert manual
  annotation of about 4,000 plaques. 25,224 patches in total, shipped raw and in four stain-normalized versions
  (Reinhard, Macenko, Vahadane, HTK) plus Fourier-enhanced variants, split by donor (12 train, 3 test).
