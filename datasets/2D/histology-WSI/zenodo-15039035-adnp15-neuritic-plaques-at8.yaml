notes: 'Zenodo holds one split ZIP64 archive in 9 byte-split parts (...-3aa to -3ai, 46.8 GB; all parts must be concatenated). The central
  directory read from the last part lists PNG patches under origin/<subject>/{patches,masks,HTK,macenko,reinhard,vahadane} and
  Fourier-enhanced variants; the listing seen covered only the last ~23k entries, so the per-donor counts were not fully verified.
  The 25,224 patches, the donor-level 12/3 train/test split and the ~4,000 annotated plaques come from the paper and Zenodo
  description. Pixel size and scan magnification are not stated in the paper or on Zenodo. ROI-based translation augmentation
  is already applied in the augmented folders. The Zenodo record has no direct per-file URLs usable as one download, hence
  download_url is null.'
