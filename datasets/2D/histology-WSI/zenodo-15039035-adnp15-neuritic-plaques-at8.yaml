  notes: 'The 9 Zenodo parts are one byte-split ZIP64: an ad hoc reader treated them as one range-readable file
    and read the full central directory (302,901 entries, exact sizes; ~51 MB of directory read) and three members:
    origin/1/patches/patch_0000.png (201,986 B: RGBA uint8 256x256x4, 0-255), origin/1/masks/mask_0000.png (586
    B: L uint8, values {0,255}, 97% zeros) and Fourier/1/HTK/normalized_patch_0000.png (219,732 B, RGBA). Values
    from these samples only; normalization none for origin/patches is inferred from the separate stain-normalized
    folders. No member can be fetched as <url>::<member> because offsets span the concatenated parts, so technical.sample
    is null and data.download_url stays null (9 parts). Voxel size not found; checked: Zenodo API description (NanoZoomer,
    256x256 patches, no magnification), arXiv 2505.05041 full text (pdftotext: no pixel size or magnification).'
