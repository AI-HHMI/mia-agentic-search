title: 'BoneMarrowWSI-PediatricLeukemia: Bone Marrow Aspirate Smear Whole Slide Images with Expert Annotations and Clinical Data in Pediatric Leukemia'
short_name: Pediatric leukemia bone marrow smears (WSI)
description: Pappenheim-stained bone marrow aspirate smears from 246 pediatric patients with ALL, AML or CML, scanned as whole slide images at 40x (0.11 um/pixel). Square 2048-pixel regions of interest in the evaluable monolayer carry cell bounding boxes (about 45-47k cells) with consensus class labels from multiple experts (up to 49 classes), plus per-case clinical data and lab values. Images are distributed as DICOM through the NCI Imaging Data Commons using manifests listed on the Zenodo record.
