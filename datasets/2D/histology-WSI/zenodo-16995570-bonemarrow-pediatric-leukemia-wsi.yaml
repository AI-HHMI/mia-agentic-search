notes: 'The Zenodo v3 record holds only download manifests (s5cmd/DCF, 99 kB); the DICOM images and annotations live in NCI IDC (collection bonemarrowwsi_pediatricleukemia), which was not opened in this run, so annotation files were not seen in a listing and total size is not stated. The earlier record 15490664 (v2) holds a 2-patient sample (13.3 GB). Paper: 831 ROIs, 426 exhaustively boxed, 232 with consensus classes; 45,176 boxes (28,830 with class labels); Zenodo says 47,176 boxes / 49 classes. Scanner 3DHistech Pannoramic MIDI II (two slides on Pannoramic 250 Flash). Publication date not stated precisely (September 2025). Per-annotator labels and consensus classes slated for a later IDC release per the record.'
