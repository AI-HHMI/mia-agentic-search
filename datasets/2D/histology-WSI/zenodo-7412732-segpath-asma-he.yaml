notes: 'Zenodo record (README text, file list) gives file naming, 984x984 px patches, binary masks and
  the license text (CC BY-NC-SA 4.0; the Zenodo license field says other-nc, commercial use needs contacting
  the authors). Patch count and splits come from aSMA_fileinfo.csv: 62,356 rows = train 51,496 / validation
  4,978 / test 5,882. enricher: the start of the tar.gz was read as a stream; H&E and mask members seen,
  annotations verified (was false). Pixel size 0.220818 um/px (Hamamatsu Nanozoomer S60, 40x) is from
  the paper Methods; the positive αSMA signal area is used as the mask without modification (paper Methods).
  Sibling of the catalogued SegPath records for panCK, ERG, MIST1 and MNDA, but a different cell type
  and different images.'
