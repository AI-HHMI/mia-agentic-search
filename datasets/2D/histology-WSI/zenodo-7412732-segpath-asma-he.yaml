schema_version: '1.2'
id: zenodo-7412732-segpath-asma-he
title: 'SegPath: large-scale annotation dataset for cell/tissue segmentation in H&E images (anti-αSMA
  (smooth muscle cells / cancer-associated fibroblasts))'
short_name: SegPath smooth muscle segmentation (H&E)
description: H&E image patches (984 x 984 px, 40x, 0.22 um/px) of human tumour sections paired with binary
  smooth muscle cells / cancer-associated fibroblasts masks. Masks were generated by destaining the H&E
  slide, immunofluorescence restaining with aSMA and thresholding the fluorescence, not by manual drawing.
  This is one of the eight SegPath Zenodo records (one per antigen); a CSV assigns each patch to train,
  validation or test.
