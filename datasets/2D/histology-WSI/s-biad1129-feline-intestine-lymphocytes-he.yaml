notes: 'Format other = Olympus VSI (not in the schema''s format list); each slide has an overview .vsi plus two stack files; JSON annotation files per slide. 105 test WSIs and 228 training/tuning WSIs counted
  from the overview rows of the file lists (cell-detection list has 423 annotation files, mucosal-compartment list 311: 248 training, 63 tuning). Annotation is one ROI per slide by one board-certified pathologist,
  hence coverage sparse. Paper gives scanning as 40x, ''0.17 um2/pixel'' (units ambiguous), so voxel_size_nm is null. Total size not stated; file list has no sizes. Paper reports 383 cases sampled; not
  all necessarily deposited. Author list not read from the record.'
