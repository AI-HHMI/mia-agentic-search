notes: 'Dataverse record lists 15 tar.gz files (10 image archives of TMA spots, train masks, and test masks
  from pathologist 1 and 2); size_bytes is their sum. Listed the test-mask archive (246 PNG masks named
  mask1_<TMA>_<row>_<col>.png) and the first 3 MB of one image archive (JPG spots named <TMA>_<row>_<col>.jpg).
  Per the paper, original spots are 3100x3100 px at 40x, scanned on a Hamamatsu NanoZoomer-XR; training
  TMAs 111, 199, 204, validation TMA 76, test TMA 80; training masks come from the first pathologist (K.S.F.),
  and the test set was also annotated by a second pathologist. Total spot count is not stated in the
  Dataverse record; the paper says 200-300 spots per TMA, so n_items is left null. Dataverse offers per-file
  downloads (datafile IDs 3201623-3201655) rather than one archive, hence no single download_url.'
