notes: 'Two zips (11,171 + 8,079 files; PNG patches 11,097 + 8,079, plus CSV/TSV annotations, 2 HDF5 embedding files and a
  model checkpoint). n_items counts PNG patches (19,176); size is the sum of the two zips (compressed). Pixel size 0.1109
  um/px is the rescaled patch resolution stated in the paper Methods (all patches rescaled to it), not read from file headers.
  Paper: nuclei and cell datasets were built by bootstrapping and correcting model predictions in QuPath (hence source mixed);
  tissue labels are rough manually drawn regions. Splits ~70/15/15 per paper (Supplementary Table 6). The paper states in-house
  WSIs are not public; only the training patches, annotations, embeddings and sample region are released here. The zip layout
  was inspected only in part (peek listing shows first entries), so exact folder names for annotations and splits were not
  all verified.'
