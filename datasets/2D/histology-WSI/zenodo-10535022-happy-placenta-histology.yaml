title: 'HAPPY: a deep learning pipeline for mapping cell-to-tissue graphs across placenta histology whole slide images'
short_name: HAPPY placenta nuclei and cell types (H&E)
description: 'Training data for the HAPPY placenta histology pipeline: H&E patches with nucleus point annotations (nuclei
  localisation, ~11.8k nuclei), 200x200 px cell-type patches (11 placental cell types, ~11.8k cells), and cell-graph data
  with tissue-microstructure labels (9 classes) from two healthy term placentas, plus trained models. Includes the annotations,
  image datasets, embeddings, graph splits and one sample WSI region.'
