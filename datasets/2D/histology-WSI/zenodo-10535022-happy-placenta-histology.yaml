notes: 'Two zips (combine same-named folders): 19,221 PNG patches in total (275 nuclei patches incl. 85 empty, 18,946 cell
  patches), CSV/TSV annotations, 2 HDF5 embedding files, 3 model checkpoints (.pt, not opened), one sample WSI region. n_items
  counts PNG patches. Pixel size 0.1109 um/px is the rescaled patch resolution stated in the paper Methods (all patches rescaled
  to it). The sample WSI TIFF header says 0.2277 um/px. Paper: nuclei and cell datasets were built by bootstrapping and correcting
  model predictions in QuPath (hence source mixed); tissue labels are rough manually drawn regions. Splits ~70/15/15 per paper
  (Supplementary Table 6) and as train/val/test CSVs. In-house WSIs are not public. enricher: n_items 19,221 from the full
  zip listing (was 19,176). Two zips, so download_url stays the record page.'
