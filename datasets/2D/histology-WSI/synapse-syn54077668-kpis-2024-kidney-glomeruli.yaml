notes: 'Hosted on Synapse (not a schema repository value, so other); a free Synapse account is needed to download. No
  license or terms found on the challenge page, Synapse wiki or arXiv paper (arXiv CC BY covers the paper only). Synapse
  listing: Training 123.8 GB, Validation 46.6 GB, Testing 65.3 GB (test released 2024-10-05); per split one Task1_patch_level
  zip (contents not inspected, login needed) and Task2_WSI_level *_wsi.tiff + *_mask.tiff in 56Nx / DN / NEP25 / normal:
  30 train, 8 val, 12 test = 50 WSIs (arXiv v1 table says 25 train). Pixel size 0.11 um for normal, 5/6Nx and DN slides;
  NEP25 is 0.24-0.25 um. Mask label values not verified. enricher: voxel size null (was 110 nm; arXiv Table: 0.11
  um/px except NEP25 0.24/0.25 um/px). Same Synapse project as PR #719.'
