title: 'KPIs 2024 Challenge: PAS-stained mouse kidney whole-slide images with glomerulus masks'
short_name: Mouse kidney glomeruli segmentation (PAS WSI)
description: Whole-slide images of periodic acid-Schiff (PAS) stained kidney sections from four mouse models (normal,
  5/6 nephrectomy, diabetic nephropathy, NEP25 transgenic), with pixel-level glomerulus masks annotated by three pathologists
  in QuPath. Released for the Kidney Pathology Image Segmentation (KPIs) Challenge 2024 as training, validation and
  testing sets, for patch-level (2048x2048 PNG patches) and whole-slide segmentation. About 10,000 annotated glomeruli.
