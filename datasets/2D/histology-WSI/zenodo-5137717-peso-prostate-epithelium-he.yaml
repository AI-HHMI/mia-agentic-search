description: 62 training and 40 hold-out test H&E whole-slide images of radical prostatectomy specimens
  (3DHistech Pannoramic Flash II 250, 20x), each with a pixel-wise epithelium mask. Training masks come
  from a U-Net run on the registered immunohistochemistry (P63 and CK8/18) restain of the same section,
  25 of them manually corrected; test masks are manually corrected colour-deconvolution masks of 40 regions.
