notes: 'Zenodo description and API file list read in full (18 files, about 135 GB; license cc-by-nc-sa-4.0
  from the API record). Zip indexes read with peek_archive: peso_training_wsi_N.zip and peso_testset_wsi_N.zip
  hold pds_N_HE.tif slides (1.2-1.8 GB each; 10 per archive, 12 in the last), peso_testset_groundtruth_masks.zip
  40 TIFFs, peso_training_masks_corrected.zip 25 TIFFs, peso_training_masks.zip 62 TIFFs; peso_testset_png.zip
  contains 160 .jpg crops despite its name. 0.48 um/pixel WSI export is stated on the Zenodo page; paper
  Methods give 20x, 3DHistech Pannoramic Flash II 250 and the IHC restain. Training masks are machine-generated
  (U-Net on IHC, paper: not manually corrected except the 25-slide corrected subset), so annotation source
  is mixed. Training WSI count 62 + test 40 slides gives n_items 102. WSI internal format (tiled pyramid
  vs flat TIFF) not inspected. No single direct archive, so download_url is null.'
