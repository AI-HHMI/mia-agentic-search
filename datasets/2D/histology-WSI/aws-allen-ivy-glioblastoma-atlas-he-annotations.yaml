notes: 'S3 listing complete: 116,181 files, 9.36 TB (per specimen: annotation, boundary, primary JPEGs, 31,857 each, expression JPEGs 20,607, plus metadata JSON). Probed one primary and one annotation JPEG: both 18,176 x 15,104 RGB. Paper states 0.5 um/pixel; not stored in the JPEGs, so voxel size is null. H&E vs ISH split of the primary images and the annotation colour-to-class mapping were not established (docs site redirects to a forum). Registry: annotations by a machine learning process trained by physicians; paper: neuropathologist outlines plus ML for H&E (accuracy in Table S5, not read). License: Allen Institute terms of use.'
