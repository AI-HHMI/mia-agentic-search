title: Allen Ivy Glioblastoma Atlas (histology and ISH section images with anatomic feature annotations)
short_name: Ivy glioblastoma histology tumor-feature masks
description: Whole-slide images (about 18,000 x 15,000 px JPEGs, 0.5 um/pixel) of human glioblastoma tissue
  sections from the Ivy GAP resource, histology-stained sections and adjacent in situ hybridization sections,
  31,857 primary images in 946 specimen folders. Each image comes with an annotation image of the anatomic
  tumor features (e.g. leading edge, infiltrating tumor, cellular tumor, pseudopalisading cells, microvascular
  proliferation) produced by a machine learning application trained on expert neuropathologist outlines,
  a boundary image, and for ISH sections an expression image.
