title: KPIs 2024 Kidney Pathology Image Segmentation Challenge dataset
short_name: Mouse kidney glomeruli segmentation (PAS WSI)
description: Periodic acid-Schiff stained whole slide images of mouse kidneys from four models (normal, 5/6 nephrectomy, diabetic
  nephropathy, NEP25), with glomeruli annotated by three pathologists in QuPath. Training/validation/test splits are provided
  as WSIs (pyramidal TIFF) and 2048x2048 PNG patches; the test set is private to the challenge.
