notes: 'Well-known challenge benchmark; data hosted on Synapse (synapse.org/kpis24), obtained by joining the KPIs
  2024 Data Access Team via a Google form, hence access on-request (confidence capped). No data license or terms
  found on the challenge pages or in the arXiv paper; the journal version (Medical Image Analysis, doi 10.1016/j.media.2026.104234,
  PMID 42612515) has no open full text. Counts from arXiv Table 1: training 25 WSIs / 4918 patches, validation 8
  / 1643, testing 12 / 2305 (the test set is private); the abstract says 50 WSIs and the text elsewhere 60+, so
  counts are inconsistent. Synapse not fetched, so file listing, mask format and total size are unknown; voxel size
  110 nm from the stated 0.11 um/px for most WSIs (NEP25 differ).'
