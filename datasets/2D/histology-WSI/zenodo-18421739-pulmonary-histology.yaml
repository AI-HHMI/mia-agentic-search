notes: 'Checked the Zenodo record, API record, README and zip listing (peek_archive: 2178 PNG + README). README states
  235 training and 129 test images of 512x512 px, labelled with LabelMe; the PNG count (2178, mostly per-class masks)
  was not reconciled with it, so n_items is the PNG file count. Pixel/voxel size is not stated on the record or README
  (scan is described as 40x equivalent only). No paper is cited on the record or README, so none was read. README
  also describes nuclei sub-image annotations (epithelial and stromal), which were not seen in the zip listing.'
