title: 100,000 histological images of human colorectal cancer and healthy tissue (NCT-CRC-HE-100K, CRC-VAL-HE-7K)
short_name: Colorectal H&E tissue-class patches (NCT-CRC-HE)
description: 100,000 non-overlapping 224 x 224 px H&E patches (0.5 um/px, Macenko colour-normalised) hand-delineated from 86 colorectal cancer and normal-tissue slides, each labelled with one of nine tissue classes (adipose, background, debris, lymphocytes, mucus, smooth muscle, normal mucosa, cancer-associated stroma, colorectal adenocarcinoma epithelium). Also includes the CRC-VAL-HE-7K external validation set of 7,180 patches from 25 patients and a non-normalised copy of the training set.
