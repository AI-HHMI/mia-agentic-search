  notes: 'Listing: Zenodo API + zip central directories, 3 zips, 207,180 TIFF members, 24,217,213,831 bytes (file-listing, complete). Probed 4 members (one per zip, plus a second ADI): plain single-page RGB TIFF, 224x224x3 uint8, PackBits, no resolution tag used. Sampled 4 members (ADI, TUM from 100K; TUM from VAL; MUS from NONORM; ~0.48 MB): value ranges are per array from one file each; RGB samples not identical. Labels are folder names only (no label arrays); classification signal per patch. Voxel size 0.5 um/px from Zenodo description ("224x224 pixels (px) at 0.5 microns per pixel"); file headers carry no calibration. Conflict: Zenodo says CRC-VAL-HE-7K comes from N=50 patients, the paper says 25 slides / 25 patients. No single archive for the whole dataset: three direct Zenodo zips (all usable with range requests). Readiness: 2D records are not covered by the miao layout yet.'
