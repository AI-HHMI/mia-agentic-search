notes: 'Zenodo files: NCT-CRC-HE-100K.zip (11.7 GB, colour-normalised), NCT-CRC-HE-100K-NONORM.zip (11.7 GB) and CRC-VAL-HE-7K.zip (0.8 GB). Only CRC-VAL-HE-7K.zip was listed with peek_archive (7,180 TIFF patches in class folders); the 100K archives were not listed, so their file layout is taken from the Zenodo description and paper. Size counts the three archives; n_items counts 100,000 training plus 7,180 validation patches (NONORM is a second copy of the training patches). The 224 x 224 px, 0.5 um/px and nine classes come from the Zenodo description and the paper.'
