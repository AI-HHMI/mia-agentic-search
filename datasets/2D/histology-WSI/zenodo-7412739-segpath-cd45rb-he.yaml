id: zenodo-7412739-segpath-cd45rb-he
title: 'SegPath: large-scale annotation dataset for cell/tissue segmentation in H&E images (anti-CD45RB (leukocytes))'
short_name: SegPath leukocyte segmentation (H&E)
description: H&E image patches (984 x 984 px, 40x, 0.22 um/px) of human tumour sections paired with binary leukocytes
  masks. Masks were generated by destaining the H&E slide, immunofluorescence restaining with CD45RB and thresholding
  the fluorescence, not by manual drawing. This is one of the eight SegPath Zenodo records (one per antigen); a CSV
  assigns each patch to train, validation or test.
