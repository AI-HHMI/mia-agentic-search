notes: Only the TCIA collection page (Version 3, 2022-08-01) and the paper abstract were read. The page lists 273 subjects/images,
  about 40 GB of SVS slides and XML annotations, clinical data for 85 subjects, CC BY 4.0, and Aspera download. A senior breast
  pathologist outlined invasive carcinoma ROIs, excluding necrosis, in situ carcinoma and benign stroma and epithelium. The
  file listing was not inspected (Aspera). The slide resolution is not given for the TCGA slides and no pixel size is stated
  for the Yale slides. The paper full text was not retrieved (no full text in Europe PMC); the abstract says the classifier
  was trained on 188 annotated WSIs. Only the first author named on the page citation (Farahmand, S., et al.) is listed; the
  full author list was not taken from the page.
