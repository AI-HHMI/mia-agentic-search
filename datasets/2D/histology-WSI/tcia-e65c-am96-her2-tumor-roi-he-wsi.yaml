description: 'H&E whole slide images of breast cancer with pathologist-outlined invasive carcinoma regions of interest, labelled
  HER2-positive or HER2-negative, in three cohorts: Yale HER2 (192 cases), Yale trastuzumab response (85 cases, with clinical
  data) and TCGA HER2 (182 retained slides). Annotations are Aperio ImageScope XML polygons with X/Y coordinates plus an ROI
  annotation spreadsheet; slides are SVS.'
