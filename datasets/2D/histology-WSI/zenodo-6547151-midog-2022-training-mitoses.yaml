notes: 'Pixel size depends on the scanner and is not constant: 0.23 um/px (Hamamatsu XR / S360), 0.25 um/px (3DHistech Pannoramic Scan II, Aperio CS2) per the challenge paper preprint; voxel_size_nm lists 250 nm as a representative value, per-file DPI is embedded in each PNG. Differs from the already-catalogued MIDOG 2021 training set (200 breast cases): this release has 405 cases of six tumor types and species; 150 of its human breast cancer cases are also part of MIDOG 2021 and much of the data overlaps with MIDOG++. Counts and annotation formats are from the Zenodo record and file listing; a TIFF version exists as a separate Zenodo record (6474727) which was not examined. The paper is cited by its arXiv preprint (publisher DOI not verified).'
