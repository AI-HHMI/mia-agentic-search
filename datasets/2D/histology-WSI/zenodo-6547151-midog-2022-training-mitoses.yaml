title: MItosis DOmain Generalization Challenge 2022 (MICCAI MIDOG 2022), Training data set (PNG version)
short_name: MIDOG 2022 multi-tumor mitotic figures (WSI)
description: 405 hematoxylin-eosin stained 2 mm2 regions of interest cropped from whole slide images of six human
  and canine tumor types (canine lung cancer, human breast cancer, canine lymphoma, human neuroendocrine tumor,
  canine cutaneous mast cell tumor, human melanoma), released as PNG. Mitotic figures (9501) and hard negative look-alikes
  (11051) are annotated as bounding boxes in MS COCO JSON and SlideRunner SQLite. Training data of the MICCAI MIDOG
  2022 challenge; the melanoma cases are unlabeled.
