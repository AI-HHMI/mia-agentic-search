notes: 'Pixel size depends on the scanner (paper: 0.23 um/px Hamamatsu XR/S360, 0.25 um/px Pannoramic Scan II and
  Aperio CS2); each PNG stores its own in pHYs (227-253 nm in 9 files read). Differs from the catalogued MIDOG 2021
  set (200 breast cases): 405 cases, six tumor types; 150 breast cases are also in MIDOG 2021, much overlaps MIDOG++.
  TIFF version: Zenodo 6474727 (not examined). enricher: voxel size 250x250 -> null (sub-datasets differ). organisms:
  355-405.png = unlabeled human melanoma (51 images without annotations, matching the 51 melanoma cases); the file-to-domain
  mapping of 001-354 (Homo sapiens breast/NET vs Canis lupus familiaris lung/lymphoma/MCT) is not stated in the
  sources read.'
