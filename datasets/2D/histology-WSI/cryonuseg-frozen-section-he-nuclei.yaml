notes: 'Landing page, image count (30), patch size (512x512), 40x, organs, ROI/mask formats and MIT licence
  taken from the GitHub README (summarised by WebFetch); paper (arXiv preprint PDF) gives the TCGA frozen-section
  selection and nuclei counts (about 7.5-8.0k per annotation round). The Kaggle page was not fetched,
  so file listing, total size and and the image file format (recorded as other, not stated in README or
  paper) are unconfirmed. Pixel size and scanner are not stated in the README or the preprint text read.
  The licence applies to the GitHub/Kaggle release; the underlying TCGA images are public TCGA data. The
  Elsevier article is CC-BY 4.0. enricher: pixel size 248.5 nm from the TIFF calibration (ImageJ, um),
  plausible for 40x; channels 3; formats tiff/png from the Kaggle file list (was other); size from the
  Kaggle API.'
