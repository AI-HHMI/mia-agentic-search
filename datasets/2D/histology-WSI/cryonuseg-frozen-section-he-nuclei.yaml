schema_version: '1.2'
id: cryonuseg-frozen-section-he-nuclei
title: 'CryoNuSeg: a dataset for nuclei instance segmentation of cryosectioned H&E-stained histological
  images'
short_name: Frozen-section H&E nuclei segmentation (CryoNuSeg)
description: 30 image patches (512 x 512 px, 40x) cut from TCGA frozen-section H&E whole slide images
  covering 10 human organs (adrenal gland, larynx, lymph node, mediastinum, pancreas, pleura, skin, testis,
  thymus, thyroid), with manually segmented nuclei from ImageJ ROIs and binary masks. Two annotation rounds
  by one annotator and a second annotator allow measuring intra- and inter-observer variability.
