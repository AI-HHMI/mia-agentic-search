notes: 'The Zenodo file list has 156 PNG files (78 ROI images plus 78 *_mask.png), 3,627,039,468 B. The record links
  no paper and Europe PMC / Crossref title searches did not find one; a likely related article is Gallego et al.
  2021, Comput Med Imaging Graph 89:101865 (not open access, not confirmed to describe this test set), so it is
  not listed. The description says ROIs were extracted at x10 "corresponding to the pixel size ~10um", which is
  not a plausible pixel size, so voxel size is null. enricher: the sampled mask is RGB with two colours (red, green)
  on black; class meanings and annotator not stated. The description calls it a test set; no training data is in
  the record.'
