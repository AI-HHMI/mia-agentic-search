title: 'TCGA-UT: H&E histology patches from uniform tumor regions of 32 cancer types (Zenodo)'
short_name: TCGA-UT pan-cancer H&E patches (histology)
description: 1,608,060 H&E image patches (256 x 256 px, JPEG) cropped from tumor regions that two pathologists
  selected in 8,736 TCGA diagnostic whole slide images (7,175 patients, 32 solid cancer types). Ten patches
  per region were cropped at each of six magnification levels (0.5 to 1.0 um/pixel). One zip per cancer
  type; the cancer type is the label (folder name). Used for the deep texture representation (DTR) pan-cancer
  analysis.
