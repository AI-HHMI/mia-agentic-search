notes: 'License is custom: the Zenodo page states CC-BY-NC-SA 4.0 for non-commercial use and asks commercial
  users to contact the authors; the record metadata id is other-nc; the 314-byte LICENSE file was not
  read. Paper (Cell Reports 2022) is not open access, so only the abstract was read; details come from
  the Zenodo description. The per-image label is the cancer type in the folder name, not region-level
  annotation; patches are tumour regions chosen by two pathologists. Only Cholangiocarcinoma.zip was
  listed with peek_archive (5,400 JPEGs, folders 0 to 5 for magnification level). Pixel size is given
  as a range 0.5 to 1.0 um/pixel by level; x/y here is the finest level. Size is the sum reported by
  the Zenodo search API, not recomputed. A Hugging Face copy (dakomura/tcga-ut) with predefined splits
  exists; this record is the Zenodo copy. Intermediate-data record 7351798 is derived from it.'
