  notes: 'Listing: Zenodo record, one file (listing.py complete, 10,027,826,144 B). probe.py read the
    HDF5 header (262 KB): datasets X [204000,64,64,3] float32 and Y [204000] float32, contiguous, no compression,
    no attributes (sizes add up to the file size). sample.py read one contiguous crop of X (796 tiles,
