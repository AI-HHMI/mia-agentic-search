notes: 'Zenodo record holds a single 10.0 GB HDF5 file (outoffocus2017_patches5Classification.h5) whose description is only "Deepfocus dataset"; the file name suggests 5 classes while the paper describes in-focus vs blurry labels from 8 focus offsets, and the HDF5 contents could not be inspected (no range-readable listing), so the exact class scheme and tile count in the file are unverified. The paper states 360,000 tiles of 64x64 px were generated for training, with 108,000 per class used; pixel size 0.2461 um at 40x (Aperio ScanScope). Labels come from the focus offset, not from manual annotation. The paper describes IRB-approved patient slides (organism recorded as Homo sapiens) but does not name the tissue type in the text read. A separate record, 10.5281/zenodo.1184621 (DeepSlides, 7z archive), was not listed.'
