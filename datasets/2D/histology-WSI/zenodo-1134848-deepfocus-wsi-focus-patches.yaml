notes: 'Zenodo record holds one 10.0 GB HDF5 file (outoffocus2017_patches5Classification.h5), described
  only as "Deepfocus dataset". Paper: tiles of 64x64 px from four slides scanned at 40x (Aperio ScanScope,
  pixel size 0.2461 um) at offsets of -2.5 to +2.5 um; in-focus = offset within +/-0.5 um, blurry otherwise;
  360,000 tiles generated, 108,000 per class used for training. Labels come from the focus offset, not
  manual annotation. Tissue type not named in the text read. enricher: HDF5 probed and sampled: X 204000x64x64x3
  float32 in [0,1], Y 204000 values 0-10 (11 classes, mapping to offsets undocumented); n_items 204000
  from X (was null).'
