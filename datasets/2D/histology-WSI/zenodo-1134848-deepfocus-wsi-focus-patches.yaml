id: zenodo-1134848-deepfocus-wsi-focus-patches
title: DeepFocus out-of-focus tile dataset (H&E and IHC whole-slide image patches with focus labels)
short_name: Whole-slide histology focus-quality tiles (40x)
description: HDF5 file of 64x64-pixel tiles cut from whole-slide scans of H&E, Ki67, CD21 and CD10 stained
  slides, acquired at systematically perturbed focal planes (offsets of -2.5 to +2.5 um around an operator-set
  focus), released as the training data of the DeepFocus out-of-focus (blur) detector. Labels derive from
  the focus offset (in-focus within +/-0.5 um, blurry otherwise).
