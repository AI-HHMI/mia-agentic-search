id: bracs-breast-carcinoma-subtyping-he
title: 'BRACS: A Dataset for BReAst Carcinoma Subtyping in H&E Histology Images'
short_name: BRACS breast lesion subtyping (histology)
description: 547 H&E whole-slide images from 189 patients (Aperio AT2, 40x) and 4,539 labelled regions of interest
  cropped from 387 of them, annotated by consensus of three pathologists into seven lesion subtypes (normal, pathological
  benign, UDH, FEA, ADH, DCIS, invasive carcinoma) and, per WSI, into benign, atypical and malignant. Provided as
  SVS slides, PNG ROIs and QuPath annotation files, with predefined patient-disjoint train, validation and test
  splits.
