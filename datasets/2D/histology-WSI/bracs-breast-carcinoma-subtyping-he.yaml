notes: 'Download needs registering on the BRACS website and agreeing to the terms of use (CC0 per the paper), then
  FTP access; the download and rules pages were not fetched, only the home page and the open-access paper (Database
  2022), so the file listing, total size and current terms are unverified and annotations_verified is false. The
  paper describes the folder layout: Whole Slide Image Set (train/validation/test, then benign/atypical/malignant
  and subtype folders, SVS), Region of Interest Set (PNG, e.g. BRACS_1238_PB_32.png), QuPath annotation files and
  a summary xlsx. ROI labels are classification (7 classes), not pixel masks. Pixel size 0.25 um is read from the
  paper text, where the scanner sentence is partly garbled by formula markup. The home page and paper give 547 WSIs
  and 4,539 ROIs (n_items is their sum); some versions of the paper report 4,391 ROIs. date_published is not stated
  for the dataset itself.'
