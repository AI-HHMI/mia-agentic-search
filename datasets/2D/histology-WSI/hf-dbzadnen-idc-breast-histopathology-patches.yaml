  notes: 'Listing: tools/listing.py on the HF repo: 7 files (5 parquet + README + .gitattributes), 1,678,115,537
    bytes, complete, exact. Read the datasets-server /info (features image + ClassLabel; splits 249,300
    / 13,850 / 13,850) and /rows (first 3 train rows: 50x50, label 0), and the first 256 KB of the test
    parquet (PAR1 magic, PNG-encoded images). No pyarrow in the inspection environment, so the parquet
    schema was not read directly. Patch file names (patient IDs) are not in the parquet columns, so a
    patient-level split is not possible from this mirror. Voxel size not found; checked: card, Hub API,
    datasets server, parquet bytes; Janowczyk & Madabhushi 2016 (harvester) describes 40x scans but this
    mirror is not confirmed to be that data. download_url stays the repo page (5 files, no archive); parquet
