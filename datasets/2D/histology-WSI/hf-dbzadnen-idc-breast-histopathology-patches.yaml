short_name: Breast IDC histopathology patches (H&E)
description: About 277,000 50 x 50 px RGB patches cut from 162 whole-mount breast cancer slides scanned
  at 40x, each labelled invasive ductal carcinoma (IDC) positive or negative, pre-split on the Hugging
  Face Hub into train (249,300), validation (13,850) and test (13,850). The card says it is a copy of
  the Kaggle dataset of the same name (277,524 patches, 198,738 negative and 78,786 positive).
