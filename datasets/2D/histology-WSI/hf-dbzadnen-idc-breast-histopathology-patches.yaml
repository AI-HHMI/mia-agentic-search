notes: 'Mirror of the Kaggle dataset (paultimothymooney/breast-histopathology-images, not fetched here);
  the card names no authors or paper. The 50 x 50 patch size, 40x scan and the IDC task match the IDC
  use case in Janowczyk and Madabhushi 2016 (full text read on Europe PMC), which says the patches came
  from the authors of an earlier paper, but that this mirror is the same data is an inference, so no paper
  is listed. Split sizes sum to 277,000, not the 277,524 in the card text. First rows read through the
  datasets server: 50 x 50 RGB, label 0/1. Patient/slide IDs and the stain (presumably H&E) are not stated
  in the card, and the images are stored inside parquet files (5 files, 1.68 GB). enricher: the embedded
  image bytes are PNG (signatures in the test parquet); formats stays other (parquet). The license CC0-1.0
  is stated on the card.'
