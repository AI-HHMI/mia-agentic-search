notes: 'Zip indexes read with peek_archive for mitosis_ds, lizard_mitosis and eos_val (npy arrays: train/valid/test img + lab); mit_val.zip index could not be read (SSL error). The paper (MIDL 2024 OpenReview PDF) could not be fetched (bot check) and is not in Europe PMC, so pixel size/magnification, annotation procedure, label channel encoding and image counts are not verified; the GitHub READMEs do not state them either. Size is the sum of the four Zenodo files. Lizard part is a modified version of the original Lizard dataset (CC BY-NC-SA 4.0) with an added mitosis class, which the description says is incompletely annotated. The record bundles four zips of one Zenodo deposit as one dataset.'
