notes: 'Zenodo description: patches extracted at 0.5 um per pixel from 512x512 then resized to 224x224 and saved as JPEG, four
  tar.gz archives (colon, ovarian, stomach, uterus) with tumour and non-tumour subfolders. The arXiv paper (read from the PDF)
  states 40 TCGA WSIs per cancer type, tumour/non-tumour regions annotated by one experienced pathologist, and 281,142 patches of
  512x512 px at about 0.5 mpp; n_items is that paper figure and may differ from the archives. tar.gz archives cannot be listed
  remotely, so the folder layout and counts are taken from the Zenodo description and were not checked in the files; hence
  annotations_verified is false. The paper title spells the dataset HISTOPANTUM, Zenodo spells it HISTOPANTUME. The slides come
  from TCGA, so the underlying images are also public elsewhere. download_url is null because there are four separate archives.'
