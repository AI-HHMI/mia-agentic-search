notes: The data is obtained by filling in a Google Form linked from the dataset page, so no file listing could be checked; WSI and annotation
  file formats and total size are unknown (formats other, size null; the GitHub patchify utility processes GeoJSON labels but this
  is not confirmed as the release format). No license is stated on the page, in the GitHub README or in the paper (license unknown).
  Paper Methods give 103 slides, 0.25 um/pixel, Leica Aperio CS2 and a 70/15/15 stratified random train/validation/test split of the
  WSIs; the challenge paper says the same 103-WSI dataset was used with hidden-test scoring on Codabench. Heliyon paper published in 2025; exact date not recorded. Some author names are given as listed by Europe PMC (surname and initials).
