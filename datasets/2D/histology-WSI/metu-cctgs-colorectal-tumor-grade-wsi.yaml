schema_version: '1.2'
id: metu-cctgs-colorectal-tumor-grade-wsi
title: METU Colorectal Cancer Tumour Grade Segmentation (METU-CCTGS)
short_name: Colorectal tumor grade segmentation (H&E WSI)
description: 103 H&E whole-slide images of colon adenocarcinoma biopsies from 103 patients (Ankara Bilkent City Hospital, Leica Aperio
  CS2 scans at 0.25 um/pixel) with dense pixel-wise annotation of tumor grade 1, 2, 3, normal mucosa and other tissue, drawn by two
  pathologists in QuPath. Used for the ICIP grand challenge on colorectal tumor grade segmentation.
