title: DLBCL-Morph - H&E and immunostained DLBCL tissue microarrays with pathologist ROIs and segmented
  tumour nuclei
short_name: DLBCL-Morph lymphoma TMAs with ROIs and nuclei
description: 42 digitally scanned tissue microarrays (SVS, 40x) from 209 diffuse large B-cell lymphoma
  cases at Stanford, each case stained for H&E, CD10, BCL6, MUM1, BCL2 and MYC, with pathologist-drawn
  rectangular regions of interest on every TMA and stain, 224 x 224 PNG patches extracted from the ROIs
  (about 152,000 across the six stains), binary masks of about 1.04 million HoVer-Net-segmented tumour
  nuclei from the H&E patches with geometric features, and clinical and survival data.
