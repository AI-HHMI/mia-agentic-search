notes: 'Zip index of DLBCL-Morph.zip (31.8 GB, 1,189,215 members): TMA/ 42 .svs (19.7 GB) + 2 csv; Patches/
  152,194 PNG (HE 30,007, BCL2 28,028, CD10 26,325, MYC 25,205, MUM1 23,232, BCL6 19,397); Cells/ 1,036,974
  .npy nucleus masks + one 374 MB csv of geometric features; clinical_data.xlsx and clinical_data_cleaned.csv.
  Paper: scanned at 40x, 0.25 um/px (Aperio AT2); ROIs drawn by expert pathologists; nuclei segmented
  automatically with HoVer-Net (not manual), hence source mixed and instance-segmentation labels are model-generated.
  Dataset intended for survival and morphology analysis; no train/test split is provided. License CC0
  from the Figshare API (the paper article is CC BY 4.0).'
