notes: 'Kaggle API record read (CC BY-SA 4.0, 1.05 GB, 705 PNG images in 8-bit RGB, masks as 8-bit grayscale
  PNG). The Scientific Data paper (2026) is not open on Europe PMC and nature.com was not fetchable, so
  scanner, magnification, pixel size and the annotation protocol were not read; the file listing was not
  seen (Kaggle page is JavaScript-rendered). Different from the catalog record figshare-24968940 (H&E,
  609 images, vessel/lumen contours), which is an earlier dataset by the same group. enricher: splits_provided
  true (splits_5fold.csv: filename, animal_id, fold); annotations verified in a sample.'
