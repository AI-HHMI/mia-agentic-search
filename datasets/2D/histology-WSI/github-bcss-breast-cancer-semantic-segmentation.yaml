notes: 'GitHub README states CC0 1.0 for the dataset (MIT for code), default 0.25 microns per pixel (x,y = 250 nm), and that
  masks are PNGs whose file names encode the TCGA slide ROI; a download script (CancerDataScience/CrowdsourcingDataset-Amgadetal2019)
  fetches RGB images from TCGA slides or a single Google Drive folder holds the 0.25 MPP release. The paper (Bioinformatics 2019)
  describes 151 core ROIs for training/validation plus 10 evaluation ROIs, 20,340 final polygonal annotations and 25 participants.
  The Drive folder was not opened by this run, so file counts, sizes and the PNG format of the RGB images (taken from the README
  and a Hugging Face mirror, MedOtter/BCSS, which lists 151 ROIs) are unverified. The class list sits in meta/gtruth_codes.tsv
  which was not read. n_items counts the 151 core ROIs.'
