    alignment: not-applicable
    alignment_notes: RGB image tiles exported per slide; the file name carries the downsample d and the level-0 region [x,
      y, w, h] (QuPath-style tile names).
  - role: label
    path_pattern: MPP*.tar::MPP*/*/*/ALL/*.png
    format: png
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: null
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 3
    encoding: semantic-ids
    classes:
    - id: 0
      name: non-annotated (ignore)
    - id: 1
      name: tissue
    - id: 2
      name: fold
    - id: 3
      name: dark spot and foreign object
    - id: 4
      name: pen marker
    - id: 5
      name: edge and air bubble
    - id: 6
      name: out of focus
    - id: 7
      name: background
    alignment: same-grid
    alignment_notes: Mask and image tile share the file name apart from the extension (.png vs .jpg), i.e. the same level-0
      region and downsample; 512x512 in both. Pairing by name inferred from the naming; the first tar members read were not
      a matching pair.
  notes: 'Complete Zenodo listing: 3 tar archives, 5,355,335,680 B (tools/listing.py, size_source file-listing). Tar has no
    index, so tile counts per archive are unknown (walking every header by range request is not feasible); only the first
    140 KB of MPP20.tar were read (one range request): 4 directory entries, then tiles of Prostate case 5fe08b37..._102333.
    Measured with PIL: two .jpg tiles 512x512x3 uint8 RGB, ranges [55,255] and [68,255]; two .png masks palette mode (P) 512x512
    uint8, values {1} and {0,1,3}. Value ranges are from these few tiles. Class ids: Zenodo lists 0 = non-annotated (ignore)
    and the seven classes in this order; the GrandQC README gives the same coding for the model output (tissue 1, fold 2,
    dark spot/foreign object 3, pen 4, air bubble/edge 5, out of focus 6, background 7). d=7.59601 with w=3889 gives 512 px
    tiles at 2.0 um/px. Size estimate not needed (listing). Voxel size: per archive only (1.0 / 1.5 / 2.0 um/px).'
