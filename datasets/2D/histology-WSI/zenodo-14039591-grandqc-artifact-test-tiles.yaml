title: Test Dataset from Weng Z. et al. Nat Communications 2024 (GrandQC)
short_name: H&E slide artifact segmentation tiles (GrandQC)
description: Tiles from 318 H&E whole-slide images (78 breast, 80 colon, 80 kidney, 80 prostate; 40x Leica GT450 scans
  with artifacts deliberately introduced) with manual pixel masks for seven slide-quality classes (tissue, fold, dark spot
  and foreign object, pen marker, edge and air bubble, out of focus, background). Provided at three resolutions (1.0, 1.5
  and 2.0 um/px) as JPEG tiles with PNG masks.
