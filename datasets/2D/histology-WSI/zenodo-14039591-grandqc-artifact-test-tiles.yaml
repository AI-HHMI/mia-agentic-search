  arrays:
  - role: raw
    path_pattern: MPP*.tar::MPP*/*/*/ALL/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 512
    - 512
    - 3
    shape_varies: null
    dtype: uint8
    compression: jpeg
