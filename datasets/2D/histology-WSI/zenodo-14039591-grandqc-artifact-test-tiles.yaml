notes: 'Test set of the GrandQC paper (Methods read in Europe PMC full text: 318 slides, 80 cases, Leica GT450 at 40x, artifacts
  produced on purpose, out-of-focus areas annotated manually). Training data and the slides are not in this record. enricher:
  voxel size set to null (was 1000 x 1000): the three archives are the same tiles at three stated resolutions, MPP10.tar 1000
  nm/px, MPP15.tar 1500 nm/px, MPP20.tar 2000 nm/px (Zenodo description), so no single value applies. enricher: size 5,355,335,680
  B from the Zenodo file listing (was 5,355,000,000). enricher: tiles are 512x512 RGB JPEG with palette PNG class masks (sampled
  from MPP20.tar).'
technical:
