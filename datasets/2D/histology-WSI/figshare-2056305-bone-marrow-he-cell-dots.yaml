  page says Apache 2.0 but the GitHub README says code is for non-commercial use only (BSD-style notice);
  the data conditions of use say to cite the paper (Kainz et al., "You Should Use Regression to Detect
  Cells", MICCAI 2015, Springer LNCS; figshare reference doi 10.1007/978-3-319-24574-4_33). Paper full
  text not retrievable via Europe PMC, so it is not listed in publications. Pixel size not stated beyond
  40x. Annotation txt format not read. Checked: figshare record, GitHub repository page and data folder
  listings.'
