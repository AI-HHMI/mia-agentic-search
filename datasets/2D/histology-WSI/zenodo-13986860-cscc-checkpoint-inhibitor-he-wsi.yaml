notes: 'Zip listing read with peek_archive (cSCC_CPI.zip: 45 NDPI slides of 0.7 to 4.7 GB in no_response and response folders, 76.3 GB uncompressed); the CSV (17 no_response SD/PD, 28 response CR/PR) was read in full. Labels are patient-level treatment responses from clinical and radiological review (WHO criteria, at least two observers), not tissue annotations; NDPI is a Hamamatsu whole-slide format with no matching enum value, so formats is other. The scanner and magnification of these 45 slides, and their pixel size, are not stated on the Zenodo page or in the paper text read (the NucSeg slides were scanned on a Hamamatsu NanoZoomer). Different data from the NucSeg/TumSeg annotation record of the same paper (Zenodo 15973142, which has its own PR): this record holds the 45-slide immunotherapy cohort, the use-case used to test the pipeline. Small cohort (n=45) for a classification task.'
