title: 'PUMA: Melanoma histopathology dataset with tissue and nuclei annotations'
short_name: Melanoma nuclei and tissue segmentation (H&E)
description: 'Training set of the PUMA dataset: 206 H&E-stained melanoma regions of interest (103 primary, 103 metastatic),
  1024 x 1024 px at 40x (0.23 um/px), each with a 5120 x 5120 px context ROI. Manual nuclei annotations (tumor,
  lymphocyte, other and finer classes) and tissue annotations are supplied as GeoJSON.'
