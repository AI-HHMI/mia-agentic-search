notes: 'Archives listed with peek_archive: ROI zip has 205 .tif + 1 .tiff; nuclei zip has 206 .geojson files; tissue
  GeoJSON zip and context-ROI zip (14 GB) were not opened. size_bytes is the sum of the four files. Paper Methods:
  Hamamatsu scanner, 40x, 0.23 um/px; annotated by a medical expert and checked by a dermatopathologist. Paper states
  310 ROIs in total; only the 206-ROI training set is public. Zenodo record lists CC0; paper text also mentions
  CC-BY for the article. Nuclei class list beyond the 3-class scheme not verified. enricher: ROI TIFFs are 1024x1024
  RGBA uint8 (sample); GeoJSON classes seen include nuclei_tumor, nuclei_lymphocyte, nuclei_apoptosis, tissue_tumor,
  tissue_necrosis.'
