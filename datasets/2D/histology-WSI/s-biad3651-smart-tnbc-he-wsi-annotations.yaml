notes: 'Listing of the archive HTTP index (sizes estimated): Files/HE_WSIs has 76 ndpi slides, 76 geojson and 75 ndpa files, about 136 GB. The study record says a consultant pathologist annotated regions (normal epithelium, invasive tumour, DCIS, lymphovascular invasion, necrosis, fibrosis, stroma, inflammation, mixed, indeterminate) and that slides were scanned on a Hamamatsu NanoZoomer S60 at 20x or 40x. Spot check: the NDPA XML holds freehand outlines with free-text titles; the sampled GeoJSON files hold only rectangles named by sample ID (LEAP###), so labels are free text, not a fixed vocabulary. Coverage per slide and per-class counts were not measured. Pixel size is not in the study record or the TIFF header read. No publication is linked on the study page. enricher: size from the BioStudies files API (227 files, exact). Pixel size mixed: 20x slides 442.4 nm, 40x slides 221.0 nm (NDPI headers), so left null.'
