notes: 'Single file histopathology.pkl.tar.gz (59 MB): one Python-2 pickle (protocol 0) of a dict {training,
  validation, test}, each a list of 28x28 float64 NumPy arrays; the record keeps formats=[other] (pickle).
  No class labels; keywords say ''unsupervised learning'', first use was training VAEs (Tomczak & Welling
  2016, arXiv 1611.09630). Borderline against the training-signal criterion. Source images from enjoypath.com,
  whose own terms were not checked, so CC BY-SA 4.0 on Zenodo may not cover them. Homo sapiens inferred
  from patient biopsies. enricher: download_url set to the direct Zenodo file (was the record page). enricher:
  voxel size not found (Zenodo record, arXiv paper: only ''40x'', 336x448 source images).'
