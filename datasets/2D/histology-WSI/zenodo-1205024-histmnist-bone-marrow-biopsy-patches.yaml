notes: 'Single file histopathology.pkl.tar.gz (59 MB), a pickled array archive that tar.gz cannot be listed
  remotely, so format and counts come from the Zenodo description: 6,800 train, 2,000 validation and 2,000
  test patches split by patient (10 / 3 / 3 patients). No class labels are described; the keywords say
  ''unsupervised learning'' and the only stated use is training deep generative models (VAEs, Tomczak
  and Welling 2016). Borderline against the training-signal criterion (unlabelled, explicitly for unsupervised
  learning). The source images came from the website enjoypath.com (patients 272-299 listed), whose own
  terms were not checked, so the CC BY-SA 4.0 on Zenodo may not cover them. Pixel size not stated. No
  paper describes the dataset itself (the VAE paper arXiv 1611.09630 is the first use), so publications
  is empty; the ''Homo sapiens'' organism is inferred from patient biopsies.'
