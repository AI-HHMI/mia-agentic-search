notes: 'Three zips (fold_1/2/3, 700 + 659 + 718 MB compressed) each hold images.npy, masks.npy and types.npy plus README files. n_items 7,901 is computed from the array sizes (float64 256x256x3 patches: 2,656 + 2,523 + 2,722), not stated in the READMEs (which say more than 7 thousand patches) or in the arXiv text I read; treat as derived. The folds README gives the CC BY-NC-SA 4.0 licence for the masks/ directory; the licence of the image patches themselves (derived from TCGA slides) is not separately stated. Magnification and pixel size were not found on the page, READMEs or in the arXiv text parsed. Annotation: semi-automatic nucleus detection and classification CNN, verified by a team of pathologists (189,744 nuclei from over 20,000 WSIs per the arXiv paper). Checked: dataset page, all three zip listings, fold 1 README and licence file, arXiv paper.'
