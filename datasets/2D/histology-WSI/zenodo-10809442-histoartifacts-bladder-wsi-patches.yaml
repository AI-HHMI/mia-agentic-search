notes: 'Zip listing (peek_archive): 53,496 PNGs; only part of the folder tree was printed (D20x/fold_20x with fold_20x vs artifact_free_20x
  in training/validation/test, and D40x/test), so full class counts per folder were not checked. The arXiv paper (HTML, first
  100k characters) describes patches of 224x224x3 from 55 Erasmus MC bladder WSIs (35/10/10 split), 0.227 um per pixel at 40x,
  six classes (artifact-free, blood, blur, air bubbles, damaged tissue, folded tissue) annotated manually by one author; its
  table totals 51,697 patches, which differs from the 53,496 files in the zip, and the 20x sub-dataset is not described in the part
  read, so the 227 nm pixel size applies to the 40x patches only. The Zenodo record also cites several earlier papers for
  sub-datasets. The record DOI was not shown in the fetched metadata, so doi is null.'
