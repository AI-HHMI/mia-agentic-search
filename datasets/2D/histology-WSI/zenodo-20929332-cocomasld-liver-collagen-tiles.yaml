notes: 'Read the Zenodo page, API record (CC BY 4.0) and the READMEs inside the two tile zips: 968 pairs
  of 512 x 512 (151 empty masks) and 1,104 extended retraining pairs, confirmed by the zip index. example_slide.zip
  is one PSR .ndpi slide with outputs; the 2.0 GB clustering zip holds probability-map tiles, not annotated
  images. The paper (Hepatology) is not open access, so only its abstract was read: annotators, procedure,
  scanner, pixel size and species are not stated (organism empty, annotation source unknown, voxel size
  null). The READMEs carry an unfinished note about confirming release approval and licence; the record
  states CC BY 4.0. Size is the whole record (tile zips 0.78 GB).'
