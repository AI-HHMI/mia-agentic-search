  notes: 'Zenodo listing complete: 4 zips, 3,395,321,558 bytes (39,743 members). Read README.md, dataset_summary.json
    (968 pairs, all 512x512, 151 empty masks) and manifest.csv of the v1 zip. Sample tile 000005: RGB uint8 14-255,
    mean 191.6; mask 1-bit PNG, values {0: 246,068, 1: 16,076}. One sample; tools/sample.py crashed on the 1-bit
    mask (bool dtype in np.percentile), so the mask was measured with its helpers after a cast to uint8. The extended-retraining
    zip has the same layout (listing), not sampled. The clustering zip (probability maps) and example_slide.zip
    (NDPI WSI + outputs) carry no training labels and are not arrays here. Pixel size not found; checked: JPEG/PNG
    headers, Zenodo API record, README.md, dataset_summary.json, manifest.csv columns, GitHub repo mkatw/decoding-fibrosis
    (README: slides scanned at 40x, no tile pixel size; collagen-segmentation code), paper (not open access, abstract
    only). Whole dataset is 4 zips; download_url is the v1 tile zip.'
