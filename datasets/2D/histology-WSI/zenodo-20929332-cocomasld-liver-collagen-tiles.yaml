short_name: Liver collagen segmentation tiles (PSR histology)
description: 2,072 paired 512 x 512 picrosirius red (PSR) liver histology tiles and binary collagen masks (968 from
  the discovery cohort, 1,104 from an extended retraining set), released with the Decoding Fibrosis collagen-phenotype
  pipeline. The record also holds an example PSR whole-slide image (NDPI) with expected outputs and a 2 GB pool
  of collagen probability-map tiles for clustering.
