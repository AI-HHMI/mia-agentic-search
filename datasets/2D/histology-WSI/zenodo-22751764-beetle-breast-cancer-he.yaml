title: 'BEETLE: A multicentric dataset for training and benchmarking breast cancer segmentation in H&E slides'
short_name: Breast cancer H&E tissue segmentation (WSI)
description: 587 development H&E whole-slide images of breast cancer biopsies and resections (seven scanners, three clinical
  centers plus two public datasets) with pixel-level masks for four tissue classes (invasive epithelium, non-invasive epithelium,
  necrosis, other), plus an external evaluation set of 54 WSIs with 170 ROI tiles whose annotations are sequestered on Grand
  Challenge.
