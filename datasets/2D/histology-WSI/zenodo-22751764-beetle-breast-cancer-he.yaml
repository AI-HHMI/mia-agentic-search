notes: 'Sources: Zenodo API record, zip indexes (tools/peek_archive.py) and the arXiv abstract. Zenodo files: images.zip
  (147.2 GB; 433 WSI .tif plus 170 ROI .png), annotations.zip (1.8 GB; 423 mask .tif, 423 .xml, 424 .json), model.zip
  (1.9 GB), data_overview.csv (per-WSI source, scanner, split, validation fold and annotation_provenance, e.g. model-assisted).
  Annotation source is mixed because the overview lists several annotation strategies. Pixel size not stated on the
  Zenodo page or arXiv abstract (full paper text not retrievable via tools/paper.py); may be in the WSI TIFF headers.
  n_items is the 587 development WSIs stated on the page; the zip holds 433 WSI tifs, so the count differs. The 170 evaluation
  ROI masks are withheld. size_bytes is the sum of the four Zenodo files. Direct download is one file per zip.'
