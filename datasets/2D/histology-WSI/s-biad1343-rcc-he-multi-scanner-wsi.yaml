notes: 'No labels: the record is released so researchers can "train, test, and validate" models that normalise
  scanner-related colour and resolution differences (the MultiPathGAN stain normalisation paper), use.
  The file list has 599 slide files, 586 GB: 200 .czi (two Zeiss Axio Z1 scanners), 199 .ndpi (two Hamamatsu),
  100 .svs (Leica) and 100 .isyntax (Philips), so 100 cases on six scanners with one slide missing; ndpi
  and isyntax are not in the schema format list so they are left out of data.formats. Scan resolutions
  from the record: Zeiss 20x 0.22 um/px, Hamamatsu 0.45 / 0.42 um/px, Philips 40x 0.25 um/px (Leica value
  cut off; enricher: Aperio header of a Leica .svs says MPP = 0.5030 um); pixel size therefore varies
  by scanner and is not set. Whether the six scans of a case are registered pairs is not stated. The paper
  is not open access (abstract only). Checked: BioStudies record and file list, Crossref.'
