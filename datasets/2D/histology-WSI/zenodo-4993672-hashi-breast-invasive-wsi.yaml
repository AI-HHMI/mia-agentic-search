  notes: 'Listing: Zenodo API + zip central directories (1421 members), complete. value_range of the raw array is
    from one sample (CINJ 10306_idx5.png); label values from CINJ 10306.png (bool) and HUP 15512_annotation_mask.png
    ({0,255}, RGB). tools/sample.py fails on 1-bit PNGs (numpy bool percentile), so the CINJ mask was read with
    a small PIL script. Voxel size not found for the scaled PNGs; checked: PNG headers (no pHYs calibration reported),
    Zenodo API description, XML annotations (MicronsPerPixel 0.2514 = full-resolution scan), paper Methods (40x
    scans at 0.2456 um/px Aperio, 0.23 um/px Ventana, "further downsampled by a factor of 32:1" for the paper, but
    the released files are named idx5 and idx8 and the factor of each is not stated; cohorts also mix two scanners,
    so no single pixel size). data.download_url stays null: the dataset is 13 separate Zenodo files, direct links
    are https://zenodo.org/records/4993672/files/<name>.'
