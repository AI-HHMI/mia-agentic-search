notes: 'Record is on Zenodo (also DOI 10.5061/dryad.1g2nt41). Per-cohort zips: TCGA (195 images/masks), CWRU (110
  images, idx8), HUP (239 masks; images in two parts) and CINJ (40 masks); image counts for HUP and CINJ not listed.
  Splits follow the paper: HUP and CWRU train, CINJ validation, TCGA (195) test; the trained CNN (model_epoch25.net)
  is also included. Voxel size not given for the downsampled files (native 0.2456/0.23 um/px per paper Methods).
  TCGA source slides are governed by the GDC license. enricher: channels 3 (RGB) and n_items 584 images (40 CINJ
  + 110 CWRU + 239 HUP + 195 TCGA) from the zip listing (were null).'
