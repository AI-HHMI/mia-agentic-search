notes: 'Checked Zenodo record and API, the zip listing (3,526 PNGs, one 43 MB JSON) and the Scientific Data paper
  (Methods, Data Records). Annotations were made manually in Napari/AnnotatorJ and EXACT under supervision of expert
  pathologists. Paper says 5,423 annotations (799/807/1200/103/298/620/1596 per category). The paper calls the annotation
  file Lung_mito.json while the Zenodo description calls it Lung_mito_extended.json; the name inside the zip was not
  inspected. The paper uses LUNG-MITO as an evaluation set; no train/val/test split is provided for it. The record
  also contains MIDOGpp_subtyping.json (104 MB, 26,283 annotations on 503 MIDOG++ images); those images are hosted
  separately and MIDOG++ is already in the catalog, so this record covers only the LUNG-MITO images.'
