title: 'LUNG-MITO: subphase-labeled mitotic figures in lung adenocarcinoma H&E tiles'
short_name: Lung adenocarcinoma mitotic subphases (H&E)
description: 3,526 anonymized 1024x1024 RGB PNG tiles from 21 H&E-stained whole slides of 10 human lung adenocarcinoma
  patients (3DHISTECH PANNORAMIC 1000, 0.24 um/px, 40x). A COCO JSON gives 5,423 manually segmented objects with
  bounding boxes, each labeled as prophase, prometaphase, metaphase, anaphase, telophase, non-mitotic hard negative
  or atypical mitotic figure. The same Zenodo record also holds MIDOGpp_subtyping.json, subphase labels for MIDOG++.
