  - role: label
    path_pattern: NucSeg_OriginalFormat.zip/NucSeg_OriginalFormat/*/ClassMaps/*.npy
    format: other
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: false
    dtype: int32
    compression: none
    value_range:
    - 0
    - 5
    encoding: semantic-ids
    classes: null
    alignment: same-grid
    alignment_notes: 'Docs: type ranges 0..K, 0 = background; five types named (granulocytes, lymphocytes, plasma cells, stromal
