title: 'Histo-Miner: NucSeg and TumSeg datasets (cutaneous squamous cell carcinoma H&E)'
short_name: cSCC H&E nuclei and tumor segmentation
description: Training datasets of the Histo-Miner paper on cutaneous squamous cell carcinoma H&E whole-slide images. NucSeg has 6,816 patches (560x560 px, 70% overlap) from 24 WSIs of 20 patients with manual nuclear instance masks and five nuclear types (47,392 nuclei); TumSeg has 144 WSIs (downsampled to 1.25x) with binary tumor-region masks. The record also holds a larger uncurated nucleus set intended for pretraining only.
