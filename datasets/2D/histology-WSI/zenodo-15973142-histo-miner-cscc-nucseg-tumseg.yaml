notes: 'Zenodo deposit with four archives: NucSeg.zip (6.9 GB, Hovernet-format arrays), NucSeg_OriginalFormat.zip (312 MB, 5118 .npy files in split folders (Val seen) with RawImages/InstanceMaps/ClassMaps), TumSeg.zip (1.25 GB; 144 TIFF WSIs + 144 PNG masks), UncuratedSCC.zip (6.0 GB, uncurated labels, pretraining only). Record description says NucSeg patches come from 24 WSIs of 20 patients while the paper says 21 WSIs; counts left as stated by each source. Pixel size in um not stated (NucSeg mix of 40x and 20x, TumSeg downsampled to 1.25x). The NucSeg numpy arrays are not a listed format, so formats lists only tiff (TumSeg). License is non-commercial (CC-BY-NC-SA-4.0).'
