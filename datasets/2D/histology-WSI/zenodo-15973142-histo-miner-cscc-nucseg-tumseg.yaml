    compression: none
    value_range:
    - 19
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: TumSeg WSIs downsampled to 1.25x, plain single-page RGB TIFF (photometric 2); sizes vary (504x600 to
      2710x2584 seen).
  - role: label
    path_pattern: TumSeg.zip/TumSeg/*/annotations/tumseg_*.png
    format: png
    axes: yx
    shape:
    - 2710
    - 2584
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 1
    encoding: binary
    classes:
    - id: 0
      name: non-tumor
    - id: 1
      name: tumor
    alignment: same-grid
    alignment_notes: 'Pairing rule: TumSeg/<split>/images/tumseg_N.tif pairs with TumSeg/<split>/annotations/tumseg_N.png
      (same shape in two probed pairs). Values {0,1}; docs describe binary tumour-region masks.'
  - role: raw
    path_pattern: NucSeg_OriginalFormat.zip/NucSeg_OriginalFormat/*/RawImages/*.npy
    format: other
    axes: yxs
    shape:
    - 256
    - 256
    - 3
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: NumPy .npy RGB patches (256x256, non-overlapping) from 40x and 20x WSIs; magnification per WSI in NucSeg_PatientID.csv.
  - role: label
    path_pattern: NucSeg_OriginalFormat.zip/NucSeg_OriginalFormat/*/InstanceMaps/*.npy
    format: other
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: false
    dtype: int32
    compression: none
    value_range:
    - 0
    - 165
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: 'Pairing rule: same file name in RawImages/, InstanceMaps/ and ClassMaps/. Docs: inst ranges 0..N, 0
