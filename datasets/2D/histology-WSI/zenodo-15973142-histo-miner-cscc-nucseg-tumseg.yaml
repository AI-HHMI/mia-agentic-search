    .npy read with numpy allow_pickle=False via a range-read script. Pixel size not found; checked: TIFF/PNG headers, Zenodo
    API record, NucSeg_PatientID.csv (magnification only: 40x/20x), paper full text (Methods: NanoZoomer, magnifications only).
    Subsets mix 40x, 20x and 1.25x, so no single voxel size applies. GitHub repo bozeklab/histo-miner not reachable from this
