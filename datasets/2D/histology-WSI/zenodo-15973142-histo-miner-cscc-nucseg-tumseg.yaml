notes: 'Zenodo deposit with four archives: NucSeg.zip (6.9 GB, Hovernet-format 540x540x5 .npy arrays), NucSeg_OriginalFormat.zip
  (312 MB, 1,706 256x256 patches as .npy in RawImages/InstanceMaps/ClassMaps, Train/Val), TumSeg.zip (1.25 GB; 144 RGB TIFF
  WSIs at 1.25x + 144 PNG masks, Train 115/Val 29), UncuratedSCC.zip (6.0 GB, uncurated labels, pretraining only). Record
  says 24 WSIs of 20 patients, paper says 21 WSIs; NucSeg_PatientID.csv lists 21 (14 at 40x, 7 at 20x). Pixel size in um not
  stated. .npy is not a listed format. License CC-BY-NC-SA-4.0. enricher: channels 3 (RGB) from samples (was null); formats
  add png (TumSeg masks); description corrected from 560x560 to 540x540 (sample, paper).'
