title: LUAD-MIT-25K
short_name: Lung adenocarcinoma mitosis points (H&E)
description: Multi-center H&E dataset for mitotic figure detection in lung adenocarcinoma. 2,291 image patches (256 x 256 px,
  rescaled to 0.25 um/px, 40x equivalent) cut from 305 whole-slide images from three medical centers, with point annotations
  for 3,231 mitotic figures and 21,835 tumor nuclei, double-reviewed by pathologists. Patient-level train, internal
  test and external validation splits.
