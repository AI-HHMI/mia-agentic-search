notes: 'Zenodo record (CC BY 4.0, one 4.95 GB zip, open) and the zip listing: 634 HDF5 files under v4_dwtrsd/ with train/ (307 pix_data and
  graph_data files) and val/ (10 of each). Per the record description the val files add ground-truth labels (gt) and edge labels; train files have raw
  image, superpixels and edge maps only. The paper (arXiv 2107.02600, PDF text read): 317 Drosophila embryo images from Bhide et al. (2020),
  10 with expert annotations used as test data; the cell segmentation dataset is released on Zenodo. Microscope settings, pixel size and the annotation
  procedure are not stated in the record or in the paper text read (the paper refers to Bhide et al. 2020), so voxel_size_nm is null. Only 10 slices
  carry ground truth, so this is mainly a weakly-supervised/prior-based training set; the data are preprocessed (superpixel and graph files) rather
  than only raw images.'
