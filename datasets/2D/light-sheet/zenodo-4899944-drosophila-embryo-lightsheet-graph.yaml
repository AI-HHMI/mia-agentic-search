description: 317 frontal slices of light-sheet microscopy images of Drosophila embryos (307 for training without labels, 10 validation
  slices with expert ground-truth cell annotations), distributed as HDF5 files with the raw image, superpixel map, PlantSeg edge map
  and graph features with edge labels, released for training instance segmentation with a stateless actor-critic on high-level priors.
