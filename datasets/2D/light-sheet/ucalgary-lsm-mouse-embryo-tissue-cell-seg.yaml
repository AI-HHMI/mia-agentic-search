schema_version: '1.2'
id: ucalgary-lsm-mouse-embryo-tissue-cell-seg
title: Light-sheet mouse embryo segmentation - tissues, cells and proliferating cells in DAPI and pHH3
  images
short_name: Mouse embryo tissue and cell masks (light-sheet)
description: Light-sheet (Zeiss Lightsheet Z1) slices of cleared E9.5 and E10.5 mouse embryos with expert
  masks. Three sub-datasets with train, validation and test folders - DAPI-Tissue (neural ectoderm and
  mesenchyme masks), DAPI-Cells (cell masks per tissue, 131x131 px patches) and PHH3-Cells (proliferating-cell
  masks) - released with the LSM CNN segmentation paper.
