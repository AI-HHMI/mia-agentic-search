notes: 'Zip listed with peek_archive (404.5 MB, 999 PNG-only files): DAPI-Tissue train/val/test = 86/36/54
  image+mask pairs, DAPI-Cells = 96/17/54, PHH3-Cells = 86/20/49 (paper table says 55 DAPI-Cells test
  images). The README has only author contacts. No license for the data was found on the lab page, README,
  GitHub repo (code is MIT) or paper (the article is CC BY 4.0), so license is unknown. Paper (PMC page):
  ten embryos (five E9.5, five E10.5), 1024x1024 crops, Zeiss Lightsheet Z1 at 5x zoom; five observers
  segmented tissues, two the test images. Voxel size and mouse strain were not stated in the text read.
  Borealis deposit 10.5683/SP3/AXMCDE (CNN atlases) not used. enricher: DAPI-Cells has only mesenchyme
  cell masks (Mesen_Mask/) in the zip.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "LSM_Segmentation_Dataset.zip  404,503,900 B (Dropbox), 999 members\n  LSM_Segmentation_Dataset/README.txt\
      \  (author contacts only)\n  DAPI-Tissue/{Training,Validation,Test}/Original/  86/36/54 .png  130.6\
      \ MB\n  DAPI-Tissue/{Training,Validation,Test}/Mask/      86/36/54 .png    1.1 MB\n  DAPI-Cells/{Training,Validation,Test}/Original/\
      \   96/17/54 .png    4.9 MB\n  DAPI-Cells/{Training,Validation,Test}/Mesen_Mask/ 96/17/54 _Mesen.png\
      \  69 KB\n  PHH3-Cells/{Training,Validation,Test}/Original/   86/20/49 .png  267.2 MB\n  PHH3-Cells/{Training,Validation,Test}/Mask/\
      \       86/20/49 .png    0.6 MB"
    n_files: 999
    listing_complete: true
  sample:
    urls:
    - https://www.dropbox.com/s/7zkk4j415ncfs47/LSM_Segmentation_Dataset.zip?dl=1::LSM_Segmentation_Dataset/DAPI-Tissue/Test/Original/DAPI_001.png
    - https://www.dropbox.com/s/7zkk4j415ncfs47/LSM_Segmentation_Dataset.zip?dl=1::LSM_Segmentation_Dataset/DAPI-Tissue/Test/Mask/DAPI_001.png
    size_bytes: 912672
    description: One DAPI-Tissue test slice (1024x1024 uint8) and its tissue mask.
  arrays:
  - role: raw
    path_pattern: '*/DAPI-Tissue/*/Original/*.png'
    format: png
    axes: yx
    shape:
    - 1024
    - 1024
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 0
    - 255
    normalization: contrast-stretched
    alignment: not-applicable
    alignment_notes: 'DAPI slice crop; paper: intensity-normalized by percentile equalization (2nd-99.9th
      percentile) before annotation.'
  - role: label
    path_pattern: '*/DAPI-Tissue/*/Mask/*.png'
    format: png
    axes: yx
    shape:
    - 1024
    - 1024
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 0
    - 2
    encoding: semantic-ids
    classes: null
    alignment: same-grid
    alignment_notes: Mask/<name>.png pairs with Original/<name>.png. Values 0, 1, 2 = background plus
      mesenchyme and neural ectoderm (paper); which of 1/2 is which tissue is not stated.
  - role: raw
    path_pattern: '*/DAPI-Cells/*/Original/*.png'
    format: png
    axes: yx
    shape:
    - 131
    - 131
    shape_varies: false
    dtype: uint16
    compression: png
    value_range:
    - 492
    - 3519
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 131x131 DAPI sub-images cut from the DAPI-Tissue slices (paper).
  - role: label
    path_pattern: '*/DAPI-Cells/*/Mesen_Mask/*_Mesen.png'
    format: png
    axes: yx
    shape:
    - 131
    - 131
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 0
    - 0
    encoding: binary
    classes:
    - id: 1
      name: mesenchyme cell
    alignment: same-grid
    alignment_notes: Mesen_Mask/<name>_Mesen.png pairs with Original/<name>.png. Mesenchyme cells only;
      patches without mesenchyme cells are all 0 (DAPI_Patch_018). Some masks are 1-bit PNGs (DAPI_Patch_002).
  - role: raw
    path_pattern: '*/PHH3-Cells/*/Original/*.png'
    format: png
    axes: yx
    shape:
    - 1024
    - 1024
    shape_varies: false
    dtype: uint16
    compression: png
    value_range:
    - 813
    - 65535
    normalization: contrast-stretched
    alignment: not-applicable
    alignment_notes: 'pHH3 slice crop; paper: percentile-based intensity normalization; saturated at 65535.'
  - role: label
    path_pattern: '*/PHH3-Cells/*/Mask/*.png'
    format: png
    axes: yx
    shape:
    - 1024
    - 1024
    shape_varies: false
    dtype: bool
    compression: png
    value_range: null
    encoding: binary
    classes:
    - id: 1
      name: proliferating cell
    alignment: same-grid
    alignment_notes: Mask/<name>.png pairs with Original/<name>.png; 1-bit PNG (probe dtype bool, same
      shape as raw).
  notes: 'Listing: zip central directory, 999 members, 404,503,900 B exact. Probed 6 PNG headers; sampled
    DAPI_001 (raw + mask), DAPI_Patch_018 (raw + mask), PHH3_014 raw (~2.6 MB transferred). Value ranges
    are from one sample each. tools/sample.py fails on 1-bit PNG masks (numpy bool), so the PHH3 and DAPI_Patch_002
    masks were not measured, only probed. DAPI-Cells test has 54 pairs (paper: 55). Voxel size not found;
    checked: PNG headers (no pHYs calibration reported), README, lab page, paper full text (Zeiss Lightsheet
    Z1, 5x zoom; no pixel size), GitHub repo lucaslovercio/LSMprocessing (not readable from this session).
    Dropbox host (www.dropbox.com, redirects to dl.dropboxusercontent.com) is not on the TensorSwitch
    allowlist; the zip and members are usable with TENSORSWITCH_FETCH_HOSTS=www.dropbox.com.'
