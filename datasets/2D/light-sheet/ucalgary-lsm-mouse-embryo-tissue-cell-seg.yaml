notes: 'Zip listed with peek_archive (404.5 MB, 999 PNG-only files): DAPI-Tissue train/val/test = 86/36/54 image+mask pairs,
  DAPI-Cells = 96/17/54, PHH3-Cells = 86/20/49 (paper table says 55 DAPI-Cells test images). The README has only author contacts.
  No license for the data was found on the lab page, README, GitHub repo (code is MIT) or paper (the article is CC BY 4.0), so
  license is unknown. Paper (PMC page): ten embryos (five E9.5, five E10.5), 1024x1024 crops, Zeiss Lightsheet Z1 at 5x zoom; five
  observers segmented tissues, two the test images. Voxel size and mouse strain were not stated in the text read. The torch-em
  loader calls the labels semantic, while the paper says individual cells were labelled by tissue. No exact release date known;
  the newer Borealis deposit (10.5683/SP3/AXMCDE) holds CNN-derived atlases and was not used.'
