notes: 'Zenodo record 15830961 (version of concept 7104304; the older version 7660739 holds fidder_data.zip, 158.8 MB). The
  zip lists 78 files in images/ and 78 in masks/ (156 TIFFs, 739.6 MB uncompressed). Description: images compiled from EMPIAR
