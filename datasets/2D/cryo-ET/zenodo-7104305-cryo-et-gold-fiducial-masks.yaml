notes: 'Zip listed with tools/peek_archive.py: 70 TIFFs (images/ and masks/, 35 pairs by file name; pair count inferred from 46+24 tif files, 71 entries incl. summary.md). Images are single tilt-series projections (2D). Pixel sizes per source dataset per summary.md: 1.35, 2.96, 1.33, 2.24, 1.38 A/px, so no single voxel size is recorded. Organisms: only Mus musculus and E. coli are listed; HIV-1 and SARS-CoV-2 VLP/virus samples and the fungal retromer sample have no NCBI organism given on the page. No associated paper is listed on the Zenodo record and a title search in Europe PMC found none. Source images are derived from EMPIAR; the masks are the new part.'
