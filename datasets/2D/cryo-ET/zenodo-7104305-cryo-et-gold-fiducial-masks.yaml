  notes: 'Listing: tools/listing.py on the Zenodo record, complete with exact sizes (1 zip, 1,682,666,955 B; 71 members, 6.3 GB uncompressed). Sampled two pairs (EMPIAR-10453_TS_015_12.0 and EMPIAR-10164_TS_01_000_0.0); value_range of raw is from the EMPIAR-10164 sample only; the EMPIAR-10453 image is int16 0-7643. Both masks are binary {0,1} stored as int64. TIFF compression ''none'' is inferred: uncompressed member sizes equal pixel bytes plus a small header (probe.py could not read deflated zip members'' headers). Raw dtype differs between sources (float32 vs int16); member sizes suggest EMPIAR-10164/-10631/-10814 share one geometry and -10364 is close to it. Voxel size: per-source values only (1.33-2.96 A/px, Zenodo description and summary.md), so imaging.voxel_size_nm stays null; checked: TIFF headers (sample.py file_info has no calibration), Zenodo API record, summary.md, Europe PMC (no paper). Whether the images are binned relative to the EMPIAR originals is not stated.'
