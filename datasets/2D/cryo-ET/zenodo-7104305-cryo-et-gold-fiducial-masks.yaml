notes: 'Zip lists 35 images/ + 35 masks/ TIFFs paired by file name, plus summary.md. Images are single tilt-series projections (2D). Pixel sizes per source dataset per summary.md: 1.35, 2.96, 1.33, 2.24, 1.38 A/px, so no single voxel size is recorded. organisms: Mus musculus = EMPIAR-10814_*, Escherichia coli = EMPIAR-10364_*; EMPIAR-10164 (HIV-1 VLPs), -10453 (SARS-CoV-2) and -10631 (fungal retromer) have no NCBI organism given on the page. No associated paper is listed on the Zenodo record and a title search in Europe PMC found none. Source images are derived from EMPIAR; the masks are the new part. enricher: annotations.format detailed from sampled masks; n_items confirmed from listing.'
