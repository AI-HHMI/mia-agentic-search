notes: 'Zip ''Training Dataset 80%.zip'' (3.85 GB) listed with peek_archive: 2,054 JPG in 34 class folders (e.g.
  A. lumbricoides fertilized/decorticated/unfertilized, G. duodenalis, E. coli, Taenia spp.), no box or mask files.
  Only the 80% training part is on this record; no validation/test record was found. Paper is Naing et al. 2022
  (PeerJ CS), which describes the source images: ZEISS Primo Vert with Axiocam, 40x, 2560x1920 px, from Mahidol
  University stool films, and used boxes in an in-house tool; those boxes are not in this record. The record text
  itself cites no paper beyond naming Naing et al. (2022); the link between this deposit and the paper is via that
  sentence. Sources checked: figshare record and API, zip listing, paper full text (Europe PMC).'
