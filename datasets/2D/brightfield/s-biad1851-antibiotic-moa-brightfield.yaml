notes: 'organisms: Escherichia coli = ''240711 E coli TIFF/'' and ''260619 E coli HZI TIFF/'', Klebsiella pneumoniae
  = ''260205 K pneumoniae TIFF/''. Pasteur E. coli plates have 4 channels per FOV (Hoechst 33342, SYTOX Green, FM4-64FX,
  brightfield; ch1-ch4 in the file name); K. pneumoniae plates are brightfield only (2400 files each); HZI set is 100x
  brightfield (Keyence). Labels are the experimental condition per image (206 Sample IDs incl. DMSO controls), stored
  in the BIA file-list JSONs, not per-object annotations. Pixel size not stated per se: the preprint gives a 2160x2160
  px field of 139.32 x 139.32 um (Opera Phenix), not used as a stated value; HZI images differ. enricher: size and item
  count from the BioStudies file API (100,444 files incl. 54 .lnk shortcuts); download_url is the HTTPS file tree.'
