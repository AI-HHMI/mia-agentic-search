notes: 'Checked the BioStudies API record (file list has names and formats only, no sizes or counts) and the bioRxiv preprint (first 100k characters; final part and data availability not read). The Nature Communications version is not open access in Europe PMC. Pixel size is not stated directly: the preprint gives a 2160x2160 px field covering 139.32 x 139.32 um (about 64.5 nm/px, Opera Phenix), so voxel size left null. Preprint describes 22 drugs at 0.125-1x IC50 plus control (89 classes), 50 fields of view per well, four plates with plate 4 held out; no split files are provided in the archive listing. Images were 16-bit before training. Labels are the experimental condition, not per-image manual annotation. Total image count and size not stated.'
