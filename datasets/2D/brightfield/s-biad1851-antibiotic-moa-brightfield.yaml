schema_version: '1.2'
id: s-biad1851-antibiotic-moa-brightfield
title: Brightfield images of E. coli and K. pneumoniae treated with antibiotics of eight modes of action
short_name: Antibiotic-treated bacteria (brightfield)
description: Brightfield (and, at Institut Pasteur, FM4-64FX and Hoechst fluorescence) widefield images of Escherichia
  coli K-12 MG1655 and Klebsiella pneumoniae exposed to antibiotics spanning eight modes of action, in 96-well plates
  (E. coli plates 1-4 and K. pneumoniae plates 1-4 from Institut Pasteur on an Opera Phenix Plus, 63x; one E. coli set
  from HZI on a Keyence BZ-X810, 100x brightfield only). Images are stored as TIFF folders with JSON file lists. The
  study used them to train a CNN that classifies drug, concentration and mode of action; labels come from the plate layout
  (treatment condition per well).
