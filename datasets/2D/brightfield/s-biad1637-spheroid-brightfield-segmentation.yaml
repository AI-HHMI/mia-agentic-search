notes: 'File listing (HTTP index of the BioStudies FTP, sizes rounded): data/traing_validation 991 images
  / 990 labels, data/test 104/104, data/clean_spheroids 200/200, extended_data 6,574/6,574. Paper (Methods,
  Data availability): 1,095 FaDu spheroids segmented by expert H1 (883/108/104 split), the extended set
  by a second expert (H2), 2.04 um/pixel; images converted from 16-bit to 8-bit for training. enricher:
  masks sampled as binary 0/1 (was assumed); data/ images are 8-bit, extended_data images 16-bit originals
  (extended_data/README.txt).'
