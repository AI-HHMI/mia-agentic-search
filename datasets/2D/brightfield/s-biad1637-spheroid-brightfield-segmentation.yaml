schema_version: '1.2'
id: s-biad1637-spheroid-brightfield-segmentation
title: 'Brightfield images of treated and untreated FaDu/SAS tumour spheroids with manual spheroid segmentation masks'
short_name: Tumour spheroid segmentation (brightfield)
description: 'Brightfield time-series images of head and neck cancer (FaDu, SAS) multicellular tumour spheroids
  after X-ray irradiation and hyperthermia, with binary PNG segmentation masks drawn by biological experts.
  Includes 991 training/validation images and 104 hold-out test images (FaDu, 883/108/104 split), 200
  clean-spheroid images and an independent extended set of 6,574 FaDu and SAS images with masks from a second
  annotator. Zeiss Axiovert 200M, 1,300 x 1,030 px at 2.04 um/pixel.'
