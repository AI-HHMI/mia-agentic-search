notes: 'File listing (HTTP index of the BioStudies FTP, sizes rounded): traing_validation 991, test 104, clean_spheroids
  200 and extended_data 6,574 images, each with a PNG label of the same count; size_bytes is the listing total.
  Paper (open access, Methods and Data availability read) gives 1,095 FaDu spheroids segmented by expert H1
  (883/108/104 split), the 6,574-image extended set segmented by a second expert, and 2.04 um/pixel;
  it states images were converted from 16-bit to 8-bit for training. Label encoding of the masks was not
  inspected. The PNG masks are assumed binary (spheroid vs background) from the paper description.'
