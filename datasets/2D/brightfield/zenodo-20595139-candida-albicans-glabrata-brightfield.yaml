short_name: Candida albicans vs glabrata brightfield patches
description: 3,763 brightfield microscopy patches (3.6 MB TIFFs) of reference strains of Candida albicans (2,088
  patches from 34 slides) and Candida glabrata (1,675 patches from 27 slides), imaged on a Zeiss Axio Observer with
  a 63x/1.4 oil objective at 0.175 um pixel spacing. Sorted into one folder per species for species classification;
  slide identity is the independent replicate unit.
