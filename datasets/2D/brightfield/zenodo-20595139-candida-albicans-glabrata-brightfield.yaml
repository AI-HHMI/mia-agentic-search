notes: 'The record cites the WCCI 2026 paper "Explainable Vision Transformers for Candida Species Identification from
  Brightfield Microscopy" (no DOI given on the record); a title search in Europe PMC/Crossref found no copy, so the
  paper was not read and publications is left empty. Labels are the strain identity of the culture on each slide (one
  species per slide), not an expert annotation of individual cells, hence image-level classification only. The record says
  the paper used 60 slides / 3,731 patches; this archive has 61 slides / 3,763 patches (one extra albicans slide of
  32 patches). Splits are not in the archive: the authors point to split_indices.json in their GitHub repository, which
  was not checked. Counts per class come from the zip listing (2,088 and 1,675 files). The objective is a DIC-rated
  63x/1.4 oil lens but illumination is brightfield per the record. Organism names are as written on the record
  (C. glabrata is now Nakaseomyces glabratus).'
