title: Synthetic unfixed micrococci generated microscopic images annotated dataset
short_name: Synthetic micrococci masks and boxes (brightfield)
description: 25,728 JPEG images of micrococci (titled 'synthetic ... generated') in five numbered folders
  (0-4), each with a PNG segmentation mask, plus a labels.json with image sizes and 15,399 bounding boxes;
  12,080 images have an empty mask. The record describes bright-field conditions of unfixed specimens
  with uneven illumination, noise, defocus and blur, for detection, segmentation and classification.
