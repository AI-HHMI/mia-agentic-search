notes: 'Zenodo page (v1-0, CC-BY-4.0) read and the zip listed: images/<0-4>/*.jpg, masks/<0-4>/*_mask.png
  (25,728 each) and labels.json (mask_count 25728, bbox_count 15399, empty_mask_count 12080). Folder meaning
  is not stated; folder 0 has 12,080 images, equal to the empty-mask count. Images are called synthetic,
  but no paper, generator, microscope, stain, pixel size or annotation procedure is given (no paper found
  by title search), so annotations.source is unknown. Siblings by the same authors, zenodo-20574940 and
  zenodo-20613704, are different deposits. enricher: folders are 0-4, not 0-9 (zip listing: 12080/3120/1664/3808/5056
  images).'
