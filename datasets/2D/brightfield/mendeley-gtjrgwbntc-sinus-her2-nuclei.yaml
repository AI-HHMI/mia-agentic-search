notes: Mendeley file listing (API, latest version 3; landing page cited is v2, same
  description) shows 39 JPG images, 156 ens + 156 ins PNGs (binary/multicolor/boundary
  masks), 78 JSON annotations and 2 CSVs, ~120 MB total. 'Inclusive' (ins) = nuclei
  chosen by any expert, 'exclusive' (ens) = chosen by all. Pixel size 0.325 µm/pixel
  and Zeiss AxioImager Z2 20x NA 0.80 from the paper Methods. Image dimensions and
  train/test split not stated. Dual-ISH is chromogenic, so modality is listed as brightfield.
  Size is the sum of file sizes from the API.
