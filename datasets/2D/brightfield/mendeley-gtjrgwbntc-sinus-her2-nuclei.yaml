title: 'SiNuS: A Comprehensive Dataset for Singular Nuclei Segmentation for HER2 Grading
  of Breast Cancer'
short_name: HER2 singular nuclei segmentation (Dual-ISH)
description: '39 Dual-ISH (HER2/CEP17) stained breast cancer image patches at 20x
  from 21 patients, with polygon-annotated singular (intact, non-overlapping) nuclei
  by three experts: 1,856 nuclei in the inclusive set and 1,284 in the exclusive set
  (selected by all experts). Binary, multicolor (instance) and nuclei-boundary masks,
  JSON polygon annotations and per-image nuclei property CSVs are provided.'
