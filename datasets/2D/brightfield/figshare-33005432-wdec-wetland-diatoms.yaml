notes: 'Sources checked: figshare API record (title, description, CC BY 4.0, single file WDEC.zip, tags YOLO / automatic
  detection), zip listing via peek_archive (29,163 jpg in images/, 29,163 label txt in labels/, class_names.txt) and
  one label file (WDEC/labels/1.txt: "0 0.526217 0.506300 0.770455 0.829324"). The figshare HTML landing page returned
  HTTP 403/202 (bot protection), so the API record was used as the landing evidence. No associated paper is listed on
  the record (references empty) and none was found by title, so microscope, objective, magnification, pixel size, stain
  and annotation procedure (manual vs automatic) are not stated and annotations.source is unknown. Species are
  identified by the class index; whether each image has exactly one box was only checked on one file. No train/val/test
  split files are in the archive. organism is the phylum Bacillariophyta (213 species in class_names.txt).'
