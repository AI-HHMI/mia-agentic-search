title: Wetland Diatoms from Eastern China (WDEC)
short_name: Wetland diatom species boxes (light microscopy)
description: 'Diatom light-microscopy image dataset from lakes and peatlands in eastern China: 29,163 JPEG images
  of 213 diatom species (about 140 per species), with one YOLO-format text file per image giving the class index
  and a normalised bounding box, plus a class_names.txt species list. Images cover different light backgrounds,
  occlusion, fragmentation and sharpness.'
