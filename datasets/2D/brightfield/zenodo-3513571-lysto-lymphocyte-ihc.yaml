  notes: 'Listing from the Zenodo API is complete (3 files, exact sizes). HDF5 headers probed by range: training.h5
    has organ [20000] object (strings), x [20000,299,299,3] uint8, y [20000] int32; test.h5 has organ [12000] and
    x [12000,299,299,3] only, so test labels are not released here. All datasets contiguous, uncompressed, no attributes.
    x axes are left null: no HDF5 attribute names them; the paper describes 299x299 px RGB patches, but no source
    states the axis order. Sampled y in full (all 20,000 values): range [0, 70], 56 distinct values, 21% zeros (a
    count per patch, not instance IDs). The x sample (central crop) failed three times with TLS EOF errors from
    zenodo.org, so raw value range is not measured. Voxel size 240 nm stated by the paper (0.24 um/pixel) and kept.
    No single archive exists: data.download_url is the record page; direct files are training.h5, test.h5 and training_labels.csv
    under https://zenodo.org/records/3513571/files/ (all usable per download-check). The per-patch organ strings
    (HDF5 dataset organ) are metadata and not listed as an array.'
