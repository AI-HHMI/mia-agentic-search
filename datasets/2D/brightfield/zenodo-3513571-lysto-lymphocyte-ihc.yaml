notes: 'Zenodo lists training.h5 (5.4 GB), test.h5 (3.2 GB) and training_labels.csv (620 kB), 8.6 GB in total. The paper (arXiv 2301.06304) describes 20,000 training and 12,000 test patches (n_items = 32,000), released as HDF5 and from 83 WSIs (training 43 slides from 2 centres, test 40 slides from 8 centres, one shared). The files inside the HDF5 (dataset names, dtype) were not inspected, and whether test labels are included in test.h5 is not stated on the Zenodo page, so annotations_verified rests on the label CSV listing. ML task is lymphocyte counting (regression), which has no schema value, hence other. The Zenodo record was published 2019-10-04 under 10.5281/zenodo.3513571; zenodo.org/records/3473557 resolves to the same record. The paper also describes an external lung validation set, not part of this record.'
