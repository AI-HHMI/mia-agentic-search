id: zenodo-3513571-lysto-lymphocyte-ihc
title: Lymphocyte Assessment Hackathon (LYSTO)
short_name: Lymphocyte counting in CD3/CD8 IHC patches
description: Training (20,000 patches) and test (12,000 patches) sets of the LYSTO hackathon at MICCAI 2019. Patches of
  299 x 299 px (about 75 x 75 um at 0.24 um/px) were extracted from CD3/CD8 immunohistochemistry whole slide images
  of colon, breast and prostate cancer from 9 centres. Each patch is labelled with the number of annotated
  lymphocytes it contains, derived from exhaustive point annotations of lymphocytes in regions of interest.
