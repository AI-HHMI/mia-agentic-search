notes: 'Zenodo lists training.h5 (5.4 GB), test.h5 (3.2 GB) and training_labels.csv (620 kB), 8.6 GB in total. The
  paper (arXiv 2301.06304) describes 20,000 training and 12,000 test patches (n_items = 32,000), released as HDF5
  and from 83 WSIs (training 43 slides from 2 centres, test 40 slides from 8 centres, one shared). ML task is lymphocyte
  counting (regression), which has no schema value, hence other. The Zenodo record was published 2019-10-04 under
  10.5281/zenodo.3513571; zenodo.org/records/3473557 resolves to the same record. The paper also describes an external
  lung validation set, not part of this record. enricher: size 8,584,596,898 B from the Zenodo file listing (was
  8.6e9 stated); download_url set to the record page since the data are 3 separate files, no single archive (was
  training.h5); coverage partial: test.h5 holds no labels (datasets organ, x only), counts exist for the 20,000
  training patches only (training.h5 y, training_labels.csv).'
