notes: 'Found while following the Nature Methods micro-SAM paper (Europe PMC full text read: user study
  1 is brightfield organoid segmentation with five annotators, internal dataset). The zip was listed with
  peek_archive (320 files: 231 TIFF, 75 NPY); the 15-image count is from the Zenodo README, not counted
  in the zip. Organoid type, pixel size and microscope are not stated in the README or the paper main
  text. A companion record (micro-SAM 3d user study data, Zenodo 14037021, EM nucleus annotations) exists
  but is not included. enricher: n_items 15 -> 30 (final_dataset holds 21 train + 3 val + 6 test images:
  the 15 study images plus the 15-image test split); download_url without ?download=1.'
