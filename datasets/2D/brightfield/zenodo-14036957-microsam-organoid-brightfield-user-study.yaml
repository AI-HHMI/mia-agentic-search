  notes: 'Listing: Zenodo API + zip central directory, 2 files, 1,356,169,259 B (exact); zip has 320 members.
    The README says final_dataset combines images, consensus_labels and test_split and is the dataset
    meant for training; annotations/ holds the per-annotator user-study results (8 variants x 5 annotators,
    TIFF and .npy). Probed 3 train images (im8, im16, im4): TIFF, deflate, uint8, 1040x1408, single page
    (yx). Sample (im8 pair, 739 KB, measured then deleted): image values 16-189, mean 130.5; mask int64,
    94 distinct values 0-93, 97% background: instance IDs of organoids (README: organoid segmentation
    annotations). Value ranges are from one sample. Test-split images are named VID529_*; their shape
    was not probed (shape_varies null). Mask compression not probed. Voxel size not found; checked: TIFF
    headers (no calibration), Zenodo README, paper full text (internal dataset, no pixel size; Supplementary
    Information not read), user-study-v3 GitHub repo (README, scripts).'
