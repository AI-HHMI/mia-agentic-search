notes: >-
  The 14 files hold nine zips of JPEGs, two analysis zips (statistics, SVG plots and XLSX), the README and an empty file named Klony-main. Zip indexes (read remotely) show 890 cropped LN229 colony images in class folders
  (Holoklony/Meroklony/Paraklony: sets of 91, 208, 136, 102, 193, 19 and 141 images), 36 whole GL261 images and 6 LN229 background images with no colonies. The README (marked DRAFT with 'TO COMPLETE' items) describes YOLO
  bounding boxes and instance polygons for whole 3072 x 2048 images, model weights and logs, but none of these are in the file listing, so only crop-level class labels are verified. The associated paper (instance
  segmentation and morphometrics of glioblastoma clonogenic colonies) was not found in Europe PMC. Pixel size: the README says images were spatially calibrated to millimetres but gives no value. Crop sizes were not inspected.
  The class folder names are Polish (e.g. Holoklony = holoclones). Files are individual downloads, so download_url is null.
