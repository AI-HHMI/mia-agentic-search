title: A New Cervical Cytology Dataset for Nucleus Detection and Image Classification (Cervix93)
short_name: Cervix93 cervical cytology nuclei (brightfield)
description: 93 image stacks (10 to 20 focal planes each, 1280x960 pixels, 40x) of ThinPrep Pap-stained cervical cytology slides,
  each with an extended depth of field (EDF) image, slide grade labels (Negative / LSIL / HSIL) and 2,705 manually marked nucleus
  points. Train/test sets (set 0 / set 1) and MATLAB evaluation and baseline code are included.
