notes: 'README and the dataset/ folder listing show EDF/, 93 frameNNN_stack/ folders and labels.csv; no license file or statement
  on the repository page or in the paper (arXiv 1811.09651, read via ar5iv: Stereologer microscope, 40x, 1280x960, 10-20 planes
  per stack, EDF by Bradley and Bamford, points marked inside each nucleus by hand, 2,705 points; train set 69 frames /
  1,983 nuclei, test 24 frames / 722 nuclei). Image file formats, annotation files, total size, pixel size, publication date
  and the paper DOI were not stated in what was read . Dimensionality is recorded as 2D because points are marked per frame and in the EDF image, but the data
  are also focal-plane stacks. formats is other because the image format is unknown. The annotation files were not seen
  in a listing of their contents.'
