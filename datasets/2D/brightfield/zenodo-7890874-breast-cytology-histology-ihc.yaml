notes: 'Two zips listed with peek_archive: cytological_images.zip (73 JPEG in 4 diagnosis folders: 12, 31, 14, 16)
  and histological_images.zip (68 JPEG, 63 in invasive duct carcinoma and 5 in invasive carcinoma folders, one H&E
  image plus IHC images per case). Labels are only the diagnosis in folder names (no masks or boxes), the histology
  set has essentially one diagnosis, and a folder named melanoma appears in the breast cytology set (kept as written).
  The record has no linked paper, so none was read; annotators and acquisition equipment are not stated, and pixel
  size is unknown. download_url points to the larger histology zip; the cytology zip is https://zenodo.org/api/records/7890874/files/cytological_images.zip/content.
  Channels=3 assumed for colour JPEGs. A different record by the same authors (Zenodo 21487212, H&E and IHC masks)
  is in the catalog. enricher: histology images sampled at 4096x3286, not the stated 2048x1536.'
