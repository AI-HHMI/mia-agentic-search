title: 7 Common Canine Tumours Cytology Dataset + Background Tiles
short_name: Canine tumour cytology tiles (brightfield)
description: 22,577 JPEG tiles (512 x 512 px RGB) cut from veterinary cytology whole-slide images (SVS),
  in one zip per class for seven common canine tumours (histiocytoma, lymphoma, carcinoma, mast cell tumour,
  melanoma, plasma cell tumour, soft tissue sarcoma) plus a background (BG) class, grouped by case folder.
  Released with the MATLAB tiling, N-fold splitting, Grad-CAM, majority-vote and whole-slide recomposition
  code used to train a CNN that recognises the tumours.
