notes: 'The record text is one sentence (codes and tiles used to train a CNN for 7 common canine tumours
  in veterinary cytology) and links no paper; a web search found no matching publication, so tumour labelling
  procedure, stain, scanner, magnification, pixel size, number of slides and train/test split are not
  stated. Listed all eight zips with peek_archive: Histiocytoma, Lymphoma, Carcinoma, MCT and PCT and
  STS 2,652 JPEGs each, Melanoma 2,640, BG 4,025 (22,577 total, 1.72 GB); a probed MCT tile is 512 x 512
  RGB (the MATLAB code offers tile sizes 1024, 512, 299, 256 and 128 and overlap options). Labels are
  the class folder; how a class label was assigned to each case is not documented. size_bytes is the sum
  of all 13 record files (8 zips + 5 code files).'
