notes: 'File listing from the Mendeley public API: 972 JPG files (NL 612, HSIL 173, LSIL 113, SCC 74 by
  file-name prefix) plus Results.csv (contents not read); page and paper say 963 images (613 NILM, 350
  abnormal), so the listing and text disagree by 9 files. Mendeley zip not downloaded, so image size and
  JPG encoding come from the paper (2048x1536). Pixel size not stated in the page or Data in Brief paper.
  Class labels are from patient reports confirmed by a pathologist;
  no cell-level masks or boxes. Related method paper: Hussain et al., Tissue and Cell 65 (2020) 101347. enricher: stain H&E from the paper Methods (was empty); 1 of the 973 API files is Results.csv, the other 972 are JPGs.'
