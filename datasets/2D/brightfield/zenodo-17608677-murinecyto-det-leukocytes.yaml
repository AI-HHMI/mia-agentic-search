notes: 'From the Zenodo record description and the zip listing via peek_archive (1,332 files: annotations/ 333 JSON, images/ 333, masks/
  333, masks_grayscale/ 333 PNG). No related paper is cited on the record and a title search in Europe PMC and Crossref found none,
  so the stain, microscope, objective and pixel size are not stated: voxel_size_nm is null, and modality is recorded as brightfield
  only as the closest option for stained cytology images (not stated). How the annotations were made, and by whom, is not described
  in the record. No split is provided. The JSON and masks were not opened. enricher: per-image COCO-style JSON (Labelbox export) carries
  a licenses entry "Research Use Only", unlike the Zenodo CC BY 4.0; spdx kept as the record states.'
