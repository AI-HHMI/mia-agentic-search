description: 333 high-resolution (1024 x 1024 px) cytology images from mouse bronchoalveolar lavage fluid, annotated with five cell
  classes (macrophage/monocyte, neutrophil, eosinophil, lymphocyte, unknown cell/debris), pixel-level segmentation masks and one-to-one
  matched bounding boxes (JSON).
