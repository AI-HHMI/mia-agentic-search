title: AML-Cytomorphology_LMU
short_name: AML blood smear leukocytes, expert labels
description: 18,365 expert-labelled single-cell images of leukocytes from peripheral blood smears of 200 subjects (100 with
  acute myeloid leukaemia, 100 without haematological malignancy) collected at Munich University Hospital between 2014 and
  2017. Cells are labelled as pathological or non-pathological leukocytes with a standard morphological classification scheme.
  Imaged at 100x with oil immersion on a Precipoint M8 digital microscope/scanner.
