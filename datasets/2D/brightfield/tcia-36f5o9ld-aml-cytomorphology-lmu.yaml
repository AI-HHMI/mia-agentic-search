notes: 'Only the TCIA collection page was read: 200 subjects, 18,365 labelled images, 11 GB, TIFF images, annotations in DAT
  and ZIP (538 KB, direct download), images by IBM Aspera, CC BY 3.0, 100x oil immersion on a Precipoint M8 at 14.14 pixels
  per um (about 70.7 nm). The file listing was not inspected (Aspera), so image format and the class scheme come only from
  the page, which does not list the classes or per-class counts. The paper (Nature Machine Intelligence 2019, cited on the
  page as Matek et al.) has no full text in Europe PMC and its abstract was empty there, so staining and the full author list
  were not read; authors are left empty.'
