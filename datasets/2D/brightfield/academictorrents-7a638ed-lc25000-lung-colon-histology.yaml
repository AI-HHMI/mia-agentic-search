  available"), hence unknown. Who assigned the class labels is not stated beyond "validated". Pixel size,
  magnification and publication date are not stated. enricher: the .torrent names HTTP web seeds; download_url
  = archive.org copy of LC25000.zip (1,890,299,770 B, same length as the torrent), size from it (was null);
  25,000 JPEGs in the 5 class folders seen in the zip listing.'
