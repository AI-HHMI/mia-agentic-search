title: LC25000 Lung and Colon Cancer Histopathological Image Dataset (Hugging Face mirror)
short_name: Lung and colon H&E tissue classes (LC25000)
description: 25,000 color histopathology images (768 x 768 px, JPEG) in five classes of 5,000 images each - colon adenocarcinoma,
  benign colonic tissue, lung adenocarcinoma, lung squamous cell carcinoma and benign lung tissue. The images were augmented
  (rotations and flips) from 1,250 original microscope-captured slide images (750 lung, 500 colon). This record is the Hugging
  Face copy, stored as parquet with organ and class labels; the authors' original release is a 1.85 GB zip on GitHub.
