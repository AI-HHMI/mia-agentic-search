notes: 'Only 1,250 images are original captures; the 25,000 are augmentations (left/right rotations up to 25 degrees, flips)
  so images within a class are not independent (paper section 2.2); splitting by original image is not possible from the released
  labels. The paper states the data are de-identified, HIPAA compliant and freely available but gives no license. The Hugging
  Face card of this mirror (by user 1aurent) tags license unlicense, which the original authors did not state, so license
  is recorded as unknown. The original release (GitHub tampapath/lung_colon_image_set) is only an Academic Torrents link;
  its README states no license; this mirror holds four parquet files of JPEG bytes (formats listed as other). Magnification,
  stain and pixel size are not stated in the paper text read; the paper says the images were captured from glass slides as
  previously described. enricher: size from the HF file listing (was the card''s download_size).'
