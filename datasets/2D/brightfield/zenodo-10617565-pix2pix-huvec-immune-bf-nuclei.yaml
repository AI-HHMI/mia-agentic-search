notes: 'Brightfield images with matching nuclear fluorescence images (virtual-staining pairs for pix2pix),
  not labels; restoration-pairs is the closest schema value and ml.tasks is other. Zip listing (peek_archive):
  Training_data has 226 BF and 226 nuclei TIFFs, Quality_control_data 5 + 5. The zip also holds trained
  pix2pix checkpoints (.pth, 458 MB) and augmented outputs, not counted. Page states 16-bit TIFF, 1024
  x 1022 px, 650 nm pixel size, Nikon Eclipse Ti2-E, 20x. No paper is cited, so none is listed. Nuclear
  stain name and cell species are not stated; Homo sapiens is inferred from the HUVEC monolayer in the
  title. Sibling record: the other pix2pix HUVEC dataset (immune vs cancer cells).'
