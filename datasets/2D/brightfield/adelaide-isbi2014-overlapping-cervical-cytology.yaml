  notes: 'Listing covers all 6 files on the dataset page. Probed: EDF000.png (EDF0_7.zip), isbi_test810.mat
    and isbi_train_GT.mat headers (MATLAB 5, not HDF5, so probe.py cannot read them; contents not parsed).
    Sampled Dataset/EDF/EDF000.png (480,400 B) and EDF000_GT.png (3,240 B); value ranges are from this
    one sample. Voxel size not found; checked: PNG headers, challenge pages, TIP 2015 paper (abstract
    only), JBHI challenge paper (author PDF), which states "around 0.185um per pixel" for the acquired
    FOVs but also "15 pixels or 5.7um" (about 0.38 um/px), and synthetic cells were randomly rescaled,
    so no value was recorded. License: none found on the challenge pages. Download: all files are direct
    and support range requests, but host cs.adelaide.edu.au is not on the TensorSwitch allowlist; no single
    archive covers everything.'
