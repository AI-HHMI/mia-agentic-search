notes: 'Plain HTTP zips on the challenge site. Zip listings (peek_archive): Train45Test90.zip has 4 .mat files; Dataset.zip has the synthetic .mat files and EDF PNGs. Synthetic images live inside .mat files, so PNG covers only the 16 real EDF images, whose annotations were not verified. n_items = 945 synthetic + 16 real. No license or terms on the page, so license is unknown. Paper (IEEE TIP 2015) is not open access; only the abstract and challenge page were read. Image size and pixel size are not stated. Companion: ISBI 2015 challenge (separate PR).'
