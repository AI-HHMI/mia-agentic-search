notes: 'Plain HTTP zips on the challenge site. Zip listings (peek_archive): Train45Test90.zip has 4 .mat
  files; Dataset.zip has the synthetic .mat files and EDF PNGs. Synthetic images live inside .mat files,
  so PNG covers only the 16 real EDF images. n_items = 945 synthetic + 16 real. No license or terms on
  the page, so license is unknown. Paper (IEEE TIP 2015) is not open access; only the abstract and challenge
  page were read. Companion: ISBI 2015 challenge (separate PR). enricher: Dataset.zip also holds EDFnnn_GT.png
  masks for the 16 EDF images (sampled); size from the full listing of all 6 files; channels 1; download_url
  = dataset page (no single archive). Pixel size: the JBHI paper gives both "around 0.185um per pixel"
  and "15 pixels or 5.7um" (0.38 um), so it is left null.'
