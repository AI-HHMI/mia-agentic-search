short_name: Overlapping cervical cells (ISBI 2014)
description: Data of the first Overlapping Cervical Cytology Image Segmentation Challenge. 945 synthetic images built by overlapping real isolated cervical cells (45 training and 90 test images with ground-truth cell and nucleus annotations, plus 810 further test images), and 16 real extended depth-of-field (EDF) cervical cytology images as PNG. Synthetic training and test data and their annotations are distributed as MATLAB .mat files.
