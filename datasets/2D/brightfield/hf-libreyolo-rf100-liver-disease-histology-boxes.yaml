notes: 'LibreYOLO mirror (2026-01-20) of the Roboflow 100 ''microscopic'' subset. Licence CC BY 4.0 from data.yaml and README.dataset.txt.
  Split sizes 2,782 / 794 / 400 (train/valid/test). Classes: ballooning, fibrosis, inflammation, steatosis (data.yaml ids
  0-3). The RF100 copy is version 1 release-640 (Roboflow export, resize to 640x640). Original Roboflow project ''liver-disease''
  by an unnamed ''Roboflow user''; no authors or paper are listed. One image viewed (stained tissue with large clear fat vacuoles)
  and one label file read (3 boxes, class 3 = steatosis). Microscope, magnification, pixel size, sample origin and how the
  boxes were drawn are not stated on the card, README files or data.yaml, so voxel size, organism and annotation source are
  left empty/unknown.'
