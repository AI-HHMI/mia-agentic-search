notes: 'Facts come from the figshare API record (landing page gives 403), peek_archive of the 2.3 GB zip (349,570 jpg and
  5 csv, including the validation folder) and the Scientific Data paper (Europe PMC full text). The paper says the main set
  has 257,730 cropped images (25,773 cells x 10 focal planes); the zip count is higher because the validation folder is included.
  Labels come from two medical technologists with escalation to more senior experts on disagreement. The article is CC BY-NC-ND
  while figshare states CC0; the figshare record licence is used. enricher: labels.csv also gives a cell ROI box per stack,
  so bounding-box added; channels 3 (RGB JPEG). Each cell is a 10-plane focal stack (<img_num>_<0-9>.jpg); paper: "captured
  using a 50X microscope with 400 nm intervals", lateral pixel size not stated, so voxel_size_nm stays null.'
