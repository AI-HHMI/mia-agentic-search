notes: 'Facts come from the figshare API record (landing page gives 403), peek_archive of the 2.3 GB zip (349,570 jpg
  and 5 csv, including the validation folder) and the Scientific Data paper (Europe PMC full text). The paper says the
  main set has 257,730 cropped images (25,773 cells x 10 focal planes); the zip count is higher because the
  validation folder is included. Labels come from two medical technologists with escalation to more senior experts
  on disagreement. Pixel size is not stated in the paper text read, so voxel_size_nm is null. The article is CC BY-NC-ND
  while figshare states CC0; the figshare record licence is used.'
