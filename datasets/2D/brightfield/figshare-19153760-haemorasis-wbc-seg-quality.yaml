title: Machine-learning training and validation datasets
short_name: Blood smear WBC masks + tile quality (brightfield)
description: Training and validation data for the Haemorasis blood-smear pipeline, scanned at 40x. Three
  white blood cell segmentation sets (input tiles with truth masks; 158 pairs from Addenbrooke's on a
  Hamamatsu NanoZoomer 2.0, 30 pairs on an Aperio AT2, 2 pairs from the Munich Leukaemia Laboratory),
  a tile quality set of 10,000 PNG tiles (8,050 train, 1,950 test) labelled good or poor, and an HDF5
  file of objects labelled RBC or not RBC with morphological features.
