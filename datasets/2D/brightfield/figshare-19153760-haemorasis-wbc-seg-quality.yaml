notes: 'Record text and both zip listings (peek_archive) read; rbc-filtering-dataset.h5 (34 MB) not opened.
  Three downloads, no single archive: datasets.zip https://ndownloader.figshare.com/files/34028429 (919.5
  MB), quality-dataset.zip https://ndownloader.figshare.com/files/34031666 (3.9 GB), rbc-filtering-dataset.h5
  https://ndownloader.figshare.com/files/34042940. The figshare record cites a differently titled study
  ("Computational cytomorphology reveals cellular archetypes in whole blood slides"); it is matched here
  to the published Nature Communications paper (Haemorasis, same first author) on the strength of the
  shared scanners/cohorts, and the paper full text does not describe the segmentation annotation procedure
  (Supplementary Methods not read), so who drew the masks, pixel size and tile size are not verified.
  The quality set is from the Munich Leukaemia Laboratory per the record. Checked: figshare record, both
  zip listings, paper full text.'
