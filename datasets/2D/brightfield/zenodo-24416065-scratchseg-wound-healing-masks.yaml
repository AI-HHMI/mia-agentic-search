notes: 'Split 401 train / 44 test (splits.json). Masks come from a classical edge-based pre-annotation refined by experts
  in the SpheroSeg web tool. Pixel size and objective not stated in the record README or archive listing; the paper
  (ICIP 2026 LBDL II workshop) was not found in Europe PMC, so its Methods were not read. Record states the zip is
  byte-identical to a reviewer copy whose internal README says 446 frames; the archive and record README give 445.
  Mask file format (JPEG) inferred from the .jpg-only archive listing (890 .jpg files = 445 images + 445 masks).
  The third-party Lowenstein test set used in the paper is not included.'
