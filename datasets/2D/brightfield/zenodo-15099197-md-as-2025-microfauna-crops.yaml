notes: 'Dataset B of the paper, one Zenodo record and RAR per class: Hypotrichida 15099197, Arcellinida
  17140068, Digononta 17140129, Monogononta 17140144, Nematoda 17142917; no single archive, so download_url
  is null. Crops come from a YOLOv5 model trained on the bounding-box set catalogued as zenodo-15210103-md-as-2025-activated-sludge-microfauna,
  then manually reviewed and categorised (source mixed: automatic crops, manual class review). Pixel size
  not stated (figures only show a 50 um scale bar). Organism left empty because classes are orders of
  mixed protozoa, rotifers and nematodes. Author list as given by Europe PMC. enricher: annotations_verified
  true, all 14,257 JPGs listed in 5 class folders (Arcellinida 7,007, Digononta 4,780, Monogononta 1,207,
  Nematoda 707, Hypotrichida 556). enricher: channels 3 (RGB colour, decoded).'
