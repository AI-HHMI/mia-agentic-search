id: zenodo-15099197-md-as-2025-microfauna-crops
title: 'MD-AS-2025 cropped dataset: single-organism microfauna images from activated sludge'
short_name: Sludge microfauna crops, 5 classes (brightfield)
description: 14,257 JPG crops of single microfauna individuals from activated sludge microscopy frames (10x objective, halogen illumination),
  sorted by taxonomic order into five classes (Arcellinida, Digononta, Monogononta, Nematoda, Hypotrichida). Cropped with a YOLOv5 detector
  and then manually reviewed and categorised. Deposited as one Zenodo record and RAR archive per class; it is the classification companion
  of the MD-AS-2025 bounding-box set.
