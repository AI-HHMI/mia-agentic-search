notes: 'Dataset B of the paper, one Zenodo record and RAR per class: Hypotrichida 15099197, Arcellinida 17140068, Digononta 17140129, Monogononta
  17140144, Nematoda 17142917; size_bytes is the sum of the five RARs (210.6 MB), so download_url is null. RAR contents were not listed
  (the paper states 14,257 JPGs in five class folders; per-class counts not found), so annotations_verified is false. Crops come from a
  YOLOv5 model trained on the bounding-box set catalogued as zenodo-15210103-md-as-2025-activated-sludge-microfauna, then manually reviewed
  and categorised (source mixed); this record differs in being single-object classification crops. Pixel size and channel count not stated;
  organism left empty because classes are orders of mixed protozoa, rotifers and nematodes. Author list is as given by Europe PMC (initials,
  possibly truncated).'
