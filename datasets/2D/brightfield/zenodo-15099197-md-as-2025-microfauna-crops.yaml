  notes: 'Listed the 5 Zenodo records (listing.py: complete, exact sizes, 210,550,386 bytes). The RARs
    are not zips, so all five were downloaded (210.6 MB, within budget, deleted afterwards) and their
    RAR5 headers walked with a short stdlib script (no extraction tool): 14,257 JPG members, one folder
    per class, matching the paper. Most members are RAR-compressed and could not be decoded without an
    unrar tool; the 150 stored (uncompressed) members of Digononta (85) and Nematoda (65) were decoded
    with Pillow: RGB uint8, values 9-255 (from these crops only). Voxel size not found; checked: JPEG
    headers (no dpi), Zenodo API records (descriptions empty or one line), Scientific Data paper full
    text (10x objective, 1824x1216 CMOS frames, 50 um scale bars in figures, no pixel size). Download:
    each RAR is a direct Zenodo file with range requests; TensorSwitch would need RAR support to open
    them.'
