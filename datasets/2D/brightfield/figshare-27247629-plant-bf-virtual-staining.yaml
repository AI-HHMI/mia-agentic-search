notes: 'Three figshare articles, one TIFF stack each, all CC BY 4.0: 27247629 (BY-HR with PlasMem Bright Green, 193 frames, 4.86 GB, 150 train / 43 test), 27247638 (BCECF vacuole, 175 frames, 2.94 GB, 150 / 25), 27247620 (Egeria densa chloroplasts, 119 frames, 2.0 GB, 109 / 10); download_url is the first stack only. Counts and splits are from the figshare descriptions and the paper. Stacks were not opened, so axes, dtype and pairing layout are unverified. Paper (open access): bright-field 20x at 0.56 um/px, spinning-disk confocal fluorescence; E. densa 0.28 um/px; BY-2 confocal pixel size not stated, so voxel_size_nm is null. Arabidopsis images used in the paper are not in these files.'
