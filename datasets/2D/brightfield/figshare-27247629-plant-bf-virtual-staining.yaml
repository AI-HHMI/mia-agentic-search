title: Bright-field and fluorescence image stacks of tobacco BY-2 cells and Egeria densa for virtual staining
  of plant cell structures
short_name: Plant brightfield-to-fluorescence virtual staining
description: Three multi-frame TIFF stacks of paired bright-field and fluorescence images used to train
  and test deep-learning virtual staining of plant cells - transgenic tobacco BY-2 cells with Histone-RFP
  nuclei and PlasMem Bright Green plasma membrane (193 frames), wild-type BY-2 cells with BCECF-stained
  vacuolar lumen (175 frames) and Egeria densa leaf with chloroplast autofluorescence (119 frames). The
  first 150 / 150 / 109 frames were used for training and the rest for testing.
