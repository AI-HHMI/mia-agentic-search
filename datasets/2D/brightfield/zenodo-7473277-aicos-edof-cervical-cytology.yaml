notes: 'The task is learning extended depth of field (focus-stack fusion); the "ground truth" EDoF images are produced by a complex-wavelet
  fusion algorithm, not a physical reference, so ml.tasks is other. zip listing: 1,584 JPEG files, 720 in 0 - raw_data (144 stacks x
  5 images, folders Focus_smearNN/xAA_yBB) and 864 in 1 - data_RGB_Static_Elastic_aligned_with_edof (144 x 5 aligned images plus
  Output.jpg). The Zenodo description says 144 EDoF images were used with 5 aligned images per stack. Pixel size, objective
  and magnification are not stated on the Zenodo page; the paper full text could not be retrieved (Europe PMC has no full text, the
  publisher page returned 403), only the Crossref record was read, so voxel_size_nm is null. The Zenodo record license is CC BY-NC-ND 4.0.
  Number of colour channels (3) follows from the "RGB" folder name. No train/test split is shipped.'
