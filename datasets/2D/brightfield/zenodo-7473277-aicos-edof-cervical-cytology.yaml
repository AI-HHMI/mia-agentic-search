title: Fraunhofer Portugal AICOS EDoF Dataset
short_name: Cervical cytology focus stacks, EDoF (brightfield)
description: Focus stacks of liquid-based cervical cytology fields of view from 15 samples, acquired with the µSmartScope
  smartphone-based microscope. Each of 144 stacks has 5 images at different focus depths (960x720 px). The record gives the
  raw stacks and a pre-processed version (chromatic, static and elastic alignment) with the extended-depth-of-field (EDoF)
  image generated by complex-wavelet fusion for each stack.
