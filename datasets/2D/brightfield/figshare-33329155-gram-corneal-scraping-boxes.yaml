notes: 'Figshare API record, README.md, EXPERIMENTS.md and the RawImageDataSet.zip listing (763 jpg, annotations.json,
  per-image YOLO txt) were read. Splits: image-level train 542 / val 157 / test 64 (15,372 tiles of 640
  x 640 overall) and patient-level train 611 / val 152. Identical images repeat across the other zips
  by design, so the 763 originals in RawImageDataSet.zip are the reference; size_bytes sums all files
  of the record. download_url is the RawImageDataSet.zip. Pixel size and objective are not stated in the
  files read. The record lists no publication and a title search on Europe PMC found none (the README
  mentions reviewer feedback, so a paper likely exists); figshare author names are placeholders so authors
  is empty. Checked: figshare API, README, EXPERIMENTS.md, extraction instructions, zip listings.'
