notes: 'Counts come from the Hub file tree: 949 jpg (774 lurcher, 175 wild), 12 fold manifests (jsonl),
  4 json, about 474 MB. The card says 21 mouse brains (10 wild-type, 11 Lurcher) while the earlier arXiv
  paper (2411.02639v2, fetched through a summarizing reader) uses 18 mice (9 and 9) and 1,471 test images,
  so this release differs from that paper. Labels are per animal (genotype), not per image or region,
  and the paper does not say how genotype was assigned. Microscope, pixel size and section thickness are
  not stated on the card or in the paper. Companion CVPRW 2026 paper (arXiv 2605.20495) was not read.
  Hosted as a Hub dataset; files can be listed through the Hub API. enricher: the Hub tree has 11 lurcher
  case folders (774 images) but only 1 wild case folder (5973, 175 images), not the 10 wild-type animals
  the card states; no metadata.csv in the repo (labels from folders and fold manifests).'
