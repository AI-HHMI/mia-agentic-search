notes: 'From the TCIA page: 16 subjects, 60 studies, 190 images (90 B-ALL, 100 MM per the description), BMP 2560x1920, 2.9
  GB via Aspera, CC BY 3.0. Masks: 30 images per disease have nucleus and background masks, 17 MM images also have cytoplasm
  masks; the page itself notes the MM counts do not reconcile (30 images x 2 masks + 17 = 107). The PCSeg paper (PLOS ONE,
  read via Europe PMC) says 85 MM images, imaging at 1000x with a Nikon Eclipse-200 and digital camera, Jenner-Giemsa stain,
  AIIMS New Delhi; this fits the TCIA acquisition details but the counts differ. Pixel size is not stated on the page or in
  the paper text read. The mask-making procedure was not found in the text read, so annotation source is unknown. BMP is not
  a listed format value, so formats is other. The dataset was released for stain normalisation (SN-AM) but carries segmentation
  masks. enricher: n_items 60 raw images (was 190): the page counts the 2 masks per image as images ("in all, we have 90 images"
  per subset).'
