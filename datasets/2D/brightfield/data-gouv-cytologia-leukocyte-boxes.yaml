  notes: 'Listing (tools/listing.py, zip central directory + CSV): 2 files, 69,168 zip members, 1,404,152,742 bytes, complete.
    Probed 3 JPEGs: 366x360x3, 608x608x3, 363x360x3 uint8 RGB, so image size varies (paper: generally 370x368). value_range
    [11, 255] is from one sample image. Labels CSV read in full: 75,437 rows, 6 columns, 23 classes, 69,168 distinct image
    names (all zip images). Class names from the paper''s confusion-matrix legend. Voxel size not found; checked: JPEG headers
    (no calibration), data.gouv.fr API record and page, the paper (Europe PMC full text: Methods, Data availability), the
    winning team''s GitHub README (MPWARE-TEAM/Cytologia). Images come from automated microscopes at 20 centres at x500 magnification
    (paper), so pixel size likely differs by centre. Download: both files are direct, range-capable links on oos.eu-west-2.outscale.com,
    which is not on TensorSwitch''s fetch allowlist yet.'
