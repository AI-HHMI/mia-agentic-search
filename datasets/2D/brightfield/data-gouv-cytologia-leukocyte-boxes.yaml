notes: 'Zip: 69,168 JPEGs in dataset_cytologia/. Labels CSV: 75,437 box rows, 23 classes, every image listed (some hold several
  cells). Labels by each centre''s morphologist, reviewed by four experts (paper). Licence: data.gouv.fr API says Licence
  Ouverte 2.0 (Etalab 2.0); the description also cites CC BY 3.0. Paper: 67/33 train/test split used in the challenge, not
  marked in the released CSV. enricher: paper added (CytologIA consortium, npj Precision Oncology 2026, found via Europe PMC);
  channels 3 from JPEG headers (was null). Pixel size not stated anywhere (paper: "370 x 368 pixels, corresponding to an area
  of 13 x 13 centimetres", not a pixel size).'
