  notes: 'Listing: tools/listing.py on the HF dataset: 15 files, 5,795,218,862 bytes, complete, exact. Parquet is not readable
    by probe.py/sample.py and pyarrow isn''t an allowed tool, so the first 1 MB of the test Parquet was range-read twice and
    the embedded PNG headers were parsed: 512x512, 8-bit RGBA. The pixel values couldn''t be decoded (the pages are compressed),
    so there''s no value range. Pixel size not found; checked: card README, Hub API cardData, datasets-server first rows,
    the author''s other datasets (none cite a paper). No license on the card or in the API (scc_real by the same author is
    apache-2.0, but that is a different dataset). Download: per-file resolve/main URLs (usable, range requests); there is
    no single archive.'
