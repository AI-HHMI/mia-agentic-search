notes: 'The card gives no license, authors, paper, cell type, species, microscope or pixel size, so those fields are null/unknown;
  searched the card, the Hub API record and the first rows only (no linked paper found). Parquet files (13 files, 5.80 GB)
  hold the images as embedded bytes; formats stays other (Parquet is not in the enum). Split sizes from the card metadata:
  20,558 train, 2,527 validation and 1,200 test (the prose says 1,199). First rows: 512 x 512 crops, one normalised box, category
  0; a second class was not seen in the rows read. Who annotated the boxes and how is not stated. enricher: embedded images
  are PNG (512x512, 8-bit RGBA per IHDR); size_bytes from the HF file listing (15 files).'
