id: hf-mario-dg-brightfield-scc-cell-boxes
title: Brightfield Microscopy SCC Dataset (filtered, no well edge)
short_name: Brightfield cell detection crops (SCC, filtered)
description: 24,285 brightfield microscopy image crops (512 x 512 px) sliced from 4K images, with one bounding box class for
  cells, split into train (20,558), validation (2,527) and test (about 1,200) and filtered to crops with no microtiter-plate
  well edge visible. The card says it was used to train unconditional diffusion models and cell detection models.
