description: H&E regions of interest cropped at 0.5 um/px from 195 breast cancer whole-slide images (Her2+
  and triple-negative; RUMC, Jules Bordet Institute and TCGA-BRCA), as PNG with pixel-wise tissue-compartment
  masks and cell bounding boxes in COCO format, released with the TIGER challenge.
