notes: 'Zip index (4,062 files): tissue-bcss/images 151 PNG + masks 151 PNG; tissue-cells/images 1,879
  PNG + masks 1,879 PNG + tiger-coco.json. n_items counts the 2,030 ROI images. License file: annotations
  and RUMC/JB images CC BY-NC 4.0; TCGA-BRCA images carry the rights of the original TCGA slides. TCGA
  annotations are adapted from BCSS and NuCLS (separate catalog records may overlap). Resolution 0.5 um/px
  is stated on the Zenodo record. How the mask class values are coded was not checked. The paper (medRxiv
  preprint) full text was not available; only its abstract was read. Zenodo says 195 WSIs while the zip''s
  ROI counts are per image; the split into train/validation is not provided here. enricher: mask classes
  from the TIGER Data page (0 exclude, 1-7); annotations.source manual (page: ROIs selected and manually
  annotated; TCGA labels relabelled from BCSS/NuCLS). Same files also on s3://tiger-training/wsirois/roi-level-annotations/
  (used for sample URLs).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  2 files  2.6 GB  (license.txt, roi-level-annotations.zip)\nroi-level-annotations.zip/roi-level-annotations/\n\
      \  tissue-bcss/images/    151 files   2.2 GB  .png  (TCGA ROIs, RGB)\n  tissue-bcss/masks/     151\
      \ files  11.7 MB  .png  (tissue class masks)\n  tissue-cells/images/  1879 files 459.8 MB  .png\
      \  (RGB)\n  tissue-cells/masks/   1879 files   2.8 MB  .png  (tissue class masks)\n  tissue-cells/tiger-coco.json\
      \        8.9 MB  (COCO cell boxes)\n"
    n_files: 2
    listing_complete: true
  sample:
    urls:
    - https://tiger-training.s3.amazonaws.com/wsirois/roi-level-annotations/tissue-cells/images/100B_%5B10779%2C%2011621%2C%2012102%2C%2012874%5D.png
    - https://tiger-training.s3.amazonaws.com/wsirois/roi-level-annotations/tissue-cells/masks/100B_%5B10779%2C%2011621%2C%2012102%2C%2012874%5D.png
    - https://tiger-training.s3.amazonaws.com/wsirois/roi-level-annotations/tissue-cells/tiger-coco.json
    size_bytes: 12789039
    description: One RUMC/JB tissue-cells ROI (100B, 1253x1323 RGB) with its tissue mask, plus the COCO
      box file for all tissue-cells images; from the challenge's public S3 mirror (same files and byte
      sizes as the Zenodo zip).
  arrays:
  - role: raw
    path_pattern: '*/tissue-cells/images/*.png'
    format: png
    axes: yxs
    shape:
    - 1253
    - 1323
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: H&E ROI crops at 0.5 um/px; WSI coordinates in the file name (name_[x1, y1, x2, y2].png).
  - role: label
    path_pattern: '*/tissue-cells/masks/*.png'
    format: png
    axes: yx
    shape:
    - 1253
    - 1323
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 7
    encoding: semantic-ids
    classes:
    - id: 0
      name: exclude / not annotated
    - id: 1
      name: invasive tumor
    - id: 2
      name: tumor-associated stroma
    - id: 3
      name: in-situ tumor
    - id: 4
      name: healthy glands
    - id: 5
      name: necrosis not in-situ
    - id: 6
      name: inflamed stroma
    - id: 7
      name: rest
    alignment: same-grid
    alignment_notes: Mask has the same file name as its image in the parallel masks/ folder and the same
      height x width (sample 1253x1323).
  - role: label
    path_pattern: '*/tissue-cells/tiger-coco.json'
    format: json
    axes: null
    shape: null
    shape_varies: false
    dtype: unknown
    compression: none
    value_range: null
    encoding: boxes-table
    classes:
    - id: 1
      name: lymphocytes and plasma cells
    alignment: same-grid
    alignment_notes: COCO file; images[].file_name is ./images/<name>.png, bbox [x, y, w, h] in image
      pixels (16x16 px = 8x8 um boxes).
  - role: raw
    path_pattern: '*/tissue-bcss/images/*.png'
    format: png
    axes: yxs
    shape:
    - 755
    - 835
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Larger TCGA ROIs from BCSS (one per slide), 1.4-16 MB per PNG.
  - role: label
    path_pattern: '*/tissue-bcss/masks/*.png'
    format: png
    axes: yx
    shape:
    - 755
    - 835
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range: null
    encoding: semantic-ids
    classes:
    - id: 0
      name: exclude / not annotated
    - id: 1
      name: invasive tumor
    - id: 2
      name: tumor-associated stroma
    - id: 3
      name: in-situ tumor
    - id: 4
      name: healthy glands
    - id: 5
      name: necrosis not in-situ
    - id: 6
      name: inflamed stroma
    - id: 7
      name: rest
    alignment: same-grid
    alignment_notes: Same file name as its image; header shapes match (755x835 for the smallest pair).
  notes: 'Listing: Zenodo API + zip central directory, 2 files, 2,610,151,924 B (exact), 4,062 zip members.
    Sampled from the S3 mirror: tissue-cells/images/100B_[10779, 11621, 12102, 12874].png RGB uint8 1253x1323,
    0-255 (one sample; normalization unknown); its mask uint8 values {0, 4, 7}. Probed headers of the
    smallest tissue-bcss pair (755x835 RGB / gray uint8 PNG). COCO json read in full: 1,879 images, 30,524
    boxes, 1 category. Class ids from the TIGER Data page. Voxel size 0.5 um/px from the Zenodo description
    and Data page (PNG has no calibration). Zenodo range requests failed with SSL errors in this run,
    so the S3 mirror was used for samples; the Zenodo zip passes --download-check.'
