notes: 'Zip index (4,062 files): tissue-bcss/images 151 PNG + masks 151 PNG; tissue-cells/images 1,879 PNG + masks 1,879 PNG
  + tiger-coco.json. n_items counts the 2,030 ROI images. License file: annotations and RUMC/JB images CC BY-NC 4.0; TCGA-BRCA
  images carry the rights of the original TCGA slides. TCGA annotations are adapted from BCSS and NuCLS (separate catalog
  records may overlap). Resolution 0.5 um/px is stated on the Zenodo record. How the mask class values are coded was not checked.
  The paper (medRxiv preprint) full text was not available; only its abstract was read. Zenodo says 195 WSIs while the zip''s
  ROI counts are per image; the split into train/validation is not provided here.'
