notes: 'LICENSE CONFLICT (recorded as custom): Zenodo states CC-BY-4.0 but says the data is taken from Mendeley w7cvnmn4c5,
  whose page states CC BY-NC 3.0; a reviewer should decide. Mendeley page: dataset 1 = 300 images 120x120 (Motic camera),
  dataset 2 = 100 images 300x300 (CellaVision blog); ground truth drawn by experts (nuclei white, cytoplasm gray, background
  black). Pixel size and magnification not stated; paper full text not open access (abstract only). enricher: d1001-d1300 (300
  files) and d2001-d2100 (100) match datasets 1 and 2 by count; probed d1001 is 120x120, d2071 and d2097 are 300x300. enricher: mask values read from
  samples: RealMask 0/128/255 = background/cytoplasm/nucleus; BinaryMask 0/1 = whole cell; Cyto/RealMask 0/1 and
  Cyto/BinaryMask 0/128 = cytoplasm only.'
