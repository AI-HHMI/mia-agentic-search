title: FMPD - Freshwater Microscopy Phytoplankton Dataset
short_name: Freshwater phytoplankton detection (brightfield)
description: 293 multi-specimen light-microscopy images of freshwater phytoplankton from Lake Donin~os
  (Ferrol, Spain), taken at fixed 10x magnification, with COCO-format bounding boxes labelled as Woronichinia
  naegeliana, Anabaena spiroides, Dinobryon sp., other phytoplankton or non-phytoplankton particles. Holdout
  and k-fold split files are provided.
