  notes: 'Zenodo listing complete with exact sizes. readme.txt says images are 2080x1540 .tif with fixed
    magnification and illumination; probe confirms 1540x2080x3 uint8 RGB, uncompressed, single page. One
    image sampled (7..254, mean 208). First 200 KB of annotations.json read: 293 image entries (all 2080x1540)
    and 1,277 bboxes in the part read (total not known); the categories list sits past the part read,
    so class ids are not mapped. readme.txt names 5 classes: Non-phytoplankton, Woronichinia naegeliana,
    Anabaena spiroides, Dinobryon sp., Other-phytoplankton. readme.txt also says redistribution of the
    dataset or derivatives is disallowed.'
