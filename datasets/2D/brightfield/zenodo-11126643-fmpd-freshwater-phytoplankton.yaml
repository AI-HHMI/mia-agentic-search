notes: 'FMPD.zip listed with peek_archive: 293 TIFFs (2080x1540), annotations.json, split JSONs and readme. Pixel size 0.33 um comes from the Heliyon paper. License is non-commercial and no-derivatives (CC-BY-NC-ND-4.0); the Zenodo description limits use to non-commercial academic or research purposes with citation of two papers. Organism list left empty because the samples are mixed phytoplankton communities; species appear as annotation classes. Annotation coverage described as dense on the basis of the paper and Zenodo description, not checked box by box.'
