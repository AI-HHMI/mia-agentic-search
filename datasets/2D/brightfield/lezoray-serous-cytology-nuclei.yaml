notes: 'Terms (landing page): free for non-commercial research and educational purposes, cite the paper;
  custom licence. The 2002 paper is not open access (abstract only). Staining, organism and annotation
  procedure not stated. enricher: types instance-segmentation (was semantic): page says each region is
  one nucleus with its own label; 15-110 ids per image observed. enricher: modality brightfield (was other)
  and voxel size 349x349 nm (was null) from the authors'' serous cytology imaging system paper (Lezoray
  et al., HAL hal-00964895: Olympus BX-50, 20x, slide illuminated, 512x512 24-bit colour, "pixel separation
  corresponds to 0.349µm"); the database page does not restate it, the images match its 512x512 24-bit
  format. channels 3 = RGB. Only 10 images.'
