notes: 'Found through the TXL-PBC paper (Sci Data 2025), which uses this set as its "Blood Cell Detection Dataset" component (100 images, 256 x 256) and re-annotates it; TXL-PBC itself is a separate catalog record. The paper cites it as BCDD; the HF README asks to cite Aslan (2020), DOI 10.57967/hf/10256. Pixel size, microscope, magnification and annotation procedure are not stated on the HF page, README or the paper section describing this component. Annotation source is therefore unknown. Image count and class counts come from the HF page; the file listing shows images/ plus annotations.csv. Size is the 13.3 MB the page lists.'
