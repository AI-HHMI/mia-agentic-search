notes: 'Found through the TXL-PBC paper (Sci Data 2025), which uses this set as its "Blood Cell Detection
  Dataset" component (100 images, 256 x 256) and re-annotates it; TXL-PBC itself is a separate catalog
  record. The paper cites it as BCDD; the HF README asks to cite Aslan (2020), DOI 10.57967/hf/10256.
  Pixel size, microscope, magnification and annotation procedure are not stated on the HF page, README
  or the paper section describing this component. Annotation source is therefore unknown. Image count
  and class counts come from the HF page; the file listing shows images/ plus annotations.csv. enricher:
  size 13,258,776 B from HF file listing (was page-stated 13.3 MB); download_url set to the HF file tree
  (no single archive).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "HF dataset draaslan/blood-cell-detection (main)   214 files  13.3 MB\n  README.md, LICENSE\
      \ (MIT), annotations.csv (211 KB), .gitattributes\n  images/      100 *.png   12.6 MB   (image-1.png\
      \ … image-100.png)\n  labels/      100 *.txt  220 KB     (image-N.txt, same stem, KITTI-style boxes\
      \ in pixels)\n  tfrecords/    10 files  191 KB     (data-fold-00K-of-002-shard-000NN-of-00010)"
    n_files: 214
    listing_complete: true
  sample:
    urls:
    - https://huggingface.co/datasets/draaslan/blood-cell-detection/resolve/main/images/image-1.png
    - https://huggingface.co/datasets/draaslan/blood-cell-detection/resolve/main/annotations.csv
    - https://huggingface.co/datasets/draaslan/blood-cell-detection/resolve/main/labels/image-1.txt
    size_bytes: 346511
    description: One 256x256 RGBA PNG, the shared annotations.csv and its per-image KITTI-style box file
  arrays:
  - role: raw
    path_pattern: images/*.png
    format: png
    axes: yxs
    shape:
    - 256
    - 256
    - 4
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 26
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: PNG stored as RGBA; the alpha sample is constant 255 in the sample, RGB channels
      differ (colour camera).
  - role: label
    path_pattern: annotations.csv
    format: csv
    axes: null
    shape:
    - 2339
    - 7
    shape_varies: false
    dtype: float64
    compression: none
    encoding: boxes-table
    classes:
    - id: rbc
      name: red blood cell
    - id: wbc
      name: white blood cell
    alignment: same-grid
    alignment_notes: One row per box; column image = file name in images/; xmin/ymin/xmax/ymax are normalised
      to [0,1] of the 256x256 image.
  - role: label
    path_pattern: labels/*.txt
    format: other
    axes: null
    shape:
    - 19
    - 15
    shape_varies: true
    dtype: float64
    compression: none
    encoding: boxes-table
    classes:
    - id: rbc
      name: red blood cell
    - id: wbc
      name: white blood cell
    alignment: same-grid
    alignment_notes: labels/image-N.txt pairs with images/image-N.png; KITTI-style rows (class, truncated,
      occluded, alpha, x1 y1 x2 y2 in pixels, then zeros). image-1.txt has 19 rows vs 18 in annotations.csv
      (a duplicated box labelled both wbc and rbc).
  notes: 'Listing: Hugging Face API, 214 files, 13,258,776 B exact. Sample image-1.png: PNG 256x256x4
    uint8 (RGBA, alpha constant 255), RGB range 26-255 (from one sample). annotations.csv: 2,339 boxes
    (2,236 rbc, 103 wbc; README says 2,237 RBC). The tfrecords/ folder holds the same data as TensorFlow
    records (not inspected). Voxel size not found; checked: PNG header (no pHYs), HF dataset card and
    API record, GitHub README mirror, TXL-PBC paper full text (only "256 x 256 pixels", "high-magnification
    light microscope"). No single archive: files are fetched individually from the HF tree (resolve/main/<path>,
    checked usable).'
