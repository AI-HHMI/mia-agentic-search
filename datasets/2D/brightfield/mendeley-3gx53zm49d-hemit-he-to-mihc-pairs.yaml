notes: 'Image-to-image translation pairs (virtual staining), not hand-drawn labels: the mIHC channels are the target, so annotation
  type is recorded as restoration-pairs and source as automatic. Counts, splits, image size, TIFF format and folder layout
  come from the GitHub README; the Mendeley page gave licence (CC BY 4.0), authors and date, but its file listing could not
  be read so total size and the file listing were not verified. Pixel size, magnification and scanner are not stated on the
  Mendeley page, GitHub README or the arXiv HTML (registration details are in the paper supplement, which was not available).
  The paper says the full dataset would be released upon acceptance; the Mendeley release is dated 2024-07-19. Raw data originate
  from ImmunoAIzer (separate Mendeley dataset g52z2hmxrx). A preprocessed version of HEMIT is also part of the MIPHEI-ViT
  dataset on Zenodo 15340874. enricher: size 10,562,710,923 B (HEMIT.7z) from the Mendeley public API (was null).'
