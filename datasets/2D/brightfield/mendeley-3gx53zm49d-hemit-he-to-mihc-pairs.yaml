  notes: 'The dataset is one 10.56 GB 7z archive on Mendeley Data (public API lists 1 file). 7z members cannot be listed or
    read with range requests, so no header was probed and nothing was sampled; the tree is from the GitHub README. The download
    link (public-files/.../file_downloaded) answers HEAD with 403 and redirects GET to an S3 URL that returned 404 here, so
    probe.py --download-check marks it not usable and data.download_url stays null. TIFF axes, dtype and compression are unknown
    until the archive is unpacked. Voxel size not found; checked: Mendeley API description, GitHub README, arXiv HTML (pixel
    size not stated; registration details are in the supplement, not available).'
