title: 'HEMIT: H&E to Multiplex-immunohistochemistry Image Translation with Dual-Branch Pix2pix Generator'
short_name: HEMIT H&E to mIHC paired tiles (colon cancer)
description: 5,292 cellular-level aligned pairs of H&E and multiplex immunohistochemistry (DAPI, panCK, CD3) 1024 x 1024 tiles
  from colon cancer tissue, with the mIHC channels serving as the translation target. Both stains come from the same section
  (mIHC stained, bleached, then H&E stained) and pairs are registered in two steps. Train / validation / test folders (3,717
  / 630 / 945) hold paired input and label TIFFs sharing file names.
