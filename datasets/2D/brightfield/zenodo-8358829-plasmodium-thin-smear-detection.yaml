notes: 'Files: Plasmodium-v1.zip split into parts .001-.005 (about 44 GB) and models.zip (0.4 GB). Only the start of part
  .001 could be read (split zip, no central directory): it shows Plasmodium-v1/classes.txt and images/test/<patient-uuid>/<uuid>.jpg;
  the label files were not seen, so the label format (YOLO assumed) and annotations_verified are unconfirmed. Counts from
  the paper: 24,720 training/validation images (475 smears, 2,002,597 labels, 80/20 split) plus 4,508 test images (170 smears,
  358,825 labels). Labelling: manual then automatic with manual correction in CVAT (hence mixed). Cameras: Leica FlexCam C1
  / DF450C on DM2000 / DM2500. Pixel size not stated. Test-set smears come from six hospitals; labels for the test set were
  not checked. Size is the sum of the six Zenodo files.'
