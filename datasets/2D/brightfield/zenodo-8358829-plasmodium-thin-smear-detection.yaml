  labelled and corrected bounding boxes in nine classes (white and red blood cells, platelets, Trypanosoma brucei, red cells
  infected with P. falciparum, P. ovale, P. vivax, P. malariae, and Babesia divergens), with train/test folders and trained
  detector models.
