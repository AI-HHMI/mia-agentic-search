notes: 'Zenodo v5.0.0 lists eight zips: am.zip (57 JPEG scans in am/train and am/test, 481 MB), erm_test.zip (30 JPEG, 1.55 GB) and erm_train_1..6.zip (123 JPEG in total, about 6.2 GB, to be merged into one folder); each JPEG has a *_cnn_1_annotations.csv beside it (counted from tools/peek_archive.py listings: 210 images). The CSV rows are tiles with one-hot class columns (AM file read in full; ErM has more classes per the paper). Scanner: Pannoramic MIDI II Rx, 37x, 0.27 um/pixel, 7 focal planes extended-focus (paper Methods, preprint). Tile size not stated in the pages checked. Plant host species not stated in the main text, so organism is empty. Licence: Zenodo record says MIT and the preprint Data availability says MIT, while its Discussion mentions an open government licence. The preprint is not open access in Europe PMC; Methods were read via the bioRxiv full text page. Exact total size_bytes not on the record page (sizes approximate, about 8.2 GB).'
