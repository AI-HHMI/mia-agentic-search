notes: 'Files: 8 Training<Class>.zip (one per class), Test1-3.zip, README (also on Dryad, 10.5061/dryad.0k6djhb45). peek_archive: TrainingOptimisable 1,034 png (folder 7), Test1 3,000, Test2 3,000, Test3 2,999 png; other training zips not listed. Counts (16,317 training, 25,316 total, 8 classes) from the bioRxiv full text; class-number mapping confirmed only for Optimisable = 7. Labels manual, iteratively corrected with a model-assisted GUI. Imaging system and pixel size not stated on the page or in the paper, so brightfield is inferred from the drop-imaging context. Only the preprint was read. Different data from catalogued VMXi and CHiMP sets.'
