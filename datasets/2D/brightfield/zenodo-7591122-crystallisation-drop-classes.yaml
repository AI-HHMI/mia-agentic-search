notes: 'Files: 8 Training<Class>.zip (one per class), Test1-3.zip, README (also on Dryad, 10.5061/dryad.0k6djhb45).
  Counts (16,317 training, 25,316 total, 8 classes) from the bioRxiv full text. Labels manual, iteratively
  corrected with a model-assisted GUI. README: imaged with a Formulatrix Rock Imager; pixel size not stated
  on the page, README or paper. organism: not applicable (protein crystallisation drops, no organism).
  Different data from catalogued VMXi and CHiMP sets. enricher: class folders 1-8 = null, clear, heavy
  precipitate, light precipitate, phase separation, crystalline, optimisable, shootable (confirmed from
  all zip listings); enricher: channels 3 (RGB PNG, was null).'
