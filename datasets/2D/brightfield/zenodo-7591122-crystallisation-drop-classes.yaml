title: 'Training and test data for: Not getting in too deep: A practical deep learning approach to routine crystallisation image classification'
short_name: Protein crystallisation drop classes (brightfield)
description: 25,316 images of protein crystallisation drops from automated imaging of nanolitre crystallisation experiments (AstraZeneca protein crystallography team), labelled into eight outcome classes (null, clear, heavy precipitate, light precipitate, phase separation, crystalline, optimisable, shootable). 16,317 training images (class-per-archive) and three independent test sets of about 3,000 images each (same time courses, same proteins on other plates, and an independent Trastuzumab project).
