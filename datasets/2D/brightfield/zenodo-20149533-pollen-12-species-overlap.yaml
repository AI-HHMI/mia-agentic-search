notes: 'Zip (62.1 MB, 1163 files) holds POLLENdataset/<species>/ folders with N.jpg images and N-mascara.(jpg|png) masks plus
  extra mask variants (mascara2, mascara3). Zenodo text states 390 images and 618 grains; the 2016 paper states 389 images,
  1388x1040 px, masks as binary bmp, drawn manually by an expert palynologist; imaging used a Zeiss Axioskop 40 with AxioCam
  MR, methyl green glycerin jelly mount. Magnification and pixel size not stated on the Zenodo page or in the paper. Zenodo
  record is a 2026 re-deposit of the 2016 paper supplement; file formats here (jpg/png) differ from the bmp described in the
  paper. n_items taken from the Zenodo page; the zip listing was not counted per species.'
