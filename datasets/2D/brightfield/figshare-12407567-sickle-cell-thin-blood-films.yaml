title: Digitized Thin Blood Films for Sickle Cell Disease Detection
short_name: Sickle cell thin blood film slides (brightfield)
description: 162 thin blood film slides imaged on a custom brightfield microscope (100x/1.4 NA objective,
  colour camera), z-stacks collapsed with a wavelet extended-depth-of-field algorithm into one RGB TIFF
  per field, grouped in one folder per slide. A text file gives a slide-level label per slide (1 or 0,
  from haemoglobin electrophoresis phenotype testing for sickle cell disease).
