notes: 'Two tar.gz archives (8.7 GB and 17.3 GB) plus the label file (162 lines, one per slide, 0 or 1).
  The first bytes of part 1 were read: folders such as sickle3-edofed/280120-07/ holding pos004_EDOF_DENISOVAN_RGB.tiff
  (about 16.7 MB each); the full image count was not listed (tar.gz is not listable remotely), so n_items
  is the 162 slides in the label file. Label meaning (1 = sickle cell disease positive) is read from the
  dataset description (haemoglobin electrophoresis phenotype) and the paper title, not from a legend in
  the file. The MICCAI 2020 paper (Manescu et al., weakly supervised malaria and sickle cell detection)
  could not be read (publisher and UCL Discovery returned 403/404), so pixel size, patient count and the
  label legend are unverified; the Figshare page has no pixel size. Thick-film malaria sibling dataset
  figshare-12173568 is catalogued separately.'
