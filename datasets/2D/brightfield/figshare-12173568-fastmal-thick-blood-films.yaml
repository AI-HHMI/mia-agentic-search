notes: 'FASTMAL_THICK_FILMS.zip (2.70 GB) holds the object-level annotations: 239 TIFFs in 13 sample folders,
  each with <folder>.json. The other files (samples_part.tar.gz 153.9 GB, samples_part2.tar.gz 127.9 GB
  with sample-level labels only, tbf_samples_parasite_count.csv) are not counted in n_items. enricher:
  size_bytes is now the whole record, 284.5 GB from the Figshare file list (was the annotated zip only,
  2.70 GB). Pixel size is the page''s field size divided by pixels (166 x 142 um at 2560 x 2160 px), not
  stated directly; TIFF headers carry no calibration. Images are extended-depth-of-field projections of
  14-plane z-stacks (page). Paper (Am J Hematol) not open access: abstract only. Annotation procedure
  and split not stated.'
