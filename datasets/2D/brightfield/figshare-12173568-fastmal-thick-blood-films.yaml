title: Giemsa-stained thick blood films with parasite and white-cell bounding boxes (FASTMAL)
short_name: P. falciparum thick blood film boxes (brightfield)
description: 239 extended-depth-of-field brightfield fields of view (2560x2160 RGB TIFF, 100x/1.4NA) of
  Giemsa-stained thick blood films from a Nigerian malaria clinic, in 13 sample folders, with object-level
  bounding boxes for malaria parasites and white blood cells (plus crowd, background and ignore regions).
  Larger sample-level archives (100 fields per sample, labelled by routine clinical microscopy) and per-sample
  parasite/WBC counts are in the same record.
