      use the same stems.
  notes: 'Tree condensed by hand from tools/listing.py output (per-organ folders repeat the same subfolders;
    listing exceeded 40 lines). Sampled human_bladder_01: tissue PNG RGB uint8 14-174; label mask uint16,
    30 distinct values in 0-64 (non-contiguous), so probably instance IDs, but the docs I read don''t
    state the encoding and the image''s roiset holds 24 ROIs, so encoding is left unknown. Only one pair
    read.'
