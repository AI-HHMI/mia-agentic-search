notes: 'Pixel size not stated on Zenodo record, file listing or paper Methods (only 40x magnification);
  voxel_size_nm left null. Zip contains .roi (33,098), .png (13,300), .tif (1,330), .mat (665) files per
  peek_archive. Paper describes five-fold CV with fold-splitting code on Kaggle/GitHub, but no split files
  are shipped in the zip. Also mirrored on Kaggle (ipateam/nuinsseg). enricher: tissue images are 512x512
  RGB PNG (sample).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./                                          1 files    1.6 GB  .zip\nNuInsSeg.zip/<organ>/\
      \  (one folder per human/mouse organ; 48,399 members in total)\n  Imagj_zips/<organ>_#_roiset/ \
      \            .roi   (ImageJ ROIs per image)\n  distance maps/                           .png\n \
      \ label masks/                             .tif\n  label masks modify/                      .tif\n\
      \  mask binary/                             .png\n  mask binary without border/              .png\n\
      \  mask binary without border erode/        .png\n  nuclei border/disk1..disk10/             .png\n\
      \  overlay_save_path/                       .png\n  stacked mask/                            .mat\n\
      \  tissue images/                           .png\n  vague areas/{Imagj_zips,mask binary,overlay_save_path}/\n\
      \  weighted_maps/, weighted_maps_erode/     .png\ne.g. human bladder: 12 tissue images (5.2 MB),\
      \ 12 label masks (751 KB), 400 ROIs\n"
    n_files: 1
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/10518968/files/NuInsSeg.zip::human bladder/tissue images/human_bladder_01.png
    - https://zenodo.org/records/10518968/files/NuInsSeg.zip::human bladder/label masks/human_bladder_01.tif
    size_bytes: 439926
    description: One 512x512 H&E tile and its label mask
