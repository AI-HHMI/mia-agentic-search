notes: 'Zip index read with peek_archive (99 files, 499.7 MB): 36 Training_sources with 36 Training_targets
  masks, 4 QC source/target pairs, and the StarDist model, logs and QC report. Pixel size 650 nm, image size
  and 16-bit/8-bit types are from the Zenodo description. The preprint Methods say training images were
  manually annotated in Fiji and exported as labelled images; the preprint full text was read. Part of a
  series of cell-detection training sets by the same authors; this one covers neutrophils only. The test split
  is the QC pairs inside the same archive. enricher: TIFF headers store 649.6 nm/px, consistent with the stated 650 nm.'
