notes: 'OSF project (2 items): DeepLeish_Localdata_Original.zip (peek_archive: 417 JPEGs, 177 MB; file-name prefixes CL 247, LES_NEG 126, VL 44) and a YOLOv5 notebook folder. Terms: the OSF page says users must cite the authors work and database; no SPDX license is named (license custom). Paper (BMC Med Imaging 2024, Europe PMC): slides from AHRI and Jimma Medical Center, imaged with 12 MP and 5 MP Olympus digital microscopes (BX-63 for the 12 MP); the paper counts 244 CL, 68 VL and 126 negative local images, which differs from the zip; magnification and pixel size not stated. Expert bounding-box labels used for detection are described in the paper but are not in the OSF files. No split provided.'
