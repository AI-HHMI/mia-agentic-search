notes: >-
  Zip listing (peek_archive): Training dataset/Training_source and Training_target with 209 files each, a
  Quality control dataset, one 57.8 MB test TIFF and the StarDist model folder. The record calls the images
  brightfield but the objective phase-contrast; both modalities are listed. Species and cell origin of the T
  cells are not stated on the Zenodo page; the paper full text is not open access in Europe PMC (only the
  abstract was read), so organism is left empty. The pixel size 645 nm comes from the Zenodo description.
  Masks are described as manually segmented, formats as 8/16-bit TIFF. Sibling record: the flow chamber
  dataset (zenodo-4034939).
