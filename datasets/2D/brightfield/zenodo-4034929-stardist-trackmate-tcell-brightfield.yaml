title: Combining StarDist and TrackMate example 2 - T cell dataset
short_name: T cell brightfield instance masks (StarDist)
description: >-
  StarDist example training data for tracking T cells in widefield time-lapse images: 209 paired brightfield
  images and manually segmented instance masks (1024x1024 px, 645 nm/px), plus test data, a quality-control
  set and the trained StarDist model (ZeroCostDL4Mic). Imaged with a 10x phase-contrast objective on a Zeiss
  Axiovert 200M with EMCCD camera.
