notes: The ETH Research Collection later blocked access from this environment (rate limited / access restricted), so only the landing
  page meta description was read; file listing, license and download size were not seen (license unknown, size null). n_items 20,166
  is the sum of the D1-D5 train, validation and test images in Table 1 of the paper (about 1.15 million nuclei), and png is from the
  paper Methods (8-bit PNG converted from TIFF). Pixel size is not stated in the paper text read. The same group also hosts a
  larger nucleus set (9,849 images, handle 20.500.11850/608641) and a whole-cell set (224 images, 20.500.11850/608646) linked from
  the aiSEGcell GitHub; this record is the later D1-D5 supplement. Splits are given for D1 (8,864/985/3,153), D3 and D4; D2 and D5 are test only.
