id: eth-679085-aisegcell-hematopoietic-nuclei-bf
title: 'aiSEGcell_nucleus: A large data set for nucleus segmentation of primary hematopoietic cells in bright field and fluorescence'
short_name: aiSEGcell hematopoietic nuclei (bright field)
description: Five datasets (D1-D5, about 20,200 images and 1.1 million nuclei in total) of 20x/10x bright field time-lapse
  images of mouse and human primary hematopoietic cells and mouse embryonic stem cells, each paired with a nuclear-marker-derived
  segmentation mask that was manually curated from fastER output. Released with the aiSEGcell software for training nucleus segmentation
  from bright field images; D1 provides train/validation/test splits.
