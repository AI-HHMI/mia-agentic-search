short_name: Leishmania-infected macrophages (brightfield)
description: 180 Giemsa-stained brightfield images (1,844 x 2,709 px) of Leishmania amastigotes in infected
  macrophages (Set1 THP-1 / L. major, Set2 primary monocyte-derived macrophages / L. infantum), 90 images
  each. Expert polygon annotations of amastigotes, host cells and nuclei (8,140 amastigotes, 1,511 host
  cells, 1,731 nuclei) as semantic-segmentation PNG masks plus MS COCO JSON. Split 64/17/9 train/val/test
  per set is described in the paper.
