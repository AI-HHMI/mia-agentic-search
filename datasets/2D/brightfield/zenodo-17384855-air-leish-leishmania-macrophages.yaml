notes: 'Paper (Sci Data 2026, Europe PMC full text) read: acquisition, annotation (Roboflow polygons,
  Dice agreement 95.6%), COCO JSON + PNG masks, split 64/17/9 images per set (described, not seen as folders).
  Zenodo has two zips: AIR_LEISH_dataset_v1.zip (997 MB, 361 files: 359 png + 2 coco.json, listed with
  peek_archive) used for size; AIR-Leish_dataset.zip (315 MB, 136 files) looks like an earlier or reduced
  copy and was not counted. COCO JSON files are annotations. Pixel size not given in the paper text read;
  images come from a phone camera. Channel count (3, colour) is assumed from the colour Giemsa images,
  not stated. enricher: size_bytes now counts both Zenodo zips (file listing); images stored as RGBA PNG;
  Set1 has 89 masks for 90 images.'
