notes: 'No related paper is listed on the page, and the description gives no source for the images (only
  "light microscopes with digital imaging systems"), so they may be crops derived from another public
  cervical cytology collection (e.g. mendeley-ytd568rh3p-apcdata-cervical-cytology, which uses the same
  six Bethesda classes) although the page does not say so; it is catalogued as stated, but treat
  provenance as unverified. Magnification ("standard diagnostic magnifications"), microscope model, pixel size
  and how labels were assigned are not stated. Zip listing (peek_archive): 4,253 JPEGs (~21 KB each,
  90.9 MB uncompressed) in folders per class under "Enhanced Cervical Cytology Image dataset/"; the
  class counts above come from the page and were not recounted from the listing.'
