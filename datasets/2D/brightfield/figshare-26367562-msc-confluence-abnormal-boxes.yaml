notes: 'Record text, license and zip contents (peek_archive) read; the description is two sentences. The
  zip holds data/A_singlestack (719 JPEGs, 2048 x 1536) and data/B_multistack (413 JPEGs; the csv gives
  1280 x 960), each with Annotations/*.xml, JPEGImages/ and a YOLOv8_training_data folder. The page says only
  single-stack images carry the abnormal-cell boxes, yet the multistack csv also lists boxes, and the one
  sample XML read (A 0_1) has no objects, so box coverage, who drew them and the exact meaning of the
  filename prefix (probably the confluence class) are unverified. The four confluence classes are in the
  description; no per-class folders exist in the zip. Pixel size, objective, cell source and species not
  stated. No paper found in Europe PMC or by web search. Checked: figshare record, zip listing, a sample
  XML and both csv headers.'
