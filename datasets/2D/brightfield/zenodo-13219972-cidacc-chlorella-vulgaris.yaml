    shape:
    - 2
    - 5
    shape_varies: true
    dtype: float32
    compression: none
    encoding: boxes-table
    classes: null
    alignment: same-grid
    alignment_notes: 'One YOLO txt per image (same stem): class x_center y_center width height, normalized to the image size,
      so it applies to the 640x640 images and the originals alike. Class ids are not mapped in the files; the paper names
      two classes (single C. vulgaris cells and cell clusters). distinct/bbs/1.txt has 2 rows, both class 0.'
  notes: 'Listing: Zenodo API, 1 zip, 274,417,396 B (exact), 2,512 members. Sample (distinct 1.png image + mask, 112 KB, measured
    then deleted): image uint8 RGB 640x640, values 78-255 (mean 196), channels differ (true colour, brightfield); mask uint8
    {0,255} (645 white px); bbs/1.txt read with peek_archive (2 boxes, class 0). value_range is from one sample. Voxel size
    not found; checked: zip listing (no metadata files), PNG headers via sample, Zenodo API description, paper full text (Data
    in Brief, gives only 2592x1944 px, Olympus CX43RF, EP50 camera, 40x objective; no um/px). The 640x640 copies are non-uniformly
    resized from 2592x1944, so even a stated camera pixel size would not carry over directly. Zenodo returned intermittent
    HTTP 504 during this run; the zip URL passed --download-check with range requests (members 206).'
