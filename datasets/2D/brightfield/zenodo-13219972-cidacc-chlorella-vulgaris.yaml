    alignment_notes: 'dataset/<class>/masks/N.png pairs with dataset/<class>/images/N.png (same stem, same 640x640 grid).
      Paper: masks made in Fiji, white = cells/clusters, black = background. One mask (distinct/masks/191.bmp) is a BMP and
      is not matched by this pattern.'
  - role: label
    path_pattern: dataset/*/bbs/*.txt
    format: other
