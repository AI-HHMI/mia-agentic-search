description: 628 brightfield microscope images of Chlorella vulgaris in a Neubauer hemocytometer (464 with countable single
  cells, 164 with cell clusters), as 2592x1944 originals and 640x640 downscaled copies, with YOLO-style bounding boxes (5,808
  cells plus 183 clusters) and PNG masks. Made for cell detection, counting and size estimation.
