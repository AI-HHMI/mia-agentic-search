notes: 'One 274 MB zip (listed, 2,512 files): original_images/{clusters,distinct} (164 + 464 PNG, 2592x1944) and clusters/
  and distinct/ each with images, bbs and masks (164 and 464 items; one distinct mask is a BMP). Paper (Data in Brief 2024,
  open access) gives 5,808 cell labels in distinct and 183 in clusters, boxes made in Roboflow and masks in Fiji. Pixel size
  is not stated in the Zenodo page or paper (Neubauer hemocytometer at 40x). The distinct class images are countable; cluster
  images are not. enricher: size 274,417,396 B from the Zenodo file listing (was null).'
