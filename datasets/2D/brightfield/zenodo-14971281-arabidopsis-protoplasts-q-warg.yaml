notes: 'Six zips organised per figure, mixing data with R scripts, PDFs and AVI movies. Labels are Cellpose cyto3 predictions on the brightfield image with later manual checking, not hand-drawn. enricher: voxel size set to null (was 1048): subsets differ. Widefield tile mosaics (Fig_2, Fig_S1, Fig_S3, fig_3E; 55 images) are 1.048 um/px per paper Methods; confocal max-projection crops (Fig_4-S4; 132 images, 512x512) are 0.62 um/px per paper and 0.6215 um in their ImageJ headers. Modality: confocal = Fig_4-S4, widefield/brightfield = the rest. n_items 187 = images with a label PNG; Fig_3 A/B/D images have no labels. channels 3 (probed). download_url = landing page: the data are six separate zips.'
