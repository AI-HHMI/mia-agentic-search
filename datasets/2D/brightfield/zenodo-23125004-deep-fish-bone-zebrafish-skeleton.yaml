title: 'Deep-Fish-Bone: brightfield microscopy dataset for multi-label segmentation of craniovertebral skeletal structures in zebrafish larvae'
short_name: Zebrafish larva skeleton masks (brightfield)
description: 190 annotation records from 34 zebrafish larvae (wild-type, heterozygous and homozygous), each a ventral-view brightfield image with 25 binary masks for developing craniovertebral skeletal structures and a supporting full-body mask. Metadata links each record to its fish identity, genotype and image quality; some images were annotated independently by different annotators.
