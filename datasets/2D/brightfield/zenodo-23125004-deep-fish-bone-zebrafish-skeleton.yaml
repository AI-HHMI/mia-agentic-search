notes: 'Deep-Fish-Bone_Dataset_v1.0.zip listed with tools/peek_archive.py (5132 files: 5130 .png in ventral/<image_id>/ with image.png, 25 structure masks and full_mask.png per record, plus README_DATASET.md and metadata.csv); the README and metadata.csv were read. The README names an accompanying study (Deep Learning-Based Multi-Label Segmentation of Developing Craniovertebral Skeletal Structures in Zebrafish Larvae: A Brightfield Microscopy Benchmark Dataset and Systematic Evaluation) that was not found in Europe PMC, Crossref or a web search, so publications is empty and pixel size, microscope, magnification details and the annotation tool are not stated in the sources read. Some structure mask files are named with upper-case pairs (EN1, CL1, CH1, CB1) for En1, Cl1, Ch1, Cb1. Several images can come from the same fish; a split by fish_id is advisable.'
