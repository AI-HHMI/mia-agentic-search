title: A dataset of histopathology images of paratuberculosis disease (Johne's disease)
short_name: Johne's disease intestinal histopathology (H&E)
description: 366 H&E histopathology photographs of ruminant small-intestine sections (157 negative, 209 positive for Johne's disease / paratuberculosis), one slide per animal, captured at 10x or 40x on a light microscope with a 10 MP camera. Provided as original images, versions with a scale bar, 400 x 400 resized full views and 400, 800 and 1200 pixel patches that the annotator rechecked for diagnostic features.
