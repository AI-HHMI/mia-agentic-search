notes: 'Mendeley public API: version 4 (2025-10-21), CC BY 4.0, 1,381,966,204 B; v3 page and API description give 366 images (157 negative, 209 positive) and the folder structure (ImagesS, ImagesFullView400x400, Patches400x400, Patches800x800, Patches1200x1200). The Mendeley file listing endpoint returned nothing, so the file list and image format of the Mendeley files were not seen; the paper (Data in Brief, PMC12396303) says the published format is JPG (originals TIFF). Magnification 10x or 40x, Euromex Oxion microscope with Cmex 10 MP camera, H&E, from the paper; pixel size not stated. Positive/negative class labels are per slide, taken by a certified veterinary pathologist; how the class is encoded in the files was not seen (annotations not verified). The paper says rectangles marking lesions in its figure are not in the dataset. No split files known.'
