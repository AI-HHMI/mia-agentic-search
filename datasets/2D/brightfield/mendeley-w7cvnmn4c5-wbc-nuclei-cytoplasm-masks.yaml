notes: 'Mendeley API lists four RAR files: Dataset 1.rar (4.8 MB), Dataset 2.rar (9.8 MB), Result 1.rar and Result 2.rar (the
  authors'' own segmentation outputs, not ground truth). RAR contents could not be listed (peek_archive handles zips only), so
  formats are given as other, image counts come from the dataset description (300 + 100), and annotations_verified is false.
  License shown on the Mendeley page as CC BY NC 3.0 (non-commercial). The paper (Micron 2018) is not open access, so only the
  abstract was read; species, pixel size and the image file format are not stated on the dataset page, the API record or the
  abstract. Dataset 2 images were collected from the CellaVision blog, so their provenance and rights are unclear.'
