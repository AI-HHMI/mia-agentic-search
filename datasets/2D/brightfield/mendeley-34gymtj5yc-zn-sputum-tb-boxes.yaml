notes: 'Archive Raw_Sputum_Microscopy_Dataset.zip (565.6 MB, listed with peek_archive) holds 1426 .jpg and 224 .png images plus 1438 YOLO .txt label files; a separate metadata.csv gives Image_ID, Data_Split, Background_Color and Camera_System. Magnification, pixel size and a related publication are not stated on the dataset page or in the file listing; no paper is linked, so none was read. Bounding boxes only (detection), no masks. The zip holds 1650 image files (1426 .jpg + 224 .png) against 1438 label files and the 1,438 images stated on the page; the extra images were not explained on the page or in the listing, so n_items follows the page. Sputum is human-derived; organism field lists the detected bacterium.'
