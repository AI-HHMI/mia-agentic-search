notes: 'Two zips on Zenodo: SHdataset_12k.zip (27.8 GB; train 9,641 / test 2,410 PNG images, each with
  a binary mask) and diagnosis_test_dataset.zip (12.5 GB; 65 folders DT01-DT65 of 117 JPEG FoVs each plus
  a CSV with egg_count and diagnosis per sample, no masks). enricher: zip contents listed (were unlisted);
  masks are binary 0/255, so types instance-segmentation -> semantic-segmentation, plus counts (CSV);
  formats png -> png, jpeg; size from the listing (was 40,329,227,913). Pixel size in um is not stated:
  the papers give a 4x objective, 1.55 um sensor pitch and a FoV of 1078 x 1470 um, but no um/pixel value.
  Eggs were annotated with COCO Annotator by an expert parasitologist (paper) / two experts (record);
  masks were generated from the JSON with a script.'
