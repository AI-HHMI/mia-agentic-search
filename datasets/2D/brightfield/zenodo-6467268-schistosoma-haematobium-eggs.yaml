notes: 'Two zips on Zenodo: SHdataset_12k.zip (27.8 GB; 12,051 images with masks, 80/20 train/test = 9,641/2,410 per paper) and diagnosis_test_dataset.zip (12.5 GB; 65 samples x 117 FoV with expert diagnosis, no masks stated). Zip contents could not be listed (Zenodo returned 504 for range requests), so annotation files were not seen in a listing; details come from the record description and paper Methods. Pixel size in um is not stated: paper gives 4x objective and 1.55 um sensor pitch, but no calibrated um/pixel. Eggs were annotated with COCO Annotator by an expert parasitologist (paper) / two experts (record); masks were generated from the JSON with a script. Size is the sum of both zips. Paper cites the Zenodo record in its Data Availability Statement.'
