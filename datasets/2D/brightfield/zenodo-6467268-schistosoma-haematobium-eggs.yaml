  notes: 'Listing via tools/listing.py --expand-zips over both zips (31,708 members, exact sizes). Sampled
    one image/mask pair (test 15307, the largest mask); value_range values are from that one sample. Mask
    values {0: 1,947,947, 255: 1,134,613} px. Masks 13492 and 10002 (5,588 B each) are all 0, so 0 = background
    and 255 = egg; 5,675 of 12,051 masks have that exact size (likely egg-free fields). Probed one diagnosis
    JPEG header. voxel size not found; checked: PNG/JPEG headers (no calibration), Zenodo API description,
    both papers in full (Europe PMC PMC10405291 and PMC9146062: 4x objective, 1.55 um sensor pixel, FoV
    1078 x 1470 um, no um/pixel value stated). download_url stays null: the dataset is two separate zips
    (SHdataset_12k.zip is the segmentation set: https://zenodo.org/records/6467268/files/SHdataset_12k.zip).'
