notes: 'dse_data.zip: 182 images, 182 annotation TIFFs and 6,025 files in coco_annotations (one per cell,
  as the file count suggests). anemia_data.zip: scd 24, thalassemia 18, control 37 brightfield images,
  each with a matching fluo-4 image (158 TIFFs); no annotation files seen there, so the annotated part
  is the control dse_data set. Class names (discocyte, stomatocyte, echinocyte sequence) come from the
  Zenodo text; the COCO category list was not opened. Images taken with an Axiocam on a Zeiss Axiovert
  200M with a 100x objective, no staining (paper Methods); pixel size not stated. Only dse_data.zip is
  given as download_url; the second zip is on the same record. n_items counts brightfield images (182
  + 79). enricher: annotations verified in dse_data.zip (instance-ID masks; coco_annotations are per-cell
  binary masks named <image>_<class><n>_<i>.tif).'
