notes: 'Zips (peek_archive): TrainSet 80, Validation1Set 50, Validation2Set 14, TestSet 536 TIFFs (R_ reference and T_ transformed
  BF and SHG per pair) plus metadata.csv. The record cites a breast-carcinoma collagen paper as origin; the linked Commun
  Biol paper (read in full) describes BF/SHG acquisition and mutual-information registration but not this deposit, so it is
  cited as related. Pixel size not stated. Differs from pending PR zenodo-4550300 (full 2048px images without applied transforms
  or landmarks): this deposit has 834px patches, applied rotation/translation and ground truth corner coordinates. enricher:
  read metadata.csv (134 rows x 18 cols) and sampled patches.'
