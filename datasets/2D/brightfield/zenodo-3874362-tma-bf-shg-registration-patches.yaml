short_name: BF/SHG registration benchmark, 834px TMA patches
description: 206 aligned bright-field (H&E) and second-harmonic generation (SHG) image pairs of human tissue microarray cores
  as 834x834 patches, with train (40 pairs), validation (25 and 7 pairs) and test (134 pairs) sets; the test set adds random
  rotation and translation of each pair, and metadata.csv gives the corner coordinates of every applied transform as registration
  ground truth.
