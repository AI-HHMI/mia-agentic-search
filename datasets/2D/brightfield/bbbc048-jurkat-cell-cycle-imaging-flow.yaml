title: BBBC048 - Cell Cycle Jurkat Cells (imaging flow cytometry)
short_name: Jurkat cell cycle phases (imaging flow cytometry)
description: 32,266 single-cell images of asynchronously growing, fixed Jurkat cells from an ImageStream imaging flow cytometer
  (brightfield, darkfield and fluorescence channels, with propidium iodide for DNA content and an MPM2 antibody for mitotic
  cells). Each cell is labelled with one of seven cell-cycle phases (G1, S, G2, prophase, metaphase, anaphase, telophase)
  in Ground_truth.lst. Used to train the DeepFlow classifier.
