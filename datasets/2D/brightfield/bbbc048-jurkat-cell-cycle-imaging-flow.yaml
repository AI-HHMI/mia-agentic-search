notes: 'BBBC048v1.zip (peek_archive) holds 5 tar.gz archives (scRNA, final, 1540408813, predictions, evaluation scripts), CellCycle.zip and CellCycle.mp4; the tar.gz and inner zip were not opened. Ground_truth.lst lists per-cell paths like ./Anaphase/12432_Ch3.ome.jpg, so images are channel-wise JPEG per cell (format taken from those paths). Pixel size, magnification and image dimensions are not stated on the BBBC page or in the paper. Labels combine algorithmic segmentation, morphology analysis of fluorescence channels and manual inspection (paper Methods), hence source mixed.'
