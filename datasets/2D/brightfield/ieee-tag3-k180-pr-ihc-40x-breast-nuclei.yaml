title: 'PR-IHC-40X: Progesterone Receptor Immunohistochemistry Dataset for Breast Cancer Diagnosis'
short_name: Breast cancer PR IHC nuclei masks (brightfield)
description: 250 40x regions of interest from 50 progesterone-receptor-stained breast cancer slides (3DHistech Pannoramic
  DESK scans, University Malaya Medical Centre), each with a binary nuclei segmentation mask and a four-class colour annotation
  (Strong, Moderate, Weak, Negative) of about 32,000 pathologist-validated nuclei. Split into 175 training, 38 test and 37
  validation patches at whole-slide level.
