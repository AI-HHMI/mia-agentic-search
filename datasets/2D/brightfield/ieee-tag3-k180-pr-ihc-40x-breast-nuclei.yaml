notes: 'Hosted on IEEE DataPort, which requires a (free) IEEE login to download; the page also mentions a subscription and
  the search listing marks it Open Access, so access is recorded as registration. Not downloaded or peeked: image
  and mask file formats and the dimensions are not stated on the DataPort page, so formats is other and no zip contents
  were verified. size_bytes is the sum of the listed training, test and validation archives (721.33 + 152.19 + 148.63
  MB). Counts of nuclei per class: Negative 16,788, Weak 4,034, Moderate 2,904, Strong 8,316. Full text of the Data
  article (MDPI) is not open via Europe PMC and the MDPI page returned 403, so the paper Methods were not read; pixel
  size is not stated on the DataPort page. Sibling dataset from the same group: HER2-IHC-40x (zenodo-15179608), a different
  stain and task.'
