notes: Only two muscle sections (soleus, EDL) are provided, each as 6 whole-section stitched images (MyHC I, MyHC IIa, SDH, stack, mask, tracks), so 12 files but many fibers per image. Masks were produced by Cellpose and fiber linking with TrackMate, with manual selection of fibers co-expressing MyHC I and IIa; not purely manual annotation. Pixel size not stated on the study page, in the file listing or the project README (no associated paper listed; checked BioStudies record and GitHub README). Acquisition on Leica DM500 with 20x objective; the study reports bright-field microscopy though stains are immunostained and SDH.
