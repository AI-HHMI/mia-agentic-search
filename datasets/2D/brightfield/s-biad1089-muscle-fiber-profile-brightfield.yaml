    colours: 90% grey pixels, 7,189-10,207 colours per slice, so the ''masks'' are colour overlays on
    the image (GitHub README: ''the same cells are marked with the same color''), not integer labels;
    instance IDs would need colour decoding. Voxel size not set: source TIFFs uncalibrated; Stack 0.952
    um/px and sol mask 1.27 um/px in ImageJ headers, but the project README says the scale was set to
    ''the estimated number of microns'' by hand, and the BIA record states none. Checked: headers, BioStudies
