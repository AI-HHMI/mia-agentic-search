notes: 'Training frames are unlabelled normal images (anomaly-detection setting); masks cover only the 48 anomalous
  test frames, so label coverage is partial. Paper Methods: ComplexEye, 4.7x, NA 0.3, one frame per 8 s. The benchmark
  paper also uses the LightMyCells challenge data, which is not part of this deposit. No single archive; download_url
  is null (files are served individually from the EBI FTP tree). enricher: voxel size 641 nm from the BioStudies file
  lists (pixel_dimensions "X,Y = 0.641 um" on all 8,381 images; was null); OME-TIFF headers say 640 nm. enricher: organisms:
  Homo sapiens = train/ and test/*/human/, Mus musculus = test/*/mouse/ (and test/good_data/mouse/). enricher: size_bytes
  is the exact sum of the repository file lists plus the 4 file-list files. enricher: formats ome-tiff (probed; was tiff).'
