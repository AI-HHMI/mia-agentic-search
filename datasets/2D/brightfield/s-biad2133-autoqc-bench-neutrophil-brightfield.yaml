notes: 'File lists read in full: 8,381 TIFF frames plus 12 split CSVs (2.88 GB) and 48 mask TIFFs (250 KB).
  Training frames are unlabelled normal images (anomaly-detection setting); masks cover only the 48 anomalous
  test frames, so label coverage is partial. Paper Methods: ComplexEye, 4.7x, NA 0.3, field of view 825.8 x
  512 um per well, one frame per 8 s; pixel size and image dimensions are not stated in the paper, record
  or file lists, so voxel_size_nm is null. The benchmark paper also uses the LightMyCells challenge data,
  which is not part of this deposit. No single archive; download_url is null.'
