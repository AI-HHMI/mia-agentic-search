title: 'AutoQC-Bench: brightfield neutrophil migration frames for image quality control, with anomaly masks
  (BioImage Archive S-BIAD2133)'
short_name: Neutrophil brightfield QC anomalies (AutoQC)
description: 'About 8,200 normal brightfield frames of migrating human neutrophils (ComplexEye high-throughput
  microscope) for training, plus a held-out benchmark of 100 normal and 48 anomalous frames from human and
  mouse neutrophils. The anomalous frames (air bubbles, artifacts, contamination, illumination, Z-shift)
  have manual segmentation masks drawn in napari. Cross-validation split CSVs are provided.'
