notes: 'Hosted on Mendeley Data (repository set to other). Read the Mendeley landing page (CC BY 4.0; PNG originals, PNG ground-truth
  images, Excel life-stage labels) and the open-access paper (Methods, Data availability). Counts disagree: the Mendeley page
  and Dataset Ninja say 883 images (page says 17 patients), the paper says 837 images from 16 patients after dropping one
  patient; n_items uses the repository figure. Each paper image is a 4 x 4 composite of 1382 x 1030 px tiles that were separated.
  Pixel size and microscope are not stated (the paper only gives an average red blood cell diameter of about 124 px). Ground
  truth is a binary segmentation of manually selected dark-stained blobs (parasites, WBC, debris), not every cell, hence partial
  coverage. The zip could not be listed (Mendeley API unreachable, S3 server reports no file size), so file names and sizes
  are unverified; the S3 zip URL is from the Dataset Ninja page. No train/test split is provided.'
