short_name: P. falciparum Giemsa blood smears (brightfield)
description: 883 Giemsa-stained thin blood film images (PNG) from Plasmodium falciparum-infected patients in the Gambia, with
  ground-truth segmentation images of dark-stained blobs (parasites, white blood cells, debris) and expert life-stage labels
  with locations in an Excel file (about 2,900 parasites; classes ring, late ring/early trophozoite, mid trophozoite, early
  schizont, late schizont, segmenter, WBC, debris).
