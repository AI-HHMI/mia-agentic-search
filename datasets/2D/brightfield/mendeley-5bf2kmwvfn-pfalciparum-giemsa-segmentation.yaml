notes: 'Hosted on Mendeley Data. CC BY 4.0 (Mendeley API data_licence). Counts: Mendeley/readme 883 images from 17 patients
  ("Trip" prefixes), the paper 837 from 16 after dropping one. Ground truth: binary masks of manually selected dark-stained
  blobs (parasites, WBC, debris), hence partial coverage. Pixel size not stated (paper: mean RBC diameter 124 px). organisms:
  Homo sapiens and Plasmodium falciparum are in every image (parasites in human blood), not separate folders. enricher: annotation
  type bounding-box -> points (xlsx gives center_x/center_y per object, no boxes). enricher: download_url was the Mendeley
  S3 cache zip, now HTTP 403; set to the landing page (no single archive), files are direct per-file links. enricher: size
  1,769,549,146 B from the Mendeley file API (was null).'
