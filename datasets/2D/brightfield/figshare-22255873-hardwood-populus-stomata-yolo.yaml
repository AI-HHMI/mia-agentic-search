title: Labeled 17 Hardwood Species and 55 Genotypes of Populus Stomatal Images Datasets
short_name: Hardwood and Populus leaf stomata (YOLO boxes)
description: '10,715 microscope images of stomata from leaf epidermal peels (clear nail polish impressions) of 17
  hardwood species (oak, maple, ash, elm, hickory and others) and 55 genotypes of seven Populus taxa, each with
  a YOLO label file with bounding boxes for two classes: inner_guard_cell_walls (0) and whole_stomata (1, aperture
  plus guard cells). A CSV table lists species, magnification, image size and resolution (pixels per 0.1 mm) per
  image.'
