notes: 'Zip: 10,715 JPEG images and 10,715 YOLO .txt label files. Labels were produced by the StoManager1 model
  (trained on 1,000 manually labelled images) and then manually reviewed and adjusted in LabelImg (paper Methods).
  Also on Zenodo (10.5281/zenodo.8266240, not fetched). enricher: organisms: the 18 ScientificName values in Labeled
  Stomatal Images.csv, which gives the species of every image (FileName column). enricher: pixel size varies per
  image: the CSV Resolution column (pixels per 0.1 mm) is 118 (100x), 239 or 476 (200x), 465 or 930 (400x), so voxel_size_nm
  stays null. Modality brightfield is assumed (microscope not named in the text read).'
