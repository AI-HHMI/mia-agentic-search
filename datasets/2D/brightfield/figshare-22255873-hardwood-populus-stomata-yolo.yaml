notes: 'Zip listing (peek_archive): 10,715 JPEG images (9.33 GB) and 10,715 YOLO .txt label files. Labels
  were produced by the StoManager1 model (trained on 1,000 manually labelled images) and then manually
  reviewed and adjusted in LabelImg as necessary (paper Methods). Also on Zenodo (10.5281/zenodo.8266240,
  not fetched this run: 504 error). Organism list is the species named in the paper Methods text; the
  other hardwood species and 55 Populus genotypes are not listed individually. Magnification, image size
  and resolution vary per image and are in the accompanying CSV (Labeled Stomatal Images.csv), which was
  not read, so voxel size is null. Modality brightfield is assumed for microscope images of nail-polish
  peels (microscope not named in the text read).'
