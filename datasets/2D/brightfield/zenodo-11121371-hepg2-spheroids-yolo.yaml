notes: 'Zip listing (peek_archive) shows 1,395 PNGs and 1,395 txt label files in train/val/test folders,
  a YOLO yaml and a .db file. The yaml declares three classes (None, Healthy, Unhealthy). The Zenodo description
  says labelling was partly manual and partly automatic (spheroids treated with a toxic compound were
  automatically labelled Unhealthy), hence source mixed, and states a 70/15/15 split, which I did not
  recount exactly. No paper is linked ("more details will be available in the corresponding publication"),
  so none was read. Image dimensions and pixel size are not stated on the record. The yaml contains local
  Windows paths that must be edited before training. enricher: organism Homo sapiens from Cellosaurus
  CVCL_0027 (HepG2); images 2456x2054 RGB PNG (sample); YOLO rows read from a sample label.'
