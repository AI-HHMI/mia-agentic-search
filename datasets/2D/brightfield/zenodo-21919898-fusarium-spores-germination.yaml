notes: 'Zeiss Axio Imager M2, Photometrics Evolve EMCCD, 40x oil objective (Mycol preprint Methods). Pixel size and image
  dimensions are not stated in the record, listing or preprint text. How masks were made (manual vs Cellpose-assisted) is
  not specified for this dataset in the preprint. Preprint: 944 germinated / 1,439 ungerminated (record: 943 / 1,439). The
  record is v2 of a concept whose first version (zenodo 20489251, 2026-06-01) the preprint cites. Splits: 80:20 for the classifier
  only, not provided as files. enricher: size is the exact Zenodo total (was 163,138,231); download_url is the record page,
  since images, masks and patches are three zips.'
