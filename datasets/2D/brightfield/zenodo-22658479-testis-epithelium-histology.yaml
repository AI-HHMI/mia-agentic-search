notes: 'Zip holds code (Codes/) plus Dataset/Mink/{Train Data,Test data}/{Images,Masks} (109+8 pairs)
  and Dataset/Polar bear/{Images,Masks} (10 pairs). Apache-2.0 is the Zenodo and GitHub licence; not stated
  whether it covers the images. enricher: companion paper (arXiv 2301.09887, JMI 2023, same authors, 116
  mink + 10 polar bear 1200x1600 RGB images) describes the data: mink testis from a fur farm stained PAS,
  polar bear (Ursus maritimus) testis stained H&E, Nikon Eclipse 50i 20x objective; epithelium delineated
  manually with livewire (M. Meyari, validated by A. Fakhrzadeh) -> annotations.source manual. enricher:
  modality histology-WSI -> brightfield (single microscope fields, not whole slides). organisms: Ursus
  maritimus = Dataset/Polar bear/; mink species not stated (paper says only "mink farm"), so organism
  left empty. enricher: paper states "0.4 mm per pixel" (implausible for 20x; likely a typo for um), so
  voxel size left null.'
