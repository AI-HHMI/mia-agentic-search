title: 'MD-AS-2025 Annotated dataset: microfauna in activated sludge'
short_name: Sludge microfauna detection (brightfield)
description: 4,000 full-frame microscope images (1824 x 1216 px, JPG, 10x objective, halogen illumination) of activated
  sludge from lab SBRs and 12 wastewater treatment plants in China, with bounding-box annotations (PASCAL-VOC
  XML) for five microfauna orders (Arcellinida, Digononta, Monogononta, Nematoda, Hypotrichida). The paper also
  releases a separate cropped single-object classification set (14,257 images) in other Zenodo records.
