notes: 'Paper (Sci Data 2025, Europe PMC full text) read; zip listed with peek_archive: 4,000 jpg in train_val_test/images
  plus 4,000 xml in labels (8,000 files). Classes are order-level groups, not named species, so organism
  is empty. Zenodo record licence is CC BY 4.0 (the Sci Data article itself is CC BY-NC-ND). The folder
  is named train_val_test, but no split files were seen, so splits_provided is false. Pixel size is not
  given in the text read. The cropped classification subsets (Dataset B, 14,257 images) are separate Zenodo
  records and are not covered here. Channel count 3 is assumed from colour JPG, not stated.'
