notes: 'OSF API shows the public project (folders training and test) and the Scientific Data paper full
  text was read: 3,565 images of 2000x2000 px in JPEG with same-named single-channel PNG masks, 7,130
  files, 1.6 GB (size_bytes is the paper''s rounded figure), CC BY 4.0, splits 2,227 training / 1,338
  test images from 3 and 2 slides, about 30,000 and 7,000 cells. The OSF file listing inside the folders
  was not seen. Pixel size is not stated (20x scan; slide size about 100,000 x 200,000 px in MRXS). The
  OSF node license field is empty; the license comes from the paper. enricher: voxel size 250 nm from
  the paper Methods ("approximately 0.25 um/pixels", was null); size_bytes exact from the OSF file list
  (7,130 files).'
