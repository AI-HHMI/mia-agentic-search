title: AutoRadio radiolarian image database (taxon-labelled specimen images)
short_name: AutoRadio radiolarian taxa images (brightfield)
description: Open, participative database of focus-stacked transmitted-light images of individual radiolarian specimens (Miocene to Recent microfossils) from sediment samples, each labelled with a manually verified taxon, built to train convolutional neural networks. The 2020 published version has 21,746 images in 132 classes (Tetard et al. 2020); the July 2021 version lists 24,603 images in 149 classes (22,559 low-latitude, 2,044 high-latitude).
