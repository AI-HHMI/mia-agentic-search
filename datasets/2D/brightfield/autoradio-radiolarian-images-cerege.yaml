notes: 'Download is via http://microautomate.cerege.fr/dat (linked from the download page and the paper); that host did not resolve in this run, so file listing, archive/image format and sizes were not checked (formats=other is a placeholder). The download page says data follow each contributing institution''s policy (CC-0, CC-BY) and are property of CEREGE/CNRS/IODP-France/GNS; no single license is named and the Terms of use page was not read, so license is unknown. Paper: Leica DMR6000 B, 20x objective, 15 focal planes 10 um apart stacked in Helicon Focus, 660 x 660 um fields of view, no pixel size given. Labels assigned manually (ParticleTrieur, k-NN suggestions) and reviewed by a taxonomist; the CNN used a 4/5 train, 1/5 test hold-out but no split files are stated. n_items is the July 2021 version (the 2020 paper version has 21,746 images in 132 classes).'
