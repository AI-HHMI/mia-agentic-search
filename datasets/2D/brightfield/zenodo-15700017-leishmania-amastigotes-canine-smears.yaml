notes: 'Read through the Zenodo API and a peek_archive listing of the single zip (57.4 MB; dogs/ folder
  with 201 .jpg and 200 .txt - one image, F9A8D2_20241103_162152_234, has no label file; sampled .txt
  files hold YOLO rows with class 0). The accompanying paper (ECML PKDD 2025, on synthetic data augmentation)
  is behind Springer and was not readable; only its abstract was seen, so what a box encloses (amastigote
  or infected cell), the annotators, the annotation tool, the pixel size and any split are not stated
  on the Zenodo page. Annotation coverage and source are therefore unknown. The paper also introduces
  a combined real plus synthetic dataset; this record is only the real-image Zenodo deposit. Species of
  Leishmania is not given (genus only). organisms: Canis lupus familiaris (host cells) and Leishmania
  (amastigotes) appear in the same images, all in dogs/; not separable by folder.'
