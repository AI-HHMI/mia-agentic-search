title: Annotated data for detection of Leishmania spp. amastigotes in canine lymph node smear images
short_name: Leishmania amastigote detection in canine smears
description: 201 light-microscopy images of Giemsa-stained canine lymph node smears from dogs with leishmaniosis, imaged at
  1000x on an Olympus BX4 with a Zeiss Axiocam and on a BioBlue.Lab (Euromex) microscope with a CMEX 5 camera. 200 images
  come with YOLO-format bounding-box label files (single class 0). Released by the University of Thessaly and Aristotle
  University of Thessaloniki for deep-learning detection of Leishmania spp. amastigotes.
