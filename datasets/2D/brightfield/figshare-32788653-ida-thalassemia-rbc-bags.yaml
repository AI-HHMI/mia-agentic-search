title: 'IDA-THL Segmented Red Blood Cells: Patient-Level Image Bags for Iron Deficiency Anemia and Thalassemia'
short_name: Blood smear RBC crops, IDA vs thalassemia
description: 261,087 segmented red blood cell patches (PNG) cropped from peripheral blood smear images of 281 patients (291
  patient folders - 151 iron deficiency anemia, 140 thalassemia), organised as patient-level bags for multiple instance learning.
  The class folder (0 = IDA, 1 = THL) is the patient-level ground truth; each cell file name encodes patient, source smear
  image and cell index. Clinical laboratory variables are not included.
