notes: 'Six zip parts (part1 listed with peek_archive: 44,115 PNG files, class folder 0/ and patient/cells/source-image
  layout; the other parts cover IDA-051 onward and class 1/) plus MD5SUMS.txt and README_parts.txt; size_bytes is the
  sum of the six zip parts. Labels are patient-level diagnoses only (IDA vs thalassemia); how diagnoses were confirmed
  and how RBCs were segmented are not stated on the figshare page, in the Q-MIL GitHub README, or on the Scientific
  Reports abstract page (Methods not open access), so annotations.source is unknown. Microscope, objective, camera,
  stain, pixel size and crop size are likewise not stated in those sources. Nine patients appear under more than one
  folder (listed in the description), so patient-level splits must group them. Related studies used subsets (258 and
  278 patients) and are not part of this record.'
