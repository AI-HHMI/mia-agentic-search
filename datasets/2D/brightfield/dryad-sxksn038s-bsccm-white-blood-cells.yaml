schema_version: '1.2'
id: dryad-sxksn038s-bsccm-white-blood-cells
title: Berkeley Single-Cell Computational Microscopy (BSCCM) dataset
short_name: BSCCM white blood cells (LED array, fluorescence)
description: Over 400,000 single white blood cells (412,941 in the full version) imaged on an LED array microscope under multiple
  illumination patterns (128 x 128 px crops, 12-bit) and paired with fluorescence measurements of surface-protein markers
  (six fluorescence channels per cell) and, for most variants, histology-stained RGB images (398 x 398 px). Fluorescence images were
  processed into per-cell marker expression levels and cell-type labels, usable for classification and label-free-to-fluorescence prediction. Variants are BSCCM,
  BSCCM-NIST (28 x 28), BSCCM-coherent (4,304 cells) and 'tiny' subsets for testing.
