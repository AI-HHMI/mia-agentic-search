notes: 'Training signal is derived rather than hand annotation: per-cell surface-marker expression and cell-type labels computed
  from the fluorescence images (paper S1.3-S1.4); the pairing of label-free and fluorescence images also supports virtual
  staining. Pixel size is stored in the dataset global metadata JSON but is not stated on the Dryad page, README text read
  or the paper (sensor pixel size only); voxel size left null. Dryad API reports CC0-1.0 although the HTML page only says
  licensed for reuse. size_bytes is the Dryad total for the May 2025 version (all variants; the full BSCCM alone is 228 GB
  per the project page). n_items is the cell count of the full BSCCM. Cell-type label files were not listed (zarr/csv members
  not inspected), hence annotations_verified false. Direct file links are Dryad downloads that need the page; BSCCM-tiny (about
  0.5 GB) is the small sample.'
