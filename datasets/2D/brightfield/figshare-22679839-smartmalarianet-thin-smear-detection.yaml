notes: 'One zip (SmartMalariaNET.zip, 941 MB, 141,474 files by peek_archive: 141,315 .jpg, 150 .txt, 6 .npy, 3 .cache). data/step_1/VOC has 150 images (train 25 and test 15 seen at the top of the listing, rest in the same folders) with matching labels/*.txt; data/step_2 has train/valid/test _data.npy and _label.npy; data/step_3 has about 96,600 negative and 44,000 positive patch JPEGs plus 496 concatenated images. Paper: 1,822 thin-blood-smear images from 140 patients were used; patches are resized to 64 x 64 and labels come from a majority vote of three experts. The format of the step 1 .txt labels (YOLO normalised boxes) was inferred from the folder name and file layout, not opened. Pixel size is not stated (smartphone images at various microscopes and magnifications). The original 1,296 images are in a separate figshare record (22679860) that was not catalogued. n_items not stated consistently across the three steps.'
