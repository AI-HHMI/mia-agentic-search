title: SmartMalariaNET - smartphone images of Giemsa-stained thin blood smears with cell boxes, patch labels and
  parasite classes (AIDMAN steps 1-3)
short_name: SmartMalariaNET malaria thin-smear (brightfield)
description: Datasets for the AIDMAN malaria diagnosis system. Step 1 has smartphone-through-eyepiece images of
  Giemsa-stained thin blood smears with YOLO/VOC-format box labels (train/test) for detecting red blood cell patches.
  Step 2 has 64 x 64 cell patches with labels (train/valid/test .npy arrays). Step 3 has tens of thousands of positive
  and negative patch images used to train and test smear-level malaria diagnosis. Slides come from the Sierra Leone-China
  Friendship Hospital and the Rokupa Government Hospital.
