notes: 'Pixel size, scanner and magnification are not stated on the Zenodo page or in the paper (patches
  taken from WSIs at maximum magnification), so voxel size is null. Zenodo says "segmentation masks";
  the COCO file has 40 images and 1871 polygon annotations (checked), while the paper trains YOLOv11n-obb
  oriented boxes on 160 tiles of 1024 x 1024 cut from these 40 patches (376 training / 32 validation images
  after augmentation); no split is shipped in the record. Images.zip holds 40 JPEG files (30.jpg etc.).
  Annotated by a single evaluator (paper limitations). Size is the sum of the two Zenodo files. enricher:
  channels null -> 3 (RGB JPEG, sampled).'
