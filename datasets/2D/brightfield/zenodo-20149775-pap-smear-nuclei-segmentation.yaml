notes: 'Zip (peek_archive) holds 1022 JPEGs in IMGS/ named <n>.jpg, <n>GT.jpg, <n>MS.jpg, <n>R.jpg, consistent
  with the record text of 252 images. The images are crops of seven source images originally provided
  by Plissiti et al. (IEEE TITB 2011, whose abstract only was read; the 2016 JMIHI paper describing these
  crops was not found in Europe PMC). Pixel size, stain details and who made the ground truth are not
  stated on the record; the ground truth is JPEG (lossy), and the 252 crops come from only seven slide
  images, so they are highly correlated. Stain shown as Papanicolaou because this is a Pap smear, which
  is not stated per image. enricher: GT crops are overlays, not masks; binary masks only for the 7 full
  images (annotations.format updated).'
