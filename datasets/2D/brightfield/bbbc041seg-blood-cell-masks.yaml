notes: 'Full dataset (README says 2656 files = 1328 images + 1328 masks) is on a Google Drive linked from the repo, so no direct download_url; Drive contents not listed, hence annotations_verified false. Train/test split 1,169/159 and 93,539 objects (one class) are as reported by Dataset Ninja, not the repo README. Paper is not open access (abstract only read); pixel size, magnification and mask annotation procedure not stated on the repo, BBBC041 page or abstract. Licensing caveat: repo/masks are MIT, but the underlying images are BBBC041v1, licensed CC BY-NC-SA 3.0 by the Broad Institute. Also mirrored on Kaggle (jeetblahiri/bccd-dataset-with-mask) and Dataset Ninja.'
