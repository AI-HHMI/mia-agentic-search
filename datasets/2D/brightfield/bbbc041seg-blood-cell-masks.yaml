id: bbbc041seg-blood-cell-masks
title: 'BBBC041Seg: instance segmentation masks for blood cells in P. vivax malaria smears'
short_name: Malaria blood-cell instance masks (brightfield)
description: Instance-segmentation ground-truth masks added to the 1,328 Giemsa-stained brightfield blood-smear
  images of BBBC041v1 (Plasmodium vivax infected human blood), covering uninfected red blood cells and leukocytes
  and infected cells (gametocytes, rings, trophozoites, schizonts). Released with a comparative study of classical
  and deep-learning cell segmentation methods.
