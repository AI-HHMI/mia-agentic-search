notes: 'Full dataset is one Google Drive zip (2656 files = 1328 images + 1328 masks). Train/test split 1,169/159
  and 93,539 objects (one class) are as reported by Dataset Ninja, not the repo README. Paper is not open access
  (abstract only read); pixel size, magnification and mask annotation procedure not stated on the repo, BBBC041
  page or abstract. Licensing caveat: repo/masks are MIT, but the underlying images are BBBC041v1, licensed CC BY-NC-SA
  3.0 by the Broad Institute. enricher: types instance->semantic-segmentation (sampled masks are binary 0/255, no
  instance IDs); formats +jpeg (119 originals are .jpg); channels 3 (RGB); download_url = Drive direct zip; annotations
  verified. organisms: Homo sapiens and Plasmodium vivax appear together in every image (infected human blood),
  not in separate folders.'
