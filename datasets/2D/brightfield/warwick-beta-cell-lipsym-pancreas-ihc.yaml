description: 20 brightfield images (1024x768, 40x) of mouse pancreatic sections stained with hematoxylin and DAB-insulin,
  released with the LIPSyM beta-cell detection paper. Beta-cell centres were marked independently by three experts; the archive
  also holds a union ground-truth mask per image and the LIPSyM detector output for comparison.
