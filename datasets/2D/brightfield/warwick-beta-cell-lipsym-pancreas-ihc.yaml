notes: 'Landing page, zip listing (peek_archive) and paper full text (Europe PMC PMC3312708) checked. The archive holds 20 JPEG
  images, manual_annotation/ folders for experts luxian, yifang and sylvie plus m_unionGT, and result_LIPSyM/ detector outputs
  (not ground truth). The README is inconsistent about image count ("25", "45"); the zip and the paper both give 20. No dataset
  license is stated: the page only says the LIPSyM software is free for non-commercial use and must not be distributed without
  permission of the author, and does not say whether that covers the data. The paper states 40x and 1024x768 pixels but no pixel
  size, and the page, README and paper give no voxel size. Markings are cell centres drawn as images; the paper stresses they are
  subjective, which is why a fused ground truth is provided. The paper also uses a second 10-image H&E lymphocyte set, which is
  not in this archive.'
