  notes: 'Listed the one zip (central directory, exact sizes, 122 members, complete). Probed all 20 images (JPEG RGB uint8)
    and the union GT PNGs (gray uint8 768x1024), plus one m_luxian PNG. Sampled IMG_0073.jpg (371,240 B downloaded): 768x1024x3
