    at cell centres. result_LIPSyM/ is the paper''s detector output, not ground truth. README says 25 / 45 images; the zip
    holds 20 (List_Of_Better_Images.txt lists the same 20 IDs). voxel size not found; checked: JPEG/PNG headers (no calibration),
    landing page, README, List_Of_Better_Images.txt, paper full text (states 40x and 1024x768 only); no code repo or upstream
