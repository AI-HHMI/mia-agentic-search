notes: 'Zeiss Axioscope 7, Axiocam 305 colour camera, 10x objective (Mycol preprint Methods); channels 3 assumed from ''colour
  camera'' only. Masks: Cellpose cyto3 without fine-tuning, outputs reviewed and corrected where needed (preprint). Normal/abnormal
  labels follow D-shape stage criteria; the preprint''s Results (228 normal/452 abnormal) and Methods (452/228) disagree,
  while the Zenodo record says 452 normal / 228 abnormal. Pixel size and image dimensions not stated. The record is v2 of
  a concept whose first version (zenodo 20488331) the preprint cites. No splits provided as files. enricher: source proofread
  (masks: Cellpose cyto3, reviewed and corrected, preprint; was mixed); patch names give 452 normal / 228 abnormal / 205 unlabelled;
  download_url is the record page (three zips).'
