notes: 'Zenodo holds one 34.6 GB zip: 8,004 JPEGs in 1,334 patient folders Multi-OSCCPI-Images/<pid>/<NN>_<2X|4X|10X>.jpg,
  plus clinical_data_2024.csv, all_metadata.json, split_seed=2024.json, copy_log.md. The paper reports
  x200/x400/x1000, 2592x1944 px, an Olympus microscope and no pixel size. Labels are clinical, patient-level
  (REC, LNM, TI, CE, PI binary; TD three-class), not pixel annotations. License CC-BY-4.0 from Zenodo
  (the arXiv paper itself is CC BY-NC-ND 4.0). enricher: stain H&E from the arXiv paper (was empty); channels
  3 (RGB) from sample (was null); download_url set to the direct zip (was the landing page). copy_log.md
  says 3 missing images were filled by duplicating another image of the same patient and magnification.'
