notes: 'Zenodo holds one 34.6 GB zip. Its listing (peek_archive) showed 8,004 JPEG images under
  Multi-OSCCPI-Images/<patient>/ named 01_2X/01_4X/01_10X etc., plus clinical_data_2024.csv, all_metadata.json,
  split_seed=2024.json and copy_log.md; the paper implies about 7,950 images (1,325 x 6), so 54 extra images
  are unexplained. The CSV and split files could not be read (Zenodo range requests failed), so label columns
  and class counts come from the arXiv paper (REC, LNM, TI, CE, PI binary; TD three-class; 925/200/200 patient
  split). The paper reports x200/x400/x1000 total magnification, 2592 x 1944 px images and an Olympus microscope
  but no pixel size, and does not name the stain (H&E assumed by the histopathology description only). The
  labels are clinical, patient-level image-level classification, not pixel annotations. License CC-BY-4.0 from
  the Zenodo record (the arXiv page shows a separate paper license).'
