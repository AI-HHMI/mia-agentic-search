id: zenodo-18357239-multi-oscc-histopathology
title: Multi-OSCC - high-magnification oral squamous cell carcinoma histopathology images with six clinical labels
short_name: Oral SCC histopathology, 6 clinical labels
description: Histopathology images of oral squamous cell carcinoma from 1,325 patients, six images per patient
  (two each at x200, x400 and x1000, from core and edge tumour regions) taken with an optical microscope at
  2592 x 1944 px. Each patient carries labels for six clinical tasks (recurrence, lymph node metastasis, tumour
  differentiation, tumour invasion, cancer embolus, perineural invasion). A fixed patient-level split
  (925 train / 200 validation / 200 test) is provided.
