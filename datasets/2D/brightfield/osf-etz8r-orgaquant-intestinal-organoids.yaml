notes: >-
  Only organoids judged in focus were boxed; annotations are boxes, not masks (coverage partial). Licence (MIT) is stated in the paper; the OSF API lists only copyright holder Timothy Kassis, no licence file. Archive 'Intestinal Organoid Dataset.zip' (82 MB, listed with peek_archive) holds 1754 JPEGs plus 2 CSVs in train/test folders; paper says 1,750 patches, 14,242 boxes (13,004 train, 1,135 test). Original 1500x1125 8-bit TIFFs are not released. Pixel size not stated on OSF or in the paper (4x objective, Thermo EVOS FL). Companion zip organoid_inference_graph.zip is a trained model, not part of the dataset. Checked OSF page/API, file listing, paper.
