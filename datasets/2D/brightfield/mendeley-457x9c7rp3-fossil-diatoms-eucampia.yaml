notes: 'Only one class (Eucampia antarctica) is annotated, so other diatoms in the tiles are unlabelled; only annotated tiles from the intermediate focal layer are stored per site. The Mendeley file listing was not rendered by the fetch tool, so image/annotation counts and total size are not verified (the paper does not state them; model training sampled 225 images per site). Only a subset of NDPI virtual slides is included, the rest on request. No train/test split is provided with the data (an 80/20 split was used by the authors for the included models). Checked: dataset page, paper full text (Data in Brief, Europe PMC). License CC BY 4.0 is from the Mendeley page.'
