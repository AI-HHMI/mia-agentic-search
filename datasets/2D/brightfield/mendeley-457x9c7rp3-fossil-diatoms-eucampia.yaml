title: Slide scanner microscopy images of fossil diatoms from Southern Ocean surface sediments with Eucampia antarctica bounding boxes
short_name: Fossil diatom bounding boxes (brightfield)
description: Transmitted-light slide-scanner images of permanent slides of fossil diatoms from 18 Southern Ocean surface-sediment sites (Hamamatsu NanoZoomer SQ, 20x objective, 0.23 um/pixel), provided as 2400x2400 px JPEG tiles (552x552 um) with YOLO-format bounding boxes for Eucampia antarctica, plus a subset of NDPI virtual slides and trained YOLOv5x models.
