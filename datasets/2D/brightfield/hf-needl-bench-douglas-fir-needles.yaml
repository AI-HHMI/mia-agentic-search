notes: 'Voxel size from the paper: tiles scaled to 360 px/mm (=2777.8 nm/px). Magnification
  and microscope model of the benchtop setup are not stated in the paper or dataset
  card (the HF README is empty). Image count 3,250 tiles (paper Table II: 2443/403/404;
  HF file listing 2443/403/404 PNG tiles in both keypoint/ and yolo/ copies). The
  HF viewer reports 512x512 px images, whereas the paper describes 256x256 tiles;
  not reconciled. Boxes were derived semi-automatically from manual keypoints with
  SAM2 and manually reviewed (per GitHub README); keypoints are manual, by a single
  trained annotator. The paper has no separate DOI beyond arXiv; the repository''s
  CC BY 4.0 is described as for non-commercial academic use in the GitHub README.
  size_bytes is the HF viewer total (1.97 GB), which may include both annotation-format
  copies. No paper full-text tool hit (Europe PMC); arXiv PDF text was read instead.'
