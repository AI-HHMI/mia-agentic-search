description: Microscope images of Douglas-fir needles with Swiss needle cast, tiled to 256x256 at 360
  px/mm. 3,250 tiles from 1,082 needles (907 benchtop, 175 handheld DinoLite), annotated with keypoints
  and bounding boxes for stomata and pseudothecia, with train/validation/test splits (random and maximum-diversity)
  and detector baselines.
