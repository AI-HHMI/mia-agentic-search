notes: 'No license on the Hugging Face card, in the card metadata or in the GitHub repo (no LICENSE file); the arXiv CC BY
  4.0 covers the paper only. HF lists 20,558 train / 2,527 validation / 1,200 test rows (24,285). Images are 512x512 patches
  of 3056x3056 CELLAVISTA 3.1 RS HE 10x 8-bit grayscale brightfield images; patches with visible well edges removed. The unfiltered
  sibling mario-dg/brightfield-microscopy-scc (34,043 rows) and synthetic-mix sets scc_10/30/50 are not covered. Pixel size
  not stated. Images ship inside parquet (not a listed format), hence formats other. enricher: annotations.source proofread
  from paper Sec. 3.2 (real images: boxes from binarized eGFP channel, then reviewed and refined by an expert in Roboflow)
  (was unknown). enricher: size from complete HF file listing (was the card download_size); annotations_verified after reading
  rows.'
