notes: 'No license is stated on the Hugging Face card or in the paper; the GitHub repo licence could not be read from this
  run. Hugging Face lists 20,558 train / 2,527 validation / 1,200 test rows (24,285 total, 5.8 GB of parquet). Images are 512x512
  patches of 3056x3056 CELLAVISTA 3.1 RS HE (Synentec) 10x brightfield images; a manual filter removed patches with visible
  well edges. The paper (arXiv 2512.00078) describes about 24,000 patches for diffusion training and says 2,500 of 10,000
  generated images were box-labelled for detection experiments; it does not describe how the boxes in this Hugging Face set
  were drawn, so annotations.source is unknown. Sampled rows show 1-2 boxes per patch (mostly one cell per patch). The unfiltered
  sibling mario-dg/brightfield-microscopy-scc (34,043 rows) and synthetic-mix sets scc_10/30/50 are not covered by this record.
  Pixel size not stated. The images ship as parquet (not a listed format), hence formats is other.'
