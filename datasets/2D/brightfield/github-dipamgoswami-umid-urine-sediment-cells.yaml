title: 'UMID: Urine Microscopic Image Dataset'
short_name: Urine sediment cells (brightfield)
description: Brightfield images (1280x720) of urine sediment at 400x magnification with about 3,700 annotated
  cells in three classes (RBC, pus cells, epithelial cells). Cells are annotated with bounding boxes,
  and cells inside clusters in the training set with points. Train, validation and test CSVs are provided.
