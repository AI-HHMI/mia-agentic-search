notes: 'GitHub repo (images/, train/val/test CSVs, classmaps.csv); obtain with git clone. No LICENSE file
  or license in README; the CC BY 4.0 on arXiv covers the paper only, so license unknown. README says
  367 images, paper says 366; 3,733 cells (44% RBC, 33% pus, 23% epithelial); ~20% are point annotations
  (train clusters only). Poorly focused cells go in a missed-label class. Two microscopes, 400x, 5 MP
  camera; pixel size not stated in README or paper. Annotated with VoTT by three authors incl. a doctor.
  Sources: GitHub README and listing, arXiv abstract and PDF. enricher: git tree has 588 jpg in images/,
  366 of them in the CSVs (annotations_verified).'
