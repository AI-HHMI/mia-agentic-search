notes: 'Single 1.94 GB tar. Tar headers read by range request: adaptative_segmentation_cutouts/{chromosome,non-chromosome}/Met<N>/<k>.tif
  and colorful_cutouts/{chromosome,non_chromosome}/Met<N>/<k>.tif (thousands of small crops). The 74 full metaphase images and their label
  files described on the record were not located in the headers sampled, so their format and the exact labelling (LabelMe coordinates per
  the description) are unverified. No paper is listed on the record and none was found (Europe PMC / Crossref). Pixel size, magnification
  and species are not stated. Not a segmentation-mask dataset as far as verified: the supervised signal seen is chromosome vs non-chromosome
  patches.'
