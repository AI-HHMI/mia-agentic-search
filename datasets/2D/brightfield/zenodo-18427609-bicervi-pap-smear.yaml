notes: 'Zenodo lists eight per-class zips (A 4.4 MB, AGC 89.4 MB, ASC-H 199.6 MB, ASC-US 509.6 MB, HSIL 461.7 MB, LSIL
  338.6 MB, NILM 1.6 GB, SC 11.5 MB) and README.pdf; total 3.2 GB; counts per class on the page sum to 3,000 (NILM 1447,
