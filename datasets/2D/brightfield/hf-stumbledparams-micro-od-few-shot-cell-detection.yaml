notes: 'Evaluation benchmark of 63 images per source (53 test, 10 example), chosen for most boxes. BBBC malaria (P. vivax), BCCD and LIVECell rat C6 (re-annotated by cell shape) repackage public images and likely have their own records; the NIH 3T3 set (63 phase-contrast images from an AFM platform camera, BACM lab, Iowa State) is new in-lab data. No license on the HF card or in the paper (the article itself is CC-BY-4.0); upstream terms may differ, so license is unknown. Image sizes, pixel size and download size are not stated in the card, API record or paper. The paper says 11 cell types; the tables list 10 labels.'
