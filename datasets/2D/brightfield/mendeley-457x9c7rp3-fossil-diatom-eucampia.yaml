notes: 'Mendeley file listing did not render in the fetched page, so file names, sizes and image counts are not verified (n_items and size_bytes null). Pixel size 0.23 um/px from the Data in Brief paper. Only annotated tiles from the representative focal layer are stored; only a subset of NDPI virtual slides is included (rest on request). Annotations cover a single taxon (Eucampia antarctica), drawn by one author; one bounding box per valve or countable fragment. Paper also lists trained YOLOv5x models (.pt) and CSV info tables. Sources checked: dataset page, paper full text (Europe PMC).'
