notes: 'enricher: Mendeley public API lists 8,346 files, 6.35 GB: 4,103 JPEG tiles in 19 core folders, 4,004 YOLO txt files
  (St12B: 532 tiles, 433 txt), 4 NDPI slides (1.04 GB), 12 YOLOv5x models; n_items = tiles. Organism Eucampia antarctica (the
  annotated taxon; was empty). Pixel size 0.23 um/px from the Data in Brief paper. Only annotated tiles from the representative
  focal layer are stored; only a subset of NDPI virtual slides is included (rest on request). Annotations cover a single taxon
  (Eucampia antarctica), drawn by one author; one bounding box per valve or countable fragment. Paper also lists trained YOLOv5x
  models (.pt) and CSV info tables. Sources checked: dataset page, paper full text (Europe PMC).'
