notes: 'Facts from the TUdatalib item page (MIT License; two files: the full-dataset zip, 92.04 MB, and
  a visualizations zip, 87.39 MB), DataCite, the GitHub README and the paper (493 images; 296 train /
  49 val / 148 test; 128x128 crops; brightfield; two trap geometries). Files are PyTorch tensors (.pt),
  hence formats other. Pixel size not stated in the paper or README (only a 10 um scale bar in a figure),
  so voxel_size_nm is null. A larger high-resolution follow-up is the TYC dataset (separate record). enricher:
  TUdatalib now reachable with the tools'' User-Agent; download_url = direct DSpace bitstream (was the
  /bitstream/handle URL, which intermittently serves a bot challenge); size_bytes from the listing of
  both zips (was null); stored tensors are 256x256, not 128x128 as the paper says; url_ok and annotations_verified
  true from the listing and sample; confidence 0.5 -> 0.75.'
