notes: 'Synthetic data: slides are generated composites of real pollen photographs, not direct microscope acquisitions, so
  usefulness for real microscopy is limited. The slides archive is a split zip (slides.zip + slides.z01-z16, about 12 GB),
  not listed with peek_archive; masks.zip (80,000 JPG masks) and validation_data.zip (8 CSV files) were listed. The README
  states 1280x1280 RGB images and 80,000 per-image labels; no pixel size, objective or microscope is stated (the images are
  simulated), so voxel_size_nm is null. enricher: download_url set to the record page (was masks.zip, which is only the masks;
  the data is 20 files). organisms: Chenopodium bonus-henricus = slides/Chenopodium/, Corylus colurna = slides/Corylus/, Urtica
  dioica = slides/Urtica/, Secale cereale = slides/Secale/; the four *_split folders mix all four.'
