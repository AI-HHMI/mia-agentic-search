notes: 'Figshare (SciLifeLab) item: 18 plate tar.gz archives (4.6-86 GB each), data_tables, CellProfiler pipelines, features,
  grit scores, README. Labels are compound-level MoA classes (not pixel masks); sizes are exact sums of the API file list.
  BF sites 1-5 map to FL sites 2,4,5,6,8. Second paper using the data: Tian et al., Artif Intell Life Sci 2023. enricher:
  annotations verified (bf_data.csv / fl_data.csv read: 7,710 sites each, 10 MoAs + dmso). Pixel size not stated with a unit
  anywhere read (TIFF tag says only ''Deconvolution X Image Spacing: 0.334'', no unit); BF z-planes 2 um apart (paper S1 Text).
  Each image in the tables appears once per row; plates may hold more images than the tables list.'
