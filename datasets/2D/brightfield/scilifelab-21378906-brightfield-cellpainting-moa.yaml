  notes: 'Listing: figshare API (25 files, exact sizes); every offered file is listed; tar.gz members can''t be listed without
    reading a whole archive, so the per-TIFF tree comes from the members streamed and the CSV tables. Streamed the first 40
    MB of P015080.tar.gz (82 MB read in all): members are flat P015080/*.tif; decoded 2 BF TIFFs (2160x2160 uint16, LZW, ranges
    [7124, 27916] and [2315, 25598]) and 1 FL TIFF (2160x2160 uint16, uncompressed, [0, 22026]). Value ranges from these files
    only. ''none'' normalization: paper S1 Text says images were saved as 16-bit TIFFs without binning, and the values sit
    in the camera''s native range (Andor, 16-bit gain mode). Read data_tables.tar.gz in full. Voxel size not found; checked:
    TIFF tags (XResolution 72 dpi default; MetaMorph text ''Image Spacing: 0.334'' without unit), figshare README, paper full
    text and S1 Text (20X objective, 2160x2160, no pixel size), BF-MoA GitHub README (not found, 404). No single archive:
    whole download is the 25 per-file links; 634 GB, so samples only.'
