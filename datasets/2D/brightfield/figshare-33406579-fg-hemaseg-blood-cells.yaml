notes: 'Figshare page and API record read in full (CC BY 4.0, 3 RAR files: Platelet 0.59 GB, RBC 2.96 GB, WBC 7.63
  GB). No paper is cited on the record and none was found in the record; so no paper was read. Platelet
  RAR header range read showed PNG masks under Platelet/Cell Mask/<class>/; RBC and WBC archives were not
  opened (RAR cannot be listed remotely with the tools here), so their folder layout and the WBC nucleus-cytoplasm
  masks rest on the description. The five source repositories are not named on the page, so the images
  may overlap with other catalog records (the data are derived single-cell crops). Masks are model-generated
  (YOLOv8n-seg + SAM) with manual quality review, hence source automatic. Pixel size, stain and microscope
  not stated.'
