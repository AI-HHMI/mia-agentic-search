title: FG-HemaSeg
short_name: Blood cell masks, 23 classes (brightfield)
description: Multi-lineage peripheral blood smear dataset of 300,551 single-cell images in 23 classes (10 WBC, 10
  RBC morphology, 3 platelet classes) integrated from five public repositories, with cell masks for every
  cell and nucleus-cytoplasm masks for white blood cells. Masks were generated with a YOLOv8n-seg pipeline,
  refined with intensity-based segmentation and SAM, then quality-controlled. Three RAR archives (Platelet,
  RBC, WBC) of PNG images and masks.
