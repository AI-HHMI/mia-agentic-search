notes: 'Figshare page and API record read (CC BY 4.0, 3 RAR files: Platelet 0.59 GB, RBC 2.96 GB, WBC 7.63 GB).
  No paper cited or found. The five source repositories are not named, so images may overlap with other catalog
  records. Masks are model-generated (YOLOv8n-seg + SAM) with manual quality review, hence source automatic. Pixel
  size, stain and microscope not stated. enricher: coverage partial (was dense): RAR listing shows masks for a subset
  of images (Platelet Cluster: 513 masks for 800 images; RBC/WBC mask counts not fully listed). enricher: RAR member
  listing read from archive headers; pixel data not readable (compressed RAR).'
