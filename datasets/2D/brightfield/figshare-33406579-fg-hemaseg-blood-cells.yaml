  notes: 'Figshare API lists 3 RAR5 archives (11,179,473,585 B total, file-listing via tools/listing.py). RAR members
    cannot be listed by listing.py or fetched as archive members by TensorSwitch (zip only), and they are compressed
    (RAR method 3), so no image header or pixel sample could be read: shape, dtype, axes and value range stay unknown.
    Member listing came from a custom range-request parser of RAR5 headers (requests only): the Platelet archive
    was listed completely (quick-open record + first 7.15 MB of headers); for RBC and WBC only the quick-open record
    was read, which omits the headers at the start of each archive (the mask folders), so their mask counts are
    partial. Masks are not present for every image: Platelet Cluster has 513 masks for 800 images (complete listing);
    for WBC the listed part holds fewer masks than images per class, but the unlisted head may hold the rest. No
    direct per-file links: only the 3 whole-archive links (ndownloader.figshare.com/files/68242186, 68242582, 68248537;
    usable). The dataset is not one file, so download_url keeps the landing page. Voxel size not found; checked:
    figshare page and API record, archive file names, paper search (Europe PMC / Crossref / web: none found). Images
    come from 5 unnamed sources, so a single pixel size is unlikely.'
