  notes: 'Complete Zenodo listing: one zip, 1,280,577,794 bytes, 3168 deflated members. Probed and read 2 pairs via range (train xy001z01, validation xy013z06): single-page uint8 TIFFs, PackBits, 1024x1024; raws [0, 255] (p1 42, p99 141, mean 100); labels contain exactly {1, 2, 3}, matching the documented classes (background is 1, not 0). Values from 2 files each. TIFF resolution tags are 72 dpi defaults, ignored; pixel size 1.3 um from the Zenodo description. Each split has 72 positions x 11 z indices (train xy001-xy132, validation xy013-xy144, no shared positions); each z slice has its own label map, so they are kept as 2D images.'
