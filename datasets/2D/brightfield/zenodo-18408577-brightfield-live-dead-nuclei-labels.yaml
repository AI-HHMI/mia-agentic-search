notes: 'Single zip listed with peek_archive: 3168 TIFFs in train/im, train/label, validation/im, validation/label
  (792 each). File names look like xy001z01.tif (position and z index, 11 z-slices per position in the
  first positions seen), so images may be focal-plane slices of z-stacks; treated here as 2D images. The
  record says "Validation/Test set: 792 images". Pixel size 1.3 um/pixel is from the record text. No paper
  or method description is linked from the record, and a web search found no paper, so how the live/dead
  nuclear labels were produced (probably from fluorescence) is unknown. Classes from the record: 1 background,
  2 live nuclei, 3 dead nuclei. enricher: label maps confirmed as semantic IDs {1, 2, 3} (sampled).'
