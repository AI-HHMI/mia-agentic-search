notes: 'Zip index read with peek_archive (80 files, 404.9 MB): 27 Training_sources with 27 Training_targets
  masks, 4 QC source/target pairs, and the StarDist model, logs and QC report. Pixel size 650 nm, image size
  and 16-bit/8-bit types are from the Zenodo description. The preprint Methods say training images were
  manually annotated in Fiji and exported as labelled images; the preprint full text was read. Part of a
  series of cell-detection training sets by the same authors; this one covers monocytes only. The test split
  is the QC pairs inside the same archive. enricher: n_items 31 (was 27): 27 training + 4 QC image/mask pairs in the zip
  listing. enricher: TIFF header calibration 0.6496 um/px agrees with the stated 650 nm.'
