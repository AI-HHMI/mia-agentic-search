title: Opisthorchis viverrini egg images in human stool for CNN classification and detection (Thanchomnang
  et al.)
short_name: Opisthorchis viverrini eggs in stool (brightfield)
description: Brightfield microscopy images of Opisthorchis viverrini (liver fluke) eggs and look-alike
  artifacts (pollen, plant cells, food particles) from formalin-ethyl acetate-concentrated human stool.
  Contains a classification training set of 7,400 PNG patches (class 0 artifact, class 1 egg; original
  plus augmented images), a 40-patch test set, and 148 full-field test images (2,448 x 1,920 px TIFF)
  with expert bounding boxes (coordinates in the file names of the annotated copies), model boxes, heatmaps
  and IoU overlays used in the paper.
