notes: 'Zip listings: 01_im_recog_training_dataset 7,400 PNGs (original plus augmented, 497 MB), 02_im_recog20crop
  40 PNGs, 03_obj_det_testing_dataset 148 TIFFs (14.1 MB each), 04_bounding_box_expert 148 TIFFs with
  the expert box drawn and its pixel coordinates in the file name; zips 05 (model boxes), 06 (heatmaps)
  and 07 (IoU overlays) were not opened. The paper reports 100 original images per class before augmentation
  (3,600 per class after), so the training PNGs are largely augmented copies. Images were taken with an
  Olympus DP27 camera on an Olympus BX43 at 400x, 2,448 x 1,920 px; pixel size not stated. Expert boxes
  exist only as drawn overlays plus file-name coordinates, not a separate annotation file. n_items counts
  7,400 + 40 + 148 detection fields; the three derived zips (05-07) are not counted.'
