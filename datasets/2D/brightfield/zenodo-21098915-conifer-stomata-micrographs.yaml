notes: 'Labels are image-level measurements only (stomata density per 100x field of view, sizes of one stomatal complex per
  position on 1000x images), not masks or boxes: usable for counting or regression. Paper full text not accessible; abstract
  read via Europe PMC. enricher: pixel size per magnification from the .tif.xml sidecars (ImageCalibration OnePixel): 0.762
  um (10x objective, the ''100x'' density images; 1600x1200 px = 1.115 mm2, the FOV area in METADATA.md) and 0.0762 um (100x
  objective, ''1000x'' size images); voxel_size_nm left null because the two sets differ. enricher: organisms per image from
  the CSV (species, image_no_100x / image_no_1000x) and the sidecar ImageDescription tree id (e.g. Pin_pon_35_5 = Pinus ponderosa);
  image numbers of species interleave. enricher: channels 3 (RGB camera TIFFs), size from the Zenodo file listing (was the
  zip only).'
