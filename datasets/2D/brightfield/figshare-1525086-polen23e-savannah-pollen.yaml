notes: 'Figshare lists 790 JPEG files (34.4 MB) with the type in the file name; the paper reports 805 images (35
  per type x 23), the listing has 20 for Anadenanthera, so 15 are missing (enricher: files API with page_size 1000
  confirms 790). Each type also has its own figshare record (e.g. 10.6084/m9.figshare.1524247). Pixel size not stated
  on the page or in the paper (microscope: digital Bresser LCD, 40x); grains were segmented/cropped in CorelDRAW.
  Identification by a botanist (paper). The dataset is single-grain images per type; no train/test split provided
  (3-fold random cross-validation used in paper). Sources checked: figshare record and API, paper full text (Europe
  PMC). organisms: one per image, given by the file-name prefix (no folders).'
