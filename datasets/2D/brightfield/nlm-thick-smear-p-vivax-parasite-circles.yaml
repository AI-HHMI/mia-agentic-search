notes: 'Listed the zip (6,179 members: 3,014 JPG in All_PvTk, 3,014 TXT in All_annotations, 150 Thumbs.db, ReadMe.docx), read
  the ReadMe.docx inside it and one annotation file, the NLM datasheet and the Diagnostics paper (Methods, data links). The
  ReadMe says the data is distributed under "a Creative Commons Attribution license" without a version, and asks to attribute
  NLM and cite the paper, so spdx is custom rather than CC-BY-4.0. The ReadMe text and the NLM datasheet disagree on species
  (ReadMe says P. falciparum, folder and datasheet say P. vivax); the paper calls this the P. vivax set. The datasheet lists
  annotations as parasites and white blood cells but the one file read only shows Parasitized rows. Pixel size not given; the
  paper states 100x eyepiece magnification and 3024 x 4032 px. Related sets
  in the same directory are separate records. enricher: organisms: each image shows human blood with P. vivax; not
  split by folder.'
