title: NLM P. vivax thick blood smear images with parasite circle annotations
short_name: P. vivax thick-smear images with parasite circles
description: 3,014 smartphone images (3024 x 4032 RGB JPEG) of Giemsa-stained thick blood smears from 150 malaria patients, each
  with a text file listing every annotated parasite as a circle (centre and radius point) in image coordinates, annotated
  by an expert slide reader. Part of the NLM thick-smear collection used to train the PlasmodiumVF-Net detector.
