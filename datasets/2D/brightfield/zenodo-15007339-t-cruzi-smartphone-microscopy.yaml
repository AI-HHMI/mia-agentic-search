notes: 'Found by following the 2026 PLOS NTD paper (Europe PMC full text read) to its Zenodo record. The Zenodo record is
  licensed CC-BY-NC-4.0 (the paper itself is CC BY). Counts of 726 images and 931 parasites are from the Zenodo description
  and paper Methods; bboxes.csv contains 931 boxes over 524 distinct images, so about 200 images are negatives. No train/validation
  split is provided in the files (the paper describes its own 80/20 and 5-fold splits at preparation level). Pixel size is
  not stated. The paper also uses a separate public mouse thin-smear dataset (675 images, reference 31), which is not part
  of this record. Trained models are on Hugging Face (SpotLab/Chagas_ssd). This is distinct from the Tryp V2/V3 trypanosome
  dataset already in the catalog (T. brucei in mouse blood, DIC/phase). enricher: channels 3 (RGB JPEG, probed; was null).
  organisms: all images are human smears with T. cruzi; not separate file sets.'
