short_name: T. cruzi parasites in blood smears (brightfield)
description: 726 smartphone-on-microscope images (4128x3096 JPEG) of Giemsa-stained thin and thick blood smears and cerebrospinal-fluid
  smears from nine T. cruzi-positive people (Cochabamba, Bolivia), with 931 manually drawn bounding boxes around Trypanosoma
  parasites in 524 images. Images, a bounding-box CSV and a sample-type table are provided.
