notes: 'peek_archive: manuallyVerified_ExtractedImages.zip has 2093 JPEGs (532 MB) in per-taxon folders (FishLarvae seen in the
  listed head; the full list of folders and per-class counts was not read); originalImages.zip has 1702 JPEGs, 3 TIFFs and
  2 MP4 videos (1.7 GB). Size is the sum of the three zips on the Zenodo page (2.2 GB). Five taxa come from the GitHub README, not
  from the full file listing. No paper is listed on the Zenodo record; microscope type, magnification, pixel size, organism
  names (taxa are higher-level groups) and labelling procedure are not stated on the Zenodo page or README. Modality brightfield
  is an assumption from "microscope and camera" in the README. There are no segmentation masks; the images are crops and
  labels are folder-based classes.'
