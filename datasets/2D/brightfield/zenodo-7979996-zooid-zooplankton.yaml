description: 'Zooplankton images for automatic taxon identification with low-cost microscope and camera equipment. The deposit holds
  original photographs, ~2,090 automatically extracted and manually verified single-organism crops grouped in per-taxon folders (the
  code repository names five taxa: Amphipods, Copepods, Fish Larvae, Ostracods, Quetognaths), and CNN model weights.'
