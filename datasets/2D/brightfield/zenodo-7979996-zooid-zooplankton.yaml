notes: 'peek_archive: manuallyVerified_ExtractedImages.zip has 2093 JPEG crops in 5 taxon folders (Amphipods 270, Copepods 458, FishLarvae
  621, Ostracods 391, Quetognaths 358 entries, folder entries included); originalImages.zip has 1702 JPEGs, 3 TIFFs, 2 MP4s in the same
  5 folders. Probed crops are 8-bit greyscale JPEG, originals RGB 3840x2160 JPEG, so channels is null (was 3). Size is the exact sum
  of the 3 Zenodo files (API). No paper; microscope, magnification, pixel size, organism names (taxa are higher-level groups) and labelling
  procedure not stated on Zenodo or README. Modality brightfield is an assumption from "microscope and camera". No masks: labels are
  folder-based classes. enricher: download_url set to the crops zip.'
