notes: 'One 10.1 GB zip of 219,062 TIFF ROIs named <set>_<class>_roi<k>.<id>.tif, sets training, fs446, fs466, fs534,
  plus separate_files.py. The article is not open access (no abstract via Europe PMC/Crossref), so instrument details,
  pixel size and who assigned labels (annotation source) were not confirmed; VPR comes only from the Zenodo keywords.
  Imaging modality set to brightfield as the closest enum for in-situ plankton video imaging (assumption). organism
  left empty: mixed plankton taxa, classes are not single species. enricher: every zip member is a TIFF ROI; 26
  classes tallied from names (technical.notes); size = exact Zenodo listing (zip + script); channels 1 (grey stored
  as RGB in the sampled ROI).'
