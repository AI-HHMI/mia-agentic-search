short_name: North Sea plankton image classes (VPR)
description: 'About 219,000 plankton images (TIFF ROIs) from the North Sea whose file names carry a taxon/class
  label (e.g. noctiluca, amphipods, eggs, polychaeta, appendicularia house, veliger larvae, zoea larvae): a training
  set plus three evaluation sets (fs446, fs466, fs534) from different sampling sets, used to test capsule-network
  and CNN classifiers under data set shift.'
