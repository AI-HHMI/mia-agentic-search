notes: 'Single 10.1 GB zip listed with peek_archive: 219,062 members, TIFF ROI images named <set>_<class>_roi<k>.<id>.tif with sets training, fs446, fs466, fs534 (plus separate_files.py outside the zip). 219,062 is the zip member count, not verified to be all images; per-class counts and the full class list were not tallied (the first ~3,000 listed names show classes such as noctiluca, amphipods, unknown, eggs, phaeocystis, bipinnaria, pilidium, polychaeta, zoea_larvae, veliger_larvae, appendicularia_house). The article full text is not open access (abstract empty via Europe PMC/Crossref), so instrument details, pixel size, class list and who assigned labels (annotation source) were not confirmed; VPR comes only from the Zenodo keywords. Imaging modality set to brightfield as the closest enum for in-situ plankton video imaging (assumption). organism left empty: mixed plankton taxa.'
