notes: 'Single zip PBC_dataset_normal_DIB.zip (281 MB) on Mendeley; the server did not report a size for
  range requests so contents were not listed, hence annotations_verified false. Per-class counts from
  the paper: neutrophils 3329, eosinophils 3117, basophils 1218, lymphocytes 1214, monocytes 1420, immature
  granulocytes 2895, erythroblasts 1551, platelets 2348. Pixel size not stated. The paper says data are
  for research and educational use only; the licence is CC BY 4.0 on Mendeley. Related to catalog record
  figshare-27073186-txl-pbc-blood-cell-detection (bounding-box re-annotation built on PBC images): this
  record is the original class-labelled release. enricher: zip contents now listed by range (17,093 JPEGs
  in 8 class folders), so annotations_verified is now true.'
