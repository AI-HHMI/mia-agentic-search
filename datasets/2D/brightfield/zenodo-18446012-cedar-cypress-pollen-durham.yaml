notes: 'Zip index read: 1,480 JPGs in five class folders (cedar 592, cedar_brst 253, cypre 292, cypre_brst 92, dust 251).
  Paper: crops of 512x512 px around Hough-detected grains from 5 source slides; labels assigned by expert otolaryngologists.
  Pixel size not stated in the paper text or Zenodo page. CC-BY-4.0 is the Zenodo licence; the README still contains
  a template placeholder for the licence. Multiple crops come from the same slide, so a random split can leak between
  train and test (the paper notes this limitation). Size is the zip only; the CSV adds ~1 MB.'
