title: 'BBBC010: C. elegans live/dead assay'
short_name: C. elegans live/dead worms (brightfield)
description: 100 brightfield and GFP images (696x520 px, 16-bit TIFF) of C. elegans exposed to Enterococcus faecalis,
  with untreated and ampicillin-treated controls, for distinguishing live (curved, smooth) from dead (rod-like)
  worms. Ground truth includes foreground/background masks and per-worm segmentation masks for overlapping worms.
