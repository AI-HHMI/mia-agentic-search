notes: 'Pixel size not stated on the BBBC page (paper full text not open access; Europe PMC abstract only), so voxel_size_nm
  is null. Image archive holds 200 TIFFs (100 fields x 2 channels, per peek_archive). Foreground zip holds 100 binary
  PNGs; per-worm zip holds ~1407 PNGs. Annotation source and publication date not stated on the page. Counts of
  the .svn-base files in the zips are repository artefacts. Imaged on a Discovery-1 automated microscope (Molecular
  Devices) at MGH. enricher: size_bytes 72,222,003 exact (3 zips; was 72,000,000).'
