notes: 'One zip per stain (HE, ECAD, Ki67, ..., miR-143, miR-145, U6, Scr; 471 GB in total) plus SPSS tables and a readme.
  Only HE.zip was listed (zip central directory read by range requests): 552 .jpg and 552 .png with matching names; the .png
  are presumed to be the epithelium masks per the readme, not opened, so annotations_verified is false. n_items counts H&E
  cores only; other stain zips not listed. Readme: masks from a DeepLabV3 model (NoCodeSeg) trained on pathologist annotations
  with active learning, hence source mixed. Pixel size not stated (''40x''). No paper cited yet. Zenodo 14800740 mirrors only
  a readme and samples.'
