notes: 'One zip per stain (HE, 13 IHC, miR-143, miR-145, U6, Scr; 470,971,048,454 B in total per the Dataverse API) plus SPSS
  tables and a readme. n_items counts H&E cores only (552 jpg + 552 png masks). Readme: masks from a DeepLabV3 model (NoCodeSeg)
  trained on pathologist annotations with active learning, hence source mixed. Pixel size not stated (''40x''). No paper cited
  yet. Zenodo 14800740 mirrors only a readme and samples. enricher: sampled H&E pair HE__A001-1: RGB jpg + boolean (1-bit)
  png mask of the same shape, annotations_verified true; channels 3 (RGB); Ki67.zip has the same <stain>/<Cancer|Normal mucosa>/
  layout. No single direct archive for the whole dataset (21 files), so download_url stays null.'
