notes: 'Four zips (train 80, test 268, validation1 50, validation2 14 TIFFs; 412 total, peek_archive). Names are
  <core>_BF/_SHG in test and <core>_WB/_MI in train/validation. The paper registered BF and SHG with a mutual-information
  affine method, so pairs are aligned but carry no labels (annotations.present false). Pixel size not stated on
  the record or in the paper text; pancreatic BF was scanned on an Aperio CS2 at 40x, breast on a custom SHG/BF
  system. Sibling deposit zenodo.org/records/3874362 holds 834x834 patches of the same 206 pairs and is not
  proposed separately.'
