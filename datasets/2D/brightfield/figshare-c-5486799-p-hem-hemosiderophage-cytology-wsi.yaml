notes: 'Figshare collection of 75 items: 74 slides, one SVS each (about 170-230 MB, e.g. Human-BB-EALH-10052, Equine-BB-MELE-27), plus images_meta_data.xlsx; each is CC0 on
  Figshare, no single archive, so download_url is null. Annotations are not on Figshare: the paper Methods say they are in the EIPH_WSI repository (Zenodo 5722932, 867 MB zip,
  record license other-open), SDATA/Statistics/SDATA_Final_Annotations.csv/.pkl/.sqlite, listed with peek_archive. Pixel size not stated in the paper text read (Aperio SVS headers
  not probed). Annotation is expert-algorithm: a RetinaNet pre-trained on 17 expert-annotated equine slides proposed boxes, then removed false positives and screened by one pathologist
  (proofread); 17 equine slides (MELE) were fully expert annotated. Size not summed.'
