notes: 'Only 14 images, 8 with masks (README: 8/14 fully annotated with axon and myelin labels, 6/14 unannotated). Linked
  paper (Tissue Eng Part A) is not open access in Europe PMC: only the abstract was read. Part of the ASTIH collection. enricher:
  pixel size 0.211 um confirmed in all 14 BIDS sidecars (OME-XML in the TIFF says 0.218 um; the sidecar is kept). enricher:
  channels 3 (RGB OME-TIFF, was null); formats ome-tiff + png from probes (was tiff). enricher: the labels derivative dataset_description.json
  says License MIT; the dandiset license is CC-BY-4.0 (kept).'
