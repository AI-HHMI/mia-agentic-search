title: 'Replication data for : Deep in situ microscopy for real-time analysis of mammalian cell populations in bioreactors'
short_name: Hybridoma cell viability boxes (in situ LM)
description: 4,000 bitmap images (1392 x 1040) from an in situ transmitted-light microscope in suspended murine hybridoma
  bioreactor cultures with viability from 90% to 20%, in 16 folders of 250. Cells are labelled with YOLO-style bounding boxes
  in per-image text files according to 18 classes (viable, apoptotic, necrotic, doublet and others, including over- and
  under-exposed variants); 14 of the classes were merged into 6 for training the paper's detector.
