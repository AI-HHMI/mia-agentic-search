notes: 'Files: Labeled_DB_CNRSResearchData.zip (4.3 GB) and Read_me.txt (read). The zip central directory was read with range
  requests: 4,000 .bmp, 926 .txt (16 classes.txt plus 910 label files, so about 910 of 4,000 images carry boxes; images without
  a cellular object have no label file, per Read_me), 2 Thumbs.db and one .lnk. Read_me states 18 classes, of which four (cornet,
  corps_apoptotique, bizarre, agglomerat) were not used for training and the rest merged into 6. Camera pixel size 6.45 um
  and field 0.16 x 0.22 mm are stated; the pixel size in the object plane is not stated directly, so voxel_size_nm is null.
  The paper trained on 3,400 images of the labelled database. Licence on the dataset page is Etalab Open License 2.0. enricher:
  data.formats stays other (8-bit greyscale BMP, no schema value). enricher: size_bytes includes Read_me.txt (was the zip
  only).'
