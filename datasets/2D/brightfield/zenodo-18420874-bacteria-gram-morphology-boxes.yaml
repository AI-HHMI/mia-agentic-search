notes: 'One zip (bacteria.zip, 3.4 GB): 32 taxon folders, each images/*.png plus a COCO result.json (Label Studio export, boxes only, empty segmentation). Zenodo says the original images come from external
  sources and/or earlier datasets, not named; no paper. CC-BY-4.0 applies to the record; the license of the underlying images was not verified. Pixel size, magnification and microscope not stated. Staining
  not stated on the page. enricher: organisms = one per folder (folder name = taxon), mapped to current NCBI scientific names via NCBI Taxonomy (e.g. folder ''Lactobacillus casei'' = Lacticaseibacillus
  casei, ''Propionibacterium acnes'' = Cutibacterium acnes; genus-level folders: Bifidobacterium spp, Fusobacterium, Micrococcus spp, Proteus (bacterial genus, taxid 583), Streptococcus, Veillonella) (was
  []). enricher: size 3,394,557,834 B from file listing.'
