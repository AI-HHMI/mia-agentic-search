notes: 'One zip (bacteria.zip, 3.4 GB): 32 species folders, each with images/*.png and a COCO result.json (checked Acinetobacter baumannii: 60 images, 402 boxes, empty segmentation lists, so boxes only).
  Zenodo page says the original images were not produced by the record authors and come from external sources and/or earlier datasets, without naming them; no related paper is listed. The CC-BY-4.0 license
  applies to the record, and the license of the underlying images was not verified. Image counts from the zip listing (1,972 PNG + 32 JSON); total box count not checked beyond one species. Magnification,
  pixel size and microscope not stated; images are 1225x1225 in the one JSON read. Staining is not stated on the page, so labels_stains is empty although classes include Gram reaction.'
