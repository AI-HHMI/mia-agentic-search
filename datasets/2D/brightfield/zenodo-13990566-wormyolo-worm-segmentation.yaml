notes: 'Zenodo bundle (10.1 GB): BBBC010, CSB-1 (2.8 GB), MD (195 MB), Synthetic (6.9 GB) zips and weights.
  Listed with peek_archive: CSB-1 has 4,166 train and 465 val PNGs with YOLO txt labels; MD 214 train
  and 215 val PNGs with labels (polygon coordinates read); BBBC010 zip has 100 TIFFs and 1,407 PNGs; Synthetic
  zip not listed (paper: 10,000 images, 912 x 736 px). CSB-1, Mating and Synthetic data come from the
  WormSwin paper and BBBC010 from Ljosa 2012, so upstream terms may differ from this deposit CC-BY-4.0.
  Pixel size, microscope and strain not stated on the Zenodo page, zip listings or paper Methods. Overlaps
  the existing bbbc010 record only for BBBC010 images. enricher: n_items 15,160 images from the listing
  (CSB-1 4,631, MD 429, BBBC010 100, Synthetic 10,000; was null); BBBC010 labels are per-worm PNG masks,
  not YOLO txt.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "CSB-1_dataset.zip (2.84 GB)\n  images/{train,val}/<video>_<frame>.png   4166 + 465\n  labels/{train,val}/<same\
      \ stem>.txt       4166 + 465\nMD_dataset.zip (195 MB)\n  images/{train,val}/<name>.png         \
      \   214 + 215\n  lables/{train,val}/<same stem>.txt       214 + 215\nSynthetic_dataset.zip (6.91\
      \ GB)\n  images/<n>.png  10000;  labels/<n>.txt  10000\nBBBC010_dataset.zip (16.6 MB)\n  images/<well>.tif\
      \                        100\n  labels/<well>_<nn>_ground_truth.png      1407 (one per worm)\nWeightsfiles.zip\
      \ (178 MB): Weightsfiles/*.pt  5 (model weights)\n"
    n_files: 5
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/13990566/files/CSB-1_dataset.zip::images/val/24_2_1_1_0.png
    - https://zenodo.org/records/13990566/files/CSB-1_dataset.zip::labels/val/24_2_1_1_0.txt
    size_bytes: 691475
    description: One CSB-1 validation frame and its YOLO polygon label file
  arrays:
  - role: raw
    path_pattern: '{CSB-1_dataset,MD_dataset,Synthetic_dataset}.zip::images/*.png'
    format: png
    axes: yxs
    shape:
    - 736
    - 912
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 39
    - 184
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Grey stored as RGB (samples identical in the CSB-1 sample). CSB-1 and Synthetic 736x912x3,
      MD 1012x1012x3 (headers).
  - role: label
    path_pattern: '{CSB-1_dataset.zip::labels,MD_dataset.zip::lables}/*/*.txt'
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: polygons
    classes:
    - id: 0
      name: worm
    alignment: same-grid
    alignment_notes: 'YOLO-seg txt with the image stem: one line per worm, class 0 then normalised x y
      polygon pairs (22 worms in the sampled CSB-1 file). Coordinates are relative to the image size.'
  - role: label
    path_pattern: Synthetic_dataset.zip::labels/*.txt
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: polygons
    classes:
    - id: 0
      name: worm
    alignment: same-grid
    alignment_notes: Same YOLO-seg format, <n>.txt for images/<n>.png (6 worms in labels/0.txt).
  - role: raw
    path_pattern: BBBC010_dataset.zip::images/*.tif
    format: tiff
    axes: yx
    shape:
    - 520
    - 696
    shape_varies: false
    dtype: uint8
    compression: none
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'BBBC010 brightfield images (header: single page, 1 sample).'
  - role: label
    path_pattern: BBBC010_dataset.zip::labels/*_ground_truth.png
    format: png
    axes: yx
    shape:
    - 520
    - 696
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: worm
    alignment: same-grid
    alignment_notes: 'One mask per worm: <well>_<nn>_ground_truth.png belongs to images/<well>.tif; same
      520x696 shape (headers). Sampled A01_01: values {0, 255}.'
  notes: 'Listing: tools/listing.py --expand-zips on the Zenodo record: 5 files, 10,133,779,480 bytes,
    complete, exact, 31,632 zip members. Probed headers of CSB-1, MD, Synthetic and BBBC010 members; sampled
    one CSB-1 PNG (631,902 B; range [39,184], one sample) and one BBBC010 mask (596 B); read 3 label txt
    files with peek_archive --cat. Voxel size not found; checked: PNG/TIFF headers, Zenodo API record,
    WormYOLO paper full text (Methods: frame sizes in px only), upstream WormSwin paper full text (CSB-1:
    912x736 px, no pixel size). Raw arrays from 3 sub-datasets share one glob; the planner may need per-subset
    arrays. No single archive of the whole record: download_url stays the record page; per-zip URLs are
    direct (usable).'
