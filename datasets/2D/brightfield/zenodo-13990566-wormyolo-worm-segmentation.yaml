short_name: C. elegans worm segmentation (brightfield)
description: Brightfield images of C. elegans on plates with per-worm instance segmentation polygons in
  YOLO format, from the WormYOLO paper. Bundles the CSB-1 dataset (4,631 frames, 912 x 736 px, train/val),
  the Mating dataset (429 frames of 1012 x 1012 px, train/val), a Synthetic pretraining set, the BBBC010
  images with single-worm annotations, and trained weights.
