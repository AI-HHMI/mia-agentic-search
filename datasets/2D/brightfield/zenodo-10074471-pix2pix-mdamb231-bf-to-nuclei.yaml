notes: 'Training signal is image-to-image translation (brightfield input, sir-DNA nuclear fluorescence target),
  not masks, hence annotation type and task "other". Zenodo API record and peek_archive of both zips: 1,600 TIFFs
  each (3.35 GB uncompressed each), identical numbering. n_items counts the 1,600 pairs; size_bytes is the sum of
  the two zips (1,830,678,011 + 1,343,840,989 B) plus example_images.png excluded. No associated paper is listed
  on the record and Europe PMC/Crossref title search found none, so the split is unknown. The 20x
  time-lapse frames come from a few movies, so frames are correlated. enricher: voxel size 649.6 nm from the ImageJ
  calibration of both TIFF sets (0.6496 micron/px), consistent with 20x and 2x2 binning on the Orca Flash4.0 (record)
  (was null). enricher: size_bytes is all 3 files; download_url is the record (two zips).'
