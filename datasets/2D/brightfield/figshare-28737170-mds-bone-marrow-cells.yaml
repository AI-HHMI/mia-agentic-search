  notes: >-
    Exact Figshare listing (one zip, 249,826,685 B) with all 25,011 zip members (25,009 jpeg + 2 csv).
    Probed main/Monocyte_0000 (275x275x3), main/Monocyte_0001 (155x155x3) and add/Monocyte_000 (201x201x3): RGB uint8 JPEG, square crops of varying size.
    Sampling failed (tools/sample.py could not open a member of the figshare ndownloader URL, which has no .zip suffix), so no value range was measured; method is header.
    Read the head of both CSVs. Split counts in the paper (15,987/2,352/4,503) sum to the 22,842 main/ images, but no split file is included.
    Voxel size: the paper states a 75 nm pixel distance for the MorphoInsight WSIs (main/) only; add/ images come from SmartV550Df/V650Df/V650D cameras with no stated pixel size; the crops are not stated to be resampled. Checked: JPEG headers (no calibration), Figshare API, CSVs, paper full text.
