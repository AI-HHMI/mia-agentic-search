notes: 'Figshare API: one 250 MB zip, CC BY 4.0 (the paper text links CC BY-NC-ND for the article itself). Paper: annotation by a technician with expert review (up to 3 experts); the abstract says 27 categories, the text 32. The paper describes a 70/10/20 split (15,987 / 2,352 / 4,503) of the main images, but no split file is included, so splits_provided is false. Crops are 10% larger than the cell bounding box; one cell per image, no masks or boxes. enricher: voxel size set to null (was 75x75): the paper states 75 nm only for the MorphoInsight WSIs (main/, 22,842 images); add/ (2,167 camera images) has no stated pixel size. enricher: main/ has 32 class folders, matching the paper text.'
