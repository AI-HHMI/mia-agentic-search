notes: 'Figshare API: one 250 MB zip, CC BY 4.0 (the paper text links CC BY-NC-ND for the article itself). peek_archive: 25,009 JPEG cell crops in class folders under main/ and add/, plus two CSVs. Paper (open access, read): annotation by a technician with expert review (up to 3 experts); the abstract says 27 categories while the text says 32, class count not resolved. The paper describes a 70/10/20 train/validation/test split (15,987 / 2,352 / 4,503 images) of the main images, but no split file was seen in the listing, so splits_provided is false. Pixel distance 75 nm applies to the whole-slide scans the main crops came from; the add/ images come from digital cameras with other resolution settings. Cropped images are 10% larger than the cell bounding box; each image is one cell, no masks or boxes are provided.'
