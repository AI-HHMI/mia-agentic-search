title: A large dataset of bone marrow cells in myelodysplastic syndrome for classification systems
short_name: MDS bone marrow cell classification (brightfield)
description: 25,009 cropped bone marrow nucleated-cell images (JPEG) from Wright-stained bone marrow smears of 125 patients with myelodysplastic syndrome, grouped into class folders (normal and dysplastic cell types) with CSV tables of image paths, cell class and diameter. Most cells were cropped from 100x oil whole-slide scans (75 nm pixel distance); an additional set was photographed with digital cameras.
