notes: 'Details come from the Zenodo record, its README and a zip listing (peek_archive: 45,369 files,
  SpheroHQ/{train,val,test}/{images,masks}). Masks were made semi-automatically (prusek-spheroid algorithm
  followed by expert refinement in CVAT) and reviewed, hence source mixed. Splits are by cell line, not
  by image. The SpheroSeg paper (Comput Methods Programs Biomed 2026) is not open access, so only its
  abstract was read via Europe PMC; microscope, magnification and pixel size are not stated on the dataset
  page or abstract, so voxel_size_nm is null. A companion record, SpheroMix (10.5281/zenodo.22092984),
  adds three external datasets and is not included here. Spheroids are imaged as 2D bright-field projections,
  so dimensionality is 2D. Images are 8-bit RGB with greyscale content; the manifest.csv lists per-file
  cell line and dimensions.'
