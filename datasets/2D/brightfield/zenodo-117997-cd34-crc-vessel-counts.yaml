notes: 'Despite the title (blood vessel segmentation validation), the labels are per-image vessel counts, not masks: three
  blinded observers and one automatic count per image (checked in the CSV). The cited paper (Oncotarget 2015, hotspot detection)
  does not describe this 100-patch set in the text read, so the pixel size (0.50 µm/px, 20x, Aperio ScanScope) and sample
  details are from the Zenodo description. The zip holds 100 TIFF files (CD34_img_001..100.tif, about 3 MB each). Size is
  the sum of the two Zenodo files. Useful as a counting / vessel-detection benchmark; no train/test split.'
