notes: 'Zip listing: Cleandata/ with 33 species folders and 36,153 PNG files (705-1,242 per class). Organism
  lists only the classes the DIBaS paper names with a species; genus-level folders (Bifidobacterium spp.,
  Fusobacterium, Micrococcus spp., Proteus, Veionella) and the Lactobacillus/Staphylococcus folders not listed are
  not mapped. organisms: each listed organism = its own Cleandata/<Genus.species>/ folder. Trace amounts of
  nearly blank crops (dataset page). Crops of one source image are correlated; no split provided. The CC-BY-4.0
  license is the Zenodo depositor''s; the upstream DIBaS site license was not checked. enricher: files are
  224x224 RGB, not 244x244 as the page says (probed 4 files); description corrected.'
