notes: 'Zip listing: Cleandata/ with 33 species folders and 36,153 PNG files (counts range 705-1,242 per
  class). Folder names include genus-level groups (Bifidobacterium spp., Fusobacterium, Micrococcus spp.,
  Proteus, Veionella) that are not listed under organism; organism lists only the classes named with a species
  in the DIBaS paper table. The dataset page notes trace amounts of nearly blank crops. Pixel size and channel count not stated
  on the dataset page or in the DIBaS paper (Olympus CX31, 100x oil objective only). The DIBaS paper says
  the source database has 20 images per species; the crops here are cut from those full images, so crops of
  one source image are highly correlated and no split is provided. The CC-BY-4.0 license is the Zenodo
  depositor''s; the license of the upstream DIBaS site was not checked.'
