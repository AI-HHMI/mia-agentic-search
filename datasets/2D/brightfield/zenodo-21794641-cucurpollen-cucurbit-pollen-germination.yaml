notes: 'Annotation and image counts come from the Zenodo description and the zip listing (3,213 members: 3,089 images
  under images/2023 and images/2024 as .tif/.jpg/.png, 122 COCO JSON files, 2 CSVs). Pixel size: the per-image CSV
  pixel_size column (2,35 / 3,45) states no unit, so voxel size is null. No paper found; no split provided. License
  CC-BY-NC-ND-4.0 as shown on the Zenodo record. organisms (master_variety.csv): Cucumis sativus = cucumber/, Cucumis
  melo = melon/, Cucurbita moschata = pumpkin/, Citrullus lanatus, C. amarus, C. colocynthis = watermelon/ (varieties
  per field_code). enricher: two microscopes per master_image.csv (Zeiss Axiovert 40CLF images are grey JPEGs);
  annotations verified from a COCO file.'
