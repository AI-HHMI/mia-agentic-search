notes: 'Annotation and image counts come from the Zenodo description and from listing CucurPollen.zip with
  peek_archive (3,213 members: 3,089 images under images/2023 and images/2024 as .tif/.jpg/.png, 122 COCO JSON
  files, 2 CSVs). A sample COCO file confirmed the three categories plus bbox and segmentation polygons. The
  per-image CSV has a pixel_size column (e.g. 2,35) with no unit stated and the microscope Leica DMS1000, so
  voxel size is left null. No accompanying paper or data descriptor was found (searched the web for the dataset
  name); no train/val/test split is provided in the archive listing. License CC-BY-NC-ND-4.0 as shown on the
  Zenodo record. Species from metadata/master_variety.csv.'
