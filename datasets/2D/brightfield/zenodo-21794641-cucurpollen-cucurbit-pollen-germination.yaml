title: CucurPollen - microscopy images of cucurbit pollen germination and tube growth
short_name: Cucurbit pollen germination (brightfield)
description: 3,089 microscopy images of pollen germination and tube growth from melon, watermelon, cucumber and
  pumpkin cultivated under naturally occurring heat stress (2023 and 2024 assays). A curated subset of 122 images
  has instance-level COCO annotations (germinated grains, non-germinated grains, pollen tubes); 639 images carry
  expert visual scores, and 129 images are flagged as noisy. The depositors trained semantic segmentation models
  on the annotated subset as technical validation.
