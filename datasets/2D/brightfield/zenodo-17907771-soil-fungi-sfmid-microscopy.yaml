notes: 'Single 23.9 GB zip (GitHub release mirror, 20,153 entries: 20,151 png + README + .gitattributes); listing
  read with peek_archive, README read for counts per genus (SFMID-W has no Purpureocillium). Labels are the
  genus folder names only, no masks or boxes; annotation source "manual" is inferred from the culture-based
  labelling and is not stated. Microscope, magnification and pixel size are not stated on the Zenodo record
  or README; the paper (MDPI Applied Sciences) full text was not available via Europe PMC and the publisher
  page returned 403, so only the Crossref record was read. Organism entries are genera, not species. The
  record title on Zenodo is the GitHub release name; the dataset name comes from the README.'
