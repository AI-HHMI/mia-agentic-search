title: 'NDB-UFES: An oral cancer and leukoplakia dataset composed of histopathological images and patient data'
short_name: Oral cancer and leukoplakia H&E images (NDB-UFES)
description: 237 H&E histopathology images (Leica DM500 with ICC50 HD camera, 10x and 40x objectives, 2048 x 1536 px PNG) of
  oral squamous cell carcinoma and oral leukoplakia with or without epithelial dysplasia from 77 lesions at the Federal
  University of Espirito Santo, Brazil (2010-2021), with the pathologists' diagnosis and sociodemographic and clinical
  metadata in CSV/XLSX. A second archive holds 3,763 patches of 512 x 512 px labelled with dysplasia (1,930), carcinoma
  (1,126) or without dysplasia (707), with CSV files for a parsed train/test task split.
