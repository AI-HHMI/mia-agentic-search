notes: 'Mendeley API (version 4, 2023-03-16) lists images.zip (1.74 GB), images-patches.zip (1.46 GB), ndb-ufes.csv/xlsx,
  data_dictionary.ods and task CSV files (3.20 GB in total). The zip contents could not be listed because the Mendeley
  file server reports no size for range requests; image format, size and counts (237 images, 3,763 patches, 77 lesions)
  are from the paper. Labels are image- and patch-level diagnoses, not pixel annotations. Objective magnification is
  10x or 40x; no pixel size in nm is stated. The split files (Task II) are named in the file list; their exact split
  proportions were not read. Authors are from the Europe PMC record.'
