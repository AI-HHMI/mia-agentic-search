notes: 'Figshare API record (one 624 MB zip, version 3, CC BY 4.0) and the zip listing (peek_archive: 2,344 PNGs
  in Images/, 4 CSV, 1 XLSX, 1 Python evaluation script) and the Scientific Data full text (Methods, Data Records)
  read. Images are static photographs taken for documentation (Olympus IX50, 400x, Octax EyeWare), not stage-labelled
  time-lapse frames. Training annotations are a silver standard from one Gardner-expert; the 300-image test set
  is the consortium gold standard. Pixel size is not stated. n_items counts images; clinical annotations cover the
  752 blastocysts selected for fresh transfer. enricher: channels 3 (RGB PNG per header; was null).'
