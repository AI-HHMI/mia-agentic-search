id: figshare-20123153-human-blastocyst-gardner
title: A human blastocyst dataset including clinical annotations to benchmark deep learning architectures for in
  vitro fertilization
short_name: Human blastocyst Gardner grades (brightfield)
description: 2,344 PNG images of human day-5 blastocysts photographed through an inverted microscope at 400x, each
  graded for expansion, inner cell mass and trophectoderm quality by a Gardner-expert (silver standard for the training
  set). A 300-image test set carries gold-standard grades from an international consortium of embryologists with
  agreement scores, and a subset of 752 transferred blastocysts has clinical outcome annotations.
