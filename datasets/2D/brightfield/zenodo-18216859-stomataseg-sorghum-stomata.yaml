description: 318 digital-microscope images (2592 x 1944 px JPEG) of sorghum leaf surfaces from five genotypes, tiled
  into 11,060 human-annotated 341 x 341 px patches (7,662 train, 2,238 validation, 1,160 test) with COCO polygon
  instance masks for three stomatal components (pore, guard cell, complex area). 56,428 additional pseudo-labelled
  patches are provided; the original full-resolution images and COCO files are included as supplementary material.
