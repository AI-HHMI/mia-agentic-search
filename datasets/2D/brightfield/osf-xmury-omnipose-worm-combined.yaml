notes: 'Sibling of osf-xmury-omnipose-bact-phase (same OSF project xmury, folder datasets/worm). Overlaps in source images
  with the catalogued bbbc010-celegans-live-dead (BBBC010) but is a different dataset: crops of BBBC010 plus Wormpose frames
  with new Omnipose-assisted manual instance masks. OSF API listing: 301 files, 147,812,570 B; train 60 images each with _masks.tif
  and _flows.tif, test 60 image/mask pairs. Licence: paper says derived files are CC BY-NC 3.0 (project-root license.txt);
  source images are under their own licences. Pixel size not stated; left null. enricher: listing, headers and a sample pair
  checked; pixel size not stated here or on the BBBC010 page.'
