  notes: 'Listing of datasets/worm by a scratch script over the OSF API (paginated, exact per-file sizes; tools/listing.py
    has no OSF support, so size_source is page-stated). 120 image/mask pairs (60 train, 60 test) + 60 *_flows.tif (precomputed
    flow targets, train only; not listed as an array) + 1 .DS_Store. Image names end in a digit, so *[0-9].tif excludes masks
    and flows. Probes: single-page plain TIFFs, uint16, packbits, yx (331x150, 348x349). Sample celegans_bbc010_73: raw 70..65057,
    27,632 values; mask 0..6, 7 values (instance IDs per the paper; consecutive). Value ranges from one pair. Pixel size not
    found; checked: TIFF headers, paper Methods (crops packed into ensemble images, no scale stated), OSF wiki home, the catalogued
    BBBC010 record (no pixel size either). Two upstream sources, so one value may not apply to all files.'
