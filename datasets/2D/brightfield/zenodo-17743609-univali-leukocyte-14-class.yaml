notes: 'Two zips: dataset-yolo (11,651 jpg + 11,651 txt labels, data.yaml with 14 classes, exported from
  Roboflow project visao_computacional v10, CC BY 4.0) and dataset-vit (not listed: server closed the
  connection; classification layout). Zenodo says 4,471 originals were augmented to 11,650 and split 9,320/1,165/1,166;
  the Roboflow readme says 3 augmented versions per source image (flips, 90-degree rotations), so augmented
  copies of one source image may sit in different splits (possible leakage), which users should check.
  No paper, publication date, microscope, magnification, stain or pixel size found on the Zenodo record,
  the zip readmes or the Roboflow export notes. Annotation source (manual) is inferred from Roboflow annotation
  workflow described on Zenodo. Images are resized to 640x640. enricher: annotations.types changed from
  bounding-box to instance-segmentation; the YOLO txt lines read are polygons (class + many x,y pairs),
  not 4-value boxes.'
