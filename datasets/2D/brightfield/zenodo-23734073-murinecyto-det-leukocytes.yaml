title: 'MurineCyto-Det: A High-Resolution Dataset for Leukocyte Detection in Murine Cytology Images'
short_name: Murine BALF leukocyte detection (cytology)
description: 333 RGB cytology image tiles (1024 x 1024 px, 0.23 um/pixel) of murine bronchoalveolar lavage fluid with 14,544 annotated cell instances in five classes (macrophage/monocyte, neutrophil, eosinophil, lymphocyte, unknown cell/debris). Provides images, colour and grayscale semantic masks, Labelbox instance masks in COCO RLE, per-image COCO files, metadata and exact split lists (train and validation tiles from mouse 1, test tiles from mouse 2).
