notes: 'Version 2.0 of the Zenodo record. images.zip holds 333 PNG tiles, masks.zip 333 PNG masks and annotations.zip 347 JSON files (peek_archive). Zenodo description says the staining and acquisition procedures are in the accompanying manuscript, which was not found or read, so the stain is not recorded and the annotation procedure (Labelbox export) is not described there; annotations.source is therefore unknown. No related paper DOI is listed on the record. Only two source mice; rare classes (eosinophils 388, lymphocytes 51) are few. Unknown cell/Debris is an auxiliary class.'
