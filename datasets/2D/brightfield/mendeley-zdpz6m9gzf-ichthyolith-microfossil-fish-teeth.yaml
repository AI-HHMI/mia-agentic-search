notes: 'Counts from the Mendeley description, Readme.txt and the Data in Brief paper (dataset 1: 866 train
  + 92 val, 640x640; dataset 2: 17,400 tooth + 15,036 noise + 36 denticle crops; dataset 3: six slides,
  5,177 images, 1200x1200, incl. images without teeth). Pixel size 0.96 um at 200x is stated in the paper.
  Mendeley data licence CC BY 4.0 (dataset API). Slide-mounted marine sediment particles, so no organism.
  Annotated by one expert author. enricher: annotations verified from zip indexes (VIA JSON, class folders,
  VOC XML) and sample members read; all images are JPEG.'
