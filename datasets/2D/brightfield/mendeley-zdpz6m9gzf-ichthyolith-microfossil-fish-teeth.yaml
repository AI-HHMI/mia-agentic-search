notes: 'Counts come from the Mendeley description and the Data in Brief paper (dataset 1: 866 train + 92 validation images, 640x640 px; dataset 2: 17,400 tooth + 15,036 noise crops, 36 denticle crops unused; dataset 3: six slides, 5,177 images, 1200x1200 px, includes images without teeth). Pixel size 0.96 um at 200x magnification is stated in the paper. Files total 4.85 GB: six 1179C_24_05_75_00N.zip (dataset 3), 20211219_dataset1.zip, 20211224_hirox_2class.zip and a Readme. JPEG confirmed only for dataset 1 (range request on 20211219_dataset1.zip showed train/*.jpg); formats of datasets 2 and 3 not inspected, and peek_archive could not list the zips (the server redirect reports no size), so annotations_verified is false. Mendeley data licence CC BY 4.0 per the dataset API record. Samples are slide-mounted marine sediment particles, so no organism is listed. Annotated by one expert author.'
