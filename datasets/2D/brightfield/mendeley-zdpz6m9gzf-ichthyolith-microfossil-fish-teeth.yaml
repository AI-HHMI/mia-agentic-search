title: Datasets for ichthyolith detection
short_name: Microfossil fish teeth detection (brightfield)
description: Digital-microscope (Hirox RX-100, 200x) images of glass slides of deep-sea pelagic clay with
  microfossil fish teeth (ichthyoliths). Three sets are shared - 958 images (866 train, 92 validation)
  with VGG Image Annotator contour annotations for Mask R-CNN, about 32,400 cropped particle images labelled
  tooth vs. noise for classification, and six whole-slide test sets (about 5,177 images) with labelImg
  annotations.
