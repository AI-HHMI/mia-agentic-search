schema_version: '1.2'
id: kaggle-zakaurrehmanmmu-her2-sish40x
title: 'HER2-SISH40x: Annotated histopathology image dataset for HER2 amplification assessment in breast
  cancer'
short_name: HER2 SISH breast cancer patches (40x brightfield)
description: Image patches of 237 expert-annotated regions of interest from 50 HER2 dual-ISH (silver ISH)
  whole slide images of breast cancer biopsies (25 HER2-amplified and 25 non-amplified cases; University
  Malaya Medical Centre, scanned at 40x with a 3DHistech Pannoramic DESK) plus 300 normal-tissue ROIs.
  Each patch is labelled Amplified (113), Non-Amplified (124) or Normal (300) by pathologists; patches
  are irregularly sized (859 x 755 to 5451 x 3136 px) and organised in one folder per class. The whole
  slide images themselves are not released.
