notes: 'Kaggle metadata (API view) gives CC BY-NC-SA 4.0 (non-commercial), 12.86 GB, version 1, last updated 2025-03-27
  (used as date_published); the Kaggle file listing could not be read (WebFetch returns only the title and the files
  endpoint needs authentication), so the patch file format, the per-folder counts and whether patches or ROI crops are
  stored are unverified (data.formats other for that reason). Counts (113/124/300 ROIs) are from the paper table; the
  paper says 237 annotated ROIs plus 300 normal ROIs. Labels are patch-level classes from the paper and the folder
  structure it describes, not pixel annotations. The paper cites related earlier work by the same group on HER2-SISH
  region segmentation and signal counting that uses other data. Pixel size not stated in the paper text read.'
