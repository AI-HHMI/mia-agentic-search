notes: 'Zenodo zip listed with peek_archive (4,697 files): Videos/ has 4,411 segmentation debug mp4s (17.6 GB) and Dataframes
  JSON (13.7 GB uncompressed); the only labelled imagery is Benchmarking/ with about 29 human-annotated frames (58 files in
  annotated/ incl. previews; annotated_raw/ and originals alongside; 169 files of algorithm output). The record says raw time-lapse
  images are available on request, so this is a small labelled benchmark inside a mostly derived-data deposit. Paper (Europe
  PMC full text read): manual labelling of frames across time points and concentrations for all species to benchmark the classical
  PadAnalyser segmentation; images 3208 x 2200 px at 0.112 um/pixel, 40x/0.75 NA brightfield; exact number of labelled frames/cells
  is in the paper''s S2 Table (not read). Size is the single zip.'
