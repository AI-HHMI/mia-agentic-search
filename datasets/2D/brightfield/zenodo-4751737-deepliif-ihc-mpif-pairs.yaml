title: Deep Learning-Inferred Multiplex ImmunoFluorescence for Immunohistochemical Image Quantification (DeepLIIF dataset)
short_name: DeepLIIF IHC and mpIF co-registered tiles
description: 1,264 co-registered sets (512 x 512) of Ki67 IHC with multiplex immunofluorescence (hematoxylin, DAPI, Lap2beta,
  marker) and a cell segmentation mask, from lung and bladder tissue scanned on a ZEISS Axioscan; 575 training, 91 validation
  and 598 test sets. Each PNG stitches the panels side by side (IHC, Hematoxylin, mpIF DAPI, mpIF Lap2, mpIF Marker, Seg).
  A second breast cancer subset (BC-DeepLIIF) with its own training and validation zips is in the same record, with models.
