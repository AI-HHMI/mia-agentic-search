notes: 'Panel layout, counts (575 / 91 / 598) and scanner (ZEISS Axioscan) are from the DeepLIIF README and the bioRxiv preprint
  (the journal version is not open access). Preprint: internal test images are 512 x 512 at 40x, bladder and lung carcinoma;
  mpIF co-registered to IHC by affine transforms; masks of Ki67 positive and negative cells made with the ImPartial interactive
  framework from mpIF DAPI plus a few annotations (source mixed). Zips listed with peek_archive (PNG only). Pixel size not
  stated. size_bytes sums the five data zips; model zips and the ImageJ jar in the record are excluded. A breast carcinoma
  subset (BC-DeepLIIF) is in the same record. enricher: n_items 1715 = all PNGs in the five data zips incl. BC-DeepLIIF (was
  1264, lung/bladder only).'
