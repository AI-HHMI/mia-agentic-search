notes: 'peek_archive of data.zip (10.3 MB, 3,118 JPEG): training/negative 2,613, training/positive 468,
  validation/negative 26, validation/positive 10 (3,117 counted by folder; one further jpg elsewhere). The
  patches are a derived example set from a single species (Carapa procera); the full micrographs of the study
  (1,199 JPEG, no labels) are in Zenodo 3579227. Paper Methods: photomicrographs of 1,600 x 1,200 px cover
  344 x 258 um (Keyence VH-5000, x1,000 lens), so 215 nm/px is derived (344 um / 1,600 px); patches were
  120 x 120 px (25 um) labelled positive or negative by an expert, stomata not fully visible are negative. That
  patch size applies to the paper; the patch pixel dimensions in this zip were not measured. Modality brightfield
  is assumed (digital microscope, coaxial lighting). Annotation is patch classification, not boxes or masks.'
