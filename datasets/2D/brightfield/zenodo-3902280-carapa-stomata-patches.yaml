description: 3,118 small JPEG patches cut from light-microscope photomicrographs of nail-polish leaf impressions
  of herbarium specimens of Carapa procera, sorted into positive (stoma fully visible) and negative patch
  folders under training and validation. Released as the example set for the 'From leaf to label' stomata
  detection workflow (patch-based deep learning classification, 120 x 120 px windows).
