notes: 'One 13 GB RAR; peek_archive cannot list RAR, so image format (Marchant et al. 2020 export JPEG crops, one folder per class), layout and label files are unverified. Labels come from a CNN (98% agreement with human classifiers per DataCite abstract), hence source automatic. Pixel size from 1159.4 px/mm (0.8625 um; matches 3.45 um pixels, 4x lens in the 2020 paper). Focus-stacked, so 2D. Adebayo 2023 not open access, not read. Differs from zenodo-3996436 and pangaea-897873. Non-commercial license.'
