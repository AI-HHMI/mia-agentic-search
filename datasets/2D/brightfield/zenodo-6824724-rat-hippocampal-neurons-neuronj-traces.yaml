notes: 'README: unprocessed.zip holds microscope images and NeuronJ neurite traces organised time point > plate > row > column
  (row 2 = 10,000 cells/cm2, row 4 = 20,000 cells/cm2); processedData.zip (1.1 GB) adds morphometric analysis outputs and the
  statistical workbooks. Zip listing of unprocessed.zip (8925 files): 338 JPG images, 189 PNG traced images, about 365 NDF
  files, and per-neurite trace text files (.n1.txt to .n27.txt and beyond). The paper is not open access (abstract
  only); the Zenodo keywords give bright-field microscopy but objective, camera and pixel size are not stated on the record
  page or README. Traces are neurite paths, not region masks; partial coverage because only some neurites per image are
  traced (not verified per image). Reported results only cover DIV 0.5 to 6 at 10,000 cells/cm2. size_bytes sums the three
  Zenodo files (both zips and README).'
