notes: 'README: unprocessed.zip holds microscope images and NeuronJ neurite traces organised time point > plate
  > row > column (row 2 = 10,000 cells/cm2, row 4 = 20,000 cells/cm2); processedData.zip (1.1 GB) adds morphometric
  outputs and statistics workbooks. Paper not open access (abstract only); objective, camera and pixel size are
  not stated on the record or README. Traces are neurite paths, not masks; coverage partial (only some neurites
  traced, not verified per image). size_bytes sums the three Zenodo files. enricher: raw images are the 3024 x 3226
  JPGs (grey stored as RGB, channels 1); the .PNG files are smaller renders of the traced image (759 x 810 RGBA),
  not on the raw grid; one .jpg (div005 C/B/2 _0005.jpg, 845 B) is actually an NDF file.'
