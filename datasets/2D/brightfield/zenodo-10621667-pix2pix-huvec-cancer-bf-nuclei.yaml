notes: >-
  Pairs are brightfield images and matching nuclear fluorescence images for brightfield-to-nuclear-stain
  (virtual staining) training with pix2pix; they are image-translation pairs, not labels, so annotations.types
  uses restoration-pairs as the closest schema value and ml.tasks is other. Zip listing (peek_archive): zenodo-10621667-pix2pix-huvec-cancer-bf-nuclei0
  The zip also holds the trained pix2pix model checkpoints (.pth, 458 MB) and augmented training outputs, which
  are not counted. The record page states TIFF 16-bit, 1024 x 1022 px, 650 nm pixel size, Nikon Eclipse Ti2-E
  with a 20x objective. No paper is cited on the page, so none is listed. The nuclear stain name and the
  species of the circulating cells are not stated; Homo sapiens is inferred from the HUVEC (human umbilical
  vein endothelial cell) monolayer named in the title. Sibling record: the other pix2pix HUVEC dataset
  (immune vs cancer cells). Fluorescence source is marked widefield from the microscope description.
