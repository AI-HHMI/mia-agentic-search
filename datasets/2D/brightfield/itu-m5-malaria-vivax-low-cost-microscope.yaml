notes: 'Hosted as a 23 GB set (README: "Total size of the dataset is 23GB") split into parts on Google Drive and OneDrive
  (links on the GitHub README), so there is no direct download URL and the files could not be listed; folders Images, Splits
  and Annotations per the README. No license is stated on the project page, the GitHub README or the paper (CC BY 4.0 on arXiv
  covers only the article). Voxel/pixel size, image resolution and stain not stated on the project page, README or paper;
  the paper says the data are from P. vivax patients and that the Annotations are on 1000x HCM images, 20,331 cells (HCM 10,872,
  LCM 9,459) per the project page. Annotation source is a mix of manual expert labels and homography transfer with manual
  correction. enricher: organisms Homo sapiens (blood cells) and Plasmodium vivax (parasites) appear together in every image;
  they cannot be split by file.'
