id: itu-m5-malaria-vivax-low-cost-microscope
title: M5-Malaria dataset (low-cost and high-cost microscope, multiple magnifications)
short_name: P. vivax blood smear cell boxes, 2 microscopes
description: Thin blood smear images from P. vivax infected patients, 1257 fields of view each captured with a high-cost
  and a low-cost microscope at 100x, 400x and 1000x (7542 images). Malarial cells carry bounding boxes and life-stage
  labels (gametocyte, ring, trophozoite), annotated on the 1000x high-cost images and transferred to the other
  magnifications and the low-cost microscope by homography, then manually corrected (20,331 cells).
