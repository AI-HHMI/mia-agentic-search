title: 'CyanoPampas: A Microscopy Image Dataset of Filamentous Bloom-Forming Cyanobacteria from Pampean Shallow Lakes (Argentina)
  for Automated Taxonomic Recognition'
short_name: Bloom cyanobacteria multi-label images (LM)
description: 382 high-resolution (1536 x 2048) inverted light microscopy images of filamentous bloom-forming cyanobacteria
  from three shallow lakes in Buenos Aires province, Argentina, with a binary per-image presence/absence table for six
  species plus an Others class (multi-label classification), and 150 AI-generated synthetic images (easy, medium, hard)
  for inference and robustness tests.
