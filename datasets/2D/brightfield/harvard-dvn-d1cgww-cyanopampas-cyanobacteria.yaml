notes: 'Dataverse files: original.zip (2.25 GB, 382 TIFFs, listed with peek_archive), images_for_inference.zip (0.78 GB, 150
  synthetic TIFFs in easy/medium/hard folders), datasetInformation.xlsx (presence table: Image, Anab_c, Anab_e, Dol, Plank,
  Raph, Sph, Others) and README.txt (read). n_items counts the real images only. Labels are image-level species presence,
  no boxes or masks; who assigned them is not stated. Microscope model, objective and pixel size are not stated in the description
  or README, and no paper is cited on the page. enricher: size_bytes = all 4 Dataverse files (was the two zips); channels
  3 (RGB TIFF, probed; was null). organisms: species co-occur within images, per-image presence in datasetInformation.xlsx
  (no per-folder split).'
