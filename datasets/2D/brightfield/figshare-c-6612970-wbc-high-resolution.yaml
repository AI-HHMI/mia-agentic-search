notes: 'One 46.2 GB zip "WBC Dataset.zip" (16,027 BMP files, 69.2 GB uncompressed, ~4.3 MB each) with
  a Labelled/<class> folder per class; the per-class counts come from the zip listing. The license (CC0)
  is from the Figshare API record of the article; the paper itself is CC BY 4.0. Pixel size is derived
  from the paper page: about 42 pixels per micrometre (about 24 nm per pixel), raw images 5472x3648 px
  from a Basler acA5472-17uc camera on an Olympus BX51; the raw full-field images are not in the zip (the
  paper mentions 12,986 raw images from 81 smears). The paper page text gives 15,517 normal plus blast
  cells in its Data Records text, not the 16,027 counted in the zip. BMP is not in the format list, so
  the format is recorded as other. Authors are not listed in the sources read. Checked: Figshare collection
  and article API, zip listing, paper page (PMC).'
