notes: 'Hosted on Harvard Dataverse (no enum value, so repository other). Dataverse API lists four zips
  (2.98 GB); peek_archive counts 1,139 / 1,071 / 1,064 / 270 files (Thin_Uninfected: 263 JPEG and 7 PNG),
  matching the paper table (3,544). The paper gives 3840x2160 px per image and an 8528x4808 camera; pixel
  size is not stated. The dataset description mentions detection and segmentation use, but only image-level
  labels were seen (the paper says each image has an infected/uninfected label), no boxes or masks. Annotation
  method: folder labels set after expert-guided staining/screening; the paper does not detail annotators.
  enricher: sizes, member counts and image shapes confirmed by Dataverse listing and probes.'
