notes: 'Zip listing: train 420, valid 40, test 20 images with matching YOLO label files; README.roboflow.txt states 480 images, one class (miospores), CC BY 4.0. The paper (Journal of Micropalaeontology, read online) reports 209 annotated micrographs and a five-class detection set, so the Zenodo export differs from the paper (likely Roboflow preprocessing/augmentation); not resolved. Microscope Leica DM2700 with Flexacam C5 camera; magnification and pixel size are not stated in the paper or record, so voxel size is null. Classification crops (159) are not in the zip. Annotated with rectangular boxes in Roboflow by an operator. Size from the Zenodo listing (51.1 MB).'
