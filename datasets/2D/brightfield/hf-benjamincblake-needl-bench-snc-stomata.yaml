notes: 'Hugging Face file listing (13,009 files, 1,966,495,492 B): keypoint/{train,validation,test} with
  PNG tiles and JSON annotations (2,443 / 403 / 404) and yolo/{images,labels}/{train,validation,test}
  with the same tiles and YOLO txt labels; splits match the paper. Keypoints were placed by one trained
  annotator with expert spot checks; boxes were generated with SAM2 seeded by the keypoints and reviewed
  (paper), so source is mixed. enricher: voxel size set to null (was 2778 nm): the paper scales images
  to 360 px/mm and splits them into 256 x 256 tiles, but the released tiles are 512 x 512 (two headers,
  keypoints up to 504), so the released pixel size is not established. Licence: CC-BY-4.0 on Hugging Face;
  the GitHub README adds "for non-commercial and academic research use".'
