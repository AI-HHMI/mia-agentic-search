notes: 'Hugging Face file listing (13,009 files): keypoint/{train,validation,test} with PNG tiles and JSON annotations
  (2,443 / 403 / 404 each) and yolo/{images,labels}/{train,validation,test} with the same tiles and YOLO txt labels.
  Splits (2,443 / 403 / 404) match the paper. Keypoints were placed by one trained annotator with expert spot checks;
  boxes were generated with SAM2 seeded by the keypoints and reviewed without edits (paper), so source is mixed.
  Pixel size derived from the paper statement that images were scaled to 360 px/mm (1e6 nm / 360 = 2778 nm); the
  physical magnification and benchtop microscope model are not stated (benchtop camera SeBaCam14C and handheld
  Dino-Lite AM8917MZT per the GitHub README). Licence: CC-BY-4.0 on Hugging Face; the GitHub README adds "for
  non-commercial and academic research use". Total size not computed from the listing.'
