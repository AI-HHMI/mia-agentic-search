  notes: 'Listing: tools/listing.py on the Hugging Face dataset (13,009 files, exact sizes, 1,966,495,492
    B). PNG headers: 512 x 512 RGB uint8 deflate (two tiles). Sample NRC-NEEDL-AI-CAPTURE_1_0_2_0_0.png:
    0-253, mean 66 (one sample); its YOLO txt has 5+ boxes of class 0; JSON has 4 pseudothecia and 9 stoma
