title: NEEDL-Bench - stomata and pseudothecia in Douglas-fir needle microscopy images (Swiss Needle Cast)
short_name: Douglas-fir needle stomata detection (microscopy)
description: 3,250 annotated microscopy tiles (512 x 512 px PNG as released; the paper describes 256 x
  256 tiles) from 1,082 Douglas-fir needles (benchtop camera and handheld Dino-Lite microscope, scaled
  to 360 px/mm) with centroid keypoints and YOLO bounding boxes for two classes, open stomata and stomata
  occluded by Swiss Needle Cast pseudothecia. Train, validation and test splits are provided.
