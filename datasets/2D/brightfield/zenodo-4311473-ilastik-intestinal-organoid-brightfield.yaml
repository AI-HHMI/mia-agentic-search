notes: 'Both zips listed with peek_archive: project 1 has 20 edge-projection PNGs and one 4.7 MB .ilp; project 2 has 20 projection PNGs, 20 Probabilities.h5 and one 782 MB .ilp. The labels are stored inside the Ilastik project files (not opened), so sparse coverage is inferred from how Ilastik training works. Small training set (20 images, one control well), and the images are derived edge/min-intensity projections; the raw screen images are in IDR idr0092 (not in the catalog as of this run). Paper Methods and Data availability read (open access): EVOS2 microscope at 2x magnification, z-stacks with 50 um spacing. Pixel size not stated on the Zenodo page or in the Methods passages read.'
