id: zenodo-4311473-ilastik-intestinal-organoid-brightfield
title: Brightfield intestinal organoid images with Ilastik pixel and object classification training projects
short_name: Intestinal organoids brightfield (Ilastik labels)
description: Two Ilastik projects and their training data for segmenting and classifying mouse small intestine
  organoids in the initial screen of Ostrop et al. 2020. Project 1 (pixel classification, classes Background
  and Object) uses 20 Sobel edge projection PNGs per z-layer summary; project 2 (object classification,
  classes Mislabelled, Organoid, Sphere_big, Sphere_small, Cluster, Debris, AirBubble, Edges) uses minimum-intensity
  projections plus prediction maps (HDF5). The 20 images are the DMSO control well A01 across four plates
  with five timepoints. 405 MB in two zips.
