notes: 'Files (Dataverse datadoi.ee): Ilastik training.zip (540 MB: 196 HDF5 predictions, 218 PNG, 426
  TIFF) and U-Net3 training.zip (776 MB: 573 TIFF = 191 bright-field, 191 flat-field RFP, 191 U-Net3 predictions,
  plus 10 manual PNG masks), plus README.txt. Only the 10 U-Net masks and the Ilastik manual ground truth
  are hand-drawn (sparse pixel labels); the rest of the labels are model predictions (random forest or
  U-Net3) used as training ground truth, so coverage is partial and source mixed. n_items is the 191 aligned
  image pairs of the U-Net archive. Imaging: Cytation 5 (BioTek) plate reader; 20X LUCPLFLN objective
  per the preprint.  Related datasets from the same group: UT-GPCR001 (raw time-lapse, RE-306, no masks),
  UT-GPCR002 (models, 33/430). enricher: voxel size 321.9 nm from the Cytation 5 TIFF metadata (ImageWidthMicrons
  394 / PixelWidth 1224, ImageHeightMicrons 291 / PixelHeight 904; was null).'
