title: UT-GPCR004 CHO-K1 cell line bright-field and fluorescence microscopy and corresponding segmentation ground truth
short_name: CHO-K1 cell segmentation masks (brightfield)
description: Bright-field Z-stacks (with contrast-enhanced projections) and aligned DiI/RFP fluorescence images of
  live CHO-K1-hM4R cells from a Cytation 5 plate reader, with manually drawn cell/background ground truth and
  Ilastik random-forest and U-Net3 derived segmentation labels (including class-balanced multi-class versions). Two
  archives, one per training pipeline; the U-Net3 archive holds 191 aligned bright-field/RFP image pairs and 10
  manual binary masks.
