notes: 'Zip index (59,300 files): images_train 84 JPG, images_test 22 JPG, labels_train 84 PNG, labels_test 22 PNG, plus images/labels_train_patches
  (22,488 each) and _test_patches (7,056 each) PNGs. Zenodo says 106 whole-slide images; the paper (Shahzad et al. 2020) describes
  108 ALL-IDB1 images (2592x1944 from healthy, 1712x1368 from ALL patients, 300-500x magnification microscopes) with 432 masks
  (RBC, WBC, platelet and combined), the extra two images not explained. Masks were designed manually per the paper; the mask
  value encoding of the multi-class PNGs was not opened. Pixel size not stated. Images derive from ALL-IDB1 (Labati et al.),
  whose own terms were not checked; the Zenodo record is labelled CC-BY-4.0. Zenodo record lists no related publication; the
  paper was matched by the description.'
