notes: 'The zip holds 1265 images while the paper and project page cite 928 images with annotations (3734 bacilli); the extra
  images are probably unannotated, which was not checked. Zip listed with peek_archive (jpg + one XML per image, folder named
  after the set). Counts of objects and images in the description come from the project page and the 2016 paper (Annotation
  section). Pixel size, phone model and image resolution not stated on the project page, in the zip listing or in the paper;
  no train/test split is shipped (the paper used a random 50/50 patch split). Licence CC BY 4.0 from the project page footer;
  a third-party mirror (Dataset Ninja) says CC0 1.0 for the combined set, the source page wins. Sibling sets on the same page:
  plasmodium-images (own PR), and the other two phone-camera sets.'
