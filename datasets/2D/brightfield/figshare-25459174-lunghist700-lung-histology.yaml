  notes: 'The only file is LungHist700.rar (670,356,405 B, figshare file listing, so size is confirmed). Our tools cannot
    list or read RAR members. A scratch script read the RAR5 block headers by range requests: first members data/data.csv
    (12,208 B) and data/images/aca_bd/aca_bd_20x_{0,1,10,12}.jpg (0.9-1.4 MB), all compressed (method 3), so no image
    header could be probed; a full header walk was stopped (parser lost sync). Paper (Sci Data 2024, Data Records): 691
    JPEG images of 1200 x 1600 px at 20x or 40x, 7 classes, CSV with patient IDs. Orientation of 1200 x 1600 is not stated,
    so shape is null. No usable sample: TensorSwitch can''t pull members out of a RAR. Voxel size not found; checked:
