notes: 'Figshare lists one file, LungHist700.rar (670 MB); a RAR cannot be listed with peek_archive, so the JPEG format, 691 images
  and the patient-ID CSV come from the paper (Data Records) and the figshare description. Classes (7): normal, and adenocarcinoma or
  squamous cell carcinoma each with well, moderately and poorly differentiated grades. Images are camera photos (Leica DM2000
  with ICC50 W camera) of selected fields, not whole-slide scans; they come from surgical patients, so normal areas are from
  cancer patients. Pixel size is not stated on the figshare page or in the paper. The paper trains with an 80/10/10 patient-wise
  split, but no split is released as files that were seen. Classification labels only, no pixel annotations.'
