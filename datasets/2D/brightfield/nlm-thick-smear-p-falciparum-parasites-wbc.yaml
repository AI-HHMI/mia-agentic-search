    alignment_notes: 'Pairing: GT_updated/<patient>/<image>.txt for <patient>/<image>.jpg (same stem); 53 images have no
      txt (annotation stopped after 200 WBCs). Coordinates are in the stored pixel array: the JPEGs carry EXIF
      orientation 6, and the ReadMe says to read images ignoring the orientation flag so that annotations line up. The
      first line gives n_objects,height,width as 25,4032,3024 (rotated, display frame) while the stored array is
      3024x4032. Rows: id, class, comment, Circle|Point, 2, x, y[, x_edge, y_edge] (circle centre + circumference point).'
  notes: 'Exact listing of the zip index (one file, 3,923,792,228 bytes). Probed and sampled one JPEG (TF100_CS39/
    20170829_205107.jpg, 2.1 MB): 3024x4032x3 uint8 stored, EXIF orientation 6 (portrait, camera SM-G930F), range
    0-255 with 36% zero pixels, from one sample. Read the ReadMe docx inside the
    zip and one annotation txt (1,489 B, 25 objects). Voxel size not found; checked: JPEG EXIF (72 dpi, a default),
