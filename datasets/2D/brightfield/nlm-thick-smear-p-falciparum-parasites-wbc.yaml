short_name: P. falciparum thick-smear images with annotations
description: 1,883 smartphone images (3024 x 4032 RGB JPEG, 100x) of Giemsa-stained thick blood smears from 150 P. falciparum-infected
  patients, with per-image text files marking each parasite and white blood cell as a circle or point; about 85,000 parasites
  were annotated by an expert slide reader. Images past the 200 white-blood-cell count have no annotation file.
