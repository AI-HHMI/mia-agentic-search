notes: 'Listed the zip (3,735 members: 1,883 JPG, 1,830 annotation TXT in GT_updated, 21 Thumbs.db, ReadMe_new_2021.docx), read
  the ReadMe inside it and one annotation file, the NLM datasheet and the IEEE JBHI paper (which reports 1,819 images and 84,961
  parasites, so it does not match the 1,883 JPGs in the zip exactly). The ReadMe says the data is distributed under "a Creative
  Commons Attribution license" with no version, and asks to attribute NLM and cite the paper, so spdx is custom. Annotation
  stopped once 200 white blood cells were counted, so about 53 images have no annotation file; coverage is therefore
  partial. Pixel size is not given; magnification 100x and 3024 x 4032 px come from the paper. Sibling sets in the same
  NLM directory (P. vivax thick smears, uninfected thick smears) are separate records. organisms: both in every image
  (parasites and human WBCs on one smear). enricher: annotations use the stored (EXIF-unrotated) pixel grid.'
