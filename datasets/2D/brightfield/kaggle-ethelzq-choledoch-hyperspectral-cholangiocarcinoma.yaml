title: Microscopic Hyperspectral Choledoch Dataset
short_name: Cholangiocarcinoma hyperspectral + RGB (histology)
description: Paired microscopic hyperspectral cubes (1280 x 1024 pixels, 60 bands, ENVI format) and RGB images of bile-duct (choledoch)
  tissue sections, 880 scenes from 174 individuals in the full database, with tumour areas outlined as polygons by pathologists.
  Scenes are grouped as tumour-containing (L), fully tumour (N) and tumour-free (P). The Kaggle copy holds part of the data; the
  complete set needs registration on the authors' site.
