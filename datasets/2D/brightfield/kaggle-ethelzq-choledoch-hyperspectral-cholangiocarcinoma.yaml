notes: 'Kaggle API record (CC BY-SA 4.0, version 11, 103 GB, partial upload per its description) and file listing (API list
  capped at about 2,400 files: Choledoch_RGB L/N/P with 690/49/142 JPEGs; L/L with 482 hyperspectral .raw, 483 .hdr, 113 RGB
  JPEGs and 439 annotation XMLs). One ENVI header (1280 x 1024, 60 bands, int16) and one annotation XML (polygon labelled
  tumour) were read. n_items is the 880 scenes stated on the page, not what is on Kaggle. Both papers are paywalled: only the
  Methods-journal abstract (880 scenes, per-pixel tumour/non-tumour labels) was read via Europe PMC. The IEEE Access DOI is
  given inconsistently, so doi is null for that paper (link kept). The hyperspectral cubes are ENVI .raw/.hdr, which the schema
  has no format for, so formats lists only jpeg. Pixel size, wavelength range and staining are not stated.'
