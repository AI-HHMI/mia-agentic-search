notes: 'Kaggle API record (CC BY-SA 4.0, version 11, 103 GB, partial upload per its description) and file listing
  (Choledoch_RGB L/N/P with 690/49/142 JPEGs; L/L with 421 hyperspectral .raw, 423 .hdr, 439 RGB JPEGs and 439 annotation
  XMLs; N/N 89 cubes, P/P 73 cubes). One ENVI header (1280 x 1024, 60 bands, int16) and one annotation XML (polygon
  labelled tumour) were read. n_items is the 880 scenes stated on the page, not what is on Kaggle. Both papers are
  paywalled: only the Methods-journal abstract (880 scenes, per-pixel tumour/non-tumour labels) was read via Europe
  PMC. The IEEE Access DOI is given inconsistently, so doi is null for that paper (link kept). The hyperspectral
  cubes are ENVI .raw/.hdr, which the schema has no format for, so formats lists only jpeg. Pixel size, wavelength
  range and staining are not stated. enricher: complete bundle listing (3,025 members) gives size_bytes 45.4 GB
  zip (was 103 GB page-stated, uncompressed).'
