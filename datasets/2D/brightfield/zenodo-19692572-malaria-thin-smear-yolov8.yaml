notes: 'Six zip parts (-001 to -006) listed with peek_archive: 4,496 JPEGs in images/ and one YOLO .txt per image in labels/ (sample label read), classes.txt = falciparum, malariae, non_infected_eritrosit, non_infected_leukosit, ovale, vivax. Image counts match the record text (1,046 falciparum, 1,039 vivax, 863 malariae, 415 ovale, 1,133 negative). The parts overlap in folder name, so extract all into one directory. No paper listed on the record or found; annotators, microscope, camera and pixel size are not stated (voxel size null). No train/val/test split provided. Size is the sum of the six parts. enricher: channels 3 (RGB JPEG, probed); notes.json says the labels come from Label Studio. organisms: every image is Homo sapiens blood; the Plasmodium species varies per image (box class), not per folder.'
