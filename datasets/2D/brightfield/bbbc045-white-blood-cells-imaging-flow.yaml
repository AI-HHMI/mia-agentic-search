notes: 'Stained_Montages.zip lists 645 TIFF montages (7.0 GB uncompressed, 1.58 GB compressed), each tiling
  900 cells; n_items counts montages, not single cells (about 580k cell tiles). Stained_Populations.zip
  (591.6 MB) holds the original .cif files, which is a proprietary format. Labels are given by directory
  names derived from fluorescence gating (per the page and paper Methods). Channel count 3 is from ch1/ch3/ch5
  files in the listing (brightfield, darkfield and a fluorescence channel per page); pixel size not stated
  on the page or in the paper text. Some images are partial cells (per page). Page licence is a CC0 waiver
  by Mariam Nassar; the paper itself is CC-BY. enricher: size_bytes from complete listing of all three
  zips (montages, .cif populations, CP features; was the montage zip only).'
