notes: 'Zenodo record is a CC-BY-4.0 snapshot (v.10 zip, 536 MB) of the GitHub repository (MIT code). Paper: 200
  images, 10 manually selected sub-images per image (2,000 crops, 151 x 258 px). enricher: zip index read: data/original2
  200 jpg, data/dataset/STOMA and ERRO 1,000 jpeg crops each, data/deep_learn train (750 + 750) and teste (250 +
  250) crops, so a split is provided. Annotation is crop-level classification, not boxes or masks; detection is
  done with a sliding window over the full images. Pixel size and magnification are not stated in the paper full
  text. Modality brightfield is assumed from the microscope camera setup.'
