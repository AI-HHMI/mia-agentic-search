notes: 'Zenodo record is a CC-BY-4.0 snapshot (v.10 zip, 536 MB) of the GitHub repository (MIT code).
  The zip could not be listed (Zenodo returned 504s for range requests), so contents come from the GitHub
  folder listings (data/original2: .jpg files, listing truncated at 110 of an expected 200; data/dataset:
  folders ERRO and STOMA; data/deep_learn not opened) and the paper (200 images, 5-fold CV, 10 manually
  selected sub-images per image, 2,000 crops). Annotation is crop-level classification, not boxes or masks;
  detection is done with a sliding window over the full images. Pixel size and magnification are not stated
  in the text read. Modality brightfield is assumed from the microscope camera setup. Image counts per
  folder not verified in a file listing.'
