title: Automated Stomata Classification and Detection in Microscope Images of Maize Cultivars
short_name: Maize leaf stomata microscope images
description: 200 microscope images (about 2,565-2,748 x 3,583-3,840 px) of leaf epidermis impressions
  (cyanoacrylate glue on slides) from 20 Zea mays cultivars, with stoma and non-stoma sub-image labels
  (5 stoma and 5 non-stoma regions chosen manually per image, 151 x 258 px windows) used for classification
  and for sliding-window stomata detection. The Zenodo release is a snapshot of the code repository containing
  the data folders (original images in data/original2, labelled crops in data/dataset/STOMA and data/dataset/ERRO).
