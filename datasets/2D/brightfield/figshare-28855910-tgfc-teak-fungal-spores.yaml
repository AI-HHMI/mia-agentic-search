title: 'TgFC: Tectona grandis Fungal Community Dataset'
short_name: Teak leaf fungal spore detection (brightfield)
description: 5,236 images (640x640) of fungal spores from diseased teak (Tectona grandis) leaves collected in Bangladesh,
  covering three taxa (Olivea tectonae, Neopestalotiopsis sp., Colletotrichum siamense), imaged at 40x on a Zeiss
  Primostar 3. Spores are manually boxed with LabelImg in YOLO format, with train/val/test folders (80/10/10).
