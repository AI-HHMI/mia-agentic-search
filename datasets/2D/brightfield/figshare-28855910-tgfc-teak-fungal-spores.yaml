notes: 'Main zip ("TgFC Dataset.zip", 42 MB) listed with peek_archive: 10,473 members (about 5,236 jpg
  + 5,236 YOLO txt + data.yaml). A separate MixedClass.zip (0.8 MB, 30 mixed-class test images) is also
  on Figshare. Organism field left empty: fungal taxa are not in the NCBI-name sense of host organism;
  spore taxa are in the description. Pixel size not stated on the Figshare page or the paper. Total size
  is the 42 MB zip (not set because MixedClass.zip is separate). enricher: size_bytes from complete Figshare
  file listing (both zips); channels 3 from sampled RGB JPEGs (R, G, B differ).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  2 files, 42,790,254 B\n  TgFC Dataset.zip  (41,972,528 B)\n    TgFC Dataset/data.yaml \
      \                YOLO config: nc 3, class names\n    TgFC Dataset/train/images/   4214 .jpg (46.5\
      \ MB)\n    TgFC Dataset/train/labels/   4214 .txt (1.4 MB)\n    TgFC Dataset/valid/images/    512\
      \ .jpg (5.5 MB)\n    TgFC Dataset/valid/labels/    512 .txt\n    TgFC Dataset/test/images/     510\
      \ .jpg (5.6 MB)\n    TgFC Dataset/test/labels/     510 .txt\n      e.g. Colletotrichum siamense_1016_jpg.rf.<hash>.jpg\
      \ / .txt\n  MixedClass.zip  (817,726 B)\n    MixedClass/   30 .jpg  \"Mixed_Class <n>.jpg\", no\
      \ label files\n"
    n_files: 10505
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/58834990::TgFC Dataset/test/images/Colletotrichum siamense_1016_jpg.rf.6d7a1aa45661dd28b1b2613986fce82e.jpg
    - https://ndownloader.figshare.com/files/58834990::TgFC Dataset/test/labels/Colletotrichum siamense_1016_jpg.rf.6d7a1aa45661dd28b1b2613986fce82e.txt
    size_bytes: null
    description: One test image and its YOLO label file (zip members, read by range).
  arrays:
  - role: raw
    path_pattern: TgFC Dataset/{train,valid,test}/images/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 640
    - 640
    - 3
    shape_varies: false
    dtype: uint8
    compression: jpeg
    value_range:
    - 8
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: label
    path_pattern: TgFC Dataset/{train,valid,test}/labels/*.txt
    format: other
    axes: null
    shape:
    - 18
    - 5
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: boxes-table
    classes:
    - id: 0
      name: Colletotrichum siamense
    - id: 1
      name: Olivea tectonae
    - id: 2
      name: Neopestalotiopsis sp.
    alignment: same-grid
    alignment_notes: YOLO txt with the same stem as the image; one row per box (class id, x_center, y_center,
      width, height), coordinates normalized to [0, 1] of the 640x640 image. Class ids index data.yaml
      names.
  - role: raw
    path_pattern: MixedClass/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 720
    - 1280
    - 3
    shape_varies: null
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  notes: 'listing.py on the Figshare API (expand-zips): 2 files, 42,790,254 B exact, 10,503 zip members,
    complete; 4214/512/510 train/valid/test images (5,236 total) each with a .txt label of the same stem.
    File names contain ".rf.<hash>" (a Roboflow-style export). data.yaml read: nc 3, names [Colletotrichum
    siamense, Olivea tectonae, Neopestalotiopsis sp.]. One label file read: 18 rows x 5 columns, all class
    0, values in [0, 1]. sample: two 640x640x3 uint8 RGB JPEGs (ranges [8, 255] and [9, 255], mean ~98.6,
    std ~8.3); one MixedClass JPEG 720x1280x3 uint8 [0, 255]. MixedClass.zip has no label files in the
    listing. shape_varies false for TgFC images is from 2 samples plus the paper''s 640x640 statement.
    Values are from these samples only. Label files are plain text, so dtype is unknown.'
