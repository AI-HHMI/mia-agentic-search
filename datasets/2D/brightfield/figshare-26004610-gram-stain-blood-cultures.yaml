      name: microorgansim
    alignment: same-grid
    alignment_notes: COCO bbox [x, y, w, h] in image pixels; the images entries record width 5472 and
      height 3648 for all 505 images, matching the JPEG shape, and are keyed by file_name. Per-image copies
      are in split_annonation_DoubleCheck/<stem>.json.
  notes: 'Figshare API listing: 8 files, 1,423,851,148 B exact; the image zip holds 505 JPEGs and the
    split zip 505 per-image JSONs (1,011 zip members incl. 1 OS metadata file). probe.py on sa_04.jpg:
    3648x5472x3 uint8 baseline JPEG (lossy). sample.py cannot open zip members behind the extensionless
    ndownloader URL, so a short scratch script range-read the same member with tools/peek_archive (2,606,945
    B) and measured RGB min/max per channel R 108-255, G 48-255, B 133-251, mean 225 (bright background).
    Values are from one image. Consolidated DoubleCheck COCO JSON read in full: 505 images (all 5472x3648),
    7,528 annotations, all isbbox true, one category ("microorgansim"). The description''s Gram classes
    and species presumably come from the file-name prefix and the xlsx, which was not opened. The annotator1/annotator2
    JSONs were not parsed. The shipped .py visualizer was not run.'
