notes: 'Image zip listed with peek_archive (505 jpg, 1.4 GB); annotation zip lists 505 per-image JSONs.
  Figshare lists CC BY 4.0, although the Scientific Data article page links CC BY-NC-ND 4.0 (that is the
  article license). Paper reports a YOLOv10 baseline but states no official train/val/test split. Author
  listed on Figshare as a single name "Yi"; the full author list is in the paper. Species abbreviations
  map to metadata in PBCs_microorgansim_information.xlsx. Pixel size not stated. enricher: size_bytes
  from the complete Figshare file listing, 8 files (was 1,416,965,387, image zip only); channels 3 (RGB
  JPEG, was null). The consolidated COCO JSON has a single category "microorgansim", so box-level Gram
  classes are not in the COCO file itself.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  8 files, 1,423,851,148 B\n  PBCs_microorgansim_image.zip                 (1.4 GB)\n   \
      \ PBCs_microorgansim_image_review/   505 .jpg   <species abbrev>_<nn>.jpg, e.g. sa_04.jpg\n  split_annonation_DoubleCheck.zip\
      \             (650,837 B)\n    split_annonation_DoubleCheck/      505 .json  per-image COCO, same\
      \ stem as the image\n  PBCs_microorgansim_annonation_DoubleCheck.json   (2.1 MB, consolidated COCO)\n\
      \  PBCs_microorgansim_annonation_annotator1.json    (1.7 MB)\n  PBCs_microorgansim_annonation_annotator2.json\
      \    (2.4 MB)\n  PBCs_microorgansim_information.xlsx              (species metadata)\n  COCO_Annotation_Visualizer.py\
      \ + README_COCO_Annotation_Visualizer.txt\n"
    n_files: 8
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/48632287::PBCs_microorgansim_image_review/sa_04.jpg
