title: An annotated dataset of gram stains from positive blood cultures
short_name: Blood-culture Gram stain detection (brightfield)
description: 505 high-resolution (5472x3648) brightfield images of Gram-stained smears from real positive blood cultures
  covering 57 bloodstream-infection pathogens, with 7,528 bounding boxes (COCO JSON) drawn by two independent annotators
  and cross-checked, classed as Gram-positive cocci in clusters, cocci in chains/pairs, Gram-negative rods and fungi.
  Imaged on a Nikon Eclipse 80i with a TUCSEN FL 20 camera.
