notes: 'Dataset Cplt.zip holds six family zips (Psychodidae 2.25 GB, Culicidae 243 MB, Calliphoridae 21 MB, Ceratopogonidae
  12 MB, Tabanidae 12 MB, Muscidae 7 MB). 2,399 pictures and 18 genera from the paper. Species labels assigned by trained
  entomologists. Companion figshare item 22083050 (Glossinidae and Culicidae, 2.8 GB, CC BY 4.0) not a separate record. Pixel
  size not stated; magnification adjusted per wing to give constant-size pictures (paper). The one Tabanus wing shows no pattern
  (paper). enricher: formats jpeg (was other; RGB JPEGs found three zip levels deep); size_bytes = exact figshare listing
  incl. the xlsx; channels 3. organisms: one per family zip (Culicidae.zip, Calliphoridae.zip, Muscidae.zip, Tabanidae.zip,
  Ceratopogonidae.zip, Psychodidae.zip).'
