title: An exhaustive dataset of Diptera Wing Interferential Patterns (WIPs)
short_name: Diptera wing interference patterns (microscope)
description: 2,399 pictures of wing interferential patterns (thin-film colour patterns on cleared wings) of dipteran insects
  of medical interest from 6 families and 18 genera, imaged on slides with a Keyence VHX 1000 microscope using HDR. Each picture
  is labelled with family, genus and species-level class in an accompanying spreadsheet.
