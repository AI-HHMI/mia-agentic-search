notes: 'Dataset Cplt.zip (peek_archive) contains six nested family zips (Psychodidae 2.25 GB, Culicidae 243 MB, Calliphoridae 21 MB, Ceratopogonidae 12 MB, Tabanidae 12 MB, Muscidae 7 MB); the image file format inside them was not listed, hence formats other. 2,399 pictures and 18 genera from the paper. Species labels were assigned by trained entomologists. A companion figshare item 22083050 (Dataset restrcitedGC.zip, Glossinidae and Culicidae, 2.8 GB, CC BY 4.0) holds selected genera and was not made a separate record; the paper presents this one as completing it. Pixel size not stated; magnification adjusted to give constant-size pictures. The one Tabanus wing shows no distinguishable pattern (paper).'
