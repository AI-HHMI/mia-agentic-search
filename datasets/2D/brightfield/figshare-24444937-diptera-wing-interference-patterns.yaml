  notes: 'Exact figshare listing (2 files). The family zips inside Dataset Cplt.zip are deflated, so their members cannot
    be read by range request; I read the two smallest whole (Muscidae.zip 6.7 MB, Tabanidae.zip 11.7 MB) in memory: each nests
    genus zips, then class zips, then JPEGs. Sampled 4 JPEGs: RGB uint8, 634x1280, 730x1380, 578x1352, 596x1374 (shapes vary),
    range 0-255, 72 dpi default tag (no calibration). TensorSwitch cannot reach these JPEGs (nested deflated zips), so no
