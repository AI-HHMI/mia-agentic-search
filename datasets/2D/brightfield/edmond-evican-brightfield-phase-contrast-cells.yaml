id: edmond-evican-brightfield-phase-contrast-cells
title: 'EVICAN: Expert visual cell annotation, brightfield and phase-contrast images of 30 cell lines'
short_name: EVICAN cell and nucleus segmentation (BF/PhC)
description: 'Partially annotated grayscale brightfield and phase-contrast images of 30 adherent cell lines, acquired on four microscope setups in three laboratories (10x-40x objectives). Cells and nuclei were manually outlined by cell-culture experts on matched fluorescence overlays (CellMask Orange membrane, DAPI nuclei); about 3-10 cells and nuclei are annotated per image (52,959 instances in 4,640 training/validation images). Annotations are COCO-style JSON polygons (EVICAN2: cell/nucleus; EVICAN60: per-cell-line classes) plus binary mask images. Three fully annotated evaluation sets of increasing difficulty (98 images) are included.'
