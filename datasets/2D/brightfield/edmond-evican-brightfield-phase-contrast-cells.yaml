notes: 'Edmond landing page could not be fetched this run (bot-protection "Anubis" access denied), so file listing, sizes, exact file names and the dataset DOI were not verified; everything comes from the open-access paper full text (Europe PMC), which states the CC-BY license, the Edmond URL, formats (JPEG images, JSON annotations, binary mask images) and counts. n_items = 4,640 train/val images + 98 evaluation images. Images are only partially annotated (3-10 cells/nuclei per image); the paper blurs unannotated regions for training. Pixel size not stated in the paper (objectives 10x-40x only); organism not recorded as a single species because the 30 cell lines are of mixed (not enumerated here) origin.'
