notes: >-
  The zip (ds1.zip, 2.27 GB) could not be listed remotely: the server answers without range support (accept-ranges: none), so the folder structure and class counts come from the paper's data-structure table
  (img 300, bin_mask 300, mult_mask 300 TIFFs). Pixel size is not stated in the paper or record; the setup is described (Olympus BX41F, 20x/0.4 objective, 0.5x C-mount, Infinity 3S-1UR camera).
  This is the latest of three RODARE versions (2473, 2562, 2563); concept DOI 10.14278/rodare.2472. Masks are semantic (class per pixel); instances can be derived as connected components, per the paper. No train/test split in the record.
