notes: 'Zip layout (peek_archive): {train,val,test,Unseen_annotation}/{images,masks}/ with 717/153/153/134 PNG images and same-named mask TIFFs (1,157 pairs, 7.1 GB uncompressed).
  The 2021 Scientific Reports paper (SpheroidPicker, Grexa et al.) describes an earlier set of 981 brightfield images (1920x1080 RGB, 1,871 annotated
  objects, 70/15/15 split, annotated in ImageJ by expert biologists) and says annotated data are available on request; this Zenodo record is a later, larger
  release (1,023 + 134 images) by Grexa, Horvath and Diosdi, and no paper describing exactly this release was found, so the paper link is to the original SpheroidPicker
  work. Pixel size is not stated for this release (the paper gives 0.775751 um/pixel only for its separate fluorescence images). Organism and annotator details for this release are not stated (organism left empty). Some images
  appear to come from a different screen (1screening_* file names, ~6 MB PNGs).'
