title: SegPC-2021 - Segmentation of Multiple Myeloma Plasma Cells
short_name: Myeloma plasma cell segmentation (brightfield)
description: 497 brightfield microscopy images of Jenner-Giemsa stained bone-marrow aspirate slides from multiple myeloma
  patients (stain-colour normalised, 2040x1536 Olympus or 2560x1920 Nikon), from the ISBI 2021 SegPC challenge. Each image has
  a semantic mask (background, cytoplasm, nucleus) and an instance mask for the designated cells of interest. This Hugging Face mirror
  holds the 298 train and 199 validation images; the challenge test split with withheld ground truth is not included.
