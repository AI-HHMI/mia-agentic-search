  notes: 'Sampled one shard (train-00000-of-00007.parquet, 199.8 MB) and decoded embedded PNGs with a stdlib reader (no parquet
    library): 172 PNGs = 43 rows x 4 image columns (row groups of 21+22 rows). image: RGB uint8; mask and instance_mask: grey
    uint8; overlay: RGB at half size (1280x960 / 1020x768), not an array here. Value ranges from 4 decoded rows of this one
    shard (image 21-216 and 1-231; mask 0-2; instance ids up to 10), so other shards may differ. Size from the HF file listing
    (exact). Voxel size not found; checked: dataset card, datasets-server schema, challenge paper
    (abstract only, not OA), IEEE DataPort page and its readme.txt, grand-challenge page, PCSeg paper (PLoS ONE 2018: 1000x
    magnification, Nikon Eclipse-200, no pixel size). Parquet is not a format TensorSwitch reads; the original BMPs sit behind
    an IEEE login (TCIA_SegPC_dataset.zip, 4.49 GB).'
