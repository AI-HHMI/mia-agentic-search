notes: 'Third-party Hugging Face mirror of the ISBI 2021 challenge data; the card cites the originals (IEEE DataPort
  DOI 10.21227/7np1-2q42, Kaggle sbilab/segpc2021dataset), which were not fetched, so the DOI is left null. The
  mirror turns the one-BMP-per-cell masks into per-image semantic and instance masks. Ground truth covers only designated
  cells of interest (coverage partial); the winning-team paper (arXiv 2111.05125) calls the labels semi-automatic
  and noisy. The challenge paper is not open access (abstract only): 775 images released, the mirror has 497 with
  ground truth. The card warns the Nikon images overlap MiMM_SBILab. Pixel size is not stated in the card or abstract.
  Parquet is not a listed format, hence other.'
