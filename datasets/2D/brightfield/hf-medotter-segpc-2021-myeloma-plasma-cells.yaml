notes: 'Third-party Hugging Face mirror of the ISBI 2021 challenge data (originals: IEEE DataPort DOI 10.21227/7np1-2q42,
  login required; Kaggle sbilab/segpc2021dataset); DOI left null because it names the original, not this mirror. The mirror
  turns the one-BMP-per-cell masks into per-image semantic and instance masks. Ground truth covers only designated cells of
  interest (coverage partial, per the IEEE DataPort readme); the winning-team paper (arXiv 2111.05125) calls the labels semi-automatic
  and noisy. 775 images released; the mirror has the 497 with ground truth (train 298, validation 199). The card warns the
  Nikon images overlap MiMM_SBILab. Pixel size is stated nowhere checked (only 1000x magnification for the Nikon setup, PCSeg
  paper). Parquet is not a listed format, hence other. enricher: dtype, PNG encoding and value ranges from one sampled shard.'
