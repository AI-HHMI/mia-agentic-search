title: 'OrganoID: manually segmented brightfield and phase-contrast organoid images with gemcitabine time-lapse
  screen'
short_name: Organoid segmentation (brightfield, phase)
description: 'Manually segmented organoid images used to train and test OrganoID: 66 original brightfield/phase-contrast
  images of human pancreatic ductal adenocarcinoma organoids (52 training and 14 validation pairs, stored
  as augmented PNG crops), a human test set of 28 images (PDAC, adenoid cystic carcinoma, colon and lung
  organoids, 6 per tissue type), a mouse small-intestine organoid set (train/validation/test PNG pairs),
  plus a 42-position gemcitabine dose-response time-lapse (brightfield and propidium iodide TIFFs with
  OrganoID label TIFFs and overlay GIFs).'
