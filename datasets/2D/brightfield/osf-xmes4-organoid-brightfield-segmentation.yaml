notes: 'Single zip Dataset.zip (3.6 GB, 5,395 files) on OSF, listed with peek_archive: OriginalData/{training,validation,testing}/{images,segmentations}
  (2,000 + 14 + 28 PNG pairs, training pre_augmented/ has 52), MouseOrganoids/{training,validation,testing}
  (500 + 4 + 4 pairs), GemcitabineScreen/{BF,PI,OrganoIDProcessed} (42 positions, ~40 MB TIFFs each).
  n_items counts all files. No license is stated for the data: the OSF project has no license field and
  the paper says the platform is "freely licensed" on GitHub without naming one (GitHub license not readable
  from this session), so spdx unknown. Pixel size and objective not found in the paper text searched.
  Gemcitabine-screen labels are model output (OrganoIDProcessed), not manual, so only the OriginalData
  and MouseOrganoids pairs are manual ground truth.'
