description: 976 brightfield PNG micrographs of 14 diatom species (Eunotia, Fragilariforma, Gomphonema,
  Stauroneis, Luticola, Nitzschia, Sellaphora) covering different life-cycle stages, split into train,
  validation and test folders with the species as the class folder, plus 904 binary valve masks.
