notes: 'Zip listed with peek_archive: 1,880 PNG (50 MB) in dataset/{train,val,test}/<NNN_Genus_species>/, 14 class folders; per-split image counts were not tallied. The figshare description says the images come from Blanco 2018 (figshare 7077725; brightfield and oblique, 60x, 7.91 px/um), the DIADIST diatom size-reduction sets (Mann and Bayer) and Mann et al. 2004 (Sellaphora pupula complex), so pixel size varies by source and is not stated for the whole set. No paper is listed on the record; an LNCS chapter, Diatom Classification Including Morphological Adaptations Using CNNs (10.1007/978-3-030-31332-6_28), reports a 14-class set of 1,085 images, so its link to this 1,880-image set is unconfirmed. Figshare 7077725 (4 species, TIFF) is one of the source sets.'
