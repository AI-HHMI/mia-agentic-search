notes: 'Zip: 976 images in dataset/{train 780, val 97, test 99}/<NNN_Genus_species>/ and 904 masks in
  masks/. The figshare description says the images come from Blanco 2018 (figshare 7077725; brightfield
  and oblique, 60x, 7.91 px/um), the DIADIST diatom size-reduction sets (Mann and Bayer) and Mann et al.
  2004 (Sellaphora pupula complex), so pixel size varies by source and is not stated for the whole set.
  No paper is listed on the record; an LNCS chapter, Diatom Classification Including Morphological Adaptations
  Using CNNs (10.1007/978-3-030-31332-6_28), reports a 14-class set of 1,085 images, so its link to this
  set is unconfirmed. enricher: masks/ found (n_items 1880 -> 976 images; segmentation added); mask provenance
  not documented. organisms: each species = its class folder <NNN_Genus_species>/ and masks/<NNN_Genus_species>_*.'
