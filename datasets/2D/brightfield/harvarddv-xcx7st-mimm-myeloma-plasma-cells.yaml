notes: 'Dataverse lists 85 BMP images (14.7 MB each, 2560x1920) plus one PDF of 13.3 MB; CC0 1.0. The only annotation is a PDF marking plasma
  cells per slide, not machine-readable masks, so the training signal is weak and masks would need to be extracted by hand. data.formats
  is other because BMP is not a listed format. Paper (a conference abstract in Clin Lymphoma Myeloma Leuk) has no open full text, so pixel
  size, annotation procedure and cell counts are not stated; sources checked: Dataverse metadata, Crossref, Europe PMC. Authors not listed
  on the Dataverse record. Related TCIA collection of the same slides was not reachable (404).'
