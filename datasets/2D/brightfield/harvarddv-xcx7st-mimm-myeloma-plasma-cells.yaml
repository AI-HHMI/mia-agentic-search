  notes: 'File list from the Dataverse dataset API (86 files with exact sizes; tools/listing.py does not read Dataverse). Header of 101.bmp:
    BMP v3 (40-byte info header), 2560x1920, 24 bpp, uncompressed, bottom-up rows, BGR byte order, pixels-per-metre 0 (no calibration).
    Sampled 101.bmp (14.7 MB, parsed with numpy): min 12 max 220 over all channels, channels differ (true colour). value_range is from
