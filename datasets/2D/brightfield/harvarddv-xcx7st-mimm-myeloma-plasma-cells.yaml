notes: 'Dataverse lists 85 BMP images (2560x1920, 24-bit) plus one PDF (13.3 MB); CC0 1.0. The only annotation is a PDF marking plasma
  cells per slide, not machine-readable masks, so the training signal is weak and masks would need to be extracted by hand. data.formats
  is other because BMP is not a listed format. Pixel size not stated (Dataverse, CLML abstract, PCSeg paper). enricher: annotations.source
  manual (Dataverse: plasma cells marked by the expert pathologist; was unknown); size from the Dataverse file list (was page-stated
  1.267 GB); channels 3 (RGB BMP, was null); added the PCSeg PLOS One paper (PMC6291116) that the dataset page asks users to cite;
  authors from Dataverse.'
