notes: 'Dataset page states ~14 TB and 4,351,097 files; image count not given. Pixel size, image dimensions and the names of the seven classes are not on the dataset page, file listing or the paper abstract; the full text of the preprint (medRxiv) and journal version (Trans R Soc Trop Med Hyg) is not open access, so Methods could not be read. Labels sit in labels/ and are matched to images in clinical_pf/ and cultured_pf/ by file name; synthetic_data/ holds composite images made from cell thumbnails. Only a subset of images is annotated; labels_plus flags machine-generated labels. Related but distinct label-free P. falciparum studies exist in the archive (S-BIAD43 etc.). enricher: size_bytes 14 TB from page (~14TB, approximate; was null); formats + zarr (full runs are .zarr.zip, probed). organisms: P. falciparum infected human RBCs share every image (clinical_pf/, cultured_pf/, synthetic_data/); donated_non_endemic/ is Homo sapiens only.'
technical:
  method: sample
  size_source: page-stated
  layout:
