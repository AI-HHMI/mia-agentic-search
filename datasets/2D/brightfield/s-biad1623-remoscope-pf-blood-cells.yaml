    alignment_notes: 'YOLO txt, one row per box: class index, x_center, y_center, width, height normalised to image size; label file images/<stem>.png <-> labels/<stem>.txt (same stem, sibling folders). Seven classes per BIA; names not stated in sources read. yogo_labels/ alongside holds the same rows at full float precision (all subsets).'
  notes: 'Listed one labelled run in full (600 files, 69.5 MB, http-index sizes) and browsed the top folders; a full listing (4.35M files, ~14 TB) was not attempted. Full unlabelled runs (clinical_pf/tororo_*/<scope>/<date>/<run>_/<run>_.zarr.zip) are not a listed array: zarr v2 in zip, axis names not stated. Probed img_00216.png (772x1032 uint8 gray, deflate) and one run .zarr.zip (.zarray: shape [772,1032,20000] u1, no compressor; 12162 members, 9.7 GB). Sampled one PNG: value range [53,255] from one sample, mean 219.7. Label txt: 52 boxes, class ids 0 and 6. Voxel size not found; checked: PNG header, zarr .zarray (no .zattrs), run exp__metadata.csv (operator, scope, camera AVT, exposure only), BIA API REMBI image acquisition (no pixel size), paper (not open access: Europe PMC/bioRxiv abstract only), yogo GitHub README/docs. Class names (7) not found in the same sources. No single archive for the whole dataset: download_url stays the FTP folder; direct per-file https links exist (see sample). labels/ top folder (all-human-labelled...) uses run folders whose images are elsewhere in the tree; only the subsets_used_for_labelling pairing (sibling images/ + labels/) was verified.'
