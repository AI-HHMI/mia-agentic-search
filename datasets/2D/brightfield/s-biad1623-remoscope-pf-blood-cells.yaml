title: Remoscope label-free images of live P. falciparum in whole human blood, cultured and clinical samples
short_name: Remoscope P. falciparum blood cells (label-free)
description: Label-free near-UV brightfield images of unstained, flowing whole blood (clinical samples from Tororo, Uganda, cultured Plasmodium falciparum, healthy non-endemic donors) collected on the Remoscope imaging cytometer, about 14 TB in total. Human-drawn YOLO-format bounding boxes (seven classes) for cultured and clinical parasites and red blood cells are provided alongside synthetic composite images, with a variant of the labels flagging machine-generated versus human-verified boxes.
