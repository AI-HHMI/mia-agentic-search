  notes: 'The Mendeley files API (fetched this run) lists parasitoBank.zip, 1,026,661,553 B (= size_bytes,
    page-stated). The zip is served from S3 with range support. Its directory, read with a short zipfile
    script, has 779 JPEGs + ParasitoBank.json. I read the whole COCO JSON by range (256,738 B in total):
    779 images, 1,620 annotations, 13 categories. Boxes per category: blastocystis 403, endolimaxNana
    326, giardia 209, chillomastix 193, entamoebaColi 149, entamoebaHart 135, iodamoeba 62, ascaris 57,
    coccidia 44, strongyloides 17, tricocefalo 10, complejoEntamoeba 10, taenia 5. Probed one image: 2035x2168x3
    uint8 JPEG. sample.py cannot open zip members behind an extension-less S3 URL, so no pixel values
    were measured.'
