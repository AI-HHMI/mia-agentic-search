notes: 'Single zip parasitoBank.zip (1.03 GB) with an images folder and a COCO JSON, per the Mendeley
  description and paper; the server gave no size for range requests, so the zip contents could not be
  listed and annotations_verified is false. Counts (779 images, 1,620 parasites: 1,531 protozoa, 89 helminths)
  are from the paper. Images were taken with a Motorola G84 phone through a Nikon Alphaphot-2 microscope
  eyepiece at 40x; brightfield is assumed from this (paper says optical microscopy), pixel size not stated.
  Organism list is the species rows I read in the paper table (list may be incomplete: Entamoeba complex
  and intestinal coccidia not included). 3-channel colour assumed from RGB JPG phone images. Mendeley
  is not in the schema repository list, hence repository other. enricher: zip listed by range and COCO
  JSON read (779 images, 1,620 boxes, 13 categories), so annotations_verified is now true.'
