title: 'UFSC OCPap: Papanicolaou Stained Oral Cytology Dataset'
short_name: Oral cytology nuclei, Papanicolaou (brightfield)
description: Papanicolaou-stained oral brush cytology images (1200x1600 px patches cut from whole-slide scans) from 5 cancer-diagnosed and 3 healthy patients, with pixel masks (background plus six nucleus types), COCO annotations and bounding boxes. Five specialists labelled with LabelMe/LabelBox, with a pathologist reviewing 35 percent. Provided as images.zip (train/val/test JPEGs), binary and multiclass masks, and binary and multiclass COCO JSON.
