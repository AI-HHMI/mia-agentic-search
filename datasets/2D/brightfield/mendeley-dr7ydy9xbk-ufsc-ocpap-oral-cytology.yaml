notes: 'Files (Mendeley API, 6 zips, ~2.08 GB total): images.zip 1555 MB (6803 JPEGs in train/val/test
  folders), nuclei_images.zip 443 MB, binary_masks.zip, multiclass_masks.zip (3577 PNG + 5336 TIFF members),
  binary_coco_annotations.zip and multiclass_coco_annotations.zip (JSON per split). The page text says
  9,797 labeled images and gives split counts that do not sum to that; n_items is the 6803 JPEGs listed
  in images.zip. Pixel size 0.111 um from the page (slide scan). Magnification and a related paper are
  not stated on the page; a Europe PMC title search found no paper, so no publication is listed. Species
  not stated explicitly (hospital oral brush samples from patients); recorded as Homo sapiens. Individual
  download URLs are per zip (redirect to S3); no single archive, so download_url is the landing page.
  License CC BY-NC 3.0 (non-commercial).'
