notes: 'Author names as given in the Zenodo readme (surnames only). Each of the six site zips (M1-M6)
  holds, per slide, an annotations.csv, a labels.csv and one vignette TIFF per annotated valve (13,461
  zip members in total, 36 of them CSVs; listed with peek_archive for all six zips, CSV content read for
  M6 only). Labels include taxon names and a "fragmented" class. Pixel size, scanner/objective and the
  number of annotated valves per taxon are not stated on the Zenodo page, readme or archive listing; the
  Water paper (not open access in Europe PMC) and its MDPI/preprint/repository pages returned 403 or a
  bot check, so its Methods could not be read. Zenodo licence field is cc-by-4.0. enricher: size_bytes
  239,412,740 from the full Zenodo listing (was 239.5 MB rounded); channels 1 (single-sample palette TIFFs).
  Distinct from zenodo-7079005 (Menne virtual-slide segmentation tiles) although from the same group.'
