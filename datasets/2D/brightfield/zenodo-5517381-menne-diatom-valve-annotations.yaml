title: Menne River diatom valve vignettes with species labels (BIIGLE annotations of digital light microscopy slides)
short_name: Menne River diatom valves, species labels (LM)
description: Cropped image vignettes (TIFF) of individual diatom valves from triplicate slide scans of six benthic samples of the Menne River (karst area, May 2020), with BIIGLE annotation tables giving each valve's bounding box and taxon label (e.g. Achnanthidium minutissimum, Encyonema minutum, 'fragmented'). Supplementary data of a study comparing traditional and digital light microscopy for diatom surveys; the record states the images can serve as training data for deep-learning diatom identification.
