description: 62 hyperspectral microscopy images (450-750 nm, 61 bands, 10x, 3088 x 2064 px) of H&E-stained
  lung squamous cell carcinoma sections from 10 patients, with pathologist tumor-region masks and cell-level
  four-class pixel masks (tumor cells, non-tumor cells, non-cell regions, background). Includes 40x whole-slide
  scans, calibration references and synthesised RGB images.
