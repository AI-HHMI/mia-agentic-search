notes: 'Ten per-patient zips (P1-P10, 16.5 GB total per the figshare file list). Only P10.zip was listed
  (peek_archive): 3 ROI folders, each with Raw + Raw.hdr (388.8 MB ENVI cube), Label.png, Cell-level Label.png,
  rgb.png, plus shared white/dark references and a 40x whole-slide TIFF; other patients assumed alike
  (paper Data Records). formats lists png and tiff because the ENVI cubes are not in the format enum.
  Paper gives FOV about 741 x 495 um but no HMI pixel size, so voxel_size_nm is null. Cell-level masks
  are semi-automatic (K-means clusters assigned by two pathologists), hence source mixed; they are pixel-level
  semantic labels, not instances. No train/test split. Figshare lists two authors; the paper has the full
  list. enricher: complete figshare listing confirms 16,526,607,358 B and 62 ROI folders across P1-P10
  (other patients no longer assumed).'
