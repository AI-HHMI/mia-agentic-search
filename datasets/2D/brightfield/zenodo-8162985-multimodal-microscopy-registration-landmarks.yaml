title: Unsupervised microscopy image registration datasets (HeLa, skin tissue, renal cancer tissue) with landmark annotations
short_name: Multimodal registration landmarks (HeLa, tissue)
description: Paired multimodal microscopy images of HeLa Kyoto cells (fluorescence and brightfield), IHC-stained skin tissue and H&E-stained renal cancer tissue, imaged with a screening microscope and a laser microdissection (63x) microscope, for training and benchmarking multimodal image registration. Manually placed corresponding landmark points per image pair give the ground-truth alignment. Released with the SuperCUT registration paper.
