notes: 'Zenodo page (3.1 GB: HeLa.zip, Skin_tissue.zip, Renal_cancer_tissue.zip) gives no modality or counts; these come from zip listings (peek_archive) and the SuperCUT paper (PMC10938542). Each zip has registration/ (screening-microscope PNGs), lmd63x/ (63x laser-microdissection images, BMP in HeLa and skin, PNG in renal) and annotations/ (.mat landmarks). Annotated pairs counted from .mat files: HeLa 119, skin 79, renal 107 (n_items=305; skin has 107 registration PNGs but 79 .mat files). Paper: landmarks were marked with the MATLAB Control Point Selection toolbox (at least 3 per pair), 80%/20% train/test used in the paper but no split files seen, so splits_provided=false. The paper also uses a STORM-confocal dataset that is available on request and is not in this record. Pixel size not found on the Zenodo page or in the paper text read; .mat contents not opened. Dataset is images plus alignment landmarks, not segmentation.'
