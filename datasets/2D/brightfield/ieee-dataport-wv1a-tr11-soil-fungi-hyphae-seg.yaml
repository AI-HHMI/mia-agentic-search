notes: 'Single 16.42 GB archive (central-texas-fungi-segmentation-2025.tar_gz) per the landing page; archive
  not listed. The page says it needs an IEEE DataPort subscription and login, so access is recorded as
  registration but a paid subscription may be required: reviewer should confirm. Page lists data formats
  .mat, .png, .jpg and .exr; formats here lists only png and jpeg, since .mat and .exr are not in the
  schema list and other may not sit next to known formats. Image count ("hundreds"), image dimensions
  and pixel size are not stated on the page; a stage-micrometer calibration folder is included (1 tick
  = 10 um). Some frames were extracted from video. Only 10x replicate A samples carry 10x labels; all
  40x samples are labelled. The linked paper is a Goldschmidt 2025 abstract; Crossref/Europe PMC gave
  no full text or abstract. enricher: license.url set to the landing page, which states CC-BY 4.0; files
  not inspectable without login.'
