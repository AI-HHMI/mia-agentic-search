notes: 'Zip listing: 4,941 originals plus 4,941 cropped_resized copies, metadata.csv and train/val/test CSVs (filename, mold, food, phone, microscope); image-level labels only. License CC-BY-4.0 from the Zenodo record; the arXiv paper does not state it. Labelling procedure not described: mold images were taken after incubation, baseline images before. Pixel size not stated on the record, project page or paper (resized to 224x224 for baselines), so voxel size is null. 1,842 mold / 3,099 no-mold images, 8:1:1 split. Smartphone clip-on microscopy of food surfaces; mould species not identified.'
