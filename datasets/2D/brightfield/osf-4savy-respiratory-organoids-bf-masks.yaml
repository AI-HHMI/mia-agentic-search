title: Respiratory (nasal and lung) organoid bright-field images with binary masks
short_name: Respiratory organoid masks (brightfield)
description: 827 bright-field images (PNG) of human nasal organoids and hiPSC-derived lung organoids with
  manually drawn binary organoid masks (LabelMe polygons by two annotators, consensus used). Images are
  extended-focus stitched bright-field images from a Lionheart FX at 4x. Split into 703 train, 83
  validation and 41 test image/mask pairs.
