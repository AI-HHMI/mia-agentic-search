notes: 'Hosted in an OSF project that the API reports as not public (public: false); the files are reachable
  only through the view-only link given in the paper, and the project could disappear or require access
  later. License MIT is stated in the paper Data Availability and by the OSF project metadata. File counts
  and sizes come from the OSF files API (703+703, 83+83, 41+41 PNGs, about 120 MB; a RAW folder under
  Datasets/ was not listed and is excluded). Image dimensions and bit depth of the PNGs were not checked;
  the paper states 2.0 um/px for the stitched extended-focus images (2100 x 2100 px) and the original
  tiles are 1224 x 904 px 16-bit TIFF, so the 2000 nm pixel size is taken from the paper and may not apply
  to cropped tiles. The paper states a 85/10/5 split matching the folders. No DOI for the dataset; no
  direct download URL (OSF file links need file ids). Checked: OSF project and files API, paper full text
  (Europe PMC).'
