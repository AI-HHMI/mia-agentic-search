notes: 'Mendeley file listing could not be read (public API returned an empty list), so total size, tile
  and box counts are not known; annotation files are described in the paper (Data in Brief). Pixel size
  0.23 um per pixel is from the paper. Virtual slides are NDPI (Hamamatsu, not in the format list), tiles
  are JPEG, with trained YOLOv5x model files and CSV tables. Only tiles containing the target species
  are annotated, one class, so counts of other taxa are not labelled (coverage partial). Paper: 80/20
  train/validation split used for models, no split files confirmed. Mendeley DOI in the paper is 10.17632/457x9c7rp3.2
  (page shown is version 3). enricher: file counts and size from the Mendeley API (were null); labels
  seen.'
