notes: 'Single file "Parasite Data Set.rar" (164 MB). RAR archives cannot be listed
  with peek_archive, so the folder layout, image format and label files were not seen.
  Class labels are inferred from the per-class image counts in the dataset description;
  no segmentation masks or boxes are mentioned. No dedicated paper found: PMC8886013
  is a review that lists this dataset in Table 1 and states only the 400X/1000X bright-field
  acquisition and per-class labels. Pixel size, microscope model and host species
  are not stated on the page or in the review. Organism entries are genus names taken
  from the description (Trypanosome, Trichomonad); species are not given except T.
  gondii.'
