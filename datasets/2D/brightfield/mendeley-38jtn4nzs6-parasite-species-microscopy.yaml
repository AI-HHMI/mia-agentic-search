  notes: 'Inspected by HTTP range requests on the RAR (about 3.7 MB of headers from 22 offsets; no image decoded). The archive
    is RAR 4.x with LZ-compressed (method 0x33), non-solid members, so JPEG headers (shape, channels, dtype) cannot be read
    without an unrar tool; members seen are 3-10 KB JPEGs (small crops). Folder names and the end-of-archive directory entries
    give the 10 classes; 812 member names were seen, all .jpg. size_bytes is the archive size from the Mendeley files API
    (exact for the one file). Sample unit: none direct; TensorSwitch can read zip members but not RAR members, so the only
    usable download is the whole 164 MB archive (download_url, checked usable). voxel size not found; checked: archive headers
