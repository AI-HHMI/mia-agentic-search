title: COCO-Formatted Bounding Box Annotations for the NIH Thin Blood Smear Malaria Dataset
short_name: P. falciparum thin smear cell boxes (brightfield)
description: Bounding boxes in COCO format for 965 Giemsa-stained thin blood smear images of Plasmodium falciparum
  infections (NIH-NLM dataset), covering non-infected red blood cells, infected red blood cells and white blood cells (plus
  ambiguous cells), made by Cellpose segmentation with manual correction. The images are downloaded from the NIH-NLM site.
