notes: 'Zenodo holds only the COCO annotation files (nih_polys 165 images, nih_points 800 images); the
  images come from the NIH-NLM Thin Blood Smears Pf site (index lists a 690 MB zip, so size_bytes is that
  approximate figure and image file format was not read, hence other). Paper: 965 images of 5312x2988
  px from a smartphone on a microscope (pixel size not stated); 800-image box set has 155,201 non-infected,
  6,805 infected, 220 white blood cells, 19,592 ambiguous. Labels: Cellpose plus manual correction. LICENCE:
  Zenodo metadata says apache-2.0 but its text says original NIH terms (attribution required); paper is
  CC-BY 4.0; recorded as custom, NIH agreement not opened. enricher: size from complete listing (was approx
  690 MB); formats jpeg (was other); polygon masks seen in nih_polys_coco.json.'
