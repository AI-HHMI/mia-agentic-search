notes: 'Record lists 1,080 PNG files (about 7.2 MB each, 7.96 GB total with the CSV and PDF), against the 1,000 images stated in the description; the extra 80 are unexplained. Annotations are in data_base_malaria.csv
  (header read: External_ID, backgroundquality, leukocyte and parasite locations, counts per stage) and documented in Database.pdf (not read). Paper (Sensors 2025, Sora-Cardenas et al.) states the same
  counts (6,188 parasites) and that the images were taken with a Zeiss Scope A1 at 100x, 2452 x 2056 pixels, and annotated with Labelbox by certified personnel. Pixel size not stated. The dataset record
  is a 2022 deposit that the paper extends to 1,000 images. Organism: human blood plus Plasmodium (species not stated on the pages read). No single download archive; files are individual downloads on the
  record page, so download_url is null.'
