notes: 'Data are in a public Google Drive folder (train nuclei/, test nuclei/ image folders plus "mask of train nuclei.rar" and "mask of test nuclei.rar"). Image file format inside the folders was not visible in the folder listing or the paper, hence formats: other. No license or terms found in the arXiv paper or the Drive folder; the paper only says the dataset is "publicly available". Instance vs. semantic nature of the masks is inferred from the paper''s AJI metric and nucleus counts. Voxel/pixel size not stated (scanner: 3D Histech Panoramic p250 Flash-3, 40x). Annotation done manually in QuPath. Sources checked: arXiv abstract and PDF, Drive folder listing. Google Drive hosting is less durable than a DOI repository.'
