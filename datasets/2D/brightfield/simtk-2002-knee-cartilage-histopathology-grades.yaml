id: simtk-2002-knee-cartilage-histopathology-grades
title: Human Knee Cartilage Histopathology Assessment
short_name: Knee cartilage histology grades (HE, SafO, PLM)
description: Histology images of 180 osteochondral specimens (medial and lateral femoral condyle) from 90 knee arthroplasty
  patients, with two serial sections each stained with H&E and Safranin O-fast green imaged in brightfield at 1.71 um/pixel,
  plus polarized-light images of unstained sections, graded with HHGS, OARSI and PLM osteoarthritis scoring systems by three
  blinded scorers.
