notes: SimTK datashare page lists no files or sizes and shows a Log In link, so whether download needs an account is not stated
  (access set to registration); the file listing was not seen, so n_items counts specimens (180) rather than images, and the
  folder layout (90 patient folders, each with Lateral and Medial specimen folders holding HE and SafO montage TIFFs, and
  PLM TIFFs for the medial specimen) is taken from the Data in Brief paper. License CC BY-NC 4.0 from DataCite; the SimTK
  page itself states none. Pixel size 1.71 um (10x, brightfield) from the paper; PLM images are 5.06 or 5.16 um per pixel
  (paper is inconsistent) and DataCite says 5x. Labels are specimen-level scores (HHGS, OARSI, PLM) by three blinded scorers;
  there are no masks or boxes. Publication year (2021, DataCite) only; no exact date, so date_published is null.
