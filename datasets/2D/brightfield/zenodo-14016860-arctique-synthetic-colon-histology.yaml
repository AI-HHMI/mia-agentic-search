notes: 'Synthetic data: images are rendered with a Blender pipeline, so masks are exact by construction
  (source=automatic) and there is no real organism or pixel size (the paper does not state a physical
  scale). The single Zenodo file v1-0-experiments.zip (3.4 GB, 88,400 members listed with peek_archive)
  holds v1-0 (1,450 train + 50 test images), v1-0-noisy and v1-0-depthmap (1,450 train each) and v1-0-variations
  (50-image test variations); n_items counts 4,500 core images only. The Zenodo description also mentions
  the full 50,000-image training set (v2) but that is not in the file list of this record version. Zenodo
  license field is MIT (the arXiv paper is CC BY 4.0). Paper read via the arXiv HTML page; Europe PMC/Crossref
  have no entry, so no full-text tool output. enricher: semantic class ids from code repo; channels kept
  3 (PNG has an extra alpha band).'
