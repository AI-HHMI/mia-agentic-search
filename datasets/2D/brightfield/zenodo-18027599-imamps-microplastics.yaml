title: 'ImaMPs: Extensive image dataset of microplastics in freshwater from tourist areas in the State of Mexico, Mexico.'
short_name: Freshwater microplastics classification (stereo)
description: 6,000 RGB TIFF images of cellulose filter membranes from freshwater samples (three tourist sites
  in the State of Mexico), taken with a Velab VE-S5C stereoscopic optical microscope at 0.7x-4.5x zoom. 3,000 images
  contain microplastics (CLASE_1) and 3,000 do not (CLASE_0); image-level labels are also in a CSV file.
  Images are 2040x1528 (4,262) or 1016x760 px (1,738).
