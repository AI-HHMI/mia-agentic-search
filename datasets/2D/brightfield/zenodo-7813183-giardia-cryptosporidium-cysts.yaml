notes: 'Metadata from the Zenodo API record; zip listing read with peek_archive (cysts_dataset_all.zip, 3,662 files: 3,604 jpg in brightfield_reference 830, brightfield_sample 1,007, smartphone_reference 831, smartphone_sample 743 and smartphone_sample_test 193, plus COCO JSON per fold and data_info spreadsheets). Paper (arXiv 2304.05339): brightfield images at 400x with 190x350 um field of view, smartphone ball-lens microscope images at 200x with 200 um circular FOV; per-pixel size not stated. Image counts in the zip differ slightly from Table 1 of the paper (830/1005/193), so n_items is the jpg count in the zip. The smartphone microscope is a ball-lens system and is listed under brightfield as the closest modality. Paper DOI 10.59275/j.melba.2024-a333 from arXiv metadata. Object-detection data only; no masks.'
