notes: 'Mendeley API lists version 3 (published 2026-06-25) with 431 files (312 PNG, 78 JSON, 39 JPG, 2 CSV; 119.8 MB). The
  paper cites version 2 (2026-06-01); version 1 was published 2025-12-04. Annotations cover only singular nuclei (intact,
  non-overlapping), not every nucleus, hence partial coverage. Pixel size 0.325 um/pixel is from the paper (about). No train/test
  split provided in the dataset; the paper reports its own benchmarking split. Per the paper only 39 of 40 selected blocks
  passed the sharpness check. enricher: download_url set to the v3 landing page (no archive link in the API; files are per-file
  downloads).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "SiNuS/\n  Exclusive_nuclei_property.csv, Inclusive_nuclei_property.csv\n  Original/Image <n>.JPG              \
      \            39 files (raw, 1600x1200 RGB)\n  Exclusive Nuclei Selection/Image <n>/           39 folders x 5 files\n\
      \    Image <n>_annotation_ens.json                 polygons (Supervisely-style JSON)\n    Image <n>_Binary Mask_ens.png\
      \                 binary mask\n    Image <n>_MultiColour Mask_ens.png            one colour per nucleus\n    Image <n>_NB\
      \ Mask_ens.png                     nuclei-boundary image\n    Image <n>_ens.png                             annotated\
      \ image (JPEG data in a .png name for Image 1)\n  Inclusive Nuclei Selection/Image <n>/           39 folders x 5 files,\
      \ same names with _ins\n431 files, 119,802,523 B (Mendeley API, version 3): 312 png, 78 json, 39 JPG, 2 csv\n"
    n_files: 431
    listing_complete: true
  sample:
    urls:
    - https://prod-dcd-datasets-public-files-eu-west-1.s3.eu-west-1.amazonaws.com/8c9a3225-571e-47b9-a8c6-13daecfed95f
    - https://prod-dcd-datasets-public-files-eu-west-1.s3.eu-west-1.amazonaws.com/e710d5b0-56e7-4b87-b333-88b3db952bc6
    - https://prod-dcd-datasets-public-files-eu-west-1.s3.eu-west-1.amazonaws.com/889d9e93-ce4c-4e52-ba5f-5306296612e4
    size_bytes: 315822
    description: 'Image 1: Original/Image 1.JPG with Exclusive Nuclei Selection/Image 1/Image 1_Binary Mask_ens.png and _MultiColour
      Mask_ens.png (S3 targets of the Mendeley file links).'
  arrays:
  - role: raw
    path_pattern: SiNuS/Original/*.JPG
    format: jpeg
    axes: yxs
    shape:
    - 1200
    - 1600
    - 3
    shape_varies: false
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: RGB brightfield (Dual-ISH) image blocks.
  - role: label
    path_pattern: SiNuS/*Nuclei Selection/*/*_Binary Mask_*.png
    format: png
    axes: yxs
    shape:
    - 1200
    - 1600
    - 2
    shape_varies: false
    dtype: uint16
    compression: deflate
    value_range: null
    encoding: binary
    classes:
    - id: null
      name: singular nucleus
    alignment: same-grid
    alignment_notes: 'Original/Image <n>.JPG pairs with <set> Nuclei Selection/Image <n>/Image <n>_Binary Mask_<ens|ins>.png;
      ens = exclusive (consensus) set, ins = inclusive set. PNG header: 16-bit grey + alpha; read as 8 bit, the grey channel
      is 0 (98.96%), 255 (0.88%) and anti-aliased edge values (0.17%), alpha constant.'
  - role: label
    path_pattern: SiNuS/*Nuclei Selection/*/*_MultiColour Mask*.png
    format: png
    axes: yxs
    shape:
    - 1200
    - 1600
    - 4
    shape_varies: false
    dtype: uint16
    compression: deflate
    value_range: null
    encoding: rgb-colors
    classes: null
    alignment: same-grid
    alignment_notes: RGBA, one colour per nucleus (2763 distinct RGB values in Image 1, so edges are anti-aliased); alpha
      constant.
  - role: label
    path_pattern: SiNuS/*Nuclei Selection/*/*_annotation_*.json
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: polygons
    classes: null
    alignment: same-grid
    alignment_notes: Per-image JSON with annotation.size 1200x1600 and objects[] of geometryType polygon (classTitle "Singl..."),
      exported from a labelling platform.
  notes: 'Listing from the Mendeley public API (files and folders, version 3): 431 files with exact sizes, 119,802,523 B;
    listing.py does not read Mendeley, so size_source is page-stated. Probed Image 1: Original JPG 1600x1200 RGB uint8; Binary
    Mask PNG 16-bit grey+alpha; MultiColour and NB Mask PNG 16-bit RGBA; ''Image 1_ens.png'' is JPEG data (an annotated image).
    Sampled the JPG (182,953 B: 0..255, mean 203) and the binary mask (38,365 B), and read the three masks again with PIL
    (243,978 B) to check channels: PIL reads them as 8-bit RGBA, so value ranges of the 16-bit PNGs are not recorded. NB Mask
    has no zero pixels (an image with boundaries drawn, not a mask) and the _ens/_ins.png images are overlays; neither is
    listed as an array. Direct links: data.mendeley.com/public-files/... returns 403 to Python clients (curl gets a 302 to
    prod-dcd-datasets-public-files-eu-west-1.s3.eu-west-1.amazonaws.com, which serves the files with range requests but is
    not on the TensorSwitch allowlist). Readiness: 2D not yet covered by the miao layout.'
