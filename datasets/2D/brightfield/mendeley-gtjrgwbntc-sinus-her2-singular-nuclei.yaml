notes: Mendeley API lists version 3 (published 2026-06-25) with 431 files (312 PNG, 78 JSON, 39 JPG, 2 CSV; 119.8 MB). The paper cites version 2 (2026-06-01); version 1 was published 2025-12-04. Annotations cover only singular nuclei (intact, non-overlapping), not every nucleus, hence partial coverage. Pixel size 0.325 um/pixel is from the paper (about). No train/test split provided in the dataset; the paper reports its own benchmarking split. Per the paper only 39 of 40 selected blocks passed the sharpness check.
