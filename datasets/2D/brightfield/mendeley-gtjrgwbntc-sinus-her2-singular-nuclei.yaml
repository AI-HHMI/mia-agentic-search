title: 'SiNuS: A Comprehensive Dataset for Singular Nuclei Segmentation for HER2 Grading of Breast Cancer'
short_name: SiNuS singular nuclei, HER2 Dual-ISH (brightfield)
description: 39 Dual-ISH stained breast cancer image blocks (1600x1200 px, 20x, 0.325 um/pixel) from 21 patients (HER2-positive and HER2-negative), with singular (intact, non-overlapping) nuclei outlined by three pathologists. Inclusive (any expert; 1,856 nuclei) and exclusive (consensus of all; 1,284 nuclei) annotation sets, each with JSON polygons and binary, multicolour (instance) and nuclei-boundary masks, plus nuclei property CSV files.
