description: >-
  ICIP 2022 challenge dataset: 10,000 training images (1,000 per class) of 11 types of intestinal parasite eggs in faecal smears with COCO-format bounding boxes and class labels,
  plus 2,200 test images (200 with released labels). Images come from several microscopes/cameras and smartphones under varied lighting.
