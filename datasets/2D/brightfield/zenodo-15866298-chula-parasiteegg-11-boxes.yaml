notes: 'Zenodo mirror of the IEEE DataPort dataset (DOI 10.21227/vyh8-4h71). Files: Chula-ParasiteEgg-11.zip (11,000 jpg +
  labels.json per the zip listing), Chula-ParasiteEgg-11_test.zip (2,200 jpg), test_labels_200.json. Species listed are the
  parasite taxa in the images (Hookworm, Paragonimus spp. and Taenia spp. are not resolved to species and are omitted from
  organism). Pixel size is not given: images come from different microscope cameras (Canon EOS 70D on Olympus BX53, Nikon
  DS-Fi2 on Nikon Eclipse Ni) and smartphones; the paper gives egg sizes in um and pixels per type only. License MIT as stated
  on the Zenodo record. The paper states 13,750 images in total (1,250 per class); the Zenodo files hold 11,000 training and
  2,200 test images (enricher zip listing; n_items was 12,200), and test_labels_200.json covers all 2,200 test images (2,228
  boxes). organisms: one per training file-name prefix (data/<species>_<nnnn>.jpg); test files are numbered, species only
  via the labels.'
