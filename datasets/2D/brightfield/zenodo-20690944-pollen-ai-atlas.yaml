      \  400 JSONL (34.9 GB)\n    ground_truth/{ts2_expert (84), ts1_legacy (21)}/<slide>_curated.geojson\n    ground_truth_crops/{ts1_legacy,ts2_expert}/<origin>/<slide>/*.png\
