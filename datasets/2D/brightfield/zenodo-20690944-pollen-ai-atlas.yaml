notes: 'Zenodo API: one file, pollen_ai_atlas.zip (42.8 GB), CC-BY-4.0 (also stated in the README inside the zip).
  Most annotations are machine-generated (VLM captions, SAM masks/boxes in filtered_detections/); 17,318 crops are
  expert-validated (ground_truth/, ground_truth_crops/), hence partial and mixed. Split: 1,274,118 train / 224,883
  val grains. Pixel size varies by slide (metadata/slide_manifest.json mpp 0.121295 to 0.243 um/px), so voxel_size_nm
  null. Organism empty: ~50 taxa, many genus-only. The 85 whole-slide images (149 GB) are on request and not included.
  enricher: zip listed (1,530,134 members), headers probed and one crop sampled; annotations_verified true (was
  false).'
