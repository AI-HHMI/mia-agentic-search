description: Processed-data package for the Pollen AI Atlas - 1,511,390 pollen-grain crops (PNG) detected in 85
  brightfield whole-slide images of pure-species slides (45 genera, 31 families; French, Hungarian, Mediterranean,
  Swedish collections), with per-grain masks and boxes (HDF5), five VLM caption corpora (JSONL), 17,318 expert-validated
  ground-truth crops with GeoJSON annotations, and train/validation split files. The whole-slide images themselves
  are not included.
