      \ MB)\n"
    n_files: 1530134
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/20690944/files/pollen_ai_atlas.zip::pollen_ai_atlas/pollen_grain_crops/mediterranean/mediterranean_pollen_plantago_reference/mediterranean_pollen_plantago_reference_000376_x64366_y42868_w146_h151.png
    - https://zenodo.org/records/20690944/files/pollen_ai_atlas.zip::pollen_ai_atlas/filtered_detections/swedish/Pinus_sp_10_Pinaceae_14_layers_40x_Blue_colou_ZS017_5_mm_circle_filtered.h5
    size_bytes: 496184
    description: 'One PNG grain crop (151x146 RGB) plus the smallest per-slide detection file (Pinus, 42 grains:
      masks, boxes, classes). The crop and the HDF5 come from different slides; a matching pair is any slide folder
      plus its <slide>_filtered.h5.'
  arrays:
  - role: raw
    path_pattern: pollen_ai_atlas/pollen_grain_crops/*/*/*.png
    format: png
    axes: yxs
    shape:
    - 151
    - 146
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 20
    - 239
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Crop = grain bbox (whole-slide coords) plus a 5 px margin per README; origin and size are in
      the file name (x, y, w, h) and the per-slide manifest CSV.
  - role: label
    path_pattern: pollen_ai_atlas/filtered_detections/*/*_filtered.h5 (results/mask)
    format: hdf5
    axes: null
    shape:
    - 42
    - 825
    - 825
    shape_varies: true
    dtype: uint8
    compression: gzip
    encoding: unknown
    classes: null
    alignment: offset
    alignment_notes: One mask per grain (first axis = grain, mask_index in the caption JSONL); placed in whole-slide
      coordinates via results/topleft, so not on the crop PNG grid. Machine-generated (SAM prompt points in results/point).
  - role: label
    path_pattern: pollen_ai_atlas/filtered_detections/*/*_filtered.h5 (results/bbox)
    format: hdf5
    axes: null
    shape:
    - 42
    - 4
    shape_varies: true
    dtype: int32
    compression: none
    encoding: boxes-table
    classes: null
    alignment: offset
    alignment_notes: Boxes [x1, y1, x2, y2] in whole-slide coordinates (README); class_id / class_name / class_prob
      per grain alongside.
  - role: label
    path_pattern: pollen_ai_atlas/ground_truth/*/*.geojson
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: polygons
    classes:
    - id: null
      name: Pollen
    - id: null
      name: Test Region
    alignment: offset
    alignment_notes: QuPath-style GeoJSON features in whole-slide coordinates; the matching 17,318 validated crops
      are in ground_truth_crops/ with manifests linking feature UUIDs to crops.
  - role: other
    path_pattern: pollen_ai_atlas/captions/*/*/*.jsonl
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    alignment: unknown
    alignment_notes: One VLM caption record per grain id (5 models), with bbox, species labels and size measurements
      (README field table).
  notes: 'Listing: listing.py --expand-zips read the zip index: 1,530,134 members, 42,756,521,607 B, matching README
    counts (1,511,390 crops, 85 HDF5, 105 GeoJSON, 17,318 GT crops). Probes: crop PNGs RGB uint8 deflate (151x146x3,
    119x143x3); Pinus HDF5 results/mask 42x825x825 uint8 gzip chunks 6x104x104, bbox 42x4 int32. Sample: one crop,
    values 20..239 (one sample; no hints), RGB channels differ. HDF5 mask values not sampled (sample.py cannot open
    HDF5 inside a zip), so mask encoding unknown; README calls them per-grain masks. Masks/boxes/GeoJSON live in
    whole-slide coordinates while the WSIs are not released; pairing to crops goes via grain id / mask_index and
    the bbox in the crop name. Voxel size not set: slide_manifest.json gives mpp per slide (0.242797 french, 0.243
    / 0.1225 swedish, 0.17 mediterranean, 0.242797 / 0.121295 hungarian). The zip also holds a .pth model checkpoint
    (never load it). Organism left empty (about 50 taxa per slide_manifest species_verified, many genus-only).'
