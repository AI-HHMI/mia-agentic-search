notes: 'Zenodo API: one file, pollen_ai_atlas.zip (42.8 GB), CC-BY-4.0. Too large to peek (timed out), so the layout is from the paper code README (HDF5 detections, JSONL captions, PNG crops, GeoJSON ground truth, JSON splits) and the paper; annotations_verified false. Most annotations are machine-generated (VLM captions, detections); 17,318 crops are expert-validated, hence partial and mixed. Split: 1,274,118 train / 224,883 val grains. Pixel size varies by scanner (0.121 to 0.243 um/px), so voxel_size_nm null. Organism empty: only genera and families named, no NCBI species. The 85 whole-slide images (149 GB) are on request and not included.'
