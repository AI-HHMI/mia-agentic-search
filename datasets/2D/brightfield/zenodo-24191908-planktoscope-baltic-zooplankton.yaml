notes: 'Seven zips (60.3 MB) plus README.md; 2,413 JPEGs. enricher: read all 7 EcoTaxa TSVs: 2,413 rows,
  one per JPEG (every image matched), all object_annotation_status=validated with one named annotator,
  30 categories (top: Synchaeta monopus 947, Eurytemora 271, Keratella quadrata 245, Acartia 174, nauplii<Acartia
  143; also non-taxon classes t001, repeat<other, detritus<not-living). enricher: coverage dense and source
  manual (was unknown/unknown): every object carries a human-validated category; whether a classifier
  pre-sorted them before validation is not stated. TSVs give process_pixel 0.75 and acq_magnification
  1.2 for all rows, but no fetched page states the unit, so voxel size stays null. No paper cited (README
  checked). organism left empty: mixed zooplankton taxa per image (see TSV category).'
