notes: 'Record published 2026-11-13. Seven zips (60.3 MB total) plus README.md; peek_archive listings give 2,413 JPEGs in total
  (LL3A 733, LL7D 500, LANGDEN 165, XVI 168, LL12 333, LL9 234, GF1 280). Only the LL7D TSV was read: it lists process_pixel 0.75
  and acq_magnification 1.2 (EcoTaxa fields, units not stated in the README, so voxel size is left null) and category names
  such as Eurytemora, Synchaeta monopus, Keratella quadrata, and nauplii classes; the text read held 114 rows for 500 JPEGs
  (cat output may be truncated or objects have several crops), so the labelled fraction and the per-class counts were not
  verified for other stations. No paper is cited on the record or README (checked), so publications is empty. Annotation
  procedure and who labelled are not stated (EcoTaxa annotation, possibly with automatic prediction), hence source unknown.
  Related but different from the ASTRAL PlanktoScope phytoplankton record on main: this is net zooplankton from the Baltic.'
