notes: 'Zip listing (979 members): 961 JPEG images plus 9 VIA JSON files; the JSON annotations sit inside .ipynb_checkpoints
  folders (read IncuCyte train/test checkpoint files: polygon regions per image, class "spheroid"). Paper Methods: IncuCyte 336 train /
  144 val / 50 test (530); microscope 265 / 117 / 50 (432), manually annotated by an expert in VGG Image Annotator, i.e. 962 images vs 961 JPEGs found. Pixel size and magnification not stated in the Methods or the Zenodo page. The paper
