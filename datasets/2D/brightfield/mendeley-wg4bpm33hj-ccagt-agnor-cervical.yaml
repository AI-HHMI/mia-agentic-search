short_name: CCAgT AgNOR cervical cytology (brightfield)
description: 9,339 brightfield images (1600x1200, 0.111 um/pixel per the Hugging Face card) of cervical cytology slides stained with the AgNOR technique, from 15 slides, with more than 63,000 annotated objects (nuclei, NORs/clusters/satellites, leukocytes etc.). Annotations are semantic masks (8 pixel values), COCO-format boxes and polygons, made in Labelbox and reviewed. 70/15/15 train/test/validation split in the loader.
