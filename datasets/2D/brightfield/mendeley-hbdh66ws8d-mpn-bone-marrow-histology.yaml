notes: 'Labels are image-level subtype classes per the Data in Brief article (300 labelled images, 100 per class); the
  Mendeley page shows an empty file list (only "Download All"), so the folder layout and the class-label encoding
  were not seen. Images are PNG, sizes 927 to 2160 px square per the paper. Pixel size not stated on the dataset
  page or paper (objectives x10/x20/x40 mixed). The paper says the data are suitable for segmentation, but no masks
  are described. Title on the page carries a "v2" suffix while the DOI and version are .1. Mendeley Data is not a schema
  repository value, hence repository other.'
