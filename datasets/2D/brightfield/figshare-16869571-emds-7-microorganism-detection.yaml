notes: 'Paper (Frontiers in Microbiology 2023, Methods): images taken under a 400x optical microscope
  by two biologists in 2018-2019, labelled by four bioinformatics scientists in 2020-2021; 42 categories,
  13,216 labelled objects (the paper elsewhere says 15,342 and 42 vs 41 categories); suggested 6:2:2 train/val/test
  split is a paper experiment, not shipped. Licence: figshare API reports CC BY 4.0 while the paper says
  the data are freely published for non-commercial purposes, so the terms conflict. The zip folders are
  EMDS7/ and EMDS7xml/; the XML <filename>/<path> fields still say EMDS6. Figshare holds a second identical
  deposit (16867114, same size and description); this record uses 16869571, the one the paper cites. enricher:
  annotations.format folder corrected to EMDS7xml (was EMDS6xlm).'
