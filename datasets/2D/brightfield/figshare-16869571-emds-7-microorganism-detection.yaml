notes: 'Zip listed with peek_archive: 2365 PNG (about 5.3 GB, 2048x1536x3) plus 2365 Pascal VOC XML files; one XML read (boxes, class codes such as G001, and an unknown class). Paper (Frontiers in Microbiology 2023, Methods): images taken under a 400x optical microscope by two biologists in 2018-2019, labelled by four bioinformatics scientists in 2020-2021; 42 categories, 13,216 labelled objects (the paper elsewhere says 15,342 and 42 vs 41 categories); suggested 6:2:2 train/val/test split is a paper experiment, not shipped. Licence: figshare API reports CC BY 4.0 while the paper says the data are freely published for non-commercial purposes, so the terms conflict. The zip folders are named EMDS6 / EMDS6xlm although the content matches EMDS-7 counts. Figshare holds a second identical deposit (16867114, same size and description); this record uses 16869571, the one the paper cites. Pixel size is not stated. Different from the catalogued EMDS-6 (840 images).'
