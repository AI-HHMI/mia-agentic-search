notes: 'Files on Zenodo: Training-labeled.zip (peek_archive: 2000 files = 1000 images + 1000 label TIFFs;
  image formats tif/tiff/png/bmp), train-unlabeled-part1/2.zip, Tuning.zip, Testing.zip, ReadMe.md. Counts
  per modality from the arXiv preprint; whether Tuning/Testing labels are released was not checked. License
  is CC-BY-NC-ND-4.0 (non-commercial, no derivatives): check that it fits your use. Pixel size and organism
  per image not stated on dataset page, ReadMe or preprint (Nature Methods full text is not open access;
  the preprint was read). Images are heterogeneous; bmp is included in the originals (formats list uses
  other). Annotation source is mixed: manual annotation, with model-assisted pre-labels for some contributions.
  enricher: Tuning.zip and Testing.zip listings show labels/ folders, so labels for tuning and testing
  are released too.'
