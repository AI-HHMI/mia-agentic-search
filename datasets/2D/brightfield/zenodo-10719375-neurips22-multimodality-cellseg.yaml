title: NeurIPS 2022 Cell Segmentation Competition Dataset (multi-modality microscopy)
short_name: Multi-modality cell segmentation (NeurIPS22)
description: Official data of the NeurIPS 2022 multi-modality cell segmentation challenge. Training-labeled
  set of 1000 2D microscopy images (300 brightfield, 300 fluorescent, 200 phase-contrast, 200 DIC) with
  per-cell instance masks, plus ~1,725 unlabeled training images, a tuning set and a testing set. Images
  come from 50+ experiments in 20+ labs, with diverse cell types, stains and microscopes.
