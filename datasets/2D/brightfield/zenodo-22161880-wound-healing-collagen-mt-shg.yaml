notes: 'Single 1.07 GB zip (730 files): 521 JPG MT images, 188 PNG SHG images, per-modality metadata CSVs
  and animal-level cross-validation fold lists (MT 5 folds, SHG 4 folds), plus README.md (read in full).
  Labels are image-level experimental wound-healing stages, not pixel annotations; the README does not
  say how stages were assigned beyond the time point after wounding. Zenodo page and README identify no
  associated paper (the README refers to an associated manuscript without citing it), so none is listed.
  Counts: MT 115 control/39 Day0/36 Day3/63 Day7/112 Day10/90 Day14/66 Day14-Delay; SHG 21/67/63/37 for
  Day0/3/7/10. modalities: brightfield = MT_dataset/ (NanoZoomer S60), two-photon SHG = SHG_dataset/ (Nikon
  A1MP+). enricher: voxel_size_nm set null (was 260 nm): README states 0.26 um/px for MT only, SHG not
  stated; channels 3 (RGB, probed).'
