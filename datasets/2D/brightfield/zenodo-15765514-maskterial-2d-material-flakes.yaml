title: MaskTerial datasets - optical microscope images of exfoliated 2D material flakes with instance masks and layer classes
short_name: Exfoliated 2D material flakes (optical microscopy)
description: Datasets from the MaskTerial paper for detecting exfoliated 2D material flakes (graphene, hBN, MoSe2, WS2, WSe2) in
  optical microscope images of Si/SiO2 wafers. Eight real datasets (4,537 train and test images in total) with instance masks
  as RLE annotations and layer-count classes, with train/test splits from independent exfoliation runs, and seven large synthetic datasets
  (CrI3, graphene, hBN, MoSe2, TaS2, WS2, WSe2) generated by a physics-based simulator.
