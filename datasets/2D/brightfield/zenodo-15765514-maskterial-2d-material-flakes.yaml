notes: 'Zenodo API file list (15 zips, about 85 GB): 8 Real_*.zip (GrapheneH/M/L, hBN_Thin, MoSe2, WS2, WSe2, WSe2L; 168 MB to 1.1 GB)
  and 7 Synthetic_*.zip (11-13 GB each). Listed two real zips: each has jpg images, png masks, RLE_annotations/*.json and meta_data/*.json
  (hBN_Thin: 135 jpg = 73 train + 62 test, matches paper Table 1; WSe2L: 512 jpg = 92 + 420). n_items is the sum of the real train/test
  image counts in the paper Table 1; the synthetic zips were not listed (the paper uses 300,000 simulated images for pre-training).
  License MIT per the Zenodo record. Paper (Digital Discovery 2025, open access) read: train and test images come from independent exfoliation
  runs; the paper text read does not say who annotated the real images or with which tool, nor the microscope, objective or pixel size,
  so annotations.source is unknown and voxel_size_nm is null. The code record zenodo.org/records/14415557 is software, not a dataset.
  enricher: size_bytes from the exact Zenodo listing.'
