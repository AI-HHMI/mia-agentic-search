short_name: Yeast cells in microfluidic traps (brightfield)
description: 493 densely, manually annotated 128x128 brightfield images of budding yeast confined in two
  microfluidic trap geometries, with pixel-wise instance labels for cells and trap microstructures,
  bounding boxes and class labels, and a fixed train / validation / test split (296 / 49 / 148).
