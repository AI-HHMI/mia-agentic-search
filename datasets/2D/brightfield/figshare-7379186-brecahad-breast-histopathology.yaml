  notes: 'Listed the figshare article (5 files, 1,034,977,579 B exact) and the BreCaHAD.zip central directory
    (488 members: 162 TIFF, 162 JSON, 162 PNG, README, LICENSE). Probed images/Case_10-01.tif (1024x1360x3
    uint8 LZW, plain TIFF), images/Case_1-01.tif (1024x1360x3 uint16 LZW) and groundTruth_display/Case_10-01.png
    (1024x1360x3 uint8). Sampled both TIFFs (10.7 MB): ranges 21-255 and 1695-65535, one sample each;
    RGB samples not identical. Read groundTruth/Case_10-01.json: class keys mitosis, non_mitosis, apoptosis,
    tumor, non_tumor, tubule, non_tubule. The raw array''s dtype is uint8 for Cases 7-17 and uint16 for
    Cases 1-6 (from file sizes, one probe each); the paper says 8-bit. Voxel size 514 x 527 nm stated
    in the paper. Direct links: the ndownloader zip and its members are usable by TensorSwitch (range
