notes: 'Zip listing (peek_archive): 162 TIFF images, 162 annotation JSON files and 162 display PNGs, plus
  README and LICENSE. Pixel size 0.514 x 0.527 um at 40x and the microscope/camera come from the paper
  (Data description). Paper: images ''annotated or marked by a pathologist''; annotation counts per class
  are in annotation_details.xlsx, not read. Only malignant cases. enricher: source manual (was unknown,
  paper text); size = all 5 figshare files. The zip''s LICENSE file is Apache-2.0 while figshare states
  CC BY 4.0; spdx kept from figshare. Cases 1-6 are uint16 RGB TIFFs, not 8-bit as the paper says.'
