title: 'BreCaHAD: A Dataset for Breast Cancer Histopathological Annotation and Diagnosis'
short_name: Breast cancer H&E mitosis and nuclei points
description: 162 H&E-stained breast cancer histopathology images (1360 x 1024 px, 8-bit RGB TIFF, 40x) from four malignant tumour types (ductal, lobular, mucinous, tubular carcinoma), with point annotations (centroid x and y relative to the image size, in JSON) for six classes - mitosis, apoptosis, tumor nuclei, non-tumor nuclei, tubule and non-tubule. The archive holds images, ground-truth JSON and display PNGs.
