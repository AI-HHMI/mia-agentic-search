notes: 'GitHub page and README, one CVAT XML (BASOPHILS: 26 images, 28 manual polygons, 4032 x 3024 px) and a Kaggle
  mirror listing (about 570 class-folder JPEGs, ten annotations.xml, 140 JPEGs in TEST_MIXED without annotations
  found; n_items counts the JPEGs). License: none on GitHub; CC BY 4.0 comes from the Figshare record DATA-CELLSEG
  (figshare 23804523) that describes the same dataset; the Kaggle mirror lists CC BY-NC-ND 4.0, so verify. The ESWA
  paper is not open access: only its abstract was read, not Methods. Pixel size and total size not stated (1000x,
  iPhone XR camera). Plain git files (download_method other). enricher: formats add png and n_items 725 (710 JPEG
  + 15 PNG slides, from the git tree; was jpeg, 710).'
