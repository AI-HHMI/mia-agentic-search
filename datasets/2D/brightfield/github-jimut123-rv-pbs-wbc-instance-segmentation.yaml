title: RV-PBS (Ramakrishna Vivekananda Peripheral Blood Smear) dataset
short_name: Blood smear WBC instance polygons (brightfield)
description: High-resolution (4032 x 3024) Leishman-stained peripheral blood smear photographs taken through a 1000x oil-immersion
  lens with a phone camera, in ten white-blood-cell class folders (band cells, basophils, blasts, eosinophils, lymphocytes,
  metamyelocytes, monocytes, myelocytes, neutrophils, promyelocytes) plus a mixed test folder. Each class folder carries a
  CVAT XML file with manual polygons per cell, made for instance-segmentation benchmarks.
