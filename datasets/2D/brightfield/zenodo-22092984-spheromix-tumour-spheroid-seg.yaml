notes: 'Combined superset with its own train/val/test splits and an out-of-distribution
  test part. Components SpheroHQ (zenodo-22092772) and SLiMIA (figshare-7486311) are
  already catalogued; DTS (1,435 images) and SpheroidJ (387) are new here. Mixed license:
  SpheroHQ/SLiMIA CC-BY-4.0, DTS/SpheroidJ GPL-3.0 (LICENSE.md: CC-BY-4.0 AND GPL-3.0-only),
  so spdx is custom; per-file license in manifest.csv. Six DTS test images also occur
  in training (known_overlap.csv). Counts and splits from README; the 25 GB zip was
  not opened. Pixel size and annotation source not stated; paper abstract only.'
