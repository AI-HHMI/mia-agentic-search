notes: 'Terms: the project page says "Available for non-commercial research purposes" with no named licence,
  so spdx is custom. Class counts (page/paper): 1 Corylus well-developed 1,850, 2 Corylus anomalous 903,
  3 Alnus 9,558, 4 debris 999, 5 Cupressaceae 43. Masks come from an automatic mean-shift/threshold pipeline,
  labels from experts, hence source mixed. Only 84x84 object crops are released. Leitz Diaplan brightfield
  microscope; pixel size not stated on the page or in the paper (arXiv copy). enricher: zip has train
  classes 1-4 only (11,279 objects x OBJ/MASK/SEGM) and 1,991 test OBJ crops; ground-truth.json (linked
  on the page) labels the 1,991 test files with classes 1-4; no Cupressaceae (class 5) files are in the
  release, so 13,270 objects, not 13,353. organisms: Corylus avellana = train/images/1,2; Alnus = 3; Cupressaceae
  = none released.'
