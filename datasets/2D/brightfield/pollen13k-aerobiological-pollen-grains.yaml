id: pollen13k-aerobiological-pollen-grains
title: Pollen13K - labelled pollen grain and debris objects segmented from aerobiological microscope images
short_name: Pollen13K pollen grain objects (brightfield)
description: 13,353 objects (84x84 px RGB crops) segmented from brightfield microscope images of airborne pollen samples
  on adhesive tape, each with a binary mask and a green-background segmented version, labelled by aerobiology experts into
  five classes (Corylus avellana well-developed and anomalous, Alnus, Cupressaceae, debris). Distributed as a challenge
  archive with train and test folders plus a ground-truth JSON.
