notes: 'Terms: the project page says "Available for non-commercial research purposes" with no named licence, so spdx is
  custom. The 274 MB zip (peek_archive) holds 35,828 PNG files under POLLEN13K_Challenge/train/images/<class>/ (OBJ and
  SEGM variants seen); only the first entries were listed, so the exact test-folder layout and which of the 13,353 objects
  are in each split were not verified. Class counts (paper Table 2): Corylus well-developed 1,850, Corylus anomalous 903,
  Alnus 9,558, debris 999, Cupressaceae 43. Masks come from an automatic mean-shift/threshold pipeline, labels from experts,
  hence source mixed. The source microscope images are not released, only the 84x84 object crops, so the dataset is object-level.
  Leitz Diaplan brightfield microscope with 5 MP CMOS sensor; magnification and pixel size not stated on the page or in the
  paper. Paper PDF read via the arXiv copy (not in Europe PMC).'
