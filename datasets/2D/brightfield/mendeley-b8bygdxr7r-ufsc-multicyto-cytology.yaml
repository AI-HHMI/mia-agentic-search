title: 'UFSC Multi-Cyto: Multi-Stain Cytopathology Image Dataset'
short_name: Multi-stain cytology nuclei masks (brightfield)
description: 17,422 expert-annotated brightfield image patches (1200 x 1600 or 1600 x 1200 px) from 28 whole-slide
  images of oral (Papanicolaou) and cervical (AgNOR, Feulgen) cytology, with 119,874 instance-level annotations
  in COCO and YOLO formats. Consolidates the OCPap, CCAgT and Feulgen collections; 12,502 train, 2,448 validation and
  2,472 test patches, split by patient and stain.
