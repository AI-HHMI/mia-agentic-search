  notes: 'Mendeley download URL redirects to an S3 object (prod-dcd-datasets-public-files-eu-west-1) that
    serves ranges, so the zip index was read there: 34,848 files, 17,422 images and 17,422 label files,
    all images 1200 x 1600 RGB uint8 (probed one jpg, png and tiff). Sampled one JPEG (107,636 B): values
    [0, 233]; its label file (3,488 B) has 3 polygons (classes 7 agnor_Nucleus, 8 agnor_Cluster). Values
    from one image. TensorSwitch: the S3 host is not on its allowlist (probe usable: false only for that
    reason; ranges work); the Mendeley file_downloaded URL answers HEAD with 403. Stain per file not recorded
    per folder: file-name prefixes differ by source collection. Voxel size: set per stain not possible
    (0.111 um/px for Papanicolaou and AgNOR, Feulgen not stated); image headers not calibrated.'
