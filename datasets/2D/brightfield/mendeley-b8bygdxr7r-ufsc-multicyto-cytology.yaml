notes: 'One 8.8 GB zip (UFSC_Multi-Cyto_Dataset.zip); the host sends no size for range requests so it could not be
  listed: image file extension and folder layout are unconfirmed (formats: other is a placeholder) and
  annotations_verified is false. Paper (Cytopathology 2026, open access) Methods: Papanicolaou and AgNOR slides scanned
  on a Zeiss Axio Scan.Z1 at 0.111 um/px; Feulgen slides imaged on a Motic BA410 microscope (pixel size not stated), so
  one pixel size does not hold for the whole dataset (voxel_size_nm null). Classes per stain (7 Papanicolaou, 7 AgNOR,
  8 Feulgen) are in the paper Table 1. Derived from OCPap (Mendeley dr7ydy9xbk) and CCAgT (wg4bpm33hj) plus a Feulgen
  collection; neither source is in this catalog.'
