notes: 'TCIA collection page: 13 subjects, 482 images listed of which 469 are annotated (paper: 166 tumour, 303 non-tumour),
  CC BY 4.0, 582 GB (size rounded from the stated download size), public, downloaded with IBM Aspera through the TCIA Faspex
  server, hence download_method aspera and no direct URL. File types: ENVI hyperspectral cubes (raw, dark and white references,
  which is why formats is other) plus a synthetic rgb.png and a slide PNG with macroscopic annotations per patient. Labels are
  image-level only (tumour or not, from macroscopic annotation of the slide), so coverage is sparse and the file listing was not
  seen (annotations_verified false). Spatial pixel size is characterised in the paper but not given as a single value here, so
  voxel_size_nm is null. Hyperspectral transmitted-light H&E, recorded as brightfield. Publication date not stated; TCIA lists v1
  updated 2024-05-24.'
