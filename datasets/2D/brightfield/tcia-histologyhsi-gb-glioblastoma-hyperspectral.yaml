id: tcia-histologyhsi-gb-glioblastoma-hyperspectral
title: 'HistologyHSI-GB: hyperspectral histological images for diagnosis of human glioblastoma'
short_name: Glioblastoma hyperspectral H&E (tumour labels)
description: 469 hyperspectral microscope images (800 x 1004 px, 826 channels, 400-1000 nm, 20x objective) of H&E-stained slides
  from 13 glioblastoma patients, each labelled tumour (166) or non-tumour (303) by histopathologists, stored as ENVI cubes with
  dark and white references and a synthetic RGB preview. Acquired with a push-broom hyperspectral camera on an Olympus BX-53 microscope.
