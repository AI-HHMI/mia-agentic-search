    alignment_notes: 'ENVI flat-binary cube with ASCII .hdr (paper Table 2); paper gives 800 x 1004 x 826 as lines x rows x bands, 299 x 375 um. Interleave and dtype are in the .hdr, not read. Radiance, uncalibrated: dark/white references in the same folder for flat-field calibration. Labels are image-level (T / NT) in the image folder name, not an array.'
  notes: 'Not inspectable: TCIA offers the collection (582 GB stated on the page) only as an IBM Aspera Faspex package (faspex.cancerimagingarchive.net), no HTTP file links, so nothing was listed, probed or sampled. Layout, shape and file names come from the paper (Data Records, Table 2). normalization none: paper says raw files hold radiance to be calibrated with the references. Exact folder-name syntax for ROI/image/label not read. Download search: TCIA page (Faspex link only), GitHub HIRIS-Lab/HistologyHSI-GB README (loading examples, no data links), paper Data availability (TCIA DOI). Format ENVI is not in the schema enum, hence other.'
