notes: 'Dataset card read in full plus the HF file listing (252 images: 40 in example/, 212 in test/,
  with annotation.jsonl and overlay copies). Aggregate benchmark: BBBC malaria images (Ljosa et al. 2012)
  and BCCD blood-cell images (github Shenggan/BCCD_Dataset) are redistributed; LIVECell images come with
  new in-lab morphology boxes; NIH-3T3 images and boxes are an unpublished in-lab collection. No license
  or terms on the card or in the listing, and the sources have their own terms, so license is unknown.
  No paper cited; pixel size and annotation procedure undocumented. Organisms from sub-dataset names:
  Homo sapiens = BBBC/, BCCD/; Rattus norvegicus = LIVECell/ (RatC6); Mus musculus = NIH-3T3/. enricher:
  size from complete HF listing (was null); BCCD sample pair checked.'
