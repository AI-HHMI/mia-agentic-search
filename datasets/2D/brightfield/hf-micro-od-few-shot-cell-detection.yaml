schema_version: '1.2'
id: hf-micro-od-few-shot-cell-detection
title: 'Micro-OD: few-shot microscopy object detection benchmark (blood smear, malaria, phase-contrast
  cells)'
short_name: Few-shot cell detection boxes (blood, malaria)
description: Micro-OD packages 252 microscopy images from four sub-datasets (BBBC malaria blood smears,
  BCCD peripheral blood smears, LIVECell phase-contrast RatC6 images, and in-lab NIH-3T3 phase-contrast
  fibroblasts) with bounding-box annotations over 10 classes. A support split of 40 images and a test
  split of 212 images (5,551 boxes) support few-shot evaluation of detectors and vision-language models.
