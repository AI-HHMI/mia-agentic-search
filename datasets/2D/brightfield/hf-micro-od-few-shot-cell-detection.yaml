notes: 'Dataset card read in full plus the Hugging Face API file listing (252 images: 40 in example/, 212 in test/, with matching annotation.jsonl and overlay copies). Aggregate benchmark: BBBC malaria images (Ljosa et al. 2012) and BCCD blood-cell images (github Shenggan/BCCD_Dataset) are redistributed, LIVECell images come with new in-lab morphology boxes, and the NIH-3T3 images and boxes are an unpublished in-lab collection. No license or terms are stated on the card or in the listing, and the sources have their own terms, so license is unknown. No paper is cited on the card or found; pixel size, organisms of the in-lab sets and annotation procedure are not documented (organisms inferred from the sub-dataset names: human blood, rat C6, mouse 3T3). Small, evaluation-oriented set; images overlap with the public BBBC malaria set and BCCD already used elsewhere.'
