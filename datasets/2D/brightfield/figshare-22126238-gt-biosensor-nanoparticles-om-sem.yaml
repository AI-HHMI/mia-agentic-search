notes: 'Zip listing (6,777 files): 100 nm set has OM jpg 1,614, SEM tif 1,614, annotation csv 1,596; transfer
  sets 50 nm (120), 200 nm (251), 300 nm (230) with csv; 139 hard-negative OM jpgs without annotations.
  n_items 2215 = OM/SEM pairs. How the points were made is not stated, so source is unknown. Image Format.txt
  gives the OM field of view (169 x 141.4 um^2) and SEM crop sizes per magnification but no pixel size,
  so voxel_size_nm is null. The paper (Nano Today 2023) is not open access. No splits. SEM is filed as
  other. organism: none (nanoparticles on a biosensor, no organism named). enricher: size_bytes exact
  from figshare API / file listing (was 3.7497e9 rounded); channels 3 (RGB) from headers (was null); annotation
  CSV coordinates are in SEM pixels (sampled).'
