title: Facile quantification of nanosized bioparticles in bright-field micrograph via deep learning
short_name: Nanoparticle counting, paired OM and SEM
description: Paired bright-field optical microscope (OM, JPEG) and scanning electron microscope (SEM,
  TIFF) images of nanosized bioparticles on a Gires-Tournois (GT) resonator biosensor, with per-image
  CSV point annotations of the particles. 1,614 OM/SEM pairs of 100 nm particles (1,596 annotated) for
  the main model, plus 50, 200 and 300 nm sets (120, 251, 230 pairs) for transfer learning and 139 hard-negative
  OM images (defects, impurities).
