notes: 'Per the Zenodo record the images come from an automated airborne-pollen detection system (Cao
  et al., EWSN 2020), captured on 23.05.2019 and 26.05.2019, with manually produced bounding boxes. The
  paper reports 1077 processed samples with 9170 depth layers (matching the 9170 .jpg in data.zip) and
  9059 annotated pollen grains; 46% of layers contain no pollen; over 15 pollen types occur but the boxes
  are used for single-class pollen detection. Pixel size not stated on the record or paper (camera: IMX179
  sensor, max 3264x2448 px). weights.zip holds pretrained detector weights (counted in size_bytes, which
  is the complete listing). enricher: classes.names has 2 classes (pollen, maybe); 4,976 label files for
  9,170 layers (layers without pollen have none); 5 folds per day.'
