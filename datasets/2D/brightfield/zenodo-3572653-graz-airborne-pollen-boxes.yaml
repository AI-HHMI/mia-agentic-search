notes: "Per the Zenodo record the images come from an automated airborne-pollen detection system (Cao et al., EWSN 2020), captured on 23.05.2019 and 26.05.2019, with manually produced bounding boxes. The paper reports 1077 processed samples with 9170 depth layers (matching the 9170 .jpg in data.zip) and 9059 annotated pollen grains; 46% of layers contain no pollen; over 15 pollen types occur but the boxes are used for single-class pollen detection (class names file not read). data.zip also holds fold train/test lists and ~5k .txt files (listing via peek_archive; label file contents not opened). Pixel size not stated on the record or paper (camera: IMX179 sensor, max 3264x2448 px). weights.zip holds pretrained detector weights (not counted). Only the first 40 archive paths were shown by peek_archive."
