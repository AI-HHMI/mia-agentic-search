id: zenodo-10526360-clinical-bacteria-gram-mrose
title: Clinical Bacteria DataSet (Gram-stained M-ROSE images with detection and segmentation labels)
short_name: Clinical Gram-stained bacteria boxes (brightfield)
description: >-
  Gram-stained smear images from lower respiratory tract specimens (BALF and endotracheal aspirates) of
  lung-infection patients, collected 2018-2022 at the Chinese PLA General Hospital for microbiological rapid
  on-site evaluation (M-ROSE). 1,705 raw images (4,912 x 3,684 px) plus a derived DeepDataSet (640DataSet,
  DetectionDataSet, SegmentationDataSet) ready for training detection and segmentation networks. About 11.4k
  bacteria are boxed and classified as Gram-negative/positive cocci or bacilli.
