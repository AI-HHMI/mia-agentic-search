notes: 'Two Zenodo files: RawImageDataSet.zip (18.7 GB, 1,705 raw images) and DeepDataSet.zip (1.9 GB;
  peek_archive shows 18,015 jpg, 12,016 txt and 12,010 json files, with a 640DataSet/images folder). Paper
  reports 3,371 negative cocci, 1,462 positive cocci, 5,799 negative bacilli, 1,192 positive bacilli annotated
  with LabelImg boxes; segmentation labels were also produced; a 7:2:1 train/val/test split was used for
  benchmarks but the split files were not confirmed in the archive listing. Microscope: Olympus CX31 with
  100x objective; pixel size not stated on the Zenodo page or in the paper. The txt/json annotation formats
  are inferred from file extensions, not opened. DeepDataSet images are crops (640 px) of the raw images.
  Total size is the sum of the two zips (about 20.5 GB) per Zenodo file listing. enricher: txt/json opened
  (YOLO boxes, LabelMe polygons); train/val/test.txt split lists found, so splits_provided true.'
