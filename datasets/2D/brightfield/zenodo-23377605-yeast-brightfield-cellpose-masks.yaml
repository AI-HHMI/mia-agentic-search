description: 64 brightfield microscopy images (Nikon ND2) of Saccharomyces cerevisiae and Schizosaccharomyces
  pombe from 16 wells of a 96-well plate (four fields per well), with one integer-ID label-image TIFF
  per image from Cellpose-SAM segmentation, per-cell morphology CSVs and QC overlays. Collected to demonstrate
  a cloud-scalable single-cell phenotyping pipeline.
