notes: 'TCIA offers one 6.8 GB package (version 1, 2021-11-12) via an Aspera link; the page does not itemise files, so the label file format was not verified and the paper says 171,374 images (page: 171,375). The page does not state whether registration is needed for the Aspera download. Pixel size not stated on the TCIA page or in the paper (the paper cites 250 x 250 px patches around annotated cell centres). Ground truth was assigned by cytologists to patches around automatically located cell centres.'
