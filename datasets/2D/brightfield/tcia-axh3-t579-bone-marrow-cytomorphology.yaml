schema_version: '1.2'
id: tcia-axh3-t579-bone-marrow-cytomorphology
title: An Expert-Annotated Dataset of Bone Marrow Cytology in Hematologic Malignancies
short_name: Bone marrow cell classification (brightfield)
description: 171,375 single-cell images (250 x 250 px JPG patches) from May-Gruenwald-Giemsa/Pappenheim stained
  bone marrow smears of 945 patients with hematological diseases, digitised on a Zeiss Axio Imager Z2 automated
  microscope at 40x oil immersion. Each cell patch was classified by experienced cytologists at the Munich
  Leukemia Laboratory into one of 21 morphological classes (blasts, lymphocytes, neutrophil stages,
  promyelocytes, erythroblasts, artefacts and others).
