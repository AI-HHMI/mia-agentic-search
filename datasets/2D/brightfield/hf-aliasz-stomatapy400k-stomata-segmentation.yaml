title: StomataPy400K - stomata and pavement cell segmentation across 425 plant species
short_name: StomataPy400K plant stomata masks (multi-modal)
description: 7,838 microscopy images of leaf epidermis from 425 plant species in seven modalities (clear-stain
  brightfield, imprint brightfield and DIC, leaf brightfield, leaf topometry, peel brightfield, peel SEM)
  with 393,671 segmentation masks (pavement cells, stomatal complexes, and the stoma, outer ledge and
  pore subclasses), of which about 74% were auto-labelled. Compiled from 28 annotated source datasets
  plus the authors' own peel images.
