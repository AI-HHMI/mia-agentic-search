notes: 'The Hugging Face repo is gated (manual approval, contact info required), hence access: registration; only the
  file tree (15,679 files: tif/jpg/png images with one JSON each, across the seven modality folders) and the dataset
  card could be read. The card is a partial cached view: counts of 7,838 images, 425 species and 393,671 masks (290,898
  auto-labelled, 73.9%) are as stated there; the pretty_name in the card says StomataPy300K. Dataset licence on the card
  is CC BY-NC 4.0, but each of the 28 source datasets keeps its own licence (CC BY, CC0, MIT, GPL-3.0). No publication
  was found; pixel size is per image in the JSON notes (pixels per micrometre) so voxel_size_nm is null; sizes are not
  reported by the API. The annotation JSON schema was not inspected; annotations_verified is false because the files could not be opened.'
