notes: 'Record totals 1.7 GB, mostly trained weights and code; size_bytes covers the six data zips (four image zips, lasiodiplodia.zip,
  splits.zip). lasiodiplodia.zip has annotations only (images from Crespo-Michel et al. 2023). License field says CC-BY-NC-ND-4.0
  but archive LICENSE.txt says CC BY-NC 4.0; the Zenodo field is recorded. organisms: Alternaria alternata = alternaria_alternata.zip,
  Hortaea werneckii = hortaea_werneckii.zip, Colletotrichum siamense = colletotrichum_siamense.zip, Neopestalotiopsis sp.
  = neopestalotiopsis.zip. enricher: pixel size not stated anywhere (A. alternata / H. werneckii shot with smartphones through
  the eyepiece, variable resolution per GitHub README).'
