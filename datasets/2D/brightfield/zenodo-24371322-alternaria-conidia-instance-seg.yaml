title: Instance-level segmentation of fungal conidia (Alternaria alternata and other taxa), bright-field
short_name: Fungal conidia instance segmentation (brightfield)
description: Bright-field micrographs of fungal conidia with LabelMe polygon instance annotations, released with the cIEF-Net
  manuscript. 146 images of Alternaria alternata ATCC 20084 (24,686 conidia) and 87 of Hortaea werneckii (11,135), plus
  few-shot target sets for Colletotrichum siamense (59 images, 912 instances) and Neopestalotiopsis (83 images, 374),
  and cross-validation / few-shot split manifests.
