notes: 'Record text says 162 images (Ascaris 67, H. diminuta 27, F. buski 32, Taenia 36) but the zip lists 2287 JPGs (H. diminuta 915, Ascaris 849, Taenia 423, F. buski 100), so the zip likely contains crops or augmented copies; counts unreconciled. The arXiv preprint (2107.00968) confirms 640x480 px, 10x USB microscope, 162 images labelled by experts, and 100x100 px egg/background patch labelling for training; it does not state whether box annotations are released, and the zip contents were not matched to the 162 images. Pixel size not stated. Zenodo lists a 10.1007 DOI as the record DOI field; the Zenodo DOI itself was not seen, so doi is null.'
