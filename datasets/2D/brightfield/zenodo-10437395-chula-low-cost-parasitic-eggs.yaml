notes: 'Zenodo text: 162 images (AL 67, HD 27, FB 32, Tn 36), 640x480 px, 10x, labelled by experts. The zip holds
  2287 JPGs (HD 915, AL 849, Tn 423, FB 100), apparently more images or crops than described; counts unreconciled.
  Pixel size not stated (Zenodo, arXiv 2107.00968). Zenodo''s DOI field holds the paper DOI, so doi is null. enricher:
  model_label.csv in the zip has 3897 pixel bounding boxes (class_id 0-3); 2214 of the 2287 JPGs have rows, 1652
  rows name images not in the zip, 153 rows have xmax<xmin or ymax<ymin. Added bounding-box and detection (were
  classification only). organisms: one per folder: Ascaris lumbricoides = ''Ascaris lumbricoides/'', Hymenolepis
  diminuta = ''Hymenolepis diminuta/'', Fasciolopsis buski = ''large egg (Fascilopsis buski)/'', Taenia = ''Taenia
  spp_/'' (was empty). channels 3 = RGB JPEG (was null).'
