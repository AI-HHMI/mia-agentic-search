  notes: 'Listing: Supplementary.zip (the only file), 763,740,003 bytes exact, 1,350 members. Probe: Raw images/Banykus/Fibula/banykus_p09.JPG
    is 1936x2584x3 uint8 JPEG (the paper says 2576x1936). Sample (one pair, MD-Experiment-0004_p03_0_0): sub-image 968x1288x3
    uint8, 4-255, channels differ (real colour); label 968x1288 uint8 palette PNG with values {0: 816 px, 2: 754 px, 255:
    1,245,214 px}. Values from that one sample only. The 146 full raw images (and 28 excluded Haplocheirus images) have no
    label files; labels exist only for sub-images. Sub-image names are not unique to a taxon (MD-Experiment-0001 occurs under
    Haplocheirous and Xixianykus). Voxel size not found; checked: JPEG headers (no calibration), Zenodo record and API description,
    zip members (no README), paper full text on the Frontiers page (no pixel size, magnification or scale stated).'
