notes: 'Supplementary.zip (764 MB, listed with peek_archive): Raw images/<taxon>/<bone>/ 146 JPG (plus Haplocheirus tibia),
  Sub-images/ 584 JPG, Labels/ 584 PNG. Paper (Frontiers page, full text via WebFetch; Europe PMC has no full text): normal-light
  thin-section images, 2576 x 1936 px, each split into four 1288 x 968 sub-images; primary and secondary osteons labelled
  by the authors and cross-validated; the paper trains on 107 raw images and tests on 39 (five taxa), but the deposit has
  no split files. Pixel size, microscope and magnification are not stated in the paper or record (paper refers to earlier
  work), so voxel_size_nm is null. The organism field is empty because these are fossil taxa, which NCBI names do not cover.
  enricher: label classes background / VC / CLB from paper Methods; values {0,2,255}, mapping undocumented.'
