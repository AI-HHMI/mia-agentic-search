title: Image dataset from multiplex IHC stained TMA sections
short_name: IHC TMA nuclei segmentation and classification
description: 266 256x256 image patches from multiplex immunohistochemistry-stained tissue microarray sections
  of non-small-cell lung cancer patients (stains CD3, CD20, CD38, CDK4, Cyclin-D1, Ki67, P53, CD34, CD68,
  D2-40, FAP, SMA) with manually annotated nuclei (9,725 nuclei, instance labels with positive/negative
  nucleus classes), split into 195 training, 36 validation and 35 test patches.
