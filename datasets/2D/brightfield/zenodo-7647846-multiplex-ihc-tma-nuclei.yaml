      \      images/   266 .png  (28.8 MB)   fold<1|2|3>_<n>_<stain>.png\n      masks/    266 .npy  (418.4\
      \ MB uncompressed)  same stems\n"
    n_files: 2
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/7647846/files/IHC_TMA_dataset.zip::IHC_TMA_dataset/images/fold1_0_CDK4.png
    - https://zenodo.org/records/7647846/files/IHC_TMA_dataset.zip::IHC_TMA_dataset/masks/fold1_0_CDK4.npy
    size_bytes: 1665281
    description: One 256x256 patch (fold1_0_CDK4) and its 3-channel nucleus mask.
  arrays:
  - role: raw
    path_pattern: IHC_TMA_dataset/images/*.png
    format: png
    axes: yxs
    shape:
    - 256
    - 256
    - 3
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 119
    - 242
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: label
    path_pattern: IHC_TMA_dataset/masks/*.npy
    format: other
    axes: cyx
    shape:
    - 3
    - 256
    - 256
    shape_varies: false
    dtype: int64
    compression: none
    value_range:
    - 0
    - 29
    encoding: instance-ids
    classes:
    - id: 0
      name: negative nuclei (instance IDs)
    - id: 1
      name: positive nuclei (instance IDs)
    - id: 2
      name: background flag (0 = nucleus, 1 = background)
    alignment: same-grid
    alignment_notes: masks/<stem>.npy pairs with images/<stem>.png; 256x256 both. Channel meanings from
      readme.txt.
  notes: 'Complete Zenodo listing (zip + readme.txt, 30,782,037 B; zip members expanded: 266 PNG + 266
    NPY). PNG probed and sampled: 256x256x3 uint8 RGB, deflate, values [119, 242] in one patch. Masks
    are uncompressed NumPy .npy (format other); read one member by range with a short script (zipfile
    + numpy.load(allow_pickle=False)): shape [3, 256, 256] int64; ch0 values 0-29 (29 negative nuclei
    + background), ch1 all 0 (no positive nuclei in this CDK4 patch), ch2 {0, 1}. classes lists the channels,
    not label values: per readme.txt ch0/ch1 hold instance IDs (0 = background, i = ith nucleus) for negative/positive
    nuclei and ch2 is 0 for nucleus pixels, 1 otherwise. Values are from one patch. Pixel size and scanner
    are not stated in readme.txt.'
