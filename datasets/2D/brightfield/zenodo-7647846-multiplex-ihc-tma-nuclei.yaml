notes: 'Counts and annotation description (QuPath, pathologists, 9,725 nuclei, folds 1/2/3 = train/validation/test,
  195/36/35 patches) are from the Zenodo description; the zip listing (peek_archive) shows 266 PNG images
  and 266 matching .npy masks, matching 195+36+35. Image modality is recorded as brightfield because slides
  are IHC-stained histology; the scanner, magnification and pixel size are not stated on the Zenodo page
  or in the paper metadata. The paper is paywalled: only Europe PMC and Crossref metadata (no full text
  or abstract) could be read, so no Methods details were checked. Masks are NumPy arrays (.npy), listed
  in annotations.format. enricher: size_bytes now includes readme.txt (complete listing); channels 3 from
  PNG headers (was null).'
technical:
  method: sample
  size_source: file-listing
  layout:
