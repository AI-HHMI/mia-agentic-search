notes: 'Zenodo page has no description; details come from the Mendeley Data deposit
  of the same data (10.17632/8fhwmj63vw/3: 1,956 images from 9 patients for subtype
  classification, 18,641 for drug response). Zip listings (peek_archive): classified_data.zip
  = 1956 PNG + LCO_mask_{train,val,test}.csv; livedead_data.zip = 3103 PNG in train/test
  class folders; Efficacy_6h.zip = 4571 PNG in data_6h/{train,test}/<subtype>/<Efficient|...>.
  Pixel size, microscope, magnification and the labelling procedure are not stated
  on either page; no paper found (one web search), so annotations.source=manual is
  inferred from folder labels and drug response labelling may be derived from treatment
  outcome. Total size = sum of the six zips (4.39 GB). Image count is not given as
  a total. Mendeley copy also includes the IMANet / MT-MANet models.'
