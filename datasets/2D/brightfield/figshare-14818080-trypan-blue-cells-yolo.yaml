notes: 'Description, license and file listing read from the figshare API record and the zip contents (peek_archive).
  Real-image boxes are one txt per image; how the real-image boxes were drawn (hand or tool) is not stated
  on the page, so source is mixed (synthetic boxes are generated automatically, per the description).
  The description says 15 real images (8, 16, 19, 21-25, 33-39) are held out for testing and the other
  24 supplied the masks and backgrounds for synthesis. Pixel size is not stated (the page gives a 2 mm
  x 1.5 mm field of view for the 2592 x 1936 images, 4x objective). Organism not stated beyond NIH 3T3
  (and "animal cells"), so left empty. No paper by these authors found in Europe PMC; the page lists only
  the Chan et al. 2020 source for part of the images. Checked: figshare record, zip listing, classes.txt
  and a sample annotation file.'
