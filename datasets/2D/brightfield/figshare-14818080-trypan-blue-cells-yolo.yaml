schema_version: '1.2'
id: figshare-14818080-trypan-blue-cells-yolo
title: Trypan Blue stained Cells Image Dataset
short_name: Trypan blue live/dead cell boxes (brightfield)
description: 39 real brightfield colour images of trypan-blue-stained animal cells in a Neubauer chamber (21
  taken with a camera on a Nikon Eclipse E200, 4x objective, 2592 x 1936 px; the rest from a published study)
  with YOLO bounding boxes for live and dead cells, plus 2,442 synthetic images (2,192 train, 250 validation)
  built from single-cell masks with automatically generated YOLO boxes, the single-cell mask library, a
  train/test split table and a trained YOLOv4 counting model.
