  notes: 'Listing: Zenodo API (24 files, exact sizes, 9,770,089,998 bytes) + zip central directories (20 of 21 zips expanded, 5,870 members; with the remaining field zip this matches the README total of 5,914 images). Probed one member of each image kind; sampled one 512 PNG crop (338,026 bytes) and one full field (10,952,290 bytes): RGB, samples not identical, values 1-255 (one sample each). Labels are image-level donor species (classification), no masks or boxes. voxel size not found; checked: PNG headers (no pHYs calibration reported), Zenodo API record, README ("Physical pixel-size calibration and detailed acquisition settings are unavailable"); no paper or code repository is linked. No single archive: the data come as 21 zips, all direct Zenodo file links (files[].links.self). 2D record: not covered by the miao layout yet.'
