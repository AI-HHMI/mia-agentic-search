notes: 'README (read in full) and file sizes: 880 full fields, 2,517 crops (each also as 256x256 JPEG), 19 species-specific field ZIPs plus two crop ZIPs; images.csv gives species per file. Labels are the donor plant species, not verified grain identity; donor numbers unknown, no pixel-size calibration (so voxel size null), microscope model unknown, camera E3ISPM08300KPC. No associated paper listed on the record or README. The Zenodo license field is empty; CC BY 4.0 is stated in README and LICENSE.txt. n_items counts crops. Size is the sum of all files. enricher: channels 3 (RGB PNG/JPEG, probed). organisms: one per <Genus_species>/ folder in every zip (Genus_species = organism name).'
