technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  1 file, 799.1 MB\n  DatatoProvide.zip  (152 members)\n    DatatoProvide/\n      test_ground_truth.csv\
      \          filename,count (20 rows, Set B)\n      train_original/   19 .tif      raw images\n  \
      \    train_labeled/    19 .tif      <stem>_<N>count_Flatten.tif (marks burned in)\n      test_original/\
      \     4 .tif + 4 _masks.npy   (Set A)\n      test_labeled/      4 .tif      <stem>_<N>count_Flatten.tif\n\
      \      test_original_csv/ 20 .tif     (Set B, counts in test_ground_truth.csv)\n      output/  \
      \          coordinates.csv, test_coordinates.csv, evaluation_results.csv, 8 .png\n      output/models/\
      \     polystyrene_model (609.4 MB, Cellpose-SAM model, not opened)\n      output/train_data/ 19\
      \ × (.tif, _masks.npy, _mask_check.png)\n      output/test_data/   4 × (.tif, _masks.npy, _mask_check.png)\n"
    n_files: 1
    listing_complete: true
