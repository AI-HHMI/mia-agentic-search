    alignment_notes: 'Columns filename,count: one particle count per test_original_csv image (Set B).'
  notes: 'Complete Zenodo listing (one zip, 799,106,577 B = size_bytes), members expanded. Read the zip
    directory and test_ground_truth.csv by range (20,636 B): header filename,count and 20 rows, matching
    the 20 TIFFs in test_original_csv. Probed one train_original and one train_labeled TIFF: 1500x1500x3
    uint8 RGB, uncompressed, ImageJ unit "inch" (no physical calibration). Sampled the pair: raw [99,
    245], mean 216.9; labeled [0, 255], mean 216.6, 210 unique values. The sampler hint "instance labels?"
    does not apply: the labeled file is the raw image with marks drawn in, so the point positions are
    not stored as coordinates (encoding: other). The .npy masks (output/ and test_original/) and output/*coordinates.csv
    look like model outputs and were not opened. Values are from one image.'
