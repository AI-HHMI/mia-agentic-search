notes: 'Kaggle page is client-rendered and returned only section headings, so the file listing, formats and dataset license could not be read. The arXiv paper lists CC BY-NC-SA 4.0 "upon acceptance" (NeurIPS 2025 D&B); the GitHub repo code license is MIT. Pixel size ~3.5 um from paper (40X, PPL/XPL); not confirmed in headers. 2-fold cross-validation by thin section (two CSV folds), no separate test split. Counts: 211,604 patches (256x256), 1,164 full images. Download requires a Kaggle account.'
