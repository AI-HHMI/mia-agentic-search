description: 2,570 JPEG microscopy images (10x, cresyl violet / Nissl stain) of tissue sections through the cerebellum of
  21 mouse brains, 11 Lurcher mutants and 10 wild-type controls. Each image carries its animal's class (lurcher or wild) and
  case id; predefined cross-validation folds with train/val/test JSONL manifests are provided for classifying genotype from
  histology.
