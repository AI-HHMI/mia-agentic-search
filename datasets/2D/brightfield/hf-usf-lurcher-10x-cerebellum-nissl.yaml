notes: 'Hugging Face file listing: 2,570 JPG images (774 under lurcher/, 1,796 under wild/), 12 fold JSONL manifests, metadata CSVs and a prompt bank JSON. The label is the animal genotype (per animal, assigned by the data providers), not per-image expert annotation; the paper frames it as multiple-instance learning with majority vote per animal. Pixel size, image dimensions and microscope are not stated on the dataset card or in the paper text read (alphaxiv full text).'
