notes: 'Mendeley API lists 5 image folders (71, 52, 22, 55, 100 files) plus README.txt, Metadata.xlsx
  and a CSV; the README gives the per-class counts above (total 300). Files are mostly JPEG with a few
  PNG, TIFF and one GIF (GIF is not a schema format and is not listed). The record title says SinaiU-OMP
  while the README and description say SinaiU-OMD. No associated paper is listed on the page, so none
  was read. Magnification, scanner and pixel size are not stated on the page or README. Only image-level
  labels; no masks. enricher: download_url = Mendeley download-all zip (573,453,628 B, redirects to S3,
  range requests work; was null). Image sizes vary (2160x2960, 1536x2048, 1080x1920 seen).'
