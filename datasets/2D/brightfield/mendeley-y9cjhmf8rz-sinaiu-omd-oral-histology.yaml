notes: 'Mendeley API lists 5 image folders (71, 52, 22, 55, 100 files) plus README.txt, Metadata.xlsx and a CSV; the README
  gives the per-class counts above (total 300). Files are mostly JPEG with a few PNG, TIFF and one GIF (GIF is not a
  schema format and is not listed). The record title says SinaiU-OMP while the README and description say SinaiU-OMD. No
  associated paper is listed on the page, so none was read. Magnification, scanner and pixel size are not stated on the
  page or README. Only image-level labels; no masks. The file listing could only be read through the Mendeley API; the
  download-all zip redirects to S3, so download_url is null.'
