title: 'PW-BALFC: clinical bronchoalveolar lavage fluid cell dataset for detection and instance segmentation'
short_name: BALF cells instance segmentation (brightfield)
description: 2,105 brightfield images of Diff-Quick or Gram-stained bronchoalveolar lavage fluid smears
  from the Chinese PLA General Hospital (2018-2024), with contour (polygon) instance annotations and bounding
  boxes for seven cell types (erythrocyte, ciliated columnar epithelial, squamous epithelial, macrophage,
  lymphocyte, neutrophil, eosinophil), 13,263 cells. Provided as 1,903 original 4,912 x 3,684 px images,
  2,105 images resampled to 853 x 640 px, visualisation overlays and YOLO-format labels.
