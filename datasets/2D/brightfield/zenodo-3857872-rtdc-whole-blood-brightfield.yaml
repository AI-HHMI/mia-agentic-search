    first 50 events of each file: [0, 139] max. ''none'' normalization inferred: 8-bit camera frames, no rescaling mentioned.
    Many tiny .rtdc in Gs_Blood_Train hold 1-15 events. No single archive: 4 data zips; data.download_url is the record page.'
