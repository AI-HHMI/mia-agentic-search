notes: 'Sources checked: Zenodo record, file listings of all four zips, and the AIDeveloper paper (full text). Paper: >1.2
  million brightfield images, populations gated manually by size and brightness. .rtdc is the dclab HDF5 format. Labels are
  per-file gates, not per-image expert labels, and some files are model-predicted sets (names with PredictedBy). Test data
  are on figshare. Related bundle 10.5281/zenodo.3967000 holds other AIDeveloper datasets. enricher: voxel size 340 nm from
  the .rtdc attribute ''imaging:pixel size'' = 0.34 (dclab: ''Pixel size [um]''), same in one file of each of the 4 zips (was
  null). Each file also holds an automatic dclab contour mask per event.'
