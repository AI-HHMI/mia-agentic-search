  notes: 'Listing: Zenodo API + zip central directories (tools/listing.py --expand-zips, complete, exact sizes). Read 4 rtdc
    members in full via zip range requests (~56 MB): KIK Eos (598 events), Dextran PredictedEos_butActually_DRBC (1,900),
    Gs Neutros ''06MC - M1'' (788; this file has no events/mask), Gs Eos M2 (1 event); probed Cambr Eos_15 header
