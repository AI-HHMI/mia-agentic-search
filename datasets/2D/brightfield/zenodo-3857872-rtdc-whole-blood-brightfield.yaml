title: Real-time deformability cytometry (RT-DC) brightfield images of human blood cells, whole blood count
short_name: Blood cell classes in RT-DC brightfield images
description: Brightfield images of single human blood cells recorded by real-time deformability cytometry (RT-DC) in a microfluidic
  constriction channel, used to train a neural network that performs an image-based whole blood count. Four zip archives hold
  RT-DC measurement files, one file per gated cell population (for example neutrophils, eosinophils, lymphocytes, monocytes,
  red blood cells, doublet red blood cells, thrombocytes), from several donors and measurement sessions. The paper reports
  more than 1.2 million brightfield images in this training set. The final model and training meta-file are included; testing
  data are hosted separately on figshare.
