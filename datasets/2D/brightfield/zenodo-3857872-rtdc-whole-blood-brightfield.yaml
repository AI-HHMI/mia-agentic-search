notes: 'Sources checked: Zenodo record, file listings of all four zips, and the AIDeveloper paper (full text).
  Paper: >1.2 million brightfield images, populations gated manually by size and brightness. .rtdc is the
  dclab HDF5 format; files were not opened, so image count and pixel size are unconfirmed (paper: 250 x 80
  pixel region, no pixel size). Labels are per-file gates, not per-image expert labels, and some files are
  model-predicted sets. Test data are on figshare. Related bundle 10.5281/zenodo.3967000 holds other
  AIDeveloper datasets.'
