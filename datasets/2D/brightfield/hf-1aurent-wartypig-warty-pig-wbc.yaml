notes: 'Counts disagree across sources: the card text says 3,457 JPEG images, the viewer shows 3,156 rows (cropped
  1.41k + augmented 1.46k + original 285), and IEEE DataPort lists 3,539 (667 raw, 1,464 augmented, 1,408 cropped);
  n_items uses the mirror''s rows. Augmented images are derived by Keras preprocessing layers. Labels were manually
  classified and verified by a licensed medical technologist (per IEEE DataPort). On IEEE DataPort the files are
  on a Google Drive link and need a subscription login; the Hugging Face parquet mirror is open. The landing pages
  cite no paper, so none is listed. Image sizes vary (600 to 5,280 px wide), staining not stated, pixel size not
  stated. Per-class counts on the IEEE page for cropped images: lymphocyte 905, neutrophil 319, monocyte 82, eosinophil
  82, basophil 20. Organism is the sample species: Sus cebifrons. enricher: the 285 "original" rows carry no label
  (gen_script.py: no_label=True); labels only on cropped + augmented.'
