description: Smartphone images of thin peripheral blood smears from juvenile Visayan warty pigs (100x oil immersion)
  for classifying five white blood cell types (neutrophil, lymphocyte, monocyte, eosinophil, basophil). The Hugging
  Face mirror has three splits, cropped single-cell images (1.41k), augmented images (1.46k) and original full images
  (285). Mirror of the IEEE DataPort dataset by Alipo-on et al.
