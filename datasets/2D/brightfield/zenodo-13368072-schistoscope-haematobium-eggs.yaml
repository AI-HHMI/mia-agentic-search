notes: 'Two zips read with peek_archive: nov2021 has 2,280 JPGs and mar2020 has 2,088 (images named <visit>_<patient>_<fov>_<contrast>.jpg),
  each with an annotations CSV and a patients list; enricher: size_bytes = exact listing incl. the 3 MB dataset PDF. The Zenodo
  record has no description text and no author list in its metadata (authors left empty); the paper title here is the PLOS
  NTD article that the record names via isMetadataFor. Pixel pitch is about 1 um/pixel per the paper. The paper describes
  the annotations as bounding boxes, but the CSV columns I read give a single x,y coordinate per object (nov2021 sample rows),
  so they are listed as points. Annotated by one microscopist, verified by a second. The paper split patients into folds for
  training but no split files are provided.'
