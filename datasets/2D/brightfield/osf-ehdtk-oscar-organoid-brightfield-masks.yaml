notes: 'Zips listed: spherical_images_used (924 JPG, train 740 / val 184, 300x300 px, 31 MB), irregular_images_used
  (195 JPG, train 157 / val 38, 512x512 px, 6.3 MB), json_organoid_annotations (VIA JSON: irregular 197
  entries / 1,573 regions; spherical 2,895 entries / 9,965 regions, more entries than images in the zip).
  Images come from a subset of the public OrgaQuant organoid images (catalogued separately as boxes; here
  re-annotated with outlines) and in-house EVOS 4x images. Pixel size not stated. No licence is given
  on the OSF project, wiki, README or paper, so licence is unknown. Models, notebooks and the csv area
  / nucleus-count tables are not counted in size_bytes. enricher: spherical images are 300x300 greyscale
  JPEG (sampled); the project README.rtf calls both sets 512x512, which matches only the irregular file
  names.'
