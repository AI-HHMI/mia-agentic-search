title: 'OSCAR: images, organoid annotations and models for organoid cell counting from bright-field images'
short_name: Colorectal organoid outlines (brightfield)
description: Brightfield images of patient-derived colorectal organoids (cystic/spherical and budded/irregular),
  cropped to 300x300 and 512x512 px, with manually drawn VGG Image Annotator polygon outlines of every
  organoid, split into train and val folders and used to train the OSCAR Mask R-CNN models; shared with
  models and organoid area/nucleus-count tables.
