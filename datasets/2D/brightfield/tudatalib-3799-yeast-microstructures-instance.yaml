notes: 'Hosted at TUdatalib (handle https://tudatalib.ulb.tu-darmstadt.de/handle/tudatalib/3799, zip yeast_cell_in_microstructures_dataset.zip); that page is behind Anubis bot protection and could not be
  fetched, so the file listing, size and exact download URL were not verified (landing_url is the project page that links to it). MIT license is stated on the project page for the dataset and code; the
  arXiv page states none. Samples are PyTorch .pt files (not in format enum, hence other); the paper says images were cropped to 128x128 from higher-resolution raw data. Microscope, objective and pixel
  size not stated on the project page or in the paper text read; voxel_size_nm left null. Split from paper: 296 train / 49 val / 148 test. Pixel-wise instance labels were manual. Related but different dataset:
  tudatalib-3930-tyc-yeast-microstructures (TYC dataset of the same group).'
