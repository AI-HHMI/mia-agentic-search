notes: 'One zip (YOLOv5 PyTorch export, 16,687 files = jpg + txt pairs, plus data.yaml). Image counts from Zenodo page (5,928 train + 2,415 valid); the valid split is called the test set in the article.
  About half the images have no bounding box (2,927 train, 1,664 valid). Pixel size ~0.32 um at 20x from paper Methods (some older 40x images downsized to match); microscope/camera model not stated. Organism
  recorded as Arcellinida (testate amoebae, several genera: Amphitrema, Archerella, Assulina, Euglypha, Heleopera, Hyalosphenia, Nebela, Planocarina); classes also include undefined round/transparent objects.
  Bounding boxes drawn by microbiology experts in Roboflow. Source TIFFs were exported as JPG. enricher: channels 3 (RGB JPEG, probed); size_bytes = full Zenodo listing (was zip only).'
