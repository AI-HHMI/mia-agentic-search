title: Microscopic sputum images with expert bounding boxes for acid-fast bacilli (tuberculosis) detection
short_name: Sputum AFB tuberculosis detection (brightfield)
description: Light-microscope images of sputum smears from 208 patients (1,029 images stated; 1,016 JPG
  files in the archives) at 100x objective, 1280 x 960 JPG, with expert-drawn YOLO bounding boxes of a
  single class, 'AFB Object', for detecting small tuberculosis bacilli. Provided twice, as per-patient
  folders with image/txt pairs and as a ready YOLO train/valid layout with data.yaml.
