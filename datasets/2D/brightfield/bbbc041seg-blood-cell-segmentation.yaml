title: 'BBBC041Seg: blood cell segmentation dataset'
short_name: BBBC041Seg blood-smear cell masks (brightfield)
description: 1,328 images of Giemsa-stained P. vivax thin blood smears (from BBBC041), each with a pixel-level binary
  cell segmentation mask covering uninfected (RBC, leukocyte) and infected cells (gametocyte, ring, trophozoite,
  schizont); the released masks carry no per-class or per-instance IDs. ~93.5k objects and a 1,169 train / 159 test
  split per Dataset Ninja.
