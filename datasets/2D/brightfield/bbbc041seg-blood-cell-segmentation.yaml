notes: 'Images come from BBBC041 (whose page states CC BY-NC-SA 3.0 for its images); the GitHub README states MIT
  for this repository. Differs from the BBBC041 detection record by providing masks. Paper not open access (abstract
  only); pixel size, microscope and annotation procedure not found, so annotations.source unknown. enricher: masks
  are binary foreground (0/255), no per-cell IDs or classes in the files, so types semantic-segmentation (was instance-segmentation,
  from Dataset Ninja''s re-hosted version). enricher: splits_provided false (was true): the release zip has no train/test
  folders; the 1,169/159 split is Dataset Ninja''s. enricher: formats png + jpeg (119 images are JPEG), channels
  3 (RGB), size and direct link from the Google Drive zip. organisms: both in every image (P. vivax parasites within
  human blood), not separable by folder.'
