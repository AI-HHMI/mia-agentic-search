title: 'BBBC041Seg: blood cell segmentation dataset'
short_name: BBBC041Seg blood-smear cell masks (brightfield)
description: 1,328 images of Giemsa-stained P. vivax thin blood smears (from BBBC041)
  with pixel-level instance segmentation ground-truth masks for uninfected (RBC, leukocyte)
  and infected cells (gametocyte, ring, trophozoite, schizont); ~93.5k labeled objects.
  1,169 train / 159 test per Dataset Ninja.
