notes: 'Dataset page opac.ll.chiba-u.jp returns 403 and the five zips (D_part1-3, E, P; 6.92 GB by Content-Length)
  ignore range requests, so their contents were not listed; PNG format, labels and splits come from the
  GitHub README file-naming description and the paper. Paper: 3,319 images (train 2,096 / validation 487
  / test 736 after excluding 27 undeterminable images), originals 960 x 1280 px split into four 480 x
  640 images for the model, Olympus BX50 with Nikon DS-L3 camera, 10x objective, bright-field, scale bar
  100 um in figures; pixel size not stated. No license stated for the images (article is CC BY 4.0), so
  license is unknown. Intermediate-stage images were used only in training. Zip sizes sum is a header
  value, not a listing.'
