notes: 'The data is only offered through a Baidu Cloud link (with an extraction code) on the GitHub README, which requires
  a Baidu account; access is therefore recorded as registration and there is no direct download URL. The data files were not
  listed, so the image format and folder layout are unknown (formats other), and annotation files were not seen. The MIT license
  is the GitHub repository license; the README does not say it covers the data. Paper (arXiv PDF, Europe PMC has no copy):
  50 patient folders, 612 images of 3200 x 2200 px, 27,109 instances, train/test split (sizes not stated), labelled with labelme;
  the abstract says polygonal masks while the text says annotation files hold bounding boxes and categories. Pixel size and
  microscope are not stated; modality is brightfield by assumption for Giemsa-stained smears. README warns of wrong labels
  -1 and 119 in the data. enricher: authors from the arXiv record of the paper (were empty).'
