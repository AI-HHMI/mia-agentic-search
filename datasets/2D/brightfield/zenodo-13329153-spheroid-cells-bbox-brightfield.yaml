notes: 'Zenodo page is short and cites no paper; no publication found, so none listed. peek_archive: yolo_omero_dataset.zip
  (29.6 MB) holds 1,615 TIFF crops (pixel_images/, e.g. 136x146 px, uint8 per transfer.xml) plus transfer.xml (OME-XML).
  The first 200 KB of transfer.xml show images with ROIRef entries, but the ROI definitions were beyond the part read, so
  box count, class names and who annotated them were not verified. Pixel size, microscope, cell type and organism are not
  stated on the page or in the headers read. n_items is the TIFF count. Description says objects carry stage labels and a
  linked repository has a YOLO tutorial (not opened).'
