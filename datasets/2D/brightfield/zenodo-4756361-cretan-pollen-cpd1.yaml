    RAR library; deleted after). Raw Data members are all compressed (method 3), so the JPGs and CSVs
    could not be read. Cropped and Isolated PNGs are mostly stored (4,023 and 3,985 of 4,023), so they
    were read directly: Cropped/1.Thymbra/Lam.T.capX400wF(1029)(0)A-1.png RGB uint8 161x161, 5..183; Isolated/...
    same name RGB 161x161, 0..182 (one file each). TensorSwitch reads zip members only, so no sample unit
