notes: 'The record holds three RAR archives (Raw Data.rar 154.6 MB, Cropped Pollen Grains.rar 109.0 MB,
  Isolated Pollen Grains.rar 84.5 MB) and a README; size_bytes is their sum plus the README. Listed the
  first 12 MB of Raw Data.rar: it has 20 labels.csv files and the raw images are JPEG (about 0.95 MB each,
  3072 x 2304 per the CSVs). The 20 CSVs total about 4,420 box rows; the abstract says 4,034 segmented
  grains, so counts differ and were not reconciled. Pixel size and objective details are not on the Zenodo
  record; the paper (MDPI Applied Sciences) could not be fetched (403) and is not in Europe PMC, so Methods
  were not read. Organism not stated beyond plant species; left empty. enricher: RAR5 headers of all three
  archives read: Raw Data has 156 JPG fields and 20 labels.csv (one per taxon); Cropped and Isolated hold
  4,023 grains each as PNG (20 taxon folders). n_items = raw fields.'
