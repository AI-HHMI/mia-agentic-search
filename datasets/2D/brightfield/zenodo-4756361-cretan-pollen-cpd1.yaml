notes: 'The record holds three RAR archives (Raw Data.rar 154.6 MB, Cropped Pollen Grains.rar 109.0 MB, Isolated Pollen Grains.rar 84.5 MB)
  and a README; size_bytes is their sum plus the README. Listed the first 12 MB of Raw Data.rar: it has 20 labels.csv files and
  the raw images are JPEG (about 0.95 MB each, 3072 x 2304 per the CSVs). The 20 CSVs total about 4,420 box rows; the abstract
  says 4,034 segmented grains, so counts differ and were not reconciled. The number of raw images was not listed in full, so n_items is null.
