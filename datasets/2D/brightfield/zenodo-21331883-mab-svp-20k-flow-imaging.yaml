short_name: Antibody protein particles, flow imaging (FlowCam)
description: 20,000 PNG images of individual subvisible particles from monoclonal antibody (mAb) solutions
  imaged by flow imaging microscopy (FlowCam 8100, 10x), arranged in folders by stress type (heat or mechanical)
  and antibody (mAb1 to mAb8), with per-stress metadata CSVs and a list of images flagged as potentially
  non-proteinaceous.
