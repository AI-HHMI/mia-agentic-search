notes: 'Zenodo API record and zip listing (tools/peek_archive.py): 20,000 PNG files, 2 metadata CSVs, experimental_conditions.txt
  and potential_non_proteinaceous_images.txt. The conditions file states FlowCam 8100, 10x objective, 80 x 700 um flow cell and a
  pixel size of 0.7340 um/pixel (written as 734 nm). Images are small particle crops (probed: 33 x 33 and 64 x 28 px, 8-bit RGB).
  The record has no description beyond the title and no paper was found (Europe PMC title search failed), so who defined the labels
  is not stated; the labels are experimental conditions (stress type, antibody), not per-particle expert classes. Modality is
  recorded as brightfield because FlowCam acquires transmitted-light images; the record does not state it.'
