notes: 'Pixel size / magnification not stated on the Zenodo page, archive listing or paper Methods (OLYMPUS
  SZ2-ILST stereomicroscope, 3584x2748 px images); left null. dataset.7z listed through range requests:
  dataset/JPEGImages (686 .jpg) and dataset/SegmentationClass (686 .png masks). Original LabelMe JSON
  annotations are not in the listing (masks only); four classes per the paper: small VB, large VB, stem
  (''out''), cavity (''in''). The paper uses a random 9:1 split (617 train / 69 validation, seed 0) but
  the deposit has no split files. Size is the complete Zenodo listing of the three files (dataset.7z 210
  MB, rice_stem_pre_v1.1.rar 160 MB GUI/software, ONNX model 100 MB); the rar and onnx were not opened.
  Images are of one stain (phloroglucinol-HCl) and one lab. enricher: 7z header decoded via range requests:
  686 jpg + 686 png, same stems.'
