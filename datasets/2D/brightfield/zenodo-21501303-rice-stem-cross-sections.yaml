  notes: 'Zenodo listing complete (3 files, 470,213,841 B). dataset.7z is a solid LZMA2 archive: its LZMA-compressed
    header (16,551 B) was decoded with stdlib lzma via range requests and lists dataset/JPEGImages (686
    .jpg) and dataset/SegmentationClass (686 .png). The first 1 MB of the stream gave the first image,
    21c-02.jpg: JPEG RGB 3584x2748 (h 2748, w 3584, 3 samples), uint8 [0, 255], no DPI/EXIF calibration
    (JFIF density 1x1). The masks sit at the end of the solid stream, so reading one would mean downloading
    the whole archive; their encoding, IDs and shape are unverified. Class names from the paper (LabelMe
    tags in brackets); their IDs are not stated. TensorSwitch can''t read members of a 7z (zip only),
    so the sample is the whole archive. voxel size not found; checked: JPEG header, Zenodo API record
    and description, paper full text (Methods: OLYMPUS SZ2-ILST, 3584x2748 px, no scale), no code repo
    linked.'
