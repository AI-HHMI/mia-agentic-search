title: Rice stem cross-section microscope images with vascular bundle, stem and cavity masks
short_name: Rice stem cross-sections segmentation (microscopy)
description: 686 stereomicroscope images (3584x2748 px) of phloroglucinol-stained rice (Oryza sativa)
  stem cross-sections from 165, 120 and 17 accessions, annotated in LabelMe for large vascular bundles,
  small vascular bundles, stem outline and cavity, with PNG masks in a VOC-style layout. The deposit also
  holds a trained ONNX segmentation model and a Windows inference GUI archive.
