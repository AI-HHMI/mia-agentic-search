notes: 'Single DDS1.tar.gz (71.9 MB) containing PP/IMAGE and PP/MASK (2,636 BMP each) and NP/IMAGE (28,848
  BMP) plus one NP/MASK file, per the dataset''s own folder-directory PDF; the tarball itself was not
  opened (tar.gz cannot be listed remotely). The record says the patches are divided into training, validation
  and testing sets but the directory PDF shows no split folders, so how the split is expressed is not
  verified. Parent images: 25 slides, Zeiss Axioshop 40, 100x/1.25 NA, Canon PowerShot A640, 1040x1388
  px true-colour fields (from the sibling ODS1 record); pixel size not stated. No publication is linked
  on the record and none was found in Europe PMC or Crossref. Sibling records from the same group: DDS2
  (27209658, patch labels in file names), DDS3 (27209637, 400x400 mosaics of DDS1 patches with masks)
  and ODS1 (27207987, unlabeled focal stacks). Checked: Figshare record, directory PDF.'
