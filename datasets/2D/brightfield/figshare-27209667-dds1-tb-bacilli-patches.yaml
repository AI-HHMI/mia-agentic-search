  notes: 'Listing: tools/listing.py of the Figshare record (3 files, exact sizes). The tar.gz cannot be
    listed by range requests; I streamed its first 10.0 MB (stdlib gzip/tarfile): 3,171 tar members, all
    DDS1/NP/IMAGE/*.bmp of 4,854 bytes, and decoded two of them (40x40x3 uint8, values 220-255 and 46-255).
    The PP folders come later in the stream and were not reached without downloading most of the archive.
    File names carry TR (S01TR1T107NP1.bmp), possibly the split, which is not confirmed. BMP is not a
    listed format, hence other. Download: DDS1.tar.gz on ndownloader.figshare.com is usable (data.download_url).
    TensorSwitch cannot pull tar members, so no sample unit. Voxel size: not stated (record, directory
    PDF, sibling ODS1 record); no paper found.'
