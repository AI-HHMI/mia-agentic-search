  notes: 'Listing: BioStudies files API (548 files, exact sizes, total 2,445,434,807,862 B); tools/listing.py on the study page only saw the page itself, and ftp.ebi.ac.uk reset every connection from this run (probe.py and curl, 6+ tries), so no header was read: shapes, chunking and compression of the zarr zip stores are still open, and no sample or download link could be checked. No single archive: files are per experiment (folder URL from the BioStudies info API). Voxel size not found; checked: BioStudies REMBI image acquisition (no pixel size), Remoscope paper PMID 40631413 (not open access, abstract only), sepsis preprint 10.64898/2026.10.08.26364716 (Europe PMC 503, medRxiv 403), zarr attributes (unreachable).'
