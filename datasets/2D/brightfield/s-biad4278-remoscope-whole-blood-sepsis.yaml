notes: 'From the BioStudies record: 88 healthy, 20 non-infectious critically ill,
  22 sepsis-positive and 7 indeterminate datasets; each dataset is a ZipStore zarr
  v2 image stack plus a zarr v3 instance segmentation. Classification labels are patient-level
  (Sepsis-3 adjudication by two physicians; healthy by questionnaire), not per image.
  Segmentation masks are model-generated (fine-tuned Cellpose-SAM), not manual. Paper
  is a preprint without open full text (abstract only read via Europe PMC), so pixel
  size and exact size were not found; ~2.8 TB stated on the page. File listing not
  inspected (548 files per BioStudies info), so annotations_verified is false. Indeterminate-status
  samples are excluded from the authors training.'
