title: Remoscope Label-free whole-blood images of sepsis positive, non-infectious
  critically ill, and healthy human samples.
short_name: Label-free blood images, sepsis (brightfield)
description: About 2.8 TB of label-free near-UV brightfield whole-blood image frames
  (up to 20,000 per dataset) from 137 Remoscope datasets of healthy donors, non-infectious
  critically ill and sepsis-positive patients, with patient-level Sepsis-3 class labels
  and instance segmentation masks (fine-tuned Cellpose-SAM).
