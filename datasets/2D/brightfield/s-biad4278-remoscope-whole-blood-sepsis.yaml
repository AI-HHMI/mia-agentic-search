notes: 'From BioStudies: 88 healthy, 20 non-infectious ICU, 22 sepsis, 7 indeterminate datasets. Class labels are patient/experiment-level (Sepsis-3 by two physicians; healthy self-reported); masks are automatic (fine-tuned Cellpose-SAM), so source is mixed. Indeterminate samples were excluded from the authors training. enricher: size 2.45 TB and 136 image stacks from the BioStudies file list (548 files; was null); annotations_verified from the listing (136 *_masks.zarr.zip). Pixel size not stated in the study record; papers not readable this run.'
