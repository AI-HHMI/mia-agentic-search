notes: 'Zip listing (peek_archive): image_patches train 100 images + 100 annotations, test 60 + 60; large_images
  train 25, test 15 (with annotations). n_items 160 = patches only. The description states 100 training
  and 15 test frames, whereas the listing has 60 test patches and 15 large test images. Large-image pixel
  size is 79 nm per the description (patches 158 nm). Annotations are by hand with LabelImg per the description.
  The YOLOv2 model zip (1.1 GB) is not counted in size_bytes. Distinct from the DeepBacs antibiotic phenotyping
  dataset (Zenodo 5551057): bright field live cells and growth-stage classes vs fixed confocal drug-treated
  cells.'
