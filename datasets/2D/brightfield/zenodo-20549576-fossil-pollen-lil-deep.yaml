title: Fossil Pollen Detection Dataset (LIL-DEEP, Lake Latorița), v1
short_name: Fossil pollen and NPP detection (brightfield)
description: 3,001 brightfield microscope images (400x, Olympus CX41) of fossil pollen and non-pollen palynomorphs from the
  LIL-DEEP sediment core of Lake Latorița (Southern Carpathians, Romania), with 8,460 YOLO bounding boxes over 22 classes
  (15 pollen taxa, 7 non-pollen palynomorph classes). Six stratigraphic depths span Late Glacial to early Holocene, with
  a depth-based train / validation / test split (2,523 / 120 / 358 images).
