notes: 'No license on the download page, which only asks users to cite the link and related studies (Pap-Smear Benchmark, Jantzen and Dounias 2006), so license is unknown. The 85 MB smear2005.zip was opened and its member list read: seven class folders under New database pictures with 1,834 BMP files, of which 917 end in -d (the segmentation images) and 917 are the cell images (images per class: superficial 74, intermediate 70, columnar 98, light dysplastic 182, moderate dysplastic 146, severe dysplastic 197, carcinoma in situ 150), plus three PDFs (including two theses), an Excel results file and a nested pictures zip. Image sizes, magnification, camera and pixel size were not checked, and the segmentation images were not decoded. Class names follow the folder names. The older Part I database (smear.zip) is not covered. No dataset paper was read.'
