notes: 'No license on the download page, which only asks users to cite the link and related studies (Pap-Smear
  Benchmark, Jantzen and Dounias 2006); the PDFs in the zip say only that the data are on the Internet
  "for public use", so license is unknown. smear2005.zip: seven class folders under New database pictures/
  with 917 cell BMPs and 917 segmentation BMPs (-d), plus three PDFs (benchmark paper, two theses), an
  Excel feature file and a nested copy as New database pictures.zip. The older Part I database (smear.zip)
  is not covered. enricher: voxel size 201x201 nm from Martin 2003 thesis ("resolution of 0.201 um/pixel")
  and the Jantzen benchmark PDF (was null). enricher: annotations.source proofread: CHAMP software segmentation
  by cyto-technicians, each picture examined and corrected (Martin 2003) (was unknown).'
