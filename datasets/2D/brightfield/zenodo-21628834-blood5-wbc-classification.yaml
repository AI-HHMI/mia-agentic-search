notes: 'Zip listing (peek_archive, 863 files): blood_5 holds four pickle batches (data_batch_1-3, test_batch, about 1.75 GB), and
  segmentation_WBC holds 400 BMP images with 400 PNG masks in Dataset 1 and Dataset 2 plus class label CSVs and a git folder, with 26 Python files.
  Class names, counts, 150x150 size and the 80:20 split come from the Zenodo description only; the pickles were not opened (untrusted
  format). No paper describes the self-collected Blood5 images; who collected them, the microscope and how labels were assigned are not
  stated. The segmentation sets are third-party (Zheng et al. 2018, Micron, doi 10.1016/j.micron.2018.01.010, credited to Jiangxi Tecom and CellaVision; that paper was not read) and the record says
  their class labels 1-5 were added by the authors and not verified by experts. Pixel size is not stated. n_items counts 25,872
  Blood5 images plus 400 segmentation images.'
