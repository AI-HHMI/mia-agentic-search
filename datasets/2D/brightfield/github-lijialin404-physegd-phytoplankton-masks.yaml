notes: 'Data are on a Baidu Netdisk share (code in the README), which needs a Baidu account, so the file listing, image format, pixel size and total size could not be checked; counts and COCO layout are from the README and paper section 3. The repository is Apache-2.0 but no licence is stated for the dataset itself; the images derive from PMID2019, whose terms were not checked. Organism names, microscope and magnification are not stated on the README or in the arXiv HTML read (the paper names 15 genus-level categories only in a figure/table). Differs from the PMID2019 detection record in the catalog by adding pixel-level instance masks (9,824 images, new splits). No Europe PMC full text exists for this preprint; the arXiv HTML was read instead.'
