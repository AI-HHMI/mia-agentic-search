id: github-lijialin404-physegd-phytoplankton-masks
title: PhySegD, a phytoplankton instance segmentation dataset (manual masks on PMID2019 bright-field images)
short_name: Phytoplankton instance masks (brightfield)
description: 9,824 bright-field microscopy images of phytoplankton with 11,990 manually annotated instance masks over 15 genus-level categories, in COCO format with fixed train (6,880), validation (1,968) and test (976) splits. The masks were drawn on images of the existing PMID2019 phytoplankton detection dataset. Distributed through a Baidu Netdisk folder linked from the PhySeg GitHub repository.
