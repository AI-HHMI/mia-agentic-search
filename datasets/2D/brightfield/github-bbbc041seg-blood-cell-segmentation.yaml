notes: 'Differs from the catalog record bbbc041-malaria-pvivax-blood-smears (same source images, bounding boxes and classes only): this dataset adds pixel-level masks over the BBBC041 images. The data sits in a Google Drive archive linked from the GitHub README; the archive could not be listed here, so file formats beyond the PNG sample pair, the sizes and the splits are unverified (Dataset Ninja reports a 1,169 train / 159 test split made by a third party, not the authors). Image count 1,328 and the cell classes come from the GitHub README and Dataset Ninja; the paper full text is not open access (abstract read only). License: the GitHub README says Distributed under the MIT License, but the underlying BBBC041 images are CC BY-NC-SA 3.0 (BBBC page), so reuse of the images may be non-commercial. Pixel size, microscope and magnification not stated on the GitHub page, Dataset Ninja page or BBBC041 page; annotation procedure not stated on any page read.'
