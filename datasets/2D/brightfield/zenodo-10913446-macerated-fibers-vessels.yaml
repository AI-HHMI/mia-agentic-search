notes: 'Zenodo has 4 zips: Training_data.zip (186 MB, 8209 files, train/images jpg with matching txt labels,
  Roboflow-style augmented copies), Validation_data.zip (22 MB), T89_rawdata.zip (408 MB) and GA20_rawdata.zip
  (425 MB) raw images without labels. Paper: 1300 original 1920x1440 images annotated with VGG Image Annotator
  (polygons, JSON), 9,617 fibers and 519 vessels; resized to 1024x1024 and augmented to 3,850 images;
  85/15 train/validation split. Leica DMi8, 10x objective, pixel size 0.65 um (650 nm), but voxel_size_nm
  left null because the released training images were resized. Total size and image count not confirmed
  from a complete listing; only Training_data.zip was listed. Stained with safranin; some test images
  toluidine blue or unstained. enricher: Zenodo listing gives 1,041,189,876 B for the 4 zips (size_bytes
  was null); training images sampled are 1024x768, not 1024x1024.'
