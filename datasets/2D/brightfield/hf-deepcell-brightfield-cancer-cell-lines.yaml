notes: 'Sibling of the catalogued Deepcell brightfield immune cells dataset (primary T, NK and monocyte cells, hf-deepcell-brightfield-immune-cells);
  this one holds different cells (four cancer cell lines, 24,000 training + 8,000 test images) and a different repository.
  images_bf_cc.zip lists 32,000 PNG files in one folder (names carry timestamps and ids, not labels), embeddings_bf_cc.parquet holds
  the embeddings and metadata. The label column was not opened, so the exact label encoding and how images map to labels is unverified
  (the card states cell line label and run ID per image). size_bytes is the repository storage reported by the Hugging Face API.
  Pixel size is not stated. No paper is cited on the card.'
