notes: 'Sibling of the catalogued Deepcell brightfield immune cells dataset (primary T, NK and monocyte
  cells, hf-deepcell-brightfield-immune-cells); this one holds different cells (four cancer cell lines,
  24,000 training + 8,000 test images) and a different repository. images_bf_cc.zip lists 32,000 PNG files
  in one folder (names carry timestamps and ids, not labels), embeddings_bf_cc.parquet holds the embeddings
  and metadata. Pixel size is not stated. No paper is cited on the card. enricher: parquet schema read
  from its footer: cell_id (= PNG stem), run_id, expected_class (cell line name, e.g. A375, MNT1); the
  sampled PNG is 8-bit greyscale, not 16-bit as the card says.'
