id: recherche-data-gouv-uadenq-diatom-atlas-images
title: 'Dataset for publication: Usefulness of synthetic datasets for diatom automatic detection using a deep-learning approach'
short_name: Freshwater diatom species images, 166 taxa (LM)
description: 9,230 individual light-microscopy images of freshwater diatoms from 166 species, automatically extracted
  from three published diatom atlases (RA, IDF, BRG) by PDF scraping and verified by diatom taxonomists, organised in
  one folder per species with sub-folders for the source atlas, plus 600 debris objects cut from real microscopy
  images. The repository also holds the code of a synthetic-image generator used to build detection training sets.
