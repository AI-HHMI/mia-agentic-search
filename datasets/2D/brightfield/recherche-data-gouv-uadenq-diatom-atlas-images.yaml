notes: 'Cropped single-organism images extracted from published atlases (scale, magnification and microscope vary and are
  not stated). enricher: zip central directory read: 9,772 diatom + 740 debris jpgs, 166 taxa (n_items was 9,830 from the
  description). Describing paper (Venkataramanan et al., Eng. Appl. Artif. Intell. 2023, doi 10.1016/j.engappai.2022.105594)
  not listed: full text unavailable (Europe PMC 503, HAL access denied), so pixel size is unchecked. License: Etalab 2.0 on
  the Recherche Data Gouv record (Zenodo mirror 14018390 says CC-BY-4.0). Differs from zenodo-16260887 (DIATLAS, 38,719 images
  from French regional atlases): this is a smaller RA/IDF/BRG selection with debris objects and a generator.'
