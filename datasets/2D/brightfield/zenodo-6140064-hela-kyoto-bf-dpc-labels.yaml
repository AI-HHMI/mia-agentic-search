notes: 'training_dataset.zip (listed with peek_archive): 2250 TIFFs = 375 image sets x 6 files (_bf, _dpc, _sqrdpc, _fluo, _nuclei, _cyto) in train/ (1500 files) and test/ (750 files) folders
  Labels are machine generated (StarDist for nuclei, Cellpose for cells) from time points 1, 10, 50, 100, 150 and only
  visually checked; the record itself says they are not perfect and not a recommended labelling strategy, hence source automatic. The page gives the pixel size as
  "0.299 nm", an evident unit slip, so voxel size is left null. The source images come from the dataset "HeLa Kyoto cells under the scope" which was not
  opened; no related paper is listed on the Zenodo record. Fluorescent channels are meant for label review and should not be used with these labels during training.
  Size is the zip (756.6 MB) plus the macro and preview image.'
