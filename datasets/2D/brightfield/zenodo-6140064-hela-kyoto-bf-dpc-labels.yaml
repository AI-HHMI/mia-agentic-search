notes: 'training_dataset.zip (listed with peek_archive): 2250 TIFFs = 375 image sets x 6 files (_bf, _dpc,
  _sqrdpc, _fluo, _nuclei, _cyto) in train/ (1500 files) and test/ (750 files) folders Labels are machine
  generated (StarDist for nuclei, Cellpose for cells) from time points 1, 10, 50, 100, 150 and only visually
  checked; the record itself says they are not perfect and not a recommended labelling strategy, hence
  source automatic. Source images: Zenodo 6139958 (HeLa Kyoto cells under the scope, Operetta 20x). Fluorescent
  channels are meant for label review and should not be used with these labels during training. enricher:
  voxel size 299 nm: page says 0.299 nm (unit slip), TIFF ImageJ calibration 0.29899 um/px (was null).'
