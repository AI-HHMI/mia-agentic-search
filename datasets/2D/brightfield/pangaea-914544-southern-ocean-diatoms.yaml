notes: 'License: series page states CC-BY-4.0, child page 914543 states CC-BY-NC-4.0; the stricter NC terms are recorded.
  Download-all zip (667 MB) holds data.zip (CSV tables), masked.zip and unmasked.zip. 3,319 cut-outs (A = ANT-XXVIII/2 1,376
