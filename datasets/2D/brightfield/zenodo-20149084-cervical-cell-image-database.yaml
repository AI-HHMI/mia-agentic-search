  notes: 'Listing: the single Zenodo zip (44,688,829 B, exact; 917 BMP + 917 PNG members, read from the central
    directory). Sampled carcinoma_in_situ/1.BMP (14,614 B: RGB uint8 70x69, range 62-214, channels differ) and normal_superficiel/1.BMP
    (132,966 B: 234x189x3, range 53-255) with an ad hoc PIL script (probe.py and sample.py do not read BMP), and
    carcinoma_in_situ/1INPUT.png (1,524 B) and normal_superficiel/1INPUT.png with sample.py (164x164 uint8, 0-116
    / 0-128). Value ranges are from these samples only. The training label is the class folder name (7 classes).
    BMP headers carry no calibration (dpi 0). Voxel size not found; checked: BMP header, Zenodo API record (description,
    no related identifiers), Herlev maintainer page (mde-lab.aegean.gr), Europe PMC for the Jantzen 2005 benchmark
    paper (not indexed). Secondary reviews quote 0.201 um/pixel for the Herlev images, but no primary source read
    in this run states it, and it is not confirmed that these BMPs are unresampled Herlev originals.'
