notes: 'One zip (44.7 MB; 917 .BMP cell images and 917 nINPUT.png images listed with peek_archive; per-class counts
  match the record description: 150, 182, 146, 197, 98, 70, 74). The record has no linked paper (related identifiers
  empty), so no paper was read. Derived from the Herlev Pap-smear dataset (Martin 2003 thesis, Marinakis et al.
  2008, Tsakonas et al. 2004), whose own terms were not checked. Originals are BMP, which has no format enum, so
  formats lists png only. Pixel size, magnification and microscope not stated. A related but different record by
  the same author (Pap Smear Cervical Cell Nuclei Segmentation Database, Zenodo 20149775, 1022 JPEG files) is already
  in the catalog; this one has different content (917 BMP/PNG pairs in class folders). enricher: nINPUT.png sampled:
  grey nucleus crops on a black 164x164 canvas, not masks; download_url set to the direct zip.'
