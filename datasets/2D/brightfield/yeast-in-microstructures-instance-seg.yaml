  notes: 'Not inspected: tudatalib.ulb.tu-darmstadt.de answered HTTP 403 to every request in this run (zip, handle page 3799, DSpace server API, OAI), so no listing, header or sample; layout, shapes and
    classes are from the GitHub README and the arXiv paper. The data are PyTorch .pt files, which load only through torch.load (pickle), so they are untrusted data that the enricher must not open, and no
    listed format applies (data.formats other). The README example says the loader returns [1, 256, 256], which disagrees with the stored size stated as 128x128 in README and paper.
    Size: no page states it and dtype is unknown, so no estimate. Pixel size not found; checked: dataset page, GitHub README, arXiv v4 full text (crops of 128x128 from higher-resolution raw data, no um/px),
