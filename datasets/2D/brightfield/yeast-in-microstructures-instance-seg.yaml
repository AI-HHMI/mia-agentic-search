notes: 'The dataset page says the dataset is released under the MIT license (the GitHub README states MIT for the code only).
  The TUdatalib landing page (handle 3799) and the zip returned 403 to this run, so the zip contents were not listed; folder
  layout and .pt format come from the GitHub README, whose image-size statements are inconsistent (128x128 vs 256x256). The paper
  (arXiv v4) states 493 brightfield images from several TLFM experiments with two trap geometries, split randomly then manually
  curated into train/val/test; split counts are only in an image table. Microscope, objective, pixel size and size on disk
  are not stated on the dataset page, README or the arXiv text. About 9k unlabeled images exist at TUdatalib handle 2880 (not
  part of this record). formats is other because the images ship as .pt tensors.'
