notes: >-
  Pixel size 0.211 um from the per-image BIDS sidecar JSON (PixelSize), 40x, toluidine blue per README. Paper (Tissue Eng Part A 2023) is
  not open access (abstract + PMC page read); it states no pixel size or annotation procedure, and its data statement is "on request".
  The dandiset is a small subset of the paper's data. The 6 unannotated images are usable only unlabeled. Draft version
  of the dandiset (no published version DOI); the page carries a notice that DANDI is under NIH review. Total size and 60 files per DANDI.
