title: Bright-Field Images of Rabbit Nerves from Nerve Repair Study with Axon and Myelin Segmentations
short_name: Rabbit nerve axon/myelin masks (brightfield)
description: >-
  14 toluidine-blue-stained, 40x bright-field transverse sections of tibial nerves from New Zealand white
  rabbits in a nerve repair study (one image per animal), prepared for AxonDeepSeg. 8 of the 14 images carry
  manual axon, myelin and combined axon+myelin segmentation masks (PNG, in BIDS derivatives/labels); the other 6 are unannotated.
  A subset of the images used in Bendale et al. 2023.
