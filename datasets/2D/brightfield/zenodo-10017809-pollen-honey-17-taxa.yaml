notes: 'Zip lists final_train/<taxon>/ folders and final_test/<taxon> folders (1468 jpg + 20 png images), train.json (0.8 MB) and val.json (0.1 MB). The Zenodo text states 1404 training and 85 test images. A sibling record (zenodo-10018087-pollen-40-beekeeping-taxa) holds pollen taken from pollen pellets, whereas this one is pollen from honey preparations; they are different images. The cited paper (Forests 2023, Liolios et al.) is a flora-recording study; full text was not open via Europe PMC, so imaging details come from the Zenodo description (Olympus SZX12, 40x lens, Olympus SC30 camera). Pixel size not stated. Organism field left empty: the classes are plant taxa of the pollen (mixed species), see class folders. Annotation sources were the Zenodo description and the zip file listing.'
