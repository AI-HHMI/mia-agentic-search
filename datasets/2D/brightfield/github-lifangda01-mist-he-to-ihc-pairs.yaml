notes: 'Counts, patch size and 0.4661 um per pixel (20x) are from the GitHub README; the paper says the dataset is now in
  the public domain but gives no license terms and no LICENSE text was readable, hence license unknown. The pairs come from
  consecutive sections so they are only approximately aligned. Scanner, patient count and the dataset release date are not
  stated (date used is the arXiv posting date). n_items is 17,295 training + 4,000 test pairs. A MICCAI 2023 version of the
  paper exists; only the arXiv version was read. enricher: Drive folder = 4 zips (HER2, Ki67, ER, PR; 9.07 GB) of 1024x1024
  JPEGs, so formats [jpeg] (was other). The repo LICENSE (BSD-style) covers the code, not the data.'
