title: 'MIST: Multi-IHC Stain Translation dataset (H&E to HER2, Ki67, ER, PR)'
short_name: MIST breast cancer H&E to IHC (4 stains)
description: Aligned H&E and IHC patch pairs (1024 x 1024 px, non-overlapping) for four breast cancer IHC stains - HER2, Ki67,
  ER and PR - cut from consecutive tissue sections. Training / test pairs per stain are 4,642 / 1,000 (HER2, 64 WSIs), 4,361
  / 1,000 (Ki67), 4,153 / 1,000 (ER) and 4,139 / 1,000 (PR) (56 WSIs each). Released with the adaptive supervised PatchNCE
  loss for H&E-to-IHC translation with inconsistent ground-truth pairs.
