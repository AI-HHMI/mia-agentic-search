  notes: 'Complete Zenodo listing (one data.zip, 33.6 GB, 2,314 members, read from the zip index). Probed (range requests):
    HPA .tif members are deflated in the zip so their headers were read via sample.py; HPA .png masks [3000,3000,4] RGBA;
    HuBMAP colon images [4536,4704,3] plain RGB TIFF and masks [4536,4704] uint8; HuBMAP kidney OME-TIFF [3,H,W] JPEG with
    500 nm/px OME calibration. Sampled 22.3 MB (HPA kidney image: [5,255]; its PNG mask: 4 byte values 36/68/84/253, i.e.
    two RGBA colours) and 87.5 KB (HuBMAP colon mask: {0,255}); value ranges are from one sample each. pred_masks* folders
    are algorithm predictions, not ground truth, and not listed as arrays. Voxel size: only the HuBMAP kidney OME header states
    500 nm; HPA and HuBMAP colon files carry no calibration, and neither the Zenodo record, the preprint nor the code README
    states pixel sizes, so voxel_size_nm stays null.'
