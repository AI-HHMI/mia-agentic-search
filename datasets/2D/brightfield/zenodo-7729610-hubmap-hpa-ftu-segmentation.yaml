notes: 'Counts from the zip index of data.zip (2,314 files, 41 GB uncompressed): HPA colon 58 and kidney 99 images, HuBMAP
  colon 7 and kidney 30 whole-slide TIFFs, each with gt_masks (.png plus .json); HuBMAP images are split train/test folders
  (colon 5/2, kidney 20/10). Ground truth per the (preprint) paper: kidney glomeruli annotations were generated by a segmentation
  pipeline then edited by experts in QuPath; colon crypts annotated by a pathologist in QuPath, hence source mixed. How the
  HPA masks were made is not described in the preprint (the Zenodo title refers to the later published paper, not read). Pixel
  size not stated on the Zenodo record or in the preprint. Extra folders hold predicted masks of five algorithms (not training
  labels). The Kaggle kidney WSIs are also on the HuBMAP portal (doi 10.35079/hbm925.sgxl.596). enricher: channels 3 (RGB
  images, probed; was null); formats add ome-tiff (HuBMAP kidney WSIs).'
