notes: 'One 283 MB zip listed with peek_archive (558 members): datasetYOLO640_tiff/train (175 TIFF images, 174 label files),
  validation (90 images, 90 label files), plus results (training curves, weights .pt) and a notebook. data.yaml declares three
  class names (oocyte, oocyte2, oocyte3) but the one label file read (train/labels/image_10.txt) uses only class 0 and the
  yaml maps all three names to index 0, so effectively one class. No associated paper was found (Europe PMC, Crossref and
  web search); the Zenodo description and GitHub page (a fork of ultralytics/yolov5) do not state species names, stain, microscope,
  magnification, pixel size or who drew the boxes, hence organism empty, voxel size null and annotations.source unknown. Tiles
  are 640x640 RGB TIFFs (probed). enricher: stain Mallory and channels 3 from the notebook text and TIFF headers.'
