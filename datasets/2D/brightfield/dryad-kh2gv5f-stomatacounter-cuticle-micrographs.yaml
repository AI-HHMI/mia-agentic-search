notes: 'Dryad lists three zips (train_set.zip 10.5 GB, test_set.zip 1.46 GB, sc_feb2019.zip 211 MB; 12.2 GB total), CC0 1.0. Dryad
  downloads returned 403, so none of the zips were listed; image format, annotation format and the content of sc_feb2019.zip
  are unverified. Counts come from the bioRxiv preprint (full text read via tools/paper.py; the published New Phytologist
  paper is not open access): 4,618 annotated training images, 1,941 test images, 1,467 species (7 in both sets), imaging by
  brightfield, DIC and SEM at 200x and 400x. Annotation is described as human annotation of stomata, with distractor patches
  drawn at least 256 px from any labelled stoma, so the label type is points; this inference is not checked against the files.
  JPEG is inferred from the paper stating that users upload .jpg images. Pixel size is not stated. The preprint data-availability
  line was a placeholder ("will be uploaded to dryad"). organism is left empty because it spans many plant species.'
