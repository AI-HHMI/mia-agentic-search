notes: 'Microplankton_Patagonia.zip (87.2 MB, 540 members) lists 501 .jpg, 20 .tif and 19 .DS_Store files in 31 taxon folders;
  the image count is from this listing. The record describes the images as illustrations used to estimate biovolume and
  carbon biomass, not as a training set, and the labels are the folder names (some folders are size classes such as
  Centric small-size). Images are mostly inverted light microscopy, the electron microscope images are not marked in the
  file names, so modality lists brightfield and other. Pixel size is not stated (a scale bar is burned into each image).
  No linked paper is given on the record and none was found in Europe PMC or Crossref by title; organism is left empty
  because the folders mix taxa. TableS4.pdf (biovolume table) is a separate file. No train/val/test split.'
