short_name: Patagonian microplankton images (microscopy)
description: 521 images (JPEG, with 20 TIFF) of microplanktonic items sorted into 31 taxon or size-class folders (diatoms
  such as Thalassiosira, Chaetoceros and Rhizosolenia, dinoflagellates such as Protoperidinium and Ceratium, and naked flagellates)
  from southern Patagonian fjords and channels, mostly inverted light microscopy plus some electron microscopy. Each image
  carries a scale bar and a label with station ID and sampling depth; a table of biovolume and equivalent spherical diameter
  per item is provided.
