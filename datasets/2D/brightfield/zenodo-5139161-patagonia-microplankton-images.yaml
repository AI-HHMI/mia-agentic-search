notes: 'Microplankton_Patagonia.zip lists 501 .jpg and 20 .tif in 31 taxon folders (plus 19 .DS_Store). The record describes
  the images as illustrations used to estimate biovolume and carbon biomass, not as a training set; labels are the folder
  names (some are size classes such as Centric small-size). No linked paper on the record and none found in Europe PMC or
  Crossref by title; organism left empty because the folders are genera, species groups and size classes. TableS4.pdf (biovolume
  table) is a separate file. No split. enricher: modality by file: the 20 .tif are SEM (FEI header System/Type SEM, Quanta
  per the Zenodo notes), pixel size 14.6-208 nm varying per image; the .jpg are not marked (Olympus CKX41 + Motic camera or
  EM exports), so voxel_size_nm stays null.'
