notes: 'Single archive CLB2.zip (72.8 MB compressed, 88 TIFFs, 127.9 MB unpacked) with DIC/yeast_brightfield_N.tif (44 images, 2.8 MB each)
  and DIC_mask/yeast_CellMask_N.tif (44 masks; a header probe showed uint32, 1024 x 1344, deflate). The Zenodo record has no description.
  Folder says DIC but file names and the paper say brightfield, so modality is brightfield. The paper (bioRxiv full text read)
  says its 1,965-cell training set is brightfield-mask pairs made with CLB2 smFISH as reference; I assume this archive is that set
  (44 images) but the record does not say so, and the number of cells in it was not counted. Pixel size is not stated for the
  brightfield images: the paper gives 64.5 nm only for the smFISH images (Olympus BX63, 100x), so voxel size is null. No train/val/test
  split in the archive. Paper licence and Zenodo licence are both CC-BY-4.0.'
