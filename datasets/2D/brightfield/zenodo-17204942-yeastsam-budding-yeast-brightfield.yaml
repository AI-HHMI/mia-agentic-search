  notes: 'Listing of CLB2.zip via range requests (88 members, exact). Sampled image 4: raw uint16 [1034, 1840], 780 distinct
    values; MetaMorph header says 12-bit camera, 100 ms exposure, objective UPLSAPO100XO, so normalization none is inferred
    (values sit inside the native 12-bit range, unclipped). Mask 4: uint32, 0 = background plus 24 ids up to 29 (gaps), one
    id per cell / mother-bud pair, so instance ids. Values from one sample. MetaMorph spatial calibration is 1 x 1 "pixel"
    (uncalibrated). Voxel size not found; checked: TIFF header (uncalibrated), Zenodo API (no description), GitHub README (none),
    paper (harvester read it: 64.5 nm stated only for smFISH images; bioRxiv rate-limited this run). The api/.../content URL
    ignored ranges in one test; the records/.../files/ URL serves ranges and is used for samples.'
