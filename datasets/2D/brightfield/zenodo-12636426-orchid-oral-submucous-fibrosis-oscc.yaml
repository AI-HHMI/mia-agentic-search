notes: 'Two Zenodo deposits make up the dataset: 12636426 (train.zip, 39.7 GB, 10,228 PNG) and 12646943
  (val.zip 11.3 GB, 2,885 PNG; test.zip 6.1 GB, 1,592 PNG); counts and the class-folder layout are from
  peek_archive listings, total size is the sum of the three zips. The paper describes 512 x 512 patches
  generated from the 1000x images, but the PNGs average about 4 MB, so the pixel dimensions of the released
  images are not confirmed; no pixel size in nm is stated. Several training slides come from five labs
  with different staining protocols; stain normalisation was applied by the authors before release. The
  paper PDF license is CC BY-NC-ND while the Zenodo records state CC BY 4.0. enricher: full listing shows
  5 class folders (normal, osmf, wd/md/pdoscc); released PNGs are full 1000x images (1536x2048 or 960x1280),
  not 512 px patches.'
