title: High-resolution AI image dataset for diagnosing oral submucous fibrosis and squamous cell carcinoma (ORCHID)
short_name: Oral submucous fibrosis and OSCC H&E (ORCHID)
description: ORCHID, a histopathology image database of H&E-stained buccal mucosa slides from 150 patient samples collected at
  five Indian hospitals and institutes, imaged at 1000x (100x objective) on a Leedz Microimaging bright-field microscope
  with Reinhard stain normalisation. Images are PNGs in train, validation and test folders with one folder per class
  (normal, oral submucous fibrosis, oral squamous cell carcinoma), validated by pathologists; the training set is
  deposited as zenodo 12636426 and the validation and test sets as zenodo 12646943 (14,705 PNGs in total).
