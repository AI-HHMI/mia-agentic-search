notes: '36,247 files in file_list.tsv: lifespan (13,235 long / 4,711 short) and movement (9,473 high /
  8,268 low) images split into train / validate / test per day, plus segmentation: 140 images (100 train,
  40 test) with 420 masks (headMask, midMask, tailMask). Lifespan/movement labels are folder names. No
  license or terms on the BioStudies record or in the paper text (paper article itself is CC-BY 3.0).
  one probed image: 900x900 RGB uint8 PNG. enricher: size_bytes = sum of file_list.json (was null). Masks
  are binary per body part, so instance-segmentation -> semantic-segmentation. segmentation/train/img2
  holds 60 images with masks (not 240 without). enricher: pixel size 645 nm from the paper (Aging 2022,
  PMC8908923): "full resolution 900 x 900 images cropped to 800 x 800 pixels (516 x 516 um)" (was null).
  enricher: coverage partial = 140 segmentation images have body-part masks; the 35k lifespan/movement
  images have image-level folder labels only.'
