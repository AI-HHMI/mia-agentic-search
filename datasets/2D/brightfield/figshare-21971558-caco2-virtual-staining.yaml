notes: 'Single zip (756 files) listed with peek_archive: 252 fields of view x 3 JPEGs (.0 optical, .1
  and .2 fluorescence channels) in Set_* folders; set names encode control/Cam and AO_PI/Dio staining.
  Optical channel is called phase-contrast on figshare and bright-field in the paper figure captions;
  both noted. Images 1388x1040 px (paper), 40x, Zeiss Observer; pixel size not stated on figshare page
  or paper text read. No train/val split in the data (paper baseline splits 8:2). Targets are fluorescence
  images for virtual staining, not segmentation masks; usable as paired image-to-image data. enricher:
  zip listed (756 JPEGs in 8 Set_* folders) and one triplet sampled; all three files are 1388x1040 RGB
  JPEG.'
