notes: 'Figshare API reports the Figshare licence as CC BY 4.0 but the description says "intended for
  non-commercial research and educational use", so the terms conflict and spdx is left unknown. Two zips
  (dataset1.zip 0.52 GB, dataset2.zip 0.72 GB) listed with peek_archive: dataset1 has 1,148 Label.tar
  archives and 1,142 .nii.gz, dataset2 1,604 of each, so about 2,750 annotated images are present, far
  fewer than the roughly 20,000 images the description mentions (5folds_devision.xlsx not opened). Cell-category
  ids are numeric (49 categories); the id-to-name mapping, stain and magnification are not stated on the
  page and no paper was found in Europe PMC, so pixel size is unknown. Splits: 8:2 train/validation and
  five-fold lists per the description.'
