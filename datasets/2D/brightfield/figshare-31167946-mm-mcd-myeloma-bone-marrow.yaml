title: 'MM-MCD: Multiple Myeloma Bone Marrow Smear Analysis Dataset'
short_name: Myeloma bone marrow smear cells (brightfield)
description: Expert-annotated 1024x1024 px bone marrow smear images from multiple myeloma patients for multi-cell
  segmentation and fine-grained classification of 49 bone marrow cell categories (plasma cell subtypes, erythroid, myeloid,
  lymphoid, monocytic, megakaryocytic). Two zips with JPG images and per-image annotation files (rectangle boxes in
  labelme-style JSON in one, polygon masks with NIfTI label volumes in the other). Annotated by independent labelling,
  cross-review and senior hematologist adjudication (Cohen's Kappa > 0.85, per the description).
