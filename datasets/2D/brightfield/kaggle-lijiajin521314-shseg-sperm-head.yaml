notes: 'Kaggle API record: 2,489 images of 128 x 128 px, 1,936 train / 553 test, ground truth manually annotated per clinical
  guideline, CC BY 4.0. The complete file listing shows 4,978 PNG files in SHSeg/train and SHSeg/test, consistent with image/mask
  pairs. Companion of the high-resolution SHSegHR set (1920 x 1200 px, 677 images, separate record). The MTCA-Net paper (Adv.
  Intell. Syst. 2026) is not open access and the full text was unavailable, so pixel size, species and annotation protocol
  are not stated. enricher: masks are binary {0,255}; download_url is the Kaggle archive API URL (was the landing page); channels
  1 (was null). Description: "human" removed (no source names the species).'
