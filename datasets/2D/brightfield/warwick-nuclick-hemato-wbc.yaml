notes: 'No license is stated on the Warwick page; the only term is that publications using the data must cite the NuClick paper. The paper full text is not open access via Europe PMC and the arXiv PDF could not be read, so stain, magnification, pixel size, organism, image size and the annotation procedure were not confirmed (the abstract calls the data exemplar outputs of the NuClick tool, hence source mixed). Modality brightfield is inferred from blood smear images and was not stated on the page. Zip listing: Hemato_Data/Train (1,220 images, 1,213 masks) and Hemato_Data/Validation (250 images, 250 masks), 2,933 PNG files, 472.8 MB; seven training images have no mask. Organism is not stated. The same page also releases an IHC lymphocyte dataset, recorded separately (warwick-nuclick-ihc-lymphocytes).'
