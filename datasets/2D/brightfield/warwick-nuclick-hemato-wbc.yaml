  notes: 'Zip central directory: 2,933 members, 473,698,565 B, complete. Probes: Train img (66).png uint8 RGB 512x512, img
    (66)_mask.png uint8 gray 512x512. Sample (one pair, Validation img (710); the pair was fetched twice): image 27..255,
    mean 223, RGB samples differ; mask values 0..6 (6 objects of 4,374-8,998 px, 84% background). Consecutive IDs from 1 suggest
    instance IDs, but neither page, paper nor code README says so, so encoding stays unknown. Voxel size not found; checked:
    PNG headers (no pHYs calibration reported), Warwick page, arXiv 2005.14511 full text (WBC patches from CELLNAMA LSO5 scanner,
    100x oil objective, no pixel size), GitHub navidstuv/NuClick README. No organism or licence stated in any of these. Download/sample
