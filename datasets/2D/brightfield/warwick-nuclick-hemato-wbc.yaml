notes: 'No license is stated on the Warwick page; the only term is that publications using the data must cite the NuClick
  paper. Paper read via arXiv: no pixel size, stain, species or licence for the released set (abstract calls it exemplar NuClick
  output, hence source mixed). Modality brightfield is inferred from blood smear images and was not stated on the page. Zip
  listing: Hemato_Data/Train (1,220 images, 1,213 masks) and Hemato_Data/Validation (250 images, 250 masks), 2,933 PNG files,
  472.8 MB; seven training images have no mask. Organism is not stated. The same page also releases an IHC lymphocyte dataset,
  recorded separately (warwick-nuclick-ihc-lymphocytes). enricher: channels 3 (RGB PNG, was null).'
