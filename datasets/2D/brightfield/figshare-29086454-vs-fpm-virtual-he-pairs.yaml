notes: 'Figshare record (API read): 72 JPEG files, 879 MB, license CC BY 4.0; description says 3 patients and 4 registered images per section. The listing shows file names 0-5.jpeg repeated, so the folder-to-section mapping was not inspected. Per the paper (read in full on PMC), the 18 sections gave 12 for virtual-stain training (17,199 paired 256x256 patches), 6 held out (3,498 patches); the deposited files are full images, not the patches. FPM: Olympus 4x/0.16, effective NA about 0.7, 4.8x2.8 mm field, 5,056x2,960 px raw images; pixel size at the sample is not reported; NanoZoomer WSIs scanned at 40x (230 nm pixel). Modality listed as brightfield plus other because FPM is not in the schema list. Labels are paired images, not manual masks.'
