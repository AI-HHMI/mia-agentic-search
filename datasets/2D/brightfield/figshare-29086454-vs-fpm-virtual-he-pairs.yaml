title: 'VS-FPM: large-format, label-free virtual histopathology microscopy'
short_name: Registered FPM and H&E colon polyp images
description: Registered images of FFPE colonic polyp sections (3 patients, 18 sections). Each section
  has four registered images - a Hamamatsu NanoZoomer H&E whole slide image, the Fourier ptychographic
  microscopy (FPM) amplitude image and raw 4x brightfield image of the H&E-stained section, and a virtual
  H&E image generated from FPM phase of the unstained section - supporting supervised virtual staining
  (unstained phase to H&E) and WSI versus FPM comparison.
