notes: 'Files need a free IEEE DataPort login (page: "Potato Tuber Foldscope Microscopy", 20.2 GB, listed as both "Foldscope_data_rar"
  and a zip). Contents could not be listed behind the login, so the formats (JPG), folder layout (stain/unstain; safranin_o,
  toluidine_blue_o, lugols_iodine) and filename labels come from the landing page and are not verified. Pixel size, image
  dimensions and camera model are not stated on the landing page or in the paper abstract; the paper is not open access (Europe
  PMC has no full text), so Methods were not read. Distinct from the figshare-12206270 potato tuber dataset by the same authors,
  which was imaged with a conventional microscope (15,938 images) and includes segmentation masks; this record is the Foldscope
  set (34,657 images) with classification labels only.'
