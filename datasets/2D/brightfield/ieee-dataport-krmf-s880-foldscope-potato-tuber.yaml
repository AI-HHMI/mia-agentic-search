title: Large-scale fully annotated Foldscope microscopy image dataset of potato tuber cells (low-cost brightfield)
short_name: Potato tuber cells (Foldscope brightfield)
description: 34,657 brightfield images of potato tuber tissue sections (13,369 unstained and 21,288 stained with safranin-O,
  toluidine blue-O or Lugol's iodine) captured with a roughly 1 USD Foldscope coupled to a smartphone. Each image carries three-fold
  labels (tuber weight class, section area, tissue zone) encoded in the file name, for multi-class and multi-label classification.
