notes: 'Zip listing (peek_archive, 2524 files): TXL-PBC/images/{train 882, val 252, test 126} PNGs, matching
  labels/ txt files, data.yaml, two BCCD/selection xlsx files and a PDF protocol. License CC BY 4.0 and
  version 8 from the Figshare API; the paper (open access, Europe PMC) describes the curation: rejected
  204 low-quality BCCD images, semi-automatic YOLOv8n pre-labelling after 250 manual annotations, then
  manual review (hence source mixed). Images are re-selected from four public datasets (BCCD, BCDD, PBC,
  Raabin-WBC) whose own licenses were not checked. The magnification/pixel size of the source images is
  not stated, so voxel_size_nm is null. Channel count 3 assumes RGB from the paper description; PNG headers
  were not read.'
