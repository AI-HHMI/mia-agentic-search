  notes: 'Figshare listing incl. zip members: 3 files, 44,120,629 B exact (record had the zip alone, 44,118,557).
    Probed 3 train images: all are JPEG streams despite the .png name (575x575x3 twice, 363x360x3 once,
    so sizes vary). Sampled one image (RGB uint8, range 14-231) and its label file (14 YOLO rows; classes
    0 and 1 present, so n_ids_observed counts classes). Class names from classes.txt / data.yaml (nc 3:
    WBC, RBC, Platelets). Label dtype float32 is the text values, not a binary dtype. README.md ends "This
    dataset is released for academic and non-commercial use", which differs from the CC BY 4.0 in the
    Figshare metadata; a human should check which applies. README also mentions metadata.csv, but the
    zip has metadata_file.xlsx instead.'
