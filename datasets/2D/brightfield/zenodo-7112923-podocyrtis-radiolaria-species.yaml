notes: 'Zip listed with peek_archive and zip index: 2,300 JPEGs, 22 MB, folders Image_Datasets/{S,SC,SCUB}/<species>.
  Variant S has 1,085 images (ampla 46, chalara 177, diamesa 94, goetheana 135, mitra 189, papalis 288,
  phyxis 64, sinuosa 92), matching the 1,085 specimens in the paper; n_items counts all JPEGs. Images
  are rotated 45 degrees and resized to 256 x 256 in the paper for training, file sizes here are tiny
  (about 10 KB). The paper also names a copy at Recherche Data Gouv (10.57745/G7CHQL); a 22-specimen test
  set from other oceans is described in the paper and is not part of this zip as far as the listing shows.
  Labels: one taxonomist, checked by two experts. enricher: voxel size cleared (was 350 nm): the paper
  sets 0.35 um/pixel at acquisition, but each vignette was cropped to its specimen and resized to 256
  px, so the files have no single pixel size. SC (747) and SCUB (468) are copies of S files (paper: complete
  specimens; complete and unblurred).'
