notes: 'Description says: 17 original paired images (nuclei predictions from a pix2pix
  model applied to brightfield + label images made by StarDist Versatile Nuclei segmentation
  with cancer-cell nuclei manually removed), augmented to 68 pairs by rotation and
  flipping; 1024 x 1022 px, uncalibrated, 8-bit TIFF. Zip (peek_archive: 61 files,
  443.8 MB, mostly a 403 MB TensorBoard events file and model weights) lists QC_source/QC_target
  TIFFs and a trained model; the training image/label folders were not seen in the
  part of the listing read, so annotations_verified is false and n_items 68 is from
  the description. Related paper (Follain et al., bioRxiv 10.1101/2024.09.30.615654)
  not read: bioRxiv full text returned HTTP 429; so microscope, pixel size and organism
  detail (HUVEC = human) rely on the Zenodo description only. Small dataset.'
