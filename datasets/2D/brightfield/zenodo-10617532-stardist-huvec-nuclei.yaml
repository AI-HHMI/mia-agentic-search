notes: 'Description: 17 original paired images (nuclei predictions from a pix2pix model applied to brightfield + StarDist
  Versatile Nuclei labels with cancer-cell nuclei manually removed), augmented to 68 pairs by rotation/flipping for training;
  8-bit, uncalibrated. The zip holds the 17 un-augmented training pairs (Training_data/Training_source|Training_target) and
  5 QC pairs (Quality_control_data/QC_source|QC_target), plus the trained model (403 MB TensorBoard events file, weights)
  and 5 QC predictions. Related preprint (Follain et al., bioRxiv 10.1101/2024.09.30.615654) read: states the camera pixel
  (6.5 um) but no image pixel size for this dataset. enricher: n_items 68 -> 22 (pairs in the zip), annotations.source mixed
  -> proofread (automatic StarDist labels with nuclei removed by hand), annotations_verified.'
