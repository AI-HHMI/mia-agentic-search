notes: 'Read the GitHub README, the Kaggle API record (licence MIT, 574 MB) and the arXiv paper (HTML
  full text: derived from the PBC dataset of Acevedo et al., 17,092 images in 8 classes of which 151 were
  dropped for clarity; every cell re-annotated with bounding boxes in MakeSense.ai). The licence is MIT
  on the Kaggle card; no LICENSE file was found in the GitHub repo and the paper (arXiv CC BY-NC-ND) does
  not state a dataset licence, and the underlying PBC images are CC BY 4.0 on Mendeley. The 298,850 instances
  are 269,110 red blood cells and 29,740 others. Differs from the catalog record of the PBC dataset (mendeley-snkd93bnjr,
  image-level classes only) by adding per-cell bounding boxes and a red blood cell class. Pixel size and
  magnification are not stated. enricher: Kaggle API zip read (YOLO labels + data.yaml class names seen;
  no VOC XML or CSV in it); annotations_verified true; download_url set to the API zip.'
