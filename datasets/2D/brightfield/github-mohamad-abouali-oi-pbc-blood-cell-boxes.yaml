title: OI-PBC - re-annotated peripheral blood cell detection dataset (12 classes, 298,850 cells)
short_name: Blood cell boxes, 12 classes (brightfield)
description: 16,891 CellaVision DM96 peripheral blood smear images (360x363 px RGB JPEG) with tight bounding
  boxes drawn for every cell (298,850 instances, 12 classes - 11 white-cell, erythroblast and platelet
  types plus red blood cells), exported as Pascal VOC XML, YOLO TXT and CSV. Derived from the images of
  the PBC dataset (Acevedo et al.), which carried only image-level labels; 7:2:1 and 8:1:1 train/validation/test
  splits are described.
