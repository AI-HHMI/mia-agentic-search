notes: 'Zenodo API record, README, strains.csv, LICENSE.txt (CC BY 4.0) and the contents of the crops archive (2,681 PNG) and
  the isolate F2 full-field archive (100 PNG) were read. Labels are the isolate (F2 to F39) and the collection''s reported
  taxon (A. brassicicola, A. japonica, A. mali, A. petroselini, four isolates only Alternaria sp.); the README says these
  identifications were not revalidated, so there are 10 isolates, not 10 confirmed species. Full fields have no object-level
  annotations; each crop shows one conidium centred and its background was manually cleaned. Pixel size is not calibrated
  (README) so voxel_size_nm is null. No paper is cited on the record. The record is split into 11 ZIPs (10 per-isolate
  full-field archives and one crop archive) so no single direct download_url is set; size_bytes is the sum of the Zenodo file
  sizes. Channel count is not stated in the README, so channels is null.'
