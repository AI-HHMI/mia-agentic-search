notes: 'Read: Zenodo API, README, strains.csv, LICENSE.txt (CC BY 4.0), zip contents. Labels are the isolate
  (F2 to F39) and the collection''s reported taxon (A. brassicicola, A. japonica, A. mali, A. petroselini,
  four isolates only Alternaria sp.); the README says these identifications were not revalidated, so there
  are 10 isolates, not 10 confirmed species. Full fields have no object-level annotations; each crop shows
  one conidium centred and its background was manually cleaned. Pixel size is not calibrated (README)
  so voxel_size_nm is null. The record is split into 11 ZIPs (10 per-isolate full-field archives and one
  crop archive) so no single direct download_url is set; size_bytes is the sum of the Zenodo file sizes.
  enricher: channels 3 (RGB PNG, probed; was null). organisms: A. brassicicola = F2/ F5/ F6/, A. japonica
  = F14/, A. mali = F32/, A. petroselini = F39/, Alternaria sp. = F21/ F22/ F25/ F29/, in both zip sets.'
