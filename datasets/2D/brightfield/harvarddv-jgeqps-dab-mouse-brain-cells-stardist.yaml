notes: '254 TIFFs (140.8 MB) from 27 source ids with region suffixes r1..r6, no README. X_rN.tif is an
  8-bit RGB image and X_rN-1.tif a 16-bit single-channel instance label image of the same size (checked
  on two pairs). The description says only that the data trained a StarDist model together with TNBC (zenodo
  1175282) and MoNuSeg. No paper is linked and none was found, so staining protocol, mouse strain and
  annotation procedure are unknown. enricher: voxel size 511.3 nm from the ImageJ calibration (0.5113
  um/px) in three RGB headers (was null); no doc states it. Files are individual Dataverse downloads,
  so download_url is null.'
