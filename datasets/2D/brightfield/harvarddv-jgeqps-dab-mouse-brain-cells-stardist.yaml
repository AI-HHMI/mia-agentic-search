notes: >-
  The record has 254 TIFF files (140.8 MB) from 27 source ids with region suffixes r1..r6 and no README. Pairing is inferred from headers and one file read: X_rN.tif is an 8-bit RGB image
  (614 x 832 x 3, calibration 0.5113 um/px stored in the ImageJ header, not confirmed against the instrument) and X_rN-1.tif is a 16-bit single-channel image holding 231 integer ids with about
  10% non-zero pixels, i.e. instance labels (checked on one pair only). The description says only that the data trained a StarDist model together with TNBC (zenodo 1175282) and MoNuSeg.
  No paper is linked in the record and web search found none, so the staining protocol, mouse strain and annotation procedure are unknown (annotation source unknown). Files are individual Dataverse
  downloads, so download_url is null.
