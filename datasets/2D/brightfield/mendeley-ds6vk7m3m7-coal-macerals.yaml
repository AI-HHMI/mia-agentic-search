notes: 'Zip listing (peek_archive): dataset.zip with 704 images in dataset/JPEGImages and 312 label files in dataset/SegmentationClassAug
  (245 png, 67 jpg); the page text says 313 labelled images. Only 312 of 704 images have labels, so coverage is partial. Same
  authors deposited a larger enhanced version, Mendeley mnh5hhg7r2 (10.17632/mnh5hhg7r2.1, 2024-12-19): 697 enhanced images
  in data_aug/ and 319 labels in label_aug/, 1.49 GB; treat as a re-deposit of overlapping data. Not stated on the page, file
  listing or any paper (none listed or found): microscope, magnification, pixel size, image dimensions, annotator count, train/test
  split. Class colours from the page description. Modality brightfield is an assumption (optical microscopy of coal sections);
  the page does not state the illumination. '
