notes: 'The mosaics are synthetic arrangements of real 40 x 40 patches from DDS1 (itself cut from digital
  field images of the same group); no new microscope images. Masks derive from the DDS1 per-patch bacillus
  masks, hence source automatic (composition, not new manual labelling). Image format (bmp, per the file
  directory PDF) is not in the schema, so formats is other; the single 2.3 GB tar.gz was not opened (tar.gz
  cannot be listed remotely), so structure follows the file-directory PDF and the description. Microscope
  details are not stated for DDS3; the sibling ODS1 record states a Zeiss Axioshop 40, 100x NA 1.25, Canon
  PowerShot A640 camera and Kinyoun staining for the underlying slides (assumed to be the same origin,
  not verified for the DDS1 patches). Pixel size not stated. No linked paper on the record (figshare custom
  field "Associated Preprint DOI" is empty). Part of a DDS/ODS family: DDS1, DDS2, DDS4, ODS2 and ODS3
  are separate records already proposed.'
