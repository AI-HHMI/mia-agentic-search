title: DDS3 - Dataset of mosaic sputum smear microscopy images for evaluation of bacillus detection algorithms
short_name: TB bacilli sputum smear mosaics (brightfield)
description: 8,000 mosaic images of 400 x 400 pixels, each composed of a 10 x 10 arrangement of 40 x 40 patches (negative and
  positive) taken from the DDS1 patch dataset of Kinyoun-stained sputum smear microscopy for tuberculosis, with one binary
  mask per mosaic (bacilli white, background black). Split into 6,000 training, 1,000 validation and 1,000 test mosaics, and
  into folders by the share of negative patches (100%, over 90% and about 50%). Built for training, validating and testing
  bacillus detection algorithms.
