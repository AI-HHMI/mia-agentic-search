notes: 'Six tar.bz2 data archives (2.80 GB) plus YOLOv3/UNet/FCN .h5 weights and .pkl label lists; size_bytes is the whole
  Zenodo record (3.86 GB). Organism left empty: soil nematodes (many genera), 17 protist genera, amoebae and cells. No dataset
  paper found. enricher: formats jpeg (was other), channels 3 (RGB JPEGs), annotations seen in archives (VIA polygon CSV,
  VOC-style XML boxes, class folders). Image sizes vary by subset: 2584x1936 (Protists, Cells), 1292x968 (Amoeba), 1392x1040
  (trophic sets). Pixel size not stated anywhere checked. Box XML <xmax>/<ymax> hold box width/height, not corner coordinates
  (e.g. xmin 592, xmax 44).'
