notes: 'Zenodo record lists tar.bz2 archives (Nematodes 325 MB, Protists 1.0 GB, Amoeba 273 MB, Cells 1.0 GB,
  Nematodes_Trophic_Head 104 MB, Nematodes_Trophic_Body 46 MB) plus .h5 weights and .pkl label files; they are
  tar.bz2, so contents could not be listed without downloading and image counts, image sizes, formats (data.formats
  is other for that reason), splits and organism names are unverified. The README says the nematode model needs
  1440x1056 and the protist model 960x704 inputs, and asks contributors for 400x bright-field images of 2584x1936 px;
  these are not confirmed as properties of the released data. No dataset paper is cited on the record or README.
  Organism left empty: the collection mixes nematodes, 17 protist genera, amoebae and cells. The record is dated
  2021-09-25 although the GitHub README describes later additions.'
