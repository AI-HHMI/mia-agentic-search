short_name: SinfNet nematodes and protists (brightfield)
description: Collection of bright-field microscope image sets of soil microorganisms - nematodes (object detection boxes and
  pixel-wise segmentation polygons, plus trophic-level classification by head or body), 17 protist genera (detection and semantic
  segmentation), amoebae (active/inactive detection) and generic cells (detection) - released with trained YOLOv3, UNet and
  FCN weights.
