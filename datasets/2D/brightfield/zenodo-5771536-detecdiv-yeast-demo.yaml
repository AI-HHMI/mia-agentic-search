notes: 'Zip (10,750 files, 9.1 GB uncompressed): 10,567 TIFF (position1/img_channel001_position010_time*_z001.tif
  raw frames plus ROI and trainingdataset/images crops) and 183 .mat (classification/cellsegment_2, division_1
  etc. with ground truth and trained classifiers). It is a software demo project, so the annotated subset
  is small compared to the paper (250 traps annotated for division classes, ~1400 brightfield and ~3000
  nuclear fluorescence images segmented, Methods of the preprint). Pixel size not stated on the Zenodo
  page or in the preprint text (20x 0.45 NA objective, ORCA Flash 4 camera for the custom microscope);
  raw TIFF header calibration implausible (300 µm/px). Preprint text from bioRxiv JATS XML. Segmentation
  masks are TIFF (trainingdataset/labels, enricher); division labels are class subfolders plus .mat time
  series (MATLAB). enricher: channels 2 (channel000/channel001 in position1 file names); annotations_verified
  from label TIFFs.'
