  notes: 'Listing: Zenodo API + zip central directory (complete, 7,798,233,262 B). Headers probed for
    one file of each array; one cellsegment and one nucleussegment image/label pair (8,040 B) read from
    the zip; value ranges are from that one sample. Training images are grey stored as RGB (samples identical);
    masks are RGB colour-coded classes whose colour mapping is not documented (DetecDiv .mat files would
    hold it, but they need MATLAB). position1 ImageJ header says 300030 nm/px (unit µm), implausible for
    a 20x objective, ignored. Voxel size not found; checked: TIFF headers (ImageJ calibration implausible),
    Zenodo API record/description, bioRxiv full text (Methods, Data availability: 20x 0.45 NA, ORCA Flash
    4.0, no pixel size), zip contains no README. Not convertible yet: 2D records are not covered by the
    miao layout. tools/sample.py did not recognise the Zenodo /content URL as a zip, so the members were
    read with tools/peek_archive.read_member.'
