notes: 'Facts from the BioStudies API record and file list (369 PNGs in images/folder1-4, 1.57 GB) and the paper. Pixel size
  0.064 um (64 nm), 100x, TissueFAX brightfield, from the BioStudies acquisition fields. Labels are weak: the four folders
  are the four culture conditions, but the record does not map folders to conditions, and the paper''s manual nnU-Net masks
  are not deposited, so annotations_verified is false and coverage unknown. 20 files carry a "(1)" suffix, same size as a
  twin. Data CC0; paper text CC BY-NC-ND. B. vulgatus is the paper''s name (NCBI: Phocaeicola vulgatus). organisms: Clostridium
  scindens = folder1-4; Bacteroides thetaiotaomicron also in folder1 (files theta_A*), Bacteroides vulgatus also in folder2
  (files vulgatus_B*), per file names (co-cultures, both species in one image). enricher: technical block from file list,
  PNG headers, 2 samples; grey stored as RGB.'
