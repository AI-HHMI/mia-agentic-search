notes: 'Facts come from the BioStudies API record and file list (369 PNGs in images/folder1-4, 1.57 GB) and the paper. Pixel size 0.064 um (64 nm) per pixel, 100x objective, z-stack depth 0.2 um, TissueFAX brightfield, from the BioStudies acquisition fields. Labels are weak: the four folders correspond to the four culture conditions, but the record does not say which folder is which condition, and the manual segmentation masks the paper trained nnU-Net on are not listed among the files, so annotations_verified is false and coverage unknown. 20 files carry a "(1)" suffix and have the same size as a twin file, so about 349 images are unique. Landing page itself is the BioStudies web app; the API record for the same study was fetched. The paper text is CC BY-NC-ND, the data record is CC0. Bacteroides vulgatus is the name used in the paper (NCBI now lists Phocaeicola vulgatus).'
