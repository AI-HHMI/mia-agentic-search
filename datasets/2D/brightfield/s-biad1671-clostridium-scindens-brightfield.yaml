description: 369 brightfield light-microscopy PNG images (100x, TissueFAX) of anaerobically cultured Clostridium scindens
  in four culture conditions (media alone, with cholic acid, or co-cultured with Bacteroides thetaiotaomicron or B. vulgatus),
  organised in four image folders, used to train image, per-cell and segmentation classifiers of bacterial metabolic state.
