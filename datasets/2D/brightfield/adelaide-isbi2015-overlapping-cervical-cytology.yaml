notes: 'Well-known benchmark; downloads are plain HTTP zips on the challenge site (Training_R1_01Dec2014.zip, Training_R2_Jan2015.zip, Testing_R1_01Dec2014.zip, Testing_R2_Jan2015.zip, AnnotationTest.mat, EvaluationCode.zip). Training zips list ~230-270 PNG files each plus CSV confidence tables (listed with peek_archive; R1 ReadMe read). No license or terms of use appear on the dataset pages (the page says only that release 2 usage is the same as release 1), so license is unknown. The paper (IEEE TIP 2015) is not open access, so only its abstract and the challenge pages were read; image dimensions, magnification and pixel size are not stated on the dataset pages. The 20 focal-plane images per sample make a z-stack, but the annotated image is the EDF projection, so dimensionality is recorded as 2D. Related but separate dataset: the ISBI 2014 challenge (synthetic images). Sources checked: dataset page, zip listings, R1 ReadMe.'
