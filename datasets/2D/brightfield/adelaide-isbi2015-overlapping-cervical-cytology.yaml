  notes: 'Listing covers all 6 files on the dataset page (4 zips listed by member). Probed: EDF, focal-plane,
    cell-mask and nucleus-mask PNGs; sampled Training/EDF/frame004.png (487,479 B), NucleusGT/frame004_NUGT.png
    (2,242 B), frame004_stack/fov000.png (430,572 B); value ranges are from these single samples. Voxel
    size not found; checked: PNG headers, dataset/description/index pages, ReadMe.txt, TIP 2015 paper
    (not open access; abstract only), the ISBI 2014 challenge paper (JBHI, author PDF), which gives "around
    0.185um per pixel" for the 2014 images (Olympus BX40, x40) but does not describe this 2015 release,
    so it was not applied. License: none found on the challenge pages or in ReadMe.txt. Download: zips
    are direct, support range requests, but host cs.adelaide.edu.au is not on the TensorSwitch allowlist.
    No single archive, so download_url is the dataset page.'
