title: ISBI 2015 Overlapping Cervical Cytology Image Segmentation Challenge (extended depth-of-field images
  with per-cell masks)
short_name: Overlapping cervical cells (ISBI 2015)
description: Training and test data of the second Overlapping Cervical Cytology Image Segmentation Challenge.
  17 multi-layer cervical cytology samples (8 training, 9 test), each given as an extended depth-of-field
  (EDF) image plus its 20 focal-plane images. Training samples carry a per-cell annotation (one mask image
  per cell, covering cytoplasm and nucleus) and a high/low annotation-confidence table; test annotations
  are released separately as AnnotationTest.mat.
