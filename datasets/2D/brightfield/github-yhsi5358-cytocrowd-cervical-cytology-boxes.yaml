title: 'CytoCrowd: A Multi-Annotator Benchmark Dataset for Cytology Image Analysis'
short_name: CytoCrowd cytology multi-annotator boxes
description: 'Cytology image patches from a 40x whole-slide scanner with bounding-box annotations from four pathologists (14,579 raw boxes) plus a senior expert gold standard (6,402 objects) over 34 fine-grained cell categories (e.g. ASC-US, ASC-H, LSIL, endocervical cells). Built for object detection and annotation aggregation. Boxes and class names are in two CSV files; images are JPEG crops.'
