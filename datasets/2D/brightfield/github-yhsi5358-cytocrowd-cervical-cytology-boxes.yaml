notes: 'No license found on the GitHub page, README, repo (no LICENSE file) or paper (the CC BY 4.0 on arXiv and in the bundled PDF covers the paper only), so spdx is unknown. enricher: n_items 446 from the git tree (imgs/ has 446 JPEGs; the GitHub web view shows only the first 100; was 100); both CSVs reference exactly these 446 images. The sampled image is a 3840x2160 RGB JPEG crop (GT boxes span up to x 3840, y 2160) (names encode slide coordinates); the .svs whole-slide images are not released. The paper says 34 categories, but GroundTruth.csv uses 16 and WorkerData.csv 18 category names (Chinese). Pixel size not stated anywhere checked (40x scanner only). Four annotators, average pairwise IoU 0.664; ground truth by a senior pathologist with 15+ years of experience.'
