  notes: 'Listing: tools/listing.py does not read GitHub repos and api.github.com was blocked here, so the file list comes from the repo git tree (blobless clone of main, commit c18d0aa) and exact sizes from a HEAD Content-Length on raw.githubusercontent.com for all 450 files (the 4 non-image sizes match git blob sizes): 446 JPEGs = 517,284,519 B, total 521,094,784 B. Image file names contain a literal %5B/%5D, so raw URLs need it escaped as %255B/%255D. Probed the smallest image (512,535 B) and sampled one full image (1,515,260 B): both 2160x3840x3 uint8 RGB JPEG; value_range [0, 255] is from that one sample; shape_varies not checked for every file (GT boxes reach x 3840, y 2160). Both CSVs were read in full: GroundTruth 6402 rows, 16 categories; WorkerData 14579 rows, 18 categories, 4 annotators; all 446 images referenced, none missing. No whole-repo archive could be verified (github.com/.../archive zip returned 403 through the proxy), so download_url stays the repo page; the direct files are raw.githubusercontent.com/YHSI5358/CytoCrowd-Datasets/main/<path>. Voxel size not found; checked: JPEG header (no EXIF/DPI), README, arXiv HTML full text, bundled CytoCrowd_Reference_Anonymous.pdf, the CSVs (Europe PMC/Crossref have no record). License not found: no LICENSE file in the tree, none in README; the CC BY 4.0 in the paper covers the paper.'
