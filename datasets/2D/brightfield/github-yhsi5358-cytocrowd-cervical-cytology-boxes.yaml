notes: 'No license found on the GitHub page, README or paper (the arXiv CC BY 4.0 covers the paper only), so spdx is unknown. The paper and README say 446 images, but the imgs/ folder lists only 100 JPEG files (names encode slide coordinates); the 40x whole-slide images are .svs per the paper and are not in the repo, and the CSVs cover more images than the 100 listed, so n_items 100 is the repo count and the full image set may not be downloadable. No file sizes shown on GitHub pages, so size_bytes is null. Pixel size not stated. Four annotators, average pairwise IoU 0.664; ground truth by a senior pathologist with 15+ years of experience.'
