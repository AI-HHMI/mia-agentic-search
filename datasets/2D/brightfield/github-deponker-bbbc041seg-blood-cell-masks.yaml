notes: 'Google Drive file ''Final data.zip'' (2.30 GB; direct link with confirm=t supports range requests): Original/ 1,209
  PNG + 119 JPG images, Mask/ 1,328 PNG masks, paired by file name (UUID stem). enricher: masks are binary foreground (0/255)
  in both sampled pairs, so types changed instance-segmentation -> semantic-segmentation; no per-class labels in the masks.
  No license for the dataset repo (LICENSE 404); the code repo README says ''Distributed under the MIT License'' for the code
  only; Dataset Ninja lists MIT (third party); BBBC041v1 images are CC BY-NC-SA 3.0. License kept unknown. Split 1,169 / 159
  from Dataset Ninja; no split folders in the zip. Paper is not open access; annotation procedure not read. Same images as
  bbbc041-malaria-pvivax-blood-smears but pixel masks.'
