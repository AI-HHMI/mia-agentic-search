notes: 'The repository README links one Google Drive file (1,328 original images plus 1,328 ground-truth masks, 2,656 files); the Drive file was not opened, so file format (formats is other) and size are unverified. No license file exists in the GitHub repo (LICENSE and LICENSE.md return 404). Dataset Ninja lists MIT for the dataset, but that is a third-party statement; the underlying BBBC041v1 images are CC BY-NC-SA 3.0 by Jane Hung (see catalog record bbbc041-malaria-pvivax-blood-smears), so the effective terms are unclear and the license is left unknown. Split 1,169 train / 159 test is from Dataset Ninja. Annotation procedure is not described in the README or the paper abstract; the paper full text is not open access and was not read. Differs from the BBBC041 record: same images, but pixel-level masks instead of bounding boxes.'
