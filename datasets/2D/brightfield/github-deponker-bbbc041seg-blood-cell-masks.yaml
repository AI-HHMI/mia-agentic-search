description: 1,328 brightfield images of Giemsa-stained blood smears (the BBBC041v1 images) with pixel-level ground-truth
  masks for uninfected cells (red blood cells, leukocytes) and infected cells (gametocytes, rings, trophozoites, schizonts),
  about 93,500 labelled objects. Released with the paper's benchmark of U-Net variants and classical segmentation methods.
