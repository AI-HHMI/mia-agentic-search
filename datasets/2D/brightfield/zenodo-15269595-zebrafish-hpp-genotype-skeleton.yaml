notes: 'Zenodo record has one file, zebrafish_dataset.npz (423 MB, NumPy archive with arrays images (N,H,W,C),
  labels, filenames); format ''other'' because npz is not a listed format, and the member list was not
  read (probe.py could not parse it). Image count 901 is the sum of the paper''s Table 1 (288 wildtype
  + 331 heterozygous + 282 homozygous) and was not counted in the file; the paper''s text says ''nearly
  1000'' and the paper mentions a .pkl while Zenodo ships .npz. Raw images are 1920x1440 per the paper;
  the stored array shape was not checked. Labels are genotype classes, not pixel annotations (ground truth
  from genotyping). No pixel size given on the Zenodo page or in the paper (zoom levels 4/10/20 are listed,
  no scale). License CC-BY-4.0 is as shown on the Zenodo API record. Checked: Zenodo API record, paper
  full text (Methods, Data availability, Table 1).'
