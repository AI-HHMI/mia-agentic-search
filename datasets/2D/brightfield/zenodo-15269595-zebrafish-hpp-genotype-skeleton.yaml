description: 901 brightfield images of alizarin red / alcian blue stained 120 hpf zebrafish larvae (97
  larvae, alpl wue7 hypophosphatasia model), ventral neurocranium and dorsal viscerocranium views at three
  zoom levels. Each image carries a genotype class label (wildtype, heterozygous, homozygous) from genotyping.
  Shipped as a single NumPy .npz of images, labels and filenames.
