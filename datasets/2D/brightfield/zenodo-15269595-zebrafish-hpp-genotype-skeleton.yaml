notes: 'Zenodo record has one file, zebrafish_dataset.npz (423 MB; members images.npy, labels.npy, filenames.npy);
  format other because npz is not a listed format. enricher: npy headers read: images 901x512x512x3 uint8,
  so the stored images are resized from the paper''s 1920x1440 raw images; labels 901 (288/331/282 = paper
  Table 1). Labels are genotype classes, not pixel annotations (ground truth from genotyping). No pixel
  size given on the Zenodo page or in the paper (zoom levels 4/10/20 listed, no scale), and resizing makes
  the original one inapplicable. License CC-BY-4.0 as shown on the Zenodo API record. Checked: Zenodo
  API record, paper full text (Methods, Data availability, Table 1).'
