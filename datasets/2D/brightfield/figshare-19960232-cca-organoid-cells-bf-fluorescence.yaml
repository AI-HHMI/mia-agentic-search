notes: 'Facts come from the figshare API record (landing page gives 403), peek_archive of the 3.4 GB zip (1,207 images each
  in raw_images_for_model/brightfield and /fluorescence, 1,087 trainval and 360 test annotation files listed, 144,474 train
  and 17,860 val single-cell crops) and the Scientific Data paper (Europe PMC full text). Annotation was by three annotators
  in three phases, where phases 1 and 2 used a detector to pre-propose boxes that annotators corrected, and the test set was
  annotated without model boxes, hence mixed. The test split carries only cancer-cell (R) boxes. Listing: 1,087 trainval xml
  and 360 test xml = 120 images each in test/Expert1, Expert2 and Unioned. The figshare version is v2. enricher: VOC boxes
  are in 540x540 coordinates (xml size 540x540) while the TIFFs are 1080x1080, so scale boxes by 2; voxel size not stated
  (null).'
