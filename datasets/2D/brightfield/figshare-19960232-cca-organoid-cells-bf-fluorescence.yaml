notes: 'Facts come from the figshare API record (landing page gives 403), peek_archive of the 3.4 GB zip (1,207 images
  each in raw_images_for_model/brightfield and /fluorescence, 1,087 trainval and 360 test annotation files listed, 144,474
  train and 17,860 val single-cell crops) and the Scientific Data paper (Europe PMC full text). Annotation was by three
  annotators in three phases, where phases 1 and 2 used a detector to pre-propose boxes that annotators corrected, and
  the test set was annotated without model boxes, hence mixed. The test split carries only cancer-cell (R) boxes. The listing
  shows 1,087 trainval xml (1,207 minus 120 test images) and 360 test xml (120 images x 3 annotators would fit; not checked).
  Pixel size is not stated in the paper text read, so voxel_size_nm is null. The figshare version is v2.'
