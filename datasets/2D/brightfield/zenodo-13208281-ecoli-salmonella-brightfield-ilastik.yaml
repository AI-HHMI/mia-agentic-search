notes: 'Zip listing (peek_archive, 323 entries): ImageProcess/IMAGES (165 TIFF), ImageProcess/SEG (145 TIFF masks), Dataset.csv, notebooks; DataProcesing/RawData.csv and Stats.csv (cell sizes, seven conditions);
  CFUod/ OD and CFU tables. Paper Methods: bright-field on a Nikon Eclipse Ti2-E with a DS-Qi2 camera; cells segmented with Ilastik pixel classification, one classifier per medium trained on outlined cells with manual checks of
  clusters (hence source mixed); pixel area about 0.005 um2, consistent with the 0.07 um/pixel on the record. The record states the masks are Ilastik masks; 20 images have no mask (165 vs 145). Image/mask file-name pairing not checked.'
