title: UDE DIATOMS in the Wild 2024 - annotated freshwater diatom cutouts from focus-stacked slide scans
short_name: Freshwater diatom taxa cutouts (brightfield)
description: 83,570 8-bit grayscale PNG cutouts of individual diatom valves (611 taxa, 542 species) taken
  from 319 focus-stacked, stitched brightfield virtual slides of river, stream and lake samples, each
  labeled with its taxonomic name by an expert and located by a manual polygon, circle or rotated rectangle.
  Pixel size is 0.09 um. A CSV links every cutout to its slide, annotator and shape.
