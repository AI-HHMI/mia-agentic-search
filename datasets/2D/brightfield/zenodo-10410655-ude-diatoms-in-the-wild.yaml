notes: 'Checked the Zenodo record and API, the zip index (83,573 files, cutouts in images/), the CSV column
  description inside the zip and the GigaScience paper. Cutouts are 8-bit grayscale PNGs; shapes (polygon,
  circle, rotated rectangle) are rough manual outlines, so this is classification with rough localisation,
  not precise masks. 74,410 images are labeled to species (542), the rest to 69 genera; long-tailed classes.
  Annotated in BIIGLE 2.0 by four annotators with taxon-by-taxon review. The 60/20/20 subsets are on Kaggle,
  not in this record. Organism is the phylum Bacillariophyta because many taxa are present. Authors are
  those on the Zenodo record. enricher: listing confirms size; one cutout sampled; CSV header and Readme.txt
  (CC0) read.'
