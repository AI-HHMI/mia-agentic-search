notes: 'TCIA page: 189 subjects, 81,214 images, 13.3 GB of TIFFs via Aspera, CC BY 4.0, last updated 2023-10-13. The paper
  (PLOS Digital Health, read via Europe PMC) says 242 smears gave 101,947 single-cell images, and after filtering 189 patients
  and 81,214 images, the same counts as TCIA. Single cells are TIFFs "with a size of 144x144 pixels, corresponding to 24,9μm
  x 24,9μm" (paper Methods), so the pixel size is about 0.173 um (172.9 nm, calculated from those two figures). Labels are
  patient-level genetic subtypes used for multiple-instance learning; no per-cell labels, so this is weak supervision. The
  labelling method was not read as an annotation procedure, so source is unknown. Patient-level train/validation/test splits
  were used in the paper but are not released with the collection. The file listing was not opened (Aspera only), so formats
  and counts come from the TCIA page.'
