notes: 'Dryad lists 213 files (68.4 GB): a README and per-slide zips named SlideNN-Inflammation.zip, SlideNN-UCC.zip and SlideNN-Invalid.zip,
  CC0 1.0. The zips and README returned 403 to this run, so their contents were not listed; the JPEG format and 3136x2352 pixel
  size come from the paper (Olympus E-330 camera on an Olympus CX31 microscope at 20x, 1:2.7 JPEG compression), and the label-by-zip-name
  scheme is inferred from the file names. Counts (5,948 inflammation, 5,811 UCC, 3,132 invalid) are from the paper and Dryad abstract.
  Invalid images are not useful for training but are included in n_items. Pixel size is not stated on the Dryad page or in the
  paper text read.'
