id: tudatalib-3930-tyc-trapped-yeast-brightfield
title: The TYC (trapped yeast cell) dataset for instance-level semantics and motions of cells in microstructures
short_name: Trapped yeast cells and traps (brightfield)
description: 105 densely annotated high-resolution (2048x2048) brightfield images of budding yeast cells in microfluidic trap microstructures, with instance masks for cells and traps (about 19k instances, six trap geometries). Split into training, validation, test and an out-of-distribution test set. A separate unlabeled set of 261 time-lapse clips (1293 frames) is also released.
