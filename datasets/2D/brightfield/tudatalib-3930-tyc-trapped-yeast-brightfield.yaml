notes: 'Hosted at TUdatalib (https://tudatalib.ulb.tu-darmstadt.de/handle/tudatalib/3930; files labeled_set.zip, unlabeled_set_1-3.zip per the project page), but that host returned 403 to this run, so the file listing, file formats (recorded as other), total size and DOI could not be checked. Pixel size is not stated on the project page or in the paper text read; annotation files were not seen in a listing. CC BY 4.0 is stated on the project page and in the paper abstract. Pixel size, objective magnification and per-split image counts (paper Table 1) were not extracted. Different from the older Yeast-in-Microstructures dataset (493 images of 128x128) by the same authors.'
