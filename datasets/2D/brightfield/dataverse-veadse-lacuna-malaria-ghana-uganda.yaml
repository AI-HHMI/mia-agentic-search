  notes: 'Metadata-only: the images are in RAR5 archives (Thick_Ghana is a 3-part multi-volume RAR) whose members
    are compressed (RAR method 3), and no allowed tool can list or extract RAR members by range, so no image or
    label file was opened. An ad hoc script walked the first 7 file headers of Uganda/Thin_Uganda.rar by range requests
    (~33 KB): images/1660560579642.jpg (1,153,734 B unpacked) etc. Label files (YOLO txt per the datasheet / record)
    were not reached; listing all members would need ~1 range request per file. All 7 Dataverse files are listed
    with exact sizes, so size_bytes = 7,233,937,245 B is confirmed. Each RAR is a direct, range-capable file (Dataverse
    access API redirects to S3), but TensorSwitch cannot open RAR, so no sample unit is given and data.download_url
    stays null (no single archive for the dataset). Voxel size not found; checked: Dataverse metadata, paper full
    text (PMC11719325: Olympus CX23 at 1000x, phone camera via MegaZoom app, no pixel size), both datasheet PDFs
    (pdftotext; they name the annotation tools, makesense.ai for Ghana and VGG Image Annotator for Uganda, but no
    pixel size).'
