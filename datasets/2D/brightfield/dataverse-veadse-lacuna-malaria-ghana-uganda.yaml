notes: 'Dataverse v5 (2024-08-08) lists 7 files, 7.23 GB: two datasheet PDFs, Ghana/Thick_Ghana.part1-3.rar, Ghana/Thin_Images_Ghana.rar
  and Uganda/Thin_Uganda.rar; RAR contents were not listed (peek_archive reads zip only). Datasheets: Ghana 3,000 thick + 1,000
  thin images with bounding boxes; Uganda 4,000 images (paper: 3,000 thick + 1,000 thin) with YOLO labels, but no Uganda thick
  archive is visible in the listing, so n_items counts only Ghana (4,000) + Uganda thin (1,000). Classes: thick: parasite/trophozoite,
  WBC; thin: gametocyte, trophozoite, ring, parasitized cell, WBC, artefact. Over 95% of thin-smear parasites are P. falciparum
  trophozoites. No splits. The Tanzania Lacuna set is a separate record on main. Pixel size not stated.'
