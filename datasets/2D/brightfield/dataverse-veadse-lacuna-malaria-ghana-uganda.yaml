title: Lacuna Malaria Datasets
short_name: Malaria blood smears (Ghana, Uganda) boxes
description: Smartphone-on-microscope images of thick and thin Giemsa-stained blood smears from hospitals in Ghana
  and Uganda, annotated with bounding boxes for malaria parasites (trophozoites, gametocytes, ring stage), white
  blood cells, parasitized cells and artefacts. The Lacuna project deposit holds Ghana thick and thin sets and Uganda
  thin set (YOLO labels) with datasheets.
