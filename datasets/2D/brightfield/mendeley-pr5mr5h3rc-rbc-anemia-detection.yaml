title: Object-detection annotations and multimodal dataset for the detection of microcytic hypochromic anemia
short_name: Anemia red blood cell detection (brightfield)
description: YOLO-format bounding-box annotations (microcytic hypochromic, normal, other red blood cell) for 94,221
  cells across 1,002 Wright-Giemsa blood smear images at 40x, plus a patient-level table of morphometric features
  and CBC indices for 417 patients. The images derive from the AneRBC benchmark.
