notes: 'File listing from the Mendeley public API: 769 .jpg images, 994 .txt YOLO label files, data.yaml (nc 3, train/val/test folders) and master_table_ENRICHED_final.csv; about 29 MB in total. The record text says the original smear images come from AneRBC (a separate catalog record, mendeley-hms3sjzt7f) and "should be obtained from that source", yet the listing contains 769 jpg images, so the exact image/label correspondence (and the 1,002 vs 769 count) is unverified. Related article ("Towards Interpretable Deep Learning: An Explainable Multimodal Framework for the Detection of Microcytic Hypochromic Anemia") is given without a link or DOI and could not be read, so authors, pixel size and image dimensions were not found. Not a duplicate of AneRBC: this adds object-detection labels.'
