notes: 'Mendeley API listing: 769 .jpg images (640x640 RGB) + 994 YOLO .txt labels in train/valid/test, data.yaml
  (3 classes), Roboflow READMEs and a patient-level CSV (multimodal dataset/). README.roboflow says 1002 images;
  233 train label files have no image in the deposit (the page says the original smears come from AneRBC, catalog
  record mendeley-hms3sjzt7f). enricher: authors from the Mendeley API (was empty); n_items 769 = images present
  (was 769); size 29,151,699 B confirmed by the API file listing. enricher: voxel size not stated anywhere; README.roboflow
  says images were stretched to 640x640, so the pixel size is not isotropic and the AneRBC source gives none. Related
  article has no DOI and was not found in Europe PMC.'
