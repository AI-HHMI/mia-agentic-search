  notes: 'Listing from the Mendeley public API (files + folders/1), exact per-file sizes, complete. Sampled one
    test pair (22,118 B): JPEG 640x640x3 uint8, observed range 148-240 in that one sample. Label txt read as text
    (73 rows x 5 columns; float values, dtype field is the parsed type, not a stored one). No whole-dataset archive
    is listed by the API (links: view only), so data.download_url keeps the landing page; every file has a direct
    public-files URL (redirects to S3, range requests OK). Voxel size not found; checked: JPEG header (no calibration),
    Mendeley API description/method, README.roboflow/README.dataset, data.yaml, Europe PMC (paper not found), upstream
    AneRBC record (none; originals 1224x960, stretched to 640x640 here). Not convertible yet: 2D records are outside
    the miao layout. The patient CSV (multimodal dataset/) is a table, not an array, and is listed only in the tree.'
