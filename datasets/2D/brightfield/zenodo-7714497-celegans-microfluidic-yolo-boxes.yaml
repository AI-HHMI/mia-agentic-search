notes: >-
  The Zenodo file list has 846 files, 423 JPEG images each with a VOC XML (so a subset of the images described: the
  Zenodo text mentions 3,373 and 3,931 images while the paper counts 3,931 annotated worms in boxes). The paper divides
  the boxes into training, testing, validation and external validation sets, but the Zenodo files do not include a split
  folder. Frames come from about 20 earlier published microfluidic videos with different imaging conditions
  (paper Methods), so the pixel size, microscope and exact modality vary and are not stated; brightfield and
  fluorescence are inferred from the WT and GFP classes. Redistribution terms of the source videos were not checked.
