notes: 'Zip listing (peek_archive) shows 516 PNGs and 516 txt label files plus a YOLO yaml; folder counts (train 413, val 51,
  test 52 images, derived from the listing) match the 80/10/10 split stated on Zenodo. The yaml declares classes Healthy and Unhealthy.
