notes: 'Zip listing (peek_archive) shows 516 PNGs and 516 txt label files plus a YOLO yaml; folder counts
  (train 413, val 51, test 52 images, derived from the listing) match the 80/10/10 split stated on Zenodo.
  The yaml declares classes Healthy and Unhealthy. Organism, cell types of the tri-culture, annotation
  procedure, image size and pixel size are not stated on the record and no paper is linked ("more details
  will be available in the corresponding publication"). The yaml contains local Windows paths that must
  be edited before training. Same author and imaging setup as the HepG2 spheroid record zenodo-11121371.
  enricher: source manual (Zenodo: "Manual labelling of the images"); YOLO rows read from a sample label.'
