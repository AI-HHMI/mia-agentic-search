short_name: Scratch wound-gap segmentation (brightfield)
description: 1,363 brightfield images of scratch (wound healing) assays on HUVEC and SKOV-3 cells imaged at several time points
  after the scratch, with polygonal wound-gap annotations (1,350 polygons in 1,213 images; 150 closed-wound images kept as
  negatives) in COCO and YOLO formats. Split into train/val/test over acquisition units to avoid leakage between frames of the
  same well.
