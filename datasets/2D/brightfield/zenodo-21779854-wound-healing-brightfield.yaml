notes: 'Zip listing (peek_archive): 2,734 members; dataset/images/{train,val,test} PNGs, dataset/labels
  YOLO polygons, coco_partitions JSONs, partition CSVs and data.yaml. The dataset README states 932/197/234
  train/val/test images, 1,350 polygons in 1,213 images, and 150 negative images; it lists 1,030 HUVEC
  + 333 SKOV-3 images while the Zenodo description lists 1,085 + 412 acquired frames before triage (differing
  counts not reconciled). Polygons drawn on Roboflow with SAM assistance and expert review (Zenodo description).
  The deposit also holds YOLO/U-Net weights and code under AGPL-3.0/MIT; the dataset and annotations are
  CC BY 4.0. The accompanying paper is under revision (Cytometry Part A), so no paper is listed and no
  paper full text was read. Microscope, magnification and pixel size are not stated on the Zenodo page
  or dataset README (zip README checked). enricher: probed PNGs (2056x2452 uint8 gray) and read one YOLO
  label and data.yaml (class 0: wound).'
