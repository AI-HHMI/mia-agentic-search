description: 493 densely annotated brightfield time-lapse microscopy images of Saccharomyces cerevisiae cells in microfluidic trap microstructures, with manually labelled instance masks and classes for cells and traps, plus bounding boxes. Intended for instance and panoptic segmentation; train/val/test splits are provided.
