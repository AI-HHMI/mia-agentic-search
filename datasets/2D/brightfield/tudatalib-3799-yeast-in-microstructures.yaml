notes: 'Hosted on TUdatalib (handle 3799, no DOI); the handle page was blocked (Anubis), so metadata came from the b2find mirror, project page and GitHub README; zip contents not listed, so annotation structure is from the README. Formats are PyTorch .pt tensors. Paper split counts (296/49/148) sum to 493 but its tables sum to 693; README examples mention 256x256 vs 128x128 images. Pixel size, microscope and strain not stated on pages read or in the paper. Distinct from the catalogued TYC dataset (105 images).'
