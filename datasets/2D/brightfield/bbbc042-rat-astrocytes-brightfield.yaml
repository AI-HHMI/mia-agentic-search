notes: 'Dataset page says 1,200 images (listed as 1,120 in the index); images.zip actually holds 1,117
  TIFFs (2.35 GB uncompressed, 1.95 GB compressed) and positions.zip 1,117 matching .txt files, so n_items
  is the listed count. The page calls the ground truth biological labels with coordinates; the files hold
  per-cell rows of 4 coordinates consistent with the paper bounding rectangles drawn by an expert in Matlab
  (Training Image Labeler); exact column meaning is not documented on the page, so the interpretation
  is inferred. Pixel size, stain and magnification not stated on the page or in the paper text read. Paper
  also mentions a separate ~130-image test set; no split is provided in the zips. enricher: size_bytes
  = 1,950,875,459 B from the complete zip listing (was null); sampled image is 8-bit RGB (3 samples),
  channels left at 1.'
