notes: 'peek_archive of OrganoidDataset.zip: 840 .jpeg + 840 .txt (train/val images and labels), data.yaml
  (nc 4, names organoid0/organoid1/organoid3/spheroid) plus .DS_Store files. Zenodo description: 756 training
  / 84 validation images. Annotation count (23,066) and the EVOS FL 4x acquisition are in the Zenodo description
  and paper Methods. Pixel size is not stated on the record or in the paper text read. Class name "organoid3"
  for late organoids is as in the data files. enricher: listing and samples confirm 756/84 jpeg + YOLO
  txt pairs; sampled image is RGB 1280x960 with non-identical channels.'
