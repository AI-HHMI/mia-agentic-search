notes: 'leucorrhea.zip (968.69 MB) needs an IEEE DataPort login, so the file listing was not seen; the JPG format,
  folder naming and CSV columns come from the landing page. Imaging per the open-access companion paper (Microscopy
  2022): OLYMPUS CX31 microscope, 40x objective, EXCCD01400KMA CCD camera (6.45 um sensor pixels, 1920x1080); experts
  annotated all images with rectangular boxes, 8:2 split by field of view (no split is shipped). SDoF-Net (JBHI
  2022) is not open access and was not read. Per-class counts and pixel size not stated. Same group and format as
  the fecal microscopy record. enricher: page says IEEE DataPort "Subscription Required" (may be paid), not only
  a free login: reviewer should confirm access.'
