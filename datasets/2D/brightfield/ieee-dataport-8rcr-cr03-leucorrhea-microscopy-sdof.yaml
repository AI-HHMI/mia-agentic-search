title: Leucorrhea Microscopy Dataset - super-depth-of-field multi-focus images with bounding boxes for six cell
  classes
short_name: Leucorrhea microscopy cell detection (brightfield)
description: 4,656 brightfield micrographs (1200x1920 px) in 1,552 groups of views (three sharpest focus images
  per view, chosen by Tenengrad definition) from leucorrhea samples of the Sixth People's Hospital of Chengdu, with
  bounding-box annotations of red blood cells, white blood cells, molds, epithelial cells, pyocytes and trichomonads
  for super-depth-of-field object detection.
