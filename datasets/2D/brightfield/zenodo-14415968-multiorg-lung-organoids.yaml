notes: 'Zenodo record is a redistribution of the Kaggle release (christinabukas/mutliorg) and states CC BY 4.0, but the Croissant metadata inside the archive states CC BY-NC-SA 4.0 and the paper states no dataset license; the more restrictive terms may apply. Zenodo creator: Christina Bukas (the uploader); see paper for all authors. Annotation was pseudo-labels from napari-organoid-counter corrected manually by two annotators (hence source mixed). The zip has 411 TIFFs (about 43 MB each, 17.7 GB total) with one JSON of box corners per image; the testA1/testB1 label sets are only available via the Kaggle challenge leaderboard per the paper, so the Zenodo copy holds the train and test0 labels (split folders train/ and test/, subfolders Normal and Macros). Pixel size from paper Methods (1.29 um per pixel). enricher: formats tiff -> ome-tiff, channels 1 (probed uint16 single-channel OME-TIFF); annotation file names corrected.'
