description: 411 large brightfield images (about 6000 x 6000 px, 5x objective, 1.29 um/px) of murine lung organoids from 32 studies, with more than 60,000 organoid bounding boxes. Train has 356 images, test 55, with three independently annotated test label sets. This Zenodo record redistributes the original Kaggle release unmodified.
