notes: 'Class counts from the paper: elliptocyte 1211, pencil 24, teardrop 2076, acanthocyte 354, stomatocyte 382,
  target 851, spherocyte 562, hypochromic 222, normal 1426. Mendeley page shows no file names or sizes (Download
  All only), so folder layout and total size could not be verified; the paper also gives a UGM mirror (simpan.ugm.ac.id).
  Single-cell crops vary in size with the cell; paper states pixel size of the camera images only as 4100x3075 px
  at 1000x total magnification, no um/pixel value, so voxel size is null. Sibling dataset ThalassemiaPBS (doi 10.17632/gd9ysj73jd.1,
  80 raw smear images, no annotations) is not catalogued. Checked: Mendeley page, paper full text (Methods, Data
  accessibility). enricher: size 10,078,529 B from the Mendeley file API (9 zips, one per class; was null); channels
  1 (grayscale PNG); annotations verified from zip listings.'
