title: RBCdataset
short_name: Thalassemia red blood cell types (brightfield)
description: 7,108 grayscale PNG crops of single red blood cells from peripheral blood smears of four thalassemia
  patients and one healthy subject (Olympus CX21, 1000x oil immersion), sorted by a clinical pathologist into nine
  cell types (elliptocyte, pencil, teardrop, acanthocyte, stomatocyte, target, spherocyte, hypochromic, normal).
  Cells were found by classical segmentation in MATLAB, then sorted manually.
