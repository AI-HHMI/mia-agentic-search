  notes: 'Listing: Mendeley Data public file API, 9 zips, 10,078,529 B in total, exact sizes; zip directories read
    with tools/peek_archive.py: 7,108 PNGs (per-class counts match the paper) plus one .xls in the spherocyte zip
    (not opened; undocumented). Probed 5 PNG members: 8-bit grayscale, deflate. Sampled 60 members (20 each from
    normal, teardrop, spherocyte; 79,782 B) with a scratch script (tools/sample.py doesn''t treat Mendeley''s extension-less
    zip URLs as zips): mode L, uint8, values 0-220 overall, corners 0 (background masked to 0). Value range is from
    these samples only. Per the paper the crops come from the green channel of images resized from 4100x3075 to
    800x600 px, so normalization is unknown. Voxel size not found; checked: PNG headers (probe found no calibration),
    Mendeley API record, paper full text (Methods, Data accessibility: only 1000x total magnification and image
    size in px), related IEEE Access paper (no open full text). No single archive for the whole dataset: download_url
    is the landing page; the 9 direct zip URLs are https://data.mendeley.com/public-files/datasets/rfdz6wfzn4/files/<file
    id>/file_downloaded (from the file API). Dimensionality 2D is not yet covered by the miao layout.'
