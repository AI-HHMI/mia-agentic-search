  notes: 'Sizes from the Mendeley public API (v5 files[].size, exact for all 5 archives; tools/listing.py could not read them: data.mendeley.com redirects to S3 and S3 listing is 403). Archives are RAR5 (no RAR extractor available); members listed with a stdlib RAR5 header parser: Normal_Colon (8 jpg) and Mixed_Normal_Tumoral_Colon (7 jpg) fully, first member of each grade archive via a 4 KB range request; grade archive member counts are the documented counts, not listed. Sample: Normal_Colon/4x/01_Normal_4x_1.jpg (stored uncompressed in the RAR, carved and decoded): RGB uint8 800x800, value_range from this one image. Paper: all images RGB JPEG 800x800, 24-bit, 96 DPI. Labels: image-level class from archive/folder name and the G1/G2/G3/Normal token in file names; no label files. Mixed M7_with_Annotation.jpg has the same byte size as M6.jpg (likely M6 with drawn annotation; not decoded). Voxel size not found; checked: JPEG header (no DPI/calibration in the sampled file), Mendeley API v4/v5 description, arXiv paper full text (Table 1 gives only 96 DPI), databiox.com. Download: data.mendeley.com file_downloaded links redirect (302) to prod-dcd-datasets-public-files-eu-west-1.s3.eu-west-1.amazonaws.com objects (range requests OK, host not on TensorSwitch allowlist); RAR is not readable by TensorSwitch. No single archive for the whole dataset, so download_url stays the landing page.'
