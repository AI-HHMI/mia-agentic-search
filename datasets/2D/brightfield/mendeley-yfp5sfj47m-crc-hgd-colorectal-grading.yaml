notes: 'The v4 landing page (published 2026-06-24) states CC BY-NC-ND 4.0 and lists no files; the Mendeley API lists version 5 (published 2026-09-15) with five RAR archives (CRC_Grade__1__Well_Diff, CRC_Grade__2__Mod_Diff, CRC_Grade__3__Poorly_Diff, Mixed_Normal_Tumoral_Colon, Normal_Colon; 479.8 MB total) and no license field. The RAR contents were not listed (peek_archive supports zip only), so annotations_verified is false; labels are class folders per the naming convention. Class counts: 860 G1, 712 G2, 327 G3, 8 normal, 7 mixed. Pixel size is not stated. Patient-level (not image-level) splits are not provided; the project site databiox.com hosts the latest version.'
