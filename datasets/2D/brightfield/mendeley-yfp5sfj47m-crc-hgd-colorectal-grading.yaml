notes: 'Files exist only in Mendeley version 5 (2026-09-15): five RAR archives (CRC_Grade__1__Well_Diff, CRC_Grade__2__Mod_Diff, CRC_Grade__3__Poorly_Diff, Mixed_Normal_Tumoral_Colon, Normal_Colon; 479,765,925 bytes per the API); the cited v4 page lists no files. License conflict: v4 (landing page and API) states CC BY-NC-ND 4.0, the v5 API record with the files states CC BY-NC 4.0; kept v4''s value, needs human review. Labels are class folders and file names ([Sample]_CRC_[G1-3]_[archive no.]_[mag]_[index].jpg). Class counts: 860 G1, 712 G2, 327 G3, 8 normal, 7 mixed. Pixel size is not stated (paper gives only 96 DPI). No patient-level splits. enricher: annotations_verified true (class folders/file names seen in all five archives'' RAR headers).'
