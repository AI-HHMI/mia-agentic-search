title: AI4NTD KK2.0 P1.5 STH & SCHm Dataset
short_name: Helminth eggs in Kato-Katz smears (brightfield)
description: 7,780 in-focus field-of-view images of Kato-Katz stool thick smears from a low-cost prototype slide
  scanner (10x, 0.25 NA objective), with 16,990 annotated helminth eggs (Ascaris lumbricoides 8,600, Trichuris trichiura
  4,083, hookworm 3,623, Schistosoma mansoni 684) for object detection. Provided as TensorFlow Object Detection
  TFRecords with train, eval and test splits, plus a label map and trained detector exports.
