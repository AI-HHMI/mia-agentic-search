notes: 'Kaggle API record (CC BY-SA 4.0, version 12, 11.03 GB in total) and file listing (train.record 7.14 GB, eval.record
  2.04 GB, test.record 1.03 GB, egg_label_map.pbtxt, and five detector exports with configs; size_bytes is the three records
  only). The PLOS NTD paper (open access, read) gives 7,780 FOV images, 16,990 eggs, a 70:20:10 split, and the 10x 0.25 NA
  optics; pixel size is not stated. Images are inside the TFRecords, not separate files, hence formats other and no per-image
  count check. The paper text is CC BY 4.0. Related: the Zenodo deposit zenodo-13843815 (in this catalog) reuses AI4NTD images;
  Kaggle v2 and P3.0 sets by the same group are separate. Annotation type bounding-box follows the paper and the detector
  training use; box format not inspected.'
