notes: 'HTTP index of the BioStudies FTP: 14 per-genus zips (202 GB), about 2,000 unzipped TIFFs, metadata CSV/XLSX, 741 segmentation
  PNGs; about 240 GB. BioStudies says over 20,000 images (paper: 18,104 in v1), so n_items null. Species identified by taxonomists
  or molecular assays; segmentation PNG origin not stated, hence source mixed. Pixel size not stated; device-dependent image
  sizes. Stereo and smartphone images. organisms: Culicidae = Culicidae/ and the mosquito zips, Glossina = Glossinadae/Glossina/
  and Glossina.zip. enricher: download_url https form of the zipped/ folder (was ftp://); channels 3 (RGB TIFFs). Segmentation
  PNGs cover aedes 378, culex 195, anopheles 112, coquillettidia 30, culiseta 26 images; metadata_v2.csv has a Segmentation
  Label column.'
