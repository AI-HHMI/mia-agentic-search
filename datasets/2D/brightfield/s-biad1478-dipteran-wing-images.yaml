title: Comprehensive Dipteran Wing Image Repository for Advancing Research on Geometric Morphometric- and AI-Based Identification
short_name: Mosquito and tsetse wing species images (stereo)
description: Over 20,000 TIFF images of dipteran wings, mostly mosquitoes (Culicidae) plus tsetse flies (Glossina), mounted
  on slides and imaged with Olympus SZ61, Leica M205c stereomicroscopes or a smartphone with macro lens. Images
  carry five-level taxonomic labels and per-image metadata, and a folder of wing segmentation label PNGs is included.
