notes: 'HTTP index of the BioStudies FTP (listing.py, sizes rounded): 14 zip files 202 GB, plus about 2,000 unzipped TIFFs by genus, metadata CSV/XLSX and 741 segmentation label PNGs; total about 240 GB. Image count: the BioStudies description says over 20,000 (paper: 18,104 for the first release), so n_items is left null. Labels: species identified by taxonomists or molecular assays (so manual or lab-confirmed), segmentation PNGs origin and class definition not stated in the pages read (content not opened), hence source mixed. Pixel size not stated and varies by device (3024x3024 phone, 3088x2076 DP23, 2560x1920 M205c); stereomicroscope and smartphone images, not compound-microscope data. Images vary in lighting and background across projects (paper and description).'
