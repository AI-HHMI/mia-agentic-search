short_name: MultiOrg lung organoid detection (brightfield)
description: 411 full-well brightfield images (356 train, 55 test) of murine lung
  organoids with about 63,000 bounding-box annotations; test images carry three label
  sets from two experts for multi-rater analysis. Training labels are pseudo-labels
  from napari-organoid-counter corrected by experts, per the paper.
