notes: 'Dryad API record (CC0, one 2.7 GB Dataset.zip plus README.txt) and the arXiv full text read: 500
  8-bit RGB images cropped to 1024x1024 from different time-lapse experiments, ground-truth single-class
  masks labelled manually in MATLAB (model trained on 512x512 crops, 80/20 train/test split in the paper
  only). Raw camera pixel size 113 nm; delivered images are quarter-resolution (Bayer quadruplets), so
  the delivered pixel size is not stated. Dryad downloads require a token, so the zip contents and image/mask
  file formats were not listed (hence formats other) and whether masks exist for all 500 images is unconfirmed.'
