notes: 'Derived from ORION-CRC (Zenodo 7637988) and HEMIT (Mendeley 3gx53zm49d). Layout (he/ JPEG, if/ 8-bit TIFF, nuclei/
  label TIFF, csv_nuclei_pos/ CSV, split CSVs) from the record description. Paper: 41 slides split 37/2/2 by slide, ~10% of
  tiles removed in QC, nuclei from Cellpose on DAPI, cell types are GMM pseudo-labels. License MIT from the Zenodo record;
  the HEMIT part is CC BY 4.0. enricher: voxel 500 nm from arXiv 2505.10294v2 Table 1 (OrionCRC 333x333 tiles, MPP 0.5; was
  null); tile TIFFs carry the source WSI calibration (325 nm), which the docs override. HEMIT masks are at HEMIT resolution.
  n_items 318,450 tiles (was null).'
