  notes: 'listing.py on the Zenodo record with --expand-zips: 3 files, 146,138,887,662 B exact, 1,261,056 zip members; nuclei/
    318,450 TIFF (3.7 GB). Probed (range reads inside the 127 GB zip) if/ and nuclei/ tile ..._10240_10240_0_512_512.tiff:
    mIF 333x333x17 uint8 deflate (494,451 B), nuclei 333x333 int32 deflate (14,373 B). Both carry the source WSI OME-XML.
    The he/ probe failed (zenodo TLS EOF). Not sampled (each sample needs the 100+ MB central directory again). The paper
    says 16-plex mIF; the tiles have 17 channels (channel names not read). The zip is direct (usable, range requests) but
    127 GB, so data.download_url stays on it and the sample uses members.'
