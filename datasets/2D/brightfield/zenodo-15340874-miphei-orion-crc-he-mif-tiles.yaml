title: MIPHEI-ViT Dataset
short_name: ORION-CRC H&E and mIF tiles (MIPHEI-ViT)
description: Preprocessed, aligned H&E and multiplex immunofluorescence (mIF) tiles for H&E-to-mIF translation, built from
  ORION-CRC (colorectal cancer whole-slide images with H&E and 16-channel mIF restained on the same section) at 20x. Folders
  hold H&E JPEG tiles, 8-bit mIF TIFF tiles, nuclei label TIFF masks, cell position and type CSVs and train/val/test split
  CSVs. The record also has Cellpose nuclei masks and per-cell CSVs for the HEMIT dataset (images not included) and CycleGAN-normalized
  H&E tiles.
