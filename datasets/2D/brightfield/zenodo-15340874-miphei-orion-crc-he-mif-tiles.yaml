notes: 'Derived from ORION-CRC (Zenodo 7637988) and HEMIT (Mendeley 3gx53zm49d). The Zenodo record lists three zips (127.0 GB,
  18.5 GB, 0.58 GB; 146.1 GB total) and the main zip layout (he/ JPEG, if/ 8-bit TIFF, nuclei/ label TIFF, csv_nuclei_pos/ CSV,
  split CSVs) is from the record description; only the small HEMIT zip was listed with peek_archive (5,292 mask TIFFs and 5,273
  CSVs, the larger zips timed out). Tile size, tile count and pixel size of the 20x tiles are not stated on the record; the paper
  trained on 256 x 256 tiles at 0.5 um per pixel, H&E registered at 0.325 um per pixel (Aperio GT450), 41 slides split 37 / 2 / 2 by
  slide, about 10 percent of tiles removed in QC, nuclei from Cellpose on DAPI, cell types as pseudo-labels from a GMM gating
  of marker intensities. The ORION-CRC source data is separate and was not recorded in this run. License MIT from the Zenodo
  record; the HEMIT part is CC BY 4.0.'
