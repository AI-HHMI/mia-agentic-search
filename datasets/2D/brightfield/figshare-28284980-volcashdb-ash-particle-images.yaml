notes: 'particles.zip (5.78 GB) listed with peek_archive: 11,808 .png, label in the file name. Size_bytes
  adds the images zip, Particle_features.xlsx (5.6 MB) and the MongoDB JSON backups (31.7 MB) from the
  other two Figshare items in the collection (figshare.com/collections/_/7644656; DOIs 10.6084/m9.figshare.28287008
  and 28284968). Labels were assigned by visual inspection per the paper. Pixel size is not stated (images
  are cut-outs at several magnifications and the paper treats resolution as pixels per particle area),
  so voxel_size_nm is null. License CC-BY-4.0 is from the Figshare API; the paper itself is CC BY-NC-ND.
  Images are stereo/binocular microscope views, so modality brightfield is approximate. Also browsable
  at volcashdb.ipgp.fr (not fetched).'
