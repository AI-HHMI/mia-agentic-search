title: 'VolcAshDB: volcanic ash particle images (Particle images)'
short_name: Volcanic ash particle classification (binocular)
description: '11,808 multi-focus binocular-microscope images of individual volcanic ash particles from
  53 samples and 13 volcanoes, one PNG per particle (cut out with FastSAM). The label (particle main type:
  juvenile, lithic, altered material or a free-crystal mineral such as plagioclase or pyroxene, plus sub-descriptors)
  is encoded in each file name. A companion spreadsheet gives 33 shape, texture and colour features per
  particle.'
