description: Paired bright-field and confocal fluorescence images of tobacco BY-2 cells (plasma membrane, nucleus, vacuole
  labels) and Egeria densa chloroplasts for training bright-field-to-fluorescence virtual staining, plus 100x100 px crops
  of live and dead BY-2 cells for viability classification. Released with Ichita et al. 2025 (Plant Mol Biol).
