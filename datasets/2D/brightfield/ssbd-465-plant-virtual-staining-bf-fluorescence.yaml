notes: 'Training signal is paired bright-field/fluorescence images (virtual staining), not masks; no schema annotation type
  fits, so types is other. Probed ImageJ TIFF stacks (uint16, 2048x2048): Fig1 193 z x 3 ch (150 train + 43 test pairs per
  paper), Fig6 E. densa 119 x 2 ch (109+10), BCECF 175 x 2 ch (150+25), Fig7 live/dead 1200 crops of 100x100 each. Split assignment
  is not stated in the files. Pixel size 0.56 um (BY-2) and 0.28 um (E. densa) from paper Methods; voxel size given for BY-2
  only. size_bytes = raw_image total (dataset.json). Page says a newer version exists; paper says images are also on figshare
  (URL not captured).'
