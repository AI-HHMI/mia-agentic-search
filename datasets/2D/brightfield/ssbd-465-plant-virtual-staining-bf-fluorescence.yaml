notes: 'Training signal is paired bright-field/fluorescence images (virtual staining), not masks. Paper: 150 train + 43 test
  pairs (BY-2 PM/nucleus), 150+25 (BCECF), 109+10 (E. densa); split per image not stated in the files. organisms: Nicotiana
  tabacum = Fig1_BY2_HR_PlasMemG/, SupplFigS1_BY2_BCECF/, Fig7_*/; Egeria densa = Fig6_Edensa_auto/. enricher: voxel size
  set to null (was 560x560): subsets differ, paper Methods states 0.56 um/px for BY-2 and 0.28 um/px for E. densa; no z (2D
  images stacked as ImageJ slices). enricher: size_bytes = full SSBD listing incl. source/ zips that repeat the TIFFs (raw_image
  alone 9,934,486,637 B). enricher: added classification (Fig7 alive/dead crops, class by file name). Paper says images are
  also on figshare; URL not in the full text.'
