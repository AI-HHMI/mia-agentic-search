notes: 'Well-known benchmark. README states 364 JPEGs (640x480) with VOC XML; split lists in BCCD/ImageSets/Main
  have 205 train, 87 val, 72 test lines (trainval 292), read from the repository. Images and annotations
  originate from the cosmicad and akshaylamba GitHub repositories per the README; the README gives no
  paper, microscope, magnification, pixel size or organism (blood presumed human but not stated), so those
  are left empty. Not independently checked: image file count in the folder listing (GitHub API was not
  accessible), annotation completeness (Roboflow reports 187 missing labels in the original release, per
  search result, not fetched). A YOLO-format derivative exists on Mendeley Data (10.17632/jrwz8dpm9k.1,
  CC BY 4.0) and a Roboflow re-release; this record is the original VOC release. enricher: channels 3
  (RGB JPEG).'
