notes: 'HF file listing (complete): images/*.png (110), annotations/train.json + valid.json, LICENSE.txt (CC BY-NC 4.0), README,
  dataset_infos.json; 172,044,958 B. enricher: splits 55 train / 55 valid images (1,491 / 1,446 cells) from the COCO files.
  Supplement: Opera Phenix, confocal mode, 20x water objective, "Each image has a resolution of 1080x1080 pixels, with a pixel
  size of 0.59 µm"; the PNGs are 1080x1080, so 590 nm applies to them. The paper and card call the images brightfield (cells
  Hoechst-stained and fixed). The supplement says 16 bit per channel, but the released PNGs are 8-bit RGB. Organisms: Homo
  sapiens = MCF7, HT1080, HeLa, HepG2, A549; Canis lupus familiaris = MDCK; Mus musculus = NIH3T3. Which image files (RxxCyyFzz
  well/field names) belong to which cell line is not stated. Non-commercial license (CC BY-NC 4.0).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: './            4 files   30.5 KB  (.gitattributes, LICENSE.txt, README.md, dataset_infos.json)

      annotations/  2 files   10.6 MB  .json (train.json, valid.json)

      images/       110 files 161.4 MB .png (R01C02F01.png, R01C02F05.png, ...)'
    n_files: 116
    listing_complete: true
