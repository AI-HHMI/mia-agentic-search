      what each sample holds is not documented.'
  - role: label
    path_pattern: annotations/*.json
    format: json
    axes: null
    shape: null
    shape_varies: null
    dtype: unknown
    compression: none
    encoding: polygons
    classes:
    - id: 1
      name: cell
    alignment: same-grid
    alignment_notes: 'COCO: images[].file_name (e.g. R01C03F01.png) names the PNG in images/, width/height 1080x1080 for all
      110 images; annotations[] give one polygon (pixel coordinates) and bbox per cell, iscrowd 0, overlapping cells annotated
      separately. train.json and valid.json split the images 55/55.'
  notes: 'Listing: tools/listing.py on the HF repo, complete with exact sizes. Probed images/R01C02F01.png (PNG, RGB, uint8,
    deflate, 1080x1080x3); sampled it (value range 32-255 from this one image, mean 135.9) and parsed both COCO JSONs with
    a short requests script (10,578,676 B). normalization unknown: the supplement says images were acquired at 16 bit; how
    they were converted to 8-bit RGB is not stated. Voxel size 590 nm x/y from the supplement (1.1 Data Acquisition); 2D,
    so no z. download_url: HF serves per-file links only (no archive; lab page bcv.cs.ut.ee/datasets links to HF); direct
    files are .../resolve/main/<path>. Per-image cell line (and so organism) is not given in the JSON, README or supplement.'
