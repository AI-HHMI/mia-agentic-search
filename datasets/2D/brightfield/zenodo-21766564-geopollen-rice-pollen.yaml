notes: 'Development zip: 100 JPEG images (81 at 1280x960, 19 at 5480x3648) with 100 YOLO label files and splits/fold0 train
  (80) / val (20); 7,601 fertile, 6,571 typical sterile, 3,093 stain sterile, 539 round sterile boxes (README inside the zip).
  Independent zip: 20 images with three original expert label sets and primary consensus labels (not used for model selection).
  Two more archives (manual timing benchmark, model checkpoint under AGPL-3.0) are not training data. Data licence CC BY 4.0
  per LICENSES.md; the model is AGPL-3.0. The record says it supports the GeoPollen-YOLO manuscript, but no manuscript or
  DOI is given, so no publication is listed; microscope, objective and pixel size are not stated. The Zenodo creator is listed
  only as ''Viking''. Channels: RGB JPEGs (enricher probe). enricher: size is the whole record (8 files, 267,800,235 B; was
  the two dataset zips).'
