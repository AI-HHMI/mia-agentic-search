notes: 'IEEE DataPort zip needs a login; the GitHub README links a public Google Drive copy, hence access
  open (enricher). No license is stated on the DataPort page, GitHub page or preprint, hence unknown.
  Image counts disagree: preprint says 160 images (120 train / 30 test / 10 annotator comparison), the
  DataPort listing says 95/25/10; n_items uses the paper figure. Train/test annotated by one annotator,
  comparison split by five experts (roLabelImg). Microscopes per Fig. 2 caption: CytoSMART (A172), Zeiss
  Axiovert 200 (MRC5, MCF7), IncuCyte (U251), Zeiss AxioCam (SCC25). Pixel size, magnification and image
  dimensions not stated in the preprint (full text read via biorxiv page, Table I did not render), DataPort
  page or GitHub README. Zip contents not listed (login required). Preprint full text via paper.py was
  rate-limited (429). enricher: formats jpeg, channels 1 (grey as RGB) from sample; annotations verified
  in Drive copy.'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "IEEE DataPort: OCD.zip (50.12 MB, login required; not listed)\nGoogle Drive mirror (linked\
      \ from the GitHub README), folder listing:\n  annotations_split/\n    train/imgs/*.jpg         \
      \                96 files\n    train/annotations/xml_format/*.xml       96 files (roLabelImg robndbox)\n\
      \    train/annotations/alpr_format/*          96 files\n    test/imgs/*.jpg                    \
      \      24 files\n    test/annotations/{xml_format,alpr_format}/\n  annotations_split.rar       \
      \               36.6 MB (same split, RAR)\n  new_annotations/imgs/*.jpg                 11 files\n\
      \  new_annotations/annotations/*.txt          11 files (class + 8 normalised corner coords)\n  new_annotations.rar,\
      \ framming.ipynb, make_prediction.sh, .ipynb_checkpoints/\n"
    n_files: null
    listing_complete: false
