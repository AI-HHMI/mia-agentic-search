    - id: null
      name: HardToSee
    alignment: same-grid
    alignment_notes: 'Pairing: imgs/<stem>.jpg <-> annotations/xml_format/<stem>.xml (same stem); XML
      <size> 1280x720 matches the image; boxes in pixel units. Shape = objects x (cx, cy, w, h, angle)
      in the sampled file.'
  notes: 'Listed the Google Drive mirror via its public folder view (embeddedfolderview): train 96 + test
    24 images with XML and alpr annotations, plus 11 new_annotations images; the DataPort zip (50.12 MB,
    page-stated) needs a login and was not listed, so whether it matches the mirror exactly is unconfirmed.
    Sampled one train JPEG (720x1280x3 uint8, grey stored as RGB, min 80 max 255; one sample) and read
    its XML (118 robndbox objects: NormalCell 98, AffectedByTreatment 9, RoundCell 8, AnalyzeLater 2,
    HardToSee 1). Drive files are direct (drive.usercontent.google.com, range requests) but that host
    is not on the TensorSwitch allowlist. Voxel size not found; checked: JPEG header, XML, DataPort page,
