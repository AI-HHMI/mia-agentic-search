title: Oriented Cell Dataset (OCD)
short_name: Oriented cell boxes, human cells (brightfield)
description: Bright-field microscopy images of five human cell lines (A172, U251, MCF7, MRC5, SCC25),
  some treated with temozolomide, annotated with oriented bounding boxes (x-center, y-center, height,
  width, angle) and an elongated/round label per cell. Train, test and annotator-comparison splits.
