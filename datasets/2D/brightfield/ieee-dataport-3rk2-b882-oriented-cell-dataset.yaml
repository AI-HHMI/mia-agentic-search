notes: 'Hosted on IEEE DataPort (OCD.zip, 50 MB), where download needs a free IEEE
  account login (registration); the GitHub README also names a Google Drive copy.
  No license is stated on the DataPort page, GitHub page or preprint, hence unknown.
  Image counts disagree: preprint says 160 images (120 train / 30 test / 10 annotator
  comparison), the DataPort listing says 95/25/10; n_items uses the paper figure.
  Train/test annotated by one annotator, comparison split by five experts (roLabelImg).
  Microscopes per Fig. 2 caption: CytoSMART (A172), Zeiss Axiovert 200 (MRC5, MCF7),
  IncuCyte (U251), Zeiss AxioCam (SCC25). Pixel size, magnification and image dimensions
  not stated in the preprint (full text read via biorxiv page, Table I did not render),
  DataPort page or GitHub README. Zip contents not listed (login required). Preprint
  full text via paper.py was rate-limited (429).'
