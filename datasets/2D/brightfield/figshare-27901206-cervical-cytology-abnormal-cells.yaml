notes: 'Figshare lists JPEGImages.zip plus 15 split parts (.z01-.z15, 2.7 GB each) and Annotations.zip (3.7 MB, 8,037 XML
  listed with peek_archive); total 41.0 GB, a multi-part zip that must be downloaded in full. The images themselves were
