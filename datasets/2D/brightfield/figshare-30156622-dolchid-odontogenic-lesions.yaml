notes: 'Paired dataset: 262 H&E images (microscopy, the 2D part) plus 262 CBCT volumes (3D X-ray CT, 0.3 mm isotropic voxels per the paper; ~42 GB of the 42.6 GB zip is CBCT NIfTI). Filed as 2D with brightfield first because the microscopy images are the H&E PNGs. H&E pixel size is not stated on the figshare record or in the paper (paper says only 40x or 100x on an Olympus light microscope), so voxel_size_nm is null. Zip listing (peek_archive) shows 524 .png and 524 .nii.gz files, i.e. image plus label for each of 262 cases in each modality. The paper text says the H&E images were saved as JPG and also as PNG; the zip contains PNG. Licence CC BY 4.0 from the figshare record (the Scientific Data article page itself shows CC BY-NC-ND). The paper evaluates with 5-fold cross-validation; no fold files were seen in the listing, so splits_provided is false.'
