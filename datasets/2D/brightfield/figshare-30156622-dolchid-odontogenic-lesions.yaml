notes: 'Paired dataset: 262 H&E images (microscopy, the 2D part) plus 262 CBCT volumes (3D X-ray CT, 0.3
  mm isotropic voxels per the paper; ~42 GB of the 42.6 GB zip is CBCT NIfTI). Filed as 2D with brightfield
  first because the microscopy images are the H&E PNGs. H&E pixel size is not stated on the figshare record
  or in the paper (paper says only 40x or 100x on an Olympus light microscope), so voxel_size_nm is null.
  Zip listing (peek_archive) shows 524 .png and 524 .nii.gz files, i.e. image plus label for each of 262
  cases in each modality. The paper text says the H&E images were saved as JPG and also as PNG; the zip
  contains PNG. Licence CC BY 4.0 from the figshare record (the Scientific Data article page itself shows
  CC BY-NC-ND). The paper evaluates with 5-fold cross-validation; no fold files were seen in the listing,
  so splits_provided is false. enricher: channels 3 (RGB H&E PNG, was null).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  1 file, 42.6 GB (figshare 30156622)\n  DOLCHID.zip   1,048 members\n    DOLCHID/\n    \
      \  hist_image/  262 .png      <SUBTYPE>_<n>_HIST_Image.png  RGB 2048 x 1536 (1.2 GB)\n      hist_label/\
      \  262 .png      <SUBTYPE>_<n>_HIST_Label.png  binary ROI mask (3.2 MB)\n      cbct_image/  262\
      \ .nii.gz   <SUBTYPE>_<n>_CBCT_Image.nii.gz  int32 512 x 512 x ~508, 0.3 mm (41.7 GB)\n      cbct_label/\
      \  262 .nii.gz   <SUBTYPE>_<n>_CBCT_Label.nii.gz  binary lesion mask (74.4 MB)\n    SUBTYPE = AME,\
      \ DC, KCOT, RC"
    n_files: 1
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/58072198::DOLCHID/hist_image/AME_10_HIST_Image.png
    - https://ndownloader.figshare.com/files/58072198::DOLCHID/hist_label/AME_10_HIST_Label.png
    size_bytes: 6907704
    description: 'Case AME_10: H&E image and its ROI mask (the microscopy part).'
  arrays:
  - role: raw
    path_pattern: DOLCHID/hist_image/*_HIST_Image.png
    format: png
    axes: yxs
    shape:
    - 1536
    - 2048
    - 3
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: none
    alignment: not-applicable
    alignment_notes: H&E RGB photomicrograph per case; shape from AME_10 only.
  - role: label
    path_pattern: DOLCHID/hist_label/*_HIST_Label.png
    format: png
    axes: yx
    shape:
    - 1536
    - 2048
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    alignment: same-grid
    alignment_notes: 'Pairing: <case>_HIST_Label.png outlines the ROI of <case>_HIST_Image.png; same shape.
      255 = pathologist ROI (67% of AME_10).'
  - role: raw
    path_pattern: DOLCHID/cbct_image/*_CBCT_Image.nii.gz
    format: nifti
    axes: zyx
    shape:
    - 508
    - 512
    - 512
    shape_varies: true
    dtype: int32
    compression: gzip
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'CBCT volume (X-ray, not microscopy), 0.3 mm isotropic in the NIfTI header (paper:
      0.3 mm voxels, 512^3); AME_10 has 508 slices. Probe axes zyx; NIfTI orientation LPS.'
  - role: label
    path_pattern: DOLCHID/cbct_label/*_CBCT_Label.nii.gz
    format: nifti
    axes: zyx
    shape:
    - 508
    - 512
    - 512
    shape_varies: true
    dtype: int16
    compression: gzip
    value_range:
    - 0
    - 1
    normalization: none
    encoding: binary
    alignment: same-grid
    alignment_notes: 'Pairing: <case>_CBCT_Label.nii.gz is the lesion mask of <case>_CBCT_Image.nii.gz;
      same shape and 0.3 mm header spacing.'
  notes: 'Listed with tools/listing.py (figshare API, zip expanded): 1 file, 42,587,889,287 B, 1,048 members.
    Probed AME_10 (all 4 files). Sampled with a short script (tools.peek_archive read_member, since tools/sample.py
    needs a URL ending in .zip): HIST image 6.88 MB (RGB, 0-255, mean 178), HIST label (0: 1,048,270 px,
    255: 2,097,458) and CBCT label 51 KB (int16, 0/1, zooms 0.3 mm). One case only. H&E normalization
    none is inferred (8-bit RGB camera images). H&E pixel size not found; checked: PNG (no pHYs calibration
    in probe), figshare record, paper (40x or 100x only).'
