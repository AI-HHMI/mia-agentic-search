notes: 'Zip listed with peek_archive (187,355 files, 31.8 GB uncompressed): tile TIFFs for several tiling strategies, 22 COCO
  JSONs, per-slide train/val/test area images and masks, 5 notebooks, Readme.pdf. n_items 6 = virtual slides. Only part of
  each slide is annotated (about 500 diatoms in the training section per paper Fig 3; about 580 in leave-out evaluation);
  diatoms at least about 75% complete were outlined by hand in BIIGLE and refined with SHERPA, checked by two persons, single
  class. Pixel size 0.09 um from paper Methods. The full unannotated slide scans are the companion record zenodo 7078938 (6
  TIFFs, 4.1 GB, same license), not a separate entry here. Models and results are in zenodo 7079072 and 7107456. enricher:
  organism Bacillariophyta (was empty; diatoms, >110 taxa per paper); channels 1 (8-bit greyscale tiles).'
