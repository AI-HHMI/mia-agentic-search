title: Python scripts / Jupyter Notebooks and data for training segmentation models on slide scans of diatom preparations
  from river Menne
short_name: Diatom slide-scan segmentation (river Menne)
description: Six gigapixel focus-stacked brightfield virtual slides (about 55,000 x 39,000 px, ca. 0.09 um/pixel) of benthic
  diatom preparations from the river Menne, Germany, with manually outlined diatom objects. The archive holds train, validation
  and test image areas with pixel-wise masks, and COCO-format ground truth for several tiling strategies.
