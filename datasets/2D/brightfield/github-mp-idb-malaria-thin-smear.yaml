description: Blood smear images of four Plasmodium species (falciparum, malariae, ovale, vivax) with parasite life
  stages (ring, trophozoite, schizont, gametocyte) encoded in file names. Each species folder has img (JPEG images),
  gt (ground-truth masks provided by expert pathologists) and crops; the falciparum folder also has a CSV of per-parasite
  boxes with stage labels.
