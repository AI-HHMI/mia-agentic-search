notes: 'Image counts from GitHub folder listings: falciparum 104 images (from the CSV, listing truncated
  at 100), malariae 37, ovale 29, vivax 40 = 210, all .jpg; gt/ folders hold one file per image (malariae
  gt listing shows the same 37 names). Falciparum CSV has 1,297 boxes (1,230 ring, 42 trophozoite, 18
  schizont, 7 gametocyte); the box column order (xmin,xmax,ymin,ymax) looks unusual, check before use.
  Other species CSV names were not found. Paper is not open access, only the Crossref record and the repository
  DatasetDescription.pdf were read, so magnification, camera, image size and pixel size are not stated.
  License MIT is the repository license (README), applied to code and data. Download: clone the GitHub
  repository (images are plain files, no archive). Stain, thin vs thick smear and colour channels are
  not stated in the fetched sources; modality brightfield is assumed for blood smear photographs.'
