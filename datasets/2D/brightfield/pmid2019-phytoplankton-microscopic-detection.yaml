description: 10,819 brightfield microscope images (Olympus BX53, 200x, 2040x1536 RGB) of marine phytoplankton with manually drawn bounding boxes and class labels for 24 categories (e.g. Chaetoceros, Skeletonema,
  Coscinodiscus, Ceratium furca); 217 images show living cells across 10 categories. Released on the project GitHub page in a PascalVOC-style layout.
