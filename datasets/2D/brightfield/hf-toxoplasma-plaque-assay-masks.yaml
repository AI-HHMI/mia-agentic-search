notes: 'Checked dataset page, README, API file listing (488 files each in images/ and masks/; 1.27 GB),
  manifest.csv (domain counts, shapes, dtypes) and splits.csv (332 train / 75 valid / 81 test). No paper
  is linked. Caveats: 298 of the 488 pairs (domain "literature") are crops from published figures (file
  names carry PMC ids and figure names, JPEG-derived uint8), so image quality is lower and the CC-BY-4.0
  stated for the repository may not cover the original figure copyright; the remaining 190 pairs are plate-well
  images. Pixel size, microscope, host cell type and exact imaging contrast per domain are not stated
  (brightfield recorded as the closest modality value; bigbean names say Ph2, i.e. phase); "hand-curated"
  masks per README, tool not stated. enricher: channels null (was 1; malnio is RGB, others grey).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: './        5 files   199.9 KB  README.md, manifest.csv, splits.csv, excluded.csv, .gitattributes

      images/ 488 files     1.3 GB  .tif  (<domain>__<stem>.tif; literature 298, malnio 96, patrick 67,
      bigbean 27)

      masks/  488 files     8.2 MB  .tif  (same names as images/)

      '
    n_files: 981
    listing_complete: true
  sample:
    urls:
    - https://huggingface.co/datasets/einarolafsson/toxoplasma-plaque-dataset/resolve/main/images/malnio__50.tif
    - https://huggingface.co/datasets/einarolafsson/toxoplasma-plaque-dataset/resolve/main/masks/malnio__50.tif
    size_bytes: 182440
    description: Smallest annotated field (malnio__50, 258x259 RGB, 23 plaques per manifest.csv) and its
      instance mask
  arrays:
  - role: raw
    path_pattern: images/literature__*.tif
