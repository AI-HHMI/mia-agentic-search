    axes: yx
    shape: null
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Crops of published figures (PMC id and figure name in the file name); grey uint8,
      about 1200 px per side, sizes vary (manifest.csv).
  - role: raw
    path_pattern: images/malnio__*.tif
    format: tiff
    axes: yxs
    shape: null
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: RGB colour (photometric 2, 3 samples, not identical); sizes vary, e.g. 258x259 to
      640x645 (manifest.csv).
  - role: raw
    path_pattern: images/patrick__*.tif
    format: tiff
    axes: yx
    shape: null
    shape_varies: true
    dtype: uint16
    compression: deflate
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Stitched well images, 2592x2592 (40) or 1728x1728 (27) per manifest.csv; probed one,
      not sampled.
  - role: raw
    path_pattern: images/bigbean__*.tif
    format: tiff
    axes: yx
    shape:
    - 2592
    - 2592
    shape_varies: false
    dtype: uint16
    compression: deflate
    value_range:
    - 0
    - 65535
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Stitched 4X Ph2 well images (file names); 27 files, all 2592x2592 per manifest.csv.
  - role: label
    path_pattern: masks/*.tif
    format: tiff
    axes: yx
    shape: null
    shape_varies: true
    dtype: uint16
    compression: deflate
    value_range:
    - 0
    - 52
    normalization: unknown
    encoding: instance-ids
    classes:
    - id: 0
      name: background
    - id: 1..N
      name: plaque instances
    alignment: same-grid
    alignment_notes: masks/<domain>__<stem>.tif pairs with images/<domain>__<stem>.tif (same name, README).
      Mask = raw shape without the RGB axis for malnio. Max ID equals manifest n_objects in all 3 sampled
      pairs (52, 23, 44).
  notes: 'Complete HF listing (981 files, 1,278,311,626 B). Probed one image+mask per domain; sampled
    malnio__50, bigbean Plate001_Well1 and literature PMC10015115 gr1 p01 w01 pairs (13.6 MB total); value
    ranges are from these samples (uint8 and uint16 data both use the full range, so possibly contrast-stretched;
    not documented). manifest.csv lists shape and dtype per field (literature/malnio uint8, patrick/bigbean
    uint16). 0-object fields exist (e.g. a literature crop with n_objects 0). Voxel size not found; checked:
    TIFF headers (no calibration), README, HF API record, manifest.csv, splits.csv, cpsam-r5 model card,
    no paper linked. Literature crops come from many papers, so no single pixel size exists.'
