title: Toxoplasma plaque-assay curated dataset (v5; image/mask pairs with hand-curated plaque masks)
short_name: Toxoplasma plaque-assay masks (brightfield)
description: '488 image/mask pairs with 27,582 hand-curated plaques from Toxoplasma plaque assays, in four domains
  (literature 298, malnio 96, patrick 67, bigbean 27). Masks are uint16 instance labels 1..N; train/valid/test
  assignment (332 / 75 / 81) and grouping are given in splits.csv, provenance and object counts in manifest.csv.
  The literature domain consists of crops from published figures; the other domains are plate/well images (the
  bigbean file names indicate stitched 4X phase images). Used to train a Cellpose-SAM model.'
