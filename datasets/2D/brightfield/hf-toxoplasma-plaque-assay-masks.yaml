notes: 'Checked dataset page, README, API file listing (488 files each in images/ and masks/; 1.27 GB), manifest.csv
  (domain counts, shapes, dtypes) and splits.csv (332 train / 75 valid / 81 test). No paper is linked. Caveats:
  298 of the 488 pairs (domain "literature") are crops from published figures (file names carry PMC ids and
  figure names, JPEG-derived uint8), so image quality is lower and the CC-BY-4.0 stated for the repository may not
  cover the original figure copyright; the remaining 190 pairs are plate-well images. Pixel size, microscope, host
  cell type and exact imaging contrast per domain are not stated (brightfield recorded as the closest modality
  value; bigbean names say Ph2, i.e. phase); "hand-curated" masks per README, annotation tool not stated.'
