title: 'MultiOrg: A Multi-rater Organoid-detection Dataset'
short_name: Lung organoid detection, multi-rater (brightfield)
description: 411 stitched 2D brightfield images of whole 96-well plate wells containing murine lung organoids
  (26 experiments, two culture setups), with more than 60,000 organoid bounding boxes drawn by two expert annotators
  at two time points. Train and test splits are provided; part of the test labels are held back for a Kaggle challenge.
