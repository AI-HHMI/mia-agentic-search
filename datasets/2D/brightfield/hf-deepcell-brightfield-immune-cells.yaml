notes: 'Zip listing: 12,000 PNG files (60 MB compressed). The README says 3 subtypes x 2 runs x 2,000
  images and 256x256 16-bit PNG; the Parquet rows read via the datasets server carry cell_id, run_id and
  expected_class (e.g. Monocytes) plus embedding columns, with cell_id matching the image file names.
  Labels are in the field ''expected_class''; how they were assigned is not described; the README mentions
  donor ID and imaging conditions but those columns were not in the rows read. Pixel size and magnification
  not stated; no related paper linked. The Parquet table has more rows than 12,000 (row index reaches
  20,000+), possibly covering other tasks; not checked. No splits provided. enricher: size from the full
  HF listing; channels 1; the sampled PNG is 8-bit greyscale, not 16-bit as the README says.'
