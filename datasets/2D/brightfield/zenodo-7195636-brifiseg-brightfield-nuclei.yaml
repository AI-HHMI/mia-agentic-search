short_name: BriFiSeg brightfield nuclei segmentation
description: Brightfield images of RPE1, A549, HeLa and MCF7 cells (240 images per cell line) with matching nuclei segmentation labels generated automatically from Hoechst-stained fluorescence images of the same fields of view. Released as 1-channel (one z-plane) and 3-channel (three z-planes) archives for training nuclei segmentation from brightfield with U-Net / nnU-Net models.
