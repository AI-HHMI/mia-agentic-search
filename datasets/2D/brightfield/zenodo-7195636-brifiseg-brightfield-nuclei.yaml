notes: 'Zenodo record holds two tar archives: 1channel.tar (717 MB) and 3channels.tar (2.1 GB, three z-planes); the two cover the same images, so n_items (960 = 4 cell lines x 240) counts fields of view once, and size_bytes is the sum of both archives. peek_archive could not list the tar members, so the file names, exact format of images and labels, and the split were not verified from a listing; the NIfTI format is taken from the code repository README ("Nifti format were used to develop the method"), which is why annotations_verified is false. Ground truth is automatic (from Hoechst fluorescence, per the paper Methods), not manual, and the paper notes it degraded under drug treatments. Pixel size is not stated in the paper Methods or the Zenodo page. Sources checked: Zenodo record, arXiv paper full text (Methods), GitHub README.'
