notes: 'Two tar archives on Zenodo: 1channel.tar (717 MB, one z-plane) and 3channels.tar (2.1 GB, three z-planes) cover the same fields of view. Ground truth is automatic (from Hoechst fluorescence, paper Methods) and degraded under drug treatments per the paper. enricher: annotations verified from nested-zip listings and samples; label masks are semantic (binary nucleus, or background/center/border in Task002), instances are derived by watershed/connected components, so instance-segmentation dropped from types. enricher: n_items 1088 = 4 cell-line tasks x (224 train + 48 test) in 1channel (was 960, the paper says 240 per cell line); splits provided (imagesTr/imagesTs). enricher: voxel size still not found (NIfTI pixdim 1.0 default, paper gives only 20x/0.75 objective and DS-Qi2 camera).'
