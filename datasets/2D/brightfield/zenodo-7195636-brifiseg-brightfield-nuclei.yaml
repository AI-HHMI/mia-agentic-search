  notes: 'Listing: Zenodo API (2 tars, 2,844,513,792 B, complete). Tar members walked with range requests (tar headers), nested zip central directories read with range requests (custom script, requests only); ~2.1 MB read in total. Sampled 1channel Task001 image A549_001_0000 (float32 512x512x1, range 7.85-253.70, mean 177.4; one sample) and labelsTr/*_001 of all five 1channel tasks (float32; {0,1} in Task001/010/011/015, {0,1,2} in Task002). imagesTs names restart at _001 (48 files); 224+48 = 272 per task vs 240 per cell line in the paper, so test images may overlap train fields of view; not settled. Download: both tars are direct Zenodo files with range requests (download-check usable), but TensorSwitch cannot address a zip member inside a tar, so no per-file sample URL exists. Voxel size not found; checked: NIfTI header (pixdim 1.0 default), Zenodo API description, dataset.json files, arXiv paper Methods, GitHub README.'
