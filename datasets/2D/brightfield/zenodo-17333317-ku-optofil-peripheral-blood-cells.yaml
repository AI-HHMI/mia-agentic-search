notes: 'dataset.zip (565 MB) listed with peek_archive: 31,488 JPG (22,037 train, 3,142 val, 6,310 test)
  plus one .db file; the paper says 31,489 images, a difference of one not explained. Two Zenodo records
  share this title: 16536367 (2025-07-28, CC-BY-NC-4.0, no files visible through the API) and this one
  (2025-10-15, CC-BY-4.0, matching the paper licence statement); it is not stated which one the paper
  cites. The paper says images in the repository keep their original resolution and are RGB 24-bit, while
  368 x 368 is used for baselines, so the stored image size and the pixel size are not confirmed here.
  Labels were assigned by two technicians with a third adjudicating (Cohen kappa 0.85-1.00 per class).'
