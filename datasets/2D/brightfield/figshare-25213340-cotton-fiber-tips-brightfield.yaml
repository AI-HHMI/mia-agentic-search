notes: 'Twelve files (1.22 GB): nine image zips (three Deltapine 90 training/validation sets of 45, 56 and 24 images, and six evaluation sets), model_weights.zip and two COCO files. Licence is U.S. Public Domain (figshare/Ag Data Commons), which has no SPDX ID, so custom. Read the manual COCO file (69 images, 4,427 annotations, three category names including a generic tips parent) and listed one zip (45 JPEG). Paper (open access): 34/15/20 train/val/test split of the 69 manual images, Detectron2 Faster R-CNN. Pixel size is not stated on the record or in the paper text read. The record is also on USDA Ag Data Commons; the landing page there was not readable (JavaScript), so figshare is cited.'
