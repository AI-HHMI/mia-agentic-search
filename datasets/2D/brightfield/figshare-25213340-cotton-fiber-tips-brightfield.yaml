description: Full-focus brightfield micrographs (Keyence BZ-X810, 10x) of 3-day-post-anthesis cotton ovule
  fibers. 125 Deltapine 90 training images (69 manually annotated in Labelbox, 56 AI-assisted then reviewed)
  with COCO bounding boxes of tapered and hemispherical fiber tips, plus 144 evaluation images of six
  cotton accessions (24 each) with manual ground-truth counts, and Detectron2 weights.
