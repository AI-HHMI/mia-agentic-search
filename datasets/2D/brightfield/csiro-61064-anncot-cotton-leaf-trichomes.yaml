notes: Hosted on the CSIRO Data Access Portal (repository 'other'). The file API lists 1,250 BMP images
  (18.6 GB, each about 14.7 MB), anncot.json and visualize_AnnCoT_annotation.zip. Images are BMP, which
  the schema has no value for, hence formats 'other'; annotations are splines (point lists), so the 'other'
  annotation type is used; pixel masks can be generated from them. The paper (HairNet2, Table 4) defines
  train/validation/test splits, but the split assignment is not a separate file in the listing (splits_provided
  false). Imaging details are from the HairNet paper Methods (image acquisition protocol); pixel size
  is not stated. CSIRO S3 download links are pre-signed and expire, so download_url is null; use the collection
  page or the DAP file API.
