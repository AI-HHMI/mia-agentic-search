notes: 'Hosted on the CSIRO Data Access Portal (repository ''other''). The file API lists 1,250 BMP images (18.6
  GB, each about 14.7 MB), anncot.json and visualize_AnnCoT_annotation.zip. Images are BMP, which the schema has
  no value for, hence formats ''other''; annotations are splines (point lists), so the ''other'' annotation type
  is used; pixel masks can be generated from them. The paper (HairNet2, Table 4) defines train/validation/test splits,
  but the split assignment is not a separate file in the listing (splits_provided false). Imaging details are from
  the HairNet paper Methods (image acquisition protocol); pixel size is not stated. CSIRO S3 links are pre-signed
  and expire; the DAP per-file links (data.csiro.au/dap/ws/v2/collections/62296/data/<file id>) redirect to them.
  enricher: annotation format read from anncot.json head/tail; download_url set to the collection page (no single
  archive).'
