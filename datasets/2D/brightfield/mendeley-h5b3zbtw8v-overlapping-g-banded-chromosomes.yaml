notes: 'Version 2 (29 Mar 2023) of the Mendeley record holds 1003 files (43.5 MB): 500 image PNGs in Images/, 500 label PNGs of the same names in Labels/, one .npz, one .h5 and a PDF README. Label images were made with a labelling tool (README) and painted in Photoshop per the version 1 page, so source is manual. Each image holds only two chromosomes, so this is a narrow task (separating overlapped pairs). No related paper is listed and no pixel size or microscope is given. enricher: channels 1 (was 3): image PNGs are grey stored as RGBA (R=G=B, alpha 255). enricher: README.pdf says the preprocessed labels (npz/h5) hold 0 background, 1 chromosome 1, 2 chromosome 2, 3 overlap; the PNG labels are colour-coded (red, green, blue on white).'
