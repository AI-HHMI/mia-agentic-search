  notes: 'File list and sizes from the Mendeley public API (1003 files, 43,459,929 bytes, equal to its stated size); listing.py can''t list Mendeley. Sampled Images/001.png + Labels/001.png (32.9 KB) and the whole .h5 (8.7 MB); probed headers of pairs 250 and 500. rcc_data_v1_preprocessed.h5 has one dataset rcc_data [500, 94, 93, 2] uint8 (values 0-255 over both channels); what each of the 2 channels holds isn''t documented, so it isn''t listed as an array. The .npz wasn''t opened (never unpickled). value_range is from one sample. Voxel size not found; checked: PNG headers (probe.py reports no calibration), Mendeley API record and both version pages, README.pdf, the ChromSegP3GAN GitHub README; no paper found in Europe PMC / Crossref. Direct download: Mendeley file_downloaded links answer 403 to scripted clients; their S3 redirect targets are direct (range requests) but that host isn''t on the TensorSwitch allowlist. No single archive is offered, so download_url stays the landing page.'
