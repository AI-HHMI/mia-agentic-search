notes: 'Version 2 (29 Mar 2023) of the Mendeley record holds 1003 files (43.5 MB): 1000 PNGs (names start 001.png, 002.png, apparently
  an image and a label PNG per index in separate folders, as the API lists each name twice), one .npz, one .h5 and one PDF README.
  Version 1 held only the .npz of two arrays shaped (500, 256, 256, 3), which suggests 256x256 RGB crops (taken from the version 1 page,
  not checked in the files). Label images were painted in Photoshop per the version 1 page, so source is manual. Each image holds
  only two chromosomes, so this is a narrow task (separating overlapped pairs), not whole-metaphase segmentation. No related
  paper is listed on the page, and the page gives no pixel size or microscope details. Checked: Mendeley landing pages (v1 and
  current) and the Mendeley public API record; the PDF README was not read.'
