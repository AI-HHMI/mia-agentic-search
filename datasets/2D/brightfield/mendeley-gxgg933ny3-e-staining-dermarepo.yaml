notes: 'Training signal is the paired unstained / chemically stained images for virtual staining (the schema has no
  image-to-image translation type, hence other). Mendeley API file listing: 261 .jpg files (3.06 GB), which include
  extra files such as "blended_test" images and some unstained files at other magnifications (e.g. 20X); the paper says
  87 slide images per folder, so n_items is 87 pairs. The Data in Brief specifications table also says the data are
  TIFF and PNG and that commercial use is restricted, while the Mendeley record (checked here) lists CC BY 4.0 and the
  files are .jpg; the Mendeley record was taken as authoritative for license and format. Pixel size not stated.
  download_url is null because Mendeley serves per-file links; the dataset page holds the full set. Related model paper:
  Scientific Reports 14:2335 (2024).'
