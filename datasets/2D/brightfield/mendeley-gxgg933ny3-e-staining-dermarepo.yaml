  notes: 'Listed all 261 files and the 4 folders with the Mendeley public API (sizes sum to 3,056,239,919
    bytes = the API size; listing.py has no Mendeley backend, so size_source stays page-stated). Sampled
    slide WC21-01356(B1-3), the smallest triple (2.38 MB, with curl: Python requests gets HTTP 403 from
    data.mendeley.com while curl gets a 302 to S3): all RGB uint8 JPEG, min 0 max 255, means 240.0 / 233.1
    / 235.2 (one sample). The paper says the images range from 0.22 to 1.7 gigapixels; this smallest one
    is 7.4 MP. voxel size not set: the unstained JPEG header says 27651 dpi (about 0.919 um/px), the stained
    one 72 dpi (default) and the virtual one none; paper (10x only) and Mendeley description state no
    pixel size, so the header value is unconfirmed.'
