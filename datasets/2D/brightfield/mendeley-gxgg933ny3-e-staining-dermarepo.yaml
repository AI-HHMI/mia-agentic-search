schema_version: '1.2'
id: mendeley-gxgg933ny3-e-staining-dermarepo
title: 'E-Staining DermaRepo: H&E whole slide image staining dataset'
short_name: Skin biopsy unstained/H&E pairs (virtual staining)
description: 87 skin-biopsy whole slide images (brightfield, 10x; 15 male and 7 female patients) imaged
  unstained and after chemical H&E staining, so each unstained image has a chemically stained counterpart,
  plus virtually H&E-stained images generated from the unstained ones with a dual contrastive GAN. Images
  are JPEGs of 0.22 to about 1.7 gigapixels organised in Unstained, C_Stained and V_Stained folders with
  identical file names; intended for training and benchmarking virtual staining (image-to-image translation).
