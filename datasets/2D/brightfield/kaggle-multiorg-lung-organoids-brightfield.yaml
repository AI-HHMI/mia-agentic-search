notes: 'Kaggle page is JS-rendered; the fetch returned only the title, so license,
  file listing and image format could not be read (formats set to other: not verified).
  Info from the NeurIPS 2024 paper (arXiv HTML): 411 images (356 train, 55 test),
  pixel 1.29 um, LifeCell Imager 5x, boxes only, COCO format. Paper says supplementary
  data "adheres to Creative Commons licensing terms" without naming a license. The
  two t1 test label sets are only through the Kaggle challenge; trained models on
  Zenodo 11258022. Kaggle download needs a login (registration).'
