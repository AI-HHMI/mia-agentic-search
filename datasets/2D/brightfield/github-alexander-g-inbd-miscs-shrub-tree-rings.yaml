notes: 'Three release archives, one per species: DO_v2.zip 64 images, EH_v2.zip 82, VM_v2.zip 67, each
  with JPG images, per-image annotation PNG and TIFF files and 4 train/test list files. organisms: Dryas
  octopetala = DO_v2.zip (DO/), Empetrum hermaphroditum = EH_v2.zip (EH/), Vaccinium myrtillus = VM_v2.zip
  (VM/). Ring counts (544, 949, 494) and train/test sizes (22/42, 24/58, 22/45) are from paper Table 1.
  README: dataset CC BY-NC-SA 4.0 (code MPL-2.0). Pixel size and scanner model not stated in paper or
  README. The README also links non-microscopy tree-ring datasets (UruDendro), not covered here. enricher:
  size from the zip listing (was null); annotations.format from the sampled TIFF/PNG and the repo loader.'
