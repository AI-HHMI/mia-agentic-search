notes: 'Three release archives (peek_archive): DO_v2.zip 64 images, EH_v2.zip 82, VM_v2.zip 67, each with JPG images (about 460, 725 and 997 MB uncompressed per archive) plus per-image annotation PNG and TIFF files and 4 text files. Per-species counts, ring counts (544, 949, 494), average image width (3700, 3260, 3979 px) and train/test sizes (22/42, 24/58, 22/45) are from paper Table 1. The README gives the dataset license as CC BY-NC-SA 4.0 (code is MPL-2.0). Pixel size and the slide scanner model are not stated in the paper or README. Only the DO/EH/VM v2 archives were examined; the README also links other tree-ring datasets (UruDendro, Pinus taeda) that are not microscopy and are not covered here.'
