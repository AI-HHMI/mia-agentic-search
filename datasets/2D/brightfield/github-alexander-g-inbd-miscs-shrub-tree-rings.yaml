title: MiSCS (Microscopic Shrub Cross Sections) tree-ring instance segmentation
short_name: Shrub cross-section tree rings (slide scanner)
description: 213 high-resolution slide-scanner images of stained microtome cross sections of three arctic-alpine
  shrub species (Dryas octopetala, Empetrum hermaphroditum, Vaccinium myrtillus), each with hand-annotated
  tree-ring boundaries for instance segmentation of annual rings (about 2,000 rings in total), with train/test
  lists per species. Released with the INBD paper (CVPR 2023).
