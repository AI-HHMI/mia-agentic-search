notes: 'Mendeley page (CC BY 4.0, 5,605 images, 7 classes) and the authors'' Kaggle copy (detailed card:
  image specs, folder structure, per-class counts, licence, size 75 MB) were read. The paper is not open
  access (Europe PMC lists no full text), so only its metadata was seen; the layout was first taken from
  the Kaggle card. The Kaggle card notes 21 redundant duplicate copies across DB/HYP folders and that
  images of the same cell can carry more than one finding. Pixel size and magnification are not stated.
  Class imbalance is strong (NEU 82%). enricher: Mendeley public API lists Dataset_NeuNN.zip (75,225,202
  B); its central directory confirms 5,605 JPEGs in 7 class folders, so annotations_verified true; download_url
  set to the direct zip (was the Kaggle page); size_bytes = uncompressed zip contents.'
