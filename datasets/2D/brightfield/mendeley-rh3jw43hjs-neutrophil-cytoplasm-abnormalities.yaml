notes: 'Mendeley page (CC BY 4.0, 5,605 images, 7 classes) and the authors'' Kaggle copy (detailed card: image specs, folder
  structure, per-class counts, licence, size 75 MB) were read. The paper is not open access (Europe PMC lists no full text),
  so only its metadata was seen; the Mendeley file list was empty, so annotations_verified is false and the layout comes
  from the Kaggle card. The Kaggle card notes 21 redundant duplicate copies across DB/HYP folders and that images of the
  same cell can carry more than one finding. Pixel size and magnification are not stated. Class imbalance is strong (NEU 82%).'
