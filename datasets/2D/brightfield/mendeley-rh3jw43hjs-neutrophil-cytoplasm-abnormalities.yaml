short_name: Neutrophil cytoplasm abnormalities (brightfield)
description: 5,605 cropped single-neutrophil images (360x363 px RGB JPEG) from May-Grunwald-Giemsa stained peripheral blood
  smears digitised with a CellaVision DM96, labelled by clinical pathologists into seven classes - normal neutrophils,
  hypogranulated, cryoglobulins, Dohle bodies, Howell-Jolly body-like inclusions, green-blue inclusions of death and
  phagocytosed bacteria. Class is given by the folder name; no predefined split.
