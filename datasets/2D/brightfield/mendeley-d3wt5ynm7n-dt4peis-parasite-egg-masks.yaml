notes: 'Zip (114.6 MB) listed with peek_archive: Train_Masks 11,000 and Test_Masks
  2,200 mask JPEGs named like the originals plus _mask, two COCO-style polygon JSONs
  (344 MB and 73 MB uncompressed) and two SVG figures. The raw images are NOT included:
  they come from Chula-ParasiteEgg-11 (IEEE DataPort 10.21227/vyh8-4h71), a different
  record in this catalog (zenodo-15866298-chula-parasiteegg-11-boxes, bounding boxes);
  this record adds only SAM-generated instance masks and polygons, so it is usable
  for training only together with those images. Masks are automatic (SAM), not hand-drawn.
  Licence shown on the Mendeley page as CC BY NC 3.0 (non-commercial). Paper (Applied
  Intelligence, 2025) is paywalled; only the Crossref record was read. Counts: the
  Chula record here says 10,000 training images while this zip has 11,000 train masks,
  not reconciled. Pixel size not stated.'
