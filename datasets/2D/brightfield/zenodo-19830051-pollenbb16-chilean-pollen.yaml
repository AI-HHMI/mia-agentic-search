description: PollenBB16, 16,198 brightfield RGB images (3088 x 2064 px, three focal planes per position)
  of pollen from 16 botanically identified Chilean plant species, with 36,383 expert-verified polygon
  instance masks in YOLO segmentation format, derived bounding-box labels and train/val/test split files.
  Includes images without pollen as negative examples.
