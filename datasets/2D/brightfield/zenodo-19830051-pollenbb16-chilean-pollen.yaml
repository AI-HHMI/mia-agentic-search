notes: 'Single zip pollenbb16.zip (43.9 GB, 48,608 members per peek_archive): 16,198 JPEG images, 32,399
  .txt label files (polygon labels plus derived box labels), 9 PNG, data.yaml, a script. Paper: 36,383
  instances, 16 classes, objective Plan Fluor 60x NA 0.85, camera pixel 2.4 um, Nikon Ci-L; the pixel
  size at the sample is not stated, so voxel size is null. Images come in focal-plane triplets (fp0-2)
  with identical polygons; splits are grouped by position (leakage-safe) in splits/ files. Zenodo lists
  the record type as "Journal" (v2). enricher: size_bytes from the complete listing (43,910,087,332 B);
  the class map file is data_split.yaml.'
