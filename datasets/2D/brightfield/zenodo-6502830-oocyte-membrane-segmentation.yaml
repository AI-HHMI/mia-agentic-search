notes: 'Single 1.2 GB SegmentationCortex.tar.gz. organisms: Mus musculus = SegmentationCortex/mouse/ (seen); the human
  and sea urchin folders lie beyond the first 150 MB of the stream and were not reached. Paper reports 8256 ground-truth
  images (4432 mouse, 3824 human) plus 235 sea urchin images (185 train, 50 test); the Zenodo subset may differ, so n_items
  is null. Paper says images were resized to 0.1613 um/pixel (original 0.1135, 0.1613 or 0.227 um/pixel); voxel size
  is that common resolution, not in file headers. Zona pellucida masks are mentioned in the paper but not seen. Related
  Zenodo record 10.5281/zenodo.6502852 (movies) not checked. enricher: masks verified as binary PNGs paired by name with
  input/.'
