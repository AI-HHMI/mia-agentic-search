  notes: 'The only file is a .tar.gz, which can''t be read by range. A scratch script streamed its first 150 MB (1,820
    members) and a 40 MB second pass, reading PNGs in memory (nothing written or executed). Masks (6 read): uint8 {0,
    255}, shapes 477-531 px per side, so sizes vary. Input movo_06_t133.png: uint8 516x490, range 0-255, 201 values (one
    sample). sample is null: TensorSwitch can''t pull members out of a tar.gz; only the whole 1.2 GB archive downloads.
