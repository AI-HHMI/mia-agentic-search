notes: 'Single 1.2 GB SegmentationCortex.tar.gz. Archive listing was read only from the first ~30 MB (partial, 514 entries): mouse/exp2_test/mask/*.png seen; image folders, species folders and total image count not fully listed, so n_items is null. Paper reports 8256 ground-truth images (4432 mouse, 3824 human) plus 235 sea urchin images (185 train, 50 test), but the Zenodo subset may differ. Paper says images were resized to 0.1613 um/pixel (original 0.1135, 0.1613 or 0.227 um/pixel); voxel size is therefore the paper''s common resolution, not verified in file headers. Zona pellucida masks are mentioned in the paper but not verified in the archive. Pixel format (PNG) inferred from the partial listing. Related Zenodo record 10.5281/zenodo.6502852 (movies) not checked.'
