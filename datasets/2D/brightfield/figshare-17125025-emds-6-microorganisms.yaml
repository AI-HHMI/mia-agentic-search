notes: 'Single archive EMDS-6.rar (206 MB); peek_archive cannot list RAR files, so contents were not verified from a listing. PNG format is inferred from file names on the Dataset Ninja mirror page, not from the original archive. The paper says 1680 images in total = 840 originals + 840 GT masks; n_items counts the 840 originals. Figshare metadata gives CC BY 4.0, while the paper says "freely published for non-commercial purpose"; the machine-readable license is recorded and the discrepancy is noted. GT masks were produced by a Northeastern University team (paper Methods); one object class region per image. Modality is described only as an optical microscope, so brightfield is the closest enum value. Pixel size, microscope and magnification are not stated on the Figshare page or in the paper. Species/organism are protist classes, not given as NCBI names, so organism is left empty. Sources checked: Figshare API record, paper full text, Dataset Ninja mirror.'
