      (all 840 stems match). Same height x width as the raw image (sample). Masks are 0/255 with ~3% intermediate
      grey values at edges (157 distinct values in the sample), so threshold before use.'
  notes: 'Listing: the archive is RAR5, which listing.py/peek_archive cannot read, so the enricher parsed
    its headers by range requests (quick-open record plus a header walk over the gaps it skips): 1681
    members, 219,898,391 B unpacked. Figshare offers this single file (206,388,415 B), so size is confirmed.
    Sample: stored members EMDS5-g05-05.png (9,592 B) and EMDS5-g05-05-GTM.png (722 B) read by byte range;
    value ranges are from that one sample. Class folders 01-21 correspond to the 21 genera in paper Table
    1, but the number-to-genus mapping is not stated in the sources read (README.md inside the RAR is
    compressed and could not be read), so organism stays empty. Voxel size not found; checked: PNG headers
    (no pHYs chunk), Figshare API record, paper full text (no microscope, magnification or pixel size).
    No direct per-file links: TensorSwitch needs the whole RAR (usable, 206 MB, range requests); RAR members
    are not addressable as <url>::<member>, so sample is null.'
