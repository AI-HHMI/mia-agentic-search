description: Light-microscopy images of 21 classes of environmental microorganisms (for example Paramecium,
  Euglena, Rotifera, Stentor), 40 original images per class (840 images), each paired with a binary ground-truth
  mask (white foreground, black background). Published for image denoising, segmentation, feature extraction,
  classification and detection method evaluation.
