notes: 'Five files: images.zip (609 PNG, 3.0 GB), masks.zip (609 PNG), blended.zip and ''Images with outline.zip''
  (overlays), BASE_20240410.xlsx (measurements). Pixel size 0.34 um/px for all studies except the CTEPH
  model, which also has 0.68 um/px (paper Data Records), so voxel_size_nm 340 is the dominant value. Magnification
  x5-x40 per the paper; microscope Nikon Eclipse Ni-U. The paper says the baseline training code is in
  a GitLab repository (gitlab.com/digiratory/biomedimaging/pcv-dataset); no train/val split is stated
  in the data files listed. size_bytes is the sum of the five files.'
