notes: 'Five files: images.zip (609 PNG, 3.0 GB), masks.zip (609 PNG), blended.zip and ''Images with outline.zip''
  (overlays), BASE_20240410.xlsx (measurements). Pixel size (paper Data Records): 0.34 um/px for all studies except
  the CTEPH model, which also has 0.68 um/px; enricher: voxel_size_nm set to null (was 340) because the sub-sets
  differ and neither the file names nor BASE_20240410.xlsx say which images are 0.68 um/px. Magnification x5-x40;
  microscope Nikon Eclipse Ni-U. The paper says the baseline code is at gitlab.com/digiratory/biomedimaging/pcv-dataset;
  no train/val split in the data files. size_bytes is the sum of the five files.'
