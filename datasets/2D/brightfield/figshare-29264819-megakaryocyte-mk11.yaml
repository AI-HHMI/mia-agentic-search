notes: 'Zip listed with peek_archive: 42,405 PNGs (MK-11/<class>/ holds the 7,204 crops; MK-11_5folds/ holds
  per-fold copies of the same images, so the file count is not the image count), 2 metadata.csv and
  create_5folds.py. Labels are one class per cropped cell (image-level classification), not boxes or masks;
  the 11 class folders are CA-MK, G-MK, HL-MK, MK-blast, MMK, MN-MK, N-MK, NN-MK, PP-MK, Pro-MK, S-MK. Pixel
  size 0.253 um from the paper Methods (scan resolution of the source slides; crops were not resampled).
  Paper states the folds are patient-level. Images are crops, so sizes vary. Annotation tool: LabelImg.'
