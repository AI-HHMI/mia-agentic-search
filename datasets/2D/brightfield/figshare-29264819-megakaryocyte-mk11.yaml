title: An open bone marrow megakaryocyte dataset for automated morphologic studies (MK-11)
short_name: Bone marrow megakaryocyte subtypes (brightfield)
description: 7,204 single-cell PNG crops of megakaryocytes from Wright-Giemsa-stained bone marrow smears of
  70 patients (MDS, ITP, acute megakaryoblastic leukemia, healthy donors), scanned at 40x (0.253 um/pixel)
  and labelled by two hematopathologists with consensus review into 11 megakaryocyte subtypes. Ships the
  class-folder collection plus patient-level five-fold cross-validation splits (train/val/test) and a split script.
