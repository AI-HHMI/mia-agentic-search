  notes: 'Listing: the HTTP index stopped after 30 directories (incomplete, rounded sizes), so the exact size comes
    from the 30 FileList/Study_N.json lists (109,287,061,290 B, 56,984 files; per-modality counts match the paper)
    plus HEAD of the 60 list files (7,147,798 B). Probed Study_1 image_0_BF_z0: OME-TIFF BigTIFF, YX 2048x2048 uint16
    deflate, OME pixel size 103.17 nm (z 1000). The Nucleus header probe timed out; its compression is not recorded.
    Sampled the Study_1 BF/Nucleus pair: BF min 382 max 3640, Nucleus min 49 max 1600, both below 4096 (12-bit detector
    range, unclipped), so normalization ''none'' is inferred. Values are from one pair only; image sizes and pixel
    sizes vary per study (paper) and only Study_1 was inspected, so voxel_size_nm stays null.'
