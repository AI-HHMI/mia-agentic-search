notes: 'Training signal is image-to-image: label-free transmitted light inputs paired with fluorescence targets
  (no masks), so annotations.types and ml.tasks are "other" (in silico labeling / fluorescence prediction); the
  paper also lists segmentation and cell profiling as downstream uses. Counts from the paper (56,984 images; 52,382
  transmitted light: 41,213 BF, 7,670 PC, 3,499 DIC; 4,602 fluorescence: 2,533 nucleus, 1,819 mitochondria, 223
  tubulin, 27 actin) and BioStudies API (56,984 files). Fluorescence images may contain a mixture of labeled and
  unlabeled cells. Organisms and pixel sizes vary per study and were not aggregated, so organism is empty and voxel_size_nm
  is null. Fluorescence: best-focus planes; transmitted: z-planes.

  enricher: size_bytes = exact sum of the 30 FileList/Study_N.json lists + list files (was null).

  enricher: annotations verified (pairs seen in file lists and sampled).'
