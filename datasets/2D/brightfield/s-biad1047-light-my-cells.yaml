notes: 'Training signal is image-to-image: label-free transmitted light inputs paired with fluorescence targets (no masks), so
  annotations.types and ml.tasks are "other" (in silico labeling / fluorescence prediction); the paper also lists segmentation
  and cell profiling as downstream uses. Counts from the paper (56,984 images; 52,382 transmitted light: 41,213 BF, 7,670 PC,
  3,499 DIC; 4,602 fluorescence: 2,533 nucleus, 1,819 mitochondria, 223 tubulin, 27 actin) and BioStudies API (56,984 files).
  Fluorescence images may contain a mixture of labeled and unlabeled cells. Organisms, pixel sizes and total byte size vary per
  study (see paper Supplementary Notes) and were not aggregated, so organism is empty and voxel_size_nm and size_bytes are null.
  Fluorescence images are best-focus planes of limited z-stacks; transmitted images may be z-stacks. Only 4 of 30 authors recorded.
  File listing not browsed in full (56,984 files).'
