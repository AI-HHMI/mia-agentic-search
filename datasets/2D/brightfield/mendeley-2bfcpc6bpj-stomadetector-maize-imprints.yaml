      \           image_type per image (default / blur / imperfect)\n    data/splits/{train,val,test}.csv + .json\
      \   COCO boxes, 150/50/50 images\n  models.zip                        307.7 MB  trained Faster R-CNN\n  predictions.zip\
      \                   37.9 KB\n  inference.zip                     2.8 KB   ground-truth counts of the inference\
      \ set\n  NIL.zip                           4.96 GB  images of NIL lines (counts only)\n  ZmAbh_mutants.zip\
      \                 1.67 GB  images of ZmAbh mutants (counts only)"
