notes: 'Mendeley Data lists six zips: data.zip (1.50 GB: 250 PNG images, 254 CSV files, train/val/test
  split JSONs; used here), models.zip, predictions.zip, inference.zip, and two raw image sets NIL.zip
  (4.96 GB) and ZmAbh_mutants.zip (1.67 GB) not included in size_bytes or n_items. Bounding-box counts
  (>10,000 stomata) and the Olympus BX61 / 10x / 2448x1920 imaging details are from the Mendeley description.
  No paper is linked on the dataset page and a Europe PMC/Crossref title search found none; the description
