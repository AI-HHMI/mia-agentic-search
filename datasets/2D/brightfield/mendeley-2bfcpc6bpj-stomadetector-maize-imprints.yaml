notes: 'Mendeley Data lists six zips: data.zip (1.50 GB: 250 PNG images, per-image CSVs, COCO split JSONs), models.zip,
  predictions.zip, inference.zip, and two image sets NIL.zip (4.96 GB) and ZmAbh_mutants.zip (1.67 GB) that have
  stomatal counts only, no boxes (paper Methods). Imaging details (Olympus BX61, 10x, 2448x1920) from the Mendeley
  description and the paper; manual bounding boxes per the paper Methods. Pixel size not stated. License MIT (Mendeley
  API data_licence). enricher: paper found (Barl et al. 2025, Sci Rep) via the GitHub README; size_bytes now all
  six files from the Mendeley API (was 4 files); annotation format read from the zip.'
technical:
