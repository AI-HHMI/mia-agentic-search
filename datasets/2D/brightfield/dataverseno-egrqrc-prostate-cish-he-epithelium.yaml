description: High-resolution brightfield images of prostate tissue microarray cores from 70 patients (30 prostate cancer,
  40 benign prostatic hyperplasia) stained by chromogenic in situ hybridization for eight miRNAs, U6 and scrambled controls,
  and H&E, with one single-channel epithelium segmentation mask per image.
