notes: '12 files, about 308 GB: one zip per stain (HE, 550A, 1246, 3614, 4326, 4632, 4742, 4754, 7850, U6, Scr; 19-58 GB each),
  SPSS_database.zip and a readme. Only HE.zip was listed (zip central directory read by range requests): 399 jpg + 399 _mask.png
  pairs (Cancer_Prostatectomy 200, Normal_TURP_BPH 119, Normal_Prostatectomy 80). n_items counts H&E pairs only; other stains
  assumed to have the same layout per the readme. Readme: masks based on manual annotation by an expert pathologist with DeepLabV3
  models used in the pipeline, hence source mixed. Pixel size not stated. No paper cited. Sibling dataset by the same authors
  for colorectal tissue is a separate record.'
