notes: 'Only 8 images (each a large nerve ROI with many fibres), slightly under the ~10-image guideline.
  Pixel size 0.1 µm from the BIDS sidecar (63x/1.4 NA oil objective per sidecar; paper Methods: Axiovert
  200M, 63x/1.4 oil, resampled to 0.1 µm/px for training). Asset listing from the DANDI API (48 files:
  8 images + 24 label masks + BIDS metadata). Dataset is a subset of the data in the cited paper. Part
  of the ASTIH collection (other ASTIH datasets are catalogued separately). enricher: channels 1 from
  PNG header (greyscale, was null).'
