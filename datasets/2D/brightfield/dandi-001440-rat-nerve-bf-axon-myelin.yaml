title: Bright-Field Images of Rat Nerves at Different Regeneration Stages with Axon and Myelin Segmentations
short_name: Rat peripheral nerve axon/myelin (bright-field)
description: Eight bright-field light-microscopy images of osmium tetroxide-stained rat peripheral nerve cross-sections
  at different axonal regeneration stages (cropped ROIs), with manual axon, myelin and axon+myelin segmentation masks.
  This is the training set of the AxonDeepSeg bright-field model and one of the ASTIH axon/myelin collection datasets.
