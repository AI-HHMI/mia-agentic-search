notes: 'The zip lists 54,275 JPEGs: dataset/train (1,345 img, 36,906 mask), val (197 img, 5,206 mask) and test (366 img, 10,085 mask). The paper (Methods read in full) says masks were first produced automatically with OpenCV pre-processing, then visually inspected and adjusted where needed, hence source mixed; it counts 52,657 worm masks (36,906 / 5,496 / 10,255), slightly more than the 52,197 mask files in val/test, so a few masks may be missing from the zip. Images show whole Petri dishes with macro optics (a DIY microscope), pixel size not stated, so voxel size is null. Images were taken as time sequences (300 frames per 5-minute acquisition from 3 dishes), so neighbouring images are highly correlated.'
