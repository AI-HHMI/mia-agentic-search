description: 1,908 JPEG images (3280 x 2464 px, 1 Hz) of C. elegans on 3.5 cm Petri dishes recorded with
  a Raspberry Pi based low-cost DIY microscope (backlit, macro optics), split into 1,345 train, 366 test
  and 197 validation images, each with per-worm mask images used to train a Mask R-CNN detector.
