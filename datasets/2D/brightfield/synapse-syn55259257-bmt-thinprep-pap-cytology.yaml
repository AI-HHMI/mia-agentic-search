title: 'Brown Multicellular ThinPrep (BMT) database: expert-validated ThinPrep Pap cervical cytology images'
short_name: ThinPrep Pap cytology NILM/LSIL/HSIL images
description: 600 multicellular ThinPrep Pap smear microscope images (1920 x 1080 JPEG, 40x), 200 each of NILM, LSIL and HSIL, taken
  from 180 anonymised educational patient slides and accepted only with 100 % consensus of three board-certified pathologists, plus a
  folder of annotated example images with notes on the diagnostic features. Built for training liquid-based Pap classifiers.
