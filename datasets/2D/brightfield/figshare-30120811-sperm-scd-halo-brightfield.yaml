notes: 'Files: Dataset.rar (1.18 GB, a RAR that cannot be listed remotely), Metadata.csv (1,776 rows read:
  400 raw, 650 binary, 726 halo patches), README.txt. n_items follows Metadata.csv; the paper says 435
  raw images, 650 binary patches (320 sperm / 330 non-sperm) and 403 halo-classified sperm cells (103
  / 107 / 92 / 101) plus non-sperm patches, so the raw count differs (400 vs 435). Image format png from
  the paper and README (file names in the CSV are upper-case .PNG); archive contents were not opened.
  Pixel size and microscope model not stated in the paper text read or README. Labels are class folders,
  not masks or boxes (the paper figures mark cells with circles). Five embryologists labelled independently;
  majority vote. enricher: Dataset.rar is RAR5 with stored (uncompressed) PNG members; first member read
  in place (88x71 RGBA patch).'
