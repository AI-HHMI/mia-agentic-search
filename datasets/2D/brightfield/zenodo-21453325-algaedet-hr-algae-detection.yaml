description: 1,664 high-resolution (3072x2048) bright-field microscopy JPEG images of cultured marine
  algae from coastal Fujian, China, with 30,552 bounding boxes in 13 algae categories. Annotations come
  in X-AnyLabeling JSON, COCO, YOLO and Pascal VOC formats with recommended train/val/test splits (1,330/167/167)
  and conversion and baseline scripts.
