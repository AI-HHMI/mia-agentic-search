notes: 'Single 6.3 MB cellSegmentation.zip listed with tools/peek_archive.py: 2,808 .tif files (24.8 MB
  uncompressed) under trainingdataset/, i.e. about 1,404 image/mask pairs; counts derived from the file
  count and the record text ("~1400 raw images"). Record text gives image size 60x60 and pixel size 325
  nm. The record says the images are 16-bit RGB tiff plus .mat, while the zip lists only .tif. The paper
  (bioRxiv preprint; full text read) describes the DetecDiv annotation GUI (painting images, 15-30 s per
  image) and a 200/50 train/test split for the classification task, but no split is given for this segmentation
  set. Related trained network: zenodo 5553851. enricher: masks are one-hot RGB, not pixel values 1-3;
  images are uint8 60x59, not 16-bit 60x60 as the record text says; download_url set to the direct zip
  (zenodo.org/records/... form, range requests work).'
