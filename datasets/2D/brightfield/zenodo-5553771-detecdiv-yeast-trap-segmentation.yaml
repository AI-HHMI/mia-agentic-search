    alignment_notes: 'Pairing rule: same file name in images/ and labels/ (all 1,404 names match). Each
      mask pixel is 255 in exactly one of the 3 samples (checked in all 1,404 masks). Sample 0 holds 89%
      of the pixels, so it is background; samples 1 and 2 are presumably mother and other in the Zenodo
      text order, which no source states.'
  notes: 'listing.py on the zip: 2,808 TIFF members (1,404 images + 1,404 labels), every member exact,
    6,328,601 B = size_bytes. probe.py on 2 images + 2 labels: single-page plain RGB TIFF (photometric
    2), 60x59x3 uint8, packbits. The whole 6.3 MB zip was read once to check all files: every image and
    mask is 60x59x3; image values [0, 255] (every 50th image); masks only 0/255, one-hot. sample.py on
    Pos0_1_146_frame_0271: raw [0, 255], mean 131, 251 unique values, samples identical (grey as RGB),
    hint full range used (from one sample; normalization not documented, so unknown); label {0: 7080,
    255: 3540}. The Zenodo text says 16-bit RGB 60x60 plus .mat files; the zip has only 8-bit 60x59 TIFFs.
    Direct download: the zip and its members pass probe.py --download-check (range requests). Voxel size
    325 nm x/y from the Zenodo record text (no TIFF calibration); 2D, so no z.'
