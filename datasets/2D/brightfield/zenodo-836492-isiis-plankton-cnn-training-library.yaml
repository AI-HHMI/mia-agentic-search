  notes: 'Listing: tools/listing.py on the Zenodo record: {"source": "zenodo", "n_files": 9, "total_bytes": 299635309,
    "complete": true, "exact_sizes": true, "size_source": "file-listing"}; zips are code only. tools/listing.py
    and probe.py cannot open tar.gz, so I streamed the head of each tar.gz with a small requests+tarfile script
    and stopped early (~230 KB compressed in total, logged as inspected): training library = 108 class folders then
    <class>_NNNN.jpg files; FT images = <group>/<group>_NNNNN.jpg; validated = set1..set5/<group>/. Decoded 6 JPEGs
    with imagecodecs (values from these only): uint8 2D greyscale, 40x64 to 115x136, min 21-51, max 255, bright
    background (mean 208-241). Image counts per set are from the Zenodo description, not recounted. Voxel size not
    found; checked: JPEG headers (JFIF density 1:1, no calibration), Zenodo record and API, class_to_group.csv and
    CSV headers, Segmentation.zip scripts (run_seg_ff.sh, avi2tiff.sh), plankton_template resize script, paper (not
    open access: no abstract or full text via Europe PMC/Crossref). Downloads: every file is direct on Zenodo (usable,
    range requests); no single archive for the whole dataset, so data.download_url stays null.'
