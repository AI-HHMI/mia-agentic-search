notes: 'Record file list (Zenodo API): training library 122.9 MB, test images 70.2 MB, validated confusion-matrix images 82.8 MB (all tar.gz), plus CSVs, weights and segmentation code; total 299.6 MB. n_items is the sum of the counts stated on the record (42,564 + 42,548 + 75,000), not recounted. The training tar.gz was streamed (range request) and shows class folders of .jpg files (e.g. zoea/zoea_0001.jpg); the test and validated archives were not opened. The paper is not open access (empty abstract via Europe PMC/Crossref), so pixel size, instrument details, who labelled the images and the license-independent annotation procedure were not confirmed; ISIIS comes only from a Zenodo keyword. Modality brightfield is an assumption (closest enum for in-situ shadowgraph-type plankton imaging). Download is several tar.gz files, so no single download_url.'
