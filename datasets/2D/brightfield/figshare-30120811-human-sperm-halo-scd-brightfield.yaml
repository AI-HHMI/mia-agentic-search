title: Expert-annotated optical microscopy images of human sperm for detection and DNA fragmentation assessment
short_name: Human sperm halo classification (brightfield)
description: Bright-field images (1000x) of human sperm prepared with the sperm chromatin dispersion (SCD) test. Three parts, raw
  full-field images, 650 cropped patches labelled sperm / non-sperm (320 / 330), and 403 cropped sperm cells labelled by
  DNA-fragmentation halo size (large 103, medium 107, small 92, without halo 101) plus a non-sperm class. Labels come from majority
  vote of five embryologists.
