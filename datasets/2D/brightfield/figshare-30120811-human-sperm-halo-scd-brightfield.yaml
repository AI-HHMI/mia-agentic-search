notes: 'Data is one Dataset.rar (1.18 GB; RAR cannot be listed remotely) plus Metadata.csv and README.txt. n_items = 1,776 rows in
  Metadata.csv (400 raw, 650 binary patches, 826 halo patches incl. 323 non-sperm). The paper says 435 raw images but the metadata lists 400.
  Image files are PNG per the README and Metadata.csv. Pixel size, camera and exact stain are not stated in the paper text or README
  (only 1000x bright-field magnification); channel count not stated. Detection boxes are not provided;
  the raw images are unlabelled. License CC BY 4.0 on the figshare record and README; the paper text is CC BY-NC-ND.'
