notes: 'Labels are experimental-condition metadata (species/strain, drug, concentration, exposure time)
  encoded in folder and file names, not per-cell annotations; the Zenodo page says each image is labeled
  with species, drug type, concentration and exposure duration. Zip lists 945 files (tif, jpg and bmp;
  bmp is not in the schema format list). No paper, pixel size or image counts are stated on the Zenodo
  page; no related publication is listed. Species names are not spelled out on the page beyond the keyword
  Candida, so organism is the genus only. Checked Zenodo page and zip listing. enricher: n_items 945 ->
  943 images (466 tif, 336 jpg, 141 bmp; the other 2 members are result.csv tracing tables in PU 332/MCF);
  channels stay null (tif RGB, jpg greyscale); size from the exact Zenodo listing. One OME-TIFF header
  gives 465.08 nm/px, not stated in any doc, so voxel size stays null.'
