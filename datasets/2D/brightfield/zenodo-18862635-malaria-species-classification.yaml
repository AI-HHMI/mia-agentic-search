notes: 'The Zenodo record has only a title, licence and one 4.7 GB zip (db-malaria-all.zip), with no description
  and no related identifiers; a Europe PMC title search did not find the paper (closest hit was a different
  title, 0.70 similarity), so authors, stain, microscope, magnification, pixel size, annotation procedure
  and patch-extraction method are unknown. Zip listing (peek_archive) gives 92 .jpg full images in db-malaria/<species>/
  and 828 .png patches in db-malaria-patches/<species>/; patches appear to be crops of the full images
  (not verified). Image count counts both folders. Labels are image-level only (no boxes or masks). enricher:
  two images opened (RGB uint8, no pixel size). organisms: Plasmodium falciparum = */Falciparum/, P. vivax
  = */Vivax/, P. malariae = */Malariae/, P. ovale = */Ovale/.'
