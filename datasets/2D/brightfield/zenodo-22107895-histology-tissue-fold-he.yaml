notes: 'Read the Zenodo page, API record, README.md (CC BY 4.0; Nikon Eclipse Ci-L Plus, Tucsen TrueChrome 4K Pro,
  10x, 3840 x 2160 JPG; folds annotated manually in QuPath) and the paper full text (Europe PMC, Bioengineering
  2026; 2,127 images from 302 teaching slides at the Firat University veterinary faculty). peek_archive: images.zip
  holds 2,127 JPG by tissue and class (counts match README), masks.zip 1,228 PNG masks. Pixel size and animal species
  are not stated in the README or the paragraphs of the paper read, so voxel size is null and organism is empty.
  Slide-level mapping (slide_image_mapping.xlsx) is provided so splits can be made by slide; no fixed train/test
  split is shipped. The README says to cite the paper after it becomes available. enricher: formats jpeg+png (masks
  are PNG; was jpeg only).'
