notes: 'Dataverse record with three zips (train 910.8 MB, validation 258.4 MB, test 370.8 MB), a README and a migration stub; size_bytes is the three zips. The
  train zip listing came from peek_archive (2,079 PNG files), validation 606 and test 858; n_items counts PNG files (inputs plus masks), not images. The README says masks were made
  manually by an expert with the MembraneTools module of Aparecium; the dataset acquisition is described in a bioRxiv preprint, whose published version (Open Biology,
  Europe PMC full text) was read: it concerns cell segmentation and does not describe this artifact dataset in detail, so pixel size,
  magnification and image dimensions are not stated in the sources checked. Organism is inferred from the cell line (CHO-K1, Chinese hamster). The old datadoi.ee/handle/33/433 link redirects to the
  new Dataverse site. Checked: Dataverse API record, README, zip listings, paper full text.'
