id: cil-54816-metaphase-chromosome-gbanded
title: An open dataset of annotated G-banded metaphase cell images for chromosome identification
short_name: Metaphase chromosome detection (G-banded)
description: 'G-banded metaphase images from 1,598 fetal amniotic-fluid samples: 5,000 images with bounding
  boxes for the 24 chromosome classes (229,852 chromosomes in total) plus 2,000 images with single-chromosome
  (class-agnostic) bounding boxes, split into simple and difficult images, with CSVs flagging normal and
  abnormal cases.'
