notes: 'Values from the Scientific Data paper and the CIL page. Modality (brightfield, G-banded, trypsin/Wright
  stain) inferred; no pixel size stated. 5,000 images: 3,827 simple, 1,173 difficult. enricher: CIL page
  reachable; license CC BY 3.0 (CIL page ''Attribution Only'') (was unknown); download_url = direct zip
  (was null); size from zip listing (was null); annotation types corrected: XMLs hold boxes only, no masks
  (semantic-segmentation removed; the paper''s xml2coco_seg.py is not in the zip); channels 1 (grey stored
  as RGB in sample). 2,000 single-chromosome images: 1,835 share file names with the 5,000. Zip also holds
  two YOLOv4 .pt weights (513 MB).'
