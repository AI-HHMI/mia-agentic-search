notes: 'Zip listing: Training_data has 20 source + 20 target files, Quality_control_data has 4 + 4, plus the trained model folder; n_items = 24 pairs. The record text says the 20 originals were augmented to 160 paired images; the augmented images were not seen in the listing. Size is the whole zip including the model. Record states 16-bit brightfield images, 8-bit masks, 1024x1022 px, pixel size 650 nm, F1 0.921. Cancer cell type and organism are not named on the record, so organism is empty; the bioRxiv paper full text returned 429 and was not read.'
