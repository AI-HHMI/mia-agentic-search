notes: 'Files need an IEEE DataPort login; the authors also say they can provide the data free of charge. Contents could not
  be listed, so the image file format (only the four annotation-export zips are named) is unverified, hence formats is other.
  ProWay XSZPW208T microscope at 1000x; 700 fields captured, 200 discarded (noise, blur, duplicates, dense clusters). Pixel
  size not stated. Boxes drawn by experts in Roboflow as smallest enclosing rectangles, so they overlap. The paper is not
  open access and was not read; details come from the landing page.'
