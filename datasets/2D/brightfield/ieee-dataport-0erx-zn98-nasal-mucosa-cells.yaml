title: Nasal Mucosa Cell Dataset (NMCD) - bounding-box cell detection in May-Grunwald-Giemsa nasal cytology
short_name: Nasal cytology cell detection (brightfield)
description: 500 brightfield fields (1024x768 px) of May-Grunwald-Giemsa-stained nasal mucosa smears from 14 slides, with 10,847
  manually drawn bounding boxes in 10 cell classes (epithelial, neutrophil, artifact, muciparous, eosinophil, metaplastic, ciliated,
  lymphocyte, red blood cell, mast cell). Provided with a stratified 400/50/50 train/validation/test split in COCO, YOLOv8,
  TensorFlow and Pascal VOC formats.
