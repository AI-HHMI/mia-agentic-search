description: 2,466 high-resolution (2736x1834) bone marrow smear images from 487 patients with several hematological disorders,
  with expert instance-segmentation annotations for 49 cell types (erythroid, myeloid, lymphoid, monocyte, megakaryocyte and
  plasma-cell lineages) in COCO format and an official five-fold cross-validation split.
