notes: 'The paper states 7245 plasmodium objects in 1182 images. Zip listed with peek_archive (jpg + one XML per
  image, folder named after the set). Counts of objects and images in the description come from the project page
  and the 2016 paper (Annotation section). Pixel size and phone model not stated on the project page, in the zip
  listing or in the paper; no train/test split is shipped (the paper used a random 50/50 patch split). Licence CC
  BY 4.0 from the project page footer; a third-party mirror (Dataset Ninja) says CC0 1.0 for the combined set, the
  source page wins. Sibling sets on the same page: plasmodium-images (own PR), and the other two phone-camera sets.
  enricher: XML sizes in the zip listing show boxes in 948 of 1182 XMLs (234 empty, 239 B; checked on 0900).'
