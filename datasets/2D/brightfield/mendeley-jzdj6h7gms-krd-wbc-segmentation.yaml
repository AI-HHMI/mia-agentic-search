notes: 'Mendeley public API file list: 1,201 files (600 image<N>.jpg, 600 mask<N>.jpg, class labels.csv; 24.0 MB total); class
  labels.csv header read (Image, category per image). No paper found for this dataset (web search, not cited). Microscope,
  magnification, stain, pixel size, species and what the mask grey levels encode (whole cell, nucleus, cytoplasm) are not
  stated on the record, so they are left unknown; contributor notes credit Dr. Fattah Alizadeh with generating the ground-truth
  masks and Dr. Nawsherwan Sadiq Mohammad with labelling the cells. Whole dataset is also downloadable as a single archive
  from the Mendeley page (no direct URL recorded). enricher: class counts from class labels.csv: Neutrophil 300, Lymphocyte
  230, Monocyte 39, Basophil 20, Eosinophil 11. Organism not stated on the record, left empty.'
