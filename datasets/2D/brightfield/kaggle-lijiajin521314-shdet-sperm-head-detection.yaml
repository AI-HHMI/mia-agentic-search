notes: 'Kaggle API record (CC BY 4.0, 397 images of 1920x1200 px, 298 train / 99 test, 150 MB) and the
  MTCA-Net paper page (abstract only, Adv. Intell. Syst. 2026, three released datasets of 3,563 images
  in total) were read. The paper is not open access and the harvester could not see the file list. Pixel
  size and species are not stated. Companion of the segmentation sets SHSeg and SHSegHR (separate records,
  same Kaggle owner); this one holds the detection images with boxes and is a different image set from
  them. enricher: the Kaggle API download (anonymous, redirects to a signed GCS zip) lists 397 JPEG +
  397 YOLO txt labels in train/val; formats other -> jpeg, annotations_verified true, download_url set
  to the API zip.'
