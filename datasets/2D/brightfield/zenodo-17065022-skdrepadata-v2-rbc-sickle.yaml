notes: 'Zip listing (peek_archive): 33,832 .jpg in three folders: normale_cell 11,106, sickle_cell 11,473, other_cell 11,253
  (the record text says 33,333 images with 11,106 / 11,473 / 11,253 per class; the listing sums to 33,832). A second text
  field of the record says 3,925 source smear images, denoised with Noise2Void, resized to 224x224 and split 70/20/10; the
  zip has no split folders, so the split is described but not provided as folders. Labels by expert hematopathologists. Pixel
  size, microscope and magnification are not stated on the Zenodo page, and no paper is linked from the record (a web search
  found only a LinkedIn post mentioning a MIRASOL/MICCAI workshop paper). Images are cell crops, not full fields of view.
  Sources checked: Zenodo record and API, zip listing.'
