description: 1,364 brightfield images (about 80,000 cells) of Giemsa-stained human blood smears infected
  with Plasmodium vivax, from three sources (Brazil, Southeast Asia and an ex vivo cultured time course),
  with a bounding box and a class label for every cell (uninfected red blood cell, leukocyte, gametocyte,
  ring, trophozoite, schizont, difficult).
