notes: 'Six zips (bacilli 1.06 GB, streptococci 596 MB, monococci 141 MB, diplococci 138 MB, backgrounds 298 MB, full_scenes
  1.9 GB; 4.1 GB total, version 1.1 of 2026-10-01). Crops are PNG/JPG; full scenes are 84 BMP images (not in the format enum,
  hence omitted from formats) with PNG masks and bboxes.csv. The description says ''micrococci'' while the file is monococci.zip.
  Organism is left empty because classes are morphotypes, not species. Magnification, stains and the annotation procedure
  are not stated, there is no related publication on the record, and pixel size is unknown. Modality brightfield is inferred
  from Levenhuk MED (transmitted-light biological) microscopes. Zenodo description lists 100,000 crops (20,000 per class).
  enricher: all six zips listed (20,000 images + 20,000 masks per class; 84 scenes with _mask and _mask_cls PNGs); exact size
  (was 4.13e9 rounded); download_url = record page (six zips).'
