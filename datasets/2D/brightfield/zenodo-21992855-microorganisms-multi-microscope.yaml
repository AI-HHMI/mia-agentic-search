notes: Six zips (bacilli 1.06 GB, streptococci 596 MB, monococci 141 MB, diplococci
  138 MB, backgrounds 298 MB, full_scenes 1.9 GB; 4.1 GB total, version 1.1 of 2026-10-01).
  Crops are PNG/JPG; full scenes are 84 BMP images (not in the format enum, hence
  omitted from formats) with PNG masks and bboxes.csv. The description says 'micrococci'
  while the file is monococci.zip. Organism is left empty because classes are morphotypes,
  not species. Magnification, stains and the annotation procedure are not stated,
  there is no related publication on the record, and pixel size is unknown. Modality
  brightfield is inferred from Levenhuk MED (transmitted-light biological) microscopes.
  Zenodo description lists 100,000 crops (20,000 per class). Only monococci.zip and
  full_scenes.zip were listed with peek_archive; monococci.zip lists 40,001 files
  (images plus bboxes.csv), consistent with 20,000 image/mask pairs (the first 40
  paths shown were not enough to see the masks folder).
