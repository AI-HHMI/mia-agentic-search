notes: 'Kaggle API record: licenseName "CC BY-NC-SA 4.0", totalBytes 21,479,941,861, last updated 2021-05-02.
  Counts from the dataset card (298 train, 200 val, 277 test) and the paper abstract (775 images total:
  690 at 2040x1536 and 85 at 1920x2560, two microscope/camera setups). Images are raw BMP, which is not
  in the format enum, hence "other". Only the pre-identified cells of interest are annotated, so coverage
  is partial, and test ground truth is not released. The paper (Medical Image Analysis 2023) is not open
  access, so only the abstract was read; no pixel size is stated there or on the card. enricher: access
  open (was registration), download_url = anonymous Kaggle archive API URL (was null); masks seen in the
  zip, annotations_verified true; mask values 0/20/40.'
