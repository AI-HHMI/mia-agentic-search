title: 'SegPC-2021: Segmentation of Multiple Myeloma Plasma Cells in Microscopic Images'
short_name: Myeloma plasma cell segmentation (brightfield)
description: 'The ISBI 2021 SegPC challenge dataset: 775 brightfield microscopy images of Jenner-Giemsa
  stained bone marrow aspirate slides from multiple myeloma patients (298 train, 200 validation, 277 final
  test), with instance masks for the plasma cells of interest labelling nucleus (2) and cytoplasm (1)
  separately. Ground truth is released for the train and validation sets; the test ground truth is held
  back for the challenge leaderboard.'
