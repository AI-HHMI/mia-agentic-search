notes: 'Zenodo archive (62 files: 30 .tif images in "Tissue images/" + 30 .xml annotations in "Annotations/", plus
  .DS_Store) listed with peek_archive; size_bytes is the one zip (Zenodo file API). License CC-BY-4.0 is as stated on
  the Zenodo record; the official MoNuSeg challenge page (monuseg.grand-challenge.org, 403 to our fetcher) is reported
  to use CC-BY-NC-SA-4.0, so terms may be more restrictive - check before reuse. enricher: images are Aperio pyramidal
  TIFFs, full-res page 0 = 1000x1000 RGB uint8 LZW (40x). Pixel size (Aperio MPP, stated per file) varies by slide:
  0.2520, 0.2468, 0.2520, 0.2468, 0.2520, 0.2485 um in 6 sampled images (all AppMag=40, ~247-252 nm); no single value
  covers all slides, so imaging.voxel_size_nm left null (each Aperio TIFF carries its own MPP). Organism Homo sapiens
  from TCGA patient tissue. Training set only; the test set is distributed separately by the challenge.'
