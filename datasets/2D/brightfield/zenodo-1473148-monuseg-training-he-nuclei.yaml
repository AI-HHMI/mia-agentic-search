notes: 'Zenodo archive (62 files: 30 .tif images + 30 .xml annotation files, plus .DS_Store) listed with peek_archive. License CC-BY-4.0 is as stated on the Zenodo record; the official MoNuSeg challenge page (monuseg.grand-challenge.org, 403 to our fetcher, not read) is reported by a web search snippet to use CC BY-NC-SA 4.0, so the terms may be more restrictive - check before reuse. Pixel size, magnification, organism and per-organ details not stated on the Zenodo record; the paper full text is not open access (only the abstract was read), so voxel size is null. Organism Homo sapiens is inferred from the human patient/hospital tissue described in the abstract. This is the training set only; the test set is distributed separately by the challenge.'
