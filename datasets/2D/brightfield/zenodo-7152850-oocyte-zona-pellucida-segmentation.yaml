notes: 'Zip listing: 6,080 PNGs, i.e. 3,040 input/mask pairs (train folders mouse/exp1 622, mouse/exp2 1077, human/clin1
  300, clin2 499, clin3 279; test folders 70, 54, 66, 35, 38). The paper (PMC, Methods) says the ground-truth database
  is 3,578 zona pellucida images (2,361 mouse, 1,217 human), so the zip is a subset or differs in count; the paper
  also describes a larger 8,256-image oocyte contour database (4,432 mouse, 3,824 human) shared in a separate Zenodo
  record. Ground truth was a mix of manually validated or corrected masks (an ellipse drawn around the zona pellucida
  for much of it) and fluorescent membrane-marker derived masks. Microscopes: Nikon TI-Eclipse 20x/0.75 and Leica
  DMI 6000B 20x/0.70 or 10x/0.25, Orca-flash4.0LT camera; pixel size not stated. Mask classes (zona only vs also
  oocyte) were not opened.'
