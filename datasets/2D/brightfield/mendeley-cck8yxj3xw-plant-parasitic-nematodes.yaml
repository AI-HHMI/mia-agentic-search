notes: 'Mendeley API file list: 1,016 JPG plus metadata CSV and readme. Per-genus counts from file names: Meloidogyne 211, Hoplolaimus 151, Helicotylenchus 135, Hirschmaniella 130, Pratylenchus 116, Criconemoides 103, Xiphinema 85, Trichodorus 44, Radopholus 31, Hemicycliophora 6, Criconema 4 (very imbalanced). Labels are image-level genus only, no boxes or masks. Olympus CX-31 light microscope, 4x-100x (Mendeley description); pixel size not stated; brightfield inferred. Paper full text not open access (only Crossref/Europe PMC metadata read; the supplemented article Shabrina et al. 2023 is listed). Mendeley is not in the repository enum, hence other.'
