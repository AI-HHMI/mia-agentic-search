notes: 'Paper (Database 2024, baae120): AneRBC-I 1,000 images (500 healthy, 500 anaemic, 1224x960) with manually
  generated binary and RGB ground truth (Photoshop magic tool, checked by pathologists); AneRBC-II = each image
  cut into 12 tiles of 306x320 (12,000 + 12,000 + 12,000). Olympus Dp27 camera; pixel size not stated. n_items counts
  the 1,000 original images. Mendeley v2 (embargoed) and v3 (no files) exist; v1 holds the data. enricher: size
  7,950,323,311 B from the v1 zip listing (was 8,040,092,922 from a Kaggle re-upload); download_url = Mendeley v1
  zip API (was landing page); annotations_verified true (masks listed and sampled).'
