id: mendeley-hms3sjzt7f-anerbc-rbc-anemia
title: 'AneRBC dataset: a benchmark dataset for computer-aided anemia diagnosis using RBC images'
short_name: AneRBC anemia red blood cells (brightfield)
description: 1,000 Wright-Giemsa peripheral blood smear images (500 healthy, 500 anemic; 1224 x 960 px, 40x, Olympus Dp27)
  with manually made binary and RGB (morphology colour-coded) segmentation ground truths (AneRBC-I), plus AneRBC-II with each
  image cropped into 12 tiles of 306 x 320 px (12,000 images with matching ground truths). Anemic images show normal,
  microcyte, macrocyte, elliptocyte and target-cell classes. CBC and morphology reports accompany each image.
