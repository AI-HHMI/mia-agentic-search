notes: 'The Mendeley Data page (CC BY 4.0, DOI 10.17632/hms3sjzt7f.1, 27 Dec 2024) shows no file listing, so counts and structure
  come from the Database (Oxford) 2024 paper (AneRBC-I 1,000 images with 1,000 binary and 1,000 RGB ground truths; AneRBC-II
  12,000 tiles with 12,000 + 12,000 ground truths; Olympus Dp27, 40x, PNG, 3 colour channels) and from a Kaggle re-upload by a third party
  (8.04 GB, PNG files plus text reports) whose listing was only partly read; the original Mendeley zip file names were not seen,
  so annotations_verified is false. Pixel size is not stated. n_items counts the 1,000 original images; AneRBC-II adds 12,000
  cropped tiles.'
