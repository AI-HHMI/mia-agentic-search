notes: 'Kaggle API record: 677 images of 1920 x 1200 px, 473 train / 204 test, ground truth manually annotated per clinical guideline, CC BY 4.0. Complete file listing: 473+204 images
  (SHSegHR/*/img, jpg) and 473+204 masks (SHSegHR/*/mark, jpg; one test mask is png). Differs from the SHSeg record (128 x 128 px crops, 2,489 images): different, much larger images from
  the same study. The MTCA-Net paper is not open access and full text was unavailable, so pixel size, species and annotation protocol are not stated. JPEG masks may contain compression
  artefacts; mask value encoding was not inspected.'
