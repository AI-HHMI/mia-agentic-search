  notes: 'Listed all 21,126 zip members with exact sizes (35,953,708,159 bytes). Probed image_00001.png (Schistoscope, 1520x2028x3) and image_10562.png (AI4NTD, 1232x1640x3): RGB uint8 PNG, so shape varies by source. Sampled image_00001.png: values [23, 195] (one image), true RGB. Read annotations/image_00001.json, README.md and class_map.txt with peek_archive. Voxel size not found; checked: PNG headers (probe reports no physical size), Zenodo API description, zip README, paper full text (4x/0.10 NA objective only); the two sources use different devices and resolutions, so one pixel size may not apply to all images. No split files in the deposit (paper describes a 70/20/10 split). Organism: one image can hold eggs of several species, so files cannot be grouped per organism.'
