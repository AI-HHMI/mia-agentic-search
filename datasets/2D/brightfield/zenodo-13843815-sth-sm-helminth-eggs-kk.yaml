notes: 'Zenodo API: one 36 GB zip (CC BY 4.0). peek_archive: 10,562 PNG images, 10,562 per-image JSON annotation files in annotations/, one .txt and one .md at the root. Image sizes from the record: 2028 x 1520 px (Schistoscope) and 1640 x 1232 px (AI4NTD). Paper (open access, read): 4x / 0.10 NA objective; pixel size not stated. The paper reports a 70/20/10 train/validation/test split (10,820 FOV images in its table versus 10,562 in the deposit), but no split file was seen in the listing, so splits_provided is false. Egg counts per Zenodo: A. lumbricoides 8,600, T. trichiura 4,083, hookworm 4,512, S. mansoni 3,920. Organism lists the three species with NCBI-style names; hookworm (Ancylostomatidae) has no single species name and is omitted. Kato-Katz images from the AI4NTD Kaggle set are included under the same licence statement. enricher: annotations.format corrected (per-image JSON, not one COCO file). Organisms: eggs of all classes co-occur in images; no per-species folders.'
