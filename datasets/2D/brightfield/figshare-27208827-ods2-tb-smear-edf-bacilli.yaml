title: ODS2 - Dataset of smear microscopy images labelled to evaluate algorithms for bacilli detection
short_name: TB smear EDF bacilli, slides 1-15 (brightfield)
description: 4,920 extended-depth-of-focus (EDF) true-colour BMP images (1388 x 1040 px) of acid-fast stained sputum
  smear slides 1-15 (fused from 11-image focal stacks of the ODS1 set), each with a bacilli-labelled marking image
  and per-field CSV annotation files; intended for training, validating and testing of bacillus detection algorithms.
