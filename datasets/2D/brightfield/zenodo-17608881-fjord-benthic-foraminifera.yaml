notes: 'Two zips (Roboflow v5 exports): Forams-detect.v5i.coco.zip (7,094 files incl. 3 .coco.json and
  JPG images; Roboflow README says 7,089 images, so the exports include augmented copies) and Forams-detect.v5i.yolov7pytorch.zip,
  each about 1.65 GB, plus a code notebook. The 3,003 original images (paper abstract; section 2.1 of
  the paper says 3,095) were imaged as TIFF 1600x1200 on a Nikon SMZ-10 stereomicroscope with DeltaPix
  DP450 camera at 30x, optical resolution about 4.16 um/pixel; the Zenodo files are JPEG exports. Split
  70/20/10 per the paper. Annotation polygons are described in the paper; the COCO json contents were
  not opened. The modality ''brightfield'' is the closest enum for a stereomicroscope. Sibling foraminifera
  records in the catalog are different datasets. enricher: Roboflow README says 7,089 images, only auto-orientation,
  no augmentation; images 1600x1200 (COCO), i.e. not resized, so 4.16 um/px applies. data.yaml lists 26
  classes (not 29).'
