title: Combining StarDist and TrackMate example 3 - Flow chamber dataset
short_name: Flow chamber cells brightfield masks (StarDist)
description: >-
  StarDist example training data from a flow chamber brightfield time-lapse: 57 paired brightfield images and
  manually segmented instance masks (1024x1024 px, 650 nm/px) in Training_source / Training_target, plus
  quality-check data, test data and the trained StarDist model (ZeroCostDL4Mic). Imaged on a Zeiss Laser-TIRF 3
  system with a 10x objective.
