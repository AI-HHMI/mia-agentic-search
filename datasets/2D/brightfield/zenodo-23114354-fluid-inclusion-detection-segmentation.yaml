notes: 'README read in full; zip listings: detection_dataset 4,362 PNGs plus 4,362 YOLO labels, segmentation_dataset 28,114 PNGs (14,057 images plus 14,057 masks) in train/val/test. n_items is 4,362 + 14,057. The 14 GB raw_experimental_data.zip (heating-stage frame sequences) is not annotated training data. Paper: Computers & Geosciences, DOI not yet assigned (README says to be added on publication), so publications is empty. Images are preprocessed (grey-world white balance, Laplacian sharpening). Pixel size not stated (voxel size null). Size is the sum of the Zenodo files. enricher: annotations.source manual (zip READMEs: boxes drawn in LabelImg, masks from LabelMe polygons); channels 3 (RGB PNG). Probed sizes contradict the READMEs: detection images vary (512x337, 762x503, 919x862), segmentation crops are small and vary (13x17 to 66x89), not 1024 / 256 px.'
