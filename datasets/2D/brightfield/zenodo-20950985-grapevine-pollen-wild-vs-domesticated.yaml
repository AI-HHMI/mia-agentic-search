notes: 'README (read in full): 4,920 pollen grains, resolution ~0.10317 um/pixel, light microscopy; dataset 1 has one 13-focus composite
  image per grain (4,920 images), dataset 2 has four in-focus images per grain (19,680); files named trueclass_VASSAL_ID_complements.jpg;
  folder splitted_train_val_test_dfs gives the split lists of 10-fold cross-validation. peek_archive of IMAGES.zip: 24,720 files
  (JPG plus 120 CSV, 359 MB uncompressed). The record also holds ResNet152 weights (about 25 GB) and predictions. Labels are
  per-image classes, not masks or boxes. The paper (Rev. Palaeobot. Palynol. 2026) was not read: not open access in Europe PMC
  and not fetched. Modality brightfield is inferred from "light microscopy" in the README. Pixel size is the README value.'
