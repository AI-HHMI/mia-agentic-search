            <class>_VASSAL_N<id>_<slide>_fovn_<n>_bbox_<x>_<y>_<w>_<h>.jpg
        Dataset_grapevine_1pollen4images/{wild,domesticated}_N<id>/<grain stem>/   4920 dirs  19680 files  195.7 MB  .jpg
            <grain stem>_z<k>.jpg  (4 most in-focus planes of 13)
        splitted_train_val_test_dfs/design{A,B}_1pollen{1image,4images}/   120 files  98 MB  .csv
