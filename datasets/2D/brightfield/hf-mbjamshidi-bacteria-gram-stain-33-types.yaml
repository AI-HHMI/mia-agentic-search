notes: 'Repository holds README.md and one file, Dataset-Bacteria.rar (3,508,285,592 B); the README also
  links a Google Drive copy. README states 2,033 images, 33 classes, folder per class, labels assigned
  by laboratory experts; no split is provided. Microscope, magnification and pixel size are not stated
  in the README; the two cited papers are paywalled (Europe PMC abstract of the 2025 paper read, no full
  text), so voxel size is left empty. README requires citing both papers. enricher: RAR header listing
  has 2034 PNG in 33 species-named folders (formats jpeg->png, n_items 2033->2034); organisms = folder
  names, one per folder Dataset-Bacteria/<species>/ (spp folders as genus; Candida albicans is a yeast
  folder).'
