notes: Repository holds README.md and one file, Dataset-Bacteria.rar (3,508,285,592 B); the README also links a Google Drive
  copy. The RAR cannot be listed remotely, so image count (2,033), 33 classes and the folder-per-class layout come from the
  README only and the JPEG format is the README layout example, not a listing. Labels are described as assigned by laboratory
  experts; no split is provided. The class names, bacterial species, microscope, magnification and pixel size are not stated
  in the README; the two cited papers are paywalled (Europe PMC abstract of the 2025 paper read, no full text), so organism,
  voxel size and per-class counts are left empty. README requires citing both papers.
