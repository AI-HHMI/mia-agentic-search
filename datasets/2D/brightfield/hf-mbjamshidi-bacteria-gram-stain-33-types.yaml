  notes: 'Listed by walking the RAR5 headers with range requests (2068 reads, ~1.2 MB): 2034 stored PNG
    members in 33 species folders under Dataset-Bacteria/, 3,507,918,857 B unpacked; archive 3,508,285,592
    B (HF listing). README says 2,033 images and shows class_N/*.jpg, but the archive holds 2034 .png
    named by species. Sampled 01.png of Acinetobacter baumannii (1225x1225x4) and the smallest member
    (739x739x4), both uint8 0-255 (two samples); IHDR of 3 members read. Pixel size not found; checked:
    PNG headers (no pHYs/dpi), README, HF card, Europe PMC record of the 2025 paper (abstract only, not
    open access); the 2023 paper was not found in Europe PMC/Crossref. No usable sample unit: the only
    direct file is the RAR (download-check usable, range requests yes) and members of a RAR cannot be
