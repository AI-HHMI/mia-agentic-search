title: The TYC Dataset for Understanding Instance-Level Semantics and Motions of Cells in Microstructures
short_name: TYC trapped yeast cell instances (brightfield)
description: 105 densely annotated 16-bit brightfield images (2048x2048 or larger) of yeast cells held
  in microfluidic traps, with pixel-wise non-overlapping instance masks (about 19k instances, classes
  cell and trap) and a train / val / test / out-of-distribution test split (81 / 8 / 8 / 8), plus 261
  unlabeled time-lapse clips (1,293 frames, 10 min interval) for unsupervised study of cell motion.
