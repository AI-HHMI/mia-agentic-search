notes: 'TUdatalib (handle 3930) blocks automated access, so facts come from the project page, GitHub README,
  arXiv HTML and a range-read of labeled_set.zip (632.7 MB: 101 TIFF + 101 mask PNG + 101 class JSON;
  train 81, val 8, test 8, test_ood 8). Unlabeled zips not listed, so size_bytes is null. Raw 16-bit TIFFs,
