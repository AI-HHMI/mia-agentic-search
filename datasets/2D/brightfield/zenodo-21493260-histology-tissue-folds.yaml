notes: 'Files listed with peek_archive: images.zip (2,127 JPG, 6.6 GB; images/<tissue>/<clean|tissue_fold>/), masks.zip
  (1,228 PNG, 23 MB); plus metadata.csv, slide_image_mapping.xlsx (slide IDs for slide-level splits), dataset_summary.csv,
  LICENSE.txt. No train/test split is shipped; the paper uses slide-level, 80/20 and 5-fold splits. Pixel size is not
  stated on the Zenodo page, README or paper (10x objective, Nikon Eclipse Ci-L Plus, Tucsen TrueChrome 4K Pro camera),
  so voxel_size_nm is null. Species of the teaching specimens is not stated (veterinary faculty slides), so organism is empty.
  Annotated by one histology researcher and verified by a second; no blind second annotation.'
