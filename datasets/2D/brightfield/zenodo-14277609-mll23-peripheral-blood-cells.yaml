notes: 'Zenodo lists 18 zips (9.7 GB total); neutrophil_band.zip, listed with peek_archive, holds 687 TIFFs, matching the
  paper count for that class. The paper reports 41,906 raw images reduced to 41,621 after removing duplicates, which is the
  n_items used here. Pixel size 86.8 nm derived from the paper''s 288 px = 25 um (11.52 px/um). Channel count is not stated
  in the paper or on the Zenodo page. Labels come from one of five experts per image; dysplastic
  cells were excluded and some classes are rare (e.g. 33 reactive lymphocytes). Zenodo publication date is shown as
  2023-01-01; the paper was accepted 2025-10-30. No train/test split is shipped.'
