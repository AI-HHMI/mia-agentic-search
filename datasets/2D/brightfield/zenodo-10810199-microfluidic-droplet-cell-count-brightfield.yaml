notes: 'Zip listing (peek_archive): 184,500 TIFF files = 61,500 droplet images x 3
  preprocessing versions. Training: 16,000 per class with beadlines, 2,500 per class
  without; validation: 1,000 per class in each of the two conditions. Droplet crops
  come from earlier DropMap experiments (Broketa et al. 2023); the Zenodo record itself
  has no description. Pixel size of the crops is not stated (nd2 originals cropped
  to droplet diameter; preprocessed versions are resized to 55x55 in the paper). Classes
  come from manual classification per the paper Methods; who labelled them is not
  stated. Scripts were announced as ESI, not in this record.'
