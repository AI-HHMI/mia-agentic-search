notes: 'No license on the Warwick page; it only requires citing the NuClick paper. Organism not stated (LYON19 page and abstract:
  breast, colon, prostate IHC specimens, CD3/CD8, from Dutch medical centres). Annotations: NuClick-generated instance masks
  from clicks of a non-expert user (arXiv paper), hence source mixed. Same Warwick page also releases a WBC set (separate
  record). Possible duplicate of open PR #348 (warwick-nuclick-ihc-lymphocyte-masks). enricher: voxel size 240x240 nm from
  LYON19 Data page (WSIs 0.24 um/px, ROIs saved at full resolution; NuClick arXiv: 441 256x256 patches extracted from LYON19);
  resampling not stated (was null). enricher: channels 3 (RGB PNG probed); annotations.format from inspection.'
