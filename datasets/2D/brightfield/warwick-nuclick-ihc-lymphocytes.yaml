notes: 'No license is stated on the Warwick page; the only term is that publications using the data must cite the NuClick paper. The paper full text is not open access via Europe PMC and the arXiv PDF could not be read, so organism, tissue, magnification, pixel size, scanner and the annotation procedure were not confirmed (the arXiv abstract calls the data exemplar outputs of the NuClick tool, hence source mixed, i.e. click-guided semi-automatic masks). A third-party Hugging Face mirror (MedOtter/NuClick-IHC) says 256x256 patches from the LYON19 cohort; this was not verified from the original. Zip listing: IHC/images and IHC/masks (671 Train, 200 Validation each) plus IHC_xml_asap XML (671 + 200), 3484 files, 799.5 MB uncompressed (871 PNG, 871 NPY, 871 TIF, 871 XML). The same page also releases a WBC dataset, recorded separately (warwick-nuclick-hemato-wbc).'
