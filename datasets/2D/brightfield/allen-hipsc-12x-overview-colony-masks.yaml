notes: 'Read README, metadata.csv (3,010 rows, 416 barcodes, every row has an image and a seg path) and the S3 listing (size is the
  sum of all objects: 215 GB CZI, 21.8 GB seg TIFF). Probed one seg TIFF: int32, 1413 x 1482, axes yx; the first 256 KB of one CZI showed
  Gray16 pixels, 12x total magnification, a transmitted-light brightfield channel, Axio Observer.Z1/7. Not found: how the colonies were
  segmented, and any paper (the README only says supplementary to the hiPSC single-cell dataset). Tiff seg sizes vary (some are 144
  KB). License: Allen Institute Terms of Use (non-commercial research, attribution; commercial needs written permission). enricher:
  voxel size 1083.3 nm (x, y) from the CZI metadata Scaling (1.0833e-06 m per pixel, TotalMagnification 100, 10x/0.45; was null); CZI
  5845x5640 Gray8 in the file read; seg TIFFs are ~4x smaller (1410x1461).'
