notes: 'Read README, metadata.csv (3,010 rows, 416 barcodes, every row has an image and a seg path) and the S3 listing (size is the sum of all objects: 215 GB CZI, 21.8 GB seg TIFF). Probed one seg TIFF: int32, 1413 x 1482, axes yx; the first 256 KB of one CZI showed Gray16 pixels, 12x total magnification, a transmitted-light brightfield channel, Axio Observer.Z1/7. Not found: pixel size, image dimensions of the CZIs, how the colonies were segmented, whether labels are instance ids or binary, and any paper (the README only says supplementary to the hiPSC single-cell dataset). Tiff seg sizes vary (some are 144 KB). License: Allen Institute Terms of Use (non-commercial research, attribution; commercial needs written permission).'
