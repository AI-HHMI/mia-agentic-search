notes: 'Three zips (Cohort A 252 TIFFs, B 1,592, C 156; 2,000 total, 14.5 GB compressed) listed with peek_archive:
  only .tif files in folders D0_0S, D1_05S / D1_0_5S / D1_1S, D3_1S, D6_1S, D8_1S, D8_1Splus. The meaning
  of the folder suffixes (e.g. 0S, 05S, 1S, 1Splus) is not documented on the record; file names carry
  NS (non-stimulated) vs S (stimulated). The only labels are these culture-day / condition folders (experimental
  conditions, not human annotation); no masks or contours are in the archives although the title mentions
  minimal annotation and mask morphometry. The BLAST-T manuscript was not found in Europe PMC (not published
  yet or under a different title), so publications is empty. Organism is not stated on the record (CD8+
  T cells; species unknown). enricher: TIFF headers read: 2048x2048 uint16, uncompressed, Hamamatsu C11440-22C,
  calibration ''Pixels'' (factor 1), so voxel size still null.'
