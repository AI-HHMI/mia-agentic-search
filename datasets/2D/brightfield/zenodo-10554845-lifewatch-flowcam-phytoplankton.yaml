title: 'LifeWatch observatory data: phytoplankton annotated trainingset by FlowCam imaging in the Belgian Part of the North Sea'
short_name: North Sea phytoplankton classes (FlowCam)
description: >-
  337,613 FlowCam (imaging flow cytometer, 4X objective) images of Lugol-fixed micro- and phytoplankton (55-300 um) from the Belgian Part of the North Sea,
  in 95 taxon classes (mainly diatoms, dinoflagellates and ciliates), predicted by a CNN and manually validated by taxonomists, with an 80/10/10 train/validation/test split.
