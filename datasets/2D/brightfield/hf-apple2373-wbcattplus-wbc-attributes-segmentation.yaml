title: WBCAtt+ white blood cell attribute and segmentation dataset
short_name: WBCAtt+ white blood cell attributes and masks
description: 10,298 peripheral blood white blood cell images (from the PBC dataset; center-cropped to 360x360 px) annotated with 11 morphological attributes (113k image-level labels) and pixel-level semantic segmentation maps with five classes (red blood cells, cytoplasm, nucleus, platelets, vacuoles). Includes train/val/test attribute CSVs for the five WBC types (neutrophil, eosinophil, basophil, monocyte, lymphocyte).
