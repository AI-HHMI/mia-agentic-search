notes: 'Single 190 MB tar (pbcseg_final_v1.tar) on Hugging Face. First tar headers read with a 3 MB range request: folder pbcseg_final_v1/ with <id>_ccrop.jpg images and <id>_ccrop_mask.png masks (the full member list was not read). The GitHub README names the attribute CSVs; the paper gives 6,169/1,030/3,099 train/val/test images and five segmentation classes. Source images come from the PBC dataset (360x362 px), whose own license was not checked in this run; the HF card states MIT for the annotations. Stain, magnification and pixel size are not stated in the pages read, so voxel_size_nm is null and labels_stains empty.'
