notes: 'WBC Dataset.zip (46.2 GB, 16,027 BMP, 69.2 GB uncompressed) listed with peek_archive: all files are Labelled/<class>/<n>.bmp, 4.3 MB each (1200x1200 RGB per the paper). The paper (PMC10356748) states the raw smear images are 5472x3648 (12,986 images, 81 smears) and ~42 pixels per um (voxel size 23.8 nm is 1/42 um, approximate); raw images are not in the zip. Folder-class counts seen in the listing: Basophile 1023, Eosinophile 1017, Lymphoblast 2557, Lymphocyte 3046, Monocyte 2040, Myeloblast 2534, Normoblast 510, Neutrophile Segment/Band the remainder. BMP is not a schema format so formats is other. Who assigned the labels is not stated in the page text read (annotation procedure not verified), so annotations.source is unknown. Paper states CC BY 4.0 for the article; figshare API states CC0 for the dataset. The paper text was inconsistent on smear/patient counts (81 smears; 78 patients elsewhere). Annotation-tool code on GitHub (Supporting-Material-for-Blood-Cells-Dataset).'
