    of the tar head (manifest.txt: field-level split seed 42, train 0001-0519, val 0520-0599, test 0600-0704;
    then val/positive_images/field05xx_quadK.png). Decoded val/positive_images/field0542_quad3.png (1.9
    MB): 1632x1224x3 uint8 RGB, range 0-255, mean 157.5 (one sample). sample is null: TensorSwitch can
    pull zip members but not tar members, and there are no per-file links. Voxel size not found for this
    derivative: Morais et al. give ~0.06 um for full fields, but fields of 2,448 x 3,264 and 3,456 x 4,608
