notes: 'Zenodo record (v1.0, one 16.4 GB tar, CC BY 4.0) was read from the API; its description gives
  the folder tree and counts (train 2,528 positive + 2,528 negative, val 188 + 124, test 279 + 141), so
  n_items is 5,056 + 312 + 420 = 5,788. Training images are flip-balanced and Gaussian-noise-augmented
  copies, so unique content is smaller than the count. The underlying Morais et al. PeerJ 2022 paper (read
  via Europe PMC) states 12-megapixel smartphone micrographs of about 0.06 um lateral pixel size at 3,456
  x 4,608; the quadrants here are standardised to 1,224 x 1,632, so no pixel size is given for this derivative.
  The original fields and per-parasite coordinates are not part of this record. enricher: first 12 MB
  of the tar read (manifest.txt, val/positive_images PNGs), annotations_verified true (was false).'
