title: Tcruz-fpn - Trypanosoma cruzi positive/negative blood-smear quadrants from smartphone microscopy, with slide-level splits
short_name: T. cruzi blood-smear quadrants (smartphone)
description: 5,788 PNG quadrants (1,224 x 1,632 RGB) cut from smartphone-on-microscope Giemsa blood smear fields
  of the Morais et al. T. cruzi corpus, labelled positive when an annotated parasite centroid falls inside
  and negative otherwise, with slide-level train / validation / test partitions (training set flip-balanced
  and noise-augmented, validation and test unaugmented). A derivative of the Morais et al. data; raw
  fields and per-field annotations are not redeposited.
