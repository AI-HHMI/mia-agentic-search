id: tcia-c-nmc-2019-b-all-cells
title: 'C-NMC 2019: B-ALL leukaemic vs normal blood-smear cell images (ISBI 2019 challenge)'
short_name: B-ALL vs normal blood cells (C-NMC 2019)
description: Segmented single-cell images from stained blood smears of 118 subjects (69 with B-lineage acute lymphoblastic
  leukaemia, 49 healthy), released for the ISBI 2019 C-NMC challenge to train classifiers separating leukaemic B-lymphoblasts
  from normal B-lymphoid precursor cells. Ground-truth labels were marked by an expert oncologist; stain colour
  normalisation was applied. Train set 10,661 cells; preliminary test 1,867; final test 2,586 (final-test labels
  withheld and scored on CodaLab).
