notes: 'The single file is RBC.rar (93.7 MB), a format the archive peeker cannot list, so the image format, image counts and
  folder layout were not verified; formats is therefore "other" (the ThalassemiaPBS source paper says PNG grayscale, original
  4100 x 3075 px, but that applies to the source dataset, not necessarily this archive). Labels come from the record
  description: Chula and ThalassemiaPBS cells categorised with their label files, Algerian samples labelled by specialists.
  The record is a compilation of two earlier public datasets (Chula RBC-12, arXiv 2012.01321, and ThalassemiaPBS, Data in
  Brief 2022, full text read) and its CC-BY-4.0 licence may not override the sources'' licences. Pixel size is not stated;
  magnification is given only for the Algerian samples (1000x). The Chula paper was not found by the paper tool and was not
  read.'
