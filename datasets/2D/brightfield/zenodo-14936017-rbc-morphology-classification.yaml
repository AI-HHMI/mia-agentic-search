title: Red blood cell morphology images for classification, combining Chula RBC-12, ThalassemiaPBS and Algerian smear samples
short_name: Red blood cell morphology classes (blood smear)
description: Blood smear images of red blood cells labelled by morphology class, compiled from the Chula RBC-12 dataset
  (13 listed classes), the ThalassemiaPBS dataset (nine cell types) and 13 supplementary smear images from an Algerian cancer
  centre covering five RBC disorders. Single cells and regions of interest were cropped and sorted by class.
