description: Blood smear images of red blood cells labelled by morphology class, compiled from the Chula RBC-12 dataset (13 listed classes), the ThalassemiaPBS dataset (nine cell types) and 13 supplementary smear images from an Algerian cancer centre covering five RBC disorders. Single cells and regions of interest were cropped and sorted by class.
