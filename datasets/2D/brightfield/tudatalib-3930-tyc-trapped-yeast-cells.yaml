notes: 'Hosted at TU Darmstadt TUdatalib (handle tudatalib/3930; labeled_set.zip plus unlabeled_set_1-3.zip), which sits behind a bot challenge, so zips were not listed, sizes and the DOI were not read, and download_url is null. Layout and TIFF format (16-bit) are from the GitHub README; n_items counts labelled images only. Splits from the paper: train 81, val 8, test 8, OOD test 8 (OOD from fluorescence time-lapse). Annotations made in-house per the paper (counted as manual). Images were recorded on a Nikon Eclipse Ti with 100x and 60x objectives and Hamamatsu cameras; pixel size not stated in the text read. Related earlier dataset by the same authors (128x128 crops) is catalogued separately.'
