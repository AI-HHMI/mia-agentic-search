description: Trapped yeast cell (TYC) dataset with 105 high-resolution (2048x2048 and larger) brightfield images of Saccharomyces cerevisiae in microfluidic traps, densely annotated in-house with instance masks and cell/trap classes, split into train/val/test/OOD-test sets, plus 261 unlabelled video clips (1,293 frames) of cells in microstructures.
