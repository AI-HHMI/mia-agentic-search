  notes: 'Listing of the data zip: 12,817,103 B exact, 234 members (the record also offers a model zip
    and a figure, not counted). Sampled one pair per subset. Super-resolution CAM_m1ROI_1: bright field
    uint8 512x512, range 0-219; NR_PAINT uint8 512x512, range 0-255 (mean 3.6; mostly background, saturated
    at the top); both 8-bit, so they were likely converted, but normalization stays unknown. Widefield
    m1: bright field uint16 256x256, range 14150-20446 (raw camera values, so normalization none is inferred);
    NR uint16, range 0-6241 (zero floor suggests background subtraction, so unknown). ImageJ calibrations:
    19.7876 nm (SR) and 106 nm (WF m1); the record''s 19.75 nm applies to the SR subset only, and widefield
    pairs are 106 or 158 nm per the docs. Values come from one pair each.'
