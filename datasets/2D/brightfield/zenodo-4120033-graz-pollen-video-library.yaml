short_name: Graz airborne pollen, 16 types (brightfield)
description: Transmitted-light microscope images and videos of airborne pollen collected in Graz, Austria
  (Feb-Aug 2020) with a low-cost automated pollen sensing device. Contains 15,422 cropped pollen images
  of 16 pollen types (one folder per type), a video library (64 AVI videos with 560,736 YOLO-cropped grain
  images tracked across frames, in per-type folders), and 125 unannotated field videos from 3 days of
  field data.
