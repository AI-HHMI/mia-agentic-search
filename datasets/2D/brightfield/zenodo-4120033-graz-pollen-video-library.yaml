notes: 'Listed all three zips with peek_archive: images_16_types.zip has 15,422 JPEGs in 16 type folders (838-1,320 each); pollen_video_library.zip has 64 AVI and 560,736 cropped JPEGs; pollen_field_data.zip has 125 AVI (unannotated). Labels are the folder names; how the type was established (grains collected from known plants) is not stated on the record or in the paper PDF text read. The linked EWSN 2020 paper describes the device (10x objective, IMX179 camera, 0.17 um/pixel for the 2019 prototype) but not this 2020 collection, so voxel size is left null; no pixel size was found for these crops. Crops are small (cropped by a YOLO detector). Related but different from zenodo-3572653 (Graz 2019 pollen, bounding boxes). size_bytes = sum of the three zips; formats exclude AVI (not in the schema list).'
