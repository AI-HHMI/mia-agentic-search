notes: 'Single zip (379 MB, 555 files) listed with peek_archive: folders Ascaris spp, Balantidium coli, Fasciola
  spp, Paramphistomum spp, Stomach worm (50 images + 1 xlsx each) and Negative Control (300 images). Files are mostly
  JPG with some JPEG, PNG, WEBP (3) and AVIF (1); formats lists only the main two. The description says additional
  images were sourced from peer-reviewed journals and online platforms, so not all images are original captures
  and per-image rights may differ from the CC BY 4.0 dataset licence. Microscope, magnification and pixel size are
  not stated on the page and no README or paper is listed; the Ascaris Excel file (opened by the enricher) lists
  a web source per image, mostly stock-photo and other web pages. Image-level labels only (no boxes or masks). Sources
  checked: Mendeley page, API record, zip listing. organisms: one per class folder (Stomach worm/ = Trichostrongyloidea).'
