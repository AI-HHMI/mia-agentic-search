notes: 'License: the Zenodo record has no license field and the description gives none; the paper (BMC Infect Dis, CC BY 4.0)
  is licensed separately, so the data licence is unknown. Zip holds 2,630 files: 1,304 PNG + 1,304 label .txt (Dataset_1 =
  570 images; Dataset_2 = Dataset_1 + 164 images from the portable microscope, so the 734 distinct images appear in both folders),
  plus README.md, dataset.yaml and stray files. n_items 734 = distinct images (350+106 positive, 220+58 negative). Paper says
  70/15/15 slide-wise splits; the folders provide train/val/test. Paper labels are bounding boxes drawn in LabelMe; the README
  and one label file read show 4 corner pairs per line. Overlapping amastigotes are sometimes covered by a single box (paper).
  Pixel size not stated beyond optical resolution 0.21 / 0.22 um. enricher: channels 3 confirmed from PNG headers (RGB). enricher:
  organisms: human lesion smears with Leishmania boxed in them, both in every file.'
