  notes: 'Listing: complete Zenodo listing (1 zip, 2,734,763,831 B) with zip members expanded. Probed 2 Dataset_1 PNGs (1440x1920x3
    uint8 RGB, deflate); probing Dataset_2 (Bresser) PNGs failed with repeated Zenodo TLS errors, so their shape is not confirmed
