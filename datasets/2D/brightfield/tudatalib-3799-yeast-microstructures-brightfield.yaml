notes: 'The project page (landing_url) was fetched successfully; the TUdatalib repository page (handle 3799) is behind Anubis bot protection (access denied) and the zip does not support range requests, so the archive contents were not listed; file structure and the .pt format come from the GitHub README. Split from the paper (Table II): 296 train / 49 val / 148 test images. License MIT is stated on the dataset project page for the dataset and code. Pixel size and magnification are not stated on the project page, GitHub README, or the paper text (only scale bars in figures). Images are 128x128 crops from higher-resolution raw data; the README also mentions [256,256] in a code example. The paper is not open access in Europe PMC; the arXiv PDF text was read. Data format is PyTorch tensors (.pt), which has no listed enum value, hence other.'
