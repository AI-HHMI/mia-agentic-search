  notes: 'archive.ics.uci.edu serves the zip without range requests or Content-Length, so it cannot be listed remotely. I
    streamed the first 2 MB, parsed the zip64 local headers (122 members, all H1/*.jpg, deflated) and decoded 3 JPEGs: RGB
    500x500 uint8, ranges 68-193, 64-196, 63-178. The other class folders, the total member count and any label files were
    not reached. No sample unit: TensorSwitch needs range requests for zip members, and the host is not on its allowlist.
    Voxel size not found; checked: JPEG headers (no dpi), UCI page, arXiv paper (raw images 640x480 to 5152x3864, magnification
    not given per image).'
