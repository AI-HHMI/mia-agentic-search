notes: 'UCI page: 9,114 instances, 149.1 MB zip of .jpg images, CC BY 4.0, five manually labelled classes (not named there).
  The paper counts differ: about 3,025 raw donated images, patched to 500 x 500 px and filtered, with 2,500 images used in
  the 5-class experiments, so the zip size may include more patches than the paper used. enricher: zip streamed for its first
  2 MB (no range support): members are <class>/<class>_<image><side>_<patch>.jpg, first class folder H1; 500x500 RGB JPEGs.
  Magnification, stain and pixel size are not stated for this dataset (the paper only mentions 10x to 1000x in general terms).
  The paper says the data are also on Kaggle (camilovu/lemm-pre-processed, lemm-raw) and GitHub (s4632865/lemm), not read
  here. Organism Fungi (kingdom; species per class not named).'
