notes: 'diatoms.zip listed with peek_archive: 29,502 PNG and 9,217 JPEG files under diatoms/<taxon>/<optics>/;
  diatoms.csv gives a per-image scale value. Images are extracted from printed regional atlases, so image
  quality and optics vary by source atlas. The Zenodo page lists no associated paper (it is a new version
  of 10.12763/UADENQ), so none is cited. Annotation procedure is not described beyond taxonomic labels
  taken from the atlases, and the oriented-box training labels used for the detection model are not part
  of this record, so only classification is listed. No train/test split files seen in the listing. enricher:
  size_bytes now the sum of all 5 record files from the Zenodo file listing (was the zip alone).'
