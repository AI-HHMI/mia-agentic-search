  notes: Zenodo listing complete with exact sizes (5 files, zip members listed). Images are small single-diatom
    crops of varying size; PNGs probed as 8-bit grayscale, JPEGs as 8-bit RGB (lossy). Sampled one PNG
    (230x62, 51..255) and one JPEG (323x125x3, 32..255); value ranges are from one image each. Labels
    are image-level taxon codes (folder name and diatoms.csv), not masks; only the first 600 bytes of
    diatoms.csv were read. diatoms.csv has a per-image scale column (e.g. 11.11 for AAMB_001), unit not
    stated in the header. The second folder level matches source atlas codes; sources.csv was not read.
