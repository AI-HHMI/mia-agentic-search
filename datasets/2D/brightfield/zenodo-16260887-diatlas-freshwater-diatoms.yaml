title: DIATLAS - The French freshwater DIatom ATLAS image dataset
short_name: Freshwater diatom species classification (BF/DIC)
description: 38,719 optical-microscopy images of freshwater diatoms extracted from French regional atlases, imaged in bright field or differential interference contrast. Each image carries a species-level taxonomic label (folder per taxon) with metadata CSVs (taxon, source atlas, page, scale, connective flag). Used to train oriented-bounding-box detection and species classification models.
