title: ODS3 - Dataset of smear microscopy images labelled to evaluate methods for Tuberculosis diagnosis
short_name: TB smear EDF bacilli, slides 16-25 (brightfield)
description: 3,280 extended-depth-of-focus (EDF) true-colour BMP images (1388 x 1040 px) of acid-fast stained sputum
  smear slides 16-25 (fused from 11-image focal stacks of the ODS1 set), each with a bacilli-labelled marking image
  and per-field CSV annotation files; intended for evaluating an automatic sputum smear microscopy method for TB
  diagnosis.
