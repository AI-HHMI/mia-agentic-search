notes: 'Figshare API record and the ''folders directory'' PDF read; the first entries of the tar.gz were listed
  (ODS3/Annotated ODS3/ANNOTATIONS/<field>/ImageAnnotation/*.csv). enricher: CSV rows are <class b|bc|u>,<x>,<y>
  (annotations.types other -> points); marking BMPs are RGB overlays. No paper is cited on the record (Europe PMC/Crossref
  title search found none). Pixel size not stated. Image format is BMP, which has no schema enum, hence formats
  other. Sibling of the DDS2 patch set (figshare 27209658) and of ODS1 (focal stacks); this record covers only the
  EDF images and labels.'
