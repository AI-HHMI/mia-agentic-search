notes: 'Mendeley Data file listing (public API) shows 260 files for 130 images (52 .jpg, 78 .png) plus 130 .txt
  annotation files, 792,595,375 bytes in total. Annotation format taken from the dataset page and the code repo
  README; the images are full-size slides (the code clips them to 512 x 512). Pixel size not stated on the dataset
  page, README or paper abstract; the paper full text is not open access (Europe PMC) so Methods could not be read.
  The paper abstract describes an annotated set of N = 3120 images, larger than the 130 images deposited here. No
  direct archive URL was found, so download_url is null; files are listed individually in the Mendeley API. enricher:
  channels 3 (RGB, from JPEG/PNG headers; was null).'
