description: 130 bright-field images (3072 x 2048 px, 20x objective, Wright-Giemsa stained) of sperm chromatin dispersion
  (SCD) test slides, each with a text file annotating every sperm (tail and head position, minor-axis length and
  maximum halo thickness). Released for training networks that detect sperm nuclei and measure the halo ring to
  quantify sperm DNA fragmentation.
