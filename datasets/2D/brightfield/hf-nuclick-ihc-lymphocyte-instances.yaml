notes: 'Terms: the HF card says the LYON19 source images are CC BY 4.0 (Zenodo 3385420) with a citation requirement for the NuClick
  annotations; the Warwick page states no license and only asks that the NuClick paper be cited, so spdx is custom. Pixel size 0.24
  um/px is the LYON19 WSI resolution (Zenodo 3385420: ROIs saved at full resolution); the 256x256 patches are crops of those ROIs, no
  rescaling stated. Masks were made with the NuClick tool from non-expert clicks (paper Sec. IV), so source is mixed (click-guided automatic).
  enricher: download_url = original ihc_nuclick.zip (direct, range requests; was null); size from its full listing (HF mirror parquet:
  94,014,276 B); formats png+tiff from the zip listing (was other); channels 3 from PNG header; annotations verified from listing and
  sample.'
