  notes: 'Listing: tools/listing.py on ihc_nuclick.zip (3484 members, exact sizes) and the HF tree API. Labels are NumPy .npy (no schema
    format; format other), read with np.load(allow_pickle=False): uint32 256x256, ROI_100_1 all zero, ROI_101_1 ids 0..8 (9 unique).
    value_range from one sample each (PNG ROI_100_1: 40..255, mean 228). HF card: ~30% of train and 25% of validation patches have no
    nuclei; max 69 instances per patch. IHC_xml_asap/ holds ASAP XML polygons plus a 3-page plain RGB TIFF per ROI (pages 256x256x3,
    page meaning not documented), not listed as arrays. HF parquet files are direct (huggingface.co, usable) but parquet is not a TensorSwitch
    format; warwick.ac.uk serves the zip with range requests but is not on the TensorSwitch fetch allowlist. 2D record, so not convertible
    by the 3D-only miao pipeline.'
