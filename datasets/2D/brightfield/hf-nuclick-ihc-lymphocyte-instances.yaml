notes: 'Terms: the Hugging Face card says the LYON19 source images are CC BY 4.0 with a citation requirement for the NuClick
  annotations; the Warwick page states no license and only asks that the NuClick paper be cited, so the spdx is custom. Pixel
  size 0.24 um/px is the scan resolution of the LYON19 WSIs stated on the LYON19 Zenodo record (3385420); patches are
  256x256 crops whose extraction scale was not stated, so treat as approximate. Masks were produced with the NuClick tool
  from non-expert clicks and refined for training (not fully manual); the paper says LYON19 released no ground-truth masks.
  The card and paper full text (non-open-access journal version; the arXiv preprint was read) do not give the nucleus count.
  File listing seen only through the card (parquet train/validation splits; raw ASAP XML not included). Original zip size
  not stated on the Warwick page.'
