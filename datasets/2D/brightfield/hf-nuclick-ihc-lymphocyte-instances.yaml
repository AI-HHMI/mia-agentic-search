title: NuClick IHC lymphocyte instance segmentation patches (CD3/CD8 immunohistochemistry, Hugging Face mirror)
short_name: IHC lymphocyte instance masks (NuClick)
description: 871 RGB patches (256x256 px; 671 train, 200 validation) of CD3/CD8 immunohistochemistry-stained breast, colon
  and prostate tissue, taken from the LYON19 challenge ROIs, with per-nucleus instance masks generated with the NuClick click-guided
  tool. Released with the NuClick paper as the IHC lymphocyte dataset. Mirrored on Hugging Face as parquet; the original
  release is ihc_nuclick.zip on the Warwick TIA Centre site.
