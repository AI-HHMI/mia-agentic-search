title: Fecal Microscopy Dataset - super-depth-of-field multi-focus images with bounding boxes for RBC, WBC, mold and pyocyte detection
short_name: Fecal microscopy cell detection (brightfield)
description: 53,350 brightfield micrographs (1200x1600 px) in 10,670 groups of views from fecal samples of the Sixth People's
  Hospital of Chengdu. Each view has the five sharpest images from a focus sweep (selected by Tenengrad definition) and bounding-box
  annotations of red blood cells, white blood cells, molds and pyocytes, for super-depth-of-field object detection.
