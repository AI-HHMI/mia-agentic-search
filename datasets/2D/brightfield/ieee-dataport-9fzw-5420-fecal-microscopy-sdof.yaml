notes: 'feces.7z (6.87 GB) needs an IEEE DataPort login, so the file listing was not seen; the JPG format, folder naming
  (H-view-image) and CSV columns come from the landing page. The landing page links no paper; the companion article (open
  access, Microscopy 2022) was read: fecal samples imaged with a Motic B1 digital microscope, 40x objective (NA 0.65), 1600x1200
  in the paper versus 1200x1600 on the page; experts annotated all images with rectangular boxes, 8:2 split by field of view
  (no split is shipped). Pixel size not stated. The paper uses the leucorrhea set from the same group as a second dataset
  (separate record).'
