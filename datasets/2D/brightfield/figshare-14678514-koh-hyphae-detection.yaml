title: hyphae fungus microscopic images
short_name: Fungal hyphae in KOH smears (brightfield)
description: Brightfield microscopy images of KOH-prepared skin and nail scrapings from a dermatology
  clinic (Veterans Health Service Medical Center, Seoul), at 40x and 100x objective magnification, used
  to detect superficial fungal infections. Images with hyphae carry a dermatologist-drawn bounding box
  per hyphae region in YOLO format (1,100 positive images at 100x, 993 at 40x); 628 hyphae-free negative
  images at 40x are included without labels.
