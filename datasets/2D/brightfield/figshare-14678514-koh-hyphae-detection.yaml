notes: 'Zip listed with peek_archive: 4,814 members = Image(100x)/positive images+labels (1,100 jpg/txt), Image(40x)/positive
  images+labels (993), Image(40x)/negative (628 jpg, no labels). Label file read: YOLO rows, class 0. Figshare landing page
  is bot-blocked, so the API record was read. Paper: Nikon ECLIPSE E600 + DS-F12 camera, frames from video of rotated slides,
  boxes by a dermatologist. Pixel size, image size and a split are not stated on the page, in the archive or in the paper;
  the paper''s 3,707-image count differs from the 2,721 images in the archive. Figshare lists the licence as MIT. enricher:
  annotations.coverage dense = positive images only; the 628 negatives have no label files.'
