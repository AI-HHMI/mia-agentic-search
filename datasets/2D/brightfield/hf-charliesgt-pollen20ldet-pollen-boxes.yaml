notes: 'Third-party Hugging Face mirror (uploader Charliesgt, no dataset card). The original dataset is on Kaggle (nataliakhanzhina/pollen20ldet,
  page returned only its title here). The CC BY 4.0 licence comes from the loading script Pollen20LDet.py of this repo, not from a card
  or the Kaggle page, so it is the uploader''s statement. Listed zips: train (1,824 images + _annotations.json), valid (354), test (234),
  plus full.zip (2,412 files incl. bboxes.csv and class_map.csv); images are 416x416 and the hashed file names suggest a Roboflow export,
  possibly with augmented copies, so the count of distinct slides is unknown. The paper (Comput Biol Med 2022) is not open access, only
  its abstract was read (it reports 13 species while this set lists 20 classes). Pixel size and microscope are not stated in the sources
  read. n_items is the sum of split image counts; size_bytes is the 45.2 MB repo total shown on the HF page (rounded).'
