notes: 'TUdatalib landing page (tudatalib/3930) sits behind a bot challenge and the zip server refuses range requests, so the archive could not be listed (url_ok false); structure, split sizes and formats come from the project page, the GitHub README and the paper (full text read via arXiv PDF). Labeled image file format is not stated (masks are "an image"); tiff is stated only for the unlabeled clips, so formats is a best fit. Voxel size not stated on project page, README or paper text. No dataset DOI found. Labeled set is brightfield; unlabeled clips are time-lapse fluorescence (TLFM). Related earlier release by the same authors (An Instance Segmentation Dataset of Yeast Cells in Microstructures, EMBC 2023) is a separate dataset.'
