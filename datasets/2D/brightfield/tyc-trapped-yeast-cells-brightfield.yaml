schema_version: '1.2'
id: tyc-trapped-yeast-cells-brightfield
title: The TYC dataset for instance-level semantics and motions of yeast cells in microstructures
short_name: Trapped yeast cells instance masks (brightfield)
description: 105 densely annotated high-resolution (>=2048x2048) brightfield microscopy images of Saccharomyces cerevisiae in microfluidic trap structures, with about 19k pixel-wise instance masks and a semantic class (cell / trap) per instance. Split into training (81), validation (8), test (8) and out-of-distribution test (8) images. Also includes 261 unlabeled time-lapse clips (1293 frames, 10 min interval) for unsupervised motion and representation learning.
