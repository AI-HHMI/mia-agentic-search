notes: 'Facts from the Mendeley page and public API record (files and folders endpoints): 128 files, 905,067,043
  B, in DERMA-PASeg/{Unstained,C Stained,V Stained,Masks}/{Train,Test} (24 train + 8 test slides each).
  enricher: mask WC23-00664-A1.png sampled (RGB, 5 colours, same 3000x7000 grid as the unstained JPEG);
  annotations_verified true; splits_provided true (Train/Test folders). The colour-to-class mapping is
  not documented. No paper is linked on the record and none could be tied to it by search, so none was
  read. Species, pixel size, scanner, magnification and annotator are not stated. Virtually stained images
  are GAN-generated; the mask classes are from the record description.'
