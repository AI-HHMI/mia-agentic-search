notes: 'Collection read through the Figshare API: article 12233156 holds classifications.csv (rows of
  image_id, image_filename, cell_id, bethesda_system, nucleus_x, nucleus_y), classifications.json and
  a README; article 12229511 is an example slide image (one PNG, 2.25 MB, CC BY 4.0); the other 399 images
  are separate articles listed in the collection. Paper (Sci Data 2021, full text read): 400 images, 11,534
  classified cells, 3 cytologists (6, 11 and 20 years of experience) with consensus labelling, image size
  1,376 x 1,020 px and 0.228 um/pixel (written as 228 nm), 40x objective. Images from Zeiss AxioImager.Z2
  / AxioCam MRc. No train/test split is provided. Other Pap datasets in the catalog (Herlev, SIPaKMeD)
  are different datasets. enricher: size from the file sizes of all 403 files in the collection (400 PNGs,
  all CC BY 4.0); no single archive.'
