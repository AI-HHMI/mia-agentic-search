notes: 'Counts, the nine classes and the labelling procedure come from the figshare description (read in full): two expert
  haematologists labelled and reviewed every cell and masks, discussing disagreements; the stain type is not stated (only
  tags "Staining", "Dyeing"). The outer zip was listed with peek_archive: 27 nested zips (Cropped images, Masks and Segmented
  images x 9 classes, 1,625.8 MB); the nested zips and image files were not opened, so file counts per class, image sizes
  and the exact mask format are unverified. Scanner, magnification and pixel size are not stated on the record and no paper
  was found in Europe PMC or Crossref (searched by title), so voxel_size_nm is null; publications left empty. How masks were
  generated (manual vs semi-automatic) is not stated; source is proofread (expert review). One figshare version (v1, 2023).'
