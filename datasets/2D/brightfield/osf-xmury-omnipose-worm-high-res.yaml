notes: 'Sibling of osf-xmury-omnipose-bact-phase (same OSF project xmury, folder datasets/worm_high_res); the images are original
  to this work. OSF API listing: 169 files, 2,273,520,396 B; train 48 images each with _masks.png and _flows.tif, test 11
  image/mask pairs. Paper: each field imaged as a 7-frame z stack (about 85 um span); Data Availability calls the shared files
  minimum projection brightfield images. Licence: project-root license.txt (CC BY-NC 3.0), applied by location. Pixel size
  not stated; left null. enricher: listing, headers and samples checked; pixel size still not stated (paper, OSF wiki, headers).'
