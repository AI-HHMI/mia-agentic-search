  notes: 'Listing of datasets/worm_high_res by a scratch script over the OSF API (paginated, exact per-file sizes; tools/listing.py
    has no OSF support, so size_source is page-stated). 59 image/mask pairs (48 train, 11 test) + 48 *_flows.tif (precomputed
    flow targets, train only; not listed as an array; they make up most of the 2.27 GB) + 3 .DS_Store. Image names are integers,
    so *[0-9].png excludes masks. Probe of 50.png/50_masks.png: grey uint8 PNG 1653x1316. Sample 59: raw uint8 658x654, 0..211,
    145 values; mask uint8 {0,255} (one worm). 50_masks.png has 3 distinct values with 255 present, so instance IDs are not
    consecutive integers; encoding instance-ids per the paper (manual instance masks). Value ranges from samples. Pixel size
    not found; checked: PNG headers (probe reports no calibration), paper Methods (only x15 magnification, 10x/0.25 NA, 1.5x
    camera magnification), OSF wiki home, OSF project root.'
