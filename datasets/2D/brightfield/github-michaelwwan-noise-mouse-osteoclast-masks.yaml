notes: 'Data are one Mouse.zip (19.3 GB) in a Google Drive folder linked from the GitHub README; no dataset DOI. The repository
  LICENSE is AGPL-3.0 for the code; no data license found in the README, the Drive folder, the zip listing or the paper, so
  license is unknown. Pixel size 0.7784 um/px is the README value for the training images. The paper also describes human
  osteoclast images (H1-H2); only mouse data are released. enricher: zip listed (35,587 PNG + 35,587 txt, paired by stem;
  patches only, no whole-well images despite the README wording); formats other -> png, size and n_items from the listing.
  enricher: annotations.source mixed: per the paper, osteoclast masks are ImageJ colour-filter candidates curated and completed
  by experts; it also describes weak nuclei boxes made by a detector on the whole mouse set, which class 1 (unnamed in osteo.yaml)
  appears to be.'
