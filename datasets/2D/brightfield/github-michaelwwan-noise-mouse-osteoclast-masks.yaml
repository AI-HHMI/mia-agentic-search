notes: 'Data are a single Mouse.zip (18 GB) on a Google Drive folder linked from the GitHub README, so there is no dataset DOI or repository record. The zip contents could not be listed (peek_archive: server reports no size), so image format and counts come from the paper/README, not a file listing; formats=other is a placeholder. The repository LICENSE is AGPL-3.0 and covers the code; no separate license for the data was found in the README, the paper abstract or the PMC page, so license is unknown. The paper full text is not open access (only the abstract and the PMC page summary were read). Pixel size 0.7784 um/px is the README default for the training images. The paper also describes human osteoclast slides (24 images on bone chips); the README only describes the mouse dataset, so only mouse is recorded. README mentions a follow-up paper (2026) under review.'
