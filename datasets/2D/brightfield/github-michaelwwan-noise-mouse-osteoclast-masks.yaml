title: NOISe mouse osteoclast instance segmentation dataset (TRAP-stained culture wells)
short_name: Mouse osteoclast instance masks (brightfield)
description: Expert-annotated instance segmentation of in vitro mouse osteoclasts (TRAP-stained, cultured on 96-well plastic
  plates), released with the NOISe paper (CVPR 2024 CVMI workshop). The released Mouse.zip holds 35,587 RGB 832x832 PNG patches
  in five batches m1-m5, each with a YOLOv8 polygon label file per patch. The paper reports about 2e5 expert osteoclast masks
  in ~150 mouse well images.
