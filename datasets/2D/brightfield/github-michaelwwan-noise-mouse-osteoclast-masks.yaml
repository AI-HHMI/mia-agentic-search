title: NOISe mouse osteoclast instance segmentation dataset (TRAP-stained culture wells)
short_name: Mouse osteoclast instance masks (brightfield)
description: Expert-annotated instance segmentation masks of in vitro mouse osteoclasts (TRAP-stained, cultured on 96-well plastic plates), released with the NOISe paper (CVPR 2024 CVMI workshop). The repository describes full slide images with instance segmentation annotations plus the patches used for training and validation, split into batches m1-m5 with images/ and labels/ folders (YOLOv8 layout). The paper reports about 2e5 expert osteoclast masks in ~150 mouse well images and 20,784 point-annotated nuclei in a subset.
