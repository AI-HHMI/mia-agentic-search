short_name: HAB phytoplankton species images (PlanktoScope)
description: Full-frame JPEG images (6-8 MB each, 8 or 12 megapixel sensors) from three versions of an open-hardware PlanktoScope
  flow microscope, organised by prototype version and, for the laboratory sets, by one folder per single-species Lugol-preserved
  phytoplankton culture (12 harmful-algal-bloom relevant species such as Alexandrium, Prorocentrum, Pseudo-nitzschia and Tetraselmis),
  plus an IMTA Lab Validation folder from an aquaculture site in Brazil.
