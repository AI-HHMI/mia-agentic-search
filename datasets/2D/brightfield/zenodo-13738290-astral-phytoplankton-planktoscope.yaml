  single-species Lugol-preserved phytoplankton culture (12 harmful-algal-bloom relevant species such as Alexandrium,
  Prorocentrum, Pseudo-nitzschia and Tetraselmis), plus an IMTA Lab Validation folder from an aquaculture site in Brazil.
