notes: 'Fifteen archives (version 3 in 12 zip parts, version 2 in one, version 1 in two); folders are split across the parts.
  Labels are the culture species per image (image-level, many cells per field). No linked paper. Twelve species named in the
  descriptor; Alexandrium firmaso is spelled as there. enricher: annotations source mixed: species = culture identity (manual),
  masks in Version 3 clean/ = automatic PlanktoScope segmentation (threshold, erode, dilate, close). enricher: pixel size
  1.01 um/px from metadata.json process_pixel (PlanktoScope v2.1, HQ Camera, 16 mm) for Versions 2 and 3; Version 1 has no
  metadata, so voxel_size_nm stays null. enricher: n_items = 2,942 raw frames (V1 348, V2 270, V3 2,324). organisms: one per
  species folder (folder name = species; V3 also Mixed species, IMTA lab Validation, EMA_viveiro).'
