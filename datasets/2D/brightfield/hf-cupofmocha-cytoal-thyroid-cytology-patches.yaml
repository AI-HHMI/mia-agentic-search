notes: 'The Hugging Face card holds only the license (CC BY-NC 4.0). File listing via the Hub API: 27,496 PNG patches in class folders 1-6 (4,569 / 4,727 / 4,565 / 4,478 / 4,468 / 4,689), 2.29 GB; one patch probed: 224 x 224 RGB. Patch counts and the six-class, three-pathologist TBSRTC annotation come from the paper abstract on the IEEE SPS page (full text not open access, no DOI found), as does 138 WSIs; which TBSRTC category each folder number is, the stain, scanner, magnification and pixel size are not stated anywhere read, so voxel size is null. Organism is assumed human (thyroid cytology). No train/test split is provided.'
