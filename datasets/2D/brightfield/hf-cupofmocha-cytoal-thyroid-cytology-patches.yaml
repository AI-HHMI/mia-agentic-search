description: 27,496 RGB cytology image patches (224 x 224 px PNG) cut from 138 thyroid cytology whole-slide images collected 2021-2023, sorted into six class folders (1-6) that the paper describes as six categories annotated by three pathologists following the Bethesda system (TBSRTC). File names carry the slide id and the row/column of the patch in the whole-slide image. Released with the Cyto-AL active-learning code.
