notes: >-
  Zip listings: Images.zip (7.0 GB) holds 4 Olympus VS120 slides (.vsi + .ets stacks); the QuPath zip holds 16 .qpdata
  files, 12 label TIFFs and svg overlays of ground truth, baseline and trained results per region. Paper Methods: 24
  training and 3 validation squares were corrected manually in iterative cycles with Cellpose predictions, hence mixed.
  The paper reports 0.346 um per pixel. Only 4 whole-slide images are included, so item count is small; the full Nissl
  collection of over 2000 images is in separate Zenodo records (for example 10.5281/zenodo.11544829 links the QuPath
  projects). Formats are vendor files with no listed enum value, so other.
