title: Example datasets for BluVision Haustoria
short_name: Cereal GUS cells and haustoria (brightfield)
description: Training, validation and test sets from the BluVision Haustoria pipeline for cereal-powdery mildew
  infection assays. Brightfield tiles of GUS-stained barley/wheat leaf epidermis come as two YOLOv5/v8 object-detection
  sets (1,503 images with GUS-positive cell boxes, and 1,968 images with haustoria boxes), plus a CNN classification
  set of about 8,950 cropped cells split into gus (without haustoria) and hau (with haustoria) folders.
