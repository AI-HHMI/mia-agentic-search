title: 'LyNSeC: Lymphoma Nuclear Segmentation and Classification'
short_name: DLBCL nuclei segmentation (H&E and IHC)
description: Annotated diffuse large B-cell lymphoma histology images with nucleus contours. LyNSeC 1 has 379 IHC
  images (512x512 px, 40x; CD3, Ki67, ERG) with marker-positive/negative nucleus classes (87,316 nuclei). LyNSeC
  2 has 280 H&E images (65,479 nuclei) and LyNSeC 3 has 40 H&E images (8,452 nuclei, tumor/non-tumor classes). Pretrained
  HoVer-Net-based models are also provided.
