notes: 'Image counts from the zip listing: Train 1,220 images and 1,213 masks, Validation 250 images and
  250 masks (7 train images have no mask). No licence is stated on the dataset page, only a request to
  cite the NuClick paper, so licence is unknown. The paper is not open access (abstract only), so the
  microscope, magnification, pixel size, staining and source/species of the blood smears are not known;
  modality brightfield is inferred from "blood smear images" and organism is left empty. Annotation source
  is mixed because the page says masks were produced with the NuClick interactive framework. The IHC lymphocyte
  set is a separate record. enricher: one image and two masks sampled; channels 3 (RGB PNG, was null);
  mask values are consecutive 0..N, so instance IDs are likely but not documented.'
