notes: 'Image counts from the zip listing (peek_archive): Train 1,220 images and 1,213 masks, Validation 250 images and 250
  masks (7 train images have no mask in the listing). No licence is stated on the dataset page, only a request to cite
  the NuClick paper, so licence is unknown. The paper is not open access (only the abstract and the arXiv abstract page were
  read), so the microscope, magnification, pixel size, staining and source/species of the blood smears are not known;
  modality brightfield is inferred from "blood smear images" and organism is left empty. Annotation source is mixed
  because the page says masks were produced with the NuClick interactive framework (single clicks by an annotator
  plus a CNN). Mask encoding (instance IDs vs binary) was not checked. Data are one half of the NuClick release; the
  IHC lymphocyte set is a separate record.'
