notes: 'README (read in full): 4,098 fields of view from 16 slides, 6 sites, 3 years; images annotated
  with labelImg; annotation schemes all-0taxon (3 labels), all-5taxa (8 labels) and 1taxon for Pinaceae,
  Buxus, Poaceae, Quercus, Oleaceae. peek_archive: IMAGES.zip 4,098 JPG (5.6 GB), ANNOTATIONS.zip 13,578
  txt files. Also in the record: YOLOv5_trainedmodels_lastweights.zip (460 MB). The paper is not open
  access (Europe PMC abstract only), so microscope, magnification and image pixel dimensions are not known:
  voxel_size_nm null, only the 214 um field of view is stated in the README. Modality brightfield is inferred
  from "light microscopy" in the README. Organism is empty (a mix of taxa plus debris). The paper describes
  5-fold cross-validation, but the record has no split files. enricher: channels 1 (sampled JPEG is greyscale,
  mode L; was 3); size_bytes all 4 files (file-listing); download_url now the record page (images and
  annotations are separate zips).'
