notes: 'Figshare API lists three files: data.xlsx (labels, 85.8 kB), Abnormal.zip (4.29 GB) and Normal.zip (7.39 GB), 11.7 GB in
  total (one direct file per class, so download_url is null). peek_archive on Abnormal.zip shows 1,231 PNG files in
  Abnormal/ (one more than the 1,230 stated; Normal.zip was not listed). Labels are two image-level classes, not pixel
  annotations; the paper evaluates classification, image retrieval and 2-way 1-shot few-shot learning but no fixed
  train/test split is provided. Magnification 100x with no pixel size stated. Code repository linked from the data
  availability statement.'
