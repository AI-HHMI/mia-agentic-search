title: 'CAISHI: A benchmark histopathological H&E image dataset for cervical adenocarcinoma in situ identification, retrieval and few-shot learning evaluation'
short_name: Cervical adenocarcinoma in situ H&E (CAISHI)
description: 2,240 H&E-stained cervical histopathology images (Zeiss Axio Scope.A1, 100x, 3840 x 2160 px PNG) from Shengjing
  Hospital of China Medical University, 1,010 of normal cervical glands and 1,230 of cervical adenocarcinoma in situ
  (AIS), taken from 52 AIS and 60 normal-cervix patients. Labels are image-level (normal vs AIS) in data.xlsx and
  by folder (Normal / Abnormal); the paper uses the data for classification, content-based image retrieval and
  few-shot learning.
