notes: 'Figshare API lists three files: data.xlsx (labels, 85.8 kB), Abnormal.zip (4.29 GB) and Normal.zip
  (7.39 GB), 11.7 GB in total. peek_archive on Abnormal.zip shows 1,231 PNG files in Abnormal/ (one more
  than the 1,230 stated). Labels are two image-level classes, not pixel annotations; the paper evaluates
  classification, image retrieval and 2-way 1-shot few-shot learning but no fixed train/test split is
  provided. Magnification 100x with no pixel size stated. Code repository linked from the data availability
  statement. enricher: despite the .png names, members are JPEG or BMP by content (formats png -> jpeg,
  BMP not in the enum); Normal.zip listed: 1,011 files, so n_items 2240 -> 2242.'
