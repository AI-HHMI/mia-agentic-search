notes: Landing page (orda.shef.ac.uk) returned 403 to the fetcher; metadata, license
  and file list were read from the Figshare API (record 25604421), README, and zip
  listings. Physical pixel size not stated in README, file list, Image_Resolution.txt
  (pixel dimensions only) or the MorphoSeg preprint; images are mobile-phone captures
  through the eyepiece, cropped and brightness-adjusted in ImageJ, so not calibrated.
  Only the training set (36 images) has ROI JSONs in the listing; training_dataset.zip
  has 36 TIFFs, test_dataset.zip 69 TIFFs without ROI files. The paper describes 36
  of 105 images fully annotated (2,425 cells) and an 80/20 train/test partition for
  patches. The README lists testing_dataset.zip and the file is test_dataset.zip.
  Journal paper (Neurocomputing 647:130511) is not open access; read the arXiv preprint
  (2409.17110). Figshare description says related publication awaiting submission
  (older text).
