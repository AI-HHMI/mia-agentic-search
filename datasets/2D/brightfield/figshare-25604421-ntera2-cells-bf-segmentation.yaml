title: Dataset of Ntera-2 cells for Segmentation
short_name: Ntera-2 cell outlines (brightfield)
description: 105 high-resolution brightfield TIFF images (about 2800-3000 px per side) of Ntera-2 (NT2) pluripotent carcinoma cells
  on days 11-12 of all-trans-retinoic-acid differentiation, imaged with a mobile-phone camera on a Leica DM IRB microscope at 10x and
  20x. 36 images are fully annotated with manually drawn cell outlines (2,425 cells, ImageJ ROI JSON); the files are split into training
  and test folders.
