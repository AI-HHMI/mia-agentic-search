notes: 'Thirteen files (1.2 GB) per the Dryad file listing: train.zip 69 MB, valid.zip 13 MB, test.zip
  4 MB, arabidopsis.zip, barley.zip, sugarcane_analysis.zip, RF_DETR and YOLOv12 augmented/unseen-test
  zips and trained weights, README.md. Dryad file downloads need a bearer token (HTTP 401), so zip contents
  and the README could not be listed or read; image format, per-split counts and label files are taken
  from the Dryad abstract and methods text (450 images, 80/20 or 80/15/5 splits, labelme masks converted
  to YOLO and COCO), not from the files, so formats is other. The paper is a bioRxiv preprint (abstract
  only in Europe PMC, full text not open). Modality brightfield is inferred from the Olympus BX53 transmitted-light
  setup and not stated. Training images were augmented in separate zips. enricher: the GitHub README says
  550 images (100 with open stomata), annotated in LabelMe with classes "stomata" and "pore"; the record
  says 450.'
