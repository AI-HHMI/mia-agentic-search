notes: 'Kaggle record (CC BY-NC-SA 4.0, 3.4 MB) and complete file listing: EBs has 165 images, 165 manual masks and 165 OrganoLabeler
  masks; BO has 133 images, 133 manual masks and 133 OrganoLabeler masks. Paper Methods (PMC11579745): brightfield images,
  2464 x 2056 px, 10x objective, inverted Zeiss Axiovert with Axiocam 705 color camera, resized to 256 x 256 for analysis;
  manual reference masks made in ImageJ; the Data Availability statement points to this Kaggle dataset. Pixel size not stated.
  The paper also uses a public enteroid dataset (299 images) that is not part of this record. enricher: files are 256 x 256
  (sampled); masks near-binary 0/255 with soft resized edges; channels 3 (RGB images, was null); download_url is the Kaggle
  archive API URL. source mixed: */masks|mask = manual (ImageJ), */organolabeling_masks = OrganoLabeler (automatic).'
