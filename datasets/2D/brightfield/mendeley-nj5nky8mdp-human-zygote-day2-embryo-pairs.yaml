notes: 'Annotations are image-level scores and grades (no masks or boxes), although the page lists pronuclei/blastomere
  detection and segmentation as intended uses. Formats: 264 BMP and 512 JPG; BMP is not in the schema
  list, so only jpeg is listed. No related paper yet (README cites a forthcoming Data in Brief article).
  Pixel size not stated (two magnifications, x150 and x200). enricher: size 514569003 B from Mendeley
  file API (was null); download_url = the one zip (was null); channels 3 = RGB per README and sample (was
  null); annotations verified from metadata.csv in the zip.'
