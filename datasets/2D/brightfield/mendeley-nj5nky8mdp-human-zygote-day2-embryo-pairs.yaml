title: 'Human Zygotes at the 2PN Stage and the Same Embryos on Day 2 after ICSI: a Paired Image Dataset'
short_name: Human zygote and day-2 embryo pairs (brightfield)
description: 776 brightfield images (BMP and JPG, 1280x1024) of 388 human embryos from 100 ICSI patients,
  each imaged as a 2PN zygote and again on day 2, with per-image embryologist annotations (pronuclear
  scores; blastomere count, fragmentation, embryo grade) and five predefined patient-level folds.
