notes: 'The zip listing shows 129,175 entries in total: 110,823 jpg, 18,350 tiff, one abbreviations.txt and one
  AML-Cytomorphology.sums checksum file, so n_items counts all of them and is an upper bound for images (about 129,173 image
  files). Class labels come from folder names and the Dataset_README, which describes mapping three source datasets (AML-Cytomorphology,
  Raabin-WBC, Multi-focus WBC) onto 14 classes. The catalog holds other blood-cell sets (zenodo-14277609-mll23-peripheral-blood-cells, tcia-axh3-t579-bone-marrow-cytomorphology), which are different datasets. Per-class counts, pixel size and microscope are not stated on the record or in the README;
  the README says the associated publication is still "to be added", and the three source papers were not read. Licences of
  the sources may differ from the record''s CC-BY-4.0. Coverage is marked dense because every image sits in a class folder.'
