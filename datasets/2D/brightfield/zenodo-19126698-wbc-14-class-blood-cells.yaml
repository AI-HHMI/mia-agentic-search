notes: 'Class labels come from folder names and the Dataset_README, which maps three source datasets (AML-Cytomorphology,
  Raabin-WBC, Multi-focus WBC) onto 14 classes. The catalog holds other blood-cell sets (zenodo-14277609-mll23-peripheral-blood-cells,
  tcia-axh3-t579-bone-marrow-cytomorphology), which are different datasets. The README says the associated publication is
  "to be added". Licences of the sources may differ from the record''s CC-BY-4.0. Coverage dense: every image sits in a class
  folder. enricher: n_items 129,173 image files (was 129,175 zip entries incl. 2 text files); size_bytes = all 3 Zenodo files
  (was zip only). Voxel size left null: subsets differ (400x400 AML TIFFs, 575x575 Raabin JPEGs, 200x200 multi-focus JPEGs
  from a 50x objective).'
