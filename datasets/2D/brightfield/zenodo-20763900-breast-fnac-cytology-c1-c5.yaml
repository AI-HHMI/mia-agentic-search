title: A Multi-Center Breast FNAC Cytology Dataset for AI-Assisted Patch-wise Classification Using C1-C5 Reporting Categories
short_name: Breast FNAC cytology patches C1-C5 (brightfield)
description: 7,398 PNG patches extracted from 446 Papanicolaou or May-Grunwald-Giemsa stained breast fine needle aspiration
  cytology whole-slide images (470 WSIs, 321 patients, multi-centre India, Hamamatsu NanoZoomer S360, 40x), each labelled
  by an expert with a breast FNAC reporting category C1-C5 (stored as folders I-V), plus per-WSI GeoJSON rectangle annotations
  in level-0 coordinates and de-identified metadata. The WSIs themselves (NDPI) are in 21 linked Zenodo records.
