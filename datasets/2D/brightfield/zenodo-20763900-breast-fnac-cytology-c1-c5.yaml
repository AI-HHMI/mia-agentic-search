notes: 'patches.zip lists 7,398 PNGs in 447 slide folders with class folders I (33), II (3,706), III (478),
  IV (402), V (2,779), matching the paper (C1 33, C2 3,706, C3 478, C4 402, C5 2,779); geojson.zip has
  470 files. Zenodo page text says 7,393 patches while the paper and the zip say 7,398; the zip count
  is used. Pixel size 0.25 um comes from the paper (WSI resolution), the patches are crops of the WSIs
  at that resolution. The 470 NDPI WSIs (about 950 GB total) are in 21 separate linked Zenodo records
  and are not counted in size_bytes. Patches vary in size. No train/val/test split is stated. Paper read
  via arXiv PDF (Europe PMC does not index it). enricher: size_bytes now the full record listing (4 zips,
  9,641,916,738 B, was patches.zip only); PNGs are RGBA.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  4 files, 9.6 GB (Zenodo 20763900; the 470 NDPI WSIs are in 21 linked records, not listed)\n\
      \  patches.zip       7,398 PNG\n    patches/<WSI id>/<I|II|III|IV|V>/<WSI id>_<x>_<y>.png   (447\
      \ WSI folders; I=C1 .. V=C5)\n  geojson.zip       470 .geojson (8.9 MB)\n    geojson/<WSI id>.geojson\
      \   rectangles in level-0 WSI coordinates, classification.name I-V\n  metadata.zip      9 files\
      \ (8 .csv + README_metadata_release.md)\n  wsi-manifest.zip  1 .csv (links WSI stems to the WSI\
      \ records)"
    n_files: 4
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/20763900/files/patches.zip::patches/07BL066241P/II/07BL066241P_21294_43242.png
    - https://zenodo.org/records/20763900/files/geojson.zip::geojson/07BL066241P.geojson
    size_bytes: 305201
    description: One C2 (II) patch of WSI 07BL066241P and that WSI's GeoJSON (its first box is this patch).
  arrays:
  - role: raw
    path_pattern: patches/*/*/*.png
    format: png
    axes: yxs
    shape:
    - 387
    - 460
    - 4
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 30
    - 255
    normalization: none
    alignment: not-applicable
    alignment_notes: 'RGBA PNG; patch sizes vary (387x460, 989x888, 382x476 in WSI 07BL066241P; README:
      patches vary in size). Class label = parent folder I-V (README: I=C1 insufficient, II=C2 benign,
      III=C3 atypical, IV=C4 suspicious, V=C5 malignant).'
  - role: label
    path_pattern: geojson/*.geojson
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: polygons
    classes:
    - id: I
      name: C1 insufficient or inadequate
    - id: II
      name: C2 benign
    - id: III
      name: C3 atypical
    - id: IV
      name: C4 suspicious for malignancy
    - id: V
      name: C5 malignant
    alignment: offset
    alignment_notes: 'One GeoJSON per WSI; each rectangle (level-0 WSI pixels) is one patch: patch file
      <WSI>_<x>_<y>.png has its top-left at (x, y) and the box size equals the patch size (21294,43242
      to 21754,43629 = 460 x 387 for the sampled patch). 446 of 470 WSIs have patches.'
  notes: 'Listed with tools/listing.py (Zenodo, zips expanded): 4 files, 9,641,916,738 B, 7,878 members;
    this covers the record, not the ~950 GB of WSIs in the 21 linked records. Probed 3 PNGs of WSI 07BL066241P
    (RGBA uint8). Sampled one patch (305 KB): min 30, max 255, mean 207 over all 4 samples, one sample
    only; alpha not checked separately. normalization none is inferred (8-bit scanner RGB). Read README_metadata_release.md
    (class map, folder layout) and 07BL066241P.geojson.'
