notes: 'patches.zip lists 7,398 PNGs in 447 slide folders with class folders I (33), II (3,706), III (478), IV (402),
  V (2,779), matching the paper (C1 33, C2 3,706, C3 478, C4 402, C5 2,779); geojson.zip has 470 files. Zenodo page text
  says 7,393 patches while the paper and the zip say 7,398; the zip count is used. Pixel size 0.25 um comes from the
  paper (WSI resolution), the patches are crops of the WSIs at that resolution. The 470 NDPI WSIs (about 950 GB total)
  are in 21 separate linked Zenodo records and are not counted in size_bytes, which is the patches.zip size (the
  main record files total 9.6 GB). Patches vary in size. No train/val/test split is stated. Paper read via arXiv PDF
  (Europe PMC does not index it).'
