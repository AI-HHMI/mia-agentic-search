title: SDTB - sperm detection in microscopic testicular tissue sections from azoospermia patients
short_name: Testicular tissue sperm detection (brightfield)
description: Microscopic images of testicular tissue sections from 15 azoospermia patients (45 to 148 images per patient) with
  sperm annotated by one physician and reviewed by a second, for small-object sperm detection that simulates sperm selection
  during testicular puncture. Split by patient into 689 training, 346 validation and 306 test images.
