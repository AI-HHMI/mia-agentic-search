notes: 'SDTB_publish.zip (1.26 GB) needs an IEEE DataPort login, so contents, image format and the annotation format could
  not be listed; annotation type bounding-box is inferred from the page describing sperm detection of tiny objects and is
  unverified. No dataset paper is linked on the page and a web search found none, so publications is empty; a later paper (SpermYOLO, arXiv 2609.14278) uses SDTB as a detection benchmark (mAP50) without describing the annotation format. Images were 1320x1080 px, resized and padded
  to 640x640; Nikon ECLIPSE Ti at 200x; staining not mentioned. n_items is 689 + 346 + 306 images. Sperm are tiny (average
  about 9.9 px, over 99% under 16x16 px). Pixel size not stated.'
