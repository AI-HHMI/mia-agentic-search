title: High-Power Field Peripheral Blood Smear Images for Leukemia Classification (AML, ALL, CLL, CML, Reactive, Normal)
short_name: Leukemia peripheral blood smears (brightfield)
description: 2,832 high-power-field (100x oil) microscopy images of Wright-Giemsa / May-Grunwald-Giemsa stained peripheral blood smears, sorted into class folders (AML including APL, ALL, CLL, CML, normal/reactive) by hematopathologists. It is the training and internal-test set of a hierarchical deep-learning leukemia classifier (Sheikh Shakbout Medical City, Abu Dhabi).
