notes: 'The zip holds 2,832 images (1,895 PNG, 937 JPEG), fewer than the 4,282 training plus internal-validation images in the paper, and no train/validation split is given. The ALL folder was seen in the listing; the other class folders follow the record description (APL inside AML, reactive inside Normal). Paper (Methods read via the publisher page; the Europe PMC full text is not open): Olympus BX53 at 1000x oil, images mostly 1,200 x 1,600 px, physical pixel size not reported, labels assigned by two pathologists (the Zenodo text says three). External validation set is not released. Zenodo states non-commercial use only (CC-BY-NC-4.0). Pixel size not found on the Zenodo page or in the paper.'
