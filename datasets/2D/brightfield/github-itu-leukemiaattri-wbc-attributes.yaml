notes: 'Read the GitHub README, lab page and arXiv paper. Paper: 28.9K images in total, about 2.4K annotated at 100x, 10.3K
  WBCs and 55K attribute labels in the abstract, but Table 1 lists 88,294 WBCs (conflict). Stain, pixel size and patient count
  not stated. No LICENSE file in the repo; the CC BY-NC-SA on arXiv covers the paper only, so the dataset license is unknown.
  Two hematologists annotated each cell; labels were transferred by homography to other magnifications and verified. The larger
  journal-extension dataset (arXiv 2504.02602) is not described here. enricher: Drive listing read: 25,790 PNGs (640x640 RGB)
  in 11 subsets, L_10X_C1 empty; formats png, n_items 25790, channels 3 (were null/other). Pixel size per subset not stated.'
