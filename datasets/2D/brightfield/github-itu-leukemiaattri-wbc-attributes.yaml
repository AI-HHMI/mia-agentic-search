notes: 'Read the GitHub README, lab page and arXiv paper. Images are in a Google Drive folder whose listing could not be read, so the image format, count and size are unknown (formats other). Paper: 28.9K images in total, about 2.4K annotated at 100x, 10.3K WBCs and 55K attribute labels in the abstract, but Table 1 lists 88,294 WBCs (conflict). Stain, pixel size and patient count not stated. No LICENSE file in the repo; the CC BY-NC-SA on arXiv covers the paper only, so the dataset license is unknown. Two hematologists annotated each cell; labels were transferred by homography to other magnifications and verified. The larger journal-extension dataset (arXiv 2504.02602) is not described here.'
