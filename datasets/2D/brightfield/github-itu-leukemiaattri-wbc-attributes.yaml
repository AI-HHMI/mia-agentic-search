schema_version: '1.2'
id: github-itu-leukemiaattri-wbc-attributes
title: A Large-scale Multi Domain Leukemia Dataset for the White Blood Cells Detection with Morphological Attributes for Explainability (LeukemiaAttri)
short_name: Leukemia WBC boxes with attributes (brightfield)
description: Peripheral blood smear images from leukemia patients captured with a high-cost and a low-cost
  microscope at 10x, 40x and 100x through several cameras. Hematologists annotated white blood cells of
  14 types (plus artifacts) with bounding boxes and seven morphological attributes (cell size, nuclear
  chromatin, nuclear shape, nucleolus, cytoplasm, cytoplasmic basophilia, cytoplasmic vacuoles) on the 100x
  images, and the annotations were transferred to the other magnifications and devices. COCO and
  attribute-extended YOLO label formats are provided with train/test folders.
