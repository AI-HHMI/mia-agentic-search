  not images. Microscope Nikon Eclipse CI, 100x oil objective with 10x ocular, photographed with a smartphone on
  a universal holder; pixel size not stated. License CC BY 4.0 on the Mendeley page and in the paper. Publication
  date is the Mendeley version-1 date (4 Dec 2024). A related Scientific Reports paper (10.1038/s41598-024-61420-9)
  describes an earlier, smaller release.'
