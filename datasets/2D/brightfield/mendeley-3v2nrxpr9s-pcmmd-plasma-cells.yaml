title: 'PCMMD: Plasma Cells for Multiple Myeloma Diagnosis'
short_name: Bone marrow plasma cells, myeloma (brightfield)
description: Smartphone-on-microscope images of Wright-Giemsa-stained bone marrow aspirate smears from patients with
  and without multiple myeloma, with expert bounding boxes labelling plasma versus non-plasma cells (3,546 labelled
  training cells, 2,021 cells grouped by patient diagnosis for testing) and a segmentation subfolder of individually
  segmented cells without background (1,615 plasma and 1,931 non-plasma), with 5-fold cross-validation configs.
