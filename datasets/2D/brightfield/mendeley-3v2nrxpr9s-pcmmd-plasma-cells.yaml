  notes: 'Mendeley web API: folders/1 gives 43 folders; files?folder_id returns at most 512 or 1000 entries
    per folder and ignores paging, so the large folders (detection/train, segmentation/*) are truncated
    and the listed sum (5,724 files, 1.43 GB) is a lower bound; size_bytes stays null. Patient folders
    are complete (344 images + 344 labels). Sampled: patient-08 JPEG (911,283 B, RGB 4000 x 1800, values
    [0, 235]) + its YOLO txt (3 boxes, class 1); a segmentation crop (3,904 B, 234 x 221, [120, 244])
    + AnyLabeling JSON (5,301 B); mieloma_final.yaml. Values from single images. Files must be fetched
    one by one via public-files/<id>/file_downloaded (302 to S3); the probe (python requests) gets HTTP
    403 from Cloudflare there, curl works, so TensorSwitch fetching is doubtful. Voxel size not found;
    checked: JPEG headers (72 dpi only), Mendeley description, record notes (paper: smartphone through
    10x ocular, no pixel size).'
