title: 'BBBC011: C. elegans metabolism assay (oil red O fat staining)'
short_name: C. elegans oil red O fat staining (brightfield)
description: Control images from an RNAi screen for genes affecting fat mass in C. elegans, stained with oil red O.
  Negative control is empty vector L4440 (wild-type fat distribution), positive control is daf-2 RNAi (increased fat).
  50 brightfield 8-bit PNG images (downscaled to 691x770 px from 2674x3078) - 29 L4440 and 21 daf-2 (one replicate).
  Labels are the control class of each folder, not pixel annotations.
