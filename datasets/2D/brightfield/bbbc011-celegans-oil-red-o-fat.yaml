notes: 'No licence is stated on the BBBC011 page (only a Broad Institute copyright line), so the licence is left
  unknown. The page gives no image total; the zip lists 50 .png files (29 in L4440_rep1, 21 in daf-2_rep1).  Channel
  count is not stated on the page. Authors of the image set are not named. Pixel size not stated; imaged on a Zeiss
  Axioscope with Biovision upgrade, per the page. The oil red O paper (O''Rourke 2009) is not open access (abstract
  only read), and the main BBBC paper (Ljosa 2012) has no open full text. enricher: channels 3 (RGB colour PNG,
  per header and sample; was null).'
