notes: 'Sources: figshare API record (CC BY 4.0; Honey pollen Dataset.rar, 53.8 MB, plus three loose sample
  JPEGs) and the rar file headers read by range. The rar holds train 652 / valid 105 / test 54 JPEGs (640x640
  RGB) with one .txt label each: 811 images, Roboflow augmented copies of only 150 source photos (IMG_<n>),
  and 54 source photos appear in more than one split, so the shipped split leaks; the description says
  493. Label file contents (box vs polygon, class ids) were not read. No paper found; pixel size, microscope
  and annotator not stated. Organism: record tags name Acacia concurrens and Trifolium pallescens; the
  Sidr (tagged SIDRA) species is not stated. Different from the catalogued honey pollen set zenodo-10017809
  (17 taxa). enricher: n_items 493 -> 811 and splits_provided from the rar listing.'
