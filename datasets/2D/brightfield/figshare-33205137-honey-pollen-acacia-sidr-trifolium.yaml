notes: 'Everything here comes from the figshare API record (the only page read): CC BY 4.0, a single 53.8 MB rar archive (Honey pollen Dataset.rar) plus three sample JPEGs whose names (.rf.<hash>) suggest a Roboflow export. The rar cannot be listed remotely, so the image count (493), the annotation files and their format (bounding boxes assumed from the description "annotated for pollen localization ... detection using DETR") and any train/val/test split are taken from the description, not verified. No paper or data-descriptor was found or listed on the page, pixel size and microscope are not stated, and who annotated is unknown. Organism: the record tags name Acacia concurrens and Trifolium pallescens; the Sidr (tagged SIDRA) species is not stated. Augmented copies may be present (Roboflow-style names), which could mean fewer than 493 independent images. Different from the catalogued honey pollen set zenodo-10017809 (17 taxa).'
