short_name: Bacteria brightfield instance masks (Omnipose)
description: Brightfield images with ground-truth instance label masks used to train the Omnipose brightfield
  model. Image sets of Escherichia coli and Burkholderia thailandensis (plus E. coli / S. aureus brightfield
  images taken from DeepBacs), annotated by the Wiggins Lab (University of Washington). Four zip folders
  list as paired *_bf_warped.tif images and *_labelmasks.tif masks.
