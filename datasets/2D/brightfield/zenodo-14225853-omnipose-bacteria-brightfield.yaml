notes: >-
  Five zips on Zenodo: ecoli.zip (112 image/mask pairs), bthai.zip (255 pairs), superscopegfp.zip (62 pairs),
  deepbacs.zip (about 9 image/mask pairs, plus edited masks) and superscopepal.zip (11 MB, listing failed with
  an SSL error this run, so not counted). n_items 429 = the first three listed zips; size_bytes is the sum of
  all five. Pixel size is not stated on the Zenodo page or in the paper's text that was searched. The paper
  describes in-house imaging on a Nikon Ti-E with 60x and 100x 1.4 NA objectives; which images use which is
  not stated. The record text says the fluorescence images for some sets are available on request, and the
  DeepBacs-derived images are CC-BY-4.0 originals. The Zenodo record is CC-BY-NC-4.0. The paper's own phase
  dataset is a separate record (osf-xmury-omnipose-bact-phase).
