short_name: HeLa multi-class segmentation (reflected light)
description: 650 RGB reflected-light images (1024 x 1024 px, 8-bit) of living HeLa cells from time-lapse experiments on a custom
  telecentric wide-field microscope with an LED ring light, each manually labelled with a multi-class ground-truth mask. Provided
  with train / validation / test folders and used to compare U-Net variants (best ResNet34-U-Net, mean IoU 0.81).
