notes: 'Seven zips (one per cell line, SNU-1-drug separate), each laid out as <cell
  line>/<20X|40X>/<train|test>/<BF_images|RF_images>/*.tif; pair counts from zip listings:
  HeLa 113 (20X 23, 40X 90), MCF-7 15, H9C2 7, HepG2 19, LX-2 77, SNU-1 127, SNU-1-drug
  33 = 391 pairs (782 TIFFs). Training signal is image-to-image (bright-field input,
  real fluorescence target), so annotations.types and ml.tasks are "other" (virtual
  fluorescence reconstruction). Zenodo record cites an associated CellVFL publication
  and code repository but gives no link; no matching paper found in Europe PMC/Crossref,
  so the fluorescent stain/target structure, pixel size and microscope are not stated
  on the record and unverified. Record published 2026-10-12, so it may still change.
  No separate download_url: files are the seven per-cell-line zips listed under the
  landing page. organisms: Rattus norvegicus = H9C2.zip; Homo sapiens = the other 6 zips.'
