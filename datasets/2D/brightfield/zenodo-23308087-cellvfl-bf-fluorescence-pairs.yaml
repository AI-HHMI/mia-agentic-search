description: Paired bright-field (BF) and real fluorescence (RF) microscopy TIFF images
  of six cell lines (HeLa, MCF-7, H9C2, HepG2, LX-2, SNU-1, plus a drug-treated SNU-1
  set) at 20X and/or 40X, for virtual fluorescence reconstruction from label-free
  bright-field images. 391 image pairs in predefined train/test folders.
