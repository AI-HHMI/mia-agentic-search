notes: 'Read the Kaggle API record and full file listing (v2 folder: train Normal 316 + Macros 40 images, test Normal 28 +
  Macros 27, each with JSON box files; an older copy of the same layout sits next to it) and the NeurIPS Datasets and Benchmarks
  paper via its arXiv HTML. Train set has 55,423 boxes (annotators A and B, time t0). Organoid types Normal and Macros are
  not separate classes. The 35.4 GB Kaggle total includes both layouts, so the single-copy size is smaller; I did not work
  out by how much. Pixel size 1.29 um comes from the Kaggle description. Kaggle downloads normally need a free account (not
  tested here). The paper states CC BY-NC-SA 4.0. Date is the Kaggle last-updated date (v2 adds the t1 label sets).'
