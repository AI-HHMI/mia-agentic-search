title: 'MultiOrg: multi-rater lung organoid detection dataset (bright-field, whole-well images)'
short_name: MultiOrg lung organoid boxes (brightfield)
description: 411 stitched, maximum-projected bright-field TIFF images of whole wells of murine lung organoids from 26 studies
  (1.29 um pixels), with about 60,000 organoids boxed by two expert annotators. The test set has three label sets (annotator
  A and B at time t0 and again at t1) so label noise can be measured; train and test folders are provided.
