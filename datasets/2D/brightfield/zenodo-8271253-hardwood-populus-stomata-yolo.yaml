notes: 'Zip: 10,715 .jpg plus 10,715 YOLO .txt in one flat folder, 9.3 GB; a CSV outside the zip lists species, magnification,
  size and resolution per image. Per the paper, 1,000 images were labelled manually to train a YOLO model (StoManager1) that
  labelled the rest, with review, hence source mixed. Imaging per paper Methods: 10X eyepiece, 20X or 40X objective; microscope
  and camera not stated. Brightfield is inferred (nail-polish peels), not stated. No split shipped. enricher: organism list
  now the 18 taxa of the CSV ScientificName column (was 6, partly genus level); STMHD files map to taxa via the CSV. enricher:
  voxel size stays null: CSV Resolution (pixels per 0.1 mm) is 118, 239, 465, 476 or 930 depending on magnification (100x/200x/400x)
  and image size.'
