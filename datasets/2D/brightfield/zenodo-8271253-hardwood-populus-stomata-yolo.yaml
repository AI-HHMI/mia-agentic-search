notes: 'Zip listing (peek_archive): 10,715 .jpg plus 10,715 YOLO .txt files, 9.3 GB. Per the paper, 1,000 images were labelled
  manually to train a YOLO model (StoManager1) that was used to label the rest, with labels reviewed, hence annotation source
  mixed. Imaging per paper Methods: microscope slides with 10X eyepiece and 20X or 40X objective; the microscope model and
  camera are not stated. Pixel size is not a single value: the accompanying CSV gives per-image resolution (pixels per 0.1
  mm), so voxel_size_nm is null. Organisms listed at genus/species level for the taxa the paper and record name; the full
  list covers 17 hardwood species and seven Populus taxa. No train/val/test split is shipped (the paper recommends splitting
  in Roboflow). Brightfield is inferred from standard light-microscope nail-polish peels, not stated explicitly.'
