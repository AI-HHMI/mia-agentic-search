description: 'About 10.7k microscope images of leaf stomata (nail-polish peels on slides) from 17 hardwood species and 55
  Populus genotypes, each with a YOLO bounding-box label file for two classes: inner guard cell walls and whole stomata (aperture
  plus guard cells). A CSV lists species, magnification, image size and resolution (pixels per 0.1 mm) per image.'
