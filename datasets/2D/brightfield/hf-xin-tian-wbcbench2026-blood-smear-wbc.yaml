title: 'WBCBench 2026: white blood cell classification in peripheral blood smear images (pristine and degraded)'
short_name: White blood cell classification (brightfield)
description: 101,716 single-cell RGB crops (368x368 px JPEG) of white blood cells from Wright-Giemsa stained peripheral
  blood smears, imaged with CellaVision DI-60 analysers at 100x oil immersion, each labelled with one of 13 expert-annotated
  white-cell classes. Released as the ISBI 2026 WBCBench challenge with patient-level train/validation/test splits and a
  degraded (noise, blur, illumination) copy of the images for domain-shift testing.
