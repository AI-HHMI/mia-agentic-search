notes: The Zenodo record has no description; details come from the paper (open access, Europe PMC) and
  a zip listing (peek_archive, 61 files, 4.3 GB compressed). n_items is the paper's count of 2512 images,
  not a file count. The zip holds 2D+t TIFF stacks, so dimensionality is 2D with time, but the fission
  yeast .dv.tif stacks (DeltaVision R3D) were not checked for z-slices. Pixel size is not stated in the
  paper Methods or dataset page and was not read from headers, so voxel_size_nm is null. Ground-truth
  masks were re-annotated or corrected; the exact manual/automatic split is not stated, hence source mixed.
  Some sets (SJR5, YIT) have segmentation only, without lineage.
