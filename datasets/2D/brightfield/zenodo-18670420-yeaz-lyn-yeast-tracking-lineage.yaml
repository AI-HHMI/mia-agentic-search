short_name: Budding and fission yeast tracking (brightfield)
description: Time-lapse brightfield and fluorescence recordings of budding yeast colonies in microfluidic
  chips and fission yeast, with segmentation masks, frame-to-frame cell tracks and mother-daughter lineage
  ground truth (the paper reports 2512 annotated images and 78,852 tracklets), released to train and test
  the LYN-track and LYN-trace algorithms.
