  notes: 'Listing: all 9 files linked from the page (5,624,145,067 B, exact HTTP sizes). The 5 image .7z
    archives and Features_CELL.7z were listed by reading only each 7z end header with range requests (stdlib
    lzma; ~0.2 MB per archive); counts match the paper (966 cluster + 4,049 cropped images). The archives
    are solid 7z, so no member can be fetched or sampled without downloading a whole class archive (0.5-1.2
    GB, over the 500 MB budget): no sample, no BMP header probe. Every cluster BMP is 9,437,238 B, consistent
    with 2048x1536 24-bit (not verified from a header). The .dat contour files (cytoplasm/nucleus coordinates
    per Description_of_Features.pdf) were not read. Voxel size not found; checked: landing page, Description_of_Features.pdf,
