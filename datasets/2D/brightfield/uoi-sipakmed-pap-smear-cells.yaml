notes: 'From the lab page (relative links resolved to https://www.cs.uoi.gr/~marina/SIPAKMED/) and the
  ICIP 2018 paper. Images come as one .7z per class (5.18 GB total, sizes from HTTP headers); n_items
  = 4,049 cells + 966 clusters per the paper. CCD camera (Infinity 1 Lumenera) on an Olympus BX53F; magnification,
  pixel size and splits not stated. enricher: license custom; page and Description_of_Features.pdf: "publicly
  available and it can be used for experimental purposes with the request to cite" the ICIP 2018 paper.
  enricher: 7z headers read: BMP images, contour .dat files per cell (formats other: BMP is not a schema
  format); size from full listing.'
