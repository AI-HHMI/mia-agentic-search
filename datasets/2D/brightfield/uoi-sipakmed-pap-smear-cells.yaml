schema_version: '1.2'
id: uoi-sipakmed-pap-smear-cells
title: SIPaKMeD Database
short_name: SIPaKMeD Pap smear cervical cells (brightfield)
description: 4,049 images of isolated cervical cells manually cropped from 966 Pap smear cluster images
  (also included), classified by expert cytopathologists into five classes (Superficial-Intermediate,
  Parabasal, Koilocytotic, Dyskeratotic, Metaplastic). The paper states that the boundaries of the cytoplasm
  and nucleus of each cell were manually defined by experts and their contour coordinates are provided
  for both single-cell and cluster images. Hand-crafted cell features and deep features are also distributed.
