notes: 'Materials (not biological) microscopy: digital-microscope images of concrete. Magnification, microscope
  model and pixel size are not stated on the Mendeley page or in the preprint abstract (full text of the
  Research Square preprint is not open access in Europe PMC, so Methods could not be read); voxel_size_nm
  is therefore null. Zip listing (peek_archive): 1200 JPEGs, 27.2 MB uncompressed, first folder datamulty/processed/dense;
  1200 = 900 multi-class + 300 binary images per the description, folder layout beyond the first entries
  was not inspected. Images are processed 224x224 px; raw uncropped images are not released. Labels are
  folder-based classes; no bounding boxes or masks despite the micro-crack detection use, so the
  detection task is image-level (crack vs healthy). The 3 water-to-cement-ratio classes are the sample
  preparation, not an expert annotation; annotation source is not described.'
