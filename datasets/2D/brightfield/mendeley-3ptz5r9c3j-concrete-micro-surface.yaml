title: Concrete Micro-Surface Image Dataset
short_name: Concrete surface texture/cracks (light microscopy)
description: Processed digital-microscope images (224x224 px JPEG) of laboratory concrete surfaces cast
  at three water-to-cement ratios (0.35, 0.45, 0.55; dense, intermediate, porous). A 900-image multi-class
  subset (300 per class) is for surface-texture classification and a 300-image binary subset (150 cracked,
  150 healthy, dense surfaces only) is for micro-crack detection; labels are given by folder.
