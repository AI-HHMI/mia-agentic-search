notes: 'Materials (not biological) microscopy: digital-microscope images of concrete. Magnification, microscope
  model and pixel size are not stated on the Mendeley page or in the preprint abstract (preprint full
  text not open in Europe PMC); voxel_size_nm is null. Zip: 1,200 processed 224x224 JPEGs (900 multi-class
  + 300 binary); raw uncropped images are not released. Labels are folder-based classes; no boxes or masks,
  so crack detection is image-level. The water-to-cement-ratio classes are the sample preparation; annotation
  source not described. enricher: channels 3 (sampled JPEG is RGB, channels differ); download_url is now
  the S3 object behind the Mendeley link (file_downloaded answers 403 to range requests). organisms: none
  (concrete).'
