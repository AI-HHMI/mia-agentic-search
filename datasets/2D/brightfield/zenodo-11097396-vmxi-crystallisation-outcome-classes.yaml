short_name: Protein crystallisation outcomes (brightfield)
description: 18,782 JPEG micrographs (3376 x 2704 px) of protein crystallisation experiments imaged with a Rock Imager 1000 at the
  VMXi beamline of Diamond Light Source, of which 13,951 carry an expert outcome label (Clear, Crystals, Precipitate or Other). Train
  (11,161) and validation (2,790) lists are provided as CSV, plus an independent test set of 1,000 images labelled by three experts.
