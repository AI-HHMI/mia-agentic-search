notes: 'Zenodo API record (description read in full) and the zip listing (tools/peek_archive.py: 19,782 JPEG, 5 CSV files, about
  31.5 GB uncompressed) were used. Counts come from the record: 18,782 training-pool images, 13,951 labelled, split 11,161 train /
  2,790 validation, plus a separate 1,000-image test set with labels from three experts (632 unambiguous, 949 mostly unambiguous).
  The preprint (full text read) says labels were mapped from the 10 in-house VMXi outcome categories to four MARCO-style classes
  and that images come from the ISPyB LIMS with existing scores. Pixel size and magnification are not stated in the record or the
  paper text read. A different dataset from the CHiMP detector/mask set in the catalog (zenodo-11110373), which has 587 images
  with instance masks.'
