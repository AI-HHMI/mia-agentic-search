notes: 'Repository folders EMDS5-Original, EMDS5-GTS (single-object masks), EMDS5-GTM (multi-object masks) and README.txt;
  420 originals, 840 masks (1,260 images) per the paper. Probed EMDS5-g01-01.png: 507 x 338 RGB uint8, and its GTS mask 507
  x 338 gray. No license for the data was found in the repo (no LICENSE file) or the paper (article is CC BY 4.0; the data
  availability statement says all relevant data are within the manuscript), so license is unknown. Pixel size is not stated
  in the README or paper. The organism list is taken from the README class names; one class (Rotifera) and some others are
  not genus names and are omitted. enricher: size estimated (was null). Related to figshare-17125025-emds-6-microorganisms,
  a different version of the dataset. organisms: one genus per class, the gCC index in every file name (EMDS5-gCC-NN*.png),
  mapped in README.txt (g01 Actinophrys ... g21).'
