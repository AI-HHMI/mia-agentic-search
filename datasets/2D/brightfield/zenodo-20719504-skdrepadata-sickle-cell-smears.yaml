id: zenodo-20719504-skdrepadata-sickle-cell-smears
title: 'SKDrepaData: blood-smear microscopy for sickle cell detection and classification (v1 boxes, v2
  patches, v3 masks)'
short_name: SKDrepaData sickle-cell blood smears (brightfield)
description: Giemsa-stained peripheral blood smear images for sickle cell disease, in three sub-sets -
  v1 YOLOv8 bounding boxes for normal / sickle / other-abnormality red blood cells (Roboflow export, 1,487
  images in the archive), v2 more than 33,000 cropped 224 x 224 cell patches sorted by class folder for
  classification, and v3 a CSV of morphological descriptors for 302 segmented cells (no mask images).
  Released with a doctoral thesis from Universite Assane Seck de Ziguinchor.
