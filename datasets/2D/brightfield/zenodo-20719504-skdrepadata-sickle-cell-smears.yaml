notes: 'No paper is cited on the record and Europe PMC finds none by name, so publications is empty. v1 is a Roboflow YOLOv8 export (640 x 640, flips/rotations, 3 versions per image): its 1,487 images are not the 1,861 originals in the description (a restricted sibling record, 21365925, describes 1,861 full-field images, x40/x100, three microscopes, five annotators). v1 has a train/valid/test split. v2 has 33,832 JPEG cell patches in class folders. The v3 CSV could not be opened, so its contents come from the record description and no binary masks were verified. Label files were not listed individually, hence annotations_verified false. Pixel size not stated.'
