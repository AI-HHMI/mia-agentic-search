  arrays:
  - role: raw
    path_pattern: labeled_set/*/images/*.tif
    format: tiff
    axes: yx
    shape:
    - 2048
    - 2048
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 925
    - 26874
    normalization: unknown
    classes: null
    alignment: not-applicable
    alignment_notes: Most probed images uint16 uncompressed ImageJ TIFFs; the upscaled Bakker et al. images
      (SPD_* names) are uint8 LZW plain TIFFs. Size 2048x2048 or 2304x2304 (paper).
  - role: label
    path_pattern: labeled_set/*/labels/masks/*.png
    format: png
    axes: yxs
    shape:
    - 2048
    - 2048
    - 4
    shape_varies: true
    dtype: uint8
    compression: png
    value_range:
    - 0
    - 255
    encoding: instance-ids
    classes:
    - id: 0
      name: trap
    - id: 1
      name: cell
    alignment: same-grid
    alignment_notes: 'Pairing: same stem in images/ (.tif), labels/masks/ (.png) and labels/classes/ (.json)
      of each split. Mask has the image resolution (README). RGBA PNG; instance ID = R + 256*G (official
      loader dataset.py, read not run), 0 = background; class of each instance id from the JSON category_id
      (trap=0, cell=1, README).'
  - role: label
    path_pattern: labeled_set/*/labels/classes/*.json
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: other
    classes:
    - id: 0
      name: trap
    - id: 1
      name: cell
    alignment: not-applicable
    alignment_notes: 'Per-image JSON {"annotations": [{"id": <instance id>, "category_id": 0|1}, ...]}
      giving each mask instance its class.'
  notes: 'Sizes are exact bitstream sizes from the TUdatalib DSpace REST API (all 5 files of the item);
    labeled_set.zip members listed by range requests (tools/peek_archive.py), unlabeled zips not listed
    (the server intermittently answers 403 to automated range requests). value_range is from one sample
    (train img_000000003_01-BF0_002: uint16 925-26874; mask PNG 143 distinct values per channel). Probed
    4 images: 2 train images uint16 ImageJ TIFF with 106.6 nm/px calibration, a 100x test image uint16
    ImageJ without calibration, an SPD_* test image uint8 LZW plain TIFF. voxel size not set: magnifications
    differ (60x/100x) and part of the images were upscaled; checked headers, DSpace metadata, paper (arXiv
    2308.12116 full text), GitHub README and loader. Direct files: the bitstream /content URLs on tudatalib.ulb.tu-darmstadt.de
    serve the zips with range requests; this host is not on the TensorSwitch allowlist yet.'
