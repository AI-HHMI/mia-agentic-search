schema_version: '1.2'
id: tyc-trapped-yeast-cells-instance-segmentation
title: 'TYC dataset: trapped yeast cells in microstructures (instance segmentation)'
short_name: TYC trapped yeast cells (brightfield)
description: 'Densely annotated brightfield microscopy images of yeast cells trapped in microfluidic microstructures:
  105 labeled images (>=2048x2048, 16-bit TIFF) with ~19k instance masks of cells and traps, split into
  train/val/test and an out-of-distribution test set, plus 261 unlabeled time-lapse fluorescence clips
  (1,293 frames) for unsupervised study.'
