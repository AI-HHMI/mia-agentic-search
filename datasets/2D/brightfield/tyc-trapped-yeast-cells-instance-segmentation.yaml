notes: 'Hosted on TUdatalib (handle tudatalib/3930, DOI 10.48328/tudatalib-1213): labeled_set.zip (0.63
  GB) and unlabeled_set_1-3.zip (8.8 GB); labeled images are brightfield, unlabeled clips are time-lapse
  TIFF sequences. enricher: DOI, authors, date, file sizes from the TUdatalib DSpace REST API (was null).
  enricher: organism Saccharomyces cerevisiae from paper Sec. 3.2 ("With TYC we focus on yeast"; S. cerevisiae
  named; various strains). enricher: annotations.source manual (paper Sec. 3.3: "We annotated all images
  in-house"). enricher: voxel size left null: images mix 60x and 100x objectives and Bakker et al. images
  upscaled 512->2048 (paper Sec. 3); headers say 106.6 nm for some images, nothing for others. coverage:
  all 105 labeled images densely annotated (cells and traps); unlabeled set has no labels.'
