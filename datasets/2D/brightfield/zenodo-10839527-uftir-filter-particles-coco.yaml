notes: 'Zip listing: 1368 JPEG + train/_annotations.coco.json (5.6 MB) + two Roboflow README files (README.dataset.txt gives license CC BY 4.0 and the Roboflow project uftir-particles/uftir_curated_square).
  All images are in a single train folder, no validation or test split. Images are small (about 12 KB each on average). Not a biological specimen: visible-light micrographs of filters used for
  micro-FTIR microplastic analysis, so brightfield is the closest modality (illumination not stated). Pixel size, magnification, number of annotated particles and annotator are not stated. No paper is linked
  in the Zenodo record; the record also holds trained weights (.pth, not opened). enricher: COCO file read: one category particle (id 1, under supercategory
  particles), 33,806 polygons; size_bytes is now the exact record total incl. the 351 MB weights file (zip alone 16,172,951 B).
  coverage: 1346 of 1368 images carry at least one particle polygon (median 21, max 77); 22 have none.'
