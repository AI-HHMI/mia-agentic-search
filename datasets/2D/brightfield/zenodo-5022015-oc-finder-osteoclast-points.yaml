notes: 'Single 5.9 GB zip, 2086 files (peek_archive): 746 TIFF images, 916 xls and 419 csv coordinate
  files; ''Image data/Dataset_1'' (170 images), ''Dataset_2'' (288) and ''Dataset_3'' (288 images, identical
  to Dataset_2 with additional coordinate annotations), so 458 unique images; the readme (read) states
  this. Per the bioRxiv Methods (read via paper.py): about 60 cells per image were manually located, 13,822
  osteoclasts and 13,833 non-osteoclasts in total; osteoclast = TRAP-positive with more than 3 nuclei.
  The paper''s split (373 train / 85 test images) is not provided as files. Annotations are point coordinates
  only, partial per image (only about 60 cells per image labelled). Imaging: Keyence BZ-X810, 10x objective;
  the pixel size is not stated on the Zenodo page, readme or paper. Zenodo record has no paper link; the
  paper was found by title as a bioRxiv preprint. enricher: channels 3 confirmed (RGB TIFF, sampled);
  size from Zenodo listing.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./                                                        1 files      5.9 GB  .zip\n\nzip\
      \ contents:\nOC_Finder.zip/Image data/\n  ./                                                   \
      \     2 files      4.1 KB  .ini 1, .txt 1\n  Dataset_#/                               (×3 dirs)\
      \     2084 files      6.0 GB  .xls 916, .tif 746, .csv 419, .ini 3"
    n_files: 2086
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/5022015/files/OC_Finder.zip::Image data/Dataset_3/female KI R50 day3
      (1).tif
    - https://zenodo.org/records/5022015/files/OC_Finder.zip::Image data/Dataset_3/female KI R50 day3
      (1) new posi.csv
    - https://zenodo.org/records/5022015/files/OC_Finder.zip::Image data/Dataset_3/female KI R50 day3
      (1) new nega.csv
    size_bytes: 8819833
    description: 'One Dataset_3 image with its osteoclast (posi) and non-osteoclast (nega) point tables;
      members of the single zip. Dataset_1 names start with # (URL fragment risk), so Dataset_3 is used.'
  arrays:
  - role: raw
    path_pattern: OC_Finder.zip/Image data/Dataset_[1-3]/*.tif
    format: tiff
    axes: yxs
    shape:
    - 1440
    - 1920
    - 3
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 20
    - 246
    normalization: unknown
    alignment: not-applicable
    alignment_notes: RGB brightfield (samples not identical). Dataset_3 images are byte-identical copies
      of Dataset_2 (same names and sizes).
  - role: label
    path_pattern: OC_Finder.zip/Image data/{Dataset_1/* osteoclasts.xls,Dataset_2/* posi.xls,Dataset_3/*
      new posi.csv}
    format: csv
    axes: null
    shape:
    - 18
    - 4
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: points-table
    classes:
    - id: null
      name: osteoclast
    alignment: same-grid
    alignment_notes: 'Pairing: "<image> osteoclasts.xls" (Dataset_1), "<image> posi.xls" (Dataset_2),
      "<image> new posi.csv" (Dataset_3) belong to "<image>.tif". X, Y in pixels (sub-pixel floats). The
      .xls files are tab-separated ImageJ Results tables (columns Label, Area, Mean, Min, Max, X, Y),
      not Excel; the Dataset_3 CSVs have columns (index), Label, X, Y.'
  - role: label
    path_pattern: OC_Finder.zip/Image data/{Dataset_1/* non-osteoclast.xls,Dataset_2/* nega.xls,Dataset_3/*
      new nega.csv}
    format: csv
    axes: null
    shape:
    - 6
    - 4
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: points-table
    classes:
    - id: null
      name: non-osteoclast
    alignment: same-grid
    alignment_notes: Same layout as the osteoclast tables, for non-osteoclast points ("non-osteoclast.xls",
      "nega.xls", "new nega.csv").
  notes: 'Listed: Zenodo record (1 zip, 5,880,456,009 bytes, complete), zip expanded (2086 members: Dataset_1
    170 tif + 170+170 xls; Dataset_2 288 tif + 576 xls; Dataset_3 288 tif + 419 csv (141 posi, 278 nega),
    plus desktop.ini). probe.py could not read the TIFF headers (IFD beyond its 8 MB read); sample.py
    read Dataset_1/#1.tif and Dataset_2/female KI R50 day3 (1).tif: 1440x1920x3 uint8 YXS, 2 series (likely
    a thumbnail), ranges 22-246 and 20-225 (two samples); compression none inferred (file size = pixel
    bytes). Read one Dataset_3 posi CSV (18 rows), one nega CSV, and the head of a Dataset_1 .xls (tab-separated).
    Voxel size not found; checked: TIFF tags (no calibration), Zenodo page, readme, bioRxiv full text
    (paper.py), GitHub README (kiharalab/OC_Finder: says new inputs should be resized so 50 px = 38 um,
    an indirect scale not used here).'
