notes: 'Single 5.9 GB zip, 2086 files (peek_archive): 746 TIFF images, 916 xls and
  419 csv coordinate files; ''Image data/Dataset_1'' (170 images), ''Dataset_2'' (288)
  and ''Dataset_3'' (288 images, identical to Dataset_2 with additional coordinate
  annotations), so 458 unique images; the readme (read) states this. Per the bioRxiv
  Methods (read via paper.py): about 60 cells per image were manually located, 13,822
  osteoclasts and 13,833 non-osteoclasts in total; osteoclast = TRAP-positive with
  more than 3 nuclei. The paper''s split (373 train / 85 test images) is not provided
  as files. Annotations are point coordinates only, partial per image (only about
  60 cells per image labelled). Imaging: Keyence BZ-X810, 10x objective; the pixel
  size is not stated on the Zenodo page, readme or paper. Channels set to 3 (RGB)
  from the paper''s colour images; the paper does not state the count explicitly.
  Zenodo record has no paper link; the paper was found by title as a bioRxiv preprint.'
