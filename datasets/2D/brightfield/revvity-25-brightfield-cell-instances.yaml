title: 'Revvity-25 Full Cell Segmentation Dataset'
short_name: Revvity-25 cancer cell instances (brightfield)
description: 110 brightfield images (1080 x 1080 px) of cancer cells with 2937 manually labeled, expert-validated cell instances annotated as polygons (about 60 points per cell, up to 400) that capture cell borders and overlaps. Released with the IAUNet paper as a benchmark for modal and amodal instance segmentation, with train and validation annotation files in COCO format.
