notes: 'Splits: the paper says Revvity-25 is divided equally into 55 train and 55 test images; the Hugging Face files are annotations/train.json (55 images, 1491 annotations) and annotations/valid.json (55 images, 1446 annotations), so the "valid" file serves as the test split. Pixel size, microscope, magnification, cell lines and bit depth are not stated on the dataset page, README, project page or paper text. Paper DOI not looked up (arXiv 2508.01928; Europe PMC has no entry). Image files are PNG per the HF file listing. The dataset is also offered at https://bcv.cs.ut.ee/datasets/.'
