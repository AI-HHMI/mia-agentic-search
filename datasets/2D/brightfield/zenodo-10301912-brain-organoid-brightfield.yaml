notes: 'data.zip listing: 703 JPG (Lab A, 1024x768 per the record) and 704 TIF (Lab B, 1388x1040) images,
  1,407 .npy masks and one CSV; n_items counts the 1,407 masks (the paper title says 1,400 images). Pixel
  size is not given in the pixel scale of the files; the paper provides a px to um2 conversion only for
  organoid size, and the value was not read. Ground truth was created manually (paper Methods). The record
  page lists no explicit train/test split. Paper full text via Europe PMC. enricher: channels 1 -> null:
  Lab A JPEGs are stored as 3-channel RGB, Lab B TIFFs as single-channel (sampled).'
