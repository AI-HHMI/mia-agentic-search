notes: 'Original NLM release. Zip listed with peek_archive: 965 jpg + 965 txt GT files + 87 Thumbs.db
  (zip 690 MB compressed, 799 MB uncompressed). License is the NLM Data License Agreement (BSD-style:
  any commercial or non-commercial use, retain notice, acknowledge NLM, cite Kassim et al.). Paper: polygon
  set 165 images/33 patients (34,213 RBCs), point set 800 images/160 patients (162,450 RBCs), polygon
  set used for training and point set for evaluation. Pixel size not stated in ReadMe or paper. Related:
  zenodo-17514694 holds COCO box re-annotations of these same images; this record is the original NLM
  release. Cell-level crop dataset (cell_images.zip) is a separate pending record. enricher: zip listed,
  JPEGs probed/sampled, GT read. organisms: Homo sapiens (blood) and Plasmodium falciparum (parasites)
  share every image; not separable by folder.'
