  notes: 'HF API listing complete: 19 files, 7,699,275,458 B. datasets-server /info: features image, label (split),
    width, height, objects{bbox float64, categories int64}, well_edge bool; 27,161 / 3,302 / 1,580 rows. First 3
    test rows read via /rows: 512x512, one box each, category 0. Image: the first 2 MB of the test parquet hold
    PNG streams (no JPEG); the one tile decoded (via the datasets-server asset) is a 512x512 RGBA PNG, R=G=B, alpha
