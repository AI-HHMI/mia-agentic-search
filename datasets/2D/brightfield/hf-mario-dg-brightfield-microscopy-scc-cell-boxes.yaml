notes: 'Hugging Face dataset, 19 files, 7.7 GB: 14 train parquet shards + validation + test (27,161 / 3,302 / 1,580 tiles per the card). First rows
  read via the datasets server: 512x512 tiles, 1-2 boxes per tile, category 0, boxes as four normalized values (coordinate
  convention not stated), well_edge flag for tiles showing a plate well edge. The card says tiles were sliced from 4K brightfield
  images and the data were used to train unconditional diffusion and cell detection models; it does not name the cell type or
  organism, microscope, magnification, pixel size or how the boxes were made, and no license or paper is given (card has no license
  field), so those are unknown. The meaning of "SCC" is not stated. Parquet is not in the format list, so formats is other.
  The label column only encodes the split.'
