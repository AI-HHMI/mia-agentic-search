notes: 'peek_archive on images.zip: 1,100 JPEGs under images_2/, names like AA83-7_WELL7_RUN005.jpeg. That naming
  matches the EmbryoScope time-lapse dataset already in the catalog (zenodo-6390798-human-embryo-time-lapse-phases,
  "embryo images previously published" per the figshare description), so the images overlap with that record; what
  is new here are the expert natural-language captions (gold and silver JSONL). Annotation type is "other" because
  captions are not in the enum, and the ML task is "other" (vision-language fine-tuning). figshare API gives CC
  BY 4.0 and the three files; size_bytes is their sum. No authors are listed on the figshare record and no published
  paper DOI is given (an arXiv preprint, 2604.16528, was seen only in search results and was not read), so authors
  and publications are empty. Magnification, pixel size and the number of distinct embryos are not stated on the
  record.'
