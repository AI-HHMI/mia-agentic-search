title: Expert-Annotated Embryo Image Dataset with Natural Language Descriptions for evidence-based patient communication
  in IVF
short_name: Embryo images with expert text descriptions
description: 1,100 time-lapse microscopy images of human embryos, each paired with an embryologist-written natural-language
  description of developmental stage and morphological features. Captions come in a gold set (expert-written) and
  a larger silver set, as JSONL. Intended for fine-tuning vision-language models for evidence-based patient communication
  in IVF.
