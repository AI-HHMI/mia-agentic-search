notes: 'File lists (TSV, counted): 2,269 raw registered Leica images (405 nm, 365 nm and broadband at
  40x), 1,646 segmentation label-matrix PNGs, and 64,930 annotated cell thumbnails (healthy 56,874, ring
  5,205, trophozoite 2,270, schizont 581). Annotation was human-in-the-loop: the machine classifier labels
  were corrected by people (paper). The thumbnails are TIFF and the label matrices PNG. No data license
  is stated on the BioStudies entry (the paper is CC BY 4.0), so license is unknown. Pixel size is not
  stated in the entry or paper text read. Companion raw entries S-BSST559 (custom UV scope) and S-BSST567
  (raw Leica) are separate accessions, not included here; the page lists a folder of the same raw data
  under s-bsst559-567/. organisms: both in every image (P. falciparum inside human RBCs).'
