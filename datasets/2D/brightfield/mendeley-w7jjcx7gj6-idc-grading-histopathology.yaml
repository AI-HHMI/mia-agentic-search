notes: 'Three RAR archives (Grade 1/2/3; 857 MB total) per the Mendeley API. peek_archive handles only zips, so the
  first 3 MB of the Grade 1 RAR were read: members are JPGs under BC_IDC_Grade_1\<magnification>\. Per-grade counts, image
  size, camera and pixel size not stated (record, databiox.com). Paper not open access; only its Crossref record was read.
  License: Mendeley v1 (2020) page says CC BY 4.0, current v3 metadata says CC BY-NC 4.0 (recorded). databiox.com says
  access by application, but Mendeley offers direct download. Classification labels only; databiox says 150 patients vs
  124 on Mendeley.'
