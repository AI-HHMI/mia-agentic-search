notes: 'Read the Zenodo page and API record (CC BY 4.0). peek_archive of Thin blood smear images.zip (26,263
  files, 7.8 GB uncompressed): Normal morphology RBC Sliced 12,361 jpg, Rouleaux morphology RBC Sliced
  12,356, and original-form folders of 773 and 772 jpg; n_items is the sum of those four folder counts.
  The description gives 4032x3024 originals, cropped to 2500x2500 and sliced to 750x750, with 616 rouleaux
  and 616 normal fields from 100 patients plus 312 Giemsa images from a second hospital. The paper is
  not open access (abstract only). Tiles are cut from a smaller number of fields, so tiles are not independent
  samples; labels are per slide (rouleaux or not), not per cell. No pixel size stated (phone camera on
  a microscope eyepiece, magnification not given in what was read). Dataset description counts 12,356
  per class; the normal folder lists 5 more files. enricher: listing and samples confirm the class folders.'
