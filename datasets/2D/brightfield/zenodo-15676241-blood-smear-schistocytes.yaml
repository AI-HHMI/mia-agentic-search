title: Blood Smear Cell Dataset
short_name: Blood smear cell detection incl. schistocytes
description: 615 PNG images of blood smears with YOLO-format bounding boxes for six cell classes - red blood cells,
  schistocytes (fragmented RBCs), platelets, granulocytes, monocytes and lymphocytes. Deposited as a single dataset.zip
  with an images folder, one label text file per image and a classes.txt.
