notes: 'The record has no description beyond the class list, no paper link and no imaging details. dataset.zip (369.9 MB) lists 615 PNG images and 616 txt files (615 labels plus classes.txt); classes.txt and one label file were read with peek_archive and are YOLO boxes. Modality is inferred as brightfield from the stained blood-smear content and was not stated on the page; the microscope, magnification, pixel size, annotator and stain are not stated. A PeerJ Computer Science paper by the same first author (10.7717/peerj-cs.3475) describes a schistocyte-detection set with the same six classes and 6,150 images, but the record does not link it, so it is not listed as the dataset paper.'
