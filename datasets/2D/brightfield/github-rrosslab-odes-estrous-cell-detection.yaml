notes: 'Counted in a shallow read-only clone: traindata/images has 335 train and 45 val images (322 PNG, 13 JPG in train), traindata/labels the same number of YOLO txt files with 30,429 boxes (class 0: 11,338, 1: 13,958, 2: 5,133); TEST_images has 100 EstrousBank and 75 SECREIT images with no box labels in the repo (stage given by file name for SECREIT). Example sizes 1594 x 1196 and 1520 x 1134 px; pixel size not stated. The repository has no LICENSE file and the paper does not give a data license (the article is CC BY 4.0), so license is unknown; some images are re-distributed from EstrousBank (S-BIAD545, CC BY 4.0 per the aggregator card, not checked here) and SECREIT. Paper reports 730 images (335 / 45 / 350 split) while the repo holds 380 + 175; the difference was not reconciled.'
