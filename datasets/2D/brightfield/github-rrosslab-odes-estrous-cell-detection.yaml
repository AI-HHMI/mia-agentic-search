title: ODES estrous staging object detection (training images and YOLO labels)
short_name: Mouse vaginal cytology cell boxes (brightfield)
description: 380 stained mouse vaginal cytology images (10x objective, about 1500 x 1150 px PNG/JPG; 335 train, 45 val) with
  YOLO bounding boxes for three cell types (leukocyte, cornified, nucleated epithelial; about 30,400 boxes), plus 175 unlabelled-in-repo
  test images (100 EstrousBank, 75 SECREIT) used to evaluate the ODES estrous-stage detector. Images come from several labs
  and stains (Giemsa, Crystal Violet, Shorr, H&E).
