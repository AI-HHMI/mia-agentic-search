notes: 'Repo commit 4030305: traindata/images 335 train + 45 val (PNG/JPG), traindata/labels the same number of YOLO txt files;
  TEST_images 100 EstrousBank + 75 SECREIT (PNG/JPG/BMP) with no box labels. No LICENSE file and the paper gives no data license
  (article CC BY 4.0), so license unknown; some images are re-distributed from EstrousBank and SECREIT. Paper reports 730
  images (335/45/350) vs 380 + 175 in the repo. enricher: channels set to null (was 3): images mix greyscale, RGB and RGBA
  (screenshots). enricher: paper DOI added from Europe PMC. Pixel size not stated anywhere and images come from several labs
  and screenshots.'
