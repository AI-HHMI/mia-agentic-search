notes: 'Zip listings show 228 original TIFF ROIs, 228 semantic-segmentation PNG masks, 100 instance-segmentation
  PNG masks (a subset) and 2,736 normalized JPEGs (228 x 12 normalization variants). The paper abstract and Methods
  state 456 ROI images (114 per class); the Zenodo files list 228, so n_items follows the files and the discrepancy
  is unresolved. Pixel size not stated on the Zenodo page or in the paper Methods (400x only), so voxel_size_nm
  is null. Mouse strain not specified.

  enricher: the released files contain only two class folders, healthy and severe (114 ROIs each); no mild/moderate
  folders.'
