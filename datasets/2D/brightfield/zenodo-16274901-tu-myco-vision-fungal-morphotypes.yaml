notes: 'Found via the 2026 paper (Europe PMC full text read: Methods and Data availability). zulu.zip was listed with peek_archive
  (7,525 JPEG plus 7,525 txt labels across five splits); the other four zips were not listed. n_items is the final Zulu version
  (1,504 images); X-ray and Yankee are earlier versions of overlapping material, and size is the sum of all five zips. Pixel
