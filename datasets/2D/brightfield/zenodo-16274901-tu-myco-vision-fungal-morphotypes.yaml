title: TU_MyCo-Vision Image Datasets
short_name: Fungal morphotype detection boxes (brightfield)
description: Brightfield microscopy images of Aureobasidium pullulans, A. melanogenum and Trichoderma reesei cultures, cut
  into 640x640 px tiles and manually annotated with bounding boxes in YOLO format for 13 fungal morphotype classes. Three
  dataset versions (X-ray 1,028 images, Yankee 1,002, Zulu 1,504) each come with five stratified 80:20 train/validation splits;
  a 90-image global test set and a UI test set with Komagataella phaffii and Aspergillus niger conidia are included.
