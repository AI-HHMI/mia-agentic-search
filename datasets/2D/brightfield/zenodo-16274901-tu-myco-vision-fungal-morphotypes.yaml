  so formats are jpeg, png, tiff (was jpeg); size_bytes is the exact 5-file total; download_url is the Zenodo API content
  link; channels 3 (RGB). Unlabelled UI_test_dataset holds K. phaffii and A. niger images; all labelled tiles are the 3 listed
  organisms (not split by file).'
