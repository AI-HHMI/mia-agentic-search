notes: 'Counts from listing the zips (peek_archive): 600,000 TIFF subimages in segmentation_input (zips
  1-5, 7) and 600,000 label PNGs in zip 6; data_filtering.zip has 5,259 TIFFs. About 55 GB over 13 files.
  Masks derive from HALO software output with manually set per-slide parameters, so source is mixed; a
  30-subimage-per-stain hand-counted test set is described in the preprint but not identifiable in the
  listing. Pixel size 0.5 um/px is the scan resolution in the preprint; subimages were resized to 128x128
  for training. The preprint cites Zenodo 10512601 for its data; this record 10593514 may be a newer version,
  not compared. Only the Research Square preprint PDF was read; no peer-reviewed version found. Split
  files not stated. enricher: channels 3 (RGB TIFF header, was null); label values from training code.'
