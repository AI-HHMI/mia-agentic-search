notes: 'Zip listing: VMXi_Detector_Datset (237 images, 1688 x 1352) and XChem detector dataset (350 images, 1224 x 1024 w x h), 587 JPEG + 587 .npz, plus
  vmxi_detector_training/validation.csv and xchem_detector_training/validation.csv (4 CSV). Images have CLAHE histogram adjustment applied by the authors.
  Paper (bioRxiv preprint, full text read): VMXi split is 190 train / 47 validation; the XChem set was trained on further, so its split files are
  in the zip. Not a biological specimen: these are visible-light micrographs from an automated imager, so brightfield is the closest modality
  (the imager is a Rock Imager 1000; illumination mode is not stated in the dataset page). Pixel size is not stated in the record, listing or paper
  text read. enricher: npz class_labels are the strings crystal and drop (2 files read).'
