  notes: 'Listing: Zenodo API + zip central directory (1179 members), complete, exact sizes. Probed 3 JPEGs (VMXi 18092300:
    1352 x 1688 x 3; XChem d3_r2360716_ef, d3_r2342611_ef: 1024 x 1224 x 3, uint8). Sampled VMXi 18092300.jpg (484 KB): 0-255,
    p50 162, channels not identical (one sample). Read 2 npz with np.load(allow_pickle=False): VMXi 18092300 masks (11, 1352,
    1688) bool + class_labels [crystal, drop]; XChem d2_r761961_ef masks (1, 1024, 1224) + [crystal]. CSV split lists: VMXi
    190 training lines, XChem validation 71 lines incl. header. npz is no listed array format, hence format other. Voxel size
