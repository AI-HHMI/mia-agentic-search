title: 'OrgaQuant: bounding-box annotated brightfield images of human intestinal organoids'
short_name: Intestinal organoid bounding boxes (brightfield)
description: 1,750 brightfield image patches (300x300 and 450x450 px, cut from ~1500x1125 px EVOS FL 4x
  images of human intestinal organoids in hydrogel droplets, days 4 and 6) with 14,242 aggregated bounding
  boxes for in-focus organoids, labelled by crowd workers with redundancy and IoU agreement checks. Provided
  as train/test JPEG folders with train_labels.csv and test_labels.csv.
