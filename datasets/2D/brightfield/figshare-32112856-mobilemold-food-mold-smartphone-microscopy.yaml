title: 'MobileMold: a smartphone-based microscopy dataset for food mold detection'
short_name: Food mold smartphone microscopy (brightfield)
description: 4,941 handheld smartphone images taken through clip-on microscope lenses (30x and 100x nominal)
  of 11 food types, with a binary mold label (1,842 moldy, 3,099 not) and a food-type label per image.
  Provided both as original images and as cropped, resized versions, with train, validation and test metadata
  files (8:1:1). Mirrors exist on Zenodo, Hugging Face and Kaggle.
