notes: 'Read the figshare record, the project page, the arXiv full text (Dataset description, statistics,
  splits) and listed the 15.2 GB zip with peek_archive (9,886 files: 4,941 images in original/ plus 4,941
  in cropped_resized/ and 4 CSVs; mixed .jpg and .jpeg names). The microscope and phone combinations are
  Jiusion 30x with Xiaomi Redmi Note 13 (2,681 images), Apexel 100x with iPhone SE (1,436) and Phonescope
  30x with Galaxy S8+ or Pixel 8 Pro (824). Labels are image-level (mold yes/no, food type); the paper
  mentions localization or segmentation only as possible uses, no masks or boxes are released. Pixel size
  is not stated (handheld clip-on optics, nominal magnification only). Not a laboratory microscope: images
  are consumer-device captures, so it suits classification more than fine-grained analysis.'
