title: Dataset for Efficient and scalable training set generation for automated pollen monitoring with
  Hirst-type samplers
short_name: Pollen slide detection (brightfield)
description: 25 high-resolution bright-field pollen slide scans (mostly 40x, some multi-layer extended-depth-of-field
  composites) from France, Hungary and Sweden, with COCO-format bounding boxes of pollen grains and test-region
  mask images. Boxes were generated mostly automatically (OWL-ViT one-shot detection refined with YOLOS)
  with light expert review in Label Studio.
