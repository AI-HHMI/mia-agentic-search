notes: 'Two zips listed with peek_archive: raw.zip (25 TIFF scans, 23.3 GB uncompressed, some over 2 GB)
  and annotations.zip (all_annotations.json plus 21 test-region PNGs). Annotations are largely machine
  generated (OWL-ViT plus YOLOS refinement); the paper reports a small expert-curated baseline with near-identical
  results, but which boxes in the Zenodo JSON were curated was not checked, hence source mixed. Per-class
  label names in the JSON were not inspected. Pixel size is not stated on the Zenodo page; the paper text
  read only gives the approximate grain size in pixels. Each scan holds thousands of grains, so image
  count understates the amount of training signal. Apache-2.0 is the license shown by Zenodo. enricher:
  annotations.format updated from the COCO JSON (boxes are on the test-region PNGs, 12 named categories).'
