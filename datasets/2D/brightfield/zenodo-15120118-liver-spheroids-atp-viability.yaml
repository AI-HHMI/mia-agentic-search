description: About 20,000 brightfield images (10x) of 3D InSight human liver microtissues treated with toxic and non-toxic
  drugs, acquired on four microscope systems in two labs. 2,359 images carry matched ATP (CellTiter-Glo 3D) viability measurements
  and spheroid segmentation masks; roughly 17,500 images are unlabeled and available for self-supervised or semi-supervised
  use.
