notes: 'Pixel size not stated on the Zenodo page, file listing, paper Methods or code repo (10x Agilent
  BioTek objective); left null. Labels: image-level ATP viability (nM) and pathologist scores in data_labeled.csv,
  plus binary spheroid masks (images_labeled_masks.zip, 2,359 PNGs, same file names). Masks come from
  a U-Net trained on 1,000 manually labeled images (automatic); pathologist scores are manual, hence source
  mixed. enricher: masks are full-frame (3040/2400/1992 px); the full-frame labeled images are not in
  the record, only 256 px and spheroid-centred crops (images_labeled_cropped_0.2, side 0.4 x frame). enricher:
  images_chromalive* (284 PNGs) are a separate Thorlabs set of brightfield plus 3 fluorescence channels
  (Yokogawa CQ1). enricher: size from the complete Zenodo listing (was sum of zips, 12.7 GB).'
