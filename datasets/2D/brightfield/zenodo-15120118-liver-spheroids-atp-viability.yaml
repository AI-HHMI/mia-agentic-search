notes: 'Pixel size not stated on the Zenodo page, file listing or paper Methods (10x Agilent BioTek objective, one field of
  view per well); left null. Labels are image-level ATP viability values (regression, nM, in data_labeled.csv) plus binary
  spheroid masks (images_labeled_masks.zip, 2,359 PNGs matching the labeled images by filename); the paper says masks come
  from a U-Net trained on 1,000 manually labeled images, so they are automatic. A pathologist also scored a subset (0-4) per
  the paper. Listed zips peeked: images_labeled_masks.zip, images_labeled_256.zip (2,359 PNGs each). Other files: unlabeled
  images (256 px and cropped variants, ~9 GB), a small chromalive set, two model checkpoints, CSV metadata. Size is the sum
  of the zip files.'
