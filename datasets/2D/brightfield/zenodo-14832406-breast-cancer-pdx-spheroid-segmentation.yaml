notes: 'Pixel size differs per subset: paper Methods give ''UPlanFLN 4x PhL objective (pixel size, 0.183
  mm)'' for CS (sensitive) and ''UPlanFL 10x objective (pixel size, 0.123 mm)'' for CR (resistant), units
  implausible; Results say circa 1.5 um. Left null. Each zip holds *_training_input, *_training_labels,
  *_validation_input, *_validation_labels (48 TIFFs each, same file names in input and labels). Paper:
  96 images per set annotated with micro-SAM rectangle prompts, split equally into train and validation;
  images converted to 8-bit grayscale in Fiji. Tumors are patient-derived breast cancer xenografts grown
  in mice; organism is the human tumor. enricher: size is the two data zips from the complete Zenodo listing;
  models.zip (39.5 GB of micro-SAM .pt weights) is excluded. Instruments: Olympus IX70 with Leica DFC320
  camera.'
