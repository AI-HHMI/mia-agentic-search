description: Training and validation images with manual (micro-SAM prompted) segmentation masks of spheroids grown from cisplatin-sensitive
  and cisplatin-resistant breast cancer patient-derived xenograft tumors, imaged in bright-field at 4x (sensitive) and 10x
  (resistant). Two zips hold 48 training and 48 validation image/label pairs each. The deposit also contains fine-tuned micro-SAM
  models.
