notes: 'Pixel size is given inconsistently: the Methods say ''pixel size 0.183 mm'' (4x) and ''0.123 mm'' (10x), which cannot
  be right, and another passage says about 1.5 um; left null. Listings from peek_archive: resistant_training_data.zip and
  sensitive_training_data.zip each hold *_training_input, *_training_labels, *_validation_input and *_validation_labels folders
  with 48 TIFF files each (96 pairs per zip, 192 total); 1.5 GB resp. 0.7 GB uncompressed. Paper: 96 images with manual annotations
  (rectangle prompts + SAM), split equally into train and validation; images converted to 8-bit grayscale. Tumors are patient-derived
  breast cancer xenografts grown in mice; organism is listed as the human tumor. Size counts the two data zips only; models.zip
  (39 GB, fine-tuned micro-SAM) is excluded. Instruments: Olympus IX70 with Leica DFC320 camera.'
