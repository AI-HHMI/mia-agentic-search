description: 147 brightfield and DIC images of Saccharomyces cerevisiae with curated single-cell instance masks
  plus mating (zygote) and budding annotations (17,058 cells, 3,615 buddings, 2,380 zygotes), shipped as image /
  mask / detections-JSON triplets in train1-4 and test folders, to train and evaluate the YeastMate Mask R-CNN.
