notes: 'The public API record lists no files, but the files endpoint (data.mendeley.com/api/datasets/h5b3zbtw8v/files?version=1)
  lists one file, crossing_touching_G banded chromsome_data.npz (17,381,460 B). enricher: npz members
  read: arr_0 images and arr_1 RGB masks, each (500, 256, 256, 3) float32; images are grey stored as RGB
  (channels 1, was null); annotations_verified now true. No linked article, so no paper was read. Pixel
  size, microscope and magnification are not stated. Version 2 (2023-03-29) instead holds 100 PNG files
  in two folders (50 + 50); version 1 is recorded here. Each sample has two chromosomes. Species is human
  (volunteer blood samples).'
