title: Overlapping and touching G banded chromosome dataset
short_name: Touching G-banded chromosome pairs (brightfield)
description: 500 image crops of G-banded metaphase chromosome pairs that overlap or touch, each with a
  manually painted label image (chromosome 1 red, chromosome 2 green, overlap region blue). Images come
  from volunteer blood samples prepared at the Regional Cancer Centre Thiruvananthapuram (Kerala, India).
  Packaged as two NumPy arrays of shape (500, 256, 256, 3) (images and masks) stacked into a single .npz
  file, for training overlapping-chromosome segmentation.
