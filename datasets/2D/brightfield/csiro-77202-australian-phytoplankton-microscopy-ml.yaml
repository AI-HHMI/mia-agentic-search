notes: 'From the CSIRO portal API record and file listing (25,926 files, 4.4 GB; the multi-species images are stored twice,
  under yolo/ and mmdet/). Unique images 9,738: ZAO_X630_BF 6,386 plus nine single-species sets of 233, 3, 154, 159, 82, 71,
  503, 12 and 2,135. JPG frames decoded from Zeiss CZI; one polygon per cell drawn in CVAT, manually at first and with SAM
  later. The ten species of the multi-species set are not named in the text read, so organism lists only Heterosigma akashiwo.
  Pixel size is not stated (magnification_scale.py not read). The record cites a companion paper without naming it and none
  was found, so publications is empty. Training and scoring scripts are included. Non-commercial license (CC BY-NC 4.0).'
