title: Australian Phytoplankton Microscopy Machine Learning Dataset
short_name: Phytoplankton cell detection and polygons (LM)
description: Ten annotated light-microscopy datasets of cultured phytoplankton from the CSIRO Australian Phytoplankton
  Microscopy Dataset (CAPMD) with expert segmentation polygons per cell, in YOLO detection format and COCO polygons. A
  multi-species bright field set (630X, ten species, mostly harmful algal bloom taxa; 6,386 images, 15,591 annotations)
  and nine Heterosigma akashiwo sets varying contrast mode (bright field, DIC, phase contrast), objective (200X, 400X, 630X,
  1000X) and microscope, five with train/val/test splits and five held out for cross-condition evaluation.
