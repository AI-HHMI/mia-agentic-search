notes: 'From the CSIRO portal API record and file listing (25,926 files, 4.4 GB; the multi-species images are stored twice,
  under yolo/ and mmdet/). Unique images 9,738: ZAO_X630_BF 6,386 plus nine single-species sets of 233, 3, 154, 159, 82, 71,
  503, 12 and 2,135. JPG frames decoded from Zeiss CZI; one polygon per cell drawn in CVAT, manually at first and with SAM
  later. The record cites a companion paper without naming it and none was found, so publications is empty. Training and scoring
  scripts are included. Non-commercial license (CC BY-NC 4.0). enricher: organism lists the 10 species of the README table
  (was H. akashiwo only). organisms: all nine *_CS1197 sets = Heterosigma akashiwo; ZAO_X630_BF mixes the 10 species, one
  strain per image (strain code in the file name, class id in data.yaml).'
