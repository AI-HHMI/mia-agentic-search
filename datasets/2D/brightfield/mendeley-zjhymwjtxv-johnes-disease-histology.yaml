  images from a camera). The "ImagesS" folder repeats the images with a scale bar. Species: sheep, goats and cows per paper
  (Ovis aries, Capra hircus, Bos taurus assumed as the scientific names). Pixel size not stated. Size not stated. Labels are
  image-level and not given as separate annotation files as far as read.'
