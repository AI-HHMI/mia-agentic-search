notes: 'Total 37.6 GB from the HTTP index (48 files, rounded sizes): original/ (.cif, .daf, .fcs per sample, 20.8 GB) and zarr/ (focused
  single-cell images as 1D zarr arrays zipped per .cif part, plus features.parquet, 16.8 GB). Images are 12 channels (BF1, CD15, Siglec8,
  CD14, CD19, SSC, CD3, CD45, BF2, CD4, CD56, CD8). Labels are gate definitions in the .daf files; per-cell label columns in features.parquet
  were not opened. No license or terms stated on the BioStudies record or file listing; voxel/pixel size not stated there; paper full text
  is not open access (only the abstract was read), so the Methods were not checked. Number of images not stated. The description mentions
  four samples while the study component says three.'
