schema_version: '1.2'
id: s-biad452-human-wbc-ifc
title: Imaging flow cytometry dataset of healthy human white blood cells
short_name: Human white blood cells (imaging flow cytometry)
description: Single-cell brightfield, darkfield and 9-marker fluorescence images of white blood cells
  from healthy human whole blood, acquired on an ImageStream-X MK II imaging flow cytometer. Eight cell
  types (CD4+ and CD8+ T cells, neutrophils, monocytes, B cells, CD56+ NKT cells, other NKT cells, eosinophils)
  are defined by manual gating on antibody stains, which provides labels for stain-free (brightfield/darkfield)
  classification. Released as proprietary .cif/.daf/.fcs files plus Zarr arrays of focused single-cell
  images.
