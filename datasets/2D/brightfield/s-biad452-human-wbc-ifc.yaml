  notes: 'Listed via the BioStudies HTTP index (48 files, complete) and HEAD of every file (exact total
    37,775,555,915 bytes; listing.py reports the index as rounded, hence page-stated, not file-listing).
    Read the central directory of all 11 zarr.zip files: 9 have .zarray/.zattrs (221,040 cells in total:
    25,225/26,273/27,111, 23,200/24,890/25,227, 22,703/22,926/23,485), sample2_early and sample2_late
    hold chunks only (313 and 218) with no metadata, so their cell shapes cannot be decoded from the zip
    alone. Decoded chunk 0 of sample0_part1 (4.7 MB): 100 cells, uint16, 12x61-93x40-87 px, values 0-3686
    (one chunk only); the preprint says raw max pixel values stay below 4096 (12-bit), so normalization
    none is inferred. Labels: parquet footer read (1.6 MB), values not decoded (no parquet reader allowed),
    so classes and label counts are open. Voxel size not found; checked: zarr .zattrs (no scale), BioStudies
    API and file list, Europe PMC (journal paper not open access), bioRxiv preprint 10.1101/680975 full
    text (60x magnification, no dataset pixel size; 0.25 um/px is quoted for IFC in general), not checked:
    the saeyslab GitHub org named in the preprint. Download: every file is a direct https file with range
    requests; no single archive for the whole dataset.'
