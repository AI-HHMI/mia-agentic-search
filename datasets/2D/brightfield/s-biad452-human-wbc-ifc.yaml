notes: 'Images are 12 channels (BF1, CD15, Siglec8, CD14, CD19, SSC, CD3, CD45, BF2, CD4, CD56, CD8).
  No license or terms stated on the BioStudies record, file list or preprint (the preprint itself is CC-BY-NC-ND,
  not the data). Description mentions four samples, the study three; the files hold sample0, sample1_early/late,
  sample2_early/late. enricher: size 37,775,555,915 bytes = HTTP Content-Length of all 48 files (was 37.6
  GB rounded). enricher: annotations.format now names the meta_label column found in the features.parquet
  schema. enricher: voxel size still null; the preprint says images were taken at 60x and only quotes
  0.25 um/pixel at 60x for IFC in general.'
