notes: 'IEEE DataPort lists the dataset as Open Access, but downloading needs a free IEEE account (access:
  registration); the page also mentions a DataPort subscription, so terms are unclear. No license is stated
  on the IEEE DataPort page. A third-party Hugging Face mirror (MedOtter/SegPC-2021, 298 train + 199 validation
  rows with image, semantic mask, instance mask, overlay) labels itself cc-by-nc-sa-4.0; that is not the
  original deposit''s statement and was not adopted. Files per IEEE page: TCIA_SegPC_dataset.zip (4.49
  GB) and an evaluation scripts/readme zip; images are BMP (2040x1536 Olympus and 1920x2560 Nikon, 775
  total). Annotations are only for designated cells of interest, so other plasma cells in a field may
  be unlabeled (coverage partial). Annotation procedure, magnification and pixel size are not stated on
  the IEEE page; the Medical Image Analysis paper is not open access (only the abstract was read), so
  those fields stay unknown. The zip contents were not listed.'
