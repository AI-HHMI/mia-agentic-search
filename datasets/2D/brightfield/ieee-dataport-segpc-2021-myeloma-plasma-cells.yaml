short_name: Myeloma plasma cell segmentation (brightfield)
description: 775 Jenner-Giemsa stained brightfield images of bone marrow aspirate slides from multiple
  myeloma patients (stain color normalized), released for the ISBI 2021 SegPC challenge. Nucleus and cytoplasm
  of plasma cells are annotated separately for the training (298) and validation (200) images; test (277)
  ground truth is withheld.
