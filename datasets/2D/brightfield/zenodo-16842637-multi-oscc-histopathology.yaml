notes: 'Zenodo record, Europe PMC full text of the Sci Data paper and the zip listing (peek_archive: 8,003 files, 8,001
  jpg and 2 json) read. The paper text states 1,325 patients with six images each and also says 1,325 images from 1,325
  patients in one place; the listing has 8,001 jpg, used for n_items. File names use 2X, 4X and 10X while the paper
  gives x200, x400, x1000 total magnification. The JSON files (labels, split) are named in the paper but their
  contents were not read, so annotations_verified is false. Labels are patient-level clinical outcomes, not pixel
  annotations. Pixel size not stated. Annotation method for labels beyond the clinical records was not checked.'
