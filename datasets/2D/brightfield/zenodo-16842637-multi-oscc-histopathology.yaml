id: zenodo-16842637-multi-oscc-histopathology
title: Multi-OSCC
short_name: Oral carcinoma H&E multi-task labels (histology)
description: Multi-OSCC is a histopathology image dataset of 1,325 oral squamous cell carcinoma patients, six H&E
  images per patient (two per magnification, core and invasive-edge regions; 2592 x 1944 px JPEG, Olympus microscope)
  with patient-level labels for six clinical tasks (recurrence, lymph node metastasis, tumour differentiation, tumour
  invasion, cancer embolus, perineural invasion) and a provided train/validation/test split file.
