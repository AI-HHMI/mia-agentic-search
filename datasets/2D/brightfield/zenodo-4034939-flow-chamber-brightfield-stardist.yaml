notes: 'Counts from the zip listing (peek_archive): Training dataset 57 Training_source
  + 57 Training_target TIFFs, Quality check dataset 3+3, one Test data time-lapse
  file, and a StarDist ZeroCostDL4Mic model folder (127 files in total). Microscope,
  objective, image size, pixel size (650 nm) and manual segmentation are from the
  Zenodo description. The record has no linked paper and no cell type or organism
  is stated, so organism is empty. Masks are called instance masks because they are
  StarDist training targets (not verified from pixel values). Sibling ZeroCostDL4Mic/StarDist
  records (e.g. zenodo-4034976, s-biad895) are different datasets (fluorescence).'
