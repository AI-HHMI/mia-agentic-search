notes: 'Heart: 9 diseased + 5 healthy images, collagen segmentations (seg/) for the 5 healthy only. Kidney: 4 diseased + 12
  healthy images, each with a collagen segmentation and a glomeruli mask (Annotations_*.tsv manifests). n_items (30) counts
  raw images; each also has a white-balanced -norm.tif. Annotation source is mixed (study API): collagen seg/ = automatic
  (Labkit random forest); glomeruli mask/ = FeatureForest (SAM2) then manually curated in napari. No publication is listed
  in the BioStudies record. enricher: voxel size not found (headers uncalibrated, study API states only "200x magnification",
  no paper). Size estimated from shapes (was null).'
