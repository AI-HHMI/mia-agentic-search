title: Quantifying Fibrosis in the Hearts & Kidneys of Rats impacted with CKD
short_name: Rat heart/kidney fibrosis segmentation (brightfield)
description: Sirius Red-stained brightfield images (200x, Nikon Eclipse e 300) of paraffin heart and kidney sections from
  healthy and 5/6-nephrectomized Sprague Dawley rats, in raw and normalised versions. Heart sections have collagen segmentation
  masks; kidney sections have collagen segmentation masks and glomeruli masks. Labkit classifier files used to produce the
  segmentations are included. Selected for AI4Life Open Calls 2023 (OC1).
