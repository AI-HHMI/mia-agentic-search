notes: 'Heart: 9 diseased + 5 healthy images; heart healthy has 5 collagen segmentation masks (seg/), diseased heart folder
  lists no masks. Kidney: 4 diseased + 12 healthy images with segmentation and glomeruli masks (4 + 12 each), per the Annotations_*.tsv
  manifests. Counts are from the manifests and directory listing; n_items (30) counts raw images. Masks appear generated with
  the included Labkit classifiers (heart_labkit_classifier / kidney_labkit_classifier), so source is recorded as automatic
  and not manually verified. Image size 1024x1536 RGB uint8 (probe of a kidney image header); pixel size not stated in headers
  or the study page. No publication is listed in the BioStudies record, so no paper could be read. Total size and author names
  were not available in the fetched API record fields.'
