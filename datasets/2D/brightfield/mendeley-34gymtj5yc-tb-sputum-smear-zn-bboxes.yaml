notes: 'Zip listing (peek_archive): images/{train 856, val 214, test 268} and matching labels/ .txt files (1,338 each); 1,220 .jpg and 118 .png. Split counts come from that listing. Pixel size, magnification and image resolution are not stated on the dataset page and no related paper is listed on the page; a Europe PMC title search found no matching paper, so voxel size is null. Camera systems: Hayear and Optilab. Annotation described on the page as manual; annotator details not given. metadata.csv records each image''s dominant background colour and split. Mendeley Data page is the host (repository: other).'
