title: Avian Blood Cell dataset
short_name: Avian blood smear cells (brightfield)
description: 4,600 avian blood smear microscopy images with five cell types (red blood cells, thrombocytes, lymphocytes,
  heterophils, monocytes). 1,000 images are labelled (500 with both segmentation masks and YOLO bounding boxes, 500 with
  bounding boxes only) and 3,600 are unlabelled, with a train / test split of the labelled images. Image sizes range from
  1280 x 720 to 3264 x 1840 pixels.
