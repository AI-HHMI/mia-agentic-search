notes: 'From the Zenodo record and the zip listing via peek_archive (6,099 files: 4,599 PNG images, 1,000 .txt, 500 .tif). The associated
  paper is mentioned but not cited on the record and a title search found none, so species, microscope, objective, staining and pixel
  size are not stated in anything checked: organism, labels_stains and voxel_size_nm are left empty. Image modality is assumed to be
  brightfield-type blood smear imaging but this is not stated explicitly. test_set has YOLO boxes only (500 .txt); masks exist for train_set
  only. enricher: annotated images are 640x640 (resized, per the record), unannotated ones keep their original size; masks are uint16
  instance IDs.'
