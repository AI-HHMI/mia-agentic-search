notes: 'Zenodo lists 87 JPG images, each with a small annotation ZIP: CNN1 set 32 images (27 Keyence microscope, 5 flatbed scans), CNN2 set 55 (Keyence, 200x transillumination). Preprint: CNN1 175,105 annotated tiles (colonised, non-colonised, background); CNN2 tiles with arbuscules, vesicles, hyphae, hyphopodia. Annotations bootstrapped (10 images manual, rest CNN-predicted and user-corrected), hence mixed. Pixel size not stated on the page, API or preprint. Size is the approximate 6.1 GB total from the page.'
