schema_version: '1.2'
id: zenodo-5118948-amfinder-mycorrhiza-roots
title: AMFinder training dataset
short_name: Mycorrhizal fungi in stained roots (BF tiles)
description: 87 JPG images of ink-stained, ClearSee-treated Nicotiana benthamiana roots colonised by the arbuscular
  mycorrhizal fungus Rhizophagus irregularis (high-magnification digital microscope images and flatbed scans, plus
  background images), each with a small ZIP of tile-level annotations. Used to train the AMFinder CNNs that classify
  root tiles as colonised, non-colonised or background (CNN1) and detect arbuscules, vesicles, hyphopodia and intraradical
  hyphae (CNN2).
