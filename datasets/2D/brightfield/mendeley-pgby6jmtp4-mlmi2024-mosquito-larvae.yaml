notes: 'Mendeley API lists 800 .jpg files in 8 folders of exactly 100 each, consistent with the paper
  (2 species x 4 views x 100); folder names were not retrievable (the folders endpoint is behind a Cloudflare
  check), so the species/view mapping is from the paper. Magnification and pixel size are not stated in
  the paper or the Mendeley record, so voxel size is null. Images are unaugmented originals cropped to
  3,456 x 3,456 px. Whole-organism preparations imaged through a microscope, not cell-level microscopy.
  No split provided. enricher: channels 3 (RGB, one sampled image).'
