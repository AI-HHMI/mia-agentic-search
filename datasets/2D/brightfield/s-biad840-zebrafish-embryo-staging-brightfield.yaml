title: Automated staging of zebrafish embryos with deep learning
short_name: Zebrafish embryo staging by age (brightfield)
description: 33,408 brightfield images of individual zebrafish embryos from two 96-well time-lapse plates
  imaged every 15 min at 28.5 C (Dataset C) and 25.0 C (Dataset D), each image labelled with its hours
  post fertilisation. Used as an out-of-site test and transfer-learning set for the KimmelNet embryo age-regression
  model.
