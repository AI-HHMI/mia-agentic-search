notes: 'The label is the embryo age (hpf, regression target) derived from the imaging time, not a manual annotation;
  the paper says no manual annotation was required. Types/tasks are therefore recorded as other (age regression).
  The TSV lists 16,512 PNGs in Dataset_C and 16,896 in Dataset_D (33,408 total, matching Table 1 of the paper) plus
  a Raw folder (2 listed entries). Imaging: Nikon Ti-E, Hamamatsu BT-Fusion sCMOS, 4X/0.13 Plan Fluor objective;
  pixel size is not stated in the paper or on the page. Dimensionality is recorded as 2D (single-embryo frames) although
  the source is a time-lapse; image size was not inspected. The training data (datasets A/B) are in S-BIAD531, not
  in this study. Total size not computed.'
