notes: 'The label is the embryo age (hpf, regression target) derived from the imaging time, not a manual
  annotation; the paper says no manual annotation was required. Types/tasks are therefore recorded as
  other (age regression). The TSV lists 16,512 PNGs in Dataset_C and 16,896 in Dataset_D (33,408 total,
  matching Table 1 of the paper) plus a Raw folder (2 ND2 files). Imaging: Nikon Ti-E, Hamamatsu BT-Fusion
  sCMOS, 4X/0.13 Plan Fluor objective; pixel size is not stated in the paper or on the page. The training
  data (datasets A/B) are in S-BIAD531, not in this study. enricher: size_bytes from file_list.json (PNGs
  25.7 GB + two raw ND2 files 97.0 GB; was null; nd2 added to formats for the Raw files); sampled PNGs
  are 966x1155 8-bit grayscale.'
