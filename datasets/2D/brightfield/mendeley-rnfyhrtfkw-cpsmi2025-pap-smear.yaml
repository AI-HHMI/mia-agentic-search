notes: 'File list from the Mendeley API: 2,169 .jpg files in one flat folder, class counts from file-name prefixes (squamous 658, low_grade 387, high_grade 290, adeno 277, invasive 263, inflammatory 141, in_situ 70, endocervical 61, metaplasia 22), matching the paper table. Pixel size is derived, not stated: field of view 314.34 x 235.6 um over 2028 x 1520 px gives 0.155 um/pixel. Images were downsampled to one quarter of the sensor resolution (LANCZOS). Labels are field-of-view level (the most advanced lesion present), not per cell; no split provided. The 2,169 files are 3.33 GB per the Mendeley size field.'
