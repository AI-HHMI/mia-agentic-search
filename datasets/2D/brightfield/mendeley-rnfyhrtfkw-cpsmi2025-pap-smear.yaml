  low-cost open-design microscope (20x, 0.4 NA, Raspberry Pi HQ camera), sorted into nine subcategories
  (squamous, endocervical, metaplasia, LSIL, HSIL, in situ, invasive, adenocarcinoma, inflammatory) grouped
  into four major categories, on slides read by a pathologist and a cytotechnologist.
