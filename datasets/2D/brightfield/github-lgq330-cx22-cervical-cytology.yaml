description: 'Cervical cytology images with completely annotated cytoplasm and nucleus instances: 14,946 cellular instances in 1,320 images generated by an ROI-based label cropping algorithm from earlier
  open-source images of the authors institute (CCEDD). Labels are MATLAB .mat files with clump, instance and bounding-box labels.'
