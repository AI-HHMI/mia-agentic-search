notes: 'Terms (GitHub README): non-commercial research and education use only, no formal license named, so license.spdx is custom. Labels are in Cx22-Pair.zip, Cx22-Multi-Train.zip and Cx22-Multi-Test.zip
  in the GitHub repo; the source images (png.zip) come from the separate CCEDD dataset (github.com/nachifur/LLPC, SharePoint link, USTC mirror) which also forbids redistribution. Zip contents could not
  be listed (GitHub returned 403 to range requests), so file names are as stated in the README, not verified. Image size, magnification, microscope, stain and pixel size are not stated in the README, the
  LLPC page or the paper abstract; the paper full text is not open access (Europe PMC) and was not read. Publication date not found. Number of images 1,320 is the generated crops, source CCEDD image count
  not stated. Human organism inferred from cervical cytology.'
