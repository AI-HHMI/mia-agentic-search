notes: 'Single zip fungal_data.zip (1.81 GB; 1,320 .ome.tiff, 2.77 GB uncompressed) listed with peek_archive;
  one folder per species. Paper is not open access (ScienceDirect 403, no Europe PMC full text), so magnification,
  camera, pixel size, image dimensions and per-species counts could not be checked; voxel_size_nm is null.
  Labels are the culture species, since each plate holds a single species. Sources checked: Zenodo record
  API, archive listing, Crossref/Europe PMC abstract. enricher: 660 RGB + 660 greyscale 1024x1024 uint8
  OME-TIFFs (half of each species folder); OME header pixel size 68.03 nm not adopted (stale header on
  grey files, see technical.notes). organisms: Lasiodiplodia brasiliensis = share_data/brasiliensis/,
  L. crassispora = share_data/crassispora/, L. exigua = share_data/exigua/, L. gilanensis = share_data/gilanensis/.'
