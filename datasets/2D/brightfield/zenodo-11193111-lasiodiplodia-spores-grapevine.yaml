  notes: 'Listing: fungal_data.zip central directory read by range (1,320 .ome.tiff, 2,770,859,520 B uncompressed;
    zip 1,808,512,198 B, the only file in the Zenodo record, so size is exact). Probed 2 members (tools/probe.py:
    uint8, uncompressed, single page, tiff_layout shaped) and read 8 members whole with a scratch tifffile
    script (sample.py treated the /content URL as HDF5): RGB 1024x1024x3, grey 1024x1024. value_range
    is from one sample file per array. OME metadata in every file read: Nikon Eclipse E200 upright, detectors
    IDS UI-3370CP and UI124xSE-C, PhysicalSizeX/Y 68.03 nm. Voxel size left null: the grey files OME Pixels
    block (2048x2048 uint16) does not match the stored 1024x1024 uint8 array, so it is unclear whether
    68.03 nm applies to the stored grid or to the original 2048 px frame (would be 136.06 nm if downsampled);
    no doc states it. Checked: OME headers of 8 files across all 4 species, Zenodo record API (description
    only), paper (gold OA but ScienceDirect 403, Elsevier API metadata only, not in Europe PMC; no preprint
    found via OpenAlex/Semantic Scholar), no code repo linked. No label files: classification labels are
    the species folder names. No train/test split in the archive.'
