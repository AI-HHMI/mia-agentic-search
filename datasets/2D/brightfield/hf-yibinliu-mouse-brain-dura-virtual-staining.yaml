notes: 'Not a labelled-object dataset: the training signal is the paired fluorescence image of the same field (virtual
  staining, brightfield input and fluorescence target), which is why annotations.types and ml.tasks are other and source is
  automatic (no human annotation). The card states that channel names record staining, not segmentation annotations, and
  that no physical pixel calibration is supplied; microscope model and objective are not named. Images are 8-bit RGB/RGBA
  TIFF with pseudocolours; the patch release is NPY. Counts (4,526 TIFFs, 3,191 field pairs, 70,906 patch pairs and the split of
  13/3/3 animals) are taken from the dataset card; only the HF file tree (one 39.1 GB ZIP64 archive that the card says
  expands to about 101 GB, plus README and checksums) was inspected, so the archive contents were not listed.
  No article or DOI is available yet according to the card.'
