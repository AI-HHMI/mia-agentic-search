notes: 'Not a labelled-object dataset: the training signal is the paired fluorescence image of the same field (virtual
  staining, brightfield input and fluorescence target), hence annotations.types and ml.tasks other and source automatic.
  The archive README states that channel names record staining, not segmentation annotations, and that no physical
  pixel calibration is supplied; microscope and objective not named (file names say 40X). Counts (4,526 TIFFs, 3,191
  field pairs, 70,906 patch pairs, 13/3/3 animal split) from the README. No article or DOI yet (CITATION.cff). enricher:
  zip listed (147,166 members) and TIFF pair sampled; download_url set to the direct zip (was landing page); formats
  stay tiff (patches are NPY, not a schema format).'
