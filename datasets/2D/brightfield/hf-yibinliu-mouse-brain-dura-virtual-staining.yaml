description: 3,191 same-field paired brightfield and immunofluorescence images (DAPI, IBA1, CD206, LYVE1 and a
  neutrophil-associated marker) of brain and dura mater from 19 C57BL/6J mice treated with PBS or LPS, released
  for virtual-staining (brightfield-to-fluorescence) learning. Includes the 4,526 unchanged source TIFFs, 70,906 paired
  256x256 NPY patch pairs with an animal-level train/val/test split, and benchmark reports.
