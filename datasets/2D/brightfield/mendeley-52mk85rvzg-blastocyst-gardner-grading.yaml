notes: 'Mendeley file listing (public API): 3 Roboflow split folders - 10,669 JPGs + COCO JSON (training; 5 augmented copies
  per source image: flips, 90-degree rotations, brightness/exposure +-5%, salt-and-pepper, resized 312x312), 501 JPGs + COCO
  JSON (validation), and a folder with only a COCO JSON (1,005 images; images not in listing). README states 19,086 images
  total. No paper cited on the record; microscope, camera and pixel size not stated. Instances are whole-embryo outlines labelled
  with the grade (grading/detection, not ICM/TE structure). Files are downloadable per file only, so download_url is null.'
