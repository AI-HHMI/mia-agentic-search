short_name: Human blastocyst Gardner grading (brightfield)
description: Roboflow-exported COCO segmentation corpus of day-5 human blastocyst images (312x312 px JPEG) from one IVF centre.
  Each image carries a polygon outline of the embryo labelled with one of 24 classes (21 Gardner expansion/ICM/trophectoderm
  grades plus the composite labels P1, LP and REV). Released with the Blast-YOLO grading model and inter/intra-rater reliability
  workbooks.
