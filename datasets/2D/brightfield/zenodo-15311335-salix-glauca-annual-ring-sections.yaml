title: Dataset of 50 cross-section images and manual annual ring delineations of Salix glauca from Western
  Greenland
short_name: Salix glauca annual rings (brightfield)
description: 50 high-resolution light-microscopy scans (Zeiss Axio Scan Z1, 100x, 2.26 pixel/um) of safranin
  / astra blue stained thin cross-sections of Arctic willow (Salix glauca) stems from Disko Island, Greenland,
  each with a LabelMe JSON of manually drawn polygons for every annual ring, the pith and the outer boundary,
  each ring labelled by year.
