notes: 'Access is restricted: the Zenodo record is public but its files need a login and a request form
  (also stated in the paper: "Access to the dataset is restricted and requires submission of a formal request").
  Kept as a well-known challenge benchmark (MICCAI 2024 mAIcetoma), hence the low confidence. The Zenodo page
  lists no files (total 5.1 GB), so the file list could not be inspected and annotations were not seen in a
  listing. Facts on images (JPEG RGB, 800x600, 10x), masks (TIFF) and class counts come from the arXiv paper
  (fetched through its HTML version; tools/paper.py found no match). Pixel size and train/test split are not
  stated in the dataset paper or the challenge paper (the split percentages given there are inconsistent). The
  dataset is also hosted by the AFRICAI XNAT repository.'
