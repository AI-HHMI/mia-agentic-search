description: 864 H&E-stained surgical biopsy images (RGB, 800x600 px, 10x, Nikon Eclipse 80i) from 142 patients
  with eumycetoma (471) or actinomycetoma (393), each with a binary expert mask marking the fungal or bacterial
  grains. Used as the data of the MICCAI 2024 mAIcetoma challenge.
