notes: 'Dataset.zip (121.7 MB) has TRAINING_IMAGES (300 pairs) and TEST_IMAGES (40 pairs), each with BL_slices_quartered (images)
  and mask_slices_quartered (masks); 340 pairs, matching the paper. The record also ships the trained StarDist model (102
  MB zip, incl. 40 QC prediction TIFFs). enricher: voxel size 64.8 x 64.8 nm from the ImageJ calibration (unit micron) of
  a training and a test image (was null; not stated in the Zenodo text or paper Methods; plausible for 100x / sCMOS). enricher:
  modality brightfield added first: the Zenodo description calls the images brightlight (BL folders), acquired on a DeltaVision
  widefield system. enricher: size is the complete Zenodo listing (dataset zip + model zip + example PNG; was the dataset
  zip alone). Mask encoding instance IDs (sampled; trained with StarDist).'
