description: 100 Gram-stained smear whole slide images (about 20164x11828 px, 63x objective without oil)
  from six clinical sample groups, released as JPEG WSIs plus 14,520 JPEG tiles (2048x1536) with CSV bounding
  boxes for leukocytes and epithelial cells; WSI-level Labelme annotations in a 7z archive. Introduced
  for efficient cell labelling in Gram stain WSIs.
