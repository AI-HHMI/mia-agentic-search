notes: 'Zip lists final_train/<taxon>/ folders (3222 jpg + 310 png images in all), a final_test/Mix folder (153 files), train.json
  (2.0 MB) and val.json (0.2 MB). The Zenodo text states 3379 training and 85 test images; counts here follow the zip listing
  (3532 image files). The cited paper (Forests 2023, Liolios et al.) is a flora-recording study; full text was not open via
  Europe PMC, so imaging details come from the Zenodo description (Olympus SZX12, 40x lens, Olympus SC30 camera). Pixel size
  not stated. Organism field left empty: the classes are plant taxa of the pollen (mixed species), see class folders. Annotation
  sources were the Zenodo description and the zip file listing. enricher: COCO files checked: train.json 3379 images / 4961
  polygons, val.json the 153 final_test/Mix images / 464 polygons, 40 categories.'
