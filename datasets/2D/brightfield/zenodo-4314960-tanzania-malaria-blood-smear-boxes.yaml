notes: 'Zenodo record 4314960 (also listed as 4314959, same files). malaria_dataset.zip (148.9 MB) lists 5,453 .jpg + 5,453 .xml
  + output.json + mapper.csv, all under COCO_mkapa_train/. One example XML: 750x750x3, classes Plasmodium trophozoite and WBC;
  the full class list was not counted. Magnification (100x oil, Olympus CX21, iPhone 6s+) is from the Zenodo description; pixel size
  is not stated. No publication was found for this deposit (the 2024 Data in Brief Tanzania malaria paper is a different, classification-only
  Dataverse dataset by other authors). Image count is the zip listing, not stated on the page. No train/val/test split is provided.'
