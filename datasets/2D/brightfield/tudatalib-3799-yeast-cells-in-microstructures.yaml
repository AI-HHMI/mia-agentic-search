description: 493 brightfield images (128x128 crops, each centred on a trap microstructure pair) of Saccharomyces
  cerevisiae cells in microfluidic traps from time-lapse experiments, with manual pixel-wise instance annotations
  of cells and traps, bounding boxes, and a train/val/test split (296/49/148).
