notes: 'Hosted at TUdatalib (handle tudatalib/3799), which was behind a bot challenge, so the file listing, size
  and DOI were not read from it; the download URL is the wget link from the GitHub README and the zip was not listed
  (annotations_verified false). Format: README says each sample is a .pt PyTorch tensor file, which has no format
  enum, so other. Counts, splits (296/49/148), manual annotation and 128x128 crops are from the paper (EMBC 2023,
  arXiv 2304.07597); the README example shows 256x256 and relative xcycwh boxes, an unexplained discrepancy. MIT
  license is stated on the project page. Pixel size and microscope not stated in the paper text read. enricher:
  license.url = project page (states MIT). Same TUdatalib item 3799 as open PRs #141, #505, #738; keep one.'
