notes: 'Kaggle API file list shows 58 TIFF images, 58 mask TIFFs and 116 XML files (232 files, 160 MB). The benchmark
  paper (BMC Bioinformatics 2009, Table 2) states 58 H&E images from the Rimm laboratory (Yale) with ground truth
  obtained for 50 of them, 896 x 768 or 768 x 512 pixels, benign and malignant; the mirror ships 58 masks, so mask
  coverage of the extra images is unverified. The Kaggle page states CC BY 3.0 (the paper itself is CC BY 2.0).
  The original UCSB page (bioimage.ucsb.edu) says data are being migrated, so this Kaggle mirror is the hosting
  page. Pixel size is not stated on the Kaggle page or the paper tables read. Splits are not provided. enricher:
  download_url is the anonymous Kaggle archive API URL (was the landing page), download_method http (was api).'
