  notes: 'Listing: Kaggle file-list API, all 12 pages (232 files, sum 159,819,344 B = the API totalBytes); listing.py
    does not read Kaggle, so size_source is page-stated. Sampled benign1 pair (2.4 MB): image uint8 RGB 24-255;
    mask {0: 677760, 255: 10368}; ranges from one sample. TIFF sizes equal shape x bytes plus header, so compression
    none. Kaggle serves the per-file image URL as a one-member zip, so the raw sample is a member of the archive.
