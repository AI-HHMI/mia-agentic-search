notes: 'Found via the 2026 Cell Reports Methods paper (Europe PMC full text read: Datasets, Annotation workflow, Data availability). Differs
  from the catalog record zenodo-16355179-orgline-organoid-benchmark, which aggregates public organoid datasets (intestine, lung, brain, PDAC,
  colon): this record is the authors'' own in-house stomach and breast data only. data.zip was listed with peek_archive (827 files: 496 JPEG,
  328 PNG, 3 JSON; the first entries are under breast/). Image counts are from the paper (467 stomach, 357 breast; 824 in total), not counted
  in the zip. Which files hold masks versus images was not checked, so the instance-segmentation label is based on the paper (OrgLine uses
  detector-guided SAM prompts). Pixel size is not stated; the tiles are crops of large originals.'
