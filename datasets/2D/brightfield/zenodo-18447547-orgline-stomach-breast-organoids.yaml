notes: 'Found via the 2026 Cell Reports Methods paper (Breast and Stomach annotated fully manually). Differs
  from zenodo-16355179-orgline-organoid-benchmark (public organoid datasets aggregated); this is the in-house
  stomach and breast data. Image counts 467 stomach, 357 breast (zip listing agrees). enricher: zip has
  827 members: breast/images 328 PNG + 29 JPG, stomach/images 467 JPG, breast/coco.json, stomach/coco.json,
  stomach/data.json; the PNGs are images, not masks (was unclear). Instance segmentation confirmed: stomach
  COCO has polygon segmentations. Pixel size not stated (checked Zenodo API, paper full text, OrgLine
  README). download_url set to the Zenodo API file link.'
