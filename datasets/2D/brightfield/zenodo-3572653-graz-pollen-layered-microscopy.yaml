notes: 'data.zip (1.58 GB, 14,170 members) holds 9,170 JPEG depth layers, 4,998 .txt label files, 2 .names
  files and fold lists; weights.zip (380 MB) holds two pre-trained weight files. The paper reports 1,077
  samples / 9,170 layers / 9,059 pollen annotations over 15+ types, with 46% of layers empty; train/validation
  from one day, test from another. Camera is a 3264x2448 IMX179 module; pixel size and magnification
  are not stated in the paper text read, so voxel size is null. Label file contents were not opened
  (only listed), so the exact class encoding is unverified. Images are not from a standard research
  microscope; they are brightfield-like transmitted light. Checked: Zenodo page and API record, zip
  listing, EWSN paper PDF.'
