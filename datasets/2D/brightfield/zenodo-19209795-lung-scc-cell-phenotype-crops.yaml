notes: 'Zenodo record lists 11 zips (Patient01-Patient11, 46.1 GB). Patient02.zip was listed with peek_archive:
  1,726 TIFF crops in 7 phenotype folders plus a positions.csv per folder; the other zips
  were not listed. The paper states nearly 20,000 annotated cells in 11 patients, so n_items is left null.
  Pixel size 0.12 um is the scan resolution from the paper Methods (Pannoramic 1000, 40x); the crops'' own
  scale was not checked. The paper''s data statement says image data are available on request, while the
  Zenodo record is open under CC-BY-4.0. Annotation: the paper says an expert pathologist labelled cells;
  nuclei centres came from nucleAIzer. No predefined splits.'
