title: Lung squamous cell carcinoma H&E cell-centred crops with seven phenotype labels
short_name: Lung SCC H&E single-cell phenotype crops
description: Cell-centred 1000 x 1000 px crops from H&E-stained whole-slide images of human lung squamous cell carcinoma
  (11 patients, one zip per patient). The class label belongs to the cell at the centre of each crop and is given
  by the folder name (chondrocytes, lymphocytes, mitotic SCC cells, necrosis, other non-neoplastic cells, plasma
  cells, SCC cells); a positions.csv per class folder lists the cell positions. Generated for microenvironment-aware
  single-cell phenotype classification.
