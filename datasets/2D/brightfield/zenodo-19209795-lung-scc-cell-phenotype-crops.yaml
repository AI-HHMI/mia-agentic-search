notes: 'Zenodo record lists 11 zips (Patient01-Patient11, 46.1 GB). Pixel size 0.12 um is the scan resolution from
  the paper Methods (Pannoramic 1000, 40x). The paper''s data statement says image data are available on request,
  while the Zenodo record is open under CC-BY-4.0. Annotation: the paper says an expert pathologist labelled cells;
  nuclei centres came from nucleAIzer. No predefined splits. enricher: all 11 zips listed: 19,678 TIFF crops in
  7 class folders (n_items was null); size from the full listing.'
