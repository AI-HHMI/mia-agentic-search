schema_version: '1.2'
id: zenodo-20114049-pbc-extended-yolo-9-class
title: PBC labeling Extended - peripheral blood cell YOLO detection with erythrocytes
short_name: Blood cell detection, 9 classes (smear)
description: Enhanced version of the public peripheral blood cell dataset 'PBC labeling'. The original eight target
  classes (basophils, eosinophils, erythroblasts, immature granulocytes, monocytes, platelets, lymphocytes, neutrophils)
  were extended with manually annotated erythrocytes (LabelImg) and cleaned of low-quality or mislabelled samples.
  1,910 microscopic images in YOLO format, split into train (1,372), validation (356) and test (182). Built for
  training cell detection models used in optical-tweezers cell manipulation path planning.
