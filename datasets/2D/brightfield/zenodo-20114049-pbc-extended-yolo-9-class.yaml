notes: 'Counts come from the Zenodo description; pbc_improve.zip was listed with peek_archive (3,830 members: images
  and labels under train/val/test, data.yaml, classes.txt, two .cache files) and classes.txt shows the 9 classes
  (Basophills, Eosinophills, Erythroblast, Ig, Monocytes, Platelets, lymphocytes, neutrophils, erythrocyte). The
  record names no paper; the source PBC dataset page was not fetched this run, so organism, stain, microscope and
  pixel size are left empty/null, and the brightfield modality is an assumption for stained smear microscopy.
  Differs from TXL-PBC (figshare-27073186, 1,260 images from four datasets) and from the PBC classification
  records: this is PBC-only with a 9th erythrocyte box class. Annotation of erythrocytes was manual (LabelImg).'
