notes: 'Counts come from the Zenodo description and the zip listing (3,830 members: images and labels under train/val/test,
  data.yaml, classes.txt, two .cache files, a nested Roboflow export zip); classes.txt lists the 9 classes. Differs
  from TXL-PBC (figshare-27073186, 1,260 images from four datasets) and from the PBC classification records: this
  is PBC-only with a 9th erythrocyte box class. Annotation of erythrocytes was manual (LabelImg). enricher: organism,
  stain and microscope from the upstream PBC paper (Acevedo et al. 2020: CellaVision DM96, May Grunwald-Giemsa,
  Hospital Clinic of Barcelona); channels 3 (RGB sample); images are 224x224 (resized from 360x363).'
