  notes: 'Listed all 61 Zenodo files (complete, exact sizes). Probed B310-CondCO-day18-a.tif and B6-CondCO-day18-a.tif
    (960x1280 uint8, ImageJ, 2.1600045 um/px); sampled B310-a.tif (1.23 MB): [0, 255], mean 174, p1-p99
