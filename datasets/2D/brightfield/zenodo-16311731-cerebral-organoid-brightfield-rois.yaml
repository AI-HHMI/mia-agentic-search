notes: 'Zenodo API listing: 61 files = 20 raw TIFFs, 20 .roi, 20 JPG outputs, 1 CSV (27.5 MB). The paper Methods (Morphometric analysis) state that organoids were imaged on an Evos XL Core in brightfield and that "the ROI encompassing the outline of the organoid was traced manually" in Fiji/ImageJ; this record is a 20-organoid reference subset (7 batches, 3 conditions) selected from that study. Pixel size is not stated on the Zenodo record or in the paper Methods; ROI measurements are reported in um in the CSV, so calibration is in the files. Species is human because the paper uses human stem-cell-derived cerebral organoids. Small dataset (20 images), best suited to evaluation or fine-tuning. The .roi files are ImageJ-specific; the JPGs are analysis overlays, not additional raw images.'
