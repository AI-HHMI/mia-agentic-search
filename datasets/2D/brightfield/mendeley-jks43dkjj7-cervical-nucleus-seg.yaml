notes: 'Single archive dataset_forsubmit.rar (97,737,120 bytes, sha256 8fa03a91...). RAR cannot be listed with peek_archive; the first 20 KB of the archive (range request) shows member paths such as dataset_forsubmit\GroundTruth\1.bmp, so masks are BMP; the folder holding the raw images and the image format were not seen. formats is other because BMP is not a listed format. Image dimensions, magnification, stain and pixel size are not stated on the dataset page; the paper is not open access (Europe PMC has only the abstract), so Methods could not be read. Image count (104) and expert annotation come from the Mendeley page and API description. Images are described only as from a Chinese hospital and a device company; patient/organism is assumed Homo sapiens from the cervical cytology context.'
