schema_version: '1.2'
id: yeast-in-microstructures-brightfield-instances
title: Yeast in Microstructures - instance segmentation of S. cerevisiae cells and traps in brightfield
  time-lapse images
short_name: Yeast cells in microstructures (brightfield)
description: 493 densely annotated brightfield microscopy images of Saccharomyces cerevisiae cells in
  microfluidic trap microstructures, taken from different time-lapse fluorescence microscopy experiments.
  Pixel-wise instance masks, a class (trap or cell) and bounding boxes are provided for every instance,
  with train, validation and test subsets.
