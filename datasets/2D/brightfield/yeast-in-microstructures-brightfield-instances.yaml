notes: The TUdatalib host (handle 3799) returned 403 (bot protection) for the landing page and the zip,
  so the file listing could not be checked; formats, folder layout and class ids come from the GitHub
  README, and the zip is a PyTorch .pt layout (hence formats other). Paper full text is not open access
  (Europe PMC abstract read; the arXiv PDF could not be parsed), so microscope, magnification, pixel size
  and split sizes are not stated on the project page, README or abstract. The README gives input size
  as 128x128 in one place and 256x256 in another. The MIT license is stated on the project page. No TUdatalib
  DOI was found. A related, higher-resolution panoptic dataset (TYC, ICCVW 2023) and about 9k unlabeled
  images (TUdatalib handle 2880) are separate and not included.
