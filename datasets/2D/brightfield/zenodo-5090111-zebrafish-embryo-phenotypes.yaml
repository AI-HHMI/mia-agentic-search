notes: 'Zip listing (peek_archive, 2,656 members) gives Learning Sets (928 images, 11 phenotype folders),
  Test Sets (512), a Validation Set of 1,191 unlabelled images in 8 session folders (caffeine, DCA, theophylline)
  and a README mentioning 24 "stressed" images without expert consensus. Labels, microscope, resolution
  and treatments are from the PLOS ONE paper (Methods, open access). Phenotype folders overlap in the
  paper (images can carry several phenotypes); this was not checked in the files. Pixel size / scale per
  image is not stated (only magnification 1.6x). enricher: doi 10.5061/dryad.23d30 from the Zenodo API
  (Dryad mirror); images 2576x1932 RGB (sample).'
