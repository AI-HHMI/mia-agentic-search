notes: 'Zip listing (197 members): Training_data/Training_source and Training_target (77 TIFFs each), QC_data/Input and Output
  (10 each), StarDist_model weights and logs. The paper Methods (bioRxiv full text) confirm 77 manually annotated paired images,
  8x augmentation during training and an F1 of 0.968. Pixel size 1.3148 um is from the Zenodo description. Different from
  the catalogued 20x dataset (zenodo-10572122, 20 training pairs at 20x): other magnification and images. Organism Homo sapiens
  is inferred from the human PDAC cell lines named in the paper (e.g. MIA PaCa-2); the endothelial cell source was not checked.
  Which of QC_data/Output is the mask rather than a prediction was not checked.'
