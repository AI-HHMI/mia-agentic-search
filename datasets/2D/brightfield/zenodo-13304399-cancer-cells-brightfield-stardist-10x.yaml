description: 77 training pairs and a 10-image quality-control set of 10x brightfield images (1024 x 1022 px) of cancer cells
  perfused over an endothelial cell monolayer, with manually segmented label masks, released with a ZeroCostDL4Mic StarDist
  model (Nikon Eclipse Ti2-E, 10x objective). Companion to the 20x dataset.
