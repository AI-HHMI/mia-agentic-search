notes: 'Size (about 2 TB on pCloud, about 50 GB compressed on Kaggle) and about 90K pairs are the approximate values on the
  dataset page; the file listing was not read, so file format PNG comes from the stated image-name pattern. The paper reports 59,
  60, 60 and 52 WSI pairs (231) for ER, PR, Ki67 and HER2 (discussion says roughly 240); 147,404 pairs were inspected and
  54,635 discarded. Pairs were registered manually region by region; DAB values come from StarDist plus colour deconvolution with
  thresholds set by one pathologist, and pairs were inspected by two reviewers, so the source is recorded as mixed.
  The paper is on arXiv only (no peer-reviewed version found); no separate pixel size is given (40x Aperio GT 450). The license
  CC BY-NC-SA 4.0 is from the dataset page. Labels may be updated by the maintainers. No train/test split was found. The release
  date is not stated.'
