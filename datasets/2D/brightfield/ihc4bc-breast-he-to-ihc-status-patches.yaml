    - 3000
    - 4
    shape_varies: null
    dtype: uint8
    compression: deflate
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: H&E tile, RGBA PNG (probe).
  - role: target
    path_pattern: IHC/*/*.zip::Subregion_*/*.png
    format: png
    axes: yxs
    shape:
    - 3000
    - 3000
    - 4
    shape_varies: null
    dtype: uint8
    compression: deflate
    value_range: null
    normalization: unknown
    alignment: same-grid
    alignment_notes: 'Pair rule: same zip name (patient) under HandE/<stain>/ and IHC/<stain>/ and the same member path. Same
      3000x3000 shape; consecutive sections registered manually region by region (paper), so only approximately aligned.'
  - role: label
    path_pattern: Labels/Labels_*/*.csv
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: other
    classes: null
    alignment: not-applicable
    alignment_notes: 'One row per tile: file_image (Patient_x/Subregion_k/<name>.png), manual_annot (a = automatic, 0 = set
      to 0 by annotator), num_nuclei_HandE, then one average DAB value per nucleus (variable column count). Patient_26_27011
      ER: 24 rows.'
  notes: 'pCloud folder listing (directLinkData JSON per folder): 7 folders, 410 per-patient zips, exact sizes summing to
    1,703,631,084,957 B; IHC/Her2 is not on pCloud (HandE/Her2 is), so the listing is not the whole dataset and size_bytes
    keeps the page-stated ~2 TB. GitLab labels repo: 232 CSV + README. Peeked HandE/ER and IHC/ER Patient_26_27011.zip (24
