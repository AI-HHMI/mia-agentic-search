schema_version: '1.2'
id: ihc4bc-breast-he-to-ihc-status-patches
title: 'IHC4BC: ImmunoHistoChemistry for Breast Cancer (Ki67, ER, PR and HER2 from H&E)'
short_name: IHC4BC breast H&E and IHC patch pairs
description: About 90K filtered pairs of H&E and IHC (H-DAB) patches, 3000 x 3000 px with stride 1500, from about 231-240
  whole-slide image pairs of breast biopsies (ER, PR, Ki67 and HER2). Labels are CSV files per image with a reliability mark,
  the nucleus count and the average DAB value per nucleus (HER2 pairs were labelled by inspection). Built to predict Ki67,
  ER, PR and HER2 status from H&E.
