      \     60   257 GB\n  IHC/ER/Patient_<a>_<b>.zip       59   193 GB\n  IHC/Ki67/Patient_<a>_<b>.zip     60   191 GB\n\
      \  IHC/PR/Patient_<a>_<b>.zip       60   175 GB\n    (zip) Subregion_<k>/<a>_<b>_<k>_<i>_<j>.png\ngitlab.com/ihc4bc-dataset/labels:\
      \ Labels/Labels_{ER,Her2,Ki67,PR}/Patient_<a>_<b>.csv  (232 CSV)\n"
