      (90% of pixels) and nuclei near white, with thousands of slightly different colours (lossy-compression
      artefacts), so threshold e.g. channel 0 > 127. README (NucleiSegNet): binary labels.'
  notes: 'Listing: Mendeley public API (1 file, 134,824,094 B) plus the zip index (peek_archive): 478
