notes: 'KMC_LIverSegmentation.zip (135 MB) holds 478 PNGs: Train 195 pairs, Validation 39, Test 5 (data/
  and label/ folders, counted with peek_archive). Mendeley says 80 images of 1920x1440 px, but the zip
  has 239 pairs, so these are probably tiles cut from the 80 images; tiles are 512x512 (enricher sample).
  Mendeley v1 is dated 2026-09-08, the paper is from 2021. The paper full text is not open access (abstract
  only); the GitHub README says the same data is also sent on email request with its own non-commercial
  terms, while the Mendeley record states CC BY 4.0.  Pixel size is not stated. enricher: labels are near-binary
  RGB PNGs with compression noise (background ~[0,1,5], nuclei ~white): threshold before use.'
