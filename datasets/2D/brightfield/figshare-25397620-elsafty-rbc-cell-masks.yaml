short_name: Red blood cell masks, 9 classes (brightfield)
description: 240,507 single red blood cells from 25 Wright-stained manual blood smears, each as an 80 x 80 px cropped
  image, a manually traced binary segmentation mask and a segmented image, sorted into nine RBC shape classes
  (rounded, ovalocyte, fragmented, two/three overlapping, burr, teardrop, angled, borderline ovalocyte)
  that were reviewed cell by cell by two senior hematologists. Part of the Elsafty_RBCs_for_AI release.
