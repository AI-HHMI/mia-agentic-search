notes: 'Figshare page, API record and the Scientific Data paper full text (Europe PMC) read. Zip listing (peek_archive)
  shows Cropped images / Masks / Segmented images folders with one zip per class (9 classes each); the inner
  zips were not opened, so PNG format and the 80 x 80 px size come from the paper and description. Masks are
  ground-truth binary masks made by manually tracing cell borders with a digital pen; classes were reviewed
  by two hematologists. Imaging: four camera-microscope setups, 40x objective, 10x eyepiece (400x total), 1600
  x 1200 px cameras with 3.2 um pixels; the object-space pixel size is not stated, so voxel size is null. The
  paper also describes a larger release of 1,003,813 segmented cells in 25 slide folders and a classification
  release (Elsafty_RBCs_for_Classification, figshare 24955569/25599981); this record is the 240,507-cell cropped
  images and masks package only. Cells are single crops, not full fields; 47 K field patches are in separate
  figshare items.'
