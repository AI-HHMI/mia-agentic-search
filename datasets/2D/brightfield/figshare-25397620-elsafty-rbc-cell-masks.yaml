notes: 'Figshare page, API record and the Scientific Data paper full text (Europe PMC) read. Zip listing (peek_archive)
  shows Cropped images / Masks / Segmented images folders with one zip per class (9 classes each); enricher: class-3
  inner zips opened, 80 x 80 RGB uint8 PNGs confirmed (was from paper only). Masks are ground-truth binary masks
  made by manually tracing cell borders with a digital pen; classes were reviewed by two hematologists. Imaging:
  four camera-microscope setups, 40x objective, 10x eyepiece (400x total), 1600 x 1200 px cameras with 3.2 um pixels;
  the object-space pixel size is not stated, so voxel size is null. The paper also describes a larger release of
  1,003,813 segmented cells in 25 slide folders and a classification release (Elsafty_RBCs_for_Classification, figshare
  24955569/25599981); this record is the 240,507-cell cropped images and masks package only. Cells are single crops,
  not full fields; 47 K field patches are in separate figshare items.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "Elsafty_RBCs_Cellular_Images_and_Masks/   (single zip, 3.8 GB, 27 inner zips, 3945.2 MB uncompressed)\n\
      \  Cropped images/    9 zips: CROPPED - Class <1-9> - <class>.zip (70.5-611.4 MB)\n    CROPPED - Class 3 -\
      \ Fragmented RBCs/Slide <n> (<patch>,<X>,<Y>,<W>,<H>).png   (7,186 PNGs)\n  Masks/             9 zips: Masks\
      \ - Class <1-9> - <class>.zip (6.8-64.2 MB)\n    Masks - Class 3 - Fragmented RBCs/<same names>.png      \
      \                        (7,186 PNGs)\n  Segmented images/  9 zips: SEGMENTED - Class <1-9> - <class>.zip\
      \ (15.6-202.9 MB)\n    SEGMENTED - Class 3 - Fragmented RBCs/<same names>.png                          (7,186\
      \ PNGs)\n(inner-zip contents listed for class 3 only)"
    n_files: 1
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/45006208::Elsafty_RBCs_Cellular_Images_and_Masks/Cropped images/CROPPED
      - Class 3 - Fragmented RBCs.zip
    - https://ndownloader.figshare.com/files/45006208::Elsafty_RBCs_Cellular_Images_and_Masks/Masks/Masks - Class
      3 - Fragmented RBCs.zip
    size_bytes: 77293736
    description: 'Class 3 (fragmented RBCs) inner zips: 7,186 cropped 80 x 80 RGB cell images and their 7,186 masks
      (smallest raw + label pair; the dataset has no smaller direct unit).'
  arrays:
  - role: raw
    path_pattern: Elsafty_RBCs_Cellular_Images_and_Masks/Cropped images/CROPPED - Class * - *.zip
    format: png
    axes: yxs
    shape:
    - 80
    - 80
    - 3
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 11
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Pairing: same file name in the Cropped images, Masks and Segmented images zips of the same
      class (all 7,186 class-3 names match across the three). Files are PNGs inside per-class inner zips, which
      are members of the outer zip (nested zips); path_pattern names the inner zips.'
  - role: label
    path_pattern: Elsafty_RBCs_Cellular_Images_and_Masks/Masks/Masks - Class * - *.zip
    format: png
    axes: yxs
    shape:
    - 80
    - 80
    - 3
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: red blood cell
    alignment: same-grid
    alignment_notes: 'Same 80 x 80 grid and same file name as the cropped image. Masks are stored as RGB with 3
      identical channels (200/200 checked, so s is grey stored as RGB). Values are near-binary: 0 and 255 plus low-amplitude
      values (1-3, 252-254; ~3.7% of pixels, up to 16 unique values per mask), so threshold at 128. Class ids 0/255
      are as observed in the sample; the paper calls them binary semantic segmentation masks. The RBC shape class
      (1-9) is given by the zip/folder name.'
  notes: 'Inspected by range-reading three class-3 inner zips (69.3 + 5.4 + 14.1 MB compressed) and decoding 200
    random PNGs per role; value ranges are from that one class sample. Every inner PNG is 19,372 bytes (80 x 80
    x 3 uint8, essentially uncompressed). Nested zips: TensorSwitch''s <zip>::<member> reaches the inner zips but
    not the PNGs inside them. Size: 3,811,213,316 bytes from tools/listing.py (the dataset is one file; matches
    the figshare API). Voxel size not found; checked: PNG headers (no pHYs/info), figshare API record and description,
    paper full text (Methods states only the camera sensor''s 3.2 um pixels, 40x objective, 400x total; object-space
    pixel size not stated and not computed), no README in the archive. Segmented images/ (cell on near-white background,
    80 x 80 RGB uint8, observed [74, 255], same names) is derived from crop+mask and left out of arrays (miao has
    raw/labels only). No evidence found of overlap with PR #1482 (FG HemaSeg, 5 unnamed sources). Not download-ready:
    2D is not covered by the miao layout yet, and voxel size is missing.'
