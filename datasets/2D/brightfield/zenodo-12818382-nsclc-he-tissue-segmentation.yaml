title: Kludt et al. Cell Reports Medicine - Dataset (manual annotations)
short_name: NSCLC H&E tissue segmentation tiles (brightfield)
description: 2,000 image tiles (JPEG) cut from manually annotated H&E whole-slide images of non-small cell lung
  cancer (lung adenocarcinoma and squamous cell carcinoma), with matching pixel-wise PNG masks in 12 tissue classes
  plus non-annotated (tumor, tumor stroma, necrosis, mucin, benign lung, benign connective tissue, blood, bronchial
  mucosa, cartilage, peribronchial glands, inflammatory infiltrate, background). Released as the UKK L1 SEGM manually
  annotated dataset of the lung cancer pathology platform paper.
