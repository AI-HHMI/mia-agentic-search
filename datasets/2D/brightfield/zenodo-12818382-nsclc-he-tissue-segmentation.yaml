notes: 'Zenodo lists no license; the description states "The dataset can be used for academic research purposes
  only", so spdx is custom (non-commercial research). Files: image.zip (2000 JPEG, 131.7 MB), mask.zip (2000 PNG,
  10.6 MB), classes.txt (class codes), listed with peek_archive. Pixel size / tile size of the released tiles is
  not stated on the Zenodo page; paper Methods give MPP 1.0 / 512 px for the training pipeline and note some slides
  were scanned at 20x, but not for this release, so voxel size is null. The paper (PMC11524894) describes the dataset
  as UKK L1 SEGM: 40 extensively annotated WSIs used for validation of segmentation accuracy; annotated in QuPath
  by three analysts and reviewed by a pathologist. No train/val/test split files. Mask value 0 = non-annotated pixels.'
