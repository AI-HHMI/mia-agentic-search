notes: 'BioStudies record and file list (2,009 JPEG files, 2.2 MB in total, about 1 KB each, so these are small single-cell
  crops); CC0. Study text: strain (a-a0)/a0 between 0-0.3 is hard, 0.3-0.6 deformable, above that soft; original camera frames
  were 2736x1824 (Nikon Ti2-U, 40x objective) and cells were detected with YOLOv7. Class labels come from the folder names;
  how strain was measured per image (manual or automatic) is not stated. No related paper was found in Europe PMC, Crossref
  or by web search, so none is listed. Pixel size and splits not stated. enricher: channels 3 (RGB JPEG, samples differ; was
  null).'
