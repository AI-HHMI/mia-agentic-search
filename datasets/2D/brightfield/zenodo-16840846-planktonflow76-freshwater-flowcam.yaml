notes: 'Zip listings (peek_archive): raw_PlanktonFlow76.zip has 129,606 JPEGs (1.78 GB uncompressed) in one folder per class;
  preprocessed_PlanktonFlow76.zip has 198,569 JPEGs (augmented, train/val/test) plus final_dataset/dataset.yaml listing 76 classes.
  The paper reports a 70/20/10 stratified split (90,723/25,921/12,961 images) after pre-processing. Total size is the two
  zip files on Zenodo (1.73 GB + 0.64 GB). Labels were assigned manually in EcoTaxa with single-person validation, so
  occasional errors are possible (stated on the Zenodo page). Pixel size is not stated on the Zenodo page or in the paper
  Methods, so voxel_size_nm is null. FlowCAM is an imaging flow cytometer (brightfield-type imaging, not further specified).
  Classes include non-living particles (detritus, bubbles, aggregates). Related FlowCam plankton datasets are already catalogued
  separately (e.g. zenodo-10554845, zenodo-22012197).'
