title: PlanktonFlow76 - A curated FlowCam dataset for plankton classification
short_name: Freshwater plankton FlowCam, 76 classes
description: FlowCAM images of freshwater plankton and particles from multi-year mesocosm experiments (INRAE UMR DECOD, Rennes),
  one object per image (~400 x 400 px, ZooProcess-segmented), manually labelled into 76 taxonomic and non-living classes.
  Provided as a raw set (~130k JPEGs in one folder per class) and a pre-processed, class-balanced-split set (train/val/test, YOLO-style dataset.yaml).
