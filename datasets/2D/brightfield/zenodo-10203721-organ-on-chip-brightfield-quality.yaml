id: zenodo-10203721-organ-on-chip-brightfield-quality
title: Organ-on-a-chip brightfield images labelled good or bad sample quality
short_name: Organ-on-chip culture quality labels (brightfield)
description: More than 3,000 brightfield microscope images of organ-on-a-chip cultures of six human cell
  lines (A549, Caco-2, HPMEC, HUVEC, NHBE, HSAEC), each labelled 'good' or 'bad' sample quality by a biology
  expert. Images are sorted into train, val and test folders, then by class, cell line and time after
  seeding, and a datasheet lists cell type, time after seeding and, for some images, seeding density
  and flow rate. Intended for training classifiers that judge chip cultures automatically.
