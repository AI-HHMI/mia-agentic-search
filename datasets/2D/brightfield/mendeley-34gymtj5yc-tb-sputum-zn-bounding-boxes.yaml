notes: 'Mendeley file listing could not be read with the tools available (earlier Mendeley records returned an empty list), so size and the folder layout come from the paper, not from a listing. Splits from the paper: 1,149 train images with 9,112 boxes, 142 validation with 1,091, 147 test with 1,244. Annotated in Roboflow by three annotators, with a senior researcher double-checking each image. Pixel size not stated. Mendeley page shows version 9 (May 2026); the paper DOI is the .9 version.'
