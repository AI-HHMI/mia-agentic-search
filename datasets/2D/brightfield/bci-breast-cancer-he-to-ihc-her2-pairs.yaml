notes: 'Scanner Hamamatsu NanoZoomer S60 at 0.46 um per pixel (paper, section 3.1); 1024 x 1024 patches from 51 WSI pairs of
  319 patients screened. Terms are a custom statement (free for academic and non-academic non-commercial use). The project page
  says a form (name, email, institution, country) is required while the GitHub download page gives Google Drive and Baidu links
  directly; the Drive folder was not opened, so the file listing, total size, split sizes and the exact file format (README names
  PNG files in train/test folders) were not verified. The paper itself says patches from the 51 patients and not pixel-level
  aligned (aligned at structural level), so pairs are for translation training, not pixel-accurate regression; the paper text
  PDF was read via pdftotext.'
