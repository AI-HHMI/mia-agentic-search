    alignment: same-grid
    alignment_notes: 'Pair rule: same file name in HE/<split>/ and IHC/<split>/ (README). Same 1024x1024 shape; registered
      with elastix at the structural level, not pixel-accurate (paper Sec. 3.2/4).'
  - role: label
