    - id: 1+
      name: HER2 1+
    - id: 2+
      name: HER2 2+
    - id: 3+
      name: HER2 3+
    alignment: not-applicable
    alignment_notes: HER2 level in the file name (<n>_<split>_<level>.png); per the README it is the level of the source WSI,
      not of the patch.
  notes: 'Folder listing from the Google Drive page (one file, BCI_dataset.zip); member list read with peek_archive.py (9746
    PNG-named images + README.txt; exact zip size 2,909,818,553 B). Probed HE/test/00000_test_1+.png (400,102 B) and IHC/test/00000_test_1+.png
    (201,636 B): both JPEG-compressed 1024x1024x3 uint8 despite the .png extension. tools/sample.py could not read the members
    (it fails on JPEG data inside .png names), so value ranges were not measured. Download host drive.usercontent.google.com
    is not on the TensorSwitch allowlist. Voxel size: the paper states the scanner resolution, 0.46 um per pixel (Sec. 3.1),
    but not whether patches were cut at full resolution, so voxel_size_nm stays null.'
