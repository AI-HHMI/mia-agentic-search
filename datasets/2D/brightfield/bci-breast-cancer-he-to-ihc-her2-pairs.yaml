notes: 'Scanner Hamamatsu NanoZoomer S60 at 0.46 um per pixel (paper, section 3.1); 1024 x 1024 patches from 51 WSI pairs
  of 319 patients screened. Terms are a custom statement (free for academic and non-academic non-commercial use). The project
  page says a form (name, email, institution, country) is required while the GitHub download page gives Google Drive and Baidu
  links directly; The paper itself says patches from the 51 patients and not pixel-level aligned (aligned at structural level),
  so pairs are for translation training, not pixel-accurate regression; the paper text PDF was read via pdftotext. enricher:
  Drive folder holds BCI_dataset.zip (2.91 GB, range requests work); 4873 pairs (3896 train / 977 test) per the README inside
  (was 4870); the .png files are JPEG-encoded, so formats [jpeg] (was png).'
technical:
  method: header
  size_source: file-listing
  layout:
    tree: "BCI_dataset.zip  (2.91 GB, 9747 members, 2.96 GB uncompressed)\n  BCI_dataset/README.txt\n  BCI_dataset/HE/train/<nnnnn>_train_<HER2>.png\
      \    3896\n  BCI_dataset/HE/test/<nnnnn>_test_<HER2>.png      977\n  BCI_dataset/IHC/train/<nnnnn>_train_<HER2>.png\
      \   3896\n  BCI_dataset/IHC/test/<nnnnn>_test_<HER2>.png     977\n"
