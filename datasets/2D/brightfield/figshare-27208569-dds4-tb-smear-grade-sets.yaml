title: DDS4 - Dataset to evaluate Tuberculosis diagnosis by automatic sputum smear microscopy
short_name: TB sputum smear grade sets (EDF)
description: 250 sets of extended-depth-of-focus (EDF) images of sputum smear microscopy fields from 25
  slides, grouped by tuberculosis smear grade (negative, scanty, 1+, 2+, 3+; 50 sets each) with a ground_truth
  text file per set giving the total number of bacilli. 1388 x 1040 px, 24-bit colour BMP. Built as a
  test set for automatic smear-microscopy diagnosis.
