notes: 'Single 52.5 GB tar.gz (DDS4.tar.gz) of folders NEGATIVE, SCANTY, 1+, 2+, 3+, each with SET0-SET49
  holding BMP EDF tiles (164, 164, 164, 82 and 32 per set) and a ground_truth_N.txt (total bacilli count
  of the set, e.g. "90"); n_items is the sum implied by the description (50 x 606). The description states
  there is no annotation inside the images; labels are the set-level grade and the bacilli count. enricher:
  modality brightfield (was other) and publication added: Serrao et al. 2024 (Comput Biol Med) evaluates
  "250 testing sets, 50 sets for each of the 5 TB diagnostic classes" in bright-field smear microscopy.
  enricher: annotations verified (ground_truth_0.txt seen in the archive stream); size from the complete
  figshare listing. Annotator not stated (source unknown). Pixel size not stated (see technical.notes).'
