title: UMID - Urine Microscopic Image Dataset
short_name: Urine sediment cell detection (brightfield)
description: Annotated brightfield microscope images (1280 x 720 px, 400x total magnification) of urine sediment
  with bounding boxes around red blood cells, pus cells and epithelial cells, plus point annotations for cells
  in clusters. Released for training cell detection and counting models for kidney disease diagnosis; the
  repository provides train, validation and test CSV files.
