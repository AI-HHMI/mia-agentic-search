notes: 'No license in the repository (no LICENSE file; README only asks for citation) or the paper; the authors say the dataset is publicly available for research. Git tree lists 588 JPG files in images/ (about 23 MB in total) plus train.csv, val.csv, test.csv, classmaps.csv, missed_classmaps.csv; the README says 367 annotated images and the paper 366 images with 3,733 annotated cells, so the image counts disagree (n_items uses the paper). Classes: RBC (about 44%), pus cells (about 33%), epithelial cells (about 23%); a "missed label" class (about 11%) marks uncertain cells and is excluded from training. Two bright-field microscopes (CH20iBIMF, 40x objective, 10x eyepiece) with a 5-megapixel camera. Pixel size not stated. Files are plain git files (download_method git-lfs is not claimed; clone the repository).'
