short_name: Gram-stained bacteria species images (brightfield)
description: Gram-stained brightfield microscopy images of isolated bacterial species (plus Candida albicans),
  sorted into one folder per species for training classifiers. Combines the authors' earlier images with
  the public DIBaS dataset; captured with a Nikon E200 microscope at 100x objective. The listing shows
  34 zip files (33 species names, Lactobacillus rhamnosus twice) holding 2,094 PNG images.
