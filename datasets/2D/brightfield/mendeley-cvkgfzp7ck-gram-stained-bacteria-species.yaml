notes: 'Mendeley Data is not a schema repository value, so repository is other. Files API lists 34 per-species zips
  (3.60 GB); peek_archive on all 34 found 2,094 PNGs and nothing else (about 60 per species). The page says 2,722
  images and 20-23 per species, which does not match the listing. Only 5 of the species are listed in organism. No paper
  found in Europe PMC; the page cites Jamshidi et al. 2023 and DIBaS (Zielinski et al. 2017) without a DOI. No pixel size
  stated. Overlaps in source with the DIBaS-derived zenodo-7293846 record but is a different, larger-image collection.'
