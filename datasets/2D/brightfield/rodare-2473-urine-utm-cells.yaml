notes: 'Olympus BX41F, 20x/0.4 objective, 0.5x C-mount adapter, Infinity 3S-1UR colour camera. Pixel size not stated
  (Rodare record, HZDR page, paper, UMOD code repo, TIFF headers). Binary masks made with ilastik then refined manually;
  class labels by two microscopists. Rodare lists three versions (concept DOI 10.14278/rodare.2472; latest record
  2563); this is version 1 (record 2473, ds1.zip). enricher: splits_provided true (zip has train/validation/test,
  100 images each; paper: equal random split). enricher: bin_mask stores 0/255, not 0/1 (sampled). enricher: channels
  3 (RGB TIFF header). enricher: download_url switched to the /record/2473/files/ link (range requests; the /api/files/
  link ignores ranges).'
