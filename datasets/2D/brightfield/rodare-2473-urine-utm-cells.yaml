notes: 'Olympus BX41F, 20x/0.4 objective with 0.5x C-mount adapter, Infinity 3S-1UR colour camera, images
  1392x1040 .tif. Pixel size not stated on the Rodare record, HZDR page or paper (Sci Data 2024); not
  derivable without the sensor pitch. Binary masks were first made with ilastik then refined manually;
  class labels assigned by two microscopists. Rodare lists three versions (concept DOI 10.14278/rodare.2472;
  latest record 2563); this record describes version 1 (record 2473, ds1.zip, 2.27 GB). Archive contents
  not listed with peek_archive (timed out); the structure comes from the record description. No train/test
