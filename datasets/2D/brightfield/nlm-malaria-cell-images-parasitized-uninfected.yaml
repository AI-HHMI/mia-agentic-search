notes: 'Listed the NLM directory and the zip (27,560 members: 27,558 PNG and 2 Thumbs.db) and read the NLM downloads page and the
  PeerJ paper (27,558 cells, equal classes, patient-level cross-validation). No licence or terms are stated for the cell images
  on the NLM pages or in the paper (the CC0 link in the paper concerns the article), so spdx is unknown. The labels are
  per-cell parasitized or uninfected, from the expert slide-reader annotation of the smear images; the cell crops themselves
  come from automatic segmentation, and the uninfected class includes artefacts and cells from infected patients'' slides.
  A third-party Zenodo copy (7797018, a zip with the folder duplicated) exists and is not the source. Magnification, camera
  model and pixel size are not stated. Whole-smear NIH-NLM-ThinBloodSmearsPf images with polygon or point labels are a
  separate dataset in the same directory and not covered here.'
