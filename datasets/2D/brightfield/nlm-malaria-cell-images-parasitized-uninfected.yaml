  notes: 'Listing of cell_images.zip (zip index) plus the two CSVs via HTTP Content-Length: 354,881,034 bytes exact
    (size_bytes was the zip alone, 353,452,851). The code zip malaria_cell_classification_code.zip in the same folder
    is not counted. The CSVs map patient IDs to cell file names, one row per patient (e.g. C100P61ThinF,[''C100P61ThinF_IMG_20150918_144104_cell_162.png'', ...]), for patient-level splits. Probed 3 PNGs: RGB uint8, deflate, shapes 148x142, 208x148, 139x160 (varies per cell). Sampled one
    parasitized crop (14 KB): range 0-232, from one sample. Thumbs.db files are Windows thumbnails, not data. Voxel
