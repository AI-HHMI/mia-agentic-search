notes: 'One zip (66.5 MB; 3048 members via peek_archive). 200 image folders under "HERLEV BRYEL 2/" (inter 50, super 50, let
  46, mod 22, svar 19, para 13), each with Original.jpg and GroundTruth.jpg. Record states 768 x 568 px, CC BY 4.0, source
  Byriel 1999 DTU thesis, generated for Tello-Mijares 2019 (JMIHI 9(3)); the paper was not found in Europe PMC so is not listed.
  Not stated: image count, class meanings, who made the ground truth, pixel size. Differs from catalog records 20149084 (917
  cell crops) and 20149775 (252 crops). enricher: GroundTruth.jpg is a blue-contour overlay on the original (sampled), not
  a mask; annotations.format updated.'
