notes: 'Dataset.zip lists 1000 PNG files (500 images + 500 masks) in spilit_x_image_{train,validate,test} and spilit_y_mask_{train,validate,test}
  folders (peek_archive), matching the README counts (320/80/100). The README states a raw pixel size of 113 nm on a custom telecentric
  microscope, but the released images were converted from Bayer raw to a quarter-resolution RGB and cropped, so the pixel size of the
  released PNGs is not stated; voxel_size_nm is left null. Paper is not open access (Europe PMC full text unavailable); abstract and
  the README (which cites the paper sections) were read. The README says the data is also deposited on Dryad (10.5061/dryad.80gb5mksp).
  enricher: images are 16-bit RGB PNGs (header), not all 1024x1024 (e.g. 1024x987); masks binary 0/255.'
