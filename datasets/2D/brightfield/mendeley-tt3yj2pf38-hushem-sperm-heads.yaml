title: Human Sperm Head Morphology dataset (HuSHeM)
short_name: HuSHeM human sperm head morphology
description: 216 cropped, stained human sperm head images (131 x 131 px RGB) classified by three specialists into
  Normal (54), Tapered (53), Pyriform (57) and Amorphous (52). Crops come from 725 semen-smear micrographs (576
  x 720 px, Olympus CX21, 100x objective, Sony colour camera) of 15 patients, fixed and stained with Diff-Quick.
  Only samples with consensus labels are kept.
