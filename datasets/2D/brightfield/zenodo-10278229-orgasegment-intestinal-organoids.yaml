notes: 'Zip listing (peek_archive): 231 JPEG images + 231 PNG masks + 3 .db files; eval 25 / train 369 / val 71 files. Paper (PMC): train 184 / val 35 / eval 12 images; 5x objective; images from a Zeiss LSM800 (transmitted light, 512x512) or Leica Thunder widefield (2048x2048); each image labelled once in Labelbox by organoid experts and reviewed. Pixel size not stated on the Zenodo page or in the paper text read. Whether the PNG masks encode instance ids was not checked. Authors not listed on the page.'
