notes: 'Zip listing: 231 JPEG images + 231 PNG masks + 3 .db files; eval 24 / train 368 / val 70 files.
  Paper (PMC): train 184 / val 35 / eval 12 images; 5x objective; images from a Zeiss LSM800 (transmitted
  light, 512x512) or Leica Thunder widefield (2048x2048); each image labelled once in Labelbox by organoid
  experts and reviewed. Pixel size not stated on the Zenodo page or in the paper text read. Authors not
  listed on the page. enricher: the sampled mask holds contiguous IDs 0..44 (44 organoids), i.e. instance
  IDs; the sampled image is 1024x1024 8-bit grayscale JPEG.'
