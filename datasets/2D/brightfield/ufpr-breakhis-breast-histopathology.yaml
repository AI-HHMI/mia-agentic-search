title: Breast Cancer Histopathological Database (BreakHis)
short_name: Breast tumor H&E benign vs malignant (BreakHis)
description: 7,909 H&E-stained breast tumour histopathology images (700 x 460 px, 8-bit RGB PNG) from 82 patients at four magnifications (40x, 100x, 200x, 400x), labelled benign (adenosis, fibroadenoma, phyllodes tumour, tubular adenoma) or malignant (ductal, lobular, mucinous, papillary carcinoma) by tumour type. A five-fold split structure is provided via a script.
