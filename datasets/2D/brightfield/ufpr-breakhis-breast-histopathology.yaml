notes: 'Details from the dataset page and the paper abstract only (the full text is not open access). The page states use for non-commercial research with source acknowledgement (cite the TBME 2016 paper) and a CC BY 4.0 footer, which conflict, hence custom license. The page counts are inconsistent (intro says 9,109 images, table totals 7,909 and benign column sums to 2,507 not 2,480); 7,909 matches the paper abstract. The tar.gz download host reset the connection, so the archive was not listed and annotations_verified is false. Microscope, camera, pixel size and who labelled the images are not stated on the page. Users are asked to fill in a form after downloading.'
