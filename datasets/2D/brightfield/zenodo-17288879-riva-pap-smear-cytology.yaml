notes: riva_1.0.zip lists 959 PNG images (images/), annotations/annotations.json (4 MB) and annotations/license.txt.
  The Zenodo metadata says CC-BY-4.0, but the license.txt inside the zip is Creative Commons Attribution-NonCommercial
  4.0 and the Scientific Data article is CC BY-NC-ND; the stricter in-archive text is recorded here and the conflict
  should be reviewed. The Zenodo page and the paper count the multi-annotator subset differently (386 vs about 400
  patches). Pixel size 0.25 um/px is the scanner manufacturer figure quoted in the paper. Authors and date are from
  the Zenodo record.
