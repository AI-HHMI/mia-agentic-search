notes: 'Zip listing (peek_archive) and README read. Train set holds 31 TIFF + 15 JPEG images with 46 XML; Validation
  set 11 TIFF + 3 JPEG with 14 XML; Test set 123 TIFF; HEK test set 52 TIFF (image count 235). The paper reports
  5,022 alive and 938 dead cells in the training set and 2,345 alive and 510 dead in the validation set. The
  4TU page says CC BY-NC 4.0 (README text says Attribution (CC BY-NC)). The XML sample read (1024 x 768 px) is
  consistent with the paper''s 0.96 mm2 field of view, but pixel size is not stated, so left null. The README
  says the Validation set folder was used for training the model, which differs from the paper''s
  train/validation naming; treat the split labels as the authors'' folders. Checked: 4TU page and API, zip
  listing, README, a sample XML, paper full text.'
