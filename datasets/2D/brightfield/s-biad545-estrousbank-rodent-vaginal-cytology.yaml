title: 'EstrousBank: rodent vaginal cytology database'
short_name: Rodent estrous cytology stages (brightfield)
description: 13,780 brightfield images of rat and mouse vaginal cytology (five labs, six stain conditions, mostly 10x) classified
  by expert consensus into the four estrous stages (diestrus 4,784; proestrus 3,249; estrus 3,813; metestrus 1,934), used
  to train the EstrousNet stage classifier.
