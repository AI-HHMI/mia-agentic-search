notes: 'Counts and sizes come from the four BioStudies file lists (13,780 files, 97.5
  GB): 8,302 jpg, 4,911 png, 566 bmp and 1 lnk shortcut; 8,341 rat and 5,439 mouse
  images; 13,661 at 10x and 119 at 20x; sources Ostroff 6,299, Sutoh 3,319, Goard
  2,120, Shansky 1,945, Galea 97. The paper reports 12,719 images used (after exclusions),
  while the archive holds 13,780. Stage labels are image-level, no masks or boxes.
  The paper''s train/validation/test split (80/10/10, random) is not provided as files.
  No dataset license is shown in the BioStudies JSON or the paper (the article itself
  is CC BY 4.0), so license is unknown; a Hugging Face compendium lists CC-BY-4.0
  for it but was not treated as authoritative. Pixel size not stated. The BioStudies
  study page itself rendered no content in this run; its API and file lists were read
  instead.'
