notes: 'Image-level estrous stage (folder name), consensus of >=2 expert coders; no masks/boxes. Archive: 13,780 files, 97.5
  GB (BioStudies file lists): 8,302 jpg, 4,911 png, 566 bmp, 1 lnk; 155 files list size 0. Paper used 12,719 after exclusions;
  its 80/10/10 split is not provided. organisms: Rattus norvegicus = SourceLab Ostroff, Shansky, Galea files; Mus musculus
  = Goard, Sutoh files (mixed within each stage folder; per-file Species column in the file lists). No dataset license in
  BioStudies, paper or EstrousNet repo (article is CC BY 4.0); a HF compendium lists CC-BY-4.0, not treated as authoritative.
  Pixel size not stated anywhere checked. enricher: channels 3 (RGB) from headers (was null); download_url set to the HTTPS
  Files/ folder (was null).'
