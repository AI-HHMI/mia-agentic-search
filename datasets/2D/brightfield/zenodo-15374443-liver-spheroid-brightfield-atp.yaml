description: 'Brightfield images of human 3D liver spheroids in a microphysiological system under drug treatment: 2,359 labelled images with CellTiter-Glo 3D ATP viability values and
  matching spheroid segmentation masks, about 17,450 unlabelled images, cropped variants, a small ChromaLive fluorescence-stain subset, metadata CSVs and trained viability-regression models.
  Images come from four imaging devices in two labs, so out-of-domain splits are possible.'
