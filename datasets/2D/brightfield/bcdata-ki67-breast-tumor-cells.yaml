notes: 'Found via the ShadoNet paper (Bioinformatics 2026), which uses BCData as a public benchmark. Terms: the paper
  abstract (BIT repository page) says the dataset "can only be used for non-commercial research"; the dataset page
  names no licence, hence spdx custom. Image count and cell count from that abstract; 640x640 px, 40x, Motic BA600-4
  scanner and the 803/133/402 split from Table 1 of the ShadoNet paper, not from the original paper (its full text
  was not available). The dataset page lists the folder layout (images/ and annotations/ with train, validation, test)
  but the data is a single Google Drive file that was not listed or downloaded, so formats (PNG, from the example
  path train/10.png) and annotation counts are not verified from a file listing. Pixel size not stated on the dataset
  page, abstract or ShadoNet Table 1. Image size per the ShadoNet table; file size unknown.'
