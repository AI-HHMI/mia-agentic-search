notes: 'Found via the ShadoNet paper (Bioinformatics 2026), which uses BCData as a public benchmark. Terms:
  the paper abstract (BIT repository page) says the dataset "can only be used for non-commercial research";
  the dataset page and the zip name no licence, hence spdx custom. 640x640 px, 40x, Motic BA600-4 scanner
  from ShadoNet Table 1. Pixel size not stated. enricher: zip listed (4,014 members: 1,338 PNG, 2,676
  h5; split 803/133/402 confirmed), size_bytes 853,879,248 from the file (was null), download_url is the
  direct Drive download link from the virus-scan form (was the Drive view page), annotations_verified
  true.'
