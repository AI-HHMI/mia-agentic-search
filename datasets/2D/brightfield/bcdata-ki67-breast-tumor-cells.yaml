description: 'BCData: 1,338 Ki-67 immunohistochemistry images of breast cancer tissue with point annotations of
  181,074 tumor cells in two classes (Ki-67 positive and negative), split into train / validation / test (803 / 133
  / 402 images per a later paper). Released for cell detection and counting and Ki-67 index estimation.'
