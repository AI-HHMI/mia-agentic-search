notes: 'Labels are mostly automatic: segmentation images for all 234 microscopy images are AIVIA overlay renderings (per the
  GitHub README), not necessarily label masks; manual ground truth (GT) exists only for the 28 validation images (6.Validation/Ctrl
  and DSS, 14 each). Pixel size not stated on the Zenodo record or GitHub README; the paper full text is not open access (only
  abstract/Crossref read). Zip has 234 high-resolution TIFFs (~5.5 GB uncompressed), 234 PNG microscopy images, 234 PNG and
  234 JPEG segmentation images, 234 Excel metric files. The README links an earlier Zenodo version (10.5281/zenodo.18627306);
  this is v1.1.0. enricher: zip listed and probed; download_url without ?download=1.'
