short_name: Microparticles in granular sludge (microscope)
description: 196 microscope images of microparticles (free or entrapped) and aerobic granular sludge biomass
  from wastewater treatment experiments at TU Delft, each with a text file of polygon masks for two classes
  (entrap particle, free particle). File names encode sampling time (10, 30, 60 min) and biomass diameter
  class.
