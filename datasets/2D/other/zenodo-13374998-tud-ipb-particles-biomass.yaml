notes: 'Images and labels zips list 196 JPEGs and 196 matching .txt files (a first label file was read:
  lines of a class index followed by normalised x y polygon points). The paper (Sci Total Environ 2024)
  is not open access in Europe PMC, so only its abstract was read: it states the dataset is for instance
  segmentation (Mask R-CNN, YOLOv8 etc., mAP50 mask 90.6%) and gives no train/test split here. The Zenodo
  text also cites a 2025 J Environ Manage paper (10.1016/j.jenvman.2025.124268) that reuses it. Microscope
  type, magnification and pixel size were not found on the record, so modality is other and voxel size
  null. Annotation method (manual vs assisted) is not stated, so source is unknown.'
