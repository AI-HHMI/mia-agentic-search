notes: 'Size is the exact sum of the 13 files in the Zenodo record (300,398,018,118 B; Zenodo API). enricher: formats corrected
  to jpeg + tiff (was tiff): EDF images, slide images and z-stack planes in the archives are JPEG; each z-stack folder also
  has a label.tif. enricher: classes read from Table3.xlsx: complete, planktonic_fragment, unknown, damaged, mollusk, rock,
  agglutinated, clipped, touching, benthic, radiolarian, ostracod, spicule, tooth, echinoid_spine, diatom (16 coarse object
  categories, not species). Pixel size is not stated in the paper, Zenodo record or JPEG headers (images carry a burned-in
  scale bar). Dark-field illumination is not a listed modality, so modality is other. n_items counts the 124,230 objects (one
  EDF image each).'
