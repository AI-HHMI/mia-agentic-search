title: Sixty-one thousand Recent planktonic foraminifera from the Atlantic Ocean
short_name: Planktonic foraminifera images, 16 object classes
description: Extended-depth-of-field dark-field light-microscope images of 124,230 individual objects picked from 155 slides
  of Atlantic core-top sediment (61,849 complete or damaged planktonic foraminifera), each classified by a human observer
  into one of 16 object categories with a confidence level, plus slide overview images with boxed objects, 2D outlines,
  3D meshes and shape measurements. About one fifth of the objects (24,846) have withheld identities as a machine-learning
  test set.
