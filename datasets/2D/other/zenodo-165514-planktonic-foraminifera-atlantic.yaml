notes: 'Size is the sum of the 13 files in the Zenodo record (about 300 GB; the .tar.gz archives cannot be listed remotely,
  so file formats come from the paper Data Records: BigTIFF slide and z-stack images, EDF images, PDF, OBJ, CSV). Labels
  are 16 coarse object categories (e.g. planktonic foraminifera complete or damaged), not species; the class table
  is in Supplementary Table 1 and the class names were not read. Pixel size is not stated in the paper or Zenodo record.
  Dark-field illumination is not a listed modality, so modality is other. The Zenodo record is dated 2017-05-15 and
  the paper 2018. n_items counts the 124,230 objects (one EDF image each).'
