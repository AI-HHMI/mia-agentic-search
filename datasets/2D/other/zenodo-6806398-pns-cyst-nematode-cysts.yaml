notes: 'Both zips listed: 229 images (about 30 MB each, 7.18 GB) and 229 masks (gt_001 to gt_229). Images were recorded with a
  PhenoAIxpert HM prototype: an RGB camera (4112 x 3008 px) with a 1x high-magnification lens, 35 x 25 mm field of view,
  LED side illumination (paper Methods), which the paper calls optical microscopy; it is closer to macro imaging, so modality
  is other. Pixel size is not stated (about 8.5 um follows from the field of view and sensor size, not given in the paper).
  The paper names the annotated sets Cyst-Segmentation and Cyst-Count; which one this record holds (Part1) was not confirmed.
  The paper and GitHub say evaluation code and data are for non-commercial use, while the Zenodo record states CC-BY-4.0;
  the Zenodo license is recorded. Organism is the nematode, not the sample soil.'
