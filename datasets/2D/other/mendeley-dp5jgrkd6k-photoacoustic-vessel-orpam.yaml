notes: 'Imaging modality is photoacoustic microscopy (OR-PAM), no schema enum value, so modality is other. Labelled
  data: ear_vessel_dataset.zip, 69 normal-vessel MAP images (train 48 in 6 patches, test 21 in 4 patches) with binary
  masks; the tumor-vessel set is only in Raw data.zip as an unlabelled 3D MATLAB v7.3 (HDF5) volume, as is the 3D
  normal-vessel volume. The paper reports 660/1168 augmented pairs; the Mendeley release holds the 69 un-augmented
  pairs. enricher: formats png+hdf5 from file listing (was other); size from Mendeley file API (was null); annotations.source
  proofread: paper says semi-automatic GT then fine manual modification (was mixed); channels 1 from PNG headers.
  Pixel size not stated on the page, file API or paper. The paper cites dataset v1; this record is v2.'
