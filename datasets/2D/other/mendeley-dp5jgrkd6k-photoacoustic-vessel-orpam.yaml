notes: 'Imaging modality is photoacoustic microscopy (OR-PAM), which has no schema enum value, so modality is other. The Mendeley page shows no file listing (only a "Download All" button), so file formats, size, pixel size and the exact annotation files could not be verified; formats is other as a placeholder. n_items 69 is the normal-vessel image count stated on the page (the tumor set count is not stated there). The paper reports 660 (normal) and 1168 (tumor) augmented 256x256 image pairs, so the Mendeley contents may differ from the paper. Pixel/voxel size not stated on the dataset page or in the paper Methods. The paper cites version 1 of the dataset (10.17632/dp5jgrkd6k.1); this record is version 2. Annotation source is mixed: semi-automatic then manual correction.'
