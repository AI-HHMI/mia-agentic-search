title: Photoacoustic vascular image dataset (OR-PAM microvessel segmentation, mouse)
short_name: Mouse microvessel segmentation (OR-PAM)
description: Optical-resolution photoacoustic microscopy (OR-PAM) images of mouse microvasculature (normal ear vessels and tumor vessels) released for microvessel segmentation. Per the Mendeley page the normal-vessel set has 69 images (48 for training/validation, 21 for testing); the tumor-vessel set is also included. The associated paper (WSA-MP-Net) describes ground-truth masks produced by a semi-automatic method (adaptive histogram equalization + k-means + Canny, then manual correction) on 256x256 maximum-amplitude-projection images.
