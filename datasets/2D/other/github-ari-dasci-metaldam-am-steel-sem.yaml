notes: 'Source GitHub repo and release page state no license; MIT is stated only on the Voxel51 Hugging
  Face mirror card (code Apache-2.0), so the license is third-party-reported. No paper yet (README: "publication
  will be added soon"), so none cited. Pixel size not stated on README, release or HF card (HF metadata
  has a per-image scale bar in um and magnification, not read per image). Modality is SEM of steel, not
  in the enum, so other; not biological. MetalDAM_labeled.zip (39.3 MB, listed with peek_archive): 42
  JPEG images, 42 PNG masks, 42 coloured PNG masks, train/val/test .txt lists. Separate release assets:
  unlabeled images zip (164 images) and a metadata .sql. HF card says 42 samples but viewer shows 84 rows
  (images + masks likely). Release date not shown on the page.'
