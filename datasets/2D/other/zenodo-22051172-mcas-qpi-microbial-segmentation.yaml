notes: 'Method-validation deposit, not a curated benchmark: the zip (14,458 files, 3.8 GB uncompressed, 14,311 TIFFs) is organised
  by paper figure and mixes images, masks, algorithm outputs (mCAS, Otsu, CellProfiler), LineageMapper tracking output
  and code. Ground truth: E. coli masks come from thresholding tdCherry fluorescence images (automatic), M. extorquens masks
  are manual, and fig-4 has labeled ground-truth masks for a QPI time-lapse (per the folder description.txt files and paper
  Methods). Effective pixel size at the sample is not stated on the Zenodo page, the folder descriptions or the paper Methods
  (only sensor pixel sizes of 3.65 um and 6.5 um with 63x/100x objectives), so voxel size is null. Objectives: 63x NA 0.7
  (E. coli) and 100x oil NA 1.3 (M. extorquens). The paper says data are available on request, but the Zenodo record is open.
  n_items counts the TIFF files in the zip. Full-text read via the bioRxiv page; tools/paper.py failed with HTTP 429 from bioRxiv.'
