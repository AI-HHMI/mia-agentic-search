id: zenodo-22051172-mcas-qpi-microbial-segmentation
title: mCAS - microbial cell-adaptive segmentation in quantitative phase imaging (data)
short_name: Bacteria QPI cell segmentation (phase imaging)
description: Quantitative phase images (QPI) of Escherichia coli and Methylobacterium extorquens with ground-truth single-cell
  masks, used to validate the mCAS segmentation method. Folders per figure hold large-field QPI images, single-cell QPI crops
  padded to 256x256, paired fluorescence images, ground-truth masks (E. coli masks from thresholded tdCherry fluorescence;
  M. extorquens manual masks), a labeled QPI time-lapse with ground-truth and mCAS-labeled masks and LineageMapper tracking
  output, and comparison masks from Otsu, CellProfiler and mCAS.
