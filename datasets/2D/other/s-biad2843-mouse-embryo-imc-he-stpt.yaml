description: Multiplex imaging data from the IMAXT project on two mouse embryos - imaging mass cytometry (IMC) images
  with H&E brightfield whole-slide scans of the same sections, plus serial two-photon tomography (STPT, pseudo-H&E)
  of 30 sections of one embryo - stated to support virtual H&E / virtual IHC generation research.
