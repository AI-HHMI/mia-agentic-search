notes: 'BioStudies page: CC BY 4.0, "supports research into virtual brightfield generation from multiplexed imaging
  modalities, including virtual H&E and virtual immunohistochemistry generation". File listing (52 files, 92.9
  GB): 2 .svs H&E scans, 31 OME-TIFF (IMC and one STPT volume), 17 raw IMC ROI txt exports, 2 .mcd. Only two
  embryos, so this is a small paired set; whether IMC and H&E are co-registered is not stated on the page. No
  paper is linked on the page and a title search found none, so authors and publications are empty; pixel size
  and marker panel are not stated. STPT is a 30-section volume, but dimensionality is given as 2D for the IMC/H&E
  sections. The mcd and txt files are not listed under data.formats.'
