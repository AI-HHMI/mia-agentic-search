    alignment_notes: 'Image-level class labels: the class is the folder name, and each row of the folder''s ecotaxa TSV (tab-separated,
      10 columns) names one PNG (img_file_name) with object_annotation_category, annotation status and annotator.'
  notes: 'Figshare API listing is complete (4 files, 8,104,707,049 B); members of the 1.23 GB annotated_images zip were listed
    (86,380: 86,232 PNG, 146 TSV, README.md, one .txt); the 6.87 GB matlab_files zip was not expanded. Two PNG headers probed
    (68x280 and 60x136, 8-bit grayscale, deflate): ROI crops vary in size. A sample read failed because sample.py only recognises
    zip URLs ending in .zip (figshare ndownloader URLs do not), so value range and normalization are unknown. README states
    the license (CC-BY4), 146 classes with per-class counts, and no pixel size. Read ecotaxa_Akinete.tsv header and rows via
    peek_archive.'
