notes: 'Checked the figshare API record, the README and the annotated_images zip index (86,380 files: 86,232 PNGs, 146 TSV,
  a README and a text file). Version 6 (April 2026) merges three earlier datasets, and the dataset is updated regularly with
  new images, so counts will change. Size is annotated_images 1.23 GB plus matlab_files 6.87 GB. The images come from an imaging
  flow cytometer (IFCB) with a camera triggered by scatter or fluorescence, so the modality is recorded as other; pixel size
  was not stated in the README. No paper is cited on the record and none was found, so only dataset-level sources were read.
  Manual classification followed the ifcb-analysis wiki instructions. enricher: size_bytes from the complete figshare file
  listing (was 8,104,697,063).'
technical:
  method: header
  size_source: file-listing
  layout:
