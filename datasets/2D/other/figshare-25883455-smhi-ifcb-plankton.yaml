          D<yyyymmdd>T<hhmmss>_IFCB<nnn>_<roi>.png   86,232 PNGs in total
          ecotaxa_<class name>.tsv                   per-image metadata incl. object_annotation_category
        e.g. Actinocyclus_spp/ 122 png, Cryptophyta/ 9,473 png, Chaetoceros_spp_chain/ 6,386 png
      smhi_ifcb_matlab_files.zip   (members not listed)
