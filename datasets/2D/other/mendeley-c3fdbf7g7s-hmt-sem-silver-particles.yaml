  notes: 'Listing: Mendeley public API (772 files with exact sizes, sum 886,636,891 B = API size). Sampled AS_0004 raw (3,689,840
    B), its line image (1,919,586 B), GB/class regions, and ASmidA-H1_0001 SB/class regions; value ranges are from these single
    samples. Raw is uint8 greyscale stored as 3-sample RGB. Annotations are derived from manual GB/SB line traces (weak labels,
    not particle ground truth, per 03_metadata/ANNOTATIONS.md). 04_derived_inputs holds U-Net predictions (candidate masks,
    instance labels, density maps), i.e. model output, not annotations; 05/06 hold MATLAB models and results. Pixel size varies
    per image (03_metadata/image_index.csv PixelSizeMicron 0.0076-0.0534 um/px; ScaleSource reviewed_footer / OCR / series_fallback),
    so voxel_size_nm stays null. No whole-dataset archive: the Mendeley API lists per-file links only (each file_downloaded
    URL redirects to S3 and supports range requests); data.download_url keeps the landing page. The SB/unknown foreground
    values and the class_regions id mapping are not documented. Paper not found (Europe PMC / Crossref, title search).'
