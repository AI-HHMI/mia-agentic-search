notes: 'Mendeley API lists 772 files (886,636,891 bytes); the overview README gives the folder layout (01_images 48 TIFF,
  02_annotations 48 traced + 192 processed images, plus metadata, models, results, code). Annotations are manual grain-boundary
  and slip-band traces only; the authors say particles have no independent outlines, and slip-band traces exist for 26 of
  48 images, so type is other and coverage sparse. Pixel size varies per image (0.0076-0.0534 um/px, image_index.csv; some
  series_fallback), so voxel_size_nm is null. The manuscript (weakly supervised silver-particle association) has no DOI on
  the page, so no paper text was read; the material is not named on the pages read. enricher: listing, headers and samples
  checked; modality stays other (SEM of a non-biological sample; no SEM enum value); organism empty (materials sample).'
