notes: 'Zenodo lists 48.2 GB in three zips: OMEandSingleCellMasks.zip (11.4 GB; nested deflated ome.zip and Basel_Zuri_masks.zip),
  SingleCell_and_Metadata.zip (36.8 GB, tables, histoCAT sessions, jpg) and TumorStroma_masks.zip (7 MB). Counts (720 images,
  352 patients, 35 biomarkers) are from the paper abstract; the paper is not open access. Imaging mass cytometry is not a
  listed modality, so other. Zenodo shows CC BY 1.0; a newer version (4607374) adds cluster-label and cell-location zips.
  enricher: channels 52 from the OME-TIFF header (was 35, the paper''s biomarker count; channel map in Basel_Zuri_StainingPanel.csv
  FullStack column). enricher: size_bytes from the Zenodo file listing (was null). Masks cover the Basel (381/382) and Zurich
  (365/364) cohorts.'
