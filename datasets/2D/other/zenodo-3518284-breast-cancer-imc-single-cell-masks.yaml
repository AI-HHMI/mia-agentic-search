notes: 'Zenodo lists 48.2 GB in three zips: OMEandSingleCellMasks.zip (11.4 GB, holding ome.zip and Basel_Zuri_masks.zip, listed with peek_archive), SingleCell_and_Metadata.zip (36.8 GB, tables) and TumorStroma_masks.zip (7 MB); size_bytes is null because only part of the total is images. Counts (720 images, 352 patients, 35 biomarkers) are from the paper abstract; the paper is not open access, so pixel size and segmentation details were not read from it. The GitHub README says the masks come from CellProfiler and states no pixel size. Imaging mass cytometry is not a listed modality, so other. Zenodo shows CC BY 1.0; a newer version of the record exists.'
