  notes: 'Listed the three zips via the Zenodo API (48,233,252,799 B exact) and the zip central directories. The nested zips
    in OMEandSingleCellMasks.zip are deflated, so their members cannot be range-read: Basel_Zuri_masks.zip (33.3 MB) was fetched
    whole and listed (746 masks); the first OME-TIFF of ome.zip was streamed out of the first 16.8 MB. The raw file count
    is not listed (paper: 720 images). Raw OME-TIFF: 52 pages = channels (OME DimensionOrder XYCZT, SizeC 52), float32 uncompressed,
    no physical pixel size in the OME-XML; value_range from that one core. 13 single-cell masks read: uint8/uint16, 106 to
    4309 unique IDs. Tumour masks {0,1}. No sample unit: TensorSwitch can''t pull members out of nested deflated zips, so
    a sample or conversion needs the whole 11.4 GB OMEandSingleCellMasks.zip. Voxel size not found; checked: OME-XML, TIFF
    resolution tags (masks 0/1000 per cm, a placeholder), Zenodo API, staining panel csv, Nature page (Methods paywalled,
    Europe PMC no full text), GitHub repo.'
