notes: 'ReadMe and CSV read in full; zip lists 277 JPEGs named by insert ID (e.g. 11A (1).jpg). Not all inserts have all three image types (raw, VBmax marked, area/perimeter marked); the marked images are drawn overlays, so there are no separate masks. The CSV has 104 inserts: 50 damaged, 40 rough machining, 13 fine machining, 1 new (3 blank), classes given by two independent experts. Wear regions were delineated manually. Materials-science optical microscopy, modality other. Pixel size not stated (voxel size null). No paper listed. Size from the Zenodo file entry.'
