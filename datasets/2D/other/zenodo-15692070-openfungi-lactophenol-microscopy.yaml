notes: 'Read the Zenodo API record, listed the 8.4 GB zip (1,256 members) and read the MDPI Life paper (Methods, data access,
  CC-BY-4.0). micro/ holds 571 images (Alternaria 19, Aspergillus Flavi 384, Nigri 72, Fusarium 60, Penicillium 24, Rhizopus
  12; two Fusarium files are PNG, the rest JPEG), macro/ holds 678 macroscopic culture photographs (not microscopy) plus
  nested per-genus zips of about 3.2 GB, and the "Mixed" cultures exist only as macro images. n_items counts only the
  microscopy images. Labels are image-level genus names given by the folder, identified by laboratory staff against the
  literature; there are no boxes or masks.
  Contrast mode and microscope model are not stated in the paper (10x and 40x magnification only), so modality is other.
  The Zenodo concept id 15692069 and version id 15692070 both resolve to this record.'
