notes: 'Zip listed (4,962 files): 2,358 LF and 2,358 WF TIFFs in data/train, 20 raw_data tubulin volumes (47.5 MB
  each), prediction inputs, and 23 checkpoint .npz files (1.6 GB). Per the paper (PMC, Methods and Data availability),
  training inputs are synthetic light-field images made from high-resolution references with a wave-optics model;
  the full paper datasets are in Zenodo 4390067, which holds only reconstruction results (not included here).
  Pixel size and organism of this example package are not stated; tubulin is not mentioned in the paper. Paper
  full text is not on Europe PMC; the PMC article page was read. Modality is light-field microscopy (no enum value,
  hence other).'
