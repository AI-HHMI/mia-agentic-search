title: Label-free microscopy images of hiPSC-derived neuronal cultures with quality labels and neuron/cluster segmentation
  masks (Zenodo)
short_name: hiPSC neuron culture QC (label-free images)
description: 'Data for an automated quality-control pipeline for hiPSC-derived neuronal cultures. Stage 1: 1,102 label-free
  JPEG images sorted into "valuable" (552) and "discarded" (550). Stages 2 and 3: preprocessed image arrays with train/validation/test
  splits, segmentation masks (0 background, 1 neuron, 2 cluster) and image-level labels (0 healthy, 1 dead, 2 cluster), stored
  as NumPy arrays. A companion code archive holds the scripts and released U-Net and Random Forest.'
