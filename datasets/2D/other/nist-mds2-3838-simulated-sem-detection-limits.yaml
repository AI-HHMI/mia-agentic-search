notes: 'Simulated images, so masks are exact by construction (from the noise-free image). Zips listed with peek_archive: intensity_sets
  3402 TIFFs (6 sets x 567 expected from the project page), mask_sets 12 TIFFs, metrics_sets 12 CSVs. License: NIST open license
  (record API). The paper (J. Micro/Nanopatterning, Mater. Metrol. 24(4), 2025, doi 10.1117/1.JMM.24.4.044201) is not open
  access on Europe PMC (PMID 42111930), so only its abstract and the NIST publication page were read; pixel size, object size
  and the exact mask definition are not stated on the record page, README or project page. Not a real-microscope dataset.
  enricher: listing confirms 763755461 B; one mask per set, shared by all 567 noise/contrast variants (27 x 21); the README
  training log names numberClasses 2 and maskDir SEM-sim-SNR-set1-5-mask-bin. Pixel size not stated (README, code repo, paper
  abstract).'
