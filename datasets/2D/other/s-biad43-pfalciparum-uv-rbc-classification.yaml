notes: 'No license statement on the BioStudies page or in the paper, so license is unknown. The human-annotated
  set has 42,655 TIFF thumbnails (healthy 30,094; ring 9,214; troph 2,603; schizont 744 per the annotation
  file list); the machine-labelled thumbnails (581,737 TIFFs) and segmentation label matrices (7,394 PNGs)
  come from the authors'' ResNet-50/GoogLeNet pipeline, so annotations are mixed. Human labels were assigned
  by sorting 285 nm thumbnails and copied to the other wavelengths (paper Methods). Modality is deep-UV
  transmitted-light absorption microscopy, recorded as other. Pixel size not determined. A sibling study
  S-BIAD44 was not examined. enricher: size_bytes = 45,540,159,493 B summed from the four file-list JSONs
  (680,977 files; was null); png added to formats for the label matrices.'
