notes: 'Geological (petrographic) microscopy rather than biological. Zip is 33.2 GB with 55,610 JPEG files listed with peek_archive
  (the paper says 55,786 images, 33.2 GB). Labels are one lithology class per image (classification, not segmentation), set
  by a primary analyst and a vote of ten sedimentologists (images with more than 20% disagreement were dropped). Pixel size
  is not stated on the Zenodo page or in the paper; the paper mentions that detailed scale information is not available. Zenodo
  concept DOI is 10.5281/zenodo.17067100. Authors empty (not read from the page). enricher: n_items 55,609 images (zip has
  55,610 members incl. classmap.txt); formats add tiff (4 files) and png (1 file).'
