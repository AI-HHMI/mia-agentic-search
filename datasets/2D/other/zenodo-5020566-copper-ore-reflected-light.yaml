notes: 'Zenodo description: 121 reflected light microscopy RGB images (about 1017x753 px, 0.53 um/pixel,
  a few slightly smaller) with binary reference images made by thresholding registered SEM images of the
  same fields (so labels are automatic, not hand-drawn). The zip lists 242 TIFFs (peek_archive), consistent
  with 121 pairs. Modality is reflected-light optical microscopy of a materials sample, which has no exact
  enum value, hence other. Paper full text is not open access (only title/DOI metadata read); no train/test
  split is provided in the record.'
