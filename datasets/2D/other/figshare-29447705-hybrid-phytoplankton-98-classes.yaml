notes: 'Counts come from listing the six zips with peek_archive: 221,110 PNG/JPG images
  in 98 class folders; 160,158 file names start with "IFCB" (Imaging FlowCytobot style
  names, probably re-used public IFCB data whose own terms were not checked) and 60,952
  are other crops (e.g. box_*.png). Modality is set to other because the Figshare
  record and the abstract do not state the microscope or imaging mode; pixel size,
  organism per image set and annotation procedure are not stated. The Figshare description
  is one sentence. The MDPI paper returned 403 and Europe PMC has no full text, so
  Methods and Data availability were not read. No split is provided in the files.
  Labels are class folder names; who assigned them is unknown.'
