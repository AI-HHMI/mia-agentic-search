description: 100,000 PNG microscopy images of unfixed vital diplococci (titled 'synthetic ... generated'),
  each with a paired binary segmentation mask of the diplococcal foreground, plus a bounding-box JSON
  per zip part. Ten zip parts of 10,000 image/mask pairs each, intended for training, validation and benchmarking
  of segmentation, classification and detection models.
