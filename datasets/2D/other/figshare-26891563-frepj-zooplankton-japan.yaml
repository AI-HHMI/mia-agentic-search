notes: 'Hosted on J-STAGE Data, which is served by Figshare (API record 26891563, zip Zooplankton_images.zip 963 MB, 88,686 JPEG files listed with peek_archive: images_40 and images_100 folders, one folder per taxon label; the description and paper abstract say 88,653 images). Metadata tables (Table_S1-S4 CSV) and meta_data.docx are separate files. The paper full text is not open (J-STAGE bulletin; only the abstract page was read), so the microscope model, camera and pixel size are not stated in any source read - pixel size, modality and organism list (214 taxa) are left unspecified. Who identified the taxa is not stated. A derived copy exists on Hugging Face (project-oceania/planktonzilla-frepj, 88,686 rows, CC BY 4.0) - same data. No train/test split is provided.'
