short_name: FREPJ Japanese freshwater zooplankton images
description: About 88,650 single-individual JPEG images of 214 freshwater zooplankton taxa from 87 lakes and reservoirs in Japan, cropped from high-resolution scans of samples taken with an intelligent microscope at 40x and 100x, in folders named by six-rank taxonomic label (phylum to species), with sampling site and date tables. Intended for training and evaluating automatic plankton identification.
