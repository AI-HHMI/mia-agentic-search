notes: 'Zenodo page gives no description, modality, materials or paper. Zip listings: test.zip (619 MB)
  holds testsem/<material>/{image_cropped,mask_cropped} with 526 PNG image/mask pairs over 18 folders;
  train.zip (4.4 GB, 30,656 files) holds trainSemData_swin_384/<material>/{image,mask,*_cropped,*_aug,*_test}
  over 20 folders, plus 269 tif, 142 jpg and 17 .py files. SEM is inferred from the folder name testsem
  and the material names; the page does not state the instrument. Annotation source and pixel size are
  not stated. Folder names (MetalDAM, UHCS, EBC, Inconel718) suggest the data compile public micrograph
  sets, so the original licenses (for example UHCS is CC BY-SA 3.0 on NIST) may differ from the CC BY
  4.0 on this record. The related study (same title) was not found by WebSearch. enricher: size 5,008,231,950
  B = exact sum of the two Zenodo files; formats + tiff, jpeg (originals in train image/ folders); masks
  sampled: binary 0/255.'
