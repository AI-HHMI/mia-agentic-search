notes: 'Zenodo page gives no description, modality, materials or paper. Zip listings (peek_archive): test.zip
  (619 MB) holds testsem/<material>/{image_cropped,mask_cropped} with 526 PNG image/mask pairs over 23
  folders; train.zip (4.4 GB, 30,656 files) holds trainSemData_swin_384/<material>/{image,mask,image_cropped,mask_cropped,img_aug,mask_aug,img_test,mask_test}
  over 20 folders, plus 269 tif, 142 jpg and 17 .py files (code is not to be run). SEM is inferred from
  the folder name testsem and the material names; the page does not state the instrument. Annotation source
  and pixel size are not stated. Folder names (MetalDAM, UHCS, EBC, Inconel718) suggest the data compile
  public micrograph sets, so the original licenses (for example UHCS is CC BY-SA 3.0 on NIST) may differ
  from the CC BY 4.0 on this record. The related study (same title) was not found by WebSearch. Total
  size is the sum of the two files listed on Zenodo (5.0 GB stated; 619.2 MB + 4.4 GB).'
