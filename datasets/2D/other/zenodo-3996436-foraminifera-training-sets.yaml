notes: 'Three zips, all listed (56,004 JPEGs; 35, 18 and 44 class folders). Endless Forams set is a derivative of
  endlessforams.org (text and borders removed). Paper: MD sets imaged with a 4x telecentric lens on 3.45 um pixels,
  "approximate resolution of 1159.4 pixels per millimetre" (~862 nm/px); the Endless Forams images come from another
  system, so voxel_size_nm stays null. No split files. enricher: organism Foraminifera (group named on the page/paper;
  species are the class labels, not one organism per file set). enricher: MD022508 is a benthic set (paper 3.2),
  description corrected. enricher: download_url uses the records/ form (download-check usable); the dataset is three
  zips, see technical.notes.'
