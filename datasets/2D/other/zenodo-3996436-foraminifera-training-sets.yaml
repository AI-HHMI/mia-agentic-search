  notes: 'Complete Zenodo listing with zip members expanded (exact sizes, 3 zips = 2,215,858,092 B). Probed one
    JPEG per zip: Endless Forams Beella_digitata/00001 318x318x3 uint8, MD022508 B_argentea-0015 462x462x3, MD972138
    aggregate/00002 523x523x3 (RGB, JPEG). Sampled two: MD022508 B_argentea-0015 0..255 (full range, saturated),
    Endless Forams 00001 0..199; value ranges from single samples. All three zips are direct (download-check usable,
