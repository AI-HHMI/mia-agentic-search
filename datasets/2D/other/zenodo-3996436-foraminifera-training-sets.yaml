notes: 'Zenodo lists three zips; all three were listed with tools/peek_archive.py (JPEG files only, 56,004
  in total; 35, 18 and 44 class folders). The Endless Forams set is a derivative of endlessforams.org
  (text and borders removed). Paper: images were acquired with a 4x telecentric lens and a 3.45 um pixel
  sensor (about 1159 pixels/mm, i.e. roughly 0.86 um/px) and Z-stack fused; that applies to the authors''
  own (MD) image sets, while the Endless Forams images come from another imaging system, so pixel size
  is left null. The paper''s full text is open access (CC BY 4.0, the Journal of Micropalaeontology PDF
  was read), but Europe PMC does not index it. No train/val/test split files are in the zips (splits_provided
  false); the dataset is described as training sets for classification.'
