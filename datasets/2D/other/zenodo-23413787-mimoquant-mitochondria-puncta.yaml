notes: 'Zenodo API record, the ZIP listing (3,548 files: 1,182 PNG, 1,182 JSON, 1,182 .hmd, LICENSE with CC BY 4.0, Readme.txt), Readme.txt
  and one JSON annotation were read. Per-split counts are file counts in train/ (2,529 files), val/ (507) and test/ (510), each divided
  by three. The record states the bounding boxes in the JSON files were algorithmically generated (the origin of the .hmd circle and
  cross-mark annotations is not described), hence annotation source automatic. The record text mentions 1,190 ROIs but excludes 8 for
  copyright, leaving 1,182. Imaging modality, stains, pixel size, cell lines and organism are not stated on the record or in the Readme,
  so they are other or null; the related publication is still unpublished and no paper was found. enricher: channels 1 (grey PNGs, was
  null). File-name prefixes name HeLa, SHEP, FBCtr, LCHADD and VLCADD cells; organism left empty as no page states it.'
