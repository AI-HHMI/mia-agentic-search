notes: Imaging is label-free stimulated Raman scattering (lipid channel), TPEF and transmission, a lab-built
  multimodal NLO microscope; modality is 'other' for that reason. The two files are Python pickles
  (dct_train.pickle 306 MB, dct_test.pickle 97 MB) which were deliberately not opened; image counts, 170 train /
  54 test (95 senescent and 65 control in train), and the 350 nm pixel size come from the paper. Labels were
  assigned by visual inspection against previously established NLO markers. Pickle contents not inspected, so
  the on-disk structure is unverified.
