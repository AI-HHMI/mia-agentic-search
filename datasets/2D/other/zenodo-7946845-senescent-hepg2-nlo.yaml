notes: 'Imaging is label-free SRS (lipid channel), TPEF and transmission on a lab-built multimodal NLO
  microscope; modality other for that reason. Two Python pickles (dct_train.pickle 306 MB, dct_test.pickle
  97 MB); not unpickled. enricher: structure read from pickle opcodes (pickletools, nothing executed):
  train_data 170x250x300x3 float64 + train_label (170x2 object), test_data 54x250x300x3 float64 + test_label
  (54x2). Class 1.0 occurs 95x in train (paper: 95 senescent), so 1 = senescent is inferred; 75 zeros
  in train vs 65 controls in the paper. 350 nm pixel size from the paper. Labels by visual inspection
  against NLO markers (paper).'
