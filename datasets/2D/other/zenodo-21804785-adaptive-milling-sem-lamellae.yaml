notes: 'Counts (3,186 images, label values, sessions) are from the Zenodo description; metadata.csv lists
  SEM/label pairs per session. Peeked 20240806_auNP.zip (TIFF files plus .DS_Store). Pixel size varies
  by image (e.g. 13.49 and 26.98 nm in metadata.csv), so voxel_size_nm is null. Yeast species is not stated,
  so only the three species named in the record are listed. Annotation procedure is not described on the
  record and the accompanying manuscript (Adaptive Milling) is not linked, so no paper was read; source
  left unknown. size_bytes is the sum of all 37 files in the record (includes model weights ~1.2 GB).
  The record dated 2026-08-12 mentions SEM only; the images are SEM of lamellae (not cryo-ET data). enricher:
  listed all 20 zips and probed/sampled one SEM/label pair (see technical).'
