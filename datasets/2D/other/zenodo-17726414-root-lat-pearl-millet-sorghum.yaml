notes: 'Found via the 2026 Plant Phenomics paper (Europe PMC full text read: Methods and Data availability):
  177 binary-mask and 85 multi-class pearl millet images plus 40 sorghum images (302). Masks were produced
  with the semi-automatic CellSet tool and corrected by experts. LAT is a laser-based serial imaging technique
  with no enum value, so modality is other. Pixel size is not stated in the paper text, Zenodo record
  or file headers. organisms: Pennisetum glaucum = binary/ and the multiclass/ files listed in train_millet.txt
  / test_millet.txt; Sorghum bicolor = the multiclass/ files listed in train_sorghum.txt / test_sorghum.txt.
  enricher: zip listed (177 binary images, 195 binary masks, 125 multiclass images, 125 .npy masks, 6
  split lists); files probed and sampled (see technical).'
