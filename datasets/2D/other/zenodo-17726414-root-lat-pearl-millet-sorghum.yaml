short_name: Pearl millet and sorghum root anatomy (LAT)
description: Laser ablation tomography (LAT) cross-section images of pearl millet and sorghum roots (4096x3000 RGB) with expert
  segmentation masks, organised for binary tissue/background segmentation (pearl millet) and multi-class tissue segmentation
  (pearl millet and sorghum), with training and validation splits for pearl millet only, sorghum only and combined.
