notes: 'Found via the 2026 Plant Phenomics paper (Europe PMC full text read: Methods and Data availability). Paper counts: 177 binary
  masks and 85 multi-class masks for pearl millet plus 40 sorghum images (302 in total); the zip holds 497 PNG and 125 NPY files
  (listed with peek_archive), so the exact image and mask counts per folder were not verified. Masks were produced with the semi-automatic
  CellSet tool and corrected by experts. LAT is a laser-based serial imaging technique with no enum value, so modality is other.
  Pixel size is not stated in the paper text or Zenodo record. Image counts per split not checked.'
