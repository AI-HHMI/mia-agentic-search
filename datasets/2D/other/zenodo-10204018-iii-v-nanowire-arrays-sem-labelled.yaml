notes: 'Zenodo record (CC BY 4.0, 755.6 MB, one zip) and zip listing: Labelled Data/ with 240 .tif (about 3.4 MB each) and 240 .json files (LabelMe).
  Paper (Open Research Europe 2024, CC BY, PDF text read): 240 images of arrays of 66 wires grown by TASE, imaged with a FEI Helios
  NanoLab 450S in SEM mode, widths 70/140/210/280 nm; wires labelled in LabelMe with four classes (wire parallel perfect/defect, wire tilted
  perfect/defect), plus a parasitic class and a null class (null images arise from the pre-processing algorithm, not from labelling). Class shares:
  49.7%, 2.4%, 21.6%, 1.6% of wires. Pixel size is not stated in the paper text or the record, so voxel_size_nm is null. The shape type
  (polygon or rectangle) in the JSON was not inspected. The paper cites the data as 10.5281/zenodo.10204018.'
