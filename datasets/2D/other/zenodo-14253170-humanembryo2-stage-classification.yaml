title: HumanEmbryo2.0
short_name: Human embryo developmental stages (time-lapse)
description: 5,500 real 256 x 256 px PNG frames of human embryos at five developmental stages (2-cell,
  4-cell, 8-cell, morula, blastocyst), 1,100 per stage, pre-split into 1,000 train and 100 test images
  per stage. Frames are central-focal-plane images from EmbryoScope time-lapse systems, from a Norwegian
  fertility clinic and the public Human Embryo Time-Lapse Video dataset.
