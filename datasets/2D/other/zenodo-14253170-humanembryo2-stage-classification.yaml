notes: 'Zenodo API record and the zip listing (peek_archive: 5,500 PNGs, 100 test and 1,000 train per stage) read; paper
  Methods read from the arXiv HTML (the Europe PMC tool found no full text). Real images come from Volvat Spiren
  clinic (Oslo, EmbryoScope, Hoffman contrast optics, central focal plane) and from the public Human Embryo Time-Lapse
  Video dataset (Zenodo 6390798); stage labels from embryologist timings or the public dataset labels, so source is
  mixed. Embryos with more than 15% fragmentation were excluded. Magnification and pixel size are not stated, so
  voxel_size_nm is null. Hoffman modulation contrast is not in the modality list, so modality is other. The synthetic
  images in the paper are on Hugging Face and are not part of this record. Zenodo states CC-BY-4.0 for this record.'
