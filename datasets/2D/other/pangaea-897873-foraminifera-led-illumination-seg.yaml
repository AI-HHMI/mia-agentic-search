notes: PANGAEA lists 8 zips (6 species zips, Others, Labels; ~1.85 GB per the listed file sizes, rounded) from hs.pangaea.de, which answered 503 to range requests so the image zips could not be listed;
  image file format, image size, microscope and pixel size are therefore not verified (description says images were cropped and converted to grayscale, 16 aligned images per sample under different LED directions).
  Only the label zip was listed (909 PNG files named Edge_<species>_<date>_Trial_N ...). The description file says 1437 samples (178 G. bulloides, 182 G. ruber, 150 G. sacculifer, 151 N. dutertrei, 174
  N. incompta, 152 N. pachyderma, 450 others); manual segmentation covers over 400 of them, hence partial coverage. Modality recorded as other because the images come from a custom LED-ring optical microscope
  setup. Full text of the Mitra 2019 paper is not open access; only metadata was read. An older copy of the data is also on Google Drive via the project page. Full paper text not read.
