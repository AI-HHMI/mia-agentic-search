notes: 'PANGAEA lists 8 data zips plus a description zip on hs.pangaea.de (~1.85 GB, rounded sizes). enricher: 6
  of 9 zips listed (3 answer 503 to range requests: G-bulloides, G-sacculifer, N-dutertrei): images are 16 grayscale
  PNGs per sample (imgray_1..16.png, one per LED direction, aligned, order differs per sample) in <species>/<date>_<trial>
  <species> <site> <size range>/ folders; labels zip ReadMe: Edge_ = contours (255), Labelim_ = aperture 25 and
  chambers 50, 75, ... for 454 samples. enricher: annotation types instance-segmentation (chambers, was semantic-segmentation)
  and classification. Description: 1437 samples (178 G. bulloides, 182 G. ruber, 150 G. sacculifer, 151 N. dutertrei,
  174 N. incompta, 152 N. pachyderma, 450 others). Organisms = species folders. Modality other: custom LED-ring
  optical microscope. Pixel size not stated. Mitra 2019 full text not open access.'
