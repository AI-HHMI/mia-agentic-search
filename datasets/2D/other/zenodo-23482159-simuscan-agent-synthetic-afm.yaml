title: SimuScan-Agent synthetic AFM images of nanostructures with instance masks and boxes
short_name: SimuScan synthetic AFM nanostructures
description: 4,761 synthetic atomic force microscopy images (512 x 512 PNG) generated with the SimuScan 2.0
  simulator, containing 25,560 nanostructures of four geometric classes (ellipse, hexagon, square, triangle).
  Simulator-derived annotations are provided as COCO instance segmentation JSON with train/val/test image
  folders and as ready YOLO detection and segmentation layouts. Used to train the YOLOv8 and triplet embedding
  models of SimuScan-Agent.
