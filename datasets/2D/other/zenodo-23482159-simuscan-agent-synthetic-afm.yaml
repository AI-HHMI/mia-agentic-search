notes: 'Zenodo record (one 1.7 GB zip, CC BY 4.0) and the zip''s file list were read: 4,761 PNG in images/,
  the same 4,761 in _yolo_det and _yolo_seg with label txt files, three COCO JSON files, dataset_info.json
  (4 classes) and synthetic_params.json (512-px images, 70/20/10 split ratios, generator settings). Fully
  synthetic: AFM is not in the schema modality list, so ''other'' is used; no pixel/physical size was
  found in the record or the files read. The manuscript it accompanies (SimuScan-Agent: language-model
  orchestration of synthetic-data-driven autonomous atomic force microscopy) is not cited with an identifier
  on the record, so no publication is listed. The synthetic_params.json mentions n_images 1000, which
  differs from the 4,761 images in the archive (likely a different generation run).'
