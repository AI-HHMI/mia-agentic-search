notes: 'Kaggle dataset paolaruizpuentes/lithos-dataset (v1, 2025-05-14), public; GitHub README still says a Kaggle account
  is needed. Paper: 580 sections, 1,164 images, grains annotated on a 300-600 point grid with OneGeo, 2-fold cross-validation
  by section; pixel ~3.5 um at 40X. enricher: license CC-BY-NC-SA-4.0 from Kaggle API metadata and paper (was unknown). enricher:
  formats png (was other), files listed and sampled. modality: polarized-light microscopy (PPL + XPL, transmitted light, light-microscopy
  family). organism: none, mineral grains in soil thin sections.'
