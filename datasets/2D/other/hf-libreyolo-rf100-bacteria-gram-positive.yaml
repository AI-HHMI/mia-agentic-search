notes: "LibreYOLO mirror (2026-01-20) of the Roboflow 100 'microscopic' subset, 105 files, 4.2 MB. Licence CC BY 4.0 from data.yaml and README.dataset.txt. Original project (Roboflow Universe, creator Terada Shoma): gram-positive-bacteria. Single class Str_pne; species and staining are not stated in the files read, so organism is left empty. Split sizes 30 / 10 / 10. One label file read has 37 very small boxes (about 1% of the image width). The microscope, contrast mode, magnification, pixel size and how the boxes were drawn are not stated in the files read, so modality is other and coverage and annotation source are unknown. The images are a Roboflow export ('release-640'); whether they were resized or augmented is not stated."
