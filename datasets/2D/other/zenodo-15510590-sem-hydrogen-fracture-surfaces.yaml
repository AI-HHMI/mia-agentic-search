notes: 'Material (not microscopy of biological samples): SEM fractography. Zip listed with peek_archive: 1,961 PNG
  files in Brittle (822), Ductile (996) and Mixed (144) folders, Labels.csv, Licence.txt ("CC-BY 4.0") and desktop.ini
  files. The Zenodo page lists no related publication, magnification, pixel size, microscope or steel grades, and
  does not say who assigned the labels (annotation source recorded as unknown). A paper by the same author (Campari et al., Computational Materials Science 2025,
  doi:10.1016/j.commatsci.2025.114366, "Hydrogen-assisted cracking: A deep learning approach for fractographic
  analysis") describes SEM fractography with brittle/ductile classification, but its page does not cite this
  Zenodo record and its full text is not open access, so the link is unconfirmed and it is not listed in publications.
  Images were not opened, so image dimensions are unknown.'
