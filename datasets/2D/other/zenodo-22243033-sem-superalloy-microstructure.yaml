notes: 'Materials-science SEM images, not biological samples; modality recorded as other because the schema has no plain SEM value (file names carry CBS; the record does not name the detector). The record lists classification_images.zip (58 micrographs), segmentation_case1_images.zip (1 micrograph), segmentation_case2_images.zip (16 tiles) and the label CSV; n_items counts 58 + 1 + 16. Only the classification images carry labels; the segmentation sets have no masks on the record (the paper they accompany, Human-in-the-Loop Microscopy Image Analysis using Vision Foundation Models, could not be found on arXiv or Europe PMC, so no paper was read). Pixel size, microscope, and annotator are not stated. The record page gives inconsistent sizes (493 vs 516.6 MB for the classification zip); size_bytes is the stated 540.8 MB total. Images derive from Kube et al. 2024 (Acta Materialia 265, 119628).'
