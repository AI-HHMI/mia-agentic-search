title: SEM micrographs for human-in-the-loop segmentation and classification
short_name: Refractory superalloy microstructure SEM images
description: Back-scattered SEM micrographs of Ru-containing BCC-B2 refractory superalloys. 58 micrographs
  (3072 x 2040 px, 16-bit grayscale PNG) are classified by microstructure into dendritic (28), dual-phase (11)
  and single-phase (19), with a CSV of per-image labels and an initialisation/test split. Two further sets
  (1 micrograph and 16 tiles of 510 x 768 px) are provided for segmentation case studies without masks.
