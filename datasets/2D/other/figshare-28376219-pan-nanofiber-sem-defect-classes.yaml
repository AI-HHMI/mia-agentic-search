notes: 'One 893 MB zip (1,436 TIFF, 6 read.me) listed with peek_archive: TrainingDataset has 1,006 images
  (Defective 354, NonDefective 336, SlightlyDefective 316) and TestDataset 436 (171, 148, 117); the 6
  read.me files are empty. enricher: all 1,436 TIFFs are "translated_*" files with 4-5 zero rows/cols
  at one edge (shifted copies, per 2 sampled), so most images look like translation-augmented copies;
  the originals are not all included. The paper is IEEE Access (abstract only, not open access): it gives
  no image count, magnification or pixel size, and the record gives none either. Image-level classification
  labels only, no masks or boxes; who assigned the labels is not stated. No SEM value in the modality
  enum, so other.'
