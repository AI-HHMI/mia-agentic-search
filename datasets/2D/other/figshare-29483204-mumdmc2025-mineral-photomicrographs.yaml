description: Cross-polarized-light photomicrographs of thin-section granite and granodiorite from the Eastern Desert of Egypt, organised in per-mineral folders (biotite, hornblende, plagioclase, potassium feldspar, quartz). Original rotation-series images were taken at 5 degree steps over 360 degrees and cropped single-grain images are included, with per-mineral metadata spreadsheets. Public sample of the MUMDMC2025 mineral classification dataset.
