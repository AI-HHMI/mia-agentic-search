notes: 'Figshare article is a sample of the dataset (MUMDMC2025_DataSet.zip, 4.8 GB, CC BY 4.0). Zip listing (peek_archive, 1,386 files): Original_Images 793 JPEG and Cropped_Images 583 (542 JPEG + 41 PNG) in five mineral folders (CN = crossed polarizers), per-mineral metadata xlsx, a notebook; n_items = 793 + 583. The paper (PMC12606340) describes 14,400 images and a public subset of 2,500 XPL images, which does not match the zip listing, so counts are what the listing shows. Euromex polarizing microscope, CMEX-10pro camera, 3,584 x 2,746 px RGB; pixel size not found. Polarized light is not in the schema modality list, hence other. Labels are by folder. No split files seen (paper suggests 80:20).'
