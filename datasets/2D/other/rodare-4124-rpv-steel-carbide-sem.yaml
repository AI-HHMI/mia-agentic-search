notes: >-
  Materials-science SEM (no organism). Zip contents were listed from the archive index (cloud/preprocessed/images/*.tif, preprocessed/labels/*_label.png, a hold-out folder,
  processed_tiles as .pt tensors, trained model weights .ckpt, plus the authors' classical particle-analysis outputs for JFL as .bmp/.txt/.xlsx). The server ignores range requests, so the 1.28 GB zip
  was fetched once in full to read its index and deleted without extraction. Pixel size differs per steel: 2048 px width = 14.3 um (JFL, ~7.0 nm/px) or 11.5 um (ANP-10, ~5.6 nm/px) per the record, so
  voxel_size_nm is null. The paper mentions three steels (JFL, ANP-10, ANP-3), the record two; 13 image pairs (SE + InLens). Paper trains on 10 of the 13 images; a hold-out folder exists. enricher: code repo data/README lists ANP-3 too (Zeiss Ultra 55); labels binary 0/255 PNG per code repo.
