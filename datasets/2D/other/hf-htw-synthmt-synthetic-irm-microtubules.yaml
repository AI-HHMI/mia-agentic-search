notes: 'Synthetic images, so imaging modality is other (IRM-like) and the organism field is empty. Hub card: 6,600 examples in one train split, about 4.0 GB of parquet, image plus a list of per-instance masks; the paper says masks are 3D TIFF stacks in the generation pipeline, while the Hub card stores them as image sequences. Masks come from the generator itself (annotations_creators: no-annotation on the card), hence source automatic. Distinct from the real-data companion HTW-KI-Werkstatt/IRM-in-vitro-microtubules (66 human-annotated real images, open PR hf-irm-in-vitro-microtubules): SynthMT holds only synthetic images. Pixel size is not stated on the card; paper full text via Europe PMC (generation uses 512 x 512 crops of 44 real IRM videos).'
