notes: 'Darkfield is not a schema modality value, hence `other`. Six zips (Figure 1/S1, 2/S3, 3-4/S6/S8, 5/S8 HA, S2, S4; 0.63-1.56 GB each, 5.72 GB total) hold images and masks. Only the Figure 2/S3 zip was listed (peek_archive): per image `--img.tif`/`--img.png`, `--msk.png`, `--Morphometry.csv`, `--RRstaining.csv`; 49 TIFFs (2.05 GB uncompressed), grouped by replicate and genotype. The other five zips were not listed (SSL errors from the proxy), so the total image count is not known (n_items null). Masks come from a RootPainter U-Net and were manually corrected if needed (paper Methods), hence source mixed; no separate hand-annotated training set is described on the record. Pixel size 6.29 µm is the per-tile pixel size stated in the paper Methods. Images are large stitched tiles of 90-110 frames. No download_url because the data are split over six zips. Zenodo is v2 of a record with a v1 for the earlier manuscript version; v1 was not checked.'
