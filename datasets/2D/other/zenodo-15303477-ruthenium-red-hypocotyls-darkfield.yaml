notes: 'Darkfield is not a schema modality value, hence `other`. Six zips (Figure 1/S1, 2/S3, 3-4/S6/S8,
  5/S8 HA, S2, S4; 5.72 GB) hold images and masks. Masks come from a RootPainter U-Net and were manually
  corrected if needed (paper Methods), hence source mixed. Pixel size 6.29 um is stated in the paper Methods
  and matches the ImageJ calibration of the TIFFs. Zenodo is v2 of a record with a v1 for the earlier
  manuscript version; v1 was not checked. enricher: all six zips listed (2267 members): 326 --img.tif/--msk.png
  pairs (268 unique names; the "combined" folders repeat the per-repetition files), n_items 326 (was null).
  enricher: size 5,720,950,240 B from the Zenodo file listing. download_url is the record page: no single
  archive (six zips).'
