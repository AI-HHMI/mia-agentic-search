notes: 'Zenodo listing and zip contents: SAM_images.zip has 19 TIFFs (72 MB), masks.zip 38 TIFF masks (endo and
  00_eval/ROIUS, 19 each). The paper (PLOS ONE 2019) gives a 100 MHz transducer, 19.8 um focal beam and a 12 um
  pixel size, notes that the endosteal boundary was drawn manually and the other masks follow from thresholding,
  and points to the sister record 10.5281/zenodo.2605350 (full anonymized study dataset, not covered here). Modality
  is acoustic microscopy, not optical, so recorded as other. enricher: download_url is the record page (was SAM_images.zip
  only; images and masks are two zips); TIFF descriptions state ''pixelsize: 0.012'' (mm), matching 12 um.'
