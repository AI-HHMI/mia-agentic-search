notes: 'images.zip lists 500 PNG files (640 MB; evaluate/ and train/ serovar folders) next to spectra_single_cell.csv (144 MB). The paper (Foods 2025) states 500
  hyperspectral cubes (100 per serovar) on an Olympus BX43 with CytoViva enhanced darkfield, HinaLea 4250 camera, 100x oil, 303 bands, and a 70/30 split; the released
  PNGs are RGB composites of the cubes, not the raw cubes. The images carry serovar labels from the known culture, not per-pixel annotations. Pixel size is not
  stated on the pages read. The 70/30 split described in the paper is reflected by the train and evaluate folders, but the exact count per folder was not checked.'
