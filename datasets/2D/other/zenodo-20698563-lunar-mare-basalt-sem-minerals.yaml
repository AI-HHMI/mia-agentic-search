notes: 'One 1.0 GB zip with code, trained models and data/data-sem-label (17,248 image/mask/metadata triples in 28 folders, from the data README; folder listing of the zip agrees). Only 1,078 samples are unique: the rest are rotated (x4) and brightness-scaled (x5, 50-120 percent) copies, so splits must group by sample. Pixel size varies per image (0.02-20 um, stored in per-image txt files), hence voxel_size_nm is null. Who made the masks and how is not stated in the Zenodo page or data README; the paper full text is not open access, so annotation source stays unknown. data-lsc-modal.xlsx holds modal abundances with rock-type labels. enricher: modality is SEM (BSE), EM family; no organism (lunar rock). Masks sampled, 10 classes from data README.'
