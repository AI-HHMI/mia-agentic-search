notes: 'LibreYOLO mirror (2026-01-20) of the Roboflow 100 ''microscopic'' subset. Licence CC BY 4.0 from data.yaml and README.dataset.txt.
  Split sizes 932 / 266 / 133 (train/valid/test). Classes: thick-dark-mark, thick-light-mark, thin-dark-mark, thin-light-mark
  (data.yaml ids 0-3). The RF100 copy is version 1 release-640 (Roboflow export, resize to 640x640). Original Roboflow project
  ''asbestos'' by an unnamed ''Roboflow user''; no authors or paper are listed. One image viewed (grey field with thin dark
  fibres) and one label file read (3 boxes, classes 2 and 0). Microscope, magnification, pixel size, sample origin and how
  the boxes were drawn are not stated on the card, README files or data.yaml, so voxel size, organism and annotation source
  are left empty/unknown.'
