notes: >-
  No paper is cited on the record page, so none is listed. The page does not state the imaging modality,
  pixel size, organism or cell types; modality is therefore recorded as other. Zip listings (peek_archive):
  Dataset_1 has 43 PNG and 43 XML, Dataset_2 43 PNG and 43 XML, Dataset_3 45 PNG and 43 XML, Dataset_4 44 PNG
  and 42 XML, each with Test_Images/ (3 images listed first) and Training_Annotations/. The four zips appear
  to contain the same Image*.png files with different annotation class definitions (not confirmed by opening
  the XML), so n_items counts one set of about 43 images. size_bytes is null because the four zips would
  double count the images. The page notes the trained YOLO model had many false negatives and suggests more
  training data. Also in the record: Predictions_YOLO_adhv_Dataset3.zip and a prediction GIF (not training data).
