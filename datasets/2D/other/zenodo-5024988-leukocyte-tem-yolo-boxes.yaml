title: An endothelial monolayer with leukocytes annotated for classification with bounding boxes for YOLO
short_name: Leukocyte transmigration bounding boxes (YOLO)
description: Frames from movies of leukocyte transendothelial migration (TEM) across an endothelial monolayer,
  annotated with bounding boxes (Pascal-VOC-style XML, made with Makesense.ai) for training a YOLO detector
  on ZeroCostDL4Mic. Four zips (Dataset_1 to Dataset_4) each hold about 40 annotated training images and
  3 test images, differing in how the leukocyte classes are defined.
