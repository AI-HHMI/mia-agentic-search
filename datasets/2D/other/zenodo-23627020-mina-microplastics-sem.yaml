title: 'MiNa dataset: SEM images of micro- and nanoplastic particles'
short_name: Micro- and nanoplastic particles (SEM)
description: 105 scanning electron micrographs (1280 x 960 px) of micro- and nanoplastic particles weathered
  from consumer PP, PE, PS and PET plastics, with a polygon outline for every particle in COCO and YOLO
  formats, plus 256 x 256 px patches (train/val/test, labelled by polymer type or as a single particle class)
  and per-particle crops with binary masks for polymer identification.
