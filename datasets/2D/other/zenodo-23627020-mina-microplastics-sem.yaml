notes: 'Modality is other because the schema has no scanning-EM value for particle samples (Zeiss EVO LS15 SEM,
  20 kV secondary electrons, 100x to 1000x). Pixel size is not stated on the Zenodo page, in the paper or in
  the file listing (each image carries a scale bar), so voxel_size_nm is null. The paper (arXiv 2409.13688)
  reports 105 micrographs; the archive holds 206 PNGs because images sit once under each annotation format.
  Annotation was done on V7 with SAM point prompts and manual refinement (mixed). The 70/15/15 split applies
  to the 256 px patches. particles.zip could not be listed with peek_archive (no zip directory found), so
  its contents are taken from the Zenodo description. The linked GitHub repository was empty when fetched.
  enricher: particles.zip lacks a zip directory (probably truncated). Modality family is EM (SEM).'
