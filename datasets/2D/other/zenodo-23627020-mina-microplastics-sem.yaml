  notes: 'value_range is from one sample (PE 3000X.png, palette indices). Size and file count from the Zenodo API
    listing (3 files) and zip directories of full_images.zip and patches.zip. particles.zip (19,374,080 B) has a
    local file header at offset 0 but no end-of-central-directory record, so it is probably truncated; its
    contents were not listed. COCO Format/ holds 102 images, the paper says 105. No direct single archive for
    the whole dataset: the three zips are separate Zenodo files. voxel size not found; checked: PNG header (dpi
    254, a default), Zenodo API description, COCO info, arXiv 2409.13688 full text (states 1280x960 px and a
