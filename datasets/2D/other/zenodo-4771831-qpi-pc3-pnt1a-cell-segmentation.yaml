id: zenodo-4771831-qpi-pc3-pnt1a-cell-segmentation
title: Quantitative phase microscopy labelled (449 FOVs) and unlabelled (1819 FOVs) dataset of various adherent cell lines for segmentation purposes
short_name: Adherent cell QPI segmentation (holographic QPI)
description: >-
  449 labelled quantitative phase images (244 PC-3, 7,907 cells; 205 PNT1A, 9,288 cells) with manual instance
  masks, plus 1,819 unlabelled QPI images of nine other adherent cell lines for self-supervised pretraining.
  Acquired with a coherence-controlled holographic microscope (Telight Q-Phase, 10x/0.3 objective).
