notes: >-
  Pixel size not stated on the Zenodo page or in the preprint text (checked page, labelled.zip listing, preprint
  full text); TIFF headers not inspected. Images are 32-bit TIFF in pg/um2 (phase) units; masks are 8-bit PNG.
  No train/val/test split files are provided; the paper uses random splits per fold. The 1,819 unlabelled images
  (unlabelled.zip, TIFF only) are intended for self-supervised pretraining. A newer Zenodo version exists. Modality
  is label-free quantitative phase imaging (coherence-controlled holographic microscopy), so listed as other
  first. Preprint is CC BY-NC-ND; Zenodo data record is CC BY 4.0. Cell lines other than PC-3 and PNT1A
  appear only in the unlabelled set.
