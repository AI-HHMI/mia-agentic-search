title: 'Labeling Human Embryo Time-Lapse Videos: A Dataset Refinement Approach'
short_name: Human zygote structure detection (time-lapse)
description: Time-lapse microscopy images of human embryos at the zygote stage, refined from an earlier multi-focal dataset,
  with bounding-box labels for pronuclei, cytoplasmic granules, polar bodies and vacuoles, and a zygote / non-zygote classification
  set. Provided in center-layer, three-layer (RGB) and focus-stacked variants with train/val/test splits.
