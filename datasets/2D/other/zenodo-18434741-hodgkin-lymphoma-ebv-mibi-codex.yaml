  notes: 'All four files are 7z archives (LZMA2, solid: MIBI 8 blocks, GeoMx 5, CODEX 2). Their member lists were read from
    the 7z end headers with range requests (~26 KB total, script using requests + lzma); members cannot be range-read or extracted
    without downloading whole solid blocks (GBs), so no TIFF header was probed and no sample taken: shapes, dtypes, axes,
    compression and label encodings are unknown. TensorSwitch fetches zip members only, not 7z members, so there is no usable
    sample unit; a test needs one whole archive (smallest with images+labels: CODEX_data.7z, 5.35 GB). data.download_url stays
    null: the dataset is four archives, direct links https://zenodo.org/api/records/18434741/files/<name>.7z/content (download-check
    usable, range requests). Size 22,012,071,854 B is the exact Zenodo listing of all four files (compressed). Voxel size
    781.25 nm applies to MIBI only (paper: 400x400 um, 512x512 px; MIBI tiles are stitched from several FOVs); CODEX and GeoMx
    pixel sizes not found (checked: paper preprint full text, Zenodo record/API, GitHub README; archive member names only).
    Code repo README points to the earlier version, Zenodo 16897608 (same concept record).'
