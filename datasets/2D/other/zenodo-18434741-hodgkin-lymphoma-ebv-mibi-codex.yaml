notes: 'Four 7z archives (MIBI 8.6 GB, CODEX 5.3 GB, GeoMx 6.0 GB, CosMx 2.1 GB Seurat .rds). Masks from deepcell-tf (MIBI)
  / MESMER (GeoMx); phenotypes from FlowSOM clustering plus manual cluster annotation, hence source automatic. No split. Voxel
  size is derived for MIBI only: paper Methods give image area 400x400 um at 512x512 px (0.78125 um); CODEX and GeoMx pixel
  sizes are not stated. Modality MIBI recorded as other (also CODEX and GeoMx fluorescence images). Paper full text is the
  bioRxiv preprint. enricher: size 22,012,071,854 B from Zenodo file listing (was 22.0 GB page-stated); formats +ome-tiff
  (CODEX *.ome.tiff in 7z header); annotations.format from 7z headers of all four archives.'
