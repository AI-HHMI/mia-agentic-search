notes: 'Four 7z archives (MIBI 8.6 GB, CODEX 5.3 GB, GeoMx 6.0 GB, CosMx 2.1 GB). Only MIBI_data.7z was listed
  (range read of the 7z header): 1,665 entries, mostly one .tiff per marker plus Segmentation.tiff per patient tile,
  88 .tif deepcell masks, .mat, .png, and two CSVs (hodgkin_DFCI_noID.csv, df_topic_noID.csv). CODEX, GeoMx and
  CosMx were not listed, so their formats are unverified (CosMx is a Seurat object). Masks come from deepcell-tf;
  phenotypes from FlowSOM clustering plus manual cluster annotation, hence source automatic. No split. Voxel size is
  derived: paper Methods give 400x400 um at 512x512 px (0.78125 um); the folder name mpp1.75 is a model setting.
  Modality MIBI recorded as other. n_items, channels not verified. Paper full text is the bioRxiv preprint.'
