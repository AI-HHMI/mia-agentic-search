short_name: Human plaque imaging mass cytometry cell masks
description: Raw and processed imaging mass cytometry (IMC) acquisitions of human carotid and femoral atherosclerotic
  plaque sections from two cohorts and three antibody panels (28 specimens in cohort 1, 62 plaques / 227 ROIs and
  543,113 segmented cells in cohort 2). Each ROI comes with denoised multichannel TIFF images, a cell-segmentation
  mask (combined DeepCell and Cellpose2 workflow), single-cell intensity and morphology tables and spatial-neighbour
  tables.
