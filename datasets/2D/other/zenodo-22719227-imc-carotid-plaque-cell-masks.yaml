notes: 'Imaging mass cytometry (metal-tagged antibodies, laser ablation) has no schema modality value, so other. Cell masks are
  automatic (steinbock workflow, IMC-Denoise, combined DeepCell-Cellpose2 segmentation) and the cell-type annotations
  are analysis outputs, so this is pseudo-label data rather than manual ground truth. Raw acquisitions are TXT files
  (MCD containers withheld for privacy) plus processed TIFFs; formats therefore list tiff only and the TXT/CSV files are
  described under annotations.format. Pixel size, channel counts and marker names were not read from the record or
  zip listings; no paper citation is given on the record and none was found by title search. n_items 539 is an
  estimate from the zip listings: 152 ROI images in Panel 1 (img/ and masks/ folders), about 160 raw ROI files in
  Panel 2, and 227 ROIs in Panel 3 as stated on the record. Individual archives are 21.5, 29.7 and 36.6 GB.'
