notes: 'Imaging mass cytometry (metal-tagged antibodies, laser ablation) has no schema modality value, so other.
  Cell masks are automatic (steinbock workflow, IMC-Denoise, combined DeepCell-Cellpose2 segmentation) and the cell-type
  annotations are analysis outputs, so this is pseudo-label data rather than manual ground truth. Raw acquisitions
  are TXT files (MCD containers withheld for privacy) plus processed TIFFs; formats therefore list tiff only and
  the TXT/CSV files are described under annotations.format. Pixel size, channel counts and marker names were not
  read from the record or zip listings; no paper citation is given on the record and none was found by title search.
  enricher: n_items 503 = img/ TIFFs in the full listing (Panel 1 152, Panel 2 124, Panel 3 227; was an estimate
  of 539); masks verified (uint16 instance IDs). Individual archives are 21.5, 29.7 and 36.6 GB.'
