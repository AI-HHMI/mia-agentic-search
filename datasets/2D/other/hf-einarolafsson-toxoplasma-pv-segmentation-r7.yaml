notes: 'Hugging Face repo (CC-BY-4.0 in the card), 1,277 files, 2.24 GB: images/ and masks/ (636 each) plus fields.csv
  (stem, origin, n_objects; origins curated_r6_set 556 and curated_plate 80; 26,693 objects), split.csv (502 train
  / 123 validation / 11 test) and folds.csv. Headers of one image and its mask: uint16, 1998x1998, deflate. The
  model card (einarolafsson/toxoplasma-pv-segmentation-cpsam-r7) says every training mask was checked by hand, so
  source is manual; the card text mentions pseudo-labelled fields can be excluded, but fields.csv lists none. Imaging
  modality, channels, microscope and pixel size are not stated in the sources read, so modality is other and voxel
  size unknown. Authorship is taken from the Hugging Face account name and the spaCR repository owner; no paper
  was found. enricher: channels 1 (single-page yx TIFFs).'
