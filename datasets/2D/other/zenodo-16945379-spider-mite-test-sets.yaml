notes: 'Zip listing read with peek_archive: Test Sets.zip holds v209_five_class, v210_three_class and v211_four_class, each with 242 images and 242 YOLO label files (the same test images relabelled per class set). Paper Methods: images from the Blackbird CNC imaging robot, Nikon Z 7II with a Laowa 25 mm ultra-macro lens at 3.5x, Z-stacks every 200 um merged with Helicon Focus, each image covering 0.99 x 0.66 cm at 1.2 um per pixel. This is focus-stacked macro photography rather than classic compound microscopy, so modality is other. The Zenodo record is test data only (the 1,300+ image training/validation set is on Roboflow Universe gent-lab, not fetched). Companion model weights are at Zenodo 16945337 (not a dataset). enricher: label class names from each data.yaml.'
