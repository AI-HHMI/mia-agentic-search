description: Focus-stacked macro-photomicrographs of two-spotted spider mite (Tetranychus urticae) life stages on hop, bean, strawberry, apple and other host leaves and leaf disks, with Roboflow bounding-box labels (YOLO format) for adult females, adult males, dead mites, immatures and viable eggs. This Zenodo record holds the test sets for three class configurations (242 images each); the larger training/validation set is on Roboflow.
