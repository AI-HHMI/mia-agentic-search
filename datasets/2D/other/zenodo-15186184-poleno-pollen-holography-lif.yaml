notes: 'Zenodo 13991959 redirects to the latest version 15186184. Two tar archives: the full 153.6 GB
  MCH_datasets_pollen_2023-2024.tar and a 182 MB subsample; the full tar cannot be listed remotely; its
  structure (plant_pictures_and_microscope, data_zip_files, data_clean_ids, metadata xlsx, json documentation)
  matches the subsample tar. Each particle event has two holographic png images and one json with image
  features and fluorescence; the paper reports well over a million events but no exact count, so n_items
  is null. Holography is not a listed modality (other). Pixel size is not given; species names are in
  Table 2 of the paper and not transcribed (organism left empty). Species labels are per sample (single-species
  samples that may contain dust and debris; clean-ID lists are provided), not per particle by hand. enricher:
  subsample tar listed and opened: per-event 200x200 uint16 PNG pairs (rec_mag) + json, one zip per dataset.
  Modality family: light (in-line holography).'
