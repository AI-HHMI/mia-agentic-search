notes: 'Data are in the GitHub repo (Images and Results/Confocal and /Split Detector, each with Training/Validation Images
  and Manual Coord); git tree: confocal 200 train + 640 val TIFFs, split detector 184 train + 80 val TIFFs. enricher: license
  GPL-2.0-only from the repo LICENSE file (GPL v2 text) and README "Released under a GPL v2 license" (was unknown); the repo
  holds code and data together, no separate data terms. enricher: annotations.source mixed (was manual): paper says confocal
  cones were marked semi-automatically by an expert grader, split-detector cones manually. Pixel size varies per subject (paper:
  lateral scale from axial length; confocal 150 px ROIs span 58-71 um, split detector 93-111 um), so voxel_size null. AOSLO
  of the living eye, recorded as other.'
technical:
  method: sample
  size_source: estimated
  layout:
    tree: "github.com/DavidCunefare/CNN-Cone-Detection (branch master), 7120 files in the git tree\nImages and Results/\n\
      \  Confocal/\n    Training Images/            200 *.tif   (JC_<subject>_<pos>_<n>_aligned_CenterCropped.tif)\n    Training\
      \ Manual Coord/      200 *_manualcoord.txt\n    Validation Images/          640 *.tif\n    Validation Manual Coord/\
      \    640 *_manualcoord.txt\n    Validation CNN Coord/, Validation GTDP Coord/   640 each (algorithm results)\n    Probability\
      \ Maps/Training|Validation   200 / 640 (CNN outputs)\n    CNN Training-Confocal/ (46), *.mat nets, scale_info_Confocal.csv\n\
      \  Split Detector/\n    Training Images/            184 *.tif\n    Training Manual Coord/      184 *_coords.csv\n  \
      \  Validation Images/           80 *.tif\n    Validation Manual Coord/     80 *_coords.csv\n    Validation AFLD Coord/,\
      \ Validation CNN Coord/   80 each (algorithm results)\n    Probability Maps/, CNN Training-Split Detector/, *.mat, scale_info_SplitDetector.csv\n\
      \  Combined CNN Results/ (M-CNN outputs)\nCode/ (26), IMDB components/ (4), matconvnet-1.0-beta23/ (library), LICENSE,\
      \ README.md, Cone_CNN_readme.docx"
    n_files: 7120
    listing_complete: true
  sample:
    urls:
    - https://raw.githubusercontent.com/DavidCunefare/CNN-Cone-Detection/master/Images%20and%20Results/Confocal/Training%20Images/JC_0007_BL_0.08_aligned_CenterCropped.tif
    - https://raw.githubusercontent.com/DavidCunefare/CNN-Cone-Detection/master/Images%20and%20Results/Confocal/Training%20Manual%20Coord/JC_0007_BL_0.08_aligned_CenterCropped_manualcoord.txt
    size_bytes: 24638
    description: One confocal training image (150x150 uint8) and its manual cone coordinates (275 points)
  arrays:
  - role: raw
    path_pattern: Images and Results/Confocal/{Training,Validation} Images/*.tif
    format: tiff
    axes: yx
    shape:
    - 150
    - 150
    shape_varies: false
    dtype: uint8
    compression: packbits
    value_range:
    - 4
    - 217
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Confocal AOSLO ROIs, 150x150 px each per the paper and two probed headers (train JC_0007, val JC_0002);
      single page, grey.
  - role: raw
    path_pattern: Images and Results/Split Detector/{Training,Validation} Images/*.tif
    format: tiff
    axes: yx
    shape:
    - 194
    - 194
    shape_varies: true
    dtype: uint8
    compression: packbits
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Split-detector AOSLO ROIs, square, size varies with eccentricity (paper: average ~208-216 px); probed
      one at 194x194.'
  - role: label
    path_pattern: Images and Results/Confocal/{Training,Validation} Manual Coord/*_manualcoord.txt
    format: csv
    axes: null
    shape:
    - 275
    - 2
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: points-table
    classes:
    - id: null
      name: cone photoreceptor
    alignment: same-grid
    alignment_notes: 'Pairing: <stem>.tif -> <stem>_manualcoord.txt in the parallel Manual Coord folder. Tab-separated x,
      y pixel positions, MATLAB 1-based coordinates (README); one row per cone (275 in the sample).'
  - role: label
    path_pattern: Images and Results/Split Detector/{Training,Validation} Manual Coord/*_coords.csv
    format: csv
    axes: null
    shape:
    - 174
    - 2
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: points-table
    classes:
    - id: null
      name: cone photoreceptor
    alignment: same-grid
    alignment_notes: 'Pairing: <stem>.tif -> <stem>_coords.csv in the parallel Manual Coord folder. Comma-separated sub-pixel
      x, y (MATLAB 1-based); 174 rows in the probed file.'
  notes: 'Listing: blobless git clone of the repo (tree only, no blobs), 7120 files; folder counts match the paper (840 confocal,
    264 split detector). Probed 3 TIFF headers (2 confocal 150x150, 1 split detector 194x194; uint8, packbits, single page).
    Sampled one confocal pair (22,844 B image, values 4-217 from this one image; coordinate file read with curl, 1,794 B,
    275 tab-separated x/y rows) and one split-detector coords CSV (2,253 B, 174 rows). Paper: images normalized to 0-255 before
    CNN training (processing step, not stated for the stored files), so normalization unknown. size estimated (uncompressed):
    raw 840 x 150x150 uint8 + raw 264 x 194x194 uint8 = 28,835,904 B (28.8 MB); shapes vary, so approximate; coordinate tables,
    CNN outputs, .mat files and code not counted. Voxel size not set: per-subject lateral scale (paper: from IOL Master axial
    length); scale_info_Confocal.csv / scale_info_SplitDetector.csv list one number per subject (0.39-0.55) without a unit
    or documentation; checked: TIFF headers (no calibration), README, scale_info CSVs, paper Methods. Downloads: every file
    is direct on raw.githubusercontent.com (usable, range requests); the GitHub archive zip returned 403 here, so data.download_url
    stays null.'
