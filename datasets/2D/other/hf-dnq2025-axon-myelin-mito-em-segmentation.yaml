notes: 'Hugging Face dataset card (README, API record with splits 528 train + 12 validation, 12+1 parquet shards,
  total 5.69 GB, file list incl. id2label.json). Format is parquet with embedded image and label images; the
  embedded image encoding (PNG/TIFF) was not inspected, so formats is other. Modality is only described as
  "electron micrographs" in the bioRxiv text (TEM vs SEM not stated), so modality is other. Pixel size, original image
  size and scale are not given on the card or in the preprint (images resized to 384x384 for training; per-image
  calibration not published). Paper full text read from bioRxiv; Europe PMC has abstract only. Annotation: initial
  manual labels, model-assisted expert refinement rounds; axon and myelin masks supplied by AxonDeepSeg. Imaging data
  come from a previously published study. Publication date not stated on the card. The card says other data and
  model weights are not yet released.'
