short_name: EM curtaining artefact removal pairs
description: 22,060 pairs of electron microscopy images (JPG) for removing FIB-milling curtaining artefacts
  - an input image with curtaining and the manually processed output image without it. Covers diverse
  EM techniques and sample types, curated to train and validate the UNet-based DecurtainNet model.
