notes: 'Single 60 MB zip (218 .tif, 5 .py, 1 .txt) listed with peek_archive: 4 manually labeled training image/label pairs,
  70 cleaned SEM images (cleaned-coarse 43, cleaned-fine 27), and per-image segmentation masks and pore-filtered masks produced
  by a Random Forest classifier (automatic labels, not manual). Only 4 images are manually labeled. The record gives no paper,
  microscope, magnification, pixel size or exact Spartina species; organism is the genus. No SEM value in the modality enum,
  so other. enricher: README.txt read: labels 0 background, 1 voids (pores), 2 tissue; source mixed = 01_Training_labeled_images/labels
  manual (Fiji-Weka), 03_Segmentation_masks and 04_PoreFiltered_masks automatic (Random Forest). modality: all images are
  conventional SEM (EM family); other only because the enum has no plain SEM value.'
