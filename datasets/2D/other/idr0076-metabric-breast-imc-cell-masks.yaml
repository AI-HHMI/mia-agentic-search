notes: 'Not a standard optical microscopy dataset: imaging mass cytometry (metal-tagged antibodies), hence modality other. 548 images counted via the IDR API (one dataset, "Breast Cancer"); source files
  are *_fullstack.tiff (filePaths.tsv). Cell masks are automatic (Ilastik + CellProfiler per the study file), not manual. Paper is not open access (Europe PMC has no full text; only the abstract was read),
  so pixel size, instrument and the mask procedure details were not found; voxel_size_nm left null. Total data size is not stated in the study file. Authors: study file lists one person (Ali); the paper
  has many more authors. enricher: masks found as TIFF files on EBI FTP, explained in ReadMe.docx (annotations_verified true). size_bytes from the HTTP index (rounded sizes).'
