notes: 'Read the Kaggle dataset API record and the full file listing (2,197 PNGs in images/, 2,197 PNGs in annotations/, 2,197
  XMLs in xmls/). The XML contents and annotation PNGs were not opened; their content (species and boxes in the XML, masks
  in the PNGs) comes from the Kaggle description and the paper title, so the segmentation label type is unverified. The paper
  is not open access and Europe PMC has no full text, so only its abstract page was read: microscope, magnification, contrast
  mode, pixel size, annotation procedure and species list were not found, hence modality other and null voxel size. The Kaggle
  description does not name the labeling tool; source manual is an assumption from the paper describing an annotated dataset.
  date_published is the Kaggle last-updated date (v7). Kaggle downloads require a free Kaggle account (not tested here). 9.4
  GB for 2,197 images suggests lossless PNGs.'
