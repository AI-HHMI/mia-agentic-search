      brain masks are .npy (not opened), colon masks .tif.
  - role: label
    path_pattern: '{InstanceSeg/<organ>/<split>,OrgDet/<organ>/all}/labels/<name>.txt'
    format: other
    axes: null
    shape:
    - 70
    - 5
    shape_varies: true
    dtype: unknown
    compression: deflate
    encoding: boxes-table
    classes: null
    alignment: same-grid
    alignment_notes: YOLO-style text rows "class x_center y_center width height" normalised to [0,1];
      the sampled file has 70 rows of class 0, matching the 70 instances in its mask.
  notes: 'Complete Zenodo listing, zips expanded: 2 zips, 3,668,745,286 bytes, 26,633 members. Sample
