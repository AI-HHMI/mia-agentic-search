      \       images .jpg/.tif, masks .tif\nOrgDet.zip/OrgDet/<organ>/all/{images,labels}/\n  Inestine\
      \   2813 images (.jpg/.jpeg)  + .txt labels\n  brain      1857 images (.jpg)        + .txt labels\n\
      \  lung       4006 images (.jpg)        + .txt labels\n(counts = image files; 26,633 zip members\
