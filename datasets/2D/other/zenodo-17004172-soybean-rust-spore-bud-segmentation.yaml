notes: 'The zip listing (8,828 PNGs) shows images/ and labels/ each with nine folders (090min to 210min; 258 to 556 files per folder). The paper (Data section) says the images come from the Cell Image Library and are split by time interval for cross-validation (7 train, 1 val, 1 test intervals), so no fixed split is in the zip. Imaging modality, magnification and pixel size are not stated on the record or in the paper text, so modality is other and voxel size null. Images are separate frames, not tracked objects, so dimensionality is 2D. The original CIL entry was not identified; check that it is not already catalogued. Label classes beyond the binary fungus mask are not described.'
