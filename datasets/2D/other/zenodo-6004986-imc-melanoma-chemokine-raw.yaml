description: Raw multiplexed imaging mass cytometry (IMC) data of metastatic melanoma tissue, with RNA plus protein and protein-only panels, an exhaustion-stain validation set and a 12-plex RNAscope validation set (HeLa and A431 cells). The archive holds multichannel TIFFs with spillover correction, ilastik-based cell masks and tumor masks, CellProfiler projects and outputs, and per-cell intensity tables.
