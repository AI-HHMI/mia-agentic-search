notes: 'Imaging mass cytometry is not in the modality enum, so modality is other. Masks are automatic (ilastik pixel probabilities
  + CellProfiler; preprint Methods), not manual. Pixel size is not stated on Zenodo, in the preprint Methods (Hyperion, 400
  Hz ablation) or the GitHub README. Channels differ per panel (RNA 41, protein 47 per *_full.csv; exhaustion 37), so channels
  is null. Organism: Homo sapiens for all sets (patient TMA; HeLa and A431 lines in 12plex_validation). enricher: n_items
  345 = multichannel images in rna/cpout (166), protein/cpout (167) and exhaustion_stain/img (12), from the listing (was 432);
  12plex_validation images not counted. enricher: size 17.9 GB = the one zip, from the file listing.'
