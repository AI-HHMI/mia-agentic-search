notes: Imaging mass cytometry is not in the modality enum, so modality is other. Masks are automatically generated (ilastik pixel probabilities plus CellProfiler), not manual, so this is raw data with derived masks rather than a curated ground-truth set. Archive listing via peek_archive reports 4133 files (432 TIFF, 226 CSV, 28 HDF5) and 17.9 GB compressed (73.6 GB uncompressed); n_items counts the TIFFs and may include both multichannel images and masks. Pixel size, channel counts and number of ROIs are not stated on the Zenodo page; the paper is not open access (Europe PMC gave only the abstract), so Methods were not read. Organism is inferred from the abstract (melanoma patient samples) and the HeLa/A431 lines named on the Zenodo page.
