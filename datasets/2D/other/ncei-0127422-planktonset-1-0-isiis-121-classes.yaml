notes: 'Read: NCEI ISO metadata, archive listing (v2.3 data/0-data: FINAL_Plankton_Segments_12082014/, train/, test/, solution.csv
  33.9 MB, main.R, solution.R) and the Technical Doc. Split 50/50 train/test; 100,000 distorted ''poison'' copies were added
  to the test set and ignored in scoring. Harvester counted 30,023 train JPGs; the train and FINAL_Plankton_Segments folders
  each have 121 class folders. No paper listed. ISIIS-2 shadowgraph imaging is not a schema modality, so modality is other.
