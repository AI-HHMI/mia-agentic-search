notes: 'Collection members read through the Figshare API: images as TIFF (1,705 files in one 1.2 GB zip,
  listed with peek_archive) and PNG (1.2 GB), expert POI CSV, expert polygon CSV (and pickle), sample
  metadata CSV, automatic contours pickle (103 MB), 625 MB of excluded images. All items CC0. Paper: 2,580
  images annotated, 1,768 kept after quality flags, 63 more dropped without agreed POIs (= 1,705); polygons
  exist for the kept images. Pixel size not stated (paper: 0.4 um is ~30 px at 4000x, approximate only);
  TIFFs carry no calibration. modality: SEM (electron microscopy) of etched steel, not in the enum, so
  other; not biological, so no organism. A related Figshare item adds deep-learning labels (14102615,
  MIT) that point to the same images. enricher: size_bytes = all 11 collection files (was the TIFF zip
  + CSVs, 1,225,465,189 B).'
