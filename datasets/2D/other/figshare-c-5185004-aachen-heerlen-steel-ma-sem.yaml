short_name: Steel martensite-austenite islands (SEM)
description: '1,705 SEM images of bainitic steel surfaces (10 steel samples, all recorded at 4000x) with expert
  annotations of blocky martensite-austenite (MA) islands: point-of-interest coordinates agreed by three experts
  and expert polygon outlines around each island. Published as a Figshare collection of 11 items (TIFF and PNG images,
  POI and polygon CSVs, sample metadata, automatically detected contours, excluded images).'
