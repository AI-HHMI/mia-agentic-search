notes: 'Collection members read through the Figshare API: images as TIFF (1,705 files in one 1.2 GB zip, listed
  with peek_archive) and PNG (1.2 GB), expert POI CSV, expert polygon CSV (and pickle), sample metadata CSV, automatic
  contours pickle (103 MB), 625 MB of excluded images. All items CC0. size_bytes is the TIFF zip plus POI, polygon
  and metadata files. Paper: 2,580 images annotated, 1,768 kept after quality flags, 63 more dropped without agreed
  POIs (= 1,705); polygons exist for the kept images. Pixel size is not stated; the paper says all images are 4000x
  and ~30 px = 0.4 um, so about 13 nm per pixel (implied by the paper, not stated as pixel size); not recorded as voxel size. Modality
  is SEM of metal, not in the modality enum, so other. A related Figshare item adds deep-learning labels (14102615,
  MIT) that point to the same images.'
