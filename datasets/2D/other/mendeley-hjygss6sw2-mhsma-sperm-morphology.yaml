title: 'MHSMA: The Modified Human Sperm Morphology Analysis Dataset'
short_name: Human sperm morphology labels (MHSMA)
description: 1,540 grayscale images of single human sperm cells from 235 patients with male
  factor infertility, each labelled by experts as normal or abnormal for the acrosome, head,
  vacuole and tail. Provided as 128x128 and 64x64 pixel crops with 1,000 training, 240 validation
  and 300 test images. Based on the Human Sperm Morphology Analysis Dataset (HSMA-DS).
