notes: 'Zenodo files: NorthSea_ISIIS_ROIs_without_background.zip (4.7 GB, 46,331 PNGs), NorthSea_ISIIS_ROIs_with_background.zip
  (14.3 GB, same ROIs), NorthSea_CPICS_ROIs.zip (0.88 GB, 15,659 PNGs), ROI_annotations_and_metadata.csv
  (21 MB, 61,990 rows), classification models (3.5 GB), code and supporting data. In situ shadowgraph
  / particle imaging of mesozooplankton ROIs, not a conventional microscope, so modality is other and
  confidence is capped. The CSV and CPICS zip both hold 15,659 CPICS ROIs against 14,496 stated images;
  the reason was not checked. Pixel size differs per subset (CSV column pixel_size_mu): ISIIS-DPI 17 um
  (29,196 ROIs) or 38 um (17,135), CPICS 4.54 um (15,659), so voxel_size_nm is null. License CC-BY-4.0
  from the Zenodo record. enricher: size_bytes is now the exact Zenodo total of all 9 files (was approximate).'
