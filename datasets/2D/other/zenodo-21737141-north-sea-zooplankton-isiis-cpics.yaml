title: A FAIR annotated set of 60k+ in situ zooplankton images from the Greater North Sea and Greenland
short_name: North Sea in situ zooplankton images
description: 60,827 expert-annotated region-of-interest images of zooplankton and particles from an in situ shadowgraph imager
  (ISIIS-DPI, 46,331 images in 64 classes) and the Continuous Particle Imaging and Classification Sensor (CPICS, 14,496 images in
  42 classes), collected in the Greater North Sea and Greenland in 2021 to 2024. Classes are taxonomic and trait-based (WoRMS
  Aphia names) with life-stage and other attributes; trained CNN classifiers and code are included.
