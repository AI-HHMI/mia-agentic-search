notes: 'Zenodo files: NorthSea_ISIIS_ROIs_without_background.zip (4.7 GB, 46,331 PNGs), NorthSea_ISIIS_ROIs_with_background.zip
  (14.3 GB, same 46,331 ROIs), NorthSea_CPICS_ROIs.zip (0.88 GB, 15,659 PNG entries by peek_archive), ROI_annotations_and_metadata.csv
  (21 MB), classification models (3.5 GB), code and supporting data. size_bytes is approximate (both ISIIS variants plus CPICS,
  about 19.9 GB), not a stated total. Imaging is in situ shadowgraph / particle imaging of mesozooplankton ROIs, not a
  conventional microscope, so modality is other and confidence is capped; ROIs are cropped per object and annotations are
  classification labels only. The CPICS zip lists 15,659 entries against 14,496 stated images; the reason was not checked.
  Pixel size not stated on the Zenodo record, readme or the preprint abstract; the full PDF was not read. License CC-BY-4.0
  is from the Zenodo record; the ESSD preprint is also CC-BY-4.0.'
