notes: 'No license is shown in the Zenodo API record; the CC-BY-4.0 link in the paper full text refers to the article,
  so the dataset license is left unknown. peek_archive of EMDiffuse_dataset.zip lists 822 TIFFs (~6.4 GB uncompressed)
  in brain_train, brain_test and Heart/Liver/Bone Marrow/HeLa folders (per the Zenodo description). Pixel size 3.3
  nm is for the brain ground truth (raw super-resolution input 6.6 nm); the paper gives 4.4 nm for liver/heart/bone
  marrow and 2.1 nm for HeLa. Imaging on an FEI Verios SEM at 2 kV; the paper does not name the SEM mode more specifically
  than SEM, so modality is other. Ground truth is the longest exposure, not a manual annotation. Species of HeLa
  is inferred from the cell line name. enricher: license still unknown (GitHub LICENSE is MIT for the code; no license
  in Zenodo API). The pairs ship unregistered; the repo register.py aligns them.'
