title: STM images of Si(001), Ge(001) and TiO2(110) surfaces with defect segmentation masks
short_name: STM surface defect masks (Si, Ge, TiO2)
description: Scanning tunnelling microscopy data for few-shot defect segmentation. 14 fully segmented
  512 x 512 px scans (5 Si(001):H:AsH3 at 100 nm, 5 Ge(001):AsH3 at 50 nm, 4 TiO2(110) at 10 nm field
  of view) with two-class masks (defect / no defect), plus small crops of individual defects (1085 on
  Si, 198 on Ge, 121 on TiO2) in one array file.
