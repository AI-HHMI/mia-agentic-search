notes: 'Zip listed with peek_archive: 33 .npy files, 160 MB uncompressed (images/ and masks/ folders for Ge(001)-AsH3
  (5 pairs), Si(001)-H-AsH3 (7 files in the listing) and TiO2(110) (4 pairs), plus Data/Crops/defSTM.npy). The
  zip listing shows 7 Si scans while the paper reports 5, and the paper itself is inconsistent about TiO2 (4 vs
  5 scans); n_items counts the 14 scans stated in the paper tables. Pixel size is not stored in the files; the
  paper gives fields of view of 100, 50 and 10 nm for 512 px scans (about 0.195, 0.098 and 0.020 nm/px), different
  per surface, so voxel size is null. The paper does not state whether masks were drawn manually (its method
  makes training labels with k-means on pretrained features), so annotation source is unknown. Instrument per
  paper: Omicron STM, room temperature (Si, Ge) and 78 K (TiO2). Dataset license is CC-BY-4.0 on Zenodo; the paper
  gives no licence. Not a biological dataset (surface science).'
