notes: 'Zip: 33 .npy files (images/ and masks/ for Ge(001)-AsH3 5 pairs, Si(001)-H-AsH3 7 pairs, TiO2(110)
  4 pairs, plus Data/Crops/defSTM.npy). The listing has 7 Si scans while the paper reports 5, and the
  paper is inconsistent about TiO2 (4 vs 5); n_items counts the 14 scans in the paper tables. Pixel size
  is not stored in the files; the paper gives fields of view of 100, 50 and 10 nm, different per surface,
  so voxel size is null. The paper does not state whether masks were drawn manually, so annotation source
  is unknown. Instrument per paper: Omicron STM. Not a biological dataset (surface science). enricher:
  size from the Zenodo file listing (was 114.2 MB stated); Si and Ge images are 1024 x 1024 while their
  masks are 512 x 512.'
