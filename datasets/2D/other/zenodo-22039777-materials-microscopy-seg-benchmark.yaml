      \ 22 MB   EBC/{train,val,test}/{images,masks}/  24+24 .tif\n  MetalDAM.zip         21 MB   MetalDAM/{train,val,test}/images/\
      \ 42 .jpg; masks/ 42 .png\n  Super.zip           6.8 MB   Super/{train,val,test}/{images,masks}/\
