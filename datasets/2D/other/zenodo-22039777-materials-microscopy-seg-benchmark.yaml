notes: 'Not biology: materials-science microscopy (modality other, no organism). Counts from README and
  dataset_counts.csv; Super.zip and Aachen-Heerlen.zip were listed with peek_archive (<dataset>/<split>/{images,masks}).
  Mixed formats: UHCS tif+png, Grain png+jpg, MetalDAM jpg images with png masks. Zenodo declares CC-BY-4.0,
  but the bundled README says no final license was selected, and the sets derive from third-party sources
  whose own terms were not checked, so the license is uncertain. Pixel sizes are not stated; no paper
  is linked, so publications is empty. Annotation source is mixed (existing annotations kept, others made
  or corrected manually). download_url is null: several archives. enricher: size 1,706,583,671 B from
  file listing; annotation types semantic only (masks hold class values, not instance IDs).'
