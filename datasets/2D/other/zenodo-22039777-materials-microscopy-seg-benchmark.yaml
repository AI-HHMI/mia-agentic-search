  notes: 'Listing: tools/listing.py on the Zenodo record with --expand-zips: 16 files, 1,706,583,671 B
    (file-listing, complete), 7,250 zip members (3,625 images + 3,625 masks, matching dataset_counts.csv).
    Probed one image and mask per subset; sampled the Super pair lshr_15kx_3kv_0 (272,375 + 10,579 B downloaded):
    image 512x512x3 uint8 RGB with identical samples, range 48-206 (one sample); mask 512x512 uint8 {0,1,2}.
    Masks are semantic class maps: README counts ''instances'' as connected components per non-zero class
    value. Voxel size not found; checked: TIFF/PNG headers (no calibration), Zenodo API description, README,
    DATA_SOURCES.md, csv files. Subsets come from different instruments and magnifications (e.g. Super
    file names 15kx/45kx/50kx), so no single pixel size applies; per-subset sizes would be in the 6 upstream
    papers (not read this run). Raw PNG axes differ by subset (palette yx vs RGB yxs), so that array''s
    axes stay null. Download: each zip is a direct file (Zenodo, range requests); no single archive for
    the whole dataset.'
