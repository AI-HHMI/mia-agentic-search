id: zenodo-22039777-materials-microscopy-seg-benchmark
title: Seven curated materials-microscopy segmentation datasets with mask annotations
short_name: Materials microscopy segmentation (7 datasets)
description: 'Benchmark of seven curated microscopy image segmentation datasets with image/mask pairs
  and predefined train/val/test splits: Aachen-Heerlen (1705 bainitic steel images), UHCS (550 ultrahigh
  carbon steel micrographs), Grain (816 stainless steel 316L grain images), EMPS (465 electron-microscopy
  nanoparticle images), MetalDAM (42 advanced high-strength steel micrographs), Super (23 Ni-based superalloy
  images) and EBC (24 environmental barrier coating images). 3,625 images and 3,625 masks in total (163,901
  mask instances). The sets derive from earlier published datasets; files were reorganised, split, and
  annotations reviewed, supplemented or corrected.'
