description: 563 reflected light microscopy (RLM) images of iron ores from mines of the Singhbhum Craton,
  eastern India, sorted into four expert-assigned grades (Blue Dust Ore, Hard Laminated Ore, Lateritic
  Ore, Soft Laminated Ore) at 10x and 20x objective magnification. Released for deep-learning based iron
  ore characterization.
