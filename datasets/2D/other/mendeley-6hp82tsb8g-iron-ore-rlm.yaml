notes: 'Leica DM2700P, 10x and 20x objectives, 2048 x 1536 TIFF, 300 dpi, 3 colour channels (images look grey scale). Modality is reflected light microscopy, which has no schema value, so modality is other. Pixel size not stated in the Mendeley record or the Data in Brief paper (a burned-in scale bar is on the images), so voxel_size_nm is null. 563 is the image count stated in the paper; 10x folder has four grade sub-folders, 20x folder has only HLO and LO. Grades were assigned by expert geologists and XRD analysis. The Mendeley files are IronOreRLM.zip (3.01 GB) and Sample Images.zip (64 MB, 12 preview images); the zip contents were taken from the paper and the record description, not listed with peek_archive.'
