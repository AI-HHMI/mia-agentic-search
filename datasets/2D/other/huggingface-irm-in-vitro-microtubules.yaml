notes: 'Single Parquet file (data/train-00000-of-00001.parquet) holding PNG images and mask images, loadable with the Hugging Face datasets
  library; no train/test split. The 66 images are 512x512 crops, one annotated frame each from 66 crops of 44 real IRM videos from two wet
  labs; two independent annotators labelled each frame in Label Studio (the paper uses one as ground truth and the other for inter-annotator
  agreement; it is not stated which annotator the released masks come from). Pixel size is not stated on the dataset page, the paper main
  text or the README (S1 Appendix not read). Annotations were not verified in a file listing (only the README feature schema was seen).
  The companion synthetic SynthMT set (HTW-KI-Werkstatt/SynthMT) is not included because its images are synthetic. Sources checked: dataset
  API record, README, paper full text via Europe PMC, project page.'
