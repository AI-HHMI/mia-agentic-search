notes: 'Single parquet file (data/train-00000-of-00001.parquet) with PNG images and per-instance mask images; no
  train/test split. 66 512x512 crops, one annotated frame each, from 44 real IRM videos of two labs; two annotators
  labelled each frame in Label Studio (not stated which annotator the released masks are from). Synthetic companion
  SynthMT not included. enricher: annotations verified (binary mask PNGs in the parquet); size from Hub listing;
  channels 2 = IRM + seed fluorescence and widefield added (S1 Appendix sec. 3: Nikon widefield microscopes, IRM
  is the primary modality). Voxel size null: S1 Appendix sec. 3 gives 9.0909 to 9.2308 px/um (about 110 / 108.3
  nm/px) for two setups, per-image setup not stated. Organism not set: tubulin from various sources, mammalian to
  protozoan (S1 Appendix).'
