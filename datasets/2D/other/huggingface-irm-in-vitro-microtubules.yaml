  notes: 'Hub API tree: 3 files, 29,219,757 B, complete (= size_bytes). Downloaded the whole parquet (29,211,448
    B) and scanned it for embedded PNGs without a parquet reader (pyarrow is not an allowed tool): 4 mask PNGs decoded
    (512x512 uint8, values {0,255}); the image PNGs span compressed parquet pages, so only their IHDR headers (512x512,
    8-bit RGB) were read and no raw value_range was measured. normalization contrast-stretched: paper Methods (Real
