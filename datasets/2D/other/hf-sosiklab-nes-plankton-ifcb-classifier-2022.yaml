title: NES Plankton IFCB Classifier 2022 Training Data
short_name: NE US Shelf plankton IFCB classification images
description: 97,026 human-verified grayscale ROI images from Imaging FlowCytobot (IFCB) deployments on the Northeast
  US Shelf (2006-2021), labelled into 155 classes of plankton and non-plankton objects (detritus, bubbles, fibres,
  etc.) and used to train the NES Plankton IFCB Classifier 2022. Provided as Parquet shards with a stratified
  80/20 train/validation split (77,617 / 19,409).
