notes: >-
  Materials / hardware-security SEM (an integrated circuit, no organism). The 6.4 GB dataset.zip (Edmond API) was listed from its zip64 index: dataset/sems/m1 (327 PNG), dataset/sems/m2 (321 PNG),
  dataset/labels/m2 (321 SVG), plus LICENSE and README. Labels are partial: only M2 has them. They were made with thresholding, edge detection and size/position/complexity filtering, then
  manually validated and corrected; the dataset description warns of duplicate vias and tracks spanning several images missing from some label files. The dataset is intended for unsupervised
  training (the paper's approach needs no labels), so labels serve evaluation. Paper full text is not open access (checked Europe PMC and Crossref for both the ASHES'23 paper and the extended
  preprint); the 648-image count comes from the preprint abstract and matches the zip listing. Pixel size from the dataset description. Image dtype not checked.
