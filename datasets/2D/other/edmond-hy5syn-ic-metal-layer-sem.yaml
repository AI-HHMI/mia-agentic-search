    sample (sems/m2/sem0000.png: mean 61, std 31, p1 27, p99 194, 0.25% at 255). label0000.svg: 751 <path> tracks, 701 <circle> vias. SVG is vector data with no dtype; it must be rasterized for training.
    Download: dataset.zip at https://edmond.mpg.de/api/access/datafile/223856 is direct (range requests, zip members readable), but edmond.mpg.de is not on TensorSwitch''s fetch allowlist. Readiness blockers
