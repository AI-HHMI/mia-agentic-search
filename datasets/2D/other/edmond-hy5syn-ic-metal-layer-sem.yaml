notes: 'Materials / hardware-security SEM of an integrated circuit: no organism. Modality: SEM (electron microscopy, backscattered-electron detector); the schema has no plain SEM value, hence other. Labels
  are partial: only the 321 M2 images (sems/m2) have SVG labels, the 327 M1 images are unlabeled. The README says labels were made with thresholding, edge detection and size/position/complexity filtering,
  then manually validated and corrected; duplicate vias are possible and tracks spanning several images may be missing from some label files. The dataset targets unsupervised training (labels serve evaluation).
  Paper full text is not open access. Pixel size 14.65 nm from the README and dataset description. enricher: annotations.source proofread from README (was mixed).'
