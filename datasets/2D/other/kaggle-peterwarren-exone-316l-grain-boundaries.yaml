notes: 'Kaggle API view and file listing: 674 files = Grains/*.png (336), Segmented/*.jpg (336) and two HED weight files
  (prototxt, caffemodel); 157.6 MB; license CC0: Public Domain; last updated 2022-12-08. The Kaggle description says
  masks come from traditional image thresholding; the paper says human annotators marked boundaries in a colour that
  was then thresholded, so source is recorded as mixed. The paper is inconsistent on image counts (640, 480, over
  400); the listing shows 336 pairs. Pixel size is not stated (the paper gives mean grain area 1068 um2 only), so
  voxel size is null. Modality is reflected-light optical microscopy per the paper (no contrast mode stated). The
  paper also releases a Voronoi synthetic set as a separate Kaggle dataset (not part of this record). Materials-science
  dataset, not biological.'
