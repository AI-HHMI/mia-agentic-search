notes: 'Zenodo v2 (7.4 GB: MVDI25K.zip 7.0 GB, datasetforObjectSegmentaion.zip 365 MB, README). Licence conflict: the Zenodo
  metadata says CC BY 4.0, but the README states "academic purposes only, any commercial use is prohibited", so spdx is custom.
  MVDI25K.zip holds 25,708 jpg, txt and xml files each (one of each named *.50.*), matching the README. No paper is linked
  and none was found (Europe PMC, web search). Organism, stain, magnification, pixel size and the annotation procedure are
  not stated. enricher: size 7,355,694,583 B from the Zenodo file listing (was null); formats + png (masks); box format corrected
  to centre/size from a sampled txt vs xml.'
