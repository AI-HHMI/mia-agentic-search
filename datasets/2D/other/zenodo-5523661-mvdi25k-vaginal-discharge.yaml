short_name: MVDI25K vaginal discharge cells (microscopy)
description: 25,708 RGB microscope images of vaginal discharge captured with an HJ500 Discharge Analysis Workstation, with
  bounding boxes (YOLO txt and VOC xml) for 10 object classes (leukocyte, epithelial cell, three Candida classes, hyphae,
  Trichomonas, Lactobacillus, red blood cell, clue cell), plus a 912-image subset with grayscale segmentation masks.
