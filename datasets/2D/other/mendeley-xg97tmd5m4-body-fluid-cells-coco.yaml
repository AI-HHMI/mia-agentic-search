notes: 'The Mendeley public API lists 37,618 files totalling 1.08 GB: 28,206 JPG images, 9,405 TXT (YOLO labels and Roboflow
  READMEs), 3 COCO JSON files (_annotations.coco.json, one per split), 3 CSV files and data.yaml. The 28,206 JPGs exceed the
  12,966 cells quoted on the page because the training split is augmented (page and Roboflow export). The page does not state
  the stain, microscope, magnification, pixel size, how the cells were annotated, or give a related paper; no paper was found,
  so modality is other and annotation source is unknown. Class names were not read from data.yaml. No direct archive link;
  files are individually listed on Mendeley (the page offers Download All). enricher: the 28,206 JPGs are 9,402 unique images
  (sha256) stored 3 times, once per export folder (COCO, CSV, YOLO); n_items 9,402 (was 28,206), training images include augmented
  copies. On 2026-11-12 no file could be downloaded (API status SETUP, links return a 404 JSON).'
