notes: 'The Mendeley public API lists 37,618 files totalling 1.08 GB: 28,206 JPG images, 9,405 TXT (YOLO labels and Roboflow READMEs),
  3 COCO JSON files (_annotations.coco.json, one per split), 3 CSV files and data.yaml. The 28,206 JPGs exceed the 12,966
  cells quoted on the page because the training split is augmented (page and Roboflow export), so n_items is the JPG
  count and includes augmented copies. The page does not state the stain, microscope, magnification, pixel size, how
  the cells were annotated, or give a related paper; no paper was found, so modality is other and annotation source is
  unknown. Class names were not read from data.yaml. No direct archive link; files are individually listed on Mendeley
  (the page offers Download All).'
