  notes: 'Listing: Zenodo API + zip central directories (listing.py --expand-zips), exact sizes. Probed one JPEG member (514x514x3 uint8) and sampled it (0-241, grey as RGB). The two .npy files were read by range with a scratch script (no pickle): headers, then crops 0 and 1140 of each (1.57 MB): images float32 0.125-0.525 and 0.039-0.596 (values k/255, from these crops only); labels float64 {0,1} and {0,1,2}. annotations.csv read in full: 2733 boxes, 8 classes, 107 files. STM_data .sxm (Nanonis) not parsed. Voxel size varies: paper Methods give nm-to-pixel ratios 0.049 and 0.098 for 50/100/200 nm scans at 512-2048 px; the .npy crops come from 50x50 nm 512x512 images (paper). No single archive: the 6 files have direct Zenodo API links (download_url stays null).'
