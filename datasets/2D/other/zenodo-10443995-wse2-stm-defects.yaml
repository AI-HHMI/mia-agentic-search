notes: 'Files: STM_data.zip (678 raw .sxm scans), STM_images.zip (236 JPEG renderings), two .npy training arrays and annotations.csv/.json. The .sxm and .npy files are not in the schema format list, so formats lists only the JPEGs. The record says 136 images carry labels; annotations.csv has 2,733 boxes on 107 images in eight peak/trough classes, while the paper reports 1,382 instances and trains on crops of 38 labelled 512 x 512 images. Paper Methods: scan widths 50/100/200 nm at 512-2048 px (0.049 or 0.098 nm per pixel), so pixel size varies and voxel_size_nm is null; masks are circles generated from the boxes. The paper says data is available on request; the Zenodo record is open (CC-BY-4.0). No single archive, so download_url and n_items are null. enricher: JPEG count 236 from zip listing (was 90); npy mask classes 0 background, 1 trough, 2 peak (paper Methods).'
