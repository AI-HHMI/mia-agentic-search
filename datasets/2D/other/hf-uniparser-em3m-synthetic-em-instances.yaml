notes: 'Parquet only (107 files, 48 GB). SEM and TEM images; schema has no SEM value, so modality is other (SEM) + TEM. Paper: 5,091 real micrographs, 2,985,660 instances (4,128 train/963 test). But the released files are named synthesized_data_* (~28K rows), so they may be the generated images, not the real benchmark; unverified. Labels: empty in the first 100 rows of data_structured_descriptions; COCO-style polygons in data_image_captions rows seen, so coverage unknown. MIT license is from the dataset card. Pixel size not stated in card or paper text read. No split files in the listing.'
