notes: 'Parquet only (103 data files + README, 48 GB). SEM and TEM images; schema has no SEM value, so
  modality is other (SEM) + TEM. Paper: 5,091 real micrographs, ~3M instances; it also trains an SDXL
  generator for synthetic augmentation. The released files are named synthesized_data_* (28,122 rows),
  so they may be generated images, not the real set; unverified. MIT license is from the dataset card.
  Pixel size not stated in card or paper. No split files. enricher: label strings are numpy reprs; 8 of
  70 sampled image_captions rows hold polygons elided by numpy (''n, ..., n''), so those masks can''t
  be rebuilt; structured_descriptions labels empty in its first 100 rows. Confidence 0.5 (was 0.6).'
