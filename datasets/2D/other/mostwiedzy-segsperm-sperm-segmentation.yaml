notes: 'Published 2023 (landing page gives year only). Landing page counts (551 images, 432 train / 119 test, one rater, 23
  images with two extra raters split into head and tail) match the zip listing (train/images, train/GT1_full, test/images,
  test/GT1_full, test_small with GT1-3 full/head/tail; 1332 PNG files). Modality is not stated on the landing page or in the
  paper (images come from ICSI microscope videos, grayscale), so modality is other and pixel size is null. Sources checked:
  landing page, DOI metadata, paper abstract, zip file listing. enricher: annotations.source manual confirmed by README (masks
  drawn by hand in GIMP) and paper Section 5. test_small (23 images) repeats test images with masks from raters GT1-GT3. enricher:
  read the paper full text (open PDF on mostwiedzy.pl, was "not open access"): no modality or pixel size stated.'
