title: SegSperm - a dataset of sperm images for blurry and small object segmentation
short_name: Human sperm full-cell segmentation (ICSI)
description: 551 grayscale 512x512 microscopy images of full spermatozoa (head and tail) taken from Intracytoplasmic Sperm
  Injection videos, with manual binary ground-truth masks. 432 training images come from 40 videos and 119 test images from
  9 videos; 23 test images carry masks from three raters, split into head and tail parts.
