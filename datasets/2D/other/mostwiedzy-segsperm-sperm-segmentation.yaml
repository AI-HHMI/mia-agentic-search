  notes: 'Listing: zip central directory read by range requests (1333 members incl. README.txt, 30,745,612 B uncompressed);
    the dataset is this one zip, 28,704,325 B (Content-Range of the download). The /download URL 302-redirects to a presigned
    s3.storage.task.gda.pl URL (24 h expiry) that supports ranges but answers HEAD with 403. Sample (train/images/0.png +
    GT1_full/0.png, value ranges from this one sample only): raw 512x512 uint8, 39-173, mean 101, std 3.9; mask 512x512 uint8
    {0: 260566, 255: 1578}. Shapes of other images taken from the README/page (all 512x512). Head/tail and GT2/GT3 masks were
    listed, not sampled. Voxel size not found; checked: PNG headers (no calibration), dataset page, README.txt in the zip,
    paper full text (open PDF on mostwiedzy.pl; Section 5 says only that Invicta clinic ICSI videos were the source), no code
    repository linked. Modality (likely an ICSI microscope contrast method) is not named in any of these, so it stays other.'
