notes: 'Not a biological sample: optical micrographs of exfoliated 2D materials, included as a microscopy
  training dataset. Zip: {BN,Graphene,MoS2,WTe2,Ensemble_G_BN_WTe2_MoS2}/{train2019,val2019} jpgs + annotations/instances_*.json,
  five Mask R-CNN .h5 weights (1.28 GB, not data) and License.txt (CC BY 4.0). Classes per material: Mono,
  Few, Thick (layer-thickness categories; COCO categories). enricher: n_items 12935 -> 4398: Ensemble
  holds exactly the union of the four material folders (same file names), so 12,935 jpgs are 4,398 distinct
  images. enricher: 114 WTe2 and 2 Graphene file names appear in both train2019 and val2019. Paper (npj
  2D Mater. Appl., nature.com, read) states no pixel size; it notes images from different microscopes
  vary in magnification.'
