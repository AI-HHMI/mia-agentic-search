notes: 'Not a biological sample: optical micrographs of 2D materials, included as a microscopy training
  dataset. Zip listing (peek_archive): 12,935 jpg images in {BN,Graphene,MoS2,WTe2,Ensemble_G_BN_WTe2_MoS2}/{train2019,val2019}
  (BN 1465/333, Graphene 765/196, MoS2 1006/260, WTe2 3596/916, Ensemble 3531/867) plus annotations/instances_*.json,
  five Mask R-CNN .h5 weight files (1.28 GB) and License.txt (CC BY 4.0 for the dataset). A WTe2 val JSON
  member was read: COCO polygons and bbox, three category ids, contributor labelbox.com. Pixel size, magnification
  and meaning of the category ids are not stated on the figshare page; the paper (npj 2D Mater. Appl.
  2020) is not open access and Europe PMC/Crossref returned no abstract, so Methods could not be read.
  Figshare lists v2 (2020-03-06); the zip also contains model weights, so the data part is smaller than
  the 2.1 GB total.'
