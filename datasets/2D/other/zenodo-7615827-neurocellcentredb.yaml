notes: 'One zip (NeuroCellCentreDB.zip, listed with peek_archive): 293 TIFFs (~2 MB each) with 293 JSON
  label files under sequence_independent/data_and_cell_center_annotations/{train,validation,test}/<recording
  day>/<chip>/. Example JSON: {"scaling": 2, "cell_cores": [[x, y], ...]}. Imaging modality (brightfield
  / phase contrast / fluorescence), magnification and pixel size are not stated on the Zenodo page, the
  README in the archive or the baseline code repository, and no accompanying paper was found (the baseline
  repository README has TODO placeholders for the paper), so modality is other and voxel size null. Cell
  count 14,193 from the Zenodo description; the annotation procedure and annotators are not described.'
