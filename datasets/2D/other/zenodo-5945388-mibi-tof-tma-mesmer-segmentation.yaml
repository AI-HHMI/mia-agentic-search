title: Reproducible, high-dimensional imaging in archival human tissue by Multiplexed Ion Beam Imaging by Time-of-Flight (MIBI-TOF)
short_name: Human tissue MIBI-TOF cell segmentation (TMA)
description: Single-channel MIBI-TOF images (one TIFF per marker, ~16 targets and dsDNA) of fields from a
  tissue microarray of archival human FFPE tissue (21 cores of disease-free and tumour tissue), imaged on
  serial sections to test reproducibility, together with Mesmer cell-segmentation label images and overlays
  for each field. Segmentation labels are model output, not manual masks.
