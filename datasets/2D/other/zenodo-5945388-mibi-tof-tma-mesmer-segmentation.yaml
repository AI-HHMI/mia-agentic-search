  notes: 'Listing: tools/listing.py on the Zenodo record with --expand-zips: 3 zips, 678,212,811 B (file-listing, complete),
    2,960 zip members. Probed dsDNA, CD20, CD11c raw TIFFs, one label and one overlay TIFF (headers); sampled one pair (dsDNA
    292,756 B + label 56,368 B downloaded via zip ranges): raw 1024x1024 uint8, 0-40 (p99 14, 62% zeros); label int16, 0-1006,
    1007 IDs. Values are from one sample. normalization unknown: the paper describes background and noise removal but no intensity
    rescaling. Voxel size not found; checked: TIFF headers (no calibration), Zenodo API description, file_info.csv, paper
    full text (PMC10357968: Methods, Data availability), code repo angelolab/publications 2022-Liu_Bosse_etal_CIMAC (README,
    R scripts); the supplementary PDF could not be retrieved. No single archive for the whole dataset (3 zips); data.download_url
    stays the record page, direct zip URLs: zenodo.org/records/5945388/files/<name>.zip (all pass --download-check, range
    requests). Modality: MIBI-TOF (secondary ion mass spectrometry imaging) has no schema value and no EM/LM/X-ray family,
    so conversion cannot settle the modality family. Not listed as arrays (miao has raw/ and labels/ only): *_segmentation_overlay.tiff
    (1024x1024x3 uint8 RGB overlays for viewing, header probed) and DataTables.zip CSVs (per-FOV tables, Mesmer cell table
    with clusters; not read).'
