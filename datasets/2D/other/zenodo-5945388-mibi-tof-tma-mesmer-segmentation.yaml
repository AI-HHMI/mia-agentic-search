notes: 'Modality MIBI-TOF is mass-spectrometry imaging, no schema value fits, so other. Pixel size, FOV size and channel count
  are not stated on the Zenodo page or in the paper text read (PMC10357968). Labels are automatic output of the pre-trained
  Mesmer network (dsDNA nuclear, HLA/Na-K-ATPase membrane), hence source automatic; useful as pseudo-labels, not manual ground
  truth. n_items 165 = label images in SegmentationOutput.zip (330 TIFFs = labels + overlays); the paper text mentions 126
  images, the listing is used. SingleChannelMIBI.zip lists 2,624 single-marker TIFFs. Size is the sum of the three zips in
  the API record. enricher: channels 16 from the zip listing (16 marker TIFFs per field, HLA I and Na-K-ATPase share one)
  (was null); stains list completed from the listing.'
