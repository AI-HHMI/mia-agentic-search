notes: 'ZooScan is a flatbed scanner, not a microscope, so modality is other (as for the existing seanoe-55741
  ZooScanNet record; this is a different dataset: PELGAS 2004-2016 only, 127 groups, no train/val/test
  split). Zip listed with peek_archive: 1,153,507 JPEGs, 8.76 GB uncompressed. Pixel size 10.56 um (2400
  dpi) is the scan resolution stated in the ESSD paper; object crops keep it. Identification was random-forest/CNN
  assisted with every automatic label reviewed by experts; the authors note some errors may remain. Paper
  full text via the Copernicus page; Europe PMC has no full text. enricher: size_bytes = all four SEANOE
  files (was the zip only).'
