notes: 'Geology (mineral thin sections) rather than biology; included because it is annotated light microscopy.
  Zip (598 MB, 875 files) was listed with peek_archive and its README.md read: train/ and val/ folders
  each with image/ and mask/; masks are single-channel class IDs (0 background, 1-8 olivine, pyroxene,
  plagioclase, alkali feldspar, quartz, biotite, muscovite, hornblende); each section has 1 PPL + 7 XPL
  images (0 to 90 degrees) sharing one mask. Annotation was done with SAM plus review and correction by
  geologists, hence source mixed. Pixel size, microscope and magnification are not stated on the record
  or in the README. No paper is linked; the record references the Nanjing University Rock Thin Section
  Image Dataset (doi 10.21227/sa8g-wr95) and a ScienceDB record (10.11922/sciencedb.j00001.00097). enricher:
  inspected (sample); voxel size still not found.'
