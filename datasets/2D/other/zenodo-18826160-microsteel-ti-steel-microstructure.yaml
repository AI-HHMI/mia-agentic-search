notes: 'Data are the GitHub release "dataset" assets, linked as github.com/user-attachments/files/<id>/<name>.zip:
  images_class1.zip (29 JPEG), images_class2.zip (25: 15 Class_II + 10 Class_III), images_class3.zip (25 Class_III),
  labels.zip (82 labels + 82 coloured), splits.zip (train/val/test lists, per type c1-c3). enricher: only 79 images
  ship; labels Class_III_C104F2x10000_6, Class_II_C28F3x10000 and Class_II_C30F3x10000_2 have no image (n_items
  79, was 82). File names carry magnifications 5000x-25000x (mostly 10000x), so pixel size varies; none is stated
  (README, release, Zenodo, arXiv HTML). The paper''s figure caption says "optical micrograph", but the magnifications
  suggest SEM; modality stays other. License MIT on Zenodo, the GitHub repo and in the paper.'
