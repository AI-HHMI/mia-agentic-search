notes: 'The Zenodo record holds only a 1.3 kB zip (LICENSE and a short README pointing to the GitHub
  release); the data are the GitHub release assets images_class1.zip, images_class2.zip, images_class3.zip,
  labels.zip and splits.zip (a release README describes folders Images, Labels = integer masks, Coloured_labels
  = RGB labels). The asset zips could not be listed from this sandbox (HTTP 403), so image file format,
  total size and the split contents are unverified (formats set to other as a placeholder), and no single
  direct download link is recorded. Paper (arXiv 2606.19934, HTML): 82 images, types I/II/III with 29/17/36
  images; classes Alpha 0, TiB2 1, TiN 2, FeTiB 3, Fe2B 4; Alpha ~74% of pixels. Microscope type, magnification,
  pixel size and the split were not stated in the page text read (the arXiv PDF could not be parsed), so
  modality is other and voxel size null. License MIT stated on Zenodo, the GitHub repo and in the paper.'
