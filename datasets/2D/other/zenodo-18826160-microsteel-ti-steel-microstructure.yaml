title: MicroSteel - steel microstructure segmentation dataset
short_name: Steel microstructure segmentation (micrographs)
description: 82 steel micrographs (1280x959 and 960x703 px) annotated at the pixel level with 5 microconstituent
  classes (Alpha, TiB2, TiN, FeTiB, Fe2B), grouped into three image types by industrial processing route
  (29, 17 and 36 images). Released on GitHub (release assets images_class1-3.zip, labels.zip, splits.zip)
  and archived on Zenodo; labels were traced by three materials-science experts in Labelbox, with and
  without deep-learning pre-annotations.
