notes: 'Four files on Zenodo: ifcbdata-redsea-steinsdottir.zip (302.7 MB; peek_archive lists 31,543 PNG,
  one folder per class), a features CSV (12.6 MB), class_overview.csv and the raw IFCB archive ifcbdata-redsea-steinsdottir_rawdata.zip
  (4.4 GB); size_bytes is the sum of all four. Images were annotated by Steinsdottir, Frada and Avrahami,
  with diatom classes reviewed by Diana Sarno. Imaging flow cytometer images, so no voxel size is given
  and modality is other. No associated paper is listed on the record. enricher: raw zip lists 1,561 bins
  x .adc/.hdr/.roi; features CSV columns image, class, bin, roi_number + morphometrics; download_url is
  the labelled-images zip (direct, usable).'
