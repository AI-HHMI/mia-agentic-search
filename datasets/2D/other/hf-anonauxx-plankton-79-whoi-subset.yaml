notes: 'Zip listing: 41,860 PNG files plus two Thumbs.db files; folders are WHOI_custom/train
  and WHOI_custom/val with 79 class folders; 33,515 train and 8,345 val PNGs. The
  README describes the same sets as 33,517 train and 8,345 test images, so the README''s
  split names and the train count differ slightly from the files. The MIT license
  is the repository''s license tag on the card (the YAML header); the card text does
  not state it and the card is not from the WHOI-Plankton authors, who are cited as
  the source (arXiv 1510.00745, 3.4M images, 70 classes). Relation to WHOI-Plankton:
  derived subset; the full benchmark is in a separate proposal (HF mirror nf-whoi/whoi-plankton),
  so the same underlying images may appear in both. How labels were derived is not
  described (inherited from WHOI-Plankton). Pixel size not stated.'
