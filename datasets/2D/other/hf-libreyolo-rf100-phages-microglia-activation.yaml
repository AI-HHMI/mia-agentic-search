notes: 'LibreYOLO mirror (2026-01-20) of the Roboflow 100 microscopic subset, 2,849 files, 88.6 MB; splits 1155 / 164 / 103.
  Licence CC BY 4.0 from data.yaml and README.dataset.txt. Roboflow project phages, derived from the user Danish project
  microglia_rgb; classes activated and non-activated. One sample image (not a stated fact) shows brown-stained branched cells on
  a light background, but modality, stain, species, tissue, magnification and pixel size are not stated in the files read,
  so modality is other and organism is empty. Roboflow export release-640 (640 x 640 stretch resize, no augmentation). One
  label file read has 17 boxes; who drew the boxes and how is not stated. A restricted Zenodo microglia box record
  (10.5281/zenodo.14859882) was not compared.'
