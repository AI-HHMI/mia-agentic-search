notes: Paper Methods and Data availability read in full (Europe PMC). Species labels
  come from the folder names (five species, 160 images each, per paper), identified
  with voucher specimens and ITS sequencing; the peek_archive listing showed 800 .tif
  files and the first folder (G. triplex ANKFA 122), the other four folders were inferred
  from the paper. Images are single-channel SEM acquired at 50,000x on a QUANTA 400
  F FE-SEM; pixel size is not stated on the Zenodo page or in the paper. The paper
  describes a 70/15/15 stratified train/val/test split that the authors generated
  in code; the zip itself has no split folders. Zenodo creators were not retrieved.
  size_bytes is the zip (uncompressed about 2.3 GB). Classification only, no pixel-level
  annotations.
