title: Dataset for deep focus microscopy
short_name: Light-field to high-res fluorescence pairs
description: Paired raw light-field (macro-pixel) fluorescence images and their high-resolution extended-depth-of-field
  2D counterparts as 16-bit TIFFs, for training the DFnet deep focus network. Covers synthetic tubulins,
  living-cell membrane and mitochondria, zebrafish embryo membrane, and mouse liver neutrophils and vessels,
  imaged with a 63x/1.4 NA oil objective.
