notes: 'Zenodo API record, README, images.csv and the ZIP listing (675 PNG, 51.1 MB) were read. The README
  states the labels were assigned by the dataset creator while sorting, are provisional and not independently
  verified, and that the collection is not an expert-validated benchmark. Crops are not at a consistent
  scale, no pixel-size calibration exists, there are no object-level annotations and the full fields are
  not distributed. The record says only "light microscopy", so the modality is other. The organism list
  is empty because labels are mixed higher taxa and genera of unverified identity; see images.csv. No
  paper is cited on the record. Same author as zenodo-23580392 (Alternaria), a different dataset. enricher:
  channels 3 (RGB PNG, probed; was null).'
