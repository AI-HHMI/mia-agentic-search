notes: 'One 1.58 GB zip (peek_archive: 71,612 files, of which 71,606 PNG, 3 .db, 2 .txt and 1 inner 2.6
  MB .zip). The record is an updated version of SYKE-plankton_IFCB_2022 (b2share) and cites Kraft et al.
  2022 for example images of 50 classes, a paper that was not read; no DOI for it is given on the record.
  The class list and labelled set are described as continuing work. Imaging flow cytometer images, so
  no voxel size is given and modality is other. enricher: classlist.txt maps the 152 class folders to
  WoRMS AphiaIDs (organism left empty: many taxa per dataset); sample-metadata.txt lists Sample_ID, image
  count, location, lat/lon per IFCB sample; .db files are Windows Thumbs.db.'
