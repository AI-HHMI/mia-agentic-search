  notes: 'Exact listing of the Zenodo record (2 zips, 26 members, 31,134,597 bytes). All 8 images and 8 labels have identical
    member sizes (40,148 / 161,995 B), so all are 200x200. Probed 1_flat/2_flat image and label headers; sampled 1_flat: raw
    uint8 min 54 max 255 (saturated at 255, p50 97), label int32 0..34 with 34 distinct values, 81% background. Values are
    from one sample. Voxel size not found; checked: TIFF headers (label SCIFIO scale 1.0, no unit), Zenodo API record, paper
    full text (Methods, figure legends; only a 71.8 um field of view for a different confocal figure), GitHub repo ioritzsb/Cocci_on_SiNW.
    Its Colony_Morphology.ijm sets scale 199 px = 10 um for the full-size low-magnification SEM images it measures, but nothing
    says the 200x200 training patches share that scale, so it is not recorded.'
