notes: 'Modality is scanning electron microscopy (JEOL7001F FE-SEM at 10 kV per the paper); the schema has no plain SEM
  value, so it is listed as other. Dataset.zip holds Dataset/Images/{1-4_flat,5-8_sinw}.tif and Dataset/Labels/ with the same
  eight names. Record size is Dataset.zip plus Stardist2d_Model.zip (30.8 MB trained model); the images and labels alone are
  1.6 MB. Small dataset (8 image/label pairs, 200x200 px), just under the usual ~10-image bar. enricher: paper found (Nanomaterials
  2022, doi 10.3390/nano12040683): Methods say the StarDist 2D model was trained on 8 paired 200x200 patches; it does not
  say how the labels were made (annotations.source stays unknown) and states no pixel size. enricher: label encoding confirmed
  as int32 instance IDs from a sample.'
