description: 1,286,590 ZooCAM images of individual zooplankton, fish eggs and other objects from CUFES and WP2 net samples in
  the Bay of Biscay (2016-2020), sorted by operators in EcoTaxa into 93 taxa, with a 70/15/15 train/validation/test split and
  per-object features computed by the ZooCAM software and scikit-image.
