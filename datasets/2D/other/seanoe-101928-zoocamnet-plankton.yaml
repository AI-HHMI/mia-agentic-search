notes: 'Read the SEANOE landing page in full. The download is one tar (Content-Length 4,830,119,424); its first headers show
  ZooCamNet/imgs/<taxon>/<objid>.png, so images are PNG, but the tar was not fully listed. The page states that every identification
  was reviewed by at least one operator but a few mistakes may remain. The ESSD benchmark paper (10.5194/essd-18-945-2026)
  is listed on the page as a reference; only its abstract and Crossref record were available (not open access in Europe PMC),
  so Methods were not read. Pixel size is not stated on the page (measurements are in pixels). The ZooCAM is an in-flow imaging
  camera rather than a microscope, so modality is recorded as other. Distinct from the PELGAS ZooCAM dataset (tables only) and
  from ZooScanNet (a different instrument). enricher: channels 1 (grayscale PNG).'
