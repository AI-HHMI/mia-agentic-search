notes: 'Materials-science SEM, not biological; very few images (two stitched panoramas, but built from
  1,764 and 1,200 tiles). Files: stitched TIFF mosaics (Case1 ~810 MB, Case2 ~351 MB) with HDR metadata,
  individual-tile zips (Case2-PCB2.zip lists 1,200 BMP + 1,200 HDR; Case1-Panorama.zip could not be listed
  remotely), MATLAB scripts and .mat masks; the BMP tiles are noted here only. Pixel size: Case 1 527.25
  nm, Case 2 195.31 nm (paper and the .hdr files, PixelSizeX=527.25e-9 / 195.31e-9). Annotations are sparse:
  only a selection of unidirectional bundles was segmented by hand (8 in Case 1, two in Case 2); the fibre/resin
  binarisation is automatic. The .mat variable names come from the .m scripts; the arrays were not parsed.
  Modality has no matching enum value (backscatter SEM), hence other. size_bytes is the sum of the 10
  files listed on Zenodo. enricher: voxel size set to null (was 527.25 nm, Case 1 only) because the two
  cases differ. organisms: none (glass-fibre/epoxy material sample).'
