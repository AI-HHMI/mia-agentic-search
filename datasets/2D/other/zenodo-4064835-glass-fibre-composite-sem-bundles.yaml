notes: 'Materials-science SEM, not biological; very few images (two stitched panoramas, but built from 1,764 and 1,200 tiles). Files: stitched TIFF
  mosaics (Case1 ~810 MB, Case2 ~351 MB) with HDR metadata, individual-tile zips (Case2-PCB2.zip lists 1,200 BMP + 1,200 HDR; Case1-Panorama.zip
  could not be listed remotely), MATLAB scripts and .mat masks; the BMP tiles are noted here only. Pixel size from the paper: 527.25 nm (Case 1, stitched) and 195.31 nm (Case 2); the
  record uses the Case 1 value for x and y. Annotations are sparse: only a selection of unidirectional bundles was segmented by hand (8 in Case 1,
  two in Case 2); the fibre/resin binarisation is automatic. Mask encoding inside the .mat files was not checked, hence annotations_verified false.
  Modality has no matching enum value (backscatter SEM), hence other. size_bytes is the sum of the 10 files listed on Zenodo.'
