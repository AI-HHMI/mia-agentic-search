title: Local fibre volume fraction in non-crimp glass-fibre reinforced composites based on scanning electron microscopy
short_name: Glass-fibre composite SEM with bundle masks
description: Two large stitched backscatter SEM cross-section images (Case 1 with 1,764 tiles at 527 nm/px and Case 2 with 1,200 tiles at 195 nm/px)
  of non-crimp glass-fibre/epoxy composites, with the individual BMP micrographs and MATLAB masks of manually segmented
  unidirectional fibre bundles (8 in Case 1, parts of 2 in Case 2), offered as a benchmark for fibre segmentation.
