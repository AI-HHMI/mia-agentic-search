notes: 'Facts from the Zenodo record and its API file listing (annotation.zip 18 MB, chemical.zip 8 MB,
  mask.zip 0.8 MB, spectral.zip 33.0 GB, master xlsx, wavenumbers.npy);  This is infrared hyperspectral
  imaging (QCL microscope, 4x objective, 4.3 um pixels, 425 channels at 2 cm-1), not an optical or electron
  microscopy modality, so modality is other. The related paper (Analyst 2025) describes the instrument
  and a larger cohort (1281 cores, 183 patients); its Data availability says the data had not yet been
  released, so the 175-core subset and its annotations are described only on the Zenodo record. The paper
  says annotations were drawn by pathologists/annotators on H&E-guided regions; the Zenodo record does
  not state who annotated each core, so source manual is from the paper wording and not verified for this
  release. Annotation is sparse. Files are raw, unprocessed spectra in HDF5. enricher: listed all zips
  (175 cores each), sampled one core; annotations verified; formats + png.'
technical:
  method: sample
  size_source: file-listing
  layout:
