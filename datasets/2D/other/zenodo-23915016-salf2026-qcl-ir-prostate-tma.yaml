short_name: Prostate TMA tissue types (QCL infrared)
description: 175 quantum cascade laser infrared (QCL-IR) hyperspectral images of prostate tissue microarray
  cores (82 patients, 18 slides), each 360 x 360 pixels with 425 wavenumber channels, with sparse eight-class
  tissue-type annotations (normal/cancerous epithelium, normal/cancer-associated stroma, corpora amylacea,
  blood, immune infiltration, necrotic debris), tissue masks and core-level cancer/benign and Gleason
  labels.
