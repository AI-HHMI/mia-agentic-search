    - https://zenodo.org/records/23915016/files/spectral.zip::spectral/s03_c002.h5
    - https://zenodo.org/records/23915016/files/annotation.zip::annotation/s03_c002.png
    - https://zenodo.org/records/23915016/files/mask.zip::mask/s03_c002.png
    size_bytes: 197283635
    description: 'Core s03_c002: hyperspectral HDF5 (197 MB compressed in the zip), its annotation overlay
      and tissue mask.'
  arrays:
  - role: raw
    path_pattern: spectral/*.h5 (spectra)
