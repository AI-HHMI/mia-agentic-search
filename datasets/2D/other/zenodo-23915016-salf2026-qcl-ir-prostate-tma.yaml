    format: png
    axes: yxs
    shape:
    - 360
    - 360
    - 3
    shape_varies: false
    dtype: uint8
    compression: deflate
    encoding: rgb-colors
    classes:
    - id: 0
      name: Normal Epithelium [0,255,0]
    - id: 1
      name: Normal Stroma [128,0,128]
    - id: 2
      name: Cancerous Epithelium [255,0,255]
    - id: 3
      name: Cancer-associated Stroma [0,0,255]
    - id: 4
      name: Corpora Amylacea [255,165,0]
    - id: 5
      name: Blood [255,0,0]
    - id: 6
      name: Immune Infiltration [255,255,0]
    - id: 7
      name: Necrotic Debris with Immune Infiltration [127,0,0]
    alignment: same-grid
    alignment_notes: 'annotation/<stem>.png pairs with spectral/<stem>.h5. Sparse class colours painted
      over the grey chemical image: pixels with R=G=B are unannotated; class = exact RGB match from the
      record table.'
  - role: label
    path_pattern: mask/*.png
    format: png
    axes: yx
    shape:
