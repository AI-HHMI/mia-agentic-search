      \    spectral/s<slide>_c<core>.h5   175 files, 37.8 GB unzipped (datasets spectra, mask)\n  annotation.zip\
      \  18.2 MB\n    annotation/s<slide>_c<core>.png   175 RGB class-colour overlays\n  chemical.zip\
      \  7.9 MB\n    chemical/s<slide>_c<core>.png   175 Amide I images\n  mask.zip  0.8 MB\n    mask/s<slide>_c<core>.png\
      \   175 binary tissue masks\n  master_SALFORD_QCL2026.xlsx   core metadata, T/N + Gleason labels,\
      \ file paths\n  wavenumbers.npy   425 wavenumbers\n  _sample_salf.png   preview"
    n_files: 7
    listing_complete: true
  sample:
