  - role: label
    path_pattern: spectral/*.h5 (mask)
    format: hdf5
    axes: yx
    shape:
    - 360
    - 360
    shape_varies: false
    dtype: float32
    compression: other
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 1
      name: tissue
    alignment: same-grid
    alignment_notes: HDF5 dataset "mask" next to "spectra" in each file, values {0, 1}, LZF.
  - role: label
