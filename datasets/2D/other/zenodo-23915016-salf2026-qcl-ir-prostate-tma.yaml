  notes: 'Listed all 7 Zenodo files and the 700 members of the 4 zips (complete, exact sizes; spectral
    members are deflated: 37.8 GB unzipped). spectral.zip members could not be header-probed (deflated),
    so I downloaded s03_c002.h5 (197,171,652 B) twice (first try with sample.py failed) and read it with
    h5py: spectra 360x360x425 float32 LZF [-0.191, 0.982], mask 360x360 float32 {0,1}. normalization none
    because the record says the spectra are raw and unprocessed. Sampled annotation/s03_c002.png (109,592
    B, 360x360x3; 126,735 grey px, 2,340 Normal Stroma, 525 Normal Epithelium px) and mask/s03_c002.png
    (2,391 B, {0,255}). Value ranges from one sample. Voxel size 4.3 um from the Zenodo record. Download:
    four direct zips, no single archive, so data.download_url is the record page; spectral.zip is 33 GB.
    chemical/*.png (derived Amide I images) left out of arrays.'
