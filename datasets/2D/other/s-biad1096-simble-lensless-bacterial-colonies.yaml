notes: 'Lensless (lens-free, computational) wide-field imaging of whole agar plates, not conventional
  microscopy; modality other. 252 images (SIMBLE/images, 16-bit grey PNG, 4768 x 3172) and 252 same-named
  binary masks (SIMBLE/masks, 8-bit). Species and specimen type are in the file names; all 5 organisms
  are mixed in the same two folders, one species per image (organisms: per file name, e.g. *_K_pneumoniae_*).
  enricher: voxel size set to null (was 3.76 um): paper and BioStudies state 3.76 um (3.8 um) pitch for
  the 9520 x 6328 sensor, but the released files are 4768 x 3172, so they are not at sensor resolution
  and no source states their pixel size. enricher: annotations.source proofread (BioStudies: Otsu thresholding
  + small manual correction). No fixed split released. No single archive: per-file https downloads.'
