  notes: 'Sizes: images.json and masks.json (the BioImage Archive file lists) give exact per-file sizes:
    images 5,728,036,091 B, masks 23,714,825 B, plus 4 list files 107,255 B = 5,751,858,171 B; listing.py
    read only the rounded HTTP index, hence page-stated. Probe + sample of one pair (19,764,269 B): raw
    3172x4768 uint16 grey PNG, range [2169,16382] (one sample), max just under 14-bit, so normalization
    none is inferred (raw sensor range, not clipped); mask 3172x4768 uint8 {0,255}. Voxel size not found
    for the released files; checked: PNG headers (no calibration), BioStudies REMBI (3.8 um sensor pitch,
    acquisition parameters null), paper Methods (3.76 um pitch, 9520x6328 sensor; patches of 1000 px =
    3.76 mm, i.e. 6x9 patches per image, larger than the released 4768x3172). Released files appear downsampled
    or demosaiced; pixel size not stated. Dimensionality 2D: not covered by the miao layout yet.'
