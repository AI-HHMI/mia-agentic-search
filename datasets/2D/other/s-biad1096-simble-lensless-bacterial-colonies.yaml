notes: 'Lensless (lens-free, computational) wide-field imaging of whole agar plates rather than conventional
  microscopy; modality is therefore ''other''. File listing (images.tsv, masks.tsv, FTP Files/SIMBLE/{images,masks}):
  252 images and 252 same-named masks; the one image probed is 4768 x 3172, 16-bit PNG (~22 MB), its mask
  8-bit. Species and specimen type are encoded in the file names. Pixel size 3.76 um is the paper''s stated
  pixel size for the system. Paper: all 252 images plus binary colony presence masks are released; how
  the masks were produced is not stated in the sections read. The paper''s identification task uses patch-wise
  species classification with cross-validation, no fixed split is released. Total size and download archive
  not determined (per-file FTP only).'
