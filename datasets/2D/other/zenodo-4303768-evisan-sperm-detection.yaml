  are "partially annotated". Imaging contrast mode is not stated (only Olympus CX31 at 200X/600X), so
  modality is other. Organism is Homo sapiens inferred from "donors" and the stated human assisted-reproduction
  use; not stated outright. Pixel size not stated. No paper could be found in Europe PMC, Crossref or
  web search, so none is listed. Videos are .wmv, not counted in n_items.'
