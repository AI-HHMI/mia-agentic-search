short_name: EVISAN sperm detection and tracking (microscopy)
description: 6,000 microscope images of motile sperm from different donors (3,000 at 200X and 3,000 at
  600X, Olympus CX31), each with a Pascal VOC-style XML file of per-sperm bounding boxes, plus two uncoupled
  test videos. Every 1,000 consecutive images form a continuous sequence usable as a tracking video.
