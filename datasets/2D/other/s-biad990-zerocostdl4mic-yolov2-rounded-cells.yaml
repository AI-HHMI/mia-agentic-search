  notes: 'BioStudies FTP timed out; HTTP index lists 72 files, about 23.6 MB (rounded sizes, so estimated).
    The original Zenodo record 3941908 has one 23,114,322 B zip and license cc-by-4.0. Probed and sampled
    one test PNG: greyscale uint8 1040x1388, range 38-255. Read all 3 test XMLs (Pascal VOC): per image
    35-37 Elongated, 2-17 Rounded, 0-7 Interphase, 1 Dividing, 2-3 Debris boxes, so the boxes carry 5
    classes. The XML declares depth 3, but the PNG is single-channel. Training XMLs were not read.'
