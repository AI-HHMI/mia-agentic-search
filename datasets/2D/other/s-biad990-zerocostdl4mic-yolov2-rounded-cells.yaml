notes: 'The BioStudies record has description UNKNOWN, no license, and links to Zenodo 3941908 as the
  original uncurated submission. file_list.tsv lists 33 annotation files (30 train, 3 test) with matching
  PNG images in Training_Images/ and Test_Images/; one sample XML (1388x1040, 3 channels, bndbox) was
  read. The microscope, contrast mode, organism, pixel size and total size are not stated anywhere I looked,
  so modality is other. The study metadata cites the ZeroCostDL4Mic paper only by a Zenodo DOI and says
  object detection; that paper was not read. Whether the annotations cover every cell in each image is
  not stated. enricher: license CC-BY-4.0 from the original Zenodo record 3941908 linked by BioStudies
  (was unknown); 5 classes, not only Rounded; channels 3 -> 1 (greyscale PNG; the XML says depth 3).'
