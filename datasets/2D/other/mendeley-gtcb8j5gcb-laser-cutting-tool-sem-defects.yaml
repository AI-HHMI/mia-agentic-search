notes: 'Images: 49 TIFF (16-bit) + 29 JPEG (8-bit) in one zip; names encode laser parameters (e.g. L0.030_F100_V500_D0.02).
  Labels: one MATLAB v5 labeling session, SEM Labeling Session.mat (96,812 B), not readable with the allowed tools, so label
  geometry is unverified. enricher: paper full text (Loughborough repository PDF) read: Hitachi TM3030 backscatter SEM at
  x1000, field of view 225 x 175 um; 7 defect classes (porosity, splatter, cracks, balling, spherical pores, voids, dissociation)
  + background, labelled in MATLAB for an AlexNet R-CNN; the paper labelled 324 SEM images (1303 defects), this deposit holds
  78 example images, so coverage is partial (was unknown). SEM is not a schema modality value, so modality is other.'
