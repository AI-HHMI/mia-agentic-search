notes: 'Image zip listing (peek_archive): 78 files (about 50 TIFF, rest JPEG), file names encode laser parameters (e.g. L0.030_F100_V500_D0.02).
  Labels come as one MATLAB file, SEM Labeling Session.mat (96 kB); it was not opened, so whether labels are boxes or masks
  and the exact defect classes are unverified. The page and the paper abstract (via search) mention defect types such as porosity,
  splatter, cracks, balling, voids; an AlexNet R-CNN detector was trained on these labels. Paper full text is paywalled (Europe
  PMC and Crossref have no full text; publisher page returned 403), so SEM instrument, magnification and pixel size are not
  stated on the dataset page and could not be checked in the Methods. Only 78 images, a small dataset. SEM is not a schema
  modality value, so modality is other.'
