title: 'MedPlanktonSet - A dataset of labeled IFCB images from the Mediterranean Sea'
short_name: MedPlanktonSet IFCB plankton images (Naples)
description: 77,271 taxonomically annotated Imaging FlowCytobot (IFCB) plankton images (PNG) from six stations in the Gulf of Naples, 2022-2025, sorted into 139 categories (18 taxonomic classes; phytoplankton and zooplankton), each annotated by one person and verified by at least two taxonomic experts. Includes per-image IFCB features (V2 with 237 features and V4 with 28 features) and a CSV with image name, category and station.
