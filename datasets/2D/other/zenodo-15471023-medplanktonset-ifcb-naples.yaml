notes: 'IFCB_images.zip (1.5 GB, 77,271 PNG listed with peek_archive plus one stray .rhistory file) is the image set; other files are FeaturesV2.zip (192 MB), FeaturesV4.zip (21 MB) and list_of_images.csv (5 MB), about 1.73 GB in total. Pixel size is from the paper: recommended factor 2.77 pixels per micron, so about 361 nm/pixel. The IFCB is an imaging flow cytometer (imaging modality not one of the standard light microscopy types, hence other). The Zenodo record has no text description; details come from the Scientific Data descriptor (CC BY 4.0). Authors are entered as given in the Zenodo record and the paper (abbreviated names). No train/test split is provided. enricher: size_bytes is the exact sum of the 4 Zenodo API file sizes (was rounded).'
