title: Simultaneous segmentation of bacteria and flagella in large-area AFM images using synthetic data
short_name: Bacteria and flagella AFM synthetic training set
description: Code, weights and data accompanying a manuscript on segmenting bacterial cell bodies and flagella in
  512 x 512 atomic force microscopy (AFM) height fields. Includes 2,520 synthetic (SimuScan) AFM training images
  with flagellum targets, hand-annotated cell-body and flagella masks for a few experimental fields, and model predictions
  for 243 experimental fields.
