notes: 'AFM height maps, modality other. Experimental AFM height data are NOT included (README). Usable for training:
  2,520 synthetic SimuScan images (256x256 float32 .npy, height in um) with flagellum centre-line targets (PNG);
  the 9 hand-annotated masks belong to experimental fields whose heights are not shipped. formats is other because
  the images are .npy (PNG holds only targets, masks and display renders). Pixel size not stated. enricher: image
  size 256x256 from probe (description says 512x512: true only for annotations/predictions). enricher: annotation
  type skeleton added (datasets.json: target is the one-pixel centre line). enricher: size 1,326,821,841 B from
  Zenodo file listing (the Zenodo page 5.3 GB was wrong). annotations.source mixed: sample/*_target.png synthetic
  (automatic), annotations/ manual.'
