notes: 'AFM (atomic force microscopy) height maps, not optical or electron micrographs; modality recorded as
  other. The raw experimental AFM height data are NOT included (README: "AFM height data are not included").
  What is usable for training: 2,520 synthetic images (120 per recipe and substrate condition, height in
  micrometres as .npy) with flagellum targets, plus 6 hand-annotated masks (3 fields flagella, 3 fields
  cell bodies). Predictions and display images for 243 experimental fields are model outputs, not
  ground truth. Zip listing: 6,481 files, 1,324.8 MB uncompressed (3,581 png, 2,553 npy, code and weights);
  the Zenodo page states 5.3 GB total, which does not match the 1.3 GB archive. formats is other because
  the data arrays are .npy. Pixel size not stated on the record or README. No related paper cited on the record
  (manuscript with the same title), so none was read. Checked: Zenodo record, zip listing, README.'
