description: Experimental scanning tunneling microscopy images of the hydrogen-terminated Si(001) surface released with an arXiv paper on generative restoration and super-resolution. Pristine images (pre-split into training, validation and test folders) are the source for the paper's physics-informed synthetic degradation pipeline; 66 real, experimentally degraded images and 8 further pristine images serve for evaluation on real artefacts. Provided as .npy arrays.
