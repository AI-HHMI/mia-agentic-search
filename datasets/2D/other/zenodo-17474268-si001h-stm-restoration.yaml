notes: 'Zenodo page, README, zip listing (174 .npy files) and the arXiv paper read. Not paired data: pristine images are the ground-truth source for synthetic degradation in the paper; the real degraded images are evaluation-only. Material-science STM, not a biological sample. Pixel size is derived, not stated: the paper gives 512x512 px over 100 nm x 100 nm (about 0.195 nm per pixel). Counts differ between sources: the README lists 34 pristine training-source images (28/3/3) plus 8 pristine and 66 degraded evaluation images, the paper states 54 pristine (36/12/6); the zip holds 174 files. Format is NumPy .npy (no matching schema value, so other).'
