notes: 'Zenodo page, README, zip listing (174 .npy files) and the arXiv paper read. Not paired data: pristine images are the
  ground-truth source for synthetic degradation in the paper; the real degraded images are evaluation-only. Material-science
  STM, not a biological sample. Counts differ between sources: the README lists 34 pristine training-source images (28/3/3)
  plus 8 pristine and 66 degraded evaluation images, the paper states 54 pristine (36/12/6); the zip holds 174 files. Format
  is NumPy .npy (no matching schema value, so other). enricher: voxel size set to null (was 0.195 nm): the paper gives 100
  nm per 512 px only for 512x512 images, but the release also holds 1024x1024 and 475x1024 arrays with no stated extent. degraded/real_noisy/
  duplicates degraded/ (same 66 names and sizes): 108 distinct images.'
