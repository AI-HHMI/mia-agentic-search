description: 'Seven curated materials-microstructure micrograph segmentation datasets (Aachen-Heerlen,
  EBC, EMPS, Grain, MetalDAM, Super, UHCS) re-organised into one benchmark: 3,625 images with 3,625 pixel-level
  mask files (163,901 mask instances), each set split into train/val/test (2,706 / 185 / 734 pairs). Derived
  from previously published sources.'
