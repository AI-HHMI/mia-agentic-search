  notes: 'Listed all 7 Zenodo zips + README + csv (tools/listing.py --expand-zips): 7,252 files, 1,705,824,981
    B, exact sizes; 3,625 image/mask pairs as README and dataset_distribution.csv state. Probed one image
    + mask per set and format (17 headers); sampled 7 pairs (one per set, ~3.6 MB). value_range values
    are from one sampled file per array. Masks pair with images by file name; masks are always single-channel
    uint8. Several raw sets are RGB files whose 3 samples are identical (grey as RGB). Label encodings:
    binary {0,1} in the Aachen-Heerlen, EMPS, Grain, UHCS samples; 3-5 values in EBC, Super, MetalDAM
    (semantic, class names not given in the record or README). Voxel size not found; checked: TIFF/PNG/JPEG
    headers (no calibration), Zenodo API record, README, csv; no paper is cited. Magnification varies
    per file (Super file names 15kx/45kx/50kx), so no single voxel size exists. Organism: not applicable
    (materials, not biological). Modality family (EM vs light) is not stated per set in the record. Not
    convertible by the miao layout yet: 2D.'
