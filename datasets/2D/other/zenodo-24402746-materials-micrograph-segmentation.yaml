notes: 'Record, README and the file listing of all seven zips (peek_archive) were read: train/val/test
  folders with images/ and masks/ per set; images are PNG, JPEG and TIFF. The record cites an associated
  manuscript but gives no title or DOI and lists no related identifiers, so no paper could be read (publications
  left empty). Pixel size, imaging instrument and annotation source are not stated in the record for the
  aggregate: the files are re-organised from public sources (Grain, EMPS, Aachen-Heerlen, UHCS, MetalDAM,
  Super/EBC) with annotation review and supplementary annotation by the depositor. Modality stays other:
  materials SEM and optical micrographs, not biological. Several component sets may exist as their own
  datasets elsewhere; this is the combined redistribution. enricher: size 1,705,824,981 B from the full
  file listing (was 1,705,823,892, without README/csv); download_url set to the record page (seven per-subset
  zips, no single archive).'
