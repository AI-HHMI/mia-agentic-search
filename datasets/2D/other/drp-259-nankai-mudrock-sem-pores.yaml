notes: 'Modality is scanning electron microscopy (SEM; the related project says FEI NovaNano SEM 430),
  which has no schema value, hence other. License ODC-BY 1.0 is the Digital Rocks Portal metadata field.
  Zip: 49 original TIFFs, 98 PNGs (overlays and separated phases), thumbnails. Segmentation is described
  as filtering plus user-guided segmentation (from the related thesis abstract in the metadata), so source
  is mixed. Pixel size is not given (scale bars on the images, magnification 15KX or 40KX), so voxel_size_nm
  is null. The related thesis (UT Austin, doi 10.26153/tsw/14843) was not read; only its abstract in the
  record metadata. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory
  and metadata JSON were fetched. enricher: size exact from zip listing; each of the 49 TIFFs has a _crop_newSeg1.png
  overlay (one named _crop_newSeg.png) and a _crop_siltpores.png phase map.'
