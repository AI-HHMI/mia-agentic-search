notes: 'Modality is scanning electron microscopy (SEM; the related project says FEI NovaNano SEM 430), which has no schema value, hence other. License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Zip listing (peek_archive): 49 original TIFFs, 98 PNGs (segmented overlays and separated phases), thumbnails; 284 MB uncompressed. The description says each depth set has 1 original, 1 overlay and 1 separated-phase image, which does not add up to 49 originals, so the segmented counts per image are not verified. Segmentation is described as filtering plus user-guided segmentation (from the related thesis abstract in the metadata), so source is mixed. Pixel size is not given (scale bars on the images, magnification 15KX or 40KX), so voxel_size_nm is null. The related thesis (UT Austin, doi 10.26153/tsw/14843) was not read; only its abstract in the record metadata. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory and metadata JSON were fetched.'
