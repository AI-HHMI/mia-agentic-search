notes: 'Metallography (grain structure of a metal), not biological; included because it is optical/electron-style microscopy imagery
  with expert dense labels. Zip listing (peek_archive): input_image 320 PNG, expert_label 320 PNG, expert_inv_label 320 PNG, expert_inv_label_thin
