notes: 'enricher: the tar is a plain tar (not gzip); its first 65 MB were streamed: Planktoscope_reference/ with taxa.csv.gz, inventory.tsv, map.png, features_native.csv.gz and imgs/<taxon>/<object>.jpg, so formats is jpeg (was other) and annotations are verified. Object count (169,149) and 256 classes are from the SEANOE description. Objects were classified in EcoTaxa (project 15535) and each identification reviewed by at least one human. Pixel size is not stated for this dataset; the PlanktoScope paper gives 0.9 um/px for the platform but with inconsistent figures elsewhere (abstract 2.8 um/px), so it is left null. Imaging modality is not stated for this dataset (hence other). Also part of the planktonzilla-17M aggregate on Hugging Face.'
