notes: 'The tar (1.795 GB, reachable with range requests) is gzip-compressed inside so its member list could not be read without downloading it; file names, the 169,149 object count (the page text also says more than 180k identifications) and the 256 classes come from the SEANOE description, so annotations_verified is false. The image format inside the tar is not stated (formats is therefore other). Objects were classified in EcoTaxa (project 15535) and each identification reviewed by at least one human. Pixel size is not stated for this dataset; the PlanktoScope paper gives 0.9 um/px for the platform but with inconsistent figures elsewhere (abstract 2.8 um/px), so it is left null. Imaging modality is not stated for this dataset (hence other). Also part of the planktonzilla-17M aggregate on Hugging Face.'
