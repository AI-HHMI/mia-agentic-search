description: 169,149 segmented single-object plankton images (20-300 um) captured with the PlanktoScope imaging platform in several oceanic regions (2022-2025), classified into 256 taxa in EcoTaxa with every identification reviewed by at least one human operator. Delivered as one tar with object images in taxon subdirectories, taxa.csv.gz (class and lineage per object), 33 morphological and colour features per object, a taxonomy inventory and a sampling map.
