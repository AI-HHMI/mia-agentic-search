notes: 'Dataset.zip (247 MB) listed with peek_archive and its README read: Full_size_image_annotation/IMG
  (130 TIFF) + IMG_ANN (130 JSON), img_patch (508 PNG) + img_mask (508 PNG); n_items
  counts the 130 full-size images; size_bytes is Dataset.zip only. The record also
  has Synthetic_dataset.zip (1.9 GB, synthetic images, not described here). The README
  names the paper "Nanoparticle Quantification in Light Microscopy using Learning
  and Synthetic Particle Images" but no DOI or full text was found (Europe PMC and
  a web search found nothing), so no publication is listed. The imaging modality,
  microscope, pixel size, particle material and annotator are not stated in the README
  or the Zenodo page, so modality is other. README says annotations are human dot
  annotations of particle centres.'
