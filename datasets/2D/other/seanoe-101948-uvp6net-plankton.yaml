notes: 'Read the SEANOE page in full; ranged-read the start of UVP6Net_imgs.tar (gzip tar of imgs/<taxon>/<objid>.png). Data
  is split over three tars (119451/119452/119453.tar under https://www.seanoe.org/data/00908/101948/data/), so download_url
