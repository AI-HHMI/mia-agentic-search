short_name: UVP6Net plankton images (UVP6)
description: 634,459 object images of plankton and particles captured with the Underwater Vision Profiler 6 (UVP6) in contrasted
  oceanic regions (2019-2022), classified by operators in EcoTaxa into 110 classes, with a 70/15/15 train/validation/test
  split, per-object features, and a 595,595-object subset coarsened to 20 classes for the classifier embedded on NKE CTS5
  floats.
