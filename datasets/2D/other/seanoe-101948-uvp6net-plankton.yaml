notes: Read the SEANOE page in full; ranged-read the start of UVP6Net_imgs.tar (gzip tar of imgs/<taxon>/<objid>.png). Data
  is split over three tars (119451/119452/119453.tar under https://www.seanoe.org/data/00908/101948/data/), so download_url
  is null and total size is not summed. Pixel size 73 um is the UVP6 pixel size from the sensor paper (full text read), object-space;
  the dataset page does not state it. UVP6 is an in-situ imaging sensor, so modality is other. Identifications were reviewed
  by one operator; a few errors may remain. ESSD benchmark paper only partly read. Distinct from ZooCAMNet and ZooScanNet.
