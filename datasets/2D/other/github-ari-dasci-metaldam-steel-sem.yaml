notes: >-
  Materials-science SEM (no organism). The repository README and release state no licence (no LICENSE file); the Voxel51 Hugging Face re-host (Voxel51/OD_MetalDAM) declares MIT,
  which is not the rights holders' statement, so spdx is unknown. No DOI or paper (README: a publication will be added). Pixel size not stated (magnification 5,000x-15,000x per the HF card;
  1280x895 / 1024x703 px after cropping the info bar). The README says most precipitates were left unannotated (class frequency 0.24%). Release 1.0 also holds MetalDAM_metadata.sql and
  Additive_unlabeled_publish.zip (164 unlabeled images, not opened). Labeled zip listed with peek_archive: 42 jpg images, 84 png label files in labels/ and coloured_labels/, 3 txt split files (train, val, test).
