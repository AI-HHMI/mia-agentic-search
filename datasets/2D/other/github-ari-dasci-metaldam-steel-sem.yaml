  per image (5,000x/10,000x/15,000x per MetalDAM_metadata.sql), which gives only the scale-bar length
  in um, not px. README: most precipitates were left unannotated (0.24%). Release 1.0 also holds Additive_unlabeled_publish.zip
  (164 unlabeled images, 191.9 MB, not opened). enricher: channels 1 (README: grayscale SEM; JPEGs stored
  as RGB); publication added from Crossref (was none).'
