notes: 'Zip listing (166.7 MB compressed): 48 NPZ files plus channels.txt and labels_strings.txt, i.e.
  16 images (data/images), 16 cell masks (cells/) and 16 per-cell label files (cells2labels/), matching
  the 16 labeled images in the paper (its 33 unlabeled images are not in the download). Labels: FlowSOM,
  pixel clustering, gating and manual correction (116,808 cells, 14 cell types, per the paper). Pixel
  size 0.5 um is the paper''s stated resolution for this dataset, not stated on the record. Modality is
  MIBI (multiplexed ion beam imaging), recorded as other. NPZ internals opened by the enricher (see technical). Checked: dataset
  page and API, zip listing, paper, CellSighter README. enricher: channels 25 (image array and channels.txt);
  size 166,672,993 B = the zip (was the uncompressed 186.1 MB).'
