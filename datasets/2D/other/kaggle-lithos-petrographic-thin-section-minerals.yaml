notes: 'The Kaggle page only returned its title to the fetch tool (JS-rendered): no file listing, size or file formats
  were readable, so formats is other (unknown) and annotation files were not seen in a listing. Facts come from
  the paper HTML (arXiv v1) and the GitHub README. Kaggle requires an account to download (registration). License
  CC BY-NC-SA 4.0 is stated in the paper as the dataset licence released upon acceptance (paper accepted at NeurIPS
  2025 D&B per README); the GitHub repo code is MIT. Imaging is polarized-light optical microscopy, which has
  no schema modality, hence other. Labels are point annotations with mineral class per grain; the benchmark uses
  2-fold cross-validation (fold CSVs) rather than train/test splits. Paper via arXiv; not found in Europe PMC.'
