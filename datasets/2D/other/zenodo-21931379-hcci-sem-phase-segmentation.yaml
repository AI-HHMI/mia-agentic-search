id: zenodo-21931379-hcci-sem-phase-segmentation
title: Open-access SEM dataset and robustness benchmark for ML microstructure segmentation of high-chromium cast iron
short_name: High-chromium cast iron phase segmentation (SEM)
description: 774 registered SEM micrographs of high-chromium cast iron (26 wt.% Cr) acquired across four SEM instruments, three detectors (SE, BSE, InLens), three accelerating voltages, two etchants, three heat-treatment states and two image scales. For 12 regions of interest the same microstructure area was imaged under many acquisition conditions and registered, so 12 manually corrected phase masks propagate across the full image set (one mask file per image). Up to seven phase classes (austenite, fresh martensite, retained austenite, eutectic carbides, tempered martensite, secondary carbides, combined tempered martensite + secondary carbides) support binary, four-class and seven-class segmentation; per-image acquisition metadata is provided in a spreadsheet.
