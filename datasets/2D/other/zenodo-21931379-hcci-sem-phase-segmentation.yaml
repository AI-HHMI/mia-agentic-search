notes: 'Materials-science SEM (not biological), so modality is "other" (scanning electron microscopy of metallographic sections). Zip listing (peek_archive) shows 774 Images/<n>.png and 774 Masks/<n>_Mask.png plus Classes.txt and Metadata_All_Samples.xlsx; the record text says 777 micrographs, the zip lists 774 (3 fewer than stated). Masks were created for 12 registered regions of interest and propagated to all images of each stack (WEKA trainable segmentation + expert correction, per the record). Pixel size varies per image and is stored in the metadata spreadsheet, not stated on the record page, so voxel_size_nm is null. The accompanying paper is not yet published ("Journal / DOI - to be added" on the record), so publications is empty; Classes.txt could not be read (Zenodo range requests timed out). No train/val/test split is provided.'
