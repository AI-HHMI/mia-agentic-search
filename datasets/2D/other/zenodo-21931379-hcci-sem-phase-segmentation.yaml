notes: 'Materials-science SEM (not biological), so modality is "other" (modality family: EM; scanning electron microscopy
  of metallographic sections, SE/BSE/InLens) and organism is empty. Zip has 774 Images/<n>.png and 774 Masks/<n>_Mask.png
  (the record text says 777; Metadata_All_Samples.xlsx has 777 rows). Masks: 12 registered ROI masks (WEKA + expert correction)
  propagated to every image of their stack. Paper not yet published ("to be added" on the record). No split. enricher: voxel
  size stays null: pixel size varies per image (Metadata_All_Samples.xlsx "Pixel Size" column, in m: ≥20 distinct values, 13.3-104 nm for 770 of 777 rows, e.g. 67.4
  nm x107 images, 104.2 nm x107, 13.5 nm x105). enricher: Classes.txt read: 7 RGB-coded phase classes (technical.arrays[1].classes).'
