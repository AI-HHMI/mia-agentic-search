notes: 'No license in the Zenodo API record (no license or rights field) or on the page, so license is unknown.
  Zip lists images/ (detection and classification, each center_layer / full_flatted / three_layers x train/val/test,
  JPEG) and labels/ (YOLO txt). Magnification and pixel size are not stated. Annotator not stated. Related to zenodo-6390798-human-embryo-time-lapse-phases
  (original time-lapse videos with phase labels); this adds zygote object boxes on single images. No paper listed.
  enricher: n_items 62,001 image files from the full zip listing (8,668 detection + 11,999 classification frames,
  3 variants each; was null); channels 1 (grey; three_layers packs 3 focal planes as RGB; was null). enricher: modality
  is light microscopy, Hoffman modulation contrast (upstream paper Gomez et al. 2022, doi 10.1016/j.dib.2022.108258),
  not in the modality list, so other.'
