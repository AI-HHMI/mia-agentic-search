schema_version: '1.2'
id: zenodo-15059360-human-zygote-artefact-detection
title: Labeling Human Embryo Time-Lapse Videos - zygote structure detection and classification dataset
short_name: Human zygote structure boxes (time-lapse)
description: Time-lapse microscopy images of human embryos restricted to the zygote stage, with YOLO-format bounding
  boxes for pronuclei, cytoplasmic granules, polar bodies and vacuoles, plus a zygote vs non-zygote classification
  set. Provided in three image variants (centre focal layer, three-layer RGB, focus-stacked flattened) with train/val/test
  splits. Refines the earlier Gomez et al. embryo time-lapse dataset (Zenodo 6390797).
