    - 138
    shape_varies: true
    dtype: float32
    compression: none
    value_range:
    - 35821.1
    - 427433.1
    normalization: unknown
    alignment: not-applicable
    alignment_notes: FDA healthy ROIs (1.17 um/px per paper), ImageJ TIFF, single page; size varies per ROI.
  - role: raw
    path_pattern: dataset/FDA_FullFOV_Healthy/*/*.tif
    format: tiff
    axes: yx
    shape:
    - 500
    - 490
    shape_varies: true
    dtype: float32
    compression: none
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'FDA healthy full 2x2 deg FOV, 8 averaging levels per subject registered to one reference (paper); probed
      N01 and N90 of subject 0201: 500x490.'
  - role: raw
    path_pattern: dataset/FDA_FullFOV_Drusen/*/*/*.tif
    format: tiff
    axes: yx
    shape:
    - 510
    - 502
    shape_varies: true
    dtype: uint8
    compression: none
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Drusen subject 6242, 1.5x1.5 deg FOV, 0.88 um/px (paper); ImageJ TIFF.
  - role: raw
    path_pattern: dataset/IU/*/*.tif
    format: tiff
    axes: yx
    shape:
    - 320
    - 320
    shape_varies: true
    dtype: uint8
    compression: packbits
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Indiana University imager, 1x1 deg, 1 um/px (paper); probed S1.
  - role: label
    path_pattern: dataset/**/*_cellCenter.mat
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: unknown
    value_range: null
    normalization: unknown
    encoding: points-table
    classes:
    - id: null
      name: RPE cell centre
    alignment: same-grid
    alignment_notes: 'Pairing: <stem>.tif -> <stem>_cellCenter.mat in the same folder; variable cellXY, column 1 = x, column
      2 = y (README). Full-FOV healthy: one .mat per subject (N90 image) that applies to all 8 registered averages (paper).
      MATLAB 5.0 MAT-file (header), contents not parsed.'
  notes: 'Listing: blobless git clone (tree only), dataset/ = 230 .tif + 153 .mat. Probed 5 TIFF headers (FDA ROI 134x138
    float32 ImageJ; FDA full FOV N01 and N90 500x490 float32; drusen 510x502 uint8 ImageJ; IU 320x320 uint8 packbits); none
    carries a calibration. Sampled FDA_ROI_Healthy/0201/00.tif (74,163 B): float32 35821-427433, mean 77286 (one sample; linear
    OCT amplitude, normalization unknown). The label .mat (2,067 B) is a MATLAB 5.0 MAT-file per its header; sample.py cannot
    read .mat, so the cellXY array was not parsed. Size not set: estimate_size.py reports "array 4 (label): no shape" (the
    .mat contents were not read); raw arrays alone estimate to 97,221,288 B uncompressed (136 x 134x138 + 88 x 500x490 float32,
    2 x 510x502 + 4 x 320x320 uint8; ROI shapes vary). Voxel size not set: differs per subset (paper Methods: FDA healthy
    1.17 um/pixel, drusen 0.88 um/pixel, IU 1 um/pixel); checked headers, README, paper. Downloads: each file is direct on
    raw.githubusercontent.com (usable, range requests); the GitHub archive zip returned 403, so data.download_url stays null.'
