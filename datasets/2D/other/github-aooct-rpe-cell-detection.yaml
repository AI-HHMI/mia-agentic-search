notes: 'Data are in the GitHub repo dataset/ folder (FDA_ROI_Healthy 136 ROIs, FDA_FullFOV_Healthy 11 subjects x 8 averaging
  levels N01-N90, FDA_FullFOV_Drusen 2, IU 4). MIT licence is the repository LICENSE; README offers "the dataset and model
  source codes" and asks to cite the paper. Authors are the first three of the paper. AO-OCT recorded as other. enricher:
  voxel size set to null (was 1170 x 1170): subsets differ, paper: FDA healthy 1.17 um/px, drusen subject 0.88 um/px, IU 1
  um/px. enricher: n_items 230 (was 142): 230 TIFFs in the git tree; full-FOV healthy has a cellCenter file only for the 90-average
  image, which per the paper labels all 8 registered averages.'
technical:
  method: sample
  size_source: unknown
  layout:
    tree: "github.com/soltanianzadeh/AOOCT-RPE-cell-detection (branch main), dataset/ 383 files\ndataset/\n  FDA_ROI_Healthy/<subject>/\
      \     11 subjects, 136 x (NN[_reselect].tif + NN[_reselect]_cellCenter.mat)\n  FDA_FullFOV_Healthy/<subject>/ 11 subjects\
      \ x 8 RPE_regN{01,05,10,20,30,45,60,90}RegResults_orig_ref*.tif\n                                 + 1 *N90*_cellCenter.mat\
      \ each (88 tif, 11 mat)\n  FDA_FullFOV_Drusen/6242/Loc1|Loc2/   Reslice of averaged_amplitude_volume_N340_*_rpe.tif\
      \ + _cellCenter.mat\n  IU/S1..S4/                     rpe_crop.tif + rpe_crop_cellCenter.mat\nDconnNet/, networks/,\
      \ losses/, optimizers/, utils/, train.py, solver.py, config.json (code), LICENSE (MIT), README.md"
    n_files: 383
    listing_complete: true
  sample:
    urls:
    - https://raw.githubusercontent.com/soltanianzadeh/AOOCT-RPE-cell-detection/main/dataset/FDA_ROI_Healthy/0201/00.tif
    - https://raw.githubusercontent.com/soltanianzadeh/AOOCT-RPE-cell-detection/main/dataset/FDA_ROI_Healthy/0201/00_cellCenter.mat
    size_bytes: 76230
    description: One FDA healthy ROI (134x138 float32) and its cell-centre .mat
  arrays:
  - role: raw
    path_pattern: dataset/FDA_ROI_Healthy/*/*.tif
    format: tiff
    axes: yx
    shape:
