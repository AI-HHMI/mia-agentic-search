notes: 'Borderline "microscopy": focus-stacked whole-specimen images from the DiversityScanner robot and the Entomoscope, an open-source
  photomicroscope (bioRxiv preprint Methods 2.1). Pixel size, magnification and illumination mode are not stated on the Zenodo page
  or in the preprint Methods text read, so voxel_size_nm is null and modality is other. Annotated by taxonomic experts with KAIDA (preprint
  2.2); the preprint lists a Scutellum class where the Zenodo README lists Halteres. Classification images are JPEG, segmentation images
  PNG. size_bytes is the sum of the four Zenodo files including models.zip (1.0 GB). body_part_segmentation.zip holds train/val/test
  image folders and matching label masks (1,841 files); segmentation pairs confirmed 920 (735 train / 92 val / 93 test). Four zips,
  so no single download_url. enricher: size from full zip listing (was page sum, rounded); mask format corrected (RGB, identical channels).'
