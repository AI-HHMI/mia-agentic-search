notes: Imaging flow cytometry images of plankton; no listed modality fits, so modality is other. The GitHub README (103 categories,
  more than 3.5 million images) differs from the paper (70 classes, 3.4 million images). The README links the archive at DOI
  10.1575/1912/7341; the WHOI archive pages returned HTTP 503 in this run, so the file listing, per-year file formats and
  sizes, and the image license were not seen. The GitHub repository is MIT-licensed per its LICENSE file, but that is not
  confirmed as the license of the images, so license is unknown. Image dimensions and pixel size are not stated in the paper
  (samples range from 100s to 10,000s of pixels). Formats are not verified and are recorded as other. The paper describes
  baseline splits (pre-2014 training/validation, 2014 test) but ships no split files. Europe PMC had no full text, so the
  paper was read as the arXiv HTML version.
