  notes: 'Metadata only. The DOI 10.1575/1912/7341 resolves (handle API) to https://darchive.mblwhoilibrary.org/handle/1912/7341,
    but every request to darchive.mblwhoilibrary.org failed TLS verification from this run (self-signed certificate in chain;
    the harvester got HTTP 503), so the per-year archives were not listed, probed or sampled and their format, size and license
    are unknown. The GitHub README points to the WHOI archive for the images (GitHub API listing was refused by the proxy,
    so repo files were not listed). The example gallery (whoigit.github.io/whoi-plankton) shows JPEG examples named IFCB<n>_<year>_...,
    but these are not confirmed to be the archive format. Voxel size not found; checked: README, arXiv paper (ar5iv full text,
    only states ROIs of 100s to 10,000s of pixels), example gallery; archive not reachable. No direct download found: the
    only download route is the WHOI DSpace archive, unreachable here. Size estimate not possible: no listing, shape or dtype.
    Readiness: 2D, no voxel size, organism and modality family unsettled (plankton, imaging flow cytometry).'
