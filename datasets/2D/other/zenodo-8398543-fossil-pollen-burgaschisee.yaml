notes: 'Three zips (listed with peek_archive): OBJECT_DETECTION (1,524 PNG + 1,524 XML; train 1,234 / validation 290 pairs), CNN (five folds, each about 3,020 train + 755
  validation class-folder images, 3,775 unique images; class folders by taxon, e.g. APIACEAE, BETULA_SIDE) and EVALUATION (390 PNG in EXPERIMENTS/EXPERIMENT_N/<taxon>/).
  The paper (Quaternary Science Reviews, 2024) is not open access and was not read; the microscope, magnification, pixel size and staining are therefore unknown (modality other),
  as are annotator details. The code repository has no explicit license; the Zenodo record is CC-BY-4.0. The n_items count adds unique CNN images, detection images and evaluation images.'
