title: Five-fold training dataset of fossil pollen images from Burgäschisee used for automated fossil pollen identification
short_name: Fossil pollen detection & classification images
description: Light-microscope images of fossil pollen from lake sediment (Burgäschisee) for automated pollen analysis,
  with a five-fold classification set (nine pollen taxa, a Lycopodium marker class and four non-pollen debris classes),
  an object-detection set with per-image XML bounding-box annotations, and an evaluation image set.
