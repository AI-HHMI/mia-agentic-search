notes: 'Record, README and data.zip listing read (295 JPEG + 295 PNG masks). Tiers: expert-verified (153 scans, 19,052 instances;
  blinded double annotation, adjudication) and single-pass (142 scans, 27,797; one manual correction of model predictions,
  unreviewed); evaluate only on the expert tier. Images are the nanoparticle subset of Aversa et al. 2018 (ZEISS SUPRA 40
  FEG-SEM); that collection is already in the catalog as b2share-qtq9v-ys023-nffa-sem-nanoscience (18,577 images, image-level
  classes only), whereas this record adds instance masks for 295 images and ships them. Pixel size not stated: JPEGs without
  acquisition metadata. Dataset paper is pending, so the cited paper is the source-image paper. enricher: listing, headers
  and one image/mask pair inspected; voxel size stays null (README: no physical calibration, sizes in pixels).'
