title: 'SEM Nanoparticle Instance Segmentation Reference Data: Expert-Verified and Single-Pass Annotations of 295 Scans'
short_name: SEM nanoparticle instance masks (SEM)
description: Instance-level segmentation masks for 295 scanning electron microscopy images of nanoparticles (46,849 annotated
  particles, including dense, agglomerated and overlapping configurations), with the images included. 153 scans are expert-verified
  (independent blinded double annotation, adjudication, consensus) and 142 are single-pass corrections of model predictions.
  Images are 1024x768 JPEGs from the nanoparticle subset of the Aversa et al. 2018 SEM collection; masks are 16-bit PNGs with
  one integer ID per particle. No fixed split.
