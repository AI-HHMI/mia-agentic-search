notes: 'Zip listed with peek_archive: 19,667 PNG plus 20 .db files in 46 taxon folders (Actinidia 455, Kunzea 1700, Lepto 1700, Poaceae 45, ...). Paper Methods: dark field images from the Classifynder system (formerly AutoStage), z-stack composites falsely coloured for depth; most images from reference pollen slides (14 taxa from honey samples), manually sorted and filtered for outliers and debris by the authors; 40 to 1700 images per taxon. Figshare lists the licence as GPL 3.0+ (no URL given), while the paper is CC BY 4.0. The modality is dark field, which is not in the schema list, so other. Objective, pixel size and the train/test split used in the paper (not shipped) were not found in the text read. Organism field left empty: 46 mixed taxa, listed only as genus or family folder names.'
