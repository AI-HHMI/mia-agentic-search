notes: 'Listed FeM_v1.zip with peek_archive: 81 reference masks + 81 reflected-light images (162 TIFFs).
  Masks come from thresholded SEM images registered to the reflected-light images (per record description),
  hence source=automatic. The paper (Minerals Engineering) is not open access; only the abstract was available,
  so Methods were not read; sample, objective and pixel size are from the Zenodo description. Sibling
  of zenodo-5020566 (copper ore, Cu dataset, 121 pairs) from the same group and paper; this is a different
  sample and image set. enricher: zip listed, one image/mask pair probed and sampled (see technical).'
