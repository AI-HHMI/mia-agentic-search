title: FeM dataset – An iron ore labeled images dataset for segmentation training and testing
short_name: Iron ore vs resin segmentation (reflected light)
description: '81 pairs of correlated images of a polished itabiritic iron ore concentrate sample: each a reflected light microscopy
  RGB image (10x, 999x756 px, 1.05 um/pixel) with a binary reference mask labelling ore versus embedding resin, derived from
  registered SEM images. Created for semantic segmentation training and testing.'
