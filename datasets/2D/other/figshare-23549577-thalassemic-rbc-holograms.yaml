notes: 'Two zips listed with peek_archive: nRBC.zip 760 .bmp (1.3 MB each, 997 MB) and tRBC.zip 609 .bmp (799 MB). Each hologram shows
  one RBC; the two classes come from only two people (one healthy, one thalassemia minor), so the label is confounded with donor
  and slide. The BMP holograms are raw interferograms, not reconstructed phase maps; reconstruction is described in the paper
  Methods. Pixel size and camera are not stated in the paper text read, so voxel_size_nm is null. Digital holographic microscopy has no listed modality, hence other. Download
  URL is the nRBC zip; the tRBC zip is https://ndownloader.figshare.com/files/43103155.'
