notes: 'Two zips: nRBC.zip 760 BMP and tRBC.zip 609 BMP, each one RBC hologram (1280 x 1024, 8-bit). The two classes
  come from only two people (one healthy, one thalassemia minor), so the label is confounded with donor and slide.
  The BMPs are raw interferograms, not reconstructed phase maps; reconstruction is described in the paper Methods.
  Digital holographic microscopy has no listed modality, hence other; BMP has no listed format, hence other. Download
  URL is the nRBC zip; the tRBC zip is https://ndownloader.figshare.com/files/43103155. enricher: the paper does
  state the camera (Thorlabs DCC1545M, 5.2 um pixel pitch) but not the pixel size at the sample (microsphere magnification
  varies with sphere position), so voxel_size_nm stays null (was: camera not stated).'
