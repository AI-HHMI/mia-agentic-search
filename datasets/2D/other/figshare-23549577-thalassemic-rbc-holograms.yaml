title: A dataset of digital holograms of normal and thalassemic red blood cells
short_name: Normal vs thalassemic RBC holograms (DHM)
description: 1,369 digital holograms (BMP) of single red blood cells from air-dried thin blood smears, 760 from a healthy subject
  (nRBC) and 609 from a subject with thalassemia minor (tRBC), recorded with a microsphere-assisted digital holographic microscope
  (Mirau interferometric objective, 10x NA 0.3, He-Ne 632.8 nm, 234 um silica microsphere). Class is given by the nRBC / tRBC folder.
