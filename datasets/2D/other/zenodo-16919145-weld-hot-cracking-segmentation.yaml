notes: 'Materials-science light microscopy (reflected light, Keyence optical microscope), so modality is other. The zip lists 1,218 PNGs plus one .db file; the description pairs every train image with a mask of the same size, so 609 image/mask pairs is inferred (only the 1/100/mask folder was seen in the listing). Image sizes vary (no fixed size). Masks were drawn manually with a self-written OpenCV program. Pixel size and microscope objective details not stated on the record. No paper is linked on the record and a Europe PMC author search found none about this dataset, so publications is empty. No train/test split is provided.'
