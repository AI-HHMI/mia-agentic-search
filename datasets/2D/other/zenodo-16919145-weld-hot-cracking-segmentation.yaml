title: Semantic Segmentation for Hot Cracking
short_name: Weld hot-crack segmentation (light microscopy)
description: Light-microscope (Keyence) colour images at 50x and 100x of tungsten-inert-gas weld surfaces
  from modified Varestraint-Transvarestraint tests, with paired 8-bit binary masks marking hot-crack pixels
  (255 = crack), made for training crack segmentation networks. Folders are organised wire / magnification
  / train or mask / numbered images.
