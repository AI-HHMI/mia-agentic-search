notes: 'Read the Zenodo API record, README, CSVs and zip listing. No associated paper is named on the record or found in Europe PMC,
  so the only methods source is the README. Annotations are weak and partial: manual ImageJ counts of stomata for 26 of the 177 200x
  images (25 pass QC) and manual stoma area for 25 of the 177 2000x images (24 pass QC), all from genotype Alpo; no segmentation masks
  or point coordinates. Pixel size is 0.25 um/px for 200x images and 0.025 um/px for 2000x images. Images carry an embedded text/scale-bar
  banner. Modality is scanning electron microscopy of leaf surfaces; the schema has no plain SEM value, so other. enricher: voxel_size_nm
  set to null (was 250x250): README states 0.25 um/px for 200x and 0.025 um/px for 2000x images, no shared size. enricher: channels
  1 (RGB files hold identical samples). organisms: Lens culinaris = Lcul_*/, Lens odemensis = Lode_ILWL235/. modality: surface SEM (EM
  family).'
