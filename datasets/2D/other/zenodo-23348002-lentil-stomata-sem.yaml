title: Scanning electron micrographs of lentil stomata under PEG-induced osmotic stress
short_name: Lentil leaf stomata with counts (SEM)
description: '354 scanning electron micrographs (2560 x 1920 px RGB TIFF) of the abaxial leaf epidermis of six cultivated lentil genotypes and one wild relative under control and 15% PEG conditions, sampled 2, 4 and 6 days after treatment; 177 low-magnification (200x) field images and 177 high-magnification (2000x) single-stoma images. Manual ImageJ annotations cover a subset of the Alpo genotype only: stomata counts and density for 26 field images and single-stoma area for 25 close-up images.'
