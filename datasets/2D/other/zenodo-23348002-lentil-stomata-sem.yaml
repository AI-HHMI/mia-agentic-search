notes: 'Read the Zenodo API record, README.txt, the three CSV tables and listed the image zip with peek_archive (354 TIFFs in per-genotype folders). No associated paper is named on the record or found in Europe PMC, so the only methods source is the README. Annotations are weak and partial: manual ImageJ counts of stomata for 26 of the 177 200x images (25 pass QC) and manual stoma area for 25 of the 177 2000x images (24 pass QC), all from genotype Alpo; no segmentation masks or point coordinates. Pixel size is 0.25 um/px for 200x images and 0.025 um/px for 2000x images (voxel_size_nm gives the 200x value, 250 nm). Images carry an embedded text/scale-bar banner. The README warns fields cannot be traced to a biological replicate. Modality is scanning electron microscopy of leaf surfaces; the schema has no plain SEM value, so other.'
