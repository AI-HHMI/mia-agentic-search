notes: 'Facts from the Zenodo API record and the open-access paper (Europe PMC full text). Datasets.zip could not be listed (no range support), so image count, file formats, directory layout and split are unverified; the paper mentions 34 training images before tiling and a 6-image validation subset, and the GitHub repo hosts the same SEM micrographs and masks. Zenodo license is CC-BY-NC-ND-4.0 (the paper itself is CC-BY). Pixel size approx. 7.3 nm stated in paper; stored voxel_size_nm left null because it was not confirmed per file. Organism not applicable (inorganic particles).'
