notes: 'Zip listing (peek_archive): 57 BMP images, 9 JSON files and info.csv; info.csv describes the bootstrapping set (2 images,
  7 sampled annotation files plus trainval.json with all annotations), the training set (50 images + the 2 bootstrapping
  images) and the test set (3 images, testval.json). Formats: the BMP images are not in the schema format list, so
  formats is other (annotations are JSON, not a format that fits next to a known one). Modality is other because
  the illumination type, magnification and pixel size are not stated on the Zenodo page or in the
  arXiv text I read, so voxel size is null. The images show coffee grinds, not biological material; included because
  they are microscope images with instance masks usable for one-class instance segmentation. No dedicated dataset paper;
  the arXiv paper (Iterative Learning for Instance Segmentation) uses it, DOI not looked up. Only 3 test images.
  Small dataset (57 images).'
