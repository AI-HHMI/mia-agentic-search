notes: 'Zip (peek_archive): 57 BMP images, 9 JSON files, info.csv (bootstrapping set: 2 images + trainval.json and 7 sampled
  subsets; training set: 50 images + the 2 bootstrapping ones; test set: 3 images + testval.json). BMP is not a schema format,
  so formats is other. Modality other: illumination, magnification and pixel size are not stated on Zenodo or in the arXiv
  paper. Coffee grinds, not biological material; kept as microscope images with instance masks. The arXiv paper uses the data;
  no dataset paper. enricher: only 5 of 57 images are annotated (2 bootstrapping + 3 test, 325 instances); the 50 training
  images are unlabeled (paper Sec. 2, no training JSON in the zip); coverage partial (was dense). Channels 3 (RGB BMP).'
