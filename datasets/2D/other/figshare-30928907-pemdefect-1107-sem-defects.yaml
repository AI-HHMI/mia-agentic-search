notes: 'Single zip yolo_format.zip (265.9 MB; 1107 .jpg, 1107 .txt, dataset.yaml) listed with peek_archive. The record text
  says PNG but the zip holds JPG; images are 640x640 grayscale per the description. SEM is stated by the dataset.yaml comment
  and tags; no SEM value in the modality enum, so other. No paper, microscope, pixel size, annotation procedure or source
  of the images found on the record or zip (no publication linked); the file names (e.g. nav10001a3.jpg) suggest the images
  were compiled from other sources, provenance unknown. The record says augmentation was applied to the training split only,  The
  figshare title is PEM-DefectLoc-9K while the description calls it PEMDefect-1107. enricher: 1,008 of the 1,045 training
  images are augmented copies (_aug in the name); val and test (31 each) are not. modality: conventional SEM (EM family),
  other only for lack of a plain SEM value.'
