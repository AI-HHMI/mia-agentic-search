notes: 'Materials-science SEM (not biological); modality is "other" because the schema has no plain SEM value, and formats is
  "other" because the files are BMP (no BMP value). peek_archive: AugmentedImages.zip has 405 BMPs (130.0 MB), AugmentedMasks.zip has
  405 BMPs (4.0 MB); size_bytes is the sum of the two files. The 405 crops are augmented (flips, rotations, elastic and grid
  distortions, brightness/contrast changes) from a smaller set of source crops, so images are not independent and no train/val/test
  split is provided. The paper is not open access (Europe PMC/Crossref abstract only); pixel size, microscope and the class-to-pixel-value
  mapping are not stated on the Zenodo page and could not be checked.'
