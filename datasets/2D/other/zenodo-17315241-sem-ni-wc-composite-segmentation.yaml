notes: 'Materials-science SEM (not biological); modality is "other" because the schema has no plain SEM value, and
  formats is "other" because the files are BMP (no BMP value). The 405 crops are augmented (flips, rotations, elastic
  and grid distortions, brightness/contrast changes) from a smaller set of source crops, so images are not independent
  and no train/val/test split is provided. The paper is not open access (Europe PMC/Crossref abstract only); pixel
  size, microscope and the class names for mask values are not stated on the Zenodo page and could not be checked.

  enricher: mask BMPs hold small integer class values (1, 3, 4, 5 in the sample); class names not documented.'
