notes: 'Read the Zenodo record, API file list, full README and zip indexes. No paper is linked (manuscript unpublished).
  Modality: optical (light) microscope, Zeiss Axio Observer 7; contrast mode not stated, so other. Organism (the
  MICP bacteria) not named. Pixel size 0.447 um/pixel (README). README caveats: training masks are JPEG with compression
  grey values, 10 edge pairs have smaller inputs than their 1024 x 1024 annotations, nnU-Net metadata unverified,
  no trained weights. enricher: annotations.source mixed = training/masks manual (README: author-identified manual
  annotations); quantitative Prediction_*.nii.gz masks are model predictions (file names; README: inference lineage
  not included). enricher: training inputs are PNG, not JPEG (listing, probe). enricher: size from the Zenodo file
  listing.'
