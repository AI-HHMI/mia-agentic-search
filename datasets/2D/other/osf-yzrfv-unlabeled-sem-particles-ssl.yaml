notes: 'Unannotated; released for self-supervised pretraining (24,751 frames per paper). The 91-image annotated downstream
  set is from an earlier paper and is not in this OSF project. OSF project has no license and the paper does not state one
  for the data. Checked OSF API/wiki and paper full text. enricher: formats tiff+png from the split zip central directory
  (was other); train/ and val/ folders (splits_provided was false); channels 1 (grayscale; Round-2/3 train TIFFs are stored
  RGB). Modality: Thermo Fisher Phenom XL tabletop SEM (EM family; no SEM enum value fits). Organism: none, non-biological
  powder samples. Pixel size varies per file (see technical.notes).'
