title: Unlabeled SEM dataset for self-supervised learning
short_name: Unlabeled SEM particle images for SSL (SEM)
description: 24,751 unannotated scanning electron microscope frames of particle samples
  (tabletop Thermo Fisher Phenom XL), captured in a rasterized fashion and kept unfiltered,
  released as a pretraining corpus for self-supervised learning (ConvNeXtV2, DenseCL)
  of particle segmentation, together with pretrained ConvNeXtV2 weights.
