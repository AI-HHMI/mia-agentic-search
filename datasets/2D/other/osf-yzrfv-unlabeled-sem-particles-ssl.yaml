    members: 24,716 .tiff, 35 .png, 34.77 GB uncompressed). Sampled Tile_r000_c000.tiff (inflated from .z01) and 720_0_Phenom.tiff
    (.z37); value ranges from one sample each. Headers of train/Round-2/Img1.tiff and val/Round-2/Img1.png from partial inflate.
    Voxel size: none for the whole dataset. Acquisition tiles carry no calibration; Phenom_Images TIFFs embed pixelWidth per
    file (55.56 nm in one); Combined_New_Scans file names state a per-tile field width (e.g. fw851um); paper and OSF wiki
    give none. Checked: TIFF headers, OSF API/wiki, paper full text, GitHub README. No direct download per file: the data
    are only a 47-part split zip (zip -s0 to join), so ::member links are not usable and sample is null; parts are direct
    OSF links (https://osf.io/download/<id>/, range requests ok). Dataset is 2D and not convertible by the miao layout yet.'
