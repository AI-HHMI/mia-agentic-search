notes: 'Unannotated; released for self-supervised pretraining (24,751 frames per paper).
  The 91-image annotated downstream set is from an earlier paper and is not in this
  OSF project. Dataset folder is a 47-part split zip (join with zip -s0), so members
  could not be listed: image format, pixel size and magnification are unverified.
  OSF project has no license and the paper does not state one for the data. Checked
  OSF API/wiki and paper full text.'
