notes: 'data.zip (1.12 GB compressed, 3.6 GB uncompressed) lists 10 raw IMC ROI exports (data/IMCData/*.txt, ~354
  MB each, ROI_030 ... ROI_063) and mask TIFFs. Tissue, organism, marker panel, pixel size, annotation tool and
  licence terms in the paper are not stated on the Zenodo page or the code repository README (README license section
  is "TODO"); the paper (Springer LNCS) is not open access and no preprint was found, so these fields are left empty.
  Raw images are text exports of IMC data, so formats lists only tiff (masks). Modality "other" = imaging mass cytometry.
  The code repository also references four external published IMC datasets that are not part of this record. enricher:
  the zip has 4 mask folders Annot1-Annot4 (40 TIFFs), not 3 (was 3 x 10); channels 54 from the txt header; size
  exact from the zip listing.'
