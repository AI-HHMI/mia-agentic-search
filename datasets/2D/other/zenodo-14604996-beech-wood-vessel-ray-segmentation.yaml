notes: 'Checked the Zenodo record, both zip listings (COCO zip: train/valid/test folders with 3 _annotations.coco.json;
  YOLOv8 zip with a data yaml) and the full text of the BMC Plant Methods paper (Methods: 150 random 640x640
  patches from 2 discs, 90/30/30 split, ~17,000 vessels and 500 rays, 3 days manual annotation in Roboflow;
  imaging at 11289 dpi = 2.25 um). Images are macro photographs (industrial camera with telecentric lens
  and ring light) of polished wood surfaces rather than a conventional microscope, so modality is other.
  Size is the COCO zip (5.6 MB) plus YOLOv8 zip (5.5 MB) as listed, unzipped sizes 11.0 and 12.8 MB; the
  same 150 images appear in both zips. The record also holds a 144 MB trained YOLOv8 model (.pt). Related
  full-image data: Zenodo 14627909 (increment cores) and BioImage Archive S-BIAD1574 (discs). Pixel size
  is from the paper, not the file headers; JPEGs are 640x640 crops. enricher: size now the full listing
  incl. model.'
