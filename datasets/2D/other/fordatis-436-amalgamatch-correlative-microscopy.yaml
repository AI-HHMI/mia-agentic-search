id: fordatis-436-amalgamatch-correlative-microscopy
title: 'AmalgaMatch: A Correlative Microscopy Dataset for Multimodal Data Fusion and Image Matching in Materials Science'
short_name: AmalgaMatch materials microscopy image matching
description: Cross-modal image-matching benchmark for materials microscopy with 19 subsets, 35 scenes and 187 image pairs
  of the same sample region taken with light-optical microscopy, scanning electron microscopy, transmission electron
  microscopy and electron backscatter diffraction (EBSD, some images processed by digital image correlation or EBSD
  indexing). Hand-annotated keypoint correspondences in the overlapping regions (dislocations, grain boundaries, triple
  junctions, inclusions, pores, surface features) and per-image metadata are provided, intended for benchmarking and
  fine-tuning matching models, including hybrid image-plus-text models.
