notes: Material microscopy (light-optical, SEM, EBSD, TEM), not biological; kept because it is a microscopy
  image dataset with manual keypoint ground truth for registration/matching. The single 4.13 GB zip does
  not support HTTP range requests (server answers 200 to a Range request), so its contents were not listed;
  image file formats, image sizes, pixel sizes, the keypoint file format, the exact number of images and
  any train/test split are therefore unknown (data.formats is other for that reason). The Scientific Data
  paper full text was not accessible (only the abstract and Nature page), and the fordatis page lists
  no related publication DOI; the paper DOI is from the title match (Crossref). Also hosted browsable
  on UCSB BisQue (Micrograph Matcher). Version 1.0.0, Feb-2026 on the page; date_published 2026-02-17
  is the zip file Last-Modified header (the page gives only the month).
