notes: 'Figshare record read (license CC BY 4.0, four files: 10x_magnification.rar 138 MB, 40x_magnification.rar
  695 MB, VOC2COCO.py, VOC2YOLO.py). The RAR archives cannot be listed remotely; a 400 kB range of the 10x archive
  showed paths such as 10x_magnification/images/test/L0004.jpg, so images are JPEG and there is a test split
  folder (train/val folders not seen). Annotation files and class names were not read, the Scientific Data
  paper named on the page was not found in Europe PMC or by web search, and modality (transmitted-light
  microscopy of urine sediment) and pixel size are not stated on the page, so modality is other. Two download
  URLs exist (one per RAR) and no single archive, so download_url is null: 10x https://ndownloader.figshare.com/files/64393776,
