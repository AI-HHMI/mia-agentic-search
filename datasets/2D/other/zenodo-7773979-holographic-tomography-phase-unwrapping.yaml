notes: 'Computational-imaging dataset: the targets are unwrapped phase and wrap-count maps for wrapped phase
  images, not biological annotations; the real images are augmented, so the count of 27,189 is not the number
  of distinct specimens. Zenodo gives no modality, microscope, pixel size or sample sizes, and the paper
  (Optics Express) is not open access (only the abstract was reachable), so voxel size, organisms
  and original image counts are null. Formats are NumPy .npz, which is not in the schema list, so other.
