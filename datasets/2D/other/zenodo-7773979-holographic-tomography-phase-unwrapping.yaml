notes: 'Computational-imaging dataset: the targets are unwrapped phase and wrap-count maps for wrapped phase images,
  not biological annotations; the real images are augmented, so the count of 27,189 is not the number of distinct
  specimens. Zenodo gives no modality, microscope, pixel size or sample sizes, and the paper (Optics Express) full
  text was not reachable (Europe PMC: not open access; publisher page behind a JavaScript check), so voxel size,
  organisms and original image counts are null. Formats are NumPy .npz (zip of one .npy), which is not in the schema
  list, so other. Size is the sum of the nine Zenodo files (includes two .h5 models). enricher: annotations_verified
  true (npy headers and first images of all seven .npz read; unwrapped = wrapped + 2*pi*wrapcount checked on 5 real
  and 5 synthetic images).'
