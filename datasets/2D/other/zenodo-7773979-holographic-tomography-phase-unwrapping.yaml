  notes: 'Zenodo listing: 9 files, 18,153,827,731 B, complete. Each .npz is a deflate zip with one member arr_0.npy;
    a scratch script (requests + zlib + numpy.lib.format, no pickle) read the first 3,000,000 B of each of the seven
    .npz files, parsed the npy header (shape, dtype, C order) and decoded the first 5 images. value_range is from
    those 5 images only (wrapped [0, 2*pi], wrapcount 0-3 there; the full range may be larger). Pairing by index
    verified numerically (unwrapped = wrapped + 2*pi*wrapcount). Format other: .npy/.npz is not a schema format;
    axes null (Zenodo states shape (256,256,1) per image but names no axes; axis 0 is the image index). No sample
    unit: every image set is a single 2.2-7.1 GB npy array (the npz files are direct and usable, zip member fetch
    works). Voxel size not found; checked: Zenodo record and API, npy headers (no metadata), Europe PMC (abstract
    only), publisher page (JavaScript check). Modality other: holographic tomography phase maps.'
