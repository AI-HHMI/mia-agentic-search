title: Phase unwrapping using Deep Learning in Holographic Tomography - dataset
short_name: Phase unwrapping pairs (holographic tomography)
description: Paired 256x256 quantitative phase images from holographic tomography for training phase-unwrapping
  and denoising networks. 27,189 real (augmented) images of cells, organoids, phantoms and 3D-printed
  scattering structures, each as wrapped phase, unwrapped phase and integer wrap-count map, plus 10,000
  synthetic images per type (wrapped, unwrapped, wrap count, noised). Two trained Keras models are included.
