id: 4tu-bf11171a-carbon-fibre-composite-masks
title: Annotated images of microscopy images from carbon fibre composites
short_name: Carbon fibre composite masks (microscopy)
description: Four sets of 256 x 256 px image tiles (500, 500, 1000 and 32 images, 2,032 in total) cut from microscopy
  images of cross sections of carbon fibre composite laminates, each with a semantic mask labelling matrix (0),
  fibre (1) and void (2). Fibre masks are idealised circles of average fibre radius drawn at ImageJ local-maxima
  centres; voids come from minimum-method thresholding. Intended for training, validating and testing semantic
  segmentation.
