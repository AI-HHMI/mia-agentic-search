notes: 'Everything is from the 4TU.ResearchData landing page and its API record (files: Data sets.zip
  615 MB, READ ME.txt). The 4TU file store returned "StorageMaintenance" this run, so the zip could not
  be listed and the README could not be read; per-set file formats (tif/jpg/png) are the repository''s
