notes: 'IMC is metal-tag mass cytometry imaging, not a listed modality, so modality is ''other''. Pixel
  size is not stated on the Zenodo record or in the paper text searched here; the paper describes the
  Hyperion+ system but the data page gives no resolution. images_masks.zip was listed with peek_archive
  (179 .tiff images under img/ and 179 .tiff masks under masks/). The cell-type labels are in .rds (R)
  files, so using them needs R or conversion; the manual labelling is gating of single-cell data (paper
  Methods S2, supplementary), checked against images, rather than drawing on images. The masks are single-cell
  segmentation masks from the imaging workflow, not hand drawn. Related records - 12699335 (mIF) and 13132656
  (mIF and IMC data) - were not reviewed here. enricher: 40-page uint16 images, uint16 instance masks
  (one pair opened).'
