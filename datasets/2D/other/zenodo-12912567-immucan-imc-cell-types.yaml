title: IMMUcan panel 1 cell type classification
short_name: IMMUcan IMC cell-type labels (179 images)
description: 179 imaging mass cytometry (IMC) images from 179 cancer patients (five tumour indications) of the IMMUcan
  project, with single-cell segmentation masks and more than 340,000 cells manually gated into major cell types
  (images_masks.zip, 358 TIFFs, plus R SingleCellExperiment objects with the labelled cells and a random forest
  classifier). Supports cell segmentation and cell-phenotype classification benchmarking; an 80:20 train/test split
  was used in the paper.
