notes: Counts, classes and split sizes from the dataset card; 155 classes include
  non-plankton ROIs. Files are Parquet shards (10) with embedded PNG images; formats
  lists png as the image encoding. Imaging Flow Cytobot is an in-flow imaging microscope,
  filed as modality 'other'. No pixel size or magnification on the card (viewer shows
  image widths 40-1,380 px); no related paper linked, only the trained model repo
  and a Hugging Face citation DOI. Labels are class labels only (no masks or boxes).
  Split is stratified per class, not per IFCB sample bin, so train and validation
  can contain images from the same sample.
