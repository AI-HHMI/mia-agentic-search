description: 97,026 human-verified grayscale Imaging FlowCytobot (IFCB) images of
  plankton and non-plankton particles from Northeast US Shelf cruises (2006-2021),
  labeled with 155 classes and split into train (77,617) and validation (19,409) subsets;
  used to train the NES plankton IFCB classifier.
