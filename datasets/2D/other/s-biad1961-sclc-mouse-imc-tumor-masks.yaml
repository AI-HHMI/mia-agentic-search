title: Imaging Mass Cytometry Dataset of Small-Cell Lung Cancer tumors and tumor environments
short_name: Mouse SCLC imaging mass cytometry tumor masks
description: 221 imaging mass cytometry (IMC) regions of interest (37 metal-tagged antibody channels plus two DNA
  channels) from mouse small-cell lung cancer tumors (RP and RPM models) and control spleen/lymph node tissue on
  two frozen tissue microarrays, converted to OME-Zarr. Every lung ROI carries a manually drawn binary tumor-area
  mask stored as a label in the same zarr (labels/tumor); control tissues have none.
