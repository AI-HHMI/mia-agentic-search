notes: 'IMC is not in the modality enum, so modality is other (imaging mass cytometry). Pixel size x = y = 1000
  nm from the paper ("spatial resolution of IMC is fixed at 1 um2 in the xy-plane"); the zarr scale metadata is
  unitless. License CC0 from the BioStudies record. Size 3.14 GB and 221 zarr.zip files (111 RPM-TMA, 110 RP-TMA)
  from the study file list. Coverage: per the assay table 212 lung ROIs (120 lung_tumor, 92 lung_tumor_border) carry
  the labels/tumor mask; the 9 control ROIs (8 spleen, 1 lymph node) have none. Masks drawn manually in Fiji on
  normalized DNA/NCAM/PD-L1 RGB composites (paper). The paper says the same data is also in IDR as idr0170 (IDR
  page not fetched). Instrument not named in the paper. enricher: coverage counted from the assay table (was not
  counted).'
