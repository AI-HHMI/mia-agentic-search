notes: 'IMC is not in the modality enum, so modality is other (imaging mass cytometry). Pixel size x = y = 1000 nm from the paper (IMC resolution fixed at 1 um in xy); the zarr scale metadata is unitless. License CC0 from the BioStudies record. Size 3.14 GB and 221 zarr.zip files (111 RPM-TMA, 110 RP-TMA) from the study file list. Example zarr shape (t,c,z,y,x) = (1,37,1,527,771) float32. labels/tumor seen in 3 of 5 sampled zips; the first ROI (spleen control per the assay table) has none, matching the stated coverage (lung ROIs only), so coverage is partial and the number of masked ROIs was not counted. The paper says the same data is also in IDR as idr0170 (IDR page not fetched). Instrument not named in the paper methods.'
