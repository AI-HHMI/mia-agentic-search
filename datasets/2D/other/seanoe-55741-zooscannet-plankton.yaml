  notes: 'The dataset is one tar (10,640,873,984 B from the server, range requests work). Streamed its first 1 MB with a
    small requests+tarfile script: the tar is plain (not gzip) and starts with ZooScanNet/imgs/<taxon>/ folders. First image
    Acartiidae/87378882.png (2,819 B) is 81x108 uint8 grayscale PNG, values 87-255, mean 222.5 (white background; one
    sample). sample is null: TensorSwitch cannot pull single members out of a tar, and www.seanoe.org is not on its fetch
