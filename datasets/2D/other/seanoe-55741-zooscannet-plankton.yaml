notes: 'Read the SEANOE landing page in full. The download is one 10.6 GB tar (Content-Length 10,640,873,984); its first
  headers show ZooScanNet/imgs/<taxon>/<objid>.png, so images are PNG. The page lists taxa.csv.gz, features_native.csv.gz,
  features_skimage.csv.gz, inventory.tsv, map.png and the imgs folder (page describes two tars, data and imgs; only the one
  tar link was found, and the tar was not fully listed). Version 2 is open; version 1 is deprecated and on request. The page says not
  every identification has been verified. ZooScan is a flatbed scanner rather than a microscope, so modality is recorded
  as other. Pixel size is not stated on the page (measurements are in pixels); no paper is linked on the page and a
  title search in Europe PMC found none, so none was read. Author list is partial (the page names 15 authors; three were shown to me).'
