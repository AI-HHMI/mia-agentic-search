notes: 'Counts and format come from the study description and the GigaScience paper (full text read).
  Paper says the Zenodo copy is 6 RAR archives, about 27.5 GB. BioStudies file paths look like normal/NCL0101/HH.tif.
  Splits: 365/92/115 slices (train/val/test) per the study; the paper lists train.txt and test.txt on
  Zenodo (10.5281/zenodo.10068018, 14237234; same data, not fetched). Imaging is transmission Mueller-matrix
  polarimetry (laser, polarizers, CCD) on unstained 5 um sections, labelled polarization microscopy by
  the BioImage Archive; no schema modality fits, hence other. Pixel size and magnification not stated
  in the entry or paper. Labels come from a histopathologist reading H&E-stained sections of the same
  tissue. enricher: size 27,524,319,776 B from the BioStudies file API (all 20,592 TIFFs) plus the 2 file
  lists (was null); TIFFs are RGBA uint8, signal almost only in the first sample. Modality family: light
  (transmission polarimetry), not EM or X-ray.'
