  notes: 'BioStudies files API (api/v1/studies/S-BIAD1989/files, offset/limit pages) lists 20,592 TIFFs
    with exact sizes, 27,521,576,262 B; the FTP Files/ folder also holds full_list2.tsv and .json (HEAD
