title: 'ColoPola: A polarimetric imaging dataset for colorectal cancer detection'
short_name: ColoPola colorectal polarimetric images
description: 20,592 polarimetric TIFF images (1280 x 1024 px, 36 polarization-state images per slice) of 572
  unstained 5 um human colorectal tissue slices, 288 healthy and 284 malignant, measured with a custom
  transmission Mueller-matrix polarimeter. Slice labels (healthy vs cancer) were confirmed by a histopathologist
  on H&E-stained adjacent sections. Released with benchmark train/validation/test splits for classification.
