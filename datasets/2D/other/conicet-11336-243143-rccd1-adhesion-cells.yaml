notes: 'CONICET page states Creative Commons Attribution 2.5 Argentina; the full metadata view lists dc.rights.uri
  opendatacommons.org/licenses/by/1-0; the Roboflow files in the zip (data.yaml, README.dataset.txt) say CC BY 4.0,
  so license is recorded as custom. Zip: Roboflow v13 export (workspace biomemb), 90 images, YOLOv8, one class (Cell),
  train/valid/test 51/19/20. Imaging per page Methods: PFA-fixed cells photographed with a Microsoft Lifecam VX-6000
  webcam on an Olympus IMT-2 inverted microscope, 4x objective; contrast method and pixel size not stated, no paper
  found. enricher: organism Rattus norvegicus (page: rat renal CCD line RRID CVCL_E043; Cellosaurus OX 10116) (was
  empty); channels 3 = RGB webcam colour (probe/sample) (was null); size 4,881,162 B from zip listing (was 4,655,000
  page-stated).'
