notes: 'The CONICET page states Creative Commons Attribution 2.5 Argentina (attribution, keep dataset notices); the Roboflow files inside the zip (data.yaml, README.dataset.txt) say CC BY 4.0, so license is recorded as custom. The zip (about 4.7 MB, 198 files) is a Roboflow v13 export (workspace biomemb) of 90 images, YOLOv8 format, one class (Cell), split into train, valid and test (test has 22 images and 15 label files in the listing). Imaging modality, stain, organism and pixel size are not stated on the page or in the zip (the page says only that the cells were fixed and photographed at 4x); no paper is linked. The zip includes stray files (lock file, shell scripts, csv outputs).'
