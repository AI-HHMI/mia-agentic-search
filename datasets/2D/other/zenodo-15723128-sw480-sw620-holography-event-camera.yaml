title: SW480 and SW620 colorectal cancer cell classification, digital holography and event-based imaging
short_name: SW480 vs SW620 cells, holography (label-free)
description: Training data for classifying two colorectal cancer cell lines, SW480 and SW620, in a label-free
  imaging flow cytometry system. Each cell line has its own zip with optical path difference maps and
  amplitude images (.npy), off-axis hologram images (.png) and event-based images synthesized from an
  event camera (.png), all organized in per-cell-line subfolders. About 4,700 files for SW480 and 5,000
  for SW620.
