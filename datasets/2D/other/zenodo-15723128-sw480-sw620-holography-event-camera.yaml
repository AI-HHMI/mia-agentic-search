notes: 'Checked the Zenodo record and both zip listings. The paper is not open access (abstract only; publisher page 403);
  pixel size, camera and cell counts are not stated on the Zenodo page. The main arrays are .npy (OPD maps and amplitude images,
  float64 224x224), which the format list lacks; the hologram and event images are PNG. The two classes are cell-line identity,
  so labels come from the sample, not from per-image annotation. SW480_hologram/hologram_predictions.csv holds model predictions
  (Predicted_Class, Confidence), not ground truth. enricher: size from the exact listing (was page-rounded), n_items = 9,722
  zip members.'
