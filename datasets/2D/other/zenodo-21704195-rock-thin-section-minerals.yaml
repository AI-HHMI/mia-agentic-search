notes: 'Modality is polarized-light (PPL/XPL) microscopy of rock thin sections, which has no schema value, so modality is
  other. Derived from the Nanjing University Rock Thin Section Image Dataset (10.11922/sciencedb.j00001.00097); also on Figshare
  and IEEE DataPort (10.21227/sa8g-wr95). Zip listing (peek_archive) and README: 776 JPEG images (1280x1024 RGB) and 97 PNG
  masks in train/ and val/, plus dataset_composition.csv; the Zenodo description says 9,231 masks, but the zip holds 97 mask
  files shared by the 8 registered images of each section (n_items is the image count, 776). Masks made with SAM and reviewed
  by geologists (source mixed). Pixel size not stated on the Zenodo page or README. No paper cited on the Zenodo page. enricher:
  channels 3 (RGB JPEG, README; was null).'
