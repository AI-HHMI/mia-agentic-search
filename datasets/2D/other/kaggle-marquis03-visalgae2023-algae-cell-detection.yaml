notes: 'Kaggle API record (Apache 2.0, 272 MB; 700 training and 300 test images, YOLO labels for the training set), the arXiv
  paper and the challenge GitHub README read. The paper states CC-BY-4.0 for the data (section 3.1.2) while Kaggle lists Apache
  2.0 and the GitHub repo has no license file seen: licence conflict, Kaggle value used. Paper: manual annotation with LabelImg,
  Olympus IX73 inverted microscope with an industrial camera, test annotations kept private by the organisers, so only the
  700 training images are labelled. Frame size, magnification, pixel size, contrast mode (modality recorded as other) and the
  image file format are not stated; Kaggle file listing not seen. Related but different from catalog record
  zenodo-21453325 (AlgaeDet-HR).'
