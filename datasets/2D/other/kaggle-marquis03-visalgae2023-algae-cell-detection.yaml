notes: 'organisms: the six classes of data.yaml (0 Platymonas, 1 Chlorella, 2 Dunaliella salina, 3 Effrenium, 4 Porphyridium,
  5 Haematococcus) occur together in the same images; the class id of each YOLO box gives the species. Kaggle lists Apache
  2.0 while the paper (3.1.2) states CC-BY-4.0 for the data: licence conflict, Kaggle value used. Paper: manual annotation
  with LabelImg, Olympus IX73 with an industrial camera. The Kaggle archive also holds test/test/labels (300 files),
  although the paper says test labels were kept private. Pixel size and contrast mode not stated (modality other). enricher:
  format, channels, n_items, organisms and size from the archive (was unknown).'
