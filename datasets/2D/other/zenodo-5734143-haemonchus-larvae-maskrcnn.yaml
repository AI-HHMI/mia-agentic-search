notes: 'Zip listing (peek_archive, 368 entries): Annotation Data/train (135 jpg + 1 json), Annotation Data/val (46 jpg + 3 json), Mask R-CNN
  Model/mask_rcnn_worm.h5, Motility Output (45 csv per method plus manual), 45 Motility Videos (.avi), README. Paper Methods: 95 images
  manually annotated with VGG Image Annotator (69 train / 26 val), about 10,400 objects of classes egg, L1, L3; the 181 jpgs in the
  listing exceed that count (possibly extra crops or copies), so n_items follows the listing. Image pixel size, illumination mode and
  channel count are not stated (4x objective, Andor Zyla 5.5 sCMOS 2560x2160), so voxel_size_nm is null and modality is other. Videos
  are an extra unlabelled resource for the motility task.'
