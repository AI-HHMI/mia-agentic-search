notes: 'Zip (368 entries): Annotation Data/train (135 jpg + annotation_file.json), Annotation Data/val
  (46 jpg + annotation_file.json, test_annotation.json, test_old.json), Mask R-CNN Model/mask_rcnn_worm.h5,
  Motility Output csvs, 45 Motility Videos (.avi, 21.9 GB), README. Paper Methods: images annotated with
