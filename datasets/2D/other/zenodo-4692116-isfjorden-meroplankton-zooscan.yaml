notes: 'Open Zenodo record (CC-BY-4.0): images.zip 3,062,628,853 B (148,306 JPEGs in 37 category folders)
  and a 217,801,848 B EcoTaxa TSV (162 columns). Modality is ZooScan flatbed imaging of plankton, listed
  as other. enricher: voxel size set to null (was 10.6 um x/y from one row): TSV column process_particle_pixel_size_mm
  is 0.0053 mm (5.3 um, *_narrow samples) or 0.0106 mm (10.6 um, *_large samples), empty for some rows,
  so the dataset has no single pixel size. enricher: channels 1 (was null): sampled JPEGs are grey stored
  as RGB. All 7,104 TSV rows read were validated (annotators named). The description says taxonomy was
  analysed with EcoTaxa with later expert validation (GBIF companion record), hence source proofread.
  Some categories are not organisms (feces, detritus, badfocus, transparent, bubble). No paper is cited;
  the Darwin Core dataset is doi 10.15468/c2m9zk. Organism left empty because the images mix many taxa.'
