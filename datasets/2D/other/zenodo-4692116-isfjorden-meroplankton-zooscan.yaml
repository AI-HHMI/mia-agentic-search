description: Complete export of EcoTaxa project 818, with 148,306 ZooScan images of single plankton objects
  from net, diver-net and pump samples taken in Isfjorden, Svalbard, in 2016 and 2017, sorted into 37
  taxon and object categories (for example Copepoda, veliger, nauplii of Cirripedia, feces, detritus,
  bad focus). Images are provided as JPEGs in one folder per category with a tab-separated EcoTaxa metadata
  table.
