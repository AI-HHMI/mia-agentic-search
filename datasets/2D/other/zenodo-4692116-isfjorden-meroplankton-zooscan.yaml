notes: 'Open Zenodo record (CC-BY-4.0): images.zip 3.06 GB (148,306 JPEG, 3.28 GB unpacked, listed with peek_archive) and a
  218 MB EcoTaxa TSV. Only the first rows of the TSV were read: acq_instrument zooscan, annotation status validated, and
  process_particle_pixel_size_mm 0.0106 (10.6 um, used for voxel size x/y from that first row; other samples were not checked).
  Modality is ZooScan flatbed imaging of plankton, listed as other. The description says taxonomy was analysed with EcoTaxa
  with subsequent expert validation (GBIF companion record); the share of validated rows was not counted, hence source
  proofread. Some categories are not organisms (feces, detritus, badfocus, transparent, bubble). No paper is cited; the Darwin
  Core dataset is at doi 10.15468/c2m9zk. Organism field left empty because the images mix many taxa.'
