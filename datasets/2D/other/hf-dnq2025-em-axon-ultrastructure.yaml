id: hf-dnq2025-em-axon-ultrastructure
title: MicroStructFormer EM Ultrastructure Dataset (EM Ultrastructure Segmentation)
short_name: Mouse spinal cord axon ultrastructure (EM)
description: 540 electron microscopy images (528 train, 12 validation) of mouse cervical spinal cord cross-sections with paired
  semantic segmentation masks for 8 classes (background, abnormality, mitochondria-like organelle, mitochondria, mitochondria outside
  axon, periaxonal space, axon, myelin). Images come from gene-edited Mbp-enhancer mouse lines at P30, P90 and P400 and were used to
  train the MicroStructFormer model.
