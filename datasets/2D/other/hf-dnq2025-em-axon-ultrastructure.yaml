notes: 'Hosted as 13 parquet shards (12 train, 1 validation) with image and label columns; the 540 count is 528 train + 12 validation
  from the dataset card. EM type (TEM vs SEM), magnification and pixel size are not stated on the card, the project website or the
  preprint Methods (per-image scale is read from a calibration table that is not released on the page), so modality is other and
  voxel_size_nm is null. Preprint first-read pages 0-100000 chars only. Labels were created manually and refined over iterative
  rounds of model predictions reviewed by experts (hence source mixed). Licence is non-commercial share-alike. Data formats other = parquet
  (embedded images). Number of annotated images in the preprint is not reported.'
