notes: 'Mendeley Data API record read (one file, SMIDS.zip, 94 MB, CC BY 4.0; 1,021 normal, 1,005 abnormal and 974 non-sperm images).
  The zip could not be listed with peek_archive (server reports no file size), so the image file format and folder layout are not
  verified (formats set to other) and the labels are assumed to be the folder names per the class counts. The paper (Med Biol Eng
  Comput 2020) is not open access; only its abstract was read, which says the labels were identified by experts. Modality (set to
  other), magnification and pixel size are not stated in the sources read. The 3,000 images are the count in the description (1,021
  + 1,005 + 974); no train/test split is provided.'
