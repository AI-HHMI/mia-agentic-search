title: Sperm Morphology Image Data Set (SMIDS)
short_name: Stained human sperm normal/abnormal (SMIDS)
description: 3,000 RGB images of stained human sperm collected with a smartphone-based acquisition approach and labelled as
  normal (1,021), abnormal (1,005) or non-sperm (974). The abnormal class is not split into sub-classes, and images may contain
  noise, several sperm heads or mixed tails. Released as ground truth for a sperm detection and morphology classification system.
