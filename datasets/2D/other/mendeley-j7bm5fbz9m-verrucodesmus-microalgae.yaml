notes: 'Single AlgaeDatasetVr02.zip (2.59 GB, 742 files): images/ 368 JPG (about 2.7 MB each), labels/
  368 .txt, videos/ 6 MP4 (1.8 GB). The Mendeley page says YOLO-compatible labels validated with YOLOv8
  and YOLOv11; the label file read ("Copia de 0001.txt") holds polygon coordinates, so annotations are
  recorded as instance masks (polygons) rather than boxes. Microscope, magnification, staining, pixel
  size and imaging modality are not stated on the Mendeley page or in the zip listing, so modality is
  other. No associated paper found (page lists none; sources checked: Mendeley page, files API, zip listing).
  Annotation procedure and splits not documented. Image channels and resolution not checked. A related
  paper on culture biomass data for the same organism exists but is a different dataset. enricher: verified
  368 JPG + 368 label txt + 6 MP4 in the zip directory; images are RGB 2592x1944 JPEG (channels set to
  3, was null).'
