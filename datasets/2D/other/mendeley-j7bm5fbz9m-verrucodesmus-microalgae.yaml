  notes: 'Mendeley download redirects to an S3 object behind a Cloudflare check for scripted clients;
    listing.py read the S3 URL as a bucket prefix (403), so the zip central directory was read with a
    short range-request zipfile script (78,764 B). probe.py read 3 image headers (all 2592x1944x3 uint8
    JPEG). Sample (one image, one label, ~2.9 MB transferred): image uint8 RGB, min 0, max 255, mean 179.9,
    6.9% of pixels at 255; label file has 7 lines, all class 0, polygons with 10-27 vertices, coordinates
    0.008-0.920 (normalised). Values are from one image. Whether all 368 images share the 2592x1944 size
    was checked only for 3 files. The 6 videos are unlabelled and not inspected. Pixel size, microscope
    and modality remain unknown: not in the zip directory or on the Mendeley page.'
