notes: 'Modality is backscattered-electron SEM, which the schema has no plain-SEM value for, so modality is other. Three tar
  files (features_train_public.tar 24.8 MB, features_val_public.tar 5.2 MB, features_test_public.tar 5.8 MB) plus
  metadata_public.json, so download_url is null and size_bytes is their sum. Sample counts come from metadata_public.json
  (2668 / 563 / 618; true 2177 / 452 / 500, false 491 / 111 / 118). A range read of the validation tar showed the WebDataset
  naming (val_000000.eds.json) but tar files cannot be listed with peek_archive, so label.cls and image.png were not seen
  directly; they are described on the Zenodo page. Pixel size 0.33 um is stated on the Zenodo page. The paper (BHM, Springer)
  is not open access; only its DOI record was read, so annotator details are only what the Zenodo page says (manual
  verification using BSE morphology and EDS). Labels are per-feature true/false classes, not masks.'
