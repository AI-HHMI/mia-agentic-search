notes: 'Modality is backscattered-electron SEM, which the schema has no plain-SEM value for, so modality is other. Three tar
  files (features_train_public.tar 24.8 MB, features_val_public.tar 5.2 MB, features_test_public.tar 5.8 MB) plus metadata_public.json,
  so download_url is null and size_bytes is their sum. Sample counts come from metadata_public.json (2668 / 563 / 618; true
  2177 / 452 / 500, false 491 / 111 / 118). Pixel size 0.33 um is stated on the Zenodo page. The paper (BHM, Springer) is
  not open access; only its DOI record was read, so annotator details are only what the Zenodo page says (manual verification
  using BSE morphology and EDS). Labels are per-feature true/false classes, not masks. enricher: read the validation tar (563
  image.png / label.cls / eds.json triples), so annotations_verified is now true.'
