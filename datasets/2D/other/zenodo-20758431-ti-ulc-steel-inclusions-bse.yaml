id: zenodo-20758431-ti-ulc-steel-inclusions-bse
title: Multimodal SEM dataset of non-metallic inclusions in Ti-ULC steel - BSE images and EDS compositions
short_name: Ti-ULC steel inclusions (BSE-SEM + EDS)
description: 3,849 backscattered-electron image patches of features found by automated SEM/EDS analysis of polished Ti-ULC steel,
  each with its quantified EDS composition (17 elements, wt%) and a manually verified binary label saying whether the feature
  is a true non-metallic inclusion or a false detection. Stored as WebDataset tar files with train (2,668), validation (563)
  and test (618) splits. This is a materials-science SEM dataset, not biological material.
