notes: 'Nine Zenodo files (bulk_images 16.8 GB, outline_images 5.7 GB, individual_images 1.4 GB, outline/properties CSV zips,
  scripts, metadata tables, forams.zip); size_bytes is their sum and download_url is null. individual_images.zip lists
  46,820 .jpg plus 45 CSV files, which is the n_items. CSV and outline tables sit beside the JPEG images. identification_files.zip CSVs give a species or category per object with a confidence score; some categories
  are junk or non-foraminifera objects. Images are reflected-light photographs of picked microfossils (extended depth of
  field), hence modality other; the imaging instrument and pixel size are not stated on the record. The record mentions a
  forthcoming data descriptor, no paper was found by title, so none is cited. No train/val/test split.'
