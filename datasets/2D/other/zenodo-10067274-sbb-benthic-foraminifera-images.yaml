schema_version: '1.2'
id: zenodo-10067274-sbb-benthic-foraminifera-images
title: 'Santa Barbara Basin microfossil images: 46,820 individual object images with species identifications and 2D outlines'
short_name: Benthic foraminifera images with species labels
description: Photographic images from the AutoMorph high-throughput imaging pipeline of more than 36,000 microfossil objects
  from two Santa Barbara Basin sediment cores (about 22,000 benthic foraminifera plus planktonic foraminifera, ostracods,
  pteropods, diatoms, radiolarians, fish teeth and fragments). It provides bulk images with detected objects boxed, extended-depth-of-field
  images of individual objects, per-object identification CSVs (species or general category with a confidence score), extracted
  2D outline coordinates and 2D shape properties.
