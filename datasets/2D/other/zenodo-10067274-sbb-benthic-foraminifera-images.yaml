notes: 'Nine Zenodo files (bulk_images 16.8 GB, outline_images 5.7 GB, individual_images 1.4 GB, outline/properties CSV zips,
  scripts, metadata tables, forams.zip); size_bytes is their sum. individual_images.zip holds 46,820 .jpg (n_items). Some
  categories are junk or non-foraminifera objects. Reflected-light EDF images from a Keyence VHX-7000 digital microscope (paper
  Methods), hence modality other. enricher: paper added, the Sci Data 2024 data descriptor (Europe PMC by title). enricher:
  splits_provided true: forams.zip has train/ 8,653, val/ 1,100, test/ 1,074 images resized to 224x224 (paper). enricher:
  pixel size varies by sample (burned-in image labels; paper Table 4 lists corrected scales 1.2-2.38 um/px), so null. Organism
  left empty: dozens of species labels per object in the CSVs.'
