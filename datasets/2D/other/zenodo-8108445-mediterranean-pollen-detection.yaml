notes: 'Three zips (train, val, test), each with images/ (PNG) and labels/ (YOLO .txt), counted from the zip central directories (13,705 + 2,937 + 2,937 = 19,579 pairs) and one label file read from the test zip. File names contain "EFI_40x" (likely extended-focus images at 40x), but the Zenodo page does not state the microscope, imaging mode, pixel size or how the boxes were made, and no paper is linked on the record or was found with paper.py or a web search; so modality is other, voxel size, organism and annotation source are unknown, and the class-id-to-taxon mapping is not documented in the files read. Image dimensions are not stated.'
