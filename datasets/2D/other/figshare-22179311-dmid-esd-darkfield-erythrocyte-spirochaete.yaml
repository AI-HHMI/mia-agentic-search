notes: >-
  Single 345.6 MB DMID-ESD.rar on Figshare (v2). The Figshare API gives CC BY 4.0; the paper's abstract
  page only says "freely available for non-commercial use", so the license terms are inconsistent between
  sources. The RAR cannot be listed remotely (peek_archive handles zip only), so image format, annotation
  file format (class + localization, probably boxes), splits and image resolution are unverified. The paper
  (Biomed. Signal Process. Control, 10.1016/j.bspc.2025.108595) is not open access and its full text was not
  readable (Europe PMC/Crossref abstract only; ScienceDirect returned 403). Magnification, microscope,
  species and darkfield-vs-other modality enum could not be taken from the paper; modality is 'other'
  because the schema has no darkfield value. Annotation types are inferred from "categorical and
  localization information" in the abstract.
