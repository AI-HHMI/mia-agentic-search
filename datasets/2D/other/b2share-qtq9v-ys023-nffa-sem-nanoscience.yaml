notes: 'The B2SHARE record lists 10 tar files (12.1 GB in total); each file download link is https://b2share.eudat.eu/api/records/qtq9v-ys023/files/<name>.tar/content.
  The image count (18,577), format (JPEG, 1,024 x 728) and folder-per-class structure come from the record description
  and the paper; the paper gives ~10 GB for the tars, the API sums to 12.1 GB. The paper also describes three further,
  related datasets (Hierarchical 1,038 images, Majority 25,537, 100% 25,430) with separate records, not covered
  here; the B2SHARE description of the Majority dataset warns it contains many replicas. Zenodo 7615060 is a converted
  (PNG) half-subset of the Biological folder. Pixel size is not stated (images carry no scientific metadata per
  the record). Checked: B2SHARE API record, paper full text (Europe PMC). enricher: annotations_verified true (tar
  headers show <Class>/<file>.jpg members). modality family: EM (all files are SEM micrographs; SEM has no enum
  value, hence other).'
