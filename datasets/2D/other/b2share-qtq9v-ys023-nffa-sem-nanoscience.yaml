description: 18,577 scanning electron microscope images (1024x728 JPEG) acquired at CNR-IOM Trieste with a ZEISS SUPRA 40 FEG-SEM,
  manually classified by nanoscientists into 10 categories (e.g. particles, nanowires, fibres, films, porous sponge, powder, patterned
  surface, MEMS devices and electrodes, tips, biological) and stored as one tar archive per category.
