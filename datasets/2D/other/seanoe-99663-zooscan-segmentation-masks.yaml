notes: 'Read the SEANOE landing page in full. enricher: the zip (470,024,412 B) has train 14,199, valid 2,515 and test 2,525 image/mask pairs (img_<id>.png with masks/msk_<id>.png; 6,097 of them are _solo_ single objects) plus 24 .ipynb_checkpoints copies, so n_items is 19,239 (was 19,251, estimated); channels 1 (grey stored as RGB). The page gives a pixel size of 0.0106 mm, recorded as 10600 nm. ZooScan is a flatbed scanner rather than a microscope, so
  modality is recorded as other. The page links no paper and none is cited, so no paper was read. Same lab as the ZooScanNet
  classification dataset (a different dataset: classification of single objects, versus separation masks here).'
