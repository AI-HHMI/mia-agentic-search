notes: 'Read the SEANOE landing page in full and listed the zip (470,024,412 bytes, 38,502 PNG files under seg_data_with_5000_solo/
  <split>/masks and images; the "valid" split name was seen, train and test folders were not individually listed). n_items
  19,251 is half the PNG count, assuming one mask per image, and agrees with the page (about 14k plus about 5k vignettes).
  The page gives a pixel size of 0.0106 mm, recorded as 10600 nm. ZooScan is a flatbed scanner rather than a microscope, so
  modality is recorded as other. The page links no paper and none is cited, so no paper was read. Same lab as the ZooScanNet
  classification dataset (a different dataset: classification of single objects, versus separation masks here).'
