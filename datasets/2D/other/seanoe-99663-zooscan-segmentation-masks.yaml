id: seanoe-99663-zooscan-segmentation-masks
title: Segmentation masks of ZooScan images focusing on images with several objects separated by a human operator
short_name: ZooScan plankton segmentation masks
description: About 14k ZooScan vignettes containing several touching plankton objects that operators separated with white
  lines, plus about 5k single-object vignettes, each with a binary mask, as grayscale PNG images and masks in train, validation
  and test splits (about 70/15/15), from Tara Oceans WP2 net samples. Intended for training semantic, instance or panoptic
  segmentation models.
