notes: 'Checked OSF API record, wiki and file listing (single RBCs Holograms.zip, 2.69 GB) and the Data
  in Brief paper (PMC11068518). No dataset license is stated on OSF (node_license null) or in the paper.
  The task is hologram-to-phase reconstruction; phase targets were computed with Trujillo''s method, not
  manually annotated. Pixel size not stated for the sample plane (camera pitch 5.86 um, 40x objective),
  so left null. enricher: zip listed by range requests (73,728 PNGs; split folders are Training/ and Validation/,
  the paper says Testing); download_url is now the direct OSF file link (was the project page); annotations
  verified from the listing and a sample.'
