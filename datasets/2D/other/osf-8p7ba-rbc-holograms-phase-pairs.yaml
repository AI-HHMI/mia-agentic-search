title: Human red blood cell off-axis holograms paired with reconstructed quantitative phase images
short_name: RBC hologram-phase pairs (digital holography)
description: 'Paired dataset of 36,864 off-axis holograms of human red blood cells (Carolina Biological slide) and their
  reconstructed quantitative phase maps (256x256 px patches cropped from 300 recorded 1920x1200 holograms, augmented
  by rotations/flips). Zip with folders Holograms/ and Phase/, each split into Training (29,491) and Testing (7,373).
  Recorded with an off-axis telecentric digital holographic microscope (532 nm, 40x/0.65 NA) and intended for training
  end-to-end learning-based phase reconstruction.'
