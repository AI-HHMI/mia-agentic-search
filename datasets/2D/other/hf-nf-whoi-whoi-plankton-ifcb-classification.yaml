notes: 'Mirror: the card only says ''From https://hdl.handle.net/10.1575/1912/7341'' (WHOI
  repository, behind a captcha; its record, license and file list were not read). HF:
  956,867 rows in 19 Parquet files (669,806 / 95,686 / 191,375), 100 class names, plus
  whoi-plankton.tar.gz. The paper (arXiv 1510.00745) states >3.4M images in 70 classes and
  its data link (github.com/hsosik/WHOI-Plankton) >3.5M images in 103 categories, so this
  mirror is a subset or other version; not reconciled. No license on the HF card, GitHub
  repo or arXiv page. Pixel size not stated. Another mirror
  (project-oceania/whoi-plankton) is gated. enricher: size = HF file listing (was 27.3 GB
  repo storage); formats png, channels 1 from sampled PNG headers; download_url = the
  tar.gz (class folders of PNGs).'
