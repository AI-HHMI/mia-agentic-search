  notes: 'Listing: Hugging Face API, 22 files, 18,240,347,161 B, complete. Read the first 256 KB of validation-00000-of-00002.parquet:
    images stored as raw PNG bytes (33 PNG signatures in 256 KB); 8 parsed with a stdlib script: all 8-bit grayscale
    (colour type 0), 105x54 to 388x45 px, values 6-255 across the 8 (value_range from these 8 only). Read the first 128 KB
    of whoi-plankton.tar.gz (gzip+tar headers only): top folder consolidated_plankton/ with one folder per class (Ditylum,
    detritus, bubble, mix_elongated, ...), PNGs named like IFCB1_2009_045_173723_00808.png; macOS ._ and PaxHeader entries.
    Whether the tar.gz and the Parquet hold exactly the same images is not verified (both about 9.1 GB). Labels not decoded
    (no Parquet reader in the allowed tools). Voxel size not found; checked: HF card, PNG headers, arXiv 1510.00745 full
    text, github.com/hsosik/WHOI-Plankton README, Crossref record of 10.1575/1912/7341; WHOI repository pages are behind a
    captcha; IFCB instrument papers (Olson & Sosik 2007, Sosik & Olson 2007) have no full text in Europe PMC.'
