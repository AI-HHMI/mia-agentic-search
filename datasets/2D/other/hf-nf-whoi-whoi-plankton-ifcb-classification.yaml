notes: 'Mirror: the card only says ''From https://hdl.handle.net/10.1575/1912/7341''
  (WHOI repository, which returned 403 in this run, so the original record, license
  and file list were not read). Counts are from the HF viewer and API: 956,867 rows
  in 19 Parquet files (669,806 / 95,686 / 191,375), 100 class names, plus a 27 GB
  whoi-plankton.tar.gz in the repo; total repo size 27.3 GB. The paper (arXiv 1510.00745)
  states over 3.4 million images in 70 classes from the Martha''s Vineyard Coastal
  Observatory, so this mirror is a different subset or version; not reconciled. No
  license on the HF card or arXiv page (arXiv license covers the paper only). Image
  encoding inside the Parquet is not stated on the card, so formats is ''other'' (Parquet).
  Pixel size not stated. Another mirror (project-oceania/whoi-plankton, MIT per tags)
  is gated and was not readable.'
