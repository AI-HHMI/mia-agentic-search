description: >-
  4,591 SEM images of defects on a single production layer of unstructured semiconductor wafers, each with an expert-validated binary segmentation mask and one of six defect classes
  (class 6 = no visible defect, class 5 has only four images); an enhanced version of the original Carinthia dataset (classification only).
