notes: >-
  Semiconductor-inspection SEM (no organism, no associated paper found on the record; related item is the original Carinthia dataset, 10.5281/zenodo.10696644, from which this is derived).
  Archive listed with peek_archive: 4,591 jpg in data/images, 4,591 png in data/masks, data/carinthia-s.csv. Pixel size and SEM settings are not stated on the record or in the dataset description
