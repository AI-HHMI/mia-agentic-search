notes: 'Image-level classification labels (10 categories), not segmentation. B2SHARE record (now 862nr-cn036, same
  DOI) lists 10 category tars, 16,727,820,800 B. Paper: the 100% set is the original SEM dataset (on main as b2share-qtq9v-ys023-nffa-sem-nanoscience,
  18,577 images) plus ~7,000 newly labelled images, keeping only labels all experts agreed on; it overlaps heavily
  with that record. Paper recommends a 90/10 split; none provided. Pixel size not stated (no instrument metadata;
  magnification varies). enricher: annotations_verified true (tar headers show <Class>/<file>.jpg); size from B2SHARE
  API file list; date_published from API. modality family: EM (SEM, no enum value, hence other).'
