title: NFFA-EUROPE 100% SEM Dataset (25,430 labeled nanoscience SEM images)
short_name: NFFA nanoscience SEM categories (SEM)
description: 25,430 scanning electron microscopy images of nanoscale samples acquired on a ZEISS SUPRA 40 FEG-SEM
  at CNR-IOM (Trieste), sorted into 10 morphology categories (porous sponge, patterned surface, particles, films
  and coated surfaces, powder, tips, nanowires, biological, MEMS devices and electrodes, fibres). Only images whose
  label was confirmed by all expert reviewers are included.
