notes: 'Image-level classification labels (10 categories), not segmentation. Record page lists 10 category tar files (~16.7 GB total); the paper says images are 1,024x728 JPEGs without instrument metadata. Pixel size is not stated on the record page or in the paper. Paper recommends a 90/10 train/test split but none is provided. The same authors released sibling versions (original SEM dataset, Majority, Hierarchical) under other B2SHARE DOIs; only the 100% criterion set is covered here. Tar contents not listed (B2SHARE files not peeked); category folders per the paper. License CC-BY on the record page.'
