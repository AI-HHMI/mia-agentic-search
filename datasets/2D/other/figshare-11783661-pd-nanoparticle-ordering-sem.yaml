notes: 'Two figshare items: Dataset 1 (10.6084/m9.figshare.11783661, 750 .tif, 984 MB, CC BY 4.0) and Dataset 2 (10.6084/m9.figshare.11783667, 250 .tif, 328 MB, CC BY 4.0); this record covers both (landing page and DOI are Dataset 1; size is the sum). A third figshare item (11926929) only holds metadata. Hitachi SU8000 FE-SEM, secondary-electron mode, 10 to 30 kV. Modality is SEM, which the schema lacks, so other. Pixel size is not given in a field; each image has a 134 px caption strip with the scale and magnification, and the description CSVs list magnification, so voxel_size_nm is null. Pattern labels were read from labels_ordered.csv (first rows seen); the paper reports the labels as visual inspection of a representative sample (50 images in its Fig 2), so label completeness for all 750 images was not verified. The datasets have no train/test split.'
