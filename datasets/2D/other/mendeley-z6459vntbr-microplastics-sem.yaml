notes: 'Mendeley file listing (public API): dataset1.zip 758 MB, dataset2.zip 113 MB, dataset3.zip 1.02
  GB, result.zip 7 MB, result_weights.zip 4.19 GB (model weights, not part of the image data; size_bytes
  counts dataset1-3 only). Zip contents listed with peek_archive: dataset1 holds 237 image/label PNG pairs
  in [datasets_full]_Exp1_Exp4 plus a subset by shape class; dataset2 holds instance-segmentation label_gray
  PNGs and counts; dataset3 holds the original SEM TIFFs (241) with per-image .txt acquisition settings
  and ground-truth labels. The 237 micrograph count is from the paper abstract (full text not open access,
  abstract only read). Modality is SEM, which the schema lacks, so recorded as other. The download URL
  redirects to a signed S3 object, so no stable direct link is recorded. enricher: per-image .txt settings
  in dataset3 are Hitachi SU5000 files with PixelSize varying by magnification (e.g. 992.19 at x100),
  so voxel_size_nm stays null.'
