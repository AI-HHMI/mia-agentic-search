notes: 'Modality, microscope, staining and pixel size are not stated on the dataset card, the GitHub READMEs (seg-lib, ENS_dataset) or the abstract; the MDPI paper page returned 403 and Europe PMC has no full text, so modality is "other". The zip (12.3 MB, 189 files) holds only per-image LabelMe JSON files (folders per animal tag) with the PNG embedded as base64. Only well-defined neurons were labelled, hence partial coverage. Subset of the larger ENS dataset (1248 images, 13 rats).'
