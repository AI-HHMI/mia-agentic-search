notes: Tar size 941,868,032 bytes (Content-Length). Read the SEANOE landing page in full. The download is one tar; its first
  headers show <Name>/imgs/<taxon>/<objid>.png, so images are PNG, but the tar was not fully listed. The page states that
  every identification was reviewed by at least one operator but a few mistakes may remain. Pixel size is not stated on the
  page (measurements are in pixels). No paper is linked on the page and none was read. The instrument is not a microscope,
  so modality is recorded as other. A sibling of the ZooScanNet and ZooCAMNet datasets, but a different instrument and sample
  set.
