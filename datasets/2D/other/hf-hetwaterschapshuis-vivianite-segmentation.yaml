notes: 'Dataset card says only "microscopy"; no instrument, imaging technique (modality set to other), pixel size,
  magnification or sample preparation is stated on the card, the file listing or annotations.xml, and there is no
  linked paper (checked: card, HF API record, file listing, CVAT annotations.xml). The card says tiles are 896 x 916
  px while the HF viewer shows width 896; the exact height was not verified. 36 image/mask pairs in a 3x4 tile grid
  per sample (00017: 12, 0002: 12, 0003: 12) per the file listing; the CVAT job lists 168 frames, so the released
  set is a subset. enricher: size_bytes 46,158,997 B from the full HF file listing (was HF usedStorage 44,364,857 B); tiles confirmed 896 x 916 px. Authors given as the
  organisation Het Waterschapshuis (copyright holder). No split is provided; the card advises splitting by sample_id.
  Files are downloaded from the HF repository (no single archive).'
