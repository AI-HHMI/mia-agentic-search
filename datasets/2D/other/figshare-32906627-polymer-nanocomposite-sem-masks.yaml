notes: 'Two zips (SEM_MASK.zip 39 MB: SEM/ 106 files and MASK/ 100 files; Material_Based_CAT.zip 38 MB:
  the same data in composition folders) listed with peek_archive. enricher: 100 SEM images pair with a
  mask (mask = image stem + "M", e.g. CB4SF0(60) -> CB4SF0M(60)); 6 have none (Z(40), Z(80), Z_2(40),
  CB4SF3_1/_12/_13(60)). Microscope TESCAN MIRA3 LMU at 10 kV and 15,000x (SE detector for UHMWPE/zeolite,
  InBeam for POM samples), three experts annotated each image per the record description; how the three
  annotations were merged is not stated. Pixel size not found and no paper linked; no SEM value in the
  modality enum, so other. The two zips contain overlapping copies, so n_items counts the 106 SEM images
  once.'
