  notes: 'Listing: tools/listing.py --expand-zips on the Zenodo record: 1 zip, 2,368,011,800 B (file-listing, complete), 4,432
    members (16.2 GB uncompressed). Probed one _comp, one _filtered, one _cell and one _sphere TIFF; sampled the _filtered/_cell
    and _comp/_sphere pairs (values from one crop only). Raw TIFFs are plain shaped TIFFs (51 pages, no axis tag); the README
    says image planes are channels (ref_plane_number), so axes cyx. normalization unknown: IMC counts, compensated; nothing
    states a rescale. Voxel size: paper says "lateral resolution of 1x1 um", README gives image size "in pixels/um" and centroids
    in um. Labels are automatic (Ilastik + CellProfiler, paper Methods). Download: the zip and its members pass --download-check
    (range requests).'
