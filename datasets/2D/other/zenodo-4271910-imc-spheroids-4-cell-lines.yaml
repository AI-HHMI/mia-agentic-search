notes: 'Zip listing: 4,432 files; images/ has 736 _comp and 736 _filtered TIFFs, masks/ has 736 each of cell, cyto, nucleiexp
  and sphere TIFFs, plus CSV tables. The README says objects were found by computer vision; the paper used Ilastik and CellProfiler,
  so masks are automatic. Cell lines (paper): T-47D, HT-29, DLD-1, T-REx-293. Publication date is not stated on the page,
  README or paper text read. Modality is other because IMC is not in the schema list. This is a processed export; raw data
  is at 10.5281/zenodo.4055780. enricher: voxel size 1000x1000 nm from paper ("lateral resolution of 1x1 um") and README (image
  size in pixels/um) (was null); channels 51 from TIFF headers (was null).'
