    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 0
    - 28
    encoding: instance-ids
    classes:
    - id: null
      name: cell
    alignment: same-grid
    alignment_notes: 'Pairing rule: images/<stem>_comp.tiff pairs with masks/<stem>_cell.tiff, _cyto.tiff and _nucleiexp.tiff;
      the sphere mask is masks/<stem with "_cropmask" inserted before "_l<n>">_sphere.tiff (image_meta.csv mask_filename_*
      columns give the mapping). Same 2D grid as the raw yx planes (115x102 in the sample). Values = object_number in cell_obs.csv
      (README); 28 cells in the sample.'
  - role: label
