    - 1341
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'FullStackComp: compensated for metal spillover (README). 51 pages = channels; plane-to-marker map is
      ref_plane_number in *_var.csv (README). Crop size varies per sphere.'
  - role: other
    path_pattern: '*.zip/images/*_filtered.tiff'
    format: tiff
    axes: cyx
    shape:
    - 51
    - 115
    - 102
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 0
    - 1341
    normalization: unknown
    alignment: same-grid
    alignment_notes: 'FullStackFiltered: raw counts filtered for strong outliers, same channel order as _comp (README); used
