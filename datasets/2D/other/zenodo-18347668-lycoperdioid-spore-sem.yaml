notes: 'peek_archive of the zip lists 800 tif (2.3 GB uncompressed) in five folders of 160 images, named 1-Lycoperdon perlatum
  ... 5-Lycoperdon excipuliforme with GenBank accessions; no metadata file was in the zip, although the Zenodo text mentions
  metadata. The paper (Sci Rep, Europe PMC full text) gives the microscope, 40,000x magnification and balanced classes; the
  paper makes its own stratified train/validation/test split, which the zip does not provide. The label is the species of
  the specimen, taken from folder names, not a per-image annotation. SEM has no matching modality enum value, so modality
  is other. enricher: pixel size 7.285 nm from the TIFFs'' FEI metadata tag (Scan PixelWidth=PixelHeight=7.28516e-09 m, HorFieldsize
  7.46e-06 m over 1024 px; same in 4 files from 4 species folders) (was null). organisms: one per folder, species = folder
  name prefix 1-5. modality: single-beam FE-SEM of spore surfaces (electron microscopy family); no schema value fits, so other.'
