notes: 'peek_archive of the zip lists 800 tif (2.3 GB uncompressed) in five folders of 160 images, named
  1-Lycoperdon perlatum ... 5-Lycoperdon excipuliforme with GenBank accessions; no metadata file was in the zip,
  although the Zenodo text mentions metadata. The paper (Sci Rep, Europe PMC full text) gives the microscope, 40,000x
  magnification and balanced classes; the paper makes its own stratified train/validation/test split, which the zip
  does not provide. The label is the species of the specimen, taken from folder names, not a per-image annotation.
  Pixel size is not stated (the paper says 300 dpi and 40,000x), so voxel_size_nm is null. SEM has no matching
  modality enum value, so modality is other.'
