notes: 'Non-biological sample (textile) imaged with a 1000x, 2 MP digital microscope; no schema modality
  fits so modality is other. Labels are 12 air-permeability classes defined by a textile specialist from
  measured values. The fabrics are coded by zigzag angle (a, w, s). Pixel size and calibration are not
  stated. Fivefold cross-validation was used in the paper; the shipped files are train.txt, val.txt and
  test.txt. enricher: data.rar headers list 900 JPEGs in 45 fabric folders named with the internal codes
  d/g/nz (= a/w/s per README); class labels are only in codes.rar (not read), so annotations_verified
  stays false. size_bytes is now the Zenodo listing total (was data.rar only).'
