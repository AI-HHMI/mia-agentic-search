notes: 'Non-biological sample (textile) imaged with a 1000x, 2 MP digital microscope; no schema modality fits so modality is other. The
  archives are RAR files, which peek_archive cannot list, so the image count (900: 730 training and 170 test samples, Table 4 of the
  paper, full text read) and the JPEG format come from the paper, not from a file listing; annotations_verified is false. Labels are 12
  air-permeability classes defined by a textile specialist from measured values and encoded in file names (a4x4-40-1.jpg style). The
  fabrics are coded by zigzag angle (a, w, s). Pixel size and calibration are not stated. Fivefold cross-validation was used in the
  paper; the shipped files are train.txt, val.txt and test.txt.'
