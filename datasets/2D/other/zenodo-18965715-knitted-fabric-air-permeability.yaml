title: Microscopic Image Dataset for Air-Permeability Classification of Patterned Knitted Fabrics
short_name: Knitted fabric microscope images, 12 classes
description: About 900 RGB JPEG microscope images (1000x, 2 MP digital microscope) of 45 patterned flat-knitted
  acrylic fabrics, each labelled by the filename with one of 12 air-permeability classes (A to L, derived
  from ISO 9237 measurements). The deposit has the images (data.rar), code with train/val/test annotation
  files and a pre-trained VGG19 model (codes.rar).
