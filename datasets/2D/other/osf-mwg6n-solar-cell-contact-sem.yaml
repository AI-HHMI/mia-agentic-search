notes: >-
  Materials-science SEM (solar-cell cores, no organism). The OSF component holds Images (77 PNG, 39.4 MB), Masks (77 PNG, 1.9 MB), Models (unet.pth, 569 MB) and Scripts; files are individual
  OSF files with no single archive, so download_url is null. License is BSD 3-Clause as set on the OSF project (API license record); it is a software license applied to data. The wiki lists image sizes
  1024x768 and 2048x1536, no pixel size (voxel_size_nm null), no annotation procedure and no associated paper, so annotation source is unknown. Mask pixel values were not inspected; the wiki names the five classes
  but not their encoding. Sibling components of the same benchmark (Fractography SEM gdwyb was empty at fetch time; XCT, AFM and high-speed-camera sets are not EM/optical microscopy images of interest here)
  are not included. Fetched via the OSF API, the landing page itself needs JavaScript.
