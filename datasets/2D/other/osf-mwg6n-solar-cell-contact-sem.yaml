notes: 'Materials-science SEM of solar-cell cores: no organism. Modality: SEM (electron microscopy); the schema has no plain SEM value, hence other. OSF component: Images (77: 55 PNG + 22 JPEG), Masks (77
  PNG), Models (unet.pth, 569 MB), Scripts. Individual OSF files, no archive. License BSD 3-Clause from the OSF project license record (a software license applied to data). The wiki gives image sizes 1024x768
  and 2048x1536 but no pixel size and no annotation procedure; no paper found (a TMS 2024 talk abstract only), so annotation source is unknown. Sibling benchmark components (Fractography SEM, XCT, AFM,
  high-speed camera) are not included. enricher: formats png+jpeg (22 images are JPEG; was png); mask colour encoding from the authors'' evaluation script.'
