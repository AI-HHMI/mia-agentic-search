  notes: 'Listing: tools/listing.py on the HF repo, 6,499 files, 4,094,672,745 bytes, complete, exact
    (train 2,001 and test 164 triplets + 2 source CSVs). Sample: test index 147 (smallest), raw and levelled
    TIFF and mask CSV, 164 KB in total; values from this one sample. The raw sample has mean ~0 (2.8e-9),
    std 0.64 nm; the README says z is in nm; a mean of ~0 suggests the heights are offset-subtracted,
    so normalization is unknown. Mask CSV read with numpy: shape 128x128, values {0,1}. Voxel size not
