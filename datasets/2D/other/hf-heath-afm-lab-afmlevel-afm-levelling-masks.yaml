notes: 'Counts from the file tree (6,499 files, 4.09 GB): train 2,001 triplets, test 164 triplets (Image, Levelled and Mask folders). The levelled images
  are manual (NanoLocz); the card says the masks are derived from the levelled images by a sigmoid and Otsu threshold, hence source mixed. Pixel and scan size
  are deliberately omitted by the authors (images 128x128 to 1024x1024, z in nm), so voxel size is null. Contributors are listed on the card (Leeds AFM Facility,
  Scheuring and Heath labs, Pyne Lab, Paderborn); part of the images come from published CC BY datasets (figshare 13116890, Sheffield 26869993, Zenodo 14275812).
  The card has no paper yet (citation TODO), so none was read. Not independent images: up to 20 frames per HS-AFM movie.'
