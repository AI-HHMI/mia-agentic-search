notes: 'Zip lists 8,744 PNG crops in three class folders (counts from peek_archive). Record text says an ''other''
  class exists but is only available on request, so it is not included. Associated paper per a web search result:
  Orenstein et al., Mar Ecol Prog Ser, doi 10.3354/meps14072; the full text could not be retrieved with tools/paper.py,
  so it is not listed in publications. Modality ''other'': the Scripps Plankton Camera is an in situ imaging system
  whose illumination mode is not stated in the pages read. Pixel size not stated. Organism left empty: record names
  the copepod genus Oithona and the parasite Paradinium; no species given. Also in the record but not part of this
  entry: count text files and an environmental CSV. Authors from Zenodo creators. enricher: size_bytes counts all
  4 files (image zip + count tables + shore-station CSV).'
