notes: 'CoLuS_Dataset.zip (165 MB, peek_archive): 300 JPG in images/, 300 PNG in labels/, instances_default.json
  (COCO; categories: lumen; images 1024 x 1024). Zenodo record 15096567 is a newer version of concept
  8369375 (first version 8369376 holds the same zip); 15096567 also adds images_train/images_test/labels_train/labels_test
  .dataset files, named like train/test lists (enricher: opened, plain-text lists of 200 train / 100 test
  paths, so splits_provided true). The paper is not open access (Europe PMC has none; ScienceDirect returned
  403; Crossref has no abstract), so imaging modality, pixel size, species, who annotated and how are
  unknown: modality is "other", voxel size null, organism empty. The GitHub README only lists contributors
  and links. Size now all 5 files.'
