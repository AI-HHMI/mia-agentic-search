notes: 'Hosted on Hugging Face as parquet (data.formats other: images are embedded PNG in parquet, 395 detection files 39.2 GB and 11 classification files 2.9 GB per the Hub file listing; size_bytes is their sum). The card says image counts of 10,433 with splits 7,282 / 1,566 / 1,584 (these are the classification crops; the detection split sizes were not separately stated). Imaging modality, magnification, microscope, pixel size and channels are not stated on the card (called only high-resolution light microscopy), so modality is other and channels 3 is assumed from PNG colour images, not verified. Who annotated the boxes and how is not stated (annotation source unknown); no paper is cited, only the dataset DOI. Organism list left empty: taxa are genera/species names on the card, not checked against NCBI. Checked: dataset card, README, Hub file listing.'
