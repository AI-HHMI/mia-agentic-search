notes: 'OSF project 5u6pg (CC-By 4.0 per OSF API) holds SSNOMBACTER.zip (1.67 GB, 8989 members: 4400 .tiff
  + 4400 .gsf Gwyddion files, 186 .txt acquisition files, 3 .db), matching the paper''s 4,400 images.
  The only labels are species/strain names in file and folder names, so this is a classification set;
  the paper offers restoration, segmentation and registration as uses but distributes no masks or clean/noisy
  pairs, hence confidence 0.6. s-SNOM is a near-field scanning technique, so modality is other. Pixel
  size not stated; it varies by FOV (acquisition .txt: e.g. 10x10 um scan area, 300x300 px). No split
  provided. The .gsf copies are in addition to tiff. organisms: each species = its folder Dataset of TIFF
  files/<species>/ (same in GSF). enricher: n_items 4164 -> 4400 and all 15 species from the zip listing.'
