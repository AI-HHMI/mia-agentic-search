notes: 'OSF project 5u6pg (CC-By 4.0 per OSF API) holds SSNOMBACTER.zip (1.67 GB, 8989 members: 4164 .tiff + 4164 .gsf Gwyddion files, 176 .txt acquisition
  files, 3 .db). Paper says 4,400 images; the listing shows 4,164 per format. The only labels are species/strain names in file and
  folder names, so this is a classification set; the paper offers restoration, segmentation and registration as uses but
  distributes no masks or clean/noisy pairs, hence confidence 0.6. s-SNOM is a near-field scanning technique, so modality
  is other. Pixel size not stated (FOVs 10x10, 2x2, 3x3 or 4x4 um). Organism list shows six of the 15 species; others are
  in the paper table. No split provided. The .gsf copies are in addition to tiff.'
