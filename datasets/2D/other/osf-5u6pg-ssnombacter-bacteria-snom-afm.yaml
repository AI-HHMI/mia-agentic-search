title: 'SSNOMBACTER: A collection of scattering-type scanning near-field optical microscopy and atomic
  force microscopy images of bacterial cells'
short_name: Bacteria s-SNOM and AFM nanoscale images
description: Registered s-SNOM (near-field optical) and AFM images of 15 bacterial species (18 strains,
  including ESKAPE pathogens), acquired on a NeaSNOM microscope at 1,550 nm with at least three 10x10
  um fields of view per strain plus higher magnification regions, including glass reference areas. Each
  field of view is a folder of amplitude/phase and topography channels named by strain and FOV, usable
  for strain/species classification, restoration or segmentation work (the paper shows manually delineated
  bacteria only as an example, not as released masks).
