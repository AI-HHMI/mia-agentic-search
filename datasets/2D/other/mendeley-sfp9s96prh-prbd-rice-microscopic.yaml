notes: 'Borderline microscopy: images were taken of single kernels with a USB digital microscope camera (HP Wide Vision HD, stated 1000x zoom, 640 x 480 JPG), not a research microscope. Modality is other. Pixel size not stated on the Mendeley record or in the paper. The Mendeley record lists 10,000 files (2000 originals and 8000 augmented, 200 and 800 per class); the paper text also says about 2010 originals and 8010 augmented, but its folder table sums to 2000 and 8000. Folder layout (Original_images and Augmented_images, ten class sub-folders each) is from the paper. Augmented images derive from the originals, so splits must be made before augmentation. The paper reports a DenseNet201 baseline with an 80:10:10 split of its own; no split files are provided.'
