notes: 'Aggregate of 15 source collections whose images keep their own licences (MIT, CC BY, CC BY-SA, CC BY-NC per LICENSE.md; the README table lists NC for several sources where
  LICENSE.md says CC BY, so terms must be resolved per source via each record dataset field); Planktonzilla metadata is CC BY 4.0 and
  the compilation CC0. Imaging systems include true microscopes (IFCB, FlowCAM, PlanktoScope) and also scanners and in-situ cameras (ZooScan, UVP), so not every image is
  microscopy. HF listing shows 189 Parquet shards (one train split of 17.4 M rows); the paper mentions reproducible
  splits but none is visible as a separate split in the repo, so splits_provided is false. Pixel size is not given (variable resolution). Organism taxa vary by row.'
