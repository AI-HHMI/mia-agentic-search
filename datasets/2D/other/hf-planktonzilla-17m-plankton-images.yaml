title: 'Planktonzilla-17M: unified plankton image dataset with harmonized taxonomic labels'
short_name: Planktonzilla-17M plankton images (taxonomy)
description: 17,404,047 plankton and particle images aggregated from fifteen public collections (UVP5/UVP6, WHOI
  IFCB, JEDI, ZooScan, ZooCAM, ISIIS, PlanktoScope, FlowCAM, MedPlanktonSet, SYKE-IFCB, ZooLake and others, thirteen
  imaging systems), each with the source label mapped to WoRMS taxonomy (599 classes), plankton versus non-plankton
  flags, qualifiers and geo-environmental metadata, stored as Parquet with embedded RGB images.
