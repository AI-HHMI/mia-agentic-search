notes: 'One 509 MB zip with 50 class folders (peek_archive: 63,075 entries, including macOS ._ metadata files); the
  record page states about 63,000 images, which is used for n_items. The record says the image names can refer
  to older, since merged classes. This is the training set of Kraft et al. 2022; the 2021 Utö evaluation set
  is a separate B2SHARE record (SYKE-plankton_IFCB_Utö_2021, PR b2share-w7y96-6jd66-syke-ifcb-uto-2021) and
  the larger 2025 update is on Zenodo (zenodo-17601020). Voxel size derived from the paper statement "image
  resolution of roughly 3.5 pixels per µm" (about 286 nm), approximate, images are crops of varying size.
  Flow-cytometer images, so modality is other.'
