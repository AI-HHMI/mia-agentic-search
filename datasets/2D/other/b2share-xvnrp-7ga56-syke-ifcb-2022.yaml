notes: 'One 509 MB zip with 50 class folders (63,075 entries: 63,074 PNG plus the info PDF). The record
  says the image names can refer to older, since merged classes. This is the training set of Kraft et
  al. 2022; the 2021 Utö evaluation set is a separate B2SHARE record (SYKE-plankton_IFCB_Utö_2021, PR
  b2share-w7y96-6jd66-syke-ifcb-uto-2021) and the larger 2025 update is on Zenodo (zenodo-17601020). Voxel
  size derived from the paper statement "image resolution of roughly 3.5 pixels per µm" (about 286 nm),
  approximate, images are crops of varying size. Flow-cytometer images, so modality is other. enricher:
  n_items 63,074 counted in the zip (was 63,000 stated; the ._boxy names are images of old class Pennales_sp._boxy,
  not macOS files); channels 1 (was null).'
