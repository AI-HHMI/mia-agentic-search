notes: 'No labels: the data support unpaired image-to-image translation (CycleGAN, unsupervised training per the
  paper) from UV-PARS to H&E style, recorded as task other. The paper states patches were 256x256 px cut from scans;
  the PNG/TIFF dimensions, and which of the UV-PARS channels each PNG holds, were not read from headers. Zip listings
  (peek_archive) give the Train/Validation/Test folder counts above; the paper reports an 80/10/10 style split only
  implicitly, derived here from the file counts. Pixel size: paper gives ~247 nm effective for the brightfield scans
  and 250 nm UV-PARS sampling; 250 nm used. The paper cites 10.5281/zenodo.7981075 for the same breast/prostate
  data and pre-trained models (Pre-Trained Models.zip); that record lacks the brightfield zip, so this later record
  is used. Authors list is as shown by Zenodo (only given
  names for two).'
