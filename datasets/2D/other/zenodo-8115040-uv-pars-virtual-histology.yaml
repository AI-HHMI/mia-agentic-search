title: UV-PARS Virtual Histology
short_name: UV-PARS and H&E breast/prostate patches
description: Training, validation and test image patches and pre-trained CycleGAN models for virtual H&E staining
  of unstained human breast and prostate tissue imaged with ultraviolet photoacoustic remote sensing (UV-PARS) microscopy.
  Breast Tissue Data.zip (15,000 PNGs) and Prostate Tissue Data.zip (20,000 PNGs) are split into Train/Validation/Test
  (80/10/10 %); Brightfield H&E Data.zip holds 28,000 TIFF patches of true H&E-stained brightfield sections (12,000
  breast, 16,000 prostate) used as the unpaired target style.
