title: A Comprehensive Benchmark Dataset for 2D Organoid Image Segmentation and Object Detection
short_name: 2D organoid segmentation and detection benchmark
description: Benchmark compiled from several organoid image sets (OrganoidBasic, lung, cocoTellu, stomach,
  duodenal biopsy and mouse/human intestinal organoids). One zip holds images with masks for segmentation,
  a second holds images with COCO JSON and YOLO txt labels for detection, both with train/validation/test
  splits.
