notes: 'Two zips, no paper or README found (Europe PMC title search found none). Segmentation zip (34,989 files): sub-sets
  Dataset_organoids (train 5584 / val 1396 / test 6981 images with matching masks), MouseOrganoids, OrganoidBasic_v20211206,
  OriginalData, stomach_intance; detection zip (20,099 files): Human Intestine, Human Lung, Mouse Intestine, OrganoidBasic,
  stomach_intance with train/val/test 2017-style COCO folders. Imaging modality, magnification, pixel size and annotation
