notes: 'Modality is conventional (surface) scanning electron microscopy, which the schema has no value for, hence other. Found via the ASTIH collection page (dataset SEM1). DANDI metadata: 57 assets, 12.5 MB, license CC-BY-4.0, 10
  samples from 8 subjects (published version 0.250512.1626; no DOI in the API record, so doi is null). Pixel size is
  not one value: per-subject BIDS sidecars give 0.07-0.18 um (rat1 0.18, rat2 0.093, rat3/rat4 0.1, rat5/rat6 0.13,
  rat7/rat8 0.07 um); the README and paper say 0.05-0.18 um, so voxel_size_nm is null. Images are small crops, so
  n_items=10 is at the low end of the size threshold. The paper full text was read for acquisition and labelling
  (labels cross-checked by two researchers); its data statement points to the White Matter Microscopy Database (OSF)
  for part of the data. Download via the DANDI API/CLI (dandi download DANDI:001442), no single archive. Sources
  checked: DANDI API record, asset listing, sidecars, README, samples.tsv, ASTIH page, AxonDeepSeg paper full text
  (Europe PMC).'
