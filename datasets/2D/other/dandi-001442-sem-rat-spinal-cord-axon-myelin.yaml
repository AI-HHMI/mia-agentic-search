notes: 'Modality is conventional scanning electron microscopy, which the schema lacks, hence other. Found via the ASTIH page
  (SEM1). DANDI: 57 assets, 12.5 MB, CC-BY-4.0, 10 samples from 8 rats; no DOI in the API record. Pixel size varies per image:
  sidecars give 0.07-0.18 um (README/paper: 0.05-0.18), so voxel_size_nm is null. Small crops, so n_items=10 is at the size
  threshold. Sources checked: DANDI API record, asset listing, sidecars, README, ASTIH page, AxonDeepSeg paper full text (Europe
  PMC).'
