title: SEM Images of Rat Spinal Cord with Axon and Myelin Segmentations
short_name: Rat spinal cord axons/myelin (SEM)
description: 10 scanning electron microscopy images (small crops of larger mosaics) of cervical rat spinal cord from 8 animals,
  acquired by several researchers in 2015-2017, with manual axon, myelin and axon+myelin segmentation masks (PNG) in BIDS
  microscopy layout. Touching fibers are separated by a 1-pixel delineation in the masks. SEM dataset of the AxonDeepSeg project
  (ASTIH collection).
