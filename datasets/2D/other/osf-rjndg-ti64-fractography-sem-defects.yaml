notes: 'Materials-science SEM (no organism); the schema has no plain SEM value, hence modality other.
  OSF component rjndg: Images 100 PNG (16-bit 1024x1024), Masks 100 PNG (8-bit), Models one 1.49 GB U-Net
  h5, Scripts 2 .py. Pixel size 202.73 nm and instrument (VEGA3 SBH, 1333x) from the parent project wiki
  (gdwyb), which covers all three sub-datasets. Siblings with 100 images each: lack of fusion only (rpj4t),
  keyhole only (9ta3v); this is the combined one. License BSD 3-Clause from the OSF project license record
  (a software license applied to data). No paper; annotation source not described, so unknown. enricher:
  size 191.3 MB -> 1,684,455,848 B (full OSF file listing incl. the model; images + masks are 191,292,452
  B).'
