description: 100 annotated SEM images (1024x1024 PNG) of fracture surfaces of laser powder bed fusion (LPBF) Ti-6Al-4V test bars broken in four-point bending, with PNG masks of the lack-of-fusion and keyhole fracture defects. Component of the Materials Data Segmentation Benchmark and Model Garden (MDS B&MG); a trained U-Net, inference script and evaluation script are provided alongside.
