notes: 'Materials-science SEM (no organism). The schema has no plain SEM value, hence modality other. OSF component rjndg (Images: 100 PNG, 190.8 MB, 16-bit grayscale 1024x1024; Masks: 100 PNG, 0.5 MB, 8-bit grayscale; Models: one 1.5 GB h5 U-Net; Scripts: 2 .py). Pixel size 202.73 nm and instrument (VEGA3 SBH, 1333x) come from the parent project wiki (gdwyb), which applies to all three sub-datasets. Sibling components with 100 images each: lack of fusion only (rpj4t) and keyhole only (9ta3v); this record is the combined one. License BSD 3-Clause from the OSF project license record (a software license applied to data). No paper found, annotation procedure and source are not described, so source is unknown; the evaluation script binarizes masks at >0.5. Sibling benchmark components (AFM, XCT, high-speed camera, solar-cell SEM) are separate datasets.'
