notes: Pixel size is not stated on the repository page or in the paper Methods (checked both). The ZIP contents were not
  listed because the direct download link could not be found; formats and pairing come from the repository description and the
  paper. Masks were generated by quasi-automated deconvolution and cross-correlation (paper Methods), hence source automatic.
  The paper states a 2,000-image test and 1,000 to 5,000-image training split, but no split is described as shipped in the
  data. Code at github.com/sheneman/deep_lipid. Modality is SLIM quantitative phase imaging, no exact enum, so other.
