title: Yarrowia lipolytica single-cell quantitative phase images with lipid droplet masks (SLIM)
short_name: Y. lipolytica lipid droplet masks (QPI)
description: Library of about 7,000 single-cell quantitative phase images (SLIM, 32-bit float grayscale TIFFs) of the yeast
  Yarrowia lipolytica, each paired with an 8-bit binary mask of lipid droplets, released as one 215 MB ZIP together with
  derived classifier scores. Supports supervised lipid droplet segmentation in label-free images.
