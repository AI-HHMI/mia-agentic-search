notes: 'Zip listing: 1,414 files, 15.8 GB uncompressed (808 .tif, 202 .tiff expression images, 202 .tsv,
  202 .csv), i.e. 202 ROI folders (e.g. PT0242_BASELINE_MIBI_ROI1). types.csv lists segment id and type
  (CD8 T cell, T cell, Tumor, Unknown, ...). How segments and types were produced (algorithmic vs manual)
  is not stated on the record, so source is automatic as the safer reading. The Zenodo record has no description
  beyond one sentence and no linked paper; press coverage (April 2026) describes a UCLA spatial analysis
  of S1616 biopsies, but its citation was not found. Pixel size not stated. enricher: expression.tiff
  opened: 33 pages x 2048x2048 float32, one per marker (33 markers in expression_measurements.tsv), so
  channels 33. Modality MIBI recorded as other. size_bytes = zip + all_segments.tsv (Zenodo listing, 3,333,249,332
  B).'
