short_name: Melanoma biopsy MIBI cell segments and types
description: Multiplexed ion beam imaging (MIBI) regions of interest from melanoma biopsies of patients enrolled
  in the SWOG S1616 trial. Each ROI folder holds a multichannel expression image, a cell segmentation label image,
  per-segment cell types, per-cell expression measurements and tumor, endothelial and tissue-outline masks;
  a combined segment table is provided separately.
