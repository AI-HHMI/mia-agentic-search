notes: 'Zip listing: 1,414 files, 15.8 GB uncompressed (808 .tif, 202 .tiff expression images, 202 .tsv, 202 .csv),
  i.e. 202 ROI folders (e.g. PT0242_BASELINE_MIBI_ROI1). types.csv lists segment id and type (CD8 T cell, T cell,
  Tumor, Unknown, ...). How segments and types were produced (algorithmic vs manual) is not stated on the record,
  so source is automatic as the safer reading. The Zenodo record has no description beyond one sentence and no
  linked paper; press coverage (April 2026) describes a UCLA spatial analysis of S1616 biopsies, but its
  citation was not found. Pixel size, channel count and image dimensions not stated; expression images not
  opened. Modality MIBI recorded as other. size_bytes = zip 3,210,188,184 + all_segments.tsv 123,061,148.'
