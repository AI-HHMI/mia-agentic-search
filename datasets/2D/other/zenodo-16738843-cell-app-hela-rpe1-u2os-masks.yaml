  notes: 'Exact listing of the one zip (100,356 members, 369,555,711 bytes). There is no HeLa/train/images/ folder, so the
    HeLa training masks and COCO file have no images in this archive. <line>/annotations/*.jpg and HeLa/nocol_annotations/
    are overlay visualizations, not labels. Sampled RPE1/test/images/179.jpg (97 KB: 1024x1024x3 uint8, identical samples,
    min 2 max 255, mean 75, one sample) and one mask (binary 0/255, 0.3% foreground). Read the head of RPE1/test/rpe1_0.4_test.json:
    COCO, categories nonmitotic (0) and mitotic (1), polygons. The COCO info block lists a CC BY-NC-SA 2.0 license entry for
    each image, while Zenodo states CC-BY-4.0; the record keeps the Zenodo license.'
