title: 'Cell-APP datasets: HeLa, RPE1, U2OS and multi-cell-line images with whole-cell instance masks marked mitotic or non-mitotic
  (Zenodo)'
short_name: Cell-APP whole-cell masks (mitotic/interphase)
description: Images of H2B-mCherry labelled human cell lines (HeLa, RPE1, U2OS, plus eight multi-cell-line "general" datasets
  of increasing size) acquired on an ImageXpress Nano with a 20x 0.46 NA objective, with whole-cell instance masks (individual
  PNG masks and COCO JSON) classified as mitotic or non-mitotic. Per-cell-line train/test folders. Masks were generated by
  the Cell-APP pipeline (nuclei prompt a segmentation model), not drawn by hand, except two hand-annotated benchmark images
  per cell line.
