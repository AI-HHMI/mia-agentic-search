notes: 'Zip (100,356 members) was listed with peek_archive: per-cell-line train/test with images/, annotations/ (about 97,000
  per-cell PNG masks) and COCO JSON, 8 general dataset_N folders (55 to 410 images) and mitotic_index.txt. The HeLa train
  images folder did not show in the listing. Image counts were not totalled. The paper (read via PMC) states ImageXpress Nano,
  20x 0.46 NA, H2B-mCherry, and automatic annotation by Cell-APP with two hand-annotated benchmark images per line; it gives
  no pixel size. Modality is other because the paper does not name it (paired transmitted-light and fluorescence) and which
  channel the JPEGs hold was not checked. HT1080 appears in the paper but not as a folder. enricher: download_url set to the
  direct zip; COCO files list a CC BY-NC-SA 2.0 entry (Zenodo: CC-BY-4.0).'
