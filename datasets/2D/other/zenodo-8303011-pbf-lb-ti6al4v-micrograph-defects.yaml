short_name: Ti6Al4V micrographs with labelled defects (other)
description: 775 large JPEG micrographs of laser powder-bed-fused Ti6Al4V specimens built with randomised
  process parameters (layer thickness 25-100 um), plus 1,200 labelled binary defect images in three classes
  (400 lack of fusion, 400 keyhole, 400 process pores) with a CSV of extracted defect features, a process-parameter
  CSV, and a set of micrographs for model application.
