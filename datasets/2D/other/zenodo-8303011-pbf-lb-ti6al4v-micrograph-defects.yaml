notes: 'Materials-science optical micrographs, not biology. Counts: the description says 775 micrographs (and in one place
  757); Labeled_Defects.zip lists 1,200 JPEGs (400 per class, peek_archive), so n_items is 775 + 1,200 = 1,975. Only the 1,200
  defect crops are labelled (class folders; manual labelling by the authors per the description); the 775 large micrographs
  (about 60 MB JPEG each, in eight zips, e.g. 1-84.zip lists 84 files) carry no per-pixel annotations. No download_url because
  the data is split over ten zips plus CSVs (52.9 GB in total, size_bytes). Imaging technique, pixel size and microscope are
  not stated on the dataset page, so modality is other and voxel_size_nm is null; no paper is linked, so no publication is
  listed. Annotations are image-level defect classes (classification), not masks, although the defects are described as binary
  images.'
