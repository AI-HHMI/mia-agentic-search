notes: 'Counts from the zip listing: real_labeled 63 bacillus/coccus + 75 geometric JPEGs (512x512 per
  the COCO file); real_unlabeled 392 + 100 PNGs; synthetic_labeled 8,212 + 7,115 PNGs with train/val/test
  COCO files. n_items is the sum of all image files (15,957), most of them synthetic; the README states
  real labeled data is intended mainly for evaluation. Real-image labels were exported from Roboflow (manual
  per the record description). No pixel size, scan size, bacterial species or paper stated: the README
  and record contain template placeholders for the citation. Modality is AFM, filed as ''other''. Zenodo
  record API read; zip read via range requests (README and one COCO file). enricher: channels 1 (real
  labeled JPEGs are grey stored as RGB; PNGs single-channel); annotation format detailed from 4 COCO files
  read; annotations.source mixed = real_labeled manual (Roboflow), synthetic_labeled automatic.'
