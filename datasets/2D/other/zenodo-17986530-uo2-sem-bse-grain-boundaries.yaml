short_name: UO2 SEM-BSE grain boundary labels (SEM)
description: 'Backscattered-electron SEM images of uranium dioxide samples with grain boundary ground-truth images, from a
  deep-learning grain boundary detection study: 6 single-image datasets (D1-D6) and 6 tilt-series datasets (T1-T6, 10-12 images
  of the same region each) in Data.zip, split into train/validation (10 images with GT) and test folders, plus a few synthetic
  example images with grain boundary maps. Data.zip (128 MB) is separate from Models.zip (trained model parameters, not catalogued).'
