notes: 'Counts from the Data.zip listing (peek_archive): TrainValidData has 10 images (D1-D6, T2_11, T3_11,
  T4_05, T5_08) with 10 GT images; TestData has T1 (12 images, one T1_GT.png) and T6 (10 images, one T6_GT.png);
  SyntData has 5 synthetic images with 5 maps. n_items is 32 real + 5 synthetic = 37 images. Splits follow
  the description (D1-D4 and one image each of T2-T5 for training, D5-D6 for validation, T1 and T6 for
  testing). The accompanying manuscript is not linked on the dataset page and was not found, so no publication
  is listed; pixel size, SEM settings and how the ground truth was made are not stated on the page or
  in the file listing, so voxel_size_nm is null and annotations.source is unknown. The SEM images are
  of ceramic material microstructure, not biology; modality is other because the schema has no plain SEM
  value. Models.zip (850 MB of trained parameters and SEraMic predictions) was not inspected. enricher:
  size_bytes now both zips (file-listing, was Data.zip only).'
