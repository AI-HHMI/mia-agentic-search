notes: 'Zip listing: 961 micrographs (915 TIFF, 46 PNG), metadata.csv, manifest.json, LICENSE. metadata.csv
  gives primary_microconstituent for all 961 rows (spheroidite 374, network 212, pearlite 124, others
  fewer). README says to split by sample_key (43 samples). Mirror of NIST record hdl:11256/940, which
  no longer responds; license is CC BY 3.0 US (LICENSE file in the zip). Pixel size varies per image (scale
  bar in metadata.csv), so voxel_size_nm is null. Paper not open access, so labelling procedure was not
  read (annotation source unknown). Materials SEM, not biological. enricher: license.spdx set to the SPDX
  id CC-BY-3.0-US (was custom); size_bytes is the exact zip size (was the uncompressed total).'
