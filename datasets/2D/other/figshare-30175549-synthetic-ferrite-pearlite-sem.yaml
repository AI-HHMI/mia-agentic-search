notes: 'Materials-science and synthetic: micrographs are generated from experimental FESEM patches placed
  on simulated templates, masks are computed by the generation pipeline (automatic); modality is other
  because the schema has no plain SEM value. Two zips listed with tools/peek_archive.py: Training.zip
  (2.27 GB, 20,000 png: 10,000 micrographs plus 10,000 Ground_truth masks) and Testing.zip (115 MB, 998
  png, i.e. 499 pairs, while the record text says 500; paper says 10,499 pairs in total). Download URL
  points to the training archive; the testing archive is https://ndownloader.figshare.com/files/58127713.
  Pixel size is not stated (synthetic images, 512 x 512 px). Paper full text via Europe PMC. enricher:
  sampled training pair 0: 512x512 grey uint8 micrograph, mask values 0-9. Modality family: EM (synthetic
  SEM), not light or X-ray.'
