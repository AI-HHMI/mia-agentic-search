notes: 'Kaggle record (licence Unknown, 222 MB, updated 2025-02-02) and complete file listing: 290 PNG files in Final Annotated
  Images/Training and 10 in Final Annotated Images/Test (image and annotated pairs; 145 training/validation images and 5 test
  images as stated on the page). Paper (PMC12042131): HUVECs imaged on a Nanolive CX-F holotomographic system, maximum intensity
  projections of stacks plus video frames, manually segmented into four classes (cells, cell borders, mitochondria, background)
  on a tablet; 80/20 random train/validation split of 145 images plus 5 test images. The paper is CC BY-NC-ND, but that licence
  is for the article, not the dataset, and the Kaggle page shows no licence, so licence terms are unknown. Pixel size is not
  stated in the text read. enricher: masks are palette PNGs with indices 0-3; channels 1; download_url is the Kaggle archive
  API URL.'
