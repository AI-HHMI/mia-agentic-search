notes: 'One zip of 312 members listed with peek_archive: 306 TIFFs (38.8 MB; data/test/EMDiffuse brain_inputs noisy/truth and prediction folders, plus the PSSR test pairs), a README, two notebooks, two
  .pth model files and one 8.5 GB .tar.gz holding the training data (not listed, so its contents and counts are unknown). Paper: 42 aligned high/low-resolution test pairs (512x512 px at 2 nm, 128x128 px
  at 8 nm); the EMDiffuse test set is 32 images from the EMDiffuse release (its own Zenodo record). The paper does not name the EM technique, species or tissue, so modality is other and organism is empty;
  the 2 nm value is the high-resolution pixel size. Training data are in the tar.gz; n_items is unknown. The zip also holds model weights and EMDiffuse prediction outputs that are not training data. enricher:
  test pairs are 492/123 px (pssr2) and 500/125 px (old_pssr) in the files.'
