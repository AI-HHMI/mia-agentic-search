title: Cervical cell images with annotated single-cell segmentations (Cell-GAN training and test data)
short_name: Cervical cell segmentation images (cytology)
description: Training and test images for Cell-GAN cervical cell segmentation. The training set has 1,571 cell images
  of three cell types (upper squamous, mid-level squamous, basal); the test set has 309 images (100 single-cell,
  170 overlapping-cell, the rest atypical-cell and ideal-cropping images). Each set provides cropped cell images,
  annotated complete single-cell images and annotated nuclei used as guide factors.
