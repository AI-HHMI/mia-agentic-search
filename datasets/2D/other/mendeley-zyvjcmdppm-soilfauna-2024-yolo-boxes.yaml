notes: 'Mendeley API file list: 4,595 files = 2,296 .jpg + 2,296 .txt + train.cache, val.cache and test.cache (YOLO training
  artefacts), no archive. One image and its label file were opened: 1024x768 JPEG with two worm-like animals and two boxes
  (class 7). The page description is one generic paragraph; it states no imaging instrument, magnification, pixel size, class
  names or number of classes, split sizes, collection site or paper, and no related publication is listed (none found). The
  image looks like a stereo-microscope or close-up photograph, so whether this counts as microscopy is unverified, and modality
  is other. Class ids are not mapped to names anywhere I could read. enricher: files sit in SoilFauna-2024/images/{train,val,test}
  (1607/343/346) with matching labels/{train,val,test}, so splits_provided is true (was false); every image has a label file,
  so coverage is dense (was unknown).'
