notes: 'Mendeley API file list: 4,595 files = 2,296 .jpg + 2,296 .txt + train.cache, val.cache and test.cache (YOLO training
  artefacts), stored flat, no archive. One image and its label file were opened: 1024x768 JPEG with two worm-like animals
  and two boxes (class 7). The page description is one generic paragraph; it states no imaging instrument, magnification,
  pixel size, class names or number of classes, split sizes, collection site or paper, and no related publication is listed
  (none found). The image looks like a stereo-microscope or close-up photograph, so whether this counts as microscopy is unverified,
  and modality is other. The .cache files suggest a YOLO train/val/test split but the files are not arranged in split folders.
  Class ids are not mapped to names anywhere I could read.'
