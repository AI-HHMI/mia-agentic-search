short_name: Turfgrass nematode genera (light microscopy)
description: Micrographs of seven plant-parasitic nematode genera from turfgrass (Hoplolaimus, Helicotylenchus,
  Meloidogyne, Mesocriconema, Pratylenchus, Trichodorus, Tylenchorhynchus), sorted into genus folders
  at 10x, 20x and 40x objectives, extracted from videos recorded on a Zeiss Observer Z1 and an Olympus
  BX51 and automatically cropped to single nematodes.
