notes: 'Record (figshare API mirror of the USDA Ag Data Commons entry), zip listing and README read, and
  the paper full text (Europe PMC). License is shown as "U.S. Public Domain" (public domain label) with
  no SPDX equivalent, so custom. The labels are the genus folder names; how identification was done is
  not stated in the pages read. Modality is other because the contrast mode is not stated (inverted and
  compound light microscopes). Pixel size not stated. The paper trains on train/val/test splits of its
  own and uses a further 77 new images as validation set II; those are not separate in the zip. The images
  are frames extracted every 100 frames from 1,887 videos, duplicates removed, then auto-cropped (paper),
  so neighbouring images can come from the same video. Checked: record, zip listing, README, paper. organisms:
  one per genus folder Nematodes/*/<genus>/.'
