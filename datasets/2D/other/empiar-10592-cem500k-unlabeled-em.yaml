notes: 'Unlabeled by design: qualifies as a dataset explicitly released for self-supervised / foundation-model
  training (the paper evaluates MoCoV2 pre-training on it). EMPIAR record and paper (read via Europe PMC) give 496,544
  images of 224x224 8-bit TIFF, curated from CEMraw (101 projects; 591 3D volumes and 9,626 2D images) after deduplication
  and filtering; license CC0 shown on the EMPIAR page. The FTP directory lists a single cem500k.zip (17.4 GB, 496,538 members, all .tiff, listed with peek_archive; the EMPIAR page states 496,544 images and 16.6 GB, so size_bytes is the zip size and n_items the stated count). Per-image metadata is in data/metadata/cem500k_image_metadata.csv per the EMPIAR description. Pixel size and
  organism vary by source image (the paper shows distributions, not a single value); modality is other because
  images mix TEM and SEM. EMPIAR labels the experiment type FIB-SEM.'
