  notes: 'listing.py on all 4 files: 17,831,865,599 B exact; the zip has 496,538 .tiff members (the page
    says 496,544 images). A scratch script (repo read_member + tifffile) read 3 members: all uint8 224x224,
    uncompressed, 50,496 B each, ranges 20-243, 42-205 and 0-255, so the patch size looks fixed, but only
    3 were checked. Read the first 1.5 kB of the metadata CSV: per-image columns imaging_mode (ssTEM,
    FIBSEM, SBEM, ...), organism (Drosophila, Mouse, Human, ...) and tissue, so per-image organism and
    modality are available there. The 370 MB MoCoV2 ResNet-50 tar is model weights and was not opened.
    The total includes it, because listing counts every file on the entry.'
