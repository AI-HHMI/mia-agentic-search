notes: 'One zip (461 MB) listed with peek_archive: 16 .tif (sansha-5) and 16 .tiff (WO115-2) images, each paired
  with a .json file. The record description gives the counts (32 images, 3,359 cell instances) but not the JSON
  schema. The record has no linked paper, so none was read; imaging modality, microscope, pixel size, channels and
  annotation procedure are not stated. Keywords mention cell tracking and cell division; the 0 h / 24 h images are
  of the same fields but no tracking links were verified. enricher: JSON opened: LabelMe polygons, one per cell
  (instance segmentation). channels 3 = RGB TIFF (was unknown).'
