notes: 'Only the 200-item test split is on the hub; the card says train (2,961) and unlabelled (1,336) splits are
  planned. Masks: 309 512x512 crops from 75 recordings manually annotated per the paper; released items are 256x256
  views. Pixel size, microscopes and tubulin source (organism) not stated on the card or in the paper. Related to
  the SynthMT and IRM-in-vitro-microtubules HF datasets by the same group; real images likely share recordings with
  them. enricher: formats png (PNG bytes inside one Parquet file, was other); download_url the direct parquet (was
  landing page); size from Hub tree (was card value); annotations verified from decoded mask PNGs.'
