short_name: In vitro microtubule IRM binary masks (test split)
description: 200 test items of interference reflection microscopy (IRM) recordings of in vitro microtubules, each
  a 256x256 triplet of a real image, a manually annotated pixel-precise binary microtubule mask, and a mask-conditioned
  synthetic image. Released as one Parquet test split; the 2,961-item train split and 1,336 unlabelled real patches
  are announced but not yet published.
