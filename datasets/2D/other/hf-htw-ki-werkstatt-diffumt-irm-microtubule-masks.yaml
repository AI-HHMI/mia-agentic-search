notes: 'Only the 200-item test split is currently on the hub (data/test-00000-of-00001.parquet, 59.8 MB); the paper
  says train (2,961) and unlabelled (1,336) splits are planned, and also says release is "upon acceptance", so
  availability may change. Masks: 309 512x512 crops from 75 recordings were manually annotated per the paper (annotator
  and software not stated). Pixel size and microscope models are not stated on the dataset card or in the paper
  text read. Formats: Parquet with embedded images, no schema format fits, so other. Annotation contents were not
  opened (Parquet not inspected), hence annotations_verified false. Related but different from the SynthMT and
  IRM-in-vitro-microtubules HF datasets by the same group: this one is 256x256 tiles with binary (semantic) masks
  plus mask-conditioned synthetic images; its real images likely derive from the same recordings as the real 66-image
  IRM set, so overlap is possible.'
