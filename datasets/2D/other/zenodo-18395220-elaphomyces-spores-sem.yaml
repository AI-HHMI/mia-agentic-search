  who identified the species is not stated (source unknown). modality other = conventional SEM (FEI Quanta
  FEG, per TIFF header). enricher: voxel size 41.63 nm from the FEI TIFF metadata PixelWidth/PixelHeight
  4.16295e-8 m (HFW 42.63 um / 1024 px), identical in 12 files across all 4 folders (was null). enricher:
  channels 1 (grey stored as RGB; was null). organisms: one per species folder (E. aculeatus/, E. americanus/,
  E. septatus/, E. virgatosporus/).'
