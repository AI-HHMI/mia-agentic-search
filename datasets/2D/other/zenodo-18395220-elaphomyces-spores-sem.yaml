notes: 'Zenodo API record (CC BY 4.0, open, one 566.9 MB ZIP) and the ZIP listing were read: 640 TIFF files in four folders of
  160 images each (E. aculeatus, E. americanus, E. septatus, E. virgatosporus), each folder named with a collection code and
  GenBank accession. The record text mentions accompanying metadata but the ZIP contains only TIFFs. No paper is cited on the
  record and a title search of Europe PMC and Crossref found none, so no publication is listed. Pixel size, magnification, image
  dimensions and SEM instrument are not stated on the record or visible in the listing, so they are null; the labels come from
  folder names and the record does not say who identified the species (source unknown).'
