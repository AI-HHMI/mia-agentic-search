notes: Zenodo description is two sentences; no paper or README found (checked the
  Zenodo record and zip listing; no related identifiers). Zip has 433 JPEG images
  in Gomphonema_test_train_val and Pinnularia_test_train_val with train/val/test folders
  (Gomphonema 164/57/56, Pinnularia 105/36/36) and 21 COCO JSON files; the one JSON
  read (Gomphonema_test_4_coco.json) covers 4 images with 14 polygons, so each JSON
