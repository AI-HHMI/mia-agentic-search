notes: 'Zenodo description is two sentences; no paper or README found (checked the Zenodo record and zip
  listing; no related identifiers). Zip has 433 JPEG images in Gomphonema_test_train_val and Pinnularia_test_train_val
  with train/val/test folders (Gomphonema 164/57/56, Pinnularia 105/36/36) and 21 COCO JSON files; the
  one JSON read (Gomphonema_test_4_coco.json) covers 4 images with 14 polygons, so each JSON appears to
  cover a subset of images and the share of images with annotations is not confirmed (coverage partial).
  Microscope, modality (light microscopy assumed but not stated), magnification and pixel size are not
  given anywhere, so modality is other. The image size in the sampled JSON is 1600x1200. Annotation tool
  VGG Image Annotator is stated in the JSON header; annotator and procedure are not documented. The label
  category name in the sampled JSON is empty. enricher: all 21 COCO files read: nested subsets per split;
  419 of 433 images annotated.'
