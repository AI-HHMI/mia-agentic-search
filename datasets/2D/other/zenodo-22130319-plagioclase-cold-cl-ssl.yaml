notes: 'Four tar.gz archives (~11.4 GB, MANIFEST.csv): 01 source imagery, 02 segmentation resources, 03 unified crystal datasets (V2: 91,357 train / 14,919 val / 16,988 test = 123,264 images), 04 SSL run artifacts. Only the start of archives 01 and 03 was streamed (README, file names); 02 and 04 were not opened. Cold-CL (cathodoluminescence) is not a schema modality, hence other. Masks come from a trained PlagNet model (README: verified), not manual labels; classes and coverage not inspected. Pixel size and instrument not stated. MSc project release, no linked paper.'
