notes: 'Four tar.gz archives (11.4 GB, MANIFEST.csv): 01 source imagery, 02 segmentation resources, 03 unified crystal
  datasets (V2: 91,357 train / 14,919 val / 16,988 test = 123,264 images), 04 SSL run artifacts (not opened). Cold-CL
  (cathodoluminescence) is not a schema modality, hence other. Masks come from a trained PlagNet model (README: verified), not
  manual labels. Pixel size and instrument not stated. MSc project release, no linked paper. enricher: the heads of archives
  01-03 were streamed: 01 holds raw cold-CL tiles (JPG, 2076 x 3088 RGB) and the Aegina crops; 02 holds per-tile instance label
  maps (clean_instance_labels_uint16.png, same 2076 x 3088 grid); 03 holds the masked crystal crops (RGB PNG, background 0).
  coverage: instance maps for the non-Aegina tiles only; completeness per tile not stated.'
