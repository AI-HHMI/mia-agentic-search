  notes: 'The dataset is one tar (794,981,376 B from the server, range requests work). Streamed its first 1 MB with a small requests+tarfile script: plain tar starting with ISIISNet/imgs/<taxon>/ folders. First image Acantharea/257067623.png (258 B) is 17x11 uint8 grayscale PNG, values 40-255, mean 205.2 (one sample; objects are small and vary in size). sample is null: TensorSwitch cannot pull single members out of a tar, and www.seanoe.org is not on its fetch allowlist. Voxel size not found; checked: PNG header (no pHYs), SEANOE page (measurements in pixels), ESSD plankton benchmark paper full text (no per-instrument pixel size).'
