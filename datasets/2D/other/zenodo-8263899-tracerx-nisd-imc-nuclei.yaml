notes: 'Zip listing (peek_archive, 581 files, 5.7 MB): 116 tiles in each of images/, 16bit/, boundaries/, com/ and edge_weighted_nuc/,
  plus a dataset-information CSV. Paper Methods: 41,962 expert-labelled nuclei across 116 tiles of 256x256 um, released as
  contrast-adjusted images with 16-bit ground-truth label masks and binary semantic masks; the raw 41-channel IMC data is
  available on request only. Imaging mass cytometry is not a listed modality, so ''other''. Pixel size not stated on the Zenodo
  page or read in the paper, so voxel_size_nm is null. The Zenodo record also holds the deep-imcyto weights (597 MB) and a
  PHLEX test dataset (700 MB) that are not part of this record; size_bytes covers the NISD zip only. v1.0.3 is open; earlier
  v1.0.0 was restricted.'
