  notes: 'Zenodo listing exact (3 files, 2,193,295,414 B). Zip central directory: 53,325 .tif members, 3,016 MB
    uncompressed. Probed 2 members: plain single-page RGB TIFF, uint8, uncompressed, 88x112x3 and 40x32x3 (ROI size
    varies). Sampled one image: 4..255, mean 192 (bright background); one sample. Labels CSV read in full (7,455,030
