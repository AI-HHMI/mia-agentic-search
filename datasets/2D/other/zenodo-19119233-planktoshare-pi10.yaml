notes: 'The Pi-10 is a vessel-mounted flow-through plankton imager, not a classical microscope, so modality is "other" and the
  fit as microscopy is borderline. Pixel size, image bit depth and camera optics are not stated on the Zenodo page, the ESSD
  preprint page, the GitHub README or the planktonzilla issue; the ESSD full text is not open access via Europe PMC (only the
  preprint HTML page was read). The zip holds 53,325 .tif files (peek_archive); a planktonzilla comment says 12 are byte-identical
  duplicates, and 52,882 labelled rows are in the CSV, so the archive has more files than labels. The labels CSV itself was not
  opened and no train/val/test split is provided (the preprint evaluation used a random split). Authors: 12 contributors led by
  Lodewijk van Walraven (Rijkswaterstaat); only the first is listed here.'
