description: 52,882 manually labelled images of plankton, detritus and other particles (200-2,000 um) from the
  vessel-mounted flow-through Pi-10 Plankton Imager on RV Tridens II and CEFAS Endeavour. Labels are
  in a CSV (three top-level classes Organism / Taxo_particle / Non_taxo_particle, with WoRMS AphiaIDs
  and other trait attributes). The images are TIFF files in one zip.
