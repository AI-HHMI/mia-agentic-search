notes: 'Files (HTTP index, rounded sizes, 1.2 GB): CNO_Detection_Annotated/{train,valid,test}.zip hold 240/30/30 JPEG images with
  YOLO txt labels (peek_archive: 480/60/60 files); Corneocyte_Nanotexture_Dataset_Raw/G1-G4.zip hold 300+300+300+150 PNG images, and a
  Preprocessed set of the same four groups has 300 PNGs in G1 (others not listed). The 1050 count is the raw set. The image modality is atomic
  force microscopy (not in the schema modality enum, so other). The paper states 512 x 512 px over 20 x 20 um, so x/y size
  39.0625 nm is derived from those two numbers, not stated directly. Paper: ~250 CNOs per image, over 74,000 boxes, annotation
  tool and annotator not stated in the Methods read, so source unknown. The paper also points to a GitHub repository and GigaDB
  for the data and code (not fetched). Annotated zips look Roboflow-exported (file names with .rf. hashes).'
