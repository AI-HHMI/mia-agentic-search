title: Imaging mass cytometry of pancreatic cancer with Mesmer nuclear and whole-cell segmentation
short_name: Pancreatic cancer IMC with cell masks
description: 35 imaging mass cytometry (IMC) regions of interest from human pancreatic ductal adenocarcinoma samples,
  provided as processed multi-marker OME-TIFF files and raw TIFFs, with Mesmer nuclear and whole-cell segmentation
  masks (TIFF and MAT per ROI), per-cell marker tables and a Seurat object with cell type and neighborhood annotations.
  Supports data for the publication on the vascular niche in pancreatic cancer.
