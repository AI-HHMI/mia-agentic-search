notes: Imaging mass cytometry has no matching modality enum value, hence other. Pixel size, marker panel and channel
  count are not stated on the record or in the file listings; the paper is not open access (only the Europe PMC
  abstract record was read), so these are left null. Masks are algorithmic (Mesmer, per the record description),
  not manual. The segmentation archive lists 105 TIFFs, 35 MAT files and 70 TXT marker tables across ROIs; the processed
  archive holds 35 OME-TIFFs (one per ROI). size_bytes is the sum of the five files on the record (raw TIFFs 1.1
  GB, processed OME-TIFFs 1.7 GB, segmentation 0.14 GB, Seurat object 0.2 GB, ROI selection images 15 MB).
