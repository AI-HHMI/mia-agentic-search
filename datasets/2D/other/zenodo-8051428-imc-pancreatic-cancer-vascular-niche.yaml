  notes: 'Listing: tools/listing.py on the Zenodo record, complete, 5 files, 1944 zip members, 3,211,811,193
    bytes. Sampled ROI 20190522_PDAC81936_ROI_03 (17.0 MB raw + 0.18 MB label); value ranges are from
    this one sample. The processed OME-TIFF members are deflate-compressed in the zip, so probe.py could
    not read their header by range; inner TIFF compression and OME physical sizes are unknown (sample.py
    read axes CYX). Label sample: 1019 distinct IDs (0..1018), 67% background. Also in the archives: cell_mask.mat
    per ROI (MATLAB, not read), per-cell marker tables (cell_markers.txt, nuclei_markers.txt), a Seurat
    RDS (not opened: untrusted R serialization) with cell type and neighborhood annotations, and ROI_Selection
    brightfield/IHC keys. Download: no single archive; sample URLs are zip members checked with probe.py
    --download-check (usable, range requests). Conversion blockers that are facts: 2D data and IMC modality
    (other). Not listed as arrays: Raw_Data_TIFF_Files.zip::*/*.ome.tiff = uncompensated raw acquisition,
    one plain single-page 500x500 float32 uncompressed TIFF per metal channel (46 per ROI folder, folder
    names like 20190522_PDAC81936_ROI3); Segmentation_Data/*/{nuclei,whole_cell}_segmentation.tif = RGB
    uint8 LZW 500x500x3 (probed, not sampled; likely visualisations).'
