notes: 'Imaging mass cytometry (Hyperion) has no matching modality enum value, hence other. Masks are
  automatic (Mesmer whole-cell segmentation, paper Methods). The paper cites the newer version zenodo.org/records/10246315
  (same concept record; adds HE_Images_40x_SVS.zip, 3.7 GB). enricher: voxel size 1000x1000 nm from paper
  Methods (''Images are at a resolution of 1 um/pixel'') (was null). enricher: channels 46 from the processed
  OME-TIFF sample (CYX, 46x500x500) (was null). enricher: download_url set to the Zenodo record (5 separate
  files, no single archive) (was null). enricher: label arrays are Segmentation_Data/Cell_Masks/*_whole_cell_mask.tif
  (uint16 instance IDs); the per-ROI *_segmentation.tif files are RGB uint8.'
