short_name: Unfixed vital micrococci masks (microscopy)
description: 100,000 colour microscopy images (about 400 x 400 px, PNG) of unfixed vital micrococci, each with a paired binary
  segmentation mask of the microorganism foreground, plus a bboxes.json of bounding boxes per part. Split over ten zip parts of
  10,000 image/mask pairs each. Intended for training, validation and benchmarking of segmentation, classification and detection models.
