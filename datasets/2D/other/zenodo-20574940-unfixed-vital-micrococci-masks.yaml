notes: 'Zenodo page (v1-0, ten zips of 2.2 GB, MIT) states 100,000 image/mask pairs, PNG, about 400 x
  400 px. pt01.zip listing: 20,000 PNGs (images/ and masks/, 10,000 pairs) plus bboxes.json (one box per
  image); other parts not listed. The title says "Generated Microscopic Images" and the page does not
  say whether images are real or synthetic; no paper is linked; modality, microscope, stain, pixel size
  and annotation procedure are not stated. Organism empty: only "micrococci", no taxon. Differs from zenodo-21992855
  (same authors, real images, 4.1 GB, five classes plus 84 scenes). Confidence lowered: origin unconfirmed.
  enricher: size 22,074,929,099 bytes from the Zenodo API file list (10 zips); n_items 100000 -> 200000
  (100,000 images + 100,000 masks).'
