notes: 'Zenodo page (v1-0, 22.1 GB in pt01..pt10.zip, 2.2 GB each, MIT licence) states 100,000 image/mask pairs, PNG, average
  400 x 400 px. Listing of pt01.zip: 20,000 PNGs (pt01/images and pt01/masks, 10,000 pairs) plus pt01/bboxes.json (one box per image).
  The title says "Generated Microscopic Images"; the page does not say whether the images are real acquisitions or synthetic, no
  paper is linked, and modality, microscope, staining, pixel size and annotation procedure are not stated (one sample image looks like a
  real colour micrograph with a single cell). Organism left empty: the page only says "micrococci" without a taxon. Same authors
  also have zenodo-21992855 (real multi-microscope microorganism dataset); this one is a different Zenodo record with different
  files (4.1 GB, five morphotype classes plus 84 full scenes, versus 22.1 GB here of micrococci-only pairs; possible-duplicate comparison done). Checked the Zenodo page and the pt01 archive listing; the other nine parts were not listed. Confidence is lowered
  because the real-vs-synthetic origin is unconfirmed.'
