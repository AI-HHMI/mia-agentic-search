notes: 'BioStudies page: license CC0, "Companion data for Roman et al. 2025 paper", EVOS Floid, 10x, light microscopy.
  File listing: 13 class folders (counts 34-64) of 546 TIFF + 3 JPG; a TIFF header probe shows uint8 RGB 960x1280.
  The paper is not named with a DOI on the page and WebSearch did not find it, so authors, publication, date published,
  pixel size, organism and staining are left empty. The page lists organism Homo sapiens, but folder names include
  mouse (3T3, B16) and canine (MDCK) lines, so organism is left empty. The specific contrast mode (brightfield /
  phase) is not stated, so modality is other. Labels are inferred from folder names (cell line), not from a separate
  annotation file. enricher: channels 1 (was 3): the RGB samples are identical in 3 sampled TIFFs (grey stored as
  RGB).'
