notes: 'Outer zip (3.65 GB) holds a nested stored nnU_Net.zip (3.24 GB): data/training/input+output 164
  PNGs each, data/testing 7 each (+Thumbs.db); most of its bytes are nnU-Net preprocessed/NIfTI copies,
  results and trained models. GAN part (1_GAN/Data.zip, merged_256_GAN.npz) not opened. Modality SEM is
  not in the schema enum, hence other (it is electron microscopy). No organism: steel, not a biological
  sample. enricher: voxel size 31.25 nm (x, y) from arXiv 2401.01147 Sec. 2 ("512 x 512 pixels that corresponds
  to a resolution of 32 pixels/um") (was null). enricher: annotations.source manual (paper: labelled by
  hand with MATLAB 2018a Image Labeler) (was unknown). enricher: formats + nifti (nnU-Net .nii.gz copies
  of the PNGs inside nnU_Net.zip).'
