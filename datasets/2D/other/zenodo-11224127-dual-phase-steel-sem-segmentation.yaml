notes: 'Outer zip index read with peek_archive; the nested nnU_Net.zip (stored) index was read with range requests: data/training/input
  and output hold 164 PNGs each, data/testing 7 each (plus Thumbs.db). The GAN part (1_GAN/Data.zip, deflated) and merged_256_GAN.npz
  were not opened, so their image counts are unknown. The paper is not open access (Europe PMC has no full text, publisher page
  returned 403), so pixel size, SEM instrument, image dimensions and who drew the masks were not checked; the abstract says
  SEM images of ~1 mm2 areas of dual-phase steel segmented into martensite, ferrite and damage. Modality SEM is not in the
  schema enum, hence other. Related materials-SEM records exist in the catalog but not this record.'
