      prepare_folder_structure_and_images.py converts masks with rgb2gray and thresholds >0.7 damage,
      0.45-0.7 martensite, <=0.45 ferrite; the three observed colours fall in these bins (0.92, 0.60,
      0.21) and nnU-Net dataset.json names labels 0 ferrite, 1 martensite, 2 damage. Paper: some minute
      features deliberately left unlabelled.'
