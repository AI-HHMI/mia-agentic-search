notes: 'Data are uint8 .npy arrays (x_128_*, x_64_*, y_*_* for 18 files in mhsma/ on GitHub); sizes not shown on the listing. Modality is set to other because neither the README nor the abstract states the microscope or contrast mode (paper says non-stained, low-resolution); the paper full text is not open access (Europe PMC abstract read only), so microscope, magnification, pixel size, acquisition and annotation procedure are not stated in the sources read. The README says MHSMA is based on HSMA-DS (Ghasemian et al. 2015). The license is CC BY-NC-SA 4.0 (non-commercial). Labels are image-level classification labels, not masks. Tail label is highly imbalanced (95.5% normal).'
