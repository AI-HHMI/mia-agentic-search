notes: 'Five zips on Zenodo (S1-1 detection, S1-2 stomata+pores, S1-3 stomata+pavement cells, S2 test
  sets, S3 inference-time images), 11.2 GB compressed. Listings (peek_archive): S1-1 has images/train
  5,513 + images/val 2,371 with matching YOLO label txt (bbox, class + 4 values); S1-2 images/train 349
  + val 151 (500) with polygon labels; S2 has groundtruth_labels folders. Image files are mixed .jpg/.tif/.png
  plus some .bmp (bmp is not in the schema format list, so omitted). Modality (brightfield vs DIC etc.),
  species of the training images, microscope, magnification, pixel size and who annotated were not stated
  on Zenodo or the GitHub README; the paper full text is not open access (only the OUP abstract page was
  readable), hence modality other, empty organism and source unknown. n_items sums 7,884 + 500 + 613 +
  300 + 45 + 45 images. Code is AGPL-3.0; dataset licence CC-BY-4.0 from the Zenodo record.'
