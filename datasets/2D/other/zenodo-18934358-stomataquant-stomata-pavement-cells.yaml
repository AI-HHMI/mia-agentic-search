title: StomataQuant datasets - stomata detection and stomata, pore and pavement cell segmentation in leaf
  epidermis images
short_name: Plant stomata and pavement cell segmentation
description: Training/validation and independent test sets from the StomataQuant paper. Microscopy images
  of plant leaf epidermis with YOLO-format bounding boxes for stomata detection (7,884 images), YOLO polygon
  masks for stomata and pores (500 images) and for stomata and pavement cells (613 images), plus independent
  test sets (300 detection images from 144 species, 45 + 45 segmentation images).
