notes: 'Materials-science (chemistry) microscopy, not biological. Modality families: EM (SEM, recorded
  as other; the schema has no plain SEM value) = QPS/Dataset 1 SEM images/ (3,649 TIFFs); light (brightfield)
  = QPS/Dataset 2 optical images/ (388 TIFFs). Single 5.0 GB QPS.zip: 8,074 files (4,037 .tif, 3,649 .txt,
  388 .xlif), 6.9 GB uncompressed; SEM Volume 1 individual QPS (19 folders, 2,428), Volume 2 binary mixtures
  (10 folders, 1,198), Volume 3 foil control (23); optical 19 folders. Per the paper (Europe PMC full
  text), SEM images are 1,280 x 960 px with a 70 px caption strip, optical 1,920 x 1,080 px, at many magnifications,
  so there is no single pixel size; each SEM .txt states its own PixelSize. Labels are sample identity
  from folder names, not drawn annotations. No train/test split. enricher: per-folder counts from the
  zip index; per-image SEM pixel size found in the .txt sidecars.'
