notes: 'Materials-science (chemistry) microscopy, not biological: SEM is recorded under modality other because the schema has no plain SEM value, with brightfield for the optical set. Single 5.0 GB QPS.zip listed with tools/peek_archive.py: 8,074 files (4,037 .tif, 3,649 .txt, 388 .xlif), 6.9 GB uncompressed; Dataset 1 SEM images (Volume 1 individual QPS: 19 folders, Volume 2 binary mixtures: 10 folders, Volume 3 foil surface control) and Dataset 2 optical images (388 images, 19 folders). Per the paper (full text via Europe PMC), SEM images are 1,280 x 960 px with a 70 px caption strip, optical 1,920 x 1,080 px, at many magnifications, so there is no single pixel size and voxel_size_nm is null; magnification is in the file names and .txt/.xlif files. Labels are sample identity from folder names, not annotations drawn on images. Paper states 341 mixture images at nonstandard magnifications suited to testing scalability; no train/test split is given.'
