title: 'DIC_dataset: nematode one-cell embryos in mitosis, labelled by cell-cycle stage'
short_name: Nematode embryo mitosis stages (classification)
description: 169 original 512x512 images of nematode one-cell embryos imaged during mitosis on a Zeiss Axio-imager,
  sorted into three cell-cycle classes (before nuclear envelope breakdown 57, metaphase 57, anaphase 55) in the folders NEBD,
  Meta and AA. Used to train a cell-cycle classifier in a 2026 preprint (semi-supervised GAN).
