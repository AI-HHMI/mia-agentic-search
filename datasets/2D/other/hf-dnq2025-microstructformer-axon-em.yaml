notes: 'Hosted as 13 Parquet shards (train 528 rows 5.57 GB, validation 12 rows 0.12 GB; image and label columns) plus
  id2label.json; sizes from the dataset card metadata. Images are large (about 10 MB per row), so they are likely
  tiled micrographs. The preprint (bioRxiv 2026.05.26.727755, abstract and methods read) does not state the EM type
  (TEM vs SEM), raw image size, magnification or pixel size (a per-image um/pixel calibration table is mentioned),
  so modality is other and voxel size null. Annotation: manual rounds with expert-guided correction of model
  predictions; axon and myelin masks come from AxonDeepSeg per the preprint, hence proofread/mixed. The preprint says
  the full data release is still being organised and the HF repo is the accessible annotated set; the first
  version was uploaded 2025-08-01.'
