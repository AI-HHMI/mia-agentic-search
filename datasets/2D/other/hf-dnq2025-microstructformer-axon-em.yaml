title: MicroStructFormer EM Ultrastructure Dataset (axon, myelin and mitochondria segmentation)
short_name: Mouse spinal cord axon EM ultrastructure masks
description: 540 electron-microscopy image and semantic-mask pairs (528 train, 12 validation) from cervical spinal
  cord white matter of Mbp enhancer-edited mouse lines, used to train MicroStructFormer. The eight mask classes are
  background, abnormality (uncompacted oligodendrocyte membrane), mito-like organelle, mitochondria, mitochondria outside
  axon, periaxonal space, axon and myelin.
