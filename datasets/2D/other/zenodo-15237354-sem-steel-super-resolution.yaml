notes: 'Zip listing (peek_archive): data/16MnCrS5 has 144,000 hr/lr/ref triplets plus 1,728 ref_stack files; data/DP/10mu
  has 25,281 and data/DP/100mu 22,119 triplets, so 191,400 triplets in all (about 576,000 PNG). Pixel size 32.5 nm (target
  resolution) applies to the dual-phase steel per the arXiv preprint, which also describes a TESCAN CLARA at 20 kV and a 4x
  lower-resolution scan (about 130 nm); the 16MnCrS5 pixel size is not stated, so x/y here are the dual-phase value. The preprint
  gives a 20,000/2,500/2,500 train/validation/test split for the small dual-phase set, but the zip has no split files, so
  splits_provided is false. The journal version is not open access and its Methods were not read; the data availability sentence
  in the preprint says the data will be released on publication. The deposit also holds code (ttsr, dataset generation) and
  three .pt model files.'
