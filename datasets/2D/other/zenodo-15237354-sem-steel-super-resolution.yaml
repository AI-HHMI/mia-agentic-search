notes: 'Zip listing (peek_archive): data/16MnCrS5 has 144,000 hr/lr/ref triplets plus 1,728 ref_stack files; data/DP/10mu has 25,281 and data/DP/100mu 22,119 triplets, so 191,400 triplets in all (about 576,000 PNG). Preprint: TESCAN CLARA SEM, 4x lower-resolution LR scans. The preprint gives a 20,000/2,500/2,500 train/validation/test split for the small dual-phase set, but the zip has no split files, so splits_provided is false. Journal version not open access. The deposit also holds code (ttsr, dataset generation) and three .pt model files. enricher: voxel_size_nm null (was 32.5x32.5): subsets differ in what is stated: DP HR 32.5 nm/px (preprint), LR 4x coarser; 16MnCrS5 and DP/100mu not stated. modality: SEM (secondary electrons), no enum value.'
