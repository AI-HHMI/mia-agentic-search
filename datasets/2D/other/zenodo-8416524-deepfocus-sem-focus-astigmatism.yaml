notes: 'Only deepfocus_dataset_0.zip was listed with peek_archive (2,576 PNG, 23 CSV; folder train_valid/defocus_series/...); datasets 1 and 2 were not listed, so the image count is unknown. The training signal is image-to-parameter regression (focus/stigmator correction) with the introduced aberration as target, not annotated structures. The image modality is SEM, which has no entry in the modality enum (other). Paper states all SEM images have 10 nm pixel size (Zeiss Merlin and UltraPlus setups). The dataset is not a segmentation or restoration set; it is included as a labelled EM image-quality dataset.'
