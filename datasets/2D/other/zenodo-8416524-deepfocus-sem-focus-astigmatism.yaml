title: DeepFocus SEM images with known working-distance and stigmator aberrations for focus and astigmatism correction
short_name: SEM defocus and astigmatism series (DeepFocus)
description: 'Training, validation and test images for DeepFocus, a network that estimates working distance and stigmator corrections for scanning electron microscopy. Three zips (9.5 GB) hold PNG image pairs and defocus/astigmatism series acquired at known, deliberately introduced aberrations (working distance, stigmator x and y encoded in file names such as series_0_def-13324_astx-466_asty219_pert1000.png) on 250 nm sections of zebra finch brain and on tin-on-carbon test specimens, with CSV files of acquisition parameters. All SEM images have 10 nm pixel size.'
