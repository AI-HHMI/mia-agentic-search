notes: 'Zip listing: 22,626 JPEGs (train 20,719, val 936, test 971) in 32 class folders, plus fossil_inventory.csv, full_class_distribution.csv and generation_strategy.json; the record text says 20,804 images (7,569 real SEM + 13,235 synthetic). generation_strategy.json lists the real image count per class (original_counts); the synthetic images were generated with FLUX.1 Canny conditioning per the record and are in train/ only. Accompanying paper is described as submitted (Engineering Applications of Artificial Intelligence); none found. Sample origin, microscope, pixel size and who labelled the taxa are not stated (voxel size null). enricher: synthetic files are named flux_hybrid_new_*.jpg (13,150, all in train/, 98% of the bytes); real images 9,476 (train 7,569, val 936, test 971). Probed: real 224x224x3, synthetic 1024x1024 grey (description said 384x384).'
