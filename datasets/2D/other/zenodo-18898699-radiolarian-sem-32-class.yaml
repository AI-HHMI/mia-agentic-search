notes: 'Zip listing: 22,626 JPEGs (train 20,719, val 936, test 971) in 32 class folders, plus fossil_inventory.csv, full_class_distribution.csv and generation_strategy.json; the record text says 20,804 images (7,569 real SEM + 13,235 synthetic), so the zip count differs and is not reconciled. generation_strategy.json lists the real image count per class (original_counts); the synthetic images were generated with FLUX.1 Canny conditioning per the record and are not marked in the listing I read, so the training split mixes real and synthetic images. Accompanying paper is described as submitted (Engineering Applications of Artificial Intelligence); none found. Sample origin, microscope, pixel size and who labelled the taxa are not stated (voxel size null). Size from the Zenodo file entry.'
