notes: 'Record text, zip listing (peek_archive, 1,222 members) and the README inside the zip read. The numbers disagree:
  the Zenodo text gives 567 JSON records (526 with an image), 3,703 instances (1,292 arbuscules, 1,400 vesicles, 1,011
  hyphae) and an 80/10/10 split, while the zip holds 610 annotation JSONs and 610 images, and its README gives 3,867
  records (2,217 LabelMe polygon masks, 1,650 AMFinder tiles of 126 px) with 22,022 arbuscule, 19,340 vesicle and 2,017
  hypha instances and names AMFinder (doi 10.5281/zenodo.5578920) as a source; file names such as
  amfinder_CNN2_Keyence_Nbenth_myc_10 point to AMFinder data (a different microscope than the Axioskop in the text), so
  part of the content likely re-uses the AMFinder dataset (a related AMFinder record is already in the catalog,
  zenodo-5118948). Split files were not seen. Modality, organism and pixel size are not stated; no paper found. Checked:
  Zenodo record, zip listing, README.'
