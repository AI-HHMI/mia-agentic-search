description: Microscopy images of arbuscular mycorrhizal fungi with LabelMe polygon annotations for three structures
  (arbuscules, vesicles, hyphae), captured on a Zeiss Axioskop AX10 with an Axiocam 202 mono at 200x at the Universidad
  Politecnica Salesiana, Guayaquil; used to train a Mask R-CNN colonisation detector. The record text lists 567
  annotation records (526 with an image) and 3,703 instances.
