notes: 'enricher: annotation JSONs read (2 LabelMe, 1 AMFinder): only boxes + class, no polygons, so types
  instance-segmentation -> bounding-box and task segmentation -> detection. Harvest: the numbers disagree:
  Zenodo text gives 567 JSON records, 3,703 instances and an 80/10/10 split; the zip holds 610 images
  + 610 JSONs, and its README gives 3,867 records (2,217 LabelMe, 1,650 AMFinder 126 px tiles) and 22,022
  / 19,340 / 2,017 instances, citing AMFinder (doi 10.5281/zenodo.5578920) as a source; amfinder_* / *_Keyence_Nbenth_*
  names point to re-used AMFinder data (related catalog record zenodo-5118948). No split files. Modality,
  organism and pixel size not stated; no paper found. Checked: Zenodo record, zip listing, README, metadata
  json, 3 annotation JSONs.'
