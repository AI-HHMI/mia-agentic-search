title: 'ZooID: Zooplankton Species Hierarchy Dataset'
short_name: ZooID zooplankton taxonomy images
description: Photographs of zooplankton specimens sorted into folders by taxonomic group (e.g. Phylum Ctenophora)
  and subdivided by expert knowledge of zooplankton types, intended for hierarchical classification with
  the ZooID R package. ZooID_HierarchicalDataset.zip holds about 600 JPEG images in the taxonomy folders;
  processedDataset.zip is a version processed with the ZooID CRAN package code.
