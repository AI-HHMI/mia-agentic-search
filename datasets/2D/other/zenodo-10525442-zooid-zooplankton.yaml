notes: 'Two zips on Zenodo (710,269,327 bytes): ZooID_HierarchicalDataset.zip (608 images, 14 taxon folders,
  plus Zoo tree/ with a pdf and taxonomic tree.xlsx) and processedDataset.zip (596 segmented crops, *_extracted.jpg
  that are greyscale PNGs). Class = folder path. No paper found. Modality other: the ZooID code README
  says only "a microscope and a camera"; microscope type and illumination not stated. Organism left empty:
  mixed zooplankton taxa at phylum to order level, no species names. Annotation source manual inferred
  from "expert knowledge". enricher: size 710,269,327 bytes from the Zenodo file listing (was 744.8 MB);
  formats jpeg, png, tiff from headers (was jpeg); n_items 608 from the zip listing (was 604).'
