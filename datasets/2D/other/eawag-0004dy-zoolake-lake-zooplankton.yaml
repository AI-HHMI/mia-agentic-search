notes: 'Read in full: the Eawag CKAN record (API), its README and the paper full text (Frontiers in Microbiology, PMC8634433).
  README: data.zip holds zooplankton_0p5x (17,943 images, 35 class folders, features.tsv per class) and zoolake_train_test_val_separated
  (Data.pickle plus train/test/val filename lists). The data.zip server does not support range requests, so its contents were
  not listed and file extensions are not confirmed; data.formats is therefore other (images are processed ROI crops, varying
  size). Pixel size is not stated in the README or paper. The HTML dataset page is behind a bot challenge, and the CKAN record
  lists no license, so license is unknown; the paper is open access but that licence covers the article. Dark-field imaging
  microscope (DSPC), a modality not in the schema list, so modality is other. Classification labels only, no masks or boxes.
  The same Eawag portal holds raw Aquascope image releases that were not examined.'
