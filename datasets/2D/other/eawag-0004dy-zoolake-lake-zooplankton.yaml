  notes: 'No range requests on opendata.eawag.ch, so the zip index can''t be read remotely. Streamed only the first 4,063,232
    B and parsed the zip local headers: 3 figure PNGs, zoolake_train_test_val_separated/classes_ERIC.npy, then Data.pickle
    (413,133,320 B compressed, 3,551,974,596 B unpacked); the class folders with the images follow it. Reaching one image
    would mean downloading ~420 MB of a 492 MB archive, i.e. nearly the whole dataset, so no image was sampled and the image
    format, shape and dtype are unconfirmed (the plankifier loader accepts *.jp*g, *.png and *.ti*f). Data.pickle is a Python
    pickle: never unpickle it; use the class folders. Size is data.zip only (CKAN resource size = Content-Length); the other
    two resources are models and code. Voxel size not found; checked: README, CKAN API, DataCite, paper full text (PMC8634433),
    plankifier README/loader; upstream DSPC paper (Merz 2021, Water Research) is not open access. No direct link TensorSwitch
    can use: data.zip has no range requests and opendata.eawag.ch is not on the allowlist.'
