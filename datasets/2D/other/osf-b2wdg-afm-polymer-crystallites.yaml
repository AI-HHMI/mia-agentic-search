notes: 'Materials-science AFM (no organism); the schema has no AFM value, hence modality other. OSF component b2wdg: Images 100 TIFF (26.2 MB), Masks 100 PNG (1.1 MB), Models 13 checkpoints (4.8 GB), Scripts 2 .py. The wiki says "~500 annotated images" but the OSF listing holds 100 images and 100 masks; the record counts the 100 present. Image size 512x512 and LLNL as acquisition site from the wiki; pixel size and scan size not stated on the wiki or listing, no paper found. License BSD 3-Clause from the OSF project license record (a software license applied to data). Annotation procedure and source not described. Sibling benchmark components are separate datasets.'
