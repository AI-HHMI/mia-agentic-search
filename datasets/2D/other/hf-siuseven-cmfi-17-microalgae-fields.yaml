notes: 'The masks are Cellpose pseudo-instance labels, not human ground truth (the README says so; model revision and thresholds are unrecorded), hence source automatic. No paper, microscope, objective, staining or pixel size is stated in the README or file listing checked, so modality is other and voxel size null. Replicate A/B/C labels are reconstructed from phenotype, not recorded. Size is the Hugging Face usedStorage figure (530,542,345 bytes) for the repo of about 10,000 files: JPEG images and PNG masks under data/{train,validation,test}/. Download is via the Hugging Face repository (git/hub API), so download_url is null. A derivative with 1024x1024 crops exists as SiuSeven/cmfi-17-1024 (same license, same images); this record is the source release.'
