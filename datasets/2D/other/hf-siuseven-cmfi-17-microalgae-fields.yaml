  are reconstructed from phenotype, not recorded. Size is the complete file listing (enricher; was the usedStorage
  figure 530,542,345 B) of 10,009 files: JPEG images and PNG masks under data/{train,validation,test}/. Download
  is via the Hugging Face repository (git/hub API), so download_url is null. A derivative with 1024x1024 crops exists
  as SiuSeven/cmfi-17-1024 (same license, same images); this record is the source release.'
