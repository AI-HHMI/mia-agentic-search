notes: 'peek_archive: labelled.zip has 530 TIFF + 530 PNG masks (plus 3 .db files); unlabelled.zip has
  1,819 TIFF; n_items counts 530 + 1,819. Modality is quantitative phase imaging (Telight Q-Phase holographic
  microscope, Nikon 10x/0.3), which has no matching enum value, so modality is "other". Pixel size and
  image dimensions are not stated on the Zenodo page or in the paper text (checked both); the paper reports
  244 PC-3 and 205 PNT1A labelled images and an 85/5/10 split of the labelled data that is not shipped
  as files. Masks were made with a semi-automatic MATLAB tool and manually edited. The GitHub repository
  was not fetched, only cited as the code link on the Zenodo page, so it is not listed as evidence.'
