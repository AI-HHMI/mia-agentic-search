notes: 'BioStudies API record (CC BY 4.0, released 2022-12-25) and the file list JSON: 1,074 TIFF images (8.1 GB, about 3.9 MB each)
  under images/TaraOceans-STEFI_St122 to St125 plus the TSV/JSON image registry; per-image attributes include taxon name, taxogroup,
  status (993 validated, 81 putative) and annotator. 293 distinct taxon strings in the registry (the BioStudies description says 284
  taxa). Instruments per the record: Philips 505 and JEOL 7401F SEM; pixel size is not stated in the record or registry, so voxel_size_nm
  is null and no organism species is given for the whole set. The paper (Protist 2023, not open access; abstract read from Europe PMC)
  matches the sampling stations and the Tara Oceans samples but the BioStudies record itself lists no publication; the link is inferred
  from the matching description. Labels are taxonomic classes, not masks.'
