title: Scanning electron microscopy images of marine protists from the Marquesas Islands (Tara Oceans) with expert taxonomic annotations
short_name: Marine protists SEM with taxonomic labels
description: 1,074 scanning electron microscopy images of planktonic protists (mainly microalgae, ciliates and radiolarians) from four
  stations around the Marquesas Islands sampled during the Tara Oceans expedition, each annotated by taxonomic experts with a taxon
  name and taxonomic group (293 distinct taxon labels; 993 validated and 81 putative).
