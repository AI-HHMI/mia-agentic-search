notes: 'Zip listings (peek_archive): training_data.zip = 35,000 HAADF .tif + 35,005 .json; experiment_test_data.zip = 15 HAADF .tif + 16 .json (the record says 13
  manually annotated experimental images); experiment_measurement.zip = 377 tif in four sample folders, unannotated; particle_detection.zip = trained network
  and logs. The record mentions evaluation on simulated and experimental test images, so the large training collection is probably simulated, but the paper
  full text (Nano Select, 10.1002/nano.202300128) was not accessible (publisher 403, not in Europe PMC) and this is unconfirmed. Pixel size, microscope and
  how annotations were made are not stated on the Zenodo page; modality set to other (HAADF-STEM is not a listed value). Enumerate the zips separately for
  downloading; download_url left null (several zips). Size and n_items counts include all zips and all training/test files.'
