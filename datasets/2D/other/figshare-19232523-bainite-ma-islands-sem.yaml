      \ im_val 4 .tif (2048x1536), label/ 2 .json\n    i_before_merge/        im_train 8 .tif, im_val 2 .tif, label/\
      \ 4 .json\n    iv_before_merge/       im_train 9 .tif, im_val 1 .tif, label/ 2 .json\nexample image with labels.png\
