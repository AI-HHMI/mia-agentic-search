    - 8
    - 254
    normalization: unknown
    alignment: not-applicable
    alignment_notes: The 40 full-size images. Palette TIFF (photometric 3) whose colour map is a grey ramp, so the
      uint8 indices are intensities. The tiled sub-datasets (dataset/<tile>x/<set>/im_*/*.png, palette PNG with
      a grey ramp, e.g. 768x768 uint8 range 11-253) are crops of these images.
  - role: label
    path_pattern: dataset/appendix/i_ii_iii_iv_combined/label/*.json
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: polygons
    classes:
    - id: 1
      name: MA (martensite-austenite island)
    alignment: same-grid
    alignment_notes: 'COCO: images[].file_name names the image in the sibling im_train/ (train.json) or im_val/
      (val.json) folder, with its height/width; annotations[] carry polygon segmentation, bbox and area in pixel
      coordinates; one category, id 1 "MA" (martensite-austenite island). Each tile sub-dataset has its own label/train.json
      and val.json.'
  notes: 'Listing: zip central directory (peek_archive; listing.py does not expand the extensionless figshare URL),
    21,266 members, plus the example PNG; 881,149,642 B for both files (figshare API sizes). Probed one appendix
    TIFF (2048x1536 uint8, uncompressed, palette) and one 768x PNG (palette). tools/sample.py misread the extensionless
    zip URL as HDF5, so a short script read the same two members by range (3,201,894 + 530,650 B): palettes are
    grey ramps; ranges 8-254 and 11-253 (one sample each). Read 768x/iii/label/val.json: 4 images, 105 annotations,
    category MA. Voxel size not found; checked: TIFF/PNG headers, figshare API record and description, COCO info
    (empty), Crossref record of the paper (full text not readable here). File names carry 4000x (magnification,
    not a pixel size).'
