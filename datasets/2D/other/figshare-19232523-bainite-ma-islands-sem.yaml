notes: 'Materials-science SEM (modality "other": the schema has no plain SEM value; figshare tags say scanning electron
  microscopy; no organism). dataset.zip: 21,266 members (21,139 PNG tiles, 80 TIFF full images in appendix/ and
  1536x/, 47 COCO JSON), folders per tile size 64x-1536x, subsets i/ii/iii, im_train, im_val, label. The record
  states 40 original images 2048x1536 (set I 20x, sets II and III 10x). Pixel size, microscope and annotator are
  not stated on the figshare record, so voxel_size_nm is null. Annotation method (manual) is inferred, not stated.
  enricher: paper added, found on Crossref by title and the same authors (Ackermann, Iren, Wesselmecking, Shetty),
  not linked from figshare; its full text could not be read.'
technical:
