notes: 'Covers the latest linked segmentation zips on the landing page: S1_v2 (645.7 MB; 64 train + 20 test), S2_v2
  (418.7 MB; 37 + 12) and S3_v1 (273.6 MB; 27 + 8); I listed all three zips (public Yandex Disk links: disk.yandex.ru/d/ITijo9m-QIxCgg,
  /wYK_5JyQy0pIcg, /hgy7gV-VWSKh3g). Older v1 versions of S1/S2 are also linked; S3 v2 (5.2 GB, with XPL rotations),
  panorama sets P1/P2 and colour-adaptation set V1 are listed on the page but not covered here. Terms: no formal
  license; the page''s Data Usage Agreement says the data is free to use in research and publications must cite
  the references, so license is custom. Magnification: the page says x50 for all sets while the 2021 ISPRS paper
  says x100; both are reported here as unresolved. Pixel size not stated. Downloads are Yandex Disk public links
  (downloadable via the cloud-api public download endpoint), so no stable direct download_url is set. enricher:
  mask class codes from petroscope lumenstone.yaml, confirmed by sampled mask values.'
