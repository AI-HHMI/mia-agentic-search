notes: 'Single parquet file (data/train-00000-of-00001.parquet, 29.2 MB, 66 rows with id, image, mask list), listed via the Hugging
  Face API, so formats is other. Images are 512x512 random crops of 66 of 44 source IRM videos from two labs; the paper
  says two independent human annotators labelled the 66 real images, but the dataset card does not say which annotator(s)
  the released masks come from. Imaging modality is IRM (label-free reflection microscopy), which has no schema value,
  hence other. Pixel size and microscope details are not stated on the dataset card or in the paper main text (S1 Appendix not
  read), so voxel_size_nm is null. Only 66 images, close to the lower size bound. Companion synthetic SynthMT dataset not
  included here (synthetic, rejected).'
