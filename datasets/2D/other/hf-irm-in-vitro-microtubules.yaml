notes: 'One parquet file (data/train-00000-of-00001.parquet, 29,211,448 B, 66 rows: id, image, mask list), so formats
  is other. Images are 512x512 crops from 44 IRM videos from two labs; two annotators labelled the 66 images, the
  card does not say whose masks are released. IRM (label-free reflection microscopy) has no schema value, hence
  other; seeds imaged by fluorescence on the same widefield systems (S1 Appendix sec. 3). enricher: channels 2 (S1:
  images "combine the IRM signal of the growing MTs with a separate fluorescence channel for the seeds"). enricher:
  voxel size stays null: S1 gives "9.0909 to 9.2308 pixels per micrometer" (~108.3-110.0 nm/px) across two setups,
  not one value. enricher: organism stays empty: tubulin "from various sources, ranging from commercially available
  mammalian tubulin to protozoan tubulin" (S1), not per image. enricher: download_url is now the direct parquet
  file. SynthMT (synthetic) not included.'
