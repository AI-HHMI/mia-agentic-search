notes: 'Page: tiff images of 612 human metaphase cells, manually produced karyograms, from a medical genetics
  practice (1997-1998). peek_archive: pki-3_612-meta.zip (32.1 MB, 612 TIFFs) and pki-3_612-karyo.zip
  (34.8 MB, 612 TIFFs with matching names); the exact content of the karyogram images could not be inspected,
  only that they are named per cell. Annotation type recorded as classification (karyotype class per chromosome)
  on the basis of the page statement. No license or terms of use stated on the page, so license is unknown.
  Microscope, magnification, staining (G-banding likely but not stated), pixel size and image dimensions
  are not stated on the page; the Pattern Recognition 2008 paper (Ritter and Gao) is not open access in
  Europe PMC and could not be read, so modality is recorded as other. ML tasks list segmentation because
  the data was used for metaphase segmentation per the page. enricher: karyograms viewed: rearranged chromosome
  images, not pixel masks.'
