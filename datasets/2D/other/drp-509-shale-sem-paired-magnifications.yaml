description: 'Grayscale SEM images of shale from five Chinese regions (Gulong, Jiyang, Jimusar, Yanchang, Changqing), imaged at five areas per sample at 1X, 2X, 4X, 8X and 16X magnification on a Quanta 200F FEE-SEM (all regions) and a Hitachi SU8010 FE-SEM (Gulong and Jiyang), giving real paired low/high-resolution scans for testing super-resolution networks.'
