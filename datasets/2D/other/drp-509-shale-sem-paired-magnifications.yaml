notes: 'Modality is scanning electron microscopy (SEM), which has no schema value, hence other. License ODC-BY 1.0 is the Digital Rocks Portal metadata field. Pixel size depends on magnification and instrument and is not a single value, so voxel_size_nm is null: Quanta 200F FEE-SEM 9.1, 18.2, 36.4, 72.8 and 145.6 nm at 1X/2X/4X/8X/16X; Hitachi SU8010 FE-SEM 12.4, 24.8, 49.6, 99.2 and 198.4 nm (metadata descriptions). The two instruments did not image the same locations. Zip listing (peek_archive): 181 TIFFs (7 sample-instrument sets x 5 areas x 5 magnifications = 175, plus a few extra files), 460 MB uncompressed; n_items is the nominal 175. Only the arXiv abstract page was readable (ar5iv redirected to it); the paper full text was not read, so splits and registration details between magnifications are not verified. The dataset page on digitalrocksportal.org was not used; the public TACC archive directory and metadata JSON were fetched.'
