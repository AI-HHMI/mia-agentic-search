notes: 'Zip listing (1,371 TIFFs): Flowers 255, Particles 126, Rods 569, Sheets 73, Tubes 145, Wires 203; sizes 1024x943 (1,183), 1024x768 (170), 2048x1887 (18) per the record. Materials-science SEM (not biological), modality other because the schema has no plain SEM entry. Pixel size and magnification not stated on the record, so voxel size is null; no associated paper listed on the record. Who assigned the labels is not stated. Class imbalance is large (Rods 569 vs Sheets 73). enricher: pixel size varies per image (FEI tag 34682 Scan/PixelWidth: 2.9, 5.8, 7.3, 416 nm in 4 probed files), so voxel_size_nm stays null; microscope FEI SEM, ETD detector.'
