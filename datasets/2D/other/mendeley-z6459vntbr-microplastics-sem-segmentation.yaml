notes: 'Mendeley record v3 (2026-02-23): dataset1.zip 758 MB (1,355 files: 1,342 PNG, label/ folders, semantic segmentation and
  shape classification), dataset2.zip 113 MB (2,051 files, PNG/JPG, instance segmentation of fibres with label_gray/ and count
  txt files), dataset3.zip 1.02 GB (original micrographs with experiment settings and ground-truth labels, not listed), result_weights.zip
  4.2 GB (pre-trained weights) and result.zip 7 MB; size_bytes is the sum of all five. Image count (237) is from the paper abstract;
  the paper is not open access, so Methods were not read and pixel size/magnification are unknown (not on the Mendeley page or
  GitHub README). SEM has no schema modality value, hence modality other. Train/validation/test folders are implied by the
  GitHub config but the split proportions are not stated. Licence CC BY 4.0 on Mendeley. Sources checked: Mendeley API record
  and file list, listings of dataset1/dataset2 zips, paper abstract, GitHub README.'
