notes: 'Mendeley v3 (2026-02-23): dataset1.zip (237 micrographs + semantic masks, shape-class subsets), dataset2.zip (fibre instance
  segmentation: label_index, label_gray, VIA JSON), dataset3.zip (both regrouped by shape, plus original Hitachi TIFFs with .txt metadata),
  result.zip (predictions) and result_weights.zip (4.2 GB model weights). Image count 237 from the paper abstract (paper not open access).
  Modality: scanning electron microscopy (EM family); the schema has no plain SEM value, hence other. Organism: none, the samples are
  synthetic polymer particles. Licence CC BY 4.0 on Mendeley. enricher: size_bytes exact from the Mendeley API file sizes (was 6.086e9);
  pixel size varies per micrograph, voxel_size_nm stays null.'
