notes: 'Zip listing: final_train_test/{train,test}/{images,labels,overlays,properties}, i.e. 1,188 train and 199 test crops
  of each (PNG, JSON), plus index2fname.txt mapping crops to source ROIs. The paper (Park et al., Med Image Anal 2023)
  reports 268 source ROIs (116 breast, 89 pancreas, 63 kidney; 512x512, crops 256x256), 227 ROIs for training and 41 for
  testing; the Methods name breast, pancreas and kidney while the abstract says pancreas, liver and breast. Microscope,
  pixel size and annotation tool not stated in the paper (it cites earlier work; images come from three platforms in the
  Eliceiri lab), so voxel_size_nm is null. SHG is a nonlinear modality with no matching schema value, hence other. The Zenodo
  description states only images and manual centerline annotations from pancreas, kidney and breast.'
