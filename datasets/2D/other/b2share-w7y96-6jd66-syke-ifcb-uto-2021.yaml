  notes: 'Listing: B2SHARE API (2 files: zip 536,940,086 B + info PDF 207,541 B = 537,147,627 B, the record
    size, confirmed) and the zip central directory read with range requests: 151,236 members (151,235
    PNG, 1 PDF). Probed 2 Pyramimonas_sp PNG headers (grey uint8, 42x80 and 50x80); decoded 3 members
    (22.6 KB): ranges 22-216, 53-191, 58-217 (normalization unknown). tools/sample.py could not open the
    member (it fell back to HDF5), so a scratch read with tools.peek_archive.read_member + PIL was used.
    The top folder name has a non-UTF-8 byte for ö (shown as U+FFFD), so member specs may not match in
    other zip readers. Info PDF read: 50 classes listed, manual expert annotation, no pixel size. Voxel
    size kept from the harvester (paper: roughly 3.5 px per um); headers carry no calibration. b2share.eudat.eu
    is a direct link with range requests but not on the TensorSwitch allowlist.'
