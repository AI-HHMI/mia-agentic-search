notes: 'One 537 MB zip (peek_archive: 151,236 files, 151,235 PNG and one PDF with dataset info). The zip holds
  one folder per class; the record page gives about 57,000 classified images in 50 classes plus an unclassifiable
  folder of about 94,000. Per Kraft et al. 2022 (Frontiers full text) this is the evaluation set (59 fully
  annotated samples); the matching 63,000-image training set is a separate B2SHARE record (SYKE-plankton_IFCB_2022,
  doi 10.23728/b2share.abf913e5a6ad47e6baa273ae0ed6617a) and the 2025 update is on Zenodo (zenodo-17601020),
  which is a different, larger record. Voxel size derived from the paper statement "image resolution of
  roughly 3.5 pixels per µm" (about 286 nm); this is approximate and the stored images are crops of varying
  size. Magnification is not stated. Flow-cytometer images, so modality is other.'
