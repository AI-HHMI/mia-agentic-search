short_name: Baltic phytoplankton evaluation images (IFCB)
description: About 151,000 grayscale PNG images of phytoplankton and other particles captured in 2021 by
  an Imaging FlowCytobot at the Utö station in the Baltic Sea, fully annotated by expert taxonomists. About
  57,000 images are sorted into 50 taxon class folders and about 94,000 into an unclassifiable folder.
  Released as the evaluation set of Kraft et al. 2022.
