notes: 'The Zenodo record has no description, so most details come from the file listing: images.zip holds 229 TIFFs (269
  MB uncompressed, names like "Echinoderm047.tif" or "Mollusk (28).tif"), and split0.csv lists 229 rows: Echinoderm 50, Bryozoan
  48, Red algae 46, Mollusk 44, Foraminifera 41, with 183 train and 46 valid in split0 (the other four splits are the same size
  and were not opened). The only repository text is a one-line GitHub README ("Models for the Analysis of Bioclasts in
  Sedimentary Images"); a Europe PMC / Crossref title search found no paper, so scan size, pixel size, instrument and how
  labels were assigned are not stated in any source checked (Zenodo record, file listing, GitHub README, paper search), and
  annotations.source is unknown. The images are atomic force microscopy images per the record title; there is no AFM value in
  the modality enum, hence other. The image classes are taxonomic groups of the bioclasts, so organism is left empty.'
