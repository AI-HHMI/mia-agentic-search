    alignment_notes: Single-page greyscale ImageJ TIFFs, about 508x508 (132 files) or about 1015-1020
      px square (97 files); no spatial calibration. ImageJ Info names the source scan, mostly height-retrace
      (…HtR.tif) or ZSensor-retrace (…ZSR.tif) channels.
