notes: 'The Zenodo record has no description. images.zip holds 229 TIFFs (names like Echinoderm047.tif
  or "Mollusk (28).tif"); split0.csv lists 229 rows: Echinoderm 50, Bryozoan 48, Red algae 46, Mollusk
  44, Foraminifera 41 (183 train, 46 valid). GitHub README is one line; no paper found (Europe PMC / Crossref),
  so scan size, pixel size, instrument and labelling method are not stated; annotations.source unknown.
  AFM per the record title; no AFM value in the modality enum, hence other (not EM, light or X-ray). Classes
  are taxonomic groups of skeletal carbonate grains, so organism is left empty. enricher: size_bytes now
  includes the five split CSVs (was the zip only).'
