    - id: Mollusk
      name: Mollusk
    - id: Foraminifera
      name: Foraminifera
    alignment: not-applicable
    alignment_notes: 'Per-image class label: nombre_foto = file name in images/, clase = class, set =
      train/valid. The class is also the file-name prefix.'
  notes: 'Zenodo range requests returned HTTP 504 (peek_archive failed, listing.py saw the zip as one
    file named content), so I downloaded images.zip once (63.2 MB) and read every member with tifffile:
    229 uint16 single-page TIFFs, uncompressed, photometric minisblack, ImageJ 1.53e. Every image spans
    exactly 0..65535 (min 0 and max 65535 in all 229), so normalization is contrast-stretched (inferred
    from the full-range fill; the source scans were exported per image). No XResolution tag in the files;
    voxel size not found: checked TIFF tags, ImageJ metadata, Zenodo record (no description), GitHub README,
    Europe PMC/Crossref title searches (no paper). Size = zip + 5 split CSVs (Zenodo API file sizes).'
