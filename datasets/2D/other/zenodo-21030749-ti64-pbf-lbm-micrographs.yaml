notes: 'Zenodo API record, Processing_Parameters.csv and the Micrographs.zip listing (400 JPEG, 259.5 MB uncompressed) were read.
  The labels are the four process parameters per image (a regression-style target, not an object annotation), so annotation
  type and ML task are other; the record states the dataset was made for ML on process parameter to defect relationships but
  gives no defect or porosity masks. Pixel size, magnification and channels are not stated on the record, so they are null.
  size_bytes is the sum of the three Zenodo files (CSV, one overview JPG of the specimens and the ZIP). No paper is cited on
  the record. This is a materials-science micrograph set rather than a biological one, kept because the schema covers
  light microscopy images with a training signal.'
