description: 400 light microscopy micrographs of polished cross-sections of laser powder bed fused Ti-6Al-4V cuboids, each made with
  a different random combination of laser power, scanning velocity, hatch distance and powder layer thickness, with a CSV giving the
  four process parameters for every image, designed for machine learning on the link between process parameters and defects.
