notes: 'Zenodo record has a two-line description and no linked paper; searched Zenodo by title and found
  no publication. peek_archive of the single zip seg6 (172 files): 61 png + 25 jpg images and 86 LabelMe
  JSON files, all under raw/addtrain in the first listing. Only the first 40 paths were listed, so train/test
  folder structure is unknown. One JSON read: shapes use polygon points with label ABO3. Pixel size, SEM
  instrument and annotation procedure are not stated, so unknown; instance vs semantic segmentation is
  inferred from polygons. Modality other because SEM of non-biological bulk material is not a listed
  volume-EM modality.'
