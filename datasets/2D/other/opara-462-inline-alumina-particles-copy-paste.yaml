notes: 'Single 661 MB zip (661,181,494 B per OPARA ORIGINAL bundle; enricher: size_bytes from listing, was 661186268) (Python
  Code and Image Data.zip, listed with peek_archive: 2,385 TIFF, 69 BMP, 22 .npy, 21 .py, one 549 MB Mask R-CNN checkpoint).
  Objects and masks come from marker-controlled watershed on real in-line images (automatic, no manual annotation stated);
  the study is about generating training data by copy-paste augmentation. The real test images (example_images_model_test,
  three folders at different solids concentrations, 20 BMPs each) have no ground-truth masks that were seen in the listing.
  The pixel size 0.2314 um/px is from conversion_factor.txt for the example images and may not apply to every image. Imaging
  modality is not stated (an in-line camera), so other is used. Paper (Powder Technology) was not read: the README links only
  to doi.org with no DOI, so publications is left empty. Package code and the checkpoint were not run or opened.'
