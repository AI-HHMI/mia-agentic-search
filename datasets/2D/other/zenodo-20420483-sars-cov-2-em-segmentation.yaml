notes: 'Zip listing (peek_archive): 1402 each of N-C.bmp (image crop), N-GT.bmp (ground truth), N-CNN-R/GVF-R/PIG-R.bmp results, plus RESULTS.m; size 76.7 MB is the zip. Paper: 679 microscopy images with 1402 SARS-CoV-2 instances, masks by a medical specialist; images are crops (256x256 network input) so n_items counts crops. Microscope, TEM vs SEM, staining, pixel size and image origin are not stated on the Zenodo page or in the paper text read, so modality is other and voxel size null. The paper uses 2-fold cross-validation; no fixed split is shipped. Format is BMP (not in the schema format list). Image/mask dimensions not inspected.'
