description: 111,924 expert-labelled cropped plankton images, one particle per image, from imaging flow
  cytometers and a FlowCam. DAPlankton_LAB has 47,471 images of 15 cultured phytoplankton species from
  three instruments (IFCB, CytoSense, FlowCam); DAPlankton_SEA has 64,453 images of 31 Baltic Sea plankton
  classes from two instruments (IFCB, CytoSense). Designed for domain adaptation across imaging instruments.
