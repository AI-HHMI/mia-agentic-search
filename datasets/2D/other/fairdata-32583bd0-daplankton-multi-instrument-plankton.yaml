notes: 'Single 2.76 GB zip (DAPlankton/DAPlankton.zip) in Fairdata IDA; its contents could not be listed (Fairdata
  gives no public direct download URL via the APIs tried), so image file format, image dimensions and the
  folder/label layout are unverified and formats is set to other. Pixel size is not stated per instrument
  (only CytoSense 3.6 px/um and FlowCam 10x objective); voxel_size left null. The paper uses an 80/20
  train/test split per subset-domain, repeated 5 times; no fixed split files are documented, so splits_provided
  is false. Image counts per instrument: LAB CS 13,187, FC 17,808, IFCB 16,476; SEA CS 12,831, IFCB 51,622.
  Modality is imaging flow cytometry (light microscopy of single particles) and does not map to a listed
  value. Checked: research.fi page, Fairdata Metax v2/v3 records and file listing, arXiv paper (ar5iv HTML).'
