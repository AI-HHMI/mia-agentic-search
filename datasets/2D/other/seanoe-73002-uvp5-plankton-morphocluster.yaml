notes: 'Read the SEANOE landing page in full and listed the zip (6,078,582,607 bytes: 1,588,120 JPG images and 4 CSV files;
  the page counts 392k training, 196k validation and 1M unlabeled images, with the validation and unlabeled sets overlapping
  the MorphoCluster list, so n_items is the JPG count in the archive). The paper (MorphoCluster, Sensors 2020, full text via
  Europe PMC) describes the data as readily segmented grayscale UVP5 images, 65 expert-sorted classes from a WoRMS-based taxonomy,
  and severe class imbalance. The page says class labels are operational. Pixel size is not stated on the page or in the paper
  sections read. The UVP5 is an in-situ imaging profiler rather than a microscope, so modality is recorded as other; the page
  itself says the class labels are operational and the paper describes the unlabeled images as usable for unsupervised work.'
