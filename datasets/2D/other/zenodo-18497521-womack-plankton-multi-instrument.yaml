description: Collection of plankton image classification datasets from 12+ imaging platforms (ISIIS, IFCB,
  ZooScan, ZooCam, HOLOCAM, UVP5, DSPC, light microscope), each as a zip of class-named folders, in "preprocessed"
  and "256samples" (max 256 random images per class) versions, plus merged Combined561 and WoRMS-standardised
  Linnaeus sets. Most sets are redistributed from public sources; UW38 and HBOI19 were released by the
  authors.
