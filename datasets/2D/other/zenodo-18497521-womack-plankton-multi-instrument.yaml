notes: 'Zenodo API record lists 27 files (95.4 GB total). peek_archive on kaggle38-preprocessed (14,374 jpg), whoi22-256samples
  (5,632 tif), hboi19-256samples (4,864 tif), zooscan20-256samples (jpg), pmid23-256samples (jpg) and uw38-256samples
  (png + 5 tif) shows class-named folders of images. Labels come from the source datasets; annotation source and
  per-set image counts are not stated on the record. Accompanying paper (Womack et al.) is described as under review
  and could not be found in Europe PMC/Crossref, so no publication is listed. Modality is a mixed best fit: the
  imaging systems differ (shadowgraph, imaging flow cytometer, scanner, dark-field, hologram, light microscope),
  so brightfield is only approximate. Pixel sizes not stated. Several sets are re-releases of public data (e.g.
  WHOI-Plankton, ZooScan, Kaggle plankton sets), so overlap with other catalog records is possible; the preprocessed/256samples
  versions here are the authors'' own derivatives.'
