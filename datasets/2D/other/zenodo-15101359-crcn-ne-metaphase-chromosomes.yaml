notes: 'Zip listings read with peek_archive: images.zip (519 PNG, ~4 MB each, 2.07 GB), labels.zip (519 YOLO .txt, first label file printed with one box per line), discarded.zip (137 PNG too difficult to label, 538 MB, not part of n_items). Imaging modality, staining, magnification, pixel size and channel count are not stated on the record or the paper abstract page, so modality is other and channels null. The SBC paper PDF was not read in full (abstract page only), so annotators, class definitions beyond class ID and train/test split are unconfirmed. Same group released the CRCN-NE micronucleus dataset (separate record).'
