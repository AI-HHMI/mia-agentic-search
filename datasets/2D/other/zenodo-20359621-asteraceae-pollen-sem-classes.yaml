notes: 'Single 915 MB zip (pollen sem photos.zip, 2.8 GB uncompressed) listed with peek_archive: 960 .tif files in six species folders of 160 each. Pixel size, SEM instrument, magnification and image dimensions are not stated on the Zenodo record and were not read from TIFF headers (the probe tool does not read zip members); no paper is linked from the record and none was identified, so publications is empty. The first modality is other because the schema has no plain SEM value for surface imaging (SEM-type values are volume EM only). Species names are given without the subspecies epithets used in the record.'
