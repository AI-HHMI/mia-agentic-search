notes: 'Single 915 MB zip (pollen sem photos.zip, 2.8 GB uncompressed): 960 .tif files in six species folders of 160 each. No paper is linked from the record and none was identified, so publications is empty. The first modality is other because the schema has no plain SEM value for surface imaging (SEM-type values are volume EM only). Species names are given without the subspecies epithets used in the record. enricher: voxel size 145.703 nm (x, y) from the FEI SEM metadata in the TIFF headers (Scan PixelWidth/PixelHeight 1.45703e-07 m, same in 18 files across all six folders; was null). enricher: channels 1 (greyscale SEM stored as identical RGB samples; was null). organisms: one per folder, 1 = Echinops spinosissimus, 2 = Centaurea solstitialis, 3 = Ambrosia artemisiifolia, 4 = Cichorium intybus, 5 = Cota tinctoria, 6 = Helianthus annuus.'
