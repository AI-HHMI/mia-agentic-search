notes: 'Synthetic images with generator-derived instance masks (no human annotation
  of the 6,600 images); the paper also annotates 66 real IRM crops for evaluation,
  which are not part of this HF dataset as far as the card/paper text shows. Single
  train split on HF (8 parquet shards, ~3.96 GB download); no train/test split provided.
  Modality listed as other (interference reflection microscopy is not in the schema
  enum). Pixel size not stated for the synthetic images; the real IRM source images
  are stated as 9.09-9.23 px/um (~108-110 nm/px) in the preprint. formats=other because
  the files are parquet (PNG images inside). Sources checked: HF card and API, PLOS
  Comp Biol full text via Europe PMC, bioRxiv preprint.'
