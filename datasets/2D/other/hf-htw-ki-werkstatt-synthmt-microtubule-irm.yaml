description: 6,600 synthetic 512x512 interference-reflection-microscopy-like images
  of in vitro microtubules with pixel-perfect per-instance masks, generated by a pipeline
  tuned on real IRM frames of reconstituted microtubules (44 real videos from two
  labs, 66 cropped target domains).
