notes: 'Dataset card (read in full): train_annotated/ 58 fields (2 groups) with manual cell and chloroplast
  instance masks; downsampled/ 125 fields with predicted masks; test_production/ 70 images without masks;
  total 2.736 GB in 1,167 files. Collections overlap (58 byte-identical image groups across them) and
  are not a leakage-free split. The card states that no licence was specified in the source delivery and
  none is assigned, so license is unknown. Microscope type and acquisition settings are not documented
  (the source note only says light-microscope photos), so modality is other; physical calibration (pixel
  size) is explicitly unavailable. No paper or DOI exists, so none was searched beyond the card. enricher:
  size 2,736,820,681 B from the HF file listing (was 2.736 GB); channels 3 (RGB colour TIFF, samples differ);
  jpeg added (test_production/, qc/).'
