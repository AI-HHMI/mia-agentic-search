notes: 'Read the Kaggle record (license field "Other (specified in description)", 119 MB, updated 2022-07-31; the description only
  asks to cite the paper), the GitHub README (the repository LICENSE is MIT, but that file belongs to the code and the README
  states no data terms) and the J. Chem. Inf. Model. paper (open access via PMC). The 465 images were mined from Elsevier
  articles from 2015-2020 and annotated with VGG Image Annotator, so reuse terms of the underlying figures are unclear;
  spdx stays unknown. The paper uses 366 images for training and 99 for testing (split chosen by publication), but no split
  file was seen, so splits_provided is false. I could not list the Kaggle files or the GitHub tree (login or API not
  available), so the file formats are set to other and the layout is taken from the paper and Kaggle text. Pixel size is
  not given (scale bars were measured separately in the paper pipeline). Both SEM and TEM images are included, so modality
  is other.'
