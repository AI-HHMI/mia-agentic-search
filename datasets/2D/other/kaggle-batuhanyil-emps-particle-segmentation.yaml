    channels identical (grey as RGB); segmap 515x512 uint16 (PNG mode I;16), values 0-4 (5 unique), consistent with
    instance ids as the paper describes. One sample; image sizes vary (figures mined from papers). sample is null because
    zip members could not be checked through the redirect (probe: no end-of-central-directory via www.kaggle.com) and
