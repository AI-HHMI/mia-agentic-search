notes: 'Zenodo description: images collected from published papers and unpublished personal collections; zircon
  classified and labelled manually; used for a classification study submitted to Geoscience Frontiers. The paper
  could not be found (Europe PMC title search and WebSearch), so no publication is listed and the instrument, pixel
  size and labelling procedure are not stated on the dataset page. Zip listing (peek_archive): 4,282 files in six
  folders, hydrothermal 414, igneous 647, metamorphic 331 originals and hydrothermal-aug 1,551, igneous-aug 919,
  meta-aug 420 augmented copies; the augmented copies derive from the originals, so train/test splits must keep
  them together. Because images come from many sources, the CC BY 4.0 on the record may not cover every original
  image. Cathodoluminescence is an SEM-based imaging mode, hence modality other. enricher: channels 1 (PNGs are
  grey stored as RGB, 3 identical samples; was null).'
