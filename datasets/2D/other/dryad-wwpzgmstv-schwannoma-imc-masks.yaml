notes: 'Total size 2.45 GB includes the 1.28 GB AnnData and CSVs; images.zip is 700 MB, masks.zip 14.6 MB. Masks generated
  automatically (Bodenmiller ImcSegmentationPipeline with Ilastik; paper validates them against manual segmentation by Jaccard
  index); one ROI (NF2VS10.1b) was lost. enricher: license CC0-1.0 from the Dryad API record (was unknown). enricher: pixel
  size 1x1 um from paper Methods ("laser ablated ... at 1 um2 pixel resolution") (was null); 2D, z null. enricher: modality
  other (was fluorescence-other): imaging mass cytometry (Hyperion laser ablation + CyTOF), not fluorescence. enricher: paper
  added (Nat Commun 2025, Data availability cites this Dryad DOI); ROIs are 1000x1000 um, 40-antibody panel.'
