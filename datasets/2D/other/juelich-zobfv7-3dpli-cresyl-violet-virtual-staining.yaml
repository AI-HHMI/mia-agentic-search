notes: 'Task is paired image-to-image translation (3D-PLI to stained histology), so the training signal is the registered Cresyl violet
  target, not segmentation labels (annotations.types other). License is ambiguous: the Jülich DATA license field says CCBY while the
  record description says "can be used under licence CC-BY-NC-SA" (the paper itself is CC BY 4.0); recorded as custom, check before use.
  Listing (Dataverse API): 160 files, 51.7 GB: train/test ROIs 0000-0030 as HDF5 (cresyl, transmittance, retardation, direction
  per ROI, 31 each), test/ section 0559 BigTIFFs (direction, fom, ntransmittance, retardation) and model predictions (gan, gan.reg,
  gram, gram.reg). Pixel size 1.3 um/px from the description and paper (the Cresyl violet scans are 1 um originally, resampled to
  match). Species of the vervet monkey is not named beyond that (genus given as organism). Registration of the stain was done by the
  authors (affine; non-linear for test), so source is automatic.'
