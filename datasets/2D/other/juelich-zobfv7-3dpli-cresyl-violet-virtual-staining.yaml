title: Replication data for virtual Cresyl violet staining from 3D polarized light imaging
short_name: Brain 3D-PLI to Cresyl violet pairs (histology)
description: 'Jülich DATA record with 31 square regions of interest (4096 x 4096 px, 1.3 um/px) from eight coronal sections of a vervet
  monkey brain: for each ROI the 3D-PLI transmittance, retardation and fibre direction maps and the registered Cresyl violet
  (Nissl) stain as HDF5 (27 training ROIs with affine-registered stain, 4 test ROIs with non-linearly registered stain and fibre
  orientation maps), plus whole-section BigTIFFs and model predictions for test section 559.'
