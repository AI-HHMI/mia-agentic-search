notes: 'Read the Zenodo API record and listed the 38.8 MB zip (939 files: 935 JPG, 4 COCO JSON), then read all four JSON files:
  train2017 has 503 images and 1,166 instances, val2017 216 images and 515 instances, overlap 100 images and 298 instances,
  separate 116 images and 217 instances, all 1024 x 1024, one category "nematode". The overlap and separate folders sum
  to the 216 val images and are most likely the val split divided by overlap, so n_items counts the 719 unique train and
  val images (not verified by file name). The Zenodo description is only the citation of the SSCNet paper (PRCV 2025); I
  could not find that paper open access, so the microscope, contrast mode, pixel size, who annotated and how are not known;
  modality is other and annotation source unknown. enricher: channels 1 (grayscale JPEG, mode L).'
