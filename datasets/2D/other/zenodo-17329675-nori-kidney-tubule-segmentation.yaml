notes: 'Found via the 2026 Scientific Reports paper (Europe PMC full text read). Zip listing (529 files: 322 TIFF, 202 CSV) was read with
  peek_archive: images/ holds large stitched images (some up to 539 MB), a "Kidney Anatomy" set and per-image "Segmentation Analysis"
  folders with raw, masks, tubule_class and gold/automatic CSV. The paper states ground-truth tubule masks were made by manually
  correcting SAM output (about 8 h per image from scratch, so source is mixed), but the zip does not obviously hold masks for all
  100 images, so coverage is partial and the count of labelled images is unverified. Pixel size 414 nm is from the paper Methods.
  Modality is label-free stimulated Raman scattering (no enum value) with a confocal immunofluorescence channel.'
