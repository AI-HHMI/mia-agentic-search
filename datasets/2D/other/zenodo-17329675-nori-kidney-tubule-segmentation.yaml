    urls:
    - https://zenodo.org/records/17329675/files/nori_kidney_dataset.zip?download=1::images/Segmentation
      Analysis/C10_Day1_MAP1/C10_Day1_MAP1_raw.tiff
    - https://zenodo.org/records/17329675/files/nori_kidney_dataset.zip?download=1::images/Segmentation
      Analysis/C10_Day1_MAP1/C10_Day1_MAP1_masks.tiff
    - https://zenodo.org/records/17329675/files/nori_kidney_dataset.zip?download=1::images/Segmentation
      Analysis/C10_Day1_MAP1/C10_Day1_MAP1_tubule_class.tiff
    - https://zenodo.org/records/17329675/files/nori_kidney_dataset.zip?download=1::images/Segmentation
      Analysis/C10_Day1_MAP1/C10_Day1_MAP1_gold.csv
    size_bytes: 47010341
    description: 'One field of view (C10_Day1_MAP1): 6-channel NoRI/IF image, 6-channel mask stack, tubule
      class map and the human-corrected per-tubule table.'
  arrays:
  - role: raw
    path_pattern: nori_kidney_dataset.zip/images/Segmentation Analysis/*/*_raw.tiff
    format: tiff
    axes: cyx
    shape:
    - 6
    - 1970
    - 2942
    shape_varies: true
    dtype: uint16
    compression: deflate
    value_range:
    - 0
    - 7180
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Channels (TIFF description JSON, axes CYX): protein, lipid, endomucin, LTL, uromodulin,
      AQP2. Raman channels are calibrated concentrations (16-bit); IF channels 12-bit (max 4095 in the
      sample).'
  - role: label
    path_pattern: nori_kidney_dataset.zip/images/Segmentation Analysis/*/*_masks.tiff
    format: tiff
    axes: cyx
    shape:
    - 6
    - 1970
    - 2942
    shape_varies: true
    dtype: uint16
    compression: deflate
    value_range:
    - 0
    - 241
    encoding: instance-ids
    classes:
    - id: 0
      name: tubule_gt (human-corrected tubule instances)
    - id: 1
      name: tubule_auto (automatic tubule instances, ilastik-cleaned)
    - id: 2
      name: nuclei (binary)
    - id: 3
      name: brushborder (binary)
    - id: 4
      name: lumen (binary)
    - id: 5
      name: glomeruli (binary)
    alignment: same-grid
    alignment_notes: classes ids are channel indices. Channels 0-1 hold instance ids (234 / 241 in the
      sample), channels 2-5 are {0,1}. Same shape as <name>_raw.tiff in the same folder.
  - role: label
    path_pattern: nori_kidney_dataset.zip/images/Segmentation Analysis/*/*_tubule_class.tiff
    format: tiff
    axes: yxs
    shape:
    - 1970
    - 2942
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    encoding: rgb-colors
    classes:
    - id: '[255,0,0]'
      name: LTL+ tubule
    - id: '[0,255,0]'
      name: Umod+ tubule
    - id: '[0,0,255]'
      name: AQP2+ tubule
    - id: '[255,255,255]'
      name: unknown tubule class
    - id: '[0,0,0]'
      name: background
    alignment: same-grid
    alignment_notes: RGB class map (README); sample has exactly these 5 colours. Same yx as raw.
  - role: label
    path_pattern: nori_kidney_dataset.zip/images/Segmentation Analysis/*/*_gold.csv
    format: csv
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: other
    alignment: not-applicable
    alignment_notes: Per-tubule measurements on the human-corrected segmentation (README); *_automatic.csv
      is the same on the automatic one.
  notes: 'Listing: tools/listing.py --expand-zips (529 members, exact sizes, 7,296,116,366 B). Sample:
    C10_Day1_MAP1 raw (46.1 MB) and masks (0.55 MB) via sample.py, plus a script re-reading raw, masks
    and tubule_class (tifffile) for channel metadata and per-channel ids; value_range from that one FoV
    (full array). Shapes vary between FoVs (folder sizes 27-96 MB). Headers carry no physical calibration
    (resolution 1/1, no unit); pixel size 414 nm from paper Methods. normalization unknown: Raman channels
    are NoRI concentration maps (paper), IF channels raw 12-bit. Download: the single zip is direct (Zenodo,
    range requests).'
