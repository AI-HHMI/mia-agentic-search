notes: 'Found via the 2026 Scientific Reports paper (Europe PMC full text read). Pixel size 414 nm is
  from the paper Methods (headers carry no calibration). Modality is label-free stimulated Raman scattering
  (no enum value) with confocal immunofluorescence channels. enricher: all 100 FoV folders hold raw, masks,
  tubule_class, gold and automatic files (coverage dense, was partial). Source mixed: tubule_gt = SAM
  output corrected by a domain expert (proofread); tubule_auto, nuclei, lumen (ilastik), brush border
  (Otsu) and tubule classes (ilastik object classifier) are automatic (paper Methods). channels 6 (was
  3): protein, lipid, endomucin, LTL, uromodulin, AQP2 per the TIFF description. Kidney Anatomy (19 tif)
  and 3 Fused_S*.tiff in images/ have no masks.'
technical:
