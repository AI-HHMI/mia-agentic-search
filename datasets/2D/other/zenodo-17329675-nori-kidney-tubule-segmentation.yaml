title: Normalized Raman Imaging (NoRI) Kidney Dataset
short_name: Mouse kidney tubule masks, label-free Raman (NoRI)
description: Stitched Normalized Raman Imaging (stimulated Raman scattering) images of mouse kidney sections
  with protein and lipid concentration channels plus an immunofluorescence channel, in 100 images across
  three experimental groups (male vs female, ischemia time course, regional anatomy). A "Segmentation
  Analysis" folder provides raw images, tubule instance masks, tubule-class maps and manual versus automatic
  measurement tables.
