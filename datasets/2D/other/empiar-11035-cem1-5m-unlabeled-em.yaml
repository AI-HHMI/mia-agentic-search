notes: 'Unlabeled by design, curated for deep learning (EMPIAR description; the paper abstract says a
  ~1.5 x 10^6 image 2D unlabeled cellular EM dataset was amassed to train MitoNet), so it qualifies as
  a resource for self-supervised / foundation-model training, but no explicit self-supervised use is stated.
  Zip listed with peek_archive: 1,592,753 members (all or almost all .tiff), 61.8 GB compressed, 76.5
  GB uncompressed. The citation on the EMPIAR entry has no DOI; the DOI is of the Cell Systems paper identified
  by title (Conrad & Narayan 2023), which is not open access, so only its abstract was read. Pixel size,
  organism and modality vary by source set and are not given in the entry; modality is other. Related
  labelled subset CEM-MitoLab is EMPIAR-11037 (already in catalog). enricher: size now exact from the
  file listing (zip + entry XML); 640 source folders in the zip.'
