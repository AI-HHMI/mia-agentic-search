description: 1,592,753 heterogeneous, non-redundant unlabeled 2D cellular electron microscopy image patches
  (mostly 224x224, some 512x512 or smaller) in 651 subdirectories, each a unique volume or 2D EM image
  set, curated for deep learning following the CEM500K procedure. The unlabeled superset from which the
  labelled CEM-MitoLab subset was drawn.
