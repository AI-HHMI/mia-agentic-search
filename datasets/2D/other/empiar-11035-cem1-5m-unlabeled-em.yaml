  notes: 'listing.py on the zip and entry XML: 61,833,800,952 B exact (central directory: 1,592,753 .tiff
    members in 640 folders under cem1.5M/). Over 50 GB, so no auto-download. A scratch script (repo read_member
    + tifffile) read 3 members from different folders: all uint8, uncompressed, 224x224 or 191x224 (edge
    patch), so shape varies; value ranges 21-255, 43-83 and 75-236. TIFF resolution tags are 1/1 with
    no unit, so no pixel calibration. The file names encode crop coordinates (y0-y1_x0-x1). No labels
    by design. No small sample unit is given because every file is a single patch.'
