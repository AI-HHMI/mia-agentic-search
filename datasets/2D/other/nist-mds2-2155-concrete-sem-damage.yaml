id: nist-mds2-2155-concrete-sem-damage
title: 2D Segmentation of Concrete Samples for Training AI Models
short_name: Concrete SEM damage segmentation (SEM)
description: 1,360 scanning electron microscopy fields of view (FOVs) from one concrete core (sample M3, day 180)
  showing alkali-silica reaction damage, as PNG tiles. Masks come in three tiers - 12 FOVs with manual pixel-level
  masks of 9 contextual classes, 106 FOVs with damage-assisted masks, and 1,360 FOVs with context-assisted masks
  - for the classes paste damage, aggregate damage, air voids and no damage. NIST also hosts a web tool for scoring predicted masks.
