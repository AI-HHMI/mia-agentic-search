notes: 'Four zips on the NIST page (rawFOV 690 MB, contextManualMaskGT, damageAssistedManualMask, damageContextAssistedMask),
  listed with peek_archive: 1,360 raw .ome.png, 12 manual context masks, 106 damage-assisted masks, 1,360 context-assisted
  masks. SEM is not a schema modality, so modality is other. enricher: paper (PMC7849179 author manuscript): backscattered
  SEM, FEI Quanta 600, 15 kV, 200X; FOVs 1024x768 at 1.47 um, but the files are 950x712, so voxel size stays null.
  No split stated. The raw images come from one core only; the page says a CSV of manual labels selects 1,323 accurate
  FOVs. Publication date is not stated (NIST record modified 2019-11-18). License is the NIST open license link
  in the NIST record. enricher: size_bytes is now the exact total of the four zips (was 971.2 MB uncompressed);
  download_url = rawFOV.zip (masks are 3 more zips).'
