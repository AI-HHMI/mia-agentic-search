notes: 'Four zips on the NIST page (rawFOV 690 MB, contextManualMaskGT, damageAssistedManualMask, damageContextAssistedMask),
  listed with peek_archive: 1,360 raw .ome.png, 12 manual context masks, 106 damage-assisted masks, 1,360 context-assisted masks.
  SEM is not a schema modality, so modality is other. Pixel size, microscope model and the split are not stated on the dataset
  page, the NIST record or the paper abstract; the paper (J. Microscopy 2020, PMC7849179) is not open access so its Methods were
  not read. The raw images come from one core only; the page says a CSV of manual labels selects 1,323 accurate FOVs.
  Publication date is not stated (NIST record modified 2019-11-18). License is the NIST open license link in the NIST
  record. size_bytes is the uncompressed total of the four zips.'
