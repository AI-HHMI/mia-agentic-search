notes: 'Annotations are bounding boxes in COCO and YOLO formats, made with Label Studio by experts (paper
  section 4.1). The single file IFCB-PAD.zip (189 MB) is listed in the Fairdata Metax record; its contents
  could not be listed (no range requests on the download endpoint), so the image file format and exact
  image count (page says ''over 6200'') are not verified. Images come from an Imaging FlowCytobot (flow-imaging
  system) at Uto, Baltic Sea; pixel size not stated on the page or in the paper text read. Classes: Aphanizomenon,
  Centrales, Dolichospermum, Chaetocero(s), Nodularia, Pauliella, Peridiniella chain/single, Skeletonema,
  each with OK and anomalous (NOK, e.g. parasite-infected) images. No direct download URL found (Fairdata
  IDA).'
