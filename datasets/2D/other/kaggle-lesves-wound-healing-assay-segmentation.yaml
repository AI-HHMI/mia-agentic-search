short_name: Wound healing assay segmentation (microscopy)
description: Microscopy images of in vitro wound healing (scratch) assays with segmentation masks of the wound area, created
  with a web-based annotation tool and a classical segmentation algorithm with manual adjustments. Covers U2OS, MiaPaCa-2,
  MRC-5 and UFH-001 cells, split into train and test folders of JPEG images and masks.
