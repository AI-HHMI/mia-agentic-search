notes: 'Kaggle API record (owner Lukáš Veškrna, licence shown as Unknown) and the complete file listing: 401 train and 44
  test image/mask pairs as JPEG (445 pairs; the description says 446 images). The description gives 200 U2OS, 147 MiaPaca-2,
  47 MRC-5 and 52 UFH-001 images. A web search suggests the dataset belongs to a 2025 Charles University bachelor thesis ("Cellular
  Wound Healing Monitoring Tool"), but its page could not be fetched (HTTP 429), so no paper is cited and the imaging mode,
  magnification, pixel size and annotation details are unknown. No licence was found, so terms of use are unclear. Masks are
  made by a classical algorithm plus manual adjustment, hence source mixed. enricher: organism Homo sapiens (all four cell
  lines are human per Cellosaurus; was empty); channels 1; masks binary 0/255 with JPEG artefacts; download_url is the Kaggle
  archive API URL.'
