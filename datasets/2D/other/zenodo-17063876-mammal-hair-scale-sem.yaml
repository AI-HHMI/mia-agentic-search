notes: 'Scanning electron microscopy of animal hair; the schema has no plain SEM value, so modality is
  other. Ten files: ori_all_training.tar (18.5 GB, raw images outside the test set), 2025_85_720 tar/zip
  variants (augmented training sets after SAM-based background removal, 25/30/50 percent subsets), 2025_15_100.tar
  (test set), seg.tar (segmentation models and annotated data), and three model zips; size_bytes is the
  sum of all files. Only 2025_85_720_per25.zip was listed (4,500 TIFFs in species folders, e.g. Raccoon_dog);
  The paper (full text read) states 9,953 valid images, 33 species (19 with several individuals, 14 from
  one), train/test split by individual, and no pixel size; the species list is in its Supplementary Table
  S1, which was not read, so organism is empty. enricher: seg.tar headers show gTruth_20241112.mat and
  PixelLabelData_1/Label_<n>.png masks; paper: 1,144 images manually labelled (hair regions, scale bars)
  for training and 250 for evaluating segmentation.'
