notes: Single 49 GB tar.gz (DDS4.tar.gz) of folders NEGATIVE, SCANTY, 1+, 2+, 3+,
  each with SET0-SET49 holding BMP EDF tiles (164, 164, 164, 82 and 32 files per set)
  and a ground_truth_N.txt; n_items is the sum implied by the directory PDF (50 x
  606). The archive could not be listed remotely (tar.gz), so annotation files are
  taken from the dataset description and the directory PDF, not seen in a file listing.
  The description states there is no annotation inside the images themselves; labels
  are the slide-level grade and the per-set bacilli count. The stain and illumination
  (brightfield vs fluorescence) are not stated on the page, so modality is other;
  the images are 24-bit colour. Sibling records from the same authors (ODS2, ODS3,
  DDS2) are already catalogued or proposed. No paper is cited on the page. Checked
  the figshare record and its directory PDF.
