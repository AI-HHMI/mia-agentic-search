notes: 'Kerr-effect (magneto-optical) microscopy of non-biological thin films; no schema modality fits, so other. Zip lists 2,960 PNG in images/ and in labels/, three .keras models, partition.txt (train/test/val groups) and table.csv; the page says about 2400 images, the zip count is used. Per the preprint the 3-class labels are partly weak: 100 defect-rich measurements were labelled by hand, a model labelled the original 1901 images (2001 weakly labelled in total), validation and test sets (200 each) are manual, so source is mixed. Pixel size and field of view are not stated on the page, README or preprint passages read; the preprint (arXiv 2303.16905) was read, not the paywalled journal version.'
