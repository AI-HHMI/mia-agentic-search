description: About 2,960 magneto-optical Kerr effect (MOKE) microscopy images of magnetic thin films (about 30 measurement
  series) focused on magnetic skyrmions and material defects, with pixel-wise 3-class labels (background, skyrmion, defect)
  as PNG files, a table mapping measurement series to files, a train/test/validation partition file and three trained Keras
  U-Net models.
