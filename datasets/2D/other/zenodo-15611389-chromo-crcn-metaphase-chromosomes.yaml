description: 519 images of cells in metaphase, each paired with a YOLO-format text file of bounding boxes
  (single class 'Chromosome', normalised x_center, y_center, width, height) for detecting chromosomes.
  Collected through a collaboration between CRCN-NE and UFRPE for cytogenetics research. A separate archive
  holds discarded images that were too difficult to label.
