notes: 'Record text is short; no paper was found (Europe PMC / Crossref title search found nothing) and the microscope,
  staining, magnification and pixel size are not stated on the Zenodo page or in the archive, so modality is other (light
  microscopy of metaphase cells is implied but not confirmed), organism is empty (not stated, presumably human cytogenetics)
  and voxel size is null. yolo_dataset.zip (2.08 GB, 1040 files) holds 519 PNG images (about 4 MB each), 519 YOLO txt label
  files, classes.txt and notes.json (Label Studio export); the images are in an images/train folder, no val/test folders
  seen. discarded.zip (0.78 GB, 137 TIFF files) holds images too hard to label and is not counted in n_items. Size is the
  sum of both Zenodo files.'
