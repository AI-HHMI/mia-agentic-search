  notes: 'Listing from the central directory of dataset_split.zip (split zip, 47 parts listed with exact sizes by the OSF
    files API; sum 24,622,229,819 bytes compressed, 34,770,512,340 bytes uncompressed). 13 members (one per folder, plus extra
    Phenom_Images and val/Round-2 PNG) were range-read from the parts and decoded (31 MB); value ranges and shapes are from
    these single files. val/ repeats 3,167 train/ file names with identical sizes (grids, Phenom_Images), so train/val is
    not a clean split. No sample unit: members of a split zip cannot be fetched as <zip>::<member> (probe: "not a zip"), and
    every part is 0.5 GB; download_url stays null because the dataset is 47 parts to join with zip -s0. Voxel size: per-file
    FeiImage pixelWidth varies (9.26 to 443.4 nm); other folders carry no calibration; paper Methods, OSF page and wiki state
    none. License: OSF node_license null, wiki and paper Data availability name none (code repo MIT covers code only).'
