notes: 'Split zip (dataset_split.z01-z46 + .zip; join with zip -s0). size_bytes = sum of parts (compressed); about 34.8 GB
  uncompressed. peek_archive lists 24,716 .tiff and 35 .png under sem_segmentation_ssl/train/; no annotation files seen. Paper
  states the 24,751 images are unannotated, for pretext tasks. Pixel size not stated on OSF page, wiki or paper Methods. License:
  OSF node license is null; the CC-BY link in the paper covers the article, so license is unknown. SEM has no modality enum
  value, hence other. enricher: formats + png (35 grey PNGs in val/Round-2, val/Round-3, images not masks); channels 1 from
  headers. Pixel size differs per subset (TIFF FeiImage headers: 443.4 nm Combined_New_Scans_Andrea, 9.26 and 55.6 nm Phenom_Images;
  others uncalibrated), so voxel_size_nm stays null.'
