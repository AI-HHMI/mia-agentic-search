title: Unlabeled SEM dataset for self-supervised learning (24,751 tabletop SEM images)
short_name: Unlabeled SEM particle images (self-supervised)
description: 24,751 unlabeled scanning electron microscopy images of particle samples, captured as raster-scanned single frames
  with a Thermo Fisher Phenom XL tabletop SEM and kept without filtering (including blurred frames and background or carbon-tape
  only frames). Released for self-supervised pretraining (DenseCL, ConvNeXtV2 FCMAE) for particle segmentation. The OSF project
  also hosts the ConvNeXtV2 pretraining weights.
