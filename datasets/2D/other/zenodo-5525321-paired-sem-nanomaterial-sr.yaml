notes: 'One zip (J74_Data.zip) listed with tools/peek_archive.py: 44 .bmp files (1.3 MB each, 1280 x 1024 estimated from the paper figure, not verified per file) named <id>_<n>_10000.bmp and <id>_<n>_20000.bmp, i.e. 22 low/high magnification pairs. BMP is not in the schema format list, hence other. Modality is scanning electron microscopy of material-science (nanomaterial) samples, which the schema has no value for. Pixel size, accelerating voltage and the identity of the materials are not stated on the Zenodo record or in the arXiv paper text read; no train/test split is provided (the paper splits sub-images itself). Targets are the physical 20000x acquisitions, not manual labels. Small dataset (22 pairs), non-biological specimens.'
