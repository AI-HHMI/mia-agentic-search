description: Image set from the paper on super-resolution for paired electron microscopic images. 22 pairs
  of scanning electron microscope images of the same specimen, one at lower magnification (file names
  ending _10000) and one at twice the magnification (_20000) covering a part of the same field of view,
  for learning to reconstruct a high-resolution image over the whole field.
