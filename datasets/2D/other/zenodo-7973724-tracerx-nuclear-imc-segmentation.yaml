notes: 'IMC (imaging mass cytometry) is not in the modality enum, hence other. Zenodo API: license cc-by-4.0; the record has
  three zips, this record covers only TRACERx_NISD.zip (5.7 MB, 581 files). Paper: two experts manually labelled 41,962 nuclei;
  a 16-tile test set was held out in the paper, but the Zenodo files have no split. Raw 41-channel IMC data only on request
  (not part of this record). enricher: voxel size 1000x1000 nm from the paper (116 tiles of 256x256 um) and the PNG headers
  (256x256 px) (was null). enricher: channels 1 from PNG headers (was null). enricher: 16bit/ holds the instance ID masks,
  not 16-bit images (sampled); 108 of 116 are 8-bit PNGs whose IDs repeat across distant nuclei (wrap at 255), so relabel
  by connected components before use. enricher: folder meanings now from the paper Methods (nuclear material, centre of mass,
  boundaries).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "TRACERx_NISD.zip  (5,713,559 B, 581 members)\n  TRACERx_NISD/TRACERx_NISD_dataset_information.csv   imagename,\
      \ tilename, histology, tissue type\n  TRACERx_NISD/images/<tile>.png              116  3.5 MB  contrast-adjusted IMC\
      \ nuclear image\n  TRACERx_NISD/16bit/<tile>.png               116  972 KB  instance ID masks\n  TRACERx_NISD/edge_weighted_nuc/<tile>.png\
      \   116  584 KB  binary nuclear material\n  TRACERx_NISD/com/<tile>.png                 116  241 KB  binary centres\
      \ of mass\n  TRACERx_NISD/boundaries/<tile>.png          116  288 KB  binary boundaries\n  <tile> e.g. P1_TMA001_L_20190508-roi_16_0_6\n"
    n_files: 1
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/7973724/files/TRACERx_NISD.zip::TRACERx_NISD/images/P1_TMA001_L_20190508-roi_16_0_6.png
    - https://zenodo.org/records/7973724/files/TRACERx_NISD.zip::TRACERx_NISD/16bit/P1_TMA001_L_20190508-roi_16_0_6.png
    - https://zenodo.org/records/7973724/files/TRACERx_NISD.zip::TRACERx_NISD/edge_weighted_nuc/P1_TMA001_L_20190508-roi_16_0_6.png
    - https://zenodo.org/records/7973724/files/TRACERx_NISD.zip::TRACERx_NISD/com/P1_TMA001_L_20190508-roi_16_0_6.png
    - https://zenodo.org/records/7973724/files/TRACERx_NISD.zip::TRACERx_NISD/boundaries/P1_TMA001_L_20190508-roi_16_0_6.png
    size_bytes: 32261
    description: 'One 256x256 tile: image plus its instance mask and three binary feature masks (zip members); the whole zip
      is 5.7 MB.'
  arrays:
  - role: raw
    path_pattern: TRACERx_NISD.zip::TRACERx_NISD/images/*.png
    format: png
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: contrast-stretched
    alignment: not-applicable
    alignment_notes: 'Paper: released as contrast-adjusted images; which IMC DNA channel(s) they show is not stated.'
  - role: label
    path_pattern: TRACERx_NISD.zip::TRACERx_NISD/16bit/*.png
    format: png
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: false
    dtype: uint16
    compression: deflate
    value_range:
    - 0
    - 255
    encoding: instance-ids
    classes:
    - id: 0
      name: background
    - id: null
      name: nucleus (one id per nucleus)
    alignment: same-grid
    alignment_notes: 'Pairs by identical file name across all five folders. 108 of 116 files are 8-bit grey PNGs (dtype uint8),
      8 are 16-bit (uint16, up to 639 ids); dtype given as uint16 to hold both. In 8-bit files with 255 ids the same id covers
      distant nuclei (wrapped): relabel connected components.'
  - role: label
    path_pattern: TRACERx_NISD.zip::TRACERx_NISD/edge_weighted_nuc/*.png
    format: png
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: nuclear material
    alignment: same-grid
    alignment_notes: Same file names as images/; foreground is 86% of the instance mask foreground in the sample (edges trimmed).
  - role: label
    path_pattern: TRACERx_NISD.zip::TRACERx_NISD/com/*.png
    format: png
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: nucleus centre of mass
    alignment: same-grid
    alignment_notes: Same file names as images/.
  - role: label
    path_pattern: TRACERx_NISD.zip::TRACERx_NISD/boundaries/*.png
    format: png
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: false
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: boundary between touching nuclei
    alignment: same-grid
    alignment_notes: Same file names as images/.
  notes: 'Zip central directory listed (581 members, exact sizes). Probed one file per folder (all 256x256 grey PNG, deflate).
    Sampled tile P1_TMA001_L_20190508-roi_16_0_6: images 0..255, mean 17, 68% zeros (paper: contrast-adjusted); feature masks
    {0,255}. Read all 116 16bit/ masks (972 KB): 108 8-bit (max 255 ids), 8 16-bit (343-639 ids); 28,171 distinct ids in total
    vs 41,962 nuclei in the paper, and in 8-bit tiles with 255 ids some ids span >40 px (several nuclei), so ids wrap in those
    files. value_range is from one sample. Folder meanings from the paper Methods (UNet++ trained on nuclear material, centre
    of mass and boundaries; edges of the nuclear material mask negatively weighted). Voxel size: tile extent 256x256 um (paper)
    over 256x256 px (headers).'
