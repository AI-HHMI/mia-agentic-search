notes: 'IMC (imaging mass cytometry) is not in the modality enum, hence other. Zenodo API: license cc-by-4.0; the record has
  three zips, and this record covers only TRACERx_NISD.zip (5.7 MB). peek_archive of that zip: 581 files = 116 each in images/,
  16bit/, com/, boundaries/ and edge_weighted_nuc/ plus the info CSV. Paper (PMC, open access): two experts manually labelled
  41,962 nuclei on 256x256 um tiles; a 16-tile (6,453 nuclei) test set was held out for benchmarking, but the Zenodo files
  have no split. Pixel size and the DNA channels used are not stated on the Zenodo page, in the paper text read (first
  100 kB) or in the info CSV, so voxel size is null. Raw 41-channel IMC data is available only on request (not part of this
  record). Which folder holds which mask type is inferred from folder names.'
