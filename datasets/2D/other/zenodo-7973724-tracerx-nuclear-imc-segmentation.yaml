title: TRACERx Nuclear IMC Segmentation Dataset (NISD) - expert-labelled nuclei in imaging mass cytometry tiles
short_name: TRACERx IMC nuclei segmentation (lung tissue)
description: Training dataset of 116 imaging mass cytometry (IMC) image tiles with about 42,000 expert-labelled nuclei from
  lung cancer (several histologies), normal lung and other tissues. Provided as contrast-adjusted PNG tiles, 16-bit PNG versions,
  instance label masks and derived boundary / edge-weighted maps. Part of Zenodo record 7973724 (with model weights and a
  PHLEX test dataset).
