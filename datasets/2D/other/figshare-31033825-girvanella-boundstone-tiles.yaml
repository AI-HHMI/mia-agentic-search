title: High-resolution annotated dataset of Girvanella boundstone microfacies from the Xiannüdong Formation, China
short_name: Carbonate microfacies slab tiles (Girvanella)
description: 27,345 PNG tiles (114x114 px, ~0.01 mm/pixel) cut from polarizing-microscope images of seven thin-section
  slabs of Cambrian calcimicrobial Girvanella crust-cement boundstone, each labelled with one of ten carbonate microfacies
  classes (e.g. Girvanella boundstone, peloidal packstone, dolomitic mudstone) via a point-counting-based automated annotation
  workflow. Split into training, validation and test subsets, with a CSV of labels.
