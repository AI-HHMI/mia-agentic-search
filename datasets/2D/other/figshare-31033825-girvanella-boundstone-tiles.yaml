notes: 'Figshare lists images.zip (589 MB; 27,349 entries, ~27,345 PNG tiles in dataset_train/val/test with class folders 0-9),
  labels.zip (labels/dataset_labels.csv) and README.md. Tile counts per class from the paper: dolomitic mudstone 13,591,
  Girvanella boundstone 6,900, skeletal grainstone 2,171, others 65-1,402 (strongly imbalanced). Split is stratified 80/10/10.
  This is a geology (non-biological) microscopy dataset; slabs were imaged with a polarizing microscope and digital camera,
  so modality is other. Pixel size 0.01 mm from the paper text. Labels come from manual annotation masks turned into tile
  classes by an automated workflow (source=mixed); the paper reports >95% agreement on a 10% check. Paper text lacks the Figshare
  DOI; it comes from the Crossref reference list.'
