notes: 'Read the GitHub README, the arXiv page and the arXiv PDF in full; the paper is not in Europe PMC. The README says only "Download address" and gives a Google Drive file link (https://drive.google.com/file/d/1uvgWJWyolqZ3WN-rdEJUK_yUENdLq7NY/view), which was not opened, so file format, size and folder layout are unknown (formats other, download_url null, no file listing). No license on the repository or in the paper (the arXiv license covers the paper only); the paper calls the dataset open-access. Olympus BX51 DIC microscope with camera; pixel size not stated. 2,769 images, 24-347 per species, 3-10 images per specimen at different focal planes, so images of one specimen are correlated. The paper evaluates a train/test split but no split files are known to be provided. Organism list left empty: 19 species, see the paper Table 2.'
