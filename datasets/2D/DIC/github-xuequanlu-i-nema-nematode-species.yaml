notes: 'Read the GitHub README, the arXiv page and PDF in full; not in Europe PMC. No license on the repository
  or in the paper (arXiv license covers the paper only); the paper calls the dataset open-access. Olympus BX51 DIC
  with camera; pixel size not stated. 2,769 images, 24-347 per species, 3-10 per specimen at different focal planes,
  so images of one specimen are correlated. enricher: download_url = direct Google Drive zip I-Nema.zip (633,690,049
  B; was null); formats tiff+jpeg from the zip listing (was other); splits_provided true: the zip has train/ (2,217)
  and val/ (552) folders, ~4:1 as in the paper; channels 1 (greyscale, paper and headers); organism Nematoda (was
  empty): labels are 19 genera (folder names, e.g. Pratylenchus, Acrobeloides, Aphelenchoides; paper Table 2), all
  one converted set.'
