notes: 'Single 4.65 GB Tryp.zip (figshare API); contents (positive_images/train|validation|test with images, labels, COCO
  json; negative_images; videos): enricher listed the zip (6,440 members): train 1,893 / validation 610 / test 612 images
  with matching YOLO txt, 3 COCO JSONs, 93 negatives, 114 videos. n_items = 3,085 positive + 93 negative images. Images are
  JPEG frames from videos (originals in videos/ as .mov/.avi/.mp4-type files). Pixel size not stated on the record or in the
  paper (frame resolutions 1360x1024, 1920x1080, 720x404). Imaged with two Olympus setups, so the modality is mixed: IX83
  DIC 40x and CKX53 phase contrast 20x. organisms: Trypanosoma brucei brucei = parasites in positive_images/, Mus musculus
  = host blood in all images (one image set).'
