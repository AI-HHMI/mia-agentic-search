notes: 'Eight zips (TScratch, Melanoma, Init, SN15, Scatter, Microfluidic, HEK293, MDCK); download_url is the landing page because files are per sub-dataset. Listings read for TScratch, Init, Scatter, Microfluidic, HEK293, MDCK (images as TIFF, TScratch as JPG, with PNG masks and .mat files); Melanoma and SN15 listings failed (network error) so their formats are taken from the page text only. Pixel sizes vary per sub-dataset (e.g. Init 0.625 um, SN15 1.24 um, HEK293 2.5 um, Microfluidics 0.5 um; Scatter not stated), so voxel_size_nm is null. Modalities: DIC for most sub-datasets, phase contrast per the page for others; exact assignment of each not verified. Organism list covers DA3 (mouse), MDCK (dog), HEK293T (human), melanoma (species not verified on the pages read). Checked: dataset page, paper Methods, six zip listings.'
