notes: 'Zip listings confirm 15 TIFF images and 15 foreground TIFF masks with matching names; counts.txt has one manual count per image. Pixel size is the page-stated approximate 0.42 x 0.42 um. The page names Warger et al. 2008 and Newmark et al. 2007 as published results, but those papers were not located or read, so publications is empty. The copyright paragraph on the BBBC003 page says CC BY-NC-SA 3.0 but names a different image set ("Synthetic 1", Pekka Ruusuvuori), which looks like a copy-paste error on the page; the license is taken from that statement and should be double-checked. Authors are the acquirers named in the page acknowledgement. Very small set (15 images), a classic benchmark.'
