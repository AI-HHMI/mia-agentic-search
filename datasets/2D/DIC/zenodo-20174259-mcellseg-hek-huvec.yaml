notes: 'Modality taken from the dataset README (DIC and fluorescence); the paper abstract/GitHub page say
  phase-contrast, and some file names say BF, so the exact contrast mode is uncertain. Paper is not open
  access (Europe PMC has no full text, publisher page returned 403), so only the abstract was read; pixel
  size, microscope and objectives are not stated on the Zenodo page, README or abstract. Image sizes vary
  (3-24 MB TIFFs). No train/val/test split in the archive (labeled/images, labeled/masks, unlabeled/images).
  Size is the compressed zip size from peek_archive (~1.2 GB; 5.2 GB uncompressed, 501 files); 300 images
  = 200 labeled + 100 unlabeled per README, the zip also holds 463+ tifs including masks.'
