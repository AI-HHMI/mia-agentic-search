notes: 'The GitHub README only points to a Google Drive download (a single file); its contents were not listed, so
  the image file format, folder layout and label files are unknown. No license or terms of use found in the README
  or the paper (arXiv text read; only the arXiv distribution license is shown). Image and species counts (2,769
  images, 19 species, 24-347 per species) and the Olympus BX51 DIC microscope are from the paper Section 3.4;
  pixel size and magnification are not stated there. Organism lists only the two laboratory species named in the
  paper (Pratylenchus sp., Acrobeloides sp.); 17 further natural species are given in the paper Table 2 and
  were not read here. No train/test split files are described. The Drive link was not verified as publicly
  downloadable (request returned an empty response through the sandbox proxy).'
