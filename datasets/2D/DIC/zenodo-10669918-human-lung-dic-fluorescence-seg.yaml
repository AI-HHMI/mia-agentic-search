notes: 'Zip listing (peek_archive, 479 files): 68 cases, each with DIC, DAPI, CD68, proSPC images (TIFF),
  cell instance, nucleus instance and semantic annotations, plus 3 split text files (51 train, 7 validation,
  10 test cases). License CC-BY-NC-4.0 as shown on the Zenodo page (the API record has no license field).
  The ISBI 2024 paper full text was not open (Europe PMC has no record, IEEE returned 418), so only the
  abstract and MDC publication page were read; pixel size, annotation procedure and annotators are not
  stated on the dataset page or abstract, hence voxel_size_nm null and annotation source unknown. Image
  values are described as float-valued, normalized fluorescence and background-corrected DIC. Paper DOI
  (from the MDC publication page): 10.1109/isbi56570.2024.10635198. enricher: size confirmed by Zenodo
  file listing; image normalization from samples (DIC standardized, fluorescence in [0,1]).'
