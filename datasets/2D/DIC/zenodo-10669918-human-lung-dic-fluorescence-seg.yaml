  notes: 'Zenodo listing with zip members: 1 file, 322,196,523 B exact, 479 members. Probe of the DIC/DAPI
    members hit Zenodo SSL drops; sample.py read them via the records/.../files URL. Sampled case Image0_L3
    only: DIC float32 1024x1024, mean 0.0 and std 1.0 (standardized; the Zenodo description says background-corrected);
    DAPI float32 0-0.984 (the description says normalized); cell instances int16, 11 instances plus background
    (the description says long int, but this file is int16); semantic PNG uint8 with all 9 classes 0-8
    present. Class names come from the Zenodo description. nuclei_instances and the CD68/proSPC channels
    were not sampled; their member sizes match the sampled siblings. training_splits CSVs list case prefixes
    such as Image58_L6. Pixel size is still unknown (the description gives 40x, 1024x1024 px, laser scanning
    microscope).'
