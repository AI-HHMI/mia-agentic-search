notes: 'Figshare record has 8 files (about 9.5 GB): LICENSE, negative_images.zip, positive_images.zip
  (V1), positive_images_v2.zip, positive_images_v3.zip, videos.zip, ood.zip and dataset_description.md.
  positive_images_v2.zip (3,115 jpg + 3,115 txt + 3 COCO json) and positive_images_v3.zip (3,789 jpg,
  3,073 txt, 3 json) were listed with peek_archive. V1 and V2 use the same frames (V2 is a denser re-annotation,
  model-assisted plus manual, hence source mixed); the original V1 paper reports 3,085 positive and 93
  negative images. Microscopes: Olympus IX83 40x/0.60 NA DIC (1360x1024 video) and Olympus CKX53 20x/0.40
  NA phase-contrast with a mobile phone on the eyepiece. Pixel size not stated. The V3 T. cruzi images
  come from Morais et al. 2022 (Giemsa, phone). The ood/ pools are unlabeled by design and the README
  says labels/ are not present for V3. n_items is the V3 image count. Organisms: T. b. brucei in Mus musculus
  blood = V1/V2 frames (also in V3); T. cruzi = images added in V3.'
