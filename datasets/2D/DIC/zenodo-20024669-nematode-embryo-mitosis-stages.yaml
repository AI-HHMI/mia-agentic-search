notes: 'Zenodo API record: CC-BY-4.0, one 15.2 MB zip (v1b of the GitHub repo DIC_dataset) holding 169
  TIFFs plus README and LICENSE.txt in folders AA, Meta, NEBD; the repo LICENSE.txt is the CeCILL v2.1
  software license, so CC-BY-4.0 is taken from Zenodo. Labelling procedure not described in the sources
  read. Pixel size is not stated anywhere checked. enricher: modality DIC from the arXiv v3 Data Availability
  ("169 images from differential interference contrast (DIC) microscopy") (was other). enricher: organism
  Caenorhabditis elegans from arXiv v3 ("custom C. elegans embryo dataset") (was empty). enricher: files
  are 302x302 px RGB (grey stored as RGB), not 512x512 as the README and paper say.'
