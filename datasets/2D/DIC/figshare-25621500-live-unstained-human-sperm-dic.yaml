notes: 'Four zips (Monash figshare). Directories read by range request (peek_archive could not open the redirect): Full Agreement holds nested Abnormal.zip (262 TIFFs) and Normal.zip (93); Partial Agreement holds Abnormal.zip (1,201 TIFFs) and Normal.zip (279 MB, not enumerated); Disagreement 562 TIFFs; Not labelled 148. Files are 1,280,122 bytes (names say DIC_100x, IX83); width/height not read, so n_items is null. Labels: three andrology scientists classified independently (paper abstract only; the paper is not open access, so Methods, pixel size and protocol were not read). Folder names give the class; the agreement category says how many experts agreed.'
