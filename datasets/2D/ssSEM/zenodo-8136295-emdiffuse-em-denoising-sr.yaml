title: EMDiffuse dataset - mouse tissue SEM denoising and super-resolution training pairs
short_name: EMDiffuse mouse tissue SEM denoising/SR pairs
description: Paired scanning electron microscopy images of mouse tissue sections for EM denoising and super-resolution. Each region is imaged several times with different dwell times (noisy inputs) and once with a long dwell time (ground truth); super-resolution inputs are taken at 20,000x and the target at 40,000x. Folders hold a mouse brain cortex training set (70 regions) and test set (3 regions), plus mouse heart (10), liver (17) and bone marrow (10) regions for transfer learning.
