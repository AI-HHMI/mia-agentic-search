notes: 'Single zip (802 .tif) listed: brain_train 70 region folders, brain_test 3, Heart 10, Liver 17,
  BM 10. No license on this record, its newer version or the paper (Data availability only gives the record
  URL). Pixel size from the paper figure legend: 6.6 nm at 20,000x (SR inputs) and 3.3 nm at 40,000x (target);
  transfer-learning tissues were imaged at 30,000x, pixel size not stated. Ground truth is a long dwell-time
  acquisition of the same region, registered by the authors'' code, not manual labels. enricher: per the
  code (RAFT/core/register.py, read not run) <Tissue>__4w_09.tif is the ground truth, 4w_04-08 the noisy
  denoising inputs and 2w_01-03 the super-resolution inputs. The EMDiffuse README links a newer version,
  Zenodo 10205819 (same concept, 5.30 GB zip, also no license).'
