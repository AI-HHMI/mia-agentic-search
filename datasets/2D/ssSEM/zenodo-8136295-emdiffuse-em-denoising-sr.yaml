notes: 'Single zip (802 .tif, 6.4 GB uncompressed) listed with tools/peek_archive.py: brain_train 70 region folders, brain_test 3, Heart 10, Liver 17, BM (bone marrow) 10. No license is stated on the Zenodo record or in the paper (Data availability only gives the record URL), so license is unknown. Pixel size from the paper figure legend: 6.6 nm at 20,000x (super-resolution inputs) and 3.3 nm at 40,000x (target); transfer-learning tissues were imaged at 30,000x and their pixel size is not stated, and the 3.3 nm applies to the 40,000x brain data. The ground truth is a long dwell-time acquisition of the same region (registered), not manual labels. Raw images are single 2D sections; the paper also uses OpenOrganelle volumes for isotropic reconstruction, which are not part of this record. The paper was read from the bioRxiv preprint full text.'
