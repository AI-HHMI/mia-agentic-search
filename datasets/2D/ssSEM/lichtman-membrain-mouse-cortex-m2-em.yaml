notes: 'No license or terms found on the lab site index, the mEMbrain code page or in the paper, so license
  is unknown. HTTP index: GT7_all_ems (339 PNG) and GT7_all_labels (339 PNG), paired by the name suffix,
  plus a readme saying GT was prepared by X. Lu (Lu et al. in preparation); paper counts 339 tiles and
  190 MB of raw EM. Pixel size 4 nm and 40 nm sections from the paper (Zeiss multibeam SEM, 180 x 303
  x 4 um volume); tiles treated as 2D, z null. No single archive URL. enricher: size from the HTTP index
  (was null); labels are 3-value semantic masks (0/1/2), class names not published.'
