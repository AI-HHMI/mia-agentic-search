notes: 'No license or terms found on the lab site index, the mEMbrain code page or in the paper (data
  are shared free of charge), so license is unknown. Paper counts 176 ground-truth tiles; the index holds
  GT2 (6 pairs), GT3 (40), GT4 (22) and exploreTissue (108 pairs, 3 EM tiles without labels). 4 nm/px
  and 30 nm sections from the paper Methods (891 sections); GT2/GT3/GT4 tiles are consecutive sections
  (e.g. s416-s455) but are released as single-section PNGs, so the record stays 2D with z null. No single
  archive URL. enricher: size from the HTTP index (was null); label encoding and pairing rule from inspection.'
