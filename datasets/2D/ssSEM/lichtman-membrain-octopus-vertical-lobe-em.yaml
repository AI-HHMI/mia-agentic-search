notes: 'No license or terms found on the lab site index or in the paper (which only says the data are shared free of charge), so license is unknown. Layout from the HTTP index: 355 PNG files, about 1.19 GB (estimated), as EM folders next to label folders (GT2 6 tiles, GT3 40, GT4 22, exploreTissue 111 EM / 108 SEG); paper counts 176 ground-truth tiles. Probe: EM tiles are 8-bit grayscale PNG, labels are palette or RGB PNG, encoding not decoded. 4 nm/px and 30 nm sections from the paper Methods (891 sections); tiles are single sections, so 2D with z null. No single archive URL. Four other ground-truth sets on the same site (whole mouse brain, cerebellum, C. elegans, Berghia) are not covered here.'
