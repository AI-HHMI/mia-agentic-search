title: Octopus vulgaris vertical lobe EM ground truth for neurite segmentation (mEMbrain)
short_name: Octopus vertical lobe neurite labels (EM)
description: Manually generated ground-truth segmentation of serial-section electron microscopy tiles from a lateral
  lobule of the Octopus vulgaris vertical lobe, released with the mEMbrain connectomics tool. Paired EM images and VAST
  label images (cell bodies, superior frontal lobe tract, glia and deep neuropil regions, plus an extra exploreTissue set)
  used to train membrane-detecting CNNs.
