notes: 'Masks exist only for the dHL-60 crops: 42 mask TIFFs (20 compact + 20 decompact
  nuclei and 2 top-level crops) from the dhl60.json file list; the rest of the 99
  GB dHL-60 and 21 GB U2OS lists are time-lapse stacks and CSV tables without masks.
  Masks were made by intensity thresholding of the DNA channel (objects under 100
  pixels excluded) and then visually inspected and manually corrected, so source is
  mixed. Pixel size 0.22 um is for the live-cell spinning-disk time-lapse; the crop
  images may differ. The preprint is not open access, so only its abstract was read.
  n_items counts mask-paired crops. download_url is null (files under biostudies/files/S-BIAD3245/).
  Checked the study record, both file lists and the preprint abstract.'
