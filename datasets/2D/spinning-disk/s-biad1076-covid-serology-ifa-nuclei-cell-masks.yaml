notes: 'No license or terms of use appear in the study metadata (checked the BioStudies record and TSV), so spdx is unknown. Counts come from the
  two file lists (437,468 image rows; 109,367 nuclei and 109,367 cell mask rows; 8 plates in 3 batches; 574 sample IDs labelled pos, neg
  or control). Masks are automatic: a pre-trained deep learning nuclei segmentation, with cells defined by dilating nuclei by up to 7 um. The
  expert-annotated cell classes used in the paper (Positive, Negative, Atypical, Small Bright, Trash) are not part of these file lists.
  Pixel size 0.299 um is from the study metadata; images are max projections of stacks. The paper also used a second widefield system
  (Operetta) for other plates; this deposit lists Opera Phenix images only.'
