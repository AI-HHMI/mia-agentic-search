notes: 'IDR study idr0072 has two screens: screenA (MCF10A, human, 10 plates, 21 markers; sampled image 1347 x
  1002 px, 0.1615 um/pixel) and screenB (NMuMG, mouse, 84 plates, 18 markers; sampled image 673 x 508 px,
  0.323 um/pixel), both uint16 with channels DRAQ5 and EGFP. Pixel size therefore differs between screens;
  the record lists screenA (one field image per screen read from the IDR API). The paper (Europe PMC full
  text read) says the libraries are 789,011 NMuMG and 523,319 MCF10A validated single-cell images uploaded
  to IDR; the number of field images was not counted, hence n_items null. The class labels are implicit
  (landmark per well); the IDR files were not browsed, so annotations_verified is false. IDR serves images
  through OMERO, not as plain files; formats lists other. 40x water objective NA 0.9 (study file).'
