schema_version: '1.2'
id: idr0072-subcellular-localization-reference-library
title: A Reference Library for Characterizing Protein Subcellular Localizations by Image-Based Machine
  Learning
short_name: Subcellular landmark reference library (confocal)
description: Reference library of single-cell confocal micrographs of cells stably expressing EGFP fusions
  of organelle-landmark proteins (Golgi, ER, mitochondria, endosomes, nuclear envelope, peroxisome, lysosome
  and others) with a DRAQ5 nuclear stain, imaged on a PerkinElmer Opera spinning disk. Two screens, human
  MCF10A cells (21 markers) and mouse NMuMG cells (18 markers). The landmark identity of each well gives
  the localization class, used to train a random forest classifier.
