notes: 'Two screens: screenA (MCF10A, 10 plates, 669 annotated wells, 13 localizations; 1347x1002 px,
  0.1615 um/pixel) and screenB (NMuMG, 84 plates, 5,473 wells, 14 localizations; 673x508 px, 0.323 um/pixel),
  per the IDR API images read by the harvester. organisms: Homo sapiens = screenA (MCF10A plates), Mus
  musculus = screenB (NMuMG plates). Paper: 789,011 NMuMG and 523,319 MCF10A single-cell images. 40x water
  objective NA 0.9 (study file). Labels are the landmark construct of each well (experimental design,
  not drawn annotations), so annotations.source stays unknown. enricher: voxel size cleared (was screenA
  161.5 nm only; the screens differ). formats tiff: the FTP files are PerkinElmer .flex, read as plain
  multi-page TIFF. annotations verified from the IDR annotation CSVs.'
