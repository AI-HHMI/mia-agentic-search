notes: 'Image-to-image translation pairs (actin to nuclear stain), not segmentation labels. The BioStudies record states no license, authors or organism; CC-BY-4.0 and the acquisition details (spinning disk confocal, 20x 0.8 NA, 1024x1024, 634 nm pixel, DCIS.COM Lifeact-RFP cells) come from the original Zenodo record 3941889 listed as the publication on BioStudies. Organism is not stated on either page (DCIS.COM is a cell line) so it is left empty. Files are RGB PNGs; pairing is by identical file name (file_list.tsv: 1,748 train and 5 test pairs, 3,506 files). Total size in bytes is not stated in the listing (the Zenodo zip is 2.24 GB). The ZeroCostDL4Mic preprint was read; it only describes the example datasets generally.'
