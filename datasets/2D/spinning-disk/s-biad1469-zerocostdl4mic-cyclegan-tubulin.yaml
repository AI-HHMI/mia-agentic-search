title: ZeroCostDL4Mic - CycleGAN example training and test dataset
short_name: Tubulin spinning-disk vs SRRF unpaired images
description: Two unpaired image sets of anti-tubulin immunostained U2OS cells as PNG files, 165 spinning-disk confocal images
