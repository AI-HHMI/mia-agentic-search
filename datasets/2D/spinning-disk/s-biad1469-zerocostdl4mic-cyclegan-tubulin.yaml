notes: 'Usable without labels as an unpaired restoration (spinning-disk to super-resolution translation) training set, as
  stated on the BioStudies record. File lists (sd_fl.tsv, srrf_fl.tsv): spinning disk 161 train + 4 test, SRRF 164 train +
  4 test. The two sets are unpaired, so no per-image ground truth exists. Paper Methods: Marianas spinning disk (Yokogawa
  CSU-W1) with 100x NA 1.4 objective and EMCCD; spinning-disk images were average projections magnified 4x by bilinear interpolation;
  SRRF made with NanoJ-SRRF from the same data. Pixel size of the PNG files and total size not stated; PNG headers not read.
  Organism not stated (U2OS is a human cell line, left empty). Release date is the BioStudies ReleaseDate. Shares its paper
  with other ZeroCostDL4Mic records (e.g. zenodo-3748967 HeLa Tom20 label-free prediction) but is a different dataset: U2OS
  tubulin images for CycleGAN. enricher: size_bytes estimated from the rounded EBI HTTP index (was null).'
