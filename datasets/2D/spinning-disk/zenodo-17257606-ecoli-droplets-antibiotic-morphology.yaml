notes: 'Zip listing (816 files): per antibiotic/experiment/day folders with BF_TRITC_aligned.zarr, BF_TRITC_aligned.crops.zarr and table.csv; database.db (18 MB) and the ResNet34 model are separate files. Paper (bioRxiv preprint, full text read): 1,184 droplets manually labelled with non-exclusive morphology labels (70:30 train/test), then a ResNet34 labelled all 82,268 droplets, so most labels are predictions. The paper cites Zenodo 10.5281/zenodo.17193389 for the imaging data and SQL database; that record was not retrievable, this record holds the same files. Spinning-disk confocal (Nikon Ti2, 20x 0.7 NA) with brightfield; pixel size not stated, so voxel size is null. Size is the sum of the three Zenodo files. enricher: annotations_verified true after opening database.db (12 morphology features, 180,903 label rows).'
