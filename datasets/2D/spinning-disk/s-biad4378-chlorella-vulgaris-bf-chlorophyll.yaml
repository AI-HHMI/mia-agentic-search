id: s-biad4378-chlorella-vulgaris-bf-chlorophyll
title: 'Chlorella vulgaris phenotyping across environmental conditions: raw images, segmentations, and single-cell features'
short_name: Chlorella cell segmentation (spinning disk)
description: Label-free spinning-disk confocal images (brightfield and Cy5 chlorophyll autofluorescence) of 96
  UV-mutagenized Chlorella vulgaris isolates and one wild-type plate, grown across three temperatures and two growth
  stages (seven experiments). Each experiment is a Zarr v3 store holding raw and processed intensity images (9 fields
  of view x 96 wells, 1024x1024, uint16) plus per-channel Cellpose label, mask and intensity images, and a JSONL file
  with cell outlines and 20 single-cell features per channel.
