notes: 'Zip listing (peek_archive): Convallaria_diaphragm/20190726_tl_50um_500msec_wf_130EM_FD.tif and
  20190520_tl_25um_50msec_05pc_488_130EM_Conv.tif, 210.1 MB each. Paper (arXiv 1911.12291, Experiments):
  Convallaria data is 100 calibration images (diaphragm images) and 100 noisy images of a Convallaria
  section, acquired on a spinning disc confocal microscope; averaging static noisy acquisitions gives
  a pseudo ground truth. No clean target files are shipped (annotations.present false), so usable for
  unsupervised denoising rather than as restoration pairs. Pixel size, species and stain are not stated
  on the Zenodo page or in the paper text read. Companion of the catalog record zenodo-5156937 (Mouse
  actin) from the same benchmark; different sample and files. enricher: download_url set to the direct
  zip (download-check usable); voxel size still not found (TIFF headers uncalibrated).'
