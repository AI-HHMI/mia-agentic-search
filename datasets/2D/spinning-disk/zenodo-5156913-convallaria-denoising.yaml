  notes: 'Zenodo API: one file, Convallaria_diaphragm.zip, 347,874,446 B (listing.py complete). Zip: 2
    deflated TIFF members. probe.py could not read the deflated headers, so sample.py fetched the _Conv.tif
    member (160,198,578 B compressed): 100x1024x1024 uint16, tifffile axes TYX, values 271-7053 (one sample;
    p50 673). normalization none is inferred: raw Andor iQ 3.6.2 acquisitions (iXon Ultra 888 EMCCD, EM
    gain 130), far below the 16-bit range, no clipping. First IFD of each member read by a range + inflate
    script (~600 KB): uncompressed 16-bit, XResolution/YResolution 0/10000 (no calibration), Andor protocol
    text without pixel size. Voxel size not found; checked: TIFF tags and Andor description of both files,
    Zenodo API description, PN2V paper full text (Frontiers 10.3389/fcomp.2020.00005: spinning disk Andor
    Revolution WD Borealis Mosaic, 1024x1024 images, no pixel size), arXiv 1911.12291 (per harvest notes).
