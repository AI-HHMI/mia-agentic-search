notes: 'File listing: Autophagy/ and STING/ each hold screen/ and training/ folders of .h5sc (scPortrait single-cell
  image files, 10-45 GB each); 8 training files per screen (e.g. wt vs ATG5 KO, stimulated or not; STING time points 0 h,
  30 min, 1 h, 2 h). The labels are the experimental conditions listed per file in the TSVs; the page says these are
  training data for the classifiers, but does not describe per-cell annotation, so source is unknown. Total size and
  image count not computed (many TB). Imaging: Opera Phenix, 40x 0.75 NA air and 20x 0.8 NA air, 2x2 binning; pixel size
  not stated. The related paper is not linked on the page and could not be read (bioRxiv preprint of the platform found
  only by title, fetch rate-limited), so channels and the training-label definition rest on the BioStudies description.'
