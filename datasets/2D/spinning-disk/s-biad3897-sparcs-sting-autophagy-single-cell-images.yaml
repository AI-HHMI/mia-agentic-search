title: SPARCS enables scalable recovery of complex image-based phenotypes for genetic screening
short_name: SPARCS STING and autophagy single-cell images
description: Single-cell image datasets from SPARCS CRISPR knockout screens in HeLa-STING and U2OS mCherry-LC3 cells
  (spinning-disk confocal, 40x/20x, scPortrait .h5sc files), with separate training sets for a STING localisation
  classifier and a binary autophagy classifier (wild-type vs ATG5 KO, stimulated vs unstimulated, time courses).
