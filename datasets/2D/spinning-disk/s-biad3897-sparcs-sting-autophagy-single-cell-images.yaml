notes: 'Autophagy/ and STING/ each hold screen/ and training/ folders of .h5sc files (scPortrait single-cell images, 7.8-47
  GB each); training sets: 14 Autophagy files (wt vs ATG5 KO, stimulated or not) and 20 STING files (time points 0 h, 30 min,
  1 h, 2 h). Labels are the experimental conditions per file (TSVs) and per cell (h5sc obs); the page does not describe per-cell
  annotation, so source is unknown. Imaging: Opera Phenix, 40x 0.75 NA and 20x 0.8 NA air, 2x2 binning; pixel size not stated.
  The related bioRxiv preprint could not be read (rate-limited). enricher: format HDF5 (scPortrait .h5sc, AnnData), was other;
  3 image channels plus 2 automatic mask channels (Cellpose/fast marching per BIA); size from BIA file lists (was null).'
