notes: 'Screen A of idr0097 only. Annotation CSV lists 768 wells; 330 have "Has Phenotype = yes" with a localization label in Phenotype 1 (Cytoplasm 153, Mitochondria 76, Nucleus 75, ER 22, Vesicles 2, Plasma membrane 1, other 1); coverage partial. Labels are per well, not per cell. Paper (Genome Res 2020, PMC7706735): 63x water confocal, 5 fields per well. The paper is CC-BY-NC but the IDR record states CC-BY-4.0. enricher: voxel size 189.83 nm from IDR image metadata (PhysicalSizeX/Y 0.18983 um; was null). enricher: formats tiff (Opera Phenix per-field .tiff files + Index.idx.xml in the IDR fileset; was other). enricher: n_items 3600 = 720 imaged wells (7 plates x 96, 1 x 48) x 5 fields, from the IDR plate grids.'
