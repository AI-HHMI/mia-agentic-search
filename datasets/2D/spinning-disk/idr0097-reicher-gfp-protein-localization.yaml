notes: 'Screen A of idr0097 only. Annotation CSV lists 768 wells; 330 have "Has Phenotype
  = yes" with a localization label in Phenotype 1 (Cytoplasm 153, Mitochondria 76,
  Nucleus 75, ER 22, Vesicles 2, Plasma membrane 1, other 1); 438 wells carry none,
  so coverage is partial. Labels are per well, not per cell. Raw files are PerkinElmer
  Opera Phenix Index.idx.xml plates (filePaths TSV) on the EBI IDR FTP; image file
  listing of the plate folders returned empty from the FTP index, so file formats,
  image count, pixel size and total size could not be verified (formats set to other).
  Paper (Genome Res 2020, PMC7706735) full text read: 63x water confocal, 5 fields
  per well, no pixel size stated. IDR hosts the images; the paper is CC-BY-NC but
  the IDR record states CC-BY-4.0.'
