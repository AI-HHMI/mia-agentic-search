notes: 'Zip listing (peek_archive): Mouse actin/diaphragm.tif and Mouse actin/sample_attempt2.tif, 210.1
  MB each. Paper (arXiv 1911.12291, Experiments): 100 calibration images (diaphragm images with only mounting
  medium in view) and 100 noisy realizations of the same static sample, made public for PN2V benchmarking;
  averaging the realizations gives a pseudo ground truth. No clean target files are shipped (annotations.present
  false), so usable for unsupervised/self-supervised denoising rather than as restoration pairs. Pixel
  size is not stated on the Zenodo page or in the paper. enricher: modality spinning-disk from paper Experiments
  ("acquired on a spinning disc confocal microscope", was fluorescence-other); size from Zenodo listing
  (was 327.5 MB); stack 100x1024x1024 uint16 from sample.'
