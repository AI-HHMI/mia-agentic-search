notes: 'Zip listing (peek_archive): 333 PNG members in CycleGAN/ folders ''Spinning disk - training'' (161), ''SRRF - training''
  (164), ''Spinning disk - test'' (4) and ''SRRF - test'' (4). The two domains are unpaired by design (CycleGAN trains without
  paired targets), so ''restoration-pairs'' is only the closest schema value; the borderline training signal is why confidence
  is 0.6. Pixel size 62.5 nm and 1024x1024 size are from the Zenodo page; the paper Methods say the SDC images (200 frames
  averaged, 100x 1.4 NA, magnified 4x by bilinear interpolation) were processed with NanoJ-SRRF to give the super-resolution
  domain. Sibling ZeroCostDL4Mic example records in the catalog (e.g. zenodo-3941889 pix2pix) share the paper but are different
  datasets. The Zenodo page lists a Jacquemet 2020 J Cell Sci review as associated publication; the data description (CycleGAN
  example) is in the ZeroCostDL4Mic paper.'
