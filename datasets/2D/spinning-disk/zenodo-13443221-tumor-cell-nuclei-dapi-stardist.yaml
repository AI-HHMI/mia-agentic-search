notes: 'Zip listing: Training_data has 48 source + 48 target files, Quality_control_data has 12 QC_source + 12 QC_targets, plus the trained model folder; n_items = 60 pairs; size is the whole zip incl. model. Record text: 3i CSU-W1 spinning disk, 20x NA 0.8, DAPI channel, 920x920 px, pixel size 0.6337 um (so x/y 633.7 nm), 16-bit images and 8-bit masks, IoU 0.558 / F1 0.793. Tumor cell line and organism are not named on the record, so organism is empty; the bioRxiv paper full text returned 429 and was not read (only the bioRxiv API entry was fetched), so organism and cell line are unconfirmed. The QC split is the only held-out data.'
