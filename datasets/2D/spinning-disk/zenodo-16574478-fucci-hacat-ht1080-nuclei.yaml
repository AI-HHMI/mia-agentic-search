title: Annotated FUCCI-sensor nuclei (HaCaT and HT-1080 cells) for multi-channel segmentation and cell-cycle classification
short_name: FUCCI HaCaT/HT1080 nuclei (spinning disk)
description: Reproduction data for the DeepFUCCI paper. The training_data.zip holds 513 multi-channel TIFF crops (FUCCI
  sensor, alpha-tubulin and actin reporters) of HaCaT keratinocytes and HT-1080 fibrosarcoma cells with per-image JSON
  class files, plus a dataset_split.json. Nuclei were segmented with a human-in-the-loop workflow (about 5000 annotated
  nucleus instances from more than 15 samples). The record also ships HT1080 20x/40x test sets with curated masks, and
  trained StarDist, InstanSeg and Cellpose-SAM models.
