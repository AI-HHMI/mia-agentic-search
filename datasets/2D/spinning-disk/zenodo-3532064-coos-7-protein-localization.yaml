notes: 'Zenodo API record (version 1.1; files COOS7_v1.1_training.hdf5 1.36 GB, test1 0.34 GB, test2 0.56
  GB, test3 1.07 GB, test4 1.01 GB, unpackage_COOS.py, README.txt) and the paper PDF (read) were used.
  Paper: 64 x 64 px crops, 2 channels in 16-bit (raw intensities), 41,456 training images, crops made
  by segmenting the nuclear channel with a mask-RCNN, acquired on a PerkinElmer Opera QHS spinning-disk
  confocal with 40x water objectives (NA 0.9) over 95 plates, 4 plates imaged on a different microscope
  (Test4); wells were manually checked for defects and consistency with their label. Pixel size and the
  specific mouse cell line are not stated in the sources read. Labels derive from the tagged protein per
  well, curated by manual inspection (source recorded as mixed). License CC BY-NC 4.0 (non-commercial).
  enricher: HDF5 headers probed: data stored as float32 (paper: 16-bit raw intensities), labels int64
  0-6.'
