title: COOS-7 (Cells Out Of Sample 7-Class)
short_name: COOS-7 mouse cell protein localization (confocal)
description: 132,209 two-channel 64 x 64 px crops of individual mouse cells, each labelled with the subcellular compartment targeted
  by a fluorescent protein (ER, inner mitochondrial membrane, Golgi, peroxisomes, early endosome, cytosol, nuclear envelope), with a
  second channel for a nuclear dye. A 41,456-image training set and four test sets of increasing covariate shift (same plates, plate
  edge wells, later experiments, a different microscope) are provided as HDF5 files.
