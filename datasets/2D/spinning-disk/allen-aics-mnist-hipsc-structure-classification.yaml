notes: 'S3 prefix s3://allencell/aics/aics_mnist/ holds aics_mnist.tar.gz (26.2 MB), aics_mnist_rgb.tar.gz (62.3 MB) and the
  generating notebook aics_mnist.ipynb. Counts, classes (Desmosomes, ER, Lysosomes, Microtubules, Mitochondria, Nuclear envelope,
  Nuclear pores, Nucleolus DFC, Nucleolus GC, Plasma membrane), 60,000/10,000 stratified split, 28 x 28 size and folder layout
  are read from the notebook; enricher: both tarballs opened and confirm 70,000 PNGs each in these folders. The labels come
  from the cell line metadata, not manual annotation. No paper is cited in the package. Derived from images in the Allen single-cell
  data (see allen-hipsc-single-cell-image-dataset); pixel size after resizing is unknown. Terms: Allen Institute terms of
  use; no SPDX licence. enricher: size 88,534,413 B from S3 listing (was 88,518,670).'
