title: AICS MNIST, MNIST-style 28x28 single-cell images of 10 subcellular structures (Allen Institute for Cell Science)
short_name: hiPSC 10-structure 28x28 cells (confocal)
description: MNIST-style classification benchmark of 70,000 28x28 PNG images of single hiPS cells with endogenously
  tagged subcellular structures (7,000 cells per class, 10 structures), made from Allen Institute 3D spinning-disk
  confocal single-cell images by projecting along z, centring on the cell mask and resizing. Released as a
  single-channel GFP version (aics_mnist) and a three-channel cell/GFP/nucleus version (aics_mnist_rgb) with
  60,000 training and 10,000 test images in class folders.
