notes: 'Zip listing read with peek_archive (1,674 files: 439 raw multichannel nd2 plus PNG images and masks). With ground-truth masks: train 267, test 30, LLC-PK1 30, NIH-3T3 30; the 42 DMSO and 40 ROCK-inhibitor LifeAct images have predicted masks only, and every folder also holds model-predicted masks (not ground truth). Paper: Nikon Ti2 with CrestOptics X-Light V3 spinning disk, Kinetix camera, 60x 1.2 NA water objective, 12-bit 1600 x 1600 px. Masks are semi-automatic (Fiji macro) from antibody channels: phalloidin for actin and stress fibers, absence of myosin II for lamellipodia and lamellar regions, myosin X puncta for filopodia, paxillin for focal adhesions. Pixel size not stated on the pages read. Only HeLa is stated as human; the species of NIH-3T3 and LLC-PK1 was not checked. enricher: pixel size 108.3 nm from the ND2 header calibration (0.10833 um, 60x objective; was null).'
