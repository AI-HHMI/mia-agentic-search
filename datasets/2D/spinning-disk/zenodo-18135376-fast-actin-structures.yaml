description: Spinning-disk confocal images of fixed HeLa cells stained for phalloidin, myosin II, myosin X and paxillin, with semi-automatic multilabel masks of four actin structures (stress fibers, focal adhesions, lamellipodia/lamellar regions, filopodia) made with antibody-assisted labeling, plus held-out test cells, two other cell lines with masks, and LifeAct-GFP 3T3 images (control vs ROCK inhibitor) without ground truth.
