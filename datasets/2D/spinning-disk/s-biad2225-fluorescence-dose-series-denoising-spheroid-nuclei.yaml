notes: 'Multi-part study, 105,744 files (BioStudies files API). Parts: S. pombe sfGFP dose series with denoised outputs and
  density masks; fibroblast spheroid Hoechst dose series (67 stacks of 15 dose levels, 1412x1412) with CARE / Denoise.AI /
  NLM / mean-filter outputs, 76 manually annotated 256x256 patches with StarDist predictions; BPAE three-colour dose series;
  synthetic noisy HPA data; adversarial-attack images. Pixel size 0.5728 um is the ImageJ calibration in the spheroid TIFFs
  (raw stacks and patches), not stated in the paper. Masks cover the spheroid part only (coverage partial). Spinning-disk
  (Nikon Ti2 + CSU-W1 SoRa) per paper Methods. organisms: Homo sapiens = Spheroid_Hoechst_denoised_segmented/, HPA_synthetic_data/;
  Schizosaccharomyces pombe = Pombe_sfGFP_denoised/; Bos taurus = FluoCells_3_colour/ (BPAE); Adversarial_attack_data/ not
  assigned. enricher: mask encoding instance IDs stored as float32 (was not checked).'
