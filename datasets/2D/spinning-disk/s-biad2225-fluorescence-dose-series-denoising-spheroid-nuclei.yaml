notes: 'Large multi-part study (about 105,000 files, size not stated). Parts: S. pombe sfGFP dose series with
  denoised outputs and density masks; fibroblast spheroid Hoechst dose series (67 stacks of 15 dose levels,
  1412x1412) with CARE / Denoise.AI / NLM / mean-filter outputs, 76 manually annotated 256x256 patches
  (about 3000 nuclei) with StarDist predictions; BPAE three-colour dose series; synthetic noisy HPA and
  DU145 data; adversarial-attack images. Pixel size 0.5728 um is the calibration stored in the spheroid
  Raw TIFF (one file probed), not stated in the paper; other parts were not probed. The annotated masks
  cover the spheroid part only (coverage partial). Spinning-disk confocal (Nikon Ti2 + CSU-W1 SoRa) per
  the paper Methods. Mask dtype float32 (one file probed); label encoding not checked.'
