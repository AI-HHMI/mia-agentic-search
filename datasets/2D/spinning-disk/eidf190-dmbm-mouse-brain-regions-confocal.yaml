notes: "DMBM_Dataset.zip (14.5 GB) holds test/ and train/ folders (80 train and 22 test pairs) of images/*.tif composites and labels/*.png masks, listed with peek_archive. The second file in the bucket, Dataset002_MBDelineation.zip, contains nnU-Net model checkpoints, not data. Paper: 102 images from 96 mice, median 6383 x 12531 px, stitched from 856 x 812 tiles with 16x downsampling, Nikon Eclipse Ti2 spinning disk; subregions manually delineated in ImageJ. Pixel size is not stated on the project page, the EIDF page, the bucket or the paper text, so voxel_size_nm is null. The EIDF catalogue lists CC BY and the paper's data statement links to CC BY 4.0 (for the accepted manuscript); the version for the data itself is taken as 4.0. Hosted on the Edinburgh International Data Facility S3 bucket, not a standard repository. Size is the zip size."
