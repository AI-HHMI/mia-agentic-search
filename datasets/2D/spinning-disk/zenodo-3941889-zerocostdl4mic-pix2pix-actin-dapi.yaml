notes: >-
  Zip listing (peek_archive): 'Actin - training' 1,748 PNG and 'Dapi - training' 1,748 PNG, plus 5 + 5 test
  PNGs; n_items counts pairs. The pairs are two fluorescence channels of the same field (for channel-to-channel
  image translation with pix2pix), not labels, so restoration-pairs is the closest schema value and ml.tasks is
  other. The page says the images are RGB PNGs; the Zenodo page lists the associated publication as unpublished
  with the related identifier being the ZeroCostDL4Mic preprint, so the Nature Communications paper is listed.
  The paper's text describes pix2pix generally and was not found to describe this particular dataset in detail.
  The species of the DCIS.COM cells is not stated on the page, so organism is left empty.
  Another ZeroCostDL4Mic example record in the catalog (zenodo-3748967, fnet HeLa TOM20 label-free) shares the paper
  but is a different dataset (other cells, images and channels).
