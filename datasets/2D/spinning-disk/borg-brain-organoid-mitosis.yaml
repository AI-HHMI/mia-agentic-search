notes: 'No licence for the data found: no LICENSE file in the repository tree (shallow clone, commit e76abaab, 2024-12-02)
  and none in the README; the CC BY-SA 4.0 shown on arXiv belongs to the paper. 262 frames, each as max and mean projection
  (data/{max,mean}_projection, 223 train + 39 val). Annotations: 737 points stored as fixed 50x50 px boxes in COCO JSON (556
  train, 181 val), four mitosis phases. Voxel/pixel size not stated in README, paper or PNG headers. enricher: channels 2
  (paper: red nuclei, green cytoplasm; PNGs carry R and G, B empty) (was 1). enricher: size 324,095,750 bytes = data/ in the
  git tree (was null).'
