notes: 'Pixel size 0.65 um, uint16, 1250x1050, 3 channels, from the IDR image API of one image (11339787); files on the IDR FTP are single-channel
  TIFFs of about 2.5 MB each (checked in one well folder). Magnification 20x (NA 0.75) and the Cell Voyager 7000 from the paper Methods.
  Total size and image count are not stated (the study page lists 1,199 plates, 2-3 sites per well). The mechanism-of-action labels
  come from the paper (manual annotation to 218 MoAs) and the study file names a separate library CSV, which was not opened; the compound
  name per image was seen in IDR map annotations. IDR study page gives CC BY-NC 4.0 for the data. Authors are not listed because the
  study file text fetched did not list them.'
