id: idr0088-phenomic-profiling-reporter-cells
title: 'Tales of 1,008 Small Molecules: Phenomic Profiling through Live-cell Imaging in a Panel of Reporter Cell Lines'
short_name: Compound MoA phenomic screen (spinning disk)
description: Live-cell high-content screen of 1,008 approved drugs and tool compounds (plus 169 natural products) at four concentrations
  across 15 fluorescent reporter cell lines (A549, HepG2, WPMY1 with five marker combinations), imaged on a Cell Voyager 7000
  in three channels (BFP, GFP, RFP/FusionRed). The study is organised as 1,199 plates; the images carry compound and cell line
  annotations, and the compounds were manually annotated to 218 mechanisms of action.
