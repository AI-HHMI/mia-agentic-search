    IDR study file states. Probed C01 of well B02 field 1: plain single-page TIFF, 1050x1250 uint16, uncompressed, no calibration. Sampled it
    (2.6 MB): min 1, max 5913, mean 424, p99 1983, 4141 unique values; normalization none is inferred (16-bit camera range, no clipping, raw
