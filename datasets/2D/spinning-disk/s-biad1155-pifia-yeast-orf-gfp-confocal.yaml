notes: 'File list: 110,590 TIFFs in 24 plate folders (Microscopy_Data/R<replicate>/R<replicate>_Plate<NN>/Images/,
  three channels per field, 4,608 files per plate), no other file types. Per the paper (Methods, Dataset overview)
  there were two biological replicates with four fields of view per strain and 4,049 strains. Usable for
  self-supervised training; the paper itself trains with strain identity as the pretext label. The deposit has no
  plate map or strain list, so no per-image labels are included here (annotations.present false). Pixel size and
  total size are not stated on the study page, in the listing or in the paper Methods read.'
