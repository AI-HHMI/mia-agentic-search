title: 'PIFiA: self-supervised approach for protein functional annotation from single-cell imaging data'
short_name: Yeast ORF-GFP proteome micrographs (confocal)
description: 110,590 three-channel spinning-disk confocal micrographs (Opera Phenix, 63x water) of wild-type
  yeast cells expressing the ORF-GFP collection (4,049 visible GFP-tagged strains) plus nuclear and cytoplasmic
  markers, arranged by replicate and 384-well plate. This is the image set used to train the PIFiA self-supervised
  representation learning model for protein function annotation.
