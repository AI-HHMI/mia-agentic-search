notes: 'File list: 110,590 TIFFs in 24 plate folders (Microscopy_Data/R<replicate>/R<replicate>_Plate<NN>/Images/,
  three channels per field, 4,608 files per plate), no other file types. Per the paper (Methods, Dataset
  overview) there were two biological replicates with four fields of view per strain and 4,049 strains.
  Usable for self-supervised training; the paper itself trains with strain identity as the pretext label.
  Pixel size is not stated on the study page, in the listing or in the paper Methods read. enricher: FileList.json
  gives ORF and gene name per file (4,144 ORFs), so annotations are now present (image-level strain labels,
  classification).'
