schema_version: '1.2'
id: s-biad2254-spheroid-cell-painting-cellpose-masks
title: High-content morphological profiling by Cell Painting in 3D spheroids
short_name: Colorectal spheroid Cell Painting (confocal)
description: Spinning-disk confocal images of HCT-116 and HT-29 colorectal cancer spheroids treated with 52 clinically
  relevant drugs, stained with an adapted five-channel Cell Painting panel, cleared and imaged in 12 optical sections
  (5 µm apart) per well as 16-bit OME-TIFF. The deposit includes per-slice nucleus and whole-cell segmentation masks
  (.npy) produced by retrained Cellpose cyto2 models, plus CellProfiler feature tables.
