notes: 'Masks are Cellpose cyto2 (retrained) outputs run in CellProfiler, not manual; only in-focus cells were segmented
  (BIA annotation criteria). The paper''s expert reference set (cellposeGUI, 8,492 nuclei / 6,429 cells) is not
  a separate file in the deposit. Voxel size 0.227 µm/pixel in-plane (BioStudies + paper); planes are 5 µm apart
  and stored as separate 2D files, so z is null. enricher: masks are boolean foreground, not instance IDs (npy header
  |b1; touching cells merge), so types instance-segmentation -> semantic-segmentation. enricher: size 384,455,072,477
  B from the complete BioStudies files API listing (185,533 files; was null). enricher: n_items = 25,856 well-planes
  (5 channel OME-TIFFs + 1 cell + 1 nuclei mask each; was null). enricher: OME header PhysicalSizeX/Y 0.225312 µm
  vs documented 0.227 µm; kept the documented value.'
