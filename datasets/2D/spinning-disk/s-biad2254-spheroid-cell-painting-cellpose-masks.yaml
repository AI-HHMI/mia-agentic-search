notes: 'Masks in the deposit are model-generated (Cellpose cyto2 retrained by the authors, run in CellProfiler);
  the paper states an expert-annotated reference set (8,492 nuclei, 6,429 cells on 6 optical sections per condition
  for 4 treatments) was made in cellposeGUI for evaluation, but it was not identified as a separate file in the
  archive listing I read. Annotation listing says only in-focus cells were segmented. Voxel size: 0.227 µm/pixel
  in-plane from the BioStudies record; z spacing is 5 µm between optical sections (stored as separate 2D files,
  so z is left null). Study has ~185,500 files (133,821 in the study component, 51,712 mask files); total size not
  stated; FTP listing was unreachable from the sandbox so the folder tree was taken from the BioStudies files API.
  Image file naming from mask source_image: Well-<well>-z<N>-<channel>.ome.tiff.'
