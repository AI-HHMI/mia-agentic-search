notes: Counts (ER 157/28/38, MITO 165/8/10 = 406 patches), modalities, labels and manual SNAP-ITK masks
  come from the IEEE DataPort page; the COS-7 cell line comes from the Figure 1 caption of the Bioinformatics
  2024 paper (PMC11467052, full text read). The dataset page says download needs a free IEEE DataPort
  login; no license is stated on the page, paper or code repo, so license is unknown. The paper states
  data are openly accessible via the GitHub repo cbmi-group/MRE, whose README points back to the DataPort
  DOI; the repo has no data folder (datasets/ holds code). Files (two zip archives of 45.8 MB and 43.8
  MB per the page; v2 is the newer) could not be listed without login, so annotation files, formats and
  pixel size are not verified. The original dataset paper ("Heuristic Optimization ... Organelle Networks")
  was not found in Europe PMC. Pixel size not stated on the page or in the full text of PMC11467052.
