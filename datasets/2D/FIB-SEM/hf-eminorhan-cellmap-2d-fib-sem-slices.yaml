  notes: 'Listing: HF API, 42 files, 79,895,588,753 B exact (card dataset_size 79,902,200,986 B is the decoded size). Format
    is Parquet (not in the schema enum, hence other) with PNG-encoded image/label cells (card example: PngImageFile, mode
    L). Nothing was read from the Parquet files themselves (no Parquet reader among the inspection tools); 3 rows checked
    through the HF datasets-server rows API (187 KB; previews re-encoded as JPEG): crop jrc_hela-2/recon-1/crop28 z352 400x400,
    jrc_mus-liver-zon-2/recon-1/crop366 y88 600x600, jrc_jurkat-1/recon-1/crop38 z133 400x400; image 0-255, label previews
    0-61 (lossy, so value counts are approximate). Processing per create_slice_dataset_cellmap.py: 1-99 percentile stretch
    to uint8, raw zoomed to label grid, label ''all'' cast to uint8. Label encoding and class names not documented (likely
    CellMap class IDs, unverified). Voxel size not found; checked: dataset card, HF info API, creation script (reads OME-NGFF
    scale but does not store it), paper (not open access; abstract: 4 nm and 8 nm data), so it varies per crop. Organisms
    not set: rows of several samples (e.g. jrc_hela-2, jrc_mus-liver-zon-2) are shuffled into every shard. No single archive:
    40 direct Parquet shard URLs (resolve/main/data/...), range requests supported.'
