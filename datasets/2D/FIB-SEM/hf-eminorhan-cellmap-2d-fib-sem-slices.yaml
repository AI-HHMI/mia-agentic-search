notes: 'Derived re-export of OpenOrganelle / CellMap challenge crops (CC-BY-4.0 per card) by a third party, with all three axes sliced,
  so the 366k slices are highly redundant. Card states 22 samples, 289 crops, train split only, Parquet, license CC-BY-4.0,
  but not voxel size, class-value encoding or shard count; the Heinrich et al. Nature 2021 paper is not open access (abstract
  only: up to 35 organelle classes, 4 nm and 8 nm voxels), so the voxel size of the particular crops is unverified. Format is Parquet
  (not in the schema enum), hence other. Related OpenOrganelle crops are catalogued separately as 3D FIB-SEM records.'
