notes: 'peek_archive listing: UCPH_IMAGE_cristae_dataset/images (150 png) and /masks (150 png), 10.7 MB compressed. Paper (Commun Biol 2024, Data availability): the images come from the EPFL CA1 hippocampus
  FIB-SEM volume (about 5 nm voxels, image registered by the authors) and the zip holds their cristae annotations; mask class values (outer membrane, crista membrane, intracristal space) are described in
  the paper. No license stated for the zip or on the Data availability section. Paper Methods: the 150 slices are 256x256 crops from nine resliced planes, chosen by active learning, so 2D. Related to epfl-hippocampus-mitochondria-em
  (mitochondria-only labels of the same volume); this record adds cristae labels. enricher: size_bytes 10,739,252 from exact zip listing (was null); z of voxel size set null for 2D slices (was 5; volume
  is ~5x5x5 nm per paper).'
