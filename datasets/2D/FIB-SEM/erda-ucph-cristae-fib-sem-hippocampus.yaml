notes: 'peek_archive listing: UCPH_IMAGE_cristae_dataset/images (150 png) and /masks (150 png), 10.7 MB compressed (compressed size is 10.7 MB, so size_bytes left null). Paper (Commun Biol 2024, Data availability):
  the images come from the EPFL CA1 hippocampus FIB-SEM volume (about 5 nm voxels, image registered by the authors) and the zip holds their cristae annotations; mask class values (outer membrane, crista
  membrane, intracristal space) are described in the paper but the PNG values were not inspected. No license stated for the zip or on the Data availability section. Whether the 150 slices are consecutive
  or in which orientation is not stated, hence dimensionality 2D. Related to epfl-hippocampus-mitochondria-em (mitochondria-only labels of the same volume); this record adds cristae labels.'
