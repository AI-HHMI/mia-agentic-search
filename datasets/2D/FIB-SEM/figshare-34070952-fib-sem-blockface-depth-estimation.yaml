notes: 'Read the figshare record (25 files, 4.4 GB: 18 per-volume .tar archives of NPZ planes, index tables, splits.csv with a leave-volume-out fold per plane, README, checksums), the README data dictionary, sources.csv and the head of splits.csv. Tar contents were not listed remotely, so the NPZ layout comes from the README. Pixel size varies per plane (4 to 128 nm, in meta and splits.csv), so voxel_size_nm is null. Depths are computed from the source OpenOrganelle / COSEM label segmentations (largely network-made, hence source automatic); the data descriptor the README mentions was not found online. The README warns that resolution, specimen and class are confounded: the seven 128 nm mouse-tissue volumes carry only nucleus labels. Format is other because the arrays are NPZ.'
