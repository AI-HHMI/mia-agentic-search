notes: 'Read the figshare record (25 files, 4.4 GB: 18 per-volume .tar archives of NPZ planes, index tables,
  splits.csv with a leave-volume-out fold per plane, README, checksums), the README data dictionary, sources.csv
  and the head of splits.csv. Tar contents were not listed remotely, so the NPZ layout comes from the
  README. Pixel size varies per plane (4 to 128 nm, in meta and splits.csv), so voxel_size_nm is null.
  Depths are computed from the source OpenOrganelle / COSEM label segmentations (largely network-made,
  hence source automatic); the data descriptor the README mentions was not found online. The README warns
  that resolution, specimen and class are confounded: the seven 128 nm mouse-tissue volumes carry only
  nucleus labels. Format is other because the arrays are NPZ. organisms (sources.csv): Homo sapiens =
  jrc_hela-*, jrc_jurkat-1, jrc_macrophage-2, aic_desmosome-*; Chlorocebus aethiops = jrc_cos7-11; Mus
  musculus = jrc_mus-*, jrc_choroid-plexus-2.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  25 files  4.4 GB (figshare 34070952)\n  <volume>.tar  x18  (aic_desmosome-2/-3, jrc_choroid-plexus-2,\
      \ jrc_cos7-11, jrc_hela-1/-2/-3/-bfa, jrc_jurkat-1,\n                      jrc_macrophage-2, jrc_mus-heart-1,\
      \ -hippocampus-1, -kidney-3, -liver, -liver-3, -pancreas-4, -skin-1, -thymus-1)\n    blockface/<volume>__<tier>_bNNN/faces/<volume>__<tier>_bNNN_zNNNN.npz\
      \   23,968 planes in all (checksums.sha256)\n  splits.csv, boxes.csv, sources.csv, instance_index.parquet,\
      \ instance_index.csv.gz, checksums.sha256, README.md\n"
    n_files: 25
    listing_complete: true
  sample:
    urls:
    - https://ndownloader.figshare.com/files/69663531
    size_bytes: 51968000
    description: Smallest per-volume tar (jrc_mus-hippocampus-1, 128 nm planes, nucleus only); one NPZ
      plane holds the micrograph and all label arrays
  arrays:
  - role: raw
    path_pattern: '*.tar::blockface/*/faces/*.npz (em)'
    format: other
    axes: yx
    shape:
    - 320
    - 320
    shape_varies: true
    dtype: uint8
    compression: unknown
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: label
    path_pattern: '*.tar::blockface/*/faces/*.npz (inst_face)'
    format: other
    axes: yx
    shape:
    - 320
    - 320
    shape_varies: true
    dtype: int32
    compression: unknown
    value_range:
    - 0
    - 250
    normalization: unknown
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: Same NPZ as em; README says all arrays share the plane's shape. IDs are unique within
      a box only.
  - role: label
    path_pattern: '*.tar::blockface/*/faces/*.npz (cls_face)'
    format: other
    axes: yx
    shape:
    - 320
    - 320
    shape_varies: true
    dtype: uint8
    compression: unknown
    value_range:
    - 0
    - 1
    normalization: unknown
    encoding: semantic-ids
    classes: null
    alignment: same-grid
    alignment_notes: Indexes the per-box classes list in meta (README warns the same ID names different
      organelles in different boxes; join by name). Up to 13 classes corpus-wide (chrom, endo, er, eres,
      golgi, ld, lyso, mito, ne, nucleolus, nucleus, pm, vesicle per sources.csv).
  - role: label
    path_pattern: '*.tar::blockface/*/faces/*.npz (depth_below_steps)'
    format: other
    axes: yx
    shape:
    - 320
    - 320
    shape_varies: true
    dtype: uint16
    compression: unknown
    value_range:
    - 0
    - 46
    normalization: none
    encoding: other
    classes: null
    alignment: same-grid
    alignment_notes: Per-pixel depth in z steps (multiply by meta z_step_nm); own_occupancy_below_steps
      and thickness_below_steps (uint16) and mask / clipped (bool) are further same-grid arrays in each
      NPZ.
  notes: 'Exact figshare listing: 25 files, 4,418,031,275 B. Tar contents from checksums.sha256 (23,968
    NPZ planes). Range-read the first NPZ of two tars with a small script (np.load, allow_pickle=False;
    meta is a JSON string): hippocampus-1 b000 z0000 320x320, 128 nm, classes [nucleus]; cos7-11 b000
    z0038 150x384, 64 nm, classes [mito, er]. Plane shape and pixel size vary per box (README: 4-128 nm,
    stored in meta pixel_size_nm and splits.csv px_nm), so imaging.voxel_size_nm stays null. NPZ members
    could not be addressed by TensorSwitch (tar, not zip); the sample is the smallest tar.'
