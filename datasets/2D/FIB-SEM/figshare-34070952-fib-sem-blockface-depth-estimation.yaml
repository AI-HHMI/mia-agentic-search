schema_version: '1.2'
id: figshare-34070952-fib-sem-blockface-depth-estimation
title: Block-face FIB-SEM micrographs paired with per-pixel organelle depth, derived from OpenOrganelle and Janelia COSEM reconstructions
short_name: FIB-SEM block-face depth maps (cells, tissue)
description: 23,968 FIB-SEM block-face micrographs cut from 1,723 cubic sub-volumes of 18 OpenOrganelle / Janelia COSEM whole-cell reconstructions (10 cultured-line volumes, 1 mouse liver and 7 mouse tissue volumes). Each cut plane is an NPZ with the micrograph, exposed instance and class maps, a foreground mask, and exact per-pixel depth the exposed organelle continues below the face, for up to 13 organelle classes. A splits.csv gives a leave-volume-out fold per plane. Derived from CC-BY-4.0 source data; nothing is newly acquired.
