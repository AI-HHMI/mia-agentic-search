notes: 'Dataset names and shapes come from probing two HDF5 files (h5py) and the zip listing (268 h5); counts match the split
  manifest (268 samples, 214 train, 54 val). Pixel size 133.6517 nm is the ImageJ calibration in the raw TIFFs of the same
  record, not in the h5 files. Paper (bioRxiv preprint, first 100k characters read): about 250 of 500 time-series images were
  manually corrected to train the Cellpose model that gives cell outlines, and an Attention U-Net was trained on 268 manually
  annotated images for rosette identification, so rosette masks are manual and outlines are model output corrected by hand
  (source mixed). The preprint does not state the live-imaging objective or the z-step, and the remaining 155k characters
  were not read; the stain or reporter shown in raw_data was not confirmed. Rosette frames come from live-imaging time series,
  but each file is a single 2D frame.'
