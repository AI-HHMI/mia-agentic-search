notes: 'Hosted on the public S3 bucket s3://czi-subcell-public/hpa-processed/cell_crops/ (one subfolder per 96-well plate; listing of plate 10 shows _cell_image.png about 1.4-2.4 MB and _cell_mask.png about 5 KB per cell, plus a metadata CSV per field of view). Total image/cell count, total size, pixel size, microscope model and train/val/test split are not stated on the dataset page, in the listed S3 prefix or in the readable part of the paper (bioRxiv full text truncated at the end; Methods not fully read). Mask method (HPA-Cell-Segmentation) is automatic; localization labels are HPA manual expert annotation per field of view, so crops from one field share labels and may overlap. License CC BY-SA 3.0 as stated on the dataset page (inherited from HPA). Images are mostly 16-bit with a few 8-bit.'
