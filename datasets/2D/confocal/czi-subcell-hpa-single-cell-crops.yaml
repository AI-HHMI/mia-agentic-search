description: Single-cell crops (1024x1024 PNG, centred on each segmented cell) from Human Protein Atlas Subcellular Section v23 confocal immunofluorescence images, with four channels (microtubules, endoplasmic reticulum, DNA, protein of interest) and a cell mask per crop. Protein subcellular localization labels come from HPA expert annotation per field of view. Released with the SubCell vision foundation models for training and benchmarking.
