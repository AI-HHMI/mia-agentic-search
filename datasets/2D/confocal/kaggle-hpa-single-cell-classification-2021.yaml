notes: 'Files are on Kaggle (competition rules/login needed); the Kaggle page returned
  404 to curl and an empty body to WebFetch from this sandbox, so url_ok is false
  and file listing was not checked. Zenodo record 13219996 is a bioimage.io backup
  description of the dataset (license CC-BY-4.0, file formats described as train .tif
  and test .png, while the text also mentions PNG train.zip: formats uncertain). Pixel
  size 80 nm (63x objective, 2048x2048 frames) and 21,813 training images are from
  the Nature Methods paper Methods. Training labels are weak image-level labels, not
  single-cell masks; the manually annotated single-cell test set is hidden. Distinct
  from catalog records czi-subcell-hpa-single-cell-crops and zenodo-20352173-protlocnet
  (derived crops/other sets).'
