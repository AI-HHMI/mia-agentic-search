title: Human Protein Atlas Single-Cell Classification 2021 training set
short_name: HPA subcellular protein localisation (confocal)
description: 'Training images of the Human Protein Atlas Kaggle competition "Single
  Cell Classification": four-channel confocal fluorescence images (protein of interest,
  nucleus, microtubules, endoplasmic reticulum) of 17 human cell lines with weak image-level
  labels for 19 subcellular localisation classes. The paper reports 21,813 training
  images; the test set (1,776 images, 41,597 cells with manual single-cell labels
  and masks) is hidden in a code competition.'
