notes: 'Dataverse file list (API): 33 files, 29.5 GB, per plate 365, 488 and 561 nm image stacks as ImageJ TIFF zips with a
  .zip_ extension to be renamed to .zip, plus the threshold-segmented stacks for plates 2 to 7 (Thr values in the names),
  infected_cell_ER_signal_Plate2-7.zip_, three R scripts, the ImageJ macro and the plate layout .xls. The binary masks
  are automatic threshold segmentations of the bacteria, not manual annotations; per-cell infected labels are derived by
  the scripts. plate2_Thr=235.tif.zip_ was listed with peek_archive: one 1.6 GB binary TIFF stack (4.4 MB compressed); the other zips were not opened. Pixel size
  0.323 um after 2 x 2 binning (paper); effective camera size 671 x 497 pixels. The image count 93,300 is from the paper
  abstract. No train split.'
