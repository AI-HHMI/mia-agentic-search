id: dataverse-fyghfo-salmonella-hela-hcs-confocal
title: High-content screening image dataset of Salmonella infected human cells
short_name: Salmonella-infected HeLa HCS confocal images
description: 93,300 confocal fluorescence images (DAPI, ER tracker, Salmonella mCherry channels; 50 fields per well in seven
  96-well plates) of HeLa cells uninfected or infected with wild-type or sifA-mutant Salmonella enterica, imaged on a PerkinElmer
  Opera LX at 40x. Includes threshold-based binary segmentation stacks of the bacteria for plates 2 to 7, an ImageJ macro
  and R scripts that classify cells as infected or non-infected.
