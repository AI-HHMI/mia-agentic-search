title: NucleusNet
short_name: CV-1 DAPI nuclei crops, 1M (confocal)
description: 1,061,277 single-nucleus crops (256 x 256 px, 8-bit grayscale TIFF) cut from confocal panoramas of DAPI-stained CV-1 cell monolayers recorded over about one hundred experiments. Nuclei were segmented with Cellpose, centred and pre-aligned along their major axis, and pixels outside the mask set to zero. The author describes the set as unannotated and built to give neural networks a large training set; an autoencoder was trained on it.
