notes: 'Unlabeled dataset: the Zenodo description says "NucleusNet was not annotated"; it qualifies as a self-supervised /
  pretraining corpus because the author states it was created because neural networks demand large datasets and trained an
  autoencoder on it. The Cellpose masks are not released as files; they were only applied to zero the background in each crop.
  Single ROIs.zip (about 20 GB compressed, 69.8 GB uncompressed) listed with peek_archive: 1,061,277 .tif files, named like
  Run100BL_bottom_left_ROI_100.tif. Pixel size, microscope, magnification and species are not stated on the Zenodo record,
  which has no linked paper or related identifiers. Zenodo record page and API metadata only, no paper exists to read. enricher:
  organism Chlorocebus aethiops from Cellosaurus CV-1 (CVCL_0229) (was empty).'
