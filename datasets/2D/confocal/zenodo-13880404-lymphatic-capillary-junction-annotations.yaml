title: Data supporting the analysis of lymphatic endothelial cell junctions and shape
short_name: Lymphatic capillary junction ROIs (confocal)
description: Confocal z-stack projections of LYVE1 and VE-cadherin stained dermal lymphatic capillaries of wild-type mouse
  ear skin at 3, 5 and 25 weeks (plus diaphragm and trachea), as single-channel inverted TIFFs and RGB merges, with ImageJ
  ROI files marking the annotated cell-cell junctions classified as button, curvilinear, double or LYVE1-negative curvilinear.
  A second archive holds finite-element simulation files that are not image data.
