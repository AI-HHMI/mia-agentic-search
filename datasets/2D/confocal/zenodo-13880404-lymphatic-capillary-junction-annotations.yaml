notes: 'Dataset A of the Zenodo record (2.08 GB zip, 726 files: 91 .roi files and about 600 TIFF projections per animal/age
  folder named like "...lif - image 1.tif", ".. (rgb).tif" and C1/C2/MAX variants) is the annotated image set used for Fig.
  1g of the paper (data availability statement); Dataset B (193 MB zip) holds finite-element simulation files. enricher: size_bytes
  now the exact total of both zips (was Dataset A). Pixel size and microscope settings are not stated on the Zenodo page;
  the paper says images were taken on a Leica SP8 or Stellaris 5 with details in its Supplementary Information, which was
  not read, so voxel size is null. n_items is left null because the number of independent images was not counted. The labels
  are a few junction ROIs per image marking junction type, not dense masks, so training value is mainly junction classification
  or detection.'
