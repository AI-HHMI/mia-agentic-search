notes: 'Part of a 6-article figshare collection (10.6084/m9.figshare.c.7020531.v1). Files: 30 TIFFs (10
  images x 3 channels, 12.6 MB each) plus mask_expert1/2/3.zip, which hold Labels.tiff, annotation_times.csv
  and large screen-recording .mkv videos (about 95% of the 6.6 GB total). Peeked mask_expert1 and mask_expert3;
  expert2 not listed. Pixel size 0.103 um from the figshare description and paper Methods; confocal modality
  as stated there. Several annotation variants exist for the same images (manual vs Minimal contour, nucleus
  vs cytoplasm) so the labels are not independent images. Licence is shown by figshare as GPL 3.0+. Downloads
  are per-file figshare links, so download_url is null.'
