description: Ten 2048 x 2048 confocal fields of HeLa Kyoto cells in three fluorescence channels (DAPI,
  Alexa Fluor 488, Alexa Fluor 633), delivered as 30 single-channel TIFFs, with nucleus and cytoplasm
  instance annotations made independently by three experts (mask_expert1-3 zips; each image labelled once
  manually and once with the Minimal contour tool), released with the napari-biomag-annotator paper.
