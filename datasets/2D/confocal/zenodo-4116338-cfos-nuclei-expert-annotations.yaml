short_name: cFOS nuclei multi-expert annotations (confocal)
description: Fluorescence microscopy images of cFOS-positive nuclei (and GABA/PV somata in zebrafish) from five
  laboratories, with manual segmentations by 3-5 independent experts per image set and a STAPLE consensus
  ground truth. Training set of 56 images (36 from Lab-Wue1, 5 each from four other labs), a Lab-Wue1 test
  set, additional raw images with model-predicted labels, and trained U-Net models.
