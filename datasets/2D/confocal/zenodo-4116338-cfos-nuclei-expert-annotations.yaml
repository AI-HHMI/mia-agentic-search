  notes: 'Zenodo API listing complete: 9 files, 7,795,919,484 bytes (n_files counts top-level files; zip members:
    train_data 373, test_data 54, bioimage_data 25,761, listed with peek_archive). Probed one raw + est_GT PNG per
    lab (all grey uint8, label shape = image shape). Sampled 3 pairs (Wue1 0148, Inns1 1124 expert_1, Wue2 1670):
    raw uint8 min 0 max 255 (Wue1 mean 25, Inns1 mean 14, Wue2 mean 21 with 37% zeros), labels exactly {0,255}.
    value_range is from these samples. normalization unknown: the paper says 12-bit stacks were max-projected and
    converted to 8-bit, but not how. Voxel size differs per lab (see record notes); TIFF header of bioimage_data/lab-wue1/images/1608.tif
    says 621.0 nm/px (ImageJ, micron), matching 1.61 px/um. 2D record: not convertible by the miao layout yet. Direct
    links: Zenodo files/<name>.zip URLs accept range requests (zip members readable).'
