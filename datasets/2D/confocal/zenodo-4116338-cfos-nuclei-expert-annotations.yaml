notes: 'Training set train_data.zip: Lab-Wue1 36 images (experts 1-5 + STAPLE est_GT), Lab-Inns1/Inns2/Mue 5 each
  (experts 1,3,4,5 + est_GT), Lab-Wue2 5 (experts 6-8 + est_GT + ignored_regions); test_data.zip = expert labels
  for 9 Lab-Wue1 test images (raw in bioimage_data.zip). organisms: Danio rerio = lab-wue2/, Mus musculus = all
  other labs. Pixel size differs per lab (eLife Fig 5 source data 2): Wue1 1.61 px/um (621 nm, matches TIFF header),
  Mue 0.8 px/um (1250 nm), Inns1 1 px/um (1000 nm), Inns2 2 px/um (500 nm), Wue2 12.87 px/um (77.7 nm), so voxel_size_nm
  is null. enricher: modality confocal + widefield (Inns1/Inns2 epifluorescence per the same table; was fluorescence-other);
  channels 1 (grey PNGs). size_bytes is the whole Zenodo record (incl. 7.3 GB model_library.zip).'
