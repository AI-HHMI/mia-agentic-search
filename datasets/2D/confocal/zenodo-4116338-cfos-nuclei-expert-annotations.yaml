notes: 'train_data.zip (listed with peek_archive): 373 files, PNG images plus expert label masks - Lab-Wue1 36
  images with labels from experts 1-5 and est_GT, Lab-Inns1/Inns2/Mue 5 images each (experts 1,3,4,5 + est_GT),
  Lab-Wue2 5 images (experts 6-8 + est_GT + ignored_regions); test_data.zip holds the Lab-Wue1 test set (9 images
  per the paper). bioimage_data.zip holds 884 TIFFs and about 24.9k PNGs (raw images and model-predicted
  labels). Pixel size is stated only for Lab-Wue1 (1024x1024 px, 1.61 px/um, 12-bit confocal stacks max-projected
  to 8-bit) and differs between labs, so voxel_size_nm is null. Imaging modality of the external labs is not
  stated beyond "different image acquisition techniques"; Wue1 and Wue2 are confocal. size_bytes is the
  total Zenodo record size (includes 7.3 GB model_library.zip). Sources checked: Zenodo record and file
  listing, readme.txt, archive listings, paper full text (Methods, Data availability; the paper also deposits
  a copy at Dryad 10.5061/dryad.4b8gtht9d).'
