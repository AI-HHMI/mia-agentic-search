notes: 'Labels are image-level taxon classes (folder names; object_annotation_category in the tsv tables),
  validated on EcoTaxa after ML-assisted search per the paper, hence source mixed. No license on the BioStudies
  page or EcoTaxa project API; the paper is CC-BY-4.0 but does not state the dataset terms. jpg = UVP5
  (in situ imager, modality other), png = eHCFM confocal. organisms: Trichodesmium = images/Trichodesmium/
  + UVP5 puff/, tuft/; Richelia = Hemiaulus inter Richelia/, Rhizosolenia inter Richelia/; Calothrix =
  Chaetoceros inter Calothrix/, free Calothrix/; Crocosphaera = Climacodium inter Crocosphaera/ (diatom
  hosts in the folder names). enricher: size 2080074838 B from the full file listing (was zip only). Voxel
  size: subsets differ (see technical.notes), kept null.'
