  notes: 'Listing: tools/listing.py over the 5 files (exact Content-Length, zip expanded: 1174 members,
    960 png, 210 jpg, 4 tsv). Probed 3 png + 2 jpg headers; sampled one png and one jpg (value ranges
    from one sample each; both use the full 0-255 range, so normalization unknown: these are rendered
    vignettes). Labels are image-level classes only (folder name + tsv row), no masks; per-object morphometric
    features are in the tsv. Voxel size: kept null. Subsets differ: eHCFM acquisition tsv acq_run_voxelsize
    X252Y252Z3000 (no unit stated; Leica SP8, 20x), UVP5 acquisition tsv acq_pixel 0.174 (no unit stated).
    The PNG vignettes are rescaled montages, so their pixels are not the acquisition grid anyway. Checked:
    PNG/JPEG headers (no calibration), BioStudies API, both acquisition tsv, paper full text (Methods,
    Data availability; no pixel size). Direct links: the zip on ftp.ebi.ac.uk is usable with range requests;
    members are fetched as zip::member. Not convertible yet: 2D, multiple organisms; the confocal PNGs
    are montages, not raw channels.'
