notes: 'Zip listing (960 png, 210 jpg, 4 tsv) checked with peek_archive. Labels are image-level taxon classes (folder names and tsv annotation category), validated by the authors on the EcoTaxa platform after machine-learning-assisted search per the paper, hence source mixed. No license on the BioStudies page; the paper is CC-BY-4.0 but that does not state the dataset terms. Pixel/voxel size not stated on the page or in the paper text read; per-sample acquisition tsv not parsed. The jpg files are UVP5 images, the png files the confocal ones (per folder names seen in the listing).'
