title: Tara Oceans imaging dataset for N2-fixers
short_name: Tara Oceans N2-fixer plankton (confocal, UVP5)
description: Images of marine nitrogen-fixing plankton from the Tara Oceans expeditions, sorted into one folder per annotated taxon (diatom-diazotroph associations, Trichodesmium filaments and colonies, other N2-fixers). Two image sources - environmental high-content fluorescence (confocal) microscopy of 20-180 um net samples, and in situ Underwater Vision Profiler 5 (UVP5) images of Trichodesmium colonies (puff/tuft). Per-object tables give the annotation category, taxonomic hierarchy and annotation status.
