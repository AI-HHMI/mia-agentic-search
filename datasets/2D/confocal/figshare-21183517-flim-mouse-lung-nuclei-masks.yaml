notes: 'Files from the figshare API: images.hdf5 (596.6 MB), masks.hdf5 (0.7 MB), cell_class.csv (0.3 MB). Paper
  Methods: 80 FLIM image pairs (1024 x 1024) acquired at two excitation/emission settings (570/575-620 nm and 590/600-640
  nm); nuclei masks (9,308 nuclei, annotated with Labkit) and class labels exist for a subset of twenty image pairs.
  Pixel size not stated on the figshare page or in the paper Methods. Publication date not read from the page. Cell
  classes were assigned by reference to antibody-stained sections. enricher: download_url = figshare article (was
  null; three separate files). HDF5 layout <image id>/<570|590>/<g|int|s>; masks.hdf5 has 20 datasets.'
