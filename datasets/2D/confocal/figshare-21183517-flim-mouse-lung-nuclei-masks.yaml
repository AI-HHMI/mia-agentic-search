notes: 'Files from the figshare API: images.hdf5 (596.6 MB), masks.hdf5 (0.7 MB), cell_class.csv (0.3 MB). Paper Methods: 80 FLIM image pairs (1024 x 1024) acquired at two excitation/emission settings (570/575-620 nm and 590/600-640 nm); nuclei masks (9,308 nuclei, annotated with Labkit) and class labels exist for a subset of twenty image pairs. n_items=80 is the paper''s image-pair count and was not checked against the HDF5 contents (h5 header not read). Pixel size not stated on the figshare page or in the paper Methods. Publication date not read from the page. Cell classes were assigned by reference to antibody-stained sections.'
