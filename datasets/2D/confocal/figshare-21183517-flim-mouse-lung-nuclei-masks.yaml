description: Phasor fluorescence lifetime (FLIM) confocal images of mouse lung cryosections stained with propidium iodide and WGA Alexa Fluor 555, in one HDF5 file (images.hdf5; per image and acquisition channel the g and s phasor components and fluorescence intensity). A second HDF5 file (masks.hdf5) holds cell-nucleus instance masks for a subset of the images, and cell_class.csv gives the cell/tissue class of each masked nucleus (alveolar epithelial, bronchial epithelial, vascular and smooth muscle, macrophage).
