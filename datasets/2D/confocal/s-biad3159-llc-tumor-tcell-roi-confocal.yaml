notes: 'Read the BioStudies record, both file lists and the paper (Methods, Data availability). The images
  are 9 distinct tile-scan fields (CZI; 8 of them also exported as TIFF, about 4.5 GB in total); 326 ROI
  files annotate T cell nuclei, only for 4 of the CZI images (Mouse_1 and Mouse_2, CD4 and CD8), so annotation
  coverage is partial. The ROIs were drawn by hand around nuclei in the Hoechst channel to measure Hoechst
  intensity versus distance to CD31+ vessels, not to train a model, so the label set is small and was
  not designed for training. Pixel size is given only as ~0.3 um in the paper Methods (not per file);
  z is not applicable. Publication date is not shown in the BioStudies API record that was read. Which
  TIFF corresponds to which RoiSet is stated only per ROI file (source_image attribute). enricher: CZI
  metadata say 4 channels (AF555, AF488, AF647, DAPI; was 3) and 103.58 nm/px for the annotated scans,
  which conflicts with the 300 nm kept here.'
