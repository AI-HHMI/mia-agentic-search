id: s-biad3159-llc-tumor-tcell-roi-confocal
title: Confocal microscopy imaging of CD4 and CD8 T lymphocytes infiltrating LLC mouse tumors, and their
  proximity to blood vessels (CD31+), assessed by Hoechst 33342 uptake in vivo
short_name: LLC tumor T cells and vessels (confocal)
description: Tile-scan confocal images (Zeiss LSM980 Airyscan 2) of Lewis lung carcinoma tumor cryosections
  stained for CD4 or CD8 T cells and CD31 blood vessels, with Hoechst 33342 injected in vivo as a perfusion
  marker. Provided as CZI and TIFF images together with 326 ImageJ ROI files that outline manually identified
  CD4+ and CD8+ T cell nuclei in two tumors (Mouse_1, Mouse_2).
