title: CORN - corneal confocal microscope dataset (nerve fibres, Langerhans cells, tortuosity, enhancement)
short_name: CORN corneal nerves (confocal)
description: Corneal confocal microscopy (CCM) images in six subsets from the iMED lab - CORN-1 (1,698
  images with manually traced nerve centerlines), CORN-2 (low/high-quality image sets for enhancement
  plus 60 annotated test images), CORN-3 and CORN1500 (tortuosity grades 1-4), CORN-Pro (1,120 images
  with Langerhans and stromal cell masks) and CORN-Complex (7,522 images from 518 patients, 1,429 annotated
  for nerves and Langerhans cells). Files are released on request.
