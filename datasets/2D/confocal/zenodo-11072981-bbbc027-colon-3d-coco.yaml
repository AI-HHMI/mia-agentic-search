notes: 'Derived from BBBC027, which is synthetic (simulated) data, so there is no real specimen or organism.
  Zip listings: train.zip holds 539,388 PNGs and test.zip 126,693 PNGs (images under <slice>/images/,
  one mask PNG per cell instance under <slice>/masks/); the number of image slices alone was not counted,
  so n_items is null. A sampled test image is 1030x1300 8-bit grayscale PNG. info_split.json lists 24
  train and 6 test source volumes. Voxel size not stated on the Zenodo page or BBBC027 page; the ICIAR
  paper full text is not open access and only the abstract/metadata was reachable. Total size is not set
  because the sum of the four data files was not confirmed by a complete listing. Masks are derived automatically
  from the simulation ground truth (BBBC027 binary masks), converted by the depositor; unannotated slices
  were removed. enricher: size_bytes and n_items (2,910 slices) from the complete listing; were null.'
