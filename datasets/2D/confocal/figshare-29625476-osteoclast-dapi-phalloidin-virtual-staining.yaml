description: 4,725 paired 256 x 256 TIFF images of osteoclast cultures for supervised virtual staining
  in fluorescence microscopy - a grayscale input image and the matching RGB ground truth fluorescence
  image stained with DAPI (nuclei) and Phalloidin (cytoskeleton). 4,515 pairs are in the training folders
  and 210 in the test folders. Acquired on a Leica Stellaris 8.
