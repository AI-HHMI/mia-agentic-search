notes: 'Read the figshare record and listed the 337 MB zip with peek_archive (9,450 TIFFs: 4,515 each
  in input_images_train and gt_images_train, 210 each in the test folders). No paper or README was found
  (a TU Dresden conference abstract on virtual fluorescent staining of connective tissue may be related
  but could not be confirmed), so the species and cell source, pixel size, what imaging mode produced
  the grayscale input (the description only says grayscaled input images) and how the 256 x 256 crops
  were cut (file names gt_image_NN_subimage_NNN suggest crops of about 20 to 25 source images) are not
  verified. Modality confocal follows the Stellaris 8 microscope in the description; the input channel
  may not be a confocal channel. Task is image-to-image translation (virtual staining), filed as other.
  enricher: crops are 257x257 PackBits per headers (description says 256x256 uncompressed).'
