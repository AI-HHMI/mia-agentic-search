description: About 105,000 PNG images of individual marine plankton particles from Tara Oceans samples
  near the Marquesas Islands, imaged by environmental high-content fluorescence confocal microscopy and
  sorted into 142 expert-validated taxonomic categories (EcoTaxa project 3330), with a per-image metadata
  registry.
