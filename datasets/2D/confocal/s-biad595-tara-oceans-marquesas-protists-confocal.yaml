notes: 'Summary.tsv lists 142 categories whose occurrences sum to 104,985 images. Annotations come from supervised machine
  learning prediction followed by human curation on EcoTaxa (the page states annotations carry a variable degree of
  uncertainty), hence source mixed. Files are PNG images, one per particle; the paper describes a 3D multichannel e-HCFM
  workflow on a Leica SP8, but which channels or projection the PNGs show is not stated, so channels and pixel size are
  null. Total size not stated on the page. Per-image annotation status (validated or not) is in the registry TSV, so not
  every image may be validated. The page lists no author names; Sebastien Colin is the annotator named in the registry
  and first author of the paper.'
