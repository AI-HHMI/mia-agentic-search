notes: 'One 9.2 GB zip listed with peek_archive: SupplementalData_Sub2_Final/DAT_Im holds 5,358 TIFF patches and DAT_DX the
  5,358 matching binary PNG maps, plus Readme.txt. The paper (PMC8221965) says 5,359 patches of 1128 x 1128 pixels from 26
  whole-slide XVM images, of which only 243 patches contain BCC (about 4.5% of pixels), imaged with an RSG4 confocal
  microscope (Caliber ID) at 488 and 532 nm; masks were drawn manually in a MATLAB labeler by an engineer in consultation
  with confocal pathologists. Pixel size is not stated; the Methods window sizes (3 px = 1.5 um, 40 px = 20 um) imply about
  0.5 um/px, so voxel_size_nm is left null. The images in this record are colorized RGB renderings (not the AI-enhanced
  histology-like images). Z-stacks of 8 sections at 5 um spacing were collapsed to 2D before patching. The Zenodo record
  states CC-BY-4.0; the article itself states no data license. Patient count not stated.'
