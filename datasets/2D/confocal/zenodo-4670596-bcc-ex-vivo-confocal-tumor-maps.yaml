title: Ground truth training images for basal cell carcinoma pathology in ex vivo microscopy
short_name: Skin BCC ex vivo confocal tumor maps
description: 5,358 colorized ex vivo confocal microscopy (XVM) image patches of Mohs surgical skin excisions, each paired
  one-to-one with a binary ground-truth tumor positivity map (white = tumor, black = not tumor), released to train an
  automated basal cell carcinoma diagnosis network. Patches come from 26 surgical excision specimens; only a small
  share of patches contain tumor.
