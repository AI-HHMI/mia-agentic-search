notes: 'Zip listing (complete) holds 58 TIFFs (29 DMSO, 29 FCCP, 209 MB compressed); the page index lists 59 images. The page text says DMSO or CCCP while the folder and zip are named FCCP; the paper Methods calls the compound carbonyl cyanide m-chlorophenylhydrazone (CCCP), so naming is inconsistent. Pixel size not stated on the page (oversampled 0.03 um pixels per the paper Methods before deconvolution), left null. At 58 images it is just above the minimum size. Companion of BBBC052 (actin). NC license restricts commercial use.'
