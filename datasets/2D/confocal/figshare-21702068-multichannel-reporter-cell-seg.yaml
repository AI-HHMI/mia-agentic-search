notes: 'Figshare API: one 563 MB zip, CC BY 4.0. peek_archive and the zip README: 715 channel .tif files and 205 annotation.json files across CL1_A1 (50 samples, 3 channels), CL1_A2 (5, widefield), CL2 (22, 4 ch), CL3 (28, 4 ch), CL4 (50, 4 ch), CL5 (50, 3 ch). Paper (open access, Methods read): Nikon A1R confocal, annotated by multiple biologists; pixel size 1.24 um (CL1, CL4, CL5), 0.43 um (CL2, CL3), 0.32 um (CL1_A2 widefield), so voxel_size_nm is null; channels is the maximum (3 or 4). Paper used an 80/10/10 split of each set but no split files are in the zip. Label channel semantics per cell line are in the paper Table 1. Cell lines are human (U2OS osteosarcoma, A375 melanoma).'
