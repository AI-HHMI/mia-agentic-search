title: 'Segmentation Dataset: multi-channel live-cell reporter images of U2OS and A375 cell lines with nuclei and cytoplasm annotations'
short_name: Reporter cell nuclei, cytoplasm masks (confocal)
description: 205 annotated samples from six sets (CL1_A1, CL1_A2, CL2 to CL5) of live-cell fluorescent reporter images of U2OS and A375 cell lines (3 or 4 channels each, Nikon A1R confocal; one widefield set), with manual nuclei and cytoplasm outlines stored as GeoJSON per sample. Used to fine-tune Cellpose for cells without structural labels.
