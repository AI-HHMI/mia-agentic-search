title: Bo-Net mouse bone fluorescence images with osteoblast, osteoclast, vessel and bone masks
short_name: Mouse bone cells and vessels masks (confocal, MPM)
description: >-
  Confocal and multiphoton fluorescence images of 300 um mouse tibia sections (osteoblasts, osteoclasts, blood vessels,
  bone matrix), mostly z-axis maximum projections, with manually drawn binary ground-truth masks per structure, used
  to train and validate the Bo-Net segmentation model.
