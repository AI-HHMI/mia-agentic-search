notes: >-
  480 files, 3.9 GB in ten folders (Blood Vessels, Osteoblasts, Osteoclasts, Bone CM, Bone MPM; each with *_Acquisition
  and *_Annotation), including a few Thumbs.db files. Per-structure binary masks (1 = structure, 0 = background) were
  drawn manually in ImageJ by three annotators; confocal bone masks were derived from acellular regions of the
  superimposed channels. Images are 1024x1024 confocal (608 um field, 20x, ~0.59 um/px) and 1064x1064 multiphoton
  (360 um field, 16x); z-spacing 8-10 um; the BioStudies record gives no explicit pixel size, so voxel_size_nm is left
  null. The paper's 21,395 training/validation patches (animal-level split) are derived from these and are not
  deposited as such; no split files were seen in the listing. Source images are z projections or stacks, so
  dimensionality is recorded as 2D.
