notes: 'Zip listing (peek_archive) shows 1,170 Raw/512/Seg triplets: Age_Matched_Controls (1,084 images
  across P12/P17/P25 NOX and OIR), OIRSeg (50) and Xin_et_al_Eylea_vs_IgG (36). The paper describes the
  held-out test split but the record has no split folders, so splits_provided is false. Pixel size not
  stated on the Figshare page, the paper Methods or the listing; image channels (single fluorescence channel)
  inferred from the isolectin B4 labelling described in Methods. Dimensionality 2D: stitched whole-mount
  images. All 1,170 Seg files are .jpg; a few raw images are .tif (6 in the listing). Author list is the
  Figshare record depositor; the paper has more authors. enricher: size 3,427,109,150 B from the full
  file listing (was the zip size alone); labels are 0/255 masks in lossy JPEG.'
