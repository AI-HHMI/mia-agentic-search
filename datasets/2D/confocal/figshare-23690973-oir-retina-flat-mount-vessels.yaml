  - role: label
    path_pattern: OIR_Flat_Mount_Dataset.zip/*/Seg/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 512
    - 512
    - 3
    shape_varies: false
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: vessel
    alignment: same-grid
    alignment_notes: 'Pairing rule: <folder>/Seg/<name>.jpg pairs with <folder>/512/<name>.jpg (same stem,
      same 512 x 512 grid). Manual vessel masks saved as lossy greyscale-in-RGB JPEG: R = G = B within
      14, 98.3% zeros, 0.8% > 127, ~1% intermediate values from JPEG artifacts, so threshold (e.g. > 127)
      to get the binary mask.'
  notes: 'Listing: tools/listing.py on the Figshare API record with --expand-zips: 3 files (zip, Final
