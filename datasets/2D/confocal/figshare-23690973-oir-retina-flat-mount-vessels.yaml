    - 2420
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: scaled
    alignment_notes: Full-resolution stitched (5 x 5 tiles) originals; size varies per image (2385 x 2420
      and 2355 x 2355 in the files read). The Seg masks are on the 512 grid, i.e. the Raw image rescaled
      non-uniformly to 512 x 512; no transform is given. Red-pseudocolour RGB like the 512 images.
  - role: other
    path_pattern: OIR_Flat_Mount_Dataset.zip/*/Raw/*.tif
    format: tiff
    axes: yxs
    shape:
    - 2355
    - 2355
    - 3
    shape_varies: true
    dtype: uint8
