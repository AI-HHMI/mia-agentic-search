notes: 'Zenodo file listing shows 98 TIFFs: 49 images plus 49 matching _mask.tif files. The 19/10/10 train/validation/test split is described in the paper but split files are not part of the Zenodo record, so splits_provided is false. Masks came from a three-step semi-automatic annotation pipeline from an earlier work (see paper Supplemental Material), hence source mixed; the paper notes some masks include non-microtubule structures. Pixel size is not stated on the Zenodo page or in the paper text read; the TIFF headers were not probed. Paper PMC13543471 also points to a separate synthetic MicSim_FluoMT record (zenodo.14696279) that is not included here.'
