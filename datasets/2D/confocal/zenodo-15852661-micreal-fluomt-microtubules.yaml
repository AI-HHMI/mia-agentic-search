title: 'MicReal_FluoMT: A dataset of microscopy images with stained microtubules'
short_name: C. elegans microtubule segmentation (confocal)
description: 49 Airyscan confocal fluorescence images of fixed Caenorhabditis elegans one-cell embryos
  stained with anti-tubulin, each with a binary microtubule segmentation mask. The paper splits them into
  19 training, 10 validation and 10 test images. A companion synthetic microtubule set is a separate Zenodo
  record and is not part of this one.
