    alignment_notes: 'Pairs by identical file name: Lesion/<cat>/Images/<cat>_NNNN.tif <-> Lesion/<cat>/Annotations/<cat>_NNNN.tif;
      shapes match. Mask = lesion (255) vs background (0); the lesion category comes from the folder.'
  notes: 'Listing: the one zip (figshare files API, 178,487,173 B exact) and its index (peek_archive:
    2,376 members, 2,374 tif + 2 txt). Probed BK_0001 image + mask and NF_0001: 384x384 uint8, plain single-page
    TIFF, uncompressed, no calibration. Sampled BK_0001 and FECD_0001 pairs: images 10-255 / 7-255 (one
    sample each); masks binary {0,255}, 3.1% / 1.0% foreground. tools/sample.py needs a .zip path, so
    samples were read via the figshare S3 redirect of the same file. Voxel size not found; checked: figshare
    record/API (no description of device or pixel size), TIFF headers (uncalibrated), Europe PMC and web
    search for the associated paper title (not found).'
