      \      Images/<cat>_NNNN.tif              189/131/303/224/99 images\n      Annotations/<cat>_NNNN.tif\
      \         one mask per image\n    Normal/{ELR,ENC,EPC,NF,SC}/Images/<cat>_NNNN.tif   35/108/130/101/108\
      \ images\n"
