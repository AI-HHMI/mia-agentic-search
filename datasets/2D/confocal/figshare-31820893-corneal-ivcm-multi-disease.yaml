description: 1,428 in vivo confocal microscopy images of the cornea in 15 category folders - 946 images of five lesion categories (BK, ESCD, FECD,
  FK, LC), each paired with an annotation image in an Annotations folder, and 482 images of normal layers (ELR, ENC, EPC, NF, SC) without annotations -
  with training_set.txt and testing_set.txt split lists. The record describes the annotations as pixel-level expert annotations.
