notes: 'Zip index (peek_archive, one file cornealconfocal.zip, 178 MB, 2,376 members): Lesion/BK 189, ESCD 131, FECD 303, FK 224, LC 99 images each
  with an equal number of Annotations .tif files, plus Normal/ELR 35, ENC 108, EPC 130, NF 101, SC 108 images; training_set.txt (996 rows) and
  testing_set.txt (431 rows) list Category and Filename for all 1,427 images. The Figshare record only gives the title of the associated paper
  (A multi-disease in vivo confocal microscopy dataset with pixel-level expert annotations for corneal disease analysis); no publication,
  device, pixel size or category definitions were found (not on the record, not found by Europe PMC title search), so publications is empty (author as listed by Figshare) and the category
  abbreviations are left as written. Mask content was not probed. License CC BY 4.0 from the Figshare API.'
