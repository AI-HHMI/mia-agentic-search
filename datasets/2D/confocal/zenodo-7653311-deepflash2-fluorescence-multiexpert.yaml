  notes: 'Listing complete: data.zip, 992 members, 477,338,002 bytes (file-listing; the 19.7 GB record total is mostly trained models,
    not counted). Each set also ships as a nested <set>.zip inside data.zip. Probed 7 members: uint8 PNG/TIFF (deflate), int16 instance
    TIFF. Sampled PV test 1283 (raw 0-254, instance IDs 0-10) and PV train 0064 / mask 1283 (raw 0-255, mask {0,255}); value ranges
    from these samples. Voxel size differs by set (paper table: 1.61 px/um = 621 nm for PV and cFOS; 3.7 px/um = 270 nm for mScarlet,
    YFP, GFAP), so null; headers carry no calibration. Normalization unknown: the paper says Axio Zoom images were auto brightness/contrast
    enhanced in Fiji for annotation, not whether released files are. All links pass --download-check (zenodo.org, range requests). Readiness:
    2D not covered by the miao layout yet.'
