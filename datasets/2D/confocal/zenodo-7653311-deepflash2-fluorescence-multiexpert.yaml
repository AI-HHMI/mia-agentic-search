notes: 'Zenodo (15 files, 19.7 GB mostly trained models; data.zip 477 MB, 992 files listed with peek_archive). Per paper table:
  PV 36 train/8 test (confocal, 1024x1024, 1.61 px/um), cFOS 36/8 plus 280 additional unannotated images (confocal), mScarlet,
  YFP 12/8 each (2752x2208) and GFAP 12/8 (580x580), the last three on a Zeiss Axio Zoom at 3.7 px/um; 3-5 experts each, masks
  are STAPLE estimates; n_items sums train, test and additional images. Pixel size differs per dataset (0.62 and 0.27 um), so
  voxel size is null. PV and cFOS come from the earlier DeepFLaSH data (already in the catalogue as dryad-4b8gtht9d); the
  mScarlet, YFP and GFAP sets are new in this deposit. Models, benchmark outputs and code are in the other zips and are not
  counted. Sources checked: Zenodo page and API, data.zip listing, paper full text (Europe PMC).'
