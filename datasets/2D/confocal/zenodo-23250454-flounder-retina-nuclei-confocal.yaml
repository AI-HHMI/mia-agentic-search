notes: 'Details from the Zenodo record and its README (microscope Zeiss LSM 700, 20x/1.0, 0.104 um/px, 8-bit LZW TIFF, split
  by tiled field: 32 train / 11 validation / 7 test fields) and the zip listing (50 images + 50 masks + splits.csv). The accompanying
  article is stated as submitted to Cytometry Part A and has no DOI yet, so publications is empty. The README states 50 annotated
  fields with 6,602 nuclei, while the abstract mentions 43 annotated fields with 5,436 nuclei (an earlier version). Code is
  MIT, model weights AGPL-3.0, data CC BY 4.0. The record also contains 1,049 unannotated JPEG fields (data_application_images.zip).'
