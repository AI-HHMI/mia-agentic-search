title: 'Cell-segmentation-2025: code, trained models, and annotated confocal images for CPU-only segmentation
  of nuclei in retinal wholemounts'
short_name: Flounder retina DAPI nuclei (confocal)
description: 50 manually annotated confocal fields (1024 x 1024 px, 0.104 um/px, 8-bit TIFF) of DAPI-stained
  retinal wholemounts of the dark flounder Pseudopleuronectes obscurus, with binary instance-separable
  nucleus masks (6,602 nuclei, 43-386 per field) and a train / validation / test split by scan region.
  The record also holds 1,049 unannotated application fields (JPEG), per-object measurement tables, code
  and trained models.
