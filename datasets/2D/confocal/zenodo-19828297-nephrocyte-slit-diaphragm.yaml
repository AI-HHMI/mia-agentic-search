notes: 'Zip listing and the bundled README (peek_archive): original_images (21 TIFF tiles), original_masks (63 TIFF masks), augmented variants (8 photometric types, 1,182 .tiff in total with masks), train_test_split with 189 training and 16 test samples (partly redundant with the augmented pool). Only 21 images are original; the rest are augmentations. Pixel size, microscope, objective and the paper are not stated on the Zenodo record, README or training report; the record mentions a published model but gives no DOI, so publications is empty. Mask pixel values are from the README.'
