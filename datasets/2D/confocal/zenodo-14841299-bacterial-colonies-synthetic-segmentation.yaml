notes: 'Zip listings: Processed synthetic images has 1464 TIFF files (image + _masks pairs, so about 732 pairs; the exact pairing was not checked), Real images has 30 unlabelled TIFFs (brightfield and confocal mixed), real_test_images has about 26 crops with manual masks (52 PNG + 12 TIF listed). The training images are synthetic (generated, then processed by cycleGAN), with automatically known masks; only the test crops are hand-labelled, hence source mixed. size_bytes sums those three zips; the record also holds raw synthetic images (9 MB) and trained models (200 MB). Paper (PLOS Comput Biol 2025, Europe PMC full text): Zeiss LSM780 confocal with 63x oil objective; pixel size not stated in the text read. Publication date is given only as the year 2025 on the record, so date_published is null.'
