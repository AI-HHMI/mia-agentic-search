schema_version: '1.2'
id: sr-caco2-confocal-super-resolution
title: SR-CACO-2 - paired low/high-resolution confocal images of Caco-2 cells for super-resolution
short_name: SR-CACO-2 Caco-2 super-resolution pairs (confocal)
description: Real (not synthetically downsampled) paired confocal fluorescence images of Caco-2 cells grown as 3D cysts, scanned with a Zeiss LSM700 at four resolutions (HR 1024 px; LR at /2, /4, /8) and registered, for single-image super-resolution at x2, x4 and x8. Three fluorescent markers (Survivin, E-cadherin or GFP-tubulin, mCherry-Histone H2B). 22 tiles of a 10x10 grid give 2,200 unique images and 9,937 patches per scale and marker, with a tile-level train/val/test split.
