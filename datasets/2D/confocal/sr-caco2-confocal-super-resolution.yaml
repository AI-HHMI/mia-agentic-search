notes: 'Pixel size not stated on the dataset page, GitHub README or paper (only a generic ~200 nm confocal lateral resolution), so voxel_size_nm is null; bit depth also unstated. Hosting is inconsistent: the landing page links a share on an ETS server (raw IP, certificate warning) while the paper says Google Drive; no stable direct download URL, so download_url is null. Paper reports tiles ~1.8 GB and patches ~3.4 GB; n_items = 2,200 unique images. File listing not inspected (data not downloaded), hence annotations_verified false. Paper has no DOI recorded (arXiv 2406.09168; Europe PMC / crossref lookup failed). Channels per image is 1 (one marker per image set). Manual nucleus counts exist only for a 30-image evaluation subset and are not part of the SR task.'
