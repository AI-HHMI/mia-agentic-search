short_name: Prostate Gleason masks (DRAQ5/Eosin confocal)
description: Two-channel (DRAQ5 nuclear and Eosin) confocal fluorescence images of formalin-fixed prostate tissue
  microarray cores and slide cores, in Zeiss CZI format, with Gleason-pattern annotations drawn by expert pathologists
  (background, healthy, Gleason 3, Gleason 4, cribriform, glomeruloid, Gleason 5) stored as CZI annotation masks.
  Includes a standardization subset imaged under varying focus, averaging, zoom and lens settings.
