notes: 'Read the Kaggle API record (CC BY 4.0, 136.5 GB), the authors'' GitHub README and the PLOS ONE paper (Methods, Data
  availability). The Kaggle file listing needs login, so file layout, image count and annotation files were not seen:
  n_items null, annotations_verified false. Zeiss LSM 880 confocal. Pixel size is not one value (about 0.69 and 0.52 um/px
  for the TMAs; 0.69, 0.52 and 0.35 um in the standardization subset), so voxel_size_nm is null. Not every core is annotated;
  some annotations were drawn on synthetic H&E made from the images or on sequential H&E slides.'
