    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 106
    - 4095
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Mosaic of 1024x1024 tiles (M=4 in the sample, 16-25 in Commercial TMAs). 12-bit data (ComponentBitCount
      12) in uint16. Channel order differs between files (DRAQ5/Eosin Y or Eosin Y/DRAQ5): read the CZI channel Fluor names.'
  - role: raw
    path_pattern: DRAQ5_Eosin_Images/WCB Tissue Slide Cores/D_and_E WCB CORE/*/*.czi
    format: czi
    axes: cyx
    shape:
    - 2
    - 1024
    - 1024
    shape_varies: true
    dtype: uint16
    compression: unknown
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Standardization acquisitions of slide cores (lens, zoom, averaging, focus) per microscopy_configurations.txt;
      shape is one tile from the header (M=25 to 616 tiles); *_focus files add z (SizeZ 5, 2.5 um). Not annotated.
  - role: label
    path_pattern: DRAQ5_Eosin_Images/*/*Annotat*/*.czi
    format: czi
    axes: cyx
    shape:
    - 2
    - 2046
    - 2046
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 106
    - 4095
    encoding: polygons
    classes:
    - id: 0
      name: background
    - id: 1
      name: healthy
    - id: 2
      name: Gleason 3
    - id: 3
      name: Gleason 4
    - id: 4
      name: cribriform
    - id: 5
      name: glomeruloid
    - id: 6
      name: Gleason 5
    alignment: same-grid
    alignment_notes: 'Each annotated CZI is an image plus vector shapes (Bezier/Polygon) in its metadata XML; the shapes are
      in that file''s pixel coordinates. Stroke colour -> class (Retrieve_masks.ipynb): #FF0000FF healthy, #FF00FF00 Gleason
      3, #FFFF6600 Gleason 4, #FFCC4E00 cribriform, #FFFF00FF glomeruloid, #FF990000 Gleason 5. Pairing: WCB_Sequential/<core>.czi
      <-> WCB_Sequential_Annotated/<core>_Seq_Annotated.czi (sample: identical pixels, per-channel min/max/mean match). Commercial
      TMAs: Image_data/A02_TMA_x20_0.6zmtile.czi <-> Synthetic_H_and_E_Annotations/A02_Annotated.czi (CA4_I83_TMA_10 <-> CA4_10_Annotated);
      those annotated files hold a 3-channel synthetic H&E at the same pixel size (4094x4094 for A02, matching 4x4 tiles of
      1024 with 2 px overlap). Slide cores: D_and_E Annotated/SampleN.czi holds its own D&E image (8192x9215 for Sample2).
      Shapes must be rasterized; the image channels are not label ids.'
  notes: 'Listing from the Kaggle file-list API (www.kaggle.com/api/v1/datasets/list/…, paginated): 473 files summing to 136,517,990,163
    bytes, exactly the Kaggle-stated total (listing.py cannot list Kaggle, so size_source page-stated). Sample: UB_H15_A2
    pair (33.9 MB) decoded with a stdlib/numpy CZI subblock reader (uncompressed Gray16 subblocks, no pyramid); value_range
    from that one sample; channel 0 (Eosin Y) saturates at 4095, so normalization unknown. Headers (metadata XML via range
    requests, 0.96 MB) of 7 more files across all subfolders gave the pixel sizes and the shapes per annotated file. Voxel
    size not one value across subsets (see notes); a per-subset value would let each subset be converted. Direct links: Kaggle
    per-file and bundle URLs redirect to signed storage.googleapis.com URLs (range requests OK; 92.9 GB zip bundle); host
    www.kaggle.com is not on the TensorSwitch allowlist. TensorSwitch would convert the annotated CZIs as images: the labels
    are vector shapes that need rasterizing first.'
