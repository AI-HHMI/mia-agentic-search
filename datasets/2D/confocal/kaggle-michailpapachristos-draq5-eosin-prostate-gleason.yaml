notes: 'Read the Kaggle API record (CC BY 4.0), the authors'' GitHub README and the PLOS ONE paper (Methods, Data availability).
  Zeiss LSM 880 confocal. Pixel size differs by subset (CZI headers: 691.9 nm TMA A, 518.9 nm TMA B / WCB TMA / slide cores,
  1383.8 nm and 0.35-0.69 um in the standardization subset), so voxel_size_nm is null. Not every core is annotated (46/49
  TMA A, 78/103 WCB TMA); TMA annotations were drawn on synthetic H&E, WCB ones transferred from sequential H&E slides. enricher:
  n_items 472 CZI files (290 images, 182 annotated) from the Kaggle file list (was null); annotations verified in CZI metadata;
  download_url now the direct Kaggle bundle (was landing page). Standardisation *_focus files are 5-plane z-stacks (2.5 um
  step).'
