notes: 'Annotation-only BioImage Archive study; raw images are in S-BIAD144 (223 CZI files). No license field appears
  on S-BIAD916 or S-BIAD144 (the paper itself is CC-BY 4.0, which is not a dataset license). The page text says only
  10 of 223 images were annotated, but the annotation file list has 20 mask/image pairs (18 experimentA, 2 experimentB);
  the list was used. Dimensionality is recorded as 2D from the single-channel mask use but z-stack structure of the
  CZI files was not inspected, and pixel size, microscope and objective are not stated on either page or in the paper
  text read. Masks are Cellpose cyto2 output curated by a scientist (error removal).'
