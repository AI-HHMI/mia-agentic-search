schema_version: '1.2'
id: github-fmd-fluorescence-microscopy-denoising
title: Fluorescence Microscopy Denoising (FMD) dataset
short_name: FMD paired noisy/clean fluorescence denoising
description: 'Real fluorescence microscopy denoising benchmark: 12 imaging configurations (confocal, two-photon
  and widefield microscopy of fixed BPAE cells stained for nuclei, F-actin and mitochondria, fixed zebrafish
  embryos and fixed mouse brain tissue). Each configuration has 20 fields of view, each imaged 50 times
  at low excitation power; the average of the 50 captures is the ground truth, and averages of 2/4/8/16
  captures give additional noise levels (240 ground-truth images, 12,000 raw and 60,000 noisy images in
  total). A held-out test set (test_mix) is provided.'
