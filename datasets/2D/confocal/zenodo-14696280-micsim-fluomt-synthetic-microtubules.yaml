notes: 'Synthetic (simulated) images, not real microscopy; included because they have exact ground truth
  and are released for training segmentation models. Zenodo files dataset_easy.zip and dataset_hard.zip,
  1,192 noisy/binary TIFF pairs each; the binaries are byte-identical between easy and hard (checked every
  50th). Paper: 953 train / 119 validation / 120 test images, but no split file is deposited (splits_provided
  false). Pixel size and train split membership not stated on the Zenodo page or in the paper main text
  (Supplemental Material 1A not read). n_items = 2 x 1,192 images. The real-image counterpart (MicReal_FluoMT,
  zenodo 15852660) is a separate record. enricher: channels 1 (was null), size_bytes exact from Zenodo
  API (was 223 MB rounded).'
