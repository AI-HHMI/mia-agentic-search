title: 'MicSim_FluoMT: synthetic confocal-like images of fluorescent microtubules with binary masks'
short_name: Synthetic microtubule segmentation (confocal-like)
description: Two synthetic datasets (easy and hard) of 1,192 noisy confocal-like fluorescence images each,
  mimicking the astral microtubule network of C. elegans zygotes (simulated with Cytosim, rendered with
  ConfocalGN), with matching binary ground-truth microtubule masks. In the hard set fluorescence fades
  toward microtubule ends; both share the same ground truth. Built to train and benchmark microtubule
  segmentation networks.
