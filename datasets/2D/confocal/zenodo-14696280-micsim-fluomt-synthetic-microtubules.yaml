notes: 'Synthetic (simulated) images, not real microscopy; included because they have exact ground truth and are
  released for training segmentation models. Zenodo files dataset_easy.zip (112.8 MB) and dataset_hard.zip (110.2
  MB). peek_archive of dataset_easy.zip (via record 14696280): 1,192 report_NNNN.noisy.tiff + 1,192 report_NNNN.binary.tiff
  (~0.45 MB each); dataset_hard.zip was not listed (page says same ground truth, same count). Pixel size, image
  dimensions and train/val/test split are not stated on the Zenodo page or in the paper text read (Supplemental
  Material 1A not read). n_items = 2 x 1,192 images. The real-image counterpart (MicReal_FluoMT, zenodo 15852660)
  is a separate record in the catalog.'
