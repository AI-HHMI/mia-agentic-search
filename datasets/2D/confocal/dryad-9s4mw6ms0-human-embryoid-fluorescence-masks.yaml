notes: 'Dryad lists one data file, preprocessed_dataset.zip (938.6 MB), plus a README; downloads need
  a token, so the zip could not be listed and the file format is unknown (formats: other = unknown). Paper:
  3,697 images of 288x288 px after centring/cropping, 4 channels, Olympus IX81 fluorescence microscope
  at 20x (the Fig. 2 legend says confocal microscopy, so modality is confocal). Tissue/cavity masks were
  drawn manually on 2,219 DAPI images, single-cell masks on 1,000 images; masks for the rest are transformer-CNN
  predictions (hence source mixed). Pixel size not stated in the paper, Dryad page or code README. Dryad
  license CC0-1.0; the code repo is MIT.'
