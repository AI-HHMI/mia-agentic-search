id: dryad-9s4mw6ms0-human-embryoid-fluorescence-masks
title: Human stem cell-based embryoid fluorescence images (DAPI, GATA3, NANOG, T) with tissue, cavity
  and single-cell masks
short_name: Human embryoid tissue/cell masks (fluorescence)
description: 3,697 four-channel (DAPI, GATA3, NANOG, T) fluorescence images of human stem cell-based post-implantation
  embryoids, one centred embryoid per 288x288 image, grouped by initial seeding density (795 / 1,424 /
  1,478 images) and imaged at nine culture time points, with masks for embryoid tissue and fluid-filled
  cavity and for single cells. Part of the masks were drawn manually (VIA) and the rest predicted by a
  transformer-CNN.
