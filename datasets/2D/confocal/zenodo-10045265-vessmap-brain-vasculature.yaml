notes: 'Zip listing: 342 files (100 .tiff images, 240 .png masks/skeletons, 2 .json). Pixel size, microscope,
  objective, mouse strain and staining are not stated on the Zenodo page or in the arXiv paper text (arXiv
  HTML read; Europe PMC has no copy), so voxel_size_nm is null. The 100 images are 256x256 windows cropped
  from a collection of 2637 confocal images (1376x1104 to 2499x2005 px). The paper says the 100 were chosen
  by feature-space sampling (not at random) and that 20 were labeled by two annotators; annotator identities
  and tool are not stated. The paper estimates roughly 12 hours of annotation per image.'
