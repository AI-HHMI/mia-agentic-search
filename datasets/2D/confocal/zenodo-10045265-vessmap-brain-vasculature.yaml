id: zenodo-10045265-vessmap-brain-vasculature
title: VessMAP - Feature-Mapped Cortex Vasculature Dataset
short_name: VessMAP mouse brain vessel segmentation (confocal)
description: 100 confocal microscopy images (256x256, 8-bit, single channel) of mouse brain vasculature with manual
  binary blood-vessel masks and skeletons from one annotator, plus a second annotator's masks for 20 of the
  images. The images were picked from 2637 unannotated images to span the range of vessel density, contrast,
  noise and skeleton heterogeneity, so the set is meant for testing segmentation under distribution shift.
