title: 'Fluorescence Microscopy Denoising (FMD) dataset: A Poisson-Gaussian Denoising Dataset with Real Fluorescence Microscopy
  Images'
short_name: FMD fluorescence denoising pairs (confocal)
description: 'Real fluorescence microscopy images for training and benchmarking denoising: 240 fields of view (20 per imaging
  configuration, 12 configurations) of fixed BPAE cells, mouse brain tissue and zebrafish embryos, imaged by confocal, two-photon
  and wide-field microscopy. Each FOV has 50 repeated captures; averaging them gives a ground-truth image, and averaging fewer
  captures gives noisy images at five noise levels (raw, avg2, avg4, avg8, avg16).'
