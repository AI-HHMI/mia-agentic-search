notes: 'Hosted on a Google Drive folder (tar archives per configuration: Confocal_BPAE_B/G/R, Confocal_FISH, Confocal_MICE,
  TwoPhoton_BPAE_B/G/R, TwoPhoton_MICE, WideField_BPAE_B/G/R, test_mix), linked from the GitHub README. No license for the
  data is stated (README MIT covers code only) on the repo, paper or Drive listing. Pixel size is 300 nm (confocal, two-photon)
  and 170 nm (wide-field) per the paper, so voxel_size_nm stays null (differs by subset). File format PNG inferred from the
  benchmark data_loader (IMG_EXTENSIONS = [.png]); tar contents were not listed, and total size is not stated. The paper (CVPR
  2019) full text was read via arXiv/ar5iv; no DOI found. The 12,000 raw images are 240 FOVs x 50 captures; 60,000 noisy images
  are derived by averaging. Annotation-style pairs not verified in a file listing. Test split: 19th FOV of each configuration,
  plus test_mix.'
