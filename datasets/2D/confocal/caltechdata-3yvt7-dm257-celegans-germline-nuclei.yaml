notes: 'Zip listed via range requests: training/trainingData has 120 TIFF images and PNG masks, split 108 train / 12 test per the paper (the split is described in the paper and TrainDataFiles.csv, not by folders). Images are 70 xy, 26 xz and 24 yz slices cropped from z-stacks, so these are 2D views of 3D data. Microscopes: Zeiss AiryScan 880/980, Olympus spinning disk (50 um or SoRa disk), GE DeltaVision Elite; the first modality listed is an approximation. Voxel size: paper states all data rescaled to 0.117 um/pixel (original sizes not reported). CaltechDATA lists the record as Software with BSD-3-Clause; the paper itself is CC BY. Data also on GitHub (KoehlerLab/Cellpose_germlineNuclei), not read here.'
