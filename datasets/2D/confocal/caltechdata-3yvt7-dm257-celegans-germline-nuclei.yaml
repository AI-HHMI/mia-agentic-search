notes: 'Zip has training/trainingData with 120 TIFF images and 120 PNG masks, plus code and the Cellpose model weights.
  Images are 70 xy, 26 xz and 24 yz slices cropped from z-stacks (2D views of 3D data). Microscopes: Zeiss AiryScan
  880/980, Olympus spinning disk, GE DeltaVision Elite; first modality is an approximation. The 108/12 train/test
  split is made in the training notebook (train_test_split, random_state=666), not shipped as a file list. License:
  CaltechDATA record and the zip''s LICENSE file are BSD-3-Clause (record typed Software); the paper is CC BY. enricher:
  voxel size set to null (was 117x117): the files keep native pixel sizes that differ per file (TrainDataFiles.csv
  xScale/yScale, um; e.g. 35.4, 33.9, 35.3, 64.6, 65, 108.3 nm for xy views; xz/yz views anisotropic, e.g. 5.08
  x 33.9 nm); the 0.117 um/px of the paper is applied by the notebook at training time. enricher: formats + png
  (masks); splits_provided false.'
