notes: 'Masks exist only for the dHL-60 crops: 42 mask TIFFs (dhl60/compact 20, dhl60/decompact 20, 2
  top-level 100x100 crops); the NETosis live movies (99 GB) and U2OS mitosis stacks (21 GB) have no masks.
  Masks: mode-based intensity thresholding of the DNA channel, objects < 100 px excluded, then "visually
  inspected and manually corrected" (source mixed). Preprint not open access; abstract only. enricher:
  voxel size set to null (was 220x220): subsets differ. Crops 97.79 nm in the TIFF headers, matching the
  study''s laser-scanning value (Zeiss LSM 900, "pixel size 0.098 µm", Fig. 1A / Supp. Fig. 1); live-cell
  spinning disk "pixel size 0.22 µm" (headers 216.67 nm, z step 3 µm). enricher: modality confocal first
  (the masked crops are LSM 900 images), spinning-disk for the movies and U2OS stacks. enricher: size
  from the two file lists; channels 1 for the crops.'
