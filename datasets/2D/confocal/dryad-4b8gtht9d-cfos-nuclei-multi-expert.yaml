id: dryad-4b8gtht9d-cfos-nuclei-multi-expert
title: Multi-expert annotated cFOS/PV/NeuN fluorescence images with consensus ground truth (DeepFLaSH, eLife 2020)
short_name: cFOS nuclei multi-expert masks (confocal)
description: 'Data from Segebarth et al. 2020 on objectivity of deep-learning bioimage analysis. train_data holds
  five lab datasets (lab-wue1, lab-mue, lab-inns1, lab-inns2, lab-wue2). For lab-wue1 the training set has 36
  images (a 9-image test set is in test_data.zip) of cFOS-positive nuclei in mouse brain sections, each with manual
  segmentations from five independent experts (expert_1..expert_5) plus a STAPLE consensus ground truth (est_GT).
  The other labs add 5 expert-annotated images each. bioimage_data.zip holds the full raw microscopy images of
  lab-wue1 (283 images) and lab-mue (24 images), with model predictions.'
