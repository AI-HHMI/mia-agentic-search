notes: 'Read the figshare record, listed BPAEC.zip with peek_archive (220 TIFFs = 110 WF/GT pairs, all
  F-actin, 33.7 MB) and the GitHub README (5-fold fine-tuning on BPAEC; code MIT). The paper (Optics Express)
  is not open access, so only the abstract was read: it calls BPAEC a confocal microscopy image dataset
  for cross-modality generalizability. Not stated anywhere I could read: the cell type behind the name,
  the pixel size, how GT was produced, bit depth, and what WF means exactly. Modality confocal follows
  the dataset title. An earlier Zenodo deposit (10.5281/zenodo.18168163) was deleted as a test record,
  so figshare is the host. The second figshare file (pre_trained_state_upload.zip, 1.8 GB) holds model
  checkpoints, not data; size_bytes counts only BPAEC.zip.'
