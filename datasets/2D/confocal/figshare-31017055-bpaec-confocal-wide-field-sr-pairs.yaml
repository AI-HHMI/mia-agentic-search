description: 110 paired wide-field (WF) and ground-truth (GT) TIFF images of F-actin, each in its own
  Cell_NNN folder, released with the WSPN super-resolution network paper as a benchmark for cross-modality
  generalizability and 5-fold fine-tuning. The figshare record also carries the pre-trained model checkpoints
  used in the paper.
