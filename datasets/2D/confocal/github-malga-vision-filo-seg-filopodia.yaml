notes: 'The paper (open access, full text read: Filo-SEG section) states 245 images (200 training, 45
  test), Zeiss LSM 710 confocal with a 63x dipping or Plan Apochromat oil objective, and masks traced
  with a 4-pixel Photoshop brush. The repo dataset/ folder has images/ (TIFFs, numbered), masks/, split_data/,
  extraTest/, biologicallyRelevantData/, FiloCountAnnotation.csv and test_set_indices.xlsx; enricher:
  git tree lists 245 images + 245 masks (binary uint8 TIFF), annotations_verified true. No license or
  terms of use were found in the README, repo page or paper, so license is unknown. Pixel size is not
  stated in the paper text. Which species/cell line belongs to which image was not seen; species are inferred
  from the cell-line and embryo names in the paper. The paper says no other open filopodia dataset exists.'
