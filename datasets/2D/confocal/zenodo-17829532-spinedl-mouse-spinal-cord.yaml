title: 'SpineDL dataset: Spinal Cord Cross-Sections from C57BL/6J Mice'
short_name: Mouse spinal cord neurons and regions (confocal)
description: NeuN/DAPI immunofluorescence images of uninjured and contused mouse thoracic spinal cord
  cross-sections, with manual annotations for two tasks - semantic segmentation of spinal cord structures
  (background, white matter, ependyma, gray matter, lesioned tissue) and instance segmentation of neuronal
  somas - in train, validation and test folders. Test images carry several independent expert annotation
  sessions.
