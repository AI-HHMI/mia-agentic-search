notes: 'Two zips (peek_archive): Neuron_identification.zip 224 files (174 TIFF, 50 XML), Structure_identification.zip
  202 TIFF, plus Image Information.xlsx; size_bytes is the sum of the uncompressed zip sizes (~2.75 GB).
  Paper: 161 images (49 from an autophagy study, 112 from ucf-101), 10 test images. Structure task has
  82 annotated images (75 train, 7 val); test images have 5 annotation sessions. Zenodo says "2D widefield"
  but the paper says Leica confocal, so confocal. Pixel size conflicts: Zenodo states 1.12-2.25 um, paper
  0.445-0.891 um/px for raw acquisitions, so left null. download_url is the structure zip; neuron zip
  is at the same record.'
