notes: 'No paper or docs linked; class definitions and annotation procedure not stated. Label lists map each image path (author
  Windows path) to a class index; index-to-condition table not found, class meaning only from folder names. SIM.zip also holds
  an identical copy of Confocal/. trained_models.zip = 5 .pt weights. organisms: Homo sapiens = SHSY5Y.zip; Chlorocebus sabaeus
  = COS7.zip, Confocal.zip (author paths .../COS7/Confocal/); SIM.zip cell line not stated. modality: Confocal.zip confocal;
  SIM.zip structured illumination (fairSIM); COS7/SHSY5Y acquisition not stated. voxel size differs by subset (null): Confocal
  100 nm (settings note in zip); fairSIM 53.75 nm, COS7 Cold/RT 107.521 nm, COS7 masks 65 nm (TIFF headers). enricher: size_bytes
  from Zenodo file listing incl. weights (was 4.02 GB, image zips only); COS7 instance masks added as label array.'
