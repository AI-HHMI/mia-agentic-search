notes: 'Record published 2026-11-11; description is one line and no paper or DOI is linked (searched the web for MitoDecode; nothing found), so voxel size, microscope settings, class definitions and annotation
  procedure are not stated. Zip listings (peek_archive): SHSY5Y.zip 2499 tif; Confocal.zip 259 tif; SIM.zip 259 tif plus 84 .cxd raw and 346 fairSIM-reconstructed tif; COS7.zip 942 tif; trained_models.zip
  (1.3 GB, weights) not counted in size. Label lists map each image path (author local Windows path) to an integer class index (e.g. 0 control, 4 heat shock repeat) but the index-to-condition table was
  not found, so class meaning is inferred from folder names only. SIM.zip appears to contain the same 259 images as Confocal.zip. Modality COS-7 images not confirmed as confocal. Size is the sum of the
  four image zips.'
