notes: 'Only TRAINING.tar (28 MB, 7445 labelled 64x64 ROIs) is the training set; Examples.tar (3.4 GB) holds unlabelled example images per
  stimulus and Single images.tar a few full images. size_bytes is TRAINING.tar only. The paper states a 20x objective
  (NA 0.75) on an ImageXpress Micro Confocal with 9-plane max projections, but no pixel size, so voxel size is null. The
  training set was composed by hand from 6 experiments with different HUVEC donors; the five classes are given by
  folder names in the archive (listed by streaming the tar). Sources checked: Zenodo API record, README, training script,
  tar listing, paper full text (Europe PMC).'
