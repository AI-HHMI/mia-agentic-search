notes: 'Six image zips (Nucleus 157 tif, Ppalmivora 126 tif, Arabidopsis_Hpa 30 tif, plus 3 more zips),
  each with one COCO JSON per annotated image (checked Arabidopsis_Hpa-001.json: polygons, bbox, category_id).
  Also hf_classes/hf_instructions JSON and pre-trained weights (HFinder_pre-trained.zip). Paper: 580 single-plane
  and Z-stack confocal images with 2-5 channels, 10,854 chloroplasts, 1,323 haustoria, 2,783 hyphae and
  498 nuclei; haustoria manually annotated, other classes semi-supervised (thresholding plus manual curation).
  README says 62 images were removed as unpublished, so the Zenodo set is smaller than the paper. Zeiss
  LSM 880 and Leica SP8 confocals. Image dimensionality is 2D (single-plane and Z-stack mix not resolved).
  No train/test split provided. size_bytes is the sum of all files in the Zenodo API listing (includes
  weights). enricher: 542 TIFFs + 390 COCO JSONs in the 6 image zips (n_items was null); one header gives
  171.4 nm/px.'
