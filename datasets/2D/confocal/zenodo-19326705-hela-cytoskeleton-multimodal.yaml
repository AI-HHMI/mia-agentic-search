notes: 'peek_archive of mmd_dataset.zip (3,183 members): 2,268 nd2 in hela/nocodazole/taxol/rac1_inhibitor/y27632/metadata, 906 tif in
  hela_annotations/ (nucleus, actin; apparently untreated hela only), 2 csv. Pixel size 0.109 um (60x oil) is from
  the paper (measured with a USAF target; Methods also state 0.108 um/pixel, ND2/TIFF headers 0.10833 um). Z-stacks are on Harvard Dataverse (10.7910/DVN/8ONQQG), not in this record. Meaning of the actin masks
  and the annotation procedure not confirmed. Dataset CC BY 4.0 per Zenodo; the article itself is CC BY-NC-ND.
  enricher: size 35,257,460,307 B from the Zenodo file listing (was 36,970,168,320); annotations.format from probed masks.
  coverage: only the 453 untreated hela/ images have masks; nocodazole/taxol/rac1_inhibitor/y27632 (450 each) are
  unlabelled apart from their treatment folder.'
