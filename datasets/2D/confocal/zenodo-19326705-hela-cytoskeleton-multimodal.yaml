id: zenodo-19326705-hela-cytoskeleton-multimodal
title: Multimodal optical microscopy dataset of HeLa cells for cytoskeletal organization (brightfield, RICM, widefield, TIRF, confocal)
short_name: HeLa cytoskeleton multimodal masks (confocal/TIRF)
description: 2,253 paired 1024x1024 11-channel images of fixed HeLa cells (Nikon Ti2, 60x oil objective) acquired
  with brightfield, reflection interference contrast (RICM), widefield, TIRF and spinning-disk confocal channels,
  with actin, microtubule, focal adhesion and nuclear labelling; control cells and cells treated with nocodazole,
  taxol, Rac1 inhibitor or Y-27632 (ROCK inhibitor). Annotated masks for cell nuclei and cell footprint (hela_annotations/,
  about 453 each) are provided. A companion Harvard Dataverse deposit holds 453 confocal z-stacks with deconvolved versions.
