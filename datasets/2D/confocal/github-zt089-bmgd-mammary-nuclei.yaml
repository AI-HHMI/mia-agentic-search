notes: 'Repository holds four 7z archives (250/950/1200/1800 Pa) and a README claiming masks for all 819 images; archives could not be listed (7z, downloads 403 via proxy), so contents and formats are unverified (formats other; preprint says source images are .lsm). No license in README, repo page or preprint. Preprint: 256 x 256 px patches, 12-bit, voxel 0.25 x 0.25 x 1 um (z null, 2D patches), masks from Labkit random-forest pre-masks manually verified, split 655/82/82, stiffness counts 453/54/114/198. Species not stated (only mammary epithelial cell cultures), so organism left empty. Authors not listed in the HTML read.'
