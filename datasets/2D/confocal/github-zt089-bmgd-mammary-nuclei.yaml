  notes: 'Downloaded 950 Pa.7z (1,596,373 B; 111 entries: 54 image + 54 mask TIFFs) and read every TIFF
    with tifffile. Images: single-page uint16, uncompressed, no calibration, shapes 189x200 or 220x231,
    values 0-4095 over all 54 (12-bit, as the preprint says; "original 12-bit dynamic range", hence normalization
    none). Masks: uint8 {0,255}, ImageJ files with default 1 px = 1 um calibration (ignored). The other
    three 7z archives were not downloaded (7z needs the whole file to list), so their contents and the
    labeled masks are unverified; the listing of the five repository files is complete and exact. Voxel
    size 250 nm from the preprint Methods; the files carry none. No single archive: download_url stays
    null, the four 7z files are direct raw.githubusercontent.com links.'
