notes: 'Repository holds four 7z archives (250/950/1200/1800 Pa) and a README. No license in README, repo
  tree (no LICENSE file) or preprint. Preprint: 12-bit patches "standardized to 256 x 256", voxel 0.25
  x 0.25 x 1 um (z null, 2D patches), masks from Labkit random-forest pre-masks manually verified, split
  655/82/82, stiffness counts 453/54/114/198. Species not stated (only mammary epithelial cell cultures),
  so organism left empty. Authors not listed in the HTML read. enricher: formats tiff (was other): 950
  Pa.7z holds image/ and mask/ TIFFs. annotations_verified true. size 40,454,989 B from the listing of
  the four 7z files + README. enricher: sampled patches are 189x200 and 220x231 px, not 256x256 as the
  preprint says; 950 Pa has only binary masks, the labeled (instance) masks the preprint mentions were
  not seen.'
