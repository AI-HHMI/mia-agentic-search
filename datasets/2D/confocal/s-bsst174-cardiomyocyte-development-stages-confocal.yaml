notes: 'Three zips (125.9 MB): T-XXX-A (90 PNG, 35.8 MB), E-XXX-A (46 PNG, 20.0 MB) and T-XXX-B (70.0 MB, not listed) with
  class sub-folders named 0 to 5 (peek_archive), create_dataset.py and info.txt. n_items=136 counts the T-XXX-A and E-XXX-A PNGs
  only. Paper: the expert assigned live, healthy myocytes to 5 development stages; class 0 holds the remaining images (low quality
  or not usable). No license on the BioStudies page (the paper is CC BY 4.0), so license is unknown.
  Pixel size is 58 to 116 nm per px per the paper Methods, varying per image, so voxel_size_nm is null; source images are 1024
  x 1024. Species is not stated in the Methods read (the introduction refers to rat hearts), so organism is left empty.
  Classification only, no masks.'
