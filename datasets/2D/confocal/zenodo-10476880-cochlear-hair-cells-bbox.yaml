  notes: 'Complete Zenodo listing with zip members expanded (one zip, exact size). Probed Bird/003 TIFF (ImageJ,
    4x918x682 uint16, cyx, header 182.3 nm/px vs TXT "180nm"), Liberman/Human/065 TIFF (plain RGB 964x1605x3 uint8,
    LZW), Liberman/Rat/001 PNG (512x1024x3 uint8). Sampled Rat/001 PNG (0..255, mean 6.9, samples not identical)
    and Bird/003 TIFF (99..29671); value ranges from single samples. Read Rat/001 XML (one IHC box) and TXT files
    of Rat/001 and Bird/003: each TXT states Pixel Size (nm), channels/stains, objective, microscope, species, image
    shape and bit depth. Voxel size varies per image (TXT), so imaging.voxel_size_nm stays null; a converter would
    need the per-file TXT value. The zip is a direct download (download-check usable, range requests); members work
    as zip::member specs.'
