title: 'Large-scale annotated dataset for cochlear hair cell detection and classification: 645 fluorescence images
  with inner/outer hair cell bounding boxes (Zenodo)'
short_name: Cochlear hair cell detection boxes (fluorescence)
description: 645 maximum-intensity-projection fluorescence images of cochlear whole mounts (confocal, spinning disk,
  Airyscan/SIM and epifluorescence) from over 20 hearing-research labs, covering mouse, rat, guinea pig, pig, primate
  and human tissue, with more than 107,000 hair cells annotated as inner (IHC) or outer (OHC) hair cells as Pascal
  VOC bounding boxes. Includes normal and drug-treated (aminoglycoside, platinum) cochleae; each image has an XML
  box file and a TXT metadata file.
