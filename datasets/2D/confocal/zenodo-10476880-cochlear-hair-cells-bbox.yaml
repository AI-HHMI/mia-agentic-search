notes: 'Zip index: 571 TIFF + 65 PNG, 645 XML + 645 TXT (Stepanyan/ and Landegger/ have 9 XML/TXT without an image).
  Annotation: network candidates corrected by 2+ annotators (mixed). No split; GitHub README states no license.
  Pixel size is per image in its TXT (e.g. 70 nm Liberman rat, 180 nm Bird), so voxel_size_nm stays null. organisms:
  Mus musculus = Confocal/{Ballesteros,Bird,Cunningham,Edge,Genedeva,Indzhykulian,Manor,Ricci,Rutherford,Shrestha,Stepanyan,Tarchini,Velez,Zhao}/
  + Epifluorescence/Richardson-and-Kros/; Rattus norvegicus = Confocal/Liberman/Rat/; Macaca mulatta = Confocal/Liberman/Primate/;
  Homo sapiens = Confocal/Liberman/Human/; Sus scrofa = Confocal/Landegger/; Cavia porcellus = Confocal/Walters/
  (from file names and TXT Species). modality: widefield = Epifluorescence/; spinning-disk = Manor/Spinning Disk/
  and Bird/ (TXT); rest confocal/Airyscan. enricher: channels null (was 2): TXT files give 2-4 channels per image.'
