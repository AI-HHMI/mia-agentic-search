notes: 'Five zips (listing.py, complete): 309 TIFFs, 1.32 GB, split into 10 class folders. Page states 2048 x 2048 16-bit images with 0.03 um oversampled pixels deconvolved (Landweber) to about 150 nm resolution; the page does not say if the saved pixel size is 30 nm, so voxel_size_nm is left null. The paper (Methods, Data availability) names CAD cells (mouse-derived line per the BBBC title Murine) and says the data are also deposited at Zenodo 10.5281/zenodo.5486202, which was not opened. The meaning of ap4/fp4 folder names is not documented. Related set BBBC053 (FCCP mitochondria) is a separate dataset not included here. NC license restricts commercial use.'
