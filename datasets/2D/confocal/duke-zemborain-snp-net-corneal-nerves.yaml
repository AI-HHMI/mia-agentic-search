title: Annotated corneal confocal microscopy dataset of the subbasal nerve plexus (SNP-Net)
short_name: Corneal nerve/neuroma/immune cell seg (confocal)
description: Corneal confocal microscopy (HRT3 Rostock Cornea Module, 384x384 px, 1.04 um/pixel) images
  of the subbasal nerve plexus. Per the paper, 207 SNP images from 43 ocular-surface-disease patients
  were manually segmented into nerve, neuroma and immune cell classes, and 470 images per layer (epithelium,
  SNP, stroma) from 73 individuals were labelled by corneal layer for an artifact-removal network. The
  authors released the annotated dataset with their code.
