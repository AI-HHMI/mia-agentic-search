notes: 'Terms on the dataset page: "copyrighted and may only be used for academic research; cite the paper" (the GitHub code repo is CC0-1.0, the data is not). Hosted as a Duke Box share whose file listing could not be read (JavaScript page), so file formats, file counts and total size are unverified; formats is other for that reason, and the released subset size is not stated (paper: 207 SNP images with nerve/neuroma/immune-cell masks, 470 images per layer for layer classification). Pixel size 1.04 um from the paper Methods; field of view not stated. The paper full text was read via the PMC page, not tools/paper.py (not open access in Europe PMC).'
