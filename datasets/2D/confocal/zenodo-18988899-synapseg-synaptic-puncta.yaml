title: SynAPSeg Datasets
short_name: Synaptic puncta instance masks (confocal)
description: Training and benchmark data of SynAPSeg - 41 Zeiss LSM980 confocal images (27 2D and 14 3D)
  of synaptic markers (mostly PSD95) in mouse brain tissue and transfected cultures, with manually annotated
  puncta instance labels (dense or ROI-restricted), pre-built 2D/3D training and validation patch stacks,
  and three multi-rater benchmark images each with several expert annotations. Trained StarDist and Cellpose
  models are in the same record.
