notes: 'Zenodo record has TrainingDatasets.zip (694 MB; 188 files: 41 image folders with image.tiff, labels.tiff,
  ROIs.tiff, metadata.yaml; 2D/3D patch stacks), BenchmarkDatasets.zip (0.7 MB; 3 images with multi-rater
  labels) and two model zips. size_bytes is the exact listing total of all four zips, models included.
  2D is the majority (27 of 41 images), 3D volumes also included. Pixel size varies per sub-dataset (one
  metadata.yaml: 0.071 um YX, 0.3 um Z), so null. Puncta counts differ in the paper (over 4300 2D and
  1200 3D in the intro, 2400 and 1200 in Methods). Annotation is dense for some images and ROI-restricted
  for others, so coverage is partial. Organism for the transfected cultures not checked. enricher: size
  from the complete listing; 2D and 3D pairs sampled.'
