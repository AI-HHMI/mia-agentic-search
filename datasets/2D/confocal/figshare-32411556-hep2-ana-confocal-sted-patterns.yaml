title: Confocal and STED immunofluorescence images of HEp-2 cells with ANA pattern class labels
short_name: HEp-2 ANA patterns (confocal and STED)
description: Confocal and stimulated emission depletion (STED) microscopy images of antinuclear antibody
  (ANA) indirect immunofluorescence patterns on HEp-2 cells, sorted into class folders AC1, AC2, AC3,
  AC4, AC5 and AC8 (International Consensus on Antinuclear Antibody Patterns codes) for machine-learning
  pattern classification. Two zips - CROPPED (5,827 PNG crops) and NON-CROPPED (4,877 PNG images) - each
  with parallel CONFOCAL and STED trees.
