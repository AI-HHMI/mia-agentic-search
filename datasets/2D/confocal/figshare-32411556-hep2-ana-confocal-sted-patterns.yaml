notes: 'Read the figshare record and listed both zips with peek_archive: CROPPED.zip has 5,827 PNGs (CONFOCAL
  2,920 and STED 2,907 across six class folders), NON-CROPPED.zip has 4,877 PNGs; the item count is the
  sum of PNGs. The paper (comparing confocal and STED for ANA pattern recognition) could not be found,
  so microscope, pixel size, who assigned the labels (ICAP expert reading vs. other) and any train/test
  split are unverified; labels are image-level classes, with no masks or boxes. Whether the cropped images
  are derived from the non-cropped ones is not stated. The class folders are named AC1 to AC8 without
  gaps listed (AC6 and AC7 absent).'
