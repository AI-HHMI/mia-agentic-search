notes: 'Single 301 MB zip listed with peek_archive: 5,327 PNGs in Dataset/<sample>_<Bainite|Martensite>_<n>/ folders plus
  Dataset_Patches_Microscope_Metadata.xlsx. Everything else comes from the Zenodo description: three microscopes, registered
  ROIs, 20x/50x/100x magnifications, 256 px (50x) and 96 px (20x) patches, two classes. This is materials-science (steel)
  imaging, not biological. The Zenodo record lists no related paper or DOI (the description mentions an accompanying publication
  without citing it), so no paper was read. Pixel size is stated to be in the metadata workbook, which was not opened. The
  labels are class names (bainite vs martensite) per patch; how they were assigned is not stated on the page beyond registration
  before annotation. No train/test split is provided. Modality list reflects the confocal LEXT plus the two widefield reflected-light
  microscopes (listed as brightfield). enricher: channels 3 (RGB PNGs, samples differ; was 1); size exact (301,907,090 B).'
