title: A Systematically Designed Open-Access Dataset for Cross-Microscope Machine Learning Benchmarking in
  Complex Steel Microstructures
short_name: Steel microstructure patches (light microscopy)
description: 5,327 labelled PNG patches (256 px at 50x, 96 px at 20x) of bainite and martensite in 20
  quenched and tempered steel samples, imaged in registered regions of interest with an Olympus LEXT confocal
  laser scanning microscope, a Leica DM6000 and a Zeiss Axio Imager M2 at several magnifications and acquisition
  settings. Each patch carries microscope, magnification, pixel size, aperture, exposure and filter metadata
  (Excel file). Designed for cross-microscope domain-shift benchmarking.
