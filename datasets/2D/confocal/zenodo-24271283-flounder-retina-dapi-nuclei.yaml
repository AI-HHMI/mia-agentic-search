notes: 'Facts from the Zenodo record and its README, plus a listing of data_annotated_fields.zip (100 TIFFs = 50 images + 50 masks,
  and splits.csv). The README states 50 annotated fields / 6,602 nuclei (split 32/11/7 by VLF; 4,135/1,301/1,166 nuclei) while
  the abstract mentions 43 training fields (5,436 nuclei); the README/file counts were used. The 1,049 unannotated application
  fields are JPEG; n_items counts annotated (50) plus application (1,049) fields. size_bytes left null: the file sizes sum
  to about 0.8 GB across code, tables and images but the application-image split archive was not fully totalled. Pixel size
  0.104 um from the README. The accompanying article (Usatov, Pushchin, Aleskerov) is only marked as submitted to Cytometry
  Part A and has no DOI, so no publication is listed. Code is MIT but bundled YOLO weights are AGPL-3.0; data are CC BY 4.0.'
