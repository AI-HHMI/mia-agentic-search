notes: 'Zip: 36 raw 8-bit TIFFs in _Original_Images/ plus 36 RGB outputs in each of Manual/ (ground truth), ImageJ_Auto/,
  AngioQuant_Auto/, AngioTool_Auto/, RAVE_Auto/ and REAVER_Auto/. Ground truth is mixed-manual (ImageJ threshold, then manual
  paintbrush edits; paper Methods). Pixel size differs by objective, so voxel_size_nm is null: image_quantification.csv in
  the zip states umppix 0.207194025 um (60x, 27 images) and 0.310791038 um (20x, 9 images), matching the ImageJ TIFF calibration
  (enricher). The paper gives a 530 um field of view for 20x, which disagrees with 1024 x 0.3108 um. Tissues from file names.
  Per the paper, a single mouse supplied all 36 images.'
