notes: 'Zip listing (peek_archive): 252 TIFFs, 17 .mat, 1 csv, 1 docx in folders _Original_Images, ImageJ_Manual and per-program output folders; the TIFF count includes the outputs of the five programs, so the 36 raw images are the unit of the dataset (paper Methods: 36 2D images from six tissues). Ground truth is a mixed-manual analysis (ImageJ macro initial threshold, then manual paintbrush edits). Pixel size is not stated; the paper gives fields of view (20x: 530 um, 60x: 212 um) but not image pixel dimensions, so voxel_size_nm is null. Which six tissues were imaged was not recorded here. Per the paper, a single mouse supplied all 36 images. Code repository URL is the one given in the Zenodo description.'
