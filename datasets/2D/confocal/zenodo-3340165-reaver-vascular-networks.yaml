title: REAVER Vascular Networks Fluorescent Image Dataset
short_name: Murine vascular networks (confocal)
description: Benchmark of 36 2D confocal maximum-intensity projections of IB4-lectin labelled vessel networks from six murine tissues (20x and 60x objectives), with ground-truth vessel segmentation and centerline skeleton images made by manual curation of an automated ImageJ threshold. The zip also holds the outputs and metrics of five analysis programs (AngioQuant, AngioTool, RAVE, ImageJ, REAVER) for each image.
