title: 'SpineDL dataset: Spinal Cord Cross-Sections from C57BL/6J Mice'
short_name: Mouse spinal cord regions and neurons (confocal)
description: Training, validation and test images of NeuN- and DAPI-immunostained thoracic spinal cord cross-sections from
  uninjured / sham and moderately contused adult female C57BL/6J mice (full-section 2D maximum projections of confocal
  stacks, up to 5000 x 5000 px, 1.12-2.25 um/px). Two parts - structure identification (semantic masks for background,
  white matter, ependyma, gray matter, lesioned tissue) and neuron identification (instance masks of neuronal somas,
  plus XML neuron labels from several annotators on the test images).
