notes: 'From the Zenodo record and both zip listings via peek_archive (Structure_identification.zip: 202 TIFF files with
  train/validation/test folders and several Manual_annotation_N label folders; Neuron_identification.zip: 256 TIFF and 150
  XML files). size_bytes sums the two zips (1.84 GB + 0.87 GB); download_url points to the structure part, the neuron part
  is Neuron_identification.zip in the same record. The paper is stated as in progress, so publications is empty. The record
  text says both widefield and confocal; images are maximal projections of confocal z-stacks (Leica SP5 and High-Speed Confocal
  Scanner, 20x objective), so modality is confocal. Pixel size varies between 1.12 and 2.25 um, so voxel_size_nm is null.
  The exact number of images was not counted; the original raw confocal images are on OSF (https://osf.io/n32z9).'
