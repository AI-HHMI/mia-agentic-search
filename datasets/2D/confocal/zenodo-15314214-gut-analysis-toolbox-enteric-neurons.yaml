description: >-
  Manually annotated 2D fluorescence images of gut wholemount preparations (mouse, rat, human) with instance labels of
  Hu-positive enteric neurons (84 train and 25 test image-mask pairs), neuronal-subtype images, and ganglia masks,
  with StarDist and UNet models and QA reports from the Gut Analysis Toolbox.
