notes: 'Zip listings: Hu neuron set has train 84 and test 25 image/mask TIFF pairs; the subtype set has 142 TIFFs in test
  and train image/mask folders; the ganglia training zip holds 220 TIFFs plus model weights and code. Images come from four
  labs and the SPARC database; mouse and rat images were rescaled to 0.568 um per pixel and human images to 0.9 um per pixel
  (Zenodo page, paper Methods), so a single voxel size is not given. Neurons were outlined manually in Fiji (paper Methods).
  Microscopes: Leica SP8 confocal, Zeiss Axio Imager widefield, Olympus IX71.  enricher: n_items 291 image/mask pairs (Hu
  84+25, subtype 56+15, ganglia 76+15+20 eval), download_url -> record page (8 zips, 3 with data). organisms: mixed within
  each folder; ganglia file names name the species (e.g. CalRet_mouse_confocal_1, human_pgp_confocal_3), Hu and subtype file
  names do not.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./                                                        8 files      1.4 GB  .zip (3 data zips, 5 model/QA zips)\n\
      2D_enteric_neuron_Hu_train_test.zip (84.7 MB)\n  train/images/ 84 .tif, train/masks/ 84 .tif, test/images/ 25 .tif,\
      \ test/masks/ 25 .tif\n2D_neuronal_subtype_train_test_data.zip (27.9 MB)\n  train/images/ 56 .tif, train/masks/, test/images/\
      \ 15 .tif, test/masks/\n2D_enteric_ganglia_v3_training.zip (766 MB; also code, notebooks, FPN weights)\n  2D_enteric_ganglia_v3_model/data/Train/{Image,Mask}/\
      \ 76 .tif each\n  2D_enteric_ganglia_v3_model/data/Test/{Image,Mask}/ 15 .tif each (+ .md)\n  2D_enteric_ganglia_v3_model/eval_data/{Image,Mask}/\
      \ 20 .tif each (+ .md)\nmodel zips: 2D_enteric_neuron(.bioimage.io.model|_model_QA), 2D_enteric_neuron_subtype(...),\
      \ 2D_Ganglia_RGB_v3.bioimage.io.model"
    n_files: 8
    listing_complete: true
