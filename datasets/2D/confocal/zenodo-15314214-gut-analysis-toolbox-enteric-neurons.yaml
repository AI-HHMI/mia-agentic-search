  notes: 'Listing: tools/listing.py on the Zenodo record: 8 zips, 1,425,124,476 B (file-listing, complete); with --expand-zips
    the three data zips hold 109 Hu pairs, 71 subtype pairs and 111 ganglia pairs (plus model, code and QA files). Sampled
    one pair per set (values from one sample each): Hu test confocal_1 image uint16 1024x1024 0-65534, mask uint16 0-153;
    subtype _Calb_confocal_1 uint16 512x512 326-16383, mask 0-8; ganglia CalRet_mouse_confocal_1 RGB uint8 828x836x3, mask
    {0,255}. Voxel size: one value does not fit (mouse/rat rescaled to 0.568 um/px, human to 0.9 um/px per the record); the
    Hu sample''s ImageJ header says 0.5679 um/px. Download: zip members pass --download-check.'
