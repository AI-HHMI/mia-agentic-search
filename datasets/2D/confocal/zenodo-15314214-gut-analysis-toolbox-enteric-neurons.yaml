notes: >-
  Zip listings: Hu neuron set has train 84 and test 25 image/mask TIFF pairs; the subtype set has 142 TIFFs in test and
  train image/mask folders; the ganglia training zip holds 220 TIFFs plus model weights and code. Images come from four
  labs and the SPARC database; mouse and rat images were rescaled to 0.568 um per pixel and human images to 0.9 um per
  pixel (Zenodo page, paper Methods), so a single voxel size is not given. Neurons were outlined manually in Fiji
  (paper Methods). Microscopes: Leica SP8 confocal, Zeiss Axio Imager widefield, Olympus IX71. n_items is left null
  because the ganglia and subtype pair counts were not confirmed.
