notes: 'Repository dataset/ holds images/, masks/ (matching n.tif names), split_data/{train,test}, extraTest/,
  biologicallyRelevantData/, FiloCountAnnotation.csv and test_set_indices.xlsx. Paper: Filo-SEG = 245
  images (200 train / 45 test) plus a separate 31-image WNT1 counting set; the GitHub folders were read
  through web pages, not file by file, so the exact image count in each folder is unverified (files are
  browsable in the repo). No LICENSE file or license shown on the repository page, so license is unknown.
  Pixel size, labels and acquisition details are in the paper supplement, which was not read; the main
  text names Zeiss LSM 710, 63x dipping or oil objective. Size not stated. Authors omitted (not on the
  repository page; see paper). enricher: git tree confirms 245 images + 245 masks (split_data 200 train
  / 45 test), no LICENSE file; the CC BY-NC-ND link in the paper is the article licence, so licence stays
  unknown.'
