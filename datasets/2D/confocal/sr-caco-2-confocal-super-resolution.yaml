id: sr-caco-2-confocal-super-resolution
title: 'SR-CACO-2: A Dataset for Confocal Fluorescence Microscopy Image Super-Resolution'
short_name: Caco-2 cyst super-resolution pairs (confocal)
description: 22 tile scans of Caco-2 epithelial cysts imaged on a Zeiss LSM700 confocal at four resolutions
  (HR 1024x1024 per tile position, plus real low-resolution /2, /4, /8 scans of the same region) in three
  channels (Survivin, E-cadherin or GFP-tubulin, mCherry-Histone H2B). 9,937 paired 512x512 HR patches
  (with matching LR patches) per scale and channel, with train/validation/test splits, for single-image
  super-resolution.
