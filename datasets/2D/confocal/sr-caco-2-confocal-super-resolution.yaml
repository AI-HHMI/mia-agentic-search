notes: 'Read the NeurIPS 2024 paper (Methods, Table 1, data availability), abstract page and GitHub README.
  22 tiles (15/3/4 train/val/test), HR tiles ~9,318 px square; 9,937 patches per scale and channel. n_items
  is the 2,200 images stated in the paper. Paper says data is on Google Drive; the README links an ETS
  Montreal server share, so no download_url is recorded (link is on the GitHub page). The Hugging Face
  repo holds pretrained weights, not data. Pixel size and patch file extension are not stated in the sources
  read, so null; the file listing was not inspected. enricher: size_bytes 5.2 GB from the paper (1.8 GB
  tiles + 3.4 GB patches; was null). CC BY-NC-SA (non-commercial). date_published is the NeurIPS 2024
  proceedings month.'
