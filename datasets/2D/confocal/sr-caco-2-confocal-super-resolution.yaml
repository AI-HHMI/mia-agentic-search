notes: License is CC BY-NC-SA 4.0 (landing page and paper); the schema has no SA identifier, so CC-BY-NC-4.0 is the closest SPDX value and ShareAlike applies. Data is hosted on an ETS Montreal file share linked from the landing page and GitHub README (the README says to accept a security certificate); the share was not fetched and the file listing could not be checked, so formats come from the paper's data-format appendix and annotations_verified is false. The Zenodo record 10.5281/zenodo.11617172 holds only the code release (7.1 MB). Split per paper - 22 tiles into 15 train, 3 validation, 4 test. Pixel size not stated on the landing page, README or paper text read (paper gives 20x/0.8NA objective and grid sizes only). The LR/HR pairs are acquired at different scan resolutions, not synthetically degraded.
