title: 'SR-CACO-2: A Dataset for Confocal Fluorescence Microscopy Image Super-Resolution'
short_name: SR-CACO-2 Caco-2 confocal super-resolution
description: Real low/high-resolution pairs of scanning confocal images of human Caco-2 cells (3 markers) for single-image super-resolution at x2, x4 and x8. 2,200 unique images in 22 tiles (HR 1024x1024 sub-images, LR 512/256/128), also cut into 9,937 patches (HR 512x512), with a fixed tile-level train/validation/test split.
