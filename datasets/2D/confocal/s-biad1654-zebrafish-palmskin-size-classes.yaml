notes: 'Six zips under AISEC.data/: raw_data 28.9 GB (722 image folders), dl_datasets 35.2 GB (train/valid/test
  crops by fish), ml_datasets 49 KB, models (3 zips, not data). Paper: 722 images from 361 larvae; size
  classes by k-means on bright-field trunk area; fish-wise split 260/29/72; Leica SP8 25x/0.95, 1024x1024
  px, 2 um z sections. Cellpose Cyto3 fine-tuned on 231 manually refined images, applied to the rest (source
  mixed). License CC0 (BioStudies). enricher: dimensionality 3D -> 2D: the deposit holds only single-plane
  1024x1024 max projections / per-channel images, no z-stacks (raw_data.zip listing). enricher: voxel
  size 454.5455 nm xy from the ImageJ TIFF calibration (2.2 px/um), matching a 465 um field over 1024
  px (was null). enricher: formats + png (Cellpose/SLIC renderings).'
