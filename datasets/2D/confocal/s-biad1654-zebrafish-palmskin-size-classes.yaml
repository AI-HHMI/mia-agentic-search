title: Palmskin multicolour confocal images of zebrafish larval skin cells with body-size classes and
  Cellpose cell segmentations
short_name: Zebrafish palmskin skin cells (confocal)
description: 722 confocal z-stack images (1024 x 1024 px, 3 laser lines, 465 x 465 um field) of palmskin-labelled
  superficial epithelial cells in the trunk skin of 361 zebrafish larvae (7-12 dpf, two images per fish),
  each larva labelled with a body-size class (small / medium / large, from k-means on bright-field trunk
  area), plus Cellpose cell segmentations (fine-tuned on 231 manually refined images) and pre-built train
  / validation / test deep-learning crops split by fish.
