notes: 'Only noisy.tiff (165.7 MB; TIFF header: 79 pages, 1024x1024, uint16, no compression, axes not stated) is on this Zenodo
  record: no clean targets. The challenge data-description page lists it as "a subset of low-snr images subject to structured
  noise for training" for a self-supervised blind-spot denoising challenge, hence the self-supervised task. Sample, microscope
  and 96 nm pixel size come from Table 1 and Methods of the Hagen et al. paper (Data Set 4: confocal, 79 images, 1024x1024),
  matched to this record by image count and size; the Zenodo page itself states none of these. Whether the structured noise
  was synthetically added to the images was not stated on the Zenodo page, the challenge page or the paper. The full paired
  low/high-SNR dataset (Data Set 4 in GigaDB 100888) is a different, larger deposit and is not part of this record. Sibling
  record: zenodo-10912386-ai4life-mdc24-jump-denoising.'
