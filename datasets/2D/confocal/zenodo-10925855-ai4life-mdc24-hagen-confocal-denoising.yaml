notes: 'Only noisy.tiff is on this Zenodo record: no clean targets. The challenge data-description page lists it as "a subset of low-snr
  images subject to structured noise for training" for a self-supervised blind-spot denoising challenge, hence the self-supervised task.
  The Zenodo description states the subset "contains 79 images from Data Set 4" of Hagen et al.; sample, microscope and 96 nm pixel
  size come from that paper (Table 1, Methods). Which channel(s) (actin, mitochondria) the 79 images show is not stated. Whether the
  structured noise was added synthetically is not stated. The full paired low/high-SNR Data Set 4 (GigaDB 100888) is a separate deposit.
  Sibling record: zenodo-10912386-ai4life-mdc24-jump-denoising. enricher: size 165,689,212 B from the Zenodo file listing (was 165.7
  MB stated); Data Set 4 match confirmed by the Zenodo API description.'
