notes: 'Zip listing (peek_archive): Mouse skull nuclei/example2_digital_offset300.tif (105.0 MB) and edgeoftheslide_300offset.tif
  (262.3 MB). Paper (arXiv 1911.12291, Experiments): 500 calibration images (edge of a fluorescent slide)
  and 200 noisy realizations of the same static mouse skull nuclei, acquired on a point scanning confocal
  microscope; ImageJ headers: example2 = 200 frames, edgeoftheslide = 500 frames. n_items 700 is the paper
  figure. No clean target files are shipped (annotations.present false), so usable for unsupervised denoising
  rather than as restoration pairs. Pixel size and stain are not stated on the Zenodo page or in the paper
  text read. Companion of the catalog record zenodo-5156937 (Mouse actin) from the same benchmark. enricher:
  voxel size left null: ImageJ headers differ per stack (example2 0.2768 um/px, edge-of-slide 0.8303 um/px);
  download_url set to the direct zip.'
