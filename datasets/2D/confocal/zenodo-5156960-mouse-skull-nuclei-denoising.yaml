  notes: 'Zenodo zip listed by listing.py (complete, 336,769,806 B, 2 deflated TIFF members). probe.py
    could not read deflated members, so a requests + zlib script read each first IFD (~600 KB): ImageJ
    1.52p hyperstacks, 512x512 uint16, uncompressed, unit micron. sample.py fetched example2_digital_offset300.tif
    (90,300,768 B compressed): 200x512x512 uint16, axes TYX, values 2242-20460 (one sample; p50 3804).
    The file names say a digital offset of 300 was set; normalization none is inferred (raw counts, no
    clipping). Voxel size: ImageJ XResolution gives 0.27675 um/px for example2 (3.6133 px/um) and 0.83027
    um/px for edgeoftheslide (1.2044 px/um); the stacks differ, the paper and Zenodo page state no pixel
    size, so imaging.voxel_size_nm stays null. Checked: TIFF headers, Zenodo API, arXiv 1911.12291 (per
    harvest notes). download_url is the direct zip (download-check usable, range requests yes).'
