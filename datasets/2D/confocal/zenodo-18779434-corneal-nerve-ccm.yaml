notes: 'Zenodo record lists CC-BY-4.0 (also in Zenodo API record). Pixel size, microscope model and image
  dimensions are not stated on the Zenodo page, the zip listing or the paper (which defers acquisition
  protocol to earlier publications), so voxel_size_nm is null. Modality recorded as confocal (corneal
  confocal microscopy). No train/val/test split provided; the paper only demonstrates cross-set training
  (Set1 vs Set2). Zip listing shows 840 PNGs (410 images + 410 masks + 20 re-annotations) plus data.xlsx.
  enricher: images are 384x384 px (sampled PNG; the record had no dimensions).'
