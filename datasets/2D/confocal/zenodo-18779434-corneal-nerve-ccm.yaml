title: An Annotated Corneal Confocal Microscopy Dataset for Nerve Segmentation and Clinical Characterization
short_name: Corneal nerve segmentation (in vivo confocal)
description: 410 in vivo corneal confocal microscopy images of the sub-basal nerve plexus from 88 participants
  (healthy and diabetic) at Qilu Hospital of Shandong University, each paired with a manually drawn (Labelme
  polygon) binary pixel-level nerve mask reviewed by domain experts. Two independently collected subsets
  (Set1 210 images, Set2 200 images); demographic data for all subjects and clinical/laboratory data for
  Set2 in data.xlsx.
