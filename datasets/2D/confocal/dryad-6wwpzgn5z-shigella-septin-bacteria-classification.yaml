notes: 'Dryad API lists 7 files: four Infection*.zip (one representative replicate each, 14.7-47.6 GB, no annotations), the two CNN zips (461 MB, 101 MB) and a README. Dryad downloads need a bearer token (API: Unauthorized), so zips could not be listed with peek_archive; TIFF format, folder names and the train/val/test split come from the Dryad page. The paper says all bacteria instances used to train the CNN are deposited, but gives no per-class counts for the deposit, so n_items is null. CNN inputs are 2D max projections (Fig. 4 legend), hence 2D; Infection zips are z-stacks (ZEISS CellDiscoverer 7, 20x/0.95 or 50x/1.2). Pixel size not stated on the Dryad page or in the paper text. Dataset_information_*.xlsx are in Zenodo 10.5281/zenodo.10766627, not read.'
