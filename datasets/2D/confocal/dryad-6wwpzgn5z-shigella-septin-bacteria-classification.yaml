title: High-content Airyscan microscopy of Shigella flexneri infection in HeLa cells with annotated bacteria crops for CNN classification (SEPT7 vs negative, single vs clump)
short_name: Shigella septin-bacteria classification (confocal)
description: Airyscan confocal images of HeLa cells infected with mCherry-expressing Shigella flexneri (SEPT7 immunostaining, EdU/AHA click
  chemistry and TSAR T3SS reporter experiments), plus two annotated CNN training sets of bacteria crops - SEPT7-associated vs negative
  bacteria and single vs clumped bacteria - pre-split into training, validation and test folders. Dryad also holds one representative raw
  replicate per experiment type (107.5 GB in total).
