notes: 'Dryad API lists metadata.csv (388 KB), README_for_metadata.txt, sections_500.hdf5 (4.04 GB) and sections_250.hdf5
  (1.01 GB). Dryad file downloads return 403 to this client, so the HDF5 and CSV contents were not opened; counts and labels
  come from the paper (16,144 labelled sections, 308 stacks, 54 participants; labelled twice by one dermatologist, second
  labelling used as ground truth; paper test split of 18 held-out participants is not shipped as a file). Pixel size: original
  1000x1000 px over 500x500 um (0.5 um/px), the 500x500 file is 2x down-sampled (1 um/px, used in voxel_size_nm) and the 250x250
  file 4x (2 um/px). Stack z spacing 2 um. The README table of metadata columns was not read, so the label column name is not
  confirmed.'
