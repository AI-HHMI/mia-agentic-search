notes: 'Dryad API lists metadata.csv (388 KB), README_for_metadata.txt, sections_500.hdf5 (4.04 GB) and
  sections_250.hdf5 (1.01 GB); Dryad downloads return 403 to scripts, Zenodo 4997933 mirrors the same
  DOI with identical file sizes and direct links. Paper: 16,144 labelled sections, 308 stacks, 54 participants;
  labelled twice by one dermatologist, second labelling used as ground truth. Pixel size: README states
  a 500 x 500 um field of view, so 1 um/px in the 500x500 file (voxel_size_nm) and 2 um/px in the 250x250
  file; sections 2 um apart in depth. enricher: README read (labels = metadata.csv strata 0-3, testing
  column = test split, so splits_provided true); annotations_verified true; download_url = Zenodo sections_500.hdf5
  (was null).'
