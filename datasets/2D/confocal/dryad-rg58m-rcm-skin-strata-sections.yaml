id: dryad-rg58m-rcm-skin-strata-sections
title: Reflectance confocal microscopy en-face skin sections labelled by anatomical strata
short_name: Skin RCM en-face sections by strata (confocal)
description: En-face sections from in-vivo reflectance confocal microscopy (Vivascope 1500) depth stacks
  of human forearm skin, each section labelled by a dermatologist as one of four anatomical strata (stratum
  corneum, viable epidermis, dermal-epidermal junction, papillary dermis). 16,144 labelled sections from
  308 stacks of 54 participants in two age groups, supplied as uint8 arrays at 500x500 and 250x250 pixels
  plus a metadata table.
