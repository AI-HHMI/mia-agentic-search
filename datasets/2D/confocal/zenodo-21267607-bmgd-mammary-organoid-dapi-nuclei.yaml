  notes: 'Listing: tools/listing.py --expand-zips (1 zip, 40,456,267 bytes, complete). The zip holds 4
    .7z archives; downloaded the zip (40.5 MB, within budget) and read each 7z header (Python lzma, no
    extraction tool run): 819 image + 819 mask TIFFs (1800 Pa has one image entry with a stray backslash
    path). Decoded one pair from 950 Pa.7z: image img (1).tif 189x200 uint16, 0-2408, mean 177.9, 1704
    unique values; mask 189x200 uint8 {0,255}, mean 45.2. Values from one sample; normalization none inferred
