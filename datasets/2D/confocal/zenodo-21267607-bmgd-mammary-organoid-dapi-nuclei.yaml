notes: The Zenodo zip holds four 7z archives (250 Pa 10.5 MB, 950 Pa 1.6 MB, 1,200 Pa 5.4 MB, 1,800 Pa 22.9 MB) plus a README, and
  the 7z contents could not be listed, so the image and mask file formats are unknown (formats other) and annotations_verified is
  false. Image counts per stiffness come from the preprint (453, 54, 114, 198 images; 5,426, 453, 1,538, 2,144 nuclei). The paper
  gives x/y voxel size 0.25 um from the LSM 710 acquisition (z spacing 1 um, slices extracted to 2D) and standardised 256 x 256 px,
  12-bit patches. The species of the cells is not stated in the paper text read, so organism is empty. The paper benchmarked with a
  random 80:10:10 split (655/82/82); no split files are described. The license is CC BY 4.0 on the Zenodo record and the preprint.
