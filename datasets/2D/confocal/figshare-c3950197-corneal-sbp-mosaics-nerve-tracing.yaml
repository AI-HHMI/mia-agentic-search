notes: 'Collection of 5 figshare items: wide-field mosaics (5548315, 322 TIFF, 1.77 GB), manual tracings (5705968,
  182 .ndf, 27 MB), raw images (5686975, two ZIPs, 10.3 GB, 83,444 single 384x384 TIFF frames), mosaic key and
  clinical data (xlsx). All CC BY 4.0 on their figshare records. Pixel size is not stated in the paper or records
  (raw frames 384x384 px, field of view 400x400 um, but no stated pixel size; mosaics are resampled), so
  voxel_size_nm is null. Only 182 of the 322 mosaics have manual tracings. The tracings are NeuronJ .ndf text files
  (polylines in mosaic pixel coordinates), not masks; they need rasterizing to skeleton or mask images.
  enricher: size_bytes 12,072,097,852 from the complete figshare file listing (was 12.07e9 rounded).'
