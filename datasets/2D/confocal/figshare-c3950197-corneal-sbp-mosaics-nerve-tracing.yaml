notes: 'Collection of 5 figshare items: wide-field mosaics (5548315, 322 TIFF, 1.77 GB), manual tracings (5705968,
  182 .ndf, 27 MB), raw images (5686975, two ZIPs, 10.3 GB), mosaic key and clinical data (small); the collection
  total of about 12.07 GB is the sum of the three image/tracing items. All three are CC BY 4.0 on their figshare
  records. Pixel size is not stated in the paper or records (raw frames are 384x384 px covering 400x400 um per the
  paper, which would imply about 1 um/px, but the mosaics are resampled), so voxel_size_nm is null. Only 182 of the
  322 mosaics have manual tracings; the paper also reports automatic mCNFL/wCNFL nerve density values. Raw ZIP
  contents were not listed. The tracings are NeuronJ .ndf files rather than masks; they need conversion to
  skeleton or mask images.'
