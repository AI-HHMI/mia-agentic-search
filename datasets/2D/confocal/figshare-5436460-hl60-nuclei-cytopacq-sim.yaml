notes: 'Synthetic data, not real microscope images: the figshare description says they were created with
  Cytopacq from the CBIA dataset (cbia.fi.muni.cz, page no longer reachable) imitating a Zeiss S100 63x/1.40
  oil objective on an Atto CARV confocal with a Micromax 1300-YHS CCD, and cites Svoboda, Homola & Stejskal,
  ICIAR 2011 (not open access, not read). The zip holds 480 TIFFs (8 folders HL60_{High,Low}Noise_C{00,25,50,75}_3D_TIFF
  x 30 images + 30 labels-* masks); the C00-C75 suffix matches the clustering probabilities 0-0.75 stated
  in the description. Probing members of the zip gave 565 x 807 px, uint16 labels, ImageJ calibration
  0.1238 um/px (123.8 nm) in the file headers. Masks come from the simulator (automatic). The related
  3D simulated HL60 set BBBC035 (tracking) is catalogued separately. enricher: listing, shapes and voxel
  size confirmed; no field changes.'
