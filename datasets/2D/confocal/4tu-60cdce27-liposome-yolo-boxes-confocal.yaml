notes: 'The 972 MB zip "data - YOLO training and testing.zip" also holds trained .weights (941 MB), scripts and
  Prism files; images and boxes are in nested obj.zip/val.zip. Pixel size 0.25 um and 512x512 are from the paper
  Methods. Organism left empty: synthetic cells, no organism stated. The rest of the 4TU deposit (large confocal
  screening series, FACS, qPCR) was not assessed. The 1-class and 2-class sets are different annotation sets.
  enricher: nested zips opened; 700 + 40 jpg and box counts (688; 1,645) confirmed, annotations_verified set
  true (was false); class names from obj.names (1-class: MinD; 2-class: lumen, membrane).'
