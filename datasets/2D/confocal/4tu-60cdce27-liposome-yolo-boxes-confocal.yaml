short_name: Synthetic-cell liposome bounding boxes (confocal)
description: YOLO training and test sets from a study on image-based phenotypic sorting of synthetic cells. 512x512
  px two-channel confocal images (eGFP-MinC and DOPE-Cy5 membrane) of liposomes, manually boxed in Label Studio.
  A 1-class set (700 images, 688 boxed liposomes with membrane-localised MinC) and a 2-class set (40 images,
  1,645 boxes; lumen vs membrane). Part of a larger 4TU.ResearchData deposit.
