notes: 'The 972 MB zip "data - YOLO training and testing.zip" also holds trained .weights (941 MB), scripts and
  Prism files; the images and boxes are inside nested obj.zip/val.zip (not opened), so image counts come
  from the paper Methods (700 images / 688 boxes for 1 class; 40 images / 1,645 boxes for 2 classes), and
  the nested-zip contents and jpg format are taken from the paper, not verified in the listing. Pixel size 0.25 um
  and 512x512 are from the paper Methods. Organism left empty: synthetic cells, no organism stated. The
  rest of the 4TU deposit (large confocal screening series, FACS, qPCR) was not assessed. The 1-class
  and 2-class sets overlap in imaging setup but are different annotation sets.'
