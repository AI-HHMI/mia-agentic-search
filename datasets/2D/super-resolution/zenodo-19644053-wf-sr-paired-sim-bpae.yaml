notes: 'Zenodo record metadata gives CC-BY-4.0 (used here); the paper''s page links CC-BY-NC-ND-4.0, presumably
  the article licence, so the data licence is a possible discrepancy. Effective pixel size differs per
  record (~130 nm beads/BPAE multispectral, ~162.5 nm A549/HeLa, ~65 nm hyperspectral, from paper Table
  3), hence voxel_size_nm is null. Item count not given: record 5 alone has 63 groups (~1024 TIFFs per
  SR zip) and zip contents were peeked for records 1, 2, 4 and 5 SR_1 only. size_bytes is the total of
  the zipped files on Zenodo (the paper cites ~13.2 GB uncompressed). Paired targets are computationally
  reconstructed, not hand-annotated; no train/test split is provided. Fixed cells only, 2D. enricher:
  n_items 89 field-of-view groups (8+10+3+3+65) from README.txt (was null); size matches the complete
  Zenodo listing.'
