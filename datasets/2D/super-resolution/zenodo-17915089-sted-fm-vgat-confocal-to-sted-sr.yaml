notes: 'Three tar archives (train 710 MB, valid 151 MB, test 151 MB). The first 4 MB of test-dataset.tar (range request) list members like Gephyrin_STARRED-A8.tif-224-0, 402,112 bytes each
  (one 224x224 crop, apparently a raw array, not a TIFF), hence formats other. n_items 2510 is estimated from tar sizes (about 1,760 train, 375 valid, 375 test). Member names say
  Gephyrin while the description says VGAT, so the structure per archive is unverified. Per the description, confocal was registered onto STED by translation (SimpleITK)
  and cropped to 224x224; pixel size is not stated. This is a downstream dataset of the STED-FM paper (read on bioRxiv); data code at github.com/FLClab/STED-FM.'
