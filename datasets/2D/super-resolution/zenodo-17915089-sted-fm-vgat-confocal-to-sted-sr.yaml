notes: 'Three tar archives (train 710 MB, valid 151 MB, test 151 MB); tar files cannot be listed with tools/peek_archive.py; the first 4 MB of test-dataset.tar (range request) show members named like Gephyrin_STARRED-A8.tif-224-0,
  each 402,112 bytes (one 224x224 crop each, apparently a raw array, not a TIFF container), so formats is other. n_items 2510 is estimated from the tar sizes
  (about 402 kB per member: roughly 1,760 train, 375 valid, 375 test). The member names say Gephyrin, while the description says VGAT: which
  structure each archive holds is unverified. The Zenodo description says the confocal images were registered onto the STED
  images by translation (SimpleITK) and cropped to 224x224; STED acquired with 10 accumulations, 10 us dwell, 4.2 uW excitation (488 nm) and 88.1 mW depletion (775 nm).
  Pixel size is not stated. This is the VGAT-SR dataset from the STED-FM paper; the paper full text (bioRxiv, preprint) was read, its data availability points to
  github.com/FLClab/STED-FM. Sibling STED-FM deposits (STED-FM dataset, Image Restoration, Synaptic development, F-actin conformations, Zooniverse segmentation)
  are separate records already catalogued or proposed.'
