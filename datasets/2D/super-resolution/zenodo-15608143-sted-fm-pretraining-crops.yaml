  notes: 'Zenodo listing complete: 2 zips, 23,269,768,337 B. Each zip holds one deflated tar (zip index: 13,101,762,560
    and 50,971,781,120 B unpacked), so members are not range-readable; the first 4 MB of the subset zip were inflated
    locally: 12 tar members FUS-21dda929-...-<y>-<x>, 51,020 B each, each an npz (PK) with image (224x224 uint8,
    0-24 in the first crop) and metadata (object array, needs pickle; not loaded per the untrusted-data rule). Value
