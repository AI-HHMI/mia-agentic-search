title: STED-FM dataset - about one million 224x224 STED microscopy crops for self-supervised pre-training
short_name: STED-FM STED crops for self-supervised training
description: Self-supervised training dataset of the STED-FM foundation model. 37,387 STED images of varying size from an Abberior Expert Line microscope, cut into 976,022 crops of 224x224 pixels (more than 20 labelled proteins, hippocampal and cortical neurons, HEK, NG108 and Caco2 cells, live and fixed cultures and tissue slices). A subset of 238,683 crops is labelled with one of 24 protein classes.
