notes: 'Zenodo lists two zip files, STED-FM-dataset-crops.zip (19.0 GB, holding one 51 GB .tar) and STED-FM-subset-dataset-crops.zip
  (4.3 GB, one 13.1 GB .tar). The record description says files are npz with keys image and metadata (normalized
  and raw variants) and also mentions a raw tiff tar, which is not in the Zenodo file listing, so formats is other;
  Crop counts (976,022 total, 238,683 labelled in 24 classes) come from the paper Methods (bioRxiv 2025.06.06.656993,
  read as PDF) and the record. Pixel size and per-image acquisition parameters are not given in the record or the
  paper text read. The data are explicitly released for foundation-model pre-training; the class subset is a weak
  label from the labelled protein, not manual annotation. size_bytes is the sum of the two zips (the subset may
  overlap the full set). enricher: first tar members read (subset zip): npz with image 224x224 uint8; class = member-name
  prefix (e.g. FUS-<uuid>-<y>-<x>).'
