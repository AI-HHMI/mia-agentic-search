id: zenodo-20386408-presynaptic-actin-smlm
title: Sample image data and annotations associated to Presynaptic Actin Nanostructures - A Reproducibility Case Study
short_name: Presynaptic actin nanostructures (STORM SMLM)
description: Single-molecule localisation microscopy (STORM) reconstructions of 34 regions of interest from bead-induced
  presynapses in cultured rat hippocampal neurons (3 replicates, NC1-NC3), with the matching epifluorescence
  images and manual annotations of three presynaptic actin nanostructure classes (mesh, rails, corrals).
  Annotations come from the original authors, from four external analysts working independently, and
  from their consensus, as masks and Fiji ROI files. Released with the GloBIAS reproducibility case
  study of Bingham et al. 2023.
