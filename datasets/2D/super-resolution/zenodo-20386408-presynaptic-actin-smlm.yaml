notes: 'One 301 MB zip (1,929 files; listed with peek_archive, plus its read.me.txt): SMLM localisation CSVs,
  reconstructed ROI images, epifluorescence images and annotations (original authors, 4 analysts, consensus).
  34 ROIs / 3 replicates per the case-study paper; 4 nm/pixel zoom per Bingham et al. Methods; epifluorescence
  pixel size not stated. Reconstructions are 2D although CSV names say 3D. Labels are object-level mesh/rails/corrals
  classes, not exhaustive pixel labels, with notable analyst disagreement. Small, built for a reproducibility
  study (hence modest confidence); no splits.'
