notes: 'Figshare lists 5 zips plus a spreadsheet and a supplementary zip; size_bytes sums all 7 files.
  peek_archive: 279 Cell_NNN folders (Microtubules 55, CCPs 54, ER 68, F-actin nonlinear 51, F-actin 51)
  with RawSIMData_level_NN.mrc stacks and SIM_gt / RawSIMData_gt ground truth (ER has GTSIM levels). Paper
  is not open access (abstract only) and the Nature page was blocked, so cell line is not verified: organism
  left empty. Ground truth is SIM data (file names), so annotations.source is automatic. BioSR+ is a separate
  record (zenodo-7115540-biosr-plus-sim-sr). enricher: voxel size 62.6 nm (raw SIM images) from imaging_conditions.xlsx
  in the Supplementary Files zip (was null); SIM_gt is upscaled x2 (x3 for nonlinear F-actin). download_url
  set to the landing page (was the Microtubules zip only; the data are 5 zips).'
