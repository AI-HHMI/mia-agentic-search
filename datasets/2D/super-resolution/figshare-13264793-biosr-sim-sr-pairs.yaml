notes: 'Figshare lists 5 zips plus a spreadsheet and a supplementary zip; size_bytes sums all 7 files, download_url
  is the first zip. peek_archive: 279 Cell_NNN folders (Microtubules 55, CCPs 54, ER 68, F-actin nonlinear 51,
  F-actin 51) with RawSIMData_level_NN.mrc stacks and SIM_gt / RawSIMData_gt ground truth (ER has GTSIM levels).
  Paper is not open access (abstract only) and the Nature page was blocked, so cell line, pixel size and
  acquisition details are not verified: voxel_size_nm and organism left empty. Ground truth is SIM data (file
  names), so annotations.source is automatic. BioSR+ is a separate record (zenodo-7115540-biosr-plus-sim-sr).'
