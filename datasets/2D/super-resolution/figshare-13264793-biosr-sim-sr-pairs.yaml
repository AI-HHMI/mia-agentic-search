  notes: 'Figshare API: 7 files, 12,479,559,462 B. CCPs.zip index read remotely (595 MRC). Probed 3 MRC
    members of CCPs/Cell_028: raw stacks 9 x 502 x 502 uint16, SIM_gt 1004 x 1004 uint16. The MRC headers
    are non-standard (no MAP ID, zero machine stamp, cell dimensions giving ~0.006 nm voxels), so header
    voxel sizes are meaningless; the dataset ships its own read_mrc.py. Sampled level_01 (min 63, max
    176) and SIM_gt (0 to 65535, full uint16 range at both ends, hence contrast-stretched). normalization
    none for raw is inferred (low counts in a camera range). Values from one cell. Raw axes not stated
    in the files (left null). Zips and members are direct figshare links with ranges (TensorSwitch usable:
    true); the dataset is 5 zips, so download_url is the landing page. Voxel size: imaging_conditions.xlsx
    states pixel size (raw SIM image) 62.6 nm for all five structures.'
