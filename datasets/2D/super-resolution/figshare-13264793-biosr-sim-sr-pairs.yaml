title: 'BioSR: a biological image dataset for super-resolution microscopy'
short_name: BioSR SIM low/high-res pairs (super-res)
description: Over 2,200 pairs of low-resolution and high-resolution structured illumination microscopy (SIM)
  images of four subcellular structures (clathrin-coated pits, endoplasmic reticulum, microtubules, F-actin) at
  up to nine signal levels, with linear and non-linear SIM ground truth, for training and evaluating single-image
  super-resolution and SIM reconstruction models. Original BioSR release accompanying the DFCAN paper.
