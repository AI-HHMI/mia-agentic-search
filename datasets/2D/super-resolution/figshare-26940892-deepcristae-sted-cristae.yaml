notes: 'The item has 18 files (zips and rars, 18.7 GB): one per paper figure (validation and result images,
  3D and 3D+t series), Dataset_Dsynt.zip (246 MB) and Fiji macros. Only Dataset_Dsynt.zip was listed (peek_archive,
  3,750 files): train has 24 HR STED images, 24 LR images and 2,899 patches; test has 26 HR and 26 LR
  ROIs from 9 images (the paper: 33 HR STED images in total). The LR images are synthetic degradations
  of HR STED, since real pairs cannot be acquired in live cells. n_items counts the 33 HR images. 25 nm
  is the HR STED pixel size stated in the paper. Dimensionality and formats describe Dsynt only; the other
  zips (3D, 3D+t, mixed modalities) were not opened. Enricher: channels 1 (single-plane TIFFs).'
