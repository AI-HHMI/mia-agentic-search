title: Manually aligned fluorescence (SIM) and scanning EM image pairs of C. elegans sections for CLEM registration
short_name: C. elegans aligned CLEM pairs (SIM + SEM)
description: 'Training data for DeepCLEM: 117 training and 4 validation manually aligned correlative light and electron microscopy image pairs of C. elegans resin sections, each as a fluorescence (Hoechst chromatin, SIM) image and the matching scanning electron microscopy image, in folders fluo_training, sem_training, fluo_validation and sem_validation (242 TIFFs, 16.8 MB zip). Used to train a network that predicts the chromatin fluorescence from EM images for automatic registration.'
