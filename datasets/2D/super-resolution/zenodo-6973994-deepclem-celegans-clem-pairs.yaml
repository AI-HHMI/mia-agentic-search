notes: 'Zip listed with peek_archive (242 TIFFs in four folders) and its Readme read. Paper Methods read on the
  F1000Research page (first 100k characters): fluorescence by SIM with live Hoechst 33342, EM by SEM, 100 nm sections,
  ground truth made by manual overlay alignment in Inkscape (30 subimages described there; the Zenodo set has 121
  pairs). Pixel size and image size are not stated on the page, Readme or the Methods text read. SEM has no entry
  in the modality enum, so it is listed as other after super-resolution. The training/validation split is the folder
  split of 117/4 pairs.'
