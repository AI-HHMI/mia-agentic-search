id: zenodo-13145550-er-sted-denoising
title: Live-cell STED images of the endoplasmic reticulum, paired low-/high-intensity training data for UNet-RCAN denoising
short_name: ER live-cell STED denoising pairs (STED)
description: 'Training, test and time-series data for UNet-RCAN denoising of live-cell STED microscopy of the endoplasmic reticulum in U2-OS cells (calreticulin-KDEL-HaloTag7, SiR label). The 2D train/test zips hold paired low-intensity (noisy) and high-intensity (ground truth) STED images, acquired line-sequentially, for resting and Torin1/Bafilomycin-treated cells. Further zips hold 3D top-hat STED stacks and long 2D/3D time series with predictions, plus the trained resting and mixed models (.h5) and manuscript videos. About 16.2 GB in 10 files.'
