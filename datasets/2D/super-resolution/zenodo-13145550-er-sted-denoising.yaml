notes: 'Only the first zip (2023-09-13 untreated 2D train/test) was listed with peek_archive: 1651 TIFFs plus per-folder CSV metrics and an ijm macro; folders test/high, test/high_pair, test/high_rFRC. Pixel size 20 nm (single-plane ground truth acquisition table in the paper). Zenodo page does not state the modality; STED comes from the paper. The paper''s Data Availability cites Zenodo 10.5281/zenodo.13120792 (not dedup-matched in the catalog); this record is the 13145550 deposit. n_items not counted across all zips. Images are 2D single plane for the train/test sets; 3D and time-series zips also exist.'
