short_name: mAIcrobe bacterial cell segmentation (SIM, phase)
description: Collection of bacterial microscopy images used for mAIcrobe. StarDist_Saureus holds membrane-labelled
  S. aureus SIM images with annotated instance masks (22 training and 3 test FOVs); UNetSPneumo holds
  phase-contrast S. pneumoniae images with instance masks (16 training and 3 test FOVs). Further folders
  (JE2_WT, LCML1_LCML262, COL_WT_Timelapse) hold unlabelled S. aureus SIM images and a timelapse.
