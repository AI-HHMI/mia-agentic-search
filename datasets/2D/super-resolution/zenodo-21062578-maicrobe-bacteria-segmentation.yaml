notes: 'Channels: membrane and DNA (S. aureus SIM), phase (S. pneumoniae); count left null because it
  varies by folder. Only StarDist_Saureus and UNetSPneumo were listed with peek_archive (masks confirmed);
  other folders are unlabelled. Pixel size not stated in the dataset page, the two READMEs or the closed-access
  paper abstract (full text not open access); the PDF description was unreadable. Authors not shown in
  the fetched page summary. Annotation procedure not stated in READMEs. Size is the sum of the five archives
  listed in the Zenodo API. StarDist training data is also from the ReScale4DL work (Zenodo 15169018),
  which may overlap.

  enricher: size_bytes from full Zenodo listing (1053512059, incl. PDF); n_items 44 = labelled FOV pairs
  (22+3 SIM, 16+3 phase) from listing. Pixel size in TIFF headers: 32.24 nm (SIM), 64.5 nm (phase); record
  left null as it differs by subset.'
