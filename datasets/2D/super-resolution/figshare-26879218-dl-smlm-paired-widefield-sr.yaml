notes: 'Six zips on Figshare (CCPs 28 sets, Microtubules 33, ER-KDEL 26, ER-sec61b 30, OMM 30, IMM 41;
  188 sets total per the paper Data Records) plus a data information.txt; download_url points to one of
  them (OMM-tomm20.zip), the others are listed on the Figshare page. size_bytes is the sum of the Figshare
  file sizes (about 18.5 GB). Zip listing of OMM-tomm20.zip (peek_archive): cell1..cellN folders, each
  with SR<N>.tif, SR_locs.csv, WF<N>.tif and WF_raw.tif. The localization CSVs are described in annotations.format.
  Pairs are LR/HR image pairs, not manual labels; the SR reconstruction is the target. Species taken as
  COS-7 (African green monkey) from the paper Methods. Pixel sizes (130 nm and 16.25 nm) are from the
  paper and data information.txt. Train/test split is not provided.'
