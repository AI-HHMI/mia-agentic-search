title: 'DL-SMLM: a biological imaging dataset containing paired widefield and SMLM super-resolution images'
short_name: Paired TIRF and SMLM super-resolution (COS-7)
description: '188 sets of paired low-resolution TIRF image stacks (256x256 px, 130 nm, 100 frames) and
  8x SMLM super-resolution reconstructions (2048x2048 px, 16.25 nm) with raw localization tables, for
  six subcellular structures in fixed COS-7 cells: clathrin-coated pits, ER membrane and lumen, microtubules,
  and outer and inner mitochondrial membrane.'
