  notes: 'Figshare listing + zip central directories: 6 zips (737 members, 47.5 GB unzipped) + data information.txt;
    18,532,034,979 B exact. TIFF counts per zip vary (ER-sec61β has 75 TIFFs for 30 cells), so not every
    cell folder holds all three TIFFs. Probed OMM-tomm20 cell1: SR1.tif float32 2048x2048, ImageJ calibration
    16.25 nm; WF1.tif float32 256x256 (no usable calibration, unit inch). Sampled (one cell only) WF_raw.tif
    uint16 100x256x256, range 387-65535 (saturated pixels present), and SR1.tif float32 range 0-1301,
    83% zeros. data information.txt: ORCA-Fusion BT, 130 nm px, 0.23 e-/count, dark offset 100, SR post-processing
    none; normalization none is from these docs. The raw stack axes (t) follow the docs ("Stack: 100 frames",
    50 ms exposure); the TIFF header says ZYX. Raw pixel size is 130 nm; imaging.voxel_size_nm keeps the
    16.25 nm SR grid.'
