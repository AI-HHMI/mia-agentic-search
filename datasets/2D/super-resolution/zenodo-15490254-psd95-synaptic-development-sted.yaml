notes: 'synaptic_development_dataset.zip (1.27 GB) was listed with tools/peek_archive.py: 100 .tif files (img_N.tif,
  40-80 MB each, 5.7 GB uncompressed). Separate train (550 MB), valid (209 MB) and test (193 MB) .tar files hold
  the pre-split data as npz (per the bundled synaptic_development_dataset.py loader). The label is the culture age
  of each image, a weak label from the experiment design, not manual annotation. The paper (bioRxiv 2025.06.06.656993)
  uses this set for latent attribute manipulation (DIV12 vs DIV25) and cites the Zenodo record as the data source;
  the species of the cortical cultures is not stated in the sources read. enricher: size = all 5 files (was the
  zip only); channels 4 (each TIFF has 4 distinct float64 planes, meaning not documented). Test tar npz say div
  DIV14, condition PLKO, dpi 11DPI, which does not match the DIV 12-25 in the description.'
