short_name: PSD95 STED synaptic development (DIV12-25)
description: STED images of the postsynaptic protein PSD95 (Fluotag X2 anti-PSD95 STAR635P) in fixed cortical neuron
  cultures at 12, 16, 18, 21 and 25 days in vitro, with 20 nm pixels. The record offers 100 raw TIFF images and
  train, validation and test tar archives (NumPy-based loader provided) for classifying the developmental stage.
