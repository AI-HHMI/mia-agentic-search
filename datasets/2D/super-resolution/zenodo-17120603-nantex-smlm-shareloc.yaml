notes: 'Single 106 MB RAR archive. Only its first member could be read (a range request of the first 8 KB showed
  ACT_test/ACT_test_0.png, an 8-bit grayscale PNG of 3787 x 3806 pixels), so the full member list, the image
  count per class and the exact class codes beyond ACT (actin) were not verified; folder names are assumed to
  carry the class. The images are rendered SMLM reconstructions; pixel size is not stated on the record. No
  paper is available yet (the record cites a working-title companion manuscript), so the Methods could not be
  read. The record lists ShareLoc (https://shareloc.xyz) as the parent collection; the original
  ShareLoc deposits keep their own licenses.'
