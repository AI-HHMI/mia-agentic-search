description: Mono-structural single-molecule localization microscopy (dSTORM) images of three organelle/structure
  classes (microtubules, endosomes/LNPs, actin), partly sourced from the ShareLoc corpus and arranged into training,
  validation and test sets (the split logic of the NanTex manuscript). Intended for training and benchmarking NanTex
  and as general super-resolution classification/segmentation baselines.
