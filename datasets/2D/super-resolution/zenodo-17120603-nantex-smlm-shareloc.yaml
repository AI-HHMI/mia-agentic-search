notes: 'Single 106 MB RAR5 archive of 31 rendered dSTORM images (8-bit grayscale PNG, ~2650-3940 px square), one
  structure class per folder: ACT 5, LNP 7, MIC 19 images over train/val/test. Companion preprint (bioRxiv 10.1101/2025.09.16.676574):
  SMLM data rendered in rapidSTORM at 10 nm/pixel, then cropped and converted to uniform resolution and scale; the
  final pixel size is not stated, so voxel_size_nm stays null. Organisms not stated per image (images sourced partly
  from ShareLoc, whose deposits keep their own licenses). enricher: n_items 31, channels 1, class codes and annotations_verified
  from the archive member list (were null/unverified).'
