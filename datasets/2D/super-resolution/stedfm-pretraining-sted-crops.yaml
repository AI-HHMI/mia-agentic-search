notes: 'Released explicitly for self-supervised pre-training (no labels). No license for the dataset on
  the project page, GitHub README/repo, Zenodo code record (CC-BY-4.0, software) or the paper (preprint
  text CC-BY-NC-ND); license left unknown. enricher: formats other -> tiff. The download_url zip holds
  one tar of 976k npz crops (image.npy uint8 + pickled metadata.npy); the project page also offers the
  same crops as uint16 TIFF (STED-FM-dataset-crops-tiff-raw.zip) and npz with raw counts, plus uncropped
  full images in TIFF, each as one tar in one zip. enricher: channels 1 (single-channel 224x224 crops,
  sampled). Voxel size left null: one sampled image says 0.02 um (TIFF XResolution, OME PhysicalSizeX
  in its metadata), but the paper states no pixel size and the 37,387 source images come from many experiments.
  Organisms not mapped to files: paper Methods name rat (Sprague-Dawley) hippocampal neurons, HEK, NG108,
  Caco2 and tissue slices.'
