  notes: 'Inspected by streaming the first 2 MB (compressed) of the single deflated tar inside STED-FM-dataset-crops.zip
    and STED-FM-dataset-crops-tiff-raw.zip and reading the first 12 tar headers and 2 members of each;
    no full archive downloaded. value_range from two crops of one image only. npz crops: uint8 0-255,
    so already rescaled per image by the authors (paper: 0.001/0.999 quantile normalisation for training),
    but the stored mapping is not documented -> normalization unknown. TIFF crops: raw photon counts per
    project page -> none. size_bytes = the download_url zip (19,009,399,914 B, exact listing); the TIFF
    version is 22,000,033,737 B. shape_varies false: paper says all crops are 224 x 224. Voxel size: one
    sampled image has PhysicalSizeX/Y 0.02 um in its metadata and TIFF XResolution 50 px/um; not set because
    the paper and page state no pixel size for the 37,387 images (checked: TIFF header, npz metadata,
    project page, GitHub README, paper Methods/STED imaging/Data availability). No direct per-file link:
    every version is one tar inside one zip, and TensorSwitch cannot read members of a tar inside a zip;
    host s3.valeria.science is also not on its allowlist. sample: null for that reason. No annotations
    (self-supervised set).'
