title: STED-FM pre-training dataset of ~1 million super-resolution STED image crops
short_name: STED-FM pre-training STED image crops
description: Unlabelled set of 37,387 STED images from an Abberior Expert Line microscope, split into
  976,022 crops of 224 x 224 pixels, released to pre-train the STED-FM masked-autoencoder foundation model.
  It covers more than 20 fluorescently labelled proteins in several cell types, live and fixed cells and
  tissue slices. The protein of interest is known for 238,683 crops (24 proteins).
