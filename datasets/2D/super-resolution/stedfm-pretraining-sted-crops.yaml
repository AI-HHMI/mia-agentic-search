notes: 'Released explicitly for self-supervised pre-training (no labels). The download is a 19.0 GB zip (50.97 GB uncompressed) holding one STED-FM-dataset-crops.tar, so per-file format is not visible (project page also lists raw npz and tiff versions, and uncropped full images in tiff); formats is other for that reason. No license for the dataset on the project page, GitHub README, Zenodo code record (CC-BY-4.0, but that is the software) or the paper (preprint text CC-BY-NC-ND); license left unknown. Voxel/pixel size not stated on the project page or in the paper Methods text read. The paper Data availability says the in-house datasets are at github.com/FLClab/STED-FM. Related annotated FLClab sets (SPZ, F-actin conformations, synaptic development) are already separate records.'
