title: Confocal and STED Live F-actin dataset - paired confocal/STED images of SiR-Actin in living neurons
short_name: Live F-actin confocal/STED pairs in neurons
description: Paired confocal and STED images of F-actin nanostructures in living cultured hippocampal neurons labelled
  with the fluorogenic dye SiR-Actin, used to train and test the TA-GAN for confocal-to-STED super-resolution. Folders
  hold 753 training and 47 validation pairs, 84 initial and 84 final test pairs, and 149 test series acquired with
  TA-GAN assistance. All images have a 20 nm pixel size.
