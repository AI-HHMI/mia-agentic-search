notes: 'LiveFActinDataset.zip listed with tools/peek_archive.py: 4404 files (3804 .tif plus 600 .msr.tif), by folder train 753, valid 47, test_initial 84, test_final 84, test_series 3436 (149 series with input, full_STED and initial_final_confocal subfolders). The paper (bioRxiv 2021.07.19.452964, Methods) says the Live F-actin dataset has 904 paired STED/confocal images (833 train, 71 validation) of variable size with 20 nm pixels, acquired on an Abberior 4-color STED microscope; the record''s 753/47 pair counts differ from the paper, so counts should be rechecked. The target of the pairs is the real STED acquisition, not manual labels. n_items left null because the archive file count mixes pairs, series frames and .msr.tif raw files.'
