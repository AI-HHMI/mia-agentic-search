notes: 'Zip listings (peek_archive): training_dataset.zip has PC190723 (6) and WT
  (4) Images/Labels TIFF pairs; test_dataset.zip has PC190723 (6) and WT (6, incl.
  14b.tif) pairs, 22 pairs in total. Sizes are the two zip files. The ReScale4DL preprint
  (read via Europe PMC) states these are in-house SIM images of the S. aureus cell
  wall with annotated instance segmentation masks, and also cites Zenodo 10.5281/zenodo.15169017
  (a different record not examined). Fluorescent dye, microscope, pixel size and annotation
  procedure are not given on the Zenodo page or in the preprint text read, so they
  are left unknown. Related: the same project has a U2OS nuclei dataset (zenodo 20041089)
  that is a separate PR.'
