notes: 'Synthetic: ground truth is the BioSR image the speckle frames were simulated from (paper Methods). peek_archive of mixed_set_psf_5.zip: train 1200 / val 100 / test 100 objects, each with ground_truth, gt_2x, low_res PNGs plus 20 input_frames and 20 illumination_patterns; psf_6 not listed per folder; generalization_data.zip listing unreadable (contents from paper: ER, CCP, MNIST sets). experimental_figure_data.zip: 6,583 TIFF speckle recordings without ground truth. Pixel size, BioSR source organism and psf_6 counts not found (Supplement not read). Zenodo text says psf 4 and 5 but files are psf 5 and 6.'
