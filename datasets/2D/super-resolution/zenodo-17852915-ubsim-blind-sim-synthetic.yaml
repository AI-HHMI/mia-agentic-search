  notes: 'Size: 16,095,632,055 B = the 4 Zenodo zips (tools/listing.py, file-listing). n_files counts zip members read from the 4 central directories. value_range is from one sampled object (mixed_set_psf_5/test/97); headers probed for the other PNG folders, mixed_set_psf_6 input frames and two experimental TIFFs. Normalization from data_generator.m (mat2gray min-max scaling, frames divided by their max) written as 8-bit PNG. mnist_dataset: ground_truth has 1600 files but gt_2x/low_res 70,000, so its pairing is unclear; not covered by the arrays above. No single archive for the whole dataset: data.download_url stays the Zenodo record; the 4 zips are https://zenodo.org/records/17852915/files/<name>.zip (usable, range requests). Voxel size not found; checked: PNG/TIFF headers (TIFFs say 1 px uncalibrated), Zenodo API record, data_generator.m and airy_disk.m, paper full text, GitHub README. Simulated sets are resampled per structure type, so none applies.'
