notes: 'Synthetic: ground truth is the BioSR image the speckle frames were simulated from (paper Methods; data_generator.m in each zip). mixed_set_psf_5: train/val/test 1200/100/100 objects, 20 frames each; mixed_set_psf_6: 1600/400/400, 30 frames each. generalization_data.zip: ccp, er and mnist sets in the same layout; experimental_figure_data.zip: 6,583 uint16 TIFF speckle frames of live COS-7 cells without ground truth. Organism left empty: training images are simulated from BioSR crops (source organism not stated in sources read). Zenodo text says psf 4 and 5 but files are psf 5 and 6. enricher: voxel size stays null; simulated crops are resized per structure type (scale 1, 1.4, 2 in data_generator.m), so no single physical pixel size applies.'
