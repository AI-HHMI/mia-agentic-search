notes: 'Zip listed with peek_archive: Data/Raw_ROIs and Data/Mask_ROIs each hold 184 train + 40 test TIFFs,
  plus a CARE_Model folder. The Zenodo text says the model used 736 paired 256 px patches; the paper Methods
  say 50 annotated images, with masks drawn manually in Fiji. Pixel size of the PAINT renderings is not
  stated on the Zenodo page or in the paper, so voxel_size_nm is null. Paper read in full from bioRxiv.
  enricher: masks are binary 0/255 uint8, 1024 x 1024, same grid as the raw ROI (one pair sampled).'
