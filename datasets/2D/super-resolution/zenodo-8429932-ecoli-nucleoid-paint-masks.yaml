title: E. coli nucleoid segmentation in PAINT super-resolution images (ROIs with manual masks, CARE model)
short_name: E. coli nucleoid masks (PAINT super-resolution)
description: >-
  Super-resolved PAINT (JF646-Hoechst) images of fixed Escherichia coli cells (strain NO34, MreBsw-sfGFP) grown in LB and
  treated with different antibiotics for 0-60 min, supplied as 224 raw ROI images with matching manually drawn nucleoid
  segmentation masks (184 train, 40 test), together with the trained ZeroCostDL4Mic CARE 2D segmentation model and its
  quality-control outputs.
