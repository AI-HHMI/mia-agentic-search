notes: 'GigaDB API file list (183 GB with code and models): DataSet_1 raw SIM TIFFs 107 GB (80 nm), DataSet_2 2,525 tubulin pairs
  (40 nm), DataSet_3 joint denoise/SR (input 80 nm, reference 40 nm), DataSet_4 6,942 vesicle pairs (40 nm), noise levels,
  raw vesicle data, method outputs. Paper (full text read): tests are the last 20 tubulin FOVs, a convention not a folder,
  so splits_provided is false. References come from the earliest timestamps, so labels are automatic. Zip members not listed
