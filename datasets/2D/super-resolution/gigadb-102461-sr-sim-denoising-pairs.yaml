notes: 'GigaDB file list 183.2 GB incl. code, models and method outputs. Voxel sizes differ by subset (Results.zip Pixel_size_detail
  txt + paper): DataSet_1 raw SIM 80x80x375.4 nm; DataSet_2 and DataSet_4 pairs 40x40 nm; DataSet_3 input 80 nm, reference 40 nm. Tests
  are the last 20 tubulin FOVs (paper), not a folder. References come from the earliest timestamp, so labels are automatic. CC0 per
  GigaDB readme and paper. Zenodo 7626173 holds only models. enricher: voxel_size_nm set to null (was 40x40) because subsets differ;
  size_bytes from full file listing; download_url = GigaDB Wasabi folder (9 zips, no single archive); DataSet_4 has 7,284 pairs in the
  zip vs 6,942 stated.'
