  microscopy data"
short_name: SR-SIM tubulin and vesicle denoising pairs
description: Four super-resolution SIM image sets from U2-OS cells recorded on a DeltaVision OMX V4 for denoising and super-resolution
  training - raw SIM stacks of tubulin (101 fields of view, 200 timestamps each), 2,525 fairSIM-reconstructed noisy/reference tubulin
  pairs, a joint denoising and super-resolution set of 2,525 samples, and 6,942 noisy/reference pairs of vLamp1-mScarlet vesicles from
  3D-SIM reconstructions, plus additional noise levels and the raw vesicle data.
