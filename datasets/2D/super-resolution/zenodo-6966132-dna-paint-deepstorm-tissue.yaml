title: Fast DNA-PAINT imaging using a deep neural network - data
short_name: DNA-PAINT rat neuronal tissue SMLM (training)
description: Experimental DNA-PAINT single-molecule localization microscopy data from semi-thin (~350 nm) rat MNTB brain tissue
  sections labelled for alpha-tubulin, TOM20, Bassoon and Homer. Contains sparse-emitter raw frames (20 pM imager strands)
  with 30,000 summed high-density training patches and their emitter coordinates for DeepSTORM training, plus high-density
  raw frame stacks (5-20 nM) paired with Picasso-rendered ground-truth super-resolution images made from low-density (0.5
  nM, 10,000 frames) acquisitions of the same fields, and trained model weights.
