notes: 'Zenodo file list (28 files): 20 pM raw frames, 30,000 summed training patches with CSV coordinates, 10 Picasso-rendered ground-truth images (13.37 nm/pixel per record description), 10 high-density stacks, Bassoon_Homer_datasets.zip (6 GT + 6 stacks, listed with peek_archive), a 27.9 GB low-density-frames zip (not listed) and DeepSTORM weights. The record shows no license (Rights: No further description; only the paper is CC BY 4.0), so license is unknown. Voxel size is the rendered GT pixel size only; raw-frame pixel size is not stated on the record or in the paper Methods. Few fields of view: signal is the summed patches with coordinates and paired GT renders.'
