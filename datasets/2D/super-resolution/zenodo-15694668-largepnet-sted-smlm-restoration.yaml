notes: 'Six zips: STED_denoising (240 .tif + 3 .npz), STED_deblurring (480 .tif + 3 .npz), SMLM (194 .tif + 1 .npz)
  listed with peek_archive; BioSR/BioTISR are copies of figshare 13264793 / zenodo 13924483. Paper Methods: STED
  18 microtubule shots (2048 px) and 32 mitochondrion/ER shots (1024 px), pixel 25-55 nm; inputs synthesized from
  real GT. Volumetric set: paired widefield/confocal stacks 1024x1024x24, 30+ ROIs per structure. Voxel size not
  stated per set; paper is CC-BY-NC-ND, Zenodo record CC-BY-4.0. Size is the sum of the six zips. enricher: Mus
  musculus added (Volumetric MousePhalloidin/, MouseWGA/; paper: mouse kidney). organisms: Chlorocebus aethiops
  = STED_*; Homo sapiens = SMLM; Mus musculus = Volumetric Mouse*/; Onion/, Nerlum/ = plants (species not set).'
