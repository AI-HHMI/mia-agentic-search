title: LargePNet supplementary dataset - STED denoising and deblurring, SMLM virtual sampling and volumetric background removal training data
short_name: LargePNet STED/SMLM/confocal restoration data
description: Supplementary training and testing data of the LargePNet fluorescence restoration paper. Self-established sets of STED images (microtubules, mitochondrial inner membrane, ER; 25-55 nm pixels) for denoising and deblurring, DNA-PAINT SMLM images for virtual sampling (under-sampled to well-sampled), and paired volumetric widefield/confocal stacks (1024 x 1024 x 24) for background removal, plus the source training data of the open BioSR and BioTISR datasets.
