  the paper (publisher full text not open access in Europe PMC; bioRxiv returned only the abstract/429),
  so voxel_size_nm is null. Zenodo says "manual annotations of slit diaphragms and foot processes"; the
  preprint abstract mentions 3 classes (background, foot process, slit diaphragm). Image names indicate
  Nephrin and Podocin stains but stains were not confirmed. Zenodo license is CDLA-Permissive-1.0 . enricher:
  channels 2 (ImageJ header); labels 3-valued, half resolution.'
