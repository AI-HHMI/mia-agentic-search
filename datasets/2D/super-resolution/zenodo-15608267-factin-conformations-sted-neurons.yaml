notes: 'factin-conformations-dataset.zip (9.3 MB, 158 .tif files = 79 images plus 79 _mask.tif) listed with tools/peek_archive.py. The paper (bioRxiv 2025.06.06.656993; read as the preprint PDF, whose own licence is CC-BY-NC-ND while the Zenodo record is CC-BY-4.0) states the dataset has 79 images with manual expert ground truth annotations, used as a test benchmark for patch retrieval; no train/test split is provided in the record. The number of annotators and annotation tool are not stated in the sources read. Image shape and bit depth were not read from the TIFF headers.'
