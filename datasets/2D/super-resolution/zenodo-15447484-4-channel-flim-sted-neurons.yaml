title: 4-channel STED dataset - fixed neurons with four spectrally separated protein markers (FLIM-STED unmixing)
short_name: 4-channel STED/confocal fixed neurons (unmixing)
description: Training and testing images from the Latent Unmixing paper. Real 4-channel confocal/STED images of
  fixed neurons from primary cell cultures and acute brain slices, with three combinations of four neuronal proteins
  (MAP2/PSD95/VGLUT1/FUS; GFP/Tau/betaCaMKII/F-actin; gephyrin/VGLUT1/VGAT/PSD95). Each marker was spectrally separated,
  giving ground-truth unmixed single-marker channels. 30 training and 12 test images, 20 nm pixels.
