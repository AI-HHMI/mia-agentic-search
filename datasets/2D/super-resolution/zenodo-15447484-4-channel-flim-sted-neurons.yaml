notes: 'Record holds 42 loose .tif files (00-29 training, 00_test-11_test testing; 641.6 MB total) listed from the Zenodo API; the TIFFs were not opened, so axes and bit depth (and whether lifetime/time-bin dimension is stored) are not verified, and dimensionality 2D is inferred from the description. The task is spectral/lifetime unmixing of overlapping fluorophore signals (other), not segmentation; ground truth is the spectrally separated channels, not manual labels. The paper (arXiv 2312.05357 v3, Appendix E and imaging parameters) says the data were acquired on an Abberior Expert Line STED microscope (20 nm pixels, 250 time bins of 80 ps). Authors on the record are listed as in Zenodo; the arXiv authors differ. Paper data availability points to https://s3.valeria.science/flclab-unmixing/index.html, which was not fetched.'
