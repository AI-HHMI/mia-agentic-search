notes: 'Record holds 42 loose .tif files (00-29 training, 00_test-11_test testing; 641.6 MB total) listed from the
  Zenodo API. The task is spectral/lifetime unmixing of overlapping fluorophore signals (other), not segmentation;
  ground truth is the spectrally separated channels, not manual labels. The paper (arXiv 2312.05357 v3, Appendix
  E and imaging parameters) says the data were acquired on an Abberior Expert Line STED microscope (20 nm pixels,
  250 time bins of 80 ps). Authors on the record are listed as in Zenodo; the arXiv authors differ. Paper data availability
  points to https://s3.valeria.science/flclab-unmixing/index.html, which was not fetched. enricher: TIFFs checked:
  2D int16, 4 channels stored as samples (yxc); no lifetime/time-bin axis is stored.'
