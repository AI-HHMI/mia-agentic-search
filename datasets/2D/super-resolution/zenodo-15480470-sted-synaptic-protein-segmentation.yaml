short_name: Synaptic protein cluster segmentation (STED)
description: STED nanoscopy images of synaptic proteins in cultured rat hippocampal neurons with community-annotated
  (Zooniverse) segmentation masks of protein clusters, labelled by shape class (round, elongated, perforated,
  multidomains). Provided as train/validation/test HDF5 files with a PyTorch loader script; released with
  the STED-FM foundation model for STED microscopy.
