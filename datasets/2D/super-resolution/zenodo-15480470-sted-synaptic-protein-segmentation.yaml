notes: 'Zenodo record has 3 HDF5 files (train 444 MB, valid 138 MB, test 153 MB) plus a loader script; the
  record says images were acquired in Wiesner et al. 2020. Annotation structure (masks, per-crop shape classes
  round/elongated/perforated/multidomains, seg_votes, 224 px crops) is read from the loader script; HDF5
  headers were not inspected, so counts of images/crops are unknown. Pixel size 15 nm is stated in the 2020
  paper Methods for its STED imaging; that this record uses the same setting is assumed from the record text
  and not stated per file. Annotation was community-driven (Zooniverse); coverage and annotator count unknown.
  The STED-FM paper itself was not found in Europe PMC, so was not read. Record says dataset is for Synapses
  segmentation in STED-FM.'
