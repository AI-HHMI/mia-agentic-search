notes: Six zips (CCPs, ER-sec61b, ER-KDEL, Microtubules, OMM-tomm20, IMM-cox8a) plus a data information.txt; total about 18.5 GB from the Figshare API file sizes. CCPs.zip was listed with peek_archive - per cell folder (cell1...) it holds WF_raw.tif (raw 100-frame widefield stack), WF<n>.tif (LR), SR<n>.tif (8x SMLM reconstruction) and SR_locs.csv (localizations). Other zips not listed, so total image count is unknown (the paper says 188 raw SMLM sets). Pixel size 16.25 nm is for the SR images; LR images are 130 nm. Paper license is CC BY-NC-ND 4.0 but the dataset record states CC BY 4.0 (the paper's data availability says CC-BY). Data are spread over six file downloads, so download_url is null. The Nature page was inaccessible; paper read from Europe PMC.
