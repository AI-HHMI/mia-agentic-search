title: 'DL-SMLM: a biological imaging dataset containing paired widefield and SMLM super-resolution images'
short_name: DL-SMLM paired TIRF and SMLM subcellular images
description: Aligned low-resolution TIRF (130 nm pixels, 100-frame raw stacks) and SMLM super-resolution (16.25 nm pixels, 8x) image pairs of five subcellular structures in fixed COS-7 cells (clathrin-coated pits, ER membrane, ER lumen, microtubules, mitochondrial outer and inner membrane), with raw localization tables. 188 raw SMLM sets for training super-resolution models.
