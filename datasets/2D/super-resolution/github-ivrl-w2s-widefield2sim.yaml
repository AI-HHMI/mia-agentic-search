title: 'W2S: Microscopy Data with Joint Denoising and Super-Resolution for Widefield to SIM Mapping'
short_name: Widefield-to-SIM denoising and SR pairs (W2S)
description: 'Paired widefield and SIM fluorescence images of human cells for joint denoising and super-resolution:
  120 fields of view in 3 channels (360 image sets), each with 400 raw widefield captures (512x512 px), averaged
  into five noise levels (1, 2, 4, 8, 16 frames), a noise-free 400-frame average and a 1024x1024 px SIM
  image as high-resolution target; 240 sets for training and 120 for testing.'
