notes: 'No license stated in the GitHub README, no LICENSE file (404) or the arXiv paper (arXiv only licenses the paper); the
  AI4Life-MDC24 Zenodo subset (120 widefield images, zenodo.org/records/10925783) is CC-BY-4.0, which is not
  evidence for the full set. The download host datasets.epfl.ch was blocked by the sandbox proxy, so the
  zip contents, file formats (tiff taken from the Zenodo subset description), total size and the voxel size
  could not be checked; pixel size is said to be in the paper supplement, which was not read. The paper full
  text is not in Europe PMC; details come from the arXiv HTML version. Counts: 120 FOVs x 3 channels = 360
  sets, 240 train / 120 test, widefield 512x512 and SIM 1024x1024 px (from the paper). Organism given as
  Homo sapiens from "human cells" in the paper; cell type not stated in the sources read. The AI4Life-MDC24
  Zenodo record is a 120-image subset of this data.'
