description: 75 single-shot STED-FLIM images (1024 x 1024 px) of live COS-7 cells stained with Nile Red
  analogs, with manually drawn ground-truth masks for mitochondria, lipid droplets and endoplasmic reticulum,
  used to train a VGG16-UNet that demultiplexes the three organelles.
