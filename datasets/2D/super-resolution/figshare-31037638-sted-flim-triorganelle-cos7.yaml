notes: 'Figshare lists data.rar (368 MB, the 75 images and masks per paper Data availability) and Saved_models.zip
  (3.9 GB, pretrained models, not part of the training data). enricher: RAR5 headers read by range requests:
  500 files, 75 per mask folder (er, lipids, mito) and raw folder (Intensity, color, comp), 49 in raw/lifetime,
  plus colorbar.png; n_items 75 -> 500 (all files). Masks verified in the listing. Pixel size: paper Methods
  say STED images were acquired at 22.4 nm x 22.4 nm or smaller, not stated per image, so voxel_size_nm
  is left null. Organism not stated (cell line COS-7 only). n_items counts every file.'
