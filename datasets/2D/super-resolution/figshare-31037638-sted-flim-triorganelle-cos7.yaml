notes: 'Figshare lists data.rar (368 MB, the 75 images and masks per paper Data availability) and Saved_models.zip (3.9 GB, pretrained models, not part of the training data). The rar could not be listed with peek_archive; a 64 KB range request showed only the first entry, data/masks/er/CN-1.tif, so the TIFF format is confirmed for masks only and image file format and exact folder layout are unverified. Pixel size: paper Methods say STED images were acquired at 22.4 nm x 22.4 nm or smaller, not stated per image, so voxel_size_nm is left null. Organism not stated in the Figshare record or paper text read (cell line COS-7 only). The dataset is one of the paper''s supporting data; the images carry fluorescence lifetime colouring (RGB pseudocolour STED-FLIM images, 1024x1024), per paper Methods. n_items counts images; masks are separate files.'
