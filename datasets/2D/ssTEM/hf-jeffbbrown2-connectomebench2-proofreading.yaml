notes: 'HF listing: 515 files, 121.4 GB (train 403, val 55, test 48 parquet shards, metadata sidecars,
  croissant.json); 401,170 samples. Main branch is the V1 submission; the card says the v2 revision matches
  the arXiv paper. Licence: card says "other" and asks users to comply with upstream licenses (MICrONS
  and H01 CC BY 4.0, FlyWire and fish1 CC BY-NC 4.0 per the paper), so spdx is custom. Labels are expert
  proofreading edits from CAVE, not pixel annotations; EM views are 224 x 224 slices (render extents 1.5-2.5
  um, voxel size not stated). Modality ssTEM is a best fit; H01 and fish1 acquisition not checked. enricher:
  dimensionality 2D (was 3D): the EM inputs are single 224 x 224 PNG slices (xy, xz, yz, oblique) per
  the card.'
