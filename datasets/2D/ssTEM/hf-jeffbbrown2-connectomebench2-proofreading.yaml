  notes: 'Listing: tools/listing.py on the HF dataset (515 files, exact sizes, 121,357,867,279 B). Array
    facts are from the dataset card (README), not from reading shards: parquet needs pyarrow, which is
    not an allowed inspection library. Proofreading labels are row columns (sample_type, same_neuron,
    task_routing), not files. Download: no single archive; shards are direct resolve/main URLs on huggingface.co,
    but a parquet shard is not an image file TensorSwitch converts. Voxel size not found; checked: card
    (render extents only), paper (per the harvester). Upstream volumes have their own voxel sizes, but
    the renders are resampled to 224 px views.'
