description: 120 ssTEM images (9,958 x 9,959 px, 2.18 nm/pixel) clipped from the RC1 rabbit retina connectome volume, with pixel-level binary labels of cell membranes (organelle membranes excluded) from three annotation rounds (final round = ground truth, earlier rounds also released). Released with a segmentation competition (Track 1, Track 2) with train/val/test folders.
