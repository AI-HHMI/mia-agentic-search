  notes: 'Not inspected: the data are only on Google Drive, MEGA and Baidu Cloud (GitHub README). The
    Drive embeddedfolderview returns the folder title U-RISC-DATA but no entries (the folder page needs
    JavaScript/sign-in). The MEGA public-folder API (a=f, recursive) returns only the shared root folder
    node, no child files, so that mirror looks empty or restricted. Baidu needs an extraction code and
    a client, so it was not tried. No listing, header or sample, so formats, dtypes and size are unknown
    and there is no estimate (no dtype or format). Voxel size 2.18 nm/px in x and y from the paper ("captured
    at the resolution of 2.18 nm/pixel across both axes using SerialEM"); 2D record, so z is null. Track
    2 images are downsampled, so their pixel size differs (not stated). No direct download: Drive, MEGA
    and Baidu are folder shares, not file links, and the paper Data Availability only points to the GitHub
    repo. None of these hosts is on the TensorSwitch allowlist.'
