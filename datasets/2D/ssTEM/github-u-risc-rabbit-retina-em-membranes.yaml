notes: 'Read the GitHub README and the paper (PMC9038176, all but its last 4,236 characters). Data are
  on Google Drive, MEGA and Baidu Cloud (links in the README), so the files could not be listed: image/label
  file format, total size and the exact image count on disk were not verified (formats [other] means unknown;
  README examples mention PNG for evaluation outputs only). The 120 images come from the paper. MIT is
  the license of the GitHub repository; the paper does not give a separate dataset license. Splits per
  paper: Track 1 50 images (30 train incl. 10 validation, 20 test); Track 2 70 downsampled images (40
  train, 30 test). Microscope model not named in the paper (Leica UC6 ultramicrotome, SerialEM). Annotations
  are cell membranes; stored as the semantic-segmentation type. enricher: paper DOI 10.3389/fncom.2022.842760
  from Europe PMC (was null); paper says test-set ground truth was kept private, so label/ may hold training
  labels only (not verifiable).'
