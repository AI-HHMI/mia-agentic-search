notes: 'Data are hosted on Google Drive, MEGA and Baidu Cloud (links in the GitHub README), not in the repo, so no
  file listing was read; file formats, total size and exact split counts are not stated in the README or paper
  (format therefore "other"; only PNG is named, for the evaluation outputs). The 120 images, 2.18 nm/pixel,
  9,958 x 9,959 px and three annotation rounds come from the paper; the paper says the ground truth of the
  challenge test set was kept private. The MIT license is the GitHub repository license and its coverage of
  the Drive-hosted data is not explicit. The underlying RC1 images are described as available on request
  (Anderson et al. 2011). Published 2022-04 in Frontiers in Computational Neuroscience; the preprint is from 2021.'
