notes: 'License: record CC-BY-4.0 covers processing/docs only; each domain keeps its source terms (Drosophila
  VNC CC BY-NC-SA 3.0, mEMbrain domains none stated, others point to project pages), so custom. Voxel
  size differs per domain (PROVENANCE.md): snemi3d 6x6x30 nm, kasthuri-pp 3x3x30, lucchi-pp and multiclass
  5 nm isotropic, drosophila-vnc 4.6 nm/px (45-50 nm sections); others not stated, so null. Modality:
  ssTEM = drosophila-vnc; FIB-SEM = lucchi-pp, multiclass; other EM for the rest. organisms: Mus musculus
  = snemi3d, microns_basil, whole-mouse-brain, dhanyasi-P14-mouse-cerebellum, kasthuri-pp, lucchi-pp,
  multiclass; Drosophila melanogaster = flywire, drosophila-vnc, fly-brain-mito-benchmark; Caenorhabditis
  elegans = c-elegans-dauer-stage; Octopus vulgaris = octopus-*; katz-lab-berghia-connective is Berghia
  (species not stated, not listed). n_items = 3243 raw/mask pairs. Creator Anonymous on Zenodo. Several
  domains re-package other catalog records.'
