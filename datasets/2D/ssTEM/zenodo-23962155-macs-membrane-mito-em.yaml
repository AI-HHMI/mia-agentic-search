notes: 'License: the Zenodo record is CC-BY-4.0 but only for the processing/documentation; each domain keeps its source terms
  (Drosophila VNC CC BY-NC-SA 3.0, mEMbrain domains no license stated, others point to project pages), so custom. Voxel size
  varies per domain and is not given in the record or README tables. Only VNC (ssTEM) and Lucchi++/EPFL (FIB-SEM) are typed
  in the README, hence other. n_items = pairs summed from README split tables (2409 membrane + 834 mito). Zenodo lists the
  creator as Anonymous. The preprint is linked by title and by the record text (data used to evaluate MACS), not by a Zenodo
  related identifier. Several domains re-package separate catalog records (SNEMI3D, EPFL hippocampus, MICrONS, FlyWire); this
  is a distinct processed 2D train/val/test benchmark.'
