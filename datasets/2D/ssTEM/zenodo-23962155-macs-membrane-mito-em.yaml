title: 'MACS Datasets: Membrane and Mitochondria EM Segmentation Benchmarks'
short_name: MACS membrane and mitochondria EM benchmarks
description: Fourteen electron-microscopy segmentation domains (9 cell-membrane, 5 mitochondria) prepared
  for evaluating MACS multi-source domain adaptation in connectomics. Each domain is split into train/val/test
  PNG images with binary masks. Domains are processed versions of public datasets (SNEMI3D, MICrONS, FlyWire,
  Lucchi++, Kasthuri++, EPFL hippocampus, Drosophila VNC, mEMbrain sets and others).
