title: 'U-RISC: ultra-high-resolution rabbit retina ssTEM with cell-membrane annotations'
short_name: Rabbit retina cell-membrane segmentation (ssTEM)
description: 120 ssTEM images (9,958 x 9,959 px, 2.18 nm/pixel) clipped from the rabbit retinal connectome
  RC1, with binary cell-membrane ground truth made in three rounds of manual annotation. The release
  has an original-size track, a 1,024 x 1,024 downsampled track, and the first two intermediate annotation
  rounds. Released with an open segmentation competition.
