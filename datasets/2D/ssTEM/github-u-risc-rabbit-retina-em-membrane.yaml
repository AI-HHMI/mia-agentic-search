title: U-RISC, ultra-high-resolution EM dataset of cell membrane annotations (rabbit retina)
short_name: Rabbit retina cell membranes (ssTEM)
description: 120 ssTEM images (9,958 x 9,959 px, 2.18 nm/pixel) cut from the rabbit retinal connectome volume RC1, with
  iteratively hand-annotated cell-membrane (neuron boundary) masks. Released with train/val/test tracks from a segmentation
  competition (Track 1 full size, Track 2 downsampled to 1,024 x 1,024) and the intermediate annotation rounds.
