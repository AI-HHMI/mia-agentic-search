notes: 'Data are on Google Drive / MEGA / Baidu Cloud (links in the README); the Drive folder was fetched but its file listing
  was not readable, so the folder layout comes from the README (U-RISC-DATA/imgs/Track1|Track2|Track2_original_size,
  label, Human_Annotation_Process). The README and eval script use PNG, so formats is png (file extensions of the images
  themselves not listed). The MIT license is the repository license (copyright 2021 Emma) and may not state terms for the
  RC1-derived images; the source RC1 volume is separately available on request. Paper reports 120 images; Track 1 has 50
  (30 train, 20 test, test ground truth private in the competition) and Track 2 70 images, so labelled-image counts per
  split in the released archive are not verified. Total size not stated.'
