short_name: U-RISC rabbit retina membranes (ssTEM)
description: 120 ultra-high-resolution (9,958 x 9,959 px, 2.18 nm/pixel) serial-section TEM images clipped from the rabbit retinal
  connectome RC1, with iteratively hand-annotated binary cell-membrane ground truth (final plus 1st and 2nd annotation rounds).
  Released with the U-RISC competition split (Track 1 original size, Track 2 downsampled to 1,024 x 1,024 px) and evaluation code.
