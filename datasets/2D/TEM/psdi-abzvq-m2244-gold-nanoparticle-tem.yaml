notes: Most images are synthetic (TEMPOS), with automatic annotations from known geometry; only the 24-image validation set is experimental and manually annotated (VIA); the validation COCO JSON lists 24 images and 1,109 particle annotations. The linked paper (Salley et al. 2020) describes the experimental TEM source, not this dataset, so it states no image counts or pixel size. Pixel size and train/test image counts not stated on the record page or the API record; images.zip could not be listed (presigned S3 redirect rejected range listing). size_bytes is the sum of the listed file sizes (about 1.25 GB). Record page shows a newer version exists.
