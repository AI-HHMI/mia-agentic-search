notes: 'Shapes come from HDF5 headers read with probe.py: images 216, 172 and 258 crops of 512x512x1; maps 216, 172 and 258
  crops of 512x512x2 (float64). Six .h5 files, so no single download_url; files are at https://zenodo.org/records/3755011/files/<name>.
  The file names pair Au crops (Au_Bal_MedFilt_cutimages images with Au_Bal_unFilt_cutimages maps), CdSe crops (Bal_MedFilt_CdSeRelabel512Images
  images with Bal_unFilt_CdSeRelabel512Images maps) and mixed Au/CdSe crops (Bal_MedFilt_AuCdSeDots images and maps_v2); the
  pairing is inferred from names and matching counts. Pixel size, labelling method and the meaning of the two map channels
  are not stated on the dataset page, in file headers (no attributes) or in the paper abstract; the paper is not open access
  (Europe PMC has no full text), so only the abstract was read. Related to but distinct from zenodo-6419024 (Au-only, 2022)
  and dryad-d1sp93 (407 HRTEM images, 2023) from the same group.'
