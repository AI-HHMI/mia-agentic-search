title: HRTEM micrographs of Au and CdSe nanoparticles with semantic segmentation maps
short_name: Au and CdSe nanoparticle HRTEM segmentation (TEM)
description: 'Three paired HDF5 sets of 512x512 high-resolution TEM micrograph crops of gold and cadmium selenide nanoparticles
  with two-channel semantic segmentation maps for neural network training: 216 Au crops, 172 CdSe crops and 258 Au/CdSe crops
  (646 image/map pairs). Images are median-filtered; the Au and CdSe map files are listed as unfiltered-image maps in the
  file names. Released with the U-Net segmentation and stacking-fault classification pipeline of Groschner et al.'
