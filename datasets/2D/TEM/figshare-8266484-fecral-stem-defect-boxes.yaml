notes: 'DataSetFinal.zip (peek_archive): images/ (165 jpg) and bounding_boxes/ (txt, a few duplicate-named copies); FigsFinal.zip holds figures only. Paper: 165 STEM images, random 12-image test subset not marked in the archive, training set augmented to 918 by the authors (not included). Pixel size ranges 0.14-0.87 nm/pixel (paper SI), not given per image, so null. Classes per paper: open loops (single/double ring), closed elliptical loops, closed dots; class-index mapping unconfirmed. Modality TEM as schema has no STEM. Cites the arXiv preprint; journal version not located.'
