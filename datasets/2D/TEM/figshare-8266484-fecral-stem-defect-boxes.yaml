notes: 'DataSetFinal.zip: images/ (165 jpg, 1024x1024 greyscale) and bounding_boxes/ (165 txt, a few "-
  Copy" names), plus allimages.txt (165), trainimages.txt (153) and testimages.txt (12). FigsFinal.zip
  holds figures, tables and a second copy of the dataset. enricher: splits_provided true (was false):
  the 12-image test subset is listed in DataSetFinal/testimages.txt. enricher: journal version added (Comput.
  Mater. Sci. 2021, doi 10.1016/j.commatsci.2021.110576, named in the code README). Pixel size ranges
  0.14-0.87 nm/pixel (paper SI), not given per image, so null. Classes per paper: open loops, closed elliptical
  loops, closed dots; box files use class indices 0-2, mapping unconfirmed; the training code reads them
  from a folder named Data3TypesYminXminYmaxXmax10, hinting at the coordinate order (not documented).
  Modality TEM as the schema has no STEM.'
