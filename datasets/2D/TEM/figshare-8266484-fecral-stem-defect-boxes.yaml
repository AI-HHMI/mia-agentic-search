short_name: Irradiated FeCrAl STEM defect boxes (TEM)
description: 165 manually labelled STEM images of neutron-irradiated FeCrAl ferritic alloys with bounding
  boxes for dislocation-loop and black-dot defects, used to train a Faster R-CNN defect detector. Each
  image was labelled by at least two groups of researchers in ImageJ; images and box files are provided
  together with a CSV of the plotted results.
