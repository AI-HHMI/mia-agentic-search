notes: 'Hosted on Harvard Dataverse (repository ''other'' because the schema has no Dataverse value). Class counts
  and sizes come from the Dataverse file listing (5,323 TIFF files, 6.68 GB). Paper: images were manually sorted,
  pre-labeled and cropped to 224x224 px; the paper''s own split was 80/20 with 5-fold cross-validation (no split
  files in the dataset). Magnification varied between images and no pixel size is stated on the dataset page or
  in the paper, so voxel size is null. enricher: description corrected, the probed files are 510x512 to 2048x2048
  px, not 224x224 crops. enricher: per-file direct links via /api/access/datafile/<id>; the whole-dataset zip endpoint
  timed out, so download_url stays null.'
