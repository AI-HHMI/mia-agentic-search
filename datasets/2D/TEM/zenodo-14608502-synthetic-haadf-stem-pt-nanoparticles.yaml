notes: 'Synthetic, not experimental: images come from a 3D U-Net surrogate of multislice HAADF-STEM simulation, with CycleGAN variants that imitate
  experimental noise. One zip (48.6 GB, peek_archive: 500,000 files = 300,000 .npy images, 100,000 .cif, 100,000 .pkl; first folder seen is images_cycleGANed, the three variants per sample come from the Hugging Face card). Zenodo
  record has no description text; image size 128x128 and pixel size field come from a Hugging Face repackaging of the same data (Stemson-AI/nanoparticle-size-estimation,
  CC BY 4.0, 19 GB of WebDataset shards), pixel size varies per sample so voxel size is left null. Paper full text in Europe PMC is only a
  short extract, so splits and exact size-label definition were not read.'
