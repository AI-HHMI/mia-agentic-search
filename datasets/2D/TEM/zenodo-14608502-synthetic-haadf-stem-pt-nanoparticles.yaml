description: 100,000 simulated 128x128 HAADF-STEM multislice-surrogate images of platinum nanoparticles
  on support interfaces, each in raw, normalized and CycleGAN-noised variants, with the atomic model (CIF)
  and voxelized structure (pickle) it came from; made to train nanoparticle size estimators and a surrogate
  for multislice simulation.
