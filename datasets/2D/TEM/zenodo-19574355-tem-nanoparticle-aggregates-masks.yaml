short_name: TEM nanoparticle aggregates with masks
description: Workshop deposit with notebooks, pretrained U-Net-family models and a training subset (about 30% of the
  full set) of transmission electron microscopy images of nanoparticle aggregates (Fe, Co, FeCo and FePt samples), with
  binary mask TIFFs extracted from Photoshop annotation layers. 44 TEM images in the archive, 30 of them with masks.
  Intended for teaching U-Net segmentation of nanoparticles.
