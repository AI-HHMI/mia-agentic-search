notes: 'Zip listing (peek_archive) of "Agregates for training TP.zip" (2.17 GB, 104 files): five sample folders; Co150V_C_A1_TM22-36
  has 14 images without masks; Fe300V (11), Fe75V (9), FeCo (5) and FePt (5) have an image TIFF, a PSD with annotation layers
  and a *_MASK.tiff each (30 masked images). The record also holds six zips of pretrained models (0.5-4.7 GB), notebooks
  and scripts, not counted in size_bytes. Pixel size is encoded in file names (0.043-0.220 nm per pixel, "[nm]") and varies
  per image, so voxel_size_nm is null. No paper is cited; microscope and annotation procedure are not described on Zenodo or
  GitHub. Mask semantics (particle vs background) inferred from the workshop description of binary U-Net segmentation.
  Only a ~30% subset of the full training data is released. Non-commercial, share-alike license.'
