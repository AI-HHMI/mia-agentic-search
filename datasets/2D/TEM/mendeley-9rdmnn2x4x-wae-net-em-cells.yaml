description: 1,053 two-dimensional electron micrographs of whole cells in seven datasets (human pancreatic carcinoid
  BON cells by FIB-SEM and serial-section TEM, Jurkat and primary human T cells, murine J558L B cells by TEM), each image
  paired with a pixel-wise manually labelled ground-truth mask (cytoplasm, nucleus, plus chromosomes or mitochondria in
  some datasets), as PNG image and mask folders per dataset.
