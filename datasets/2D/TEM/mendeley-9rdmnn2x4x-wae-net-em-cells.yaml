notes: 'Mendeley files: Datasets.zip (369 MB, the images), Pretrained weights.zip (2.1 GB), Codes.zip. Datasets.zip listed
  with peek_archive: 2,106 PNGs, Dataset 1 to 7 each with Images and Ground truth mask folders (323, 167, 83, 135, 122, 115,
  108 pairs = 1,053). The paper Table 1/2 lists 117 images for Dataset 3 but the archive holds 83 pairs. Pixel sizes per paper
  Table 1: 9, 9, 26.3, 6.41, 2.33, 15.26 and 15.74 nm for datasets 1 to 7; dataset 1 is FIB-SEM, 2 and 3 serial-section TEM,
  4 to 7 TEM; voxel_size_nm is null because it varies per dataset. Datasets 4 to 7 are public 2D datasets from Morath et al.
  2013; the paper states all seven were pixel-wise manually labelled by biologists (labels for datasets 1 to 3 by one of the
  authors). organisms: Homo sapiens = Dataset 1-5 and 7, Mus musculus = Dataset 6 (J558L). modality: Dataset 1 FIB-SEM, others
  TEM. enricher: download_url = Datasets.zip on S3 (the unsigned target of Mendeley''s file_downloaded redirect; was null).'
