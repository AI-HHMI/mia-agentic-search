notes: 'Mask annotation procedure per study metadata: manual delineation in Napari, converted to QuPath polygons, used to train Cellpose Cyto2, proofread with Segment Anything. Pixel size, total size, exact image count and author list were not stated in the study metadata or the file listing (the listing JSON, ~3 MB, was read only in part, roughly 1,100 entries; crops/masks pair by matching numeric file name within each Folder, but some folders list masks without visible crops). The metadata Publication section carries no citation and no dataset paper could be identified, so none is listed (the cited DOI 10.1038/s41596-025-01153-9 is a specimen-preparation protocol). Raw TEM micrographs are listed separately in Shafiei_Raw-TEM-Micrographs_SubmissionList.json, which was not read.'
