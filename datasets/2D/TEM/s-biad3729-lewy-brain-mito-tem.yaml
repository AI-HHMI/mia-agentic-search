title: Correlative Ultrastructural Mapping of Lewy Pathology Reveals Regional Diversity in Parkinson's and Dementia with Lewy
  bodies
short_name: Human brain mitochondria segmentation (TEM)
description: Raw TEM micrographs of ultrathin sections of post-mortem human brain (substantia nigra, entorhinal cortex, anterior
  cingulate cortex, hippocampal CA2) from Parkinson's disease and Dementia with Lewy bodies cases, acquired in a correlative
  light and electron microscopy workflow. The submission includes manual instance segmentation of mitochondria (crops with
  masks) for entorhinal cortex and substantia nigra images.
