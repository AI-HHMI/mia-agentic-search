notes: 'Annotation (study metadata + paper Methods): 43 EM images manually annotated in Napari, used to fine-tune Cellpose
  Cyto2 in QuPath; output segmentations proofread with SAM, so most masks are model output proofread. Masks are per-object
  crops; Shafiei_Raw-TEM-Micrographs/ (252 full TEM micrographs, ~153 GB) has no masks. enricher: paper 10.1007/s00401-026-03039-w
  found by title (was none); authors from study metadata (was empty); size 160,456,840,426 B and n_items 16845 crop/mask pairs
  from the BioStudies files API (were null). Pixel size not stated anywhere checked; the paper says images were acquired at
  three different magnifications, so there is no single voxel size.'
