notes: 'Counts (528 train + 12 validation pairs), 3964x3964 px size and the 5.69 GB size come from the Hugging Face card and the
  dataset-viewer first-rows API. Pixel size, annotation procedure, label integer values and whether sections are TEM (the project
  website says the framework is optimized for transmission EM of mouse fibers) were not found: the bioRxiv full text returned
  HTTP 429 and Europe PMC has only the abstract; the project website points to Roboflow for annotations. Data are stored as
  image/label columns in Parquet (not a listed format, hence other). Annotation coverage assumed dense from the semantic masks
  but not confirmed. date_published is the Hugging Face last-modified date.'
