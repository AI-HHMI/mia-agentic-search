title: MicroStructFormer EM Ultrastructure Dataset
short_name: Mouse axon EM ultrastructure masks (TEM)
description: 540 electron microscopy images (3964x3964 px; 528 train, 12 validation) with paired semantic segmentation masks
  for axonal ultrastructure in gene-edited (hypomyelinated) mice - abnormalities, mitochondria and mitochondria-like organelles,
  and periaxonal space. Used to train and fine-tune the MicroStructFormer (Mask2Former-based) model.
