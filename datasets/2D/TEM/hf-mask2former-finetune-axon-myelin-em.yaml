description: Electron microscopy images of myelinated fibers from gene-edited (hypomyelinated) mice with paired semantic segmentation masks, used to train and fine-tune the MicroStructFormer (Mask2Former) model. The label map lists abnormalities, mitochondria and mitochondria-like organelles, and periaxonal space. 540 image/mask pairs (528 train, 12 validation) in Parquet files.
