notes: 'Data are Parquet files (image and label columns, 528 train + 12 validation rows; download_size 5.69 GB), so formats is other; the encoding of the embedded images (PNG/TIFF) was not inspected. Pixel size, microscope and annotation procedure are not on the dataset card, the project website or the preprint abstract; the preprint is not open access (Europe PMC has abstract only), so Methods could not be read. The project website says the dataset references and annotations are also hosted on Roboflow. The dataset card names three target groups: abnormalities, mitochondria (and mitochondria-like organelles), periaxonal space. License CC-BY-NC-SA 4.0 (non-commercial).'
