notes: 'Training images are simulated (paper), not experimental; only 3 experimental images are included.
  Record has 4 zips (training 2.21 GB, models 92.7 MB, experimental 5.3 MB, synthetic 0.83 MB); n_items
  31,470 = 25,176 train + 6,294 val (npy headers). enricher: 10 classes (BCC Fe 100/110/111, FCC Cu 100/110/111/211,
  HCP Ti 0001/10-10/2-1-10) from the JSON label maps. enricher: voxel size left null because subsets differ:
  training patches 0.12 A/pixel (paper Methods: "1 pixel corresponds to 0.12 A"), experimental Cu ~0.0880
  A, Ti and Fe 0.1245 A (paper). size_bytes now the zip total from the listing (was 3,134,623,790).'
