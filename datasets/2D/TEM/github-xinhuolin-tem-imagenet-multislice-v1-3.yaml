short_name: Multislice-simulated ADF-STEM atoms (TEM)
description: Multislice-simulated ADF-STEM images with per-image ground truth for atom-column segmentation (circular
  and Gaussian masks), atom positions and radii, and restoration targets (noise-free, background-free, 2x interpolated
  and super-resolved images). The multislice counterpart of the TEM ImageNet linear-model library, from the AtomSegNet
  project.
