notes: 'Simulated images: a linear imaging model (projected potential convolved with the PSF, plus Poisson and scan-jitter
  noise), so ground truth is exact by construction; a multislice variant exists in a separate repository (TEM-ImageNet-Multislice-v1.3),
  not covered here. Folder listing on GitHub: 15 folders, image/ and position/ each list ~14364 entries (GitHub
  truncated the view at 1000 files, 13364 omitted), so 14364 images is inferred from that count. Image size (256x256
  in the paper example) and pixel size are not stated for the library; the repository has no license file and the
  README is one line, the paper license (CC BY 4.0) covers the article only, so license is unknown (the AtomSegNet
  app repo is MIT). The repo is on GitHub, which may be git-lfs or plain; total size not seen. The paper full text
  was read on PMC. Data also browsable at TEMImageNet.com (not fetched).'
