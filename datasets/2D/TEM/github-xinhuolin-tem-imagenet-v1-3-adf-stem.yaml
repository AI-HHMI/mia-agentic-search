notes: 'Simulated images: a linear imaging model (projected potential convolved with the PSF, plus Poisson and scan-jitter
  noise), so ground truth is exact by construction; a multislice variant exists in a separate repository (TEM-ImageNet-Multislice-v1.3),
  not covered here. enricher: git tree lists 244189 files, 14364 per folder, so n_items 14364 is confirmed. enricher: images
  probed 256x256 uint8 PNG (2x folders 512x512); pixel size not stated (FOV 8-40 A varies); the repository has no license
  file and the README is one line, the paper license (CC BY 4.0) covers the article only, so license is unknown (the AtomSegNet
  app repo is MIT). enricher: plain git, no LFS. The paper full text was read on PMC. Data also browsable at TEMImageNet.com
  (not fetched).'
