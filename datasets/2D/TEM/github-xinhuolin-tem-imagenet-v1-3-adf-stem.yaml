title: TEM ImageNet v1.3 (simulated ADF-STEM training library)
short_name: Simulated atomic-resolution ADF-STEM (TEM)
description: Simulated annotated ADF-STEM images of atomic-resolution materials (Pt, NiO, SrTiO3, Si, graphene,
  MoS2 and others) from a linear imaging model, each with ground truth for atom-column segmentation (circular and
  Gaussian masks), atom positions and radii, and restoration targets (noise-free, background-free, 2x and super-resolved
  images). Training library for AtomSegNet.
