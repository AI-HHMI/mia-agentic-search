description: Electron microscopy images with matching semantic segmentation masks used to train and fine-tune the MicroStructFormer model for axonal ultrastructure in gene-edited (hypomyelinated) mice. 540 image/mask rows (528 train, 12 validation). The class map lists background, abnormality, mito-like organelle, mitochondria, mitochondria outside axon, periaxonal space, axon and myelin.
