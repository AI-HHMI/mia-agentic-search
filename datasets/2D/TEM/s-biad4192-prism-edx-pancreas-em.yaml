notes: Only 5 large multichannel mosaics, so borderline on size. Linked paper (doi
  10.1016/j.crmeth.2026.101669) is not in Europe PMC and doi.org returned 404, so
  its Methods were not read and it is not listed in publications. Pixel size 2.5 nm
  is the Supra55 STEM value on the dataset page; Talos images are 4 nm, the 1966 micrograph
  unknown. Masks include EDX-derived GT plus PRISM/ResNet50 predictions; only GT are
  training labels. Split is made by the code (README), not provided. License from
  the BioStudies record; README states none.
