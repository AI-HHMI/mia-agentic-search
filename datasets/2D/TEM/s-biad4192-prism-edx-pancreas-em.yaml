title: Ultrastructure segmentation in electron microscopy based on energy-dispersive X-ray imaging
short_name: Pancreas EM organelle masks from EDX (STEM)
description: Large STEM/HAADF electron microscopy mosaics of human pancreas islet tissue with simultaneously
  acquired EDX data, plus ground-truth (EDX-derived) structure maps and masks for glucagon granules, nuclei,
  insulin granules, telolysosomes and zymogen granules, and PRISM/ResNet50 predictions; one digitized
  1966 guinea pig pancreas TEM micrograph is included. Released for training EM segmentation models (PRISM).
