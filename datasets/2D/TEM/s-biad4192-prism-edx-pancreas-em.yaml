notes: '5 multichannel mosaics plus split per-channel TIFFs. Paper doi 10.1016/j.crmeth.2026.101669 not
  resolvable (doi.org/Crossref 404, not in Europe PMC). Only GT (EDX-derived, automatic) and Expert 1/2
  (manual, Fig 4/5 only) masks are training labels; PRISM/ResNet50 are predictions. Split is made by the
  code, not provided. License from the BioStudies record. organisms: Cavia porcellus = Figure6B_* and
  Segmentation_Figure_6B/; Homo sapiens = all other files. enricher: voxel size 2.5 nm removed (was x/y
  2.5): parts differ (acquisition 2.5 nm Supra55 / 4 nm Talos per page; files store 8 nm, Fig 6B 1.545
  nm). annotations.source automatic -> mixed (GT EDX-derived for Fig 2/3; Expert masks manual for Fig
  4/5).'
