notes: 'Zip listing: dataset_01/02/03 (20+14+38 images) with matching seg_NN.tif masks (72), plus 7 .h5 files and code; counts match the paper (1,099 vesicles). Pixel sizes vary per image (0.26-2.42 nm as written in the paper), so voxel_size_nm is null. License: project page says free for noncommercial and research use, commercial use needs author permission (custom); the bioimage.io Zenodo descriptor 6559930 lists MIT for the descriptor only. Binary vs per-instance masks not inspected; instance-segmentation is inferred. Organisms inferred from sEV sources named in the paper. size_bytes is uncompressed (compressed 925.5 MB).'
