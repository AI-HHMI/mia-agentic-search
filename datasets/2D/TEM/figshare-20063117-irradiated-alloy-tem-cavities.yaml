notes: 'The item has 4 files: datasets.zip (6.46 GB, the images and annotations), the trained Mask R-CNN
  notebook and Colab tool zips, and an Excel table of cavity fit data. datasets.zip (listed with peek_archive,
  3,929 files: .jpg, .png and .json) holds several overlapping packagings of the same images (cavity_CNL_original,
  cavity_CNL_cleaned, cavity_nome, cavity_nome_cnl_allimages with 389 train/test images, and cross-validation
  folds CV0 to CV3), so counts are not additive; n_items is the 389 images of the combined database (the
  paper states 400 images and more than 34,000 cavities). Pixel size is not given in the dataset item
  and varies with the image magnification (the paper gives image widths of about 195 to 768 nm in its
  example figure), so voxel_size_nm is null. Annotation tool VGG Image Annotator is linked in the paper
  reference list; the JSONs are COCO format (enricher).'
