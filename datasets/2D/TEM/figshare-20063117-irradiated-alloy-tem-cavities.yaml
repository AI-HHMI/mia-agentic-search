description: About 400 bright-field transmission electron micrographs (over- and under-focused) of nanoscale
  cavities in irradiated alloys, from the Canadian Nuclear Laboratory (CNL, Inconel X-750 reactor spacer
  springs) and the University of Michigan NOME laboratory, with more than 34,000 labelled cavities, packaged
  in train, validation and test folds for Mask R-CNN training.
