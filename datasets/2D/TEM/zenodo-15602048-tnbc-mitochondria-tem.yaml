notes: 'Mask archive (5 MB) fully listed: 209 PNG masks in groups DRP1-KO (22 tra_val + 4 tst), HCI-010 (17+4), Mixture (125 tra_val), PIM001-P (32+5), i.e. train/val and test folders per group. The 2.3 GB image archive (a plain-gzip tar) was only partly listed (first member data/DRP1-KO/tra_val/slide_images/rwt_2_HM_1.tif, 4 MB TIFF); image count assumed to match the masks and n_items is the mask count. Size is both archives. The paper (bioRxiv 10.1101/2025.02.19.635300) full text returned 429, so only its abstract (via the bioRxiv API) was read: 11,039 manually annotated mitochondria across 125 micrographs for training. Pixel size, microscope and magnification not found. Organism list from abstract (PDX = human tumors in mice; mouse muscle cells).'
