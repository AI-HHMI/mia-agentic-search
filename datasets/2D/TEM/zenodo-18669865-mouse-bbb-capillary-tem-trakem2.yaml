notes: 'EM dataset.zip (peek_archive, 1727 files): 173 .tif (8.7 GB), 174 .xml.gz analysis files, trakem2 mipmap support folders. README: images converted from .dm3 (JEOL TEM-1400 Plus) to RGB TIFF; S4V3 and S5V1 analysis files are corrupted. Paper Methods name the delineated structures (endothelium, pericytes, endfeet, basement membrane, tight junctions, endfoot mitochondria); annotations are TrakEM2 analysis files (not mask images) that I did not open, so class set and type are inferred. Pixel size and magnification not stated in paper, README or page. Latest version (concept DOI 10.5281/zenodo.14900869) of records/14900870 cited by the paper.'
