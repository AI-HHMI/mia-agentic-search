id: hf-microstructformer-em-axon-ultrastructure
title: MicroStructFormer EM ultrastructure segmentation of axons, myelin and mitochondria in gene-edited mice
short_name: Mouse axon ultrastructure segmentation (TEM)
description: 540 electron microscopy images of myelinated fibres from gene-edited (hypomyelinated) mice, each paired with
  a semantic segmentation mask (528 train, 12 validation). Mask classes in id2label.json are background, abnormality, mito-like
  organelle, mitochondria, mitochondria outside axon, periaxonal space, axon and myelin. Released for training and fine-tuning
  the MicroStructFormer model.
