notes: 'The download is a Google Drive folder (not listed from here), so file names, formats, sizes, image count and mask encoding were not seen;
  n_items = 21 is the number of skeletal muscle images the paper used for fine-tuning (the page does not state a count) and the page states masks
  exist for each TEM image. The paper says skeletal muscle images lacked a pre-existing gold standard and that segmentation was semi-automatic
  with user correction, so mask provenance (manual vs model-assisted) is unknown (source unknown). No license: the page says the data and models
  are available for public access and use and carries a UNIST all-rights-reserved footer. Pixel size not stated (JEM-1011 at 80 kV, RADIUS CCD camera).
  The public Lucchi++ benchmark used in the same paper is a separate dataset.'
