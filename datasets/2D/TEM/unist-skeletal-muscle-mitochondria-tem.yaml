notes: 'Download is a Google Drive folder (mitoseg_deploy/: datasets/Skeletal_muscle/{train,test}/{input,target} plus two DeepPI-EM .pth checkpoints).
  No license: page says data and models are available for public access and use, footer Copyright UNIST All Rights Reserved; GitHub README says
  research use; repo has no LICENSE. Pixel size not stated (JEM-1011 80 kV, RADIUS CCD). The public Lucchi++ benchmark used in the same paper
  is a separate dataset. enricher: formats [tiff, png] and n_items 27 (21 train + 6 test pairs) from the Drive folder listing (was other / 21).
  enricher: annotations.source manual (paper: skeletal muscle gold standard based on manually segmented masks, Photoshop) (was unknown). enricher:
  files are 2560 x 2560 px, not the 2048 x 2048 the paper states.'
