title: Mouse skeletal muscle mitochondria TEM dataset with segmentation masks (UNIST Yoon Lab)
short_name: Skeletal muscle mitochondria masks (TEM)
description: 2048 x 2048 px transmission electron micrographs of mouse skeletal muscle (quadriceps, wild type and mdx), with segmentation
  masks of mitochondria for each image, released by the UNIST Yoon Lab alongside the DeepPI-EM interactive mitochondria segmentation
  framework (21 images were used for fine-tuning). Shared as a Google Drive folder together with CEM500k pre-trained and DeepPI-EM
  models trained on Lucchi++ and on this skeletal muscle set.
