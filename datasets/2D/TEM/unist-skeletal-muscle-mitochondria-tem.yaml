title: Mouse skeletal muscle mitochondria TEM dataset with segmentation masks (UNIST Yoon Lab)
short_name: Skeletal muscle mitochondria masks (TEM)
description: 2560 x 2560 px transmission electron micrographs of mouse skeletal muscle (quadriceps, wild type and mdx), with segmentation masks
  of mitochondria for each image, released by the UNIST Yoon Lab alongside the DeepPI-EM interactive mitochondria segmentation framework (27 image/mask
  pairs, 21 train + 6 test). Shared as a Google Drive folder together with CEM500k pre-trained and DeepPI-EM models trained on Lucchi++ and on
  this skeletal muscle set.
