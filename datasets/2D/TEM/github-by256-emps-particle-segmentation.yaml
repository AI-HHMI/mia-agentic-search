notes: 'Original project site imagedataextractor.org returned 503, so data location comes from the GitHub repo (images/, segmaps/,
  metadata.csv, train.csv, test.csv, viadata.json) and the Dataset Ninja mirror (Supervisely format, ~110.8 MB, Kaggle mirror).
  CC BY 4.0 is stated by Dataset Ninja and the paper links CC BY 4.0; the GitHub repository carries an MIT LICENSE file (likely
  code). Images come from journal figures reproduced with publisher permission, so reuse terms may be more restricted than
  the stated license. Image modality is mixed SEM and TEM (paper search terms cover both); schema has no plain SEM value,
  so other is listed. enricher: images/ and segmaps/ (465 PNGs each) listed from the git tree and probed; annotations verified.
  Pixel size not stated (scale bars only in images). Split from paper: 366 train/validation, 99 test, grouped by source publication;
  train.csv has 366 lines and test.csv 99.'
technical:
  method: sample
