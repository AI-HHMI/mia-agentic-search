  notes: 'Zip central directory listed: 580 members, 10,752,156 B. Probed SEGMENTATION test patch (gray
    uint8 256x256 PNG, 31,552 B) and its mask (gray uint8 256x256, 770 B). Sample (one pair): raw 38..219,
    mean 71.6; mask values {0: 60768, 255: 4768} -> binary. value_range from one sample. One YOLO label
    file read (one box, class 0). No README/LICENSE inside the zip. File names (*_png.rf.<hash>_patch_N)
    look like a Roboflow export; the SSP paper (arXiv 2610.12216) describes 282 patches of 640x640 from
    50 MiniTEM 2048x2048 16-bit images (FOV 3 um), so these 145 256x256 8-bit patches were likely resized;
    no pixel size is stated for them. voxel size not found; checked: PNG headers, Zenodo API record, zip
    members (no docs), SSP paper full text (PDF), TEM Virus Dataset record on main. Zenodo dropped many
    TLS connections during this run.'
