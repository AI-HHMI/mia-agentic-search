notes: 'Derived subset, not a re-deposit: the catalog record mendeley-x4dwwfwtw3-tem-virus-benchmark holds the full 1,245-image,
  22-class TEM Virus Dataset with point/centreline annotations only; this deposit adds 145 adenovirus patches with bounding
  boxes (YOLO) and binary masks, and its own split. Image size and pixel size are not stated on the Zenodo page or in
  the arXiv abstract; the SSP paper full text was not read (arXiv abstract page only) and the Matuszewski paper is not
  open access (abstract only), so voxel_size_nm is null. Who produced the reference masks is not stated on the deposit
  page (annotations.source unknown). 580 files listed in the zip: 145 patches per version (DETECTION images + labels, SEGMENTATION images
  + masks).'
