title: 'SSP Adenovirus Dataset: TEM Image Patches with Detection and Segmentation Annotations'
short_name: Adenovirus detection and masks (TEM)
description: 145 transmission electron microscopy image patches of adenovirus, cut from the adenovirus class of the TEM
  Virus Dataset (Matuszewski and Sintorn, 2021) with the semi-automatic stride-independent patching (SSP) tool. Provided
  in two task-specific versions with the same train/validation/test split (87/26/32 patches) - YOLO-format bounding boxes
  for detection and binary foreground masks for segmentation.
