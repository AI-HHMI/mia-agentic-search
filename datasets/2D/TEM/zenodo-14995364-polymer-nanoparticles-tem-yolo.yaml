notes: 'Listing of data.zip: annotation_nano-1024 train/valid/test = 47/11/7 jpg images with matching YOLO .txt labels;
  data.yaml gives nc 5 (LCN, MCV, TMCV, V, scal_bar). models.zip holds YOLOv8n/s/m weights (not data). The description
  cites a study on multicompartment vesicles in PISA of graft copolymers, but no paper is linked to this deposit and
  Europe PMC did not find that title, so none is listed. Pixel size is not stated (a 200 nm scale bar is annotated in
  the images); microscope not stated. Small dataset. Licence conflict: Zenodo states CC-BY-4.0 but the Roboflow export
  in data.yaml says BY-NC-SA 4.0; check before use. Not biological material.'
