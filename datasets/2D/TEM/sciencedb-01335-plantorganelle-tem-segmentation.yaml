schema_version: '1.2'
id: sciencedb-01335-plantorganelle-tem-segmentation
title: Plantorgan hunter dataset - TEM images of plant cells with chloroplast, mitochondria, nucleus and
  vacuole masks
short_name: Plant organelle segmentation (TEM)
description: 902 high-resolution transmission electron microscopy (TEM) images (3230 x 4800 px, TIFF)
  from 19 plant species with manually annotated masks (PNG label images; the page also names LabelMe JSON
  files) for four organelles - chloroplast, mitochondria, nucleus and vacuole. Includes dataset splits
  used to train OrgSegNet, a 3D-cell slice-stack archive, a Krippendorff's alpha sub-dataset annotated
  by four annotators, and an external "unseen" set (rice mutants, M. sativa, E. haichowensis under different
  treatments).
