notes: 'Sizes from the PSDI file API: synthetic 227 MB, experimental 53 MB, segmented
  140 MB (420 MB total). Zip listings: synthetic_cobalt has 1000 PNG under train/
  plus instances_train.json, via_region_data.json and a generator settings json; experimental_cobalt
  has 256 PNG plus 1 json; experimental_cobalt_segmented has 256 PNG plus 2 CSV. All
  labels are synthetic by construction or model predictions, so only the synthetic
  set has exact ground truth; no manual annotation of the experimental images. Pixel
  size not stated on the record or in file listings; the related paper reports 86
  pm pixels for its own 4k images but does not tie this to these 512x512 patches,
  so left null. The record page and its files API lists no zip member timestamps;
  the related paper (Scott lab) is linked on the record as supplemented-by. Different
  from the already catalogued PSDI gold nanoparticle record (sgvf0-j3g53): another
  material, different zips and a different record.'
