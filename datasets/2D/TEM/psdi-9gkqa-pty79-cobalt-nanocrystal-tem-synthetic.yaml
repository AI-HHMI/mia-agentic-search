description: 'PSDI record with three zips: 1,000 synthetic TEM images of cobalt nanocrystals generated with the TEMPOS software
  (PNG, COCO instances_train.json, VIA region json and the generator settings json), 256 experimental TEM image patches (512x512
  PNG, with COCO polygons in instances_val.json), and the same 256 experimental images segmented by a Detectron2 model trained
  on the synthetic data, with two CSV tables of extracted particle information.'
