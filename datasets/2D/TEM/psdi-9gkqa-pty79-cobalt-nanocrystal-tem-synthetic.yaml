notes: 'Sizes from the PSDI file API: synthetic 226,781,457 B, experimental 53,314,702 B, segmented 140,058,016 B. Synthetic
  labels are exact by construction (TEMPOS generator settings json in the zip). Pixel size not stated on the record or in
  the files; the related paper reports 86 pm (and 33-67 pm) pixels for its own patches but does not tie them to these 512x512
  images, so left null. Different from the PSDI gold nanoparticle record (sgvf0-j3g53). enricher: experimental_cobalt.zip
  also holds instances_val.json (COCO, 256 images, 3,765 particle polygons, info "Training labels mary-scott data"), so the
  experimental images are labelled too; how those labels were made is not stated, so annotations.source is unknown (was automatic).
  The segmented zip holds RGB overlay renderings of model predictions, not label maps.'
