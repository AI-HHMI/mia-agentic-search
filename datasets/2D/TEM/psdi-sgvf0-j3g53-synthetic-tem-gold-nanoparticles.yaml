notes: 'PSDI "AI Ready Datasets" record (version 1.0.0; this is the latest version, index 2; an earlier
  record abzvq-m2244 with the same title and data files exists). Counts read from the COCO JSON: train
  1,501 images (image list in the first 3 MB of the train JSON), test 149 images / 8,718 annotations,
  validation 24 experimental images / 1,109 annotations; n_items = 1,674. Most images are synthetic (TEMPOS,
  simulated ground truth), only the 24 validation images are real and manually annotated. Pixel size and
  TEM acquisition details are not given in the record or in the cited paper text read; the cited Nature
  Communications paper is the source of the experimental TEM images, not a description of this dataset.
  enricher: both zips listed via range requests (train 1,501, test 149, val 24 PNGs; 24 val masks); annotations
  verified.'
