    /content URLs, so the zips were listed and members read with a small range-request script (zipfile
    + PIL). Samples (one each, compressed bytes): val/L1-1-D.png 2,705,462 B, L mode uint8 2362x2362,
    8..255; its mask 77,463 B, uint8 {0,255}; train/0.png 695,425 B, uint8 1024x1024, 0..255. Train/test
    sizes are 1024 px per the description and the one sampled train image. Value ranges are from one sample
    each. No pixel size in the README, COCO info/images entries or record. data.download_url stays null:
    the dataset is 8 files (no single archive); direct links are the files API /content URLs listed in
    the tree.'
