id: zenodo-23062808-lacey-carbon-tem-masks
title: Lacey carbon grid image dataset (TEM images with manual masks)
short_name: Lacey carbon grid TEM segmentation
description: TEM images of lacey carbon support films from routine nanocrystal searching experiments, with manually
  prepared lacey-carbon segmentation masks. Provided as 256x256 training patches with masks (including augmented
  copies), full-size test images with masks, and a full-image archive that also contains the original H5/DM4/TIFF
  acquisition files. Used to train a model that finds lacey carbon support during automated crystal searching.
