notes: 'Not a biological sample (materials-science TEM), but microscopy images with manual masks and a
  CC-BY-4.0 license. The record links no paper, so none was read. Pixel size is not stated on the record;
  the description says it is stored in the native H5/DM4/TIFF metadata. patches_for_training.zip holds
  20,544 TIFF files (images/ and masks/, including augmented copies named *_aug_N, so about 10k image/mask
  pairs); test_all_images.zip holds 138 PNG files (images/ and masks/, 135 + 3 irregularly named). enricher:
  TEM_images_of_lacey_carbon.zip on Zenodo is truncated (ends inside images/TiO2am__0460.tif; no masks,
  images_raw, CSV or README), so pixel size from raw metadata is unavailable. size_bytes corrected to
  the listing total (was 724,789,641).'
