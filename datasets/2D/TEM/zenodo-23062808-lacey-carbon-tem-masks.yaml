  notes: 'listing.py (Zenodo, --expand-zips): 3 zips, exact sizes; TEM_images_of_lacey_carbon.zip has
    no central directory. Streaming it (200,560,640 B, in memory) and walking local headers gave 287 members
    (231 png, 56 tif under images/) before the data ends mid-member, so the upload looks truncated; masks/,
    images_raw/, image_mapping.csv and README.txt are not in the file. Samples: patch tif uint8 256x256
    LZW 38..255; its mask {0,255}; test mont_0000.png L 512x512 0..255; its mask RGBA 512x512, 81 values.
    Value ranges from one file each. Pixel size not found: patch/test files have no calibration, the record
    says it lives in the raw H5/DM4/TIFF files, which are missing from the truncated zip; no paper.'
