notes: 'Not a biological sample (materials-science TEM), but microscopy images with manual masks and a CC-BY-4.0 license.
  The record links no paper, so none was read. Pixel size is not stated on the record; the description says it is stored in
  the native H5/DM4/TIFF metadata, which was not inspected. patches_for_training.zip holds 20,544 TIFF files (images/ and masks/,
  including augmented copies named *_aug_N, so about 10k image/mask pairs); test_all_images.zip holds 138 PNG files (images/
  and masks/, 135 + 3 irregularly named). TEM_images_of_lacey_carbon.zip (200 MB) could not be listed with peek_archive (no zip
  end-of-record found), so its contents are taken from the record description. size_bytes is the sum of the three zips.'
