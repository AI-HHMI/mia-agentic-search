title: 'DeepContact training data: Labelme-annotated EM images of mitochondria, ER and plasma membrane'
short_name: DeepContact mito/ER annotated EM images (TEM/SEM)
description: 'Training data for DeepContact (J Cell Biol 2022): 2D electron microscopy images of cultured cells (U-2 OS, TM4)
  and mouse seminiferous epithelium with polygon annotations made in Labelme (labels seen in the JSON files: Mito, ER, Plasma
  Membrane). Three zips (cell_data, sem_data, tem_data) hold TIFF/JPEG images with paired Labelme JSON; two further zips hold
  test data and a DeepContact vs manual annotation comparison.'
