notes: 'Sizes from the figshare API (5 zips, 3,225,925,604 B). Voxel size not stated on figshare or in file headers; paper
  says images were resized to 10 nm patches (5 nm for cultured-cell EM) but per-file pixel size not stated, so left null.
  Paper is CC-BY. Label classes vary per folder (Mito, ER, Plasma Membrane); lipid droplet labels not seen in the files checked.
  Modality: the SEM images are likely ROTO-SEM per file names but not verified, hence other after TEM. Train/val split 3:1
  per paper, not provided as files. enricher: license GPL-3.0-or-later (figshare API says "GPL 3.0+"; was GPL-3.0-only). enricher:
  n_items 254 labelled images = 67 tem + 73 sem + 109 cell_data, from the zip listings (was null); the 20 test TIFFs have
  no labels.'
