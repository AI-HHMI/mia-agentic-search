notes: 'Sum of the five zip sizes from the figshare API (cell_data 2.07 GB, sem_data
  0.85 GB, tem_data 0.11 GB, comparison zip 0.12 GB, test zip 0.08 GB). Zip listings:
  sem_data 72 TIFF + 72 JSON, tem_data 67 JPEG + 67 JSON, cell_data 95 TIFF + 14 JPEG
  with 109 JSON. Voxel size not stated on figshare page; paper says images were resized
  to 10 nm patches (5 nm for cultured-cell EM) but per-file pixel size not stated,
  so left null. Dataset page lists license GPL 3.0+ (figshare), the paper itself is
  CC-BY. Label classes vary per folder (Mito, ER, Plasma Membrane); lipid droplet
  labels not seen in the files checked. Modality: the SEM images are likely FIB/ROTO-SEM
  per file names but not verified, hence other after TEM. Split train/val is 3:1 per
  paper but not provided as files.'
