notes: The ScienceDB page is rendered client-side, so license (CC BY-NC-SA 4.0), size (593,321,905,146 bytes in 19 files) and dates
  come from the DataCite record and the content description from the Research Square preprint; no file listing was seen, so file formats
  are unknown (formats other). The data is an aggregate of images from many sources (many redistributed from public EM repositories),
  so original licenses may differ from the stated CC BY-NC-SA 4.0. It has no manual annotations; it is meant for self-supervised
  pre-training and for restoration (super-resolution) models. The modality list names TEM, FIB-SEM, cryo-ET and other because the
  14 technologies are not enumerated in the text read; pixel sizes and organisms vary across sources. Dimensionality is 2D because
  the 4,002,802 items are described as micrographs (2D and 3D sources were sliced). Creators are those of the DataCite record; the
  preprint has more authors.
