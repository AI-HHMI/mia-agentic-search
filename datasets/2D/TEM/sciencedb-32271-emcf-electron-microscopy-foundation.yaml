short_name: EMCF electron microscopy foundation dataset
description: 4,002,802 curated electron micrographs spanning 14 EM technologies (TEM, SEM, FIB-SEM, cryo-ET
  and others) and six biological kingdoms, compiled from the authors' own acquisitions and from public
  repositories and publications (EMPIAR, BossDB, OpenOrganelle, Nanotomy and others). Built for pre-training
  EM foundation models (masked-autoencoder representation learning and image restoration / super-resolution).
