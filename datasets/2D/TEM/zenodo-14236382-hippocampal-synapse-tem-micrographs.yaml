title: Synapses in transmission electron micrographs
short_name: Hippocampal synapse vesicles (2D TEM)
description: 13 transmission electron micrographs of Schaffer collateral and mossy fiber synapses in mouse
  organotypic hippocampal slices (20,000x, 0.592 nm pixel), stored as HDF5 with the raw micrograph. A
  "test" folder carries IMOD synaptic vesicle instance masks and a mask of the annotated area; a "train_unlabeled"
  folder holds unlabeled micrographs used for domain adaptation. Re-release of Maus et al. 2020 images
  for SynapseNet.
