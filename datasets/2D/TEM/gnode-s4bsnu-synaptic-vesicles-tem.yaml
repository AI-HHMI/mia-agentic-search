notes: 'Archive listing (peek_archive) shows 87 TIFF images (image_01..image_87, ~4.4 MB each), README,
  LICENSE, datacite.yml and metadata.xlsx; images/patches.zip (255 MB) is served without range requests,
  so its contents were not listed and the pos/neg labelling is taken from the README and paper Methods
  (34,805 40x40 and 6,245 80x80 patches for training, labelled manually). Per-image vesicle coordinates
  used as ground truth for the full-image evaluation (two annotators) are described in the paper but are
  not in this repository. The paper gives 2.27 nm pixel size for the training images (40 px = 90.8 nm);
  per-image pixel sizes may be in metadata.xlsx, which was not read. README notes vesicle labelling was
  often limited to the synaptic terminal, with black masks over other regions, hence partial coverage.
  Landing page license: CC0 4.0.'
