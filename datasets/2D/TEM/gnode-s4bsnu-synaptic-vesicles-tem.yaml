id: gnode-s4bsnu-synaptic-vesicles-tem
title: Automated detection and localization of synaptic vesicles in electron microscopy images
short_name: Hippocampal synaptic vesicle patches (TEM)
description: 87 transmission electron micrographs (TIFF) of mouse hippocampal presynaptic terminals, plus a patches.zip
  of small image patches labelled pos (vesicle in the centre) or neg (no vesicle). The first 50 images were used
  to generate the training and test patches for two CNN vesicle classifiers; the remaining 37 images were used to
  test the full detection algorithm. Released with the Imbrosci et al. vesicle detection algorithm.
