notes: 'Pixel size differs per image (metadata.xlsx "pixel size in nm (1 side)"): 2.27 nm = image_01-19, 22-25,
  28-37, 43-47, 51-61 (49 images, all patch-source images among them); 0.94 nm = 19 images; 1.3 nm = image_66-73,
  77; 0.72 nm = image_78-83; 1.56 nm = image_84-87. So voxel_size_nm is null (enricher; was 2.27 x 2.27). enricher:
  license is CC-BY-4.0. The LICENSE file is the CC BY 4.0 text and the link points to it; the landing page and datacite.yml
  call it "CC0 4.0 Attribution" (was CC0-1.0). enricher: download_url is now the DOI archive (618.8 MB, includes
  patches.zip). The GIN master.zip only holds a 64-byte git-annex pointer for patches.zip. The 87 full images carry
  no vesicle labels; only the patches are labelled (by folder). Per-image vesicle coordinates used for full-image
  testing are not in the dataset (paper). Black masks cover non-terminal regions in some patch-source images (README).'
