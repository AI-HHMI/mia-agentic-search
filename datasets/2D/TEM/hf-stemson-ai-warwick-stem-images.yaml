description: 19,769 experimental scanning transmission electron microscopy (STEM) images from the University of Warwick, collected 2010-2018 across hundreds of materials projects and instruments, repackaged as a WebDataset of 170 TAR shards (32-bit float TIFF plus JSON metadata). Unlabelled; the card positions it for self-supervised pre-training of microscopy foundation models. Derived from Jeffrey Ede's Warwick Electron Microscopy Datasets.
