notes: 'Unlabelled STEM micrographs: usable because the card explicitly offers them for self-supervised pre-training. Counts and formats are from the card; the TAR shards were not opened (WebDataset tars, so not listed with peek_archive). The shard files in the repo tree sum to 171 GB (the card says about 160 GB, the page sidebar 258 GB). Modality is STEM, entered as TEM (no STEM value in the schema); pixel size is not stated and the images are mixed 2048/1024/512 px or other. The original Warwick datasets (GitHub wiki says public domain; arXiv 2003.01113 shows CC BY 4.0) are mirrored on Zenodo and Google Drive; this record is the Hugging Face WebDataset repackaging, whose card states CC-BY-4.0. The original dataset paper (Machine Learning: Science and Technology) is not open access, so only the arXiv abstract page and the GitHub wiki were read. The wiki also lists TEM (17,266 images) and exit-wave sets, not covered here.'
