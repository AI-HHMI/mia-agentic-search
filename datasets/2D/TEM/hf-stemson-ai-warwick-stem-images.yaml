    00001, 00004.tif (plain, float32, 512x512, uncompressed); sampled 00001.tif (sample.py, 1,048,836 B): float32 9,884-73,705,
    mean 35,823, matching its metadata.csv row. Shards: read 124 kB of train-0169.tar by range (tar header only). Whether
