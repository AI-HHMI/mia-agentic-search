id: zenodo-3689490-warwick-em-96x96
title: 96x96 Electron Microscopy Images
short_name: Warwick 96x96 STEM and TEM images
description: Three NumPy arrays of 96x96 single-channel electron micrographs for rapid machine-learning
  development - 19,769 crops from full STEM images, the same 19,769 STEM images area-downsampled to 96x96,
  and 17,266 TEM images area-downsampled to 96x96. Images come from many projects and scientists at the
  University of Warwick and are a small-image variant of the Warwick Electron Microscopy Datasets. No
  labels; the images were used to train autoencoders / VAEs and partial-scan completion networks.
