notes: 'Unlabeled by design, ML-partitioned (paper: VAEs, partial-STEM completion); no explicit self-supervised
  statement. Files per Zenodo API: stem_crops.npy, stem_downsampled.npy (728.8 MB each), tem_downsampled.npy
  (636.5 MB); counts and [N,96,96,1] 32-bit shapes are from the paper (arXiv 2003.01113), arrays not opened.
  Paper says train/val/test images are concatenated in that order, with no split files here, so splits_provided
  is false. Pixel size, instrument and sample not stated for the pooled, downsampled images. Paper main
  repository record is Zenodo 3834197 (code and links only).'
