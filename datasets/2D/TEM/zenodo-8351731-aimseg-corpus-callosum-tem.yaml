notes: 'Files are three .rar archives (Validation_Dataset_v1 14.6 MB, Control_Dataset 8.8 MB, Classifiers_v1 56.6 MB);
  peek_archive cannot list RAR, so the contents and image file format were not seen (formats is other for that reason)
  and annotations_verified is false. Per the paper Methods: JEOL JEM-1400 Plus TEM, original 4096x4096 px at 2.1046 nm;
  the dataset used for training and validation was resized 4x to 1024x1024 at 8.4182 nm, which is the value used here,
  but the Zenodo files may hold either version. Only 8 large images in total (5 validation + 3 control), a small
  but densely annotated set, annotated by a single expert. The Zenodo record obsoletes 10.5281/zenodo.8021007.'
