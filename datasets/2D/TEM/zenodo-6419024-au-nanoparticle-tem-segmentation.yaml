description: 'Four paired HDF5 image/label sets of transmission electron micrographs of Au nanoparticles (nominal 2.2, 5,
  10 and 20 nm) on ultrathin carbon substrates, with per-pixel labels for semantic segmentation of nanoparticles versus background:
  62 images in total (14 at 2.2 nm, 8 at 5 nm and 15 at 10 nm, each 4096x4096; 25 at 20 nm, 2048x2048). Released with a study
  of how receptive field and network complexity affect neural-network segmentation of TEM images.'
