notes: 'Image counts and shapes come from HDF5 headers read with probe.py (images/labels datasets: 5 nm 8x4096x4096, 2.2 nm
  14x4096x4096, 10 nm 15x4096x4096 float32; 20 nm 25x2048x2048, images int32); the 62 total is their sum. No download_url
  because there are 8 separate .h5 files rather than one archive; files are at https://zenodo.org/records/6419024/files/<name>.
  Pixel size is not stated on the dataset page, in file headers (no attributes) or in the paper abstract; the paper is not
  open access (Europe PMC has no full text), so only the abstract was read, and voxel_size_nm is null. Labelling method is
  not described on the Zenodo page; annotations.source is therefore unknown. Related but different from dryad-d1sp93-hrtem-nanoparticle-segmentation
  (Sytwu/Rangel DaCosta/Scott 2023, 407 HRTEM images of Au, Ag and CdSe): this is the earlier 2022 Au-only deposit with different
  files.'
