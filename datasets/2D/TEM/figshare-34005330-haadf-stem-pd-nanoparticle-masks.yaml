notes: 'Figshare (UCT ZivaHub) API record v1, CC BY 4.0, published 2026-10-12: 60_Evaluation_frames.zip
  (215.5 MB) plus staple_annotation_agreement_results.xlsx. peek_archive lists 480 PNGs: raw (60), annotation
  pass 1/2/3 (120 each, a frame copy plus its _mask) and STAPLE consensus (60 masks). The description
  also mentions probabilistic STAPLE outputs and a manifest, but neither was seen in the zip listing.
  No associated paper is cited on the record ("associated research project" only), so no publication is
  listed. The masks are an annotator-repeatability consensus, which the authors say should not be read
  as absolute physical ground truth. Frames come from 31 operando image series (names like Pd-Ni_H2-350C,
  Pd-Ni_CO-H2-250C). Sizes: zip 215,547,505 B + xlsx 22,279 B. enricher: frames and masks are 1024x1024
  uint8 grey PNGs; masks binary 0/255.'
