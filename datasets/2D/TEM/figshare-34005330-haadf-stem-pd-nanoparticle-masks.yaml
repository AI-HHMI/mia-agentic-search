title: STAPLE consensus reference masks for nanoparticle segmentation in operando HAADF-STEM frames of Pd and Pd-Ni catalysts
short_name: Pd/Pd-Ni nanoparticle masks (HAADF-STEM)
description: 60 operando HAADF-STEM frames of Pd and Pd-Ni catalyst nanoparticles, selected from 31 image series to cover
  varied particle morphology, contrast, background and neighbouring particles. Each frame was manually segmented three
  times by one annotator; the three binary masks were combined with STAPLE into a final binary consensus mask. The record
  holds the raw frames, the three annotation-pass masks and the STAPLE consensus masks.
