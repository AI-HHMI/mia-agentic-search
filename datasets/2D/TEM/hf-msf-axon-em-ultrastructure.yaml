notes: License is CC-BY-NC-SA 4.0 as stated on the dataset card (no SPDX entry for it in the schema enum
  list used here, so custom; card also forbids commercial use). Data are Parquet (HF auto-converted),
  12 shards; image/label byte formats not inspected. Pixel size, microscope and image dimensions not stated
  on dataset card, project page or the preprint text read (preprint says per-image scale came from a calibration
  table not listed; model input 384x384). Preprint full text via Europe PMC unavailable (not open access);
  bioRxiv page read. Label class encoding not documented on the card. Authors on the card are only the
  HF user; preprint authors are Deng, Miao, Khadra, Peterson, Bagheri. Preprint says the data are on this
  HF repo; annotations drawn manually then corrected by experts over several rounds of model prediction
  review. Dataset card also points to a Roboflow project (not fetched). Annotation masks not seen in a
  file listing beyond the label feature in the card metadata.
