title: Virus Texture Dataset v1.0
short_name: Virus texture patches, 15 classes (TEM)
description: 1,500 41x41 px texture patches (100 per class, 15 virus types) extracted automatically from objects segmented
  in transmission electron microscopy images, each labelled with its virus class. Provided as 16-bit PNGs and an 8-bit resampled
  version, with a class-name CSV, 10-fold cross-validation indices and a mask.
