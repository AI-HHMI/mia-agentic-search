notes: 'Small patch dataset (41x41 px), not full micrographs; patches were extracted from objects segmented with the method
  of Kylberg et al. 2012 (J. Microscopy 245:140-147, doi 10.1111/j.1365-2818.2011.03556.x), so labels come from the extraction
  pipeline and the page warns classes may not be fully discriminable. Pixel size, license, organism and annotation source
  are not stated on the dataset page, the zip listing or classNames.csv; the paper''s full text could not be retrieved (Europe
  PMC returned 503, publisher paywalled), so it is not listed in publications. Zip listing (peek_archive) shows 1500 PNG files.
  enricher: size 9,107,720 B from the full file listing (was the ~2.7 MB page estimate).'
