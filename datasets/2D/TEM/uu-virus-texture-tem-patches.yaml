  notes: 'Listing (listing.py, file-listing): the 7 files linked from the page, 9,107,720 B, with 1500 PNG members in each
    zip (the .7z files duplicate the zips). Probed class-001-sample-001-16bit.png (41x41 uint16 grey, deflate) and mask.png
    (41x41, 1-bit, read as bool). Sampled that 16-bit patch (range 795-1540, one sample) and the 8-bit one (0-255). sample.py
    failed on mask.png (bool PNG: numpy percentile on bool), so its values come from the probe only. 10-fold_cross-validation_indices.csv
    lists names as .tif although the files are .png (the page says the same). Voxel size not found; checked: PNG headers (no
    pHYs reported), dataset page, author''s home page, zip listing, classNames.csv; J. Microscopy 2012 paper paywalled and
    Europe PMC returned 503; the EURASIP 2013 paper page served a bot check. License not found: dataset page, author home
    page and the zip listing state none. Download: the 16-bit zip is a direct file and its members read by range, but host
    user.it.uu.se is not on TensorSwitch''s fetch allowlist.'
