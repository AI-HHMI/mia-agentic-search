notes: 'peek_archive of the four zips: region.zip 859 TIFF + 859 .seg.nrrd (training, partially annotated for 5 region
  labels), glycogen.zip 100 TIFF + 100 .seg.nrrd (subset of the region images, partially annotated glycogen vs
  non-glycogen), test.zip 92 TIFF + 92 .seg.nrrd (fully annotated test images), test_ss.zip 84 TIFF without masks
  (subsarcolemmal test images, validated by manual point counting). Each image is about 4.2 MB. n_items = 859 + 100 +
  92 + 84 = 1135 and the glycogen set overlaps the region set. Pixel size 0.77 nm from the paper Methods. Record also
  contains two PyTorch weight files (region_model.pth, glycogen_model.pth). size_bytes is the Zenodo total (about 4.5 GB),
  rounded. Zenodo page links the bioRxiv preprint; the PLOS ONE version was read for Methods.'
