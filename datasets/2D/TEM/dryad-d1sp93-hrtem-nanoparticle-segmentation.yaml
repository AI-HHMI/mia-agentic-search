notes: 'Dryad API record and full file listing (40 files: 11 per-session zips of raw dm3 plus labels, 26 HDF5 Images/Labels
  files, 2 metadata CSV, README) read. Paper (Microsc Microanal 2024) is not open access: only the abstract was read
  (Europe PMC); methods come from the Dryad record (single human labeler in LabelBox, processing: x-ray artifact
  removal, flat-field, standardization, 512x512 patches). Pixel size 0.02-0.042 nm/pixel varies by session, so
  voxel_size_nm is null; numbers of patches per HDF5 were not read. Raw zips were not listed. n_items is the 407
  raw images stated in the record. Raw images are dm3 (not a schema format, so formats lists only hdf5). Dryad total is 33.7 GB.
  Related: preprint arXiv 2306.11853 and a Materials Data Facility copy (10.18126/z4mr-xwk5).'
