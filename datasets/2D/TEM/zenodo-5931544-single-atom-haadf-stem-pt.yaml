notes: 'Zip (555.7 MB) listed with peek_archive: 229 original images in 09_all_original_images_tif (226 false-colour PNG copies), 24 manually labelled ground-truth images with 24 CSV coordinate files (02_groundtruth_atomic_positions_manual), 10 of them also with SAC-CNN labels and segmentation. Manual labels cover only the 24-image ground-truth set; remaining images carry model (SAC-CNN) predictions only, hence source mixed and coverage partial. Pixel size 0.0293 nm is the ImageJ calibration read from the TIFF headers (probe.py), not stated on the record or in the abstract. The paper is not open access (JACS); only the abstract was read, so microscope and acquisition details beyond HAADF-STEM (file names indicate 15 nm HAADF) were not verified. The ground-truth TIFFs are float32 and the originals uint32. Related but different from the already catalogued STEM atom-locating benchmark (mdf-e73h-3w6n).'
