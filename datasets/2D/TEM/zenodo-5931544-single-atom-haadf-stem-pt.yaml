notes: 'Zip lists 229 original TIFFs (09_all_original_images_tif), 226 false-colour PNG copies, 24 manually labelled ground-truth images with 24 CSV coordinate files (21 Pt + 3 Fe); other images carry SAC-CNN predictions only, hence source mixed and coverage partial. Pixel size 0.0293 nm is the ImageJ calibration in the TIFF headers; Readme.txt says ''see .tif for pixel size'', and 512 px x 0.0293 nm = 15 nm matches the ''15nm'' file names. Paper not open access (JACS); only the abstract was read. enricher: formats + png (copies, overlays, segmentations); size from full listing. Related to but different from the STEM atom-locating benchmark mdf-e73h-3w6n.'
