notes: 'Terms on the page: research purposes only, no commercial use, citation required (custom). Twelve tar.bz2 archives (data + masks per cell type) under lmb.informatik.uni-freiburg.de/resources/datasets/bio/data/ (the page''s PrMo data link points to a 404 path; bio/index.html links the working one). Masks: 43/135/124/122/115/108 (BMMC, Jurkat, PrMo, PrHu, J558L, HuBlast). organisms: Mus musculus = BMMC, PrMo, J558L; Homo sapiens = Jurkat, PrHu, HuBlast. enricher: annotations.source proofread (was mixed): paper Methods, BSE automatic region hierarchies merged interactively by a user. Pixel size differs by magnification (paper: 4600x 19.6 nm, 5800x 15 nm, 13500x 6.7 nm; file names also show 10500x/19000x), so voxel_size_nm stays null.'
