  notes: 'Listing: 12 tar.bz2 archives, exact sizes by HEAD (complete). Sampled: all 6 mask archives (3.0 MB) and BMMCdata (34.4 MB); 2 masks per cell type and 3 BMMC images read. Raw: uint8 1024x1024, value_range from 3 images ([0,255]). Masks: uint8 1024x1024 PackBits, 2-3 unique values in {85,170,255}. Data archives other than BMMC not opened, so raw counts are verified only for BMMC (43 = 43 masks). Voxel size not set: paper Methods give pixel size per magnification (4600x 19.6 nm, 5800x 15 nm, 13500x 6.7 nm; unit printed in Symbol font as um), and cell types mix magnifications (file names: 4.6x, 5800x, 10500x, 13500x, 19000x); TIFF headers carry no calibration (72 dpi, DM scale 1.0). Download: archives are direct (206, range requests) but host lmb.informatik.uni-freiburg.de is not on the TensorSwitch allowlist, and tar members cannot be fetched one by one; no single whole-dataset archive.'
