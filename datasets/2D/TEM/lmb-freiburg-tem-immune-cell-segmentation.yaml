title: Segmentation Dataset for Transmission Electron Microscopic Cell Recordings
short_name: Immune cell TEM segmentation, 6 cell types
description: TEM images of six immune cell types (bone-marrow-derived mast cells, Jurkat cells, primary mouse B cells, primary human B cells, J558L cells and human blasts) with semi-automatically produced segmentation masks, released by the Freiburg computer vision group (LMB) to accompany a cell surface area study. 647 mask files in six per-cell-type archives.
