notes: 'Terms on the page: research purposes only, no commercial use, citation required (custom, no SPDX id). Twelve tar.bz2 archives (data and masks per cell type) under lmb.informatik.uni-freiburg.de/resources/datasets/bio/data/; sizes from HTTP HEAD, total 511,180,092 bytes. The six mask archives were opened and hold 43, 135, 124, 122, 115 and 108 TIFF masks (BMMC, Jurkat, PrMo, PrHu, J558L, HuBlast); the data archives were not opened beyond the first BMMC entries (data/BMMC_<n>.tif). Per the paper abstract, TEM slices were segmented semi-automatically into background, cytoplasm and nucleus; the mask value encoding was not checked. Microscope, pixel size, image size and release date are not on the page or in the abstract (full text unavailable: Europe PMC down this run).'
