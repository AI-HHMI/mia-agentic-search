notes: 'Materials-science TEM data (not biological). Pixel size is not one value: the paper states 0.02-0.042 nm/pixel
  depending on magnification (Zenodo description: 0.02-0.042 nm/pixel), so voxel_size_nm is null. Images were recorded
  on a TEAM 0.5 aberration-corrected microscope at 300 kV with a Gatan OneView camera (4096x4096), labelled by hand in
  Labelbox by a single labeller (paper Methods). Zenodo listing: 13 processed dataset pairs (Images/Labels .h5, 512x512
  patches) and per-session zips with raw .dm3 images (one zip inspected: 81 files incl. dm3, jpeg, png). n_items is the
  raw image count from the description; the patch counts were not read. No fixed train/test split files; each processed
  dataset is built from a single imaging session. Raw data is also mirrored on Foundry ML / NERSC (not used). Total
  size is the sum of the Zenodo file listing.'
