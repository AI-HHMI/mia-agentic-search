title: Segmented high-resolution transmission electron microscopy images of nanoparticles
short_name: HRTEM nanoparticle segmentation (TEM)
description: 407 raw high-resolution TEM camera images of crystalline Au, Ag and CdSe nanoparticles on amorphous carbon or
  SiN substrates, each with a hand-labelled segmentation map, plus 13 curated, machine-learning-ready datasets of 512x512
  image patches with matching label patches (HDF5 keys 'images' and 'labels'). Images span magnifications, electron doses
  and nanoparticle diameters (2.2-20 nm).
