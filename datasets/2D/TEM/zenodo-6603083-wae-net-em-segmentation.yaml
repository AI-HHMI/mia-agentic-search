title: Weighted Average Ensemble-Based Semantic Segmentation in Biological Electron Microscopy Images
short_name: Cell organelle segmentation in TEM/FIB-SEM
description: Seven 2D electron microscopy image sets of human and mouse cells (FIB-SEM slices and TEM
  sections) with pixel-wise manual masks of cytoplasm, nucleus, chromosomes or mitochondria. Each set
  has an Images folder and a Ground truth mask folder; the paper uses an 8:2 train/test division of each
  set. Datasets 4-7 are re-used from a published T-cell TEM collection.
