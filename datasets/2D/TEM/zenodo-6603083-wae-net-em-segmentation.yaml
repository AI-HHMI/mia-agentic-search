notes: 'Datasets.zip listed with peek_archive: 2,106 PNGs, i.e. 1,053 images with matching masks in seven dataset folders (323, 167, 83, 135, 122, 115 and 108 pairs). The paper Table 2 lists 117 images for Dataset 3 while the zip holds 83 pairs, so the paper and the archive disagree. Pixel size differs per dataset (paper Table 1: 9, 9, 26.3, 6.41, 2.33, 15.26 and 15.74 nm for datasets 1 to 7), so voxel_size_nm is null. Dataset 1 is FIB-SEM slices, datasets 2 and 3 serial-section TEM, datasets 4-7 TEM. Classes per dataset: cytoplasm and nucleus, plus chromosomes (dataset 2) or mitochondria (dataset 3), plus background. The paper also gives a Mendeley Data copy. Train/test split files were not seen in the archive listing; the paper describes a random 8:2 split. Pretrained weights.zip (about 2 GB) was not opened.'
