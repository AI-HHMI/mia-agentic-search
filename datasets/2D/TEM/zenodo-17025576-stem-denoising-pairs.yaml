notes: 'Listed with peek_archive: noisy.zip 218 files (144 TIFF, 74 JPEG, 175 MB) and ground_truth.zip 218 files (123 TIFF,
  95 JPEG, 129 MB); 197 file names occur in both archives and 21 in each archive occur only there, so 197 pairs match by name
  and all 218 by stem (21 differ in extension). n_items counts all 436 files. The Zenodo description is only the title; the
  README (a generic template) does not state how the clean images were produced; the GitHub README says the images are of
  diverse materials and advises ground truth from traditional denoising, but gives no microscope, pixel size or image sizes,
  and no paper is linked. Modality TEM is the nearest listed value for STEM and is taken from the title only. Because the
  origin of the ground truth is undocumented the pairs may be pseudo-clean. enricher: shapes differ within some pairs (140.tif
  512x512 vs 503x504).'
