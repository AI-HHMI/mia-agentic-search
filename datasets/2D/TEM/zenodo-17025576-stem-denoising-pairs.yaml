notes: 'Listed with peek_archive: noisy.zip 218 files (144 TIFF, 74 JPEG, 175 MB) and ground_truth.zip 218 files (123
  TIFF, 95 JPEG, 129 MB); 197 file names occur in both archives and 21 in each archive occur only there, so about 197
  pairs are directly matchable by name. n_items counts all 436 files. The Zenodo description is only the title; the
  README (a generic template) and the GitHub page do not state how the clean images were produced (acquisition,
  averaging or traditional denoising), the sample or material, the microscope, pixel size or image sizes, and no
  paper is linked. Modality TEM is the nearest listed value for STEM and is taken from the title only. Because the
  origin of the ground truth is undocumented the pairs may be pseudo-clean.'
