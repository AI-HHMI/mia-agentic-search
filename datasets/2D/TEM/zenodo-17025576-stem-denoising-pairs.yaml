short_name: STEM noisy/clean denoising pairs (TEM)
description: Two archives of electron micrographs, noisy.zip and ground_truth.zip, with 218 images each (TIFF and
  JPEG), intended as paired noisy/clean images for training denoising models, plus example scripts for pair
  verification, a seeded train/val/test split and patch generation. File names are shared between the two folders
  for 197 of the 218 images.
