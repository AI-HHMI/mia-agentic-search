notes: 'Landing page, original-16bit.zip listing (peek_archive: 1,500 PNG files, 2.4 MB uncompressed, class-001..class-015 with
  100 samples each) and classNames.csv were read this run; also provided: an 8-bit resampled zip, 10-fold CV index CSV and mask.png.
  The page states 41x41 px patches and 16-bit lossless PNG (its naming example uses a .tif extension, but the zip contains .png).
  The patches come from objects found by an automatic segmentation method, so the class label is the virus type of the source
  sample; the page notes the classes may not be fully discriminable. No license or terms of use are stated on the page; TEM
  magnification, pixel size, staining and who assigned the class labels are not stated on the page. The paper (J Microscopy 2012)
  is not open access, only its abstract was read, which does not describe this dataset. Organism left empty (virus names are in the
  sample field). Well-known benchmark; license unknown so confidence is capped.'
