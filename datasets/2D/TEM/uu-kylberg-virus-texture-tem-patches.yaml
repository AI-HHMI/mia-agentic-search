title: Virus Texture Dataset v. 1.0
short_name: Virus particle texture patches (TEM)
description: 1,500 texture patches (41x41 px) extracted from transmission electron microscopy images of
  15 virus types, 100 unique patches per class, automatically extracted from objects segmented with the
  authors' virus-candidate segmentation method. Provided as 16-bit PNG (and an 8-bit resampled version)
  with class names and 10-fold cross-validation indices.
