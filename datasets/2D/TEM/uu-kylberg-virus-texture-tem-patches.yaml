notes: 'Classes 001-015, 100 patches each. The page states 41x41 px patches and 16-bit lossless PNG (its
  naming example uses a .tif extension, but the zip contains .png). The patches come from objects found
  by an automatic segmentation method, so the class label is the virus type of the source sample; the
  page notes the classes may not be fully discriminable. No license or terms of use are stated on the
  page; TEM magnification, pixel size, staining and who assigned the class labels are not stated on the
  page. The paper (J Microscopy 2012) is not open access, only its abstract was read, which does not describe
  this dataset. Well-known benchmark; license unknown so confidence is capped. enricher: size from full
  listing (was 2.4 MB); no fixed pixel size: patches are object-scale, resized to 41x41 (arXiv 2011.06123).'
