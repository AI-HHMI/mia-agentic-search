notes: 'Stored as Parquet (image + label image columns) in data/train-* and data/validation-* shards (5.69 GB total); the original image encoding inside the Parquet is not listed on the page, so formats uses other, the only enum value that fits Parquet. Pixel size, microscope and raw image dimensions are not stated on the dataset card, project website or preprint Methods (images were resized to 384x384 for model input; scale comes from a calibration table "where available"). Item count 540 is the card''s split total (528 + 12); the preprint does not state image counts and mentions train/val/test directories, while the HF repo has only train and validation. Annotations: initial manual labels followed by model-assisted multi-round expert refinement. License is non-commercial (CC-BY-NC-SA-4.0). The preprint says the data are being organized for public release; the project website says annotations are also hosted on Roboflow.'
