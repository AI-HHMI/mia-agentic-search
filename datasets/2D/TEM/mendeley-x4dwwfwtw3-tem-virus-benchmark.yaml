notes: 'Mendeley page (v3, CC BY 4.0) describes 1245 images (1376x1032 or 2048x2048 px, pixel sizes 0.26-5.57 nm depending on microscope/magnification: LEO+Morada and Tecnai 10+MegaView III), 9-129 images per class. The Mendeley public file API lists only dataset_code.zip (6 KB) for the version, while the page offers Download All; the image files could not be listed, so image file format and total size are unknown (formats: other) and no direct download URL is recorded. Pixel size varies per image so voxel_size_nm is null. Paper is not open access (abstract read from Europe PMC); it states a representative train/val/test split is proposed. Overall data layout was not verified.'
