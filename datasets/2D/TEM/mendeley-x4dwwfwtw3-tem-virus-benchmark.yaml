  notes: 'File list from the Mendeley public API dataset record (every file with size and download link) plus /folders/3
    for folder names; tools/listing.py has no Mendeley handler, so size_source is page-stated (API size field =
    sum of file sizes). Probed by range: raw 1070.tif 1032x1376 uint8 uncompressed plain TIFF, raw 6628.tif 2048x2048
    uint8, patch 256x256 uint8 packbits, crop_outlines RGB 519x692x3. Sampled raw 1070.tif (1,424,039 B): 0-255,
    mean 170; value_range from one sample. Read 1070 particle_positions txt and tags csv (Xscale 0.723, Magnification
    105000, MegaView III). Voxel size varies per image (page: 0.26-5.57 nm; tags csv per image), so imaging.voxel_size_nm
    stays null; patches are 1 nm/px. Downloads: data.mendeley.com/public-files/.../file_downloaded links 302 to
    unsigned S3 objects (prod-dcd-datasets-public-files-eu-west-1.s3.eu-west-1.amazonaws.com/<uuid>); the Mendeley
    links return HTTP 403 to Python clients (curl works), the S3 objects support ranges but that host is not on
    the TensorSwitch allowlist. Object URLs carry no file name. No single archive. Not listed as arrays (miao has
    only raw/labels): tags/*.tif_tags.csv (per-image key;value tags with decimal commas: Xscale, Yscale, Magnification,
    CameraModel) and the 23,400 derived 256x256 uint8 packbits patches (1 nm/px, class = folder; augmented_train
    = flipped/rotated copies).'
