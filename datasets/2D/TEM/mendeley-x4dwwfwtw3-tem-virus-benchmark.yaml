short_name: Virus particles, 22 classes (TEM)
description: 1,245 transmission electron microscopy images of 22 virus classes (negative stain, phosphotungstic
  acid) from two microscopes, with each virus particle annotated by its approximate centre point or, for clustered
  or elongated viruses, a centreline. Provided as raw images and 256x256 px patches around annotated points, with
  a proposed train/validation/test split.
