notes: 'Mendeley v3 (CC BY 4.0): 1245 raw TEM images, 22 virus classes, 1376x1032 or 2048x2048 px, pixel sizes 0.26-5.57
  nm varying per image, so voxel_size_nm is null; each image''s tags/*.tif_tags.csv gives Xscale/Yscale (nm/px,
  as used by the authors'' MATLAB code), and the 256x256 patches are resampled to 1 nm/px. Paper not open access;
  it proposes the train/val/test split. enricher: file list from the Mendeley public API (25,891 files, 8,016,417,881
  B; folders context_virus_RAW and context_virus_1nm_256x256); formats tiff (was other); size from the API (was
  null); annotations verified (point/centreline txt per raw image). No single archive is offered, so download_url
  is the landing page (was null). organism left empty: virus classes are named only by folder abbreviations (CCHF,
  TBE, LCM, Rift Valley...), not NCBI names.'
