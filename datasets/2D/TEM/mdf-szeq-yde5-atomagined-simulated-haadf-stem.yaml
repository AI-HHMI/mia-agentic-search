title: atomagined, simulated atomic-resolution HAADF-STEM images of unique ICSD structure prototypes
short_name: Simulated atomic-resolution HAADF-STEM prototypes
description: About 67,871 simulated atomic-resolution HAADF-STEM images (PRISM) of unique ICSD crystal
  structure prototypes viewed along set crystallographic directions, post-processed with blur, count noise,
  scan distortion, background and defect conditions, with retrieval target and choice splits and structure-based
  peak position suggestions, for image retrieval and structure identification in materials microscopy.
