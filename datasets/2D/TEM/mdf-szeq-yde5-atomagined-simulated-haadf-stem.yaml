notes: 'Simulated data. Record from the Materials Data Facility search API (title, CC BY 4.0, authors,
  Globus path mdf_open/atomagined_v1.1, description of retrieval testbed and peak suggestions); the image
  count (about 67,871), 256x256 size and h5 layout come from a Hugging Face card that repackages a 299-sample
  subset (Stemson-AI/atomagined). The MDF page is a JavaScript app and its file listing, size and a paper
  were not found (Europe PMC and Crossref searches), so size is null, formats unverified and no paper
  was read. Pixel size not stated. enricher: GitHub README (MaterialEyes/atomagined) mirrors the MDF folders:
  retrieval set (2,400 supercells) and general set (67,869 supercells x 3 = 203,607 images), h5 and png
  per split; added png to formats.'
