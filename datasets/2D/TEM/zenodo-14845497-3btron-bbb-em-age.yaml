notes: 'The single data.zip (572 MB, 17 files, 809.6 MB uncompressed) holds only NumPy arrays - binary/{train,test}/ with
  np_images.npy, labels.npy and features.npy, a combined binary/ set, middle_age/ (np_images.npy and features.npy for the 52
  unlabelled images) and information/single_image_targets.csv - so the format is other (numpy) and the original image files
  and their pixel size are not in the deposit. The label is the animal age group (aged mean 577 d, young mean 98 d), not a
  per-image expert annotation, so annotations.source is unknown. n_items is 359 labelled plus 52 unlabelled arrays. Magnification
  and pixel size are not stated in the paper text read ("nanometre scale"; magnifications chosen to frame each capillary), and the
  arrays may have been resized. This is a whole-image classification dataset.'
