title: 3BTRON dataset - electron microscopy of mouse blood-brain barrier capillaries labelled by age group
short_name: Mouse blood-brain barrier capillaries (TEM)
description: 359 transmission electron micrographs of brain capillaries (blood-brain barrier) from 23 C57Bl/6J mice, 161 from
  aged and 198 from young animals, taken in the corpus callosum, hippocampus and prefrontal cortex, with sex and brain region
  per image and a train/test split (324/35). A further 52 unlabelled images come from 3 middle-age female mice. Released as
  NumPy arrays with the 3BTRON paper on age classification of BBB ultrastructure.
