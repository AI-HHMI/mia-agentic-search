notes: 'Seven sub-datasets: TEM (corpus callosum, optic nerve, sciatic nerve), STEM (fimbria, optic nerve, sciatic nerve)
  and brightfield (tibial nerve, 3 images). STEM images are listed under TEM in the modality field because the schema has
  no STEM value. Pixel size varies per dataset (about 1.75 nm to 71.4 nm per README, raw calibration per image in pixel_sizes.csv),
  so voxel_size_nm is null. Species are given as "Mus" and "Rat" in the record; scientific names mapped from those. No paper
  is published yet (README: preprint in preparation), so there is no paper to read. 8 of the 20 corpus callosum images were
  previously released 4x downsampled in the AimSeg dataset (zenodo 8351731), with annotations revised. Contents of one zip
  (OpticNerve_Mus_TEM_000) were listed with peek_archive; the other zips were not listed. Known issue per README: one axon
  in OpticNerve_Mus_STEM_000/M06G02 lacks a fibre annotation. Size is the sum of all Zenodo file sizes.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: |
      ./  11 files, 1.84 GB
        README.md, datasets.csv, pixel_sizes.csv, SOURCES.csv
        <Tissue>_<Species>_<Modality>_000.zip  ×7 (57 MB – 1.21 GB):
          CorpusCallosum_Mus_TEM, OpticNerve_Mus_TEM, SciaticNerve_Mus_TEM, Fimbria_Rat_STEM,
          OpticNerve_Mus_STEM, SciaticNerve_Mus_STEM, TibialNerve_Mus_BF
        each zip: <Dataset>/
          raw/images/<image>.tif            full-resolution image
          raw/annotations/<image>.geojson   QuPath objects (Fibre, InnerCylinder, Axon, ROI, Nerve)
          training/images/<image>_roi0.tif  downsampled training export
          training/masks/<image>_roi0.tif   semantic mask
          training/labels/<image>_roi0.tif  fibre instance labels
