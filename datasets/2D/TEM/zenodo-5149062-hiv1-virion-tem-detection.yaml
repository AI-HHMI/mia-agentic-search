notes: 'Two zips (rcnn dataset 849 MB, classification backbone dataset 799 MB). HIV-1_rcnn_dataset_full.zip was listed: 59 PNG micrographs and 113 region_data CSVs (train/val folders per micrograph); the classification zip was not listed, so its 1,806 crops (1,443 train, 363 val, from the record text and paper) are unverified. Paper (open access) gives 30,000x magnification, micrographs cropped to 4,000 x 2,620 pixels and manual ground-truth labelling; pixel size is not stated on the Zenodo page or in the paper text read. The classification crops are extracted and augmented from the same micrographs, so they overlap the detection set.'
