description: 59 TEM micrographs of HIV-1 virions (46 train, 13 validation) with a CSV of bounding boxes
  and mature, immature or eccentric labels per virion, plus a classification set of 1,806 cropped, augmented
  virion images in train and validation folders by class. Made for the TEMNet and Faster R-CNN virion
  detectors.
