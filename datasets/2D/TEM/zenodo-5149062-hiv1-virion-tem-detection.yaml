notes: 'Two zips (rcnn dataset 849 MB, classification backbone dataset 799 MB). HIV-1_rcnn_dataset_full.zip
  was listed: 59 PNG micrographs and 113 region_data CSVs (train/val folders per micrograph). Paper (open
