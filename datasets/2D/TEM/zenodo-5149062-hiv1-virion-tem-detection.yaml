  labelling; pixel size is not stated on the Zenodo page or in the paper text read. The classification
  crops are extracted and augmented from the same micrographs, so they overlap the detection set. enricher:
  classification zip listed: 1,806 TIFF crops (train 1,443: mature 716, eccentric 542, immature 185; val
  363: 180/136/47), matching the record text.'
