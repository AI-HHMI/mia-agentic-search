notes: 'Single folder data/EM2B6 with 25 .tif files (2.2 GB) and one .zarr (513 MB, 1232 files); 26 data items counted from
  the HTTP index (rounded sizes, total about 2.7 GB vs 2.5 GB stated by EMPIAR). The deposit is the TEM half of a
  workflow paper: light microscopy data are in BioImage Archive S-BIAD2077. File names give pixel sizes
  of 1.8, 3.4, 34.4, 136 and 170 nm (xy), so no single voxel size applies and voxel_size_nm is left null. Several
  files are TEM tomogram stacks (z ranges in the names) while most are 2D section maps, so 2D is the dominant
  dimensionality. Many of the listed files are masks (_seg/_labels; a seg file per section slot, mostly nuclei) rather than raw images; the paper says masks come from user boxes
  prompting a segmentation algorithm (SAM, per the SAMJ link in the paper), with manual segmentation of presynaptic boutons for tomograms, hence source
  mixed. EMPIAR page shows CC0 badge; paper text states CC BY 4.0 for the article. Small, single-tissue benchmark.'
