notes: 'Split across five Zenodo records, all CC0-1.0: annotations 5577401; images BAM 5578641, CEA 5578680, LNE 5578878,
  VSL 5578927 (zips of .h5 files; the h5 arrays derive from tif, dm3 and Bruker AFM files). Counts come from reading annotations.json:
  BAM SEM 56, BAM TSEM 58, CEA TEM 225, LNE SEM 120, VSL AFM 95 images, 11,227 particles in total. The record carries
  a per-image pixel_size number without a unit, so voxel_size_nm is left null; values span roughly 0.17-1.9 for SEM/TEM
  and 5.87 for AFM. Annotation procedure and author names are not given on the Zenodo pages and no paper is linked on them;
  a Europe PMC / Crossref title search found no matching paper. AFM images are height maps, not electron micrographs. The
  .h5 image zips were not opened (zip listing failed with an SSL error), so the HDF5 dataset layout is unverified. Coverage
  of the annotation (all particles vs a subset) is not stated.'
