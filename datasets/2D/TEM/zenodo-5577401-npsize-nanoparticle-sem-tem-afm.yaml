description: Machine-learning dataset of 554 nanoparticle images from four metrology institutes (BAM and
  LNE SEM, BAM transmission-mode SEM, CEA TEM, VSL AFM) stored as 2D HDF5 arrays, with one polygon outline
  per annotated particle (11,227 particles) in a single annotations.json that records image size and pixel
  size per image. Released by the EMPIR 17NRM04 nPSize project.
