  notes: 'Listed the five Zenodo records (API file lists + zip central directories): 16 zips holding 554
    .h5 files (BAM 114, CEA 225, LNE 120, VSL 95) and annotations.zip (annotations.json, 94.5 MB uncompressed);
    1,268,764,350 bytes in total. Probed one .h5 per lab (header read of the whole member, 2.1-4.2 MB
