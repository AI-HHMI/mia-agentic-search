    masks in S2/annotations are OME-TIFF uint32 LZW (2950x2432) with OME physical size 0. Voxel size:
    the training TIFF header (AMT camera text) has XpixCal=232.681 Unit=um at 15000x; test TIFFs are uncalibrated
    and the paper states no pixel size, so voxel_size_nm stays null (magnifications and image sizes differ
    between files). Value ranges are from one sample.'
