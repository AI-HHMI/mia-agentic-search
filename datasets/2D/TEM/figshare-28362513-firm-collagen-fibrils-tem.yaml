notes: 'Two PLOS figshare items form the dataset: S3 (28362513, 71 MB, 5 training TIFFs with fibril/background masks and 11 testing
  images, folders Training Images / Testing Images) and S2 (28362504, 63 MB, annotations of three human reviewers, 16 merged ground-truth
  masks, FIRM/Ilastik/manual analysis spreadsheets and a scarce-training study with 25/50/75/100% annotation). size_bytes is
  the sum of both zips; download_url is the images zip. Very small set (16 images). Pixel size is not stated on the pages or
  in the paper text read. The fibril test masks are a majority vote of three annotators; training masks were one randomly chosen
  annotator per image. The figshare HTML page was not fetched (API records were read).'
