notes: 'Paper (npj Comput Mater 11, 322; open access) Methods: PtSn@Al2O3 images are HAADF-STEM, 2048x2048 px at 0.019-0.038
  nm/px (2.5-5 Mx); Au@ZSM-5 images are BF-TEM, 1024x1024 at 0.38 nm/px; manual masks drawn as LabelMe polygons and converted
  to binary PNG. Pixel size differs per subset and within PtSn, so voxel_size_nm stays null. 03_SAM_masks are automatic SAM
  masks; 04-06 are generated masks/synthetic/adapted images; 07-08 are model checkpoints (not counted in n_items). Paper Data
  availability cites concept 10.5281/zenodo.14791390; a newer version (18929384, 9.8 GB zip) exists. No organism: materials
  samples. enricher: authors from the Zenodo API (were empty); formats + tiff (01_03_Au_ZSM5/*.png are LZW TIFFs named .png);
  channels 1 (grey stored as RGB).'
