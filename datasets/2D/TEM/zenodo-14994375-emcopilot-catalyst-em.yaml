notes: 'Zip listed with peek_archive: 7014 files; 01_experimental_images, 02_manual_labels (same counts and folder names) hold 33 + 23 + 110 = 166 PNGs per folder (nanoparticle / clusters / Au_ZSM5); 03_SAM_masks has 33 + 23 for two materials; the rest are generated/synthetic/adapted images and .pt/.pth checkpoints (not counted in n_items). Modality is not stated on the dataset page: its MeSH tag says scanning transmission EM, and a related EMcopilot preprint (arXiv 2407.19544) describes a JEOL ARM-200CF in scanning mode, so TEM is used with that caveat. Pixel size is not stated on the dataset page or in the paper abstract; the npj paper full text is not open access (paper.py found none) and publisher page needs login, so the Methods were not read. Label encoding (binary vs. classes) was not checked. Newer version of the record exists on Zenodo (this is v3).'
