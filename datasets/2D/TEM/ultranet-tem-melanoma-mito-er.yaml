notes: 'Dataset is the Download button of the UltraNet web server (/export_dataset, 1.15 GB zip); the paper only points to
  the site. Its terms page returned HTTP 500, so no license was found. Zip (peek_archive): images/{train 114, val 80, test
  102} .tif + masks .png. Paper says 296 images in Methods but 206 in Conclusions; zip has 296 pairs. Paper states pixel width
  0.38 nm, implausible at 25,000x for 2028 px, so voxel size is left null. Mask class values not inspected.'
