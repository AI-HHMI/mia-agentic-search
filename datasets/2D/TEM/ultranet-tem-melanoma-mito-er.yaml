  notes: 'Zip central directory read (594 members: 296 .tif, 296 .png, imgs list .docx/.xlsx). Probed MB-020_38.tif: plain single-page
    TIFF, uint8, 2048x2048, uncompressed. Sampled MB-020_38 pair: image 0..255 (mean 125, all 256 values used); mask RGB with exactly
    3 colours (black 83%, (124,180,60) 13%, (31,120,180) 4%); MP-09_153 [1].png also 3 colours. One sample each. Voxel size not
    found; checked: TIFF header (no resolution), zip listing, landing page, paper Methods (states 0.38 nm, contradicted by its
    own areas). Download host ultranet.sysbio.ru is not on the TensorSwitch allowlist. One test file name has a space and brackets
    ("MP-09_153 [1]"). Second enricher pass: sampled MB-020_22 too (mask colours black 77%, (124,180,60) 21%, (31,120,180) 2.3%);
    bytes_downloaded includes ~450 MB that tools/listing.py fetched by mistake (it treats the extensionless zip URL as an HTML
