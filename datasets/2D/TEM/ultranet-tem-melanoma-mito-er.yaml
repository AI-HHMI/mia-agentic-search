title: 'UltraNet: annotated TEM images of murine B16 melanoma sections (mitochondria and ER masks)'
short_name: Mouse melanoma mitochondria/ER segmentation (TEM)
description: 296 transmission electron micrographs (2048 x 2048 px) of B16 melanoma tumour sections from 20 C57BL/6 mice (control
  and brefeldin A / rapamycin treatments), each with a manually drawn PNG mask separating background, mitochondria and endoplasmic
  reticulum. The zip is split into train (114), val (80) and test (102) images with matching masks.
