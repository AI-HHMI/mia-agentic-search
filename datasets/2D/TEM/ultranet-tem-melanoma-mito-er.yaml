notes: 'Dataset is the Download button of the UltraNet web server (/export_dataset, 1.15 GB zip); the paper only points to the
  site. Zip (peek_archive): images/{train 114, val 80, test 102} .tif + masks .png. Paper says 296 images in Methods but 206 in
  Conclusions; zip has 296 pairs. Paper states pixel width 0.38 nm, implausible at 25,000x for 2028 px, so voxel size is left null.
  enricher: images are 2048x2048 uint8 (paper says 2028x2048); masks are RGB PNG with 3 colours; 0.38 nm also conflicts with the
  paper''s 2,707,933 nm2 mitochondrial area for one image (more than a whole 2048 px frame at 0.38 nm), so voxel size stays null.
  enricher: license custom from https://ultranet.sysbio.ru/terms_and_conditions (non-commercial academic use, cite paper; was unknown);
  formats + png.'
