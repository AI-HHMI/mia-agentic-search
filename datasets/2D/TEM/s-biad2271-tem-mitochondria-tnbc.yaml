title: TEM mitochondria segmentation dataset from triple negative breast cancer models, with manual masks
  (BioImage Archive S-BIAD2271)
short_name: TNBC mitochondria segmentation (TEM)
description: Transmission electron micrographs of triple negative breast cancer cells and patient-derived
  xenograft tumors, and primary mouse myotubes (Drp1 KO), with manually traced semantic segmentation masks
  of mitochondria (PNG), organised in train/validation and test folders per model plus a pooled 'Mixture'
  set. Used to train a U-Net for mitochondrial morphology analysis.
