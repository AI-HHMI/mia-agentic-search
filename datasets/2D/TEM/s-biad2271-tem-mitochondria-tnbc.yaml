notes: 'File lists read in full: 209 TIFF micrographs (3.43 GB) and 209 PNG masks (8.7 MB). The folder
  counts include a pooled Mixture/tra_val set of 125 images that appears to repeat the per-model images, so
  distinct micrographs are fewer than 209 (paper: 125 annotated micrographs, 11,039 mitochondria). Calibrated
  pixel size is not in the record; the paper says it ranges from 0.36 to 23 nm/pixel across images, so
  voxel_size_nm is null. Imaging on a JEOL JEM-1230 with AMT NanoSprint15 camera at 1000x-5000x (paper
  Methods). Masks were traced manually in QuPath. Preprint full text read (bioRxiv). No single archive;
  download_url is null.'
