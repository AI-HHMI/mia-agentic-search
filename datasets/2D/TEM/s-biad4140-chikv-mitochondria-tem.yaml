notes: 'File list has 285 *_Full.jpg images (one folder BaseDatosFinal_CN_WT), 1977 PNG masks and one
  xlsx. Voxel size derived from the stated 4.59 µm field of view over 4096 px (about 1.12 nm/px); the
  study says images were then resized to 2048 x 2048 (about 2.24 nm/px), so the deposited pixel size may
  differ. Damage-stage class labels are not verified in the file names. No associated paper found (BioStudies
  publication section empty; Europe PMC title search found nothing). Mask images were not opened. enricher:
  n_items 285 -> 282 (282 image sets; 3 of the .jpg files are Mit masks); size_bytes from the BioStudies
  file list (was null); voxel size 1.12 -> 2.24 nm since the deposited *_Original.png are 2048x2048 (4.59
  um FOV / 2048 px).'
