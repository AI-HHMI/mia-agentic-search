notes: 'Record type is a workshop lesson; no related paper listed on the page. Images and masks come from the zip listing (peek_archive on Agregates for training TP.zip, 104 files): 74 .tiff (30 of them *_mask.tiff) and 30 .psd, in five sample folders (Co150V_C_A1_TM22-36, Fe300V+C_C6_TM25-F08, Fe75V+C_C7_TM25-F06, FeCo_C_NT2506_B7, FePt_100V_C_B6_TM24-02). n_items=44 is the 74 tiffs minus 30 masks; masks exist for 30 images (coverage partial). The page says the zip is a ~30% subset of the training images used for the lesson ("minimal example"), so the full training set is not released here. File names carry pixel sizes like pix0.06508[nm] but these values look implausible for nm, so voxel size is left null. Annotation procedure not stated (the lesson mentions mask extraction from annotation layers); annotation source left unknown. Pretrained model zips and notebooks in the record are not data. No train/val/test split files seen.'
