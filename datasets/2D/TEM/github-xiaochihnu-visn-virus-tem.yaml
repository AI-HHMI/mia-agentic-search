notes: 'Dataset lives in the dataset/ folder of the GitHub repository (annotations/, train/, test/). The repo page states 622 images, 900 x 820 px, 3,195 particles, six virus classes; it names no license. Pixel size, microscope and annotation tool not stated on the repo page or the abstract; the paper is not open access (Europe PMC has no full text), so Methods could not be read. The repo README text is internally inconsistent about the number of virus classes ("three similar viruses" vs six). Train folder shows 0001-0100.png on the listing page, which may be truncated; per-split counts not verified. Files are fetched with a plain GitHub clone or raw download. data.formats is png from the train folder listing.'
