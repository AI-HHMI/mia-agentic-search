notes: 'The zip (286 MB compressed, 503 MB unzipped) holds only 5 TIFF images of ~67 MB each (AimSeg_Dataset), plus 5 instance
  and 5 semantic label TIFFs of ~16.8 MB each, one per image name. That is fewer than the usual ~10 images, but each image is a
  large full field with dense fibre labels (the paper says manual annotation took 51.5 min per image). Per the paper Methods the
  images were taken on a JEOL JEM-1400 Plus with a Gatan One View camera at 7.1 K magnification, field of view 8.62 x 8.62 um;
  enricher: voxel size 2.1046 nm from the PLoS CB paper Methods for the 4096 px originals (was null); TIFF headers agree. Five randomly selected TEM images
  were annotated by a single expert in Fiji, using freehand selections for axon, inner tongue and fibre ROIs. The Zenodo record has no
  separate train/test split. Paper is a bioRxiv preprint (full text read via tools/paper.py). Checked: Zenodo record page and API,
  zip listing, paper Methods and Data availability.'
