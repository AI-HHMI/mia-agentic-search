short_name: Lacey carbon grid TEM segmentation masks (TEM)
description: >-
  TEM images from routine crystal-search sessions on three microscope-detector setups (JEM-2100 and Zeiss Libra 120 with TimePix, Themis Z with Gatan OneView), with manually prepared masks of the
  lacey carbon support: 10,272 image/mask patches of 256 x 256 px (3,816 augmented), 110 full test images, and a full-image set with raw H5, DM4 and TIFF originals.
