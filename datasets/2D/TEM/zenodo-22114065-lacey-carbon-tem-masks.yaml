notes: 'Three zips (version 2). patches_for_training.zip (500 MB) lists 10,272 images and 10,272 masks
  as TIFF, of which 3,816 images are augmented copies (''_aug_N'' names), so 6,456 are original patches.
  test_all_images.zip (24 MB) holds 110 full-image PNGs (no masks). TEM_images_of_lacey_carbon.zip (201
  MB) has no readable zip end-of-central-directory (the file may be truncated); per the description it
  holds images, masks, images_raw (H5, DM4, TIFF), image_mapping.csv and a README. enricher: one patch
  pair sampled, masks are binary 0/255. No paper is linked or found, so the pixel size is unknown (it
  varies across the three microscope setups).'
