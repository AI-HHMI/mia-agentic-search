notes: >-
  Three zips (version 2). patches_for_training.zip (500 MB) lists 10,272 images and 10,272 masks as TIFF, of which 3,816 images are augmented copies ('_aug_N' names), so 6,456 are original patches.
  test_all_images.zip (24 MB) holds 110 full-image PNGs (no masks listed). TEM_images_of_lacey_carbon.zip (201 MB) could not be indexed remotely (no readable end-of-central-directory); per the record
  description it holds images, masks, images_raw (H5, DM4, TIFF originals), image_mapping.csv and a README, so its content is taken from the description only. DM4 is not a listed format, so
  formats lists only the listed ones. No paper is linked in the record or found by title search, so pixel size and mask encoding (assumed binary lacey carbon vs. other) are unknown. The mask
  format and class values were not inspected.
