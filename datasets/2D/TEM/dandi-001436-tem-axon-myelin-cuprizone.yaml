notes: 'Found via the ASTIH paper (MIDL 2026), which lists this DANDI dandiset as dataset TEM1. The dandiset
  is in draft state in the DANDI API (no datePublished, no DOI), so date_published is null; ASTIH cites
  a versioned DOI 10.48324/dandi.001436/0.250512.1625. Pixel size 2.36 nm is from the DANDI description
  (0.00236 um, stated as the true value; the AxonDeepSeg paper rounded it to 0.002 um). The asset listing
  shows 660 files (475 in derivatives/labels), 1.04 GB, 158 samples from 20 mice per the description
  (DANDI summary reports 11 samples). Per-image sizes were not checked. Download is via the DANDI API/CLI
  (dandi download DANDI:001436), no single archive. Sources checked: DANDI API record, asset listing,
  ASTIH page, AxonDeepSeg paper full text (Europe PMC).'
