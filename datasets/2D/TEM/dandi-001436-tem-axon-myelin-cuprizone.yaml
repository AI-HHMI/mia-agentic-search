id: dandi-001436-tem-axon-myelin-cuprizone
title: TEM Images of Corpus Callosum in Control and Cuprizone-Intoxicated Mice with Axon and Myelin Segmentations
short_name: Mouse corpus callosum axons/myelin (TEM)
description: 158 transmission electron microscopy images of the splenium of the corpus callosum from 20
  control and cuprizone-intoxicated mice, with manual axon, myelin and axon+myelin segmentation masks (PNG)
  in BIDS microscopy layout. Every axon is separated from its neighbours by a 2-pixel delineation, so the
  masks serve for semantic and instance segmentation. TEM dataset of the AxonDeepSeg project (ASTIH collection).
