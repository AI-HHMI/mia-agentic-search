notes: 'Found via the ASTIH paper (MIDL 2026), dataset TEM1. The dandiset is a draft in the DANDI API (no datePublished,
  no DOI), so date_published is null; ASTIH cites DOI 10.48324/dandi.001436/0.250512.1625. Pixel size 2.36 nm is
  from the DANDI description (0.00236 um; the AxonDeepSeg paper rounded it to 0.002 um). enricher: 2.36 nm confirmed
  in the _TEM.json sidecars of the subjects read. Asset listing: 660 files, 1.04 GB, 158 raw images from 20 mice,
  each with axon, myelin and axonmyelin masks. Download via the DANDI API/CLI (dandi download DANDI:001436), no
  single archive. Sources checked: DANDI API record, asset listing, sidecars, ASTIH page, AxonDeepSeg paper full
  text (Europe PMC).'
