title: Performance, Successes and Limitations of Deep Learning Semantic Segmentation of Multiple Defects in Transmission Electron Micrographs
short_name: Irradiated FeCrAl defect segmentation (STEM)
description: 'Bright-field STEM images (1024 x 1024 px JPEG) of neutron- and ion-irradiated FeCrAl alloys, taken on-zone [100], with manually
  drawn polygon annotations of three defect types (<111> loops, <100> loops, black dots): 107 images with 5,382 defect instances (Dataset1), the
  same 107 images relabelled by a second group (Dataset2, 5,053 instances) and 182 images with 13,675 instances (Dataset2 expanded). Ships COCO
  train/val JSON splits plus leave-out-group test splits, a trained Mask R-CNN model and a Colab notebook.'
