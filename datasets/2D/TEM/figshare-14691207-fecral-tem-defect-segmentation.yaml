notes: >-
  Paper (arXiv 2110.08244, read in full) states: 107 images / 5,382 instances (Dataset1), same images relabelled
  (Dataset2, 5,053), 182 images / 13,675 instances (Dataset2 expanded); annotation with VGG Image Annotator; all images are
  [100] on-zone bright-field STEM; older Philips CM200 and newer FEI Talos F200X / JEOL 2100F microscopes. datasets.zip
  (listed with peek_archive: 4,389 JPEG, 64 JSON) repeats the images across many split folders (initial, expanded,
  leave-out-irradiation/alloy/microscope), so the file count exceeds the 182 unique annotated images. n_items is the paper's
  182. Pixel size is not stated on the Figshare page or in the paper text read; file names only give magnifications
  (e.g. 300kx, 500kx), so voxel_size_nm is null. Modality recorded as TEM (STEM bright field). Figshare lists a second
  file (MaskRCNNObjectDetection.zip, 218 MB: trained model and Colab notebook), not counted in size_bytes.
