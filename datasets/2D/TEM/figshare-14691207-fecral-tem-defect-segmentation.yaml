notes: 'Paper (arXiv 2110.08244): 107 images / 5,382 instances (Dataset1), same images relabelled (Dataset2, 5,053), 182 images / 13,675 instances
  (Dataset2 expanded); VGG Image Annotator; [100] on-zone bright-field STEM; Philips CM200, FEI Talos F200X, JEOL 2100F. datasets.zip repeats
  the images across many split folders, so n_items is the paper''s 182. Modality recorded as TEM (STEM bright field). No organism: irradiated
  FeCrAl alloy (materials). enricher: pixel size differs per image group, so voxel_size_nm stays null; paper SI Table 10 "pixel to nm conversion":
  0.478516 (2501/5401/0501/K713_300kx), 0.880523 (mapN_70kx), 0.869141 (NROI_100kx), 0.141602 (g1/g2 onzone), 0.283203 (500kx, BF X500K, dalong).
  enricher: size_bytes now both Figshare files (datasets.zip + MaskRCNNObjectDetection.zip, which holds all 182 images + one COCO JSON).'
