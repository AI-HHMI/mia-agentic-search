notes: 'Sizes from the PSDI file API: synthetic 996 MB, experimental dm4 906 MB, segmented 250 MB. Zip listings: synthetic_polymer holds train/images (about 1,350 PNG), train/labels and train/masks (about 1,350 each), valid/images (about 270 PNG) with labels, plus COCO/VIA/SAM2 JSON and a train.csv; experimental_polymer_dm4 holds 66 dm4 files (not listed among schema formats, so formats only lists png); experimental_segmented_polymer holds 66 PNG plus stats.csv and mean_stats.csv. Labels are synthetic by construction or model predictions; no manual annotation of the experimental images. No paper is linked on the record, so none was read. Pixel size not stated on the record or in the file listings. Different from the already catalogued PSDI gold nanoparticle record (sgvf0-j3g53): another material and a different record.'
