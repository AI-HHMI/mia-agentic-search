description: 'PSDI record with three zips: a synthetic TEM training set of spheres generated with the TEMPOS software (about
  1,350 train and 270 validation PNG images in 1024 px size with COCO, VIA and SAM2 annotation JSON, YOLO label txt files
  and mask PNGs), 66 experimental TEM micrographs of latex and silica spheres on carbon films (Gatan dm4), and those 66 images
  segmented by a Detectron2 model trained on the synthetic data, with CSV particle statistics.'
