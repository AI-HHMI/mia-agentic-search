notes: 'Counts from peek_archive of EMViR_dataset.zip: 2,168 .tif files = 1,084 image/mask pairs (762 train, 157
  val, 165 test); by filename prefix 518 adeno, 640 corona, 612 orthomyxo, 398 paramyxo files (images+masks). Pixel
  size, microscope, annotation procedure and annotator are not stated on the Zenodo page; the ISBI 2025 paper is
  not open access (Europe PMC/Crossref return only the abstract) and no preprint was found, so they are left null/unknown.
  The .zip holds the images and masks; formats ''other'' covers the COCO JSON in the separate zip. enricher: exact
  size from Zenodo listing; sampled masks are binary 0/1 uint8 TIFFs on the image grid.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: |
      ./  2 zips  4.0 GB  (2171 members)
      EMViR_dataset.zip/EMViR_data_set/
        train_images/ 762 .tif 3.0 GB    train_masks/ 762 .tif 85.7 MB
        val_images/   157 .tif 524 MB    val_masks/   157 .tif 16.5 MB
        test_images/  165 .tif 593 MB    test_masks/  165 .tif 18.3 MB
        file names: <virus family>_<NNNN>_<k>.tif, identical in *_images and *_masks
      EMViR_masks_coco.zip/   3 .json (train/val/test COCO), 38.9 MB
    n_files: 2
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/13949331/files/EMViR_dataset.zip::EMViR_data_set/val_images/adeno_0042_0.tif
    - https://zenodo.org/records/13949331/files/EMViR_dataset.zip::EMViR_data_set/val_masks/adeno_0042_0.tif
    size_bytes: 170111
    description: Smallest validation image (adenovirus, 485x485) and its mask
  arrays:
  - role: raw
    path_pattern: EMViR_data_set/{train,val,test}_images/*.tif
    format: tiff
    axes: yx
    shape:
    - 485
    - 485
    shape_varies: true
    dtype: uint8
    compression: lzw
    value_range:
    - 0
    - 195
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Member sizes range from ~170 KB to several MB, so image dimensions vary; shape is of the smallest
      val image.
  - role: label
    path_pattern: EMViR_data_set/{train,val,test}_masks/*.tif
    format: tiff
    axes: yx
    shape:
    - 485
    - 485
    shape_varies: true
    dtype: uint8
    compression: lzw
    value_range:
    - 0
    - 1
    normalization: none
    encoding: binary
    classes: null
    alignment: same-grid
    alignment_notes: <split>_masks/<name>.tif pairs with <split>_images/<name>.tif; sampled pair has identical shapes.
      Virus family is given by the file-name prefix (adeno, corona, orthomyxo, paramyxo).
  - role: label
    path_pattern: EMViR_masks_coco.zip/*.json
    format: json
    axes: null
    shape: null
    shape_varies: null
    dtype: unknown
    compression: none
    normalization: none
    encoding: polygons
    classes: null
    alignment: unknown
    alignment_notes: COCO annotation files per split (per file names); not opened.
  notes: 'Zenodo listing complete and exact (4,026,154,674 B). Sample (val adeno_0042_0, the smallest image): image
    485x485 uint8 LZW, values 0..195; mask 485x485 uint8 LZW, values {0: 207538, 1: 27687}. No pixel calibration
    in the TIFF tags. Masks are binary (virus vs background); the virus class is only in the file name, so as provided
    this is binary segmentation plus image-level family labels. The COCO JSONs were not opened, so whether they
    carry per-particle instances is unknown.'
