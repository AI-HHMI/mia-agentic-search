title: EMSeek multitask electron microscopy dataset (STEM/TEM atomic columns, defects, nanoparticles)
short_name: EMSeek atomic-resolution STEM/TEM masks (TEM)
description: Pixel-annotated STEM/TEM micrographs of materials (not biological) released with the EMSeek paper. Five task folders (atom_columns, atomic_defects, metal_alloy_defects, nanoparticles, single_atom_catalysts placeholder), one folder per material, each with image/ (PNG), label/ (PNG masks) and bbox/ (YOLO-format boxes) plus optional prompt.txt. Atom-column frames are normalised to 256x256; other tasks keep native resolution (up to 2048x2048).
