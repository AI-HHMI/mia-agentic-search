notes: 'Zenodo (EM_data.zip 3.8 GB + EMSeek.zip 2.3 MB code) states CC-BY-4.0; the README inside EM_data.zip and the HF mirror
  (gary23ai/EMSeek) state Apache-2.0 - Zenodo record taken as canonical. Dataset combines public images with the authors''
  own scans (paper: provenance/licensing in Supplementary Materials, not reachable), so per-image licences may differ. Materials-science
  TEM/STEM, no biological organism; prompt.txt files name the mode per subset (ADF-STEM SrTiO3, HAADF-STEM Pt@NC, BF-STEM
  FeCrAl, BF-TEM Au@Ge); TEM is the closest enum. Pixel size not stated anywhere checked (subsets come from different sources).
  Channels: mostly grayscale, some RGB nanoparticle images. enricher: size 3,805,639,697 B from Zenodo file listing (was ~4
  GB); n_items 14,491 image/label/bbox triplets from the zip index (was null); download_url EM_data.zip (was null).'
