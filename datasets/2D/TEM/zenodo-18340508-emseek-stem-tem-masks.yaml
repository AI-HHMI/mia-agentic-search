notes: 'Zenodo (3.8 GB: EM_data.zip 3.8 GB + EMSeek.zip 2.3 MB) states CC-BY-4.0; the Hugging Face mirror (gary23ai/EMSeek) states Apache-2.0 - Zenodo taken as canonical. Per-folder counts seen on the HF mirror: SrTiO3 1000 image/label pairs, WSe2 107, FeCrAl ~182, Fe3O4 8; total n_items not computed. Pixel size, microscope and imaging mode are not stated on the dataset pages or in the paper main text (supplement not read); dataset combines public images with the authors'' own scans (paper says provenance/licensing is in the Supplementary Materials, so per-image licences may differ). Materials-science TEM/STEM, no biological organism. Modality TEM is the closest enum (STEM frames included). Zip contents not listed (3.8 GB archive); structure taken from the HF mirror file tree and README. Paper data availability: Zenodo DOI 10.5281/zenodo.18340508.'
