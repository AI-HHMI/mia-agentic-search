  notes: 'Files API lists 3 zips with exact sizes (2,358,020,511 bytes). The content links redirect to
    S3 presigned URLs valid 60 s; HEAD on them fails, so listing.py/peek_archive.py could not read the
    zips. Zip indexes and members were read with a short requests script (range GETs, ~5 MB in all): synthetic
    1,658 members, experimental 156 PNG, segmented 160 members. Sampled train/0.png: 1024x1024 uint8 greyscale,
    values 0-255, mean 201 (one sample). Read the first bytes of instances_train.json (COCO: info, images
    1024x1024) and via_region_data.json (polygon regions). Annotation count not computed. Pixel size:
    synthetic images have none; not in the files API record, generator settings (sizes in px), COCO info
    or the related paper (robot synthesis, TEM figures without pixel size). No single archive: three zips,
    so data.download_url stays null. TensorSwitch: host data-collections.psdi.ac.uk not on the allowlist,
    and zip members fail its check because HEAD on the presigned redirect fails. Experimental images (expermental_gold.zip,
    156 PNG) have no ground truth and are not listed as an array.'
