notes: 'Zip indexes read with ranged GETs: synthetic zip 1,650 PNG (train 1,501, val 149) with COCO and
  VIA json and generator settings; experimental zip 156 PNG; segmented zip 159 PNG plus one CSV. Synthetic
  labels are exact by construction; the experimental images have no ground-truth labels here (Detectron2
  predictions only), so source is automatic. Pixel size not stated on the record, in the files read or
  in the related paper (robotic synthesis, no TEM acquisition details); label json not parsed. Sibling
  records: cobalt (9gkqa-pty79), polymer spheres (rz59r-rcr81), and the separate synthetic-only gold set
  (sgvf0-j3g53) with different files. enricher: size from the 3 zip sizes in the files API; label json
  read (VIA polygons).'
