notes: >-
  Pixel size, magnification and image dimensions are not stated on the dataset card, project website or preprint
  (preprint says per-image scale is read from a calibration table, no values). Image/label encoding inside the Parquet
  files was not inspected, so formats is other (Parquet). Labels: 0 background, 1 abnormality, 2 mito-like organelle,
  3 mitochondria, 4 mitochondria outside axon, 5 periaxonal space, 6 axon, 7 myelin (id2label.json); axon/myelin masks
  may come from AxonDeepSeg per the project site. Preprint says initial ground truth was manual with expert-guided
  iterative model-assisted refinement; preprint full text is not open access beyond the bioRxiv page.
