title: Electron micrographs of synapses in frogs
short_name: Frog synapse micrographs, unlabeled (TEM)
description: 12 HDF5 stacks of transmission electron micrographs of frog (Rana pipiens) neuromuscular
  synapses, split into a train_unlabeled folder (10 files) and a test folder (2 files); the raw image
  is stored in the internal dataset "raw". Re-release of images from Rizzoli and Betz 2004, used for unsupervised
  domain adaptation of synaptic vesicle segmentation in SynapseNet. No annotations are included.
