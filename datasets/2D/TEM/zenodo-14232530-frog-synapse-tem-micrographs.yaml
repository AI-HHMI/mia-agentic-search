notes: 'No labels: the record describes train_unlabeled images for unsupervised domain adaptation and
  test images for qualitative evaluation. The paper (Methods, Frog) states 402 micrographs and pixel size
  3.01 nm; the Zenodo record holds 12 stacks. In the paper, domain adaptation on these data degraded the
  segmentation, since the initial network found few vesicles in this low-contrast data. Images were scanned
  from film negatives (CM-10 Philips microscope, 2.69x enlargement, 300 dpi). Sibling SynapseNet records
  are zenodo-14236382, zenodo-14254111, zenodo-14232607 and zenodo-14330011. Usability rests on use as
  unlabeled data for self-supervised/domain-adaptation training only. enricher: the .h5 files also hold
  labels/membrane (binary) and labels/vesicles (values 0-2, <0.04% of voxels) datasets, undocumented;
  annotations left absent pending review.'
