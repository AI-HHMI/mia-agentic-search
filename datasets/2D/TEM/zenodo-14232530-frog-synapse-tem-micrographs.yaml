    raw [23, 1022, 1166] 0-255 (p1-p99 34-255); membrane {0,1}, 43.5% foreground, all 23 slices; vesicles
    values {0,1,2}, 0.037% non-zero. train_unlabeled/block30UB_two.h5 raw [24, 1024, 1250]; membrane 16.7%
    foreground; vesicles 0.004% non-zero. Neither the record nor the paper documents these label datasets;
    the vesicle masks are far too sparse to be complete vesicle annotations, so they are not counted as
    annotations. Axes not stated in the files or docs. download_url (the API content link) checked usable.'
