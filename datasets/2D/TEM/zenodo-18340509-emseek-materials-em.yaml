notes: 'Zenodo record 18340509 (v. of 2026-01-22; the paper cites DOI 10.5281/zenodo.18340508,
  the concept record). EM_data.zip (3.8 GB; 28,982 PNG + 14,511 txt files) is laid
  out as task/material/{image,label,bbox}; counts from the record: 13,356 atom-column
  triplets (256x256), 107 WSe2 defect images (1024x1024), 182 FeCrAl images, 822 nanoparticle
  images, 25 Pt@NC images. The paper says the dataset combines publicly available
  EM images with the authors'' own scans, with provenance and licensing in its Supplementary
  Materials (not read), so the CC-BY-4.0 on the record may not cover every third-party
  image. Per the paper, annotations are consensus pixel-accurate; imaging modality
  is a mix of atomic-resolution TEM/STEM and nanoscale TEM, recorded as TEM. Pixel/voxel
  sizes are not stated. Materials-science rather than biological data.'
