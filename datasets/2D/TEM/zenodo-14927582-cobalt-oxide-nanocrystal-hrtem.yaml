title: Transmission electron microscopy images and deep Learning-predicted segmentation for statistical
  analysis of cobalt oxide nanoparticles
short_name: Co3O4 nanocrystal HRTEM segmentation (TEM)
description: High-resolution TEM images (4096 x 4096 px, 10 HDF5 files, one per synthesis condition) of
  sub-10 nm Co3O4 nanocrystals, with neural-network-predicted segmentation masks for the same images,
  plus a hand-labelled training set (training_images.h5 / training_labels.h5; 992 image/label patches
  of 512 x 512 px per the paper) used to train a residual U-Net.
