notes: 'Zenodo API record, both zips (peek_archive: 10 HDF5 files each, ~671 MB uncompressed apiece) and
  the open-access paper full text (Europe PMC PMC11526432) read. Paper: 727 images, 441,067 nanocrystals;
  labels hand-drawn in MATLAB Image Labeler, 992 512x512 training patches from Co0.4, Co0.6, Co0.7 (pixel
  size 33-86 pm), test patches from Co0.5. Only training_labels.h5 is hand-labelled; Segmented_images.zip
  is CNN-predicted, so source is mixed. n_items = 727 from the paper, not counted in the HDF5 files (internal
  shapes not read). Pixel size varies per condition (0.033-0.086 nm), so voxel_size_nm is null. Paper
  is CC BY-NC-ND but the data record is CC-BY-4.0. Related: dryad-d1sp93-hrtem-nanoparticle-segmentation
  (same group, different data). enricher: HDF5 headers read: training_images 256x512x512 float64, training_labels
  256x512x512x2 float64 (two channels; values not read).'
