title: Peptide Nanowire Segmentation Dataset (TEM image patches with binary masks)
short_name: Peptide nanowire segmentation (TEM)
description: 3035 TEM image patches (512 x 512 px) of peptide nanowires in dispersed and networked morphologies, each
  paired with a binary nanowire mask, split into 2135 training, 600 validation and 300 test patches. Built for the
  WaveBiSeNet segmentation paper from 200 original TEM micrographs (100 dispersed, 100 network) imaged in the Emrick
  group at UMass Amherst; masks come from HSV thresholding with morphological clean-up and SAM-assisted manual correction.
