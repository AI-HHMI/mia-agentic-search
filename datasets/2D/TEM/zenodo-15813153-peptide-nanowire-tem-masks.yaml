  notes: 'Zenodo listing: 1 file data.rar, 649,021,070 bytes, exact (size_bytes). RAR can''t be listed or read here, so I
    range-read the uncompressed Mendeley copy (dataset.tar) instead: 6 MB in 3 range reads, walking the tar headers. test/label:
    512x512 L PNGs with values {0,255} (38+ files read). test/src starts at byte 1,786,880; read 0007/0008/0024/0035.jpg:
    512x512 RGB JPEG uint8, channels identical, 0-255, mean 137-155 (sample). The Zenodo RAR is assumed to have the same layout
    (the harvester saw data/test/label/0007.png at its start). That isn''t verified, so listing_complete is false. Pixel size
    not found; checked: image headers, Zenodo + Mendeley metadata, the paper full text (Europe PMC PMC12609667), and the upstream
    Zenodo 6377141 description. Download: data.rar direct (usable, range requests), but TensorSwitch can''t open RAR or tar
    members, so there is no per-file sample URL; the Mendeley tar returned 403 to download-check.'
