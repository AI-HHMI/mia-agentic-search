notes: 'Single 649 MB data.rar that peek_archive cannot list; a range read of its start showed data/test/label/0007.png, so labels are PNG. Image file extension not seen, png is assumed (enricher to confirm). Zenodo, Mendeley Data (10.17632/pptr5cgjb2.1, CC BY 4.0, adds code) and the paper agree on 3035 samples, split 2135/600/300. The paper says the 200 source micrographs come from the Lu/Montz/Emrick/Jayaraman peptide nanowire TEM set (Zenodo 6377141); this is the mask version cropped to patches and may overlap catalog record zenodo-7025602-nanowire-tem-morphology. Pixel size not stated on either page or in the paper Methods. Materials (peptide) TEM, not tissue.'
