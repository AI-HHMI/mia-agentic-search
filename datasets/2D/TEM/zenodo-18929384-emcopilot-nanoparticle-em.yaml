notes: 'Archive (peek_archive): 01_experimental_images (156), 02_manual_labels (166), 03_SAM_masks, 04_generated_masks
  (330), 05_synthetic_images (330), 06_adapted_images (5940), model checkpoints, 09_in_situ_experiments
  (.dm4). npj full text not reachable (login redirect, PDF 429). A preprint by the same group (arXiv 2407.19544,
  names EMcopilot/tGAN; not linked from the deposit, so not in publications) describes the PtSn images
  as HAADF-STEM (2048 px, 0.019-0.038 nm/px) plus BF-TEM; modality kept as TEM since the schema has no
  STEM. Deposited 01_01 PNG is 1024x1024 RGB, uncalibrated (probe, 2026-10-29), matching neither preprint
  size, so voxel size is null. Split and exact classes unknown. Materials-science EM. enricher: sampled
  Au_ZSM5 and PtSn pairs: binary 0/255 PNG masks; experimental PNGs are 8-bit RGB.'
