short_name: Catalyst nanoparticle EM with labels (TEM)
description: Source data for the EMcopilot self-supervised segmentation study. Contains experimental electron micrographs
  of supported catalyst nanoparticles (PtSn/Al2O3 nanoparticles and clusters, Au/ZSM5), manual segmentation labels
  for 166 images, SAM-generated masks, generated masks, synthetic and domain-adapted images, in situ image sequences,
  and model checkpoints.
