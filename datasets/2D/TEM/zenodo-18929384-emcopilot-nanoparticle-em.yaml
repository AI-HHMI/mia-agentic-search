notes: 'Archive listed with peek_archive: 01_experimental_images (156 images), 02_manual_labels (166 files), 03_SAM_masks,
  04_generated_masks (330), 05_synthetic_images (330), 06_adapted_images (5940), model checkpoints (.pth/.pt), 09_in_situ_experiments
  (.dm4/.dmw). Modality recorded as TEM from sample type (catalyst nanoparticles, .dm4 Gatan files) - not explicitly
  confirmed, as the paper full text is not open access (Nature page requires a login redirect, DOAJ returned 403,
  Europe PMC has no full text). Pixel size, label file format details and train/test split not verified on the dataset
  page or file listing. Materials-science EM rather than biological. Label coverage and exact annotation classes
  unknown. enricher: sampled Au_ZSM5 and PtSn pairs: binary 0/255 PNG masks; experimental PNGs are 8-bit RGB.'
