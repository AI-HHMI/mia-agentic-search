  notes: 'Listing: HF bucket tree API (recursive, 94 pages), 93,536 files, exact sizes summing to the
    bucket API size 904,455,594,501 B; tools/listing.py does not read HF buckets, so size_source is page-stated
    (bucket API). Headers: DM4 tags parsed with a requests-only range reader (608,890 + 623,308 B read):
    STEM image 1024x1024 uint32 (DataType 11), 0.9616 nm/px, 200 kV, indicated mag 200,000x, signal ADF;
    EDS SI 50x48x2048 uint32, 0.2287 nm/px, 0.01 keV/channel. A TIFF export probed: 1024x1024 uint8 palette,
    single page. No pixel data sampled, so value_range is null. Voxel size: per image, varies with magnification;
    not set at record level (checked DM4 headers, bucket README, record notes on paper). Download: resolve/
    URLs are direct (range requests OK, host allowed); no single archive, so download_url stays the bucket
    page. TensorSwitch cannot read DM3/DM4; conversion needs a DM reader.'
