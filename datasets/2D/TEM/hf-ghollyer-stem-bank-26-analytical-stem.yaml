notes: 'Borderline training signal: no pixel-level annotations; labels are element names inferred from
  sample/file names (paper: F1 93.3% on 100 audited samples) and microscope-control trajectories in SQLite
  DBs. Images are Gatan DM3/DM4 (no enum value), so formats=[other]; 3,012 TIFF and 3,591 JPEG exports
  also exist. CC BY 4.0 from the arXiv page. enricher: size 904,455,594,501 B from the HF bucket API (listing
  of all 93,536 files sums to it; was null). enricher: coverage partial (session_elements.csv: 975 of
  1,499 sessions have elements; was unknown). enricher: voxel size left null: per-image calibration varies
  with magnification (DM4 headers: 0.96 nm and 0.229 nm/px; README: magnification 80x to 1.2e8x). Includes
  EDS/EELS spectrum images.'
