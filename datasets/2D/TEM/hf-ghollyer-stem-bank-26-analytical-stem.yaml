notes: 'Borderline training signal: no manual pixel-level annotations. The paper calls it a ''usable training
  corpus'' built around microscope-control trajectories (from metadata changes between sequential images)
  plus element labels inferred from file names (F1 93.3% on 100 audited samples). Raw files are Gatan
  .dm3/.dm4, so formats=[other]. HF bucket page: 904 GB, 93,536 files (paper: 929 GB). CC BY 4.0 comes
  from the arXiv page; the GitHub README and bucket page state no license. Pixel size not reported in
  the paper page (may be in .dm headers, not read). Authors not listed on the pages read. Includes EDS/EELS
  spectrum images as well as 2D images.'
