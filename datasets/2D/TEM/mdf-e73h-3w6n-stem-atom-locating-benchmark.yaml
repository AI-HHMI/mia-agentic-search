  notes: 'Whole file downloaded once (233,921,879 bytes) and read with h5py; nothing unpickled (pandas
    column names read from raw PyTables attributes). 299 groups per key (imgs, raw, coords, metadata row),
    not 300 as the paper says. axes yx: 2D arrays, rows = y. value_range of raw and coords are from image
    0000 only; raw ranges differ per image (e.g. uint16 2185-7667 for 0150). imgs normalization: every
    sampled image spans exactly 0-255 and the paper calls it an 8-bit image for visualization, so contrast-stretched.
    raw normalization none: the paper calls it the raw image (simulated values are float counts). metadata/table
    columns: Atoms/px, contrast, dose, peak intensity, pixelsize_pm, probe current, resolution_pm, flyback
    error, Poisson dB, random drift, key, material/orientation, space group, type (simulated/experimental).
    Voxel size varies per image (pixelsize_pm 2.7-60) and is in that table, so imaging.voxel_size_nm stays
    null. Non-biological samples (crystal lattices), so organism stays empty. The file also holds imgs/NNNN,
    an 8-bit uint8 copy of raw/NNNN for visualization (paper), same shapes, each spanning 0-255 (contrast-stretched);
    left out of arrays because it is not a separate label or target.'
