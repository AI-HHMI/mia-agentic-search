notes: 'Landing page (Materials Data Facility) shows title, authors, CC-BY 4.0 and a Globus download link
  only; it has no description, file list or sizes. Counts (86 simulated SrTiO3 + 99 simulated WS2 + 37
  + 32 experimental series + 46 experimental other lattices = 300), labeling (simulated: known positions;
  experimental: manually labeled then refined by 2D Gaussian fitting, hence source mixed) and the HDF5
  packaging come from the arXiv paper (Methods, Table 1). Pixel size varies per image (5-60 pm simulated,
  about 5-44 pm experimental) so voxel_size_nm is null. Globus listing could not be read, so annotations_verified
  is false and size is unknown. No fixed train/test split. Not read via paper.py (arXiv DOI not resolved);
  full arXiv PDF was read directly.'
