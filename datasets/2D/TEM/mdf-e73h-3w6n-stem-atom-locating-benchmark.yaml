title: Benchmark Dataset for Locating Atoms in STEM images
short_name: Atom column locating benchmark (atomic-res STEM)
description: 300 simulated and experimental atomic-resolution STEM images (SrTiO3 [100], WS2 [0001] and
  46 experimental images of other lattices, defects and interfaces), each labeled with atomic column positions,
  with image series varying pixel size, resolution, contrast, noise, flyback error, drift and dose. Packaged
  as an HDF5 file on the Foundry / Materials Data Facility.
