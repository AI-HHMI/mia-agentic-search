notes: 'Counts, labeling (simulated: known positions; experimental: manually labeled then refined by 2D
  Gaussian fitting, hence source mixed) and the HDF5 packaging come from the arXiv paper (Methods, Table
  1); paper.py found no open full text, so the arXiv PDF was read. No fixed train/test split. Pixel size
  varies per image, so voxel_size_nm is null. enricher: direct https file link from the MDF search API
  (was Globus only); downloaded wei_atom.h5: 299 images, not 300 (195 simulated, 104 experimental), n_items
  300 -> 299; coords seen, annotations_verified true; size from file listing; per-image pixel size 2.7-60
  pm (metadata table pixelsize_pm).'
