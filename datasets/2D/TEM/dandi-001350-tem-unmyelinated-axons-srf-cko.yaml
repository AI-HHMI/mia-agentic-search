notes: 'Found via the ASTIH paper (MIDL 2026), dataset TEM2. 134 assets: 86 raw TEM PNGs, 31 label PNGs (10 axonmyelin,
  10 uaxon, 7 nuclei, 4 process); about 10 images are annotated (sub-373C sample-0001 has two small annotated ROI
  chunks). enricher: pixel size 4.93 nm confirmed in all 10 subjects'' _TEM.json sidecars. enricher: source mixed:
  the labels'' dataset_description.json says axon labels are manually corrected AxonDeepSeg pseudo-labels (proofread),
  process and nuclei are manual. 8000x, high pressure freezing, imaged at UC Berkeley. The PNAS paper is the data
  origin only. ASTIH cites DOI 10.48324/dandi.001350/0.250511.1527. Download via DANDI API/CLI.'
