notes: 'Found via the ASTIH paper (MIDL 2026), dataset TEM2. Asset listing (134 files): 86 raw TEM PNGs,
  31 label PNGs (10 axonmyelin, 10 uaxon, 7 nuclei, 4 process), so only about 10 images are annotated
  (sub-373C sample-0001 has two small annotated ROI chunks). Pixel size 4.93 nm is from the sidecar JSON
  of sub-366A only; other subjects were not checked and may differ. The DANDI description gives 8000x
  magnification, high pressure freezing, imaging at UC Berkeley. The PNAS paper (full text read via
  Europe PMC) is mainly about SRF in oligodendrocytes and does not describe the segmentation; it
  is the data origin only. The
  dandiset has no DOI on the draft; ASTIH cites 10.48324/dandi.001350/0.250511.1527. Download is via
  DANDI API/CLI.'
