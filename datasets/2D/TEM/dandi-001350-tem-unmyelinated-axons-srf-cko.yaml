title: TEM Images of Corpus Callosum in Flox/SRF-cKO Mice
short_name: Mouse corpus callosum unmyelinated axons (TEM)
description: 86 high-pressure-frozen transmission electron microscopy images (8000x) of the corpus callosum of 10
  wild-type and SRF conditional-knockout mice, imaged to make unmyelinated axons visible. 10 images carry manual
  masks for myelinated axons+myelin, unmyelinated axons, and (on a subset) oligodendrocyte nuclei and processes.
  BIDS microscopy layout; part of the ASTIH collection.
