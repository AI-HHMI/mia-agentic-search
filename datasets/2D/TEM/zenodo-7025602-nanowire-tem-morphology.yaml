notes: 'Zenodo API record and file listing read; dispersed.zip listed with peek_archive (100 jpg + 100
  *_label.png); seg_mask_5_resolutions.zip holds 5 npz files. Masks exist only for dispersed and network
  (stated in the description); bundle and singular have class labels only. Paper (Digital Discovery 2022)
  full text not available via Europe PMC (not open access), abstract empty; pixel size, microscope and
  magnification not stated on the record, so voxel_size_nm is null. Total 7.2 GB includes encoders and
  third-party subsets (CEM500K, TEM virus, AutoDetect-mNP, ImageNet) that are not part of the 400 nanowire
  images. The sample is synthetic/bio-derived nanomaterial, not a cell or tissue. enricher: *_label.png
  files are overlays, binary masks are only in the npz arrays (see technical.notes).'
technical:
