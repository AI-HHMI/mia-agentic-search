  text not available via Europe PMC (not open access), abstract empty; pixel size, microscope and
  magnification not stated on the record, so voxel_size_nm is null. Total 7.2 GB includes encoders
  and third-party subsets (CEM500K, TEM virus, AutoDetect-mNP, ImageNet) that are not part of the
  400 nanowire images. The sample is synthetic/bio-derived nanomaterial, not a cell or tissue.'
