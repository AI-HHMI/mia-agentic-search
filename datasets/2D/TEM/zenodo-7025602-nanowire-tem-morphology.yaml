title: Transmission electron microscopy (TEM) image datasets of peptide / protein nanowire morphologies
short_name: Peptide/protein nanowire morphology (TEM)
description: 400 TEM images (JPEG) of bio-derived protein nanowires and synthetic peptide nanowires, 100 each
  for four morphologies (bundle, singular, dispersed, network). The dispersed and network images (200)
  come with manual binary nanowire segmentation masks (PNG); 5-resolution mask arrays (NPZ) are also
  provided. The record also bundles trained self-supervised encoders and subsets of third-party TEM
  datasets (CEM500K, TEM virus, AutoDetect-mNP) used for pretraining.
