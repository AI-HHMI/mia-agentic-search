notes: 'Pixel size is derived, not stated: every frame covers a 32 um field of view (paper; RawData file names:
  [w 2048px][FoV 32000 nm]). enricher: voxel size 31.25 nm = 32 um / 1024 px, the grid of the low-quality frames
  and of GT (was 15.6, which is the GT_hr / 2048 px grid, 15.625 nm). TrainTestVal.zip lists 644 TIFFs (calibration
  grid 45 and kidney 47 high-quality targets, each with five registered low-quality frames; 653 MB uncompressed);
  RawData.zip lists 1961 TIFFs (enricher). The task is deblurring (restoration), recorded as denoising as the closest
  schema value. Species of the kidney tissue is not stated in the Zenodo page or paper text read. Size is the sum
  of the two Zenodo files.'
