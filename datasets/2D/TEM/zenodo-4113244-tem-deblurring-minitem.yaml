title: Transmission Electron Microscopy Dataset for Image Deblurring
short_name: TEM motion-deblurring image pairs (MiniTEM)
description: Pairs of motion-blurred low-quality and high-quality transmission electron microscopy images
  of thin-sectioned kidney tissue and of a calibration grid, collected on a MiniTEM (Vironova AB). High-quality
  frames are 2048 x 2048 px with 50% overlap; motion-blurred frames are 1024 x 1024 px (16-bit TIFF, 15
  ms exposure, 32 um field of view). Provided as raw sequences (RawData.zip) and as registered train/validation/test
  splits (TrainTestVal.zip) with five registered low-quality frames per high-quality image (GT and GT_hr
  folders).
