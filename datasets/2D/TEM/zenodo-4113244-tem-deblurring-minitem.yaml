notes: 'Pixel size is derived, not stated: the 2048 px high-quality frames cover a 32 um field of view
  (Zenodo description), giving about 15.6 nm per pixel; the 1024 px low-quality frames use the same
  field of view. TrainTestVal.zip lists 644 TIFFs (calibration grid 45 and kidney 47 high-quality targets,
  each with five registered low-quality frames; 653 MB uncompressed); RawData.zip (3.2 GB) was not listed
  because the remote index read failed. The task is deblurring (restoration), recorded as denoising
  as the closest schema value. Species of the kidney tissue is not stated in the Zenodo page or paper
  text read. Size is the sum of the two Zenodo files.'
