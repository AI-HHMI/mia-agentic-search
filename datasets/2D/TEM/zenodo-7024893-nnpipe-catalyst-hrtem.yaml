notes: 'Counts from the zip listing (peek_archive): experimental_images/au_ge has 93 files in img/ and 93 in gt/; pd_c has
  88 (300kX) + 8 (400kX) in each of img/ and gt/. The 1.3 GB zip is a mixed bundle (code, notebooks, YOLOv5/SegNet weights,
  simulation scripts) and size_bytes is its whole size; the image/gt TIFFs are about 1.8 GB uncompressed. au_ge_dataset_info.txt
  states 0.0824 nm/pixel at 300kX; no scale was found for Pd/C (no pd_c info file in the zip), so voxel_size_nm is null. The
  nNPipe paper was not found in Europe PMC/Crossref, so no publication is listed and the labelling method is not stated on
  the dataset page; annotations.source is unknown. Ground-truth maps are inferred to be segmentation images from the description
  ("ground truth for Pd/C and Au/Ge systems", "binary segmented maps"); their pixel encoding was not inspected.'
