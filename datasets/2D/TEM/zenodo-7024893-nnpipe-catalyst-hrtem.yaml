notes: 'Counts from the zip listing: experimental_images/au_ge has 93 img/ and 93 gt/ TIFFs; pd_c has 88 (300kX) + 8 (400kX) in each
  of img/ and gt/. The 1.3 GB zip also holds code, notebooks, YOLOv5/SegNet weights and simulation scripts; size_bytes is the whole
  zip. voxel_size_nm is null because the subsets differ: au_ge_dataset_info.txt 0.0824 nm/pixel (300kX); pd_ge_dataset_info.txt 0.0824
  nm/pixel for 300 kX, 0.0618 nm/pixel for 400 kX. enricher: paper found (npj Comput Mater, 10.1038/s41524-022-00949-7); annotations.source
  manual (paper: binary ground truth by manual segmentation by two experts working independently; was unknown); ground truth is binary
  nanoparticle masks (0/255), checked in samples.'
