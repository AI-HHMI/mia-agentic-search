notes: 'rxrx2-images.zip (HTTP HEAD 195,634,244,262 B) holds 791,718 PNGs = 131,953 sites x 6 channels
  (paths rxrx2/images/<cell type-experiment>/Plate<n>/<well>_s<site>_w<channel>.png, sites 1-4); rxrx2-metadata.zip
  holds metadata.csv, README and a CC BY-NC-SA 4.0 LICENSE (non-commercial). Labels are treatment identities
  and concentrations (classification / phenotypic profiling), not pixel annotations; no train/test split
  column in the README schema. Species inferred from the HUVEC name (paper Methods: human umbilical vein
  endothelial cells). Pixel size and microscope not stated on the page or README. Paper is a bioRxiv preprint
  (Cuccarese et al. 2020), whose Methods describe the 1536-well assays. enricher: size = all 3 archives
  incl. embeddings (was images zip only); metadata.csv read in full: 131,953 sites, all HUVEC.'
