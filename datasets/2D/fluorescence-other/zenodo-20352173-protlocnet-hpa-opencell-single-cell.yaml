notes: 'Single 21 GB ProtLocNetData.tar.gz (gzip tar, no random member access). Enricher streamed its first 150 MB: HPACustom/ with
  subcellulars.txt, gen_pairs.csv and test/<Ensembl gene ID>/<uuid>.png; train split and OpenCell part lie further in the archive and
  were not listed, so file count and layout beyond that are unverified. Channels per Zenodo description: protein, nucleus, mask. No
  paper linked; Europe PMC/Crossref found none by title, so resolution and annotation provenance are unknown. enricher: annotations
  verified from sampled PNGs (3rd channel binary mask) and subcellulars.txt; coverage dense (every crop carries a mask).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "ProtLocNetData.tar.gz (21.0 GB; first 150 MB streamed)\nHPACustom/\n  subcellulars.txt   (Ensembl,Subcellular location)\n\
      \  gen_pairs.csv      (Pair_ID,Image_A_Path,Image_B_Path,Width,Height,Complexity_A,Complexity_B)\n  test/\n    ENSG00000003249/\
      \  <uuid>.png x21\n    ENSG00000004534/  <uuid>.png x21\n    ... (28 gene folders, 1,373 PNGs in the first 150 MB)\n  (train split,\
      \ OpenCell part: not reached)"
    n_files: 1
    listing_complete: false
  sample: null
  arrays:
  - role: raw
    path_pattern: '**/*.png'
    format: png
    axes: yxc
