notes: 'Single 21 GB ProtLocNetData.tar.gz. Its first ~60 MB were streamed with a range request and listed: HPACustom/ with
  subcellulars.txt, gen_pairs.csv and test/<Ensembl gene ID>/<uuid>.png (PNG, one folder per gene); the rest of the archive
  (train split, OpenCell part) was not listed, so the file count, the train/test layout and the OpenCell folder are unverified.
  Channels (protein, nucleus, segmentation mask) and the intended tasks come from the Zenodo description only; PNG channel
  layout and pixel size were not checked. No paper is linked on the record and Europe PMC/Crossref found none by title, so
  imaging modality, resolution and annotation provenance (masks are presumably computed, not manual) are unknown.'
