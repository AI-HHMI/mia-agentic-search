    alignment: not-applicable
    alignment_notes: 'Channels per Zenodo description: c0 = protein fluorescence, c1 = nucleus, c2 = cell segmentation mask (c2 observed
      binary 0/255 in 4 samples; c0/c1 have 131-256 grey levels).'
  - role: label
    path_pattern: '**/*.png'
    format: png
    axes: yxc
    shape:
    - 448
    - 326
    - 3
    shape_varies: true
    dtype: uint8
    compression: png
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: background
    - id: 255
      name: cell
    alignment: same-grid
    alignment_notes: 'Label is channel c2 of the same PNG as the raw channels, so pixel-aligned by construction. Image-level classes:
      subcellular location per gene folder from HPACustom/subcellulars.txt.'
  notes: 'Archive is gzip tar: no listing without reading it end to end, and no member URLs, so technical.sample is null and TensorSwitch
    can only take the whole archive. Streamed 150 MB + 6 MB (header text) of the archive head (enricher scratch script, Python tarfile
    + Pillow). 4 sampled PNGs: RGB uint8, shapes 448x326 to 744x980 (varies per crop), value_range [0,255] from these samples only.
    layout covers only the first 150 MB. size_bytes is the exact Zenodo API file size of the compressed archive (page-stated, as the archive contents were not fully listed). voxel size not found; checked:
    PNG (no calibration), Zenodo API record (description, no notes/related ids), subcellulars.txt and gen_pairs.csv heads, paper search
    (none). Crops come from HPA and OpenCell, which image at different pixel sizes, and may be resized; no source states the crop pixel
    size.'
