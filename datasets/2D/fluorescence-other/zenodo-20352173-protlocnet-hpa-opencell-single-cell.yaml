description: Single-cell crops from the Human Protein Atlas (HPA) and OpenCell, each sample stored as three channels (protein fluorescence,
  nucleus image and a cell segmentation mask). Released for morphology-aware protein localization representation learning, protein identity
  prediction, subcellular localization inference and localization-pattern-based protein retrieval.
