notes: 'The image zip was listed with peek_archive - 192 .Bmp files (96 wells x 2 channels, named Channel
  1/2-<well index>-<row>-<col>-00), matching the page. BMP is not in the schema format enum, hence formats
  other. No pixel-level annotations, only assay-condition labels, so this suits translocation classification
  or dose-response benchmarking. Pixel size is not stated on the page; acquisition on the CellCard reader
  at Vitra Bioscience, 10x objective, per the page. The page lists no published results using this set
  and the main BBBC paper (Ljosa 2012) is not open access. enricher: size now all 4 files; BMP opened
  (1024x1360 uint8).'
