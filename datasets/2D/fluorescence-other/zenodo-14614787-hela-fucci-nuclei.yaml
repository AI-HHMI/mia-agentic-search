notes: 'Single 7z archive (769.6 MB); its contents could not be listed (peek_archive handles zip only), so
  formats is other, per-image shape and the number of images in the subset are unknown, and dimensionality
  2D is an assumption from the nucleus-image use. Lateral pixel size 0.102 um is from the parent study
  S-BIAD1659 (Opera Phenix Plus, 63x water, 5 focal planes 1 um apart, 20 min frames); it is not stated on
  the Zenodo page. Labels in the parent study: G1 217,465, S 257,984, G2/M 160,855 nuclei, cell-cycle phase
  assigned manually from PIP-FUCCI intensity along Cellpose-segmented, TrackMate-tracked nuclei with all
  15,026 tracks reviewed (paper Methods); the segmentation mask itself is automatic (Cellpose 2.0 fine-tuned).
  The full study is under CC0 on the BioImage Archive; this Zenodo subset is CC-BY-4.0.'
