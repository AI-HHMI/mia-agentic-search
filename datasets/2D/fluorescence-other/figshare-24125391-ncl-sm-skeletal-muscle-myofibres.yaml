notes: 'Figshare API record (Newcastle data.ncl repository) lists NCL_SM.zip (5.9 GB) plus a consent-form zip. Zip listing: NCL_SM_IF (19 sections) and NCL_SM_IMC (27 sections), each with Images (RGB PNG, contrast-stretched), Images_raw (single-channel TIFF), and mask folders Mask_All_Myofibres, Mask_All_AM, Mask_AM_vs_NAM, Mask_All_Freezing_Damaged_Myofibres, Mask_All_non_transverse_Myofibres, Mask_folded_regions, Mask_QA_*. Paper: 50,434 myofibres annotated by Gamaed specialists in the Apeer platform; 30,794 analysable, 1,538 freezing-affected, 18,102 non-transverse, 405 folded regions. Pixel size not found on the figshare record or in the arXiv paper text, so voxel_size_nm is null. IF microscope and IMC instrument not named in the paper text read. The first modality is IF; IMC (metal-tagged antibodies) has no schema value so it is listed as other. Image PNGs are large (50-180 MB each).'
