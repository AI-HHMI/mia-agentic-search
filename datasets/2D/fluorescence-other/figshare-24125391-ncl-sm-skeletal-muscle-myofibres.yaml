title: 'Newcastle Skeletal Muscle (NCL-SM): A Fully Annotated Dataset of Images from Human Skeletal Muscle
  Biopsies'
short_name: Skeletal muscle myofibre segmentation (IF and IMC)
description: 46 human skeletal muscle tissue-section images (19 immunofluorescence, 27 imaging mass cytometry)
  from healthy controls and patients with genetically diagnosed muscle pathology, with manual segmentation
  of 50,434 myofibres plus masks for analysable myofibres, freezing-damaged myofibres, non-transverse
  myofibres and folded tissue regions. Images are dystrophin (membrane) and VDAC1 (mitochondrial mass)
  RGB composites, with raw single-channel TIFFs.
