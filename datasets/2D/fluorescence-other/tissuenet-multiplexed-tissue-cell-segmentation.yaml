notes: 'From the paper (PMC9010346): data is "available at datasets.deepcell.org for non-commercial use"
  (custom terms, no SPDX id or license URL found); 80/10/10 train/val/test split; images cropped to 256x256;
  1.3M whole-cell and 1.2M nuclear annotations; human, mouse and macaque. The deepcell page fetched this
  run showed only a header, so file format (probably not in the listed formats), file listing, exact image
  count, size, voxel size and access mode (registration assumed) are NOT verified. Annotation source (human-in-the-loop
  crowdsourced, corrected by experts) mapped to proofread. Unverified fields need maintainer check.'
