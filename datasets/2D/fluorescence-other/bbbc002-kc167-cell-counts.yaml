description: 50 fields of view (512x512, 8-bit TIFF, DNA channel only) of Drosophila melanogaster Kc167 cells stained with Hoechst 33342, imaged on a Zeiss Axiovert 200M. There are 5 samples with 10 fields each, one wild-type (nodsRNA) and four RNAi knockdowns (48, 340, Anillin, mad2). Ground truth is a tab-delimited file with per-image cell counts from two human counters.
