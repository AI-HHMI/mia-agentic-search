notes: 'Annotations are only per-image cell counts (two human counters, who differ by about 16%), not masks, so the training signal is weak; the ml task is other (cell counting). No license or terms of use appear on the BBBC002 page; the paper (CC-BY article) does not cover the images. Pixel size is not on the page or in the paper. The zip (3.6 MB, listed with peek_archive) holds 50 DAPI-named TIFFs plus a stray .DS_Store. Checked the page, zip listing, counts file and the CellProfiler paper full text; the paper describes the Kc167 cell-count validation but no acquisition details beyond the page. The paper does not state which counts file entries it used.'
