schema_version: '1.2'
id: dryad-ht76hdrk7-ifc-immunological-synapse
title: An imaging flow cytometry dataset for profiling the immunological synapse of therapeutic antibodies
short_name: T-B cell immunological synapse (imaging cytometry)
description: '2,899,575 multichannel imaging flow cytometry images (Amnis ImageStreamX Mark II, 60x; brightfield, F-actin,
  MHCII, CD3, P-CD3zeta, live/dead) of primary human memory CD4+ T cells conjugated with B-LCL cells, from nine donors
  in four experiments under several conditions (-SEA, +SEA, Ctrl-TCB, CD19-TCB, CD20-TCB, Isotype, Teplizumab). Each
  image is saved as an HDF5 file with the 16-bit image, channel-wise segmentation masks exported from IDEAS, and, for
  5,221 expert-annotated images, a class label (nine immunologically relevant cell classes, e.g. synapse with signaling).'
