schema_version: '1.2'
id: deepcell-spotnet-fish-spot-detection
title: SpotNet
short_name: SpotNet FISH spot detection (fluorescence)
description: SpotNet is the DeepCell training dataset for fluorescent spot detection (Polaris spot detector). Per the Polaris paper
  it holds 1,000 images of 128x128 px - 400 seqFISH images of cultured cells, 400 published MERFISH tissue images and 200 published
  SunTag nascent-protein images - rescaled to 110 nm pixels, each with spot coordinate annotations (y) next to the raw images (X).
  Loaded through the DeepCell API with a key.
