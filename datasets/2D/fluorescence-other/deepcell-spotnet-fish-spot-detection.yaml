notes: 'Access is through deepcell.datasets (SpotNet version 1.1 in the docs example) with a DeepCell API key; no public file listing or direct download
  was found, so formats, size and splits beyond the val split in the example are unverified. The docs state a modified Apache license for non-commercial
  academic use only, linked to the deepcell-tf LICENSE (recorded as custom). Counts, 110 nm pixel size and the annotation method come from the Polaris
  preprint Methods (PMC10508757): spot labels are a consensus of several tuned classical spot-detection algorithms combined by a generative model
  (weak supervision, hence automatic), not hand-drawn. The paper Data availability says data and annotations are available for academic use at the DeepCell
  data gallery. The 1,000 images include previously published MERFISH and SunTag images; organism is not stated per image set. Counts are from the preprint and
  may differ from the current dataset version.'
