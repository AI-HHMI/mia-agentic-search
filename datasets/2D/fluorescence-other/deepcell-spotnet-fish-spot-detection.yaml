notes: 'Access via deepcell.datasets.SpotNet (v1.1 default) with a DeepCell API key; no public listing or direct download.
  Docs: modified Apache license, non-commercial academic use (custom). Counts, 110 nm pixels and the weakly supervised (automatic)
  consensus spot labels come from the Polaris preprint Methods (PMC10508757); Data availability points to the DeepCell data
  gallery. enricher: n_items 1000 -> 1038 (v1.1 splits in the deepcell-tf loader). enricher: organisms (was []): Homo sapiens
  = 400 seqFISH HeLa images (Methods 5.1.3) and MERFISH ref 26 (human cells, Moffitt 2016); Mus musculus = MERFISH ref 27
  (mouse ileum); SunTag set (ref 28, Boersma 2020) organism not stated in what was read. All sets are mixed in the same split
  files.'
