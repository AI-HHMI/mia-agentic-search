  notes: 'Metadata-only: the SpotNet zips are fetched by deepcell.datasets from users.deepcell.org with an API key (registration),
    so they were not listed or opened. File names, md5 hashes, split sizes (v1.1: 849 / 95 / 94 images of 128x128 px) and
    the inner layout (train/val/test .npz with keys X and y) come from the deepcell-tf loader source (spot_net.py, dataset.py).
    npz is not a schema format, hence format other. The public SpotNetExampleData-v1_0.zip holds Polaris tutorial inputs/outputs,
    not training pairs, so no sample. The deepcell-data S3 bucket refuses listing (AccessDenied). Size unknown: no listing,
    no stated size, X/y dtypes unknown. Voxel size 110 nm from the paper (images rescaled to 110 nm pixels); z not applicable
    (2D).'
