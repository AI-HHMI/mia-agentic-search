title: U2OS G3BP1-mCherry stress granule fluorescence images with stress granule/cytoplasm and nuclear
  masks
short_name: U2OS stress granule masks (fluorescence)
description: 130 single-cell 512 x 512 16-bit fluorescence images of G3BP1-mCherry (stress granule marker)
  in U2OS cells under DMSO, oxidative-stress, DDX3-inhibitor and combined treatments (time points of 30
  min and later), each with a 2-page uint8 'LoGsegm_V4' stress granule and cytoplasm segmentation mask
  and, for 116 of them, a nuclear mask. The masks were used to classify single-particle trajectories in
  the SPaCe-MC analysis (companion dataset dataset_SPT_GEMs).
