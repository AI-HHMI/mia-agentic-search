    - 1
    normalization: none
    encoding: binary
    classes:
    - id: 0
      name: stress granules (channel 0)
    - id: 1
      name: cytoplasm (channel 1)
    alignment: same-grid
    alignment_notes: 'Pairs with the raw file of the same name minus _LoGsegm_V4 (README). Two binary
      channels, (C,Y,X): channel 0 = particles/stress granules, channel 1 = cytoplasm (SG_segmentation_SPT.py:
      seg[...,0] = kept_mask, seg[...,1] = cell_mask, transposed to CYX before tifffile.imwrite). Plain
      tifffile TIFF, no calibration.'
  - role: label
    path_pattern: '*_NucMask.tif'
    format: tiff
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 255
    normalization: none
    encoding: binary
    classes:
    - id: 255
      name: nucleus
    alignment: same-grid
    alignment_notes: Pairs with the raw file of the same name minus _NucMask; present for 116 of 130 cells.
      ImageJ TIFF, 146.5 nm/px like the raw. Values {0,255}; the code (preprocessing.load_segmentation_tif)
      reads it as a boolean nucleus mask.
  notes: 'Listing: figshare API, 377 files, 244,355,706 B exact (file-listing). Probed headers of cell
