notes: 'Figshare record (377 files, 244 MB, CC BY 4.0) and its README were read. The files listed in the record
  are 130 images, 130 LoGsegm_V4 masks and 116 NucMask files plus README. Headers of one image (512 x 512
  uint16, ImageJ calibration 146.5 nm), one LoGsegm mask (2 x 512 x 512 uint8) and one NucMask were read
  by range request. The README calls the mask a stress granule and cytoplasm segmentation but does not
  define the values of its two pages or say how the masks were made (the name suggests a LoG-based method),
  so the annotation source is left unknown. Microscope, objective and labelling protocol are not stated
  on the record or in the preprint abstract (full text not open access). The companion tracking dataset
  dataset_SPT_GEMs is a separate record and not covered here.'
