notes: 'Channels vary by source (Allen 3, HPA 4, Cell Painting 5; concatenated side by side per file),
  so channels is null. n_items sums the README counts (65,103 + 66,936 + 88,249). The 28 GB tar.gz was
  not listed; layout is from the README. Labels are classification only (cell-cycle, protein localization,
  compound); no masks. CC-BY 4.0 per paper, but users must follow the original datasets Research Use Agreements.
  Pixel size not stated on Zenodo or in the arXiv HTML text. 2023 benchmark, distinct from the AWS CHAMMI-75
  record. Modality varies by source, hence fluorescence-other. enricher: label CSVs seen in the archive
  head (annotations_verified true); formats ome-tiff+png per README and sampled PNGs; download_url now
  the direct tar.gz.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: './                              2 files   28.1 GB  CHAMMI.tar.gz (28,115,309,454 B), README.md
      (4,521 B)

      CHAMMI.tar.gz contents (from README.md and the first 30 MB of the archive):

      CHAMMI/combined_metadata.csv    45,896,319 B, 220,284 rows (CP 88,245, HPA 66,936, Allen 65,103)

      CHAMMI/Allen/enriched_meta.csv

      CHAMMI/Allen/crops/*.ome.tiff   65,103 crops, 1122 x 238 (3 channels side by side)

      CHAMMI/HPA/enriched_meta.csv    28,815,110 B, 66,936 rows

      CHAMMI/HPA/crops/*.png          66,936 crops, 512 x 2048 (4 channels side by side)

      CHAMMI/CP/enriched_meta.csv

      CHAMMI/CP/crops/{BBBC022,CDRP,LINCS}/<plate>/<well>/<site>/*.png   88,249 crops, 800 x 160 (5 channels)'
    n_files: 2
    listing_complete: true
  sample: null
