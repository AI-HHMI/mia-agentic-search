notes: 'Channels vary by source (Allen 3, HPA 4, Cell Painting 5; concatenated side by side per file), so channels is null. n_items sums the README counts (65,103 + 66,936 + 88,249). The 28 GB tar.gz was not listed; layout is from the README. Labels are classification only (cell-cycle, protein localization, compound); no masks. CC-BY 4.0 per paper, but users must follow the original datasets Research Use Agreements. Pixel size not stated on Zenodo or in the arXiv HTML text. 2023 benchmark, distinct from the AWS CHAMMI-75 record. Modality varies by source, hence fluorescence-other.'
