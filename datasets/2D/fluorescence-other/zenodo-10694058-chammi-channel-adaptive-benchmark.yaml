  notes: 'Listing: Zenodo API (2 files, 28,115,309,454 B exact); the tar.gz cannot be listed by range,
    so the tree inside is from README.md plus a scratch script that gunzipped the first 30,000,000 B (one
    range request): combined_metadata.csv, HPA/enriched_meta.csv and 101 complete HPA PNG crops, all 512
    x 2048 uint8 greyscale, values 0-255 (value range from these samples only). Allen and CP crops were
    not reached, so their shape orientation and dtype are from the README only. No per-file sample unit:
    the only direct file is the 28 GB tar.gz (TensorSwitch cannot pull single tar.gz members), so sample
