title: Fluorescence microscopy cell detection datasets with bounding boxes (six cell types)
short_name: Fluorescent cell detection boxes (6 cell types)
description: 'Six fluorescence microscopy datasets for cell detection with Pascal VOC bounding boxes (plus YOLO-format labels):
  erythroblasts (DAPI, glycophorin A), neuroblastoma N1E115 (phalloidin, DAPI), fibroblast GM5756T (nucleopore), eukaryote
  cells (DAPI), C127 cells (DAPI) and HeLa (peroxisomal SCP2-GFP), each with train and test image lists. Released with a paper
  on object detection networks and an augmented reality microscope.'
