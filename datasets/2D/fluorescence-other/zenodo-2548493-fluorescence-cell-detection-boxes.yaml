notes: 'Zip listed with peek_archive: 1,363 JPGs and 1,359 XML files in 8 folders (neuroblastoma 360 + 360 for the two channels, erythroblast 169 + 169, HeLa 110, eukaryote 80, C127 65, fibroblast 50 JPG / 46 XML), plus YOLO labels and scripts. Two-channel sets appear as two folders, so n_items counts channel variants of the same fields. Paper (bioRxiv, full text read): most images from an Olympus IX73, 100X 1.4 NA, Prime sCMOS; pixel size and widefield vs confocal not stated, so voxel size is null and modality fluorescence-other. Neuroblastoma images come from the Cell Image Library, ground truth converted from segmentations to boxes. Organisms not stated, so left empty. The CC BY-NC link in the preprint is the article license; the Zenodo record is CC BY 4.0. A newer Zenodo version exists.'
