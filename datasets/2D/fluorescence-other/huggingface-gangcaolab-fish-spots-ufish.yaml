notes: "Mix of real experimental images (seqFISH, ExSeq, MERFISH, smFISH, MiP-Seq, cropped to 512x512 from public sources) and simulated images (Sim-FISH, DeepSpot) per the paper's Methods; the 3D and noise subsets are mainly simulated. File counts from the Hugging Face API tree: 2d/image 4166 TIFF + 2d/image_raw 4166 TIFF + 2d/csv 4166 CSV; 3d/image 101 TIFF + 101 CSV; noise/image 300 TIFF + 300 CSV (total about 3.2 GB; n_items counts the 4166 2D + 101 3D + 300 noise images). Spot coordinates are CSV (axis-0, axis-1 columns in the one file read). Pixel size and microscope are not stated for the combined set (they differ by source). The README and paper say the spots are manually verified; the README lists '160,000' spots while the preprint says 1,638,108, so spot count is not recorded. The README states MIT; some real images come from other public datasets whose own terms were not checked."
