notes: 'Mix of real experimental images (seqFISH, ExSeq, MERFISH, smFISH, MiP-Seq, cropped to 512x512
  from public sources) and simulated images (Sim-FISH, DeepSpot) per the paper''s Methods; the 3D and
  noise subsets are mainly simulated. n_items counts the 4166 2D + 101 3D + 300 noise images. Pixel size
  and microscope are not stated for the combined set (they differ by source). The README and paper say
  the spots are manually verified; the README lists ''160,000'' spots while the preprint says 1,638,108,
  so spot count is not recorded. The README states MIT; some real images come from other public datasets
  whose own terms were not checked. enricher: 2d/meta.csv flags each image as simulated or real with its
  source and spot count; 3d images are multi-page 256x256 TIFFs with 3-column coordinates.'
