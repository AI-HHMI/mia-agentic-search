notes: 'Record is the Zenodo deposit; the 2D benchmark datasets are in spotiflow_datasets.zip (697 MB, 1715 tif + 1715 csv, listed with peek_archive; smfish/test seen, other subsets per the zip README: synthetic simple/complex, DNA FISH, HybISS, MERFISH, Telomeres, Terra). Five large images (HybISS OME-TIFF, Platynereis 3D DAPI+POUIV smFISH volume) are included as extra unannotated files. Pixel size varies by subset (e.g. 0.34 um or 0.15 um mouse embryo HybISS, 129 nm Platynereis) so voxel_size_nm is left null; per-subset image counts are not stated in the paper (read via bioRxiv full text; Europe PMC returned 503); the paper Data availability section was not read. Some zip subsets were taken from third-party data (Finn 2019, Zhang 2021, Eichenberger 2021) and may carry their own terms. Dimensionality 2D refers to the benchmark zip.'
