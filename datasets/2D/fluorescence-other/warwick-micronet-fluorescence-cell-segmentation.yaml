notes: 'Only 10 images (6 Train, 4 Test .mat), at the lower size limit. No license on the Warwick page; the only term is to cite the Micro-Net paper. The archive also holds results (metrics, overlays, MicroNet
  proximity maps) and MATLAB evaluation code, which are not training data. data.formats other: the only data format is MATLAB v5 .mat (no listed format applies). enricher: organism Mus musculus, sample
  (mouse pancreata, TIS microscope) and annotations.source manual (''ground truth ... marked by an expert biologist'') from the arXiv preprint 1804.08145v2, Sec. 2.1 (were [], unknown). enricher: 2D confirmed:
  every variable is 2048x2048 (paper: 10 images of 2048 x 2048 pixels, 11,163 cells), although some file names contain 3D010. enricher: size from file listing.'
