notes: 'Only 10 images (6 Train, 4 Test .mat files, about 15-33 MB each), so this is at the lower size limit. No license on the Warwick page; the only term is to cite the Micro-Net paper. The paper is not open access via Europe PMC and was not read, so species and cell type, microscope, pixel size, annotation procedure and who annotated are unconfirmed (annotation source unknown). Dimensionality 2D is inferred from the .mat sizes and ReadMe (two channels dapi and ecad); some file names contain 3D010 and the .mat contents were not opened. The archive also holds results (metrics, overlays, proximity maps from the model) and MATLAB evaluation code, which are not training data. data.formats other because the only data format is MATLAB .mat (no listed format applies).'
