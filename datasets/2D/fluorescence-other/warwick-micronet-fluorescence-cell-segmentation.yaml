  notes: 'Files are MATLAB 5.0 MAT (not v7.3/HDF5; header ''MATLAB 5.0 MAT-file, Platform: PCWIN64, Created on: ... Dec 2018''), zlib-compressed variables; read with a minimal stdlib MAT5 parser (no MATLAB/scipy).
    path_pattern ''(var)'' names the MAT variable. Two file families: LC33SEC234VF*.mat store dapi/ecad as uint16; 2015/2016 *_Ecad_*.mat store them as double in [0, 1] (paper: TIS images aligned and normalized).
    Value ranges from one file per family: LC33SEC234VF04 (717 max id, 636 distinct label values) and 20160216_..._3D010 (1213 max id). axes yx assumes MATLAB rows = image y (column-major dims [2048, 2048]);
    square images, so only a transpose is at stake. Voxel size not found; checked: .mat headers (no calibration), ReadMe.txt, Warwick page, arXiv 1804.08145v2 full text (no pixel size), Raza et al. 2016
    BioData Min (PMC4779207: TIS at 63x, ~206 nm/pixel, but 1056x1027 human colorectal images, so not these 2048x2048 files; not used). Download: warwick.ac.uk zip supports range requests but is not on
    the TensorSwitch allowlist. Dataset is 2D, not covered by the miao layout yet.'
