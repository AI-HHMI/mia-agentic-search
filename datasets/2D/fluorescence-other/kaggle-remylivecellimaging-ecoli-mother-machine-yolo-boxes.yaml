notes: 'Kaggle API record (MIT, 378 MB, one .npy file, 7,083 samples including augmentation) and the open-access paper (Ripandelli
  et al. 2024, J Phys Chem B), whose data statement links this set as the cell detection training data (a YOLO-style detector
  for cells inside channel crops; Nikon Ti-2, 1.49 NA 100x, mKate2). Array shapes and the 64 x 256 crop size come from the Kaggle
  description and file name; the .npy was not opened. Labels come from manual bounding boxes per the paper (not inspected in
  the file). Augmented copies mean the number of independent crops is lower and no split is given. The same owner has the
  mask set and the tracking set.'
