notes: 'Zip index read without downloading: 3132 TIFFs = 1,044 image folders x (image, semantic mask,
  instance mask). The Zenodo record also holds nine other public datasets (Lizard, BBBC038, Kromp, Cellpose,
  BBBC039, NuInsSeg, TissueNet, IEEE TMI 2019, MoNuSeg) with mixed licenses (see mixed_licenses.txt in
  the record); this record covers only CellBinDB.zip (CC0-1.0 record licence). Annotation per paper: ~60%
  manual, remainder semi-automatic (model prediction manually revised, two review rounds). Voxel size
  not stated on the Zenodo page, file listing or paper Methods (only objectives 10x/0.75 and 20x/0.5 and
  scanners); train/test split not provided in the release as far as the record and paper show. enricher:
  zip listing and samples confirm 1,044 folders x (img, mask, instancemask) TIFFs; size unchanged (matches
  the listing).'
