title: 'CellBinDB: A Large-Scale Multimodal Annotated Dataset'
short_name: CellBinDB cell/nucleus segmentation (DAPI/H&E)
description: 1,044 annotated microscopy images (109,083 annotated cells) of stained tissue sections from
  more than 30 human and mouse tissue types, covering DAPI, ssDNA, H&E and multiplex immunofluorescence
  staining. Each image has semantic and instance masks. 844 mouse/rat images come from in-house experiments
  and 200 human images from the 10x Genomics open data platform.
