notes: 'Images zip: 864 PNG files, 421.5 MB; ground-truth zip: 5 PNG, 4.6 MB (size_bytes is the sum). Labels are sparse: only five of the 864 images carry per-nucleus seeds (page: manually annotated with cell type, see section 2.4 of the paper); the rest have well-level control information (columns 01 have 4000 hepatocytes per well, columns 23 have 9500). The paper full text is not open access via Europe PMC and was not read; only the abstract and the dataset page were, so microscope, objective, pixel size and the annotation procedure are unconfirmed. Page states the images are CC BY 3.0 (Anne Carpenter and David Logan). Whether the seed images are 8-bit PNG overlays or masks was not opened.'
