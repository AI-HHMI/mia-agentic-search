  notes: 'Listing: the 55 plate zips and CSVs were listed by Content-Length with listing.py, but the server
    reset the connection partway through every full run, so the size stays page-stated (the page gives
    exact bytes per zip). One zip listed in full (Week1_22123: 720 TIFFs, 1,890.3 MB uncompressed). Probe:
    plain single-page TIFF, uint16 1024x1280, uncompressed; header text gives exposure 10 ms, binning
    1x1, no pixel size. Sample (one DAPI TIFF, 934,567 bytes read): values 240..7280, 407 unique values,
    all multiples of 16 in the percentiles seen (p1 448, p50 544, p99 2704), from one sample. moa.csv:
    104 rows (12 MoA classes plus DMSO control). Voxel size not found; checked: TIFF header, BBBC021 page,
    Ljosa 2013 full text (PMC BioC; Methods give no pixel size), Caie 2010 (not open access, abstract
    only), CellProfiler analysis.cppipe. Conversion: 2D records are not covered by the miao layout yet.
    Download: no single archive; data.download_url stays the folder, the 55 direct zip links are on the
    BBBC021 page (all checked zip members usable, range requests).'
