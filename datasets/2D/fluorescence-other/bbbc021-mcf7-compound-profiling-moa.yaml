notes: 'The page says only that the images and ground truth are copyright AstraZeneca Pharmaceuticals;
  no open license is named, so license is unknown. size_bytes is the sum of the 55 plate zip sizes stated
  on the page (45.68 GB); the CSVs are small. One zip was listed (Week1_22123: 720 TIFFs, 839 MB compressed).
  MoA labels cover only 103 compound-concentrations (about 38 compounds) out of 113 compounds x 8 concentrations,
  i.e. a subset of the images, so label coverage is sparse; the page says 6 of 12 mechanisms were identified
  visually and the rest from the literature, so the annotation source is recorded as unknown. The paper
  (Ljosa et al. 2013) is not open access via Europe PMC and was read as abstract only; image size, microscope
  and pixel size were not confirmed (listed TIFFs are about 2.6 MB each). enricher: annotations.source
  manual (page: 6 MoAs assigned visually, the rest from literature; was unknown).'
