notes: Dataset card and full HF file listing read (12 image sets x 3 channels, 12 lysosome masks, 12 cell
  masks, 504 MB); TIFF header probed (2048x2048 uint16, Andor camera metadata, no pixel calibration).
  Card says this is the first 12 sets of a 25-image curation batch, so it may grow. Organism, cell line,
  microscope and pixel size are not stated on the card (file names suggest a plate-based high-content
  acquisition); no paper or author names found, only the HF user. Lysosome masks are hand-curated in Fiji;
  whole-cell masks come from Cellpose, so only the lysosome masks are manual (annotation source marked
  mixed). The cell_masks files carry a .png extension but the probe reads them as 16-bit TIFF, worth checking.
  License MIT per card. Cell-mask format not verified beyond the header probe.
