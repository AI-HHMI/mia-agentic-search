title: Immunofluorescence imaging of whole, developmental, human manual digits identifying key fibroblast
  populations and vascular endothelium
short_name: Fetal digit multiplexed IF masks (fluorescence)
description: 15 whole-slide multiplexed immunofluorescence OME-TIFF images (GE CellDIVE; DAPI, PI16, PRG4
  and VWF markers) of sagittal sections of fetal human manual digits from three donors (14-15 weeks),
  with Cellpose single-cell segmentations and per-cell features packaged as zarr objects for 18 subregions,
  and manual QuPath GeoJSON tissue-region, artefact and ROI annotations.
