notes: 'No paper is named in the BioImage Archive record ("refer to the manuscript"), so publications
  is empty and protocol details were not checked beyond the record. Listing (rounded HTTP index): 15 OME-TIFFs
  (44.9 GB), 18 zarr zips (16.8 GB), 42 GeoJSON names in the annotation file list. One OME-TIFF header:
  uint16, tiled, shape [5, 9381, 20400] cyx, 0.325 um pixels; the record names four markers but the header
  shows 5 channels (fifth not identified). Cell masks come from Cellpose (automatic); tissue regions were
  drawn in QuPath by one annotator, on subregions only (partial coverage). Modality is fluorescence-other:
  the record says only GE CellDIVE fluorescence microscopy. enricher: size_bytes exact from the three
  deposit file lists (raw 44.9 GB, zarr 16.6 GB, GeoJSON 2.4 MB).'
