title: Dual-anchor and single-anchor barcodes datasets for LUMINA training (spectral-lifetime single-cell crops)
short_name: LUMINA FLIM single-cell barcode crops
description: 9,616 six-plane single-cell TIFF crops for training LUMINA, the dual-anchor classifier of Spectral-Lifetime Indexing of Cells
  (SLIC). Single-anchor pretraining data are 7 nucleus-targeted and 14 outer-mitochondrial-membrane-targeted acquisitions (3,536 cells);
  the dual-anchor archive has 6,080 cells over 42 valid barcode classes. Crops sit in class folders named N{nu}_M{mito} with mapping tables
  giving each cell's source acquisition and class. Version 2.0 adds 967 OMM cells from seven acquisitions on 28 May 2024.
