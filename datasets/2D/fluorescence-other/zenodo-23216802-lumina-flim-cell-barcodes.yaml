notes: 'Zenodo API record read; LUMINA_datasets.zip indexed with peek_archive (8,649 TIFF crops of about 0.1-0.3 MB in class folders, plus
  mapping.xlsx). The delta zip (967 cells, 75.7 MB) was not listed. The record points to a SLIC paper, code (BC-FLI-Spectra) and a browser demo
  but cites no DOI, and title searches found no paper, so cell type, organism, microscope, pixel size and how class labels were assigned
  (by construction from the anchor labelling) are not confirmed. Folder indices are classifier class indices, not the barcode numbers
  in the paper. Raw crops contain undefined spectral-ratio values (NaN) per the preprocessing note.'
