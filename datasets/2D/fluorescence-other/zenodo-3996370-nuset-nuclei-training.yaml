notes: 'Overlaps with the catalogued BBBC038 / DSB2018 record: most images are the 543 fluorescent DSB2018 training images
  with manually corrected masks, plus 25 MCF10A confocal images, flipped/rotated copies and synthetic images (all per the
  paper Methods); the zip itself only lists two folders of 3,408 PNGs each (images, masks), so the exact real/synthetic/augmented
  split inside the zip is not documented on the Zenodo page. Binary masks only (touching nuclei are not instance-labelled).
  Pixel size is not stated for the images on the dataset page, in the zip listing or in the paper Methods, so voxel_size_nm
  is null. n_items is the number of image/mask pairs (6,816 PNG files in total). Zenodo page also holds trained model weights
  (two ckpt files), not catalogued here.'
