title: 'NuSeT training dataset: fluorescent nuclei images with binary masks (corrected Kaggle DSB2018 subset plus MCF10A)'
short_name: NuSeT fluorescent nuclei masks (fluorescence)
description: 'Training set of the NuSeT nuclear segmentation tool: 3,408 PNG fluorescence images of cell nuclei and 3,408
  matching binary nuclei masks in two folders (cell_nuclei_train_f_only and cell_nuclei_train_label_f_only). Per the paper
  it is built from 543 fluorescent images of the Kaggle Data Science Bowl 2018 set (BBBC038) with manually corrected masks
  and 25 confocal MCF10A images, augmented by flips and rotations and mixed 1:1 with synthetic images.'
