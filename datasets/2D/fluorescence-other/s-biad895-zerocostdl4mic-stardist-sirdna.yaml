notes: 'Study record (BioStudies API) says: paired fluorescence microscopy images (SiR-DNA) with masks
  from manual segmentation, originally submitted via Zenodo 10.5281/zenodo.3715492 (ZeroCostDL4Mic) and
  not curated. The BioStudies record states no license and no authors, and the pixel size, organism, microscope
  and size in bytes are not stated (a size listing was not produced). file_list.tsv lists 47 mask files
  (45 train, 2 test) with matching source images; file names (cell migration R1/R2 positions) suggest
  nuclei of migrating cells, but the sample is not named. The split column gives train/test. A Test -
  Stacks folder also exists and was not inspected. The ZeroCostDL4Mic paper (not read in this run) is
  the likely reference; none listed. enricher: license CC-BY-4.0 from the original Zenodo record 3715492
  linked by BioStudies (was unknown); masks are instance IDs (sample).'
