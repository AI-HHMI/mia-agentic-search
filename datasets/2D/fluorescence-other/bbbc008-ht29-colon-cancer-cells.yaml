  notes: 'Listing of both zips linked from the page: 8,403,847 B exact (52 members; images zip also holds
    3 illumination-correction .mat files, not opened). Sampled one DNA (channel1) pair: image uint8 512x512,
    range 8-255, 247 values; normalization unknown. The mask is a 1-bit TIFF with photometric 0 (WhiteIsZero):
    read as stored, 13,437 px are 0 and 248,707 px are 1. So the stored bit 1 probably means background,
    and a reader that ignores the photometric tag gets inverted masks. sample.py crashes on bool arrays,
    so the mask was measured with a scratch script (repo read_member + tifffile). One pair only.'
