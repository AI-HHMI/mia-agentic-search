notes: 'No license on the page, only "provided for research purposes only". Counts from the page: original 37 images (10 train,
  27 test in Huh7/HepG2 test sets), extended 61 images (3329 nuclei); n_items = extended. peek_archive: original zip has 37 jpg
  images plus 37 extensionless annotation files per image (~1.6 MB each); extended zip has 61 jpg plus 61 .gold files. Annotation
  file encoding (instance vs semantic) not documented on page; both papers are paywalled (abstract only), so pixel size, microscope
  model and annotation file format could not be confirmed. instance-segmentation inferred from the page ("nuclei were manually annotated").
  Sources checked: landing page, zip listings, Europe PMC records of both papers (abstracts).'
