notes: 'Zip listing (peek_archive): Mouse actin/diaphragm.tif and Mouse actin/sample_attempt2.tif, 210.1 MB each. Paper (arXiv 1911.12291, Experiments): 100 calibration images (diaphragm images with only mounting medium in view) and 100 noisy realizations of the same static sample, made public for PN2V benchmarking; averaging the realizations gives a pseudo ground truth. No clean target files are shipped (annotations.present false), so usable for unsupervised/self-supervised denoising rather than as restoration pairs. Microscope type, pixel size and image shape are not stated on the Zenodo page or in the paper text read (frame shape not claimed; 210 MB per stack is consistent with 100 frames of 1024x1024 16-bit but this is not stated). Modality recorded as fluorescence-other for that reason.'
