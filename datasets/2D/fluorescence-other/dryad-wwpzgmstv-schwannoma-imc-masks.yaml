notes: 'License is not stated on the Dryad page (only Dryad generic terms of reuse), so spdx is unknown. No related paper is listed on the page, so none was read. Number of images/ROIs, pixel size and mask counts are not stated on the page, README or file listing; images.zip and masks.zip could not be listed (server reports no size for the download endpoint). Masks were generated automatically with the Bodenmiller ImcSegmentationPipeline; one ROI (NF2VS10.1b) was lost. Total size 2.45 GB includes the 1.28 GB AnnData and CSVs; images.zip is 700 MB, masks.zip 14.6 MB.'
