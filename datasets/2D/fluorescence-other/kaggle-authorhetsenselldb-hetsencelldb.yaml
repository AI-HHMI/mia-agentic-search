title: 'HetSenCellDB: Heterogeneous Cell Dataset for Segmentation and Senescence Classification'
short_name: U87 senescence cell masks (fluorescence)
description: Aligned brightfield and fluorescence microscopy images of drug-induced senescence in U87 glioblastoma cells,
  with expert annotations. 52 whole images come with nucleus and cytoplasm segmentation masks, plus 735 single-cell crops
  (phase, nucleus and cytoplasm views) labelled as normal, quiescent, senescent-like or fully senescent, and morphometric
  tables.
