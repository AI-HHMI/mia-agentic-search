notes: 'Sources: Kaggle API record (CC0, 3.67 GB, anonymous author, updated 2026-05-07) and the complete file listing (2,578
  files). whole_image: 52 images in brightfield, nucleus and cytoplasm channels (original and normalized) with 52 nucleus
  and 52 cytoplasm masks. labeled_crops: 735 crops per view (phase, nucleus, cytoplasm) in fully_senescent 205, normal 391,
  quiescent 67, senescent_like 72. No paper, authors, DOI, microscope, pixel size or stains could be found (anonymous page;
  web search found nothing). Modality fluorescence-other because the microscope type is unstated. enricher: masks hold per-cell
  integer IDs (human_labels.csv refers to cyto_id), so instance-segmentation (was semantic-segmentation); download_url is
  the anonymous Kaggle archive API URL (was the landing page).'
