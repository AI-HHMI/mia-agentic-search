notes: 'Read the BBBC017 page in full. Neither paper has open full text (Moffat et al. Cell 2006; Ljosa et al. Nat Methods
  2012), so only abstracts were read; pixel size and microscope settings are not stated (Cellomics ArrayScan, 512 x 512 px).
  The labels are screen-level (shRNA identity, puromycin treatment per plate) in BBBC017_v1_metadata.xls, not pixel masks;
  they support classification/profiling rather than segmentation. Images are Cellomics DIB files, not in the schema format
  enum, hence format other. License on the page: CC BY-NC-SA 3.0. enricher: size 55,589,026,364 B from the full listing of
  the 28 zips + xls (was null); annotations_verified true (metadata xls seen in listing); confidence 0.55->0.6.'
