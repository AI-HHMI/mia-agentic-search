id: bbbc017-ht29-shrna-mitotic-screen
title: 'BBBC017: Human HT29 cells, arrayed lentiviral shRNA mitotic-regulator screen (DNA, pH3, actin)'
short_name: HT29 shRNA mitosis screen (fluorescence)
description: Arrayed RNAi screen of human HT29 colon cancer cells (Moffat et al. 2006) with 5,376 shRNA samples per replicate
  on 384-well plates, in two replicates (14 puromycin-treated, 14 untreated plates). Six fields per sample, 64,512 fields
  of view, three channels (Hoechst DNA, phospho-histone H3 mitosis, phalloidin actin), 512 x 512 px, in 28 per-plate ZIP archives
  of DIB files (193,536 image files). Labels are per-well metadata (shRNA construct and its target gene, puromycin treatment
  per plate) in an Excel spreadsheet; there are no pixel-level masks.
