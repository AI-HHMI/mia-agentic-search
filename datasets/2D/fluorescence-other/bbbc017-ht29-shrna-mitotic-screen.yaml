notes: 'Read the BBBC017 page in full and listed one plate archive with tools/peek_archive.py (NIRHTa+001.zip: 6912 .dib files,
  3.6 GB uncompressed; 28 zips of about 1.7-2.0 GB each per the page). Neither paper has open full text (Moffat et al. Cell
  2006; Ljosa et al. Nat Methods 2012), so only abstracts were read; pixel size, objective and microscope settings are not
  stated on the page (images come from a Cellomics ArrayScan, 512 x 512 px). The metadata spreadsheet BBBC017_v1_metadata.xls
  was not downloaded, so annotations_verified is false; its contents are taken from the page text. The labels are
  screen-level (shRNA identity, puromycin treatment per plate), not pixel masks; as with BBBC022 in this catalog, they
  support classification/profiling rather than segmentation. Images are Cellomics DIB files, not covered by the schema format
  enum, hence format other. License text on the page: Creative Commons Attribution-NonCommercial-ShareAlike 3.0.'
