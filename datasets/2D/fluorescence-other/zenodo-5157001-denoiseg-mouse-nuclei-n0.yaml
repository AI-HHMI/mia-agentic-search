notes: 'Zip (12.4 MB) lists only Mouse_n0/train/train_data.npz (10.0 MB) and Mouse_n0/test/test_data.npz
  (2.5 MB); enricher: .npz opened (allow_pickle=False): X_train 908x128x128, X_val 160x128x128, X_test
  67x256x256 (uint8, 0-255); Y_* same shapes, uint16, 0-231 with 48-54 distinct ids each, so instance
  ids (NumPy .npz is not a schema format, hence other). Counts come from the DenoiSeg paper (arXiv 2005.02987):
  908 train + 160 validation patches and 67 test images of nuclei in mouse skull, ground truth used as
  a 3-class foreground/background/border problem; the paper gives no microscope, pixel size or annotation
  procedure, so modality is a best fit and annotation source unknown. Noise-free n0 version; noisy variants
  are generated by adding Gaussian noise. Sibling DenoiSeg record on the same paper: Flywing n0 (zenodo-5156991),
  a different tissue and image set. Sources checked: Zenodo record and API, zip listing, paper text.'
