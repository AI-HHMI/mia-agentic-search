notes: No licence is stated on the BBBC012 page (checked this run); the other BBBC sets carry CC BY 3.0 or CC0 notices,
  so this one is left unknown. The page says 48 images per control (96 total), but the zip lists 360 .tif files
  (144 pmk1_plate2 + 216 wt_plate2, three channels each), so n_items follows the listing. Authors are not named on the page. Pixel
  size not stated; imaged on a Discovery-1 (Molecular Devices) at MGH, per the page. A Z-prime of 0.21 is reported for this set by
  Wahlby et al. 2012; the main BBBC paper (Ljosa 2012) has no open full text.
