title: 'BBBC012: C. elegans infection marker (clec-60 promoter GFP)'
short_name: C. elegans clec-60 GFP infection (fluorescence)
description: Transgenic C. elegans expressing a clec-60 promoter GFP fusion, which is upregulated during S. aureus
  infection. Positive control is the pmk-1(km25) mutant and negative control is wild type. 360 16-bit TIFF
  images (696x520 px; brightfield, GFP and mCherry channels) in folders pmk1_plate2 (144 files) and wt_plate2 (216 files).
  Labels are the control class of each folder, not pixel annotations.
