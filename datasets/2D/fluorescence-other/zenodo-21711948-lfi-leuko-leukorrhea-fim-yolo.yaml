title: LFI-Leuko - fluorescent immunoassay microscopy images of leukorrhea with YOLO boxes
short_name: Leukorrhea FIM cell detection (fluorescence)
description: De-identified clinical fluorescent immunoassay microscopy (FIM) images for automated leukorrhea testing,
  annotated with YOLO bounding boxes for 12 clinically significant categories including epithelial cells, bacteria
  and fungi. Annotations were validated by senior pathologists with a double-blind cross-validation protocol. The
  images are split by target morphology and scale into three archives (hyphae, large-size targets, small-size targets),
  each with train / val / test folders.
