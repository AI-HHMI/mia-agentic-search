notes: 'Listed all three zips with peek_archive: HyphaeDataset 532 JPEG + 533 txt (train 372, val 80, test 80;
  classes.txt = Hyphae), LargeSizeTargetDataset 2,747 JPEG + 2,748 txt, SmallSizeTargetDataset 3,965 JPEG + 3,966
  txt (7,244 images in total; the txt files are the YOLO labels plus one classes.txt each). The classes.txt of
  the large and small archives could not be read (Zenodo range requests failed), so the 12 category names and
  per-class counts are not recorded. Image resolution, pixel size, imaging system and a paper were not found on
  the record (no related publication listed); modality is fluorescence from the Fluorescent Immunoassay
  Microscopy description. Species set to Homo sapiens for the clinical gynecological specimens. License CC BY-NC
  4.0 as stated on the record.'
