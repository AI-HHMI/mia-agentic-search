notes: 'Zip listing: DSB2018_n0/train/train_data.npz and test/test_data.npz; npy headers read: X_train
  and Y_train (3800,128,128) float32, X_val (670,128,128) uint8, Y_val (670,128,128) uint16, X_test and
  Y_test (50,) object arrays. n_items 4520 = 3800+670+50 from those shapes. Paper (arXiv 2005.02987):
  images from the Kaggle 2018 Data Science Bowl (BBBC038 source), patches 128x128; noisy versions n10/n20
  add Gaussian noise (separate deposits). Organism, modality detail, pixel size and the annotation procedure
  are not stated on the Zenodo page or in the paper text read; fluorescence-other is a best fit for the
  DSB nuclei images used. Siblings: zenodo-5156991, zenodo-5157001 (open PRs). enricher: annotations.types
  semantic -> instance-segmentation (Y arrays hold 4-10 integer ids per patch, max 369).'
