notes: 'Training signal is the paired viral-reporter image (y.npy) predicted from nuclear/brightfield input (x.npy),
  plus Cellpose masks (automatic, test split only; none for VACV). Formats: processed data are .npy arrays inside
  zips, so other; archive member listing was not possible (RODARE does not report a file size for range requests),
  so annotations_verified is false. Pixel size not stated on the RODARE page or in the paper (only 4x/10x magnification);
  the raw data come from IDR idr0128/0129/0130 (HSV, IAV, RV), the Plaque2.0 and iScience papers (VACV, HAdV). enricher:
  n_items 3308 processed images (filename_to_index.zip: HAdV 411/118/59, HSV 672/192/96, IAV 627/179/90, RV 537/154/77,
  VACV 66/18/12 train/val/test). size_bytes is the sum of the 13 files of version 3900 (raw and processed). Raw
  sources of HSV/IAV/RV may already be catalogued from IDR, and this record is the processed paired derivative.'
