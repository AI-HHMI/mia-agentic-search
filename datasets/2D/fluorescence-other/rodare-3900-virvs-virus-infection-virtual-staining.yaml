id: rodare-3900-virvs-virus-infection-virtual-staining
title: A Dataset for Virus Infection Reporter Virtual Staining in Fluorescence and Brightfield Microscopy
short_name: Virus-infection virtual staining (fluorescence)
description: VIRVS benchmark data. Paired, registered multi-channel high-content images of virus-infected cells
  for virtual staining, i.e. predicting the viral reporter signal (GFP or anti-NP) from nuclear-stain and/or brightfield
  input. Five viruses, each with train/val/test splits (0.7:0.2:0.1) stored as x.npy (input) and y.npy (viral signal)
  - HAdV (A549, 10x, Hoechst + brightfield), VACV (BSC40, 4x, stitched brightfield), and HSV, IAV, RV (fixed end-point
  screen controls, 4x, nuclear stain). Cellpose nuclei (and for HAdV cell) masks are provided for the test data.
  The latest record version also adds raw coronavirus (cov_raw.zip) images.
