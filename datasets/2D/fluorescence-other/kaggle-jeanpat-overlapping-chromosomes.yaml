short_name: Overlapping chromosome pairs (fluorescence)
description: Semi-synthetic images of two overlapping human metaphase chromosomes, built by combining pairs of single chromosomes
  (DAPI plus Cy3 telomere probe merged into one greyscale image) with relative shifts and rotations. Each image has a ground-truth
  label map that separates chromosome 1, chromosome 2 and their overlap, provided as one hdf5 array of 13,434 image/label
  pairs.
