notes: 'Kaggle record (CC BY-NC-SA 4.0, 24 MB, one file LowRes_13434_overlapping_pairs.h5; grey image in channel 0, label in channel 1) and the arXiv paper (Hu et al. 2017):
  single chromosomes from one human metaphase image (DAPI plus Cy3 telomere probe merged to greyscale) were paired with relative shifts and rotations, and labels were computed
  by adding the single-chromosome masks (overlap = 3). The images are synthetic compositions of real chromosome images, so the labels are computed, not hand-drawn. The paper
  describes about 13k images of 94 x 93 px with a cleaned, cropped version that may not match this array. Pixel size, microscope and array shape were not inspected.'
