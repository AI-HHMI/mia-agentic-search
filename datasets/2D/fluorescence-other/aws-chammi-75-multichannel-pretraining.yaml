notes: 'Released for self-supervised pre-training (paper trains DINO, MAE, SimCLR), so no labels are claimed for
  the train set. S3 listing: CHAMMI-75_train has one folder per source study (hpa0018, hpa0023, idr0001 ...), each
  holding single-channel PNG files such as ..._channel-0.png; CHAMMI-75_test has CELLPHIE, CHAMMI, HPAv23, Jump-CP,
  idr0017 and rbc-mc benchmark sets whose labels were not inspected. Counts (2,792,462 fields of view for pre-training)
  come from the paper as summarised from arXiv HTML, not counted from the bucket. Registry says CC BY 4.0, while
  the paper says per-study licences vary (97 percent Creative Commons), so check the source study before reuse.
  Many images repeat IDR and HPA data already in other catalog records. Total size, pixel sizes, authors and release
  date were not found. Modality listed as fluorescence-other as a best guess for a mixed set. enricher: S3 top level
  and study prefixes listed; PNG format and 8-bit single-channel files confirmed.'
