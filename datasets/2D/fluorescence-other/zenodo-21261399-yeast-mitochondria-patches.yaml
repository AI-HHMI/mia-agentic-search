notes: 'From the Zenodo record, its README and both zip listings (3,334 PNG images and 3,334 PNG masks with matching names). Masks were
  produced automatically with Cellpose-SAM from paired brightfield images and then visually quality-controlled, so they mark whole cells,
  not mitochondria. The accompanying study (Interpretable Textural Descriptors for Quantification of Mitochondrial States in Yeast Fluorescence
  Microscopy) has no DOI on the record, so publications is empty. Microscope and objective are not stated; images were resampled to
  0.06 um/px. The images are split into two experiments with different condition coverage; no train/test split is provided. Files: images.zip
  195.4 MB, masks.zip 2.8 MB, metadata.csv, README, LICENSE, CITATION (size_bytes is all six). enricher: masks are binary (0 background,
  1 cell); download_url is the record (two zips, no single archive).'
