notes: 'From the Zenodo record, its README and both zip listings (3,334 PNG images and 3,334 PNG masks with matching names).
  Masks were produced automatically with Cellpose-SAM from paired brightfield images and then visually quality-controlled,
  so they mark whole cells, not mitochondria. The accompanying study (Interpretable Textural Descriptors for Quantification
  of Mitochondrial States in Yeast Fluorescence Microscopy) has no DOI on the record, so publications is empty. Microscope
  and objective are not stated; images were resampled to 0.06 um/px. The images are split into two experiments with different
  condition coverage; no train/test split is provided. The images zip is 195.4 MB and masks.zip 2.8 MB (size_bytes is their
  sum).'
