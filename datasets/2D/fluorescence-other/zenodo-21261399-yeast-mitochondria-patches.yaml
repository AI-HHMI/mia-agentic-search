description: 3,334 fluorescence patches (224 x 224 px, 16-bit, resampled to 0.06 um/px) of single Magnusiomyces magnusii
  yeast cells with DiOC6(3)-stained mitochondria and matching 8-bit cell masks. Cells grew in five media (YPD, YPGal,
  YPGly, SD, acetate) and were sampled on cultivation days 1-3 across two experiments; metadata.csv gives experiment,
  day and medium per patch.
