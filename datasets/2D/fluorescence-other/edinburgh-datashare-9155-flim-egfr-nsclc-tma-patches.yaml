short_name: EGFR-mutant vs wildtype lung FLIM patches
description: 224x224 px fluorescence lifetime imaging (FLIM) patches from tissue microarray cores of surgically
  resected non-small cell lung cancer, acquired on a Leica STELLARIS 8 FALCON. Four folders hold patches
  from cores with known EGFR status (EGFR wildtype, EGFR mutant, exon-19 deletion, exon-21 L858R), prepared
  as direct inputs for the deep-learning classifier of the associated manuscript.
