  notes: 'Listing: DataShare REST API, 4 zips + readme.txt, exact sizes (90,642,741 bytes, complete);
    zip central directories read (198+179+78+177 = 632 PNG). Sampled: Mutant.zip downloaded whole (10.7
    MB) and all 78 PNGs read: RGBA uint8 224x224, range [0,255] over those 78. readme.txt confirms 224x224
    patches from full core images, Leica STELLARIS 8 FALCON. Voxel size not found; checked: PNG headers
    (no pHYs), readme.txt, DataShare item metadata; the manuscript is unpublished and the code repo (github.com/qiangwang57/lung_EGFR_classification)
