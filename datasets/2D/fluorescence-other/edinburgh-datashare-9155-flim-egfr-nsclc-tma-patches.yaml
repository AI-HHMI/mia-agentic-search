notes: 'Four zips (28.6, 23.0, 10.7 and 28.4 MB) listed with peek_archive: 198 + 179 + 78 + 177 = 632 PNG patches. The README says the images are examples for reproducing and evaluating the classifier; each folder comes from a single TMA core, so there are few independent samples. The linked manuscript is under review and was not available (no DOI), so no paper was read; pixel size, FLIM channel and lifetime encoding are not stated. Labels are patient-level EGFR status from sequencing, inherited by the patches.'
