short_name: DNA replication EdU/DAPI nuclei (mESC, U2OS)
description: High-content immunofluorescence images (DAPI, EdU and, for U2OS, PCNA) of mouse embryonic
  stem cells with four Rif1 genotypes (two clones each, with and without OHT) and of U2OS TetON CycE cells
  at five doxycycline time points, acquired at 40x on an Olympus ScanR. A small mESC subset (mESC_annotated)
  was manually categorised for supervised S-phase stage classification; the large remaining image sets
  were used for self-supervised representation learning.
