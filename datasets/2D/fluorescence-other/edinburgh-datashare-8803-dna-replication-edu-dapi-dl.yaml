notes: 'Six tar.gz archives (741 MB annotated mESC subset, four mESC genotype archives of 8-8.7 GB, u2os_TetOn 65 GB; 98.88 GB in total, sizes from the DataShare API). The README (read in full) lists samples per archive and says images are TIFF, 40x, Olympus ScanR, CY5 = EdU, FITC = PCNA (U2OS only). Only the first entry of mESC_annotated was seen (n00_001/..--DAPI.tif); how the manual categories are stored, image counts and pixel size are not stated in the README or the bioRxiv abstract. The preprint full text returned HTTP 429, so Methods were not read. License on the page is CC BY 4.0 (the preprint itself is CC BY-NC-ND). Contents of the other archives were not listed.'
