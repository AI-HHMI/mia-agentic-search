notes: 'Channels: 10 (hallmarks panel) or 8 (immuno-oncology panel), incl. autofluorescence. No pixel-level annotations; the only labels are per-patient overall survival (survival_pseudonymised.csv:
  OS_days, OS_event), not modelled in the annotation types. Usable as an unlabeled / self-supervised set: the BioStudies
  description says it was released to accompany the paper, which uses these images to train self-supervised
  representation models (HyPERSTAC). Pixel size 0.497 um/pixel is from the BioStudies acquisition section. n_items is
  2,731 + 2,657 images from the study description (the folders were not counted). The paper full text could not be
  retrieved this run (Europe PMC preprint full text unavailable, bioRxiv returned 429); only its metadata was seen, so
  the Methods and data availability statement were not checked. TMA block and position are withheld (available on
  request). A GitHub link for the analysis code is listed in the BioStudies record.'
