notes: 'Channels: 10 (hallmarks panel) or 8 (immuno-oncology panel), incl. autofluorescence, so imaging.channels is null.
  No pixel-level annotations; the only labels are per-patient overall survival (survival_pseudonymised.csv: OS_days, OS_event),
  not modelled in the annotation types. Usable as an unlabeled / self-supervised set: the BioStudies description says it accompanies
  the paper, which trains self-supervised representation models (HyPERSTAC) on these images. n_items is 2,731 + 2,657 images
  from the study description (the listing agrees: 2,731 and 2,657 TIFFs). Paper full text not available (Europe PMC / bioRxiv
  give only the abstract). TMA block and position are withheld (available on request). enricher: pixel size 0.497 um confirmed
  by the TIFF headers (XResolution 20114 px/cm); confidence 0.6 -> 0.7 after inspecting the files.'
