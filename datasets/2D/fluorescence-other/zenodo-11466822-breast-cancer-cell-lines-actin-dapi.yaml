notes: 'Zenodo API record, README (read in full) and the zip listing (tools/peek_archive.py: 2,669 TIFF files named *_DAPI, *_FITC and
  *_(FITC+DAPI), 1,969 BMP files and 155 TXT threshold files in per-folder Output directories, about 4.2 GB uncompressed) were used.
  The README says each subfolder holds the DAPI, FITC (actin) and composite images and that folders correspond to the cell lines;
  the BMP/TXT files are analysis outputs (not described in the README). Labels are only the cell line (folder name); there are no
  masks or boxes. The linked paper (Comput Biol Med 2020) is not open access, so only its abstract was read; it covers 15 cell lines,
  so the paper may use more data than this record. Microscope, objective and pixel size are not stated in the record or README (the
  README points to a Dryad DOI 10.5061/dryad.sbcc2frfv; the Zenodo creator is Ashok Prasad, Colorado State University).'
