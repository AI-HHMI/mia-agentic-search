id: zenodo-11466822-breast-cancer-cell-lines-actin-dapi
title: Fluorescent images of actin and DAPI-labelled MCF10A, MCF7 and MDA-MB-231 cell lines
short_name: Breast cell lines, actin and DAPI (fluorescence)
description: Fluorescence microscope images of three breast cell lines (non-tumorigenic MCF10A, MCF7 and
  the metastatic MDA-MB-231) grown on fibronectin and labelled for actin (phalloidin 488, FITC channel)
  and nuclei (DAPI). The data are organised in one folder per cell line and technical replicate, each
  field with a DAPI image, an actin image and a composite, plus per-folder output folders. The images
  were collected to study morphological differences between normal, cancerous and metastatic cells.
