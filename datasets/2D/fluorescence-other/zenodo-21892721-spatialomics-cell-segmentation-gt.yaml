notes: 'Small: only 9 image/label pairs (just under the ~10 image guideline), about 1,000 cells each. Pixel size 390.625 nm:
  paper says annotated images are 400 x 400 um at 1024 x 1024 px; the TIFF headers (Lunaphore, MIBI FOV1, labels) store the
  same calibration. MIBI is ion-beam mass imaging (modality other = MIBI-*.tif*); Lunaphore-*.tif are multiplex immunofluorescence.
  enricher: size 528,996,782 B from the Zenodo file listing (was 529 MB stated, incl. notebooks/xlsx). enricher: coverage:
  MIBI-Breast Cancer raw FOVs are 2048 x 2048 px, their labels 1024 x 1024 (one 400 um annotated region per FOV, crop offset
  not documented); Lunaphore and MIBI-Melanoma labels cover the whole image. enricher: channels differ per platform (22 /
  29 / 20), so imaging.channels stays null.'
