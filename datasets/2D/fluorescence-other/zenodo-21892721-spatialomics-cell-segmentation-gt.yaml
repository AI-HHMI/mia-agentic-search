notes: 'Small: only 9 image/label pairs (just under the ~10 image guideline), about 1,000 cells each. The pixel size is
  derived from the paper statement that annotated images measure 400 um x 400 um at 1024 x 1024 pixels (0.3906 um/pixel);
  not stated directly per file. MIBI is ion-beam mass imaging rather than optical microscopy (modality listed as other);
  the Lunaphore images are multiplex immunofluorescence. Raw files are multi-channel; one MIBI file is 335.6 MB, others
  6-46 MB; channel counts not stated on the record page. Zenodo file listing, paper Methods and data availability read
  via Europe PMC. Size is the sum of the listed files (529.0 MB incl. notebooks).'
