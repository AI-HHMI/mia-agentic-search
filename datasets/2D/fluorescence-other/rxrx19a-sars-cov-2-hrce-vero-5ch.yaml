notes: RxRx19a-images.zip (HTTP HEAD 477,696,173,627 B) holds 1,527,600 PNGs = 305,520 sites x 5 channels (the page says 5
  stains; the Mito channel of RxRx1/2 is absent), paths RxRx19a/images/<cell type-experiment>/Plate<n>/<well>_s<site>_w<channel>.png;
  RxRx19a-metadata.zip holds metadata.csv (46 MB), README and a CC BY 4.0 LICENSE. Labels are disease condition and compound
  identities, not pixel annotations; no split column in the README schema. Species follow the cell-line names (Vero is African
  green monkey, Chlorocebus sabaeus, per the page). Pixel size not stated; PNGs are 8-bit 1024x1024 downsampled from 2048x2048
  16-bit originals (page). The README also cites an April 2020 preprint (10.1101/2020.04.21.054387) on the SARS-CoV-2 screen,
  which could not be fetched in this run (paper tool timed out); only the Cuccarese et al. preprint was read.
