notes: 'Images are Cellomics DIB files (168, 3 channels per field; no DIB entry in the format list, hence
  other); the page recommends Bio-Formats. Outlines archive holds 110 PNGs: nuclei and cells outlines
  for 55 of the 56 fields; well 10779 is excluded by the authors as too blurred. Annotation author not
  named on the page.

  enricher: size_bytes 50,917,924 from the listing of both zips (was 51,000,000 page-stated).

  enricher: download_url set to the landing page (was null); the data are two zips, no single archive.

  enricher: outline coverage checked per file: 55/56 fields have both nuclei and cells outlines.

  enricher: voxel size still not found (page, BBBC017 page, both papers'' open text).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  2 zips  50.9 MB (88.1 MB + 3.0 MB unzipped)\n  BBBC018_v1_images.zip/BBBC018_v1_images/\
      \      168 .DIB  88.1 MB unzipped\n      <wellidx>-{DNA,actin,pH3}.DIB  (56 wells x 3 channels,\
      \ 524,340 B each)\n  BBBC018_v1_outlines.zip/BBBC018_v1_outlines/  110 .png  3.0 MB unzipped\n \
      \     <wellidx>-{nuclei,cells}.png  (55 wells; 10779 excluded)\n"
    n_files: 2
    listing_complete: true
  sample:
    urls:
    - https://data.broadinstitute.org/bbbc/BBBC018/BBBC018_v1_images.zip::BBBC018_v1_images/00736-DNA.DIB
    - https://data.broadinstitute.org/bbbc/BBBC018/BBBC018_v1_outlines.zip::BBBC018_v1_outlines/00736-nuclei.png
    - https://data.broadinstitute.org/bbbc/BBBC018/BBBC018_v1_outlines.zip::BBBC018_v1_outlines/00736-cells.png
    size_bytes: 588589
    description: 'Well 00736: DNA-channel DIB image plus its nuclei and cells outline PNGs'
  arrays:
  - role: raw
    path_pattern: BBBC018_v1_images.zip::BBBC018_v1_images/*.DIB
    format: other
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: uint16
    compression: none
    value_range:
    - 106
    - 3956
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'One file per channel (DNA = Hoechst, actin = phalloidin, pH3). Cellomics DIB: 40-byte
      BITMAPINFOHEADER (biBitCount 16, BI_RGB, biHeight +512) plus 12 more bytes, then 512x512 little-endian
      uint16 pixels from byte 52. Rows are stored top-down despite the positive biHeight (see outline
      check).'
  - role: label
    path_pattern: BBBC018_v1_outlines.zip::BBBC018_v1_outlines/*-nuclei.png
    format: png
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: bool
    compression: deflate
    value_range:
    - 0
    - 1
    encoding: binary
    classes:
    - id: 1
      name: nucleus outline
    alignment: same-grid
    alignment_notes: 1-bit PNG, True = outline pixel (one-pixel nucleus contours, not filled masks). Pairs
      with <wellidx>-DNA/actin/pH3.DIB by well index. In wells 00736 and 13572 the DNA mean inside the
      filled outlines is 925/1534 vs 220/221 outside with rows as stored, but about background (279/246)
      with rows reversed or left-right flipped, so the outlines sit on the rows in file order; a BMP reader
      that flips bottom-up rows would misalign them.
  - role: label
    path_pattern: BBBC018_v1_outlines.zip::BBBC018_v1_outlines/*-cells.png
    format: png
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: bool
    compression: deflate
    value_range:
    - 0
    - 1
    encoding: binary
    classes:
    - id: 1
      name: cell outline
    alignment: same-grid
    alignment_notes: 1-bit PNG, True = outline pixel (cell contours). Same well-index pairing and row
      order as the nuclei outlines.
  notes: 'Listing of both zips linked from the page: 50,917,924 B exact (278 members: 168 DIB, 110 PNG).
    Read 6 DIB files (wells 00736, 13572, all 3 channels) and their 4 outline PNGs with a scratch script
    (zip members by range, 4.3 MB): every DIB is 524,340 B = 52-B header + 512x512 uint16; observed range
    106-3956 over those 6 files (max < 4096, 12-bit-like; normalization unknown). Outline PNGs are 1-bit:
    5,212 / 16,500 True px in 00736 nuclei / cells. Outline values from 2 wells only. sample.py crashes
    on bool PNGs (numpy bool subtract), hence the script. The TensorSwitch source mentions no DIB/Cellomics
    reader; Bio-Formats reads Cellomics DIB. Voxel size not found; checked: DIB header (no calibration
    fields), BBBC018 and BBBC017 pages, Ljosa 2012 and Jones 2009 (PNAS) in Europe PMC / NCBI (not open
    access; only front matter readable), no code repo linked. No single archive: images and outlines are
    two direct zips (both usable, range requests).'
