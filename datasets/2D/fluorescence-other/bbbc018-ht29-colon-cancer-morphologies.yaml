short_name: HT29 cell morphologies segmentation (fluorescence)
description: 56 fields of view (4 per each of 14 enriched samples) of human HT29 colon-cancer cells, 512
  x 512 px, imaged in three channels (Hoechst DNA, phospho-histone H3, phalloidin actin) on a Cellomics
  ArrayScan. Selected to test robustness of segmentation algorithms to morphological variation. Ground
  truth is object outlines (nuclei and cells) provided as PNG images in a separate archive.
