notes: 'Outer zip (peek_archive) holds a 774 MB .keras model and training_data_seg_mix.zip (4,344 PNG
  images in img/, 4,344 PNG masks in seg/, one txt). Objective (Nikon 40x/0.95), camera (Kinetix sCMOS)
  and GFP excitation from the page; widefield vs other fluorescence, mask semantics and splits not stated.
  Manual annotation stated on the page. Sibling record 22237153 (ROI detection) is a separate dataset.
  enricher: one img/seg pair decoded (uint16 30x200 PNG, binary 0/255 mask).

  maintainer 2026-10-31: the MiPS preprint (James, Kempf et al., bioRxiv 2025) cites this record (ref. 21)
  as the 3,000+ manually annotated images DeLTA was retrained on, and gives the same objective/camera
  with a pixel size of 0.1625 x 0.1625 um, used for voxel_size_nm. The preprint does not mention resizing
  before segmentation; the 30x200 crops are assumed native resolution. Preprint full text not in Europe
  PMC; read on bioRxiv.'
