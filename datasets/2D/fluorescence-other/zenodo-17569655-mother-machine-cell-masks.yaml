notes: 'Zenodo page, API record and file listing checked. The outer zip (peek_archive) holds a 774 MB
  .keras model and training_data_seg_mix.zip; the inner zip was listed via HTTP range requests and contains
  4,344 PNG images in img/ and 4,344 PNG masks in seg/ plus one txt file. Objective (Nikon 40x/0.95),
  camera (Teledyne Kinetix sCMOS) and GFP excitation are from the page; widefield vs other fluorescence,
  pixel size, image dimensions, mask class semantics and train/val/test split are not stated on the page
  or in the file listing. No associated paper is linked on the record; the DeLTA 2.0 paper (PLOS Comput
  Biol 2022) describes different phase-contrast agarose-pad data and was not cited. Manual annotation
  is stated on the page. Sibling record 22237153 (ROI detection) is a separate dataset.

  enricher: inner zip inflated and one img/seg pair decoded (uint16 30x200 PNG, binary 0/255 mask).'
