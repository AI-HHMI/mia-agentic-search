  notes: 'Zenodo listing: one file (409,076,283 bytes), which is the whole record, so size is confirmed.
    The outer zip also holds a .keras model (not opened). The inner training_data_seg_mix.zip is deflate-compressed
    inside the outer zip, so it was fetched as one 48.3 MB range request, inflated in memory, listed (8,692
    members: 4,344 img + 4,344 seg + README.txt) and one pair decoded with Pillow, then discarded. README.txt
    only lists the source sessions (Mutagenesis_2025-01-28, UV_by_ROI_2025-02-14, manual_data_10092024,
    2024-09-15-real). Sample image is 16-bit grayscale (PNG mode I;16), 30x200 px, range 0..65535 (fills
    the dtype, 669 unique values; possibly rescaled, but no docs, so normalization unknown); mask is 8-bit
    {0,255}. Filenames carry "30x200" (mother-machine chamber crops); other shapes not checked. Axes assumed
    yx for 2D PNG.'
