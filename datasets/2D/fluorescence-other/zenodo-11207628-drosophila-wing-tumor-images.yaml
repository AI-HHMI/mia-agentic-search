title: Microscopy Images of Drosophila Wing Data + Code
short_name: Drosophila wing tumor vs no-tumor (fluorescence)
description: 215 RGB TIFF microscopy images of Drosophila wing tissue sorted into two class folders, Tumor (76 images) and No_Tumor
  (139 images). Per the record, the Tumor folder holds wings that already have a tumor or will develop one in the following days,
  and No_Tumor holds wings with no sign of tumor or a tiny tumor that will be suppressed. The stated goal is to predict whether
  the fly will develop or suppress the tumor. The deposit also contains the experiment code, TensorBoard logs and trained model
  weights.
