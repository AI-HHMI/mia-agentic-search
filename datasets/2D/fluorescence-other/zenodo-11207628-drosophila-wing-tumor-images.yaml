notes: 'Facts come from the Zenodo API record and from listing/probing Prepared_Images.zip (tools/peek_archive.py, tools/probe.py):
  215 TIFF files (139 in Prepared_Images/No_Tumor, 76 in Prepared_Images/Tumor), each 512x512 px, 3 samples per pixel, uint8, LZW.
  The other six large zips (about 1.9 GB each) and the 423 MB zip hold code, TensorBoard event files and .h5 model weights, not
  images. No paper is cited on the record and none was found by search, so the imaging method, magnification, pixel size, who
  labelled the images and how are not stated in any source read. The fluorescence modality is inferred from file names (e.g.
  "ptcGFPts-scb...") and the images being stored as RGB; the record does not state the modality. Labels are folder-level class
  assignments only (no masks or boxes).'
