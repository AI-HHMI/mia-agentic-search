notes: Figshare record is link-only; files are behind cellpose.org/dataset, which requires an institutional email and acceptance of
  HHMI Research Content Terms (non-commercial), so access is registration. The Figshare API lists CC BY-NC 4.0; the cellpose.org page
  cites HHMI terms and says third-party copyright may apply. File formats, pixel sizes, organism per image and exact file counts are
  not stated on the pages checked (Figshare API, cellpose.org gate page, bioRxiv v2 full text; the published Nature Methods paper is
  not open access), so formats is other, n_items is 616+1139 from the preprint and voxel size is null. Includes 98 non-microscopy images
  and ~86 other web-sourced images; mixed provenance and sources (BBBC, MoNuSeg H&E, ISBI 2009) are re-used from other datasets. Includes
  one 3D expansion-microscopy neuron volume described in the paper that is not part of the 2D counts.
