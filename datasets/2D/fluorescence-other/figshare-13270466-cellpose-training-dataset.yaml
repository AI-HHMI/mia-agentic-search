id: figshare-13270466-cellpose-training-dataset
title: Ground-truth segmentation data used for training Cellpose
short_name: Cellpose cell and nucleus segmentation (mixed)
description: Images of cells from many fluorescent markers and imaging modalities (cytoplasm, membrane, brightfield, nuclei) with ground-truth
  instance segmentations, plus some non-cell microscopy and natural images with repetitive objects. 616 cytoplasm/generalized images
  (69 held out for testing) and 1,139 nucleus images (111 for testing), compiled from public sets (BBBC, MoNuSeg, ISBI 2009, Cell Image
  Library) and manually segmented web images. Used to train the Cellpose generalist segmentation model. Downloaded from cellpose.org
  after accepting terms with an institutional email.
