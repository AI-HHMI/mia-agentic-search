notes: 'Zip (49 MB) lists only Flywing_n0/train/train_data.npz (35.4 MB) and Flywing_n0/test/test_data.npz
  (14.3 MB); enricher: .npz opened (allow_pickle=False): X_train 1428x128x128, X_val 252x128x128, X_test
  42x512x512 (float32, 0-255); Y_* same shapes, uint16, up to 864 with 766-865 distinct ids, so instance
  ids (NumPy .npz is not a schema format, hence other). Counts come from the DenoiSeg paper (arXiv 2005.02987):
  1,428 train + 252 validation patches and 50 test images of a membrane-labelled fly wing, with segmentation
  ground truth treated as a 3-class foreground/background/border problem; the paper says only ''dataset
  from our collaborators'' and gives no microscope, pixel size or annotation procedure, so modality is
  a best fit (fluorescence-other) and annotation source is unknown. This is the noise-free n0 version;
  noisy versions are generated by adding Gaussian noise (std 10 and 20) in the DenoiSeg code. Sources
  checked: Zenodo record and API, zip listing, paper text.'
