title: 'Infection Inspection: 49,061 single-cell fluorescence images of ciprofloxacin-treated E. coli clinical isolates with
  response labels'
short_name: Ciprofloxacin-treated E. coli cells (fluorescence)
description: 49,061 PNG images of Nile Red (membrane) and DAPI (DNA) stained Escherichia coli cells from clinical isolates
  grown with varying ciprofloxacin concentrations, imaged on a Nanoimager-S fluorescence microscope. A metadata table gives,
  per image, the isolate, its MIC, the treatment concentration, the expected sensitive or resistant response and the Zooniverse
  volunteer classifications (about 1.05 million classifications), for antibiotic response phenotype classification.
