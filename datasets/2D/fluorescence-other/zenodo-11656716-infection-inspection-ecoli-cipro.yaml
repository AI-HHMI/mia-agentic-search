notes: 'InfectionInspection.zip (733.7 MB) lists 49,061 PNG (ID0.png ...) plus a 1.6 GB 1_Metadata.csv with the volunteer
  classifications (1,045,200 rows per the README); size_bytes is the sum of the four Zenodo files. License conflict:
  the Zenodo metadata says CC BY 4.0 but the README in the record says "CC BY-NC", so the more restrictive CC-BY-NC-4.0
  is recorded. Labels are the expected sensitive/resistant response per image plus citizen-science classifications,
  not pixel masks or boxes. The CSV has a dataset column (first rows read say Test) that may mark a split, not verified, so
  splits_provided is false. Pixel size is not stated in the paper Methods (Nanoimager-S, 100x oil NA 1.4, sCMOS, 405
  and 532 nm excitation), so left null; the image sizes were not inspected. Organism is E. coli (clinical isolates EC1-6
  plus the reference strain MG1655 in the paper).'
