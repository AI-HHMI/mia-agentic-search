notes: 'InfectionInspection.zip (733.7 MB) lists 49,061 PNG (ID0.png ...) plus a 1.6 GB 1_Metadata.csv with the volunteer
  classifications (1,045,200 rows per the README); size_bytes is the sum of the four Zenodo files. License conflict: the Zenodo
  metadata says CC BY 4.0 but the README says "CC BY-NC", so the more restrictive CC-BY-NC-4.0 is recorded. Labels are the
  expected sensitive/resistant response per image plus citizen-science classifications, not masks or boxes. Organism is E.
  coli (clinical isolates EC1-6). enricher: splits_provided true: README, "dataset: whether the image is part of the Test
  or Training dataset" (was false). enricher: voxel size not applicable as one value: README says 64x64 RGB images, and the
  paper resizes each cell to 64x64 (zero-padding or downscaling), so pixel size varies per cell.'
