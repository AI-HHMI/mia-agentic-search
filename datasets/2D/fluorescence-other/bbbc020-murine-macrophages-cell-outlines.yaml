notes: 'Image zip holds 75 TIFFs (25 fields x c1, c5 and a merged c1+c5 image; about 96 MB compressed, 92 MB on the page). The outline zips hold 701 nuclei and 517 cell mask TIFFs. The BBBC page warns the nuclei outlines are incomplete (missing files could not be obtained from the contributor), and cells that touch the border or cannot be separated have no outline, hence coverage partial. The overview table on the image-sets page says 75 images, the dataset page says 25 images with three channel files each; n_items uses 25. The experiment is from Wenzel et al. 2012, cited by name on the page; the paper was not located, so publications is empty. Pixel size, microscope and objective are not stated on the BBBC page. size_bytes is the compressed image zip only.'
