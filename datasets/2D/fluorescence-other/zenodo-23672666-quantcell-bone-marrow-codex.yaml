  notes: 'Listing: Zenodo API, 5 files, 2,672,910,778 B (complete). Zip members listed with peek_archive.py. Raw header: the QPTIFF member is deflated inside raw_image.zip, so probe.py could not read it; a scratch script inflated the first 113 MB (109 MB downloaded) to read IFD0: BigTIFF, 30264x11147, 8-bit, LZW, 512x512 tiles, XResolution 26497 px/cm = 0.3774 um/px, matching the README. Channel count 45 is from the README (only IFD0 was read). value_range not measured (no sample decoded). Labels: first 15 MB of codex_quantcell_QuantCellPaper.csv inflated to read the header (549 columns: Image, marker_string, Parent, ROI, x, y, shape and per-marker measurements, binary calls, cell_type). Classes: 21 cell types from marker_combinations.json plus Other. Labels are per-cell centroids and classes, not masks; cell outlines are not shipped. Download: no single archive; three direct Zenodo zips (raw_image.zip, quantcell.zip, qupath_exports.zip), all usable with range requests.'
