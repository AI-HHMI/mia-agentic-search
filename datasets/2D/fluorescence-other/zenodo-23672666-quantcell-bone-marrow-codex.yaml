notes: 'The image is one 45-channel QPTIFF whole-slide scan (raw_image.zip, 1.8 GB) holding six tissue sections, not many separate images. Labels are per-cell tables, not mask images: cell types come from rule-based binary marker calls (StarDist nuclei segmentation in QuPath 0.3.0) and from the QuantCell LightGBM model at 5% FDR, so they are algorithmic and not manual ground truth; cells matching no combination are labelled Other. Paper is a bioRxiv preprint (not open access in Europe PMC): only the abstract was read; the pixel size, channel count and file contents come from the Zenodo record and zip listings. enricher: size 2,672,910,778 B from the Zenodo file listing (was 2.673e9 approx); QPTIFF header confirms 0.3774 um/px (README).'
