title: 'Nuclear segmentation in microscope cell images: a hand-segmented dataset (Coelho, Shariff, Murphy, ISBI 2009)'
short_name: Hand-segmented U2OS/NIH3T3 nuclei (fluorescence)
description: Benchmark of 97 fluorescence microscopy images of cell nuclei (48 U2OS and 49 NIH3T3 images, 4,009 nuclei in total) that were hand-outlined to evaluate nuclear segmentation algorithms. Annotations are labeled integer images (0 = background, 1..N = individual nuclei). The GitHub repository holds the DNA-channel images, the manual annotations in several versions (GIMP/Photoshop files per annotator) and a preprocessed folder of labeled PNGs, together with the comparison code.
