notes: 'No license for the data is stated in the repository (only libs/readmagick has a GPL-3 COPYING
  file), README or paper; murphylab.web.cmu.edu/data, named in the paper, returned 503. Pixel size, microscope
  and stain are not given in the paper. 48 U2OS + 49 NIH3T3 = 97 annotated images, 4,009 nuclei per the
  paper. data/ also holds an undescribed ksr folder (50 images, segmented-lpc/ksr annotations), not counted
  in n_items. enricher: organisms: Homo sapiens (U2OS) = gnf/, Mus musculus (NIH3T3) = ic100/ (paper source
  report.tex: the U2OS collection is the one shown in fig:gnf-examples, and Table 1 sizes 1349x1030 /
  1344x1024 match the gnf / ic100 PNGs). No single archive: files are served one by one from raw.githubusercontent.com.'
