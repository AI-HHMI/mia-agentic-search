notes: 'No license for the data is stated in the repository (only libs/readmagick has a GPL-3 COPYING file), README or paper; murphylab.web.cmu.edu/data, named in the paper, returned 503. Pixel size, microscope and stain are not given in the paper (Table 1 "pixel size" holds image dimensions 1349x1030 and 1344x1024). 48 U2OS + 49 NIH3T3 = 97 annotated images, 4,009 nuclei per the paper. Folder names gnf and ic100 are not explained, so not mapped to cell lines. Layout comes from a shallow clone: data/preprocessed-data has 48 gnf + 49 ic100 PNGs; data/ is about 613 MB including raw-data folders, so size_bytes is null. An undescribed third folder (ksr, 50 images) is not counted in n_items.'
