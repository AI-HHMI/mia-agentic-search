notes: 'No license for the data is stated in the repository (only libs/readmagick carries a GPL-3 COPYING file), the README or the paper; the paper also points to murphylab.web.cmu.edu/data, which returned 503 this run. Pixel size and microscope are not given in the paper (Table 1 "pixel size" row holds image dimensions 1349x1030 and 1344x1024); the paper names only U2OS and NIH3T3 and a nuclear marker channel without naming the stain. Counts: 48 U2OS + 49 NIH3T3 = 97 annotated images and 4,009 nuclei per the paper (50 images were drawn per cell line and 3 rejected as out of focus). The repository folder names gnf and ic100 are not explained in the README or paper, so they are not mapped to cell lines here. Layout was taken from a shallow clone of the repository (data/preprocessed-data has 48 gnf and 49 ic100 PNGs; data/ totals about 613 MB, which includes the raw-data folders, so size_bytes is left null). The repository also contains a third image folder (ksr, 50 images with 82 annotation files under segmented-lpc/ksr) that the paper does not describe; it is not counted in n_items.'
