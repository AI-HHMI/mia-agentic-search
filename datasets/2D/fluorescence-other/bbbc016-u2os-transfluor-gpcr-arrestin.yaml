description: Transfluor assay on human U2OS cells stably expressing an orphan GPCR and beta-arrestin-GFP,
  incubated with a compound for one hour then formaldehyde-fixed. 144 8-bit TIFF images (512x512 px, GFP
  and DNA channels) covering one row of a 384-well plate - 11 dose points plus a control, each in duplicate,
  three fields per well. Labels are plate-map doses with example positive and negative images, not pixel
  annotations.
