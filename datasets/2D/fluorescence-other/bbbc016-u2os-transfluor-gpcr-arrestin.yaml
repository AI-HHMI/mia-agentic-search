notes: The image zip was listed with peek_archive - 144 .TIF files (page gives no total). Only the first lines of the
  plate-map text file were read (a dose list), so the mapping of images to doses was not checked. No pixel-level annotations, only assay-condition
  labels and example positive and negative images. Pixel size is not stated on the page. Microscope per page - Cellomics ArrayScan HCS Reader (GPCR
  Bioapplication). Reproduction files for Logan and Carpenter 2010 are also offered. The main BBBC paper (Ljosa 2012) has no open
  full text.
