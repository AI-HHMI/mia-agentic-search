notes: 'Zenodo: 40 annotated IF images (600 x 600 um) used to train StarDist models for HIV target cells in foreskin
  tissue section scans. Paper (Shao et al. 2024, Sci Rep; cites zenodo.org/record/8091914): 40 FOVs from Ugandan
  foreskin tissue, every marker combination traced manually in Labkit, 8 annotation images per FOV. enricher: paper
  linked (was none); annotations.source manual from paper Methods (was unknown). enricher: voxel size 400 x 400
  nm from the TIFF calibration (0.4 micron/px), consistent with the paper (600 x 600 um = 1500 x 1500 px) (was null).
  enricher: BINARY TIFFs are 0/255 masks (one per marker combination); FOV sizes vary (473 x 582 to 1504 x 1504
  px).'
