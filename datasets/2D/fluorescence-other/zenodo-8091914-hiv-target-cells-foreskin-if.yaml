notes: 'Zenodo description: 40 annotated immunofluorescence images (600 x 600 microns) used to train StarDist models for HIV
  target cells in foreskin tissue section scans. FOV Folders Uploaded.zip listing (876 files): per FOV folder RAW IMAGES
  (single-channel CCR5, CD3, CD4, DAPI TIFFs plus an all-channel TIFF), BINARY (8 TIFFs per DAPI/marker combination), ROI FILES
  (zips per combination) and a Counts xlsx. No linked paper on the Zenodo record (a Europe PMC title search found no confirmed
  match), so pixel size, microscope, who drew the annotations and whether they were manual or corrected predictions are not
  stated; annotations.source is unknown. Which FOV folders count was derived from the 40 xlsx files in the listing.'
