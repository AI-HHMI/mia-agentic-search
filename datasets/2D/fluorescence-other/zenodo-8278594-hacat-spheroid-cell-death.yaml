notes: 'Zenodo record lists one 584 MB zip (image_pickles.zip) with six Python pickle files: aug-2-classes and aug-4-classes,
  each as train/validate/test (listed with tools/peek_archive.py). The pickles were not opened (untrusted), so image count,
  image size, array layout and the meaning of the 2 and 4 classes are not verified; the description only says images come
  with their labels for spheroid cell death classification, and the images appear to be augmented. Pixel size, microscope
  and annotation procedure are not stated on the Zenodo page; the paper (ACS Chem. Res. Toxicol. 2023) is not open access,
  so only its abstract was read (HaCaT spheroids, propidium iodide and calcein AM, CNN with transfer learning). Species is
  inferred from the HaCaT cell line (human keratinocyte) named in the abstract.'
