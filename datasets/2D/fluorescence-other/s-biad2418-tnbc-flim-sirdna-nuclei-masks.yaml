notes: 'file_list1.tsv: 85 raw FLIM .tif images (FLIM/raw) and 83 properties .xml files; annotation_list1.tsv: 170 label TIFFs,
  each linked to its source image (85 segmentations, 85 segmentations_after_qc), plus cohort_metadata.csv. The masks are not
  manual: they come from a StarDist2D model pretrained on 2D_versatile_fluo (scale 3, NMS threshold 0.6) and then a QC step
  whose procedure is not described, so source is automatic and instance type is inferred from StarDist label output (not verified
  by opening a label file). Whether labels were computed on lifetime or intensity channels is not stated.  enricher: instance
  ids verified (72,586 ids in one QC label); doi 10.6019/S-BIAD2418 and authors from the BIA entry (were empty); pixel size
  1.137-1.139 um per image in metadata XML (left null, varies); no paper listed. Channels: raw TIFFs have 2 channels, meaning
  undocumented.'
