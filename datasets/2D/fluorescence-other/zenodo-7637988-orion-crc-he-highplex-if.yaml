description: Whole-slide images of colorectal cancer resections with high-plex (about 16-20 channel) immunofluorescence and
  H&E collected on the same tissue section (Orion platform), with registered H&E, cell and nucleus segmentation masks and
  single-cell quantification tables per slide (CRC01-CRC40 on AWS S3). The Zenodo record holds the dataset index and processing
  scripts; the images are in the public S3 bucket lin-2023-orion-crc.
