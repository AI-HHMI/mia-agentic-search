  notes: S3 listing of lin-2023-orion-crc/data/ (one page, 205 keys, exact sizes). The bucket answers range GETs intermittently
    with 404 (about 2 in 5 requests, also with curl), so probes need retries. Probed CRC02 mask (int32 48460x58709 deflate,
    tiled 1024, OME, 325 nm) and registered H&E (uint8 3x48460x58709 jpeg, 325 nm); the 73 GB IF header failed after 10 tries
    (OME-XML not in the first 300 KB). Not sampled. Voxel size 325 nm from the OME headers of H&E and mask; neither the README
    nor the Zenodo record states a pixel size (paper full text not open in Europe PMC). One folder per slide and no archive,
    so data.download_url stays the bucket listing. encoding instance-ids from the MCMICRO docs in the paper, not sampled.
