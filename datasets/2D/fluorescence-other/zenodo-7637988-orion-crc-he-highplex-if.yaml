notes: 'Only slide CRC01 was listed in detail: a 112.8 GB high-plex OME-TIFF, a 1.0 GB registered H&E OME-TIFF, a 276 MB mask OME-TIFF,
  a 813 MB single-cell CSV and markers.csv; the bucket has one folder per slide (CRC01-CRC38 seen with CRC33_01 and CRC33_02,
  likely 40 or more in total), so counts and total size (several TB) are not stated. The masks are produced by MCMICRO with
  UNMICST2, with the cell mask a 5-pixel dilation of the nucleus mask (paper), so labels are automatic, not hand drawn. The Zenodo
  record itself is only a 79 MB zip of scripts and an index. Pixel size not read (paper gives only a 20x/0.75 NA objective);
  the derived MIPHEI-ViT work registers H&E at 0.325 um per pixel. The paper PDF-level text was read only for the first 100,000
  characters and the license of the image bucket is taken from the Zenodo record (MIT). The tiles derived from this data are
  a separate record (MIPHEI-ViT, Zenodo 15340874).'
