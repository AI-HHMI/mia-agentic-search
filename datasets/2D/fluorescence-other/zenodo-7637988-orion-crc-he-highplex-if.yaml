notes: 'The masks are produced by MCMICRO with UNMICST2, with the cell mask a 5-pixel dilation of the nucleus mask (paper),
  so labels are automatic, not hand drawn. The Zenodo record itself is only a 79 MB zip of scripts and an index. Pixel size
  not read (paper gives only a 20x/0.75 NA objective); the derived MIPHEI-ViT work registers H&E at 0.325 um per pixel. Bucket
  license taken from the Zenodo record (MIT). The tiles derived from this data are a separate record (MIPHEI-ViT, Zenodo 15340874).
  enricher: full bucket listing: 41 slides (CRC01-CRC40, CRC33_01/_02), 205 files, 4,557,944,813,437 B (size and n_items were
  null); voxel 325 nm from the OME-XML of the registered H&E and mask files (was null).'
