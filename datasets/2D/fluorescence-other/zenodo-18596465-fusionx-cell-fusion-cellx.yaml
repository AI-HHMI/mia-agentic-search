notes: 'Zenodo record gives only the description "Training Dataset used for training and testing CellX"
  and four files (train_png.7z 25.0 MB, test_png.7z 4.3 MB, train_png.json, test_png.json). The two COCO
  JSON files were read: 52 train and 8 test images, 5,129 and 770 annotations, one category (Cells), RLE
  segmentations; image file names are PNG and sizes vary (about 300 to 1,350 px per side). The 7z archives
  were not opened (peek_archive supports only zip), so the image content is inferred from the JSON and
  the paper abstract. The paper is not open access, so only the abstract was read: it mentions standard
  membrane and nuclear dyes and fusion in viral fusogen and myogenic systems, but the dataset page and
  abstract do not state the microscope, magnification, pixel size, cell types or organism. The COCO info
  block points to a Hasty annotation project; whether labels were fully manual is not stated. Modality
  fluorescence-other is inferred from the dyes.'
