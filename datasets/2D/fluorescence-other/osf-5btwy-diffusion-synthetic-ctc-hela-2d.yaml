notes: 'OSF component 5btwy of the project osf.io/dnp65 (DiffusionModelsForImageSynthesis), one of seven
  synthetic datasets from the paper. Files listed through the OSF API (images/ and masks/ folders of TIFF
  files; counts and sizes summed from the listing). The images are not real microscopy: they are generated
  by a denoising diffusion model from sketches of cellular structures, to train segmentation models. Annotations
  are simulated (overlapping circular regions filled with deformed nuclei), not drawn by hand. Voxel/pixel
  size not stated on OSF or in the paper. The OSF project license is Apache License 2.0 (OSF license field);
  the paper gives no separate data license. Sibling components: jzkhs, k2d7q, jg4de, yb29n, 5btwy, zrmnv,
  73ach. enricher: masks uint16 instance ids, images uint8 (sampled).'
