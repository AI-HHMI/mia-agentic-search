notes: 'Zip: 24,702 TIFF patches plus one COCO JSON per split (24,709 entries incl. 4 .DS_Store); size_bytes
  is the compressed zip. Annotations described as expert-annotated on the Zenodo page. The paper (IEEE
  JSTSP, not open access) was read as abstract only: it extends the E. coli fluorescence dataset of Dat
  et al. with more samples and refined annotations. Microscope, objective, pixel size and stain are not
  stated on the Zenodo page, the abstract, the TIFF headers or the zip, so voxel_size_nm is null and the
  modality is fluorescence-other. Baseline code from the Zenodo usage notes.

  enricher: size confirmed by file listing (unchanged); TIFF and test COCO JSON sampled; no field changes;
  voxel size still not found.'
