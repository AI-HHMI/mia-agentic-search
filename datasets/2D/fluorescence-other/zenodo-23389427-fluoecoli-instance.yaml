notes: 'Zip listing (peek_archive): 24,702 TIFF patches plus train/val/test COCO JSON files (24,709 entries incl. 4 .DS_Store);
  size_bytes is the compressed zip (3.36 GB uncompressed). Annotations described as expert-annotated on the Zenodo page.
  The paper (IEEE JSTSP, not open access) was read as abstract only: it extends the E. coli fluorescence dataset of Dat
  et al. with more samples and refined annotations. Microscope, objective, pixel size and stain are not stated on the Zenodo
  page, the paper abstract or the zip listing, so voxel_size_nm is null and the modality is the generic fluorescence-other.
  Baseline code link is from the Zenodo usage notes (jove_mmdetection); the repository itself was not opened.'
