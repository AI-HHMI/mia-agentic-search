title: 'BBBC013: Human U2OS cells, FKHR-EGFP cytoplasm-nucleus translocation'
short_name: U2OS FKHR-EGFP translocation (fluorescence)
description: Images of FKHR-EGFP translocation in stably transfected U2OS cells, 640 x 640 px, two channels (FKHR-GFP and
  DRAQ DNA) per well, on an IN Cell Analyzer 3000. A 96-well plate holds 4 replicas of a 9-point dose curve for Wortmannin
  and LY294002 plus negative and positive (150 nM Wortmannin) control wells; plate maps give per-well treatment. Available
  as native FRM or 8-bit BMP (192 BMP files).
