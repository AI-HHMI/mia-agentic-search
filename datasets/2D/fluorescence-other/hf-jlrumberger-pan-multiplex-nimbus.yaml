notes: 'Five subsets as split zips (codex_colon, mibi_breast, mibi_decidua, vectra_colon, vectra_pancreas), about 532 GB per the HF file tree. README says the MIBI breast subset is not yet available although its zip parts are listed. Only mibi_decidua.zip could be listed (peek_archive): 228 FOV folders of per-marker TIFFs, nimbus_predictions, ground_truth.csv, conversion_matrix.csv and .xr files; other subsets unverified (multi-part zips). Platforms are CODEX, Vectra (immunofluorescence) and MIBI-TOF (mass spectrometry), so fluorescence-other is approximate. Pixel size not stated on the card or in the paper text read. Labels are per-cell marker positivity, not masks; paper (preprint copy PMC11185540) splits FOVs 80/10/10 in training code, no split files here.'
