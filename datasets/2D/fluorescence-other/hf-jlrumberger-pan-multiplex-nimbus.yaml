notes: 'Five subsets (codex_colon, mibi_breast, mibi_decidua, vectra_colon, vectra_pancreas); 532.2 GB per the HF file tree. Only mibi_decidua is one zip (3.0 GB); the others are split zips (.zip.001 ...) that cannot be read member-wise. README says mibi_breast is not yet available, though its parts are listed. Platforms: CODEX and Vectra (immunofluorescence), MIBI-TOF (mass spectrometry; decidua, breast), so fluorescence-other is approximate. Pixel size: not stated on the card or in the paper text read; it would differ per platform. Labels: per-cell marker positivity (silver standard from FlowSOM/STELLAR/manual-gating cell types via assignment matrices; 3 FOVs per subset proofread by 4 experts) and cell segmentation masks (Mesmer / CODEX Segmenter, automatic). enricher: added instance-segmentation (segmentation_data label TIFFs seen and sampled).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  24 files  532.2 GB  .zip.0NN 21, .zip 1, .csv 2, README.md\n  codex_colon.zip.001-004 (103.4 GB)  mibi_breast.zip.001-011 (315.1 GB)\n  vectra_colon.zip.001-002 (54.3 GB)  vectra_pancreas.zip.001-002 (56.2 GB)\n  mibi_decidua.zip (3.0 GB)  gt_pred_ie_consolidated.csv (135 MB)  experimental_results.csv\nmibi_decidua.zip/mibi_decidua/\n  ./ 3 files 271.8 MB .csv (conversion_matrix.csv, ground_truth.csv, ...)\n  image_data/<fov>/ (x228 dirs) 11172 files 2.7 GB .tif (one per marker/mass channel, e.g. CD45.tif)\n  segmentation_data/ 466 files 4.8 GB: <fov>_segmentation_labels.tiff x228, <fov>_segmentation_borders.tiff x228, .xr 9, .csv 1\n  nimbus_predictions/ Nimbus_cell_table.csv, normalization_dict.json; <fov>/ (x3 dirs) 138 .tiff"
    n_files: 24
    listing_complete: true
  sample:
    urls:
    - https://huggingface.co/datasets/JLrumberger/Pan-Multiplex/resolve/main/mibi_decidua.zip::mibi_decidua/image_data/10_31739_6_13/CD45.tif
    - https://huggingface.co/datasets/JLrumberger/Pan-Multiplex/resolve/main/mibi_decidua.zip::mibi_decidua/segmentation_data/10_31739_6_13_segmentation_labels.tiff
    - https://huggingface.co/datasets/JLrumberger/Pan-Multiplex/resolve/main/mibi_decidua.zip::mibi_decidua/ground_truth.csv
    size_bytes: 9517658
    description: 'Decidua FOV 10_31739_6_13: one marker channel (CD45), its cell segmentation labels, and the subset marker-positivity table'
  arrays:
  - role: raw
    path_pattern: mibi_decidua.zip/mibi_decidua/image_data/*/*.tif
    format: tiff
    axes: yx
    shape:
    - 2048
    - 2048
    shape_varies: null
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 33
    normalization: unknown
    alignment: not-applicable
    alignment_notes: One single-page TIFF per channel (marker or mass channel such as Au, Ca, background) per FOV folder; 228 FOVs, ~49 channels each. Other subsets (split zips) not inspected.
  - role: label
    path_pattern: mibi_decidua.zip/mibi_decidua/segmentation_data/*_segmentation_labels.tiff
    format: tiff
    axes: yx
    shape:
    - 2048
    - 2048
    shape_varies: null
    dtype: int16
    compression: none
    value_range:
    - 0
    - 2588
    encoding: instance-ids
    classes:
    - id: 0
      name: background
    alignment: same-grid
    alignment_notes: Pairs with image_data/<fov>/ by FOV name (<fov>_segmentation_labels.tiff). Cell IDs match the labels column of ground_truth.csv.
  - role: label
    path_pattern: mibi_decidua.zip/mibi_decidua/segmentation_data/*_segmentation_borders.tiff
    format: tiff
    axes: yx
    shape:
    - 2048
    - 2048
    shape_varies: null
    dtype: uint8
    compression: none
    encoding: unknown
    classes: null
    alignment: same-grid
    alignment_notes: Cell border image per FOV (probed, not sampled).
  - role: label
    path_pattern: mibi_decidua.zip/mibi_decidua/ground_truth.csv
    format: csv
    axes: null
    shape: null
    shape_varies: null
    dtype: float64
    compression: none
    encoding: other
    classes: null
    alignment: not-applicable
    alignment_notes: 'Per-cell table: fov, labels (cell ID in the segmentation), one column per marker (23 markers) with values 0/1/2; the paper describes positive / negative / undefined marker states, the exact code mapping is not documented on the card.'
  notes: 'Listing: HF tree API, 24 files with exact sizes (532,184,784,275 B); mibi_decidua.zip expanded (11,781 members, 7.85 GB uncompressed). Probed CD45.tif, segmentation labels and borders of FOV 10_31739_6_13; sampled CD45.tif (243 kB, uint8 0-33, 93.5% zeros) and the labels (2589 unique values incl. 0); value ranges are from this one sample. Split-zip subsets (codex_colon, vectra_colon, vectra_pancreas, mibi_breast) cannot be listed or read per member; their contents, shapes and dtypes are unverified. Voxel size not found; checked: TIFF headers (no resolution tags in probe), HF card, preprint full text (PMC11185540; journal version not open access). data.download_url left null: no single archive for the whole dataset; mibi_decidua.zip is the only direct single-file subset.'
