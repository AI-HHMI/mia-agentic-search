schema_version: '1.2'
id: hf-jlrumberger-pan-multiplex-nimbus
title: Pan-Multiplex (Pan-M) dataset
short_name: Pan-M multiplexed tissue marker positivity
description: Multiplexed tissue images (CODEX, MIBI-TOF and Vectra platforms; colon, breast, decidua and pancreas) with per-cell marker-positivity annotations (about 197 million annotations across 15 million cells), built to train the Nimbus model. Labels were generated by a semi-automatic pipeline from the cell types of the original studies; for 3 fields of view per dataset, 4 expert annotators proofread about 1.1M annotations as a gold standard.
