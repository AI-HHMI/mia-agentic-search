short_name: Multiplexed IF DAPI nuclei masks (human tissue)
description: DAPI intensity images (spectrally unmixed multiplexed immunofluorescence scans of human tissue) with manually
  annotated binary nuclear ground-truth masks for ROI fields, plus predicted masks from seven segmentation platforms (CellPose,
  CellProfiler, Fiji, InForm, Mesmer, QuPath, StarDist). Accompanies a nuclear segmentation benchmarking paper.
