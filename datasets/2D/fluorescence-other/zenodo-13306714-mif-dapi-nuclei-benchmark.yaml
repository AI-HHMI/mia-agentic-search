notes: 'inhouse.zip (164.5 MB) lists 5 DAPI scans (DAPI_inhouse/*.tif) and ~33 Fields/<ROI>/ground_truth/gr_tr.tiff manual masks with per-platform prediction masks; external.zip (30 MB) could not be listed (network error) and its ground truth comes from a Synapse dataset (doi:10.7303/SYN27624812). Pixel size, scanner and exact image counts are not stated on the Zenodo page or in the paper text read; a descriptive internal.zip is mentioned but absent from the file list. No train/val/test split; intended as a benchmark.'
