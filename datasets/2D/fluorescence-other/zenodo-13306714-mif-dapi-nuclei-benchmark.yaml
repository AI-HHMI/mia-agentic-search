notes: 'Files: inhouse.zip (5 whole-sample DAPI scans DAPI_inhouse/*.tif + 20 ROIs Fields/<sample>_<ULHC>/ with ground_truth/gr_tr.tiff
  and 7 platform predictions), external.zip (40 ROIs: GT + Cellpose/Mesmer/StarDist predictions; raw DAPI for these is only
  on Synapse doi:10.7303/SYN27624812, see ROIs_DAPI.csv), README_DAPI.md. ROI naming: ''Sample ID_ULHC'', e.g. Bph2_45174_14597_160_246
  = sample Bph2_45174_14597, ULHC pixel (246,160) per the Zenodo description. internal.zip named in the README is not in the
  record. GT drawn in GIMP, touching nuclei separated by a 2-pixel gap (paper Methods). Pixel size not stated on Zenodo or
  in the paper text read. No train/val/test split. enricher: channels 1 (grey stored as RGB), n_items 5 raw scans, size from
  the Zenodo listing.'
