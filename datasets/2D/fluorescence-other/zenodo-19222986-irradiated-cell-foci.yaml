notes: 'Zip holds 446 images (images/*.RB.TIF), 446 .RB.txt YOLO label files and 446 .RB.json dot files. Only large, bright
  foci were annotated; small or dim foci were excluded, hence coverage partial. Channels: blue nuclei and red foci per the
  description; the TIFFs are RGB (3 samples, enricher). Pixel size, microscope and objective are not stated on the record;
  the record cites Bucher et al. (2021) for the staining protocol but no paper was found via Europe PMC/Crossref title search,
  so no publication is listed. Image acquisition and annotation by Bundesamt fuer Strahlenschutz, preprocessing by Umweltbundesamt.
  ml task ''other'' = counting/density estimation. enricher: size includes the preview JPG (record total 1,344,705 B).'
