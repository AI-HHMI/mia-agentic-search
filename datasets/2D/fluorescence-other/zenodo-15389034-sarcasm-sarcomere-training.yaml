  notes: 'Listed training_data_sarcomeres.zip + validation_data.zip (905 members, 691,783,603 B = size_bytes; the
    record covers these two zips, the other four zips on the Zenodo record are movies, test and ContractionNet data).
    Probed one file per folder (TTN-EGFP_C-05_F0038_T0001_Z0001_C01.tif): all 1300x1300, uncompressed; image uint16,
    zbands float16, mbands int8, sarcomere_mask bool, cell_mask and orientation float32. Sampled: image 0-96 (one
    sample; hint 12-bit range); zbands 0 to ~1 (77% zero); mbands {0,1}; cell_mask 0-1 soft. sample.py failed on
    the bool sarcomere mask (percentile of bool), so its values are not measured. Zenodo returned SSL EOF errors
    intermittently. Voxel size not found; checked: TIFF headers (no calibration), Zenodo description, bioRxiv full
    text (only "pixel sizes of <0.2 um" recommended; per-image sources in Supplementary Table 2, not available).'
