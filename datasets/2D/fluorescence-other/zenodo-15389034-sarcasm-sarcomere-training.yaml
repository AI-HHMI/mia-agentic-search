description: Training set of 220 fluorescence microscopy images of cardiomyocytes from various cell types,
  labelling methods and microscopes, with annotation images for Z-bands, M-bands, sarcomere orientation, sarcomere
  mask and cell mask (128 images carry sarcomere and Z-band masks), plus a validation set of 10 images with manually
  annotated sarcomere masks and sarcomere lengths. The same Zenodo record also holds contraction-analysis movies
  and test data.
