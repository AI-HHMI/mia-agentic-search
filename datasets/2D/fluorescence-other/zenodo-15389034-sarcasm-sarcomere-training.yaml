notes: 'Zenodo API record (6 zips, 13.6 GB in total) and the zip listings (training_data_sarcomeres.zip: 220 images,
  126 cell masks, 127 M-band, 127 orientation, 128 sarcomere masks, 128 Z-band masks; validation_data.zip: 10 images
  with masks and lengths) read, plus the bioRxiv full text (first 100k characters). Z-bands were traced manually
  with a graphics tablet, M-bands and orientation maps come from a wavelet analysis followed by manual curation,
  so source is mixed. Size and n_items cover the training and validation zips only; the record also has test_data.zip
  (698 MB) and two drug-treatment movie zips (5.3 GB, 6.8 GB) and a ContractionNet training zip. Pixel sizes, microscopes
  and cell types per image are in the paper Supplementary Table 2, which was not available; file names mention NRVM
  and TTN-EGFP data, so organisms other than human may be present and voxel_size_nm is null. The preprint is CC
  BY-NC-ND; the Zenodo data is CC-BY-NC-4.0 (non-commercial).'
