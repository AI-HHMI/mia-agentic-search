notes: 'The IDR screen (omero id 1751) has 12 plates: six raw (41744, 41749, 41754, 41755, 41756, 41757) and their six illum_corrected copies; plate 41744 has 384 wells. BBBC page says 9 sites per well, five fluorescent channels, 16-bit TIF, 20x on an ImageXpress Micro; total image count, size and pixel size were not determined (n_items and size_bytes left null). IDR states CC BY 4.0 (Data DOI 10.17867/10000105) while the BBBC page states CC0 for BBBC037v1; CC BY 4.0 used here as the more restrictive of the two. The IDR HTML page was not readable by the fetch tool (JavaScript app); metadata came from the IDR JSON API. Labels are gene/pathway-level (one pathway label per ORF), not per-image or per-cell, so the training signal is perturbation-level classification. IDR download endpoints (FTP/Aspera/Globus) were not checked, so download_url is null. The eLife article was read for context; the dataset section is brief.'
