notes: 'The IDR screen (omero id 1751) has 12 plates: six raw (41744, 41749, 41754, 41755, 41756, 41757) and their
  six illum_corrected copies; plate 41744 has 384 wells. BBBC page says 9 sites per well, five fluorescent channels,
  16-bit TIF, 20x on an ImageXpress Micro; enricher: voxel size 656 nm x/y from IDR physical sizes (0.656 um, 3
  plates; was null); n_items 41472 and size 0.49 TB from the IDR study file (Screen Size: 5D Images 41472 over 12
  plates, Total Tb 0.49). IDR states CC BY 4.0 (Data DOI 10.17867/10000105) while the BBBC page states CC0 for BBBC037v1;
  CC BY 4.0 used here as the more restrictive of the two. Metadata from the IDR JSON API. Labels are gene/pathway-level
  (one pathway label per ORF), not per-image or per-cell, so the training signal is perturbation-level classification.
  IDR download endpoints (FTP/Aspera/Globus) were not checked, so download_url is null.'
