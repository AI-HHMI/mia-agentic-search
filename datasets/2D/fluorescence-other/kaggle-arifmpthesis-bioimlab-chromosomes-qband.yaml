notes: 'Third-party Kaggle copy (license field Other) of the BioImLab Q-band chromosome set; the page says published
  work using it must cite Poletti, Grisan and Ruggeri (IEEE EMBS 2008), which is the only stated term, hence license
  custom. The Europe PMC abstract of that paper (not open access, full text unread) gives 119 karyotypes and 5,474
  chromosomes, 70 used for training and validation and 49 for testing; no split is in the files. Complete bundle
  listing: Class_1..22 with 238 BMPs each, Class_X 193, Class_Y 45 (5,474). Q-band implies fluorescence microscopy,
  but neither page states it, so modality is an inference. Classes follow the 24 chromosome types (22 autosomes,
  X, Y) implied by 24 classes. Original BioImLab host not checked. Pixel size not stated. enricher: size_bytes is
  the 11.3 MB bundle zip from a complete listing.'
