      after the cell id in the file name; no separate label file.
  notes: 'Listing: tools/listing.py --expand-zips on the Kaggle bundle (signed storage.googleapis.com redirect):
    11,256,001 B, 5,474 members, complete; 22 x 238 + 193 X + 45 Y. Sampled two members by range (BMP is not read
    by sample.py; decoded with PIL in a separate step): Class_1/"1 1a.bmp" 106x32 uint8 L, 0-194, median 0; Class_Y/"10
    24.bmp" 31x21, 0-253 (values from two files only). Background 0 suggests the crops are masked by the original
    segmentation. Voxel size not found; checked: BMP headers (no resolution), Kaggle record, EMBS 2008 abstract
    (paper not open access). No usable sample link: www.kaggle.com is not on the TensorSwitch allowlist, and BMP
    is not a TensorSwitch input format.'
