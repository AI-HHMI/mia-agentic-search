title: BioImLAB Chromosome Data Set for Classification
short_name: Q-band chromosome images, 24 classes (karyotype)
description: 5,474 single human chromosome images (monochrome 8-bit BMP) manually segmented and classified by expert
  cytologists from 119 Q-band karyotypes of normal and pathological subjects. The images are grouped into 24 classes
  of 119 chromosomes, all rotated to the ISCN orientation, with a folder per class and file names carrying cell
  number and class.
