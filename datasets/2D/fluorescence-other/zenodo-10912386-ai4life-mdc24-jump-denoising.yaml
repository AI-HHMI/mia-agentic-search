  notes: 'Listing: tools/listing.py on Zenodo 10912386 (1 file, 2,412,483,494 B exact). Probe: ImageJ TIFF, 2068 pages 540x540 float32
    uncompressed, no calibration. tools/sample.py failed on this file (ValueError parsing the ImageJ TIFF), so 8 pages (images 0 and
    258, all 4 channels) were read by range with tifffile (~12 MB): values -1.19 to 17.67, per-page mean 0.19-1.19, std 0.58-1.63. value_range
    is from those pages only. Negative values show the data were rescaled/offset before or after noise was added; the method is not
    documented, so normalization unknown. Voxel size not found; checked: TIFF header (no unit or spacing), Zenodo record and API, AI4Life-MDC24
    welcome and data-description pages, JUMP paper full text (tools/paper.py), jump-cellpainting/datasets README. Upstream JUMP sources
    differ in microscope and pixel size, and the source plate/site of these 540x540 images is not stated, so no upstream value can be
    assigned.'
