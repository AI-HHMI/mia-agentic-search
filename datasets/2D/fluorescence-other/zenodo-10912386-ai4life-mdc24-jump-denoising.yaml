notes: 'Single noisy.tiff (2,412,483,494 B): float32 ImageJ hyperstack 517 x 4 x 540 x 540 (header axes zcyx; per the Zenodo description
  the first axis indexes 517 images, not z). Noisy images only, no clean targets. Training signal: the AI4Life-MDC24 data description
  page says the challenge is unsupervised denoising and that Gaussian and Poisson noise were applied to this JUMP subset. Voxel size
  not stated (Zenodo, TIFF header, challenge page, JUMP paper, JUMP datasets README). Cell type U2OS from the JUMP paper; the four channels
  are not named. enricher: training signal confirmed from challenge page (was inferred).'
