title: HPA Cell Image Segmentation Dataset
short_name: HPA 4-channel cell segmentation (fluorescence)
description: Annotated 512x512 four-channel fluorescence images of cultured cells from the Human Protein
  Atlas (microtubules, ER, nuclei, protein of interest). Cells are annotated as polygons (GeoJSON, made
  with Kaibu) with a cell border mask per image. The example split has 4 training and 159 test images,
  provided as an example dataset for interactive deep-learning annotation in ImJoy.
