title: 'BBBC013: Human U2OS cells, cytoplasm-nucleus translocation of FKHR-EGFP'
short_name: FKHR-EGFP translocation in U2OS (fluorescence)
description: A 96-well plate of human U2OS cells stably expressing FKHR-EGFP, treated with Wortmannin or LY294002 in
  a 9-point, 2-fold dose curve (4 replicates each) plus negative controls and 150 nM Wortmannin positive controls.
  Two channels per well, 640x640 px - FKHR-GFP and DRAQ-stained DNA - 192 8-bit BMP images in total. Labels are
  plate maps giving the control and dose of every well, not pixel annotations.
