notes: 'The image zip (BBBC013_v1_images_bmp.zip) was listed with peek_archive - 192 .BMP files named Channel1/2-<well
  index>-<row>-<col>. Page also offers native FRM images (77 MB) and reproduction files (CellProfiler pipelines). The plate-map
  files were not opened here (only the first lines of the all-samples file were seen, a dose list), and the BMP format is
  not in the schema enum, hence formats other. No pixel-level annotation; the labels are assay controls and doses, so
  this suits translocation classification and assay-quality (Z-prime) benchmarking. Pixel size not stated on the page; the paper
  (Logan and Carpenter 2010) discusses benchmarking methods in general and does not describe this plate; the main BBBC paper
  (Ljosa 2012) has no open full text. Microscope per page: IN Cell Analyzer 3000.'
