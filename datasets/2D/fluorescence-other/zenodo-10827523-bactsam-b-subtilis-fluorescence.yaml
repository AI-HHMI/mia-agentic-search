notes: 'Zenodo page and API say only "patched and augmented fluorescent microscopy images of B. subtilis and their
  corresponding segmentation masks"; no paper, pixel size, microscope or annotation method stated (no publication
  or code repo found). Single bact_dataset.tar.xz = Hugging Face datasets export (Arrow IPC shards): image int16
  [3,256,256], label int16 [256,256]. enricher: splits_provided true (dataset_dict.json lists train and validation);
  train has 4 shards (data-0000N-of-00004.arrow); shard 0 holds 768 patches = 192 distinct patches x 4 rot90 augmentations,
  so independent source images are far fewer than patches. enricher: annotation type other -> instance-segmentation;
  labels look like instance IDs (0..234 across shard 0, median 4 IDs per patch), inferred from the sample. Voxel
  size not stated anywhere.'
