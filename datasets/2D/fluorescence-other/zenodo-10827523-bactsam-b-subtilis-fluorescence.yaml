notes: 'Zenodo page says only "patched and augmented fluorescent microscopy images of B. subtilis and
  their corresponding segmentation masks"; no paper, pixel size, microscope, image counts or annotation
  method are stated on the page or API record (no related publication found by web search). The single
  bact_dataset.tar.xz (712 MB) was inspected by reading its first ~3 MB: it contains bact_dataset/dataset_dict.json
  and train/*.arrow shards (first shard 406 MB); the embedded Hugging Face features metadata gives image
  = int16 array shape [3,256,256] and label = int16 array shape [256,256]. Whether labels are binary or
  instance IDs, whether a test split exists (only train/ was seen in the first 3 MB) and the total image count were not determined. Images are augmented,
  so the number of independent source images is likely smaller than the patch count.'
