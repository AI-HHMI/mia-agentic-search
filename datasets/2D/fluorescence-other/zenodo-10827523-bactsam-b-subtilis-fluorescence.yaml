  notes: 'Inspected by streaming the first 220 MB (compressed) of bact_dataset.tar.xz, which decompressed to the
    full first train shard; the Arrow record batch was parsed by hand (no pyarrow; no dataset code run). Arrow body
    is uncompressed; only the outer .tar.xz is compressed. xz is a single block, so later members (train shards
    2-3, validation, state.json/dataset_info.json) cannot be read without downloading the whole archive; total patch
    count unknown. Value ranges are from shard 0 only (768 patches). Raw channel ranges: c0 1063-9405, c1 -32750..32714
    (looks like uint16 values wrapped into int16), c2 78-2190. Labels: 235 distinct values 0..234 in shard 0, 1-37
    per patch, ~3.8% foreground; read as instance IDs (inferred). Format other: Hugging Face datasets Arrow IPC
    stream inside tar.xz; not convertible by TensorSwitch. No sample unit smaller than the whole 712 MB archive.
    voxel size not found; checked: Arrow schema metadata, Zenodo record + API (description, notes, related identifiers,
    versions: 1), dataset_dict.json, Europe PMC/Crossref title search, web search for a paper or GitHub repo.'
