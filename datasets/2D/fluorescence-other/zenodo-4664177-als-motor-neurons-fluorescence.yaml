title: Cultures of healthy and ALS iPSCs-derived motor neurons immunolabeled for Beta Tubulin III and TDP-43 and counterstained with DAPI
short_name: ALS iPSC motor neuron cultures (fluorescence)
description: Multichannel (DAPI, beta-III tubulin, RNA-binding protein) fluorescence high-content images of control and VCP-mutant (ALS) iPSC-derived motor neuron cultures, untreated or under oxidative, heat or osmotic stress, in 96-well plates (5 screens, 10-12 fields per well, 4-5 planes per field). A CSV gives per-field labels (ALS vs control, stress condition, cell line). This is a subset of a ~1 TB dataset that is on IDR.
