notes: 'Single 703.7 MB .rar that cannot be listed with peek_archive, so image file format, crop size,
  organism/cell line and channels are unverified (format other means unknown). Description says no paper
  (the model is unpublished); no publications found. Labels are derived from the fluorescence channel
  of each nucleus (so source is automatic) per the description; classes are not enumerated on the page.
  Crops come from IncuCyte fluorescence/brightfield images at 20x; which channel the crops hold is not
  stated. enricher: RAR headers read by range request. Crops are TIFF (formats tiff, was other), and a
  stored crop is 100x100 RGB uint8 (channels 3, was null). The dataset_df.csv label table is present in
  the archive (annotations_verified true).'
