  notes: 'Zenodo API listing: 1 file, 703,710,812 B exact. The RAR (RAR 4.x signature, non-solid, mixed
    stored and compressed members) has no central directory and tools/listing cannot read it, so a scratch
    script walked the first 25 local file headers by range request (151,552 B): first entry autophagy\splits\green\dataset_df.csv
    (1,177,638 B unpacked), then test\ crops of 2.7-6 KB. It then read one stored member by range (90,850
    B incl. headers) and opened it with tifffile: 1 page 100x100x3 uint8 RGB, LZW, values [4, 140], mean
    14, 114 unique values. The value is from one crop. The CSV is RAR-compressed (method 3) and was not
    read, so the class names and row count are unverified, as is whether all crops are 100x100. The full
    folder set (other phenotypes and channels, train/val) was not enumerated: about 63k headers would
    mean about 63k requests.'
