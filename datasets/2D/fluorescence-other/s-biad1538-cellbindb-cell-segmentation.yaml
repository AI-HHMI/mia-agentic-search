notes: 'The BioStudies index file CellBinDB_Archive.tsv lists 2,532 TIFF files: 844 images, 844 instance
  masks and 844 semantic masks (DAPI 203, ssDNA 276, H&E 305, mIF 60 images; 256x256 and 512x512 px patches;
  mouse 828 and rat 16 images). Pixel size is not given on the archive page or in the paper Methods (10x/0.75
  and 20x/0.5 objectives are named for the slide scanners), so voxel_size_nm is null. The paper says annotation
  is about 60% manual and the rest model-assisted then manually corrected, hence source mixed. No train/test
  split is provided. The full 1,044-image CellBinDB (including 200 human images from 10x Genomics) is
  also on Zenodo and CNGBdb; this record covers only the BioImage Archive deposit. organisms (Species
  column of CellBinDB_Archive.tsv): Rattus norvegicus = CellBinDB/ssDNA/Y98386U5-* and Y98386U6-* (16
  images); Mus musculus = all other folders. Annotation method is not given per file, so source stays
  mixed.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "Files/\n  CellBinDB_Archive.{json,tsv}   file index (2,532 TIFF rows)\n  CellBinDB/<stain>/<slide>-x<X>_y<Y>_w<W>_h<H>/\
      \   one folder per patch\n    <patch>-img.tif            Original Image\n    <patch>-instancemask.tif\
      \   Instance Mask\n    <patch>-mask.tif           Semantic Mask\n  stains (images per CellBinDB_Archive.tsv):\
      \ DAPI 203, HE 305, ssDNA 276, mIF 60\n  patch folders on FTP: DAPI 203, HE 305, ssDNA 275, mIF\
      \ 60 (843)\n2529 files, 421,065,753 B (FTP listing, exact sizes)\n"
    n_files: 2529
    listing_complete: true
  sample:
    urls:
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/538/S-BIAD1538/Files/CellBinDB/DAPI/Y96476T7-x16940_y8120_w256_h256/Y96476T7-x16940_y8120_w256_h256-img.tif
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/538/S-BIAD1538/Files/CellBinDB/DAPI/Y96476T7-x16940_y8120_w256_h256/Y96476T7-x16940_y8120_w256_h256-instancemask.tif
    - https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/538/S-BIAD1538/Files/CellBinDB/DAPI/Y96476T7-x16940_y8120_w256_h256/Y96476T7-x16940_y8120_w256_h256-mask.tif
    size_bytes: null
    description: One 256x256 DAPI patch with its instance and semantic masks (about 140 KB together).
  arrays:
  - role: raw
    path_pattern: CellBinDB/{DAPI,ssDNA,mIF}/*/*-img.tif
    format: tiff
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
    - 12
    - 63343
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: raw
    path_pattern: CellBinDB/HE/*/*-img.tif
    format: tiff
    axes: yxs
    shape:
    - 512
    - 512
    - 3
    shape_varies: true
    dtype: uint8
    compression: none
    value_range:
    - 2
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: label
    path_pattern: CellBinDB/*/*/*-instancemask.tif
    format: tiff
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: true
    dtype: uint16
    compression: lzw
    value_range:
    - 0
    - 710
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: <patch>-instancemask.tif and <patch>-mask.tif sit next to <patch>-img.tif in the
      same folder; same height and width in both sampled patches.
  - role: label
    path_pattern: CellBinDB/*/*/*-mask.tif
    format: tiff
    axes: yx
    shape:
    - 256
    - 256
    shape_varies: true
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 255
    encoding: binary
    classes: null
    alignment: same-grid
    alignment_notes: Foreground of the semantic mask equals the nonzero area of the instance mask in the
      DAPI sample (both 89.56% zeros).
  notes: 'Size pass 2026-10-07: complete FTP listing of Files/ (index files + the four stain folders):
    2529 files (2527 TIFF in 843 patch folders; ssDNA has 275 folders) = 421,065,753 B exact; the TSV
    lists 2,532 TIFF rows. Sampled two patches: DAPI 256x256 (img uint16 12..63343; instance mask uint16
    LZW 0..36 with 36 values incl. background; semantic mask uint8 {0,255}) and HE 512x512 (img RGB uint8
    2..255; instance mask 0..710, 710 values). Ranges pooled over the two patches; n_ids_observed is from
    the HE patch. ssDNA and mIF patches were not sampled; the first raw row covers them by pattern only.
    Second pass: voxel size not found; checked: TIFF headers/metadata of DAPI and HE patches (no calibration),
    CellBinDB_Archive.tsv (no pixel-size column), BioStudies record, paper full text (objectives and scanners
    only). No single archive on BioImage Archive; files are offered individually.'
