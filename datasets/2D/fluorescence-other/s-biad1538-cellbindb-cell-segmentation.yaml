notes: 'The BioStudies index file CellBinDB_Archive.tsv lists 2,532 TIFF files: 844 images, 844 instance masks and 844 semantic
  masks (DAPI 203, ssDNA 276, H&E 305, mIF 60 images; 256x256 and 512x512 px patches; mouse 828 and rat 16 images). Total
  size in bytes not stated in the listing, so size_bytes is null. Pixel size is not given on the archive page or in the
  paper Methods (10x/0.75 and 20x/0.5 objectives are named for the slide scanners), so voxel_size_nm is null. The paper
  says annotation is about 60% manual and the rest model-assisted then manually corrected, hence source mixed. No train/test
  split is provided. The full 1,044-image CellBinDB (including 200 human images from 10x Genomics) is also on Zenodo
  and CNGBdb; this record covers only the BioImage Archive deposit.'
