    DAPI 256x256 (img uint16 12..63343; instance mask uint16 LZW 0..36 with 36 values incl. background;
    semantic mask uint8 {0,255}) and HE 512x512 (img RGB uint8 2..255; instance mask 0..710, 710 values).
