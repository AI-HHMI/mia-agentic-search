title: 'BBBC022: Human U2OS cells, Cell Painting compound profiling (1,600 bioactive compounds)'
short_name: U2OS Cell Painting compound screen (fluorescence)
description: Pilot Cell Painting screen of 1,600 bioactive compounds on human U2OS cells, 20 plates of 384
  wells with 9 fields per well, imaged in 5 fluorescence channels (DNA, ER, nucleoli/RNA, Golgi/plasma
  membrane/actin, mitochondria) at 20x. 69,120 fields of view, 345,600 single-channel 16-bit TIFF files.
  Labels are per-well compound identity and role (compound or mock) in a metadata CSV, and the paper
  annotates 649 compounds with targets and annotation terms; there are no pixel-level masks.
