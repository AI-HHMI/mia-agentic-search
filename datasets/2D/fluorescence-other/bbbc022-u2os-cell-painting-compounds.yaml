notes: 'Size is the sum of the 100 zip sizes listed on the BBBC page (20 plates x 5 channels, ~150.5 GB); the metadata CSV
  (35 MB) is extra. Peeked one zip (plate 20585 channel w1): 3456 .tif files, 0.7 MB each. Pixel size 0.656 um/px at 20x is
  from the BBBC page. Image pixel dimensions are not stated on the page. Training signal is weak: per-well compound labels
  and, in the paper supplement, target/annotation terms for 649 of the 1,600 compounds; no pixel-level annotations (a 200-image
  nucleus-outline subset is released separately as BBBC039, already in the catalog). Checked the BBBC page and the Gustafsdottir
  2013 PLOS ONE full text (Europe PMC); the metadata CSV was not opened. enricher: TIFF 520x696 uint16 single-channel per
  file (probe).'
