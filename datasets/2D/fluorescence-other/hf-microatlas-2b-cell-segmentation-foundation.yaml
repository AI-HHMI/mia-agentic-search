description: Training data of a cell segmentation foundation model, gated on Hugging Face (10.3 TB zipped). A labeled part bundles 18 public cell
  segmentation datasets with human-annotated masks (e.g. Cellpose, LIVECell, TissueNet, DeepBacs, MoNuSAC, MoNuSeg); an unlabeled part holds images
  from 45 IDR studies with pseudo segmentation masks, for semi-supervised training.
