notes: 'Gated on Hugging Face (manual approval), hence registration; nothing downloaded, README unreadable without login, so the card was read
  from the public page and the file tree API (size = tree sum: image/ 369 zips 10.12 TB, mask/ 321 zips 151 GB, labeled.zip 25.3 GB).
  labeled.zip contents unlisted, so the 18 datasets, counts, modality, dimensionality (2D assumed), organisms are unverified. No license
  on card. The paper named on the card (no link) was not found in Europe PMC, Crossref or web search. Overlaps catalog sources (Cellpose,
  LIVECell, IDR); this is the gated repackaging with pseudo masks.'
