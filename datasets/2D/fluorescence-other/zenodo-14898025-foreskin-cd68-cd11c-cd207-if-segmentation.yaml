notes: 'One zip (657 MB, 1029 members): 50 FOV folders, each with RAW IMAGES (DAPI, CD68, CD11c, CD207 and a 4-channel
  ORIGINAL_ALL CHANNELS TIFF), BINARY (7 masks per marker combination) and ROI FILES (ImageJ ROI zips). The description
  gives 50 images of 600 x 600 um but no microscope or imaging mode, and no paper could be found, so the modality
  (fluorescence-other) and the annotation protocol are unconfirmed. enricher: voxel size 400 x 400 nm from the ImageJ
  TIFF calibration (was null); 1500 px x 0.4 um = 600 um matches the stated field of view. Annotation types are
  inferred from the BINARY masks and ROI files.'
