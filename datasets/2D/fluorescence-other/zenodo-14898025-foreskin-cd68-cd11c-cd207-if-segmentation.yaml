notes: 'One zip (657 MB) with 1029 members: 600 TIFFs, about 330 ROI zips, a few .roi files and .DS_Store files, listed with peek_archive
  (first 30 paths read: FOV26 and FOV32 folders with RAW IMAGES, BINARY, ROI FILES). The Zenodo description gives 50 images of 600 x
  600 um but no pixel size, microscope or imaging mode, and no paper is linked or could be found in Europe PMC / Crossref, so
  voxel size, modality (set to fluorescence-other) and the annotation protocol are unconfirmed. Not every FOV folder shown
  had BINARY or ROI folders; coverage per FOV was not checked. Annotation types are inferred from the BINARY masks and ROI files.'
