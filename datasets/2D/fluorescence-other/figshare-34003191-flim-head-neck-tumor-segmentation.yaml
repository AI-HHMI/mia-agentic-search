title: FLIM image and mask tiles of human head and neck tumor cryosections and xenograft mouse tumors
short_name: Head and neck tumor FLIM segmentation tiles
description: Image and mask tile pairs for deep-learning segmentation of tumor tissue in fluorescence lifetime imaging microscopy (FLIM) of cryosections, from 12 human head and neck cancer specimens (4-channel NADH and FAD photon counts and lifetimes, 2-channel boolean masks) and 6 xenograft mouse tumor datasets (3-channel lifetime and photon-count-ratio images, binary masks, plus a whole-tile cancer/margin/normal label). Augmented (rotated or flipped) copies are flagged. Also includes reconstructed images and H&E / E-cadherin stainings with masks for the human tumors.
