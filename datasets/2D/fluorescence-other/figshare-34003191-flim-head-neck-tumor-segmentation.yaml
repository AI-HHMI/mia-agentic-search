notes: 'Read the figshare record (44 files, 7.3 GB: per-tumor .npy tile files for human and xenograft,
  reconstruction and histology PNGs), its data_description.md (keys, shapes, channel order, mask meaning)
  and the code README. The associated paper (title on the figshare record) could not be found on Europe
  PMC or the web, so pixel size, microscope, how masks were made (the human_histopathological_stainings_and_masks
  folder suggests histology-guided masks) and the train/test split are not verified; data_description.md
  mentions dataset splits in the metadata but no split file is listed. The figshare description keeps
  an unfilled license placeholder in its text, while the license field says CC BY 4.0. Data format is
  other because the main arrays are NumPy .npy files (pickled dicts, np.load with allow_pickle); the PNGs
  are reconstructions and stainings. Tile height and width are not stated. n_items counts specimens (12
  human + 6 xenograft).'
