notes: 'TCIA Version 2 (2023-08-31): PNG, about 1.01 GB, 3,216 images per the page table; download is
  an Aspera package (no direct HTTP link found). The TCIA file listing was not readable, so file names,
  mask files and their format were not verified. Paper: 268 co-registered 512x512 mIHC/mIF patches from
  1356x1012 px ROIs at 0.5 um/pixel (20x); Vectra (mIF), Aperio CS2 (mIHC). Annotations: DAPI nuclei masks
  classified by CD3/CD8 intensity (tool named as Cellpose in one place, ImPartial in another); whole-cell
  masks planned. Not the Zenodo 4751737 DeepLIIF lung/bladder set. Full paper text not open access (arXiv
  preprint read). Checked: TCIA page, preprint, DeepLIIF README.'
