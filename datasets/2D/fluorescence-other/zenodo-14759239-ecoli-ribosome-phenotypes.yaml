notes: 'Zip listings (peek_archive): images.zip 6,620 TIFFs (4.87 GB, 7.6 GB uncompressed) and labels.zip
  6,620 TIFFs (17 MB, 3.8 GB uncompressed) with matching names; the label files were not opened, so whether
  they are per-cell instance labels or semantic masks, and the annotation process, are not confirmed (the
  Zenodo page only says masks). Staining, channel count, pixel size and microscope are not stated on the
  Zenodo page. The Zenodo description cites the paper "Ribosome Phenotypes Enable Rapid Antibiotic Susceptibility
  Testing in Escherichia coli" (not found open access this run); the related identifier on the record
  is the earlier Communications Biology paper from the same lab (nucleoid and membrane stains, Mask R-CNN
  segmentation of manually curated cells), listed under publications. Metadata CSVs (per-condition) and
  XLSX figure data are also in the record. enricher: size_bytes from complete listing (all 11 files);
  channels 2 (Cy3, DAPI) from metadata CSV channel_list.'
