notes: 'Archive.zip (19.6 GB, 127,338 TIFF = 63,669 gt + 63,669 noisy) listed with peek_archive. Zenodo
  authors are not named on the record, so authors is empty; the data are from Zhang et al. CVPR 2019 (FMD),
  whose original release is on Google Drive with an MIT-licensed code repo. Zenodo record states CC-BY-4.0.
  Full text of the paper was not available through Europe PMC; only the arXiv abstract and GitHub README
  were read, so pixel size, image size and exact sample list are not confirmed. The pair count here (63,669)
  differs from the original FMD (12,000 ground-truth images), probably because the challenge subset is
  cropped or reorganised; not verified. enricher: channels 1 (each TIFF is a single 512x512 uint8 plane;
  colour channel is encoded in the file name; was null).'
