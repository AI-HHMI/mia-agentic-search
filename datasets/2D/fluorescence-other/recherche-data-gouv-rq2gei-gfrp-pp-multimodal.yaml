title: Multi_Modal_Microscopy_Dataset_SEM_FLM_PLM (multimodal FM/PLM/SEM-BSE microscopy of woven GFRP/PP
  composites)
short_name: GFRP/PP composite porosity masks (FM/SEM)
description: Fluorescence (FM), polarized-light (PLM) and backscattered-electron SEM images of polished
  cross-sections of woven glass-fibre/polypropylene laminates at three compaction ratios (0, 30, 41 %).
  Contains representative raw tile mosaics, stitched and rigidly co-registered millimetre-scale extended-field
  images, per-bundle multimodal image stacks (SEM, classified SEM, FM, classified FM) and per-bundle binary
  masks (FLM_Void_NoGF for porosity, SEM_Bundle_Mask for bundle contour, SEM_GF_Mask for glass fibres).
  Labels come from Random Forest pixel classification in ilastik trained on regions annotated by one user.
