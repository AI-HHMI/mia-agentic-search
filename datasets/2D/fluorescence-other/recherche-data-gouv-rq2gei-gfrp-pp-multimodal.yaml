notes: 'One 1.6 GB RAR (Multi_Modal_Microscopy_DataSet_paper.rar) with folders Raw_MultiModal_Mosaics_SEM_FLM_PLM,
  Extended_Field_..._RigidRegistration and Bundles_0_degree_SEM_FLM. Terms (repository page): CC BY-NC
  4.0 plus a request for prior written consent from the corresponding author before use in publications.
  Masks come from ilastik Random Forest classification (trained on regions annotated by one user) post-processed
  in MATLAB. Modalities: fluorescence (FM), polarized light and SEM-BSE (SEM listed as other). Pixel size
  not stated numerically (only scale-bar images). Only 0-degree bundles are labelled; only a subset of
  raw tiles is shared. enricher: n_items 48 bundle stacks (31 CR_0/CR_30, 17 CR_41) from the RAR listing;
  annotations_verified (masks sampled); source automatic (was mixed); download_url = Dataverse datafile
  (was null).'
