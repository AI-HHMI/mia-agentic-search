notes: 'The repository holds a single 1.6 GB .rar (Multi_Modal_Microscopy_DataSet_paper.rar; not opened here, structure taken from the Data in Brief paper, which describes folders Raw_MultiModal_Mosaics_SEM_FLM_PLM, Extended_Field_SEM_FLM_PLM_AfterStitching_RigidRegistration and Bundles_0_degree_SEM_FLM). Terms (repository page): CC BY-NC 4.0 plus a request to obtain prior written consent from the corresponding author before any use intended for publication. Masks are semi-automatic (ilastik Random Forest trained on regions annotated by one user, then post-processed in MATLAB), not hand-drawn per pixel. Image modalities are fluorescence (FM), polarized-light and SEM-BSE; SEM has no matching modality enum, so it is listed as other. Pixel/voxel size is not stated numerically in the paper or repository metadata (only scale-bar images are shipped). Number of bundle stacks not stated explicitly. Only 0-degree bundles are labelled. Only a subset of raw tiles is shared.'
