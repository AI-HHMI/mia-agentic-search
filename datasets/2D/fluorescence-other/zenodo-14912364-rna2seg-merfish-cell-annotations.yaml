schema_version: '1.2'
id: zenodo-14912364-rna2seg-merfish-cell-annotations
title: Annotated datasets for cell segmentation from the RNA2seg study
short_name: MERFISH spatial transcriptomics cell masks
description: 72 image crops from five MERFISH datasets (human breast, colon, melanoma and lung from the
  Vizgen FFPE Immuno-Oncology release, plus mouse ileum) with manually annotated cell masks (labels.tif),
  together with the DAPI, polyT and cell-boundary staining images and RNA spot coordinates for each crop.
  724 cells were annotated by hand in Napari using staining plus a co-expression colouring of RNA spots;
  only cells whose boundary could be identified with confidence were annotated.
