notes: 'Zip listing (peek_archive): 932 MB, 579 files, 2,541.6 MB uncompressed; per crop imgs_N/{dapi,polyT,cb1,cb2,cb3,labels}.tif,
  bound.json, rna_spots.csv. Crops: Breast 15, Colon 11, Melanoma 23, Lung 15, mouse ileum 8 (72). Annotations
