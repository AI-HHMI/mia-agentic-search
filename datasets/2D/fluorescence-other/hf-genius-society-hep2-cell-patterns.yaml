notes: 'HF mirror; the card gives no original source. Class counts (Speckled 2831, Nucleolar 2598, Centromere 2741 ...) and
  13,596 total match the ICPR 2014 contest training set as described in arXiv 1504.02531, which also states the preprocessing
  these files show (min-max normalised, resized to 78x78). MIT is the mirror owner''s card field and may not match the original
  data holder''s terms. No split. enricher: annotations.source manual (paper: ''manually annotated by specialists''; was unknown).
  Voxel size left null: crops were resized to 78x78, so no pixel size applies. Related pending record: uq-snphep2-hep2-cell-patterns.'
