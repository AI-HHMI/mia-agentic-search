notes: 'Training images.zip (1.9 MB) listed with peek_archive: raw/ and groundTruth/
  each hold 68 TIFFs (136 tif), plus 68 .labeling and 68 .tif.labels files in groundTruth/
  (label files appear to be from Labkit/BigDataViewer, not confirmed). Hair cell labels
  are assumed to be one instance per cell because the dataset trains StarDist; the
  exact label encoding was not inspected. Microscope, staining/marker, pixel size,
  channel count and annotation procedure are not stated on the Zenodo record, the
  GitHub README or the PubMed abstract, and the article full text is not open access
  (checked Europe PMC via tools/paper.py: abstract only), so modality is recorded
  as fluorescence-other and voxel size as null. The record also contains StarDist2D_model_HC_counting.zip
  (15.5 MB trained model), not counted in n_items. size_bytes is the training-images
  zip only. Annotation source unknown because the Methods were not readable.'
