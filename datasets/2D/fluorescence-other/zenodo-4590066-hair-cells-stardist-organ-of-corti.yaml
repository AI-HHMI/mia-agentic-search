  full text is not open access (checked Europe PMC via tools/paper.py: abstract only), so modality is
  recorded as fluorescence-other. The record also contains StarDist2D_model_HC_counting.zip (15.5 MB trained
  model), not counted in n_items. size_bytes is the training-images zip only. Annotation source unknown
  because the Methods were not readable. enricher: voxel size 549.2514 nm from the ImageJ calibration
  (0.5492514 micron/px) of the raw TIFFs, no doc states it (was null). enricher: channels 1 from TIFF
  headers (was null); label encoding instance IDs from sample.'
