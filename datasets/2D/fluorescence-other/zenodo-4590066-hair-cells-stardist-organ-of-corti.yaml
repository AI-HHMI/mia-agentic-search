notes: 'Training images.zip (1.9 MB) listed with peek_archive: raw/ and groundTruth/ each hold 68 TIFFs
  (136 tif), plus 68 .labeling and 68 .tif.labels files in groundTruth/ (label files appear to be from
  Labkit/BigDataViewer, not confirmed). Microscope, staining/marker, pixel size, channel count and annotation
