notes: 'The archive was listed from the zip itself (the UCI page does not describe contents): "Thumbnail images" has Real images With fungi (570 image/mask pairs) and Without fungi (313 pairs) plus Synthetic images (428 pairs), all TIFF; "Original images" has Microscope 1 (6 pairs) and Microscope 2 (12 pairs) as PNG; plus Readme.md. Voxel size, microscope, magnification, fungal species and how real masks were made are not stated on the UCI page or the paper abstract; the paper full text was not retrievable (journal PDF links returned 404), and the README was only partly read, so these stay null/unknown. Synthetic images are generated from an image-formation model, not acquired. Dataset page lists 1,308 instances.'
