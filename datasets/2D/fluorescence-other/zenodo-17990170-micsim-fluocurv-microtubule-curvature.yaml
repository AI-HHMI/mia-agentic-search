notes: 'The images are simulated, not acquired (they mimic astral microtubules in the C. elegans zygote,
  per the paper); included as a paired training set for curvature regression. Zips: MicSim_FluoCurv_easy.zip
  (106.4 MB) and _complex.zip (104.2 MB), each 1,000 report_NNNN.noisy.tiff images + 1,000 matching report_NNNN.curvature.tiff
  maps; n_items counts 2,000 pairs. Ground truth from the simulation (three-point curvature, encoded pixelwise
  as intensities), hence source automatic; both sets share the same ground truth. The paper used a random
  80/10/10 split per set, but no split ships with the data. organism empty: synthetic data. enricher:
  paper found on arXiv (2604.26517, ICPR 2026) and added (was empty); voxel size stays null: no physical
  pixel size stated (paper, Zenodo pages, code record checked).'
