short_name: Synthetic microtubule curvature maps
description: Two sets of 1,000 simulated noisy fluorescence images of microtubules, each paired with a ground-truth
  curvature map (local curvature in grayscale), for training networks to predict curvature without segmentation.
  The simple set has uniform fluorescence along filaments; the complex set fades towards the ends.
