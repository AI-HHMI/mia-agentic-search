notes: 'The images are simulated, not acquired; the record is included because it is a paired training set for a microscopy
  task (curvature regression). Zip listings (peek_archive): MicSim_FluoCurv_easy.zip (106.4 MB) and _complex.zip (104.2 MB)
  each hold 1,000 report_NNNN.noisy.tiff images and 1,000 matching report_NNNN.curvature.tiff maps (about 0.1 MB each),
  so n_items counts 2,000 image/map pairs. The Zenodo page lists 210.6 MB of files. Pixel size, image dimensions and
  the exact simulation procedure are not stated on the page; the paper it asks to cite (Ait Laydi et al., MTCurv, ICPR
  2026) was not found in Europe PMC or Crossref, so publications is empty. Ground truth comes from the simulation, hence
  source automatic. No train/test split. Both sets share the same ground-truth curvature maps per the description.'
