notes: 'Four zips (cHL_1_MIBI 11.9 GB, cHL_2_MIBI 1.2 GB, cHL_CODEX 3.4 GB, Source_Data 0.85 GB), so no single
  download URL. peek_archive: cHL_CODEX has 49 channel TIFFs, a segmentation TIFF and one CSV; the MIBI zips hold
  per-FOV channel TIFFs and deepcell segmentationMap.tif files. Phenotype labels are per-cell CSV values, not drawn
  on images; ground truth came from clustering plus visual checks and pathologist review (paper Methods). Pixel
  size, n_items and publication date are not stated on the Zenodo page, archive listings or paper text read.
  Modality is taken from the paper: CODEX is multiplexed fluorescence, MIBI is ion-beam imaging (other).'
