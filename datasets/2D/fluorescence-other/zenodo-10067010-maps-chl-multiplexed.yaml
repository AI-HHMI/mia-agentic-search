title: 'Data for MAPS: Pathologist-level Cell Type Annotation from Tissue Images through Machine Learning'
short_name: Hodgkin lymphoma multiplexed MIBI/CODEX cells
description: Channel images and cell segmentation masks of classical Hodgkin lymphoma (cHL) tissue imaged with 46-marker MIBI-TOF
  (two cohorts, cHL 1 with 18 patients plus one reactive lymph node, cHL 2 with six FOVs) and one large 49-marker CODEX field
  of view. Cells carry pathologist-reviewed phenotype ground truth used to train and benchmark the MAPS, ASTIR and CellSighter
  cell-annotation methods (Source_Data.zip holds the per-cell tables). Supports cell segmentation and cell-phenotype classification.
