notes: 'Four zips (cHL_1_MIBI, cHL_2_MIBI, cHL_CODEX, Source_Data), no single archive. Phenotype labels are per-cell CSV rows
  (cellLabel -> Annotation) linked to instance segmentation maps. Pixel size is not stated (see technical.notes). Modality
  from the paper: CODEX is multiplexed fluorescence, MIBI is ion-beam imaging (other); files: cHL_CODEX.zip = CODEX, cHL_1_MIBI.zip
  and cHL_2_MIBI.zip = MIBI. channels: 49 for CODEX, 46 for MIBI. enricher: annotations.source mixed = segmentation automatic
  (deepcell), phenotypes from clustering plus manual curation and pathologist review (paper Methods). coverage: 92.2% of cHL1
  cells and 96.5% of CODEX cells got a final class, rest "Other". enricher: n_items 39 FOVs (32 cHL1 + 6 cHL2 + 1 CODEX) from
  listing; size from file listing; date from Zenodo API.'
