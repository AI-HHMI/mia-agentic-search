  notes: 'Listing: Zenodo API, 4 zips, 2046 files, 17,357,624,842 bytes (exact). Headers probed: MIBI channel and segmentationMap
    (float32, 2048x1536), cHL1 Segmentation.tiff (float32, 2560x2560), CODEX channel (uint16) and segmentation (int32), 8011x8085,
    all uncompressed single-page TIFFs. Sample (one FOV, cHL2 #1): dsDNA range [0, 484.03] (one sample only), 76.6% zeros;
    segmentationMap 0..38115. Normalization unknown: paper says MIBI images had crosstalk removed, were denoised (UNET foreground
    mask) and scaled to Histone H3 counts across FOVs. Voxel size not found; checked: TIFF headers (no calibration), Zenodo
    API record, metadata CSVs in the zips, paper full text (Methods list only typical MIBI acquisition parameters: 400x400
    um image area, 512x512 pixels per tile; no pixel size stated for released stitched FOVs or for CODEX), MAPS GitHub README.
    The "mpp1.75" folder name is a deepcell parameter, not the image pixel size. No single archive: data.download_url keeps
    the landing page; direct files are the four zips at zenodo.org/records/10067010/files/<name>.zip.'
