    {0,1,2}) and 4hMEFRNF213 plate1_A03_6_1 (raw 0-28798, p50 28; mask 0-11, 11 ids = fields.csv n_objects
    11). value_range from these samples only; normalization unknown (figure crops are re-encoded published
    images). Voxel size not found; checked: TIFF headers (no resolution tags), dataset card, fields/split/folds.csv,
