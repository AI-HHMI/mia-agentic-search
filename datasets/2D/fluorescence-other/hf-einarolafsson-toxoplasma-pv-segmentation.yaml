notes: 'Sources checked: HF dataset page, HF API file listing (556 images/*.tif + 556 masks/*.tif, fields.csv, folds.csv, split.csv), README, and range-request headers of one image/mask pair (both 1994x1994 uint16 yx, deflate). No paper, DOI or description of the imaging setup was found on the dataset card or file listing, so modality (fluorescence, inferred from file names such as dsred/cellmask and the card tag microscopy), staining, acquisition microscope, pixel size, organism detail and the meaning of PV were not stated and are left blank/generic; organism is the genus only as named on the card (file names mention HeLa/MEF host cells and RH). Mask semantics (instance labels) are inferred from uint16 masks and per-field object counts in fields.csv, not confirmed by the card; many fields have 0 objects. Splits per fields.csv: train 437 fields (15,550 objects), validation 108 (8,959), test 11 (683). Dataset was created 2026-09-19 on Hugging Face.'
