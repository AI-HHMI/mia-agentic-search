description: 556 curated microscopy image and mask pairs (single-channel uint16 TIFFs, up to about 2000
  x 2000 px) prepared with the spaCR toolkit and used to train the cpsam-r6 segmentation model (PV rounds
  5 and 6). fields.csv assigns each field to train (437), validation (108) or test (11) and lists its
  object count; split.csv adds the experimental domain.
