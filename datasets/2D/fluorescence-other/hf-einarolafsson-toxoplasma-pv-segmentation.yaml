notes: 'Toxoplasma gondii parasitophorous vacuoles (PVs) in fluorescence images of infected host cells,
  parasite marked by DsRed or an anti-Toxoplasma stain (model card of einarolafsson/toxoplasma-pv-segmentation-cpsam-r6,
  trained on these 556 fields). Sources: 449 lab PV-screen fields (RH, me49, 4hMEFRNF213, mtocScreen,
  plate1-7) and 107 published-figure crops (images/lit__PMC*); host cells (HeLa, MEF per file names) not
  stated. Splits per fields.csv: train 437, validation 108, test 11. enricher: organism Toxoplasma gondii
  from model card (was genus only); stains, channels 1 from model card and headers; size from full HF
  listing; masks confirmed instance ids. Annotation source (manual or model-assisted) not stated on the
  card. Mixed sources incl. figure crops, so no single pixel size exists; figure crops may carry their
  source papers'' terms.'
