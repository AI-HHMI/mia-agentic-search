notes: 'Paper reports 37,333 annotated nuclei in 841 images (29,464 in training; stage 1 and stage 2 test sets are separate). Per-image pixel sizes vary and are not stated on the page or in the paper, so voxel size is null. Archive contents (stage1_train.zip, 82.9 MB; stage1_test.zip 9.5 MB; stage2_test_final.zip 289.7 MB) could not be listed because the server does not report zip size; structure is taken from the page description. Masks exist only for the training set; test solutions are provided as CSV. Exact image counts per split and per-image modality were not checked.'
