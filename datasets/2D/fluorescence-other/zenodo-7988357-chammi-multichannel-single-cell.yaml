notes: 'Zenodo record gives CC BY 4.0 (paper appendix agrees, but asks users to respect the Research Use Agreements
  of the source datasets: WTC-11 research-use, HPA CC-BY 3.0, Cell Painting CC0). n_items 220,284 is the sum of the
  paper''s sampled single-cell images (65,103 WTC-11 + 66,936 HPA + 88,245 Cell Painting). The archive is a 28.1 GB
  tar.gz (peek_archive handles zips only), so its file format, folder layout and pixel sizes were not verified; the
  Zenodo page, GitHub README and paper do not state them (formats set to other). Channels 5 is the maximum; subsets
  have 3, 4 or 5. Labels come from the source studies (cell-cycle annotation, HPA localization, compound treatment),
  not segmentation masks. Related but distinct from CHAMMI-75 (aws-chammi-75-multichannel-pretraining), which is a
  later self-supervised pre-training collection. A newer Zenodo version exists; this record is version 1.0.'
