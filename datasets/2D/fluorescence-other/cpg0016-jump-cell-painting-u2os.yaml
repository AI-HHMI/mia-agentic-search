notes: 'Public S3 bucket s3://cellpainting-gallery/cpg0016-jump, prefixes source_1..15 and source_all. Size inconsistent (preprint
  115 TB; gallery README 358.4 TB / "over 250 TB"), so size_bytes and image count are null. Microscopes differ by source (Opera
  Phenix, ImageXpress, CV8000, CV7000, Operetta), so pixel size differs; voxel_size_nm left null. enricher: source_4 plate
  BR00117035 Index.idx.xml states ImageResolutionX/Y 5.98e-07 m (598 nm), Phenix 20x NA 1.0, binning 2, 8 channel files (Alexa
  488, 488 long, Alexa 568, Alexa 647, Hoechst 33342, Brightfield, Brightfield H, Brightfield L). enricher: labels verified:
  metadata/well.csv.gz in github.com/jump-cellpainting/datasets maps 1,151,808 source/plate/well rows to a JCP2022 perturbation
  ID (annotations_verified now true). CC0 per AWS registry and gallery README.'
