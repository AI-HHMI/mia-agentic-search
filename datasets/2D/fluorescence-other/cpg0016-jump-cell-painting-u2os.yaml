description: 'Production dataset of the JUMP-Cell Painting Consortium in the Cell Painting Gallery: multi-channel fluorescence
  (five channels, plus brightfield at some sources) TIFF images of U2OS cells perturbed with 116,750 compounds, 15,136 ORF
  reagents and CRISPR knockouts of 7,975 genes, imaged on several high-content microscopes at 12 data sources, with metadata,
  manifests and extracted profiles. Released under CC0.'
