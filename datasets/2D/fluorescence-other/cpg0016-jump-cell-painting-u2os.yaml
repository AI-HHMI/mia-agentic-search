notes: 'Public S3 bucket s3://cellpainting-gallery/cpg0016-jump (no AWS account needed per the AWS registry); listing shows
  source_1..source_15 prefixes and, for source_4, per-field TIFFs (e.g. r01c01f01p01-ch1sk1fk1fl1.tiff, ~2.4 MB) plus Index.idx.xml.
  Size is inconsistent (preprint 115 TB; gallery README 358.4 TB in a table, "over 250 TB" in text), so size_bytes and image
  count are null. Five fluorescence channels, plus 1 or 3 brightfield planes at some sources (preprint); channels set to 5.
  Microscopes per preprint: Opera Phenix, ImageXpress Micro confocal, CV8000, CV7000, Operetta; pixel size not stated. The
  preprint said the rest of cpg0016 would be released after validation; not rechecked. CC0 per AWS registry and gallery README.
  Labels are perturbation identities in metadata files, not pixel annotations; metadata files were not opened (annotations_verified
  false). Mainly useful for self-supervised and representation learning.'
