  notes: 'Listed one plate (source_4 BR00117035: 5,995 files, 14.6 GB, exact sizes) and the bucket''s top-level prefixes;
    no complete listing (whole dataset >100 TB), so size stays unknown and no estimate (file count unknown). Probed ch1 and
    ch6 TIFFs: uint16 1080x1080 single page, LZW, plain TIFF. Sampled ch1 (2,437,278 B): min 799, max 55051, mean 2263 (one
    sample); normalization unknown. Index.idx.xml (Harmony V5, range reads of head and tail) states 598 nm pixels for source_4
