notes: 'Only the Annotation file list is described (457 files, 81.6 GB: 48 OME-TIFF FOV crops, 48 Mesmer
  masks, 48 overlays, 48 GeoJSON, 24 h5ad, SVG phenotype maps, cluster_annotations.json). Other study
  file lists (Initial_Optimization, Validation, supplementary) hold raw multiplexed images without labels.
  Masks are Mesmer (automatic); phenotypes are PhenoGraph clusters named by manual annotation (cluster_annotations.json
  maps cluster ids to cell types per slide), so source is mixed. No publication cited on the study. enricher:
  voxel size 500 nm from the code repo: Master_metadata_Mesmer.csv lists Pixel_Size 0.5 for all 24 annotated
  slides, and its preprocessing README gives image_mpp = 0.50 "Microns per pixel" (was null). FOVs are
  unresampled crops (FOV coordinates span 7000x5500 px). enricher: channels 14 (OME-XML of the crops;
  the full panel is 27-plex); tissue tonsil per the study biosample.'
