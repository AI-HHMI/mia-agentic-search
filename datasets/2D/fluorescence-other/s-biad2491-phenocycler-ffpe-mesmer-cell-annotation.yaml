notes: 'Only the Annotation.json file list is described here (457 files, 81.6 GB:
  48 OME-TIFF FOV crops, 48 Mesmer masks and overlays, 48 GeoJSON, 24 h5ad, SVG phenotype
  maps, cluster_annotations.json). The study has other file lists (Initial_Optimization,
  Validation and supplementary experiments) with raw multiplexed images and no labels,
  not included. Masks come from Mesmer (automatic); cell phenotype clusters were assigned
  by PhenoGraph clustering followed by manual annotation, so source is mixed. Pixel
  size and image dimensions are not stated on the study page. No publication is cited
  on the study. download_url is null (files under biostudies/files/S-BIAD2491/). Checked
  study record and the Annotation file list.'
