short_name: FFPE PhenoCycler 27-plex cell masks and labels
description: 'Annotation subset of a multi-site multiplexed-imaging study: 48 cropped fields of view (2
  per slide, 24 FFPE human tissue slides from one site) of 27-plex PhenoCycler-Fusion immune-panel images
  as OME-TIFF, with Mesmer whole-cell segmentation masks and GeoJSON polygons, per-slide single-cell marker
  tables (h5ad) and manual cell-phenotype cluster annotations.'
