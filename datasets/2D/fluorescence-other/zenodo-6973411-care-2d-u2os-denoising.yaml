description: Pairs of low and high signal-to-noise 2D images of human U2OS cells. The high-SNR images are BBBC006 acquisitions
  (Hoechst-stained nuclei, automated high-content microscope); the low-SNR inputs were synthesized by adding strong read-out
  and shot noise and 2x2 pixel binning to mimic very low-light imaging. Provided as train/test folders of paired TIFFs.
