notes: 'Zip listing: train/GT 2457 + train/low 2457, test/GT 615 + test/low 615 TIFFs (3072 pairs, 6144 files). Low-SNR images
  are synthetic (noise + 2x2 binning) from BBBC006 (CC0), so labels are automatic. Sample-plane pixel size not stated on the
