notes: 'Zip listing: train/GT 2457 + train/low 2457, test/GT 615 + test/low 615 TIFFs (3072 pairs, 6144 files). Low-SNR images are synthetic (noise + 2x2 binning) from BBBC006 (CC0), so labels are automatic. Sample-plane pixel size not stated on the Zenodo page; BBBC006 page gives only the camera pixel size (6.45 um, 20x/0.45 NA, 2x binning). No related paper listed on the record. Possible relation to datasets/2D/fluorescence-other/bbbc006-u2os-out-of-focus-nuclei.yaml, which holds the original out-of-focus images, not these noise pairs.'
