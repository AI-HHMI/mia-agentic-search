title: 'RxRx1: 6-channel fluorescence images of four human cell types under siRNA gene knockdown, with perturbation labels'
short_name: RxRx1 siRNA-perturbed cells (6-ch fluorescence)
description: 125,510 six-channel fluorescence microscopy images (512x512, 8-bit PNG) of HUVEC, RPE, HepG2 and U2OS cells,
  each labeled with the siRNA that perturbed the well (1,138 siRNAs per the README), with experiment, plate, well and control
  metadata. Released by Recursion for the NeurIPS 2019 CellSignal competition (siRNA identification across unseen experimental
  batches); the metadata marks a train/test split.
