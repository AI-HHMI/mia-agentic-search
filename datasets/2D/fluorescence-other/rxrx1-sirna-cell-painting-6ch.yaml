notes: 'rxrx1-images.zip (HTTP HEAD 49,039,640,485 B) holds 753,060 PNGs = 125,510 sites x 6 channels, paths rxrx1/images/<cell
  type-experiment>/Plate<n>/<well>_s<site>_w<channel>.png. rxrx1-metadata.zip holds metadata.csv, README and LICENSE (CC BY-NC-SA
  4.0; non-commercial). The README says 1,138 siRNAs, the web page 1,108 classes; the README is used. Labels are perturbation
  identities (classification of the siRNA), not pixel annotations. Species inferred from the cell-line names (HUVEC, RPE,
  HepG2, U2OS), which the page does not state as human. Pixel size and microscope are not stated on the page or README; images
  are a 512x512 center crop of 2048x2048 originals downsampled 2x per the page. The RxRx1 paper (Taylor et al. 2019, workshop)
  was not found in Europe PMC, so no publication is listed. enricher: size = file listing of the 3 offered zips (images, metadata,
  DL embeddings), 49,092,920,838 B. enricher: voxel size not stated (page, README, arXiv 2301.05768 checked).'
