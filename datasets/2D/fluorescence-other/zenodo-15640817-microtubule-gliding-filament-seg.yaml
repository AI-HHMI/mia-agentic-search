notes: 'Filament_Dataset.zip was listed and its data.yaml, README files and one label file read with peek_archive:
  797 members (images + labels), nc 1 (microtubule), Roboflow project sikki/test-9b80s v2 (CC BY 4.0),
  397 images after the Roboflow export; README.roboflow.txt states resize to 640x640 plus 3x augmentation
  (90-degree rotations, brightness), so the images are not all independent. Who drew the polygons and
  how (manual or model-assisted) is not stated. Swarm_Dataset.rar (3.7 MB) and the .pt model files were
  not opened. No paper is linked on the Zenodo page (the record points to a GitHub repository) and a title
  search found none, so imaging details (microscope, pixel size, fluorophore) are not available. Whether
  the images are cropped from time-lapse movies is not stated.'
