title: Machine Learning Detection of Microtubule and Swarms Gliding on 2D Kinesin Substrate, Dataset and Models
short_name: Gliding microtubule polygons (fluorescence)
description: 397 fluorescence micrographs of kinesin-gliding microtubules exported from Roboflow as JPEG images at 640x640
  with YOLOv8 polygon labels for one class (microtubule) in train/valid/test folders, plus a separate Swarm_Dataset.rar
  for swarm detection and three trained detection/segmentation models. Accompanies a study on deep-learning segmentation
  and tracking of microtubule motility assays.
