schema_version: '1.2'
id: zenodo-4665863-hpa-cell-segmentation
title: HPA cell image segmentation dataset with four-channel fluorescence images and polygon cell annotations
short_name: HPA fluorescence cell polygons (4-channel)
description: Annotated Human Protein Atlas cell images, each with four channels (microtubules, ER, nuclei,
  protein of interest) and cell outlines drawn as polygons in GeoJSON with the Kaibu tool, plus a cell
  border mask per image. Full set of 266 images (train and valid), a 512 x 512 version with 4 train and
  159 test images, and pretrained segmentation models.
