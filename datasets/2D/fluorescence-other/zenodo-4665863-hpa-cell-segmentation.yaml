notes: hpa_dataset_v2.zip (5.2 GB) holds 257 train and 9 valid image folders, each with protein.png, er.png,
  microtubules.png, nuclei.png (a probed nuclei.png is 2048 x 2048 uint16), cell_border_mask.png and annotation.json
  (polygons). hpa_cell_segmentation_dataset_v2_512x512_4train_159test.zip (75 MB) is a 512 x 512 version
  with 4 train and 159 test folders; the 425 items count is 266 + 159 and may overlap for the train images.
  The record also ships four pretrained PyTorch models (about 2.2 GB). No peer-reviewed paper is linked
  from the Zenodo record, so none is listed; the F1000Research/ImJoy interactive segmentation preprint
  uses an HPA example dataset of this kind, but only its abstract was read and the link to this record
  is not confirmed. Organism, cell lines, microscope and pixel size are not stated on the record or in
  the archive listing, so they are left empty and the modality is the generic fluorescence-other. Annotators
  and annotation protocol are not described.
