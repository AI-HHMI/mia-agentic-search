notes: 'Zip index read (range requests): datasets/fallopian has 31 images and 31 masks, datasets/salivary 11 and 11; the paper describes 10 salivary
  images (1,058 cells, 600x800, 3 channels) and 17 fallopian crops of at least 256x256 (1,818 cells in 8 source images), so the zip
  holds more files than the paper text counts and n_items follows the zip. Pixel size, microscope and stain details are not given in
  the paper (it cites Mund et al., Nat Biotechnol 2022); salivary modality is partly IHC, so fluorescence-other is the nearest modality.
  Annotation by a field expert per the paper. Further zips in the record (pix2pix models 6.2 GB, StyleGAN2-ada models 1.6 GB, synthetic
  training sets 1.0 GB) are generated data and models, not counted in the size. enricher: n_items 40 (was 42; zip has
  30 fallopian + 10 salivary image/mask pairs, 80 files); masks are uint16 instance ids (sampled).'
