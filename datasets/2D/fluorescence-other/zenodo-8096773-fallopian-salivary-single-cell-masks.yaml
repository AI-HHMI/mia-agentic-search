  notes: 'Listing (listing.py --expand-zips): datasets.zip 13,519,917 B, 80 members, complete. Probes: fallopian PNG
    185x115x3 uint8 / mask 185x115 uint16 packbits; salivary PNG 800x600x3 uint8 / mask 800x600 uint16 ImageJ, uncompressed.
    Samples (one per subset): fallopian image 0..255 (p50 47), mask 0..9; salivary image 4..254 (p50 179), mask 0..130,
    131 unique = instance ids (paper - one label per cell, boundaries by a field expert). Fallopian = fluorescence,
    salivary = IHC (paper), both Homo sapiens. Voxel size not found; checked: PNG/TIFF headers (no calibration), Zenodo
