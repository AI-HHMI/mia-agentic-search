title: Single-cell instance masks for fallopian tube and salivary gland tissue images (structure-preserving GAN supplement)
short_name: Fallopian tube and salivary gland cell masks
description: Supplementary package of a Cell Reports Methods paper on synthetic training data for single-cell segmentation. The core
  data (datasets.zip, 13.5 MB) hold annotated image and instance-mask pairs of two tissue datasets from Mund et al. - a fluorescently
  stained fallopian tube biopsy (membrane and nuclei) and a salivary gland tumour section (nuclei and a tumour marker, IHC) - with
  cell-boundary masks drawn by a field expert. Other zips hold GAN-synthesised masks and images, trained pix2pix and StyleGAN2-ada models
  and code.
