title: 'CellBinDB: A Large-Scale Multimodal Annotated Dataset for Cell Segmentation'
short_name: CellBinDB multi-stain cell masks (DAPI, H&E)
description: 1,044 annotated microscope images (512x512 or 256x256 px crops of whole-slide images) of human and
  mouse tissue sections in four staining types (DAPI, ssDNA, H&E, mIF), covering more than 30 tissue types,
  with 109,083 annotated cells. Each image comes with an instance mask and a semantic mask. 844 mouse images
  are from the authors' own experiments and 200 human images are from public 10x Genomics datasets.
