notes: "Six benchmark datasets as .npz files with train/valid/test splits (per figshare description): ISBI Particle Tracking Challenge 2012-derived Microtubule, Receptor, Vesicle (1200 images each, synthetic), custom synthetic Particle (576 images), and two experimental sets, smFISH (643 images from Horvathova et al.) and SunTag (544 live-cell images from Mateju et al.), labelled by TrackMate with manual threshold and correction (paper Methods). n_items = 3x1200+576+643+544. The .npz archives were not opened, so array names, image sizes and pixel sizes are not verified; the three small CSVs map test images to SNR and density. Organism and microscope for the experimental sets were not read (see the original papers). The figshare license is MIT; the ISBI challenge images underlying three subsets carry their own terms, not checked."
