notes: 'LICENSE CONFLICT: Zenodo metadata states CC BY 4.0, but the README inside the zip says "No public
  redistribution license is assigned here. Confirm authorization from the data owner before public release".
  Reviewer should decide. Only a soma outline and one longest-process centerline per image are annotated
  (README: weak morphology annotations, not exhaustive). Pixel size, microscope and objective are not
  stated on the Zenodo page, the README or the cited paper (Wang et al. 2023, where images are only referred
  to as Iba1 immunofluorescence of hippocampal slices); the link between the 11 images and specific figures
  of that paper is not stated. Zip listing: 11 PNG + 11 LabelMe JSON + README.md. Image sizes 250-664
  x 167-620 px.'
