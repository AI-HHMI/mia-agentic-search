title: 'BBBC021: Human MCF7 cells, compound-profiling experiment'
short_name: MCF-7 compound profiling with MoA labels
description: 39,600 fluorescence TIFFs (13,200 fields in 3 channels, DNA, F-actin and beta-tubulin) of human
  MCF-7 breast cancer cells treated for 24 h with 113 small molecules at eight concentrations, from the Broad
  Bioimage Benchmark Collection. Mechanism-of-action ground truth (12 classes) is provided for 103 compound
  concentrations of 38 compounds. Meant for testing image-based profiling methods that predict drug mechanism.
