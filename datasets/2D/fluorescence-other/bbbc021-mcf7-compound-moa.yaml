notes: 'Dataset page lists 55 ZIP archives (one per plate, weeks 1-10) plus image, compound and MoA CSV
  files. One archive was listed with peek_archive: Week1_22123.zip holds 720 .tif files (2.6 MB each).
  The MoA CSV head was read: columns compound, concentration, moa. Of the 12 MoA classes, 6 were identified
  visually and 6 from literature (J Biomol Screen 2013 manuscript on PMC). The page says the images and
  ground truth are copyright AstraZeneca Pharmaceuticals and states no licence, so spdx is custom; the
  IDR copy of the same images (idr0035, screen 2001, 55 plates) is listed by IDR as CC-BY-4.0. Microscope,
  objective and pixel size are not stated on the BBBC page or the papers read; the Ljosa 2012 and Caie
  2010 papers are not open access (abstracts only). Only 103 of the treatments are labelled, hence sparse
  coverage; leave-one-compound-out evaluation is advised by the page. enricher: size_bytes 45,688,728,298
  B summed from the exact sizes of all 58 files (was null).'
