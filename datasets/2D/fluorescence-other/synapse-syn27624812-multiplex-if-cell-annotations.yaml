schema_version: '1.2'
id: synapse-syn27624812-multiplex-if-cell-annotations
title: Cross-platform dataset of multiplex fluorescent cellular object image annotations
short_name: Multiplex IF tissue cell annotations (3 platforms)
description: '211 manually annotated crops (400x400 or 800x800 px) of multiplex immunofluorescence images
  of human tissue (lung adenocarcinoma, pancreatic ductal adenocarcinoma, melanoma, lymphoma, lymph node,
  tonsil and others) from three platforms: Akoya Vectra 3.0, Ultivue InSituPlex on Zeiss Axioscan and
  Akoya CODEX. About 105,774 cellular objects (82,058 whole-cell, 23,716 nucleus-only) were drawn by hand
  in ImageJ and approved by pathologists. Each crop comes with whole-cell and/or nuclear masks, ImageJ
  ROI zips and PNGs, plus the parent image.'
