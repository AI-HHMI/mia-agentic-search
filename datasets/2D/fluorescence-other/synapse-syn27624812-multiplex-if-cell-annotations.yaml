notes: 'Hosted on Synapse (project syn27624812); folder listing via the Synapse REST API shows per-crop
  folders (Vectra P01-P16, Zeiss, CODEX) with *-Crop_Cell_Mask_Png.png, *-Crop_Cell_Mask_Roi_Zip.zip,
  *-Crop_Dapi_Mask_*, *-Crop_Tif.tif and full parent images (.tif/.czi). Synapse downloads normally need
  a free Synapse account (hence access: registration); direct download URL not verified. Pixel size differs
  by platform and is not one value: 0.5 um (Vectra 3.0), 0.325 um (Ultivue/Zeiss Axioscan), 0.3774 um
  (CODEX), all at 20x, per the paper, so voxel_size_nm is left null. Total size not stated on the page
  or in the paper. License: Synapse wiki states CC BY 4.0. Counts: 180 Vectra crops, 19 Zeiss, 12 CODEX.
  Annotations validated by consensus of 2-3 annotators plus pathologist approval.'
