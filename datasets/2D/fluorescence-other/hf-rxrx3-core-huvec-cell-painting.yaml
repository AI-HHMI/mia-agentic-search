notes: HF repo totals 23.13 GB (35 parquet shards of JPEG 2000 images, 17.4 GB per README, plus embeddings, CellProfiler features
  and metadata_rxrx3_core.csv). 1,335,606 image rows = 222,601 wells x 6 channels. License is the Recursion "Commercial End
  User License Agreement" (HF LICENSE file; no license tag on the card; the arXiv paper is CC BY-NC-SA 4.0). It grants a limited
  personal licence, bars redistribution and bars use for neuroscience-field programs and commercial neuroscience AI models
  (parts read), so a human should read it before accepting. The gene column is "unblinded or anonymized" (HF README). JPEG
  2000 in Parquet is not a listed format, hence other. Pixel size and microscope not stated on the card or arXiv abstract;
  arXiv full text not read. Species inferred from HUVEC.
