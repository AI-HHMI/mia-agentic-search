  notes: 'Listing: HF API tree (43 files, exact sizes; total equals data.size_bytes). The tools cannot read Parquet and pyarrow is not installed, so a scratch script range-read the first 4,000,000 B of data/train-00000-of-00035.parquet: the jp2 column pages are Snappy-compressed, 287 JPEG 2000 signatures were found and one image that lay intact in the stream decoded with Pillow to 512x512 uint8 (L), values 5-118 (one image of unknown channel; value_range from that one sample). Keys seen: compound-001/Plate1/AA15_s1_1. arXiv 2503.20158 Table 2: 512x512 center crops of the original 2048x2048 images, converted from uint16 to uint8, JPEG 2000 compression with quality layers [80, 40, 20] (lossy); conversion method not stated, so normalization unknown. Metadata CSV read in full: 222,601 rows x 11 columns; perturbation_type CRISPR 126,900 / COMPOUND 95,701; well_type_label blank for 35,546 rows. Download: every file has a direct HF resolve link (download-check usable, range requests); no single archive, so data.download_url stays the repo page. Voxel size not found; checked: HF card and README, rxrx.ai/rxrx3, RxRx3-core arXiv full text, RxRx3 bioRxiv full text (states only ImageXpress Micro Confocal in widefield, 10x objective, one site per well). Images are JP2 inside Parquet, which TensorSwitch does not read.'
