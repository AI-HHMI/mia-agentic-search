short_name: RxRx3-core HUVEC Cell Painting (6-ch)
description: 'Curated subset of RxRx3: 222,601 wells of 6-channel Cell Painting images (512x512, stored as JPEG 2000 in Parquet;
  1,335,606 channel images) of HUVEC cells perturbed with 735 CRISPR knockouts and 1,674 small molecules (compounds at 8 concentrations),
  with a metadata table (gene, treatment, SMILES, concentration, perturbation type, control labels), precomputed embeddings
  and a zero-shot drug-target-interaction benchmark.'
