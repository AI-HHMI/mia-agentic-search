short_name: U2OS Cell Painting 30k compounds (fluorescence)
description: Cell Painting screen of 30,616 small-molecule treatments on human U2OS cells in 406 384-well
  plates, 6 fields per well, 5 fluorescence channels (DNA, ER, RNA, AGP, mitochondria) at 20x, stored as
  16-bit grayscale TIFF, 919,265 five-channel fields of view in total. Labels are compound identity, a
  mechanism-of-action table for 1,553 compounds (BBBC page) and per-field quality-control flags (focal blur,
  saturation); there are no pixel-level masks.
