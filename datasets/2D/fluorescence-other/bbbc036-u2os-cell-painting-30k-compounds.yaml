notes: 'Total size is not stated on the BBBC page or in the paper (the paper gives 919,265 five-channel fields of view; n_items
  is that count, not files). Raw images are at the Cell Image Library (plates CIL 24277-26795, project 20269) and the Image
  Data Resource (idr0016); the paper says not all plates have the full 11,520 images. The BBBC page states CC BY 3.0 (Mark
  Bray); the paper is CC BY 4.0. Pixel size 0.656 um from the paper. Weak training signal: compound MoA labels and QC flags,
  no pixel masks. Checked the BBBC page and the GigaScience paper full text (Europe PMC); the CIL project page and file listings
  were not opened. enricher: direct TIFFs on the IDR FTP mirror (idr0016), download_url set to that folder (was null).'
