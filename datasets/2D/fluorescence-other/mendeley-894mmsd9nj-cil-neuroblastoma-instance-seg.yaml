notes: 'Single file cil.zip (20.7 MB, 200 PNGs = 100 image/mask pairs in test/ and train/). The Cell Image Library source page (CCDB_6843) returned HTTP 503, so pixel size, microscope, stain and the exact modality are not verified; the paper only says two-channel fluorescence images of neuroblastoma cells, fully annotated with single-cell masks, split 89 train / 11 validation following Stringer et al. (Cellpose), manually segmented previously. Species is taken from the dataset title. Mendeley page, file API, zip listing and the LACSS paper full text were checked; none state voxel size. Train/test counts in the zip were not enumerated beyond the 200 files.'
