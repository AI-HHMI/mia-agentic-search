id: hf-cross-channel-cell-from-hoechst
title: Cross-channel cell-from-Hoechst dataset (paired Hoechst-channel images and whole-cell instance
  masks)
short_name: Toxoplasma HFF cell segmentation (fluorescence)
description: '3029 paired fields: images/ holds the input channel (the dataset name indicates Hoechst)
  and masks/ the matching instance-labelled cell ground truth (same file stem = same field). Fields come
  from a Toxoplasma screen in HFF host cells (per split_by_well.csv). A train/test split by well is provided
  (2578 train / 451 test fields, 283,055 labelled objects in total). Prepared with spaCR and used to train
  a Cellpose-SAM model.'
