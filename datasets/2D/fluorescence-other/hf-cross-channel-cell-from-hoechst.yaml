notes: 'Checked dataset page, README, API file listing (3029 files each in images/ and masks/; images 13.2 GB, masks
  166 MB) and split_by_well.csv/fields.csv (split and object counts). No paper is linked. Pixel size, microscope,
  exact stains, annotation procedure (manual vs model-generated) are not stated in these sources, so left
  null/unknown. Modality recorded as fluorescence-other because the input channel is not named beyond the dataset
  title; host cell line HFF taken from the split_by_well.csv host column. Sibling of the catalog record
  hf-cross-channel-nuclei-from-cellmask (same screens, same author, nuclei masks from the cell-mask channel); this
  one pairs a different input channel with cell masks. Field overlap between the two is not documented.'
