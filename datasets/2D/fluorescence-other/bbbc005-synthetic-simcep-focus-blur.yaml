  CSVs; no paper describing the dataset itself was read (SIMCEP papers by Lehmussola et al. are cited
  on the page but were not opened). Image size and pixel size not confirmed from the files. enricher:
  size_bytes from complete file listing of both zips plus BBBC005_results_bray.csv (was 1,895,131,487,
  zips only). Images confirmed 696x520 uint8 single-page TIFF.'
