schema_version: '1.2'
id: edmond-rsoryv-condensategym-phase2face-splits
title: Supplementary dataset for CondensateGym data resource and Phase2Face algorithm
short_name: Biomolecular condensates in cells (fluorescence)
description: 'Edmond (Max Planck) record with three zips for the CondensateGym benchmark of the Phase2Face
  condensate phenotyping tool: phase2face_training_splits (two benchmarks, "stress" G3BP1 stress granules
  in control vs stressed cells and "trim" TRIM-protein condensates, each split into train/val/test with
  872 single-cell crops in total, the field images with cell masks, and per-cell CSV annotations of the
  condensates), the HeLa G3BP1-mCherry stress granule images (25 TIFF), and six PML isoform representative
  images.'
