notes: 'Zip indexes read with ranged GETs. Splits (cells.csv rows): stress 468/103/98, trim 141/33/29
  train/val/test, 872 cells in total (abstract of the manuscript record zenodo.org/records/23189721 says
  ~1,000 expert-annotated cells; restricted until 2027, Methods not readable). The HeLa zip has 25 TIFFs
  (G3BP1-mCherry + Hoechst, Zeiss LSM700, 40x water, 1024x1024 16-bit per its readme). Annotation procedure,
  origin of cell_mask.tif, microscope of the stress/trim fields and pixel sizes are not stated in the
  docs (voxel size null). Modality fluorescence-other as only the HeLa subset names its microscope. n_items
  counts single-cell crops. enricher: stress fields and HeLa TIFFs carry an ImageJ calibration of 156.3
  nm/px; trim fields (2154x2554) are uncalibrated, so voxel size stays null.'
