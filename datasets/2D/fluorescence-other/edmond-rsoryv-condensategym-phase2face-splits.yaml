  notes: 'Dataverse API lists 3 zips with exact sizes. Access URLs redirect to presigned S3 links whose
    HEAD fails, so listing.py/peek_archive.py could not read them; zip indexes and members were read with
    a short requests range-GET script (~19.5 MB). Sampled stress val field image.tif (1024x1024 uint16,
    12-3358, mean 78) and cell_mask.tif (0-14, 15 values), a cell_only_images TIFF (1024x1024 uint16,
    0-612, mostly zeros: the field masked to one cell), trim field image.tif (2154x2554 uint16, 0-8084)
    and cell_mask.tif (int32), HeLa NoStress_10.tif (ImageJ, 2 channels x 1024x1024 uint16, 177-65535),
    cells.csv and one annotation CSV. Value ranges from single samples. Voxel size: ImageJ header 6.398262
    px/micron (156.3 nm) in stress and HeLa TIFFs; trim TIFFs uncalibrated and from a different (plate)
    microscope; docs state none, so null. cell_only_images not listed as an array (masked copies of the
    field). No single archive: data.download_url stays null.'
