notes: >-
  Licence CC BY 4.0 per the AWS registry page; the paper says ~97% of source datasets carry Creative Commons licences
  and the ethics statement limits use to non-commercial research, so per-source terms apply (paper Table A7, not read).
  S3 listing shows train PNGs per channel (train/hpa0018/*-ch0.png), a 45 GB guidance zip, train/small metadata CSVs
  (3.0 GB / 0.6 GB), and test benchmarks (OME-TIFF crops under test/CHAMMI, pkl for CellPHIE); total size not computed.
  Pixel size not reported in the paper text read (first 100k of 230k chars) or the registry page. Organism left empty:
  16 organisms across sources. Paper tool could not fetch full text (arXiv DOI), so the arXiv HTML was read directly.
  Formats list png only for the pre-training images; test sets also use OME-TIFF and pickle.
