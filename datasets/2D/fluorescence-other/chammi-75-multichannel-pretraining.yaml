      \ folders: hpa0018, hpa0023, idr0001..idr0145, jump0001, nidr0001..nidr0032, wtc0001)\n  CHAMMI-75_test/\n    CELLPHIE/CELLPHIE.pkl\n\
      \    CHAMMI/{Allen,CP,HPA}/crops/*.png + combined_metadata.csv\n    HPAv23/<n>/*_cell_image.png\n    Jump-CP/<plate>/<well>/<site>/*.png\n\
      \    idr0017/plate_*/*.png + idr0017_meta.csv\n    rbc-mc/{Canadian,Swiss}/.../*.ome.tif"
    n_files: null
    listing_complete: false
