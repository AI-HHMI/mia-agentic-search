title: CHAMMI-75 - 2.8M multi-channel microscopy images from 75 studies for channel-adaptive pre-training
short_name: CHAMMI-75 multi-channel cell images
description: >-
  About 2.8 million multi-channel fields of view (up to seven channels each) pooled from 75 public cell
  microscopy studies, released for channel-adaptive self-supervised pre-training, together with evaluation
  benchmarks (HPAv23, IDR-0017, JUMP-CP, CellPHIE, RBC-MC, CHAMMI) and a 22-column metadata table.
