    - https://chammi-data.s3.us-west-2.amazonaws.com/CHAMMI-75/CHAMMI-75_train/hpa0018/00070df0-bbc3-11e8-b2bc-ac1f6b6435d0-ch0.png
    - https://chammi-data.s3.us-west-2.amazonaws.com/CHAMMI-75/CHAMMI-75_train/hpa0018/00070df0-bbc3-11e8-b2bc-ac1f6b6435d0-ch1.png
    - https://chammi-data.s3.us-west-2.amazonaws.com/CHAMMI-75/CHAMMI-75_train/hpa0018/00070df0-bbc3-11e8-b2bc-ac1f6b6435d0-ch2.png
    - https://chammi-data.s3.us-west-2.amazonaws.com/CHAMMI-75/CHAMMI-75_train/hpa0018/00070df0-bbc3-11e8-b2bc-ac1f6b6435d0-ch3.png
    size_bytes: 520866
    description: 'one 4-channel HPA field of view from the training set: four single-channel 512x512 uint8 PNGs (ch0 to ch3).
      Its weak labels are rows in CHAMMI-75_train_metadata.csv (too large for a sample unit)'
  arrays:
  - role: raw
    path_pattern: CHAMMI-75_train/*/*-ch[0-9].png
    format: png
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range: null
    normalization: contrast-stretched
    alignment: not-applicable
    alignment_notes: One PNG per channel; channels of one field of view share the stem and differ in the -ch<k> suffix. The
      metadata CSV storage.path column maps each file to its study, channel and labels.
  - role: label
    path_pattern: CHAMMI-75_train_metadata.csv
    format: csv
    axes: null
    shape: null
    shape_varies: false
    dtype: unknown
    compression: none
    value_range: null
    normalization: unknown
    encoding: other
    classes: null
    alignment: not-applicable
    alignment_notes: Per-channel-file metadata table (23 columns incl. experiment.reagent, experiment.control, biology.organism,
      biology.cell_line, imaging.channel_type, microscopy.type, microscopy.magnification, geometry.width/height, storage.path);
      rows join to images by storage.path. Weak labels only; benchmark labels live under CHAMMI-75_test/.
  notes: 'S3 delimiter listings of CHAMMI-75/, CHAMMI-75_train/ (75 study folders) and CHAMMI-75_test/ (6 benchmarks); a full
    listing was not attempted (paper: ~42M channel files). Probed one training PNG: 512x512 grey uint8, deflate. sample.py
    could not read PNGs in this environment (PIL import error), so no value range was observed. Paper A.1: channels split
    into separate files, rescaled to 8 bit with intensities normalized to 0-255 after clipping at the 0.1/99.9 percentiles
    (contrast-stretched), stored as lossless PNG, no spatial rescaling. Pixel size differs per source study and is not in
    the metadata CSV (it has microscopy.magnification only); voxel size not found; checked: PNG header, metadata CSV header,
    AWS registry page, GitHub README + aws-tutorials, arXiv full text. Organism left empty: 16 organisms per the paper, only
    per row in biology.organism (3 GB CSV, not read in full). Size not known: README says to have ~5 TB free for the whole
    bucket; the listed top-level files alone are 48.6 GB; shapes vary, so no estimate. No single archive for the images: per-file
    S3 objects; host chammi-data.s3.us-west-2.amazonaws.com is not on the TensorSwitch allowlist. guidance.zip members are
    .safetensors (not opened). Training images carry no masks: the set is for self-supervised pre-training.'
