notes: 'Synthetic data, not real microscopy images (like BBBC004/BBBC005). The zip holds 600 PNGs: 10 overlap folders (0.00,
  0.05, 0.12, 0.15, 0.23, 0.24, 0.36, 0.46, 0.54, 0.62), each with 30 nucleus images and 30 *_gt images. The ground truth is
