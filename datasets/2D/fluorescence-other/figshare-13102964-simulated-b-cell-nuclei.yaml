notes: 'Synthetic data, not real microscopy images (like BBBC004/BBBC005). The zip holds 600 PNGs: 10
  overlap folders (0.00, 0.05, 0.12, 0.15, 0.23, 0.24, 0.36, 0.46, 0.54, 0.62), each with 30 nucleus images
  and 30 *_gt images. The ground truth is generated by the simulator, so source is automatic.  Image size
  and pixel size are not stated on the Figshare page; no physical pixel size was found in the paper text
  searched. enricher: gt PNGs are RGB with one colour per nucleus (30 colours, ~150 px each in nucleus_gt000),
  consistent with per-nucleus outlines; the format is not documented, so annotation type stays other.'
