title: Simulated fluorescence micrographs of B cell nuclei with ground truth and increasing cell overlap
short_name: Simulated B cell nuclei, overlap series (fluor.)
description: Ten sets of 30 simulated fluorescence images of DAPI-stained B cell nuclei plus a ground-truth
  image for each, with the cell overlap increasing from set to set (folders 0.00 to 0.62). Simulated by
  energy-based texture mapping from real B cell micrographs, for evaluating cell segmentation methods.
