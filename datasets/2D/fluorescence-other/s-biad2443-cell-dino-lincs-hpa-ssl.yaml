notes: 'Very large: 148 files, 1.43 TB (136 LINCS plate tars of about 8-10 GB each, about 1.14 TB; HPA tar.gz archives
  of 57 GB (512 px whole images) and 204 GB (single-cell crops)). Image counts are not stated on the study page.
  Listed formats are PNG (single-cell crops, read from the first members of one LINCS tar) and TIFF (HPA whole images,
  named in Master_fovHPA_512.csv); the HPA tar.gz contents were not opened. Released for self-supervised
  training; the study page says "for training deep learning models" and the linked preprint (DINO on single cells)
  trains without annotations and evaluates with HPA localization labels. The study has a DOI 10.6019/S-BIAD2443.
  Pixel size and channel count not stated on the study page or in the preprint text read; the LINCS PNG crops
  are 128x128 px per the study page. Source datasets: LINCS Cell Painting (Way et al. 2022, Phenix Opera, 20x/1.0 NA
  water) and Human Protein Atlas (confocal).'
