title: 'Cell-DINO: Self-Supervised Image-based Embeddings for Cell Fluorescent Microscopy'
short_name: LINCS Cell Painting and HPA single cells (SSL)
description: 'Reprocessed fluorescence images from two public sources, packaged for training deep learning models
  (Cell-DINO / DINO self-supervised vision transformers): (1) LINCS Cell Painting images of A549 cells treated
  with 1,571 compounds at 6 doses, compressed with DeepProfiler and cropped into 128x128 px single-cell in-context
  PNG crops, delivered as one tar per plate; (2) Human Protein Atlas (HPA) confocal images: 512 px whole fields
  of view as TIFF and fixed-size masked single-cell PNG crops, with CSV tables giving the expert protein-localization
  labels (28 compartment classes) and cell type for each image, and pretrain / evaluation / train / test splits.'
