notes: 'Two zips (H2B-GFP.zip 74 MB, H2B-mCherry.zip 16 MB) plus README.txt, listed by the Mendeley API. Zip listings: H2B-GFP
  has 1,829 PNG images and 1,829 .npy masks (README: 1,529 train, 300 test); H2B-mCherry has 518 PNG and 518 .npy (308 red,
  210 grey). The README says masks were manually labelled in LabelStudio, then refined with SAM2 and reviewed; hence source
  mixed. Per the paper, tiles are 224x224 from full 1400x1000 Incucyte images at 0.625 um/pixel; the paper trains Mask R-CNN
  on them. The paper is a bioRxiv preprint. Mendeley lists Sushant Kumar as sole contributor; the preprint authors are Wang,
  Boev, Garcia, MacDonald, Harding and Kumar. n_items counts image tiles across both zips (the 210 grey tiles may be grey
  versions of mCherry tiles). enricher: masks are float32 stacks of per-instance binary masks (one plane per micronucleus);
  download_url set to the landing page (two zips, no single archive).'
