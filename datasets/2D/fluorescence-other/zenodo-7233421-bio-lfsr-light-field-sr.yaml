notes: 'Restoration (super-resolution) pairs, no labels. organisms: Mus musculus = Living cell *.rar (L929) + Mouse liver
  *.rar, Danio rerio = Zebrafish embryo membrane.rar; Synthetic *.rar none. Each folder holds LR.tif/HR.tif (4D spatial-angular
  views flattened to 3D by expanding angles into a vector) and raw LF.tif/sLF.tif (third dimension = scan position), per the
  readme. Dimensionality 2D is a judgement: images are 2D spatial with an angular axis. Pixel/voxel size not stated in the
  readme or the paper Methods I read (objective x63/1.4 NA or x20/0.5 NA, microlens pitch 100 um, 13x13 pixels per lens, Andor
  Zyla 4.2 Plus), so voxel_size_nm is null. The 1,350-pair figure comes from the readme. HR targets are 3x3 scanning light-field
  acquisitions, so source is marked automatic. Checked: Zenodo record and API, readme file, paper full text (no separate Data
  availability section located). enricher: size_bytes 96,851,779,412 from the exact Zenodo file listing.'
