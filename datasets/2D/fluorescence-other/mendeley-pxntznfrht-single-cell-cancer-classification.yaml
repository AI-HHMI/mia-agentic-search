notes: 'The Mendeley page and the Hugging Face card both give the paper and dataset citations as placeholders, so no paper
  was found and none is listed; cell lines, microscope, pixel size and staining protocol are therefore not known. The Mendeley
  file listing could not be read (public API returned no files); n_items 1133 is the stated 591 normal + 542 cancer. enricher:
  the HF mirror now has 542 cancer + 591 normal (1,133) TIFFs, 185.7 MB; size_bytes from its listing. Format from a header
  probe of one mirror file: uint8 RGB TIFF, 129x317 px crop. Magnification 40x is taken from the mirror folder name cell_40x.
  Annotation source (manual vs automated labelling) not stated.'
