notes: 'The Mendeley page and the Hugging Face card both give the paper and dataset citations as placeholders, so no paper was
  found and none is listed; cell lines, microscope, pixel size and staining protocol are therefore not known. The Mendeley file
  listing could not be read (public API returned no files); n_items 1133 is the stated 591 normal + 542 cancer. The Hugging
  Face mirror (the file listing used here) holds 995 TIFFs (542 cancer + 453 normal), 161 MB, so it may lag the Mendeley version.
  Format from a header probe of one mirror file: uint8 RGB TIFF, 129x317 px crop. Magnification 40x is taken from the mirror
  folder name cell_40x. Annotation source (manual vs automated labelling) not stated.'
