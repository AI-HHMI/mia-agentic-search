description: '3029 paired fields: images/ holds the cell-mask input channel and masks/ the matching instance-labelled
  nuclei ground truth (same file stem = same field). Fields come from a Toxoplasma screen in HFF host cells (per
  split_by_well.csv). A train/test split by well is provided. Used to train a Cellpose-SAM model and prepared with
  spaCR.'
