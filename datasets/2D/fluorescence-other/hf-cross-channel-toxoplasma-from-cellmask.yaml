notes: 'Checked the dataset card, README, API file listings (3030 files each in images/ and masks_pv/, 14.49 GB and 30.9 MB) and fields.csv. No paper is linked. Pixel size, microscope, stain/channel and host cells are not stated in these sources. The masks are described as regenerated with a trained Cellpose-SAM model, so the labels are model-generated rather than manual (source: automatic). Sibling of the catalogued record hf-cross-channel-nuclei-from-cellmask (same screen/images, nuclei masks instead of PV masks); this record differs in its label target (parasitophorous vacuoles, masks_pv/). enricher: size_bytes from the complete HF listing (was 14523838773); host HFF from split_by_well.csv.'
