description: '3030 paired fields: images/ holds the cell-mask input channel and masks_pv/ the matching instance-labelled parasitophorous-vacuole (PV) ground truth (same file stem = same field), regenerated with a promoted Cellpose-SAM model (cpsam_v2_toxo_r5). A train/test split by well is given in fields.csv (2567 train fields with 31637 objects, 463 test fields with 6116 objects). Prepared with spaCR and used to train a Cellpose-SAM model.'
