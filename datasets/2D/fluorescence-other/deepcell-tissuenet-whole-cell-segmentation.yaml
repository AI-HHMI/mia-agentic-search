schema_version: '1.2'
id: deepcell-tissuenet-whole-cell-segmentation
title: 'TissueNet: whole-cell and nuclear segmentation training data for multiplexed tissue imaging'
short_name: TissueNet multiplexed tissue cell segmentation
description: Training dataset for nuclear and whole-cell segmentation in tissue images, with more than 1 million manually labeled cells (1.3 million whole-cell and 1.2 million nuclear annotations). 2D two-channel images (nuclear plus membrane/cytoplasm marker) from six imaging platforms, nine organs and human, mouse and macaque samples. Labels were made with a human-in-the-loop pipeline in DeepCell Label (crowdsourced corrections plus expert QC). Versions 1.0 (July 2021) and 1.1 (April 2022, extra manual QC).
