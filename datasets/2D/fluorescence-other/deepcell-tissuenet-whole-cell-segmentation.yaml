notes: 'Terms: the DeepCell docs say "modified Apache license, for non-commercial academic use only"; the paper says the dataset is available at datasets.deepcell.org for non-commercial use. The deepcell-tf LICENSE page we fetched showed plain Apache 2.0, so the exact dataset license text was not seen; spdx is custom. Access needs a free DeepCell API key (registration). Data are delivered as NumPy arrays through the Python API (npz), which has no listed format, hence formats [other]. Pixel resolution, total image count, the names of the six platforms, authors beyond those listed, and the exact publication date were not found in the fetched docs page or the readable parts of the paper (PMC text partly truncated; supplementary not read); the datasets.deepcell.org page returned only its title. No file listing was inspected, so annotations_verified is false. Macaque samples are mentioned in the paper, but no species name is given, so only human and mouse are listed.'
