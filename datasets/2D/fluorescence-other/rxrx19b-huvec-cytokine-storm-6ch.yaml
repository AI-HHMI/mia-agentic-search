notes: 'rxrx19b-images.zip (HTTP HEAD 438,347,411,230 B) holds 422,304 PNGs = 70,384 sites x 6 channels
  (one site per well), paths rxrx19b/images/<cell type-experiment>/Plate<n>/<well>_s1_w<channel>.png;
  rxrx19b-metadata.zip holds metadata.csv (11 MB), README and a CC BY 4.0 LICENSE. Labels are disease
  condition and compound identities, not pixel annotations; no split column in the README schema. Species
  inferred from the HUVEC name (paper Methods: human umbilical vein endothelial cells). Pixel size and
  microscope not stated. Different from RxRx2 (same group, HUVEC, immune stimulants, 1024x1024) and RxRx19a
  (SARS-CoV-2 infection, HRCE/Vero). enricher: size = all 3 archives incl. embeddings (was images zip
  only); metadata.csv read in full: 70,384 sites, all HUVEC-1.'
