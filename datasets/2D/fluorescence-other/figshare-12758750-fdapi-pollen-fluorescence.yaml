notes: 'The data is a single 202 MB 7z archive (dataset.7z), which peek_archive cannot list, so the image file format and
  folder layout are not verified; the figshare page says images are stored in subfolders labelled by plant species, and the
  paper says each image is tagged with the species name. Per-object image sizes in the paper range from 41x41 to 81x81 px
  (species-dependent). Pixel size is not stated on the page or in the paper (source images are 640x480 at 100x). The paper
  states that annotating the viability class (viable, dead, sterile) is future work, so the training signal is species
  classification only. Number of images is from the paper (62,577; the paper says eight species). License CC BY 4.0 is
  from the figshare record.'
