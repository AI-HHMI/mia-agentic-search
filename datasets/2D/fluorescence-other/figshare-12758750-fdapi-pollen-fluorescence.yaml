short_name: FDA/PI-labelled pollen grain crops (fluorescence)
description: 62,577 cropped images of individual pollen grains from eight plant species, labelled with
  fluorescein diacetate and propidium iodide for viability assessment and imaged by epifluorescence microscopy.
  Each image is tagged with the plant species; per-image viability classes are not annotated.
