notes: 'The data is a single 202 MB 7z archive (dataset.7z). Per-object image sizes in the paper range
  from 41x41 to 81x81 px (species-dependent). Pixel size is not stated on the page or in the paper (source
  images are 640x480 at 100x). The paper states that annotating the viability class (viable, dead, sterile)
  is future work, so the training signal is species classification only. Number of images is from the
  paper (62,577; the paper says eight species). License CC BY 4.0 is from the figshare record. enricher:
  formats other -> png (7z header read by range: 62,577 PNGs in 8 species folders). organisms: one per
  folder dataset/<Genusspecies>/ (e.g. Olea europaea = Oleaeuropea/).'
