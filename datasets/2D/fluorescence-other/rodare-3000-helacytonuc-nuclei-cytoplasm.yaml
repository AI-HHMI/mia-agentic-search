title: 'HeLaCytoNuc: fluorescence microscopy dataset with segmentation masks for cell nuclei and cytoplasm'
short_name: HeLa nuclei and cytoplasm masks (fluorescence)
description: 2,676 preprocessed 8-bit RGB fluorescence images of fixed HeLa cells (DAPI nuclei, phalloidin
  actin/cytoplasm) with nuclei and cytoplasm instance masks, split 70:20:10 into train/validation/test.
  Masks were generated with CellProfiler; the test subset was annotated manually. Raw 16-bit images are
  a separate archive.
