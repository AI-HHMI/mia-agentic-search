notes: 'Sources checked: HZDR publication page and RODARE API record (file list, license). No paper for the dataset itself found via Europe PMC/Crossref title search (the page cites Rämö et al. 2014, BMC Genomics, as the source of the original images, no DOI given). Zip contents could not be listed (server reports no size), so the TIFF format and folder layout come from the dataset page description. Pixel size not stated on the page. Train/validation masks are CellProfiler-generated; only the test subset was manually annotated. DOI 10.14278/rodare.3000 is the concept record; the version record is 10.14278/rodare.3001. Total size is the sum of the listed archives, including the 8.6 GB raw-image archive.'
