    - 3
    shape_varies: false
    dtype: uint8
    compression: none
    value_range:
    - 0
    - 252
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Plain RGB TIFF (photometric 2, 3 samples). Samples are fluorescence channels per
      the record: R = cytoplasm (phalloidin), B = nuclei, G unused (all 0 in the sample), hence c not
      s. Preprocessed 2x smaller than the 1040x1392 16-bit originals.'
  - role: label
    path_pattern: nuclei_masks/*.tif
    format: tiff
    axes: yx
    shape:
    - 520
    - 696
    shape_varies: false
    dtype: uint8
    compression: none
    encoding: instance-ids
    classes:
    - id: null
      name: nucleus
    alignment: same-grid
    alignment_notes: <split>.zip nuclei_masks/<n>.tif pairs with images/<n>.tif (all 268 test stems in
      all 3 folders). 0 = background; sample 2547.tif has IDs 1-76.
  - role: label
    path_pattern: cytoplasm_masks/*.tif
    format: tiff
    axes: yx
    shape:
    - 520
    - 696
    shape_varies: false
    dtype: uint8
    compression: none
    encoding: instance-ids
    classes:
    - id: null
      name: cytoplasm
    alignment: same-grid
    alignment_notes: cytoplasm_masks/<n>.tif pairs with images/<n>.tif; sample 2547.tif has IDs 1-85.
      Test-split masks are manual; HeLaCytoNuc_test_cellprofiler_masks.zip holds the CellProfiler versions
      with the same folder names.
  notes: 'Sizes of the 5 zips from the RODARE API record (listing.py cannot list RODARE; the server sends
    no ranges, so zips were not listed remotely). Downloaded HeLaCytoNuc_test.zip (76,153,291 B) to a
    temp dir and read it with zipfile + tifffile: 804 members in images/, nuclei_masks/, cytoplasm_masks/
    (268 each, same stems). images/2547.tif: 520x696x3 uint8, no compression, per-channel max R 242 /
    G 0 / B 252; masks uint8 with 77 and 86 values (instance IDs). Value range from one sample. Train/validation
    zips and the raw 16-bit archive not opened. Voxel size not found; checked: TIFF tags (XResolution
    1/1, no unit), RODARE API record, HZDR publication page, Raemoe et al. 2014 Methods (ImageXpress,
    10x/0.45 objective, no pixel size). Download: per-split zips on rodare.hzdr.de, which is not on the
    TensorSwitch allowlist and has no range requests; no single archive, so data.download_url is the record page.'
