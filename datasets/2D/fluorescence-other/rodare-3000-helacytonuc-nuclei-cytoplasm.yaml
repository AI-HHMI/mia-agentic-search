notes: 'Sources checked: HZDR publication page and RODARE API record (file list, license). No paper for
  the dataset itself found via Europe PMC/Crossref title search (the page cites Rämö et al. 2014, BMC
  Genomics, as the source of the original images, no DOI given). Pixel size not stated on the page. Train/validation
  masks are CellProfiler-generated; only the test subset was manually annotated. DOI 10.14278/rodare.3000
  is the concept record; the version record is 10.14278/rodare.3001. Total size is the sum of the listed
  archives, including the 8.6 GB raw-image archive. enricher: downloaded HeLaCytoNuc_test.zip and confirmed
  layout and masks; channels 2 (R cytoplasm, B nuclei; G empty).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "rodare.hzdr.de/record/3001   5 zips, 9.25 GB\n  HeLaCytoNuc_train.zip       434.9 MB\n  HeLaCytoNuc_validation.zip\
      \  139.9 MB\n  HeLaCytoNuc_test.zip         76.2 MB (804 TIFFs, 485 MB unzipped)\n    images/<n>.tif\
      \            268 RGB 520x696 uint8\n    nuclei_masks/<n>.tif      268 instance masks uint8\n   \
      \ cytoplasm_masks/<n>.tif   268 instance masks uint8\n  HeLaCytoNuc_test_cellprofiler_masks.zip\
      \  3.7 MB\n    nuclei_masks/, cytoplasm_masks/  (CellProfiler masks for test)\n  HeLaCytoNuc_raw_images.zip\
      \  8.6 GB  (16-bit 1040x1392 originals)"
    n_files: 5
    listing_complete: false
  sample:
    urls:
    - https://rodare.hzdr.de/api/files/fae71336-c6d2-45b2-ae65-416c8f57b5a0/HeLaCytoNuc_test.zip
    size_bytes: 76153291
    description: The smallest archive with images and both mask sets (268 test images); the server has
