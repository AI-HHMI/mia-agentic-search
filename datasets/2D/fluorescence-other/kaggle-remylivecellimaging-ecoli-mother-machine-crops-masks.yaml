notes: 'Kaggle API record (license Unknown, version 2, 203 MB, eight .npy files: TRAIN and VAL for anchors 0-3)
  and the open-access paper (Ripandelli et al. 2024, J Phys Chem B), whose data statement links this set as the
  cell segmentation training data; about 3,000 manually segmented cells were used for first U-Net training; Nikon
  Ti-2, 1.49 NA 100x, EM-CCD, mKate2. The page states 1 pixel = 0.11 um and that this adapted set has 7,000+ samples
  instead of 13,050;  No license anywhere (the paper is CC BY-NC-ND but covers the text). enricher: the .npy files
  are pickles (opcodes read statically, never unpickled); n_items 8,099 crops = train 4,857/2,104/438/74 + val 403/178/40/5
  from the pickled array shapes (was 7,473, train only).'
