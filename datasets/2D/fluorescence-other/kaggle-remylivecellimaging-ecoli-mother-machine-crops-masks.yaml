description: Fluorescence crops of single E. coli MG1655 cells in mother-machine microchannels with binary cell
  masks and contour coordinates, grouped into four crop sizes ('anchors', 32x32 to 32x168 px; 4,857, 2,104, 438
  and 74 training samples) with matching validation files. Stored as NumPy arrays; used to train a U-Net cell segmentation
  model.
