  notes: 'Listing: peek_archive on the Kaggle bundle (signed storage.googleapis.com redirect): 8 members, 203.4
    MB uncompressed, 21.7 MB zip; size_bytes 203,389,510 is the Kaggle-stated total. The .npy files are not NumPy
    format but concatenated pickles (protocol 4). Per CLAUDE.md they were not unpickled: pickletools opcodes were
    read statically and the raw array bytes of VAL_anchor3 (67,998 B compressed, the whole member) were decoded
    with numpy.frombuffer: images 5x32x168 float64, 0-39862 (one file); masks 5x32x168 float64 {0, 1}; contours
    5 int32 arrays (k x 2); 5 cell names; 32; anchor scalar. Array shapes of all 8 files from the pickle headers.
    Normalization none: integer camera counts as float (inferred). Voxel size 110 nm is from the Kaggle page (record,
    kept). No sample unit: the files need unpickling, which TensorSwitch and the download agents must not do; www.kaggle.com
    is not on the allowlist either.'
