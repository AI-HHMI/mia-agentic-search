schema_version: '1.2'
id: cellpose-cyto-dataset
title: Cellpose cytoplasm training dataset - manually segmented cells in diverse images
short_name: Cellpose cyto cell segmentation (mixed light)
description: Training set behind the Cellpose generalist cell segmentation model. Per the bioRxiv preprint
  it has 616 images with over 70,000 manually segmented objects - fluorescent cytoplasm markers (316),
  brightfield (50), membrane-labelled cells (58), other microscopy (86) and 98 non-microscopy images (fruits,
  rocks, jellyfish). Images come from internet searches and public repositories (OMERO, BBBC, published
  datasets); 69 are reserved for testing. Download requires accepting HHMI research content terms.
