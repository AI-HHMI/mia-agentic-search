notes: 'Access is by form: the page asks the user to accept the HHMI Research Content Terms (limited non-commercial,
  educational, research and personal use only) and give an institutional email, so no direct download
  URL or file listing was available and formats/mask encoding are unknown (formats set to other only because
  none could be confirmed). Counts come from the bioRxiv preprint (616 images, 69 for testing, 98 non-microscopy
  images), not the dataset page; the published version and the current download may differ (page text
  mentions newer contributions; other sources describe 618 images and 256 added training images, not verified
  here). Paper full text on Europe PMC is not open access, so the preprint was read via WebFetch (summary,
  not full Methods). Voxel size, organisms and stains vary per source image and are not given. Mixed-source:
  many images were originally from BBBC and other public sets, so it overlaps other catalog records.'
