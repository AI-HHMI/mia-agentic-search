notes: 'BBBC page and both zips: images.zip (77.9 MB, 200 16-bit TIFF, 520 x 696 px) and masks.zip (2.8 MB, 200 PNG), metadata.zip
  (18 KB, subset assignment). Paper (Cytometry A 2019, open access full text read): 23,165 nuclei annotated by PhD-level
  experts with a superpixel-assisted tool, every nucleus including micronuclei labelled; images "imaged at 20x at a resolution
  of 0.656 um/pixel" (paper, network-design paragraph). Microscope model is not named on the BBBC page or the paper text
  read (the file names start with IXM, which is not a stated fact); modality therefore fluorescence-other. Licence CC0 per
  the BBBC page. Some images overlap with BBBC038 (Data Science Bowl 2018, bbbc038-dsb2018-nuclei in the catalog): the DSB set
  is a different, larger collection.'
