notes: 'Collection of seven figshare.plus items; six are images/masks (CODEX qptiff 44.3 + 41.5 GB, Mesmer masks 15.9 + 10.4
  GB, H&E 41.5 + 13.5 GB; exact sums from the figshare API), the Seurat-object item is not image data. Masks are automatic
  (Mesmer), not manual; the cell-type labels the paper refined by clustering live in the Seurat objects. H&E sample IDs differ
  slightly from CODEX IDs; no H&E for H36. enricher: voxel size kept null, subsets differ: CODEX + masks 507 nm/px (TIFF resolution
  tag of AML2_183_Scan1.qptiff, 19,725.9 px/cm), H&E 250 nm/px (QPI XML PixelSizeMicrons 0.25 in AML2_183_HE.qptiff). Masks
  are on the CODEX grid; H&E is not (paper registers 40x H&E to the 20x CODEX space).'
