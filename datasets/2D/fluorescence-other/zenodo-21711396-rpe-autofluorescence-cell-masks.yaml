notes: 'Zip listings: 1 IAA (55 mat + 55 png), 2 Rotenone (52+52), 3 Thapsigargin (103+103), 4 H2O2 (52+52), 5 NMDA (79+79) =
  341 image/mask pairs split Control/Treated, plus 6 Other.zip (2 protocol .mat files). Not stated in the record: how the masks
  were made, pixel size. The related paper is not yet published or found, so no paper was read. enricher: raw .mat files are
  MATLAB 5.0 MAT-files (not a listed format; formats lists only the PNG masks); each holds struct HAC_Image with
  imageStruct.data, a 1024 x 1024 x 34 double array (34 excitation/emission channels in the stored protocol), so channels 34
  (was null). coverage: one binary cell mask per image, same 1024 x 1024 grid.'
