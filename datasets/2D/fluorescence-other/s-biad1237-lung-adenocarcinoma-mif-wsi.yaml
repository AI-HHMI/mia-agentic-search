notes: 'Listing (HTTP index of the BioStudies FTP mirror): 162 .czi + 162 .annotations + one survival xlsx, ~2.1 TB
  (sizes rounded by the index). Annotations are derived: tumour/stroma classified by HALO AI trained on pan-cytokeratin
  areas, so they are model outputs, not manual labels (hence source automatic). The .annotations format was not opened.
  Pixel size not stated on the BioStudies record or in the paper Methods; CZI headers not read (TB-scale files).
  The paper says data are available on request, while the archive record is open under CC BY 4.0.'
