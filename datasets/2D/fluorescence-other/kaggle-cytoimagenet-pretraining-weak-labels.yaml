schema_version: '1.2'
id: kaggle-cytoimagenet-pretraining-weak-labels
title: 'CytoImageNet: A large-scale pretraining dataset for bioimage transfer learning'
short_name: CytoImageNet weakly labeled pretraining images
description: 890,737 grayscale microscopy images in 894 weak classes (about 1,000 images per class), curated from 40 openly
  available datasets of Recursion, the Image Data Resource, the Broad Bioimage Benchmark Collection, Kaggle and the Cell
  Image Library, as an ImageNet-style pretraining set for bioimage transfer learning. Labels are soft classes derived from
  the source metadata (compound, phenotype, cell type, gene, siRNA, stained structure or organism), so classes can overlap.
  Images were converted to PNG, multi-channel images merged to grayscale, and some are crops of larger images.
