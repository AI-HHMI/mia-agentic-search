notes: 'Kaggle public metadata (license CC0: Public Domain, 56.2 GB, version 8) and the paper (arXiv 2111.11646) were
  read; the Kaggle HTML page itself did not render, so size and license come from the Kaggle API record and the file
  list shows PNG images. A free Kaggle account is needed to download (registration). The CC0 label is the
  compiler''s; the source datasets (IDR, BBBC, Recursion RxRx, Kaggle, Cell Image Library) keep their own terms, which the
  record does not list. Labels are weak, metadata-derived classes (not expert annotations); the dataset was released for
  pretraining. Pixel size is not given (images are rescaled/cropped and merged to grayscale). Organisms listed from the paper''s
  source-dataset table (human, murine fibroblast, C. elegans) and may be incomplete. The annotation CSVs were seen only as a
  folder name in the GitHub README, not in the Kaggle file listing.'
