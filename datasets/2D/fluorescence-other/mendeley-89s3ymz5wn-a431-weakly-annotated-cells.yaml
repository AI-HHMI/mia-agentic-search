notes: 'Single zip (243 MB) listed with peek_archive: train/ 500 img_NNNN.tif + 500 masks_NNNN.tif, test/
  25 img + 25 masks, and train.json (1.5 MB, not opened; the arXiv paper says the training point labels
  came from blob detection on the nuclei counter-stain). Per the paper and Mendeley text the training
  masks are weak image-level segmentations made with graph-cut software, while the 25 test masks are manual
  single-cell segmentations from a different experiment, so full instance labels exist only for the test
  split. enricher: train masks are RGB {0,255} foreground, test masks int16 instance ids (0-305), train.json
  lists nucleus point locations per image. Microscope, objective, bit depth and pixel size not stated
  on the page or in the arXiv paper; the paper gives 512 x 512 pixel images. Sources checked: Mendeley
  page, API, zip listing, arXiv 2304.10671 (journal version is TMI 2023).'
