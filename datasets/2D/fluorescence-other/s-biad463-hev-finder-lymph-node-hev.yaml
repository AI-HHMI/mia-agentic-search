notes: 'No licence or terms are given in the BioStudies record or the paper (Data availability only says
  raw images are in this entry), so license is unknown and needs checking. 1,346 files, 23.8 GB: Training_coco
  (COCO_annotations.json, 71 MB, plus 1,336 PNG tiles in DCIS / IDC with metastasis / IDC without metastasis
  folders by patient; 608 of them are *_rgb_labels.png label images) and Validation_raw (nine whole-slide
  OME-TIFFs, 0.6-3.4 GB, patients not used for training). The paper trained Mask R-CNN on 12,524 manually
  classified HEVs from 51 patients as non-dilated, intermediately dilated (lumen < 10 um) or highly dilated
  (lumen > 10 um); the COCO file content itself was not opened. Imaging: Vectra Polaris whole-slide scanner,
  20x objective; paper says 5 um/pixel (typo?), validation OME-TIFF header 496.1 nm: conflict, voxel_size_nm
  null. Whether the validation scans carry annotations is not stated.'
