title: HEV-finder human lymph node high endothelial venule images with COCO annotations
short_name: Lymph node HEV dilation annotations (IF)
description: Multiplex immunofluorescence tiles of breast-cancer-draining human lymph nodes (PNAd, Claudin-5,
  CCL21, cytokeratin, DAPI) with COCO-format annotations and RGB label images of high endothelial venules
  classified as non-dilated, intermediately dilated or highly dilated, plus nine whole-slide OME-TIFF
  validation scans. Used to train the Mask R-CNN based HEV-finder.
