notes: 'Listings: labels zip holds 768 PNGs (one per field of view); each of the 34 image zips (z_00 to z_33) holds
  1,536 TIFFs, giving the 52,224 images in the overview table. The page text says 32 z-planes with z=16 at best
  focus, but 34 zips are offered; unresolved. Labels and counts were produced by an automated CellProfiler pipeline
  (Otsu), with an expert only classifying which planes (z=11-23) are in focus, so annotation source is automatic.
  Images are 696x520 px 16-bit LZW TIFF. Camera pixel 6.45 um, 20x, 2x binning; object-space pixel size not stated,
  so voxel_size_nm is null. Related paper: Bray et al., J Biomol Screen 2011 (named on the page, not read, so publications
  is empty). The 2D label is per field at the optimal plane.

  enricher: size_bytes = sum of HTTP Content-Length of all 38 files linked on the page (was null); not a confirmed
  listing.'
