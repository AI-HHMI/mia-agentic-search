notes: 'The zip (71.3 MB, 1039 files) holds 1037 JPGs in TRAIN_DATA/images_jpg (837) and TEST_DATA/images_jpg (200) plus two CSVs; the annotation
  CSV lists .tif file names, so the JPGs are converted copies. The paper reports 8271 comets (5787 non-ghost, 2484 ghost), a Normal set (589 images) and a Hard set (448), and says
  100 images were held out for testing, while the zip has a 200-image TEST_DATA folder. Zenodo shows the license as other-nc, but the bundled LICENSE file is the CC BY-NC-SA 4.0 text, which is
  used here. Pixel size is not stated. Checked: Zenodo record and API, zip listing and annotation CSV header, paper Methods and Data availability.'
