  notes: 'The Mendeley public API lists one file, nuclear_segmentation_annotations 16bit.zip, 6,273,224
    B (= size_bytes). The download link redirects to an S3 object that does not answer range requests,
    so the whole 6.3 MB zip was downloaded once, read in memory and deleted: 82 TIFFs (38+3 DAPI patches,
    38+3 labels). Read 3 raw and 3 label files: raw float64 (max 72-104 in these files), labels int16
    with 242-251 distinct values incl. 0. value_range is over these files only. No pixel size in the TIFF
