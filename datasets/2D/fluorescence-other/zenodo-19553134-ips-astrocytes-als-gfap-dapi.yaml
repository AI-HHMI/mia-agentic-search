description: Fluorescence images of iPSC-derived astrocytes from healthy controls and VCP-mutant ALS lines,
  immunolabeled for DAPI and GFAP, from four experimental batches in 96-well plates (untreated, A1 high and
  A1 low conditions). Provided as raw multi-plane images and as 19,326 processed RGB crops (maximum projection,
  1/16 of each field of view), with a per-crop table giving experiment, plate, well, cell line, ALS/control
  label, mutation and condition.
