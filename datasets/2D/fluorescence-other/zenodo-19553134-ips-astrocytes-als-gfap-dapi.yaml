notes: 'processed_crops.zip (peek_archive): 19,326 TIFF crops, matching 19,326 rows of annotations_processed_crops.csv
  (als: 10,074, control: 9,252; conditions untreated / A1 high / A1 low; cell lines CTRL1-4, MUT1-4, all VCP
  mutants). The raw archive (fluoACs_raw.zip, 26.4 GB) has 10-12 fields of view per well, 4-5 planes, 2 channels;
  not listed. Pixel size 0.316 um/px and 1080x1080 FOV from the dataset description. The description mentions an
  accompanying bioRxiv manuscript and a GitHub repository but gives no title or DOI, and a web search did not
  find it, so no paper was read and publications is empty. Microscope, objective and acquisition mode are not
  stated, hence modality fluorescence-other. The labels are sample-level (genotype, treatment) rather than
  hand annotations, so the training signal is classification of ALS vs control. size_bytes is the Zenodo
  total. Sources checked: Zenodo record and file API, archive listing, annotation CSV.'
