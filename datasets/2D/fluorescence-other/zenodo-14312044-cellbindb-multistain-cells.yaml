notes: 'Zip listing: 3132 .tif files (~464 MB uncompressed; 286 MB zip + 73.9 kB xlsx metadata sheet per
  image) = 1,044 images x (img, mask, instancemask). Pixel/voxel size not stated on the Zenodo page, in
  the paper Methods (objectives 10x/0.75 NA and 20x/0.5 NA given, no pixel size) or file names; per-image
  acquisition parameters are in CellBinDB_Image_Archive.xlsx / Supplementary Table S2, not checked. Contains
  images of 5 human tissues from 10x Genomics (human DAPI/H&E tiles under folders like 10xGenomics_DAPI).
  Paper also deposits the data at CNGBdb CNP0006370. Zenodo page states CC0 1.0; paper article is CC-BY.
  Newer Zenodo version exists. Stain types mix fluorescence and brightfield H&E.'
