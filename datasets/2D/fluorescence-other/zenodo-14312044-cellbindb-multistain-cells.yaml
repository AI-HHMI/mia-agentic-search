id: zenodo-14312044-cellbindb-multistain-cells
title: 'CellBinDB: A Large-Scale Multimodal Annotated Dataset for Cell Segmentation'
short_name: Multi-stain cell/nucleus segmentation (CellBinDB)
description: 1,044 image tiles (256x256 or 512x512 px) of DAPI, ssDNA, H&E and multiplex-immunofluorescence
  stained tissue sections from over 30 mouse, rat and human tissues, each with a semantic mask and an
  instance mask (109,083 annotated cells/nuclei in total). Annotation combined model pre-segmentation
  with manual correction in QuPath (about 60% fully manual) and two rounds of expert review. Intended
  for training and benchmarking universal cell segmentation models.
