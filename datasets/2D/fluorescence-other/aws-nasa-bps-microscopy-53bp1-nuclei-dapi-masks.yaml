short_name: Irradiated fibroblast 53BP1 and DAPI nuclei masks
description: 'Single-nucleus crops (maximum intensity projections of 9-plane z-stacks) of mouse primary skin fibroblasts irradiated
  with Fe particles or X-rays and stained for 53BP1 (FITC) and DAPI: about 77,000 53BP1 projections plus about 85,750 DAPI
  images paired with nucleus masks, with dose, particle type and time-after-exposure metadata. Hosted as an AWS Open Data
  bucket by NASA OSDR.'
