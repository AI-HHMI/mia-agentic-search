notes: 'S3 listing of s3://nasa-bps-training-data/Microscopy/ (anonymous): train/ 77,177 *_proj.tif (53BP1 FITC max projections,
  uint16, 1.87 GB) + meta.csv; DAPI_MASK_images/ 85,752 DAPI/MASK pairs (6.51 GB) + meta_DAPI_MASK.csv. Single-nucleus crops
  of varying size (e.g. 99x137). Two MASK files read: values {0,1} and {0,3}, one nucleus each. 17 plates, 9-plane z-stacks
  max-projected with diplib (NASA doc); organism/staining/microscope from OSDR OSD-366. Licence per registry: no restrictions
  on use (custom). Not found in pages read: pixel size, how masks were made (source unknown), whether train/ crops match DAPI_MASK_images
  crops, foci labels, dataset DOI. Paper full text not open access (abstract only). enricher: MASK value = the crop index
  in the file name (3/3 sampled), so instance-ids; size confirmed by full S3 listing.'
