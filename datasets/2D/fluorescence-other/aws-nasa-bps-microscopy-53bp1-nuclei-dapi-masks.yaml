  notes: 'Listing: full anonymous S3 listing of s3://nasa-bps-training-data/Microscopy/ (248,683 files, 8,378,843,576 B, exact).
    Probed 3 headers (DAPI, MASK, proj: single-page plain TIFF, uint16, 1 sample/pixel, no calibration). Sampled 3 DAPI/MASK
    pairs (P242 A6 001_001, P280 A7 001_002 and 001_007) and one proj, 196 KB in all; value ranges are from these samples
    only (proj max 1345 suggests a 12-bit detector; DAPI up to 5400). Crop shape varies per nucleus (99x137, 160x155, 149x143).
    The train/ proj and DAPI crops with the same stem have the same shape (1/1 checked); the docs do not say whether they
    are co-registered. Direct files: nasa-bps-training-data.s3.amazonaws.com (on the TensorSwitch allowlist; the us-west-2
    virtual host is not). No single archive: data.download_url stays the S3 prefix. Voxel size not found; checked: TIFF headers
    (none), NASA BPS doc, OSDR OSD-366 API, upstream OSDR raw zip ICS header (scale 1 px, uncalibrated), Penninckx 2019 and
    2021 (abstract only, not open access), GWAS preprint 10.1101/2022.03.03.482929 (40X 0.95 NA Nikon, no pixel size). annotations.source:
    not stated for the masks (the preprint says images were analysed with an automated MATLAB foci algorithm, which does not
    say how these masks were made).'
