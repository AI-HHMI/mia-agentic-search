short_name: Micronucleus cell classes (imaging flow cytometry)
description: 'Human-scored single-cell images from the cytokinesis-block micronucleus assay in TK6 cells, acquired on Amnis ImageStreamX
  imaging flow cytometers (64x64 16-bit TIFFs with three channels: brightfield, nuclear fluorescence and darkfield, each rescaled to
  0-255). About 4,960 test images are sorted into nine class folders (mononucleates, binucleates, trinucleates, quadranucleates, each
  with or without micronuclei, and other/unscorable), shipped with the pretrained DeepFlow classifier and MATLAB/Python training code.'
