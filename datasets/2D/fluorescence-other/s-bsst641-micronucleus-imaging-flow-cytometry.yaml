notes: 'Single 2.8 GB zip (peek_archive: 5,167 files). The nine class folders under TEST_Pretrained_DeepFlow_neural_network/Test_images
  hold 4,959 two-channel TIFFs (2592/142/1299/59/730/105/6/119/7 per class); n_items counts these images. The zip also holds
  an example raw .rif (1.36 GB) and .cif files, MATLAB/Python pipeline code and a pretrained model; the training-set folders
  under Pipeline_*/4_Human_annotated_data contain only empty class folders (.DS_Store), so the training images are not in
  the deposit. The paper says five thousand human-scored images were used for cross-validation. Imaging used a 40x objective
  on ImageStreamX; pixel size is not stated on the BioStudies page or in the paper text, so voxel_size_nm is null. The BioStudies
  record states no data license (only the article is CC BY 4.0), hence license unknown. Images are cropped single cells
  from imaging flow cytometry rather than tissue microscopy.'
