notes: 'Single 2.8 GB zip (5,167 members). The nine class folders under TEST_Pretrained_DeepFlow_neural_network/Test_images hold 4,959
  TIFFs (2592/142/1299/59/730/105/6/119/7 per class); n_items counts these. The zip also holds an example .rif/.cif, MATLAB/Python code
  and a pretrained model; the training-set class folders are empty, so training images are not deposited. Pixel size is not stated on
  the BioStudies page or in the paper, so voxel_size_nm is null. enricher: license custom from LICENSE.rtf in the zip (MIT-style permission
  text written for "the Software", plus "The source publication is acknowledged by citation"); was unknown. enricher: channels 3 (was
  2): brightfield, nuclear fluorescence, darkfield per the extraction script; the test reader uses the first two.'
