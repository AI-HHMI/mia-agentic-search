notes: 'Derived data: the images are 2D class averages (single-particle cryo-EM), not raw micrographs, and the source proteins are not
  listed, so organism is left empty. The EMPIAR entry gives size 20.7 GB (rounded) and 18,051 images in .mrcs stacks, one stack per job
  folder; the folder listing shows 233 job directories, matching the 233 jobs in the paper. Pixel and box sizes vary per job and are not set. The paper (open
  access) states the network was trained on these 18,051 classes and that a validation split of 5,850 classes from 73 jobs was used only during development, so no split is
  provided. Class category codes (1 best ... 6 or 0 worst) follow the entry description. Checked: EMPIAR entry page and API, data folder listing, paper Methods and Data availability.'
