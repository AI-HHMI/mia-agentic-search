title: Experimentally-grounded benchmark datasets for cryoEM heterogeneous reconstruction methods with engineered Cas9 complexes
short_name: Cas9 cryo-EM heterogeneity benchmark
description: Single-particle cryo-EM benchmark for heterogeneous reconstruction. Catalytically inactive S. pyogenes Cas9 bound
  to a constant sgRNA and target DNA duplexes with engineered extensions of defined length (2 to 14 bp) was assembled, vitrified
  and imaged as separate samples, so the dataset of origin gives an unambiguous ground-truth state label for every particle.
  EMPIAR holds the unaligned EER movies per extension length, gain references, and polished particle stacks with RELION
  .star files (full and curated benchmark subsets).
