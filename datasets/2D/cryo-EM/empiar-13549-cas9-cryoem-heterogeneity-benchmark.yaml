notes: 'EMPIAR reports 33.2 TB. Top level of the FTP tree: movies/ (one folder per DNA extension 2bp to 14bp, EER movies of about
  435 MB each), gains/ and particle_stacks/ (Polish/job148 and job188 particle images, plus .star files; the README describes
  full and curated subsets). The EMPIAR entry lists 10 micrograph image sets (2 to 11 bp), 55,123 unaligned multiframe micrographs in
  total at 0.641 A/pixel (0.0641 nm), while the FTP tree has 13 extension folders, so n_items counts only the 10 listed sets.
  The paper is a bioRxiv preprint without open full text, so only its abstract was read (13 complexes, labels from dataset
  of origin). The ground truth is a sample-level state label, not hand annotation; the star files contain extra
  deep-classification labels. Organism left empty because the Cas9 is recombinant protein (S. pyogenes source). Extremely
  large; not suitable for a casual download.'
