notes: 'EMPIAR states 33.2 TB. FTP tree: movies/<N>bp/frames/ (13 folders, 2 to 14 bp, 71,053 EER movies in total per the EMPIAR API),
  gains/ and particle_stacks/ (Polish/job148: 2/8/14 bp; Polish/job188: 2-14 bp; plus .star files for full and curated subsets, see
  README). Ground truth is the sample-level state label (DNA extension length, from the dataset of origin, i.e. the <N>bp folder in
  rlnMicrographName), not hand annotation; the full job149/job189 .star files add a _ConformationalLabel column from deep classification.
  Preprint not open access; abstract only. enricher: organism Streptococcus pyogenes = source of the recombinant dCas9 (abstract; sgRNA/DNA
  synthetic) (was empty). enricher: voxel size set to null (was 0.0641 nm): subsets differ, movies 0.641 A/px (EMPIAR API), particle
  stacks 1.12175 A/px (MRC header and STAR optics table). enricher: formats [mrc] (was other); movies are EER (TIFF-based, not listed).
  n_items 71053 movies (was 55123, 10 of 13 sets).'
