  notes: 'Listing: EMPIAR HTTP index (FTP timed out), 29 files, 16.5 GB with rounded sizes, so size_bytes
    stays the EMPIAR-stated dataset size (page-stated). Probed K2_02_stack.mrc header: 22x3750x3645 float32,
    uncompressed, header min/max/mean [-6.86, 125.81, 6.9]; header cell gives 1 A/px (unset default),
    the record keeps EMPIAR''s 1.126 A/px. Read K2_02.box (10 rows: x, y, w, h, helix start/end flag).
    EMPIAR API: 14 images, 3645x3750, 22 frames per image, 1.126 A/px. No pixel data sampled (each stack
