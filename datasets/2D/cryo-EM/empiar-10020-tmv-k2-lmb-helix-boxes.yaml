short_name: TMV cryo-EM micrographs, K2 Summit, helix boxes
description: 14 cryo-EM movie stacks (MRC) of tobacco mosaic virus recorded with a Gatan K2 Summit on
  a Titan Krios at MRC-LMB Cambridge, each with a manually picked EMAN helix .box coordinate file. One
  of three EMPIAR entries from the direct-electron-detector comparison of Fromm et al. 2015.
