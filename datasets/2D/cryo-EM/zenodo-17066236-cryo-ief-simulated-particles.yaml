notes: 'Zenodo record has no description. Content from peek_archive of 12_simulated_datasets.zip (369 files,
  46.2 GB uncompressed: 288 .mrc batches of ~160 MB, 24 .cs, 13 .json, 11 .csg, 11 .bson, 11 .log) and
  the bioRxiv preprint Methods (simulation settings, ground-truth poses from CryoSPARC metadata). Pixel
  size and box size are not stated on the Zenodo page or in the preprint text read; voxel_size_nm is null.
  The paper reports 2,000,000 images per map; the archive holds fewer (downsampled batches), so n_items
  counts .mrc batch files, not particles. The paper calls the 12 simulated sets test data; labels are
  held in CryoSPARC metadata rather than separate label images. Paper PDF is CC-BY-NC; the Zenodo record
  is CC-BY-4.0.'
