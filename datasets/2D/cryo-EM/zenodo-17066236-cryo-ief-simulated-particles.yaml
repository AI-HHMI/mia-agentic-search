notes: 'Zenodo record has no description. Content from peek_archive of 12_simulated_datasets.zip and the bioRxiv preprint Methods (simulation
  settings, ground-truth poses from CryoSPARC metadata). The paper reports 2,000,000 images per map; the archive holds 24,000 per map
  (24 MRC stacks x 1000 particles), so n_items counts .mrc stack files, not particles. Labels are CryoSPARC .cs tables (alignments3D/pose,
  shift, class), not label images. Paper PDF is CC-BY-NC; the Zenodo record is CC-BY-4.0. enricher: size 42,933,350,622 B from the Zenodo
  file listing (was 46.2 GB uncompressed). enricher: voxel_size_nm stays null: pixel size differs per map (1.067-2.08 A, CryoSPARC job.json
  blob/psize_A and MRC headers; list in technical.notes). organism left empty: particles are simulated from 12 EMDB maps of different
  complexes.'
