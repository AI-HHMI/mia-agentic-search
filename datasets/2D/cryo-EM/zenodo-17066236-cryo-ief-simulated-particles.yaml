title: Simulated cryo-EM particle datasets from "A comprehensive foundation model for cryo-EM image processing"
short_name: Simulated cryo-EM particles, 12 maps (pose labels)
description: Twelve simulated single-particle cryo-EM datasets generated with CryoSPARC's Simulate Data from 12 EMDB density maps (69
  kDa to 1 MDa; 2,000,000 particle images per map in the paper, signal-to-noise 0.005), used as test sets for the Cryo-IEF foundation
  model. The paper states they carry ground-truth structure identity and pose angles from the CryoSPARC metadata. The Zenodo archive
  holds MRC particle image batches plus CryoSPARC .cs/.csg metadata per job.
