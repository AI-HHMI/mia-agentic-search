notes: 'From the EMPIAR API record: two imagesets, gain-corrected MRC (647 movies, 37 frames, 32-bit float,
  the full set collected) and non-gain-corrected TIFF (424 movies, one TIFF per frame, a subset used in
  the final reconstruction, with dark and gain reference frames and the box_files folder), 1.7 TB in total,
  related to EMPIAR-10011. Paper: DE-12 camera on a JEOL JEM-3200FSC at 300 kV; about 30,000 particles
  were selected on the sum of all frames. enricher: box_files/ holds 425 .box files (read one: 73 boxes
  of 420 px), annotations_verified true; whether particles were picked manually or automatically is not
  stated in the sources read, so annotation source is unknown. download_url is the data/ folder (was null).
  size_bytes is the entry size as stated (1.7 TB). enricher: organism Brome mosaic virus from the entry
  title (was empty).'
