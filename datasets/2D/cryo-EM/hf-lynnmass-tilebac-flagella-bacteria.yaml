short_name: TileBac bacteria and flagella (low-dose cryo-EM)
description: Low-dose cryo-EM images of Pantoea sp. YR343 with 278 annotated images (COCO segmentation
  and YOLO exports at 4096 px, plus 1024 px tiled variants) labelling the classes bacteria and flagella,
  split into train, valid and test sets. The raw average, sum and fraction MRC files (305 each) are also
  provided. Released as an additional challenge for segmenting thin, high-boundary structures in noisy
  cryo-EM.
