notes: The bioRxiv full text could not be fetched (HTTP 429, not open in Europe PMC), so only the abstract and the dataset READMEs were
  read; pixel size, microscope settings and annotation protocol are not stated there (pixel size null). The card license is MIT but
  the Roboflow exports are marked Public Domain, so licenses differ between files. n_items counts the 278 annotated images of the
  4096 px export (219/28/31); the repository also holds 1,491 annotated JPEGs across the 1024 px variants and 305 raw MRC sets each
  of average, sum and fraction images (mrc and jpeg listed in formats). size_bytes is the Hugging Face storage figure for the whole
  repository. This is a different image set from the membrane benchmark published by the same group (tilebac-ULDM-benchmark-dataset);
  the data is also on ORNL Constellation (DOI 10.13139/ORNLNCCS/3025229).
