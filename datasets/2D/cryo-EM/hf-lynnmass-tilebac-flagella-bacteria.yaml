notes: 'The bioRxiv full text could not be fetched (HTTP 429, not open in Europe PMC), so only the abstract
  and the dataset READMEs were read; pixel size, microscope settings and annotation protocol are not stated
  there (pixel size null). The card license is MIT but the Roboflow exports are marked Public Domain,
  so licenses differ between files. n_items counts the 278 annotated images of the 4096 px export (219/28/31);
  the repository also holds 1,491 annotated JPEGs across the 1024 px variants and 305 raw MRC sets each
  of average, sum and fraction images (mrc and jpeg listed in formats). This is a different image set
  from the membrane benchmark published by the same group (tilebac-ULDM-benchmark-dataset); the data is
  also on ORNL Constellation (DOI 10.13139/ORNLNCCS/3025229). enricher: size_bytes from the full HF file
  listing (was HF storage figure); channels 1 (RGB JPEGs hold identical samples).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  5,411 files, 454.3 GB\n  README.md\n  Annotated/COCO/{4096,1024-2x-train,1024-3x-train}/\n\
      \    README.dataset.txt, README.roboflow.txt\n    train/ valid/ test/   <n>_Camera-Falcon-<id>_<medium>_dyn_png.rf.<hash>.jpg\
      \ + _annotations.coco.json\n    4096: 219/28/31 images (1.7 GB); 1024-2x: 438/28/31; 1024-3x: 657/28/31\n\
      \  Annotated/YOLO/{4096,1024-2x-train,1024-3x-train}/\n    data.yaml, README.*.txt; {train,valid,test}/{images/*.jpg,\
      \ labels/*.txt}\n  Raw/raw_mrc_avg/{MOPSglu,MOPSsuc,R2A}/        305 .mrc   20.5 GB  (44/226/35)\n\
      \  Raw/raw_mrc_sum/{MOPSglu,MOPSsuc,R2A}/        305 .mrc   20.5 GB\n  Raw/raw_mrc_fractions/{MOPSglu,MOPSsuc,R2A}/\
      \  305 .mrc  409.4 GB\n    'Camera Falcon <id>-<hash>{_avg,_summed,}.mrc'"
    n_files: 5411
    listing_complete: true
  sample:
    urls:
    - https://huggingface.co/datasets/LynnMass/tilebac-flag-dataset/resolve/main/Annotated/COCO/4096/valid/193_Camera-Falcon-1842-Falcon_MOPSsuc_dyn_png.rf.f71acc2eed106727826a54a4f767e4a1.jpg
    - https://huggingface.co/datasets/LynnMass/tilebac-flag-dataset/resolve/main/Annotated/COCO/4096/valid/_annotations.coco.json
    size_bytes: 6322605
    description: one 4096 px validation image and the COCO annotation file of the 4096 validation split
      (28 images, 94 polygons)
  arrays:
  - role: raw
    path_pattern: Annotated/COCO/*/*/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 4096
    - 4096
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Roboflow exports: 4096 folder without resize or augmentation; 1024-2x/3x folders
      resized (stretch) to 1024x1024 with 2 or 3 augmented train versions per image (flips, crop, rotation,
      shear, brightness). RGB with 3 identical samples (grey stored as RGB, s axis). YOLO folders hold
      the same images.'
  - role: label
    path_pattern: Annotated/COCO/*/*/_annotations.coco.json
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: polygons
    classes:
    - id: 1
      name: bacteria
    - id: 2
      name: flagella
    alignment: same-grid
    alignment_notes: COCO segmentation polygons in pixel coordinates of the exported jpg, one file per
      split, matched by file_name; category 0 bacteria-flagella-I6pg is the unused supercategory.
  - role: label
    path_pattern: Annotated/YOLO/*/*/labels/*.txt
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: polygons
    classes:
    - id: 0
      name: bacteria
    - id: 1
      name: flagella
    alignment: same-grid
    alignment_notes: YOLO segmentation txt, same stem as images/*.jpg (not sampled). Ids from data.yaml;
      the README says class 0 flagella, class 1 bacteria, which conflicts. 1024-3x test has 28 label files
      for 31 images.
  - role: other
    path_pattern: Raw/raw_mrc_fractions/*/*.mrc
    format: mrc
    axes: zyx
    shape:
    - 40
    - 4096
    - 4096
    shape_varies: null
    dtype: int16
    compression: none
    value_range: null
    normalization: none
    alignment: not-applicable
    alignment_notes: Raw Falcon 3EC movie frames (40 fractions per exposure; z is the frame axis, MRC
      space group 0 image stack). Header pixel size 8.986 A.
  - role: other
    path_pattern: Raw/raw_mrc_avg/*/*.mrc
    format: mrc
    axes: yx
    shape:
    - 4096
    - 4096
    shape_varies: null
    dtype: float32
    compression: none
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Frame average per exposure; raw_mrc_sum holds the frame sums (same shape, float32).
      No calibration in these headers.
  notes: 'Listing: tools/listing.py on the HF repo, complete with exact sizes (454,347,123,954 bytes;
    409 GB are raw movie fractions). Probed one avg, one sum and one fractions MRC (R2A, Camera Falcon
    0030) and one 4096 jpg. Sampled one 4096 validation jpg (6,216,385 bytes; 0-255, mean 137.3, p1 20,
    p99 242; 3 identical samples; value range from one sample) and the 4096 valid COCO json (106,220 bytes;
    28 images of 4096x4096, 94 polygons: 24 bacteria, 70 flagella; license entry Public Domain / CC0).
    normalization none for the fractions: raw int16 detector counts (inferred). voxel size not set: the
    4096 export has the 4096x4096 shape of the raw frames (no resize per Roboflow README), the 1024 exports
    are resized, so the record does not share one pixel size. The fractions MRC header states 8.986 A/px
    = 0.8986 nm; avg/sum headers carry none. Checked also: README (40 e/A2, -5 um defocus, Falcon 3EC,
    Krios G4; no pixel size), Roboflow READMEs, data.yaml, bioRxiv (429). No single archive: data.download_url
    stays the HF repo; direct files at huggingface.co/datasets/LynnMass/tilebac-flag-dataset/resolve/main/<path>.'
