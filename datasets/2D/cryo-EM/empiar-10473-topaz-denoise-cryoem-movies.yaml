notes: 'Usable without labels as denoising training data (Noise2Noise from movie frame halves, per the
  Topaz-Denoise paper); the paper says the 110 NYSBC datasets were deposited here and that some were
  used for the general models. Pixel size, dose and sample are per dataset in an Excel file inside the
  entry (not opened), so voxel size and organism are left null. The EMPIAR API states 1,000,000 images
  of 50 frames, which looks like a placeholder, so n_items is null. Size 33.9 TB as stated by EMPIAR,
  far above what is practical to download; the enricher should only sample it. File listing not opened.'
