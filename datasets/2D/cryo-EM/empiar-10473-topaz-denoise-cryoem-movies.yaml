  notes: 'No complete listing: 110 session folders, some with thousands of movies (19may10e/rawdata has
    ~6,250 entries); listed 5 sessions by HTTP index. Size 33.9 TB is EMPIAR-stated. Probed one TIFF (LZW,
    3710x3838 pages, plain layout) and the MRC header of one .mrc.bz2 by decompressing its first 2 MB
    (own script, requests + bz2). Sampled the TIFF whole (196.9 MB): 40 frames, values [0, 49], mean 0.95,
    19 unique values, 38% zeros: electron counts per frame (normalization none, inferred). EMPIAR states
    MRCS for some sessions too; none were seen in the sessions listed. Download: files are direct on ftp.ebi.ac.uk
    (TIFF checked usable, range requests yes); no single archive, so download_url is the data folder.
    The .mrc.bz2 files are whole-file bzip2, which TensorSwitch would have to decompress first. Voxel
    size: per session in the xlsx (0.33-1.54 A), no single value; TIFF/MRC headers carry no or default
    calibration.'
