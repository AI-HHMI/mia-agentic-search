notes: 'Usable without labels as denoising training data (Noise2Noise from movie frame halves, per the
  Topaz-Denoise paper); the paper says the 110 NYSBC datasets were deposited here. The EMPIAR API states
  1,000,000 images of 50 frames, which looks like a placeholder, so n_items is null. Size 33.9 TB as stated
  by EMPIAR. enricher: voxel size stays null: the entry''s xlsx gives a pixel size per session from 0.33
  to 1.54 A (e.g. 18dec19f 0.85 A, 17jun22b 1.10 A). Organism left empty: samples are mostly purified
  proteins (T20S proteasome, aldolase, GDH, apoferritin, BSA, VLPs, microtubules) plus test images of
  carbon, gold, ice and blank frames, per the xlsx. download_url now the FTP data folder (was the landing
  page).'
