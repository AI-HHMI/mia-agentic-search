title: Micrograph frames from 110 internal SEMC/NYSBC test datasets used for Topaz-Denoise model generation
  & analysis
short_name: Topaz-Denoise cryo-EM movie frames (110 sets)
description: Unaligned multi-frame cryo-EM micrograph movies (about 50 frames each, 16-bit) from 110 Simons
  Electron Microscopy Center / NYSBC datasets used to train and analyse the Topaz-Denoise Noise2Noise
  denoising models; even/odd frame halves give the paired noisy observations. Frames are MRCS, TIFF or
  bzip2-compressed; an Excel sheet in the entry lists sample, pixel size, microscope and total dose per
  dataset.
