description: Training data for prismPYP, a self-supervised method for scoring cryo-EM micrograph quality,
  built from rabbit muscle aldolase micrographs of EMPIAR-10379. It holds .webp images of micrographs
  and their power spectra with metadata, lists of micrographs with high-quality real-domain and Fourier-domain
  features, and trained model weights.
