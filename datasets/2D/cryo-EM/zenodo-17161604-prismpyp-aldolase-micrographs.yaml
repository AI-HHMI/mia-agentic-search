notes: 'Zenodo record has four files: example_data.tar.gz (1.2 GB: .webp micrographs and power spectra,
  .pkl metadata from nextPYP, a cryoSPARC .cs file, a micrograph list and the microscope .pyp_config.toml),
  model_weights.tar.gz (234 MB), and two parquet files marking good-quality micrographs in the real and
  Fourier domains. enricher: size_bytes 1,446,202,209 from the listing (was 1,443,206,339). The description
  states this is training data for self-supervised evaluation (the paper abstract says the method is label-free);
  the parquet files are model-selected, not manual labels, so annotations.present is false. The paper
  is not open access, so pixel size is not given and the full-resolution source images are EMPIAR-10379
  (not read here). Formats is other because the images are .webp, which is not a listed format. Medium
  confidence: derived/rendered images, not the raw micrographs.'
