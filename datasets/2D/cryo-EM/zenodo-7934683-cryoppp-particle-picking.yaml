  were not listed with peek_archive (Zenodo record pages did not expose file URLs), so annotations_verified
  is false and file formats come from the paper and GitHub README. Train/test split not provided.

  enricher: size_bytes 2.6e12 from the calla README ("2.6 terabytes", was null); tiff added to formats
  (sample_data micrographs are LZW BigTIFF movies); annotations_verified true (coordinate CSVs listed
  and read).'
