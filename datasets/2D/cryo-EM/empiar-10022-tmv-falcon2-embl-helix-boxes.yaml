notes: 'File listing: 109 *_stack.mrc movie stacks and 109 matching .box files. Pixel size 1.062 A/px
  per EMPIAR (paper: 1.06 A). The paper (Table: summary of processed data sets) says 109 micrographs were
  included for this data set. Box files are manual helix picks (interactive picking in the paper), not
  segmentation labels, so annotation type is other. License CC0 from the EMPIAR policies page (all EMPIAR
  data is CC0). Sibling EMPIAR-10020/10021/10022 differ by camera and site.'
