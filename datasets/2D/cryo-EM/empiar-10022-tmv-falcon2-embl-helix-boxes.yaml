description: 109 cryo-EM movie stacks (MRC) of tobacco mosaic virus recorded with a FEI Falcon II on a
  Titan Krios at EMBL Heidelberg, each with a manually picked EMAN helix .box coordinate file. One of
  three EMPIAR entries from the direct-electron-detector comparison of Fromm et al. 2015.
