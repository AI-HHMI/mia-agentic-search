notes: 'Listed the Zenodo record (CC BY 4.0) and the first ~6 MB of the tarball: trainingdataMySegmentation/<EMPIAR id>/mics/*.npy
  with matching masks_proc/*.npy (first folder 10077 = EMPIAR-10077). Only the start of the archive was listed, so
  total counts and any test folders are unverified; the bioRxiv v2 text states 539 manually segmented training micrographs
  from 16 EMPIAR entries. Pixel size and image size not stated in the text read (supplement not accessible). Arrays
  look preprocessed rather than original MRC, hence formats other. Organism varies per EMPIAR entry. Masks are binary:
  usable vs carbon/contamination.'
