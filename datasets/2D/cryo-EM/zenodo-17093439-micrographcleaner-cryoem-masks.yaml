short_name: Cryo-EM micrograph contamination masks
description: 'Training data of MicrographCleaner: cryo-EM micrographs from EMPIAR entries (one folder per EMPIAR ID, with
  mics/ and masks_proc/ NumPy arrays) with manually segmented binary masks marking regions that are unsuitable for particle
  picking (carbon, high-contrast contamination) versus usable regions. The accompanying paper describes 539 manually
  segmented training micrographs drawn from 16 EMPIAR entries.'
