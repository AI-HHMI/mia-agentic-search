  notes: 'Format is NumPy .npy (not in the schema enum, hence other); 2D C-order arrays, axis names not stated in the files,
    so axes null. Inspected by streaming the first 40,042,496 B of the tar.gz with a short requests+tarfile script (np.load
    allow_pickle=False): 46 members seen, all masks_proc/ of folder 10077 first, then mics/. value_range from two sampled
    pairs only (mics -1.82..2.15, mean ~0.009, std ~0.32-0.34). normalization standardized = paper: "normalized in both intensity
    and size using a robust scaling strategy and a constant particle size downsampling" (std not 1). Full member count, image
    sizes of other folders and any test split are unverified (the tarball is not seekable; a full listing would mean streaming
