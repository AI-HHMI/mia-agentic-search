notes: 'Listed the Zenodo record (CC BY 4.0): the dataset is one tar.gz (1,816,815,416 B); deepMicrographCleaner.tgz is the
  model checkpoint. Archive layout trainingdataMySegmentation/<EMPIAR id>/{mics,masks_proc}/*.npy; paper: 539 manually segmented
  training micrographs from 16 EMPIAR entries. enricher: sampled the first 40 MB of the tarball: micrographs are float64 595x595
  arrays, intensity- and size-normalized by the authors (robust scaling, constant-particle-size downsampling per paper), so
  pixel size differs per EMPIAR entry and is not stated: voxel size stays null. Masks are float64 {0,1}. Organism varies per
  EMPIAR entry; the entries are not listed in the main text (Supplementary S5 not read), so organism stays empty.'
