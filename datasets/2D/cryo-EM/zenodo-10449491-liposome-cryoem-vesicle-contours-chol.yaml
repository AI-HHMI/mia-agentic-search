notes: 'Companion to the DOPC/POPG liposome record zenodo-10449449 (separate Zenodo deposit, same group, same microscope and
  paper): this one holds a different, phase-separating lipid mixture (DPPC/DOPC/POPG/Chol 40/35/5/20 mol%) with 11 different
  images (PA2_* names vs S3_*). Zenodo listing read in full: 22 files (11 TIFF of 56,986,838 B plus 11 CSV contour files). Contours
  are program output (MEMNET, TARDIS), so source is automatic. The PNAS paper is not open access (abstract only), so its Methods
  were not read; acquisition values come from the Zenodo description. Image pixel dimensions, bit depth and compression were not
  read from the files. size_bytes is the Zenodo listing total for all 22 files (11 TIFFs of 56,986,838 B plus the CSVs).'
