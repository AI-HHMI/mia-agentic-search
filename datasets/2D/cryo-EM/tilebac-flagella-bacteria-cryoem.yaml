short_name: TileBac flagella and bacteria (cryo-EM)
description: Cryo-EM images of Pantoea sp. YR343 acquired at 40 e-/A2 with YOLO and COCO segmentation annotations of flagella
  (class 0) and bacteria (class 1), plus 305 raw MRC micrographs (average, sum and per-frame fractions). Released with the
  TileBac benchmark paper as a challenge for segmenting thin, high-boundary objects in noisy low-dose images.
