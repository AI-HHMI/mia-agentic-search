notes: 'Sibling of tilebac-uldm-bacteria-membranes-cryoem (same paper, different images/classes). 305 raw MRC micrographs
  (44 MOPSglu, 226 MOPSsuc, 35 R2A) each as avg/sum/fractions; size_bytes 454 GB is mostly per-frame fractions (409 GB). Annotated
  exports at 4096 px (219 train/28 valid/31 test) and 1024 px (2x/3x augmented train). README test instances: 67 flagella,
  20 bacteria. MIT per HF card; mirrored on ORNL Constellation (10.13139/ORNLNCCS/3025229). Pixel size and annotation procedure
  not stated on page, README or listing; paper text not retrieved (Europe PMC timed out).'
