notes: 'Sibling of tilebac-uldm-bacteria-membranes-cryoem (same paper). 305 raw MRC micrographs (44 MOPSglu, 226 MOPSsuc,
  35 R2A) as avg/sum/40-frame fractions (409 GB of the 454 GB). Annotated exports at 4096 px (219 train/28 valid/31 test)
  and 1024 px (2x/3x augmented train). MIT per HF card; mirrored on ORNL Constellation (10.13139/ORNLNCCS/3025229). enricher:
  voxel size 0.8986 nm/px for the 4096 images from bioRxiv Appendix B.1.1 (matches MRC header 8.986 A; was null); 1024 px
  exports are 4x downsampled. enricher: annotation source manual (Roboflow, Appendix B.1.1). enricher: class order corrected:
  README/paper say class 0 flagella, but data.yaml and the label polygons give YOLO 0 = bacteria, 1 = flagella. coverage:
  only annotated images (manually screened for flagella) in Annotated/; raw MRCs carry no labels.'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "HF dataset LynnMass/tilebac-flag-dataset (main)   5,411 files  454.3 GB\n  README.md, .gitattributes\n  Annotated/COCO/{1024-2x-train,1024-3x-train,4096}/\n\
      \    README.dataset.txt, README.roboflow.txt\n    {train,valid,test}/  *.jpg + _annotations.coco.json\n      4096: train\
      \ 219, valid 28, test 31 jpg (1.7 GB)\n      1024-2x-train: train 438; 1024-3x-train: train 657; valid 28, test 31\n\
      \  Annotated/YOLO/{1024-2x-train,1024-3x-train,4096}/\n    data.yaml, README.dataset.txt, README.roboflow.txt\n    {train,valid,test}/images/*.jpg\
      \   {train,valid,test}/labels/*.txt (same stem)\n      4096: train 219/219, valid 28/28, test 31/31 (1.7 GB)\n     \
      \ 1024-3x-train/test/labels has 28 txt for 31 jpg\n  Raw/raw_mrc_avg/{MOPSglu 44, MOPSsuc 226, R2A 35}/*_avg.mrc   \
      \     20.5 GB\n  Raw/raw_mrc_sum/{MOPSglu 44, MOPSsuc 226, R2A 35}/*_summed.mrc     20.5 GB\n  Raw/raw_mrc_fractions/{MOPSglu\
      \ 44, MOPSsuc 226, R2A 35}/*.mrc     409.4 GB"
    n_files: 5411
    listing_complete: true
  sample:
    urls:
    - https://huggingface.co/datasets/LynnMass/tilebac-flag-dataset/resolve/main/Annotated/YOLO/4096/test/images/100_Camera-Falcon-2150-Falcon_MOPSsuc_dyn_png.rf.c8030827a0a18b7156926ac330fd0918.jpg
    - https://huggingface.co/datasets/LynnMass/tilebac-flag-dataset/resolve/main/Annotated/YOLO/4096/test/labels/100_Camera-Falcon-2150-Falcon_MOPSsuc_dyn_png.rf.c8030827a0a18b7156926ac330fd0918.txt
    size_bytes: 6196530
    description: One 4096 px test image (JPEG) and its YOLO polygon label file
  arrays:
  - role: raw
    path_pattern: Annotated/YOLO/4096/*/images/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 4096
    - 4096
    - 3
    shape_varies: false
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: contrast-stretched
    alignment: not-applicable
    alignment_notes: 'Grey stored as RGB (samples_identical: true). MRC averages converted to PNG with per-image adaptive
      (dynamic) normalization, then exported as JPEG by Roboflow (paper App. B.1.1). Same images under Annotated/COCO/4096/<split>/.'
  - role: label
    path_pattern: Annotated/YOLO/4096/*/labels/*.txt
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: float64
    compression: none
    encoding: polygons
    classes:
    - id: 0
      name: bacteria (outer membrane outline)
    - id: 1
      name: flagella
    alignment: same-grid
    alignment_notes: '<split>/labels/<stem>.txt pairs with <split>/images/<stem>.jpg; YOLO-seg rows: class x1 y1 x2 y2 ...
      normalised to [0,1] of the 4096 px image. Class order from data.yaml (names [bacteria, flagella]); README and paper
      say the reverse, but class-0 polygons are ~3x larger than class-1 in the test split.'
  - role: label
    path_pattern: Annotated/COCO/4096/*/_annotations.coco.json
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: polygons
    classes:
    - id: 1
      name: bacteria
    - id: 2
      name: flagella
    alignment: same-grid
    alignment_notes: One COCO file per split; images[].file_name refers to the jpg files in the same folder (4096 x 4096).
      Category 0 is the Roboflow superclass.
  - role: raw
    path_pattern: Raw/raw_mrc_avg/*/*_avg.mrc
    format: mrc
    axes: yx
    shape:
    - 4096
    - 4096
    shape_varies: false
    dtype: float32
    compression: none
    normalization: none
    alignment: not-applicable
    alignment_notes: Unlabelled source micrographs (also *_summed.mrc, and 40-frame int16 movies [40,4096,4096] in raw_mrc_fractions/).
      Annotated jpg names carry the camera frame number and medium (e.g. Camera-Falcon-0030 ... R2A), not the MRC hash, so
      pairing needs that number + medium.
  notes: 'Listing: Hugging Face tree API, 5,411 files, 454,347,123,954 B exact. Sample (YOLO 4096 test 100_Camera-Falcon-2150):
    JPEG 4096x4096x3 uint8, 0-255, mean 126, three identical samples; value range from one sample. Label check: all 31 YOLO
    4096 test label files: 111 polygons (39 class 0, mean area 0.086; 72 class 1, mean area 0.025); COCO test json: 58 bacteria,
    80 flagella. Headers: *_avg.mrc float32 [4096,4096], no pixel size in header; fractions *.mrc int16 [40,4096,4096], 8.986
    A/px. Voxel size 0.8986 nm/px from bioRxiv App. B.1.1 ("imaged at 40 e/A2 at 0.8986 nm/pix (for 4096 x 4096 images)").
    No single archive: files are per-file on HF (resolve/main/<path>), so data.download_url stays null. 2D, so not in the
    miao layout yet.'
