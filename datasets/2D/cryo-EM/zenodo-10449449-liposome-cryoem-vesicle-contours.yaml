notes: 'Zenodo listing read in full: 24 files (12 TIFF of 56,986,838 B plus 12 CSV contour files, 684,099,959 B total). Contours
  are program output (MEMNET, TARDIS), so source is automatic; no manual curation is stated. The PNAS paper is not open access
  (Europe PMC returned the abstract only), so the Methods could not be read; acquisition values (Polara G2, 300 kV, K2, Cs 2 mm,
  2.73 A/pixel = 0.273 nm) come from the Zenodo description. Image pixel dimensions, bit depth and compression were not read from
  the files. File name suffix driftcorr_phaseflip_hp suggests drift correction, CTF phase flipping and high-pass filtering, not
  stated in prose. Organism is other (synthetic lipid vesicles).'
