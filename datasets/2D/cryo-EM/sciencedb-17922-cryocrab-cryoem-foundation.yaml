short_name: CryoCRAB cryo-EM foundation pre-training set
description: Motion-corrected cryo-EM micrographs (full, odd-frame and even-frame averages for denoising
  pairs) and preprocessed HDF5 micrographs curated from 746 EMPIAR datasets (152,385 movie sets, about
  200 images per EMPIAR entry), with estimated background images and JSON metadata that link to the original
  EMPIAR movies. Released for pre-training cryo-EM foundation models and for denoising.
