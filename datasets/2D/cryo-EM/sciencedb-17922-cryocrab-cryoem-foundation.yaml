notes: The ScienceDB page is rendered client-side, so license (CC BY 4.0), size (13,396,912,628,447 bytes, 2,986 files) and dates come
  from the DataCite record, and contents from the paper's Data Records section; no file listing was seen. The paper gives 12.18 TB for
  micrographs plus metadata and says raw movies (86.2 TB) are not uploaded but linked through EMPIAR FTP paths in the JSON metadata. Image
  counts are the 152,385 movie sets of the abstract (about 200 per EMPIAR entry). Pixel size varies per EMPIAR source and is not
  aggregated (null). The data are re-processed copies of EMPIAR images; the GitHub code is GPL-3.0 and the article is CC BY-NC-ND,
  but the dataset record states CC BY 4.0. No manual annotations exist; the odd/even splits are the training signal for denoising.
