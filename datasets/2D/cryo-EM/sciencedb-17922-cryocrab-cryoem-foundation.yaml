  notes: 'File tree from the ScienceDB file API (POST gin-sdb-filetree childrenFileListByPath; its paging
    repeated the first 100 entries, so the listing is partial). Read the first 3 KB of empiar_10002.json
    by range request: per-micrograph optics (Falcon I, Polara 300, psize 1.77 A), paths of full/diff MRC,
    h5 and background, and shapes. Members are inside tar.gz, so no headers or samples were read; method
    header means file-level metadata only. voxel size not set: pixel size differs per EMPIAR source (stated
    per micrograph in each empiar_<n>.json, e.g. 1.77 A for 10002), h5 copies are resampled. Downloads:
    each file has a direct link https://china.scidb.cn/download?fileId=<id> (range requests work), but
    china.scidb.cn is not on the TensorSwitch allowlist. No single archive and no small sample unit: the
    smallest raw/target pair sits in a multi-GB tar.gz, so sample is null.'
