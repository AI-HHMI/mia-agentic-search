notes: 'Zip listed with peek_archive: dataset.json, 60 imagesTr and 60 labelsTr PNGs. dataset.json gives 17 labels. Pixel
  size from the Zenodo description. Preprint Methods (read on bioRxiv; paper.py could not fetch it): first 10 pieces manually
  segmented into 17 categories, then human-in-the-loop correction up to 50 images, plus 10 Baker''s yeast images, so source
  is mixed. Modality is TEM montage maps of cryo-FIB lamellae (recorded as cryo-EM); microscope not stated. Nat Methods version
  not open access, not read. Zenodo 10360315 (lamella detection labels, cited in the preprint) not examined. enricher: class
  list corrected from dataset.json (white, black, coating, multivesicles, dynabeads, cryst were missing); channels 1 from
  the PNG headers.'
