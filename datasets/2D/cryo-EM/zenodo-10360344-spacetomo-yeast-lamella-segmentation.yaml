title: SPACEtomo training dataset for Yeast lamella map segmentation using nnU-Netv2
short_name: Yeast cryo-FIB lamella map segmentation (cryo-EM)
description: 60 medium-magnification TEM montage pieces (2.283 nm/pixel) of cryo-FIB-milled yeast lamellae, each with a 17-class
  label image (background, white, black, crack, coating, cell, cell wall, nucleus, vacuole, mitochondria, lipid droplets,
  vesicles, multivesicles, membranes, dynabeads, ice, crystalline ice) in nnU-Net layout (imagesTr/labelsTr). 50 images are
  starved Saccharomyces cerevisiae and 10 are Baker's yeast under exponential growth.
