notes: 'Zip listed with peek_archive: dataset.json, 60 imagesTr and 60 labelsTr PNGs. dataset.json gives 17 labels (background, cell,
  cellwall, nucleus, vacuole, mitos, lipiddroplets, vesicles, membranes, ice, crack, ...). Pixel size from the Zenodo description.
