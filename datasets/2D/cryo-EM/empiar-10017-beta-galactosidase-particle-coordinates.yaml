notes: 'FTP listing: 84 .mrc micrographs (64 MB each, 5.3 GB total) and 84 matching .coord files, no subfolders. EMPIAR API: 4096 x 4096, 32-bit float, pixel 1.77 A (so 0.177 nm), each micrograph is the average of the first 24 movie frames (24 e/A^2, 1.5 s). Paper: Falcon-II detector on an FEI Polara at 300 kV, picks by Richard Henderson on 89 micrographs of which only the 84 with movies are in this entry. Particle count per micrograph was not measured here. Only picked coordinates are provided, no particle masks or class labels. The entry has no description of the sample beyond the title and paper; organism is not applicable (purified protein).'
