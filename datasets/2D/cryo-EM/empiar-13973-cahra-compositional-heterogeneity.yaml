notes: 'EMPIAR API: one imageset of 5,200 unaligned multiframe EER movies (945 frames, 4096x4096, 1.01 A/px), 9.6 TB; "Particle coordinates and reference labels provided in source.star". Preprint: experimental data, 1,613,664 particle images, box 288 px, ground-truth compositional-state labels public in EMPIAR (the Methods say participants received a STAR file without sample identities). Formats: EER is not a listed format, so other. Voxel size 1.01 A from the API and preprint. License CC0 shown on the EMPIAR page badge. File listing was not readable (EMPIAR FTP/HTTP index timed out or returned 403), so source.star and any particle stack were not seen directly: annotations_verified false and download_url null. Companion entries EMPIAR-14006 and EMPIAR-13991 are simulated and not covered here. No train/test split.'
