description: Experimental cryo-EM movies of a six-protein mixture (four targets plus two decoys) imaged separately
  on a Titan Krios G3 / Falcon 4i and combined in silico, released as challenge 1 of the CAHRA community assessment
  of heterogeneous reconstruction algorithms. Picked particle coordinates and ground-truth compositional-state labels
  are provided in source.star.
