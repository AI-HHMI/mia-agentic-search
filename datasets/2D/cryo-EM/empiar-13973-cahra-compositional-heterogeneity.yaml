  notes: 'Listing read by hand from the EMPIAR HTTPS index (tools/listing.py failed: FTP timed out, HTTPS connections
    reset repeatedly), so listing_complete false and no file count; size stays the API''s 9.6 TB (page-stated).
    Probed 0001.mrcs (500x288x288 float32, 1.01 A) and one F30 micrograph (4096x4096 float32, 1.01 A). Sampled 3228.mrcs
    (54,412,288 B): min -6.99, max 4.34, mean 0.002, std 1.000 (one sample: standardized). source.star read via
    range requests only (header + 9 x 3 KB chunks): species codes ADH, Aldolase, Beta-Amylase, GDH, IgG, PKM2; exposures
    F30, L30. 3,227 x 500 + 164 = 1,613,664 particles, matching the preprint. No single archive: direct per-file
    HTTPS links under the EMPIAR folder. Paper not re-read in this run (bioRxiv rate-limited, Europe PMC has no
    full text). Particles/particles.star (197 MB) is the same table without the _source_* columns (blinded challenge
    input); not listed as an array.'
