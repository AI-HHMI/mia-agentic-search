notes: 'EMPIAR API: 5,200 multiframe EER movies (945 frames, 4096x4096, 1.01 A/px), 9.6 TB; "Particle coordinates
  and reference labels provided in source.star". Preprint: 1,613,664 particle images, box 288 px. EER movies are
  an unlisted format (other); listed formats are the MRC micrographs and particle stacks. License CC0 from the EMPIAR
  page badge. Companion entries EMPIAR-14006 and EMPIAR-13991 are simulated and not covered. No train/test split.
  organisms: all five are mixed inside every particle stack; source.star _source_species gives each particle''s
  protein (ADH = S. cerevisiae, Aldolase = O. cuniculus, GDH and IgG = B. taurus, PKM2 = H. sapiens, Beta-Amylase
  = I. batatas). enricher: formats [mrc] (was other); doi 10.6019/EMPIAR-13973 from the EMPIAR API (was null); annotations
  verified in source.star; download_url = EMPIAR HTTPS folder (no single archive).'
