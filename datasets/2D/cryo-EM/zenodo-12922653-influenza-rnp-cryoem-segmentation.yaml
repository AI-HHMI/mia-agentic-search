notes: 'Zip listing read with peek_archive: IMAGES.zip holds IMAGES_FILTERED (500 png plus a renombra.sh script that was not opened or run) and SEGMENTED (500 png named image_NNNNN_filtered_segmented.png). Paper Methods: micrographs recorded on a Titan Krios with a K3 detector at 0.84 A/px (29,493 movies, 5,760 x 4,092 px), then contrast inverted and downsampled 9x to 640 x 448 px at 7.56 A/px (0.756 nm) and band-pass filtered; the paper says the images used to train and evaluate the RNP-E (filament end) network are at this Zenodo record, trained on 500 manually labelled micrographs. Whether the masks mark RNP ends, whole filaments, or both was not verified by viewing the label images; the dataset page says only that they are manually segmented images. Raw movies and full-size micrographs are not included.'
