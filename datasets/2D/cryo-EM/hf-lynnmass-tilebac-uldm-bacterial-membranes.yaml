schema_version: '1.2'
id: hf-lynnmass-tilebac-uldm-bacterial-membranes
title: Ultralow Dose Montage (ULDM) Benchmark Dataset (TileBac)
short_name: TileBac Pantoea membranes (ultralow-dose cryo-EM)
description: Ultralow-dose cryo-EM montage tile images of Pantoea sp. YR343 (sample folders R2A and MOPSglu;
  19 montages of 196 tiles each, 3,724 tiles), with 886 tiles annotated for bacterial inner membrane (IM)
  and outer membrane (OM) instance segmentation and exported at 640, 1024 and 2048 px in COCO segmentation
  and YOLO formats with train/valid/test splits. Benchmark for segmenting thin, high-boundary cell envelopes
  in very noisy images.
