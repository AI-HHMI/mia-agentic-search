notes: 'The bioRxiv full text could not be fetched (HTTP 429, not open in Europe PMC), so only the abstract
  and the dataset README were read; pixel size, microscope settings and annotation protocol are not stated
  in them (pixel size null). Card license is MIT, but the Roboflow exports inside the repo are marked
  CC BY 4.0, so the license differs between files. n_items counts the 886 annotated tiles; 3,724 unannotated
  tiles (scale-bar and no-scale-bar JPEGs, plus raw MRC in the companion tilebac-ULDM-tiles dataset) are
  also hosted. The same group publishes a separate flagella dataset (tilebac-flag-dataset) and a stitched-montage
  set, which are different image sets. The data is also mirrored on ORNL Constellation (DOI 10.13139/ORNLNCCS/3025229).
  enricher: size_bytes from the full HF file listing (was HF storage figure); channels 1 (RGB JPEGs hold
  identical samples).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  13,816 files, 25.5 GB\n  README.md\n  all/no_scale_bar/{MOPSglu,r2a}/SearchMap_<date>_<time>/\
      \   19 dirs  3,724 .png  11.7 GB\n  all/scale_bar/{MOPSglu,r2a}/SearchMap_<date>_<time>/      19\
      \ dirs  3,724 .png  11.7 GB\n  annotated/{640p,1024p,2048p}-COCO/BCET Montage 2048-Tile.v<N>i.coco-segmentation/\n\
      \    README.dataset.txt, README.roboflow.txt\n    train/ valid/ test/   <tile>.rf.<hash>.jpg + _annotations.coco.json\n\
      \  annotated/{640p,1024p,2048p}-YOLO/BCET Montage 2048-Tile.v<N>i.yolov11/\n    data.yaml, README.dataset.txt,\
      \ README.roboflow.txt\n    train/ valid/ test/ {images/*.jpg, labels/*.txt}\n  per export: 640p\
      \ and 1024p 816/18/52 images, 2048p 272/18/52 (train/valid/test)"
    n_files: 13816
    listing_complete: true
  sample:
    urls:
    - https://huggingface.co/datasets/LynnMass/tilebac-ULDM-benchmark-dataset/resolve/main/annotated/1024p-COCO/BCET%20Montage%202048-Tile.v8i.coco-segmentation/valid/Tile_29481213_3_dyn_s_R2A_12-png_patch_0_1_s_R2A_12_png.rf.a5f3b99f0014428b870ac9053f5f6d42.jpg
    - https://huggingface.co/datasets/LynnMass/tilebac-ULDM-benchmark-dataset/resolve/main/annotated/1024p-COCO/BCET%20Montage%202048-Tile.v8i.coco-segmentation/valid/_annotations.coco.json
    size_bytes: 488447
    description: one 1024p validation tile and the COCO annotation file of the 1024p validation split
      (18 images, 38 polygons)
  arrays:
  - role: raw
    path_pattern: annotated/*-COCO/*/*/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 1024
    - 1024
    - 3
    shape_varies: true
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Annotated tiles exported by Roboflow, resized (stretch) to 640, 1024 or 2048 px
      per export folder; RGB with 3 identical samples (grey stored as RGB, s axis). Train images are augmented
      (3 versions per source image: flips, crop, rotation, shear; README.roboflow.txt). The YOLO folders
      hold the same images.'
  - role: label
    path_pattern: annotated/*-COCO/*/*/_annotations.coco.json
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: polygons
    classes:
    - id: 1
      name: IM
    - id: 2
      name: OM
    alignment: same-grid
    alignment_notes: 'COCO segmentation polygons in pixel coordinates of the exported jpg, one file per
      split, matched by file_name. Categories: 0 bacteria-q6d7 (supercategory, unused in the sample),
      1 IM (inner membrane), 2 OM (outer membrane).'
  - role: label
    path_pattern: annotated/*-YOLO/*/*/labels/*.txt
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    value_range: null
    encoding: polygons
    classes:
    - id: 0
      name: IM
    - id: 1
      name: OM
    alignment: same-grid
    alignment_notes: YOLO segmentation txt, one per image with the same stem in the parallel images/ folder
      (not sampled). Class ids from data.yaml (nc 2, names IM, OM).
  - role: other
    path_pattern: all/*/*/*/*.png
    format: png
    axes: yx
    shape:
    - 2048
    - 2048
    shape_varies: null
    dtype: uint8
    compression: deflate
    value_range: null
    normalization: unknown
    alignment: not-applicable
    alignment_notes: All 3,724 unannotated tiles (no_scale_bar and scale_bar copies), greyscale; names
      (<tile>_dyn.png_patch_<r>_<c>.png) suggest 2x2 patches of the 4096x4096 MRC tiles in the companion
      LynnMass/tilebac-ULDM-tiles repo.
  notes: 'Listing: tools/listing.py on the HF repo, complete with exact sizes (25,492,331,568 bytes).
    Probed one 1024p jpg (1024x1024x3 uint8) and one all/ png (2048x2048 uint8 grey). Sampled one 1024p
    validation jpg (452,806 bytes; values 0-255, mean 122.8, p1 20, p99 226; 3 identical samples) and
    the 1024p valid COCO json (35,641 bytes; 18 images, 38 polygons: 19 IM, 19 OM). Value range from one
    sample. COCO json lists license CC BY 4.0 (Roboflow export) while the card says MIT. voxel size not
    set: the annotated exports are resized per folder (640/1024/2048 px), so they do not share one pixel
    size. Upstream raw MRC header (tilebac-ULDM-tiles, Tile_29474497_1.mrc, 4096x4096 uint16) states 21.282
    A/px = 2.1282 nm; checked also: README, Roboflow README, GitHub README, bioRxiv API (full text 429).
    No single archive: data.download_url stays the HF repo; direct files via huggingface.co/datasets/LynnMass/tilebac-ULDM-benchmark-dataset/resolve/main/<path>.'
