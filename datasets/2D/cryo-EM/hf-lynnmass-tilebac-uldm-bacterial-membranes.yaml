notes: The bioRxiv full text could not be fetched (HTTP 429, not open in Europe PMC), so only the abstract and the dataset README were
  read; pixel size, microscope settings and annotation protocol are not stated in them (pixel size null). Card license is MIT, but the
  Roboflow exports inside the repo are marked CC BY 4.0, so the license differs between files. n_items counts the 886 annotated tiles;
  3,724 unannotated tiles (scale-bar and no-scale-bar JPEGs, plus raw MRC in the companion tilebac-ULDM-tiles dataset) are also
  hosted. size_bytes is the Hugging Face storage figure for the repository. The same group publishes a separate flagella dataset
  (tilebac-flag-dataset) and a stitched-montage set, which are different image sets. The data is also mirrored on ORNL Constellation
  (DOI 10.13139/ORNLNCCS/3025229).
