title: Segmentation of lipid nanoparticles from cryogenic electron microscopy images
short_name: Lipid nanoparticle segmentation (cryo-EM)
description: 38 cryo-EM micrographs (4096 x 4096 px, 0.223 nm calibrated pixel spacing) of mRNA lipid nanoparticles, manually segmented
  into particle and non-particle regions. Four sample types (with/without RNA, pH 4 and pH 7.4) are provided as four zip archives
  of images plus segmentation masks.
