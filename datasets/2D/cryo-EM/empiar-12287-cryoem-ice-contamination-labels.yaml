notes: 'EMPIAR API: ice_images has 678 float32 MRC micrographs (3838x3710, 1.096 A/pixel) with 678 JSON label
  files (directory listing count matches); a sample JSON holds polygon points labelled "ice". The dataset
  also holds 900 bzip2 frame stacks (MRCS) and 900 downsampled JPEGs with labels (jpegs_for_labeling lists
  678 JSON), so n_items counts the 678 labelled micrographs. Other label class names, annotator, and
  label coverage are not stated in the sources read: the bioRxiv full text returned HTTP 429, only the abstract
  (via the bioRxiv API) was read. size_bytes is the EMPIAR page-stated 308.6 GB. This is real vitrified-buffer
  imagery, not specimen images; its use is for ice/contaminant segmentation and as a source for synthetic
  micrograph generation.'
