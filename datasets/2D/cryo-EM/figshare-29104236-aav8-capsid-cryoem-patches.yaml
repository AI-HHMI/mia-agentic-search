notes: 'Figshare (KiltHub, CMU) record with three files: All_Patches_resized.zip (9.44 GB, 94,830 PNG patches, listed with
  peek_archive), names_labels_df.csv.zip (94,830 rows, read) and README_LabeledData.md (read). The license is listed as GPL
  3.0+, which is a software license applied to the data; recorded as GPL-3.0-or-later. Pixel size and the identity of the
  annotators are not stated in the record or README. The README says training and testing sets were randomly sampled with
  balanced classes; no split files are included. No paper is cited. enricher: all 94,830 zip members are patches (All_Labels
  is part of every patch name), 224x224 after resizing.'
