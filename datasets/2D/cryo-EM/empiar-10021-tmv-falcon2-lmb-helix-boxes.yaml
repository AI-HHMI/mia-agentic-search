notes: 'File listing: 28 *_stack.mrc movie stacks and 28 matching .box files. Pixel size 1.061 A/px per
  EMPIAR (paper: 1.06 A). The paper (Table: summary of processed data sets) says 28 micrographs were included
  for this data set. Box files are manual helix picks (interactive picking in the paper), not segmentation
  labels, so annotation type is other. License CC0 from the EMPIAR policies page (all EMPIAR data is CC0).
  Sibling EMPIAR-10020/10021/10022 differ by camera and site.'
