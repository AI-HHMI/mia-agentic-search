short_name: TMV Falcon II (LMB) cryo-EM, helix boxes
description: 28 cryo-EM movie stacks (MRC) of tobacco mosaic virus recorded with a FEI Falcon II on a
  Titan Krios at MRC-LMB Cambridge, each with a manually picked EMAN helix .box coordinate file. One of
  three EMPIAR entries from the direct-electron-detector comparison of Fromm et al. 2015.
