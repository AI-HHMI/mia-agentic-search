notes: 'Sibling of EMPIAR-13549 (on main): same Cas9 benchmark, alternate microscope; raw movies only, no particle
  stacks or STAR files. Values from the EMPIAR API (8 image sets, TIFF, 5760x4092, 0.654 A pixel, 40 frames) and
  the preprint abstract (full text not open access). Per-particle labels are implicit: the class is the movie folder
  (2-8 and 14 bp extension); no label files exist, so annotations_verified stays false. The paper mentions thirteen
  complexes; only these 8 image sets are in this entry. enricher: channels 1 from TIFF header (was null); download_url
  = EMPIAR FTP folder (was null), no single archive.'
