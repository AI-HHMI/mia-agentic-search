title: Experimentally-grounded benchmark datasets for cryoEM heterogeneous reconstruction methods with engineered
  Cas9 complexes, alternate microscope collection
short_name: Cas9 cryo-EM benchmark, alt. microscope movies
description: Raw unaligned multiframe cryo-EM movies (TIFF, 40 frames, 5760 x 4092, 0.654 A pixel) of catalytically
  inactive S. pyogenes Cas9 with sgRNA and target DNA duplexes carrying engineered extensions of 2 to 8 and 14 bp,
  one folder per extension length (8 listed image sets, 43,852 movies). Collected on a different microscope with
  varied collection parameters than EMPIAR-13549. The samples were imaged independently, so the dataset of origin
  gives a ground-truth state label for each particle.
