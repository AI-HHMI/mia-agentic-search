notes: 'Sibling of EMPIAR-13549 (already in the catalog): same Cas9 benchmark design, but a different set of raw
  movies from an alternate microscope; this entry has raw movies only, no particle stacks or STAR files
  (13549 has those). Values come from the EMPIAR API record (8 image sets, TIFF, 5760x4092, 0.654 A pixel,
  40 frames, counts summed) and the preprint abstract; the preprint full text is not open access, so the
  Methods were not read. Per-particle labels are implicit (dataset of origin) and no label files exist, so
  annotations_verified is false. The paper mentions thirteen complexes; only the 8 image sets listed here
  are in this entry. Download directory is not given as a URL on the page, so download_url is null.'
