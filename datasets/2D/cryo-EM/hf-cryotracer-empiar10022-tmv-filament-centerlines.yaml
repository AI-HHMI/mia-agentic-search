notes: 'Hugging Face listing: 223 files = 109 MRC + 109 CBOX + 3 preview JPEGs + README (data/ is about
  3.66 GB). One MRC header probed by range request (4096 x 4096, float16, 0.106 nm/px) and the start of
  one CBOX read (ordered filament vertices with filament ids). Same 109 micrographs as the EMPIAR-10022
  record already on main (empiar-10022-tmv-falcon2-embl-helix-boxes, EMAN helix boxes from Fromm et al.);
  this record differs in the annotation: new ordered filament centerline vertices made by the CryoTracer
  authors, not the original helix boxes. The paper calls them expert annotations; how they were made (manual
  or semi-automatic) is not stated in the page read, so source is unknown. The paper also uses a private
  alpha-synuclein set that is not released. Licence is CC-BY-NC-4.0 on the Hugging Face card. enricher:
  voxel size 0.1062 nm from the EMPIAR API pixel_width 1.062 A (was 0.106 from the MRC header).'
