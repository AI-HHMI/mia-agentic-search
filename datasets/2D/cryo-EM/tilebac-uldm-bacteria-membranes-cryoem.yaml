short_name: TileBac bacterial membranes (cryo-EM)
description: Ultralow-dose cryo-EM montage tiles of Pantoea sp. YR343 with inner-membrane (class 0) and outer-membrane (class
  1) segmentation annotations in YOLO and COCO formats at 640, 1024 and 2048 px, plus the unannotated tiles. Benchmark for
  segmenting bacterial cell envelopes in extremely noisy images.
