  arrays:
  - role: raw
    path_pattern: annotated/2048p-YOLO/*/*/images/*.jpg
    format: jpeg
    axes: yxs
    shape:
    - 2048
    - 2048
    - 3
    shape_varies: false
    dtype: uint8
    compression: jpeg
    value_range:
    - 0
    - 255
    normalization: contrast-stretched
    alignment: not-applicable
    alignment_notes: 'Grey stored as RGB (samples_identical: true). 2048 px patches of 4096 px montage tiles after dynamic
      (per-image adaptive) normalization (paper Sec. 3.1, Fig. 2). Same images in the 2048p-COCO folders.'
  - role: label
    path_pattern: annotated/2048p-YOLO/*/*/labels/*.txt
    format: other
    axes: null
    shape: null
    shape_varies: true
    dtype: float64
    compression: none
    encoding: polygons
    classes:
    - id: 0
      name: inner membrane (IM)
    - id: 1
      name: outer membrane (OM)
    alignment: same-grid
    alignment_notes: '<split>/labels/<stem>.txt pairs with <split>/images/<stem>.jpg; YOLOv11-seg rows: class x1 y1 ... normalised
      to [0,1] of the image. Class order from data.yaml (names [IM, OM]), README and paper agree.'
  - role: label
    path_pattern: annotated/2048p-COCO/*/*/_annotations.coco.json
    format: json
    axes: null
    shape: null
    shape_varies: true
    dtype: unknown
    compression: none
    encoding: polygons
    classes:
    - id: 1
      name: IM
    - id: 2
      name: OM
    alignment: same-grid
    alignment_notes: One COCO file per split; images[].file_name refers to the jpg files in the same folder (2048 x 2048).
      Category 0 is the Roboflow superclass.
  - role: raw
    path_pattern: all/no_scale_bar/*/*/*.png
    format: png
    axes: yx
    shape:
    - 2048
    - 2048
    shape_varies: false
    dtype: uint8
    compression: deflate
    normalization: contrast-stretched
    alignment: not-applicable
    alignment_notes: Unannotated 2048 px patches of all montage tiles (grey PNG); all/scale_bar/ has the same patches with
      a burned-in scale bar. Annotated jpg stems carry the tile id (Tile_<id>_<n>) and patch row/column.
  notes: 'Listing: Hugging Face tree API, 13,816 files, 25,492,331,568 B exact. Sample (2048p YOLO test Tile_29474574_6 patch_0_0):
    JPEG 2048x2048x3 uint8, 0-255, mean 128, three identical samples; label file 2 polygons (one IM, one OM). COCO 2048p test
    json: 52 images 2048x2048, 57 IM + 57 OM. Header: all/ PNG 2048x2048 uint8 grey, deflate. Value range from one sample.
    Voxel size 2.128 nm/px from bioRxiv Sec. 3.1 ("7 x 7 montage tiles at 4096 x 4096 image size (2.128 nm/pix)"); 2048 px
    tiles are crops ("tiled to 2048 x 2048"); 1024/640 px exports are resized (bilinear), not at that size. No single archive:
    per-file on HF (resolve/main/<path>), so data.download_url stays null. 2D, so not in the miao layout yet.'
