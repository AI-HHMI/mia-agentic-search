notes: 'Sibling of tilebac-flagella-bacteria-cryoem (same paper). Related HF repos tilebac-ULDM-tiles and tilebac-stitched-montage
  are not separate records. Annotated: 2048 px tiles 272 train/18 valid/52 test (n_items 342 = these); 640/1024 px are resized
  copies with 816 augmented train. Folder all/ has 3,724 unannotated 2048 px PNG patches (19 SearchMaps x 196), with and without
  burned-in scale bar. MIT per HF card (Roboflow export READMEs say CC BY 4.0); mirrored on ORNL Constellation (10.13139/ORNLNCCS/3025229).
  enricher: voxel size 2.128 nm/px from bioRxiv Sec. 3.1 (4096 px montage tiles; 2048 px patches are crops; was null). enricher:
  annotation source manual (Roboflow, Sec. 3.2). coverage: only the 342 tiles in annotated/ carry labels; background-only
  tiles were removed from training.'
