notes: 'Pixel size, annotator/annotation procedure and bit depth are not stated on the dataset card, and the paper (bioRxiv preprint) is not open access in Europe PMC, so only its abstract was read. File listing (HF API): 7,448 raw PNG tiles under all/ (scale_bar and no_scale_bar variants of the same 3,724 tiles), annotated sets of 886 JPG images (640p and 1024p) and 342 JPG images (2048p) in COCO and YOLO layouts. n_items is the number of distinct raw tiles (3,724; the 7,448 raw PNGs are scale_bar/no_scale_bar copies). Companion datasets tilebac-ULDM-tiles, tilebac-stitched-montage and tilebac-flag-dataset exist on HF. Card text says "18 valid images" while the counts differ by set; download_url left null because it is a repository, not an archive.'
