notes: 'Read the figshare (J-STAGE Data) record and the full paper (Methods, Data availability). The data
  are two .7z archives (14.4 GB training and validation set, 0.25 GB figure data) that cannot be listed
  remotely, so file names, image counts and the mask file format are not verified; the paper says images
  were converted to 16-bit TIFF (APC images then converted to 8-bit) and the record separates a training
  and a validation set, so formats is tiff and splits are provided. Raw images are 2304 x 2304 px; pixel
  size is not stated in the paper. Ground truth masks come from a classifier trained interactively on
  fluorescence (ilastik), with manual pixel annotation, hence source mixed. Cell masks for the morphology
  analysis were drawn manually in the figure-data set. enricher: 7z archives not inspectable remotely
  (metadata-only).'
