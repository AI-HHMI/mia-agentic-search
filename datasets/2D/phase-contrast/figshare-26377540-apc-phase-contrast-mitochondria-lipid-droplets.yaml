schema_version: '1.2'
id: figshare-26377540-apc-phase-contrast-mitochondria-lipid-droplets
title: Apodized phase-contrast and fluorescence image pairs with ground truth masks for mitochondria and
  lipid droplet segmentation in Vero cells
short_name: Vero mitochondria and lipid droplets (phase)
description: High-resolution apodized phase-contrast (APC) images of live Vero cells paired with near-simultaneous
  fluorescence images (AcGFP1-Mito for mitochondria, Lipidye II for lipid droplets), ground truth binary
  masks made from the fluorescence with ilastik, and predicted masks, used to train deep-learning segmentation
  models that find these organelles in phase-contrast images alone. A second archive holds the images
  and results used for the paper's figures, including CCCP and oleic acid treated cells.
