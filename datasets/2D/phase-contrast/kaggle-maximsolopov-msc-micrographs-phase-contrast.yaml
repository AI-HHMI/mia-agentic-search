notes: 'Kaggle record (CC BY-NC-SA 4.0, 130 MB) and complete file listing: 320 PNG images in images/ and 320 PNG masks in masks/. Paper (PMC11899854, open access): Nikon Eclipse Ti2 inverted microscope in
  phase contrast, 1000 x 1000 px, masks drawn by three independent experts in VGG Image Annotator, binary values 1/0; the paper split the images 256/64 for training/validation but the Kaggle dataset has no split
  files. Magnification is stated inconsistently: the Kaggle description says 40x, the paper Methods say a 10x lens. Pixel size is not stated. How the three experts'' masks were combined into one mask per image
  is not stated. The Data Availability statement points to this Kaggle dataset.'
