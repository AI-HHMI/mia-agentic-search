notes: 'Checked Zenodo record and API metadata and the bacteria_images.zip listing (92 entries: 88 .tif
  in train/test x raw/masks, plus Thumbs.db). The record lists 33 + 11 image/mask pairs, i.e. 44 pairs;
  n_items counts all 88 TIFFs. No publication is linked on the record and none was found, so publications
  is empty. Bacterial species, strain and sample prep are not stated on the record, so organism is left
  empty. Raw images were flat-field normalised (divided by 200 px Gaussian blur) and stored as float32.
  The record notes it was used to train a DenoiSeg model (zenodo 7467554). enricher: n_items 44 = 33 train
  + 11 test image/mask pairs from the zip listing (was 88, images and masks counted separately).'
