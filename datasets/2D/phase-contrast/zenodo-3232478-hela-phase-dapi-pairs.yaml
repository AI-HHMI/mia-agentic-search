notes: 'Zenodo record lists license odc-pddl (PDDL-1.0). Training signal is image-to-image,
  not masks: label-free phase contrast inputs paired with DAPI nuclear fluorescence
  targets (virtual staining / fluorescence prediction), hence annotations.types and
  ml.tasks are "other"; the DAPI channel could also support nucleus segmentation but
  no masks are provided. Zip listing: raw_phase/ and target/ folders, 200 TIFF files
  (~553 MB uncompressed). No linked paper found on the Zenodo record; pixel size,
  image dimensions and bit depth not stated on the record and not checked in TIFF
  headers. Small dataset (100 pairs). enricher: voxel size 322.5 x 322.5 nm from the ImageJ
  TIFF calibration (0.3225 um/px, unit micron) of raw_phase/001.tif and target/001.tif (was null; not stated on the
  record). enricher: channels 2 = phase contrast + DAPI, one single-channel uint16 1024x1344 TIFF each (was null).'
