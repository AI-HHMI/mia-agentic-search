notes: 'Zenodo record read via API (license cc-by-4.0, one 23.1 MB zip); zip listed with peek_archive:
  33 PNG images + 33 XML annotations in Training_Images/Training_Annotations and Test_Images/Test_Annotations.
  Paper Methods (ZeroCostDL4Mic, Nat Commun 2021, YOLOv2 training dataset section) says 30 images of
  1380x1040 were annotated in makesense.ai with four shape classes; the zip holds 33 pairs, so the
  count differs by 3 and n_items follows the zip. Pixel size 323 nm from the Zenodo description. Zenodo
  labels the data "phase contrast (bright-field)"; paper says bright-field time-lapse, so the first modality
  is phase-contrast. Train/test counts not tallied (only the first 40 zip paths were listed). Organism
  Homo sapiens inferred from the cell line name (MDA-MB-231 human breast cancer) and human fibroblast
  matrix per the paper.'
