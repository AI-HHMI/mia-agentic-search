notes: 'Zip (763 MB compressed, 1.3 GB uncompressed; size_bytes is the rounded compressed size) holds four folders (100x_oil_QuantEMa ~70 images, 100x_oil_QuantEMb ~49, 100x_oil_Zyla ~200, 60x_air_Zyla ~100) each with Phase*.TIF plus one GroundTruthStructure.mat; n_items counts the approximate TIFF images. Contents of the .mat files were not opened, so annotation type, coverage and how the ground truth was made (manual vs software) are unverified. Camera pixels are 16 um (QuantEM) and 6.5 um (Zyla) per the paper; the object-space pixel size is not stated, so voxel size is null. The license is CC BY-ND 3.0 (no derivatives), which may restrict redistribution of modified data; no DOI for the paper was found. Dataset page lists 2014-2017 collection.'
