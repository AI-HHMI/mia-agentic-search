notes: 'Zip (763,026,027 B) holds four folders: 100x_oil_QuantEMa (70 TIF), 100x_oil_QuantEMb (49), 100x_oil_Zyla (200),
  60x_air_Zyla (100), each with one GroundTruthStructure.mat. The .mat (read with a stdlib MAT v5 header parser) stores
  per image a list of cells, each with ''spcv'', a 2 x K array of spline control points: cell outlines, not masks. How
  the ground truth was made (manual vs software) is not stated. Camera pixels are 16 um (QuantEM) and 6.5 um (Zyla) per
  the paper; the object-space pixel size is not stated, so voxel size is null. License CC BY-ND 3.0 (no derivatives).
  Dataset page lists 2014-2017 collection. enricher: annotation type set from the .mat contents (was other); size from
  the zip listing.'
