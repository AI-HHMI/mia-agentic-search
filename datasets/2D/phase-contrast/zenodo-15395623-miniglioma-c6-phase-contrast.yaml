notes: 'Details come from the Zenodo landing page; the zip could not be listed (SSL error from the sandbox
  proxy on zenodo.org file downloads), so the mask files and 25/5 split are as described on the page,
  not seen in a listing. Pixel size is not stated on the MiniGlioma or parent pages. The paper cited on
  the parent page (Malashin et al. 2025, Glioma C6: A Novel Dataset for Training and Benchmarking Cell
  Segmentation) has no DOI there, so it is not listed in publications and its text was not read. Parent
  record zenodo.org/records/15083188 (Glioma C6 dataset, 75 images, COCO annotations, 945 MB) contains
  C6-spec and C6-gen; this record is a small separate deposit of 30 images with binary masks, per its
  page the C6-gen subset. Authors are listed on the parent page (Malashin, Pashkevich, Ilyukhin, Volkov,
  Yachnaya, Denisov, Mikhalkova), not on the MiniGlioma page.'
