title: MiniGlioma dataset for binary cell segmentation
short_name: C6 glioma cell masks (phase contrast)
description: 30 phase-contrast images of rat C6 glioma cells (25 training, 5 validation) with binary cell-region
  segmentation masks, imaged 24 or 72 h after seeding on a BestScope BS-2092 with 10x and 20x objectives.
  Images were downsampled from 2592 x 1944 to 704 x 512 px. A small subset (C6-gen) of the Glioma C6 benchmark.
