notes: 'Details come from the Zenodo landing page; the zip was listed by the enricher (25 train + 5 valid
  image/mask pairs). Pixel size is not stated on the MiniGlioma or parent pages. The paper cited on the
  parent page (Malashin et al. 2025, Glioma C6: A Novel Dataset for Training and Benchmarking Cell Segmentation)
  has no DOI there, so it is not listed in publications and its text was not read. Parent record zenodo.org/records/15083188
  (Glioma C6 dataset, 75 images, COCO annotations, 945 MB) contains C6-spec and C6-gen; this record is
  a small separate deposit of 30 images with binary masks, per its page the C6-gen subset. Authors are
  listed on the parent page (Malashin, Pashkevich, Ilyukhin, Volkov, Yachnaya, Denisov, Mikhalkova), not
  on the MiniGlioma page. enricher: channels null (images are stored as 3-sample RGB; whether the samples
  are identical was not checked, was 1); download_url is the Zenodo API content link.'
