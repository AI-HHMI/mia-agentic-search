  notes: 'Inspected only 100x_PC_Bsub_MM_training_data.tar.gz (142.5 MB, streamed in full and listed; 2 images,
    2 masks, 2 weight maps read). Value ranges are from those two samples. The other three archives (2.0, 5.8, 9.2
    GB) are tar.gz, which cannot be listed without downloading them in full, so their contents (image counts, shapes,
    whether masks are binary or instance labels; the paper trained Omnipose on labelled masks of 40-trench tiles)
    are unverified (layout.listing_complete refers to the four archives, all listed with exact sizes). Shapes are of the B. subtilis archive (single trench crops
    320x64); other archives may differ. Compression inferred from file size (82054 B = 320*64*4 + header). Raw images
    are float32 roughly in [0, 1] but exceed it, so normalization is unknown. Voxel size not found; checked: TIFF
    members, Zenodo API record, paper full text (Methods, Table 3 gives only objectives: 100x oil NA 1.30; 40x air
    + 1.5x), Data availability. Subsets use different objectives, so no single value applies. No sample unit: TensorSwitch
    reads zip members but not tar.gz members, and data are offered only as four tar.gz archives (direct Zenodo links,
    range requests OK).'
