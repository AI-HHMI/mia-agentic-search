notes: 'Four tar.gz archives at Zenodo (17.3 GB). Images are synthetic (SyMBac simulation); masks come from the
  simulation (source automatic). Paper cites this record as [46]; related records: Zenodo 7265884 (real + synthetic
  data of the paper), 21022735. organisms: Bacillus subtilis = 100x_PC_Bsub_MM_training_data.tar.gz; Escherichia
  coli = the other three archives. modality: fluorescence-other = 60x_FL_agar_training_data.tar.gz; phase-contrast
  = the three 100x_PC archives. enricher: annotations verified (2450 image/mask/weightmap triplets in the B. subtilis
  archive); size from Zenodo file listing (was page-stated); voxel size not stated anywhere and differs by objective
  (100x vs 60x), left null.'
