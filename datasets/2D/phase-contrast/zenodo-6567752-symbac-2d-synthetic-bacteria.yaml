description: Four synthetic training sets generated with SyMBac for segmenting B. subtilis in a mother machine (100x
  phase contrast), E. coli on agar pads (100x phase contrast), E. coli in a microfluidic turbidostat (100x phase
  contrast) and E. coli streaked on agar pads (60x fluorescence). Each synthetic image comes with a ground-truth
  cell mask.
