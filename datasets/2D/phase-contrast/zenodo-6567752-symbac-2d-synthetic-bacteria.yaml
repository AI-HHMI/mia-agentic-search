notes: 'Four tar.gz archives (5.8 GB, 142.5 MB, 9.2 GB, 2.0 GB; 17.3 GB total) at Zenodo. Images are synthetic (SyMBac simulation), not real micrographs; masks come from the simulation, so source is automatic. The first 3 MB of the 100x_PC_Bsub_MM archive showed TIFF files named synth_NNNNN.tif; the sibling record 7265884 has a training_data_DELTA_fourier/masks/ layout. Full archive contents, image counts, pixel size, mask encoding and splits were not verified (tar.gz cannot be listed without downloading; the Zenodo page, API record and paper give none of these). The paper (open access, Data availability) cites this record as [46]. Related but distinct records: Zenodo 7265884 (real and synthetic data of the same paper) and 21022735 (SyMBac data for E. coli dormancy exit).'
