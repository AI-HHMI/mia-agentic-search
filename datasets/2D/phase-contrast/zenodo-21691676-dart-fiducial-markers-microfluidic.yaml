notes: 'Zenodo record, 6 files, 14.0 GB. dart_train_test_dataset.zip = 319 PNG + 638 txt (train 239, test
  80, each with labels_bbox and labels_segment). live_cell_experiment.zip = 47 multi-page TIFF stacks
  and the chip CIF, no labels; calibration_data_full.zip = 1,164 TIFFs + 3 json/csv. Paper: markers annotated
  manually in Label Studio with SAM assistance; 192/47/80 train/val/test in the paper, but the zip has
  only train and test. enricher: voxel size set to null (was 66 nm): subsets differ. Marker images 0.066
  um/px (100x), live-cell data 0.093 um/px (paper). The labelled task is detection of chip fiducials,
  not cells.'
