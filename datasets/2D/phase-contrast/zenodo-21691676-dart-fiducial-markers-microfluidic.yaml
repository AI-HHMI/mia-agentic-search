notes: 'Zenodo record, 6 files, 14.0 GB. peek_archive: dart_train_test_dataset.zip = 319 PNG + 638 txt (train 239, test 80 images, each with labels_bbox and labels_segment). live_cell_experiment.zip = 47 multi-page TIFF stacks (5.05 GB) and the chip CIF, no labels; calibration_data_full.zip (9.7 GB) not listed. Paper (arXiv 2606.18523): markers annotated manually in Label Studio with SAM assistance; 192 / 47 / 80 train / val / test in the paper, but the zip has only train and test folders. Marker images 0.066 um/px, 100x phase contrast; live-cell data Nikon Ti, 0.093 um/px, 1,739 images, unlabelled. The labelled task is detection of chip fiducials, not cells.'
