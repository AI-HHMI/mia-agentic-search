title: DART - phase-contrast images of microfluidic chip fiducial markers with segmentation labels, plus
  live-cell C. glutamicum imaging
short_name: Microfluidic chip fiducial markers (phase)
description: 319 annotated 2560 x 2160 px phase-contrast images (0.066 um/px, 100x) of fiducial markers
  (472 crosses, 470 circles) on a microfluidic chip, with per-image YOLO label files, for training a marker
  detector. The same record holds a live-cell Corynebacterium glutamicum phase-contrast imaging set (1,739
  images over 47 stacks) and a stage-coordinate calibration set, both without labels, plus the chip CAD
  file and trained YOLO weights.
