notes: 'Zip listings (peek_archive): mm.zip = mm/img + mm/seg_label (707 each) and a StarDist model; cc.zip
  = cc/img + cc/seg_label (508 each) and a StarDist model; tracking_set_subset.zip = 16,403 sets of img,
  previmg, seg, segall, mot_dau, wei (train 14,353 / val 2,050) and unet_pads_track.hdf5 (DeLTA 2.0 model).
  The other four zips hold only CSV single-cell result tables, no images. Paper Methods: Olympus IX83,
  100x 1.3 NA phase + YFP, sCMOS; labels from manual LABKIT annotation then iterative StarDist correction
  (source: mixed). download_url null: eight separate zips. Paper preprint is CC BY-NC-ND; the Zenodo license
  is CC-BY-4.0. enricher: voxel size left null; the code repo notebooks list 65 nm/px (PxinUmX 0.065)
  for the acquisitions, which fits the mm crops, but cc crops (400x128) and DeLTA sets (300x300) may be
  resampled. Image PNG/TIFFs are single-channel.'
