title: Single-cell approach dissecting agr quorum sensing dynamics in Staphylococcus aureus
short_name: S. aureus mother-machine segmentation (phase)
description: 'Training data for two StarDist2D segmentation models and a DeLTA 2.0 tracking model for Staphylococcus
  aureus (cocci) imaged by phase contrast in microfluidic mother-machine and connected-chamber chips: 707 single-chamber
  mother-machine images and 508 100x100 px connected-chamber crops, each with a segmentation label image, plus 16,403
  tracking training sets (train/val split) with segmentation, mother/daughter and weight maps. The record also carries
  the retrained models and large single-cell result tables behind the paper figures.'
