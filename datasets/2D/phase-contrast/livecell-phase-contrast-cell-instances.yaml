  notes: 'Complete S3 listing of LIVECell_dataset_2021/ (58 objects, 12,074 zip members, exact sizes); 23.5 GB total,
    of which 18 .pth model files are ~16 GB, images ~2.5 GB, annotations ~2.3 GB. Probed 4 TIFFs: all single-page
    520x704 uint8, LZW, photometric minisblack. Sampled two A172 images: 3-255 and 3-241, mean 128.0 both, std 6.9-7.5
    (one sample each). The mean sits at exactly 128, which may mean the images were re-centred, but no doc says
    so: normalization unknown. COCO files read by range (header, a middle chunk, tail): polygon segmentation + bbox
    + area, iscrowd 0, one category ''cell'', licenses CC BY-NC 4.0. Annotation counts not verified (test JSON is
    261 MB). Nuclear count benchmark (fluorescence + phase at seeding densities) not probed.'
