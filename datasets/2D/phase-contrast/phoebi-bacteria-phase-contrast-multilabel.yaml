notes: 'Labels are culture-level multi-label presence vectors (no masks or boxes);
  the paper bounds disagreement with per-field content at ~4.9%. Repository is gated
  (auto-approve; login and accept conditions). Pixel size not stated in the paper
  or dataset card; microscope: Fisherbrand upright phase-contrast, 100x oil NA 1.25.
  Stored as Parquet on Hugging Face with embedded JPEG images; data/phoebi6 (120,000
  images) and data/phoebi4 (14,000 legacy) folders seen in the API listing, image
  files not individually listed. Paper text and card are inconsistent about held-out
  combination counts. Research use only.'
