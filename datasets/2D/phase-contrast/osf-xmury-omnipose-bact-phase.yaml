notes: 'Listed the OSF project via its API: datasets/bact_phase/train_sorted and test_sorted hold 795
  .tif files (about 397 images plus 397 *_masks.tif; 249 train and 148 test pairs per folder counts),
  471 MB. Licence: license.txt in the OSF project root is CC BY-NC 3.0; no per-dataset licence file exists,
  so applying it to bact_phase is an assumption by location. Paper read via Europe PMC. Pixel size and
  per-folder species not stated in the text read: voxel size null, organism empty. Some images came from
  the Brun and Wiggins labs. The project also holds bact_fluor, worm and worm_high_res (not recorded here).
  enricher: size_bytes set to the OSF API total of the bact_phase folder, 471,311,791 B incl. 36 .DS_Store
  (was 471,301,547).'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "datasets/bact_phase/ (OSF project xmury)\n  train_sorted/<group>/<name>.tif + <name>_masks.tif\
      \   21 groups (A22, bthai, caulo, cex, ecoli_mut, ftsN, hpylori, PSVB, streptomyces, vibrio, wiggins,\
      \ ...)\n  test_sorted/<group>/<name>.tif + <name>_masks.tif    17 groups\n795 .tif (471,045,407\
      \ B) + 36 .DS_Store\n"
    n_files: 831
    listing_complete: true
  sample:
    urls:
    - https://osf.io/download/ye9rv/
    - https://osf.io/download/yt2dn/
    size_bytes: 1380576
    description: train_sorted/5I_crop/5I_crop_ensemble_4.tif and its _masks.tif (a median-sized pair).
  arrays:
  - role: raw
    path_pattern: '{train,test}_sorted/<group>/<name>.tif'
    format: tiff
    axes: yx
    shape:
    - 600
    - 575
    shape_varies: true
    dtype: uint16
    compression: none
    value_range:
