short_name: Bacterial phase-contrast cell masks (bact_phase)
description: 'Manually annotated bacterial phase-contrast images ("bact_phase", also listed as BPCIS)
  from the Omnipose paper: ensemble images of many species (E. coli, C. crescentus, V. cholerae, S. aureus,
  H. pylori, Streptomyces and others) with per-cell instance masks, split into train and test folders
  by species. The paper reports about 47,000 annotated cells.'
