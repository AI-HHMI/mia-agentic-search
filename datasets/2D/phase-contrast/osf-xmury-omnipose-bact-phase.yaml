notes: 'Listed the OSF project via its API: datasets/bact_phase/train_sorted and test_sorted hold 795 .tif files (about 397 images plus 397 *_masks.tif; 249 train and 148 test pairs per folder counts), 471 MB. Licence: license.txt in the OSF project root is CC BY-NC 3.0; no per-dataset licence file exists, so applying it to bact_phase is an assumption by location. Paper read via Europe PMC. Pixel size and per-folder species not stated in the text read: voxel size null, organism empty. Some images came from the Brun and Wiggins labs. The project also holds bact_fluor, worm and worm_high_res (not recorded here).'
