notes: 'OSF project xmury, folder datasets/bact_phase/{train_sorted,test_sorted}/<species>/, listed through
  the OSF API: train 249 images + 249 *_masks.tif (249.5 MB), test 149 images + 148 masks (221.6 MB);
  n_items = 398 images. Sampled pair: image uint16 588x468, mask 593x468 per the probe (shapes differ
  by a few rows, not resolved). The OSF project license.txt and the paper Data availability state CC BY-NC
  3.0 (non-commercial). Pixel size not stated for this dataset in the OSF wiki, file headers or paper
  Methods (the paper only says bacteria are typically imaged at about 0.1 um per pixel), so voxel_size_nm
  is null. Images come from several microscopes (Nikon Ti-E in-house, Brun lab sCMOS, Wiggins lab). Other
  Omnipose OSF datasets (bact_fluor, worm, worm_high_res) are not part of this record. Files are served
  through OSF download URLs per file, so no single archive URL.'
