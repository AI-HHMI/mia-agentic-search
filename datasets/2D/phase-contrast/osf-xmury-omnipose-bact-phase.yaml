    - 65535
    normalization: unknown
    alignment: not-applicable
    alignment_notes: null
  - role: label
    path_pattern: '{train,test}_sorted/<group>/<name>_masks.tif'
    format: tiff
    axes: yx
    shape:
    - 600
    - 575
    shape_varies: true
    dtype: int16
    compression: none
    value_range:
    - 0
    - 552
    encoding: instance-ids
    classes: null
    alignment: same-grid
    alignment_notes: <name>_masks.tif sits beside <name>.tif; identical 600x575 shape in the sample.
  notes: Listing of datasets/bact_phase by a scratch script over the OSF API (paginated folder listing,
    exact per-file sizes; not tools/listing.py, which has no OSF support, so size_source is page-stated).
    795 .tif = 397 image/mask pairs + 1 stray flow file (test_sorted/hpylori/Hpylori_ensemble_17_flows.tif).
    Sizes vary widely (smallest image 7.9 KB). Sample 5I_crop_ensemble_4 - raw uint16 600x575 uncompressed,
    0..65535; mask int16 0..552, 553 values (instance IDs, consistent with the docs). Normalization unknown
    (full uint16 range used, not documented). Value ranges from one pair.
