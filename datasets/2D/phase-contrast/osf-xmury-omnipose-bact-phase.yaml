description: 'bact_phase training and test sets from the Omnipose project: phase-contrast micrographs
  of many bacterial species and morphologies (wild type, mutants, antibiotic-treated), each with a manually
  annotated 16-bit instance label mask, organised as train_sorted and test_sorted folders per species
  or condition.'
