notes: 'Zenodo zip lists 3,800 TIFFs (237.2 MB uncompressed) in ~30 folders of 100-350 files; only the M. extorquens
  sets (figure-5, figure-6/a, figure-s4: 100 images each) have manual-masks; other masks are algorithm- or model-generated
  (mCAS, Otsu, fluorescence thresholding, U-Net trained on mCAS masks), hence source=mixed and coverage=partial.
  Pixel size is not stated in the record or paper as a value (only objective 63x/100x and camera pixel sizes 3.65/6.5
  µm in the preprint Methods), so voxel_size_nm is null. The preprint''s Data Availability says data are available
  on request, yet the Zenodo record is openly downloadable under CC BY 4.0. Paper is a bioRxiv preprint, not peer
  reviewed. Zenodo shows a newer version exists (modified 2026-08-01).'
