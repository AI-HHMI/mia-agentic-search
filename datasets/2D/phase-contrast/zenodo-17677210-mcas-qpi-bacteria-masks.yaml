title: 'mCAS: microbial Cell-Adaptive Segmentation of quantitative phase images'
short_name: Bacteria quantitative-phase single-cell masks
description: 'Single-cell 256×256 quantitative phase images (QPI) of E. coli (with paired fluorescence-derived masks)
  and Methylobacterium extorquens PA1, with segmentation masks from the mCAS algorithm, Otsu thresholding, U-Net
  models, and 100 manually drawn reference masks per M. extorquens benchmark set. Folders map to figures of the
  mCAS preprint: raw images, masks, and Dice/accuracy score text files.'
