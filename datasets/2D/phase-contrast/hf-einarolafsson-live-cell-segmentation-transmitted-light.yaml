description: 11,007 transmitted-light fields (phase contrast, brightfield, DIC, quantitative phase) with uint16 instance masks,
  harmonised from 14 public datasets (LIVECell, DeepSea, Cell Tracking Challenge sets, BBBC009/030, QPI adherent cells, Revvity-25,
  yeast sets and others) by the spaCR project to fine-tune Cellpose-SAM. Splits (6,778 train / 2,030 valid / 2,199 test) are
  by acquisition.
