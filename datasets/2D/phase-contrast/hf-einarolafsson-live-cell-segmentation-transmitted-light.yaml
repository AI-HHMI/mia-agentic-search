notes: 'Hugging Face API listing: 11,007 images/ and 11,007 masks/ TIFFs plus splits.csv, manifest.csv, SOURCES.md (5.74 GB).
  A re-compilation of 14 existing datasets, not new imaging: licences are mixed and listed per source in SOURCES.md (CC0, CC BY 4.0,
  MIT, CC BY-NC 4.0 for LIVECell and Revvity-25, "used with permission" for DeepSea and YeaZ, Cell Tracking Challenge terms), and the
  card states the whole is non-commercial, so spdx is custom. Several constituents may be catalogued separately (e.g. LIVECell, QPI
  adherent cells, Cell Tracking Challenge sets); this record is the harmonised union with its own splits. Annotation procedure is
  not stated on the card (it differs by source). No paper; pixel sizes vary by source and are not stated
  in the card, so voxel_size_nm is null. License column in SOURCES.md is the basis for the custom label.'
