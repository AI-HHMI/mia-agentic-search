  in the paper Methods ("available under a CC-BY license"); version not given, CC-BY-4.0 assumed. Only 3-10 cells
  and nuclei per image are annotated (partial coverage; unannotated regions blurred in the authors training set).
  Organisms from the paper cell-line table: 26 human, 3 mouse, 1 hamster line (CHO-K1).
  Dataset release date not stated (paper accepted 2020-03-27). n_items counts the 4,640 train/val images; 98 more are the evaluation set.'
