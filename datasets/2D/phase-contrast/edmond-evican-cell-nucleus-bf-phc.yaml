description: 4,640 partially annotated grayscale brightfield and phase-contrast images of 30 adherent cell lines
  from four microscopes, with 52,959 manually segmented cell and nucleus instances (3-10 of each per image),
  as COCO polygons (2-class and 60-class versions) plus binary masks; 98 fully annotated evaluation images.
