notes: >-
  Zip listings: mm.zip has 707 image and 707 label TIFFs, cc.zip 508 pairs (100 x 100 px crops), tracking_set_subset.zip
  213,239 PNGs. Paper Methods: images from an Olympus IX83 with a 100x 1.3 NA phase objective; spatial calibration
  0.065 um per pixel; labels drawn with FIJI LABKIT in prediction-correction cycles (so manual with model assistance);
  tracking sets built from 11,671 new cocci event sets plus 4,732 sets from the original DeLTA dataset. The BioImage
  Archive study S-BIAD2927 holds the raw movies of the same project.
