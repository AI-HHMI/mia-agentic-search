  notes: 'EBI FTP timed out; listing.py read the HTTP index and stopped after 200 directories (1,315 files, ~99.9 GB, rounded and incomplete), so size not confirmed and not estimated (file count per array
    unknown). The IDR filePaths.tsv for experiment A points to 20200831-ftp; 20200804-ftp holds same-named nd2 files (an earlier upload), so a whole-tree download would double count. Downloaded 0X.nd2 (151,670,784
