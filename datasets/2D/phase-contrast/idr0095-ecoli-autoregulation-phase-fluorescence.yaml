notes: 'Source files are Nikon ND2 (see IDR filePaths files, e.g. experimentA/idr0095-experimentA-filePaths.tsv), hence formats
  other: nd2 is not in the schema list. Mask ROIs were seen through the IDR API on sampled images of experiments A, B and
  C (e.g. 67, 52, 65, 101 masks per image); not every image was checked, and the masks are not a downloadable file listing
  (annotations_verified false). Masks come from automated segmentation of the phase images with a modified Schnitzcells (Matlab);
  per the study file, cells were then visually inspected for the analysis. Pixel size 0.0645 um is the IDR image metadata
  value of sampled images. Total size not stated: IDR lists 9 GB (experiment A) and 13.5 GB (experiment B); experiment C not
  stated. Objective/magnification not found in the study file or paper Methods text read.'
