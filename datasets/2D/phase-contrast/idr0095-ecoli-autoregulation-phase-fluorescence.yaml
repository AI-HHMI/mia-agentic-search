notes: 'Mask ROIs were seen through the IDR API on sampled images of experiments A, B and C (e.g. 67, 52, 65, 101 masks per image). Masks come from automated segmentation of the phase images with a modified
  Schnitzcells (Matlab); per the study file, cells were then visually inspected for the analysis. Pixel size 0.0645 um is the IDR image metadata value of sampled images. Total size not stated: IDR lists
  9 GB (experiment A) and 13.5 GB (experiment B); experiment C not stated. Objective/magnification not found in the study file or paper Methods text read. enricher: formats nd2 (was other); masks found
  as TIFF files on EBI FTP (annotations_verified true); pixel size 0.06447 um confirmed from the ND2 header.'
