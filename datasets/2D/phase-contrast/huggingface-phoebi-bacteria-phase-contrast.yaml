notes: 'Labels are image-level (the species present in the culture), not masks or boxes; the paper says every image of a
  combination shares one label vector. Hosted as parquet shards (configs phoebi6 and phoebi4, about 16 GB total) on Hugging
  Face with automatic gating (login and agreeing to access required), so the README could not be read; facts come from the HF
  API record (CC-BY-4.0, file listing) and the arXiv paper (Data and appendix tables). Parquet is not in the schema format
  list, hence formats [other]. Authors not extracted from the arXiv HTML. Pixel size not stated in the paper text read.
  Split sizes per paper: 96,000 train, 12,000 validation, 12,000 test.'
