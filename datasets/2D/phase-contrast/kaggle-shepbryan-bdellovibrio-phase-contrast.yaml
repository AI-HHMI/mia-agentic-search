notes: 'Kaggle API record states "Annotations were made by hand by Pressé Lab at Arizona State University" and gives the MIT licence; the Kaggle file listing
  (complete, 4,598 entries) shows 2,298 PNG images and 2,298 PNG masks in Cleaned/images and Cleaned/masks. Pixel size is not stated on Kaggle or in the paper
  (PMC10432179 Methods: Nikon inverted phase-contrast microscope, 60x 1.4 NA oil objective, Hamamatsu ORCA-Flash4.0 3V sCMOS, 1024 x 1024 px ROI; the
  paper only says the ~1 um cell spans about 11 pixels). The paper does not mention the annotated images or the Kaggle dataset: it tracks cells with TrackPy,
  so it is cited only as the source of the imaging data and the Kaggle page asks users to cite it. Whether the masks are binary or instance-labelled, the mask
  value range, the image size of the cleaned PNGs, and the train/test split were not inspected. Strain details come from the paper.'
