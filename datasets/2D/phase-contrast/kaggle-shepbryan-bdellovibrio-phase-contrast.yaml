notes: 'Kaggle API record states "Annotations were made by hand by Pressé Lab at Arizona State University" and gives the MIT
  licence; the Kaggle file list (4,598 entries) holds 2,298 PNG images and 2,298 PNG masks in Cleaned/images and Cleaned/masks
  (+ one .gitignore each). Pixel size is not stated on Kaggle or in the paper (PMC10432179: 60x 1.4 NA, ORCA-Flash4.0, 1024
  x 1024 px ROI; only "about 1 um long (i.e., 11 pixels)"). The paper does not mention the annotated images; it is cited as
  the imaging source. enricher: download_url is the anonymous Kaggle archive API URL (was the landing page), download_method
  http (was api), channels 1 from the grayscale PNGs (was null).'
