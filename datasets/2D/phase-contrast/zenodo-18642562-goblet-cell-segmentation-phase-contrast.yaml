title: Goblet Cell Segmentation Dataset
short_name: Human goblet cell segmentation (phase contrast)
description: 24 phase-contrast images (2048x1536 px) of cultured human conjunctival goblet cells, each with a semantic segmentation mask where every goblet cell instance is a pixel value above 0, plus a patched version (1,152 images and masks at 256x256 px, 48 patches per image). Provided in several annotation formats (PNG masks, YOLO polygon text, SAM2 / COCO-style JSON) with predefined train/test splits.
