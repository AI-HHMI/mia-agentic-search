notes: 'Zip listing (peek_archive): 14,025 files; original_data/complete (24 unpatched, 1,152 patched images with masks), train_test_split (unpatched 19/5, patched image-level 912/240, patched random 922/230), yolo_data and SAM2_data copies. Images photographed in phase contrast with an EVOS XL Core at 200x (paper). Annotation was semi-automatic (Cellpose 2.0 GUI, human-in-the-loop) then reviewed, about 17% revised. Pixel size is not stated on the Zenodo page or in the paper text read. n_items counts the 24 original images; the patched version has 1,152. Images are from a small number of fields of view and 4 donors (paper). Originals are JPEG, masks PNG.'
