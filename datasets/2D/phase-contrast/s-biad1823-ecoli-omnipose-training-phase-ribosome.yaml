    [0, 1399]; mask 0-82), microwell LL-37 train_00002_0 (uint16 256x256 [1361, 10782]; PNG mask uint8
    0-3) and indolicidin train_00001 (float64 600x600; mask float64 in [0, 1]). Value ranges from one
