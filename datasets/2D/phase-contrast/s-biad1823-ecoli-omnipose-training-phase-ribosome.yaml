notes: 'Only the training-data component (training_data_omnipose.zip, 5,874 files:
  wide-trench phase 1,726 files, wide-trench ribosome 1,184 files, microwell phase
  2,964 files) is described; the study also holds many raw time-lapse file lists (MIC/AMP
  experiments, biofilm bundles) without masks. Per the paper, wide-trench masks were
  generated by Omnipose and manually curated against the ribosome signal (592 curated
  ribosome images, 868 phase images, 353 for the first phase model), so source is
  mixed. Pixel size 65 nm is derived from the stated 6.5 um camera pixel and 100x
  objective; it is not stated directly. n_items is image-mask pairs counted from the
  zip listing (approximate). Checked the study record, file list, zip listing and
  the bioRxiv full text.'
