notes: 'Only the training-data component (training_data_omnipose.zip, 5,874 members) is described; the
  study also holds raw time-lapse file lists without masks. Wide-trench masks: Omnipose output manually
  curated against the ribosome signal (paper), so source is mixed. enricher: pixel size 65 nm now backed
  by a statement: paper Methods "the original pixel size (0.065 μm/px)" (it was derived from camera and
  objective before). enricher: the microwell folder holds subfolders bthai/, serratia/ (Serratia_Ecoli_*
  files), wiggins/, A22/ and 5I_crop/ besides LL-37_treated/ and indolicidin_treated/; their names suggest
  images from other sources or species, which neither the study nor the paper documents, so organism stays
  E. coli and their pixel size is unverified. n_items: image-mask pairs from the zip listing (approximate).'
