notes: 'Zip (613 files) holds raw_images/ (547 tif + 1 jpg phase-contrast images, nested folders), metadata
  CSVs, ilastik/model (one .ilp, HDF5), ilastik training_images_raw and training_images_preprocessed (11
  each), ilastik/example_expected_outputs (11 segmentation TIFFs) and software_reference docs. The 548
  raw images have no label files: the only label images are the 11 ilastik classifier outputs (automatic);
  the manual partial pixel annotations exist only inside the .ilp project (paper: "pretrained on images
  with partial annotations"). enricher: annotations.source mixed (was unknown): label TIFFs automatic,
  .ilp labels manual. enricher: channels 3 (raw TIFFs are RGB). enricher: size 5.78 GB from the Zenodo
  file listing; hdf5 added to formats for the .ilp. Optika XDS-2, Optikam Pro 8LT camera, 10x objective;
  pixel size not stated (see technical.notes).'
