notes: 'Zip (613 files) holds raw_images/ (548 phase-contrast images in nested folders,
  tif and jpg), metadata CSVs, ilastik/model (one .ilp), ilastik/training_images_raw
  and training_images_preprocessed (11 images each), ilastik/example_expected_outputs
  (11 segmentation TIFFs, classifier outputs) and example_outputs. Labels exist only
  for the small ilastik training set, as partial annotations inside the .ilp project
  (paper Methods: classifier pretrained on images with partial annotations); the 548
  raw images have no label files, so this is mostly a raw-image collection with a
  weak segmentation signal. Images are 2592 x 1936 px, Optika XDS-2 with Optikam Pro
  8LT camera, 10x objective (100x total magnification per the paper); pixel size is
  not stated on the Zenodo page, in README_dataset.md or in the paper text read. Annotator
  and annotation procedure not stated. Checked Zenodo page, README_dataset.md, zip
  listing and the Pharmacia paper PDF.'
