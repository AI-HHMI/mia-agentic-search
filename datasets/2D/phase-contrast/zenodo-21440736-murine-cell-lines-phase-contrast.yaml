notes: 'The 243 raw images are .bmp (not a listed format, so formats is "other"). The Zenodo record lists CC-BY-4.0, but the
  archive itself contains LICENSE_SELECTION_REQUIRED.md saying no license was assigned inside the package, so the licence of the
  bundled code and checkpoints may differ. Pixel size, microscope and objective are not stated in the archive READMEs that
  were read (dataset/README.md, instance_masks/README.md, metadata/README.md); the manuscript could not be found in Europe PMC
  by title, so no paper is listed. Split counts from dataset/README.md: train 223 images / 15,403 cells, validation 20 images /
  1,164 cells. The archive also holds about 16k single-cell patches, analysis code, model configs and trained checkpoints (.pth),
  none of which were run or loaded. The full archive path list and 6 text members were read.'
