notes: 'Zenodo record has no authors parsed and no related paper; none cited on the record. Zip lists 102 .tif files (test/
  and train/; per region: DPC image, _brightfield image, _masks) plus 2 Thumbs.db; so about 34 image/mask triplets. Uncertain
  objects (dust, fused cells) were intentionally left unannotated. Pixel size 634 nm stated on the record. enricher: the files
  are 512x512 (headers), not the stated 1024x1024, so the stated 634 nm may be for the unbinned image; kept, confidence lowered.'
