notes: 'Zip listed with peek_archive: 6316 PNG (masks + edges), 3158 JPG, 3 txt; README gives train 2305 / test1 563 / test0 290 = 3158. Licence conflict: the Zenodo page says CC BY 4.0, but the in-archive README says images and annotations are for academic use only, no commercial use; recorded as custom, so check before commercial use. Pixel size not stated on the Zenodo page, README or paper (only frame resolution 3088x2064 for the source videos; image size inside the zip not checked). Images are frames from videos, so neighbouring frames of the same video may be near-duplicates. enricher: size 2,908,673,178 B from file listing (was 3.05e9); channels 3 (RGB JPEG); annotations.source manual from paper Sec 2.1 (was unknown); voxel size still not found.'
