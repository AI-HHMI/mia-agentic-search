  notes: 'Listing: tools/listing.py on the Zenodo record, 2 files (README.txt + TVMI3K.zip, 9477 members), 2,908,673,178 bytes, complete. Sampled Train 01(44): JPEG 1536x1536x3 uint8, range 0-255 (one sample); mask palette PNG with 256 indices, index 255 = grey 0 background, foreground grey 255 with anti-aliased edges (encoding other: soft binary mask); edge map {0,255}. Image size varies (1536x1536 crops and 2064x3088 full frames). Test0 masks/edges are background-only images (README). Pixel size not found; checked: JPEG/PNG headers (no calibration), Zenodo API record, README.txt, arXiv paper full text (only frame resolution 3088x2064), no code repo linked on the Zenodo page. Annotations manual: 5 professional annotators in two groups with cross-validation (paper Sec 2.1).'
