notes: 'Zenodo lists three zips (phase contrast 515 MB, fluorescent green intensity 156 MB, fluorescent red intensity 120
  MB); peek_archive shows 324 jpeg in each of the phase and green zips (red zip not listed, assumed 324 from the
  Zenodo name and paper: 324 images x 3 channels = 972). The deposit has no masks; the paper segments the phase images
  with Cellpose, which are not released. Pixel size is derived from the paper statement of 3152 pixels/mm (1 mm /
  3152 = 317.3 nm); that wording may describe the camera setup rather than the sample plane, so treat the value as
  approximate. Exposure for fluorescence was 3 s. The Zenodo record lists no related publication; the paper cites it.'
