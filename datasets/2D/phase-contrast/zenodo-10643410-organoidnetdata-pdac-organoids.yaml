title: 'OrganoIDNetData: A Curated Cell Life Imaging Dataset of Immune-enriched Pancreatic Cancer Organoids with Pre-trained AI Models'
short_name: PDAC organoids with immune cells (phase)
description: Phase-contrast Incucyte time-lapse fields of view of human and murine pancreatic ductal adenocarcinoma (PDAC)
  organoids co-cultured with immune cells (180 fields of view, 34,113 organoids), cut into 800x800 patches with manual
  organoid masks from two annotators. Provides training (713), validation (179) and test (10) image/mask pairs, an
  augmented training set, and Cellpose and StarDist baselines with pretrained models.
