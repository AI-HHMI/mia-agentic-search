notes: 'Zip listing (peek_archive, 16,290 files, 4.59 GB, 37.6 GB uncompressed): Dataset/Training 713, Validation 179, Test 10 image/mask
  pairs (800x800 TIFF patches), Augmented 1,426 pairs (not counted in n_items), Raw_Data/Annotations.zip with the full fields of
  view, and Source_Codes with Cellpose and StarDist training folders and pretrained models. Zenodo gives 180 fields of view
  and 34,113 organoids; Incucyte S3 4x objective, 2.82 um per pixel (paper Methods), fields of 1408x1040 or 1280x852
  px acquired every 4 h up to 100 h. Masks were drawn in Labkit by two annotators who agreed a consensus. Zenodo DOI taken
  from the Crossref reference list; the paper text only cites it by number. Published 2024, found by literature search.'
