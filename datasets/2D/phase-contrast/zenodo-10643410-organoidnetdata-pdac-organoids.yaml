notes: 'organisms: Homo sapiens = Human_* files, Mus musculus = Mouse_* files (Dataset/Training, Validation, Augmented);
  the 10 Test_* patches don''t say. Zip: Dataset/Training 713, Validation 179, Test 10 image/mask pairs (800x800 TIFF
  patches), Augmented 1,426 pairs (not in n_items), Raw_Data/Annotations.zip (full fields of view), Source_Codes with
  Cellpose/StarDist training folders and models. Zenodo: 180 fields of view, 34,113 organoids; Incucyte S3 4x, 2.82 um
  per pixel (paper Methods), fields 1408x1040 or 1280x852 px every 4 h up to 100 h. Masks drawn in Labkit by two annotators
  with a consensus. Zenodo DOI from the Crossref reference list.'
