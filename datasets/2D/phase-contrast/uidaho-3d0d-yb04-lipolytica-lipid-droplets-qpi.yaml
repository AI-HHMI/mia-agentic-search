notes: 'Pixel size is not stated on the repository page, in the paper or in the upstream paper (Vasdekis 2019, ref 53; it
  gives only camera pixel and objective). Masks were generated by quasi-automated deconvolution and cross-correlation (paper
  Methods), hence source automatic. The paper states a 2,000-image test and 1,000 to 5,000-image training split; no split
  ships in the data. Code at github.com/sheneman/deep_lipid. Modality: SLIM quantitative phase on a phase-contrast (PH3) objective,
  so phase-contrast plus other (QPI). Organisms: Y. lipolytica strains Po1g (Po1g_*) and MTYL038 (MTYL_*). enricher: download_url
  = direct ZIP from the VERSO file link (was null); size 225,258,650 B from the ZIP (was 214.82 MB page-stated); description
  corrected: the ZIP holds only raw/ and binary/ TIFFs, no classifier scores; annotations verified. Modality phase-contrast
  added first (was other only).'
