notes: 'Zip listing (peek_archive, 265 files): 50 raw images with 50 PNG masks and 50 ROI zips, plus reconstructions
  (rDIC-Koos, rDIC-Yin, rWeka, ...) as extra TIFFs. HMC and quantitative phase imaging have no enum value,
  so they fall under "other". Different from zenodo-5153251 (same group, QPI only, larger, from the 2021
  deep-learning paper): this record is a 50-image four-modality benchmark of the 2019 BMC Bioinformatics
  comparison. Pixel size and image dimensions are not stated on the Zenodo page, description file or paper
  text. enricher: size_bytes is now the total of both record files (zip + description.txt) from the Zenodo
  listing.'
