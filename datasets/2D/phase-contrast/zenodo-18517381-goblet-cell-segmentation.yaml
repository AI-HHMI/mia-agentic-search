notes: 'Paper (Sci Data 2026, Europe PMC full text) read incl. data records and folder tree: original_data, SAM2_data,
  yolo_data, each with unpatched / patched_img_level / patched_random and train/test. 24 original images (65,108
  cells), 1,152 patches. Zenodo zip is 514 MB (paper says about 744 MB total) and does not support range requests,
  so its contents were not listed; annotations_verified is false. Pixel size is given only as roughly 0.5 um/pixel
  in the paper, so 500 nm is approximate. Annotation by Cellpose 2.0 human-in-the-loop, reviewed by a second
  author (about 17% revised), hence proofread. A copy is also on Hugging Face (freafin/GCS_dataset). Few unique
  fields of view and one imaging setup, per the authors.'
