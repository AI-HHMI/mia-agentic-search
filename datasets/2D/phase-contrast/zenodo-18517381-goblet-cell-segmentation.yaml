title: Goblet Cell Segmentation Dataset
short_name: Conjunctival goblet cells (phase contrast)
description: 24 unstained phase-contrast images (2048 x 1536 px, EVOS XL Core, 200x) of cultured human conjunctival
  goblet cells with 65,108 manually curated single-cell instance masks, plus a patched version (1,152 images of
  256 x 256 px). Provided as JPEG images with PNG masks, YOLO text and SAM2/COCO RLE annotations, with 80/20
  train/test splits (unpatched, patch-level and image-level).
