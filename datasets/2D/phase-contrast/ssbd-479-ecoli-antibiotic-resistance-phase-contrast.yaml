notes: 'SSBD repository page states CC BY 4.0 (database page too). dataset.json/manifest: 2,991 TIFFs, raw_image 90,428,565,996
  B (the source/ zips, 10.4 GB, repeat them). Probed one TIFF: uint16 RGB, 1944x2592x3, uncompressed. Pixel size not stated
  (paper gives only 100x objective, Leica ICC50 W camera, 2592x1944 px, 96 px/inch), voxel_size_nm null. Labels are only the
  strain in the file names (parental P vs 10 resistant strains, 3 culture dates, ~20 images per line); the paper segments
  cells with the pretrained Omnipose, no manual masks are released with the images. The paper cites a figshare collection
  (10.6084/m9.figshare.c.7757147) with only cell contours and features, not images. Not opened: image contents beyond one
  header; label semantics inferred from folder names plus paper Methods, so annotations_verified false. enricher: channels
  1 (was 3; RGB samples identical in a sampled TIFF).'
