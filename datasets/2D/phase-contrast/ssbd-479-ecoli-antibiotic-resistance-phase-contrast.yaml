id: ssbd-479-ecoli-antibiotic-resistance-phase-contrast
title: Phase-contrast images of 10 antibiotic-resistant Escherichia coli strains and their parental strain (SSBD 479-Ikebe-MorphResDL)
short_name: E. coli antibiotic-resistant strains (phase)
description: 2,991 RGB phase-contrast TIFF images (2592x1944 px, 100x objective) of 10 laboratory-evolved antibiotic-resistant
  E. coli strains (AMK, AZM, CFIX, CP, CPFX, CPZ, DOXY, ENX, NM, TP) and their sensitive MDS42 parental strain, about 20 images
  per strain line per culture date over three dates. Image-level strain labels come from the folder names; the paper trains
  a single-cell resistant-vs-parental classifier on Omnipose segmentations.
