notes: 'One 2.9 GB zip (listed: 3,158 jpg, 5,463 png in Imgs, Masks, Edges). Licence conflict: Zenodo metadata says CC BY 4.0, the README says academic use only and no commercial use, so spdx is custom. Modality, resolution of the source frames, number of annotators (5, in two groups with cross-validation) and the split rule come from the arXiv paper; the paper links the code repository, which was not opened. Pixel size and magnification are not stated on the Zenodo page, README or paper text read. Same group and imaging device as zenodo-5523661 (MVDI25K) but different images and task.'
