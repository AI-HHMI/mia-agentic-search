notes: 'One 2.9 GB zip (listed: 3,158 jpg, 5,463 png in Imgs, Masks, Edges). Licence conflict: Zenodo metadata says CC BY
  4.0, the README says academic use only and no commercial use, so spdx is custom. Modality, source frame size (3088x2064),
  annotators (5, two groups with cross-validation) and the split come from the arXiv paper. Pixel size and magnification are
  not stated. Same group and device as zenodo-5523661 (MVDI25K), different images. enricher: formats + png (masks/edges).
  A newer Zenodo version of the same concept (6813974, 2022-07-05, TVMI3K.zip 2.9 GB) adds edges for the test sets and split
  lists; the code repo links that version.'
