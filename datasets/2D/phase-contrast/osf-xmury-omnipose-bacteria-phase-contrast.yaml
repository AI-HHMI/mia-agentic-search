notes: 'OSF project, no DOI; also holds bact_fluor, worm and worm_high_res sets, not covered here. OSF API
  listing of bact_phase (17 species folders): train_sorted 498 .tif (249 image/mask pairs), test_sorted 297
  .tif (about 148 pairs); about 471 MB; n_items 397 is derived from that. License: OSF field says see license.txt,
  which is CC BY-NC 3.0, as is the paper data availability statement (non-commercial only). Pixel size is
  not stated per file and several microscopes were used (paper: typically about 0.1 um), so voxel_size_nm
  is null. Organisms are those named in OSF tags; other species are present but not verified.'
