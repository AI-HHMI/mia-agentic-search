title: Omnipose bact_phase dataset (bacterial phase-contrast with cell masks)
short_name: Bacterial cell segmentation (phase contrast)
description: Phase-contrast micrographs of diverse bacterial species and morphologies (wild type, mutants and
  antibiotic-treated cells), each with a manually curated instance segmentation mask, split into train and
  test sets. This is the bact_phase set used to train and benchmark Omnipose against Cellpose and other
  bacterial segmentation methods.
