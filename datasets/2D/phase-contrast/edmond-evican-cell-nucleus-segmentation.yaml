short_name: EVICAN cell and nucleus segmentation (BF/PhC)
description: Partially annotated grayscale brightfield and phase-contrast images of
  30 adherent cell lines from four microscopes, with manually drawn cell and nucleus
  outlines (3-10 per image) exported as COCO JSON and binary masks. About 4,600 training/validation
  images with ~53k instances plus separate fully annotated evaluation images.
