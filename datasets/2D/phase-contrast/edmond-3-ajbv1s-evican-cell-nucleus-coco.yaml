  notes: 'Exact file sizes from the Dataverse API (17 files, 3,331,799,774 B); listing.py cannot follow
    the Edmond download redirect (signed S3 URL rejects HEAD), so the size is page-stated, not file-listing.
    Zip central directories read by range through tools/peek_archive.zip_entries with a range-GET size
    check: val 1,176 jpg (incl. *_Background.jpg images), eval 98 jpg (small crops, e.g. 100_SKBR.jpg
    85x164x3), val masks Cells/926 + Nuclei/926 jpg. Train image and mask zips not listed. Sample (one
    file each): 100_ACHN.jpg RGB uint8 2160x2160x3, 0..253, mean 176; Cells/100_ACHN.jpg grayscale uint8
    0..255, 46 distinct values, 97.5% zero; Nuclei/100_ACHN.jpg 0..255, 44 distinct, 99.5% zero. Masks
    are binary foreground masks stored as lossy JPEG, so edges carry compression artefacts (threshold
    before use); instance identity is only in the COCO polygons. Images are stored as 3-channel JPEG although
    the paper describes grayscale data; channels left at 1. Image sizes vary between microscopes (shape
    from one sample).'
