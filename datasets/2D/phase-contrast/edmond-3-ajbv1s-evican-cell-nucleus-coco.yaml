notes: 'Hosted in the Max Planck Edmond Dataverse (the old imeji collection link in the paper now redirects to the
  Edmond home page; record found through the Edmond search API). File list, CC BY 4.0 licence and sizes come from the
  Dataverse API: 7 zips (train 2.16 GB, val 0.54 GB, background-blurred train/val, eval, train/val masks) and 10
  COCO JSON files; size_bytes is the sum of all files. Zips could not be listed (the download redirects to a signed
  S3 URL that range requests could not read), so the JPEG format and image counts come from the paper (4,640
  partially annotated train+val images, 98 fully annotated evaluation images; n_items = 4,738 is their sum) and were not checked in the archives. Annotation is partial: 3-10 cells and nuclei per image,
  picked at random, drawn on fluorescence overlays and by seven annotators. Pixel size not stated in the paper text
  read; objectives 10x-40x on Opera Phenix (BF), IX81, AF7000 and Biorevo BZ-9000 (PhC).'
