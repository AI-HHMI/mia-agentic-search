notes: 'Hosted in the Max Planck Edmond Dataverse (the old imeji link in the paper redirects to the Edmond
  home page; found via the Edmond search API). File list, CC BY 4.0 licence and sizes from the Dataverse
  API: 7 zips (train 2.16 GB, val 0.54 GB, background-blurred train/val, eval, train/val masks) and 10
  COCO JSON files; size_bytes is the sum of all 17 files. Image counts from the paper (4,640 partially
  annotated train+val images, 98 fully annotated evaluation images; n_items = 4,738). Annotation is partial:
  3-10 cells and nuclei per image. Pixel size not stated in the paper text read; objectives 10x-40x. enricher:
  eval, val and val-mask zips listed by range and one image + masks sampled; masks are lossy JPEG (see
  technical).'
