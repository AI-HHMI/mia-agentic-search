notes: 'Zenodo page: "Test data manually annotated with bounding boxes". Archive listing (502 members): train/ has 37 TIFFs
  per channel (phase_contrast, GFP_calibrated, mCherry_calibrated); test/ has 97 per channel (phase contrast as PNG) and
  96 VOC XML files (256x256 images, classes RAJI and Dead). Train images have no label files. Authors match the ISBI 2020
  paper doi 10.1109/isbi45749.2020.9098696 (via Crossref), but the record does not cite it and its full text was blocked,
  so it is not listed. Pixel size, microscope, organism and lymphocyte type are not stated on the Zenodo page or in the
  archive. File names look like time-lapse frames; order not verified, so dimensionality is 2D.'
