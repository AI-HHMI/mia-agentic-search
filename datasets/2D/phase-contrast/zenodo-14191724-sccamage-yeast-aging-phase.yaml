notes: 'Labels: culture day = folder name (Day2..Day20); live/dead for 4,116 Live_vs_Dead cells in Final_Features_PI_dead_vs_live.csv
  (Live_vs_Dead 1 = live, 0 = dead; PI-stained), no masks or boxes. Main_CamAge, Dyes, Drugs, KOs and
  Human hold .tar.gz archives inside the zips, so their images were not listed. organisms: Homo sapiens
  = Human.zip; Saccharomyces cerevisiae = all other archives. Pixel size not stated on the Zenodo page,
  in the STAR protocol (only frame sizes 4908x3264 and 2592x1944 px) or the code README; the Cell Reports
  article has no open full text. enricher: size 22,878,971,039 B from the Zenodo file listing (was page-rounded
  22.9 GB); download_url = record page (10 separate files, no single archive). enricher: annotations.format
  corrected (live/dead is in a CSV, not folder names).'
technical:
  method: sample
  size_source: file-listing
  layout:
    tree: "./  10 files  22.9 GB  (.zip 9, .xlsx 1)\nLive_vs_Dead.zip (103.8 MB)\n  Live_vs_Dead/  Live_vs_Dead.sav,\
      \ Final_Features_PI_dead_vs_live.csv, live_vs_dead.ipynb\n  Live_vs_Dead/Data/Day{2,4,...,20}/ \
      \ (10 dirs)  8,250 .png  104.2 MB  (Day<N>_ph_* phase / Day<N>_f_* fluorescence crops)\n  Live_vs_Dead/Morhometric/\
      \  Area.csv, Perimeter.csv, convexity.csv\nStress_dataset.zip (77.4 MB)\n  Data/{H2O2_1mM,H2O2_4mM,HU_100mM,HU_200mM,NC2,Temp}/\
      \  6,484 .png  87.5 MB\nMain_CamAge.tar.zip (7.3 GB)    Main_camAge.tar.gz\nDyes.zip (1.6 GB)  \
      \             Dyes/{Fm4_46,H2DCFDA,TMRE}.tar.gz\nDrugs.zip (1.3 GB)              Drugs/{Azacytidine,Etoposide_zip,MG132}.tar.gz\n\
      KOs.zip (10.6 GB)               KOs/{Anti_Aging_Drugs_Dataset,Anti_Longevity_Datasets,Pro_Longevity_Datasets,...}.tar.gz\n\
      Human.zip (1.1 GB)              Human/{Human_CPT,Human_Columbia}.tar.gz\nModels.zip (117 MB)   \
      \          trained models (.pt, .sav)\nyeast_segmentation-master.zip (712 MB)  segmentation code\
      \ + weights (.h5)\nRaw_and_Normalized Matrix_RNA seq_And_Raw_metabolomics_data.xlsx (1.2 MB)"
    n_files: 10
    listing_complete: true
  sample:
    urls:
    - https://zenodo.org/records/14191724/files/Live_vs_Dead.zip::Live_vs_Dead/Data/Day10/Day10_ph_A_10.jpgROI_2.png
    size_bytes: 13098
    description: One phase-contrast single-cell crop (PNG zip member); its class (culture day 10) is its
      folder name.
  arrays:
  - role: raw
    path_pattern: Live_vs_Dead.zip::Live_vs_Dead/Data/Day*/Day*_ph_*.png
    format: png
    axes: yxs
    shape:
    - 90
    - 86
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 42
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Phase-contrast single-cell crops, grey stored as RGB (samples_identical: true).
      Class = parent folder Day<N> (culture day 2-20). Crops vary in size (probed 90x86, 106x70).'
  - role: raw
    path_pattern: Live_vs_Dead.zip::Live_vs_Dead/Data/Day*/Day*_f_*.png
    format: png
    axes: yxs
    shape:
    - 119
    - 62
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 0
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Fluorescence (PI) crop of the same cell as the _ph_ crop with the same suffix (Day<N>_f_<well>_<n>.jpgROI_<k>.png
      <-> Day<N>_ph_...); true RGB (samples differ). Pairing from the CSV columns Names (ph) and filename
      (f).
  - role: raw
    path_pattern: Stress_dataset.zip::Data/*/*.png
    format: png
    axes: yxs
    shape:
    - 106
    - 102
    - 3
    shape_varies: true
    dtype: uint8
    compression: deflate
    value_range:
    - 47
    - 255
    normalization: unknown
    alignment: not-applicable
    alignment_notes: 'Phase-contrast single-cell crops, grey stored as RGB (samples_identical: true).
      Class = parent folder: H2O2_1mM, H2O2_4mM, HU_100mM, HU_200mM, NC2 (control), Temp.'
  - role: label
    path_pattern: Live_vs_Dead.zip::Live_vs_Dead/Final_Features_PI_dead_vs_live.csv
    format: csv
    axes: null
    shape:
    - 4116
    - 145
    shape_varies: false
    dtype: unknown
    compression: none
    encoding: other
    classes:
    - id: 0
      name: Dead
    - id: 1
      name: live
    alignment: not-applicable
    alignment_notes: 'Per-cell table: Names = phase crop, filename = fluorescence crop, subfolder = day,
      Live_vs_Dead 0/1 (= Cell_type Dead/live; 2,114 dead, 2,002 live), plus 128 feature columns and morphometrics.'
  notes: 'Listing: Zenodo API + zip central directories (tools/listing.py --expand-zips): 10 files, 22,878,971,039
    B, 15,172 zip members, size_source file-listing. Six of the image archives (Main_CamAge.tar.zip, Dyes,
    Drugs, KOs, Human) wrap .tar.gz files, which cannot be listed remotely, so their image counts, layout
    and formats are not verified. Probed 6 PNG members (Live_vs_Dead ph x2, f x2; Stress NC2 x2): uint8
    RGB, deflate, sizes 62-106 px wide and 86-135 px tall. Sampled 3 PNGs (value ranges from one sample
    each): ph [42,255], f [0,255] (256 values, 24% zeros), Stress NC2 [47,255]. normalization unknown
    (crops from JPEG frames per file names *.jpgROI_*). Read the label CSV in full (5.4 MB compressed):
    4,116 rows. Live_vs_Dead crops carry two labels, day (folder) and live/dead (CSV); Stress crops carry
    the condition (folder). Voxel size not found; checked: PNG headers (no calibration), Zenodo API record,
    STAR protocol full text (Europe PMC), Cell Reports abstract (no open full text), code record zenodo
    14545642 and the GitHub README. No single archive for the whole dataset; direct files are the 10 Zenodo
    file URLs. Dimensionality 2D is not covered by the miao layout yet.'
