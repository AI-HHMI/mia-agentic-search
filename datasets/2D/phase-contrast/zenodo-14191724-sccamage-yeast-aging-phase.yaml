title: scCamAge Datasets
short_name: Aging yeast single cells (phase contrast)
description: Phase-contrast (and some fluorescence) micrographs of single Saccharomyces cerevisiae BY4741 cells and knockout/drug-treated strains over ten chronological-aging time points (day 2 to day 20), used to train the scCamAge age classifier and regressors. Also includes live-vs-dead and stress image sets (per-cell ROI PNGs sorted into day folders), human fibroblast senescence images, trained models and RNA-seq/metabolomics matrices.
