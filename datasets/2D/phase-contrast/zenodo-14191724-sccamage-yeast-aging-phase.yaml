notes: 'peek_archive of Live_vs_Dead.zip (8,268 PNG cell crops in Day<N> folders) and Stress_dataset.zip (6,491 PNGs) confirms crops filed by day; the other archives (Main_CamAge, KOs, Drugs, Dyes, Human) were not opened, so their layout and counts are unverified. Labels are culture day and live/dead taken from folder names only, no masks or boxes. Pixel size not stated on the Zenodo page or in the STAR protocol (only full frame 4908x3264 px); the Cell Reports article (10.1016/j.celrep.2025.115270) had no open full text. A previous run rejected zenodo-14191216 as low-confidence; this is a different record with the full file list.'
