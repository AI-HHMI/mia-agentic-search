title: 'Glioma C6: a dataset for training and benchmarking cell segmentation'
short_name: Glioma C6 cell segmentation (phase-contrast)
description: 75 high-resolution phase-contrast microscopy images of rat C6 glioma cells with manually annotated
  masks in COCO format (about 12,000 cell instances and 7,800 nuclei per the Zenodo record). The C6-spec subset
  (45 images, 10x, 24 h) has train/valid/test splits and distinguishes Type A and Type B cells; the C6-gen subset
  (30 images, 10x and 20x, 24 h or 72 h after seeding) has general cell instances and is meant to test generalization.
