notes: 'Pixel size is not stated on the Zenodo record or in the arXiv abstract/HTML text I read (paper
  only available as a preprint, not in Europe PMC), so voxel_size_nm is null. Images are 8-bit 2592x1944
  TIFFs; the zip (945.5 MB, 79 files: 75 .tif + 4 COCO .json) was listed with peek_archive. Zenodo shows
  a newer version of this record exists; this entry points at v1.1 (2025-03-25). The Zenodo page lists
  about 12,000 cells and 7,800 nuclei; the split of nuclei between subsets is not stated. enricher: TIFFs
  are RGB (3 samples, not identical in the sample; channels was 1); size_bytes from the Zenodo listing;
  formats add png (spec_24h_10x_17.png preview).'
