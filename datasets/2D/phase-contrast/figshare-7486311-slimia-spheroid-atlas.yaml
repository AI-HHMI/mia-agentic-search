  notes: >-
    Exact listing of all 9 figshare zips (11,173,575,312 B; 15,992 members). Probed image/mask pairs: OperaPhenix 1080x1080 (1197 nm/px in header), LeicaDMi1 1944x2592 (500 nm/px),
    Axiovert200M_DeWever 10X 1030x1300 (1064 nm/px), IncucyteS3 1040x1408 (1250 nm/px); all uint8 single-page, uncompressed; images OME-TIFF, masks ImageJ TIFF.
    Sampled the OperaPhenix HeLa B1_T1 pair (450 KB compressed, via range reads with a scratch script because tools/sample.py does not open members of extension-less figshare URLs):
    image min 0 max 255 mean 157 (p1 5, p99 177); mask {0: 1,079,963, 255: 86,437}. Values from one sample.
    Voxel size differs per microscope (header calibrations above; Axiovert200 ReadMe: 100 pixels = 64.9 um), so imaging.voxel_size_nm stays null.
    data.download_url stays null: the dataset is 9 separate zips (ndownloader.figshare.com/files/50120850, 50120853, 50122224, 50122194, 50122473, 50134212, 50134218, 50134776, 50136054).
    Not convertible yet: 2D.
