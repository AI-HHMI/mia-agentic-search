notes: 'Figshare collection with 9 articles (OperaPhenix, OlympusIX05, Axiovert200M, Cytation5, LeicaDMi3000B, Axiovert200, IncucyteS3, LeicaDMi1, IncucyteZOOM), each a zip under CC BY 4.0; sizes from the figshare API sum to about 11.0 GB, so size_bytes is rounded and n_items (about 8,000) comes from the paper abstract. peek_archive of OperaPhenix and IncucyteS3: Images/<cell line>/*.ome.tiff plus mirrored masks as .tiff (about half each). Paper (open access, Methods read): manual segmentation in AnaSP v1.4; images are grayscale OME-TIFF converted with bftools. Pixel scales differ per microscope (0.30 to 2.0 pixel/um, paper Table 3), so voxel_size_nm is null. Modality is phase-contrast for most microscopes and brightfield for Cytation 5, Leica DMI1, Olympus IX05. Download URL left null because the data are nine separate files. The paper text links CC BY-NC-ND for the article; the figshare records state CC BY 4.0.'
