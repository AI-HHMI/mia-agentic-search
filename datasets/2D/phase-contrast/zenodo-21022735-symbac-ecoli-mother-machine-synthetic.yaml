notes: 'Companion deposit of catalogued S-BIAD3676 (real mother-machine time-lapse and masks); this record is the synthetic training
  set and models, not that data. symbac_data.zip (107.1 MB) lists 20,000 PNG files: images/ and masks/ folders with 5,000
  files each in exponential_phase_synthetic and stationary_phase_synthetic. Other files: omnipose.zip (452.5 MB, 17 Omnipose
  checkpoints), two parquet morphology tables (429 MB and 36 MB) and analysis_code.zip; about 1.0 GB of files in all.
  Images are simulated, not acquired. Pixel size, mask encoding (instance vs binary) and the SyMBac generation settings were
  not stated on the page or inspected, and no paper was found, so voxel_size_nm is null and the annotation type is other.
  Masks come from the simulator, hence source automatic. No split.'
