notes: 'Companion deposit of catalogued S-BIAD3676 (real mother-machine time-lapse and masks); this record is the synthetic
  training set. symbac_data.zip (107.1 MB): exponential_phase_synthetic and stationary_phase_synthetic, each images/ + masks/
  with 5,000 PNGs. Other files: omnipose.zip (17 Omnipose checkpoints), two parquet morphology tables, analysis_code.zip;
  1,025,116,494 bytes in all. Images are simulated. enricher: voxel size 107.9 nm from the SyMBac notebook in analysis_code.zip
  (pix_mic_conv = 0.1079 microns per pixel; was null), matching the real S-BIAD3676 107.87 nm. enricher: masks are instance
  label images (build_symbac_training_data.py: ''Masks must be 2D label images'', relabelled per tile; sample has 5 cell ids),
  so type other -> instance-segmentation. Masks come from the simulator, hence source automatic. No split.'
