title: BioMediTech RPE dataset
short_name: Stem cell-derived RPE maturation (phase-contrast)
description: 195 phase-contrast images (2560 x 1920 px) of human pluripotent stem cell-derived retinal
  pigment epithelial (RPE) cultures, each divided into 16 subwindows; 1,862 subwindows were manually labelled
  by two trained operators into four maturation-related morphology classes (fusiform 216, epithelioid
  547, cobblestone 949, mixed 150). Subwindows with clutter, out-of-focus elements or background only
  were discarded. Released with the original images, the subwindows (class coded in the file name) and
  a description PDF.
