notes: 'Zip listing shows 2,057 TIFFs (3.4 GB compressed, 4.6 GB uncompressed; Images/ at about 14.9 MB
  each plus Subwindows/), one .txt (license) and one PDF (Description.pdf), consistent with 195 full images
  + 1,862 subwindows. Labels are image-level class codes in the file names, not masks. Imaged on a Nikon
  Eclipse TE200S with a 20x Ph1 objective, 25-125 ms exposure; pixel size is not stated in the figshare
  description or paper text read. The dataset is also hosted at http://www.biomeditech.fi/data/RPE_dataset
  per the paper (not fetched). Train/test splits are not provided with the data. enricher: size now the
  figshare file listing (zip + ToolRPE.rar).'
