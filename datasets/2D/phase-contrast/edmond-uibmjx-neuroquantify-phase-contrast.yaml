notes: 'Four zips on Edmond (CC0): Training&Validation_Data (421 MB; 2,987 TIFF tiles in Data/Resized_gamma + 2,987
  PNG masks in Data/Labels), test_set_A (49 MB; 323 + 323), test set B (68 MB; 14 JPG + 6 TIF full-size 2560x1920
  images) and Groundtruth_NeuronJ (52 MB; 22 TIFF + 21 .ndf tracings). enricher: organism Homo sapiens and sample
  from the arXiv preprint (SH-SY5Y human neuroblastoma line, 10x phase contrast). enricher: annotations.source manual
  (preprint: 200 images manually annotated with ByteBridge software, three classes as colours). enricher: voxel
  size left null: the preprint states 1 um = 2.21 pixel (~452.5 nm/px) for the captured full-size images, but the
  512x512 training tiles sit in Resized_gamma folders and the resize factor is not stated. enricher: size_bytes
  = exact sum of the four Dataverse files; n_items = 3,352 images; formats + png, jpeg.'
technical:
  method: sample
  size_source: page-stated
  layout:
    tree: "./                                          4 zips   589.0 MB (Dataverse API)\nTraining&Validation_Data.zip\
      \  (421.3 MB)   5,976 members\n  Training&Validation_Data/Data/Resized_gamma/   2,987 *.tif   (e.g. 100_10Snap-948.tif)\n\
      \  Training&Validation_Data/Data/Labels/          2,987 *_all_objects.png\ntest_set_A.zip  (48.9 MB)     \
      \               647 members\n  test_set_A/Resized_gamma/                    323 *.tif\n  test_set_A/Labels/\
      \                           323 *_all_objects.png\ntest set B.zip  (68.2 MB)                     20 members\n\
      \  test set B/                                  14 Snap-*.jpg, 6 Snap-*.tif\nGroundtruth_NeuronJ.zip  (51.6\
      \ MB)            45 members\n  Groundtruth_NeuronJ/                         22 *.tif, 21 *.ndf, 1 *.txt"
    n_files: 4
    listing_complete: true
  sample:
    urls:
    - https://edmond.mpg.de/api/access/datafile/223981::Training&Validation_Data/Data/Resized_gamma/100_10Snap-948.tif
    - https://edmond.mpg.de/api/access/datafile/223981::Training&Validation_Data/Data/Labels/100_10Snap-948_all_objects.png
    size_bytes: 151872
    description: One 512x512 training tile and its RGB colour mask
  arrays:
  - role: raw
    path_pattern: '*.zip::*/Resized_gamma/*.tif'
    format: tiff
    axes: yx
    shape:
    - 512
    - 512
    shape_varies: false
    dtype: uint8
    compression: lzw
    value_range:
    - 91
    - 192
    normalization: unknown
    alignment: not-applicable
    alignment_notes: Single-page greyscale TIFF (photometric 1, 1 sample/pixel), no resolution tags. Tiles cut from
      2560x1920 images (20 per image, preprint); gamma-corrected per the preprint (folder name Resized_gamma).
  - role: label
    path_pattern: '*.zip::*/Labels/*_all_objects.png'
    format: png
    axes: yxs
    shape:
    - 512
    - 512
    - 3
    shape_varies: false
    dtype: uint8
    compression: png
    value_range:
    - 11
    - 250
    normalization: none
    encoding: rgb-colors
    classes:
    - id: null
      name: background
    - id: null
      name: cells
    - id: null
      name: neurites
    alignment: same-grid
    alignment_notes: 'Pairing: Resized_gamma/<stem>.tif <-> Labels/<stem>_all_objects.png (2,987 of 2,987 training
      stems match). Sampled mask has exactly 3 colours: (250,170,30) 227,202 px, (244,35,232) 31,746 px, (119,11,32)
      3,196 px; the colour-to-class mapping is not documented (preprint: three classes cells, neurites, background
      as distinct colours).'
  notes: 'Listing: zip central directories of all four Edmond files read by range requests with a short requests
    script (tools/listing.py and peek_archive.py do not follow the Edmond 303 redirect to presigned S3 URLs); sizes
    are the Dataverse API values (exact). Sample: 100_10Snap-948 pair (152 KB) plus test set B/Snap-582.tif (5.6
    MB: RGB 1920x2560 uint8, LZW, XResolution 300 dpi) read with tifffile/PIL; value ranges from that one pair.
    Not inspected: NeuronJ .ndf tracings and the test set B JPGs. Voxel size: preprint scale 1 um = 2.21 px for
    captured images; tile resize factor unknown; no TIFF calibration; checked Dataverse API, README of StanleyZ0528/neural-image-segmentation,
    journal abstract (paywalled), arXiv full text. Download: four separate zips, no single archive; Edmond (edmond.mpg.de)
    not on the TensorSwitch allowlist.'
