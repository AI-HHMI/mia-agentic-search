notes: 'Four zips on Edmond (CC0): Training&Validation_Data (421 MB; 2,987 TIFF + 2,987 PNG label pairs, Data/Labels), test_set_A (49 MB; 323 TIFF + 323 PNG pairs), test set B (68 MB; 14 JPG + 6 TIF full-size images) and Groundtruth_NeuronJ (52 MB; 22 TIFF + 21 .ndf tracings). Member lists read from zip central directories via range requests (peek_archive could not follow the Edmond redirect). n_items and size_bytes are approximate sums. The paper is not open access (Europe PMC abstract only), and the software repo page does not describe the data, so pixel size, organism/cell line, magnification, label classes (cells vs neurites) and how the masks were made are not stated in sources checked (dataset page and API record, abstract, GitHub README); the cell type is taken from the README (neuroblastoma) and left out of organism. Edmond zip downloads redirect to presigned S3 links; download_url left null.'
