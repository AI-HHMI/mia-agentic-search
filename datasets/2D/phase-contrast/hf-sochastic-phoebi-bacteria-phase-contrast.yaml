notes: 'Images are stored as JPEG inside Parquet shards (phoebi6 and phoebi4 configs, 42 files, 16.1 GB total from the Hugging Face API). Labels are per-culture species presence copied to every image (parsed from the acquisition folder name; the paper bounds the over-statement of per-field presence at 4.9% on average), so this is multi-label image classification, not segmentation. n_items = 120,000 (phoebi6) + 14,000 (phoebi4). Pixel size is not reported in the paper or dataset card. Dataset created 2026-09-26; paper is an arXiv preprint (NeurIPS 2026 Datasets track). enricher: access registration (was open); the HF API reports gated = auto and the data files return HTTP 401 without a logged-in, terms-accepted account. enricher: no pixel size anywhere; crops were resampled to 1024 px per the README. organisms: images show mixtures, so species are not separable by file or folder (combination column per image).'
