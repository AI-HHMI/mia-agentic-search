notes: Images are stored as JPEG inside Parquet shards (phoebi6 and phoebi4 configs, 42 files, 16.1 GB total from the Hugging Face API). Labels are per-culture species presence copied to every image (parsed from the acquisition folder name; the paper bounds the over-statement of per-field presence at 4.9% on average), so this is multi-label image classification, not segmentation. n_items = 120,000 (phoebi6) + 14,000 (phoebi4). Pixel size is not reported in the paper or dataset card. The dataset is new (created 2026-09-26) and the paper is an arXiv preprint (NeurIPS 2026 Datasets track).
