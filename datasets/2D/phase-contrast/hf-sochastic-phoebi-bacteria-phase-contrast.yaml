short_name: PHOEBI bacterial mixtures (phase-contrast)
description: 120,000 phase-contrast images (1024x1024 RGB JPEG, 1000x total magnification) of 40 culture combinations of six rod-shaped bacterial species (3,000 images each), with per-image multi-label species presence for open-world, compositional multi-label classification. A legacy 4-species subset (14 combinations, 14,000 images) is included. Random 80/10/10 and leave-combinations-out splits are provided.
