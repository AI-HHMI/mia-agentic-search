notes: 'Hosted in a Google Drive folder named in the paper; DeLTA delta/assets.py gives direct drive.usercontent.google.com
  links to five training-set zips (2.69 GB, all PNG; listed by the enricher). Counts: mother machine segmentation
  3,294 (train) / 9,024 (train_multisets), tracking 4,055 / 7,706, ROI 886; 2D segmentation 297, tracking
  23,655. Masks first made with Ilastik, then manually curated (paper). Pixel size not in the paper or
  docs. No data license found (paper CC BY 4.0, code MIT; neither stated to cover data); multisets include
  third-party movies (Molyso, MoMA, BACMMAN). organisms: Escherichia coli = mothermachine_training_*;
  the 2D_training_* source organism is not stated in the files (the 2020 paper used yeast movies for its
  2D test). Related: zenodo-17569655 is a later, different DeLTA set. enricher: dimensionality 2D (was
  2D+t): every sample is a single 2D crop; tracking samples pair two frames as separate PNGs.'
