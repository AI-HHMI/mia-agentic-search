id: delta-mother-machine-ecoli-training-sets
title: DeLTA training sets for segmentation and tracking of E. coli in the mother machine
short_name: E. coli mother machine seg + tracking (phase)
description: Training sets released with the DeLTA time-lapse analysis pipeline. Phase-contrast and GFP
  epifluorescence movies of E. coli in mother machine microfluidic chambers (plus movies from other labs'
  mother machine software papers) with curated segmentation masks, chamber ROI masks and cell-tracking
  samples. A separate 2D (agar pad style) mode has segmentation and tracking sets too. The same release
  holds pretrained models and demo movies.
