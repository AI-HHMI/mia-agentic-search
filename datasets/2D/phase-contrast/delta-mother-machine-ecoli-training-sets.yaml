  notes: 'Listing: central directories of the five training-set zips via range requests on the direct
    Drive links from DeLTA assets.py (exact sizes, 2,693,416,007 B; models and demo movies in the same
    Drive folder are not part of this record). Samples: 13 PNG members read by range (270,001 B) with
    a short script (tools/sample.py and probe.py do not parse zip URLs with a query string). Tracking
    sets (not listed as arrays): img/previmg are the current/previous frame (sample 183x21 uint16), seg/mother/daughter/segall
    binary masks are 182x20, one pixel smaller than the image crop. Voxel size not found; checked: paper
    full text (100X objective, no pixel size), DeLTA docs page, assets.py. No direct single archive: five
    zips, so download_url stays the Drive folder.'
