notes: 'Image-to-image translation (virtual staining) pairs, not masks. The record is the test portion of
  the paper''s data plus predictions: the page says the zips hold the test data and corresponding predictions;
  the paper''s training split is not in this record (the paper says all raw data files are on this Zenodo
  record). Zip listings (peek_archive): KC_10x.zip has 6,554 files in each of input_images, output_gt_images
  and DAPI_mse_1unet; HUVEC_20x.zip has 7,680 files in input_images and in each of three ground-truth/prediction
  channel pairs (DAPI nuclei, YFP VE-cadherin, CY5 F-actin); MDCK_20x.zip and MDCK_5x.zip were not listed.
  The paper names MDCK (5X phase contrast, Zeiss, 6.5 um/pixel camera; also 20X DIC), HUVEC 20X and keratinocytes
  10X phase contrast; the sample-plane pixel size is not stated, so voxel_size_nm is null. Size is the
  Zenodo page total (13.5 GB). Stated Zenodo resource type is journal article; splits are not provided
  in the record.'
