short_name: Phase/DIC to fluorescence pairs (MDCK, HUVEC, KC)
description: Test data of the fluorescence reconstruction microscopy (FRM) U-Net for four conditions (HUVEC
  20x, keratinocytes 10x, MDCK 20x, MDCK 5x). For each, transmitted-light input images (phase contrast
  or DIC), the matching ground-truth fluorescence images (nuclei, and for HUVEC also F-actin and VE-cadherin)
  and the network's predicted fluorescence images, as 256x256-pixel TIFF sub-images.
