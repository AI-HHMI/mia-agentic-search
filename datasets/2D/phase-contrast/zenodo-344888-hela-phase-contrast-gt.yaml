notes: 'The Zenodo deposit (23 files, 413 KB) holds only labels: DS06_01..11_gt.tif, lmk_centers_01..11.txt and original-image-list.txt,
  which maps DS06_NN to im01.pgm..im11.pgm in the demo dataset (phasecontrast/trainPhasecontrast)
  of CellDetect_v1.0.tar.gz on the Oxford VGG page (3.1 MB, not opened). The tarball is MIT-style licensed software; the page
  states no separate terms for the demo images, so the CC-BY-NC-ND-4.0 label license is the stated one. Image size, pixel
  size, label encoding and whether the masks are instance or binary were not checked (labels not opened); sibling record zenodo-344879 (yeast) has binary masks, so
  coverage and mask type are left open. MICCAI 2012 paper is not open access (abstract only).'
