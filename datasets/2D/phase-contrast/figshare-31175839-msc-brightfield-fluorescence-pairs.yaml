description: Public subset of the training and test data of a deep-learning in silico labeling study of
  human umbilical cord-derived mesenchymal stem cells. 20 fields of view as four registered 10x images
  (phase contrast, cell stain, DAPI nucleus stain, merge) plus 10 phase contrast test images, a spreadsheet
  of biological features, and a large model-training archive.
