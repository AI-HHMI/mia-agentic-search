notes: 'Facts come from the figshare API record (landing page gives 403) and the paper (Europe PMC full
  text). File list: 90 tif (20 each of PH_A, HCS_A, DAPI_A, MERGE_A; 10 PH_B3 test images, about 5 MB
  each), a feature spreadsheet and modelTraining.tar.gz (6.0 GB, contents not listed; the paper says the
  training code is on figshare). The paper says this is a subset of a 37,540-image set and the full data
  are on request. No mask files were seen; the paper derives cell and nucleus masks from the stained images
  (CellProfiler plus Python), so the usable signal is the registered phase and fluorescence pairs. Pixel
  size is not stated in the paper or record and headers were not read, so voxel_size_nm is null. Apache
  2.0 is shown on figshare and stated in the paper for the code.'
