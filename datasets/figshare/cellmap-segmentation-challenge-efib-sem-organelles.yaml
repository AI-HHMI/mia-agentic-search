notes: >-
  The Figshare item itself only holds the white-paper PDF; the imaging data and crops are hosted on
  OpenOrganelle / S3 and fetched with the challenge repo's `csc fetch-data` (default download ~36.7 GB
  as zarr). Voxel size is 4 nm or 8 nm isotropic per the challenge page; 4 nm is listed as the finest
  and per-dataset values were not checked. Per-crop annotation coverage, exact split and file listing were
  not inspected (Figshare landing page returned 403; the white paper PDF was not read). License CC BY 4.0
  is from the Figshare record. Collection DOI 10.25378/janelia.c.7456966 has 311 articles (per-crop records).
