  notes: 'Figshare listing: one file, Microscopy_image_dataset.rar, 37,504,381,803 B (complete, exact).
    The RAR5 archive has no central index at a known offset, so member headers were walked from the start
    with ranged GETs (script using requests only, ~1 req/s, 364,544 B of headers read): the first 24 file
    entries are segmentation/groundtruth/L_1..L_20.jpg and M_1..M_12.jpg (unpacked 0.84-1.28 MB each,
    RAR compression method 3). The members are compressed, so they cannot be range-read, and without unrar
    no pixel data was sampled. Shape, dtype and mask encoding are therefore unknown; JPEG masks are lossy,
    so binarisation (threshold) may be needed. The rest of the tree (classification images, raw segmentation
    images) was not walked; it would take ~16k header requests.'
