title: A large-scale optical microscopy image dataset of potato tuber for deep learning based plant cell assessment
short_name: Potato tuber cell images (brightfield)
description: 15,938 brightfield microscopy images of potato tuber (Kufri Pukhraj) tissue sections, 9,811 unstained and 6,127 stained (safranin-O, toluidine blue-O, Lugol's iodine). Images carry physical (tuber weight), morphological (bud/middle/stem zone) and tissue (inner/outer core) labels encoded in file names, plus a segmentation folder of raw images with binary cell-boundary ground-truth masks for three tuber weights.
