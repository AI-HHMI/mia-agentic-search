notes: 'Single 37.5 GB .rar archive (Microscopy_image_dataset.rar); contents could not be listed with peek_archive (rar), so folder structure and formats come from the paper Data Records and Figshare description. Segmentation ground truth is generated by thresholding/morphological operations (rolling-ball pre-processing), not manual annotation; count of segmentation image pairs not stated. Authors, pixel size and microscope model not stated on Figshare record or in the paper text checked (images taken with a smartphone camera on a microscope eyepiece, per paper figure caption). Train/test splits are random 80/20 in the paper, not provided.'
