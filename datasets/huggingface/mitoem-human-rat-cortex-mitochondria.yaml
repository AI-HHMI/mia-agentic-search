schema_version: '1.1'
id: mitoem-human-rat-cortex-mitochondria
title: "MitoEM: large-scale 3D mitochondria instance segmentation in human and rat cortex EM volumes"
short_name: "MitoEM mitochondria instances (human+rat EM)"
description: >-
  Two (30 um)^3 multi-beam SEM volumes of cortex, MitoEM-H (adult human temporal lobe, layer II) and
  MitoEM-R (adult rat primary visual cortex, layer II/III), with dense 3D mitochondria instance
  segmentation (about 24.5k human and 14.4k rat instances). Labels cover the first 500 of 1000 slices
  (train slices 0-399, validation 400-499); the remaining 500 slices are the held-out challenge test set.
