notes: >-
  Labels are in pytc/MitoEM (EM30-H/R-mito-train-val-v2.zip, 500 TIFF slices each, checked with peek_archive);
  the raw images are in the companion repo pytc/EM30 (EM30-H-im-pad.zip ~23.9 GB, 1040 PNG slices padded;
  EM30-R-im.zip ~14.0 GB, 1000 PNG slices), also checked with peek_archive. size_bytes left null because the
  data spans two repos (labels ~122 MB + images ~38 GB). Modality is multi-beam SEM (paper Methods), which
  has no schema enum, hence 'other'. License 'MIT' comes from the Hugging Face metadata of pytc/MitoEM and
  pytc/EM30 (README front matter only, no LICENSE file). Test labels are withheld for the grand-challenge
  leaderboard. Paper full text is not open access via Europe PMC; Methods were read from the authors' PDF.
  Species/tissue and 8x8x30 nm resolution from paper Methods. The MitoEM 2.0 dataset (pytc/MitoEM2.0) is a
  separate resource and not covered here.
