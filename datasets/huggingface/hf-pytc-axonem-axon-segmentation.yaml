notes: 'Voxel size 8x8x30 nm is the human volume (AxonEM-H); the mouse volume (AxonEM-M) is 7x7x40 nm per the arXiv paper. Modality is serial-section EM (ssEM; TEM vs SEM not stated in the sources checked) so recorded as other. n_items = 18 HDF5 files in the human training zip (9 image + 9 label); the mouse zip was not listed but is described as nine subvolumes as well, and sizes are summed across both zips. Full image volumes (EM30-H/M-im-pad.zip, ~15-24 GB, PNG slices) are on pytc/EM30 without labels. Authors not listed on HF page; paper Methods were read via the arXiv HTML (Springer full text not open access). The MIT license is the HF card tag; the challenge page adds Grand Challenge terms of service. Only the H training zip contents were listed.'
