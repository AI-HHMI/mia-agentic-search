title: CellMap / COSEM eFIB-SEM organelle segmentation training data (OpenOrganelle)
description: Enhanced FIB-SEM volumes from Janelia's COSEM/CellMap projects with human-labelled
  voxel ground truth for many organelle classes (ER, mitochondria, plasma membrane,
  etc.), hosted on OpenOrganelle / AWS S3 and used as training data for the CellMap
  Segmentation Challenge (289 annotated training volumes, 22 eFIB-SEM datasets, ~80
  classes).
