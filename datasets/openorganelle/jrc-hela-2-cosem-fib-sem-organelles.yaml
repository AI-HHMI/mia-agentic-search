notes: 'Verified from the S3 bucket listing: jrc_hela-2.zarr/recon-1/labels/groundtruth contains 26 cropN groups, and crop1 metadata lists the class names; voxel size and dimensions come from n5/zarr attributes. CC-BY-4.0 is stated for the collection on the AWS registry page, not per dataset. Paper full text was not obtainable (Nature paywalled, bioRxiv returned 429, not in Europe PMC), so only the abstract was read: cell type/organism (HeLa, Homo sapiens), sample prep, train/val split and per-crop classes are inferred from the dataset name or not checked. The OpenOrganelle portal and figshare pages returned 404/403. size_bytes not determined. The bucket holds many other COSEM/CellMap datasets (jrc_cos7-*, jrc_ctl-id8-*, ...) that could become separate records.'
