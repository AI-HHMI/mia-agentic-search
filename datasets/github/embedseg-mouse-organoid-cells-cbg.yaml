notes: 'Zip lists 108 train/images and 108 train/masks TIFFs (peek_archive); no val/test folders in this archive. Voxel
  size (1.0, 0.1733, 0.1733 um as z,y,x), modality and image count taken from the arXiv preprint of the EmbedSeg paper;
  the journal paper is not open access and its full text was unavailable. Dataset-specific license not verified: the
  repo root LICENSE (main branch) is CC-BY-NC 4.0 but a release-page summary claimed CC-BY 4.0, so spdx left unknown.
  Annotation procedure and coverage not confirmed. Sibling datasets in the same release (Platynereis-Nuclei-CBG, Mouse-Skull-Nuclei-CBG,
  Platynereis-ISH-Nuclei-CBG) are not yet recorded. enricher: license still unknown (no LICENSE/README inside the zip;
  release page not readable this run; repo LICENSE is CC-BY-NC-4.0 for the code repo).'
