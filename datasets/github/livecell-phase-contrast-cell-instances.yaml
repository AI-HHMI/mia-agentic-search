notes: 'License CC BY-NC 4.0 is stated in the GitHub README. images.zip listed with peek_archive: 5239
  .tif files (~1.27 GB) in livecell_test_images and livecell_train_val_images per cell type; annotation
  JSONs are linked from the README but were not opened, so annotations_verified is false. Annotation coverage
  is partial because dense cell masses without visible boundaries were intentionally left unannotated
  (paper Methods). Annotated by a professional team (CloudFactory) with two QA rounds. Organisms inferred
  from cell-line names (human lines plus murine BV-2); the paper Methods text read does not list species.
  Paper also reports 1,686,352 annotated cells; images are 704x520 px crops at 10x. Pixel size in nm not
  stated in sources read. Also deposited at figshare 10.6084/m9.figshare.14931555 (not fetched).'
