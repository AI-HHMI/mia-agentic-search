short_name: Ni-superalloy & EBC micrographs (SEM)
description: Seven small benchmark semantic-segmentation tasks (Super1-4, Ni-based superalloy SEM images; EBC1-3, cross-sectional SEM of a SiC/SiC environmental barrier coating) released with the MicroNet
  pre-training paper. Each task has train/val/test image folders with matching annotation masks (TIFF); Super2-4 include extra out-of-distribution or different-condition test images. Designed for few-shot
  and one-shot transfer-learning evaluation.
