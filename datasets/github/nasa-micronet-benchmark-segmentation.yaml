notes: 'Modality: paper (NASA TM version) describes SEM images of Ni-superalloy and cross-sectional SEM of SiC/SiC EBC; no finer detector detail found, so modality=other. Pixel size not stated on repo page
  or the paper text checked. Annotation procedure/annotator not stated (source unknown). Classes: Super = matrix, secondary and tertiary precipitates; EBC = background, oxide, crack (README). Split counts
  (paper Table 1): Super-1 10/4/4, EBC-1 18/3/3; Super-2..4 and EBC-2..3 are reduced-train subsets, so n_items=120 image/mask pairs counts repeated images across task folders (unique labelled images about
  42 plus extra test images; 240 tif files in repo listing). Listing obtained via a full git clone (329 MB) that was deleted right away; size_bytes left null. Published version in npj Comput. Mater. was
  paywalled to the fetch tool; NTRS technical-memo version read instead. Restricted-access Zenodo 22039777 re-bundles these.'
