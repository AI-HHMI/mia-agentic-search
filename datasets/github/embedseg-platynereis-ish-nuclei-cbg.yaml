notes: 'CC-BY 4.0 is stated in the v0.1.0 GitHub release notes. Voxel size (about 0.45 um isotropic), modality, sample and DAPI labelling come from the arXiv preprint (2101.10033); the paper reports 22 volumes, but the release zip lists 6 TIFFs (3 image/mask pairs: X01/Y01 and X02_train/Y02_train in train, X02_test/Y02_test in test), listed with peek_archive and not extracted; the count difference is unexplained. Size is approximate (89.1 MB compressed per listing header). Annotation procedure not described in the sources read, so annotations.source is a best-fit guess. Publisher full text not read; publication date not checked.'
