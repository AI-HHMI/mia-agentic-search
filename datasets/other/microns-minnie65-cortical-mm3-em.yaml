notes: 'Also mirrored on AWS S3 (bossdb-open-data) and GCS. Imagery is 8x8x40 nm (downsampled from ~4 nm acquisition); the nominal 40 nm section thickness was used for z. Segmentation is automated (CNN affinities) with proofreading of a subset of neurons. Annotation layers were confirmed from the v117 manifest page, not by browsing the bucket listing, so annotations_verified is false. n_items and total size were not stated on the pages read (paper: ~2 PB raw). Publication date not checked.'
