description: In situ cryo-ET tomograms of Vibrio cholerae strains (five datasets, 843 tomograms) with expert-verified
  point annotations of bacterial flagellar motor centres, released as the test set of the Kaggle "BYU - Locating
  Bacterial Flagellar Motors 2025" competition. The matching training annotations (1,559 points) are in
  portal deposition CZCDP-10332 and the training tomograms are also on Kaggle as JPEG slice stacks.
