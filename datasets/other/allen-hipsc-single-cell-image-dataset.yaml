notes: 'Landing page is the AWS Open Data registry entry for the whole Allen Cell
  Imaging Collections; this record covers the package s3://allencell/aics/hipsc_single_cell_image_dataset
  (Quilt catalog page is a JS app, so contents were verified via the public S3 listing
  and README). Segmentations are algorithm-generated (Allen Cell & Structure Segmenter,
  deep-learning with Training Assay), not manual. Data license is the custom Allen
  Cell terms of use (research/noncommercial use, attribution); the paper itself is
  CC BY 4.0. Total size and per-image counts not stated (paper: 18,100 FOVs, 202,847
  interphase cells; metadata.csv is 1.7 GB). Channel count varies by cell line; not
  stated uniformly. Related Allen packages (edge/non-edge subsets, 12x overview, mitotic_annotation)
  not recorded separately. Checked README, S3 listing, terms of use, registry page
  and paper Methods.'
