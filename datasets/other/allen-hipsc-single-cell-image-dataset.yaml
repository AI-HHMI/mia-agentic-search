schema_version: '1.1'
id: allen-hipsc-single-cell-image-dataset
title: The WTC-11 hiPSC single-cell image dataset (Allen Institute for Cell Science)
short_name: hiPSC 3D cell/nuclei segmentation (spinning-disk)
description: 3D live-cell spinning-disk confocal z-stacks of gene-edited WTC-11 hiPSC
  colonies (25 FP-tagged cellular structures, plus DNA and membrane dyes), with cell/nuclear
  instance segmentations, per-structure segmentations and cropped single-cell raw/segmentation
  images (>200,000 cells), distributed as a public Quilt package on S3.
