notes: 'License per DeepCell docs is a "modified Apache license for non-commercial academic use only" (custom, no
  URL found). Access needs a free DeepCell API key. Split is 80/10/10 (train/val/test) per the paper; the docs list
  ~2,600 train 512x512 images (v1.1, April 2022, extra manual QC round). The portal is JavaScript-rendered and the
  file listing could not be read, so file names, total size and pixel size were not verified; the paper text and
  docs did not state pixel size in the parts read. Annotation source is human-in-the-loop (model-assisted
  crowdsourced plus expert QC), hence mixed. date_published is approximate (paper year 2022 / v1.1 April 2022).'
