schema_version: '1.1'
id: tissuenet-multiplexed-tissue-whole-cell
title: 'TissueNet: whole-cell and nuclear segmentation training dataset for multiplexed tissue images'
short_name: TissueNet tissue whole-cell segmentation
description: Paired 2D multiplexed tissue images and manually curated whole-cell and nuclear instance annotations
  (about 1.3 million whole-cell and 1.2 million nuclear labels) from six imaging platforms (CODEX, CyCIF, MIBI-TOF,
  Vectra, IMC, MxIF), nine organ types and three species, released to train the Mesmer segmentation model.
  Hosted at the DeepCell Datasets portal.
