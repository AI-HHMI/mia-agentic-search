schema_version: '1.1'
id: czcdp-10351-popsicle-yeast-cryoet
title: 'POPSICLE Yeast Segmentation Dataset: consolidated multi-class organelle segmentations for S. pombe
  cryo-ET tomograms'
short_name: S. pombe organelle segmentation (cryo-ET)
description: Manually curated semantic segmentations of six organelle classes (cytoplasm, nucleus, nuclear
  envelope, vesicle, membrane-enclosed lumen, mitochondrion) on 19 cryo-FIB lamella cryo-ET tomograms
  of Schizosaccharomyces pombe (15 train / 4 test in the POPSICLE benchmark). The tomograms themselves
  are hosted in CryoET Data Portal datasets DS-10000 and DS-10001; this deposition holds the 80 segmentation
  masks.
