description: Public test split of the experimental cryo-ET phantom (lysate spiked with six protein species) from the CZII CryoET Object Identification Challenge. 121 runs / 484 tomograms with hand-curated point annotations for apo-ferritin, beta-amylase, beta-galactosidase, cytosolic ribosomes, thyroglobulin and PP7 virus-like particles. Released February 2025 on the CryoET Data Portal.
