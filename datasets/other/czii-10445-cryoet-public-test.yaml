notes: "Public test split (121 runs, 484 tomograms, 8,335 annotations per portal page) of the phantom deposition CZCDP-10310; training split is DS-10440 (separate PR), private test is DS-10446. Voxel spacing not stated on the DS-10445 page (DS-10440 lists 1.0012 nm; paper gives 1.51 A raw pixel size), so left null. Organism left empty: sample is a mixed lysate plus purified proteins from several species. CC0 stated in paper (Fig. 2 legend) for datasets 10440/10441/10445/10446. Formats from paper Methods (OME-Zarr), not from a file listing. Authors not extracted from fetched pages. Sources checked: portal page, paper full text."
