title: Yeast in Microstructures instance segmentation dataset
short_name: Yeast cells in microfluidic traps (brightfield)
description: 493 densely annotated 128x128 brightfield microscopy images of budding yeast (Saccharomyces cerevisiae)
  growing in microfluidic trap structures, with pixel-wise instance masks, class labels and bounding boxes for yeast
  cells and trap microstructures. Split into train/validation/test; released with evaluation code (EMBC 2023). About
  9k unlabeled images from the same setup are published separately.
