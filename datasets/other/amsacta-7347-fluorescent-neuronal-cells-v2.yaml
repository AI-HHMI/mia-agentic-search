title: Fluorescent Neuronal Cells v2
short_name: Rodent brain neurons (widefield fluorescence)
description: '1,874 widefield fluorescence images of immunostained rodent (mouse and rat) brain slices in three
  collections (green, yellow, red), of which 750 have expert ground-truth annotations: binary masks, polygons, bounding
  boxes, dot annotations and count labels. 1,124 images are unlabelled. A random 75%/25% train-val/test split of
  the labelled images is provided.'
