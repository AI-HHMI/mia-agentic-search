schema_version: '1.1'
id: czcdp-10310-cryoet-phantom-particles
title: CZII experimental cryo-ET phantom dataset with ground-truth particle picks (CryoET Object Identification Challenge)
short_name: Cryo-ET phantom particle picking benchmark
description: Experimental cryo-ET phantom (HEK293T lysosome-enriched lysate mixed with five purified proteins/VLPs) with about 60,000 ground-truth 3D particle coordinates for six molecular species (80S ribosome, VLP, thyroglobulin, beta-galactosidase, apoferritin, beta-amylase). Deposition CZCDP-10310 splits the data into 7 training, 121 public-test and 364 private-test tomograms, plus 27 PolNet synthetic tomograms; it underlies the Kaggle CZII CryoET Object Identification challenge.
