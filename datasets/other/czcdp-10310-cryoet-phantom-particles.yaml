notes: 'Voxel size 1.51 A from paper Methods (tomograms may also be provided at binned voxel spacings). n_items = 7 train + 121 public test + 364 private test experimental tomograms (paper text); the 27 synthetic tomograms are extra. Portal deposition page lists 1,995 tomograms in total (multiple spacings/datasets), which was not reconciled. CC0 stated in paper Fig. 2 legend; portal deposition page did not display a license. Ground truth is acknowledged as incomplete by authors. Portal file listing not inspected (JS app), hence annotations_verified false. Private test labels may not be public.'
