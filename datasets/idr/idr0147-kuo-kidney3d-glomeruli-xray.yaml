title: HR-Kidney - terabyte-scale supervised 3D training and benchmarking dataset of the mouse kidney (SRuCT)
short_name: Mouse kidney glomeruli 3D (synchrotron X-ray)
description: Synchrotron radiation X-ray phase-contrast microtomography (SRuCT, ESRF ID19) of three whole vascular-resin-perfused mouse kidneys at 1.625 um pixel size. Includes raw radiographs, reconstructed 3D volumes, semi-automatic segmentations of vasculature, tubules and glomeruli, and, for Kidney_2, fully manual 3D annotations of glomeruli (3 ROIs of 512x256x256 voxels) and extrarenal fat (3 ROIs).
