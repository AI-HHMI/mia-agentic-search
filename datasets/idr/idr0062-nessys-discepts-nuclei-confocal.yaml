notes: 'Voxel size varies by subset (checked via IDR API): blastocysts 0.360x0.360x0.500 um, acini 0.238x0.238x0.500 um, E7.5 0.284x0.284x0.500 um, neural rosettes 0.230x0.230x0.500 um; so voxel_size_nm is null. 22 images in 5 datasets (Acini 3, Blastocysts 11, E75 3, E875 4, Neural 1); the whole-embryo 161202_E75.tif and Fused_E875.ics have no manual segmentation, so about 20 images carry masks. Compressed size not stated on the IDR pages checked. Only some IDR image files were inspected for ROIs (6001240 has Mask ROIs). Paper also provides classifier training sets as supplementary data; some images are derived crops of larger ones.'
