description: 'DISCEPTS (Differentiating Stem Cells & Embryos are a Pain To Segment): 3D confocal images of LaminB1/DAPI-stained
  nuclei in mouse blastocysts, E7.5 and E8.75 embryos, ES-cell acini and neural rosettes, with thousands of manually
  segmented nuclei (mask ROIs in IDR) for benchmarking 3D nuclear segmentation.'
