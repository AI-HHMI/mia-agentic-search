notes: 'Voxel size (0.830 x 0.830 x 1.2 um) is from IDR image metadata of Myelin Image 1, taken as representative of the five samples. Image 1 is 8346x2253x47, 3 channels. Also mirrored as BioImage Archive S-BIAD493, which lists per-sample Axon, Nucleus, Oligodendrocyte and Ground_Truth TIFFs (23 files incl. 20 TIFFs, ~15 GB total); the size counts all of them. IDR itself hosts the 5 image sets, and the ground-truth TIFFs are listed as processed data. Paper full text is not open access on Europe PMC, so only the abstract was read; microscope and objective are not stated in the IDR study file. Annotation is dense binary myelin ground truth; no train/test split is provided.'
