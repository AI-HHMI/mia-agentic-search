notes: 'Zip index read with peek_archive: sequences 01 and 02, each 30 volumes, GT/SEG 15 masks, GT/TRA
  31 files (incl. man_track.txt), ST/SEG 30 masks and ERR_SEG 30. Voxel size and sample from the CTC 3D
  dataset table; the dataset page states the microscope as PerkinElmer UltraVIEW ERS but not the modality,
  so modality is recorded as fluorescence-other. The paper describes it as densely annotated. Terms are
  custom: CTC-related use needs no consent, non-CTC scientific use requires organizer permission, commercial
  use needs organizer and data-provider permission, cloning is prohibited, and the Nature Methods paper
  must be cited. Test set annotations are secret. Size is the training zip (244 MB per the dataset table).
  Well-known benchmark; confidence kept moderate given the permission-based terms.'
