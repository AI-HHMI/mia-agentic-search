  tracking annotations'
short_name: HeLa cell segmentation and tracking (DIC)
description: Two 84-frame DIC time-lapse sequences of HeLa cells on a flat glass substrate (Zeiss LSM
  510 Meta, 0.19 um pixels, 10 min interval) from the Cell Tracking Challenge training set. Each sequence
  has sparse manual gold-truth segmentation (9 frames), gold-truth tracking markers for all frames, and
  computer-generated silver-truth segmentation for all frames.
