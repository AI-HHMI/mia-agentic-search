name: auto-merge
# Merges dataset PRs that meet the policy in tools/automerge.py (enriched, 3D, < 500 GB,
# allow-listed license, known formats, validate passed). Report-only until the repository
# variable AUTO_MERGE is set to "true" (Settings → Secrets and variables → Actions → Variables).
on:
  workflow_run:            # after labels were recomputed for a push
    workflows: [label-agent-prs]
    types: [completed]
  schedule:
    - cron: "45 * * * *"   # hourly sweep
  workflow_dispatch:
permissions:
  contents: write          # merge + delete the merged branch
  pull-requests: write
  actions: write           # trigger the dashboard rebuild
concurrency: { group: auto-merge, cancel-in-progress: false }
jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      # Always main's policy code; PR records are only read with `git show`, never executed.
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/automerge.py ${{ vars.AUTO_MERGE == 'true' && '--merge' || '' }}
