name: watchdog
on:
  schedule:
    - cron: "40 */2 * * *"   # every 2 hours
  workflow_dispatch:
permissions:
  contents: write   # state/watchdog.json on the state branch
concurrency: { group: watchdog, cancel-in-progress: false }
jobs:
  watchdog:
    if: vars.PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: git fetch --no-tags origin '+refs/heads/state:refs/remotes/origin/state' || true
      - run: python tools/watchdog.py   # posts to Slack only when the alerts changed
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/publish.py state-push --routine watchdog
