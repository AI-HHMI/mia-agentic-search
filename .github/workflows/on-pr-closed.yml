name: delete-closed-dataset-branch
# A leftover claude/dataset/* branch makes dedup report the dataset as "pending" forever, so delete it once
# its PR is merged or closed (GitHub keeps the PR's commits as refs/pull/<n>/head either way; a closed PR's
# record counts as rejected from there, tools/common.py:load_rejected).
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  delete-branch:
    if: startsWith(github.event.pull_request.head.ref, 'claude/dataset/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" || true
