name: label-agent-prs
# Agents can't reliably add labels themselves, so label their PRs here:
# by branch name (new-datasets / maintenance) and, for dataset PRs, from the record's fields
# (dim:, org:, fmt:, dtype:, license:, size:, download-ready, ... see tools/labels.py).
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:   # relabel every open and merged dataset PR, e.g. after changing tools/labels.py
  push:                # a record on main changed (e.g. a voxel size was filled in): relabel the merged PRs
    branches: [main]
    paths: ['datasets/**', 'tools/labels.py']
permissions:
  contents: read
  pull-requests: write
  issues: write        # creating missing labels
concurrency:
  group: labels-${{ github.event.pull_request.number || github.event_name }}   # a push to main must not cancel a full relabel
  cancel-in-progress: true
jobs:
  label:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'synchronize' &&
      (startsWith(github.head_ref, 'claude/dataset/') || startsWith(github.head_ref, 'claude/maintainer'))
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ startsWith(github.head_ref, 'claude/dataset/') && 'new-datasets' || 'maintenance' }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "$LABEL"
  record-labels:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      startsWith(github.head_ref, 'claude/dataset/')
    runs-on: ubuntu-latest
    steps:
      # Run main's tools/labels.py; the PR's record is only read with `git show`, never executed.
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: TensorSwitch record planner (for the download-ready label)
        run: |
          git clone -q --depth 1 -b unified https://github.com/JaneliaSciComp/tensorswitch "$RUNNER_TEMP/tensorswitch"
          echo "TENSORSWITCH_SRC=$RUNNER_TEMP/tensorswitch/src" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) python tools/labels.py sync --all-open && python tools/labels.py sync --merged ;;
            push) python tools/labels.py sync --merged ;;
            *) python tools/labels.py sync --pr ${{ github.event.pull_request.number }} ;;
          esac
