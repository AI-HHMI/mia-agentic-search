name: dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *"   # hourly, so unmerged harvest runs on claude/* branches show up
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read   # the "not merged" table on the dashboard
  checks: read
  statuses: read
  actions: read         # gh reads the workflow run behind each check
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: git fetch --no-tags origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' || true
      - run: python tools/build_site.py --out site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
